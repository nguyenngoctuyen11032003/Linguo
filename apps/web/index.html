<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Linguo — Học tiếng Anh & tiếng Hàn thông minh</title>
    <meta
      name="description"
      content="Lộ trình tiếng Anh và tiếng Hàn cá nhân hoá cho người Việt: nhớ lại chủ động, ôn tập ngắt quãng, phản hồi có giải thích."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b12" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%BASE_URL%brand/logo-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap"
    />
    <!-- Boot splash + loader styles: a render-blocking file because the CSP allows no inline style element. -->
    <link rel="stylesheet" href="/src/components/feedback/feedback.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Pretendard (Korean) loads without blocking render: appended by the inline script below, since the
         CSP (injected at build, apps/web/build/csp.ts) allows no inline event handlers such as onload. -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('linguo-theme');
          if (p !== 'light' && p !== 'dark' && p !== 'system') p = 'system';
          var dark = p === 'dark' || ((!p || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (p !== 'system') {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].content = dark ? '#070b12' : '#f3f1ec';
          }
          var st = localStorage.getItem('linguo-style');
          if (st === 'glass' || st === 'warm') document.documentElement.dataset.style = st;
          if (localStorage.getItem('linguo-reduce-motion') === 'true') document.documentElement.dataset.reduceMotion = 'true';
        } catch (e) {}
        var font = document.createElement('link');
        font.rel = 'stylesheet';
        font.href = 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css';
        document.head.appendChild(font);
      })();
    </script>
  </head>
  <body>
    <!-- Boot splash: painted before any script runs and replaced by React on mount. Same markup and classes as
         FullScreenLoader (src/components/feedback/BootVisual.tsx), styled by feedback.css, so the handoff is seamless. -->
    <div id="root">
      <div role="status" class="lg-boot">
        <div class="lg-boot__stage">
          <div class="lg-boot__brand" aria-hidden="true">
            <svg class="lg-boot__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <path d="M32 5C17.1 5 5 15.9 5 29.3c0 7.6 3.9 14.4 10 18.9L12.6 58l11.6-6.3c2.5.6 5.1.9 7.8.9 14.9 0 27-10.9 27-24.3S46.9 5 32 5Z" fill="#4CA2D1" />
              <path d="M27.5 16.5c2.6-2.6 6.3-1.6 6.1 2.2-.3 5.2-6.4 10.4-7.6 17.4-.6 3.3.9 5.4 4.2 5.4h12.3" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M42.5 41.5c4.3 0 7.8 2.6 9.5 6.5 1 2.3 3 3.8 5.5 4" fill="none" stroke="#F37D25" stroke-width="4.2" stroke-linecap="round" />
              <path d="M47 13.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="#fff" />
            </svg>
            <span class="lg-boot__word">Linguo<span>.</span></span>
            <svg class="lg-boot__route" viewBox="0 0 168 36" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="lg-boot-grad" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" class="lg-boot__stop-1" />
                  <stop offset="1" class="lg-boot__stop-2" />
                </linearGradient>
              </defs>
              <path class="lg-boot__track" d="M10 26C40 26 52 10 84 10S128 26 158 26" pathLength="100" />
              <path class="lg-boot__progress" d="M10 26C40 26 52 10 84 10S128 26 158 26" pathLength="100" stroke="url(#lg-boot-grad)" />
              <path class="lg-boot__head-glow" d="M10 26C40 26 52 10 84 10S128 26 158 26" pathLength="100" />
              <path class="lg-boot__head" d="M10 26C40 26 52 10 84 10S128 26 158 26" pathLength="100" />
              <circle class="lg-boot__node lg-boot__node--1" cx="10" cy="26" r="4" />
              <circle class="lg-boot__node lg-boot__node--2" cx="84" cy="10" r="4" />
              <circle class="lg-boot__node lg-boot__node--3" cx="158" cy="26" r="4" />
            </svg>
          </div>
          <p class="lg-boot__label">Đang tải…</p>
          <p class="lg-boot__tip" aria-hidden="true"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
