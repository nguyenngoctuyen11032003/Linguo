      vi: "“まだ道半ばだと言わざるを得ない” — không thể không nói rằng mới đi được nửa chặng. Số nhà trẻ đã tăng (増えた) nhưng nhiều gia đình vẫn chưa vào được, nên chưa thể gọi là hoàn thiện."
  - key: ja:diag:read-n1-dentou
    level: n1
    item_type: reading_mcq
    prompt:
      passage: "「伝統」とは、過去をそのまま保存することではない。むしろ、時代の要請に応じて形を変えながら、核となる精神を受け継いでいく営みである。形だけを守ろうとして精神を見失えば、伝統はかえって形骸化してしまう。"
      stem: Người viết cho rằng “truyền thống” là gì?
      stem_lang: vi
      options:
        - { id: a, text: Việc bảo tồn nguyên vẹn quá khứ, lang: vi }
        - { id: b, text: Việc chỉ giữ hình thức cũ, lang: vi }
        - { id: c, text: Việc bỏ hết quá khứ để theo thời đại, lang: vi }
        - { id: d, text: Việc kế thừa tinh thần cốt lõi trong khi thay đổi hình thức theo thời đại, lang: vi }
    answer: d
    explanation:
      vi: "“むしろ” (trái lại) dẫn tới định nghĩa: “時代の要請に応じて形を変えながら、核となる精神を受け継いでいく営み”. a bị phủ nhận ngay ở câu đầu; b dẫn đến “形骸化” (hình thức hoá); c không được người viết nói đến."
  - key: ja:diag:read-n1-gijutsu
    level: n1
    item_type: reading_mcq
    prompt:
      passage: "科学技術の進歩は、私たちの生活を豊かにしてきた。だが、技術が可能にすることと、社会が許容すべきこととは別問題である。遺伝子の操作がその典型であり、できるからやるという発想では、取り返しのつかない結果を招きかねない。"
      stem: Người viết chủ trương điều gì?
      stem_lang: vi
      options:
        - { id: a, text: Phải làm mọi điều khi công nghệ cho phép, lang: vi }
        - { id: b, text: Cần cấm hoàn toàn mọi tiến bộ khoa học, lang: vi }
        - { id: c, text: Điều có thể làm về công nghệ và điều xã hội nên chấp nhận là hai vấn đề riêng cần cân nhắc, lang: vi }
        - { id: d, text: Thao tác gen không có rủi ro gì, lang: vi }
    answer: c
    explanation:
      vi: "“技術が可能にすることと、社会が許容すべきこととは別問題である” là luận điểm chính; ví dụ thao tác gen cho thấy tư duy “できるからやる” có thể gây hậu quả không thể cứu vãn. Người viết vẫn thừa nhận khoa học làm cuộc sống phong phú hơn nên b sai."
  - key: ja:diag:read-n1-shokunin
    level: n1
    item_type: reading_mcq
    prompt:
      passage: "一流の職人は、道具を選ぶ前にまず素材を見る。素材の性質を読み取れなければ、どれほど優れた道具も宝の持ち腐れになるからだ。この姿勢は、情報があふれる現代の私たちにも示唆を与える。ツールの使い方を覚える以前に、扱う対象の本質を見極める目を養うべきではないか。"
      stem: Điều người viết muốn nhấn mạnh là gì?
      stem_lang: vi
      options:
        - { id: a, text: Cần mua dụng cụ tốt nhất trước tiên, lang: vi }
        - { id: b, text: Cần rèn con mắt nhìn ra bản chất của đối tượng trước cả cách dùng công cụ, lang: vi }
        - { id: c, text: Thợ thủ công giỏi không cần dụng cụ, lang: vi }
        - { id: d, text: Thông tin càng nhiều càng tốt, lang: vi }
    answer: b
    explanation:
      vi: "Câu cuối là kết luận (câu hỏi tu từ): “ツールの使い方を覚える以前に、扱う対象の本質を見極める目を養うべき”. Thợ giỏi vẫn dùng dụng cụ nhưng nhìn nguyên liệu trước, nên c sai; a và d trái với ý “không đọc được nguyên liệu thì dụng cụ tốt cũng phí”."
