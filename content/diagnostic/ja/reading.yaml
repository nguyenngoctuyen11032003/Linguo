        - { id: c, text: Để giữ hương vị và mùi thơm của cà phê, lang: vi }
        - { id: d, text: Vì khách yêu cầu giảm giá, lang: vi }
    answer: c
    explanation:
      vi: "Chủ quán nói có cách nhanh hơn nhưng “それでは味が落ちる” (như vậy thì hương vị giảm), và khách quen đến vì mùi thơm của cà phê vừa xay. Hiệu quả (a, b) chính là điều ông không ưu tiên."
  - key: ja:diag:read-n2-kosodate
    level: n2
    item_type: reading_mcq
    prompt:
      passage: "近年、都市部では公園が減り、子どもが自由に遊べる場所が少なくなっている。一方、保育所の数は増えたものの、希望しても入れない家庭がなお多い。子育てを支える環境の整備は、まだ道半ばだと言わざるを得ない。"
      stem: Người viết đánh giá việc xây dựng môi trường hỗ trợ nuôi dạy con như thế nào?
      stem_lang: vi
      options:
        - { id: a, text: Đã hoàn thiện, lang: vi }
        - { id: b, text: "Mới đi được nửa đường, vẫn chưa đủ", lang: vi }
        - { id: c, text: Không cần thiết nữa, lang: vi }
        - { id: d, text: Đã thụt lùi so với trước, lang: vi }
    answer: b
