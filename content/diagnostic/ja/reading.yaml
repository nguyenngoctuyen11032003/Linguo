        - { id: b, text: Quên chuyện thất bại, lang: vi }
        - { id: c, text: Xem lại cách kiểm tra để không lặp lại lỗi, lang: vi }
        - { id: d, text: Nhờ đồng nghiệp làm thay, lang: vi }
    answer: c
    explanation:
      vi: "“同じ失敗を繰り返さないよう、確認の方法を見直した” — để không lặp lại lỗi, anh xem lại cách kiểm tra. “かえって責任を感じ” cho thấy anh càng thấy có trách nhiệm, không phải quên chuyện đó."
  - key: ja:diag:read-n3-elevator
    level: n3
    item_type: reading_mcq
    prompt:
      passage: "来週の月曜日は、設備の点検のため、午前中はエレベーターが使えません。階段をご利用ください。なお、荷物の搬入は午後にお願いします。"
      stem: Người chuyển hàng nên làm thế nào vào thứ Hai tuần sau?
