    answer: a
    explanation:
      vi: "“荷物の搬入は午後にお願いします” — nhờ đưa hàng vào buổi chiều, vì buổi sáng thang máy không dùng được do kiểm tra thiết bị."
  - key: ja:diag:read-n2-sns
    level: n2
    item_type: reading_mcq
    prompt:
      passage: "SNSでは、短く刺激的な言葉ほど拡散されやすい。そのため、慎重に言葉を選んだ長い文章は、読まれないまま埋もれてしまうことが多い。だが、物事の複雑さを伝えるには、時間をかけた説明が欠かせない。"
      stem: Người viết muốn nói điều gì?
      stem_lang: vi
      options:
        - { id: a, text: Nên chỉ viết những câu ngắn và gây chú ý, lang: vi }
        - { id: b, text: Để truyền đạt sự phức tạp của sự việc cần có lời giải thích dành thời gian, lang: vi }
        - { id: c, text: Không nên dùng mạng xã hội, lang: vi }
        - { id: d, text: Văn bản dài luôn được nhiều người đọc, lang: vi }
    answer: b
    explanation:
      vi: "Câu cuối nêu chủ ý sau “だが”: “物事の複雑さを伝えるには、時間をかけた説明が欠かせない”. Người viết thừa nhận lời ngắn dễ lan truyền nhưng không cho rằng chỉ nên viết ngắn."
  - key: ja:diag:read-n2-coffee
    level: n2
    item_type: reading_mcq
    prompt:
      passage: "この店では、客の注文を聞いてから豆を挽くことにしている。手間はかかるが、挽きたての香りは格別で、常連客はそれを楽しみに通ってくる。店主は「効率を考えれば、もっと楽な方法はある。しかし、それでは味が落ちる」と話す。"
      stem: Vì sao chủ quán chấp nhận tốn công?
      stem_lang: vi
      options:
        - { id: a, text: Để phục vụ khách nhanh hơn, lang: vi }
