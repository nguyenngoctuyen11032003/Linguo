      stem: Mẹ của người viết làm nghề gì?
      stem_lang: vi
      options:
        - { id: a, text: Giáo viên, lang: vi }
        - { id: b, text: Nhân viên công ty, lang: vi }
        - { id: c, text: Học sinh, lang: vi }
        - { id: d, text: Bác sĩ, lang: vi }
    answer: a
    explanation:
      vi: "“母は 先生です” — mẹ là giáo viên. “会社員” (nhân viên công ty) là nghề của bố."
  - key: ja:diag:read-n5-ame
    level: n5
    item_type: reading_mcq
    prompt:
      passage: "きのうは 雨でした。だから、どこへも 行きませんでした。うちで 本を 読みました。"
      stem: Hôm qua người viết đã làm gì?
      stem_lang: vi
      options:
        - { id: a, text: Đi đến thư viện, lang: vi }
        - { id: b, text: Ở nhà đọc sách, lang: vi }
        - { id: c, text: Đi xem phim, lang: vi }
        - { id: d, text: Đi mua sắm, lang: vi }
    answer: b
    explanation:
      vi: "Vì trời mưa nên “どこへも 行きませんでした” (không đi đâu cả) và “うちで 本を 読みました” (ở nhà đọc sách)."
  - key: ja:diag:read-n5-restaurant
    level: n5
    item_type: reading_mcq
    prompt:
      passage: "この レストランは 安いです。そして、おいしいです。でも、とても 小さいですから、いつも 人が 多いです。"
      stem: Điểm bất tiện của nhà hàng này là gì?
      stem_lang: vi
      options:
        - { id: a, text: Giá đắt, lang: vi }
        - { id: b, text: Đồ ăn dở, lang: vi }
        - { id: c, text: Quán nhỏ nên lúc nào cũng đông, lang: vi }
        - { id: d, text: Quán ở xa ga, lang: vi }
    answer: c
    explanation:
      vi: "Sau “でも” (nhưng) là điểm bất tiện: “とても 小さいですから、いつも 人が 多いです” (rất nhỏ nên lúc nào cũng đông). Giá rẻ (安い) và ngon (おいしい) là ưu điểm."
  - key: ja:diag:read-n4-memo
    level: n4
    item_type: reading_mcq
    prompt:
      passage: "田中さんへ。今日は 会社を 休みます。きのうの 夜から ねつが 出て、病院へ 行って きます。会議の 資料は 机の 上に 置いて あります。山本さんに わたして ください。"
      stem: Người viết nhờ Tanaka làm gì?
      stem_lang: vi
      options:
        - { id: a, text: Đưa tài liệu họp cho Yamamoto, lang: vi }
        - { id: b, text: Đưa người viết đến bệnh viện, lang: vi }
        - { id: c, text: Làm tài liệu họp mới, lang: vi }
        - { id: d, text: Hoãn cuộc họp, lang: vi }
    answer: a
    explanation:
      vi: "Tài liệu đã được đặt sẵn trên bàn (置いてあります) và người viết nhờ “山本さんに わたして ください” (hãy đưa cho Yamamoto). Việc đi bệnh viện là của người viết."
  - key: ja:diag:read-n4-nihongo
    level: n4
    item_type: reading_mcq
    prompt:
      passage: "私は 日本語を 勉強して 三年に なります。最初は ひらがなも 読めませんでしたが、今は 日本語の 新聞が 少し 読めます。でも、話すのは まだ むずかしいです。"
      stem: Hiện nay người viết thấy việc gì còn khó?
      stem_lang: vi
      options:
        - { id: a, text: Đọc hiragana, lang: vi }
        - { id: b, text: Đọc báo tiếng Nhật, lang: vi }
        - { id: c, text: Nói tiếng Nhật, lang: vi }
        - { id: d, text: Nghe tin tức, lang: vi }
    answer: c
    explanation:
      vi: "“話すのは まだ むずかしいです” — nói vẫn còn khó. Hiragana đã đọc được từ lâu, và báo tiếng Nhật thì “少し 読めます” (đọc được một chút)."
  - key: ja:diag:read-n4-hokkaido
    level: n4
    item_type: reading_mcq
    prompt:
      passage: "夏休みに 家族と 北海道へ 行く つもりです。飛行機の 切符は もう 買って ありますが、ホテルは まだ 予約して いません。来週、インターネットで さがします。"
      stem: Người viết chưa làm việc gì?
      stem_lang: vi
      options:
        - { id: a, text: Mua vé máy bay, lang: vi }
        - { id: b, text: Đặt khách sạn, lang: vi }
        - { id: c, text: Nói với gia đình, lang: vi }
        - { id: d, text: Quyết định điểm đến của chuyến đi, lang: vi }
    answer: b
    explanation:
      vi: "“ホテルは まだ 予約して いません” — chưa đặt khách sạn. Vé máy bay đã mua (買って あります), và điểm đến (北海道) đã được quyết định (行くつもりです)."
  - key: ja:diag:read-n3-denshi
    level: n3
    item_type: reading_mcq
    prompt:
      passage: "最近、電子書籍を読む人が増えている。持ち運びが楽で、文字の大きさも変えられるからだ。一方で、紙の本のほうが目が疲れにくいと感じる人も多い。"
      stem: Điều nào đúng theo đoạn văn?
      stem_lang: vi
      options:
        - { id: a, text: Sách điện tử khó mang theo hơn sách giấy, lang: vi }
        - { id: b, text: Nhiều người thấy sách giấy ít làm mỏi mắt hơn, lang: vi }
        - { id: c, text: Số người đọc sách điện tử đang giảm, lang: vi }
        - { id: d, text: Không thể đổi cỡ chữ của sách điện tử, lang: vi }
    answer: b
    explanation:
      vi: "Sau “一方で” (mặt khác): “紙の本のほうが目が疲れにくいと感じる人も多い”. Các phương án còn lại đều trái nội dung: sách điện tử dễ mang (持ち運びが楽), cỡ chữ đổi được, và người đọc đang tăng."
  - key: ja:diag:read-n3-shippai
    level: n3
    item_type: reading_mcq
    prompt:
      passage: "山田さんは、仕事で失敗してしまったが、上司は怒らず、「次に生かせばいい」と言ってくれた。山田さんはそれを聞いて、かえって責任を感じ、同じ失敗を繰り返さないよう、確認の方法を見直した。"
      stem: Sau khi nghe lời của cấp trên, Yamada đã làm gì?
      stem_lang: vi
      options:
