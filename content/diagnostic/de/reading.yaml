      passage: "Sehr geehrte Damen und Herren,\nam 3. Mai habe ich in Ihrem Onlineshop einen Rucksack bestellt (Bestellnummer 48213). Geliefert wurde jedoch ein roter Rucksack statt eines blauen. Da der Rucksack ein Geschenk ist und es unbedingt der blaue sein soll, möchte ich ihn umtauschen. Eine Rückerstattung des Kaufpreises wünsche ich nicht. Bitte teilen Sie mir mit, wie ich vorgehen soll.\nMit freundlichen Grüßen\nLukas Brandt"
      stem: Lukas Brandt muốn cửa hàng trực tuyến làm gì?
