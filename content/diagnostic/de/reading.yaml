    difficulty: 3.6
    prompt:
      passage: "So entkalken Sie Ihre Kaffeemaschine:\n1. Füllen Sie den Wassertank mit einem halben Liter Wasser und geben Sie eine Packung Entkalker dazu.\n2. Stellen Sie ein großes Gefäß unter den Auslauf.\n3. Halten Sie die Taste „Reinigung“ drei Sekunden lang gedrückt. Das Programm dauert etwa 20 Minuten.\n4. Spülen Sie anschließend den Wassertank gründlich aus und lassen Sie die Maschine zweimal mit klarem Wasser durchlaufen, bevor Sie wieder Kaffee zubereiten.\nWichtig: Schalten Sie das Gerät während des Programms nicht aus!"
      stem: Sau khi chương trình tẩy cặn kết thúc, phải làm gì trước khi pha cà phê lại?
      stem_lang: vi
      options:
        - { id: a, text: "Cho thêm một gói chất tẩy cặn rồi chạy lại chương trình", lang: vi }
        - { id: b, text: "Tắt máy và đợi 20 phút", lang: vi }
        - { id: c, text: "Giữ nút „Reinigung“ thêm ba giây", lang: vi }
        - { id: d, text: "Rửa kỹ bình nước và cho máy chạy hai lần với nước sạch", lang: vi }
    answer: d
    explanation:
      vi: "Bước 4: “Spülen Sie anschließend den Wassertank gründlich aus und lassen Sie die Maschine zweimal mit klarem Wasser durchlaufen, bevor Sie wieder Kaffee zubereiten” — rửa kỹ bình nước rồi cho máy chạy hai lần với nước sạch. Chất tẩy cặn (“Entkalker”) chỉ cho vào ở bước 1, 20 phút là thời gian chạy chương trình, và lưu ý cuối cùng dặn không được tắt máy (“nicht aus”) khi chương trình đang chạy."
  - key: de:diag:rea-b1-exchange-letter
