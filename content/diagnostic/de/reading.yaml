  - key: de:diag:rea-b2-secondhand-report
    level: b2
    item_type: reading_mcq
    difficulty: 4.2
    prompt:
      passage: "Immer mehr Menschen in Deutschland kaufen gebrauchte Kleidung. Einer aktuellen Umfrage zufolge hat fast jeder zweite Befragte im vergangenen Jahr mindestens ein Kleidungsstück aus zweiter Hand erworben; vor fünf Jahren war es noch knapp ein Viertel. Besonders beliebt ist Secondhandmode bei den 18- bis 29-Jährigen, die vor allem Onlineplattformen nutzen. Als wichtigsten Grund nennen die meisten allerdings nicht den Umweltschutz, sondern die niedrigeren Preise; ökologische Motive folgen erst an zweiter Stelle. Ältere Befragte kaufen dagegen häufiger in klassischen Secondhandläden und legen Wert darauf, die Ware vor dem Kauf anfassen zu können. Der Handel mit Neuware beobachtet den Trend mit gemischten Gefühlen; einige Ketten bieten inzwischen eigene Rücknahme- und Wiederverkaufsprogramme an."
      stem: Theo bài báo, phần lớn người mua quần áo cũ làm vậy chủ yếu vì lý do gì?
      stem_lang: vi
      options:
        - { id: a, text: "Vì muốn bảo vệ môi trường", lang: vi }
        - { id: b, text: "Vì giá rẻ hơn", lang: vi }
        - { id: c, text: "Vì có thể sờ thử hàng trước khi mua", lang: vi }
        - { id: d, text: "Vì các chuỗi cửa hàng có chương trình thu mua lại", lang: vi }
    answer: b
    explanation:
      vi: "“Als wichtigsten Grund nennen die meisten allerdings nicht den Umweltschutz, sondern die niedrigeren Preise” — cấu trúc “nicht …, sondern …” cho thấy lý do chính là giá thấp hơn; lý do môi trường chỉ “erst an zweiter Stelle” (mới đứng thứ hai). Việc muốn sờ hàng trước khi mua là đặc điểm của người lớn tuổi, còn chương trình thu mua lại là phản ứng của các chuỗi bán hàng mới."
  - key: de:diag:rea-b2-heating-letter
    level: b2
    item_type: reading_mcq
    difficulty: 4.35
    prompt:
      passage: "Sehr geehrte Frau Albers,\nleider muss ich Ihnen mitteilen, dass die Heizung in meiner Wohnung (Lindenstraße 14, 3. OG links) seit dem 2. November erneut ausgefallen ist. Bereits im Oktober hatte ich den Schaden telefonisch gemeldet; der damals beauftragte Techniker konnte das Problem jedoch nur vorübergehend beheben. Da die Raumtemperatur inzwischen unter 16 Grad liegt, ist ein normales Wohnen kaum noch möglich.\nIch bitte Sie daher, die Reparatur bis spätestens zum 15. November zu veranlassen. Andernfalls behalte ich mir vor, die Miete für die Dauer des Mangels angemessen zu mindern.\nFür Rückfragen bin ich werktags ab 17 Uhr unter 0221 447 8213 erreichbar.\nMit freundlichen Grüßen\nJan Petersen"
      stem: Có thể suy ra điều gì từ bức thư của Jan Petersen?
      stem_lang: vi
      options:
        - { id: a, text: "Lò sưởi từng hỏng trước đây và lần sửa trước không triệt để", lang: vi }
        - { id: b, text: "Jan Petersen đã tự ý giảm tiền thuê nhà", lang: vi }
        - { id: c, text: "Chưa có kỹ thuật viên nào đến xem lò sưởi", lang: vi }
        - { id: d, text: "Jan Petersen muốn chuyển sang một căn hộ khác", lang: vi }
    answer: a
    explanation:
      vi: "“erneut ausgefallen” (lại hỏng lần nữa) và “der damals beauftragte Techniker konnte das Problem jedoch nur vorübergehend beheben” (kỹ thuật viên lần trước chỉ khắc phục tạm thời) cho thấy đây là sự cố lặp lại. Việc giảm tiền thuê chỉ là điều ông “behalte ich mir vor” — bảo lưu quyền làm nếu lò sưởi không được sửa trước ngày 15/11, chứ chưa thực hiện."
  - key: de:diag:rea-b2-smartphone-ban
    level: b2
    item_type: reading_mcq
    difficulty: 4.5
    prompt:
      passage: "Kaum ein Thema erhitzt derzeit die Gemüter von Eltern so sehr wie die Frage, ob Smartphones an Schulen verboten werden sollten. Befürworter verweisen auf Studien, nach denen sich Schülerinnen und Schüler ohne Handy besser konzentrieren und in den Pausen wieder miteinander reden. Das klingt überzeugend, greift aber zu kurz. Ein Verbot mag die ständigen Benachrichtigungen für einige Stunden zum Schweigen bringen – den bewussten Umgang mit dem Gerät lernt dadurch niemand. Spätestens nach Schulschluss sind die Jugendlichen mit ihren Bildschirmen wieder allein. Sinnvoller wäre es, Medienkompetenz zu einem festen Bestandteil des Unterrichts zu machen: Wer versteht, wie Apps um Aufmerksamkeit buhlen, kann sich ihnen auch besser entziehen. Schulen, die das Handy einfach aus dem Klassenzimmer verbannen, machen es sich zu leicht."
      stem: Quan điểm của tác giả về việc cấm điện thoại thông minh ở trường học là gì?
      stem_lang: vi
      options:
        - { id: a, text: "Ủng hộ lệnh cấm vì nghiên cứu cho thấy học sinh tập trung tốt hơn", lang: vi }
        - { id: b, text: "Học sinh nên được tự do dùng điện thoại cả trong giờ học", lang: vi }
        - { id: c, text: "Đây là trách nhiệm của phụ huynh, không phải của nhà trường", lang: vi }
        - { id: d, text: "Chỉ cấm là chưa đủ; nhà trường nên dạy học sinh cách dùng điện thoại có ý thức", lang: vi }
    answer: d
    explanation:
      vi: "Tác giả thừa nhận lập luận của phe ủng hộ lệnh cấm “klingt überzeugend” (nghe thuyết phục) nhưng ngay sau đó nói “greift aber zu kurz” (chưa giải quyết tận gốc). Đề xuất của tác giả là “Sinnvoller wäre es, Medienkompetenz zu einem festen Bestandteil des Unterrichts zu machen” — đưa kỹ năng sử dụng truyền thông vào giờ học. Câu cuối “machen es sich zu leicht” phê phán các trường chỉ cấm cho xong, chứ không đòi bỏ mọi quy định hay đẩy việc sang phụ huynh."
  - key: de:diag:rea-b2-powernap
    level: b2
    item_type: reading_mcq
    difficulty: 4.6
    prompt:
      passage: "Lange galt das Nickerchen am Arbeitsplatz hierzulande als Zeichen mangelnder Arbeitsmoral. Inzwischen richten jedoch immer mehr Unternehmen Ruheräume ein, in denen sich Beschäftigte für eine Viertelstunde hinlegen können. Schlafforscher begrüßen diese Entwicklung grundsätzlich, warnen aber vor zu langen Pausen: Wer länger als etwa 30 Minuten schläft, gerät in den Tiefschlaf und fühlt sich danach oft benommener als zuvor. Ideal seien zehn bis zwanzig Minuten, am besten am frühen Nachmittag. Ob sich der sogenannte Powernap flächendeckend durchsetzt, hängt allerdings weniger von der Wissenschaft ab als von der Unternehmenskultur. Solange Vorgesetzte ein kurzes Schläfchen insgeheim für Drückebergerei halten, dürften die neuen Ruheräume vielerorts leer bleiben."
      stem: Theo tác giả, điều gì quyết định việc ngủ ngắn ở nơi làm việc có trở nên phổ biến hay không?
      stem_lang: vi
      options:
        - { id: a, text: "Kết quả của các nghiên cứu về giấc ngủ", lang: vi }
        - { id: b, text: "Văn hóa doanh nghiệp, nhất là thái độ của cấp trên", lang: vi }
        - { id: c, text: "Số lượng phòng nghỉ mà các công ty xây dựng", lang: vi }
        - { id: d, text: "Việc nhân viên ngủ không quá 30 phút", lang: vi }
    answer: b
    explanation:
      vi: "“Ob sich der sogenannte Powernap flächendeckend durchsetzt, hängt allerdings weniger von der Wissenschaft ab als von der Unternehmenskultur” — việc này phụ thuộc vào văn hóa doanh nghiệp hơn là vào khoa học. Câu cuối nói nếu cấp trên (“Vorgesetzte”) thầm coi giấc ngủ ngắn là trốn việc (“Drückebergerei”) thì phòng nghỉ sẽ bỏ trống, nên chỉ có phòng nghỉ thôi là chưa đủ. Mốc 30 phút là lời khuyên của các nhà nghiên cứu giấc ngủ, không phải yếu tố quyết định."
  - key: de:diag:rea-b2-train-irony
    level: b2
    item_type: reading_mcq
    difficulty: 4.75
    prompt:
      passage: "Es gibt Gewissheiten im Leben, auf die man sich verlassen kann: Der Sommer ist zu kurz, der Montag zu lang – und der Regionalexpress um 7:42 Uhr kommt zu spät. Seit Monaten versichert das Bahnunternehmen, die Verspätungen seien eine „vorübergehende Erscheinung“. Vorübergehend ist offenbar ein dehnbarer Begriff. Die Pendlerinnen und Pendler haben sich längst arrangiert: Sie planen zwanzig Minuten Puffer ein, kennen die Durchsagen auswendig und wissen, an welchem Bahnhof der Kaffeeautomat funktioniert. Man könnte das als Beweis für die Anpassungsfähigkeit des Menschen feiern. Man könnte aber auch fragen, warum sich darüber eigentlich niemand mehr aufregt."
      stem: Câu “Vorübergehend ist offenbar ein dehnbarer Begriff” trong bài bình luận thể hiện điều gì?
      stem_lang: vi
      options:
        - { id: a, text: "Tác giả tin rằng tình trạng trễ tàu sắp chấm dứt", lang: vi }
        - { id: b, text: "Tác giả khen hãng tàu xử lý linh hoạt", lang: vi }
        - { id: c, text: "Tác giả mỉa mai rằng tình trạng trễ tàu kéo dài mãi, trái với lời hứa “tạm thời”", lang: vi }
        - { id: d, text: "Tác giả giải thích nghĩa của một từ khó cho người đọc", lang: vi }
    answer: c
    explanation:
      vi: "“ein dehnbarer Begriff” là “một khái niệm co giãn được”. Hãng tàu hứa chậm trễ chỉ là “vorübergehende Erscheinung” (hiện tượng tạm thời), nhưng tình trạng đó đã kéo dài “seit Monaten” (nhiều tháng nay). Tác giả mỉa mai rằng chữ “tạm thời” bị kéo giãn vô hạn; câu cuối “warum sich darüber eigentlich niemand mehr aufregt” cũng cho thấy tác giả không hề hài lòng."
  - key: de:diag:rea-b2-carfree-centre
    level: b2
    item_type: reading_mcq
    difficulty: 4.9
    prompt:
      passage: "Die Pläne der Stadtverwaltung, die Innenstadt bis 2030 weitgehend autofrei zu machen, stoßen bei vielen Einzelhändlern auf Widerstand. Ihre Sorge ist nachvollziehbar: Wer bislang davon lebt, dass die Kundschaft direkt vor der Tür parken kann, fürchtet Umsatzeinbußen. Erfahrungen aus anderen europäischen Städten zeigen allerdings, dass Fußgängerzonen den Handel keineswegs zwangsläufig schwächen – vorausgesetzt, die Innenstadt bleibt mit Bus und Bahn gut erreichbar und bietet mehr als bloße Einkaufsmöglichkeiten. Genau hier liegt die Schwachstelle der aktuellen Pläne: Zum Ausbau des Nahverkehrs enthalten sie bislang kaum mehr als eine Absichtserklärung. Eine autofreie Innenstadt ohne verlässliche Alternativen wäre kein Fortschritt, sondern ein Risiko."
      stem: Tác giả có khả năng đồng ý nhất với nhận định nào sau đây?
      stem_lang: vi
      options:
        - { id: a, text: "Trung tâm không ô tô có thể thành công, nhưng chỉ khi giao thông công cộng thực sự được mở rộng", lang: vi }
        - { id: b, text: "Nên dừng kế hoạch vì nó chắc chắn làm giảm doanh thu của các cửa hàng", lang: vi }
        - { id: c, text: "Kế hoạch hiện tại đã nêu đủ chi tiết về việc mở rộng giao thông công cộng", lang: vi }
        - { id: d, text: "Kinh nghiệm ở các nước châu Âu cho thấy phố đi bộ luôn làm tăng doanh thu", lang: vi }
    answer: a
    explanation:
      vi: "Tác giả thấy nỗi lo của chủ cửa hàng là “nachvollziehbar” (dễ hiểu), nhưng dẫn kinh nghiệm cho thấy phố đi bộ “keineswegs zwangsläufig” (hoàn toàn không nhất thiết) làm yếu việc buôn bán — với điều kiện (“vorausgesetzt”) trung tâm dễ đi tới bằng xe buýt và tàu. Điểm yếu của kế hoạch là phần giao thông công cộng mới chỉ là “kaum mehr als eine Absichtserklärung” (chỉ là tuyên bố ý định), và câu cuối gọi một trung tâm không ô tô thiếu lựa chọn thay thế là “ein Risiko”. “Không nhất thiết làm yếu” cũng khác với “luôn làm tăng” doanh thu."
