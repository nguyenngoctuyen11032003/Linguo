      stem: Người viết đánh giá việc làm việc tại nhà như thế nào?
      stem_lang: vi
      options:
        - { id: a, text: "Muốn quay lại văn phòng mỗi ngày", lang: vi }
        - { id: b, text: "Muốn làm việc ở nhà cả tuần", lang: vi }
        - { id: c, text: "Hài lòng với việc kết hợp nhà và văn phòng, dù thấy có nhược điểm", lang: vi }
