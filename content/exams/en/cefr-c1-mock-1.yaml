  - key: en:examq:cefr-c1-m1-l09
    section: listening
    kind: mcq
    question_type: cefr_listen_announcement
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe thông báo tại một hội nghị và chọn đáp án đúng.
      stem: What will happen at nine thirty?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Good morning, delegates. A couple of changes to today's programme. Professor Lindqvist's keynote, originally scheduled for nine thirty in the main hall, has been pushed back to eleven, as her flight was diverted overnight. In its place, the panel discussion on research funding will go ahead at nine thirty, but in Room B rather than the main hall, which is being set up for this afternoon's session. Anyone who had registered for the eleven o'clock workshops should check the noticeboard, as two of them will now run at the same time as the keynote rather than being cancelled.
      options:
        - { id: a, text: "Professor Lindqvist will give her talk in the main hall.", lang: en }
        - { id: b, text: "The funding panel will take place in the main hall.", lang: en }
        - { id: c, text: "The funding panel will take place in Room B.", lang: en }
        - { id: d, text: "Two of the workshops will begin.", lang: en }
    answer: c
    explanation:
      vi: "Bài nói chính bị lùi sang 11 giờ, và vào lúc 9:30 buổi thảo luận về tài trợ nghiên cứu sẽ diễn ra “in Room B rather than the main hall”. Phương án b là bẫy vì nghe thấy “main hall”, nhưng hội trường chính đang được chuẩn bị cho buổi chiều; a là lịch cũ (“originally scheduled”)."

