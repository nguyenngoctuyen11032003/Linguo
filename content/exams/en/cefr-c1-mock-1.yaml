  # ============================== NGHE (Listening) ==============================
  - key: en:examq:cefr-c1-m1-l01
    section: listening
    kind: mcq
    question_type: cefr_listen_detail
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe cuộc trao đổi giữa hai đồng nghiệp trong một nhóm nghiên cứu và chọn đáp án đúng.
      stem: Why will the study be delayed?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Man: Have you heard back from the ethics committee about the survey yet?
        Woman: Only this morning. They've approved it in principle, but they want us to rewrite the consent form so that participants can withdraw their data at any point, not just before the analysis begins.
        Man: That's hardly a major change, is it?
        Woman: You'd think so. But it means the whole data-storage plan has to be redesigned, because at the moment the responses are anonymised the moment they come in. If we can't link a response to a person, we can't delete it on request.
        Man: So we're looking at another month, at least.
        Woman: I'd say so. Still, I'd rather we got it right now than had the whole study thrown out later.
      options:
        - { id: a, text: "The committee rejected the survey questions.", lang: en }
        - { id: b, text: "Several participants have withdrawn from the study.", lang: en }
        - { id: c, text: "The way the data is stored must allow individual responses to be removed.", lang: en }
        - { id: d, text: "The analysis has to be repeated from the beginning.", lang: en }
    answer: c
    explanation:
      vi: "Hội đồng đạo đức muốn người tham gia rút dữ liệu bất cứ lúc nào, nên phải thiết kế lại cách lưu trữ (“the whole data-storage plan has to be redesigned”) để xóa được từng câu trả lời. Phương án a sai vì bảng hỏi đã được duyệt về nguyên tắc (“approved it in principle”); b là bẫy vì có từ withdraw, nhưng chưa ai rút lui cả — đó chỉ là quyền được ghi vào phiếu đồng ý."

  - key: en:examq:cefr-c1-m1-l02
    section: listening
    kind: mcq
    question_type: cefr_listen_attitude
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe lại cuộc trao đổi và chọn câu mô tả đúng thái độ của người nói.
      stem: How does the woman feel about the committee's request?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Man: Have you heard back from the ethics committee about the survey yet?
        Woman: Only this morning. They've approved it in principle, but they want us to rewrite the consent form so that participants can withdraw their data at any point, not just before the analysis begins.
        Man: That's hardly a major change, is it?
        Woman: You'd think so. But it means the whole data-storage plan has to be redesigned, because at the moment the responses are anonymised the moment they come in. If we can't link a response to a person, we can't delete it on request.
        Man: So we're looking at another month, at least.
        Woman: I'd say so. Still, I'd rather we got it right now than had the whole study thrown out later.
      options:
        - { id: a, text: "She accepts it as worthwhile despite the inconvenience.", lang: en }
        - { id: b, text: "She considers it a minor change that will take little time.", lang: en }
        - { id: c, text: "She thinks it is unreasonable and intends to challenge it.", lang: en }
        - { id: d, text: "She is relieved that the study can now begin.", lang: en }
    answer: a
    explanation:
      vi: "Câu cuối “I'd rather we got it right now than had the whole study thrown out later” (thà làm đúng ngay bây giờ còn hơn để cả nghiên cứu bị bác sau này) cho thấy cô chấp nhận yêu cầu dù mất thêm thời gian. Phương án b là ý của người nam (“hardly a major change”), còn cô đáp “You'd think so” — một cách lịch sự để nói “tưởng vậy thôi” — nghĩa là không đồng ý."

  - key: en:examq:cefr-c1-m1-l03
    section: listening
    kind: mcq
    question_type: cefr_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn phỏng vấn trên đài phát thanh và chọn đáp án đúng.
      stem: According to Dr Okafor, why do teenagers find early mornings difficult?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Presenter: Dr Okafor, people often say teenagers are simply lazy in the mornings. Is there any truth in that?
        Dr Okafor: Very little, I'm afraid. During adolescence the body clock shifts, so the hormone that makes us feel sleepy is released roughly two hours later than it is in adults. Asking a fifteen-year-old to be alert at eight a.m. is a bit like asking an adult to concentrate at six.
        Presenter: So should schools start later?
        Dr Okafor: The evidence points that way, although I'd be wary of presenting it as a cure-all. Schools that have moved their start time back by an hour do report better attendance, but the gains in exam results are modest, and they tend to disappear if students simply use the extra hour to stay up later on their phones.
      options:
        - { id: a, text: "They stay up too late using their phones.", lang: en }
        - { id: b, text: "They produce less of the hormone that causes sleepiness.", lang: en }
        - { id: c, text: "They are less motivated by school than younger children.", lang: en }
        - { id: d, text: "Their internal clock runs later than an adult's.", lang: en }
    answer: d
    explanation:
      vi: "Bà Okafor giải thích đồng hồ sinh học của thiếu niên bị lùi lại, hoóc-môn gây buồn ngủ tiết ra muộn hơn người lớn khoảng hai tiếng (“released roughly two hours later”). Phương án b là bẫy: hoóc-môn tiết ra muộn hơn chứ không phải ít hơn; a là bẫy vì điện thoại có được nhắc, nhưng chỉ ở phần nói về giới hạn của việc vào học muộn."

  - key: en:examq:cefr-c1-m1-l04
    section: listening
    kind: mcq
    question_type: cefr_listen_attitude
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn phỏng vấn và chọn câu mô tả đúng quan điểm của người được phỏng vấn.
      stem: What is Dr Okafor's view of later school start times?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Presenter: Dr Okafor, people often say teenagers are simply lazy in the mornings. Is there any truth in that?
        Dr Okafor: Very little, I'm afraid. During adolescence the body clock shifts, so the hormone that makes us feel sleepy is released roughly two hours later than it is in adults. Asking a fifteen-year-old to be alert at eight a.m. is a bit like asking an adult to concentrate at six.
        Presenter: So should schools start later?
        Dr Okafor: The evidence points that way, although I'd be wary of presenting it as a cure-all. Schools that have moved their start time back by an hour do report better attendance, but the gains in exam results are modest, and they tend to disappear if students simply use the extra hour to stay up later on their phones.
      options:
        - { id: a, text: "They are the most effective way to raise exam results.", lang: en }
        - { id: b, text: "They are helpful, but their benefits should not be exaggerated.", lang: en }
        - { id: c, text: "They have no measurable effect on students.", lang: en }
        - { id: d, text: "They should not be introduced until more research is done.", lang: en }
    answer: b
    explanation:
      vi: "“The evidence points that way” (bằng chứng ủng hộ) nhưng “I'd be wary of presenting it as a cure-all” (tôi dè dặt khi coi đó là thuốc chữa bách bệnh): bà ủng hộ có chừng mực. Phương án c sai vì tỉ lệ đi học có cải thiện và điểm thi tăng “modest” (khiêm tốn) chứ không phải bằng không; a ngược hẳn với chữ modest."

  - key: en:examq:cefr-c1-m1-l05
    section: listening
    kind: mcq
    question_type: cefr_listen_gist
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn trích bài giảng và chọn ý chính.
      stem: What is the main point of this part of the lecture?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Lecturer: The idea that the language we speak shapes the way we think is usually associated with Benjamin Lee Whorf. In its strong form – that language determines thought, so that speakers simply cannot conceive of anything their language has no word for – the hypothesis has been largely abandoned. After all, we're perfectly capable of grasping a new concept the first time someone explains it to us. What has survived is a far more modest claim: that language can nudge our attention and memory in particular directions. Speakers of languages that describe location using compass directions rather than "left" and "right", for instance, turn out to be remarkably good at keeping track of which way they are facing, even indoors. The question researchers now ask is not whether language influences thought, but how much, and under what conditions.
      options:
        - { id: a, text: "Whorf's ideas have been completely disproved.", lang: en }
        - { id: b, text: "Language determines which concepts people are able to understand.", lang: en }
        - { id: c, text: "A weaker version of the hypothesis is still taken seriously.", lang: en }
        - { id: d, text: "Languages without words for left and right are harder to learn.", lang: en }
    answer: c
    explanation:
      vi: "Giảng viên nói dạng mạnh của giả thuyết đã gần như bị bỏ (“largely abandoned”), nhưng một nhận định khiêm tốn hơn vẫn tồn tại (“What has survived is a far more modest claim”), và câu hỏi nay là ngôn ngữ ảnh hưởng “bao nhiêu”. Phương án a quá tuyệt đối: “largely” không phải “completely”, và một phần ý tưởng vẫn đứng vững; b chính là dạng mạnh đã bị bác bỏ."

  - key: en:examq:cefr-c1-m1-l06
    section: listening
    kind: mcq
    question_type: cefr_listen_detail
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn trích bài giảng và chọn đáp án đúng.
      stem: What does the lecturer say about speakers of languages that use compass directions?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Lecturer: The idea that the language we speak shapes the way we think is usually associated with Benjamin Lee Whorf. In its strong form – that language determines thought, so that speakers simply cannot conceive of anything their language has no word for – the hypothesis has been largely abandoned. After all, we're perfectly capable of grasping a new concept the first time someone explains it to us. What has survived is a far more modest claim: that language can nudge our attention and memory in particular directions. Speakers of languages that describe location using compass directions rather than "left" and "right", for instance, turn out to be remarkably good at keeping track of which way they are facing, even indoors. The question researchers now ask is not whether language influences thought, but how much, and under what conditions.
      options:
        - { id: a, text: "They are unusually aware of which way they are facing.", lang: en }
        - { id: b, text: "They cannot understand the ideas of left and right.", lang: en }
        - { id: c, text: "They easily lose their sense of direction indoors.", lang: en }
        - { id: d, text: "They have better memories than other speakers in general.", lang: en }
    answer: a
    explanation:
      vi: "“Remarkably good at keeping track of which way they are facing, even indoors” nghĩa là họ luôn biết rõ mình đang quay về hướng nào, kể cả trong nhà. Phương án c đảo ngược ý (“even indoors” là vẫn giỏi chứ không phải bị lạc); b lặp lại dạng mạnh đã bị bác bỏ; d khái quát quá mức vì bài chỉ nói về trí nhớ định hướng."

  - key: en:examq:cefr-c1-m1-l07
    section: listening
    kind: mcq
    question_type: cefr_listen_attitude
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn trích podcast và chọn đáp án đúng.
      stem: What is the woman's main concern about remote work?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Woman: What strikes me about the remote-work debate is how quickly it became tribal. You're either for the office or against it.
        Man: Partly because the early studies were so contradictory. One found productivity went up, another that it collapsed.
        Woman: But they were often measuring different things. If you count emails sent or tasks closed, remote workers look fantastic. What's much harder to measure is the stuff that happens by accident – the junior colleague who overhears how someone senior handles a difficult client.
        Man: Mentoring, essentially.
        Woman: Exactly. And that cost doesn't show up for a couple of years, by which point nobody connects it to the decision to go remote.
        Man: So you'd haul everyone back into the office?
        Woman: Not at all. I'd just like companies to be honest that they're making a trade-off, rather than pretending there's such a thing as a free lunch.
      options:
        - { id: a, text: "Remote workers send too many emails.", lang: en }
        - { id: b, text: "Remote work always reduces productivity.", lang: en }
        - { id: c, text: "Senior staff refuse to mentor colleagues online.", lang: en }
        - { id: d, text: "Its effect on informal learning may go unnoticed.", lang: en }
    answer: d
    explanation:
      vi: "Người nữ lo về những điều học được “tình cờ” — nhân viên trẻ nghe lỏm cách người có kinh nghiệm xử lý khách khó — tức là kèm cặp không chính thức, và cái giá này vài năm sau mới lộ ra nên không ai liên hệ lại (“nobody connects it to the decision”). Phương án a là bẫy vì số email chỉ là ví dụ về thứ dễ đo; b sai vì cô nói các nghiên cứu cho kết quả trái ngược nhau."

  - key: en:examq:cefr-c1-m1-l08
    section: listening
    kind: mcq
    question_type: cefr_listen_gist
    level_code: c1
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn trích podcast và chọn câu tóm tắt đúng nhất quan điểm của người nữ.
      stem: Which statement best summarises the woman's position?
      stem_lang: en
      audio_asset_id: null
      script: |-
        Woman: What strikes me about the remote-work debate is how quickly it became tribal. You're either for the office or against it.
        Man: Partly because the early studies were so contradictory. One found productivity went up, another that it collapsed.
        Woman: But they were often measuring different things. If you count emails sent or tasks closed, remote workers look fantastic. What's much harder to measure is the stuff that happens by accident – the junior colleague who overhears how someone senior handles a difficult client.
        Man: Mentoring, essentially.
        Woman: Exactly. And that cost doesn't show up for a couple of years, by which point nobody connects it to the decision to go remote.
        Man: So you'd haul everyone back into the office?
        Woman: Not at all. I'd just like companies to be honest that they're making a trade-off, rather than pretending there's such a thing as a free lunch.
      options:
        - { id: a, text: "Companies should require all staff to return to the office.", lang: en }
