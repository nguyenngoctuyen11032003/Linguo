    explanation:
      vi: "Công ty chia các nhóm làm việc với khách hàng thành hai nhóm nghỉ vào những ngày khác nhau (“two groups that take different days off”), nên thứ Sáu vẫn có người trả lời. Bài không hề nói công ty yêu cầu khách đổi thói quen, cho nhóm quay lại làm 5 ngày hay thuê thêm người."

  - key: en:examq:cefr-b2-m1-r09
    section: reading
    kind: mcq
    question_type: cefr_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo và chọn đáp án đúng cho câu hỏi.
      stem: What point does Dr Wheeler make about the trial?
      stem_lang: en
      passage: |-
