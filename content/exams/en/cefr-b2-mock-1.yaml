      vi: "Dr Wheeler cảnh báo không nên khái quát hóa (“warn against drawing sweeping conclusions”): điều hợp với công ty phần mềm có thể không hợp với bệnh viện hay công trường. Phương án b là bẫy vì nhắc “hospital”, nhưng ông dùng bệnh viện làm ví dụ về nơi có thể không áp dụng được; c thì ngược hẳn ý ông."

  - key: en:examq:cefr-b2-m1-r10
    section: reading
    kind: mcq
    question_type: cefr_read_gist
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo và chọn câu tóm tắt đúng nhất nội dung chính.
      stem: Which sentence best summarises the article?
      stem_lang: en
      passage: |-
