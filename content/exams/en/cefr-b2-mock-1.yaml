      options:
        - { id: a, text: "A four-day week caused serious problems and was abandoned.", lang: en }
        - { id: b, text: "A four-day week largely worked for one firm, though with difficulties and limits.", lang: en }
        - { id: c, text: "Most experts now agree every company should adopt a four-day week.", lang: en }
        - { id: d, text: "Employees were unhappy because their working days became longer.", lang: en }
    answer: b
    explanation:
      vi: "Bài báo cân bằng hai mặt: kết quả nhìn chung tốt (nhân viên ở lại, nghỉ ốm giảm, chế độ được giữ lâu dài) nhưng có khó khăn khi chuyển đổi và giới hạn về khả năng áp dụng. Phương án a sai vì công ty đã giữ chế độ này vĩnh viễn; d chỉ là một chi tiết nhỏ (“some employees”), không phải ý chính."

  - key: en:examq:cefr-b2-m1-r11
    section: reading
    kind: mcq
    question_type: cefr_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc thư gửi tòa soạn và chọn đáp án đúng cho câu hỏi.
      stem: What is Helen's main concern about the plan?
      stem_lang: en
      passage: |-
        Dear Editor,
        I read with interest your report on the council's plan to close the city centre to private cars from next spring. As someone who cycles to work every day, I ought to be delighted, and in principle I am. Cleaner air and quieter streets would benefit everyone.
        My concern is with the timing. The new tram line, which the council itself describes as essential to the scheme, will not be finished until at least the following year. Until then, people who live outside the city and cannot cycle – including many older residents and shift workers – will have no reliable way to get in. Local shops, many of which are still recovering from a difficult few years, could lose customers they simply cannot afford to lose.
        I would urge the council to delay the ban until the trams are running, rather than abandon it altogether. A good idea introduced too early can easily turn people against it.
        Yours faithfully,
        Helen Brooks
      options:
        - { id: a, text: "The ban will start before there is good public transport.", lang: en }
        - { id: b, text: "Cyclists will not be allowed into the city centre.", lang: en }
        - { id: c, text: "The tram line will cost too much to build.", lang: en }
        - { id: d, text: "Air pollution in the centre will get worse.", lang: en }
    answer: a
    explanation:
      vi: "“My concern is with the timing”: lệnh cấm xe bắt đầu từ mùa xuân tới, trong khi tuyến tàu điện mà chính hội đồng coi là thiết yếu phải sang năm sau mới xong. Bà không lo về chi phí tàu điện; còn b và d trái với thư, vì bà đi xe đạp và cho rằng không khí sẽ sạch hơn."

  - key: en:examq:cefr-b2-m1-r12
    section: reading
    kind: mcq
    question_type: cefr_read_gist
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc thư gửi tòa soạn và chọn mục đích chính của người viết.
      stem: Why has Helen written the letter?
      stem_lang: en
      passage: |-
        Dear Editor,
        I read with interest your report on the council's plan to close the city centre to private cars from next spring. As someone who cycles to work every day, I ought to be delighted, and in principle I am. Cleaner air and quieter streets would benefit everyone.
        My concern is with the timing. The new tram line, which the council itself describes as essential to the scheme, will not be finished until at least the following year. Until then, people who live outside the city and cannot cycle – including many older residents and shift workers – will have no reliable way to get in. Local shops, many of which are still recovering from a difficult few years, could lose customers they simply cannot afford to lose.
        I would urge the council to delay the ban until the trams are running, rather than abandon it altogether. A good idea introduced too early can easily turn people against it.
        Yours faithfully,
        Helen Brooks
      options:
        - { id: a, text: "to demand that the council cancel the plan", lang: en }
        - { id: b, text: "to complain about the newspaper's report", lang: en }
        - { id: c, text: "to support the idea but ask for it to be postponed", lang: en }
        - { id: d, text: "to encourage more people to cycle to work", lang: en }
    answer: c
    explanation:
      vi: "Bà ủng hộ về nguyên tắc (“in principle I am”) và đề nghị hoãn lệnh cấm đến khi tàu điện chạy, “rather than abandon it altogether” (chứ không bỏ hẳn). Vì vậy a sai; b sai vì bà đọc bài báo “with interest”, không phàn nàn về tòa soạn."

  # ============================== VIẾT (Writing) ==============================
  - key: en:examq:cefr-b2-m1-w01
    section: writing
    kind: essay
    question_type: cefr_write_essay
    level_code: b2
    points: 20
    prompt:
      instruction_vi: >-
        Viết một bài luận bằng tiếng Anh (khoảng 140–190 từ) trả lời câu hỏi của đề, bàn đủ hai ý cho sẵn và thêm
        một ý của riêng bạn. Nêu rõ quan điểm, có mở bài, thân bài và kết luận.
      stem: |-
        In your English class you have been discussing technology and education. Your teacher has asked you to write an essay.
        Should schools ban mobile phones during the school day?
        Notes – write about:
        1. concentration in lessons
        2. safety and contacting parents
        3. ________ (your own idea)
        Write your essay in 140–190 words.
      stem_lang: en
      min_chars: 700
      max_chars: 1800
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Bàn đủ hai ý cho sẵn và một ý riêng có phát triển (lý do, ví dụ); quan điểm rõ ràng và nhất quán. Thiếu một ý hoặc chỉ liệt kê mà không giải thích là mất điểm.
        max_points: 5
      - key: communicative_achievement
        label_vi: Hiệu quả giao tiếp
        description_vi: Đúng văn phong bài luận (trang trọng vừa phải, không viết như tin nhắn), lập luận thuyết phục người đọc, cân nhắc cả ý kiến trái chiều.
        max_points: 5
      - key: organization
        label_vi: Bố cục
        description_vi: Có mở bài, các đoạn thân bài mỗi đoạn một ý và kết luận; dùng từ nối đa dạng (However, On the other hand, As a result, Overall…).
        max_points: 5
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Từ vựng và cấu trúc đa dạng ở mức B2 (câu điều kiện, mệnh đề quan hệ, bị động, cụm từ cố định), lỗi ít và không gây hiểu nhầm.
        max_points: 5
    sample_answer: |-
      Smartphones have become part of everyday life, so it is not surprising that schools are unsure how to deal with them. In my view, a complete ban goes too far, but clear rules are essential.

      The strongest argument for a ban is concentration. Even when a phone is silent, students are tempted to check messages, and a single notification can break their focus for several minutes. Keeping phones in bags during lessons would solve most of this problem.

      On the other hand, many parents feel safer knowing their children can contact them, especially if they travel home alone or plans change at the last minute. Taking phones away for the whole day ignores this real need.

      Another point is that phones can be useful learning tools. Students can look up words, record experiments or take part in online quizzes, as long as the teacher decides when.

      Overall, I believe schools should not ban phones completely. Instead, they should allow them before and after lessons and only use them in class when the teacher asks.
    explanation:
      vi: "Bài luận B2 được chấm ở việc bàn đủ ba ý (hai ý cho sẵn và một ý riêng), có quan điểm rõ và lập luận có cân nhắc mặt trái. Lỗi hay gặp là chỉ nêu ý mà không giải thích, quên ý thứ ba, viết quá ngắn, hoặc dùng văn nói (“gonna”, “I think phones are so bad”) thay cho văn phong bài luận."
