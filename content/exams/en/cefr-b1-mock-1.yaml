  - key: en:examq:cefr-b1-m1-r12
    section: reading
    kind: mcq
    question_type: cefr_read_gist
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc bài báo và chọn ý kiến đúng của nhân vật.
      stem: What does Hannah think is the best thing about the repair café?
      stem_lang: en
      passage: |-
        THE REPAIR CAFÉ
        When Hannah Clarke's vacuum cleaner stopped working two years ago, the shop told her it would cost more to repair it than to buy a new one. "I hated the idea of throwing it away," she says. "So I watched a few videos online, opened it up and found that a small belt had broken. The new part cost three pounds."
        That experience gave Hannah, a 27-year-old nurse from Leeds, an idea. She persuaded the manager of her local community centre to let her use a room on the first Saturday of every month, and she put up posters asking for volunteers who were good at fixing things. Six people came to the first meeting. Now there are more than twenty, including a retired electrician, two students who repair laptops and a woman who can mend almost any piece of clothing.
