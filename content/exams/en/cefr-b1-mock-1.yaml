    answer: b
    explanation:
      vi: "Hannah nói “for me, the best thing is that neighbours who would never normally meet are sitting together” – điều cô quý nhất là hàng xóm được gặp gỡ, trò chuyện với nhau. Tiết kiệm tiền chỉ là “part of it” (một phần), và giảm rác là thông tin của người viết chứ không phải điều Hannah cho là quan trọng nhất."

  # ============================== VIẾT (Writing) ==============================
  - key: en:examq:cefr-b1-m1-w01
    section: writing
    kind: essay
    question_type: cefr_write_email
    level_code: b1
    points: 10
    prompt:
      instruction_vi: >-
        Đọc email của bạn và viết thư trả lời bằng tiếng Anh (khoảng 100 từ), trả lời đủ các ý được ghi chú. Viết thành
        đoạn văn mạch lạc, có lời chào và lời kết.
      stem: |-
        Read this email from your English friend, Chris, and the notes you have made.

        Hi!
        Great news – I'm coming to your country for two weeks in July! I'd love to spend a weekend in your town. (Notes: Great! / Tell Chris)
        Which is better for me: staying in a hotel or staying with your family? (Notes: Explain)
        What can we do together while I'm there? (Notes: Suggest…)
        What's the best way to get to your town from the airport? (Notes: Tell Chris)
        Write soon,
        Chris

        Write your email to Chris using all the notes. Write about 100 words.
      stem_lang: en
      min_chars: 400
      max_chars: 1200
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Trả lời đủ bốn ý theo ghi chú (vui mừng, chỗ ở có lý do, gợi ý hoạt động, cách đi từ sân bay); mỗi ý được phát triển thêm một chi tiết, thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào và lời kết phù hợp với thư cho bạn bè; các ý sắp xếp hợp lý, nối bằng because, so, although, as well as, and then; chia đoạn rõ ràng.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng được cấu trúc mức B1 như đề nghị (Why don't we…?, You could…), so sánh (better, cheaper than), thì tương lai (will, be going to) và từ vựng du lịch; lỗi ngữ pháp, chính tả không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Hi Chris,
      That's fantastic news! I can't wait to show you my town.
      I think you should stay with my family rather than in a hotel. We've got a spare room, and my mum will be really happy to cook Vietnamese food for you. It'll be cheaper too!
      On Saturday, why don't we go to the night market? The street food there is amazing. Then on Sunday we could rent bikes and ride along the river, as long as it isn't too hot.
      The easiest way to get here from the airport is by bus. It takes about forty minutes, and I'll meet you at the bus station.
      See you soon,
      Linh
    explanation:
      vi: "Bài email B1 được chấm trước hết ở việc trả lời đủ cả bốn ghi chú và nói thêm lý do hoặc chi tiết cho mỗi ý, chứ không chỉ liệt kê. Lỗi hay gặp là bỏ sót ý cuối (cách đi từ sân bay), viết “I suggest you to stay” thay vì “I suggest (that) you stay”, hoặc dùng sai “will” sau “if” (“if it will be hot”)."
