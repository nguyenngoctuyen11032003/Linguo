      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: 熱が あったので、くすりを （　） 早く ねました。
      options:
        - { id: a, text: "のんで", lang: ja }
        - { id: b, text: "たべて", lang: ja }
        - { id: c, text: "かけて", lang: ja }
        - { id: d, text: "ぬいで", lang: ja }
    answer: a
    explanation:
      vi: "Uống thuốc là くすりを のむ, kể cả thuốc viên, nên điền のんで. たべて là bẫy với người học quen “ăn” cho đồ rắn; tiếng Nhật không nói くすりを たべる."

  - key: ja:examq:jlpt-n4-m1-r09
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: 電車の 中に かさを （　） しまいました。
      options:
