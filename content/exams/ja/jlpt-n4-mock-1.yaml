      options:
        - { id: a, text: "先生は 田中さんを しかりました。", lang: ja }
        - { id: b, text: "田中さんは 先生を しかりました。", lang: ja }
        - { id: c, text: "先生は 田中さんを ほめました。", lang: ja }
        - { id: d, text: "田中さんは 先生に ほめられました。", lang: ja }
    answer: a
    explanation:
      vi: "しかられました là bị động của しかる (mắng): Tanaka bị thầy mắng, tức là thầy mắng Tanaka. Phương án b đảo người mắng và người bị mắng; ほめる là “khen”, ngược nghĩa."

  # --- Cách dùng từ (用法) ---
  - key: ja:examq:jlpt-n4-m1-r12
    section: reading
    kind: mcq
    question_type: jlpt_read_usage
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu dùng từ trong ngoặc 【 】 đúng nhất.
      stem: 【ねっしん】の つかいかたで いちばん いい ものは どれですか。
      stem_lang: ja
      options:
        - { id: a, text: "弟は 毎日 ねっしんに サッカーの 練習を して います。", lang: ja }
        - { id: b, text: "きょうは ねっしんが あるので、学校を 休みます。", lang: ja }
        - { id: c, text: "この スープは ねっしんですから、気を つけて ください。", lang: ja }
        - { id: d, text: "夏は ねっしんな 日が 続きます。", lang: ja }
    answer: a
    explanation:
      vi: "ねっしん (熱心) nghĩa là “nhiệt tình, chăm chỉ”, dùng cho thái độ làm việc, học tập: ねっしんに 練習する. Các câu còn lại nhầm với chữ 熱 (nóng, sốt): bị sốt là 熱が ある, súp nóng là あつい, ngày nóng là あつい 日."

  # --- Ngữ pháp (文法形式の判断) ---
  - key: ja:examq:jlpt-n4-m1-r13
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: 空が 暗く なって きましたね。雨が 降り（　）ですね。
      options:
        - { id: a, text: "そう", lang: ja }
        - { id: b, text: "よう", lang: ja }
        - { id: c, text: "らしい", lang: ja }
        - { id: d, text: "たい", lang: ja }
    answer: a
    explanation:
      vi: "Thân động từ thể ます + そうです diễn tả phán đoán từ những gì nhìn thấy: 降りそうです (trông như sắp mưa). ようです và らしい cũng là phỏng đoán nhưng phải đi sau thể thường (降る ようです, 降る らしい), không gắn vào 降り."

  - key: ja:examq:jlpt-n4-m1-r14
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: どんなに 練習（　）、この 曲は うまく ひけません。
      options:
        - { id: a, text: "しても", lang: ja }
        - { id: b, text: "したら", lang: ja }
        - { id: c, text: "すれば", lang: ja }
        - { id: d, text: "するので", lang: ja }
    answer: a
    explanation:
      vi: "どんなに 〜ても là “dù … thế nào đi nữa (cũng không)”, và vế sau phủ định ひけません khớp với nghĩa này. したら và すれば là điều kiện “nếu”, nên vế sau phải là kết quả đạt được, không đi với どんなに."

  - key: ja:examq:jlpt-n4-m1-r15
    section: reading
