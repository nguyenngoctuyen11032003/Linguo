  # --- Câu đồng nghĩa (言い換え類義) ---
  - key: ja:examq:jlpt-n4-m1-r10
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【この 町は とても にぎやかです。】
      options:
        - { id: a, text: "この 町には 人や 店が 多いです。", lang: ja }
        - { id: b, text: "この 町は とても しずかです。", lang: ja }
        - { id: c, text: "この 町は とても きれいです。", lang: ja }
        - { id: d, text: "この 町には 人が あまり いません。", lang: ja }
    answer: a
    explanation:
      vi: "にぎやか là “đông vui, náo nhiệt”: nhiều người, nhiều cửa hàng. しずか (yên tĩnh) và “人が あまり いません” (ít người) đều ngược nghĩa; きれい (đẹp, sạch) không liên quan đến độ đông đúc."

  - key: ja:examq:jlpt-n4-m1-r11
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
