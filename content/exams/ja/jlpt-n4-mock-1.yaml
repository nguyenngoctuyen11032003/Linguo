  # --- Từ hợp ngữ cảnh (文脈規定) ---
  - key: ja:examq:jlpt-n4-m1-r07
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: ねる 前に、かならず 歯を （　） ください。
      options:
        - { id: a, text: "みがいて", lang: ja }
        - { id: b, text: "ぬって", lang: ja }
        - { id: c, text: "ひいて", lang: ja }
        - { id: d, text: "おって", lang: ja }
    answer: a
    explanation:
      vi: "“Đánh răng” trong tiếng Nhật là 歯を みがく (nghĩa đen: đánh bóng răng), nên điền みがいて. ぬる là “bôi, sơn”, ひく là “kéo”, おる là “gập, bẻ”: không đi với 歯 trong nghĩa này."

  - key: ja:examq:jlpt-n4-m1-r08
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n4
    points: 1
    prompt:
