    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: |-
        A「すみません、この 辞書、ちょっと （　）も いいですか。」
        B「ええ、どうぞ。」
      options:
        - { id: a, text: "使って", lang: ja }
        - { id: b, text: "使い", lang: ja }
        - { id: c, text: "使う", lang: ja }
        - { id: d, text: "使った", lang: ja }
    answer: a
    explanation:
      vi: "Mẫu xin phép là động từ thể て + も いいですか: 使っても いいですか (tôi dùng có được không?). B trả lời “どうぞ” (xin mời) cũng cho thấy A đang xin phép."

  - key: ja:examq:jlpt-n4-m1-r16
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: 弟は 母に 「早く ねなさい」と （　）、しかたなく 自分の 部屋に 入りました。
      options:
        - { id: a, text: "言われて", lang: ja }
        - { id: b, text: "言って", lang: ja }
        - { id: c, text: "言わせて", lang: ja }
        - { id: d, text: "言えて", lang: ja }
    answer: a
    explanation:
      vi: "“ねなさい” là câu mẹ ra lệnh cho con, và しかたなく (đành phải) cho thấy em trai bị bảo, nên dùng bị động 言われて (bị mẹ nói). 言って sẽ thành em trai ra lệnh cho mẹ, còn 言わせて là “bắt mẹ nói”: đều không hợp."

