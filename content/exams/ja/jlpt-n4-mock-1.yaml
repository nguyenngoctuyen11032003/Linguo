      stem_lang: ja
      passage: |-
        わたしは 去年の 春から 日本の 会社で 働いて います。はじめは 日本語が あまり わからなくて、会議で 何も 話せませんでした。それで、毎朝 会社へ 行く 電車の 中で、日本語の ニュースを 聞くように しました。半年ぐらい たつと、少しずつ ニュースが わかるように なりました。今は 会議で 自分の 意見を 言う ことが できます。
      options:
        - { id: a, text: "毎朝 電車の 中で 日本語の ニュースを 聞いた。", lang: ja }
        - { id: b, text: "会議で たくさん 話すように した。", lang: ja }
        - { id: c, text: "毎晩 日本語の 学校に 通った。", lang: ja }
        - { id: d, text: "会社の 人に 日本語を 教えて もらった。", lang: ja }
    answer: a
    explanation:
      vi: "Sau từ それで (vì vậy), người viết nói đã tập “毎朝…電車の 中で、日本語の ニュースを 聞くように しました” (cố gắng nghe tin tức tiếng Nhật trên tàu mỗi sáng). Phương án b là bẫy: phát biểu trong họp là KẾT QUẢ hiện nay, không phải cách luyện tập."

