questions:
  # ============================== NGHE (聴解) ==============================
  # --- Hiểu yêu cầu (課題理解) ---
  - key: ja:examq:jlpt-n4-m1-l01
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại giữa sinh viên và giáo viên, chọn việc sinh viên làm ĐẦU TIÊN.
      stem: 男の 学生は まず 何を しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の学生：先生、レポートを 持って きました。
        先生：ありがとう。あれ、名前が 書いて ありませんね。
        男の学生：あ、すみません。
        先生：それから、3ページ目の 字が 小さくて 読みにくいので、大きく 書きなおして ください。でも、それは 来週まででいいですよ。
        男の学生：はい。じゃあ、今 すぐ 名前を 書きます。
      options:
        - { id: a, text: "レポートに 名前を 書く", lang: ja }
        - { id: b, text: "3ページ目を 書きなおす", lang: ja }
        - { id: c, text: "レポートを 先生に 持って くる", lang: ja }
        - { id: d, text: "来週 先生に 会いに 行く", lang: ja }
    answer: a
    explanation:
      vi: "Sinh viên nói “今 すぐ 名前を 書きます” (tôi viết tên ngay bây giờ), nên việc đầu tiên là ghi tên. Viết lại trang 3 cũng phải làm, nhưng giáo viên cho hạn “来週まで” (đến tuần sau), nên đó không phải việc làm trước."

  - key: ja:examq:jlpt-n4-m1-l02
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe cuộc gọi điện thoại và chọn những thứ người đàn ông sẽ mua về.
      stem: 男の 人は 何を 買って 帰りますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：もしもし、今 スーパーに いるんだけど、何か 買って 帰ろうか。
        女の人：ありがとう。じゃあ、たまごと 牛乳、お願い。
        男の人：パンは？ たしか もう なかったよね。
        女の人：パンは けさ 買ったから、だいじょうぶ。あ、それから、トマトも 三つ お願い。
        男の人：わかった。
      options:
        - { id: a, text: "たまごと 牛乳と トマト", lang: ja }
        - { id: b, text: "たまごと 牛乳と パン", lang: ja }
        - { id: c, text: "たまごと パンと トマト", lang: ja }
        - { id: d, text: "牛乳と パンと トマト", lang: ja }
    answer: a
    explanation:
      vi: "Người vợ nhờ mua trứng và sữa, rồi thêm 3 quả cà chua. Bánh mì là bẫy: người chồng hỏi, nhưng vợ trả lời “けさ 買ったから、だいじょうぶ” (sáng nay mua rồi nên không cần)."

  - key: ja:examq:jlpt-n4-m1-l03
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở cơ quan hành chính và chọn nơi người phụ nữ đến TRƯỚC TIÊN.
      stem: 女の 人は まず どこへ 行きますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、パスポートを 作りたいんですが、どこへ 行けば いいですか。
        男の人：パスポートは 2階の 5番の まどぐちです。でも、その 前に 1階で 写真を とって ください。
        女の人：写真は もう 持って います。
        男の人：あ、そうですか。じゃあ、そのまま 2階へ どうぞ。
      options:
        - { id: a, text: "2階の 5番の まどぐち", lang: ja }
        - { id: b, text: "1階の 写真を とる ところ", lang: ja }
        - { id: c, text: "5階の 2番の まどぐち", lang: ja }
        - { id: d, text: "1階の 5番の まどぐち", lang: ja }
    answer: a
    explanation:
      vi: "Thông thường phải chụp ảnh ở tầng 1 trước, nhưng người phụ nữ đã có ảnh nên được bảo “そのまま 2階へ どうぞ” (cứ lên thẳng tầng 2). Phương án b là bẫy cho người chỉ nghe nửa đầu; phương án c đảo số tầng và số quầy."

  # --- Hiểu điểm chính (ポイント理解) ---
  - key: ja:examq:jlpt-n4-m1-l04
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn lý do người đàn ông chuyển nhà.
      stem: 男の 人は どうして 引っ越しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：木村さん、来月 引っ越すんですって？ 今の アパート、駅から 近くて 便利でしょう。
        男の人：ええ、便利なんですけど、となりの 部屋の 人が 夜 おそくまで うるさくて、よく ねられないんです。
        女の人：それは 大変ですね。
        男の人：新しい アパートは 駅から 少し 遠いですけど、しずかなんですよ。
      options:
        - { id: a, text: "となりの 人が うるさいから", lang: ja }
        - { id: b, text: "駅から 遠いから", lang: ja }
        - { id: c, text: "部屋が せまいから", lang: ja }
        - { id: d, text: "家賃が 高いから", lang: ja }
    answer: a
    explanation:
      vi: "Anh ấy nói người phòng bên ồn đến khuya nên “よく ねられないんです” (không ngủ được): đó là lý do chuyển nhà. “駅から 遠い” là bẫy: chính căn hộ MỚI mới xa ga, còn căn hiện tại thì gần ga và tiện."

  - key: ja:examq:jlpt-n4-m1-l05
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn việc người phụ nữ đã làm vào thứ Bảy.
      stem: 女の 人は 土曜日に 何を しましたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：週末は どうでしたか。山に 登ると 言って いましたね。
        女の人：ええ、そのつもりだったんですが、土曜日は 雨が ひどくて…。それで、友だちと 映画を 見に 行きました。
        男の人：日曜日は？
        女の人：日曜日は 晴れましたけど、つかれて いたので、一日中 家で 休みました。
      options:
        - { id: a, text: "映画を 見に 行った", lang: ja }
        - { id: b, text: "山に 登った", lang: ja }
        - { id: c, text: "家で 休んだ", lang: ja }
        - { id: d, text: "友だちの 家へ 行った", lang: ja }
    answer: a
    explanation:
      vi: "Thứ Bảy mưa to nên cô ấy không leo núi mà “友だちと 映画を 見に 行きました” (đi xem phim với bạn). “家で 休んだ” là việc của Chủ nhật; leo núi chỉ là dự định (つもり) không thực hiện."

  - key: ja:examq:jlpt-n4-m1-l06
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở công ty và chọn ngày cuộc họp được dời sang.
      stem: 会議は 何曜日に なりましたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：部長、来週の 会議ですが、月曜日の 予定でしたよね。
        男の人：ああ、月曜日は 出張が 入ったので、水曜日に して もらえますか。
        女の人：すみません、水曜日は 会議室が 使えないんです。木曜日は どうでしょうか。
        男の人：じゃあ、木曜日に しましょう。
      options:
        - { id: a, text: "月曜日", lang: ja }
        - { id: b, text: "火曜日", lang: ja }
        - { id: c, text: "水曜日", lang: ja }
        - { id: d, text: "木曜日", lang: ja }
    answer: d
    explanation:
      vi: "Thứ Hai trưởng phòng đi công tác, thứ Tư phòng họp không dùng được, nên hai người chốt “木曜日に しましょう” (thứ Năm). 水曜日 là bẫy vì được đề nghị trước nhưng bị từ chối."

  # --- Nói gì trong tình huống (発話表現) ---
  - key: ja:examq:jlpt-n4-m1-l07
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        友だちの ノートを 借りたいです。友だちに 何と 言いますか。
      options:
        - { id: a, text: "ノート、貸して くれない？", lang: ja }
        - { id: b, text: "ノート、借りて くれない？", lang: ja }
        - { id: c, text: "ノート、貸して あげようか。", lang: ja }
    answer: a
    explanation:
      vi: "貸す là “cho mượn”, 借りる là “mượn”; bạn muốn bạn mình CHO mượn nên nói “貸して くれない？”. “借りて くれない？” nghĩa là “mượn giùm mình nhé?”, còn “貸して あげようか” là mình đề nghị cho bạn mượn, ngược hướng."

  - key: ja:examq:jlpt-n4-m1-l08
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        先生の 部屋で 話が 終わりました。これから 部屋を 出ます。何と 言いますか。
      options:
        - { id: a, text: "失礼しました。", lang: ja }
        - { id: b, text: "いらっしゃいませ。", lang: ja }
        - { id: c, text: "お待たせしました。", lang: ja }
    answer: a
    explanation:
      vi: "Khi rời phòng giáo viên hoặc cấp trên, người Nhật nói “失礼しました” (xin phép, tôi đã làm phiền). “いらっしゃいませ” là câu nhân viên cửa hàng chào khách, còn “お待たせしました” là xin lỗi vì để người khác chờ."

  # --- Đáp lại ngay (即時応答) ---
  - key: ja:examq:jlpt-n4-m1-l09
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：すみません、この 荷物、ちょっと 持って いただけませんか。
      options:
        - { id: a, text: "ええ、いいですよ。", lang: ja }
        - { id: b, text: "はい、持って いただきます。", lang: ja }
        - { id: c, text: "いいえ、持って いません。", lang: ja }
    answer: a
    explanation:
      vi: "“〜て いただけませんか” là lời nhờ lịch sự (anh/chị cầm giúp được không?), nên đồng ý bằng “ええ、いいですよ”. “持って いただきます” dùng sai hướng: いただく là mình nhận việc người khác làm cho, không dùng để nói mình làm giúp."

  - key: ja:examq:jlpt-n4-m1-l10
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、ここで たばこを 吸っても いいですか。
      options:
        - { id: a, text: "すみません、ここは きんえんなんです。", lang: ja }
        - { id: b, text: "ええ、吸って いました。", lang: ja }
        - { id: c, text: "いいえ、たばこです。", lang: ja }
    answer: a
    explanation:
      vi: "“〜ても いいですか” là xin phép, nên từ chối lịch sự bằng “すみません、ここは きんえんなんです” (xin lỗi, ở đây cấm hút thuốc). “吸って いました” kể việc đã xảy ra, không trả lời câu xin phép."

  # ============================== CHỮ – TỪ VỰNG – NGỮ PHÁP – ĐỌC (言語知識・読解) ==============================
  # --- Đọc Kanji (漢字読み) ---
  - key: ja:examq:jlpt-n4-m1-r01
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【近所】の スーパーは 夜 10時まで 開いて います。
      options:
        - { id: a, text: "きんじょ", lang: ja }
        - { id: b, text: "きんしょ", lang: ja }
        - { id: c, text: "きんじょう", lang: ja }
        - { id: d, text: "ちかしょ", lang: ja }
    answer: a
    explanation:
      vi: "近所 (hàng xóm, khu gần nhà) đọc là きんじょ: 所 ở đây đục thành じょ và không có trường âm. ちかしょ ghép cách đọc thuần Nhật của 近 (ちかい) một cách sai, vì từ Hán ghép này đọc theo âm Hán."

  - key: ja:examq:jlpt-n4-m1-r02
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: この 料理は 【味】が うすいです。
      options:
        - { id: a, text: "あじ", lang: ja }
        - { id: b, text: "あし", lang: ja }
        - { id: c, text: "み", lang: ja }
        - { id: d, text: "いろ", lang: ja }
    answer: a
    explanation:
      vi: "味 đứng một mình đọc là あじ (vị), 味が うすい là “vị nhạt”. み cũng là cách đọc của 味 nhưng chỉ dùng trong từ ghép như 意味 (いみ, ý nghĩa); あし là “chân”, いろ là “màu”."

  - key: ja:examq:jlpt-n4-m1-r03
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【急行】に 乗れば、30分で 着きます。
      options:
        - { id: a, text: "きゅうこう", lang: ja }
        - { id: b, text: "きゅうごう", lang: ja }
        - { id: c, text: "きょうこう", lang: ja }
        - { id: d, text: "きゅこう", lang: ja }
    answer: a
    explanation:
      vi: "急行 (tàu tốc hành) đọc là きゅうこう, cả hai âm đều có trường âm và こう không đục. Hãy phân biệt きゅう (急) với きょう: hai âm này khác nhau, người Việt dễ nghe lẫn."

  # --- Viết bằng Kanji (表記) ---
  - key: ja:examq:jlpt-n4-m1-r04
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: きのうの 【しあい】に 負けて、とても ざんねんでした。
      options:
        - { id: a, text: "試合", lang: ja }
        - { id: b, text: "試会", lang: ja }
        - { id: c, text: "式合", lang: ja }
        - { id: d, text: "誠合", lang: ja }
    answer: a
    explanation:
      vi: "しあい (trận đấu) viết là 試合: 試 (thử) + 合 (hợp). 会 (かい, あう — gặp) gần nghĩa nên dễ nhầm, nhưng từ này dùng 合; 式 (しき, nghi thức) thiếu bộ ngôn 言 bên trái."

  - key: ja:examq:jlpt-n4-m1-r05
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: 毎朝 30分 【はしって】 います。
      options:
        - { id: a, text: "走って", lang: ja }
        - { id: b, text: "歩って", lang: ja }
        - { id: c, text: "足って", lang: ja }
        - { id: d, text: "起って", lang: ja }
    answer: a
    explanation:
      vi: "はしる (chạy) viết là 走る, nên はしって là 走って. 歩 là chữ của あるく (đi bộ, 歩いて), còn 足 (あし) là “chân”: cùng chủ đề vận động nên dễ nhầm."

  - key: ja:examq:jlpt-n4-m1-r06
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: 駅の 前で 友だちを 1時間 【まちました】。
      options:
        - { id: a, text: "待ちました", lang: ja }
        - { id: b, text: "持ちました", lang: ja }
        - { id: c, text: "特ちました", lang: ja }
        - { id: d, text: "時ちました", lang: ja }
