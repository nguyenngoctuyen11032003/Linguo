questions:
  # ============================== NGHE (聴解) ==============================
  # --- Hiểu yêu cầu (課題理解) ---
  - key: ja:examq:jlpt-n5-m1-l01
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn đúng thứ người phụ nữ sẽ mua.
      stem: 女の 人は 何を 買いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、このりんごは一つ いくらですか。
        男の人：一つ100円です。きょうは みかんも 安いですよ。五つで200円です。
        女の人：じゃあ、りんごを二つと、みかんを五つ ください。
        男の人：はい、ありがとうございます。
      options:
        - { id: a, text: "りんご 二つと みかん 五つ", lang: ja }
        - { id: b, text: "りんご 五つと みかん 二つ", lang: ja }
        - { id: c, text: "りんご 二つだけ", lang: ja }
        - { id: d, text: "みかん 五つだけ", lang: ja }
    answer: a
    explanation:
      vi: "Cuối hội thoại người phụ nữ nói “りんごを二つと、みかんを五つ ください” (cho tôi 2 quả táo và 5 quả quýt). Phương án b đảo ngược số lượng, dễ chọn nhầm nếu bạn chỉ nhớ hai con số mà không nhớ con số nào đi với quả nào."

  - key: ja:examq:jlpt-n5-m1-l02
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn đúng những thứ học sinh phải mang theo ngày mai.
      stem: 学生は あした 何を もって きますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        先生：あしたは テストです。えんぴつと けしゴムを もって きて ください。
        学生：先生、じしょも いりますか。
        先生：いいえ、じしょは いりません。それから、ペンは つかわないで ください。
        学生：はい、わかりました。
      options:
        - { id: a, text: "えんぴつと けしゴム", lang: ja }
        - { id: b, text: "えんぴつと じしょ", lang: ja }
        - { id: c, text: "ペンと けしゴム", lang: ja }
        - { id: d, text: "ペンと じしょ", lang: ja }
    answer: a
    explanation:
      vi: "Giáo viên dặn mang bút chì (えんぴつ) và tẩy (けしゴム); từ điển thì “いりません” (không cần), còn bút bi thì “つかわないで ください” (đừng dùng). Phương án b là bẫy vì học sinh có hỏi về từ điển, nhưng câu trả lời là không cần."

  - key: ja:examq:jlpt-n5-m1-l03
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở công ty và chọn việc người đàn ông làm ĐẦU TIÊN.
      stem: 男の 人は この あと まず 何を しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：田中さん、かいぎは3時からです。その前に、この かみを10まい コピーして ください。
        男の人：はい。あ、でも、さきに ひるごはんを 食べても いいですか。
        女の人：ええ、いいですよ。コピーは2時までに おねがいします。
        男の人：わかりました。
      options:
        - { id: a, text: "ひるごはんを 食べる", lang: ja }
        - { id: b, text: "かみを コピーする", lang: ja }
        - { id: c, text: "かいぎに 出る", lang: ja }
        - { id: d, text: "かみを 10まい 書く", lang: ja }
    answer: a
    explanation:
      vi: "Người đàn ông xin “さきに ひるごはんを 食べても いいですか” (ăn trưa trước có được không) và được đồng ý, nên việc đầu tiên là ăn trưa. Photo (コピー) là bẫy: việc này làm sau, chỉ cần xong trước 2 giờ."

  # --- Hiểu điểm chính (ポイント理解) ---
  - key: ja:examq:jlpt-n5-m1-l04
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn nơi người đàn ông đã đến hôm qua.
      stem: 男の 人は きのう どこへ 行きましたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：山田さん、きのうの日よう日は 何を しましたか。
        男の人：あさは うちで そうじを しました。ごごは あにと デパートへ 行きたかったです。でも、あには いそがしかったです。それで、一人で としょかんへ 行きました。
        女の人：そうですか。
      options:
        - { id: a, text: "デパート", lang: ja }
        - { id: b, text: "としょかん", lang: ja }
        - { id: c, text: "あにの うち", lang: ja }
        - { id: d, text: "どこへも 行きませんでした", lang: ja }
    answer: b
    explanation:
      vi: "Anh ấy muốn đi bách hoá (デパート) với anh trai nhưng anh trai bận, “それで” (vì vậy) anh ấy đi thư viện (としょかん) một mình. デパート là bẫy vì xuất hiện trong bài, nhưng chỉ là điều anh ấy “muốn” (行きたかったです) chứ không làm."

  - key: ja:examq:jlpt-n5-m1-l05
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn ngày sinh nhật của người phụ nữ.
      stem: 女の 人の たんじょうびは いつですか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：リーさんの たんじょうびは いつですか。
        女の人：4月8日です。
        男の人：えっ、4月8日ですか。ぼくの いもうとも 4月8日ですよ。
        女の人：あ、すみません、まちがえました。8日じゃ ありません。9日です。
      options:
        - { id: a, text: "4月8日", lang: ja }
        - { id: b, text: "4月9日", lang: ja }
        - { id: c, text: "8月4日", lang: ja }
        - { id: d, text: "9月4日", lang: ja }
    answer: b
    explanation:
      vi: "Người phụ nữ nói nhầm rồi sửa lại: “8日じゃ ありません。9日です”, nên sinh nhật là ngày 9 tháng 4. Đề JLPT hay có kiểu “nói rồi sửa” này; hãy nghe đến câu cuối. Lưu ý cách đọc đặc biệt: 4月 là しがつ, 8日 là ようか, 9日 là ここのか."

  - key: ja:examq:jlpt-n5-m1-l06
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn giờ hai người gặp nhau.
      stem: 二人は 何時に あいますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：あしたの えいがは 何時からですか。
        女の人：7時からです。
        男の人：じゃ、6時半に えきで あいましょうか。
        女の人：うーん、6時半まで しごとが ありますから…。6時45分は どうですか。
        男の人：はい、いいですよ。
      options:
        - { id: a, text: "6時", lang: ja }
        - { id: b, text: "6時半", lang: ja }
        - { id: c, text: "6時45分", lang: ja }
        - { id: d, text: "7時", lang: ja }
    answer: c
    explanation:
      vi: "Người phụ nữ làm việc đến 6 giờ rưỡi nên đề nghị 6 giờ 45 (6時45分), người đàn ông đồng ý (いいですよ). 7時 là giờ phim bắt đầu, còn 6時半 là giờ người đàn ông đề nghị lúc đầu nhưng không được chấp nhận."

  # --- Nói gì trong tình huống (発話表現) ---
  - key: ja:examq:jlpt-n5-m1-l07
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        友だちの うちに 来ました。これから 中に 入ります。何と 言いますか。
      options:
        - { id: a, text: "おじゃまします。", lang: ja }
        - { id: b, text: "いってきます。", lang: ja }
        - { id: c, text: "おかえりなさい。", lang: ja }
    answer: a
    explanation:
      vi: "Khi bước vào nhà người khác, người Nhật nói “おじゃまします” (xin phép làm phiền). “いってきます” là câu nói khi rời nhà mình đi ra ngoài, còn “おかえりなさい” là câu chào người nhà vừa về."

  - key: ja:examq:jlpt-n5-m1-l08
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        レストランで 店の 人を よびます。何と 言いますか。
      options:
        - { id: a, text: "すみません。", lang: ja }
        - { id: b, text: "ごちそうさまでした。", lang: ja }
        - { id: c, text: "どういたしまして。", lang: ja }
    answer: a
    explanation:
      vi: "Để gọi nhân viên nhà hàng, bạn nói “すみません” (xin lỗi / cho tôi hỏi). “ごちそうさまでした” nói sau khi ăn xong, còn “どういたしまして” là đáp lại lời cảm ơn."

  # --- Đáp lại ngay (即時応答) ---
  - key: ja:examq:jlpt-n5-m1-l09
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：その かさ、だれのですか。
      options:
        - { id: a, text: "わたしのです。", lang: ja }
        - { id: b, text: "あそこに あります。", lang: ja }
        - { id: c, text: "1000円でした。", lang: ja }
    answer: a
    explanation:
      vi: "Câu hỏi “だれのですか” hỏi “của ai”, nên trả lời “わたしのです” (của tôi). “あそこに あります” trả lời câu hỏi “ở đâu” (どこ), còn “1000円でした” trả lời câu hỏi giá tiền (いくら)."

  - key: ja:examq:jlpt-n5-m1-l10
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：いっしょに おちゃを のみませんか。
      options:
        - { id: a, text: "ええ、のみましょう。", lang: ja }
        - { id: b, text: "はい、のみました。", lang: ja }
        - { id: c, text: "いいえ、おちゃです。", lang: ja }
    answer: a
    explanation:
      vi: "“〜ませんか” là lời mời (cùng uống trà không?), nên nhận lời bằng “ええ、のみましょう” (vâng, uống thôi). “はい、のみました” là bẫy: câu ở quá khứ (đã uống rồi), không hợp với một lời mời."

  # ============================== CHỮ – TỪ VỰNG – NGỮ PHÁP – ĐỌC (言語知識・読解) ==============================
  # --- Đọc Kanji (漢字読み) ---
  - key: ja:examq:jlpt-n5-m1-r01
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: あしたは 【午後】から あめが ふります。
      options:
        - { id: a, text: "ごご", lang: ja }
        - { id: b, text: "ごうご", lang: ja }
        - { id: c, text: "ごこ", lang: ja }
        - { id: d, text: "こご", lang: ja }
    answer: a
    explanation:
      vi: "午後 đọc là ごご (buổi chiều), cả hai âm đều là ご đục và ngắn. Người Việt hay kéo dài thành ごうご, nhưng 午 chỉ đọc ご, không có trường âm."

  - key: ja:examq:jlpt-n5-m1-r02
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: この 【川】は とても きれいです。
      options:
        - { id: a, text: "かわ", lang: ja }
        - { id: b, text: "がわ", lang: ja }
        - { id: c, text: "やま", lang: ja }
        - { id: d, text: "いけ", lang: ja }
    answer: a
    explanation:
      vi: "川 (sông) đứng một mình đọc là かわ. がわ là cách đọc khi 川 đứng sau một chữ khác trong từ ghép (như おがわ, suối nhỏ), nên không dùng ở đây; やま là 山 (núi), いけ là 池 (ao)."

  - key: ja:examq:jlpt-n5-m1-r03
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【外国】の 友だちに てがみを 書きました。
      options:
        - { id: a, text: "がいこく", lang: ja }
        - { id: b, text: "かいこく", lang: ja }
        - { id: c, text: "がいごく", lang: ja }
        - { id: d, text: "そとくに", lang: ja }
    answer: a
    explanation:
      vi: "外国 (nước ngoài) đọc là がいこく: が đục, こく trong. Phương án そとくに ghép cách đọc thuần Nhật của từng chữ (外 = そと, 国 = くに), nhưng từ ghép Hán này đọc theo âm Hán."

  - key: ja:examq:jlpt-n5-m1-r04
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【来週】 日本語の テストが あります。
      options:
        - { id: a, text: "らいしゅう", lang: ja }
        - { id: b, text: "らいしゅ", lang: ja }
        - { id: c, text: "らいしょう", lang: ja }
        - { id: d, text: "こんしゅう", lang: ja }
    answer: a
    explanation:
      vi: "来週 (tuần sau) đọc là らいしゅう, chữ 週 có trường âm しゅう. こんしゅう là 今週 (tuần này): đúng là một từ, nhưng không phải cách đọc của 来週."

