        - { id: c, text: "土よう日は ごご6時まで あいて います。", lang: ja }
        - { id: d, text: "本は 1しゅうかんで かえします。", lang: ja }
    answer: a
    explanation:
      vi: "Dòng cuối ghi mỗi người được mượn tối đa 5 cuốn (5さつまで), nên a đúng. Thứ Hai là ngày nghỉ (休み), thứ Bảy chỉ mở đến 5 giờ chiều, và sách phải trả trong 2 tuần chứ không phải 1 tuần."
