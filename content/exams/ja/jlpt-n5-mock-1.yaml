      stem_lang: ja
      passage: |-
        きょうは 日よう日でした。あさ、友だちと こうえんで テニスを しました。ひるごはんは こうえんの ちかくの きっさてんで サンドイッチを 食べました。ごごは うちで 本を 読みました。
      options:
        - { id: a, text: "こうえんの ちかくの きっさてん", lang: ja }
        - { id: b, text: "こうえん", lang: ja }
        - { id: c, text: "うち", lang: ja }
        - { id: d, text: "友だちの うち", lang: ja }
    answer: a
    explanation:
      vi: "Câu thứ ba nói rõ: “ひるごはんは こうえんの ちかくの きっさてんで…食べました” (ăn trưa ở quán cà phê gần công viên). こうえん là nơi chơi tennis buổi sáng, còn うち là nơi đọc sách buổi chiều."

  - key: ja:examq:jlpt-n5-m1-r20
    section: reading
    kind: mcq
    question_type: jlpt_read_detail
    level_code: n5
    points: 4
