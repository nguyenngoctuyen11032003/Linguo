    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【この へやは くらいです。】
      options:
        - { id: a, text: "この へやは あかるくないです。", lang: ja }
        - { id: b, text: "この へやは ひろくないです。", lang: ja }
        - { id: c, text: "この へやは あかるいです。", lang: ja }
        - { id: d, text: "この へやは しずかです。", lang: ja }
    answer: a
    explanation:
      vi: "くらい là “tối”, tức là “không sáng”: あかるくないです. Phương án c (あかるいです, sáng) ngược nghĩa; ひろくない là “không rộng”, nói về diện tích chứ không về ánh sáng."

  - key: ja:examq:jlpt-n5-m1-r12
