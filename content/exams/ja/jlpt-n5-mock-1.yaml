        田中
      options:
        - { id: a, text: "1時半", lang: ja }
        - { id: b, text: "1時", lang: ja }
        - { id: c, text: "2時", lang: ja }
        - { id: d, text: "2時半", lang: ja }
    answer: a
    explanation:
      vi: "Tanaka viết “1時半に えきの 前で まって います” (đợi ở trước ga lúc 1 rưỡi), nên Maria đến ga lúc 1 giờ 30. 2時 là bẫy: đó là giờ phim bắt đầu, không phải giờ hẹn ở ga."

  # --- Tìm thông tin (情報検索) ---
  - key: ja:examq:jlpt-n5-m1-r21
