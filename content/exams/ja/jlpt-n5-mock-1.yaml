        - { id: b, text: "ひろくて", lang: ja }
        - { id: c, text: "あまくて", lang: ja }
        - { id: d, text: "あかくて", lang: ja }
    answer: a
    explanation:
      vi: "あたまが いたい là “đau đầu”, và dạng 〜くて nối với vế sau để chỉ lý do: đau đầu nên nghỉ học. ひろい (rộng), あまい (ngọt), あかい (đỏ) không đi với あたま để nói lý do nghỉ học."

  - key: ja:examq:jlpt-n5-m1-r10
