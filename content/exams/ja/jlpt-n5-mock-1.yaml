    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【あには りょうりが じょうずです。】
      options:
        - { id: a, text: "あには おいしい りょうりを つくります。", lang: ja }
        - { id: b, text: "あには りょうりを 食べるのが すきです。", lang: ja }
        - { id: c, text: "あには りょうりが へたです。", lang: ja }
        - { id: d, text: "あには りょうりを ならって います。", lang: ja }
    answer: a
    explanation:
      vi: "じょうず là “giỏi”, nấu ăn giỏi nghĩa là nấu được món ngon: おいしい りょうりを つくります. Phương án b là bẫy: thích ăn (食べるのが すきです) không có nghĩa là nấu giỏi; へた (kém) thì ngược nghĩa."

