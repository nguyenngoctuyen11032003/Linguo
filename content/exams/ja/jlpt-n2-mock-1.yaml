# Bài luyện mô phỏng JLPT N2 do Linguo tự soạn (nguồn src:linguo-demo). Không phải đề thi chính thức,
# không chép đề thật hay sách luyện thi có bản quyền. Nghe: lời thoại trong `script`, ứng dụng đọc bằng giọng máy
# khi chưa có audio (audio_asset_id: null).
#
# Giả định về cấu trúc và thang điểm (ghi lại để người duyệt kiểm tra):
# - JLPT N2 thật có 3 phần tính điểm, mỗi phần 0–60: "Kiến thức ngôn ngữ (từ vựng, ngữ pháp)", "Đọc hiểu" và "Nghe",
#   tổng 180; đỗ khi tổng ≥ 90 và mỗi phần đạt điểm liệt 19. Schema đề chỉ có listening/reading/writing, nên phần
#   kiến thức ngôn ngữ và phần đọc hiểu được gộp vào `reading` (section_max 60 + 60 = 120), phần nghe ở `listening` (60).
#   Hệ quả: kết quả không tách được điểm từ vựng – ngữ pháp với điểm đọc hiểu như phiếu điểm thật.
# - Ứng dụng chỉ xếp bậc theo tổng điểm quy đổi; điểm liệt từng phần KHÔNG được kiểm tra (ghi trong source_note_vi).
# - Điểm mỗi câu (`points`) là trọng số do Linguo đặt: JLPT dùng thang điểm quy đổi (equating) và không công bố điểm
#   từng câu. Câu đọc đoạn văn nặng hơn câu từ vựng vì mất nhiều thời gian hơn.
# - Thứ tự phần trong app là nghe → đọc (quy ước chung của mọi đề), còn đề thật thi từ vựng, ngữ pháp – đọc trước,
#   nghe sau.
# - Thời gian rút gọn theo số câu: đề thật N2 có 105 phút cho kiến thức ngôn ngữ · đọc hiểu (một buổi liền) và 50 phút
#   nghe.
# - Câu chữ theo lối đề N2: không chia khoảng trắng giữa các cụm từ, Kanji đến cấp N2.
# - Câu bị hỏi trong đoạn được đánh dấu bằng 【 】 thay cho gạch chân của đề giấy; chỗ trống là （　）, vị trí hỏi
#   trong câu sắp xếp là ★.
# - Phần nghe N2 thật không có dạng "nói gì trong tình huống" (発話表現) mà có thêm "hiểu tổng hợp" (統合理解, nghe
#   dài, nhiều người nói). Bản rút gọn này bỏ dạng 統合理解 và dùng lại các dạng câu đã có (task, point, gist,
#   response); câu "đáp lại ngay" có 3 phương án như đề thật, các câu khác có 4.
