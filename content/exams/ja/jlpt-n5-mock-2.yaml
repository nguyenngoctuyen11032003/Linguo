    kind: mcq
    question_type: jlpt_read_order
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Sắp xếp bốn phương án thành câu đúng và chọn từ đứng ở vị trí ★.
      stem: ★に 入る ものは どれですか。
      stem_lang: ja
      passage: わたしの ＿＿ ＿＿ ★ ＿＿ です。
      options:
        - { id: a, text: "日本語の", lang: ja }
        - { id: b, text: "先生", lang: ja }
        - { id: c, text: "は", lang: ja }
