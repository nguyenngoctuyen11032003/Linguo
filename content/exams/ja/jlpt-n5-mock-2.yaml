    answer: c
    explanation:
      vi: "Câu đúng là “わたしの 日本語の 先生 は 山田さん です” (thầy dạy tiếng Nhật của tôi là thầy Yamada): 日本語の bổ nghĩa cho 先生, rồi trợ từ chủ đề は, cuối cùng là 山田さん. Vị trí ★ là は."

  # --- Đọc hiểu đoạn ngắn (内容理解) ---
  - key: ja:examq:jlpt-n5-m2-r19
    section: reading
    kind: mcq
    question_type: jlpt_read_detail
    level_code: n5
    points: 4
    prompt:
      instruction_vi: Đọc đoạn văn và trả lời câu hỏi.
      stem: 「わたし」は かえりに 何で かえりましたか。
      stem_lang: ja
      passage: |-
        きのう、わたしは 友だちと うみへ 行きました。でんしゃで 一時間 かかりました。うみで およいで、おべんとうを 食べました。かえりは 雨が ふって いましたから、バスで かえりました。
      options:
        - { id: a, text: "バス", lang: ja }
        - { id: b, text: "でんしゃ", lang: ja }
        - { id: c, text: "あるいて", lang: ja }
        - { id: d, text: "タクシー", lang: ja }
    answer: a
    explanation:
      vi: "Câu cuối nói “かえりは 雨が ふって いましたから、バスで かえりました” (lúc về trời mưa nên về bằng xe buýt). でんしゃ là phương tiện lúc đi, không phải lúc về."

  - key: ja:examq:jlpt-n5-m2-r20
    section: reading
    kind: mcq
    question_type: jlpt_read_detail
    level_code: n5
    points: 4
    prompt:
      instruction_vi: Đọc tin nhắn và trả lời câu hỏi.
      stem: 田中さんは かいぎの 前に 何を しますか。
      stem_lang: ja
      passage: |-
        田中さんへ
        らいしゅうの かようびの かいぎは 2時では なくて、3時からに なりました。へやは かいぎしつBです。かいぎの 前に、しりょうを 15まい コピーして ください。よろしく おねがいします。
        山本
      options:
        - { id: a, text: "しりょうを コピーする", lang: ja }
        - { id: b, text: "かいぎしつに 入る", lang: ja }
        - { id: c, text: "3時に メールを おくる", lang: ja }
        - { id: d, text: "コーヒーを 買う", lang: ja }
    answer: a
    explanation:
      vi: "Yamamoto nhờ “かいぎの 前に、しりょうを 15まい コピーして ください” (trước cuộc họp hãy photo 15 bản tài liệu). 3時 là giờ họp mới (thay cho 2時), không phải giờ gửi mail; hai phương án b và d không được nhắc."

  # --- Tìm thông tin (情報検索) ---
  - key: ja:examq:jlpt-n5-m2-r21
    section: reading
    kind: mcq
    question_type: jlpt_read_info
    level_code: n5
    points: 4
    prompt:
      instruction_vi: Đọc thực đơn và chọn câu đúng với nội dung.
      stem: この レストランに ついて、ただしい ものは どれですか。
      stem_lang: ja
      passage: |-
