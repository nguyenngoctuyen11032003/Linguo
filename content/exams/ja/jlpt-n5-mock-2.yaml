questions:
  # ============================== NGHE (聴解) ==============================
  # --- Hiểu yêu cầu (課題理解) ---
  - key: ja:examq:jlpt-n5-m2-l01
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn thứ người phụ nữ sẽ mang theo ngày mai.
      stem: 女の 人は あした 何を もって いきますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：すずきさん、あした 山へ いきませんか。
        女の人：いいですね。何を もって いきますか。
        男の人：みずを もって きて ください。おべんとうは わたしが つくります。
        女の人：はい、わかりました。
      options:
        - { id: a, text: "みず", lang: ja }
        - { id: b, text: "おべんとう", lang: ja }
        - { id: c, text: "おべんとうと みず", lang: ja }
        - { id: d, text: "なにも もって いきません", lang: ja }
    answer: a
    explanation:
      vi: "Người đàn ông dặn “みずを もって きて ください” (hãy mang nước) và nói “おべんとうは わたしが つくります” (cơm hộp tôi làm). Vậy người phụ nữ chỉ mang nước. Phương án b và c là bẫy vì おべんとう được nhắc đến, nhưng người làm là người đàn ông."

  - key: ja:examq:jlpt-n5-m2-l02
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe giáo viên nói và chọn bài tập về nhà của học sinh.
      stem: しゅくだいは 何ですか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        先生：みなさん、きょうの しゅくだいです。本の 12ページを ノートに かいて ください。あした もって きて ください。
        学生：先生、ノートに かきますか。
        先生：はい、ノートに かいて ください。
      options:
        - { id: a, text: "本の 12ページを ノートに かく", lang: ja }
        - { id: b, text: "本の 12ページを よむ", lang: ja }
        - { id: c, text: "ノートを かう", lang: ja }
        - { id: d, text: "12ページを コピーする", lang: ja }
    answer: a
    explanation:
      vi: "Giáo viên nói “本の 12ページを ノートに かいて ください” (hãy chép trang 12 của sách vào vở) và học sinh hỏi lại để xác nhận. Đọc (よむ), mua vở hay photo đều không được nhắc đến."

  - key: ja:examq:jlpt-n5-m2-l03
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe điện thoại và chọn việc người đàn ông làm ĐẦU TIÊN.
      stem: 男の 人は まず 何を しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：もしもし、田中さん、いま どこですか。
        男の人：えきです。いまから そちらへ 行きます。
        女の人：あ、その 前に、コンビニで コーヒーを 二つ かって きて ください。
        男の人：はい、わかりました。コーヒーを かってから、会社へ 行きます。
      options:
        - { id: a, text: "コンビニで コーヒーを 買う", lang: ja }
        - { id: b, text: "会社へ 行く", lang: ja }
        - { id: c, text: "えきで 友だちに 会う", lang: ja }
        - { id: d, text: "女の 人に でんわを する", lang: ja }
    answer: a
    explanation:
      vi: "Người phụ nữ nhờ “その 前に、コンビニで コーヒーを 二つ かって きて ください” (trước đó hãy mua hai ly cà phê ở cửa hàng tiện lợi). Người đàn ông nói sẽ 買ってから 会社へ 行く (mua xong rồi mới đến công ty), nên việc đầu tiên là mua cà phê. Đi đến công ty là việc sau."

  # --- Hiểu điểm chính (ポイント理解) ---
  - key: ja:examq:jlpt-n5-m2-l04
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn lý do người phụ nữ nghỉ học.
      stem: 女の 人は どうして 学校を 休みましたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：きのう どうして 休みましたか。
        女の人：かぜを ひきました。あたまが いたくて、ねつも ありました。
        男の人：そうですか。もう だいじょうぶですか。
        女の人：はい、いまは げんきです。
      options:
        - { id: a, text: "かぜを ひいたから", lang: ja }
        - { id: b, text: "かぞくが びょういんへ 行ったから", lang: ja }
        - { id: c, text: "テストが あったから", lang: ja }
        - { id: d, text: "りょこうに 行ったから", lang: ja }
    answer: a
    explanation:
      vi: "Người phụ nữ nói “かぜを ひきました” (bị cảm), lại đau đầu và sốt. Câu cuối “いまは げんきです” chỉ nói hiện giờ đã khoẻ, không phải lý do nghỉ. Các lý do còn lại không xuất hiện trong hội thoại."

  - key: ja:examq:jlpt-n5-m2-l05
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn món người đàn ông thích hơn.
      stem: 男の 人は にくと さかなと どちらが すきですか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：山田さんは 何が すきですか。
        男の人：わたしは にくより さかなの ほうが すきです。とくに さしみが すきです。
        女の人：にくは 食べませんか。
        男の人：ときどき ぎゅうにくも 食べますよ。
      options:
        - { id: a, text: "にく", lang: ja }
        - { id: b, text: "さかな", lang: ja }
        - { id: c, text: "どちらも すき", lang: ja }
        - { id: d, text: "どちらも すきじゃ ありません", lang: ja }
    answer: b
    explanation:
      vi: "Mẫu “Aより Bのほうが すきです” nghĩa là thích B hơn A: にくより さかなの ほうが すき → thích cá hơn thịt. Việc anh ấy “ときどき” ăn thịt bò chỉ cho biết anh vẫn ăn thịt, không có nghĩa là thích thịt hơn."

  - key: ja:examq:jlpt-n5-m2-l06
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n5
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở hiệu sách và chọn số tiền người phụ nữ trả.
      stem: 女の 人は いくら はらいますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、この 本は いくらですか。
        男の人：1,200円です。
        女の人：ちょっと 高いですね。あちらの 本は？
        男の人：あれは 800円です。
        女の人：じゃあ、あれを ください。
      options:
        - { id: a, text: "800円", lang: ja }
        - { id: b, text: "1,200円", lang: ja }
        - { id: c, text: "2,000円", lang: ja }
        - { id: d, text: "400円", lang: ja }
    answer: a
    explanation:
      vi: "Người phụ nữ thấy cuốn 1.200 yên hơi đắt nên chọn cuốn kia, “あれを ください” (cho tôi cuốn đó), giá 800 yên. 2.000円 là tổng của hai cuốn nhưng chị chỉ mua một cuốn."

  # --- Nói gì trong tình huống (発話表現) ---
  - key: ja:examq:jlpt-n5-m2-l07
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        ごはんを 食べる 前です。何と 言いますか。
      options:
        - { id: a, text: "いただきます。", lang: ja }
        - { id: b, text: "ごちそうさまでした。", lang: ja }
        - { id: c, text: "いってきます。", lang: ja }
    answer: a
    explanation:
      vi: "Trước khi ăn người Nhật nói “いただきます”. “ごちそうさまでした” nói sau khi ăn xong, còn “いってきます” là câu nói khi rời nhà."

  - key: ja:examq:jlpt-n5-m2-l08
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        友だちの たんじょうびです。何と 言いますか。
      options:
        - { id: a, text: "おたんじょうび おめでとう。", lang: ja }
        - { id: b, text: "いってらっしゃい。", lang: ja }
        - { id: c, text: "ごめんなさい。", lang: ja }
    answer: a
    explanation:
      vi: "Chúc mừng sinh nhật là “おたんじょうび おめでとう” (với người trên thì thêm ございます). “いってらっしゃい” là lời tiễn người ra khỏi nhà, “ごめんなさい” là lời xin lỗi."

  # --- Đáp lại ngay (即時応答) ---
  - key: ja:examq:jlpt-n5-m2-l09
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：しゅうまつは 何を しましたか。
      options:
        - { id: a, text: "友だちと えいがを 見ました。", lang: ja }
        - { id: b, text: "あした しゅくだいを します。", lang: ja }
        - { id: c, text: "テレビが すきです。", lang: ja }
    answer: a
    explanation:
      vi: "“何を しましたか” hỏi điều đã làm vào cuối tuần, nên trả lời bằng câu quá khứ: “友だちと えいがを 見ました”. Câu b nói về ngày mai (tương lai), câu c nói về sở thích chứ không nói điều đã làm."

  - key: ja:examq:jlpt-n5-m2-l10
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：となりに すわっても いいですか。
      options:
        - { id: a, text: "ええ、どうぞ。", lang: ja }
        - { id: b, text: "いいえ、すわって います。", lang: ja }
        - { id: c, text: "どういたしまして。", lang: ja }
    answer: a
    explanation:
      vi: "“〜ても いいですか” là xin phép (tôi ngồi cạnh được không?), nên đồng ý bằng “ええ、どうぞ” (vâng, xin mời). “どういたしまして” chỉ dùng đáp lại lời cảm ơn."

  # ============================== CHỮ – TỪ VỰNG – NGỮ PHÁP – ĐỌC (言語知識・読解) ==============================
  # --- Đọc Kanji (漢字読み) ---
  - key: ja:examq:jlpt-n5-m2-r01
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: あそこに 【男】の 人が たって います。
      options:
        - { id: a, text: "おとこ", lang: ja }
        - { id: b, text: "おんな", lang: ja }
        - { id: c, text: "おとご", lang: ja }
        - { id: d, text: "おどこ", lang: ja }
    answer: a
    explanation:
      vi: "男 (đàn ông) đọc là おとこ. おんな là 女 (phụ nữ), hai chữ này dễ nhầm; おとご và おどこ không phải từ tiếng Nhật."

  - key: ja:examq:jlpt-n5-m2-r02
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【駅】で 友だちを まちます。
      options:
        - { id: a, text: "えき", lang: ja }
        - { id: b, text: "えぎ", lang: ja }
        - { id: c, text: "いき", lang: ja }
        - { id: d, text: "やく", lang: ja }
    answer: a
    explanation:
      vi: "駅 (nhà ga) đọc là えき, cả hai âm đều trong, không đục. いき là 息 (hơi thở) hoặc 行き (chiều đi), không phải cách đọc của 駅."

  - key: ja:examq:jlpt-n5-m2-r03
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 【五月】に 日本へ 行きます。
      options:
        - { id: a, text: "ごがつ", lang: ja }
        - { id: b, text: "ごげつ", lang: ja }
        - { id: c, text: "いつつき", lang: ja }
        - { id: d, text: "ごつき", lang: ja }
    answer: a
    explanation:
      vi: "Tên tháng đọc theo số rồi thêm がつ: 五月 là ごがつ (tháng 5). げつ xuất hiện trong 月よう日 (げつようび) hoặc để đếm tháng (ごかげつ), không dùng cho tên tháng."

  - key: ja:examq:jlpt-n5-m2-r04
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: この クラスの 【学生】は 十人です。
      options:
        - { id: a, text: "がくせい", lang: ja }
        - { id: b, text: "がっせい", lang: ja }
        - { id: c, text: "がくしょう", lang: ja }
        - { id: d, text: "まなせい", lang: ja }
    answer: a
    explanation:
      vi: "学生 (sinh viên, học sinh) đọc là がくせい. 学 đọc がく, 生 đọc せい (trường âm). Người Việt dễ đọc nhầm thành がくしょう; hãy nhớ 生 trong cả 学生 và 先生 đều đọc せい."

