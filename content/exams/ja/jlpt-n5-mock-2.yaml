        ・日よう日は ランチが ありません。
      options:
        - { id: a, text: "Aセットは 800円で、さかなです。", lang: ja }
        - { id: b, text: "日よう日も ランチが あります。", lang: ja }
        - { id: c, text: "ランチは ごご 3時までです。", lang: ja }
        - { id: d, text: "Bセットには のみものが つきません。", lang: ja }
    answer: a
    explanation:
      vi: "Dòng thứ hai ghi “Aセット 800円（さかな）”, nên a đúng. Chủ nhật không có bữa trưa, bữa trưa chỉ đến 2 giờ chiều, và cả hai set đều kèm salad và đồ uống."
