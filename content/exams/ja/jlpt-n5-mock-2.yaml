    answer: a
    explanation:
      vi: "ほん (sách) viết là 本: chữ 木 (cây) thêm một nét ngang dưới gốc. 木 đọc là き, 末 là まつ, 未 là み — đều là chữ có thật nhưng khác nghĩa."

  - key: ja:examq:jlpt-n5-m2-r06
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: 毎朝 【みず】を のみます。
      options:
        - { id: a, text: "水", lang: ja }
        - { id: b, text: "氷", lang: ja }
        - { id: c, text: "永", lang: ja }
        - { id: d, text: "木", lang: ja }
    answer: a
    explanation:
      vi: "みず (nước) viết là 水. 氷 (こおり, băng) có thêm một chấm bên trái, 永 (えい, vĩnh cửu) thêm một nét ngang ở trên, 木 (き) là cây."

  - key: ja:examq:jlpt-n5-m2-r07
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: 【あたらしい】 くつを かいました。
      options:
        - { id: a, text: "新しい", lang: ja }
        - { id: b, text: "親しい", lang: ja }
        - { id: c, text: "辛しい", lang: ja }
        - { id: d, text: "薪しい", lang: ja }
    answer: a
    explanation:
      vi: "あたらしい (mới) viết là 新しい: bên trái 亲 + 斤 (cái rìu) ở bên phải. 親しい là したしい (thân thiết); 辛 và 薪 không đi với しい để tạo từ này."

  # --- Từ hợp ngữ cảnh (文脈規定) ---
  - key: ja:examq:jlpt-n5-m2-r08
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: ちょっと つかれました。いすに （　） ください。
      options:
        - { id: a, text: "すわって", lang: ja }
        - { id: b, text: "たって", lang: ja }
        - { id: c, text: "ねて", lang: ja }
        - { id: d, text: "あるいて", lang: ja }
    answer: a
    explanation:
      vi: "Mệt nên mời ngồi lên ghế: いすに すわって ください. たって (đứng), あるいて (đi bộ) trái với ý nghỉ ngơi; ねて (nằm ngủ) không đi với いす."

  - key: ja:examq:jlpt-n5-m2-r09
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: 山田さんは ピアノが （　）です。いつも きれいに ひきます。
      options:
        - { id: a, text: "じょうず", lang: ja }
        - { id: b, text: "おおきい", lang: ja }
        - { id: c, text: "いそがしい", lang: ja }
        - { id: d, text: "あかるい", lang: ja }
    answer: a
    explanation:
      vi: "“ピアノが じょうずです” là “chơi piano giỏi”, hợp với vế sau (lúc nào cũng chơi rất hay). おおきい (to), いそがしい (bận), あかるい (sáng) không ghép với ピアノが để nói về khả năng."

  - key: ja:examq:jlpt-n5-m2-r10
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: いま、そとは 雨が （　） います。
      options:
        - { id: a, text: "ふって", lang: ja }
        - { id: b, text: "とんで", lang: ja }
        - { id: c, text: "さいて", lang: ja }
        - { id: d, text: "ひいて", lang: ja }
    answer: a
    explanation:
      vi: "Mưa rơi là 雨が ふる; đang mưa là 雨が ふって います. とんで (bay), さいて (nở), ひいて (kéo, chơi đàn) đều không đi với 雨."

  # --- Câu đồng nghĩa (言い換え類義) ---
  - key: ja:examq:jlpt-n5-m2-r11
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【ちちは かいしゃいんです。】
      options:
        - { id: a, text: "ちちは かいしゃで はたらいて います。", lang: ja }
        - { id: b, text: "ちちは 学生です。", lang: ja }
        - { id: c, text: "ちちは 先生です。", lang: ja }
        - { id: d, text: "ちちは かいしゃが すきです。", lang: ja }
    answer: a
    explanation:
      vi: "かいしゃいん là “nhân viên công ty”, tức là làm việc ở công ty: かいしゃで はたらいて います. Câu d là bẫy: thích công ty (すき) không có nghĩa là làm ở đó."

  - key: ja:examq:jlpt-n5-m2-r12
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n5
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【ここは えきから ちかいです。】
      options:
        - { id: a, text: "ここは えきから とおくないです。", lang: ja }
        - { id: b, text: "ここは えきから とおいです。", lang: ja }
        - { id: c, text: "ここには えきが ありません。", lang: ja }
        - { id: d, text: "ここは えきの 中です。", lang: ja }
    answer: a
    explanation:
      vi: "ちかい (gần) nghĩa là “không xa”: とおくないです. とおい (xa) ngược nghĩa; “えきの 中” (trong nhà ga) là ở ngay trong ga chứ không phải “gần ga”."

  # --- Ngữ pháp (文法形式の判断) ---
  - key: ja:examq:jlpt-n5-m2-r13
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: あした 友だち（　） いっしょに えいがを 見ます。
      options:
        - { id: a, text: "と", lang: ja }
        - { id: b, text: "を", lang: ja }
        - { id: c, text: "まで", lang: ja }
        - { id: d, text: "から", lang: ja }
    answer: a
    explanation:
      vi: "“người と いっしょに V” nghĩa là cùng với ai làm gì: 友だちと いっしょに. を đánh dấu đối tượng của động từ, まで và から chỉ giới hạn thời gian hoặc nơi chốn."

  - key: ja:examq:jlpt-n5-m2-r14
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: |-
        A「きのうの パーティーは どう（　）か。」
        B「とても たのしかったです。」
      options:
        - { id: a, text: "でした", lang: ja }
        - { id: b, text: "です", lang: ja }
        - { id: c, text: "じゃ ありません", lang: ja }
        - { id: d, text: "ました", lang: ja }
    answer: a
    explanation:
      vi: "きのう (hôm qua) đòi thì quá khứ, và câu hỏi cảm tưởng là “どうでしたか” (thế nào?). どうです là thì hiện tại, còn どう + ました không tạo thành câu đúng."

  - key: ja:examq:jlpt-n5-m2-r15
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: ねこ（　） いぬの ほうが すきです。
      options:
        - { id: a, text: "より", lang: ja }
        - { id: b, text: "から", lang: ja }
        - { id: c, text: "ほど", lang: ja }
        - { id: d, text: "だけ", lang: ja }
    answer: a
    explanation:
      vi: "Mẫu so sánh “A より Bの ほうが すきです” nghĩa là thích B hơn A: ねこより いぬの ほうが (thích chó hơn mèo). ほど chỉ đi với câu phủ định khi so sánh, từ から và だけ không tạo nghĩa so sánh."

  - key: ja:examq:jlpt-n5-m2-r16
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: ここで しゃしんを とっては （　）。
      options:
        - { id: a, text: "いけません", lang: ja }
        - { id: b, text: "ありません", lang: ja }
        - { id: c, text: "できません", lang: ja }
        - { id: d, text: "ください", lang: ja }
    answer: a
    explanation:
      vi: "“V-ては いけません” là mẫu cấm đoán: とっては いけません (không được chụp ảnh). ありません và できません không đi sau ては theo cách này, còn ください thì đi với thể て chứ không phải ては."

  # --- Sắp xếp câu (文の組み立て) ---
  - key: ja:examq:jlpt-n5-m2-r17
