    kind: mcq
    question_type: jlpt_read_order
    level_code: n5
    points: 2
    prompt:
      instruction_vi: Sắp xếp bốn phương án thành câu đúng và chọn từ đứng ở vị trí ★.
      stem: ★に 入る ものは どれですか。
      stem_lang: ja
      passage: えきの ＿＿ ＿＿ ★ ＿＿ あります。
      options:
        - { id: a, text: "ちかくに", lang: ja }
        - { id: b, text: "銀行と", lang: ja }
        - { id: c, text: "大きい", lang: ja }
        - { id: d, text: "こうえんが", lang: ja }
    answer: c
    explanation:
      vi: "Câu đúng là “えきの ちかくに 銀行と 大きい こうえんが あります” (gần ga có ngân hàng và một công viên lớn): chỗ chốn + に, rồi các vật liệt kê bằng と, tính từ 大きい đứng ngay trước danh từ こうえん. Từ ở vị trí ★ là 大きい."

  - key: ja:examq:jlpt-n5-m2-r18
