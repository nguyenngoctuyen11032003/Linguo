        - { id: b, text: "5月中に申請書を郵送すれば、事前相談を受けなくても最大50万円の助成が受けられる。", lang: ja }
        - { id: c, text: "4月中に事前相談を受ければ、最大30万円の助成が受けられる。", lang: ja }
        - { id: d, text: "構成員への謝礼を対象経費に加えれば、最大50万円の助成が受けられる。", lang: ja }
