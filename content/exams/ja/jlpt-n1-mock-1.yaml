      vi: "Hội có 8 người đều sống trong thành phố nên đủ điều kiện. Mục B bắt buộc tư vấn trước trong tháng 4 (b sai). Mức hỗ trợ là tối đa 2/3 chi phí: 60 vạn × 2/3 = 40 vạn yên, thấp hơn trần 50 vạn, nên tối đa 40 vạn (c lấy nhầm trần 30 vạn của mục A). Thù lao cho thành viên không được tính vào chi phí (d sai)."
