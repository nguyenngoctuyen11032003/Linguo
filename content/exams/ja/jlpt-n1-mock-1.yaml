# Bài luyện mô phỏng JLPT N1 do Linguo tự soạn (nguồn src:linguo-demo). Không phải đề thi chính thức,
# không chép đề thật hay sách luyện thi có bản quyền. Nghe: lời thoại trong `script`, ứng dụng đọc bằng giọng máy
# khi chưa có audio (audio_asset_id: null).
#
# Giả định về cấu trúc và thang điểm (ghi lại để người duyệt kiểm tra):
# - JLPT N1 thật có 3 phần tính điểm, mỗi phần 0–60: "Kiến thức ngôn ngữ (chữ, từ vựng, ngữ pháp)", "Đọc hiểu" và
#   "Nghe", tổng 180; đỗ khi tổng ≥ 100 và mỗi phần đạt điểm liệt 19. Schema đề chỉ có listening/reading/writing, nên
#   phần kiến thức ngôn ngữ và phần đọc hiểu được gộp vào `reading` (section_max 60 + 60 = 120), phần nghe ở
#   `listening` (60). Hệ quả: kết quả không tách được điểm từ vựng – ngữ pháp với điểm đọc hiểu như phiếu điểm thật.
# - Ứng dụng chỉ xếp bậc theo tổng điểm quy đổi; điểm liệt từng phần KHÔNG được kiểm tra (ghi trong source_note_vi).
#   Đề N1 chỉ có một bậc (n1): đề JLPT thật không xếp N2 cho người trượt N1.
# - Điểm mỗi câu (`points`) là trọng số do Linguo đặt: JLPT dùng thang điểm quy đổi (equating) và không công bố điểm
#   từng câu. Câu đọc đoạn văn nặng hơn câu từ vựng vì mất nhiều thời gian hơn.
# - Thứ tự phần trong app là nghe → đọc (quy ước chung của mọi đề), còn đề thật thi kiến thức ngôn ngữ · đọc trước,
#   nghe sau.
# - Thời gian rút gọn theo số câu: đề thật N1 có 110 phút cho kiến thức ngôn ngữ · đọc hiểu và 55 phút nghe (từ kỳ
#   12/2022). Đoạn đọc và lời thoại N1 dài hơn N3 nên thời gian cho mỗi câu ở đây cũng dài hơn đề N3.
# - Dạng câu theo đề N1: không có "viết Kanji" (表記) và "nói gì trong tình huống" (発話表現) như N3; có thêm "ngữ pháp
#   trong đoạn văn" (文章の文法), "đọc tổng hợp" (統合理解), "hiểu luận điểm" (主張理解) và "nghe tổng hợp" (統合理解).
#   Các dạng mới dùng lại tag sẵn có để nhãn luyện theo dạng câu trong app vẫn đúng: 文章の文法 → jlpt_read_grammar,
#   đọc tổng hợp và hiểu luận điểm → jlpt_read_detail, nghe tổng hợp → jlpt_listen_point.
# - Câu chữ theo lối đề N1: không chia khoảng trắng giữa các cụm từ, Kanji không giới hạn cấp.
# - Câu bị hỏi trong đoạn được đánh dấu bằng 【 】 thay cho gạch chân của đề giấy; chỗ trống là （　）, vị trí hỏi
#   trong câu sắp xếp là ★.
# - Câu "đáp lại ngay" có 3 phương án như đề thật; các câu khác có 4.
