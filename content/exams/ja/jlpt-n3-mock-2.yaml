# Bài luyện mô phỏng JLPT N3 số 2 do Linguo tự soạn (nguồn src:linguo-demo). Không phải đề thi chính thức,
# không chép đề thật hay sách luyện thi có bản quyền. Nội dung mới, không trùng đề số 1. Nghe: lời thoại trong
# `script`, ứng dụng đọc bằng giọng máy khi chưa có audio (audio_asset_id: null).
#
# Cấu trúc và thang điểm giống hệt đề số 1 (xem phần giả định ở jlpt-n3-mock-1.yaml):
# - JLPT N3 thật có 3 phần tính điểm, mỗi phần 0–60 (Kiến thức ngôn ngữ, Đọc hiểu, Nghe), tổng 180; đỗ khi tổng ≥ 95
#   và mỗi phần đạt điểm liệt 19. Kiến thức ngôn ngữ và Đọc hiểu được gộp vào `reading` (section_max 120), phần nghe ở
#   `listening` (60). Ứng dụng chỉ xếp bậc theo tổng điểm quy đổi; điểm liệt từng phần KHÔNG được kiểm tra.
# - Điểm mỗi câu (`points`) là trọng số do Linguo đặt, không phải điểm thật của JLPT.
# - Thời gian rút gọn theo số câu: đề thật N3 có 30 + 70 phút cho kiến thức ngôn ngữ · đọc hiểu và 40 phút nghe.
# - Câu chữ theo lối đề N3: không chia khoảng trắng giữa các cụm từ, Kanji đến cấp N3.
# - Câu bị hỏi trong đoạn được đánh dấu bằng 【 】; chỗ trống là （　）, vị trí hỏi trong câu sắp xếp là ★.
# - Câu "nói gì trong tình huống" và "đáp lại ngay" có 3 phương án như đề thật; các câu khác có 4.
