        - { id: c, text: "かえして", lang: ja }
        - { id: d, text: "あげて", lang: ja }
    answer: a
    explanation:
      vi: "Đứng đợi bạn là 友達を まつ → まって いました (đã đợi suốt 30 phút). あつめる (thu thập), かえす (trả lại), あげる (cho, nâng lên) không hợp với 友達を và 30分も."

  - key: ja:examq:jlpt-n4-m2-r09
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: この 道は 車が 多くて、とても （　）です。気を つけて ください。
      options:
        - { id: a, text: "あぶない", lang: ja }
