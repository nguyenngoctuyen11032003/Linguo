  # --- Từ hợp ngữ cảnh (文脈規定) ---
  - key: ja:examq:jlpt-n4-m2-r07
    section: reading
    kind: mcq
    question_type: jlpt_read_vocab
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: （　）に 何を 入れますか。
      stem_lang: ja
      passage: パソコンが （　） しまったので、修理に 出しました。
      options:
        - { id: a, text: "こわれて", lang: ja }
        - { id: b, text: "やぶれて", lang: ja }
        - { id: c, text: "われて", lang: ja }
        - { id: d, text: "きれて", lang: ja }
    answer: a
    explanation:
      vi: "Máy móc bị hỏng là こわれる. やぶれる dùng cho giấy, vải bị rách; われる cho đồ thuỷ tinh, đĩa bị vỡ; きれる cho dây, quan hệ bị đứt. Cả bốn đều là nội động từ nên dùng được với ～て しまいました."

  - key: ja:examq:jlpt-n4-m2-r08
    section: reading
