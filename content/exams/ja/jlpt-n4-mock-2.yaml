# Bài luyện mô phỏng JLPT N4 số 2 do Linguo tự soạn (nguồn src:linguo-demo). Không phải đề thi chính thức,
# không chép đề thật hay sách luyện thi có bản quyền. Nội dung mới, không trùng đề số 1. Nghe: lời thoại trong
# `script`, ứng dụng đọc bằng giọng máy khi chưa có audio (audio_asset_id: null).
#
# Cấu trúc và thang điểm giống hệt đề số 1 (xem phần giả định ở jlpt-n4-mock-1.yaml):
# - JLPT N4 thật có 2 phần tính điểm: "Kiến thức ngôn ngữ (chữ, từ vựng, ngữ pháp) · Đọc hiểu" 0–120 và "Nghe" 0–60,
#   tổng 180; đỗ khi tổng ≥ 90 và mỗi phần đạt điểm liệt (38/120, 19/60). Toàn bộ phần chữ – từ vựng – ngữ pháp – đọc
#   hiểu nằm ở `reading` (section_max 120), phần nghe ở `listening` (60).
# - Ứng dụng chỉ xếp bậc theo tổng điểm quy đổi; điểm liệt từng phần KHÔNG được kiểm tra. Đề N4 chỉ có một bậc (n4).
# - Điểm mỗi câu (`points`) là trọng số do Linguo đặt, không phải điểm thật của JLPT.
# - Thời gian rút gọn theo số câu: đề thật N4 có 25 + 55 phút cho kiến thức ngôn ngữ · đọc hiểu và 35 phút nghe.
# - Câu chữ theo lối đề N4: có khoảng trắng giữa các cụm từ, Kanji đến cấp N4. Kanji vượt cấp được viết bằng kana.
# - Câu bị hỏi trong đoạn được đánh dấu bằng 【 】; chỗ trống là （　）, vị trí hỏi trong câu sắp xếp là ★.
# - Câu "nói gì trong tình huống" và "đáp lại ngay" có 3 phương án như đề thật; các câu khác có 4.
