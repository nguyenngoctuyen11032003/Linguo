questions:
  # ============================== NGHE (聴解) ==============================
  # --- Hiểu yêu cầu (課題理解) ---
  - key: ja:examq:jlpt-n4-m2-l01
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở công ty và chọn việc người đàn ông làm TRƯỚC TIÊN.
      stem: 男の 人は まず 何を しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：田中さん、来週の 会議の 準備は できましたか。
        男の人：はい、資料は 作りました。でも、まだ コピーして いません。
        女の人：じゃあ、まず 部長に 資料を 見せて ください。コピーは その あとで いいです。
        男の人：わかりました。
      options:
        - { id: a, text: "資料を コピーする", lang: ja }
        - { id: b, text: "部長に 資料を 見せる", lang: ja }
        - { id: c, text: "資料を 作る", lang: ja }
        - { id: d, text: "会議室を よやくする", lang: ja }
    answer: b
    explanation:
      vi: "Người phụ nữ nói “まず 部長に 資料を 見せて ください” (trước hết hãy cho trưởng phòng xem tài liệu) và “コピーは その あとで いいです” (photo để sau cũng được). Tài liệu đã làm xong (作りました) nên c sai; phương án a là bẫy vì việc photo vẫn phải làm nhưng ở sau."

  - key: ja:examq:jlpt-n4-m2-l02
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại của hai người đi du lịch và chọn việc người phụ nữ làm.
      stem: 女の 人は これから 何を しますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：ホテルは もう よやくしましたか。
        男の人：いいえ、まだです。今晩 インターネットで さがします。
        女の人：じゃあ、わたしは 先に 飛行機の 切符を 買って おきますね。
        男の人：おねがいします。
      options:
        - { id: a, text: "ホテルを よやくする", lang: ja }
        - { id: b, text: "飛行機の 切符を 買う", lang: ja }
        - { id: c, text: "ホテルを さがす", lang: ja }
        - { id: d, text: "インターネットで 地図を 見る", lang: ja }
    answer: b
    explanation:
      vi: "Người phụ nữ nói “飛行機の 切符を 買って おきます” (tôi sẽ mua sẵn vé máy bay). Việc tìm khách sạn trên mạng là của người đàn ông (今晩 インターネットで さがします), nên a và c sai."

  - key: ja:examq:jlpt-n4-m2-l03
    section: listening
    kind: mcq
    question_type: jlpt_listen_task
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại giữa mẹ và con trai và chọn những thứ cậu bé mang đi ngày mai.
      stem: 男の子は あした 何を 持って 行きますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の子：お母さん、あした 遠足だよ。何を 持って 行く？
        母：おべんとうと 水と、それから 雨が ふったら かさも 持って 行きなさい。
        男の子：でも、天気よほうは 晴れだよ。
        母：そう。じゃあ、かさは いらないね。でも、ぼうしは かぶって 行ってね。
      options:
        - { id: a, text: "おべんとうと 水", lang: ja }
        - { id: b, text: "おべんとうと 水と かさ", lang: ja }
        - { id: c, text: "おべんとうと 水と ぼうし", lang: ja }
        - { id: d, text: "おべんとうと かさと ぼうし", lang: ja }
    answer: c
    explanation:
      vi: "Tin dự báo là trời nắng (晴れ) nên mẹ nói “かさは いらないね” (không cần ô). Mẹ dặn thêm “ぼうしは かぶって 行ってね” (hãy đội mũ đi), nên ngoài cơm hộp và nước còn có mũ. Phương án b, d là bẫy vì có ô."

  # --- Hiểu điểm chính (ポイント理解) ---
  - key: ja:examq:jlpt-n4-m2-l04
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn lý do người phụ nữ không liên lạc.
      stem: 女の 人は どうして 連絡しませんでしたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：どうして おくれたんですか。
        女の人：すみません。電車が 事故で とまって しまって…。
        男の人：連絡して くれれば よかったのに。
        女の人：携帯の 電池が なかったんです。
      options:
        - { id: a, text: "電車が とまったから", lang: ja }
        - { id: b, text: "携帯の 電池が なかったから", lang: ja }
        - { id: c, text: "連絡するのを 忘れたから", lang: ja }
        - { id: d, text: "男の 人の 電話番号を 知らなかったから", lang: ja }
    answer: b
    explanation:
      vi: "Khi bị trách vì không báo, người phụ nữ giải thích “携帯の 電池が なかったんです” (điện thoại hết pin). Tàu dừng là lý do chị đến muộn, không phải lý do không liên lạc — đây là bẫy vì câu hỏi chỉ hỏi về việc không báo."

  - key: ja:examq:jlpt-n4-m2-l05
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại và chọn điều đúng về ngày Chủ nhật của người phụ nữ.
      stem: 女の 人の 日曜日は どうでしたか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：週末は どこか 行きましたか。
        女の人：土曜日は 家で そうじを して、日曜日は 友達と 公園へ 行きました。
        男の人：天気が よかったですね。
        女の人：はい。でも、昼ごはんを 食べた あとで 雨が ふって きたので、早く 帰りました。
      options:
        - { id: a, text: "一日中 公園に いた", lang: ja }
        - { id: b, text: "公園へ 行ったが、雨で 早く 帰った", lang: ja }
        - { id: c, text: "家で そうじを した", lang: ja }
        - { id: d, text: "友達の 家へ 行った", lang: ja }
    answer: b
    explanation:
      vi: "Chủ nhật chị đi công viên với bạn nhưng sau bữa trưa trời mưa nên “早く 帰りました” (về sớm). Phương án c là việc của thứ Bảy (家で そうじ), không phải Chủ nhật."

  - key: ja:examq:jlpt-n4-m2-l06
    section: listening
    kind: mcq
    question_type: jlpt_listen_point
    level_code: n4
    points: 3
    prompt:
      instruction_vi: Nghe hội thoại ở cửa hàng và chọn giờ hiện tại.
      stem: いま 何時ですか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、この 店は 何時までですか。
        男の人：平日は 夜 9時までですが、日曜日は 6時までです。
        女の人：きょうは 日曜日ですね。
        男の人：はい。あと 30分で 閉まります。
      options:
        - { id: a, text: "5時30分", lang: ja }
        - { id: b, text: "6時30分", lang: ja }
        - { id: c, text: "8時30分", lang: ja }
        - { id: d, text: "9時30分", lang: ja }
    answer: a
    explanation:
      vi: "Hôm nay là Chủ nhật nên cửa hàng đóng lúc 6 giờ, và nhân viên nói “あと 30分で 閉まります” (30 phút nữa đóng cửa). Vậy bây giờ là 5 giờ 30. Giờ đóng cửa ngày thường là 9 giờ nên c, d là bẫy."

  # --- Nói gì trong tình huống (発話表現) ---
  - key: ja:examq:jlpt-n4-m2-l07
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        友達の 家で 夕ごはんを ごちそうに なりました。もう 遅いので 帰ります。何と 言いますか。
      options:
        - { id: a, text: "そろそろ しつれいします。", lang: ja }
        - { id: b, text: "おじゃまします。", lang: ja }
        - { id: c, text: "ごめんください。", lang: ja }
    answer: a
    explanation:
      vi: "Khi định ra về, người Nhật nói “そろそろ しつれいします” (cũng sắp đến lúc tôi xin phép về). “おじゃまします” và “ごめんください” đều là câu nói lúc bước vào nhà."

  - key: ja:examq:jlpt-n4-m2-l08
    section: listening
    kind: mcq
    question_type: jlpt_listen_utterance
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe tình huống và chọn câu nói phù hợp.
      stem: この とき、何と 言いますか。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        先生の 本を かりたいです。先生に 何と 言いますか。
      options:
        - { id: a, text: "この 本を 貸して いただけませんか。", lang: ja }
        - { id: b, text: "この 本を 貸して あげましょうか。", lang: ja }
        - { id: c, text: "この 本を 借りて くれますか。", lang: ja }
    answer: a
    explanation:
      vi: "Nhờ người trên cho mượn đồ dùng “貸して いただけませんか” (xin thầy cho em mượn được không ạ). b là lời đề nghị cho người khác mượn; c nghĩa là “nhờ ai mượn giúp” nên sai cả chiều hành động lẫn mức lịch sự."

  # --- Đáp lại ngay (即時応答) ---
  - key: ja:examq:jlpt-n4-m2-l09
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        男の人：あした 何時に 来れば いいですか。
      options:
        - { id: a, text: "9時に 来て ください。", lang: ja }
        - { id: b, text: "9時に 行きました。", lang: ja }
        - { id: c, text: "はい、9時です。", lang: ja }
    answer: a
    explanation:
      vi: "“何時に 来れば いいですか” hỏi nên đến lúc mấy giờ, nên trả lời bằng chỉ dẫn “9時に 来て ください”. b nói về việc đã xảy ra, c bắt đầu bằng “はい” trong khi đây không phải câu hỏi có/không."

  - key: ja:examq:jlpt-n4-m2-l10
    section: listening
    kind: mcq
    question_type: jlpt_listen_response
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Nghe câu nói và chọn câu đáp lại phù hợp.
      stem: ただしい こたえを えらんで ください。
      stem_lang: ja
      audio_asset_id: null
      script: |-
        女の人：すみません、その かばん、見せて もらえませんか。
      options:
        - { id: a, text: "はい、どうぞ。", lang: ja }
        - { id: b, text: "はい、見て います。", lang: ja }
        - { id: c, text: "いいえ、わたしのです。", lang: ja }
    answer: a
    explanation:
      vi: "“見せて もらえませんか” là lời nhờ cho xem, nên nhận lời bằng “はい、どうぞ”. b trả lời như thể được hỏi “đang xem à”, c không đáp ứng lời nhờ."

  # ============================== CHỮ – TỪ VỰNG – NGỮ PHÁP – ĐỌC (言語知識・読解) ==============================
  # --- Đọc Kanji (漢字読み) ---
  - key: ja:examq:jlpt-n4-m2-r01
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: みんなの 【意見】を 聞いて から、決めましょう。
      options:
        - { id: a, text: "いけん", lang: ja }
        - { id: b, text: "いげん", lang: ja }
        - { id: c, text: "いっけん", lang: ja }
        - { id: d, text: "いみん", lang: ja }
    answer: a
    explanation:
      vi: "意見 (ý kiến) đọc là いけん: 意 đọc い, 見 đọc けん (âm Hán), không phải み như trong 見る. Các phương án còn lại đổi âm đục hoặc thêm っ không có trong từ này."

  - key: ja:examq:jlpt-n4-m2-r02
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: 毎日 【自転車】で 会社に 行きます。
      options:
        - { id: a, text: "じてんしゃ", lang: ja }
        - { id: b, text: "じでんしゃ", lang: ja }
        - { id: c, text: "じてんじゃ", lang: ja }
        - { id: d, text: "じどうしゃ", lang: ja }
    answer: a
    explanation:
      vi: "自転車 (xe đạp) đọc là じてんしゃ. じどうしゃ là 自動車 (ô tô) — từ có thật nhưng viết khác; じでんしゃ và じてんじゃ chỉ là đổi âm đục sai."

  - key: ja:examq:jlpt-n4-m2-r03
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_reading
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách đọc bằng Hiragana của từ trong ngoặc 【 】.
      stem: 【 】の ことばは ひらがなで どう かきますか。
      stem_lang: ja
      passage: いつか 【世界】の 国を 旅行したいです。
      options:
        - { id: a, text: "せかい", lang: ja }
        - { id: b, text: "せがい", lang: ja }
        - { id: c, text: "せいかい", lang: ja }
        - { id: d, text: "よかい", lang: ja }
    answer: a
    explanation:
      vi: "世界 (thế giới) đọc là せかい, hai âm đều ngắn: せ + かい. せいかい viết là 正解 (đáp án đúng), nghe gần giống nhưng có trường âm."

  # --- Viết bằng Kanji (表記) ---
  - key: ja:examq:jlpt-n4-m2-r04
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: この 町は 【こうつう】が べんりです。
      options:
        - { id: a, text: "交通", lang: ja }
        - { id: b, text: "校通", lang: ja }
        - { id: c, text: "交道", lang: ja }
        - { id: d, text: "効通", lang: ja }
    answer: a
    explanation:
      vi: "こうつう (giao thông) viết là 交通: 交 (giao nhau) + 通 (đi qua). 校 (trường), 効 (hiệu quả) cũng đọc こう nhưng không ghép với 通 thành từ này."

  - key: ja:examq:jlpt-n4-m2-r05
    section: reading
    kind: mcq
    question_type: jlpt_read_kanji_writing
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn cách viết đúng của từ trong ngoặc 【 】.
      stem: 【 】の ことばは どう かきますか。
      stem_lang: ja
      passage: 先生に 【しつもん】が あります。
      options:
        - { id: a, text: "質問", lang: ja }
        - { id: b, text: "質間", lang: ja }
        - { id: c, text: "資問", lang: ja }
        - { id: d, text: "貿問", lang: ja }
    answer: a
    explanation:
      vi: "しつもん (câu hỏi) viết là 質問: 質 + 問 (hỏi, bộ 口 trong khung 門). 間 (khoảng giữa, thời gian) trông giống 問 nhưng bên trong là 日, không phải 口."

