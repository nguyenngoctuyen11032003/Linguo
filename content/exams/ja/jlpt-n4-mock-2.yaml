  # --- Câu đồng nghĩa (言い換え類義) ---
  - key: ja:examq:jlpt-n4-m2-r10
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【あの 人は かならず 来ます。】
      options:
        - { id: a, text: "あの 人は ぜったいに 来ます。", lang: ja }
        - { id: b, text: "あの 人は 来ないかも しれません。", lang: ja }
        - { id: c, text: "あの 人は 来ない でしょう。", lang: ja }
        - { id: d, text: "あの 人は もう 来ました。", lang: ja }
    answer: a
    explanation:
      vi: "かならず nghĩa là “nhất định, chắc chắn”, gần với ぜったいに. b và c nói về khả năng không đến, ngược nghĩa; d nói đã đến rồi (quá khứ) chứ không phải lời chắc chắn."

  - key: ja:examq:jlpt-n4-m2-r11
    section: reading
    kind: mcq
    question_type: jlpt_read_paraphrase
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu có nghĩa gần nhất với câu trong ngoặc 【 】.
      stem: 【 】の ぶんと だいたい おなじ いみの ぶんは どれですか。
      stem_lang: ja
      passage: 【この かばんは 軽いです。】
      options:
        - { id: a, text: "この かばんは 重くないです。", lang: ja }
        - { id: b, text: "この かばんは 高くないです。", lang: ja }
        - { id: c, text: "この かばんは 大きいです。", lang: ja }
        - { id: d, text: "この かばんは 新しいです。", lang: ja }
    answer: a
    explanation:
      vi: "軽い (nhẹ) nghĩa là “không nặng”: 重くないです. 高くない (không đắt), 大きい (to), 新しい (mới) nói về tính chất khác, không liên quan đến trọng lượng."

  # --- Cách dùng từ (用法) ---
  - key: ja:examq:jlpt-n4-m2-r12
    section: reading
    kind: mcq
    question_type: jlpt_read_usage
    level_code: n4
    points: 1
    prompt:
      instruction_vi: Chọn câu dùng từ trong ngoặc 【 】 đúng nhất.
      stem: 【しっぱい】の つかいかたで いちばん いい ものは どれですか。
      stem_lang: ja
      options:
        - { id: a, text: "料理に しっぱいして、塩を 入れすぎて しまいました。", lang: ja }
        - { id: b, text: "試合に しっぱいして、とても うれしかったです。", lang: ja }
        - { id: c, text: "あしたは しっぱいな 天気に なるでしょう。", lang: ja }
        - { id: d, text: "あの 人は 友達の しっぱいを たくさん 手伝って くれます。", lang: ja }
    answer: a
    explanation:
      vi: "しっぱい (失敗) là “thất bại, làm hỏng”, hợp với việc nấu ăn bị hỏng vì cho quá nhiều muối. b mâu thuẫn (thất bại mà vui); c dùng sai vì 失敗 không dùng để miêu tả thời tiết; d dùng sai vì 失敗 là việc làm hỏng chứ không phải thứ để “giúp”."

  # --- Ngữ pháp (文法形式の判断) ---
  - key: ja:examq:jlpt-n4-m2-r13
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: 雨が ふって いる（　）、かさを 持って 行きましょう。
      options:
        - { id: a, text: "ので", lang: ja }
        - { id: b, text: "のに", lang: ja }
        - { id: c, text: "ても", lang: ja }
        - { id: d, text: "ながら", lang: ja }
    answer: a
    explanation:
      vi: "Vế đầu là lý do của lời rủ ở vế sau (mưa nên mang ô): ～ので. のに diễn đạt kết quả trái ngược mong đợi nên không hợp; ても (dù…) và ながら (vừa… vừa…) cũng không tạo quan hệ nguyên nhân."

  - key: ja:examq:jlpt-n4-m2-r14
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: わたしは 毎朝 コーヒーを のみ（　） 新聞を 読みます。
      options:
        - { id: a, text: "ながら", lang: ja }
        - { id: b, text: "ために", lang: ja }
        - { id: c, text: "ように", lang: ja }
        - { id: d, text: "ばかり", lang: ja }
    answer: a
    explanation:
      vi: "Vます (bỏ ます) + ながら diễn tả hai hành động diễn ra đồng thời: uống cà phê vừa đọc báo. ために và ように chỉ mục đích, ばかり nghĩa là “chỉ toàn”, đều không đi sau のみ (dạng ます bỏ ます) theo nghĩa này."

  - key: ja:examq:jlpt-n4-m2-r15
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: |-
        A「この 本、読んだ ことが ありますか。」
        B「いいえ、（　）。」
      options:
        - { id: a, text: "読んだ ことが ありません", lang: ja }
        - { id: b, text: "読む ことが ありません", lang: ja }
        - { id: c, text: "読んで ありません", lang: ja }
        - { id: d, text: "読んだ ありません", lang: ja }
    answer: a
    explanation:
      vi: "Câu hỏi hỏi về kinh nghiệm “V-た ことが ありますか”, nên phủ định là “V-た ことが ありません” (chưa từng đọc). Dạng 読む ことが ありません có nghĩa khác (thói quen không đọc); c và d không đúng ngữ pháp."

  - key: ja:examq:jlpt-n4-m2-r16
    section: reading
    kind: mcq
    question_type: jlpt_read_grammar
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống （　）.
      stem: つぎの ぶんの （　）に 何を 入れますか。
      stem_lang: ja
      passage: 友達に すすめて （　） 映画を 見に 行きました。
      options:
        - { id: a, text: "もらった", lang: ja }
        - { id: b, text: "あげた", lang: ja }
        - { id: c, text: "くれた", lang: ja }
        - { id: d, text: "やった", lang: ja }
    answer: a
    explanation:
      vi: "Chủ thể là “tôi” nhận được lời giới thiệu từ bạn, và tác nhân đi với に (友達に) nên dùng ～て もらう: すすめて もらった. くれた cần chủ ngữ là bạn (友達が すすめて くれた); あげた và やった nghĩa là tôi làm giúp người khác."

  # --- Sắp xếp câu (文の組み立て) ---
  - key: ja:examq:jlpt-n4-m2-r17
    section: reading
    kind: mcq
    question_type: jlpt_read_order
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Sắp xếp bốn phương án thành câu đúng và chọn từ đứng ở vị trí ★.
      stem: ★に 入る ものは どれですか。
      stem_lang: ja
      passage: かぜを ひいた ときは ＿＿ ＿＿ ★ ＿＿ です。
      options:
        - { id: a, text: "休んだ", lang: ja }
        - { id: b, text: "ほうが", lang: ja }
        - { id: c, text: "早く", lang: ja }
        - { id: d, text: "いい", lang: ja }
    answer: b
    explanation:
      vi: "Câu đúng là “かぜを ひいた ときは 早く 休んだ ほうが いい です” (khi bị cảm thì nên nghỉ sớm): mẫu V-た ほうが いい đi liền nhau, trạng từ 早く đứng trước động từ. Từ ở vị trí ★ (thứ ba) là ほうが."

  - key: ja:examq:jlpt-n4-m2-r18
    section: reading
    kind: mcq
    question_type: jlpt_read_order
    level_code: n4
    points: 2
    prompt:
      instruction_vi: Sắp xếp bốn phương án thành câu đúng và chọn từ đứng ở vị trí ★.
      stem: ★に 入る ものは どれですか。
      stem_lang: ja
      passage: バスが ＿＿ ＿＿ ★ ＿＿ 遅れました。
      options:
        - { id: a, text: "なかなか", lang: ja }
        - { id: b, text: "来なかった", lang: ja }
        - { id: c, text: "ので", lang: ja }
        - { id: d, text: "学校に", lang: ja }
    answer: c
    explanation:
      vi: "Câu đúng là “バスが なかなか 来なかった ので 学校に 遅れました” (xe buýt mãi không đến nên tôi đến trường muộn): なかなか + động từ phủ định, rồi ので nối lý do với kết quả. Vị trí ★ là ので."

  # --- Đọc hiểu đoạn ngắn (内容理解) ---
  - key: ja:examq:jlpt-n4-m2-r19
    section: reading
    kind: mcq
    question_type: jlpt_read_detail
    level_code: n4
    points: 4
    prompt:
      instruction_vi: Đọc đoạn văn và trả lời câu hỏi.
      stem: 「わたし」が ジムに 行くのが 楽しく なったのは どうしてですか。
      stem_lang: ja
      passage: |-
        わたしは 先月から ジムに 行き始めました。最初は 運動が きらいで、行くのが いやでした。でも、友達と いっしょに 行く ように したら、楽しく なりました。今は 週に 三回 行って います。体重は 3キロ へりました。
      options:
        - { id: a, text: "友達と いっしょに 行く ように したから", lang: ja }
        - { id: b, text: "体重が 3キロ へったから", lang: ja }
        - { id: c, text: "週に 三回 行く ように したから", lang: ja }
        - { id: d, text: "運動が すきに なったから", lang: ja }
    answer: a
    explanation:
      vi: "Người viết nói “友達と いっしょに 行く ように したら、楽しく なりました” (khi cố gắng đi cùng bạn thì thấy vui). Giảm cân (b) là kết quả sau đó; “週に 三回” (c) là tần suất hiện nay, không phải lý do thấy vui."

  - key: ja:examq:jlpt-n4-m2-r20
    section: reading
    kind: mcq
    question_type: jlpt_read_detail
    level_code: n4
    points: 4
    prompt:
      instruction_vi: Đọc email và trả lời câu hỏi.
      stem: 田中さんが 鈴木さんに 言いたい ことは 何ですか。
      stem_lang: ja
      passage: |-
        鈴木さん
        先週 かりた 本を かえします。とても おもしろかったです。ところで、今度の 日曜日に 駅の 前で 古い 本の イベントが あるそうです。いっしょに 行きませんか。午前10時に 駅で 会いましょう。都合が 悪かったら、メールを ください。
        田中
      options:
        - { id: a, text: "古い 本の イベントに いっしょに 行きたい", lang: ja }
        - { id: b, text: "本を 買って 来て ほしい", lang: ja }
        - { id: c, text: "本を もう少し 貸して ほしい", lang: ja }
        - { id: d, text: "日曜日は 都合が 悪い", lang: ja }
    answer: a
    explanation:
      vi: "Sau “ところで” (nhân tiện), Tanaka rủ “いっしょに 行きませんか” đến sự kiện sách cũ ở trước ga. Việc trả sách (かえします) chỉ là chuyện mở đầu; Tanaka chưa nói mình bận vào Chủ nhật (d) mà dặn nếu Suzuki bận thì nhắn lại."

  # --- Tìm thông tin (情報検索) ---
  - key: ja:examq:jlpt-n4-m2-r21
    section: reading
    kind: mcq
    question_type: jlpt_read_info
    level_code: n4
    points: 4
    prompt:
      instruction_vi: Đọc thông báo và trả lời câu hỏi.
      stem: 田中さんは 友達と 二人で 3回 まとめて 申し込みます。全部で いくら はらいますか。
      stem_lang: ja
      passage: |-
        さくら文化センター 料理教室
        ・日時：毎週 土曜日 10:00～12:00
        ・料金：1回 1,500円（材料費を ふくむ）／ 3回 まとめて 申し込むと 4,000円
        ・申し込み：前の 日までに 受付へ
        ・エプロンを 持って きて ください。
      options:
        - { id: a, text: "3,000円", lang: ja }
        - { id: b, text: "4,000円", lang: ja }
        - { id: c, text: "8,000円", lang: ja }
        - { id: d, text: "9,000円", lang: ja }
    answer: c
    explanation:
      vi: "3 buổi gộp là 4.000 yên cho một người, hai người nên 4.000 × 2 = 8.000 yên. 4.000円 là bẫy nếu quên tính người thứ hai, còn 9.000円 là nếu mỗi người đăng ký lẻ từng buổi (1.500 × 3 × 2)."
