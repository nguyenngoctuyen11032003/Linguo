      vi: "Ông Okafor nói “Das wäre ein Anfang” (đó mới chỉ là bước đầu) và “Ohne Pflicht erreicht man aber nicht alle” (không có nghĩa vụ thì không tiếp cận được tất cả): chỉ trả công tốt hơn là chưa đủ. Chính bà Lindner là người đề xuất trả công tốt hơn và quảng bá nhiều hơn (b sai)."

  # --- Hội thoại giữa đồng nghiệp ---
  - key: de:examq:goethe-b2-m2-l11
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe cuộc trò chuyện giữa hai đồng nghiệp và chọn chủ đề chính.
      stem: Worum geht es in dem Gespräch?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau Ernst: Hast du schon die Rückmeldungen zum Betriebsausflug gesehen?
        Herr Kaya: Ja. Die meisten sind für die Wanderung, aber ein paar Kollegen würden lieber ins Museum gehen, weil das Wetter im Oktober unsicher ist.
        Frau Ernst: Dann reserviere ich lieber die Hütte mit dem großen Gastraum. Dort kann man bei Regen drinnen essen.
        Herr Kaya: Gute Idee. Aber das Angebot gilt nur noch bis Freitag.
        Frau Ernst: Dann schreibe ich der Chefin noch heute, damit sie die Kosten genehmigt.
      options:
        - { id: a, text: "Um die Planung eines Betriebsausflugs.", lang: de }
        - { id: b, text: "Um einen Streit zwischen Kollegen über das Museum.", lang: de }
        - { id: c, text: "Um eine Reklamation bei einer Berghütte.", lang: de }
    answer: a
    explanation:
      vi: "Hai đồng nghiệp bàn về phản hồi cho chuyến đi chơi của công ty (“Betriebsausflug”): đi bộ đường dài hay đến bảo tàng, đặt nhà nghỉ, xin sếp duyệt chi phí. Không có tranh cãi (b) hay khiếu nại (c) nào."

  - key: de:examq:goethe-b2-m2-l12
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại cuộc trò chuyện và chọn đáp án đúng cho câu hỏi.
      stem: Warum möchte Frau Ernst die Hütte reservieren?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau Ernst: Hast du schon die Rückmeldungen zum Betriebsausflug gesehen?
        Herr Kaya: Ja. Die meisten sind für die Wanderung, aber ein paar Kollegen würden lieber ins Museum gehen, weil das Wetter im Oktober unsicher ist.
        Frau Ernst: Dann reserviere ich lieber die Hütte mit dem großen Gastraum. Dort kann man bei Regen drinnen essen.
        Herr Kaya: Gute Idee. Aber das Angebot gilt nur noch bis Freitag.
        Frau Ernst: Dann schreibe ich der Chefin noch heute, damit sie die Kosten genehmigt.
      options:
