        C: 3-Zimmer-Wohnung mit Garten am Stadtrand, ruhige Lage, S-Bahn in 10 Minuten, Kinder und Haustiere willkommen.
        D: Barrierefreie 1-Zimmer-Wohnung im Erdgeschoss, ebenerdiger Zugang, Nähe Apotheke und Haltestelle, Haustiere nicht gestattet.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: b
    explanation:
      vi: "Mia là sinh viên, tuần sau chuyển đến, không có đồ đạc và không muốn ở một mình: phòng B có sẵn đồ (“möbliert”), trong nhà ở chung bốn người gần trường đại học và trống ngay (“ab sofort frei”). Căn A chỉ trống từ 1/12 và không có đồ đạc; C và D là nhà ở riêng, không phải ở chung."

  # --- Bài đọc dài (hai phần): suy luận và chọn câu đúng ---
  - key: de:examq:goethe-b2-m2-r10
    section: reading
    kind: mcq
    question_type: goethe_read_inference
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc phần đầu bài báo về không gian làm việc chung ở nông thôn và chọn điều có thể suy ra từ nội dung.
      stem: Was lässt sich aus dem Text schließen?
      stem_lang: de
      passage: |-
        Coworking auf dem Land (Teil 1)
        Lange galten Coworking-Spaces als Phänomen der Großstädte, in denen sich Freiberufler Schreibtische teilen. Inzwischen entstehen solche Räume auch in Dörfern, oft in leerstehenden Gasthäusern oder Schulgebäuden. Für Beschäftigte, die täglich ein bis zwei Stunden pendeln müssten, ist das attraktiv: Sie können ihre Arbeit erledigen, ohne ihren Wohnort zu verlassen, und trotzdem Kolleginnen und Kollegen treffen, statt allein am Küchentisch zu sitzen.
      options:
        - { id: a, text: "Gemeinsame Arbeitsräume auf dem Land können das Gefühl der Isolation im Homeoffice verringern.", lang: de }
        - { id: b, text: "Dörfer bieten Freiberuflern grundsätzlich bessere Arbeitsbedingungen als Städte.", lang: de }
        - { id: c, text: "Wer pendelt, arbeitet immer allein am Küchentisch.", lang: de }
    answer: a
    explanation:
      vi: "Bài nói người làm việc ở không gian chung vừa không phải đi xa vừa gặp được đồng nghiệp, “statt allein am Küchentisch zu sitzen” (thay vì ngồi một mình ở bàn bếp): vậy cảm giác cô lập khi làm việc tại nhà có thể giảm, đây là suy luận hợp lý. Phương án b khái quát quá mức (“grundsätzlich”) và bài không so sánh như vậy; c sai vì người đi làm xa không làm việc ở bàn bếp."

  - key: de:examq:goethe-b2-m2-r11
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc phần tiếp theo của bài báo và chọn câu đúng với nội dung.
      stem: Welche Aussage entspricht dem Text?
      stem_lang: de
      passage: |-
        Coworking auf dem Land (Teil 2)
        Der Bürgermeister von Lindhof, Marc Hofmann, berichtet, im ehemaligen Schulhaus seien inzwischen zwölf Arbeitsplätze vermietet. Die Gemeinde habe den Umbau bezahlt, weil sie hoffe, junge Familien im Ort zu halten. Skeptisch sei er anfangs gewesen, räumt er ein, denn niemand habe gewusst, ob sich genug Nutzer fänden. Nun gebe es sogar eine Warteliste. Probleme bereite lediglich die Internetverbindung, die noch nicht überall stabil sei.
      options:
        - { id: a, text: "Die Gemeinde hat den Umbau bezahlt, um junge Familien im Ort zu halten.", lang: de }
        - { id: b, text: "Der Bürgermeister war von Anfang an sicher, dass genug Nutzer kommen würden.", lang: de }
        - { id: c, text: "Die Internetverbindung funktioniert im ganzen Gebiet einwandfrei.", lang: de }
    answer: a
    explanation:
      vi: "Bài dùng Konjunktiv I để thuật lại lời thị trưởng (“habe … bezahlt”, “hoffe”): xã đã trả tiền cải tạo vì hy vọng giữ chân các gia đình trẻ. Phương án b ngược với “Skeptisch sei er anfangs gewesen” (lúc đầu ông hoài nghi); c ngược với câu cuối: kết nối internet “noch nicht überall stabil” (chưa ổn định ở mọi nơi)."

  # --- Điền từ nối ---
  - key: de:examq:goethe-b2-m2-r12
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Das Angebot, ___ wir uns lange gefreut hatten, wurde kurzfristig zurückgezogen.
      options:
        - { id: a, text: "auf das", lang: de }
        - { id: b, text: "auf dem", lang: de }
        - { id: c, text: "auf dessen", lang: de }
        - { id: d, text: "auf denen", lang: de }
    answer: a
    explanation:
      vi: "“Sich freuen auf” đi với Akkusativ, và đại từ quan hệ phải khớp giống – số của danh từ mà nó thay thế: “das Angebot” (trung tính, số ít) nên dùng “auf das”. “Auf dem” là Dativ nên sai cách; “auf denen” là số nhiều; “auf dessen” (của nó) tạo ra một danh từ đứng sau, không có ở đây."

  - key: de:examq:goethe-b2-m2-r13
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Wie bereits angekündigt, ___ die Ergebnisse der Umfrage nächste Woche veröffentlicht.
      options:
        - { id: a, text: "werden", lang: de }
        - { id: b, text: "wurden", lang: de }
        - { id: c, text: "waren", lang: de }
        - { id: d, text: "haben", lang: de }
    answer: a
    explanation:
      vi: "Câu bị động Vorgangspassiv với “werden” + Partizip II (“veröffentlicht”), ở thì hiện tại với nghĩa tương lai vì có “nächste Woche”: “werden … veröffentlicht”. “Wurden” và “waren” là thì quá khứ, mâu thuẫn với “nächste Woche”; “haben” không tạo được bị động."

  - key: de:examq:goethe-b2-m2-r14
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Man kann Energie sparen, ___ man die Heizung nachts herunterdreht.
      options:
        - { id: a, text: "indem", lang: de }
        - { id: b, text: "damit", lang: de }
        - { id: c, text: "sodass", lang: de }
        - { id: d, text: "obwohl", lang: de }
    answer: a
    explanation:
      vi: "Liên từ “indem” (bằng cách) diễn đạt phương thức: tiết kiệm năng lượng bằng cách hạ nhiệt sưởi vào ban đêm; động từ xuống cuối mệnh đề (“herunterdreht”). “Damit” chỉ mục đích (để), “sodass” chỉ kết quả, “obwohl” chỉ nhượng bộ; cả ba đều sai nghĩa."

  - key: de:examq:goethe-b2-m2-r15
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Er verhält sich, ___ er von dem Streit nichts gewusst hätte.
      options:
        - { id: a, text: "als ob", lang: de }
        - { id: b, text: "obwohl", lang: de }
        - { id: c, text: "sodass", lang: de }
        - { id: d, text: "damit", lang: de }
    answer: a
    explanation:
      vi: "“Als ob” + Konjunktiv II (ở đây là Plusquamperfekt “gewusst hätte”) diễn đạt sự so sánh không có thật: anh ta cư xử như thể không biết gì về vụ cãi vã. “Obwohl” (mặc dù) chỉ sự nhượng bộ nên sai nghĩa; “sodass” (kết quả) và “damit” (mục đích) không diễn đạt sự so sánh."

  # ============================== VIẾT (Schreiben) ==============================
  # --- Teil 1: thư bạn đọc gửi báo ≈ 150 từ ---
  - key: de:examq:goethe-b2-m2-w01
    section: writing
    kind: essay
    question_type: goethe_write_forum
    level_code: b2
    points: 20
    prompt:
      instruction_vi: >-
        Viết một thư bạn đọc gửi báo bằng tiếng Đức (khoảng 150 từ) nêu ý kiến về đề xuất trong đề và bàn đủ bốn ý gợi ý.
        Có lời xưng hô, câu mở đầu, lập luận có lý do hoặc ví dụ, câu kết và lời chào kết.
      stem: |-
        In Ihrer Tageszeitung stand: „Die Stadtverwaltung überlegt, den Geschäften in der Innenstadt zu erlauben, auch sonntags zu öffnen.“
        Schreiben Sie einen Leserbrief (circa 150 Wörter):
        – Nehmen Sie Stellung zu dem Vorschlag.
        – Nennen Sie Argumente für und gegen verkaufsoffene Sonntage.
        – Beschreiben Sie, wie das in Ihrem Heimatland oder in Ihrem Umfeld geregelt ist.
        – Machen Sie einen Gegenvorschlag oder einen Kompromissvorschlag.
      stem_lang: de
      min_chars: 750
      max_chars: 2000
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Bàn đủ bốn ý (quan điểm, lập luận ủng hộ và phản đối, tình hình ở nơi bạn sống, đề xuất) và phát triển bằng lý do, ví dụ; quan điểm rõ ràng, nhất quán. Thiếu một ý hoặc chỉ liệt kê mà không giải thích là mất điểm.
        max_points: 5
      - key: communicative_achievement
        label_vi: Hiệu quả giao tiếp
        description_vi: Đúng văn phong thư bạn đọc (lịch sự, nêu quan điểm rõ ràng, có nhắc đến bài báo và ý kiến trái chiều); lập luận thuyết phục, không viết như tin nhắn.
        max_points: 5
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời xưng hô (Sehr geehrte Redaktion,), câu mở đầu, các đoạn mỗi đoạn một ý, câu kết và lời chào kết; dùng từ nối đa dạng (einerseits … andererseits, zwar … aber, deshalb, außerdem, schließlich).
        max_points: 5
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Từ vựng và cấu trúc đa dạng ở mức B2 (Konjunktiv II, bị động, mệnh đề quan hệ, danh từ hóa), động từ đúng vị trí; lỗi ít và không gây hiểu nhầm.
        max_points: 5
    sample_answer: |-
      Sehr geehrte Redaktion,

      mit Interesse habe ich gelesen, dass die Stadt Sonntagsöffnungen in der Innenstadt erwägt. Ich bin dagegen, kann mir aber einen Kompromiss vorstellen.

      Für verkaufsoffene Sonntage spricht, dass Berufstätige unter der Woche oft keine Zeit zum Einkaufen haben und die Innenstadt lebendiger würde. Außerdem könnten die Geschäfte zusätzliche Umsätze erzielen. Dagegen steht, dass die Beschäftigten im Einzelhandel dann noch seltener ein freies Wochenende hätten. Für viele ist der Sonntag der einzige Tag, an dem die ganze Familie Zeit füreinander hat.

      In meiner Heimat Vietnam sind viele Geschäfte auch sonntags geöffnet. Das ist für die Kundschaft bequem, doch die Beschäftigten haben dadurch oft kaum freie Tage.

      Ich schlage deshalb vor, nur an wenigen Sonntagen im Jahr zu öffnen, zum Beispiel vor Weihnachten, und das Personal dafür mit zusätzlichen freien Tagen zu entschädigen.

      Mit freundlichen Grüßen
      Minh Nguyen
    explanation:
      vi: "Thư bạn đọc B2 được chấm trước hết ở việc bàn đủ các ý gợi ý và cân nhắc cả hai mặt. Lỗi hay gặp: bỏ sót ý (thường là phần đề xuất), chỉ liệt kê mà không giải thích, thiếu lời xưng hô hoặc lời chào kết, quên đảo động từ sau trạng từ đầu câu (“Dagegen steht, dass …”; “Außerdem könnten die Geschäfte …”) hoặc để động từ không ở cuối mệnh đề phụ (đúng là “weil das Personal entschädigt wird”, không phải “weil das Personal wird entschädigt”)."

  # --- Teil 2: e-mail khiếu nại trang trọng ≈ 100 từ ---
  - key: de:examq:goethe-b2-m2-w02
    section: writing
    kind: essay
    question_type: goethe_write_email
    level_code: b2
    points: 16
    prompt:
      instruction_vi: >-
        Viết một e-mail khiếu nại trang trọng bằng tiếng Đức (khoảng 100 từ) gửi người phụ trách của công ty, trả lời đủ các ý
        trong đề. Dùng “Sie”, có lời xưng hô và lời chào kết phù hợp.
      stem: |-
        Sie haben über die Agentur „Küstenträume“ eine Ferienwohnung in Seebach für eine Woche gebucht. Bei der Ankunft stellen Sie fest: Die Heizung funktioniert nicht, und direkt neben dem Haus wird gebaut, was in der Beschreibung nicht erwähnt war. Den Vermieter erreichen Sie telefonisch nicht.
        Schreiben Sie an die Agentur, Herrn Kramer (circa 100 Wörter):
        – Schildern Sie die beiden Mängel.
        – Fordern Sie die Erstattung eines Teils des Reisepreises und nennen Sie eine Frist für die Antwort.
        Vergessen Sie Anrede und Gruß nicht.
      stem_lang: de
      min_chars: 450
      max_chars: 1400
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Trả lời đủ các ý (nêu rõ hai lỗi của căn hộ, yêu cầu hoàn lại một phần tiền, nêu thời hạn trả lời); thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: communicative_achievement
        label_vi: Hiệu quả giao tiếp
        description_vi: Văn phong trang trọng, lịch sự nhưng rõ ràng và kiên quyết (Sie nhất quán, “Ich bitte Sie, …”, “Ich erwarte Ihre Antwort bis …”); người đọc biết chính xác bạn muốn gì và khi nào.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có xưng hô (Sehr geehrter Herr Kramer,), lý do viết thư, phần nêu vấn đề, phần yêu cầu kèm thời hạn và lời chào kết (Mit freundlichen Grüßen + tên, không có dấu phẩy sau Grüßen).
        max_points: 4
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Từ vựng và cấu trúc B2 phù hợp thư khiếu nại (từ như “beanstanden”, “Mangel”, “Erstattung”, bị động, mệnh đề phụ), lỗi ít và không gây hiểu nhầm.
        max_points: 4
    sample_answer: |-
      Sehr geehrter Herr Kramer,

      vor zwei Tagen bin ich in der von Ihnen vermittelten Ferienwohnung in Seebach angekommen und muss leider zwei erhebliche Mängel beanstanden. Die Heizung funktioniert nicht, sodass es abends sehr kalt ist. Außerdem wird direkt neben dem Haus ab dem frühen Morgen gebaut, was in der Beschreibung nicht erwähnt wurde. Den Vermieter habe ich telefonisch nicht erreicht.

      Ich bitte Sie daher, mir einen Teil des Reisepreises zu erstatten, und erwarte Ihre Antwort bis zum 20. dieses Monats. Andernfalls müsste ich weitere Schritte prüfen.

      Mit freundlichen Grüßen
      Minh Nguyen
    explanation:
      vi: "E-mail khiếu nại B2 được chấm ở việc nêu rõ vấn đề, yêu cầu cụ thể và thời hạn, giọng lịch sự mà kiên quyết. Lỗi hay gặp: chỉ than phiền mà không nêu yêu cầu, quên thời hạn, trộn “du” với “Sie”, viết hoa chữ đầu sau dấu phẩy của lời xưng hô (đúng là “vor zwei Tagen …” viết thường), đặt động từ sai chỗ trong mệnh đề phụ (đúng là “sodass es abends sehr kalt ist”, không phải “sodass es ist abends sehr kalt”) và quên lời chào kết."
