  - key: de:examq:goethe-b2-m2-r01
    section: reading
    kind: mcq
    question_type: goethe_read_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc thư bạn đọc gửi báo và chọn câu thể hiện đúng quan điểm của người viết.
      stem: Welche Haltung vertritt die Verfasserin des Leserbriefs?
      stem_lang: de
      passage: |-
        Leserbrief zum Artikel „Kartenzahlung im Café Linde“
        Mit Erstaunen habe ich gelesen, dass das Café Linde künftig nur noch Kartenzahlung akzeptiert. Ich verstehe, dass dieses Vorgehen Zeit spart und Wechselgeld überflüssig macht. Trotzdem halte ich den Schritt für falsch: Ältere Gäste und Jugendliche ohne eigenes Konto werden ausgeschlossen, und wer bar bezahlt, behält leichter den Überblick über seine Ausgaben. Ein Café lebt von seinen Stammgästen. Wer sie vergrault, spart am falschen Ende.
        Marianne Rösch, Seeberg
      options:
        - { id: a, text: "Sie versteht die Gründe des Cafés, lehnt die Entscheidung aber ab.", lang: de }
        - { id: b, text: "Sie begrüßt die Entscheidung, weil Bargeld unpraktisch ist.", lang: de }
        - { id: c, text: "Sie fordert, dass alle Geschäfte nur noch Bargeld annehmen.", lang: de }
    answer: a
    explanation:
      vi: "Bà Rösch thừa nhận lợi ích (“Ich verstehe, dass dieses Vorgehen Zeit spart”) nhưng nói rõ “halte ich den Schritt für falsch” (tôi cho đó là sai lầm) rồi nêu lý do. Phương án b trái với thái độ phản đối; c quá xa: bà chỉ phê bình một quán cà phê, không đòi mọi cửa hàng chỉ nhận tiền mặt."

  - key: de:examq:goethe-b2-m2-r02
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc lại thư bạn đọc và chọn đáp án đúng cho câu hỏi.
      stem: Wer wird laut dem Leserbrief durch die Entscheidung benachteiligt?
      stem_lang: de
      passage: |-
        Leserbrief zum Artikel „Kartenzahlung im Café Linde“
        Mit Erstaunen habe ich gelesen, dass das Café Linde künftig nur noch Kartenzahlung akzeptiert. Ich verstehe, dass dieses Vorgehen Zeit spart und Wechselgeld überflüssig macht. Trotzdem halte ich den Schritt für falsch: Ältere Gäste und Jugendliche ohne eigenes Konto werden ausgeschlossen, und wer bar bezahlt, behält leichter den Überblick über seine Ausgaben. Ein Café lebt von seinen Stammgästen. Wer sie vergrault, spart am falschen Ende.
        Marianne Rösch, Seeberg
      options:
        - { id: a, text: "Ältere Gäste und Jugendliche ohne eigenes Konto.", lang: de }
        - { id: b, text: "Das Personal, das mehr arbeiten muss.", lang: de }
        - { id: c, text: "Gäste, die gern mit Karte bezahlen.", lang: de }
    answer: a
    explanation:
      vi: "“Ältere Gäste und Jugendliche ohne eigenes Konto werden ausgeschlossen”: người lớn tuổi và thanh thiếu niên không có tài khoản riêng bị loại ra ngoài. Nhân viên (b) không được nhắc đến; khách thích trả bằng thẻ (c) thì không bị thiệt mà còn thuận tiện hơn."

  # --- Phóng sự tạp chí ---
  - key: de:examq:goethe-b2-m2-r03
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc bài phóng sự trên tạp chí và chọn đáp án đúng cho câu hỏi.
      stem: Warum sind inzwischen viele Eltern überzeugt?
      stem_lang: de
      passage: |-
        Jeden Mittwoch verlässt die Klasse 5b der Grundschule Hohenau das Schulgebäude und geht in den Wald. Der Lehrer Samuel Berger hat dort eine Lichtung hergerichtet: Baumstämme dienen als Sitzplätze, ein Tuch zwischen zwei Bäumen als Dach. Gerechnet und gelesen wird trotzdem, nur eben draußen. „Anfangs hatten manche Eltern Bedenken wegen des Wetters“, sagt Berger. Inzwischen seien viele überzeugt, weil die Kinder konzentrierter wirkten und sich mehr bewegten. Bei Gewitter oder Sturm bleibt die Klasse im Haus.
      options:
        - { id: a, text: "Weil die Kinder konzentrierter wirken und sich mehr bewegen.", lang: de }
        - { id: b, text: "Weil im Wald weniger gelernt werden muss.", lang: de }
        - { id: c, text: "Weil das Wetter im Wald immer gut ist.", lang: de }
    answer: a
    explanation:
      vi: "Bài dùng Konjunktiv I và II để thuật lại lời thầy Berger (“seien viele überzeugt, weil die Kinder konzentrierter wirkten und sich mehr bewegten”): nhiều phụ huynh được thuyết phục vì trẻ có vẻ tập trung hơn và vận động nhiều hơn. Việc học vẫn diễn ra như thường (“Gerechnet und gelesen wird trotzdem”) nên b sai; c sai vì chính thời tiết là mối lo ban đầu của phụ huynh."

  - key: de:examq:goethe-b2-m2-r04
    section: reading
    kind: mcq
    question_type: goethe_read_gist
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc lại bài phóng sự và chọn tiêu đề phù hợp nhất.
      stem: Welche Überschrift passt am besten zu dem Text?
      stem_lang: de
      passage: |-
        Jeden Mittwoch verlässt die Klasse 5b der Grundschule Hohenau das Schulgebäude und geht in den Wald. Der Lehrer Samuel Berger hat dort eine Lichtung hergerichtet: Baumstämme dienen als Sitzplätze, ein Tuch zwischen zwei Bäumen als Dach. Gerechnet und gelesen wird trotzdem, nur eben draußen. „Anfangs hatten manche Eltern Bedenken wegen des Wetters“, sagt Berger. Inzwischen seien viele überzeugt, weil die Kinder konzentrierter wirkten und sich mehr bewegten. Bei Gewitter oder Sturm bleibt die Klasse im Haus.
      options:
        - { id: a, text: "Unterricht im Grünen: Eine Klasse lernt einmal pro Woche im Wald", lang: de }
        - { id: b, text: "Grundschule Hohenau wegen Sturmschäden geschlossen", lang: de }
        - { id: c, text: "Eltern protestieren gegen Ausflüge in den Wald", lang: de }
    answer: a
    explanation:
      vi: "Ý chính: một lớp học mỗi thứ Tư (“Jeden Mittwoch”) ra rừng học, vẫn tính toán và đọc như bình thường. Phương án b sai vì bão chỉ là lý do ở lại trong nhà vào một số ngày; c sai vì phụ huynh ban đầu có lo ngại nhưng giờ nhiều người đã bị thuyết phục."

  # --- Thư của cơ quan ---
  - key: de:examq:goethe-b2-m2-r05
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc thư của thư viện thành phố và chọn đáp án đúng cho câu hỏi.
      stem: Was gilt für Nutzerinnen und Nutzer, die ihren Ausweis noch in diesem Jahr verlängern?
      stem_lang: de
      passage: |-
        Sehr geehrte Nutzerinnen und Nutzer,
        zum 1. Januar ändern sich die Gebühren der Stadtbibliothek Oberfeld. Der Jahresausweis für Erwachsene kostet dann 20 statt bisher 15 Euro. Für Kinder und Jugendliche bis 18 Jahre bleibt die Nutzung kostenlos. Mahngebühren entfallen künftig für alle, sofern die Medien spätestens zwei Wochen nach Ablauf der Leihfrist zurückgegeben werden. Wer seinen Ausweis noch in diesem Jahr verlängert, zahlt noch den bisherigen Preis. Wir bitten um Ihr Verständnis.
        Mit freundlichen Grüßen
        Stadtbibliothek Oberfeld
      options:
        - { id: a, text: "Sie zahlen noch den bisherigen Preis.", lang: de }
        - { id: b, text: "Sie müssen schon jetzt 20 Euro bezahlen.", lang: de }
        - { id: c, text: "Sie müssen keine Gebühr bezahlen.", lang: de }
    answer: a
    explanation:
      vi: "“Wer seinen Ausweis noch in diesem Jahr verlängert, zahlt noch den bisherigen Preis”: ai gia hạn thẻ trong năm nay vẫn trả mức giá cũ (15 euro). Mức 20 euro chỉ áp dụng từ ngày 1/1 (b sai); chỉ trẻ em và thanh thiếu niên đến 18 tuổi được dùng miễn phí (c sai)."

  - key: de:examq:goethe-b2-m2-r06
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc lại thư và chọn đáp án đúng cho câu hỏi.
      stem: Unter welcher Bedingung entfallen die Mahngebühren?
      stem_lang: de
      passage: |-
        Sehr geehrte Nutzerinnen und Nutzer,
        zum 1. Januar ändern sich die Gebühren der Stadtbibliothek Oberfeld. Der Jahresausweis für Erwachsene kostet dann 20 statt bisher 15 Euro. Für Kinder und Jugendliche bis 18 Jahre bleibt die Nutzung kostenlos. Mahngebühren entfallen künftig für alle, sofern die Medien spätestens zwei Wochen nach Ablauf der Leihfrist zurückgegeben werden. Wer seinen Ausweis noch in diesem Jahr verlängert, zahlt noch den bisherigen Preis. Wir bitten um Ihr Verständnis.
        Mit freundlichen Grüßen
        Stadtbibliothek Oberfeld
      options:
        - { id: a, text: "Wenn die Medien spätestens zwei Wochen nach Ablauf der Leihfrist zurückgegeben werden.", lang: de }
        - { id: b, text: "Wenn man seinen Ausweis noch in diesem Jahr verlängert.", lang: de }
        - { id: c, text: "Wenn man jünger als 18 Jahre ist.", lang: de }
    answer: a
    explanation:
      vi: "“Mahngebühren entfallen künftig für alle, sofern …” (miễn phí nhắc nhở cho tất cả, với điều kiện …): trả sách muộn nhất hai tuần sau hạn mượn. “Sofern” = “nếu, với điều kiện”. Gia hạn thẻ (b) chỉ liên quan đến giá thẻ; vì quy định áp dụng “für alle”, tuổi dưới 18 (c) không phải điều kiện."

  # --- Ghép tin rao nhà ---
  - key: de:examq:goethe-b2-m2-r07
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc tình huống và bốn tin rao nhà cho thuê, chọn tin phù hợp với người được mô tả.
      stem: Familie Brandt hat zwei Kinder und einen Hund. Die Kinder sollen draußen spielen können, und alle brauchen mehr Platz. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A: 2-Zimmer-Altbauwohnung, 4. Stock, kein Aufzug, 55 m², Haustiere nach Absprache erlaubt, frei ab 1. Dezember.
        B: Möbliertes Zimmer in lebhafter Vierer-WG nahe der Uni, ab sofort frei, Gemeinschaftsküche, keine Haustiere.
        C: 3-Zimmer-Wohnung mit Garten am Stadtrand, ruhige Lage, S-Bahn in 10 Minuten, Kinder und Haustiere willkommen.
        D: Barrierefreie 1-Zimmer-Wohnung im Erdgeschoss, ebenerdiger Zugang, Nähe Apotheke und Haltestelle, Haustiere nicht gestattet.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: c
    explanation:
      vi: "Gia đình có hai con và một con chó, cần thêm chỗ ở và chỗ cho trẻ chơi ngoài trời: căn C có ba phòng, có vườn, chào đón cả trẻ em lẫn thú nuôi (“Kinder und Haustiere willkommen”). Căn A cho phép nuôi thú nhưng chỉ có hai phòng, 55 m² và không có vườn; B và D chỉ có một phòng và không cho nuôi thú."

