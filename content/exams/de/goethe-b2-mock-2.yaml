        - { id: d, text: "Anzeige D", lang: de }
    answer: d
    explanation:
      vi: "Ông Weiß ngồi xe lăn nên cần căn hộ không bậc thang và gần trạm xe, hiệu thuốc: căn D vừa không rào cản (“barrierefrei”, “ebenerdiger Zugang”) vừa “Nähe Apotheke und Haltestelle”. Căn A ở tầng 4 không có thang máy; C ở ngoại ô, cách ga tàu 10 phút; B là phòng trong nhà ở chung."

