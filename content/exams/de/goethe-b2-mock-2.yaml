        D: Barrierefreie 1-Zimmer-Wohnung im Erdgeschoss, ebenerdiger Zugang, Nähe Apotheke und Haltestelle, Haustiere nicht gestattet.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
