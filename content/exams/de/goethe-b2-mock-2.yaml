questions:
  # ============================== NGHE (Hören) ==============================
  # --- Bản tin phát thanh ---
  - key: de:examq:goethe-b2-m2-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe bản tin giao thông trên đài và chọn đáp án đúng cho câu hỏi.
      stem: Wann wird entschieden, ob der Radweg dauerhaft gebaut wird?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und nun zum Verkehr in Seeberg: Auf der Uferstraße ist seit gestern ein provisorischer Radweg in Betrieb. Dafür wurde eine der beiden Autospuren gesperrt; die gelben Markierungen lassen sich später wieder entfernen. Die Stadt will den Versuch sechs Monate lang auswerten und dabei Radfahrer und Autos zählen. Erst danach entscheidet der Stadtrat, ob der Weg dauerhaft gebaut wird. Verkehrsplaner Jonas Reiter bittet um Geduld: „Anfangs wird es eng, aber wir müssen es ausprobieren.“
      options:
        - { id: a, text: "Nach der Auswertung eines sechsmonatigen Versuchs.", lang: de }
        - { id: b, text: "Sofort, weil schon so viele Radfahrer den Weg nutzen.", lang: de }
        - { id: c, text: "Nach einer Befragung der Anwohner im nächsten Jahr.", lang: de }
    answer: a
    explanation:
      vi: "Thành phố đánh giá thử nghiệm trong sáu tháng (“sechs Monate lang auswerten”) và “Erst danach” (chỉ sau đó) hội đồng thành phố mới quyết định có xây làn xe đạp cố định hay không. Không có quyết định ngay lập tức (b sai) và bản tin không nhắc đến cuộc khảo sát cư dân nào (c sai)."

  - key: de:examq:goethe-b2-m2-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại bản tin và chọn câu mô tả đúng quan điểm của người được trích dẫn.
      stem: Wie sieht Herr Reiter die ersten Wochen des Versuchs?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und nun zum Verkehr in Seeberg: Auf der Uferstraße ist seit gestern ein provisorischer Radweg in Betrieb. Dafür wurde eine der beiden Autospuren gesperrt; die gelben Markierungen lassen sich später wieder entfernen. Die Stadt will den Versuch sechs Monate lang auswerten und dabei Radfahrer und Autos zählen. Erst danach entscheidet der Stadtrat, ob der Weg dauerhaft gebaut wird. Verkehrsplaner Jonas Reiter bittet um Geduld: „Anfangs wird es eng, aber wir müssen es ausprobieren.“
      options:
        - { id: a, text: "Er rechnet zu Beginn mit Engpässen, hält den Versuch aber für notwendig.", lang: de }
        - { id: b, text: "Er will den Versuch beenden, falls es eng wird.", lang: de }
        - { id: c, text: "Er erwartet keine Probleme für die Autofahrer.", lang: de }
    answer: a
    explanation:
      vi: "Ông Reiter nói “Anfangs wird es eng” (lúc đầu sẽ chật chội) nhưng “wir müssen es ausprobieren” (chúng ta phải thử). Ông đang kêu gọi sự kiên nhẫn chứ không đề cập việc dừng thử nghiệm (b sai), và rõ ràng không cho rằng sẽ không có vấn đề gì (c sai)."

  # --- Phỏng vấn ---
  - key: de:examq:goethe-b2-m2-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn phỏng vấn trên đài phát thanh và chọn đáp án đúng cho câu hỏi.
      stem: Wie kam Herr Vogt zur Imkerei?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderatorin: Herr Vogt, Sie halten mitten in der Stadt Bienen. Wie kam es dazu?
        Herr Vogt: Durch einen Zufall. Ein Schwarm hatte sich im Hof meiner Firma niedergelassen. Statt ihn zu entfernen, habe ich mir Rat bei einem Imker geholt – und bin geblieben.
        Moderatorin: Naturschützer kritisieren, Honigbienen verdrängten Wildbienen.
        Herr Vogt: Die Kritik nehme ich ernst. Deshalb stelle ich nicht mehr Völker auf, als die Umgebung verträgt, und säe zusätzlich Wildblumen.
        Moderatorin: Und was haben Sie für die Zukunft vor?
        Herr Vogt: Ich würde gern Schulklassen einladen. Kinder sollten wissen, woher der Honig kommt. Das ist mir wichtiger als der Verkauf.
      options:
        - { id: a, text: "Ein Bienenschwarm hatte sich bei seiner Firma niedergelassen.", lang: de }
        - { id: b, text: "Ein Naturschutzverein hatte ihn darum gebeten.", lang: de }
        - { id: c, text: "Er hat die Imkerei von seinen Eltern übernommen.", lang: de }
    answer: a
    explanation:
      vi: "Ông Vogt kể “Durch einen Zufall” (do tình cờ): một đàn ong làm tổ trong sân công ty ông (“sich niedergelassen”), và thay vì đuổi đi, ông hỏi ý kiến một người nuôi ong. Hội bảo vệ thiên nhiên (b) chỉ xuất hiện khi nói về lời chỉ trích; chuyện thừa kế từ cha mẹ (c) không được nhắc đến."

  - key: de:examq:goethe-b2-m2-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn phỏng vấn và chọn câu mô tả đúng quan điểm của người được phỏng vấn.
      stem: Wie geht Herr Vogt mit der Kritik der Naturschützer um?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderatorin: Herr Vogt, Sie halten mitten in der Stadt Bienen. Wie kam es dazu?
        Herr Vogt: Durch einen Zufall. Ein Schwarm hatte sich im Hof meiner Firma niedergelassen. Statt ihn zu entfernen, habe ich mir Rat bei einem Imker geholt – und bin geblieben.
        Moderatorin: Naturschützer kritisieren, Honigbienen verdrängten Wildbienen.
        Herr Vogt: Die Kritik nehme ich ernst. Deshalb stelle ich nicht mehr Völker auf, als die Umgebung verträgt, und säe zusätzlich Wildblumen.
        Moderatorin: Und was haben Sie für die Zukunft vor?
        Herr Vogt: Ich würde gern Schulklassen einladen. Kinder sollten wissen, woher der Honig kommt. Das ist mir wichtiger als der Verkauf.
      options:
        - { id: a, text: "Er nimmt sie ernst und begrenzt die Zahl seiner Bienenvölker.", lang: de }
        - { id: b, text: "Er hält sie für übertrieben und ändert nichts.", lang: de }
        - { id: c, text: "Er hat deshalb mit der Imkerei aufgehört.", lang: de }
    answer: a
    explanation:
      vi: "“Die Kritik nehme ich ernst” rồi “stelle ich nicht mehr Völker auf, als die Umgebung verträgt”: ông không đặt nhiều đàn ong hơn mức môi trường chịu được và còn gieo thêm hoa dại. Vì vậy b (cho là phóng đại, không thay đổi gì) và c (bỏ nghề) đều trái với lời ông nói. Câu hỏi của người dẫn chương trình dùng Konjunktiv II (“verdrängten”) để thuật lại lời chỉ trích."

  - key: de:examq:goethe-b2-m2-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn phỏng vấn và chọn đáp án đúng cho câu hỏi.
      stem: Was möchte Herr Vogt in Zukunft gern tun?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderatorin: Herr Vogt, Sie halten mitten in der Stadt Bienen. Wie kam es dazu?
        Herr Vogt: Durch einen Zufall. Ein Schwarm hatte sich im Hof meiner Firma niedergelassen. Statt ihn zu entfernen, habe ich mir Rat bei einem Imker geholt – und bin geblieben.
        Moderatorin: Naturschützer kritisieren, Honigbienen verdrängten Wildbienen.
        Herr Vogt: Die Kritik nehme ich ernst. Deshalb stelle ich nicht mehr Völker auf, als die Umgebung verträgt, und säe zusätzlich Wildblumen.
        Moderatorin: Und was haben Sie für die Zukunft vor?
        Herr Vogt: Ich würde gern Schulklassen einladen. Kinder sollten wissen, woher der Honig kommt. Das ist mir wichtiger als der Verkauf.
      options:
        - { id: a, text: "Mehr Honig verkaufen.", lang: de }
        - { id: b, text: "Weitere Bienenvölker aufstellen.", lang: de }
        - { id: c, text: "Schulklassen zu sich einladen.", lang: de }
    answer: c
    explanation:
      vi: "“Ich würde gern Schulklassen einladen” (Konjunktiv II diễn đạt điều ông muốn làm): ông muốn trẻ em biết mật ong từ đâu ra. Bán được nhiều hơn (a) bị loại bằng “wichtiger als der Verkauf” (quan trọng hơn việc bán hàng); thêm đàn ong (b) mâu thuẫn với việc ông giới hạn số đàn."

  # --- Trích đoạn bài giảng ---
  - key: de:examq:goethe-b2-m2-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe trích đoạn bài giảng và chọn ý chính.
      stem: Was ist die zentrale Aussage dieses Vortragsausschnitts?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Dozent: Großraumbüros sollen die Zusammenarbeit fördern, doch Untersuchungen deuten auf ein gemischtes Bild hin. Zwar tauschen sich Kolleginnen und Kollegen spontan aus, gleichzeitig lässt aber die Konzentration nach, weil jedes Gespräch und jedes Telefonklingeln ablenkt. Besonders bei anspruchsvollen Aufgaben passieren dort mehr Fehler. Um die Nachteile zu verringern, empfiehlt es sich, kleine Räume einzurichten, in die man sich bei Bedarf zurückziehen kann. Entscheidend ist, dass die Beschäftigten selbst wählen dürfen, wo sie arbeiten.
      options:
        - { id: a, text: "Großraumbüros haben Vorteile und Nachteile, die sich mit Rückzugsräumen abmildern lassen.", lang: de }
        - { id: b, text: "Großraumbüros sind für alle Arbeitsaufgaben am besten geeignet.", lang: de }
        - { id: c, text: "Großraumbüros sollten grundsätzlich abgeschafft werden.", lang: de }
    answer: a
    explanation:
      vi: "Giảng viên nêu cả mặt tốt (trao đổi tự nhiên, “Zwar … spontan aus”) lẫn mặt xấu (kém tập trung, nhiều lỗi hơn) và đề xuất phòng nhỏ để rút lui. Phương án b trái với phần nói về lỗi ở công việc đòi hỏi cao; c quá cực đoan, vì ông chỉ đề nghị giảm bớt nhược điểm chứ không đòi bãi bỏ."

  - key: de:examq:goethe-b2-m2-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại trích đoạn bài giảng và chọn đáp án đúng cho câu hỏi.
      stem: Was schlägt der Dozent vor, um die Nachteile zu verringern?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Dozent: Großraumbüros sollen die Zusammenarbeit fördern, doch Untersuchungen deuten auf ein gemischtes Bild hin. Zwar tauschen sich Kolleginnen und Kollegen spontan aus, gleichzeitig lässt aber die Konzentration nach, weil jedes Gespräch und jedes Telefonklingeln ablenkt. Besonders bei anspruchsvollen Aufgaben passieren dort mehr Fehler. Um die Nachteile zu verringern, empfiehlt es sich, kleine Räume einzurichten, in die man sich bei Bedarf zurückziehen kann. Entscheidend ist, dass die Beschäftigten selbst wählen dürfen, wo sie arbeiten.
      options:
        - { id: a, text: "Kleine Räume, in die man sich bei Bedarf zurückziehen kann.", lang: de }
        - { id: b, text: "Mehr Schreibtische in jedem Raum.", lang: de }
        - { id: c, text: "Feste Vorgaben, wer wann wo arbeitet.", lang: de }
    answer: a
    explanation:
      vi: "“Empfiehlt es sich, kleine Räume einzurichten, in die man sich bei Bedarf zurückziehen kann” – nên lập các phòng nhỏ để rút lui khi cần. Thêm bàn làm việc (b) chỉ làm ồn hơn và không được nhắc đến; c ngược với câu cuối: điều quyết định là nhân viên được tự chọn nơi làm việc (“selbst wählen dürfen”), không phải quy định cứng."

  # --- Thảo luận: ai nói gì? ---
  - key: de:examq:goethe-b2-m2-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe cuộc thảo luận trên đài và cho biết ai có ý kiến dưới đây.
      stem: "Wer vertritt diese Meinung? – Ein Pflichtjahr könnte jungen Menschen Erfahrungen ermöglichen, die sie freiwillig nicht suchen würden."
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderator: Soll es für junge Menschen ein soziales Pflichtjahr geben, Frau Lindner?
        Frau Lindner: Ich bin dagegen. Wer zu einem Dienst gezwungen wird, arbeitet selten mit Überzeugung. Freiwilligkeit lässt sich nicht verordnen.
        Herr Okafor: Das sehe ich anders. Manche würden von sich aus nie in einem Pflegeheim helfen, könnten dort aber Erfahrungen sammeln, die ihnen sonst fehlen.
        Moderator: Gäbe es einen Mittelweg?
        Frau Lindner: Man könnte Freiwilligendienste besser bezahlen und bekannter machen.
        Herr Okafor: Das wäre ein Anfang. Ohne Pflicht erreicht man aber nicht alle.
      options:
        - { id: a, text: "der Moderator", lang: de }
        - { id: b, text: "Frau Lindner", lang: de }
        - { id: c, text: "Herr Okafor", lang: de }
    answer: c
    explanation:
      vi: "Ông Okafor nói nhiều người “von sich aus nie” (tự mình không bao giờ) giúp việc ở viện dưỡng lão nhưng có thể có những trải nghiệm mà nếu không thì họ thiếu. Câu thi diễn đạt lại ý đó. Bà Lindner phản đối nghĩa vụ; người dẫn chương trình chỉ đặt câu hỏi."

