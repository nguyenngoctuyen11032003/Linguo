  # --- Tin nhắn thoại và thông báo ---
  - key: de:examq:goethe-b2-m2-l13
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lời nhắn tự động của một phòng khám và chọn đáp án đúng cho câu hỏi.
      stem: Wie können Patientinnen und Patienten ein Rezept für ein Dauermedikament bekommen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, Sie sind verbunden mit der Gemeinschaftspraxis Doktor Lenz und Doktor Hartwig. In dieser Woche bleibt die Praxis am Mittwoch und Donnerstag wegen einer Fortbildung geschlossen. In dringenden Fällen wenden Sie sich bitte an den ärztlichen Bereitschaftsdienst. Rezepte für Dauermedikamente können Sie über unsere Internetseite anfordern; sie liegen ab Freitag zur Abholung bereit. Termine können Sie bis zum Vortag absagen.
      options:
        - { id: a, text: "Sie fordern es über die Internetseite an und holen es ab Freitag ab.", lang: de }
        - { id: b, text: "Sie holen es am Mittwoch in der Praxis ab.", lang: de }
        - { id: c, text: "Sie rufen den ärztlichen Bereitschaftsdienst an.", lang: de }
    answer: a
    explanation:
      vi: "Đơn thuốc dùng lâu dài đặt qua trang web của phòng khám (“über unsere Internetseite anfordern”) và có thể lấy từ thứ Sáu (“ab Freitag”). Thứ Tư phòng khám đóng cửa vì tập huấn (b sai); dịch vụ trực y tế chỉ dành cho trường hợp khẩn cấp (c sai)."

  - key: de:examq:goethe-b2-m2-l14
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe thông báo tại một nhà hát hòa nhạc và chọn đáp án đúng cho câu hỏi.
      stem: Was können Gäste tun, die das geänderte Programm nicht hören möchten?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Meine Damen und Herren, wegen der Erkrankung des Solisten spielt das Orchester heute Abend nicht das angekündigte Klavierkonzert, sondern ein Programm mit Kammermusik. Das Konzert beginnt wie geplant um 20 Uhr. Wer das geänderte Programm nicht hören möchte, bekommt an der Kasse bis eine Stunde nach Beginn den Eintrittspreis zurück. Wir bitten um Ihr Verständnis.
      options:
        - { id: a, text: "Sich bis eine Stunde nach Beginn das Eintrittsgeld an der Kasse erstatten lassen.", lang: de }
        - { id: b, text: "Ihre Karte für ein späteres Konzert umtauschen.", lang: de }
        - { id: c, text: "Nur vor Beginn des Konzerts ihre Karte zurückgeben.", lang: de }
    answer: a
    explanation:
      vi: "Khách không muốn nghe chương trình mới được hoàn tiền vé tại quầy “bis eine Stunde nach Beginn” (đến một giờ sau khi bắt đầu). Việc đổi vé sang buổi khác (b) không được nói đến; c sai vì thời hạn là sau khi bắt đầu một giờ chứ không chỉ trước giờ diễn."

