    answer: b
    explanation:
      vi: "Pension Waldblick chào đón chó (“Hunde sind bei uns herzlich willkommen”), nên hợp với bạn. Khách sạn Sonne không cho mang vật nuôi (“Haustiere sind leider nicht erlaubt”); chữ “nicht erlaubt” là phần quyết định."

  # --- Teil 3: biển báo, thông báo (đúng/sai) ---
  - key: de:examq:goethe-a1-m2-r08
    section: reading
    kind: mcq
    question_type: goethe_read_sign
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Đọc thông báo trước cổng trường và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Eltern können hinter der Schule parken.
      stem_lang: de
      passage: |-
        Liebe Eltern,
        vor dem Schultor dürfen Sie nicht parken! Bitte benutzen Sie den Parkplatz hinter der Schule. Danke!
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: a
    explanation:
      vi: "Thông báo cấm đỗ xe trước cổng trường (“vor dem Schultor dürfen Sie nicht parken”) và nhờ phụ huynh dùng bãi đỗ xe sau trường (“den Parkplatz hinter der Schule”), nên phụ huynh được đỗ xe phía sau trường. Câu đúng."

