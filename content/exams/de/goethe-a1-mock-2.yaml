  # ============================== VIẾT (Schreiben) ==============================
  # --- Teil 1: điền biểu mẫu (3 ô) ---
  - key: de:examq:goethe-a1-m2-w01
    section: writing
    kind: short_text
    question_type: goethe_write_form
    level_code: a1
    points: 1
    prompt:
      instruction_vi: >-
        Đọc đoạn văn và giúp Linh điền phiếu đăng ký khóa học. Chỉ viết thông tin cho ô (1), một từ.
      stem: Was schreibt Linh bei (1)?
      stem_lang: de
      passage: |-
        Ihre Freundin Linh Pham möchte in Leipzig einen Deutschkurs machen. Sie ist Anfängerin, sie kann noch nicht gut Deutsch sprechen. Am Vormittag arbeitet Linh in einem Café, deshalb möchte sie am Abend lernen. Der Kurs soll sechs Wochen dauern.

        Sprachkurs – Anmeldung
        Name: Pham
        Vorname: Linh
        Kurs (Anfänger oder Fortgeschrittene): (1) ______
        Kurszeit (Vormittag, Nachmittag oder Abend): (2) ______
        Dauer in Wochen: (3) ______
    answer:
      - Anfänger
      - Anfängerin
      - Anfängerkurs
    explanation:
      vi: "Linh là người mới học (“Sie ist Anfängerin”), nên cô chọn khóa dành cho người mới bắt đầu: Anfänger (nam) hoặc Anfängerin (nữ) đều được chấp nhận. Fortgeschrittene là khóa cho người đã học khá hơn."

  - key: de:examq:goethe-a1-m2-w02
    section: writing
    kind: short_text
    question_type: goethe_write_form
    level_code: a1
    points: 1
    prompt:
      instruction_vi: >-
        Đọc đoạn văn và giúp Linh điền phiếu đăng ký khóa học. Chỉ viết thông tin cho ô (2), chọn một trong ba từ trong ngoặc.
      stem: Was schreibt Linh bei (2)?
      stem_lang: de
      passage: |-
        Ihre Freundin Linh Pham möchte in Leipzig einen Deutschkurs machen. Sie ist Anfängerin, sie kann noch nicht gut Deutsch sprechen. Am Vormittag arbeitet Linh in einem Café, deshalb möchte sie am Abend lernen. Der Kurs soll sechs Wochen dauern.

        Sprachkurs – Anmeldung
        Name: Pham
        Vorname: Linh
        Kurs (Anfänger oder Fortgeschrittene): (1) ______
        Kurszeit (Vormittag, Nachmittag oder Abend): (2) ______
        Dauer in Wochen: (3) ______
    answer:
      - Abend
      - am Abend
      - abends
      - Abendkurs
    explanation:
      vi: "Linh làm việc buổi sáng nên muốn học vào buổi tối (“möchte sie am Abend lernen”): viết “Abend” (hoặc “am Abend”, “abends”). Vormittag là giờ cô đang làm việc nên không chọn."

  - key: de:examq:goethe-a1-m2-w03
    section: writing
    kind: short_text
    question_type: goethe_write_form
    level_code: a1
    points: 1
    prompt:
      instruction_vi: >-
        Đọc đoạn văn và giúp Linh điền phiếu đăng ký khóa học. Chỉ viết thông tin cho ô (3), bằng chữ số hoặc bằng chữ.
      stem: Was schreibt Linh bei (3)?
      stem_lang: de
      passage: |-
        Ihre Freundin Linh Pham möchte in Leipzig einen Deutschkurs machen. Sie ist Anfängerin, sie kann noch nicht gut Deutsch sprechen. Am Vormittag arbeitet Linh in einem Café, deshalb möchte sie am Abend lernen. Der Kurs soll sechs Wochen dauern.

        Sprachkurs – Anmeldung
        Name: Pham
        Vorname: Linh
        Kurs (Anfänger oder Fortgeschrittene): (1) ______
        Kurszeit (Vormittag, Nachmittag oder Abend): (2) ______
        Dauer in Wochen: (3) ______
    answer:
      - "6"
      - sechs
      - 6 Wochen
      - sechs Wochen
    explanation:
      vi: "Khóa học kéo dài sáu tuần (“Der Kurs soll sechs Wochen dauern”). Viết “6” hoặc “sechs” là đủ; ô này đã có sẵn chữ “Wochen” nên không cần viết thêm."

  # --- Teil 2: lời mời ≈ 30 từ theo 3 ý ---
  - key: de:examq:goethe-a1-m2-w04
    section: writing
    kind: essay
    question_type: goethe_write_message
    level_code: a1
    points: 10
    prompt:
      instruction_vi: >-
        Viết một tin nhắn ngắn bằng tiếng Đức (khoảng 30 từ) mời một người bạn, trả lời đủ ba ý. Dùng “du” (thân mật),
        có lời chào và lời kết.
      stem: |-
        Sie haben am Samstag Geburtstag und machen eine kleine Feier. Schreiben Sie Ihrem Freund Ben eine Einladung.
        – Wann beginnt die Feier?
        – Wo ist die Feier?
        – Was soll Ben mitbringen?
        Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie die Anrede und den Gruß nicht.
      stem_lang: de
      min_chars: 120
      max_chars: 600
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Trả lời đủ ba ý (giờ bắt đầu, địa điểm, thứ Ben cần mang); thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào (Lieber Ben,) và lời kết (Bis Samstag! / Viele Grüße + tên); các câu nối tự nhiên bằng und, aber.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng du nhất quán, động từ ở vị trí 2 trong câu kể (Am Samstag beginnt die Feier …), mạo từ đúng (ein Getränk, einen Kuchen, eine Flasche Saft); lỗi không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Lieber Ben,
      am Samstag habe ich Geburtstag und mache eine kleine Feier. Sie beginnt um 18 Uhr bei mir zu Hause. Kannst du bitte ein Getränk mitbringen? Kommst du auch?
      Viele Grüße
      Lan
    explanation:
      vi: "Lời mời A1 được chấm trước hết ở việc trả lời đủ ba ý bằng câu ngắn, rõ. Lỗi hay gặp: quên giờ hoặc địa điểm, trộn “du” với “Sie” khi viết cho bạn, đặt động từ sai vị trí sau trạng từ (“Am Samstag ich habe Geburtstag” thay vì “Am Samstag habe ich Geburtstag”)."
