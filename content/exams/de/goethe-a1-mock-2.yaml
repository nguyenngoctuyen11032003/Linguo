questions:
  # ============================== NGHE (Hören) ==============================
  # --- Teil 1: hội thoại ngắn ---
  - key: de:examq:goethe-a1-m2-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Welche Buslinie fährt zum Bahnhof?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Mann: Entschuldigung, fährt der Bus Nummer 5 zum Bahnhof?
        Frau: Nein, der Fünfer fährt zum Flughafen. Zum Bahnhof fahren Sie mit der Linie 12.
        Mann: Linie 12? Nicht Linie 21?
        Frau: Nein, die Zwölf. Die Haltestelle ist dort an der Ecke.
      options:
        - { id: a, text: "Linie 5", lang: de }
        - { id: b, text: "Linie 12", lang: de }
        - { id: c, text: "Linie 21", lang: de }
    answer: b
    explanation:
      vi: "Người phụ nữ nói rõ “Zum Bahnhof fahren Sie mit der Linie 12” và nhắc lại “Nein, die Zwölf”. Tuyến 5 đi ra sân bay (“der Fünfer fährt zum Flughafen”); tuyến 21 là con số người đàn ông nghe nhầm (zwölf – einundzwanzig dễ lẫn)."

  - key: de:examq:goethe-a1-m2-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was bestellt der Mann?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Kellnerin: Guten Tag, was möchten Sie trinken?
        Mann: Einen Tee, bitte.
        Kellnerin: Mit Milch oder mit Zitrone?
        Mann: Mit Zitrone, bitte. Milch mag ich nicht.
        Kellnerin: Gern. Möchten Sie auch etwas essen?
        Mann: Nein, danke.
      options:
        - { id: a, text: "Tee mit Zitrone", lang: de }
        - { id: b, text: "Tee mit Milch", lang: de }
        - { id: c, text: "Tee und etwas zu essen", lang: de }
    answer: a
    explanation:
      vi: "Người đàn ông gọi trà (“Einen Tee”) với chanh (“Mit Zitrone, bitte”) và nói không thích sữa (“Milch mag ich nicht”). Anh cũng từ chối đồ ăn (“Nein, danke”), nên b và c đều sai."

  - key: de:examq:goethe-a1-m2-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wie alt ist Annas Sohn?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Hast du Kinder, Anna?
        Anna: Ja, einen Sohn und eine Tochter. Der Sohn ist zehn Jahre alt, die Tochter ist sieben.
        Frau: Und wie heißen sie?
        Anna: Der Sohn heißt Tim und die Tochter heißt Lea.
      options:
        - { id: a, text: "7 Jahre", lang: de }
        - { id: b, text: "10 Jahre", lang: de }
        - { id: c, text: "17 Jahre", lang: de }
    answer: b
    explanation:
      vi: "Anna nói “Der Sohn ist zehn Jahre alt”: con trai 10 tuổi. Bảy tuổi (“sieben”) là tuổi của con gái; 17 là cách nghe nhầm “siebzehn” – ở đây không ai 17 tuổi."

  - key: de:examq:goethe-a1-m2-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: pre_a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Welche Hausnummer hat Herr Kim?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Wo wohnen Sie, Herr Kim?
        Herr Kim: Ich wohne in der Lindenstraße, Hausnummer vierzehn.
        Frau: Vierzehn? Nicht vierzig?
        Herr Kim: Nein, vierzehn. Mein Freund wohnt in Nummer vierzig.
      options:
        - { id: a, text: "4", lang: de }
        - { id: b, text: "14", lang: de }
        - { id: c, text: "40", lang: de }
    answer: b
    explanation:
      vi: "Herr Kim nói “Hausnummer vierzehn” và xác nhận “Nein, vierzehn”: số nhà 14. Số 40 (“vierzig”) là nhà của bạn anh; vierzehn (14) và vierzig (40) rất dễ nghe nhầm, hãy chú ý đuôi -zehn và -zig."

  # --- Teil 2: thông báo nơi công cộng (đúng/sai) ---
  - key: de:examq:goethe-a1-m2-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_truefalse
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở nhà ga và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Der Zug nach Köln kommt heute pünktlich an.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Achtung auf Gleis 2! Der Zug nach Köln hat heute leider zwanzig Minuten Verspätung. Ich wiederhole: Der Zug nach Köln hat zwanzig Minuten Verspätung. Wir bitten um Ihr Verständnis.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: b
    explanation:
      vi: "Thông báo nói tàu đi Köln hôm nay trễ hai mươi phút (“zwanzig Minuten Verspätung”) và nhắc lại, nên tàu không đến đúng giờ. “Verspätung” nghĩa là sự chậm trễ; “pünktlich” là đúng giờ."

  - key: de:examq:goethe-a1-m2-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_truefalse
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo trong siêu thị và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Bananen kosten heute weniger als 1,50 Euro pro Kilo.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Liebe Kundinnen und Kunden, heute im Angebot: Bananen für nur 1,29 Euro das Kilo. Joghurt, drei Becher für einen Euro. Die Angebote gelten nur heute. Viel Spaß beim Einkaufen!
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: a
    explanation:
      vi: "Bananen hôm nay chỉ 1,29 euro một ký (“nur 1,29 Euro das Kilo”), tức dưới 1,50 euro, nên câu đúng. Giá sữa chua (ba hộp một euro) là thông tin khác, không liên quan đến câu hỏi."

  - key: de:examq:goethe-a1-m2-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_truefalse
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở bảo tàng và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Die Führung beginnt heute um 11 Uhr.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, liebe Gäste. Das Museum öffnet heute erst um 11 Uhr. Die Führung für Gruppen beginnt um 12 Uhr am Eingang. Bitte denken Sie an Ihre Eintrittskarten. Vielen Dank.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: b
    explanation:
      vi: "Bảo tàng hôm nay mở cửa lúc 11 giờ (“öffnet heute erst um 11 Uhr”), còn buổi hướng dẫn bắt đầu lúc 12 giờ (“beginnt um 12 Uhr”). Câu nói 11 giờ là giờ mở cửa, không phải giờ bắt đầu buổi hướng dẫn."

  # --- Teil 3: tin nhắn thoại ---
  - key: de:examq:goethe-a1-m2-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wann treffen sich Paula und Jan?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Hallo Jan, hier ist Paula. Ich kann heute nicht um sechs Uhr kommen, ich muss länger arbeiten. Treffen wir uns um sieben Uhr vor dem Café? Dann haben wir noch Zeit für einen Kaffee. Bis dann, tschüss!
      options:
        - { id: a, text: "Um 6 Uhr.", lang: de }
        - { id: b, text: "Um 7 Uhr.", lang: de }
        - { id: c, text: "Um 8 Uhr.", lang: de }
    answer: b
    explanation:
      vi: "Paula không đến được lúc 6 giờ vì phải làm thêm (“nicht um sechs Uhr”) và đề nghị gặp lúc 7 giờ trước quán cà phê (“um sieben Uhr vor dem Café”). 6 giờ là giờ hẹn cũ đã bị hủy; 8 giờ không được nhắc đến."

  - key: de:examq:goethe-a1-m2-l09
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was soll Frau Klein mitbringen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, Frau Klein, hier ist die Stadtbücherei. Das Buch, das Sie bestellt haben, ist da. Sie können es ab morgen abholen. Bitte bringen Sie Ihren Ausweis mit. Wir sind von 10 bis 18 Uhr für Sie da. Auf Wiederhören!
      options:
        - { id: a, text: "Das Buch.", lang: de }
        - { id: b, text: "Den Ausweis.", lang: de }
        - { id: c, text: "Geld.", lang: de }
    answer: b
    explanation:
      vi: "Thư viện nhờ bà Klein mang theo chứng minh/giấy tờ tùy thân (“Bitte bringen Sie Ihren Ausweis mit”). Quyển sách là thứ bà đến nhận, không phải thứ mang đến; tiền không được nhắc tới."

  - key: de:examq:goethe-a1-m2-l10
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wohin geht Sara am Samstag?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Hallo Mama, hier ist Sara. Am Samstag gehe ich nicht ins Schwimmbad, es ist leider geschlossen. Ich gehe mit Eva in den Park, und danach essen wir Pizza. Bis später, tschüss!
      options:
        - { id: a, text: "Ins Schwimmbad.", lang: de }
        - { id: b, text: "In den Park.", lang: de }
        - { id: c, text: "Ins Kino.", lang: de }
    answer: b
    explanation:
      vi: "Sara nói “Ich gehe mit Eva in den Park”: thứ Bảy cô đi công viên với Eva. Bể bơi là nơi cô định đi nhưng đóng cửa (“nicht ins Schwimmbad … geschlossen”); rạp chiếu phim không được nhắc đến."

  # ============================== ĐỌC (Lesen) ==============================
  # --- Teil 1: tin nhắn, e-mail (đúng/sai) ---
  - key: de:examq:goethe-a1-m2-r01
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Đọc e-mail và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Noras neue Wohnung hat drei Zimmer.
      stem_lang: de
      passage: |-
        Lieber Tim,
        ich habe jetzt eine neue Wohnung! Sie hat zwei Zimmer, eine Küche und einen Balkon. Die Wohnung ist im dritten Stock, aber es gibt einen Aufzug. Am Samstag mache ich eine kleine Party. Du kommst doch? Die Party beginnt um 19 Uhr. Bring bitte etwas zu trinken mit.
        Liebe Grüße
        Nora
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: b
    explanation:
      vi: "Căn hộ có hai phòng (“zwei Zimmer”), cộng bếp và ban công; ba (“dritten”) là tầng của căn hộ, không phải số phòng. Câu nói ba phòng là sai."

