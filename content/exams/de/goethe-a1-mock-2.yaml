      vi: "Bạn muốn mua sách, nên chọn Buchhandlung (hiệu sách) ở mẩu B, nơi bán sách, tạp chí và thiệp. Mẩu A là cửa hàng hoa (Blumenhaus), không bán sách dù có mở cửa Chủ nhật."

