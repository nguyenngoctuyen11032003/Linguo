  # ============================== HÖREN (Nghe) ==============================
  - key: de:examq:goethe-b1-m2-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was passiert am Donnerstag?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, Frau Kowalski, hier spricht Herr Brandt von der Hausverwaltung. Am Donnerstag bekommt Ihr Haus neue Wasserleitungen. Deshalb gibt es an diesem Tag von 9 bis 15 Uhr kein Wasser. Am besten füllen Sie vorher ein paar Flaschen ab. Der Aufzug funktioniert ganz normal. Bei Fragen erreichen Sie mich bis Mittwoch im Büro.
      options:
        - { id: a, text: "Der Aufzug wird repariert.", lang: de }
        - { id: b, text: "Ein paar Stunden lang gibt es kein Wasser.", lang: de }
        - { id: c, text: "Herr Brandt kommt in die Wohnung von Frau Kowalski.", lang: de }
    answer: b
    explanation:
      vi: "Ông Brandt báo thứ Năm thay ống nước nên “von 9 bis 15 Uhr kein Wasser” (mất nước vài tiếng). Thang máy vẫn chạy bình thường (“funktioniert ganz normal”), không bị sửa; tin nhắn không nói ông Brandt sẽ vào căn hộ, ông chỉ nói có thể gọi đến văn phòng trước thứ Tư."

  - key: de:examq:goethe-b1-m2-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở nhà ga và chọn đáp án đúng cho câu hỏi.
      stem: Was sollen die Fahrgäste nach Bergheim machen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Meine Damen und Herren, wegen einer Störung auf der Strecke fällt der Regionalzug nach Bergheim um 14:20 Uhr heute leider aus. Fahrgäste nach Bergheim nehmen bitte den Ersatzbus. Er fährt um 14:35 Uhr vor dem Haupteingang ab. Ihre Fahrkarten gelten auch im Bus. Wir bitten um Ihr Verständnis.
      options:
        - { id: a, text: "Sie sollen auf den nächsten Zug um 14:35 Uhr warten.", lang: de }
        - { id: b, text: "Sie sollen eine neue Fahrkarte kaufen.", lang: de }
        - { id: c, text: "Sie sollen mit dem Ersatzbus fahren.", lang: de }
    answer: c
    explanation:
      vi: "Tàu đi Bergheim bị hủy (“fällt … aus”), hành khách được yêu cầu đi xe buýt thay thế (“nehmen bitte den Ersatzbus”). 14:35 là giờ xe buýt chạy, không phải giờ của một chuyến tàu khác; vé cũ vẫn dùng được trên xe buýt (“Ihre Fahrkarten gelten auch im Bus”), nên không cần mua vé mới."

  - key: de:examq:goethe-b1-m2-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was ist morgen beim Lauftreff anders als sonst?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Hallo Jana, hier ist Mehmet vom Lauftreff. Du, morgen laufen wir nicht wie immer im Stadtpark, weil dort ein Fest aufgebaut wird. Wir treffen uns stattdessen am Sportplatz hinter der Schule. Die Uhrzeit bleibt gleich, also 18 Uhr. Und vergiss nicht, genug zu trinken mitzubringen. Morgen soll es sehr warm werden. Bis morgen!
      options:
        - { id: a, text: "Die Gruppe trifft sich an einem anderen Ort.", lang: de }
        - { id: b, text: "Die Gruppe trifft sich später.", lang: de }
        - { id: c, text: "Das Training fällt wegen der Hitze aus.", lang: de }
    answer: a
    explanation:
      vi: "Ngày mai nhóm chạy không gặp ở công viên như mọi khi mà ở sân thể thao sau trường (“stattdessen am Sportplatz hinter der Schule”): đổi địa điểm. Giờ vẫn giữ nguyên (“Die Uhrzeit bleibt gleich”); trời nóng chỉ là lý do để nhắc mang đủ nước, buổi tập không bị hủy."

  - key: de:examq:goethe-b1-m2-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo trong nhà hát và chọn câu đúng.
      stem: Was ist richtig?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Liebe Besucherinnen und Besucher, wegen eines technischen Problems beginnt die Vorstellung heute etwa eine Viertelstunde später, also erst um 20:15 Uhr. Dafür wird die Pause etwas kürzer. Getränke bekommen Sie bis zum Beginn an der Bar im ersten Stock. Bitte schalten Sie während der Vorstellung Ihre Handys aus. Vielen Dank!
      options:
        - { id: a, text: "Die Vorstellung beginnt später als geplant.", lang: de }
        - { id: b, text: "Heute gibt es keine Pause.", lang: de }
        - { id: c, text: "Während der Vorstellung kann man an der Bar Getränke kaufen.", lang: de }
    answer: a
    explanation:
      vi: "Vì sự cố kỹ thuật, buổi diễn bắt đầu muộn khoảng 15 phút (“eine Viertelstunde später”, lúc 20:15). Giờ nghỉ giữa buổi chỉ ngắn hơn (“etwas kürzer”), không bị bỏ; quầy bar chỉ bán đồ uống đến lúc bắt đầu (“bis zum Beginn”), không phải trong lúc diễn."

  - key: de:examq:goethe-b1-m2-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở sân bay và chọn đáp án đúng cho câu hỏi.
      stem: Wo bekommen die Fluggäste ihr Gepäck?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Eine Information für die Fluggäste aus Porto: Wegen eines technischen Problems kommt Ihr Gepäck heute nicht an Band 4, sondern an Band 7 an. Das dauert noch etwa 20 Minuten. Wenn Ihr Koffer danach fehlt, melden Sie sich bitte am Gepäckschalter neben dem Ausgang B. Wir bitten um Entschuldigung.
      options:
        - { id: a, text: "an Band 4", lang: de }
        - { id: b, text: "an Band 7", lang: de }
        - { id: c, text: "am Ausgang B", lang: de }
    answer: b
    explanation:
      vi: "“Nicht an Band 4, sondern an Band 7”: hôm nay hành lý ra ở băng chuyền số 7, không phải số 4 như thường lệ. Lối ra B là nơi có quầy hành lý, chỉ đến đó nếu vali bị thiếu (“Wenn Ihr Koffer danach fehlt”), không phải nơi nhận hành lý."

  - key: de:examq:goethe-b1-m2-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo tại lễ hội phố cổ và chọn đáp án đúng cho câu hỏi.
      stem: Wo findet das Konzert heute statt?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Herzlich willkommen beim Altstadtfest! Ein kurzer Hinweis zum Programm: Wegen des Regens findet das Konzert heute nicht auf dem Marktplatz statt, sondern in der Stadthalle. Der Eintritt bleibt frei. Der Flohmarkt am Fluss beginnt wie geplant um 11 Uhr, und Kinder können im Zelt neben dem Rathaus malen. Viel Spaß!
      options:
        - { id: a, text: "auf dem Marktplatz", lang: de }
        - { id: b, text: "in der Stadthalle", lang: de }
        - { id: c, text: "am Fluss", lang: de }
    answer: b
    explanation:
      vi: "Vì trời mưa, buổi hòa nhạc chuyển từ quảng trường chợ vào hội trường thành phố (“nicht auf dem Marktplatz …, sondern in der Stadthalle”). Quảng trường là địa điểm ban đầu; bờ sông là nơi họp chợ đồ cũ (“Flohmarkt am Fluss”), không phải nơi hòa nhạc."

  - key: de:examq:goethe-b1-m2-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_truefalse
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại giữa hai người hàng xóm và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Die Müllabfuhr nimmt die Papiertonne manchmal nicht mit.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Guten Abend, Herr Weber. Haben Sie kurz Zeit? Es geht um die Mülltonnen.
        Mann: Natürlich, Frau Schulz. Gibt es ein Problem?
        Frau: Ja, in der Papiertonne liegen oft Plastikflaschen. Dann nimmt die Müllabfuhr die Tonne nicht mit.
        Mann: Ach, das wusste ich nicht. Ich glaube, das sind die neuen Mieter im dritten Stock.
        Frau: Könnten wir zusammen einen Zettel im Treppenhaus aufhängen?
        Mann: Gute Idee. Ich schreibe ihn heute Abend und hänge ihn morgen früh auf.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: a
    explanation:
      vi: "Bà Schulz nói trong thùng giấy thường có chai nhựa, “Dann nimmt die Müllabfuhr die Tonne nicht mit”: khi đó xe rác không lấy thùng đi. Vì chuyện này xảy ra mỗi khi có chai nhựa (“oft”), nên câu “manchmal nicht mit” (đôi khi không lấy) là đúng."

  - key: de:examq:goethe-b1-m2-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wer wirft nach Meinung von Herrn Weber Plastik in die Papiertonne?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Guten Abend, Herr Weber. Haben Sie kurz Zeit? Es geht um die Mülltonnen.
        Mann: Natürlich, Frau Schulz. Gibt es ein Problem?
        Frau: Ja, in der Papiertonne liegen oft Plastikflaschen. Dann nimmt die Müllabfuhr die Tonne nicht mit.
        Mann: Ach, das wusste ich nicht. Ich glaube, das sind die neuen Mieter im dritten Stock.
        Frau: Könnten wir zusammen einen Zettel im Treppenhaus aufhängen?
        Mann: Gute Idee. Ich schreibe ihn heute Abend und hänge ihn morgen früh auf.
      options:
        - { id: a, text: "Frau Schulz", lang: de }
        - { id: b, text: "die neuen Mieter im dritten Stock", lang: de }
        - { id: c, text: "die Müllabfuhr", lang: de }
    answer: b
    explanation:
      vi: "Ông Weber đoán: “Ich glaube, das sind die neuen Mieter im dritten Stock” (chắc là những người thuê mới ở tầng ba). Bà Schulz là người phát hiện và phàn nàn về chuyện này; đội thu gom rác (“Müllabfuhr”) chỉ là bên không chịu lấy thùng rác."

  - key: de:examq:goethe-b1-m2-l09
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was macht Herr Weber morgen früh?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Guten Abend, Herr Weber. Haben Sie kurz Zeit? Es geht um die Mülltonnen.
        Mann: Natürlich, Frau Schulz. Gibt es ein Problem?
        Frau: Ja, in der Papiertonne liegen oft Plastikflaschen. Dann nimmt die Müllabfuhr die Tonne nicht mit.
        Mann: Ach, das wusste ich nicht. Ich glaube, das sind die neuen Mieter im dritten Stock.
        Frau: Könnten wir zusammen einen Zettel im Treppenhaus aufhängen?
        Mann: Gute Idee. Ich schreibe ihn heute Abend und hänge ihn morgen früh auf.
      options:
        - { id: a, text: "Er hängt einen Zettel im Treppenhaus auf.", lang: de }
        - { id: b, text: "Er spricht mit den neuen Mietern.", lang: de }
        - { id: c, text: "Er schreibt einen Zettel.", lang: de }
