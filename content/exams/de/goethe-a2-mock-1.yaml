  - key: de:examq:goethe-a2-m1-r06
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc email và chọn đáp án đúng cho câu hỏi.
      stem: Was schreibt Hanna über ihre neue Arbeit?
      stem_lang: de
      passage: |-
        Liebe Sara,
        vielen Dank für deine Einladung! Leider kann ich am Samstag nicht zu deiner Party kommen, weil meine Eltern uns besuchen. Sie wohnen in Österreich und kommen nur zweimal im Jahr. Hast du am Sonntag Zeit? Dann bringe ich dir dein Geschenk vorbei.
        Übrigens habe ich eine neue Stelle: Seit Montag arbeite ich an der Rezeption in einem Hotel. Die Arbeit ist anstrengender als im Café, aber sie gefällt mir besser.
        Liebe Grüße
        Hanna
      options:
        - { id: a, text: "Sie ist leichter als die Arbeit im Café.", lang: de }
        - { id: b, text: "Sie gefällt ihr besser als die Arbeit im Café.", lang: de }
        - { id: c, text: "Hanna arbeitet jetzt in einem Café.", lang: de }
    answer: b
    explanation:
      vi: "“Die Arbeit ist anstrengender als im Café, aber sie gefällt mir besser”: công việc mới vất vả hơn ở quán cà phê nhưng Hanna thích hơn. Phương án a ngược nghĩa (anstrengender = mệt hơn, không phải leichter = nhẹ nhàng hơn); phương án c sai vì quán cà phê là chỗ làm cũ, giờ cô làm lễ tân khách sạn."

  - key: de:examq:goethe-a2-m1-r07
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc các mẩu rao vặt A–E và chọn mẩu phù hợp với người được mô tả.
      stem: Lan arbeitet tagsüber und möchte am Abend ihr Deutsch verbessern. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A  Deutschkurs am Abend: Grammatik und Gespräche, dienstags und donnerstags von 18 bis 20 Uhr, 8 Wochen.
        B  Fahrrad zu verkaufen: 3 Jahre alt, sehr guter Zustand, 120 Euro.
        C  Wohnung in der Stadtmitte: 2 Zimmer, Küche, Bad, Balkon, frei ab 1. Juni.
        D  Babysitter gesucht: für unsere Tochter (4 Jahre), zweimal pro Woche am Nachmittag.
        E  Kochkurs am Wochenende: Wir kochen zusammen italienisch, samstags von 10 bis 14 Uhr.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige C", lang: de }
        - { id: c, text: "Anzeige D", lang: de }
        - { id: d, text: "Anzeige E", lang: de }
    answer: a
    explanation:
      vi: "Lan đi làm ban ngày và muốn học tiếng Đức buổi tối: mẩu A là lớp tiếng Đức buổi tối (18–20 giờ). Mẩu E là khóa học nấu ăn vào sáng thứ Bảy, không phải học tiếng; mẩu D cần người trông trẻ buổi chiều, mà Lan bận làm việc ban ngày."

  - key: de:examq:goethe-a2-m1-r08
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc các mẩu rao vặt A–E và chọn mẩu phù hợp với người được mô tả.
      stem: Herr und Frau Okafor suchen eine Wohnung mit Balkon im Zentrum. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A  Deutschkurs am Abend: Grammatik und Gespräche, dienstags und donnerstags von 18 bis 20 Uhr, 8 Wochen.
        B  Fahrrad zu verkaufen: 3 Jahre alt, sehr guter Zustand, 120 Euro.
        C  Wohnung in der Stadtmitte: 2 Zimmer, Küche, Bad, Balkon, frei ab 1. Juni.
        D  Babysitter gesucht: für unsere Tochter (4 Jahre), zweimal pro Woche am Nachmittag.
        E  Kochkurs am Wochenende: Wir kochen zusammen italienisch, samstags von 10 bis 14 Uhr.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: c
    explanation:
      vi: "Mẩu C là căn hộ ở trung tâm thành phố (“in der Stadtmitte” = “im Zentrum”) có ban công (“Balkon”), đúng điều vợ chồng Okafor tìm. Các mẩu còn lại là lớp học, xe đạp và tìm người trông trẻ, không liên quan đến nhà ở."

  - key: de:examq:goethe-a2-m1-r09
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc các mẩu rao vặt A–E và chọn mẩu phù hợp với người được mô tả.
      stem: Tim ist 19 und studiert. Er möchte am Nachmittag mit Kindern arbeiten und Geld verdienen. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A  Deutschkurs am Abend: Grammatik und Gespräche, dienstags und donnerstags von 18 bis 20 Uhr, 8 Wochen.
        B  Fahrrad zu verkaufen: 3 Jahre alt, sehr guter Zustand, 120 Euro.
        C  Wohnung in der Stadtmitte: 2 Zimmer, Küche, Bad, Balkon, frei ab 1. Juni.
        D  Babysitter gesucht: für unsere Tochter (4 Jahre), zweimal pro Woche am Nachmittag.
        E  Kochkurs am Wochenende: Wir kochen zusammen italienisch, samstags von 10 bis 14 Uhr.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige D", lang: de }
        - { id: d, text: "Anzeige E", lang: de }
    answer: c
    explanation:
      vi: "Mẩu D tìm người trông một bé gái 4 tuổi, hai buổi chiều mỗi tuần: Tim vừa được làm việc với trẻ em buổi chiều vừa có thu nhập. Mẩu B là bán xe đạp (Tim phải trả tiền chứ không kiếm tiền); mẩu A và E là khóa học, người học phải trả tiền."

  - key: de:examq:goethe-a2-m1-r10
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo ngắn và chọn đáp án đúng cho câu hỏi.
      stem: Was war früher an diesem Ort?
      stem_lang: de
      passage: |-
        Ein Garten für alle
        Seit einem Jahr gibt es in der Lindenstraße einen Gemeinschaftsgarten. Früher war hier nur ein Parkplatz. Heute pflanzen etwa 30 Nachbarn dort Gemüse und Blumen. „Die meisten von uns haben keinen eigenen Garten, weil wir in kleinen Wohnungen wohnen“, sagt Petra Lang (62). Jeden Samstag treffen sich die Gärtner und arbeiten zusammen. Danach essen sie oft gemeinsam. Wer mitmachen möchte, muss nichts bezahlen. Man braucht nur ein bisschen Zeit.
      options:
        - { id: a, text: "ein Garten", lang: de }
        - { id: b, text: "ein Parkplatz", lang: de }
        - { id: c, text: "ein Wohnhaus", lang: de }
    answer: b
    explanation:
      vi: "“Früher war hier nur ein Parkplatz”: trước đây chỗ này chỉ là một bãi đỗ xe. Khu vườn là thứ có từ một năm nay (“Seit einem Jahr”), không phải trước kia; căn hộ nhỏ là nơi các thành viên ở, không phải thứ từng có ở khu đất này."

  - key: de:examq:goethe-a2-m1-r11
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo ngắn và chọn câu đúng.
      stem: Was ist richtig?
      stem_lang: de
      passage: |-
        Ein Garten für alle
        Seit einem Jahr gibt es in der Lindenstraße einen Gemeinschaftsgarten. Früher war hier nur ein Parkplatz. Heute pflanzen etwa 30 Nachbarn dort Gemüse und Blumen. „Die meisten von uns haben keinen eigenen Garten, weil wir in kleinen Wohnungen wohnen“, sagt Petra Lang (62). Jeden Samstag treffen sich die Gärtner und arbeiten zusammen. Danach essen sie oft gemeinsam. Wer mitmachen möchte, muss nichts bezahlen. Man braucht nur ein bisschen Zeit.
      options:
        - { id: a, text: "Man muss für den Garten Geld bezahlen.", lang: de }
        - { id: b, text: "Die Nachbarn arbeiten jeden Samstag zusammen im Garten.", lang: de }
        - { id: c, text: "Petra Lang hat einen großen eigenen Garten.", lang: de }
    answer: b
    explanation:
      vi: "“Jeden Samstag treffen sich die Gärtner und arbeiten zusammen”: thứ Bảy nào họ cũng gặp nhau làm vườn chung. Phương án a sai vì “muss nichts bezahlen” (không phải trả tiền); phương án c sai vì bà Lang nói phần lớn họ không có vườn riêng do sống trong căn hộ nhỏ."

  - key: de:examq:goethe-a2-m1-r12
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Ich interessiere ___ sehr für den Deutschkurs am Abend. Wann beginnt er?
      options:
        - { id: a, text: "mich", lang: de }
        - { id: b, text: "mir", lang: de }
        - { id: c, text: "sich", lang: de }
    answer: a
    explanation:
      vi: "“sich interessieren für” là động từ phản thân; với chủ ngữ “ich”, đại từ phản thân ở cách Akkusativ là “mich”: Ich interessiere mich für … “mir” là dạng Dativ (dùng như sich vorstellen: Ich stelle mir … vor), còn “sich” chỉ dùng cho er/sie/es/Sie/sie (số nhiều)."

  # ============================== SCHREIBEN (Viết) ==============================
  - key: de:examq:goethe-a2-m1-w01
    section: writing
    kind: essay
    question_type: goethe_write_message
    level_code: a2
    points: 10
    prompt:
      instruction_vi: >-
        Viết một tin nhắn ngắn bằng tiếng Đức (khoảng 20–30 từ) cho bạn, dùng “du”, trả lời đủ ba ý trong đề. Viết thành
        câu hoàn chỉnh, có lời chào và lời kết.
      stem: |-
        Sie wollen am Samstag mit Ihrer Freundin Julia einkaufen gehen. Sie können aber nicht kommen. Schreiben Sie Julia eine SMS:
        • Entschuldigen Sie sich.
        • Schreiben Sie, warum Sie nicht kommen können.
        • Machen Sie einen neuen Vorschlag.
        Schreiben Sie 20–30 Wörter.
      stem_lang: de
      min_chars: 80
      max_chars: 400
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Đủ ba ý (xin lỗi, lý do không đến được, đề nghị ngày/giờ mới) rõ ràng để Julia hiểu ngay; thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào thân mật (Hallo Julia / Liebe Julia), các ý theo thứ tự hợp lý, lời kết và tên (Liebe Grüße, …); câu nối bằng aber, weil, dann.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng “du” nhất quán, đúng vị trí động từ (động từ ở vị trí 2, cuối câu sau weil), đúng giờ/ngày (am Montag, um 16 Uhr); lỗi chính tả, ngữ pháp không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Hallo Julia,
      es tut mir leid, aber ich kann am Samstag nicht kommen, weil mein Sohn krank ist. Können wir am Montag um 16 Uhr einkaufen gehen?
      Liebe Grüße
      Linh
    explanation:
      vi: "Tin nhắn A2 được chấm trước hết ở việc trả lời đủ cả ba ý bằng câu đơn giản, đúng. Lỗi hay gặp: quên đề nghị thời gian mới, đặt động từ sai sau “weil” (“weil mein Sohn ist krank” thay vì “weil mein Sohn krank ist”), hoặc trộn “du” với “Sie” trong cùng một tin nhắn cho bạn."

  - key: de:examq:goethe-a2-m1-w02
    section: writing
    kind: essay
    question_type: goethe_write_email
    level_code: a2
    points: 10
    prompt:
      instruction_vi: >-
        Viết một email trang trọng bằng tiếng Đức (khoảng 30–40 từ) cho giáo viên, dùng “Sie”, trả lời đủ ba ý trong
        đề. Viết thành câu hoàn chỉnh, có lời chào và lời kết trang trọng.
      stem: |-
        Sie besuchen einen Deutschkurs bei Frau Schneider. Nächste Woche können Sie nicht zum Kurs kommen. Schreiben Sie Frau Schneider eine E-Mail:
        • Schreiben Sie, dass Sie nicht kommen können.
        • Erklären Sie, warum.
        • Bitten Sie um die Hausaufgaben.
        Schreiben Sie 30–40 Wörter.
      stem_lang: de
      min_chars: 150
      max_chars: 600
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Đủ ba ý (báo vắng tuần sau, lý do, xin bài tập về nhà) rõ ràng; thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Lời chào và lời kết trang trọng (Sehr geehrte Frau Schneider, … Mit freundlichen Grüßen + họ tên); các ý theo thứ tự hợp lý, nối bằng weil, dass, deshalb.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng “Sie/Ihnen” viết hoa nhất quán, câu nhờ vả lịch sự (Können Sie mir bitte …?), đúng vị trí động từ trong câu phụ với weil/dass; lỗi không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Sehr geehrte Frau Schneider,
      leider kann ich nächste Woche nicht zum Deutschkurs kommen, weil ich für meine Firma nach Frankfurt fahren muss. Können Sie mir bitte die Hausaufgaben per E-Mail schicken?
      Vielen Dank!
      Mit freundlichen Grüßen
      Nguyen Van Minh
    explanation:
      vi: "Email trang trọng A2 được chấm ở việc đủ ba ý và giữ đúng ngữ vực lịch sự từ đầu đến cuối. Lỗi hay gặp: mở đầu bằng “Hallo” hoặc dùng “du” với giáo viên, viết thường “sie/ihnen” khi xưng hô lịch sự, quên động từ khuyết thiếu ở cuối câu weil (“weil ich … fahren muss”), hoặc đặt dấu phẩy sau “Mit freundlichen Grüßen”."
