  # ============================== HÖREN (Nghe) ==============================
  - key: de:examq:goethe-a2-m1-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wann treffen sich die beiden?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Hallo Paul, wollen wir morgen zusammen ins Kino gehen?
        Mann: Gern. Wann fängt der Film an?
        Frau: Um halb acht. Wir können uns um sieben vor dem Kino treffen.
        Mann: Um sieben kann ich leider nicht, ich muss bis sieben arbeiten. Treffen wir uns um Viertel nach sieben?
        Frau: Okay, kein Problem.
      options:
        - { id: a, text: "um 19:00 Uhr", lang: de }
        - { id: b, text: "um 19:15 Uhr", lang: de }
        - { id: c, text: "um 19:30 Uhr", lang: de }
    answer: b
    explanation:
      vi: "Paul phải làm đến 7 giờ nên đề nghị gặp lúc “Viertel nach sieben” (7 giờ 15), và người nữ đồng ý (“kein Problem”). 19:00 là đề nghị đầu tiên nhưng Paul không đến được; 19:30 (“halb acht”) là giờ phim bắt đầu, không phải giờ hẹn. Lưu ý: “halb acht” là 7 rưỡi, không phải 8 rưỡi."

  - key: de:examq:goethe-a2-m1-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was kauft die Frau?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Mann: Guten Tag, was möchten Sie?
        Frau: Ich hätte gern ein Kilo Tomaten.
        Mann: Tut mir leid, Tomaten haben wir heute nicht mehr. Aber die Paprika sind sehr frisch.
        Frau: Hm, dann nehme ich zwei Paprika und eine Gurke.
      options:
        - { id: a, text: "Tomaten und eine Gurke", lang: de }
        - { id: b, text: "Paprika und eine Gurke", lang: de }
        - { id: c, text: "Tomaten und Paprika", lang: de }
    answer: b
    explanation:
      vi: "Người nữ muốn mua cà chua nhưng hôm nay hết (“haben wir heute nicht mehr”), nên cô lấy hai quả ớt chuông và một quả dưa chuột (“zwei Paprika und eine Gurke”). Hai phương án có “Tomaten” là bẫy vì cà chua được nhắc đầu tiên nhưng cô không mua được."

  - key: de:examq:goethe-a2-m1-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wo ist die Brille?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Mann: Lisa, hast du meine Brille gesehen? Ich habe sie gestern auf den Schreibtisch gelegt.
        Frau: Auf dem Schreibtisch ist sie nicht. Aber warte … sie liegt hier im Bad, neben dem Waschbecken.
        Mann: Ach ja, stimmt! Danke!
      options:
        - { id: a, text: "auf dem Schreibtisch", lang: de }
        - { id: b, text: "im Bad", lang: de }
        - { id: c, text: "im Schlafzimmer", lang: de }
    answer: b
    explanation:
      vi: "Lisa tìm thấy kính trong phòng tắm, cạnh bồn rửa (“sie liegt hier im Bad, neben dem Waschbecken”). Bàn làm việc là chỗ người nam nhớ là đã để hôm qua, nhưng Lisa nói “Auf dem Schreibtisch ist sie nicht”; phòng ngủ không được nhắc tới."

  - key: de:examq:goethe-a2-m1-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Warum war Tom gestern nicht im Deutschkurs?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Hallo Tom, du warst gestern nicht im Deutschkurs. Warst du krank?
        Mann: Nein, ich war nicht krank. Ich konnte nicht kommen, weil meine Schwester Geburtstag hatte. Wir haben bei meinen Eltern gefeiert.
        Frau: Ach so! Die Lehrerin hat gefragt, wo du bist.
      options:
        - { id: a, text: "Er war krank.", lang: de }
        - { id: b, text: "Er hatte Geburtstag.", lang: de }
        - { id: c, text: "Seine Schwester hatte Geburtstag.", lang: de }
    answer: c
    explanation:
      vi: "Tom nói “weil meine Schwester Geburtstag hatte”: hôm qua là sinh nhật chị/em gái anh, cả nhà tổ chức ở nhà bố mẹ. Phương án a sai vì Tom trả lời rõ “ich war nicht krank”; phương án b là bẫy vì có từ “Geburtstag” nhưng không phải sinh nhật của Tom."

  - key: de:examq:goethe-a2-m1-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_short
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wie fährt die Frau normalerweise zur Arbeit?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Mann: Fährst du immer mit dem Auto zur Arbeit?
        Frau: Nein, früher bin ich mit dem Auto gefahren. Aber jetzt nehme ich das Fahrrad. Das ist billiger und oft schneller als das Auto, weil es in der Stadt so viel Stau gibt.
        Mann: Und wenn es regnet?
        Frau: Dann fahre ich mit dem Bus.
      options:
        - { id: a, text: "mit dem Auto", lang: de }
        - { id: b, text: "mit dem Fahrrad", lang: de }
        - { id: c, text: "mit dem Bus", lang: de }
    answer: b
    explanation:
      vi: "“Jetzt nehme ich das Fahrrad”: bây giờ cô đi xe đạp vì rẻ hơn và thường nhanh hơn ô tô. Ô tô là cách đi trước kia (“früher bin ich … gefahren”, thì Perfekt); xe buýt chỉ dùng khi trời mưa (“wenn es regnet”), không phải thường ngày."

  - key: de:examq:goethe-a2-m1-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở nhà ga và chọn đáp án đúng cho câu hỏi.
      stem: Von welchem Gleis fährt der Zug nach Neustadt heute ab?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Achtung an Gleis 3: Der Zug nach Neustadt hat heute etwa 20 Minuten Verspätung. Der Zug fährt heute nicht von Gleis 3, sondern von Gleis 5 ab. Wir bitten um Entschuldigung.
      options:
        - { id: a, text: "von Gleis 3", lang: de }
        - { id: b, text: "von Gleis 5", lang: de }
        - { id: c, text: "von Gleis 20", lang: de }
    answer: b
    explanation:
      vi: "“Nicht von Gleis 3, sondern von Gleis 5” nghĩa là hôm nay tàu không chạy từ đường ray số 3 mà từ đường ray số 5. Số 3 là bẫy vì thông báo được đọc ở đường ray 3 (chỗ cũ); còn 20 là số phút tàu bị trễ (“20 Minuten Verspätung”)."

  - key: de:examq:goethe-a2-m1-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe thông báo trong cửa hàng bách hóa và chọn đáp án đúng cho câu hỏi.
      stem: Wo gibt es heute günstige Jacken?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Liebe Kundinnen und Kunden, heute sind in unserer Sportabteilung im zweiten Stock alle Jacken 30 Prozent billiger. Das Angebot gilt nur bis 18 Uhr. Unser Café im Erdgeschoss ist heute leider geschlossen.
      options:
        - { id: a, text: "im Erdgeschoss", lang: de }
        - { id: b, text: "im zweiten Stock", lang: de }
        - { id: c, text: "im Café", lang: de }
    answer: b
    explanation:
      vi: "Áo khoác giảm 30% ở gian hàng thể thao tầng hai (“in unserer Sportabteilung im zweiten Stock”). Tầng trệt (“Erdgeschoss”) là chỗ quán cà phê, và quán hôm nay đóng cửa, nên hai phương án kia sai."

  - key: de:examq:goethe-a2-m1-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was soll Frau Becker machen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, Frau Becker, hier ist die Praxis Dr. Wolf. Sie haben morgen um 10 Uhr einen Termin bei uns. Leider ist Dr. Wolf morgen krank. Können Sie am Donnerstag um 15 Uhr kommen? Bitte rufen Sie uns kurz zurück. Vielen Dank und auf Wiederhören!
      options:
        - { id: a, text: "Sie soll morgen um 10 Uhr in die Praxis kommen.", lang: de }
        - { id: b, text: "Sie soll die Praxis zurückrufen.", lang: de }
        - { id: c, text: "Sie soll einen anderen Arzt suchen.", lang: de }
    answer: b
    explanation:
      vi: "Phòng khám nhờ bà Becker gọi lại (“Bitte rufen Sie uns kurz zurück”) để xác nhận lịch mới vào thứ Năm. Phương án a sai vì lịch 10 giờ ngày mai bị hủy do bác sĩ ốm; tin nhắn không hề bảo bà tìm bác sĩ khác."

  - key: de:examq:goethe-a2-m1-l09
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wann kommt Mia am Bahnhof an?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Hallo Jonas, hier ist Mia. Du, ich habe meinen Zug verpasst! Ich komme nicht um zwanzig vor sechs an. Der nächste Zug ist erst um zehn nach sieben da. Kannst du mich trotzdem am Bahnhof abholen? Wenn nicht, nehme ich ein Taxi. Schreib mir bitte kurz. Bis später!
      options:
        - { id: a, text: "um 17:40 Uhr", lang: de }
        - { id: b, text: "um 19:10 Uhr", lang: de }
        - { id: c, text: "um 19:40 Uhr", lang: de }
    answer: b
    explanation:
      vi: "Mia lỡ tàu nên chuyến sau đến lúc “zehn nach sieben” (7 giờ 10 tối = 19:10). 17:40 (“zwanzig vor sechs”, 6 giờ kém 20) là giờ đến ban đầu mà cô nói là không kịp nữa; 19:40 là bẫy ghép giờ mới với số phút của giờ cũ."

  - key: de:examq:goethe-a2-m1-l10
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe bản tin thời tiết trên radio và chọn đáp án đúng cho câu hỏi.
      stem: Wie wird das Wetter morgen am Nachmittag?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und jetzt das Wetter für morgen: Am Vormittag ist es noch sonnig, aber am Nachmittag kommt Regen. Die Temperaturen liegen bei 14 Grad. Am Wochenende wird es wärmer: Am Samstag und am Sonntag haben wir bis zu 22 Grad und viel Sonne.
      options:
        - { id: a, text: "Es ist sonnig.", lang: de }
        - { id: b, text: "Es regnet.", lang: de }
        - { id: c, text: "Es ist 22 Grad warm.", lang: de }
    answer: b
    explanation:
      vi: "“Am Nachmittag kommt Regen”: chiều mai có mưa. Trời nắng chỉ vào buổi sáng (“Am Vormittag ist es noch sonnig”); 22 độ là nhiệt độ cuối tuần, còn ngày mai chỉ khoảng 14 độ."

  - key: de:examq:goethe-a2-m1-l11
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wo haben Ben und sein Bruder geschlafen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Na, Ben, wie war dein Wochenende?
        Mann: Super! Ich bin mit meinem Bruder in die Berge gefahren. Wir wollten eigentlich zelten, aber es war zu kalt. Deshalb haben wir in einer kleinen Pension geschlafen.
        Frau: Und was habt ihr gemacht?
        Mann: Am Samstag sind wir sechs Stunden gewandert. Am Sonntag hatte ich Rückenschmerzen. Wir sind nur in ein Café gegangen und dann nach Hause gefahren.
        Frau: Oje! Und geht es dir heute besser?
        Mann: Ja, heute geht es mir wieder gut.
      options:
        - { id: a, text: "im Zelt", lang: de }
        - { id: b, text: "in einer Pension", lang: de }
        - { id: c, text: "bei Freunden", lang: de }
    answer: b
    explanation:
      vi: "Ben nói “Deshalb haben wir in einer kleinen Pension geschlafen”: họ ngủ ở một nhà trọ nhỏ. Phương án a là bẫy: họ định cắm trại (“wollten eigentlich zelten”) nhưng trời quá lạnh nên không làm; ở nhờ bạn bè thì không được nhắc tới."

  - key: de:examq:goethe-a2-m1-l12
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn hội thoại và chọn đáp án đúng cho câu hỏi.
      stem: Was haben Ben und sein Bruder am Sonntag gemacht?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Frau: Na, Ben, wie war dein Wochenende?
        Mann: Super! Ich bin mit meinem Bruder in die Berge gefahren. Wir wollten eigentlich zelten, aber es war zu kalt. Deshalb haben wir in einer kleinen Pension geschlafen.
        Frau: Und was habt ihr gemacht?
        Mann: Am Samstag sind wir sechs Stunden gewandert. Am Sonntag hatte ich Rückenschmerzen. Wir sind nur in ein Café gegangen und dann nach Hause gefahren.
        Frau: Oje! Und geht es dir heute besser?
        Mann: Ja, heute geht es mir wieder gut.
      options:
        - { id: a, text: "Sie sind sechs Stunden gewandert.", lang: de }
        - { id: b, text: "Sie sind in ein Café gegangen.", lang: de }
        - { id: c, text: "Sie sind zum Arzt gegangen.", lang: de }
    answer: b
    explanation:
      vi: "Chủ nhật Ben bị đau lưng nên họ chỉ đi quán cà phê rồi về nhà (“Wir sind nur in ein Café gegangen”). Đi bộ đường dài sáu tiếng là việc của thứ Bảy (“Am Samstag”); Ben bị đau lưng nhưng không nói là đi khám bác sĩ."

  # ============================== LESEN (Đọc) ==============================
  - key: de:examq:goethe-a2-m1-r01
    section: reading
    kind: mcq
    question_type: goethe_read_sign
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc thông báo dán ở cửa phòng khám và chọn câu đúng.
      stem: Was ist richtig?
      stem_lang: de
      passage: |-
        Praxis Dr. Hoffmann
        Wegen Urlaub vom 4. bis 17. August geschlossen.
        In dringenden Fällen gehen Sie bitte zur Praxis Dr. Klein im Ärztehaus am Marktplatz.
        Ab dem 18. August sind wir wieder für Sie da.
      options:
        - { id: a, text: "Die Praxis ist im August zwei Wochen geschlossen.", lang: de }
        - { id: b, text: "Dr. Hoffmann arbeitet jetzt im Ärztehaus am Marktplatz.", lang: de }
        - { id: c, text: "Die Praxis ist ab dem 4. August wieder geöffnet.", lang: de }
    answer: a
    explanation:
      vi: "Phòng khám nghỉ phép từ 4 đến 17 tháng Tám, tức là đóng cửa hai tuần (“Wegen Urlaub … geschlossen”). Phương án b sai vì ở Ärztehaus là phòng khám của bác sĩ Klein, nơi đến khi có việc gấp; phương án c sai vì ngày 4 là ngày bắt đầu nghỉ, đến 18 mới mở lại."

  - key: de:examq:goethe-a2-m1-r02
    section: reading
    kind: mcq
    question_type: goethe_read_sign
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc thông báo trong khu nhà ở và chọn đáp án đúng cho câu hỏi.
      stem: Was sollen die Bewohner machen, wenn sie am Mittwoch nicht zu Hause sind?
      stem_lang: de
      passage: |-
        Liebe Mieterinnen und Mieter,
        am Mittwoch kommt zwischen 8 und 12 Uhr ein Techniker. Er muss in alle Wohnungen, weil er die Heizungen kontrolliert. Wenn Sie nicht zu Hause sind, geben Sie bitte Ihren Schlüssel bei Familie Yilmaz im Erdgeschoss ab.
        Vielen Dank!
        Ihre Hausverwaltung
      options:
        - { id: a, text: "Sie sollen den Techniker anrufen.", lang: de }
        - { id: b, text: "Sie sollen ihren Schlüssel bei Nachbarn abgeben.", lang: de }
        - { id: c, text: "Sie sollen die Heizung selbst kontrollieren.", lang: de }
    answer: b
    explanation:
      vi: "Thông báo ghi “geben Sie bitte Ihren Schlüssel bei Familie Yilmaz im Erdgeschoss ab”: ai vắng nhà thì gửi chìa khóa cho gia đình Yilmaz ở tầng trệt, tức là hàng xóm. Không có số điện thoại nào để gọi thợ, và người kiểm tra lò sưởi là thợ chứ không phải người thuê nhà."

  - key: de:examq:goethe-a2-m1-r03
    section: reading
    kind: mcq
    question_type: goethe_read_sign
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc thông báo của thư viện và chọn câu đúng.
      stem: Was ist richtig?
      stem_lang: de
      passage: |-
        Stadtbibliothek – neue Öffnungszeiten ab 1. Mai
        Montag: geschlossen
        Dienstag bis Freitag: 10 bis 19 Uhr
        Samstag: 10 bis 14 Uhr
        Ihre Bücher können Sie auch online verlängern.
      options:
        - { id: a, text: "Am Montag kann man keine Bücher ausleihen.", lang: de }
        - { id: b, text: "Am Samstag ist die Bibliothek bis 19 Uhr geöffnet.", lang: de }
        - { id: c, text: "Man muss für die Verlängerung in die Bibliothek gehen.", lang: de }
    answer: a
    explanation:
      vi: "Thứ Hai thư viện đóng cửa (“Montag: geschlossen”), nên hôm đó không mượn sách được. Thứ Bảy chỉ mở đến 14 giờ, còn 19 giờ là giờ đóng cửa từ thứ Ba đến thứ Sáu; gia hạn sách có thể làm trên mạng (“auch online verlängern”), không bắt buộc đến thư viện."

  - key: de:examq:goethe-a2-m1-r04
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc email và chọn đáp án đúng cho câu hỏi.
      stem: Warum kommt Hanna am Samstag nicht zur Party?
      stem_lang: de
      passage: |-
        Liebe Sara,
        vielen Dank für deine Einladung! Leider kann ich am Samstag nicht zu deiner Party kommen, weil meine Eltern uns besuchen. Sie wohnen in Österreich und kommen nur zweimal im Jahr. Hast du am Sonntag Zeit? Dann bringe ich dir dein Geschenk vorbei.
        Übrigens habe ich eine neue Stelle: Seit Montag arbeite ich an der Rezeption in einem Hotel. Die Arbeit ist anstrengender als im Café, aber sie gefällt mir besser.
        Liebe Grüße
        Hanna
      options:
        - { id: a, text: "Sie muss am Samstag arbeiten.", lang: de }
        - { id: b, text: "Ihre Eltern besuchen sie.", lang: de }
        - { id: c, text: "Sie fährt nach Österreich.", lang: de }
    answer: b
    explanation:
      vi: "Hanna viết “weil meine Eltern uns besuchen”: bố mẹ cô đến thăm vào thứ Bảy. Phương án c là bẫy vì có “Österreich”, nhưng đó là nơi bố mẹ cô sống, Hanna không đi đâu cả; email không nói thứ Bảy cô phải đi làm."

