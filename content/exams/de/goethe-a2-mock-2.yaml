      vi: "Bà Berg muốn học một ít tiếng Tây Ban Nha trước chuyến đi và chỉ rảnh buổi tối: mẩu E là khóa tiếng Tây Ban Nha cho khách du lịch, học lúc 19 giờ. Mẩu B dạy guitar cho trẻ em, không phải ngoại ngữ."

