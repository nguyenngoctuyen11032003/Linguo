  - key: de:examq:goethe-a2-m2-r10
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo ngắn và chọn đáp án đúng cho câu hỏi.
      stem: Was war früher an diesem Ort?
      stem_lang: de
      passage: |-
        Ein neuer Park für Neustadt
        Seit letzter Woche gibt es in Neustadt einen neuen Park. Früher war hier ein großer Parkplatz für Lastwagen. Jetzt gibt es Bäume, einen Spielplatz und einen kleinen See. Der Park ist jeden Tag von 6 bis 22 Uhr geöffnet. Hunde dürfen nur an der Leine laufen. Am Sonntag um 11 Uhr gibt es ein Fest für alle Familien.
      options:
        - { id: a, text: "ein Parkplatz", lang: de }
        - { id: b, text: "ein See", lang: de }
        - { id: c, text: "ein Spielplatz", lang: de }
    answer: a
    explanation:
      vi: "Bài báo viết “Früher war hier ein großer Parkplatz für Lastwagen”: trước đây chỗ này là một bãi đỗ xe tải. Hồ nhỏ và sân chơi là những thứ mới có bây giờ (“Jetzt gibt es …”)."

  - key: de:examq:goethe-a2-m2-r11
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc bài báo ngắn và chọn câu đúng.
      stem: Was ist richtig?
      stem_lang: de
      passage: |-
        Ein neuer Park für Neustadt
        Seit letzter Woche gibt es in Neustadt einen neuen Park. Früher war hier ein großer Parkplatz für Lastwagen. Jetzt gibt es Bäume, einen Spielplatz und einen kleinen See. Der Park ist jeden Tag von 6 bis 22 Uhr geöffnet. Hunde dürfen nur an der Leine laufen. Am Sonntag um 11 Uhr gibt es ein Fest für alle Familien.
      options:
        - { id: a, text: "Der Park ist nur am Wochenende geöffnet.", lang: de }
        - { id: b, text: "Hunde dürfen frei laufen.", lang: de }
        - { id: c, text: "Am Sonntag gibt es ein Fest.", lang: de }
    answer: c
    explanation:
      vi: "Bài báo nói “Am Sonntag um 11 Uhr gibt es ein Fest für alle Familien”: Chủ nhật có lễ hội cho các gia đình. Công viên mở cửa mỗi ngày (“jeden Tag”), không chỉ cuối tuần; chó chỉ được đi khi có dây dắt (“nur an der Leine”)."

  - key: de:examq:goethe-a2-m2-r12
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Meine Schwester freut sich schon sehr ___ den Urlaub nächste Woche.
      options:
        - { id: a, text: "auf", lang: de }
        - { id: b, text: "über", lang: de }
        - { id: c, text: "für", lang: de }
    answer: a
    explanation:
      vi: "“sich freuen auf + Akkusativ” dùng khi vui vì một việc sắp tới: kỳ nghỉ ở tuần sau nên là “auf den Urlaub”. “sich freuen über” dùng cho điều đã xảy ra hoặc đang có (Ich freue mich über das Geschenk); “für” không đi với sich freuen."

  # ============================== SCHREIBEN (Viết) ==============================
  - key: de:examq:goethe-a2-m2-w01
    section: writing
    kind: essay
    question_type: goethe_write_message
    level_code: a2
    points: 10
    prompt:
      instruction_vi: >-
        Viết một tin nhắn ngắn bằng tiếng Đức (khoảng 20–30 từ) cho bạn, dùng “du”, trả lời đủ ba ý trong đề. Viết thành
        câu hoàn chỉnh, có lời chào và lời kết.
      stem: |-
        Ihr Freund Max hat Sie zu einem Fußballspiel am Sonntag eingeladen. Sie können nicht mitkommen. Schreiben Sie Max eine SMS:
        • Danken Sie für die Einladung.
        • Schreiben Sie, warum Sie nicht kommen können.
        • Schlagen Sie ein anderes Treffen vor.
        Schreiben Sie 20–30 Wörter.
      stem_lang: de
      min_chars: 80
      max_chars: 400
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Đủ ba ý (cảm ơn lời mời, lý do không đi được, đề nghị một dịp gặp khác) rõ ràng để Max hiểu ngay; thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào thân mật (Hallo Max / Lieber Max), các ý theo thứ tự hợp lý, lời kết và tên (Bis bald, …); câu nối bằng aber, weil, dann.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng “du” nhất quán, đúng vị trí động từ (vị trí 2, cuối câu sau weil), đúng giờ/ngày (am Samstag, um 15 Uhr); lỗi chính tả, ngữ pháp không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Hallo Max,
      vielen Dank für die Einladung! Leider kann ich am Sonntag nicht mitkommen, weil ich für meine Prüfung lernen muss. Wollen wir am Samstag zusammen ins Kino gehen?
      Bis bald
      Linh
    explanation:
      vi: "Tin nhắn A2 được chấm trước hết ở việc trả lời đủ cả ba ý bằng câu đơn giản, đúng. Lỗi hay gặp: quên cảm ơn hoặc quên đề nghị thời gian mới, đặt động từ sai sau “weil” (“weil ich muss lernen” thay vì “weil ich lernen muss”), hoặc trộn “du” với “Sie” trong cùng một tin nhắn cho bạn."

  - key: de:examq:goethe-a2-m2-w02
    section: writing
    kind: essay
    question_type: goethe_write_email
    level_code: a2
    points: 10
    prompt:
      instruction_vi: >-
        Viết một email trang trọng bằng tiếng Đức (khoảng 30–40 từ) cho cửa hàng trực tuyến, dùng “Sie”, trả lời đủ ba ý
        trong đề. Có lời chào trang trọng và lời kết.
      stem: |-
        Sie haben im Internet einen Mantel bestellt, aber er ist zu klein. Schreiben Sie eine E-Mail an den Online-Shop „ModeLine“:
        • Schreiben Sie, was Sie bestellt haben und wann.
        • Schreiben Sie, was das Problem ist.
        • Sagen Sie, was Sie möchten, und bitten Sie um eine Antwort.
        Schreiben Sie 30–40 Wörter.
      stem_lang: de
      min_chars: 140
      max_chars: 700
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Đủ ba ý (đã đặt món gì và khi nào, vấn đề là gì, muốn đổi hoặc trả lại và xin trả lời); thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào trang trọng (Sehr geehrte Damen und Herren,), các ý theo thứ tự hợp lý, lời kết (Mit freundlichen Grüßen + họ tên).
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng “Sie” nhất quán (Sie, Ihnen, Ihre viết hoa), động từ đúng vị trí, dạng lịch sự (Ich möchte …, Könnten Sie …?); lỗi chính tả, ngữ pháp không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Sehr geehrte Damen und Herren,
      ich habe am 5. Oktober einen Mantel in Größe M bestellt. Leider ist er zu klein. Ich möchte ihn gern gegen Größe L umtauschen. Könnten Sie mir bitte schreiben, wie das geht?
      Mit freundlichen Grüßen
      Linh Nguyen
    explanation:
      vi: "Email A2 được chấm ở việc nêu đủ ba ý bằng câu lịch sự, đúng. Lỗi hay gặp: dùng “du” hoặc “Hallo” với cửa hàng, quên viết hoa Sie/Ihnen, đặt động từ sai vị trí sau “weil” hoặc “dass”, và quên nói rõ muốn gì (đổi cỡ hay trả hàng)."
