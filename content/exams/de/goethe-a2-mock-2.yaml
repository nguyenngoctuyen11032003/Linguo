        A  Fahrradwerkstatt Müller: Reparatur in einem Tag. Auch gebrauchte Fahrräder zu verkaufen.
        B  Gitarrenunterricht für Kinder ab 8 Jahren, mittwochs von 15 bis 16 Uhr im Musikhaus.
        C  Zimmer in WG: ruhig, 3. Stock, 320 Euro warm, ab 1. August. Nur für Studenten.
        D  Hilfe im Garten gesucht: samstags 3 Stunden, 12 Euro pro Stunde.
        E  Spanisch für Reisende: Kurs am Montag und Donnerstag von 19 bis 20:30 Uhr, 10 Abende.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
