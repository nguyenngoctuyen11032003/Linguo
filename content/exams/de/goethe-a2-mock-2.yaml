  - key: de:examq:goethe-a2-m2-r07
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Đọc các mẩu rao vặt A–E và chọn mẩu phù hợp với người được mô tả.
      stem: Sven ist Student und sucht ab August ein günstiges Zimmer. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A  Fahrradwerkstatt Müller: Reparatur in einem Tag. Auch gebrauchte Fahrräder zu verkaufen.
        B  Gitarrenunterricht für Kinder ab 8 Jahren, mittwochs von 15 bis 16 Uhr im Musikhaus.
        C  Zimmer in WG: ruhig, 3. Stock, 320 Euro warm, ab 1. August. Nur für Studenten.
        D  Hilfe im Garten gesucht: samstags 3 Stunden, 12 Euro pro Stunde.
        E  Spanisch für Reisende: Kurs am Montag und Donnerstag von 19 bis 20:30 Uhr, 10 Abende.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige C", lang: de }
        - { id: c, text: "Anzeige D", lang: de }
        - { id: d, text: "Anzeige E", lang: de }
    answer: b
    explanation:
      vi: "Sven là sinh viên cần phòng giá rẻ từ tháng Tám: mẩu C cho thuê phòng trong căn hộ chung, 320 euro, từ 1 tháng 8, dành cho sinh viên. Các mẩu A, D, E không liên quan đến chỗ ở."

