  # --- Blog (đúng/sai) ---
  - key: de:examq:goethe-b1-m1-r01
    section: reading
    kind: mcq
    question_type: goethe_read_truefalse
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc bài blog và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Duc hatte in Leipzig von Anfang an viele Kontakte.
      stem_lang: de
      passage: |-
        Mein erstes Jahr in Deutschland – von Duc
        Vor einem Jahr bin ich für mein Studium nach Leipzig gezogen. Am Anfang war es schwierig: Ich kannte kaum jemanden, und die Leute sprachen für mich viel zu schnell. Dann hat mir eine Kommilitonin von einem Sprachcafé erzählt, das jeden Mittwoch in der Bibliothek stattfindet. Dort habe ich Lukas kennengelernt, der Vietnamesisch lernt. Seitdem treffen wir uns jede Woche. Inzwischen verstehe ich fast alles, nur am Telefon noch nicht.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: b
    explanation:
      vi: "Duc viết “Ich kannte kaum jemanden” (tôi hầu như không quen ai) lúc mới đến, nên câu “ngay từ đầu đã có nhiều mối quen biết” là sai. “Kaum” nghĩa là “hầu như không”, không phải “một ít”."

