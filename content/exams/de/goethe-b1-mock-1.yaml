  # --- Thảo luận trên đài: ai nói ý nào? ---
  - key: de:examq:goethe-b1-m1-l10
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe cuộc thảo luận trên đài và cho biết ai nói ý sau – người dẫn chương trình, ông Kaya hay bà Brandt.
      stem: "Wer sagt das? – Bus und Bahn müssen günstiger werden."
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderatorin: Heute diskutieren wir: Brauchen wir in der Stadt noch Autos? Herr Kaya, Sie sind Busfahrer.
        Herr Kaya: Ja, und ich finde, mehr Menschen sollten Bus und Bahn nehmen. Aber dafür müssen die Tickets billiger werden.
        Moderatorin: Frau Brandt, Sie wohnen auf dem Land.
        Frau Brandt: Genau. Bei uns fährt der Bus nur zweimal am Tag. Ohne Auto käme ich nicht zur Arbeit.
        Moderatorin: Ich selbst fahre übrigens jeden Tag mit dem Fahrrad ins Studio.
      options:
        - { id: a, text: "Moderatorin", lang: de }
        - { id: b, text: "Herr Kaya", lang: de }
        - { id: c, text: "Frau Brandt", lang: de }
    answer: b
    explanation:
      vi: "Ông Kaya muốn nhiều người đi xe buýt và tàu hơn, nhưng “dafür müssen die Tickets billiger werden” (để vậy thì vé phải rẻ hơn) – cùng ý với “günstiger werden”. Bà Brandt chỉ nói xe buýt ở quê quá ít chuyến, không nói về giá vé; người dẫn chương trình chỉ kể mình đi xe đạp."

