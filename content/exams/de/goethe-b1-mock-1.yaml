questions:
  # ============================== NGHE (Hören) ==============================
  # --- Văn bản ngắn: dự báo thời tiết, tin nhắn thoại, thông báo ---
  - key: de:examq:goethe-b1-m1-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe bản tin thời tiết trên đài và chọn đáp án đúng cho câu hỏi.
      stem: Was empfiehlt der Sprecher für morgen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und nun das Wetter für morgen: Am Vormittag bleibt es im ganzen Land trocken und sonnig, aber am Nachmittag kommen von Westen starke Gewitter. Die Temperaturen steigen auf 28 Grad. Wer einen Ausflug plant, sollte also am besten früh losfahren und spätestens um 14 Uhr wieder zu Hause sein. Am Sonntag wird es dann deutlich kühler, mit Regen und höchstens 18 Grad.
      options:
        - { id: a, text: "Einen Ausflug am Vormittag machen.", lang: de }
        - { id: b, text: "Den Ausflug auf Sonntag verschieben.", lang: de }
        - { id: c, text: "Wegen der Hitze den ganzen Tag zu Hause bleiben.", lang: de }
    answer: a
    explanation:
      vi: "Buổi sáng trời khô ráo, buổi chiều có giông, nên người nói khuyên ai muốn đi chơi thì đi sớm và về nhà muộn nhất lúc 14 giờ (“früh losfahren und spätestens um 14 Uhr wieder zu Hause sein”). Chủ nhật trời mát hơn nhưng có mưa, và người nói không khuyên dời sang Chủ nhật (b sai); 28 độ không phải lý do để ở nhà cả ngày (c sai)."

  - key: de:examq:goethe-b1-m1-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: a2
    points: 1
    prompt:
      instruction_vi: Nghe tin nhắn thoại và chọn đáp án đúng cho câu hỏi.
      stem: Wann kann Frau Becker ihr Auto abholen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, Frau Becker, hier spricht Jana Lorenz von der Autowerkstatt Lorenz. Ihr Auto ist fertig. Wir haben die Bremsen repariert und außerdem das Licht vorne links gewechselt, weil es kaputt war. Das kostet zusammen 240 Euro. Sie können das Auto heute bis 18 Uhr abholen. Morgen ist die Werkstatt leider geschlossen, sonst geht es erst wieder ab Donnerstag. Auf Wiederhören!
      options:
        - { id: a, text: "Heute bis 18 Uhr oder ab Donnerstag.", lang: de }
        - { id: b, text: "Morgen ab 18 Uhr.", lang: de }
        - { id: c, text: "Erst nächste Woche.", lang: de }
    answer: a
    explanation:
      vi: "Xưởng sửa xe báo bà Becker có thể lấy xe hôm nay đến 18 giờ (“heute bis 18 Uhr”), nếu không thì từ thứ Năm (“sonst … erst wieder ab Donnerstag”). Ngày mai xưởng đóng cửa (“Morgen ist die Werkstatt leider geschlossen”), nên b sai; “tuần sau” không được nhắc đến (c sai)."

  - key: de:examq:goethe-b1-m1-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_announcement
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo trong bảo tàng và chọn đáp án đúng cho câu hỏi.
      stem: Was können die Besucher noch bis 19 Uhr machen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Liebe Besucherinnen und Besucher, in 30 Minuten schließt unser Museum. Bitte beachten Sie: Die Ausstellung im zweiten Stock ist heute schon geschlossen, weil dort ein Fest vorbereitet wird. Unser Café im Erdgeschoss ist noch bis 19 Uhr für Sie geöffnet. Wer seine Tasche an der Garderobe abgegeben hat, wird gebeten, sie bis spätestens 18 Uhr abzuholen. Vielen Dank für Ihren Besuch!
      options:
        - { id: a, text: "Im Café etwas trinken.", lang: de }
        - { id: b, text: "Die Ausstellung im zweiten Stock besuchen.", lang: de }
        - { id: c, text: "Ihre Tasche an der Garderobe abholen.", lang: de }
    answer: a
    explanation:
      vi: "Chỉ có quán cà phê ở tầng trệt mở đến 19 giờ (“Unser Café … ist noch bis 19 Uhr für Sie geöffnet”). Phòng trưng bày ở tầng hai hôm nay đã đóng vì đang chuẩn bị một bữa tiệc (b sai); túi gửi ở quầy giữ đồ phải lấy muộn nhất lúc 18 giờ, không phải 19 giờ (c sai)."

  # --- Bài nói: hướng dẫn viên trong bảo tàng ---
  - key: de:examq:goethe-b1-m1-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lời giới thiệu của hướng dẫn viên và chọn đáp án đúng cho câu hỏi.
      stem: Wer hat früher in der Fabrik gearbeitet?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Herzlich willkommen in der alten Tuchfabrik! Mein Name ist Martin Hoffmann, und ich begleite Sie heute durch das Museum. Die Fabrik wurde 1872 gebaut. Bis 1965 haben hier bis zu 800 Menschen gearbeitet, die meisten davon Frauen. Zuerst sehen wir uns die großen Maschinen im Erdgeschoss an. Danach gehen wir in den ersten Stock, wo Sie selbst ein kleines Stück Stoff weben dürfen. Fotografieren ist überall erlaubt, aber bitte ohne Blitz. Die Führung dauert etwa 90 Minuten.
      options:
        - { id: a, text: "Vor allem Frauen.", lang: de }
        - { id: b, text: "Vor allem Kinder.", lang: de }
        - { id: c, text: "Vor allem Männer.", lang: de }
    answer: a
    explanation:
      vi: "Hướng dẫn viên nói có tới 800 người làm việc ở đây, “die meisten davon Frauen” (phần lớn trong số đó là phụ nữ). Trẻ em và đàn ông không được nhắc đến như nhóm đông nhất, nên b và c sai. “Bis zu 800” nghĩa là “tối đa 800”, không phải “cho đến năm 800”."

  - key: de:examq:goethe-b1-m1-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lời giới thiệu của hướng dẫn viên và chọn đáp án đúng cho câu hỏi.
      stem: Was können die Besucher im ersten Stock machen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Herzlich willkommen in der alten Tuchfabrik! Mein Name ist Martin Hoffmann, und ich begleite Sie heute durch das Museum. Die Fabrik wurde 1872 gebaut. Bis 1965 haben hier bis zu 800 Menschen gearbeitet, die meisten davon Frauen. Zuerst sehen wir uns die großen Maschinen im Erdgeschoss an. Danach gehen wir in den ersten Stock, wo Sie selbst ein kleines Stück Stoff weben dürfen. Fotografieren ist überall erlaubt, aber bitte ohne Blitz. Die Führung dauert etwa 90 Minuten.
      options:
        - { id: a, text: "Selbst ein Stück Stoff weben.", lang: de }
        - { id: b, text: "Die großen Maschinen ansehen.", lang: de }
        - { id: c, text: "Kleidung aus Stoff kaufen.", lang: de }
    answer: a
    explanation:
      vi: "Mệnh đề quan hệ “in den ersten Stock, wo Sie selbst ein kleines Stück Stoff weben dürfen” cho biết ở tầng một khách được tự dệt một mảnh vải nhỏ. Những cỗ máy lớn nằm ở tầng trệt (“im Erdgeschoss”), nên b sai; việc mua quần áo không được nhắc đến (c sai)."

  - key: de:examq:goethe-b1-m1-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lời giới thiệu của hướng dẫn viên và chọn đáp án đúng cho câu hỏi.
      stem: Was sagt Herr Hoffmann zum Fotografieren?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Herzlich willkommen in der alten Tuchfabrik! Mein Name ist Martin Hoffmann, und ich begleite Sie heute durch das Museum. Die Fabrik wurde 1872 gebaut. Bis 1965 haben hier bis zu 800 Menschen gearbeitet, die meisten davon Frauen. Zuerst sehen wir uns die großen Maschinen im Erdgeschoss an. Danach gehen wir in den ersten Stock, wo Sie selbst ein kleines Stück Stoff weben dürfen. Fotografieren ist überall erlaubt, aber bitte ohne Blitz. Die Führung dauert etwa 90 Minuten.
      options:
        - { id: a, text: "Man darf überall fotografieren, aber ohne Blitz.", lang: de }
        - { id: b, text: "Man darf nur im Erdgeschoss fotografieren.", lang: de }
        - { id: c, text: "Fotografieren ist im Museum verboten.", lang: de }
    answer: a
    explanation:
      vi: "“Fotografieren ist überall erlaubt, aber bitte ohne Blitz” nghĩa là được chụp ảnh ở mọi nơi, chỉ không dùng đèn flash. Không có giới hạn chỉ chụp ở tầng trệt (b sai), và chụp ảnh không bị cấm (c sai)."

  # --- Hội thoại (đúng/sai) ---
  - key: de:examq:goethe-b1-m1-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe đoạn hội thoại giữa hai người bạn và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Alle vier Freunde haben Tim beim Umzug geholfen.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Paula: Hallo Tim! Wie war denn dein Umzug am Samstag?
        Tim: Anstrengend! Eigentlich wollten mir vier Freunde helfen, aber zwei sind krank geworden. Zum Glück hat mir mein Nachbar sein Auto geliehen.
        Paula: Und wie gefällt dir die neue Wohnung?
        Tim: Sie ist kleiner als die alte, aber viel heller. Und ich brauche nur noch zehn Minuten zur Arbeit, früher war es fast eine Stunde.
        Paula: Super! Machst du eine Party?
        Tim: Ja, sobald die Küche da ist. Die wird erst nächste Woche geliefert.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: b
    explanation:
      vi: "Tim nói bốn người bạn định giúp (“Eigentlich wollten mir vier Freunde helfen”), nhưng hai người bị ốm (“aber zwei sind krank geworden”), nên chỉ hai người giúp được. “Eigentlich wollten …” thường báo hiệu một dự định không thành."

  - key: de:examq:goethe-b1-m1-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_conversation
    level_code: b1
    points: 1
