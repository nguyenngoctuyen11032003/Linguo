        - { id: b, text: "Schüler der Realschule.", lang: de }
        - { id: c, text: "Die Gemeinde.", lang: de }
    answer: a
    explanation:
      vi: "“Die Idee hatte die Rentnerin Erika Vogt” – ý tưởng là của bà Erika Vogt, một người về hưu không còn chỗ để sách. Học sinh trường Realschule chỉ sơn bốt điện thoại (“von Schülern … angemalt”, bị động), còn chính quyền xã mua bốt điện thoại; cả hai đều không nghĩ ra ý tưởng."

