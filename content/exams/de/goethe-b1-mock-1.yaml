        Zum Artikel „Bald auch sonntags einkaufen?“
        Sabine K.: Ich arbeite selbst in einem Supermarkt. Wenn die Läden auch sonntags öffnen, sehe ich meine Kinder noch seltener. Der Sonntag sollte ein freier Tag für Familien bleiben.
        Jonas M.: Ich arbeite unter der Woche oft bis 20 Uhr. Für mich wäre es praktisch, wenn ich am Sonntag in Ruhe einkaufen könnte.
        Ahmet T.: Kleine Bäckereien und Kioske dürfen gern sonntags öffnen, große Supermärkte aber nicht. Sonst haben kleine Geschäfte keine Chance mehr.
      options:
        - { id: a, text: "Sabine K.", lang: de }
        - { id: b, text: "Jonas M.", lang: de }
        - { id: c, text: "Ahmet T.", lang: de }
    answer: b
    explanation:
      vi: "Jonas M. thường làm đến 20 giờ các ngày trong tuần nên “Für mich wäre es praktisch” (với tôi sẽ tiện) nếu được mua sắm vào Chủ nhật – Konjunktiv II diễn tả lợi ích giả định. Sabine K. sẽ chịu thiệt (ít gặp con hơn); Ahmet T. phản đối siêu thị lớn mở cửa Chủ nhật."

  # ============================== VIẾT (Schreiben) ==============================
  # --- E-mail thân mật ≈ 80 từ ---
  - key: de:examq:goethe-b1-m1-w01
    section: writing
    kind: essay
    question_type: goethe_write_email
    level_code: b1
    points: 10
    prompt:
      instruction_vi: >-
        Viết e-mail bằng tiếng Đức (khoảng 80 từ) cho một người bạn, trả lời đủ ba ý. Dùng “du” (thân mật), có lời
        chào, phần mở đầu, các ý theo thứ tự và lời kết.
      stem: |-
        Sie waren am Wochenende auf einem Stadtfest. Ihr Freund Max konnte leider nicht mitkommen. Schreiben Sie Max eine E-Mail.
        – Beschreiben Sie: Wie war das Fest?
        – Begründen Sie: Was hat Ihnen besonders gut gefallen und warum?
        – Machen Sie einen Vorschlag für ein Treffen.
        Schreiben Sie zu jedem Punkt zwei bis drei Sätze (circa 80 Wörter). Vergessen Sie Anrede und Gruß nicht.
      stem_lang: de
      min_chars: 350
      max_chars: 1000
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Trả lời đủ ba ý (lễ hội thế nào, điều thích nhất kèm lý do, đề nghị một buổi gặp cụ thể); mỗi ý được phát triển, thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có lời chào (Lieber Max,) và lời kết (Viele Grüße + tên); các ý theo thứ tự, nối bằng weil, deshalb, außerdem, dann; không viết thành danh sách gạch đầu dòng.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng Perfekt/Präteritum cho chuyện đã qua, mệnh đề phụ (weil, dass) với động từ cuối câu, đề nghị bằng Konjunktiv II (Wir könnten …); “du” nhất quán; lỗi không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Lieber Max,
      schade, dass du am Samstag nicht beim Stadtfest warst! Es war wirklich toll: Auf dem Marktplatz haben drei Bands gespielt, und es gab Essen aus vielen Ländern. Am besten hat mir das Konzert am Abend gefallen, weil die Sängerin eine fantastische Stimme hatte. Außerdem habe ich dort alte Schulfreunde getroffen. Hast du nächsten Freitag Zeit? Wir könnten zusammen ins Kino gehen und danach eine Pizza essen.
      Viele Grüße
      Linh
    explanation:
      vi: "E-mail B1 được chấm trước hết ở việc trả lời đủ cả ba ý và nói thêm lý do hoặc chi tiết, không chỉ liệt kê. Lỗi hay gặp: quên lý do ở ý thứ hai, đặt sai động từ trong mệnh đề “weil” (“weil die Sängerin hatte eine Stimme”), trộn “du” với “Sie”, hoặc đề nghị mơ hồ mà không nêu thời gian, hoạt động cụ thể."

  # --- Bài diễn đàn ≈ 80 từ ---
  - key: de:examq:goethe-b1-m1-w02
    section: writing
    kind: essay
    question_type: goethe_write_forum
    level_code: b1
    points: 10
    prompt:
      instruction_vi: >-
        Đọc bài đăng trên diễn đàn và viết ý kiến của bạn bằng tiếng Đức (khoảng 80 từ). Nêu rõ quan điểm, đưa ra lý
        do hoặc ví dụ và phản hồi lại ý của người viết.
      stem: |-
        Sie lesen in einem Online-Forum zum Thema „Arbeiten von zu Hause“ diesen Beitrag:
        Kai_87: „Seit einem Jahr arbeite ich nur noch von zu Hause. Ich spare viel Zeit, aber mir fehlen meine Kollegen. Was meint ihr: Ist Homeoffice die Zukunft?“
        Schreiben Sie Ihre Meinung zum Thema (circa 80 Wörter).
      stem_lang: de
      min_chars: 350
      max_chars: 1000
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Nêu quan điểm rõ ràng về làm việc tại nhà, có ít nhất hai lý do hoặc ví dụ và nhắc lại ý của Kai (tiết kiệm thời gian, nhớ đồng nghiệp).
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Mở đầu bằng quan điểm, sau đó lý do và kết luận; nối ý bằng einerseits … andererseits, außerdem, deshalb, trotzdem.
        max_points: 3
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng cách nêu ý kiến (Ich finde, dass …; Meiner Meinung nach …), mệnh đề wenn/weil/dass, Konjunktiv II (wäre ideal); không cần lời chào trang trọng; lỗi không làm khó hiểu.
        max_points: 3
    sample_answer: |-
      Ich finde Homeoffice grundsätzlich gut, aber nicht jeden Tag. Wenn man zu Hause arbeitet, steht man nicht im Stau und kann seine Zeit freier planen. Das ist besonders für Eltern ein großer Vorteil. Andererseits verstehe ich Kai gut: Ohne Kollegen fühlt man sich schnell allein, und manche Probleme kann man im Büro leichter lösen. Deshalb wäre für mich eine Mischung ideal, zum Beispiel zwei Tage zu Hause und drei Tage im Büro.
    explanation:
      vi: "Bài diễn đàn B1 được chấm ở việc nêu rõ quan điểm và lý do, đồng thời phản hồi bài đăng gốc. Lỗi hay gặp: chỉ kể chuyện bản thân mà không nêu ý kiến, đặt sai động từ sau “Deshalb” (“Deshalb eine Mischung wäre ideal” thay vì “Deshalb wäre eine Mischung ideal”), hoặc viết “Ich denke dass” thiếu dấu phẩy trước “dass”."

  # --- Tin nhắn trang trọng ≈ 40 từ ---
  - key: de:examq:goethe-b1-m1-w03
    section: writing
    kind: essay
    question_type: goethe_write_message
    level_code: b1
    points: 6
    prompt:
      instruction_vi: >-
        Viết một tin nhắn trang trọng bằng tiếng Đức (khoảng 40 từ). Dùng “Sie”, xin lỗi lịch sự, nêu lý do và đề
        nghị thời gian khác; có lời chào và lời kết trang trọng.
      stem: |-
        Sie haben am Donnerstag um 10 Uhr einen Termin mit Ihrem Vermieter, Herrn Albrecht. Sie wollen über die Reparatur der Heizung sprechen. Leider können Sie nicht kommen.
        Schreiben Sie Herrn Albrecht eine Nachricht. Entschuldigen Sie sich höflich, nennen Sie einen Grund und schlagen Sie einen neuen Termin vor (circa 40 Wörter).
      stem_lang: de
      min_chars: 180
      max_chars: 600
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Có lời xin lỗi, một lý do cụ thể và đề nghị thời gian mới rõ ràng (ngày, giờ).
        max_points: 2
      - key: organization
        label_vi: Bố cục
        description_vi: Lời chào trang trọng (Sehr geehrter Herr Albrecht,) và lời kết (Mit freundlichen Grüßen + họ tên, không có dấu phẩy sau Grüßen).
        max_points: 2
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Dùng Sie/Ihnen viết hoa nhất quán, lời đề nghị lịch sự bằng Konjunktiv II (Wäre es Ihnen … recht? Könnten wir …?), weil với động từ cuối câu.
        max_points: 2
    sample_answer: |-
      Sehr geehrter Herr Albrecht,
      leider kann ich am Donnerstag um 10 Uhr nicht zu unserem Termin kommen, weil ich kurzfristig an einer Schulung teilnehmen muss. Das tut mir sehr leid. Wäre es Ihnen am Freitagnachmittag oder am Montag nach 16 Uhr recht?
      Mit freundlichen Grüßen
      Thu Nguyen
    explanation:
      vi: "Tin nhắn trang trọng được chấm ở ba ý (xin lỗi, lý do, thời gian mới) và văn phong lịch sự. Lỗi hay gặp: viết “Lieber Herr Albrecht” hoặc “Hallo” với người cho thuê nhà mình không thân, viết thường “sie/ihnen” khi xưng hô lịch sự, chỉ nói “Ich habe keine Zeit” mà không đề nghị thời gian khác."
