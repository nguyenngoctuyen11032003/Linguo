  # --- Bài dài: điền chỗ trống và suy luận ---
  - key: de:examq:goethe-b1-m1-r09
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc đoạn văn và chọn từ đúng cho chỗ trống (1).
      stem: Welches Wort passt in Lücke (1)?
      stem_lang: de
      passage: |-
        Seit drei Jahren helfe ich sonntags ehrenamtlich in einem Tierheim. Ich gehe mit Hunden spazieren, (1) ______ bisher niemand ein Zuhause gegeben hat. Freunde fragen oft, warum ich umsonst arbeite. Ich antworte dann, dass ich selbst keinen Hund haben kann, (2) ______ meine Wohnung zu klein ist. Im Tierheim kann ich trotzdem Zeit mit Tieren verbringen. Letzten Monat wurde Bruno adoptiert, ein alter Hund, mit dem ich zwei Jahre spazieren gegangen bin. Ich war traurig, aber vor allem froh für ihn.
      options:
        - { id: a, text: "denen", lang: de }
        - { id: b, text: "die", lang: de }
        - { id: c, text: "deren", lang: de }
    answer: a
    explanation:
      vi: "Đại từ quan hệ thay cho “Hunden” (số nhiều) và đóng vai tân ngữ gián tiếp của “geben” (jemandem etwas geben: cho ai cái gì → Dativ). Dativ số nhiều của đại từ quan hệ là “denen”. “Die” là Nominativ/Akkusativ, dùng khi những con chó là chủ ngữ hoặc tân ngữ trực tiếp; “deren” là Genitiv (của chúng), không hợp nghĩa."

  - key: de:examq:goethe-b1-m1-r10
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc đoạn văn và chọn từ đúng cho chỗ trống (2).
      stem: Welches Wort passt in Lücke (2)?
      stem_lang: de
      passage: |-
        Seit drei Jahren helfe ich sonntags ehrenamtlich in einem Tierheim. Ich gehe mit Hunden spazieren, (1) ______ bisher niemand ein Zuhause gegeben hat. Freunde fragen oft, warum ich umsonst arbeite. Ich antworte dann, dass ich selbst keinen Hund haben kann, (2) ______ meine Wohnung zu klein ist. Im Tierheim kann ich trotzdem Zeit mit Tieren verbringen. Letzten Monat wurde Bruno adoptiert, ein alter Hund, mit dem ich zwei Jahre spazieren gegangen bin. Ich war traurig, aber vor allem froh für ihn.
      options:
        - { id: a, text: "weil", lang: de }
        - { id: b, text: "obwohl", lang: de }
        - { id: c, text: "trotzdem", lang: de }
    answer: a
    explanation:
      vi: "Căn hộ quá nhỏ là lý do người viết không nuôi chó được, nên cần liên từ chỉ nguyên nhân “weil”; động từ “ist” đứng cuối mệnh đề phụ, đúng với “weil”. “Obwohl” (mặc dù) ngược nghĩa. “Trotzdem” là trạng từ, không mở đầu mệnh đề phụ, sau nó động từ phải đứng ngay vị trí thứ hai (“trotzdem ist meine Wohnung …”)."

  - key: de:examq:goethe-b1-m1-r11
    section: reading
    kind: mcq
    question_type: goethe_read_inference
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc đoạn văn và chọn câu trả lời phù hợp nhất với nội dung.
      stem: Warum arbeitet die Person im Tierheim?
      stem_lang: de
      passage: |-
        Seit drei Jahren helfe ich sonntags ehrenamtlich in einem Tierheim. Ich gehe mit Hunden spazieren, (1) ______ bisher niemand ein Zuhause gegeben hat. Freunde fragen oft, warum ich umsonst arbeite. Ich antworte dann, dass ich selbst keinen Hund haben kann, (2) ______ meine Wohnung zu klein ist. Im Tierheim kann ich trotzdem Zeit mit Tieren verbringen. Letzten Monat wurde Bruno adoptiert, ein alter Hund, mit dem ich zwei Jahre spazieren gegangen bin. Ich war traurig, aber vor allem froh für ihn.
      options:
        - { id: a, text: "Sie ist gern mit Tieren zusammen, kann aber zu Hause keinen Hund haben.", lang: de }
        - { id: b, text: "Sie verdient dort zusätzliches Geld.", lang: de }
        - { id: c, text: "Ihre Freunde haben ihr diese Arbeit empfohlen.", lang: de }
    answer: a
    explanation:
      vi: "Người viết không nuôi chó được vì căn hộ quá nhỏ, nhưng ở trại động vật “trotzdem” (dù vậy) vẫn có thời gian bên động vật; từ đó suy ra họ thích ở cạnh động vật. B sai vì họ làm tình nguyện, không được trả tiền (“ehrenamtlich”, “umsonst”); c sai vì bạn bè chỉ thắc mắc vì sao họ làm không công, không hề khuyên họ làm."

  # --- Thư bạn đọc: ai nói ý nào? ---
  - key: de:examq:goethe-b1-m1-r12
    section: reading
    kind: mcq
    question_type: goethe_read_opinion
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc ba thư bạn đọc gửi báo và chọn người có ý kiến được nêu trong câu hỏi.
      stem: Wer ist der Meinung, dass nur kleine Geschäfte sonntags öffnen sollten?
      stem_lang: de
      passage: |-
        Zum Artikel „Bald auch sonntags einkaufen?“
        Sabine K.: Ich arbeite selbst in einem Supermarkt. Wenn die Läden auch sonntags öffnen, sehe ich meine Kinder noch seltener. Der Sonntag sollte ein freier Tag für Familien bleiben.
        Jonas M.: Ich arbeite unter der Woche oft bis 20 Uhr. Für mich wäre es praktisch, wenn ich am Sonntag in Ruhe einkaufen könnte.
        Ahmet T.: Kleine Bäckereien und Kioske dürfen gern sonntags öffnen, große Supermärkte aber nicht. Sonst haben kleine Geschäfte keine Chance mehr.
      options:
        - { id: a, text: "Sabine K.", lang: de }
        - { id: b, text: "Jonas M.", lang: de }
        - { id: c, text: "Ahmet T.", lang: de }
    answer: c
    explanation:
      vi: "Ahmet T. cho rằng tiệm bánh nhỏ và ki-ốt được mở Chủ nhật, còn siêu thị lớn thì không (“große Supermärkte aber nicht”), để cửa hàng nhỏ còn cơ hội. Sabine K. muốn Chủ nhật là ngày nghỉ cho mọi gia đình (không phân biệt cửa hàng lớn nhỏ); Jonas M. muốn được đi mua sắm vào Chủ nhật."

