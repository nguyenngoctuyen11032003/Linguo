      passage: |-
        KLEINWALDE. Seit Mai steht am Marktplatz ein ungewöhnlicher Bücherschrank: eine alte Telefonzelle, die von Schülern der Realschule bunt angemalt wurde. Jeder darf dort kostenlos Bücher hineinstellen oder mitnehmen. Die Idee hatte die Rentnerin Erika Vogt, die selbst keinen Platz mehr für ihre vielen Romane hatte. Die Gemeinde hat die Telefonzelle gekauft, die Farbe wurde mit Spenden bezahlt. Schon nach zwei Wochen war der Schrank voll. Nun wünschen sich viele Bewohner einen zweiten am Bahnhof.
      options:
