      stem_lang: de
      passage: |-
        A: Sprachtandem gesucht! Spanierin (29) möchte ihr Deutsch verbessern und hilft dir dafür mit Spanisch.
        B: Fahrradwerkstatt für alle: Jeden Samstag reparieren wir Ihr Rad gemeinsam mit Ihnen. Werkzeug ist vorhanden.
