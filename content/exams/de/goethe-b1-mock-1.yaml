        Frau Brandt: Genau. Bei uns fährt der Bus nur zweimal am Tag. Ohne Auto käme ich nicht zur Arbeit.
        Moderatorin: Ich selbst fahre übrigens jeden Tag mit dem Fahrrad ins Studio.
      options:
        - { id: a, text: "Moderatorin", lang: de }
        - { id: b, text: "Herr Kaya", lang: de }
        - { id: c, text: "Frau Brandt", lang: de }
    answer: a
    explanation:
      vi: "Người dẫn chương trình kể “Ich selbst fahre … jeden Tag mit dem Fahrrad ins Studio” – trường quay là nơi cô làm việc, “Rad” là cách nói ngắn của “Fahrrad”. Ông Kaya là tài xế xe buýt, còn bà Brandt đi làm bằng ô tô."

