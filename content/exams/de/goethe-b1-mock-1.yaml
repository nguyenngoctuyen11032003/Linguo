      instruction_vi: Nghe đoạn hội thoại giữa hai người bạn và cho biết câu sau đúng (Richtig) hay sai (Falsch).
      stem: Tim ist jetzt schneller bei der Arbeit als früher.
      stem_lang: de
      audio_asset_id: null
      script: |-
        Paula: Hallo Tim! Wie war denn dein Umzug am Samstag?
        Tim: Anstrengend! Eigentlich wollten mir vier Freunde helfen, aber zwei sind krank geworden. Zum Glück hat mir mein Nachbar sein Auto geliehen.
        Paula: Und wie gefällt dir die neue Wohnung?
        Tim: Sie ist kleiner als die alte, aber viel heller. Und ich brauche nur noch zehn Minuten zur Arbeit, früher war es fast eine Stunde.
        Paula: Super! Machst du eine Party?
        Tim: Ja, sobald die Küche da ist. Die wird erst nächste Woche geliefert.
      options:
        - { id: a, text: "Richtig", lang: de }
        - { id: b, text: "Falsch", lang: de }
    answer: a
    explanation:
      vi: "Bây giờ Tim chỉ cần mười phút để đến chỗ làm (“nur noch zehn Minuten”), trước đây mất gần một tiếng (“früher war es fast eine Stunde”), nên câu đúng. Đừng nhầm với chi tiết căn hộ mới nhỏ hơn: câu hỏi nói về thời gian đi làm, không nói về diện tích."

