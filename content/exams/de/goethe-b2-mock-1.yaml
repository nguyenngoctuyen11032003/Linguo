      stem_lang: de
      passage: |-
        A: Rhetorik kompakt – sicher präsentieren im Beruf. Zwei Samstage, höchstens 8 Personen, mit Videofeedback.
        B: Buchhaltung für Selbstständige – Online-Abendkurs, 6 Wochen, dienstags von 19 bis 21 Uhr.
        C: Bewerbungstraining für den Wiedereinstieg nach der Elternzeit, vormittags, mit Kinderbetreuung.
        D: Englisch für den Beruf (B1), Intensivkurs: zwei Wochen ganztägig, Montag bis Freitag.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: a
    explanation:
      vi: "Ông Yilmaz cần tự tin khi thuyết trình và chỉ rảnh cuối tuần (“Unter der Woche” = trong tuần, ông không có thời gian). Khóa A dạy thuyết trình (“sicher präsentieren”) vào hai ngày thứ Bảy. Khóa D học từ thứ Hai đến thứ Sáu nên không hợp; B học tối thứ Ba, cũng là ngày trong tuần."

  - key: de:examq:goethe-b2-m1-r09
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Đọc tình huống và bốn mẩu quảng cáo khóa học, chọn quảng cáo phù hợp với người được mô tả.
      stem: Frau Brück war drei Jahre mit ihrer Tochter zu Hause und möchte jetzt wieder arbeiten. Für ihr Kind hat sie vormittags noch keine Betreuung gefunden. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A: Rhetorik kompakt – sicher präsentieren im Beruf. Zwei Samstage, höchstens 8 Personen, mit Videofeedback.
        B: Buchhaltung für Selbstständige – Online-Abendkurs, 6 Wochen, dienstags von 19 bis 21 Uhr.
        C: Bewerbungstraining für den Wiedereinstieg nach der Elternzeit, vormittags, mit Kinderbetreuung.
        D: Englisch für den Beruf (B1), Intensivkurs: zwei Wochen ganztägig, Montag bis Freitag.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: c
    explanation:
      vi: "Bà Brück muốn đi làm lại sau thời gian ở nhà nuôi con và chưa có chỗ gửi con buổi sáng. Khóa C dành riêng cho người quay lại công việc sau kỳ nghỉ nuôi con (“Wiedereinstieg nach der Elternzeit”) và có trông trẻ (“mit Kinderbetreuung”). Khóa D học cả ngày, bà không có ai trông con."

  # --- Bài đọc dài (hai phần): suy luận và chọn câu đúng ---
  - key: de:examq:goethe-b2-m1-r10
    section: reading
    kind: mcq
    question_type: goethe_read_inference
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc phần đầu bài báo về sự buồn chán và chọn điều có thể suy ra từ nội dung.
      stem: Was lässt sich aus dem Text schließen?
      stem_lang: de
      passage: |-
        Lob der Langeweile (Teil 1)
        Langeweile gilt als lästiger Zustand, den man möglichst schnell beenden will. Kaum entsteht eine Pause, greifen viele zum Smartphone. Einige Psychologinnen und Psychologen vertreten jedoch die Auffassung, dass gerade diese ungeliebten Momente einen Nutzen haben könnten: Wer sich langweilt, lässt seine Gedanken schweifen und kommt dabei mitunter auf Ideen, die ihm bei konzentrierter Arbeit nicht eingefallen wären.
      options:
        - { id: a, text: "Wer jede Pause mit dem Smartphone füllt, verpasst möglicherweise Gelegenheiten für neue Ideen.", lang: de }
        - { id: b, text: "Konzentriertes Arbeiten verhindert grundsätzlich gute Ideen.", lang: de }
        - { id: c, text: "Alle Fachleute empfehlen, sich möglichst oft zu langweilen.", lang: de }
    answer: a
    explanation:
      vi: "Nếu lúc buồn chán có thể giúp nảy ra ý tưởng, thì người luôn lấp mọi khoảng trống bằng điện thoại có thể bỏ lỡ cơ hội đó: đây là suy luận hợp lý, và chữ “möglicherweise” giữ đúng mức thận trọng của bài (“könnten”, “mitunter”). Phương án b khái quát quá mức (“grundsätzlich”); c sai vì chỉ “einige” chuyên gia có ý kiến này và họ không khuyên ai cả."

  - key: de:examq:goethe-b2-m1-r11
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc phần tiếp theo của bài báo và chọn câu đúng với nội dung.
      stem: Welche Aussage entspricht dem Text?
      stem_lang: de
      passage: |-
        Lob der Langeweile (Teil 2)
        Die Psychologin Clara Wendt warnt allerdings davor, Langeweile zu verklären. Wer etwa am Arbeitsplatz dauerhaft unterfordert sei, leide oft darunter, statt kreativ zu werden. Entscheidend sei, ob man die freie Zeit selbst gewählt habe oder ob sie einem aufgezwungen werde. Kurze Phasen des Nichtstuns, so ihr Fazit, seien kein Zeitverlust – zum Dauerzustand sollten sie aber nicht werden.
      options:
        - { id: a, text: "Ob Langeweile nützt, hängt laut Clara Wendt auch davon ab, ob man sie selbst gewählt hat.", lang: de }
        - { id: b, text: "Dauerhafte Unterforderung im Beruf macht die meisten Menschen kreativer.", lang: de }
        - { id: c, text: "Clara Wendt hält jede Form von Nichtstun für Zeitverschwendung.", lang: de }
    answer: a
    explanation:
      vi: "Bài dùng Konjunktiv I (sei, leide, habe, werde) để thuật lại lời bà Wendt: điều quyết định là thời gian rảnh do mình tự chọn hay bị áp đặt. Phương án b ngược với câu “leide oft darunter, statt kreativ zu werden” (thường khổ sở thay vì sáng tạo); c ngược với kết luận “seien kein Zeitverlust” (không phải lãng phí thời gian)."

  # --- Điền từ nối ---
  - key: de:examq:goethe-b2-m1-r12
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: ___ der kurzfristigen Absage des Referenten konnte die Veranstaltung wie geplant stattfinden, weil eine Kollegin den Vortrag übernahm.
      options:
        - { id: a, text: "Trotz", lang: de }
        - { id: b, text: "Wegen", lang: de }
        - { id: c, text: "Obwohl", lang: de }
        - { id: d, text: "Dank", lang: de }
    answer: a
    explanation:
      vi: "Sau chỗ trống là cụm danh từ ở cách 2 (“der kurzfristigen Absage”), và quan hệ là nhượng bộ: dù diễn giả hủy vào phút chót, sự kiện vẫn diễn ra. Vì vậy cần giới từ “Trotz”. “Obwohl” là liên từ, phải đi với mệnh đề có động từ; “Wegen” (vì) và “Dank” (nhờ) sai nghĩa, vì việc hủy không phải lý do khiến sự kiện diễn ra."

  - key: de:examq:goethe-b2-m1-r13
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Die Nachfrage nach den Produkten ist stark gestiegen. ___ hat das Unternehmen zusätzliche Fachkräfte eingestellt.
      options:
        - { id: a, text: "Trotzdem", lang: de }
        - { id: b, text: "Deshalb", lang: de }
        - { id: c, text: "Obwohl", lang: de }
        - { id: d, text: "Weil", lang: de }
    answer: b
    explanation:
      vi: "Câu thứ hai là hệ quả của câu thứ nhất (nhu cầu tăng → tuyển thêm người), và động từ “hat” đứng ngay sau chỗ trống, tức là trạng từ nối chiếm vị trí 1: “Deshalb hat …”. “Trotzdem” cũng đứng được ở vị trí này nhưng sai nghĩa (mặc dù vậy); “Obwohl” và “Weil” là liên từ phụ, sẽ đẩy động từ xuống cuối mệnh đề."

  - key: de:examq:goethe-b2-m1-r14
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Je früher man sich für den Kurs anmeldet, ___ größer ist die Chance auf einen Platz.
      options:
        - { id: a, text: "desto", lang: de }
        - { id: b, text: "als", lang: de }
        - { id: c, text: "wie", lang: de }
        - { id: d, text: "dann", lang: de }
    answer: a
    explanation:
      vi: "Cấu trúc so sánh tăng tiến “je + so sánh hơn …, desto + so sánh hơn …” (càng … càng …): “Je früher …, desto größer …”. Vế với “desto” đảo động từ lên ngay sau tính từ (“desto größer ist”). Ngoài “desto” còn có thể dùng “umso”, nhưng từ này không có trong các phương án; “als”, “wie”, “dann” không đi với “je”."

  - key: de:examq:goethe-b2-m1-r15
    section: reading
    kind: mcq
    question_type: goethe_read_gap
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Chọn từ phù hợp nhất để điền vào chỗ trống.
      stem: Welches Wort passt in die Lücke?
      stem_lang: de
      passage: Die neue Heizungsanlage ist ___ in der Anschaffung teuer, aber langfristig senkt sie die Energiekosten deutlich.
      options:
        - { id: a, text: "zwar", lang: de }
        - { id: b, text: "sowohl", lang: de }
        - { id: c, text: "weder", lang: de }
        - { id: d, text: "entweder", lang: de }
    answer: a
    explanation:
      vi: "Liên từ hai phần “zwar …, aber …” (tuy … nhưng …) nêu một nhược điểm rồi đối lập với ưu điểm: đắt khi mua nhưng về lâu dài giảm chi phí năng lượng. “Sowohl” đi với “als auch”, “weder” với “noch”, “entweder” với “oder”; không cặp nào khớp với “aber” trong câu."

  # ============================== VIẾT (Schreiben) ==============================
  # --- Teil 1: bài đăng diễn đàn ≈ 150 từ ---
  - key: de:examq:goethe-b2-m1-w01
    section: writing
    kind: essay
    question_type: goethe_write_forum
    level_code: b2
    points: 20
    prompt:
      instruction_vi: >-
        Viết một bài đăng diễn đàn bằng tiếng Đức (khoảng 150 từ) nêu ý kiến về câu hỏi trong đề và bàn đủ bốn ý gợi ý.
        Có câu mở đầu, lập luận có lý do hoặc ví dụ, và câu kết.
      stem: |-
        In einem Onlineforum wird gefragt: „Sollte man auch nach Feierabend für den Arbeitgeber erreichbar sein?“
        Schreiben Sie einen Diskussionsbeitrag (circa 150 Wörter):
        – Äußern Sie Ihre Meinung zu der Frage.
        – Nennen Sie Vorteile und Nachteile ständiger Erreichbarkeit.
        – Beschreiben Sie, wie das in Ihrem Umfeld oder Ihrem Heimatland ist.
        – Machen Sie einen Vorschlag für eine Lösung.
      stem_lang: de
      min_chars: 750
      max_chars: 2000
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Bàn đủ bốn ý (quan điểm, ưu và nhược điểm, tình hình ở nơi bạn sống, đề xuất) và phát triển bằng lý do, ví dụ; quan điểm rõ ràng, nhất quán. Thiếu một ý hoặc chỉ liệt kê mà không giải thích là mất điểm.
        max_points: 5
      - key: communicative_achievement
        label_vi: Hiệu quả giao tiếp
        description_vi: Đúng văn phong bài đăng diễn đàn (trung tính, lịch sự, hướng tới người đọc), lập luận thuyết phục, có nhắc tới ý kiến trái chiều; không viết như tin nhắn.
        max_points: 5
      - key: organization
        label_vi: Bố cục
        description_vi: Có câu mở đầu, các đoạn mỗi đoạn một ý và câu kết; dùng từ nối đa dạng (einerseits … andererseits, zwar … aber, deshalb, außerdem, letztlich).
        max_points: 5
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Từ vựng và cấu trúc đa dạng ở mức B2 (Konjunktiv II, bị động, mệnh đề quan hệ, danh từ hóa), động từ đúng vị trí; lỗi ít và không gây hiểu nhầm.
        max_points: 5
    sample_answer: |-
      Ich finde es grundsätzlich problematisch, wenn Beschäftigte auch nach Feierabend ständig erreichbar sein müssen.

      Einerseits hat Erreichbarkeit durchaus Vorteile: Dringende Fragen lassen sich schnell klären, und man kann flexibler arbeiten. Andererseits verschwimmt dadurch die Grenze zwischen Arbeit und Freizeit. Wer abends noch E-Mails liest, kann kaum abschalten und ist am nächsten Morgen weniger erholt.

      In meinem Umfeld ist das sehr unterschiedlich. Meine Schwester arbeitet in einer kleinen Firma und wird oft am Wochenende angerufen. In meinem Team dagegen gilt die Regel, dass nach 18 Uhr keine Nachrichten verschickt werden.

      Meiner Meinung nach wäre es sinnvoll, wenn jedes Unternehmen klare Zeiten festlegen würde, in denen niemand antworten muss. Für echte Notfälle könnte man eine Vertretung bestimmen. So wären die Beschäftigten zufriedener, und die Arbeit würde trotzdem nicht liegen bleiben.
    explanation:
      vi: "Bài đăng diễn đàn B2 được chấm trước hết ở việc bàn đủ các ý gợi ý và lập luận có cân nhắc hai mặt. Lỗi hay gặp: bỏ sót ý (thường là phần đề xuất), chỉ liệt kê mà không giải thích, viết quá ngắn, quên đảo động từ sau trạng từ đầu câu (“Andererseits verschwimmt”, không phải “Andererseits die Grenze verschwimmt”) hoặc để động từ không ở cuối mệnh đề phụ (“wenn … festlegen würde”)."

  # --- Teil 2: thư trang trọng ≈ 100 từ ---
  - key: de:examq:goethe-b2-m1-w02
    section: writing
    kind: essay
    question_type: goethe_write_email
    level_code: b2
    points: 16
    prompt:
      instruction_vi: >-
        Viết một thư/e-mail trang trọng bằng tiếng Đức (khoảng 100 từ) gửi người phụ trách khóa học, trả lời đủ các ý
        trong đề. Dùng “Sie”, có lời xưng hô và lời chào kết phù hợp.
      stem: |-
        Sie haben sich im Bildungszentrum Lindenau für den Abendkurs „Projektmanagement“ angemeldet und die Kursgebühr schon bezahlt. Nun erfahren Sie, dass der Kurs von Dienstag auf Donnerstag verlegt wird. Donnerstags können Sie nicht.
        Schreiben Sie an die Kursleiterin, Frau Hartmann (circa 100 Wörter):
        – Bedauern Sie die Änderung und erklären Sie, warum Sie donnerstags nicht können.
        – Bitten Sie um eine Lösung (ein anderer Kurs oder die Erstattung der Gebühr).
        Vergessen Sie Anrede und Gruß nicht.
      stem_lang: de
      min_chars: 450
      max_chars: 1400
    rubric:
      - key: content
        label_vi: Nội dung
        description_vi: Trả lời đủ các ý (tiếc về thay đổi, lý do không đến được vào thứ Năm, đề nghị giải pháp cụ thể); thiếu một ý là mất điểm phần này.
        max_points: 4
      - key: communicative_achievement
        label_vi: Hiệu quả giao tiếp
        description_vi: Văn phong trang trọng, lịch sự nhưng rõ ràng (Sie nhất quán, yêu cầu bằng Konjunktiv II như “Könnten Sie …?”, “Ich wäre Ihnen dankbar, wenn …”); người đọc biết chính xác bạn cần gì.
        max_points: 4
      - key: organization
        label_vi: Bố cục
        description_vi: Có xưng hô (Sehr geehrte Frau Hartmann,), lý do viết thư, phần trình bày, lời cảm ơn hoặc đề nghị phản hồi, và lời chào kết (Mit freundlichen Grüßen + tên, không có dấu phẩy sau Grüßen).
        max_points: 4
      - key: language
        label_vi: Ngôn ngữ
        description_vi: Từ vựng và cấu trúc B2 phù hợp thư trang trọng (danh từ hóa như “die Verlegung des Kurses”, bị động, mệnh đề phụ), lỗi ít và không gây hiểu nhầm.
        max_points: 4
    sample_answer: |-
      Sehr geehrte Frau Hartmann,

      mit Bedauern habe ich erfahren, dass der Kurs „Projektmanagement“ von Dienstag auf Donnerstag verlegt wird. Leider kann ich an diesem Tag nicht teilnehmen, da ich donnerstags bis 20 Uhr arbeite und diese Schicht nicht tauschen kann.

      Da ich die Kursgebühr bereits bezahlt habe, möchte ich Sie um eine Lösung bitten. Könnten Sie mir mitteilen, ob es einen vergleichbaren Kurs an einem anderen Wochentag gibt? Falls das nicht möglich ist, wäre ich Ihnen dankbar, wenn die Gebühr erstattet werden könnte.

      Vielen Dank im Voraus für Ihre Rückmeldung.

      Mit freundlichen Grüßen
      Minh Nguyen
    explanation:
      vi: "Thư trang trọng B2 được chấm ở việc trả lời đủ các ý và giữ giọng lịch sự mà vẫn rõ ràng. Lỗi hay gặp: viết hoa chữ đầu sau dấu phẩy của lời xưng hô (đúng là “mit Bedauern …” viết thường), trộn “du” với “Sie”, yêu cầu quá thẳng (“Geben Sie mir mein Geld zurück”) thay vì “Könnten Sie …?” / “Ich wäre Ihnen dankbar, wenn …”, và quên lời chào kết."
