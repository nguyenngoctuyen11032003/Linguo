      stem: Was muss geschehen, bevor ein Dach bepflanzt werden darf?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, in meiner Präsentation geht es um Dachgärten in Hellbrück. Zuerst stelle ich das Projekt „Grün nach oben“ vor, danach spreche ich über Vorteile und Nachteile. Seit zwei Jahren werden in Hellbrück die Flachdächer von Schulen und Bürogebäuden bepflanzt. Gepflegt werden die Gärten von Anwohnern, die dafür ein eigenes Beet bekommen. Ein Nachteil sind die Kosten: Bevor ein Dach bepflanzt werden darf, muss nämlich geprüft werden, ob es das zusätzliche Gewicht trägt.
      options:
