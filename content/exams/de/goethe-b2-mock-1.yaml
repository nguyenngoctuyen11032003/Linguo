  # --- Thư trang trọng ---
  - key: de:examq:goethe-b2-m1-r05
    section: reading
    kind: mcq
    question_type: goethe_read_email
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc thư của công ty quản lý nhà và chọn đáp án đúng cho câu hỏi.
      stem: Was sollen die Mieterinnen und Mieter bis zum 1. März tun?
      stem_lang: de
      passage: |-
        Sehr geehrte Mieterinnen und Mieter,
        wie angekündigt, wird das Treppenhaus Ihres Hauses vom 3. bis 14. März renoviert. Während dieser Zeit ist der Aufzug außer Betrieb. Wir bitten Sie, sämtliche im Treppenhaus abgestellten Gegenstände bis zum 1. März zu entfernen; danach noch vorhandene Gegenstände werden entsorgt. Wer nicht gut Treppen steigen kann, kann nach vorheriger Absprache unsere Unterstützung in Anspruch nehmen.
        Mit freundlichen Grüßen
        Hausverwaltung Kessler
      options:
        - { id: a, text: "Ihre Sachen aus dem Treppenhaus wegräumen.", lang: de }
        - { id: b, text: "Sich schriftlich für die Renovierung anmelden.", lang: de }
        - { id: c, text: "Die Hausverwaltung über ihren Urlaub informieren.", lang: de }
    answer: a
    explanation:
      vi: "Thư yêu cầu dọn “sämtliche im Treppenhaus abgestellten Gegenstände” (mọi đồ vật được để ở cầu thang – cụm phân từ làm định ngữ đứng trước danh từ) trước ngày 1/3, nếu không sẽ bị vứt bỏ. Không có yêu cầu đăng ký (b) hay báo lịch nghỉ phép (c)."

