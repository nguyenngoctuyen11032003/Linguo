questions:
  # ============================== NGHE (Hören) ==============================
  # --- Bản tin phát thanh ---
  - key: de:examq:goethe-b2-m1-l01
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe bản tin phát thanh và chọn đáp án đúng cho câu hỏi.
      stem: Was müssen die Besucherinnen und Besucher des Reparaturcafés bezahlen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und nun nach Lindenau: Dort hat am Samstag das erste Reparaturcafé der Stadt eröffnet. Im Gemeindezentrum reparieren ehrenamtliche Helferinnen und Helfer kaputte Toaster, Lampen oder Fahrräder – kostenlos, nur um eine Spende wird gebeten. Die Idee stammt von der pensionierten Elektrikerin Helga Brandner. „Viele Geräte landen im Müll, obwohl oft nur ein Kabel locker ist“, sagt sie. Ersatzteile müssen allerdings selbst bezahlt werden.
      options:
        - { id: a, text: "Nur die Ersatzteile.", lang: de }
        - { id: b, text: "Eine feste Gebühr für jede Reparatur.", lang: de }
        - { id: c, text: "Gar nichts, auch die Ersatzteile sind kostenlos.", lang: de }
    answer: a
    explanation:
      vi: "Việc sửa chữa miễn phí (“kostenlos”), chỉ xin đóng góp tự nguyện (“nur um eine Spende wird gebeten”), nhưng phụ tùng thay thế thì khách tự trả (“Ersatzteile müssen allerdings selbst bezahlt werden”). Không có phí cố định nào (b sai); c sai vì “allerdings” mở ra đúng ngoại lệ về phụ tùng."

  - key: de:examq:goethe-b2-m1-l02
    section: listening
    kind: mcq
    question_type: goethe_listen_gist
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe lại bản tin và chọn ý chính.
      stem: Worum geht es in dem Bericht hauptsächlich?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Und nun nach Lindenau: Dort hat am Samstag das erste Reparaturcafé der Stadt eröffnet. Im Gemeindezentrum reparieren ehrenamtliche Helferinnen und Helfer kaputte Toaster, Lampen oder Fahrräder – kostenlos, nur um eine Spende wird gebeten. Die Idee stammt von der pensionierten Elektrikerin Helga Brandner. „Viele Geräte landen im Müll, obwohl oft nur ein Kabel locker ist“, sagt sie. Ersatzteile müssen allerdings selbst bezahlt werden.
      options:
        - { id: a, text: "Um ein neues Angebot, bei dem Freiwillige kaputte Geräte reparieren.", lang: de }
        - { id: b, text: "Um die Eröffnung eines Elektrogeschäfts im Gemeindezentrum.", lang: de }
        - { id: c, text: "Um Probleme mit der Müllabfuhr in Lindenau.", lang: de }
    answer: a
    explanation:
      vi: "Cả bản tin nói về quán cà phê sửa đồ (Reparaturcafé) vừa mở, nơi người tình nguyện (“ehrenamtliche Helferinnen und Helfer”) sửa đồ hỏng. Đây không phải cửa hàng điện máy bán hàng (b sai); “Müll” chỉ xuất hiện trong lời giải thích lý do mở quán, không phải chủ đề về thu gom rác (c sai)."

  # --- Phỏng vấn ---
  - key: de:examq:goethe-b2-m1-l03
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe đoạn phỏng vấn trên đài phát thanh và chọn đáp án đúng cho câu hỏi.
      stem: Warum hat Frau Falk eine Ausbildung gemacht?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderator: Frau Falk, Sie haben nach dem Abitur nicht studiert, sondern eine Ausbildung zur Tischlerin gemacht. Warum?
        Frau Falk: Viele dachten, ich hätte keinen Studienplatz bekommen. Das stimmt aber nicht. Ich wollte abends sehen, was ich mit meinen Händen geschaffen habe.
        Moderator: Haben Sie die Entscheidung je bereut?
        Frau Falk: Im ersten Jahr manchmal, weil meine Freunde mehr Freizeit hatten. Heute nicht mehr. Ich wünschte nur, die Schulen würden besser über Ausbildungsberufe informieren.
      options:
        - { id: a, text: "Sie wollte das Ergebnis ihrer Arbeit direkt sehen.", lang: de }
        - { id: b, text: "Sie hatte keinen Studienplatz bekommen.", lang: de }
        - { id: c, text: "Ihre Freunde hatten ihr dazu geraten.", lang: de }
    answer: a
    explanation:
      vi: "Chị Falk nói muốn mỗi tối nhìn thấy thứ mình làm ra bằng đôi tay (“sehen, was ich mit meinen Händen geschaffen habe”). Phương án b là bẫy: đó là điều người khác tưởng (“Viele dachten, ich hätte …” – Konjunktiv II để thuật lại ý nghĩ sai), và chị phủ nhận ngay (“Das stimmt aber nicht”). Bạn bè chỉ được nhắc khi nói về thời gian rảnh."

  - key: de:examq:goethe-b2-m1-l04
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn phỏng vấn và chọn câu mô tả đúng quan điểm của người được phỏng vấn.
      stem: Wie beurteilt Frau Falk ihre Entscheidung heute?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderator: Frau Falk, Sie haben nach dem Abitur nicht studiert, sondern eine Ausbildung zur Tischlerin gemacht. Warum?
        Frau Falk: Viele dachten, ich hätte keinen Studienplatz bekommen. Das stimmt aber nicht. Ich wollte abends sehen, was ich mit meinen Händen geschaffen habe.
        Moderator: Haben Sie die Entscheidung je bereut?
        Frau Falk: Im ersten Jahr manchmal, weil meine Freunde mehr Freizeit hatten. Heute nicht mehr. Ich wünschte nur, die Schulen würden besser über Ausbildungsberufe informieren.
      options:
        - { id: a, text: "Sie ist zufrieden, auch wenn der Anfang nicht leicht war.", lang: de }
        - { id: b, text: "Sie bereut sie, weil sie zu wenig Freizeit hat.", lang: de }
        - { id: c, text: "Sie würde inzwischen lieber doch studieren.", lang: de }
    answer: a
    explanation:
      vi: "Chị thừa nhận năm đầu đôi khi hối tiếc (“Im ersten Jahr manchmal”) nhưng “Heute nicht mehr” – bây giờ thì không. Phương án b ghép sai thời điểm: chuyện ít thời gian rảnh là của năm đầu, không phải hiện tại; c không được nói đến ở đâu trong bài."

  - key: de:examq:goethe-b2-m1-l05
    section: listening
    kind: mcq
    question_type: goethe_listen_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại đoạn phỏng vấn và chọn đáp án đúng cho câu hỏi.
      stem: Was wünscht sich Frau Falk?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderator: Frau Falk, Sie haben nach dem Abitur nicht studiert, sondern eine Ausbildung zur Tischlerin gemacht. Warum?
        Frau Falk: Viele dachten, ich hätte keinen Studienplatz bekommen. Das stimmt aber nicht. Ich wollte abends sehen, was ich mit meinen Händen geschaffen habe.
        Moderator: Haben Sie die Entscheidung je bereut?
        Frau Falk: Im ersten Jahr manchmal, weil meine Freunde mehr Freizeit hatten. Heute nicht mehr. Ich wünschte nur, die Schulen würden besser über Ausbildungsberufe informieren.
      options:
        - { id: a, text: "Mehr Freizeit für Auszubildende.", lang: de }
        - { id: b, text: "Bessere Informationen über Ausbildungsberufe an den Schulen.", lang: de }
        - { id: c, text: "Mehr Studienplätze für Abiturientinnen und Abiturienten.", lang: de }
    answer: b
    explanation:
      vi: "“Ich wünschte nur, die Schulen würden besser über Ausbildungsberufe informieren” (Konjunktiv II diễn đạt mong ước): chị mong trường phổ thông giới thiệu tốt hơn về các nghề học theo hệ đào tạo nghề. Thời gian rảnh (a) và chỗ học đại học (c) có được nhắc nhưng không phải điều chị mong muốn."

  # --- Trích đoạn bài giảng ---
  - key: de:examq:goethe-b2-m1-l06
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe trích đoạn bài giảng và chọn ý chính.
      stem: Was ist die zentrale Aussage dieses Vortragsausschnitts?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Dozentin: Wer für eine Prüfung lernt, sitzt oft am Abend vorher stundenlang am Schreibtisch. Kurzfristig mag das funktionieren, doch das so Gelernte ist meist schnell wieder vergessen. Viele Untersuchungen legen nahe, dass es sinnvoller ist, den Stoff auf mehrere kurze Einheiten zu verteilen, die über Tage oder Wochen hinweg wiederholt werden. Entscheidend ist dabei, dass man sich die Inhalte aktiv ins Gedächtnis ruft, statt die Notizen nur noch einmal durchzulesen.
      options:
        - { id: a, text: "Wer verteilt und aktiv wiederholt, behält das Gelernte länger.", lang: de }
        - { id: b, text: "Man sollte am Abend vor einer Prüfung möglichst lange lernen.", lang: de }
        - { id: c, text: "Notizen sind beim Lernen überflüssig.", lang: de }
    answer: a
    explanation:
      vi: "Giảng viên khuyên chia kiến thức thành nhiều buổi ngắn, ôn lại trong nhiều ngày hoặc nhiều tuần, và chủ động nhớ lại nội dung. Phương án b là thói quen bà phê phán (“schnell wieder vergessen”); c sai vì bà không nói ghi chép vô ích, chỉ nói đọc lại ghi chép thôi thì chưa đủ."

  - key: de:examq:goethe-b2-m1-l07
    section: listening
    kind: mcq
    question_type: goethe_listen_lecture
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe lại trích đoạn bài giảng và chọn đáp án đúng cho câu hỏi.
      stem: Was ist laut der Dozentin beim Wiederholen entscheidend?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Dozentin: Wer für eine Prüfung lernt, sitzt oft am Abend vorher stundenlang am Schreibtisch. Kurzfristig mag das funktionieren, doch das so Gelernte ist meist schnell wieder vergessen. Viele Untersuchungen legen nahe, dass es sinnvoller ist, den Stoff auf mehrere kurze Einheiten zu verteilen, die über Tage oder Wochen hinweg wiederholt werden. Entscheidend ist dabei, dass man sich die Inhalte aktiv ins Gedächtnis ruft, statt die Notizen nur noch einmal durchzulesen.
      options:
        - { id: a, text: "Dass man die Notizen mehrmals durchliest.", lang: de }
        - { id: b, text: "Dass man sich die Inhalte selbst ins Gedächtnis ruft.", lang: de }
        - { id: c, text: "Dass man möglichst lange Lerneinheiten einplant.", lang: de }
    answer: b
    explanation:
      vi: "“Entscheidend ist dabei, dass man sich die Inhalte aktiv ins Gedächtnis ruft” – điều quyết định là tự gợi lại nội dung trong trí nhớ. Phương án a chính là điều bị loại bằng “statt … nur noch einmal durchzulesen” (thay vì chỉ đọc lại); c ngược với lời khuyên chia thành các buổi ngắn (“kurze Einheiten”)."

  # --- Thảo luận: ai nói gì? ---
  - key: de:examq:goethe-b2-m1-l08
    section: listening
    kind: mcq
    question_type: goethe_listen_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Nghe cuộc thảo luận trên đài và cho biết ai có ý kiến dưới đây.
      stem: "Wer vertritt diese Meinung? – Hausaufgaben benachteiligen Kinder, die zu Hause keine Unterstützung bekommen."
      stem_lang: de
      audio_asset_id: null
      script: |-
        Moderatorin: Brauchen Kinder noch Hausaufgaben, Frau Albers?
        Frau Albers: Ich halte sie für überholt. Kinder aus Familien, in denen niemand helfen kann, sind klar im Nachteil.
        Herr Demir: Das sehe ich anders. Wer nur in der Schule übt, lernt nie, sich selbst zu organisieren.
        Moderatorin: Gäbe es einen Kompromiss?
        Frau Albers: Geübt werden sollte dort, wo Lehrkräfte helfen können: in der Schule.
        Herr Demir: Da bin ich teilweise bei Ihnen. Kurze Aufgaben zu Hause halte ich trotzdem für sinnvoll.
      options:
        - { id: a, text: "die Moderatorin", lang: de }
        - { id: b, text: "Frau Albers", lang: de }
        - { id: c, text: "Herr Demir", lang: de }
    answer: b
    explanation:
      vi: "Bà Albers nói trẻ ở những gia đình không ai giúp được “klar im Nachteil” (rõ ràng chịu thiệt), đúng với ý “benachteiligen”. Người dẫn chương trình chỉ đặt câu hỏi, không nêu quan điểm; ông Demir thì phản đối (“Das sehe ich anders”)."

