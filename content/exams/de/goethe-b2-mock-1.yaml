  # --- Bài thuyết trình ---
  - key: de:examq:goethe-b2-m1-l11
    section: listening
    kind: mcq
    question_type: goethe_listen_gist
    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe phần mở đầu một bài thuyết trình và chọn chủ đề chính.
      stem: Worum geht es in der Präsentation?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Guten Tag, in meiner Präsentation geht es um Dachgärten in Hellbrück. Zuerst stelle ich das Projekt „Grün nach oben“ vor, danach spreche ich über Vorteile und Nachteile. Seit zwei Jahren werden in Hellbrück die Flachdächer von Schulen und Bürogebäuden bepflanzt. Gepflegt werden die Gärten von Anwohnern, die dafür ein eigenes Beet bekommen. Ein Nachteil sind die Kosten: Bevor ein Dach bepflanzt werden darf, muss nämlich geprüft werden, ob es das zusätzliche Gewicht trägt.
      options:
        - { id: a, text: "Um ein Projekt, bei dem Dächer in der Stadt bepflanzt werden.", lang: de }
        - { id: b, text: "Um den Bau neuer Schulen und Bürogebäude.", lang: de }
        - { id: c, text: "Um Tipps für den Gemüseanbau auf dem Balkon.", lang: de }
    answer: a
    explanation:
      vi: "Người thuyết trình nói ngay câu đầu: chủ đề là vườn trên mái nhà (“Dachgärten”) ở Hellbrück, cụ thể là dự án “Grün nach oben”. Trường học và tòa văn phòng chỉ là nơi có mái bằng được trồng cây, không phải công trình mới (b sai); ban công không được nhắc đến (c sai)."

  - key: de:examq:goethe-b2-m1-l12
    section: listening
