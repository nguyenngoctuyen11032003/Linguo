        Kommentar: Das verlernte Warten
        Ob Paket, Serie oder Antwort auf eine Nachricht – wir haben uns daran gewöhnt, dass alles sofort verfügbar ist. Wer heute bestellt, erwartet die Lieferung morgen. Dass wir dabei etwas verlieren, wird selten bemerkt: Vorfreude entsteht nur dort, wo man warten muss. Natürlich wäre es weltfremd, auf die Bequemlichkeit der neuen Dienste ganz zu verzichten. Man sollte sich aber fragen, ob die Eile im Einzelfall wirklich nötig ist. Oft ist sie es nicht.
      options:
