  - key: de:examq:goethe-b2-m1-r07
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc tình huống và bốn mẩu quảng cáo khóa học, chọn quảng cáo phù hợp với người được mô tả.
      stem: Lena hat sich gerade als Grafikdesignerin selbstständig gemacht. Tagsüber hat sie Kundentermine. Sie möchte lernen, ihre Finanzen selbst zu verwalten. Welche Anzeige passt?
      stem_lang: de
      passage: |-
        A: Rhetorik kompakt – sicher präsentieren im Beruf. Zwei Samstage, höchstens 8 Personen, mit Videofeedback.
        B: Buchhaltung für Selbstständige – Online-Abendkurs, 6 Wochen, dienstags von 19 bis 21 Uhr.
        C: Bewerbungstraining für den Wiedereinstieg nach der Elternzeit, vormittags, mit Kinderbetreuung.
        D: Englisch für den Beruf (B1), Intensivkurs: zwei Wochen ganztägig, Montag bis Freitag.
      options:
        - { id: a, text: "Anzeige A", lang: de }
        - { id: b, text: "Anzeige B", lang: de }
        - { id: c, text: "Anzeige C", lang: de }
        - { id: d, text: "Anzeige D", lang: de }
    answer: b
    explanation:
      vi: "Lena vừa tự kinh doanh và muốn tự quản lý tài chính, ban ngày bận gặp khách: khóa B (kế toán cho người tự kinh doanh, học trực tuyến buổi tối) phù hợp cả nội dung lẫn thời gian. Khóa D học cả ngày trong tuần, trùng giờ gặp khách và không về tài chính; A và C khác chủ đề."

  - key: de:examq:goethe-b2-m1-r08
    section: reading
    kind: mcq
    question_type: goethe_read_match
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc tình huống và bốn mẩu quảng cáo khóa học, chọn quảng cáo phù hợp với người được mô tả.
