      stem_lang: de
      audio_asset_id: null
      script: |-
        Liebe Besucherinnen und Besucher der Fachmesse „Holz und Raum“: Der Vortrag „Möbel aus Restholz“, der um 14 Uhr in Halle 2 stattfinden sollte, wird wegen der großen Nachfrage in den Konferenzsaal im Obergeschoss verlegt. Der Beginn verschiebt sich auf 14.30 Uhr. Wer sich bereits online angemeldet hat, muss sich nicht erneut registrieren. Die Workshops in Halle 2 finden wie geplant statt.
      options:
        - { id: a, text: "Er beginnt später und findet in einem anderen Raum statt.", lang: de }
