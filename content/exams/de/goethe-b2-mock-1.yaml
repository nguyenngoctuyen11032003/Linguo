  # --- Phóng sự tạp chí ---
  - key: de:examq:goethe-b2-m1-r03
    section: reading
    kind: mcq
    question_type: goethe_read_detail
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc bài phóng sự trên tạp chí và chọn đáp án đúng cho câu hỏi.
      stem: Wie wurde der neue Laden finanziert?
      stem_lang: de
      passage: |-
        Als vor drei Jahren der letzte Supermarkt in Altenbrunn schloss, mussten die Einwohner zum Einkaufen in die Stadt fahren. Heute gibt es wieder einen Laden – betrieben von den Bewohnern selbst. Über 100 von ihnen haben Anteile gekauft und so das nötige Startkapital aufgebracht. Verkauft werden Produkte von Höfen aus der Umgebung. Zwei Angestellte führen den Laden, unterstützt von Freiwilligen. Gewinn sei nicht das Ziel, betont die Vorsitzende Petra Lohmann: „Der Laden ist auch ein Treffpunkt.“
      options:
        - { id: a, text: "Durch Anteile, die Einwohner gekauft haben.", lang: de }
        - { id: b, text: "Durch einen Kredit der Gemeinde.", lang: de }
        - { id: c, text: "Durch die Höfe aus der Umgebung.", lang: de }
    answer: a
    explanation:
      vi: "Hơn một trăm người dân đã mua cổ phần (“Anteile gekauft”) và nhờ đó góp đủ vốn ban đầu (“das nötige Startkapital aufgebracht” – cụm “Kapital aufbringen” = huy động vốn). Bài không nhắc khoản vay nào (b); các trang trại quanh vùng chỉ cung cấp hàng để bán (c)."

  - key: de:examq:goethe-b2-m1-r04
    section: reading
