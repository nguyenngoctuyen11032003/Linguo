    level_code: b1
    points: 1
    prompt:
      instruction_vi: Nghe thông báo ở nhà ga và chọn đáp án đúng cho câu hỏi.
      stem: Was gilt für Fahrgäste, die heute nach 20 Uhr nach Talbrunn fahren wollen?
      stem_lang: de
      audio_asset_id: null
      script: |-
        Eine Information für Reisende in Richtung Talbrunn: Wegen Bauarbeiten zwischen Tannberg und Talbrunn fallen heute ab 20 Uhr alle Regionalzüge auf diesem Abschnitt aus. Stattdessen ist ein Ersatzverkehr mit Bussen eingerichtet. Die Busse fahren am Bahnhofsvorplatz ab, Ausgang Nord. Bitte beachten Sie, dass sich die Fahrzeit dadurch um etwa 30 Minuten verlängert. Fahrräder können im Ersatzverkehr leider nicht mitgenommen werden.
      options:
        - { id: a, text: "Sie fahren mit einem Bus, der am Bahnhofsvorplatz abfährt.", lang: de }
        - { id: b, text: "Ihr Zug fährt von einem anderen Gleis ab.", lang: de }
        - { id: c, text: "Sie können ihr Fahrrad im Bus mitnehmen.", lang: de }
    answer: a
    explanation:
      vi: "Từ 20 giờ các tàu khu vực trên đoạn này bị hủy (“fallen … aus”), thay bằng xe buýt (“Ersatzverkehr mit Bussen”) xuất phát ở quảng trường trước ga, lối ra phía Bắc. Không có chuyện đổi đường ray (b); c ngược với câu cuối: xe đạp không được mang lên xe buýt thay thế."

