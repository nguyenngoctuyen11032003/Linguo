  - key: de:examq:goethe-b2-m1-r01
    section: reading
    kind: mcq
    question_type: goethe_read_opinion
    level_code: b2
    points: 1
    prompt:
      instruction_vi: Đọc bài bình luận và chọn câu thể hiện đúng quan điểm của người viết.
      stem: Welche Haltung vertritt die Verfasserin oder der Verfasser des Kommentars?
      stem_lang: de
      passage: |-
        Kommentar: Das verlernte Warten
        Ob Paket, Serie oder Antwort auf eine Nachricht – wir haben uns daran gewöhnt, dass alles sofort verfügbar ist. Wer heute bestellt, erwartet die Lieferung morgen. Dass wir dabei etwas verlieren, wird selten bemerkt: Vorfreude entsteht nur dort, wo man warten muss. Natürlich wäre es weltfremd, auf die Bequemlichkeit der neuen Dienste ganz zu verzichten. Man sollte sich aber fragen, ob die Eile im Einzelfall wirklich nötig ist. Oft ist sie es nicht.
      options:
        - { id: a, text: "Man muss nicht auf alle modernen Dienste verzichten, sollte aber bewusster mit dem Wunsch nach Schnelligkeit umgehen.", lang: de }
        - { id: b, text: "Schnelle Lieferdienste sollten abgeschafft werden.", lang: de }
        - { id: c, text: "Warten ist in jedem Fall verlorene Zeit.", lang: de }
    answer: a
    explanation:
      vi: "Người viết nói từ bỏ hẳn sự tiện lợi là “weltfremd” (xa rời thực tế, Konjunktiv II “wäre”), nhưng nên tự hỏi trong từng trường hợp có thật cần gấp không. Vì vậy b quá cực đoan; c ngược với ý chính, vì chính việc chờ đợi tạo ra niềm háo hức mong chờ (“Vorfreude”)."

