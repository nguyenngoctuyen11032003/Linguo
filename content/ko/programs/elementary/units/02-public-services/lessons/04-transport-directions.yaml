title:
  vi: Đi tàu điện ngầm, xe buýt và hỏi đường
objectives:
  - vi: Hỏi và hiểu cách đi tàu, xe - 몇 호선, 갈아타다, 정류장, 교통카드, 타다/내리다.
  - vi: Chỉ hướng bằng N(으)로 - 오른쪽으로, 왼쪽으로, 쭉 가세요 - và chọn đúng 로/으로 theo patchim.
  - vi: Chỉ dẫn "chỉ cần… là được" bằng V-(으)면 돼요.
