title:
  vi: Khi đi tham quan - V-(으)ㄹ 때 & V-(으)면서
objectives:
  - vi: Nói "khi…" bằng V/A-(으)ㄹ 때, N 때 và phân biệt với V-았/었을 때 (khi việc đã xảy ra).
  - vi: Nói hai việc cùng lúc của một người bằng V-(으)면서.
  - vi: Dùng từ vựng tham quan - 관광지, 구경하다, 경치, 기념품, 산, 바다, 박물관, 아름답다.
estimated_minutes: 17
skills: [grammar, vocabulary, listening, writing]
prerequisites: [ko:lesson:before-after-travel]
