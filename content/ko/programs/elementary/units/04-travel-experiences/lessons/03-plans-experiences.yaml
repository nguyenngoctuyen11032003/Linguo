title:
  vi: Dự định & trải nghiệm - "định…", "đã từng…"
objectives:
  - vi: Nói dự định bằng V-(으)려고 하다 và "đã định… nhưng" bằng V-(으)려고 했어요.
  - vi: Hỏi và kể trải nghiệm bằng V-(으)ㄴ 적이 있다/없다, nhất là V-아/어 본 적이 있다.
  - vi: Dùng từ vựng kỳ nghỉ và phương tiện - 방학, 휴가, 계획, 해외여행, 제주도, 기차, 배, 한복, 처음.
estimated_minutes: 17
