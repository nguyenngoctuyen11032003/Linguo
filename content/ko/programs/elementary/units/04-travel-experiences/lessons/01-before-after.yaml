        - { id: g7p, text: 출발 두 시간 후에 공항에 가야 해요., lang: ko }
        - { id: l4x, text: 두 시간 출발 전에 공항을 가야 해요., lang: ko }
        - { id: b9c, text: 출발했기 전에 두 시간 공항에 가야 해요., lang: ko }
    answer:
      correct_option_id: s2n
    explanation:
