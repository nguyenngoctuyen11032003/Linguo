  - key: ko:exercise:travel-experiences-review-translate-day1-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ko:item:cheot-nal
    prompt:
      source_text: 첫날에는 바다를 구경하면서 사진을 많이 찍었어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Ngày đầu tiên, tôi vừa ngắm biển vừa chụp nhiều ảnh.
        - Ngày đầu tiên, tôi vừa ngắm biển vừa chụp rất nhiều ảnh.
        - Ngày đầu, tôi vừa ngắm biển vừa chụp nhiều ảnh.
        - Ngày đầu tiên tôi vừa ngắm biển vừa chụp được nhiều ảnh.
        - Ngày đầu tiên, chúng tôi vừa ngắm biển vừa chụp nhiều ảnh.
        - Ngày đầu, chúng tôi vừa ngắm biển vừa chụp rất nhiều ảnh.
        - Hôm đầu tiên, tôi vừa ngắm biển vừa chụp nhiều ảnh.
        - Ngày đầu tiên, tôi vừa ngắm biển vừa chụp ảnh rất nhiều.
        - Ngày đầu tiên, tôi vừa ngắm biển vừa chụp nhiều hình.
        - Ngày đầu tiên tôi vừa ngắm biển vừa chụp ảnh nhiều.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ngày đầu tiên, tôi ngắm biển xong rồi chụp nhiều ảnh.
        feedback_vi: -(으)면서 là hai việc cùng lúc (vừa… vừa…), không phải làm xong việc này rồi mới làm việc kia.
        error_tag: myeonseo_meaning
      - answer: Ngày cuối cùng, tôi vừa ngắm biển vừa chụp nhiều ảnh.
        feedback_vi: 첫날 là ngày đầu tiên; ngày cuối là 마지막 날.
        error_tag: vocab_cheot_nal
    explanation:
      vi: 첫날 [천날] = ngày đầu; 구경하면서 = vừa ngắm; 사진을 많이 찍었어요 = đã chụp nhiều ảnh.
    display_answer: Ngày đầu tiên, tôi vừa ngắm biển vừa chụp nhiều ảnh.

  - key: ko:exercise:travel-experiences-review-translate-never
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:gram-eun-jeok-itda
    prompt:
      source_text: Tôi chưa từng đi Jeju.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 제주도에 가 본 적이 없어요.
        - 저는 제주도에 가 본 적이 없어요.
        - 제주도에 간 적이 없어요.
        - 저는 제주도에 간 적이 없어요.
        - 제주도에 가 본 적 없어요.
        - 제주도에는 가 본 적이 없어요.
        - 저는 제주도에 안 가 봤어요.
        - 제주도에 안 가 봤어요.
    known_wrong:
      - answer: 제주도에 가 본 적이 안 있어요.
        feedback_vi: Phủ định của 있어요 là 없어요, không phải 안 있어요.
        error_tag: an_itda
      - answer: 제주도에 가는 적이 없어요.
        feedback_vi: Trải nghiệm dùng -(으)ㄴ - 간 적 / 가 본 적, không dùng 가는.
        error_tag: eun_jeok_form
      - answer: 제주도에 가려고 하지 않아요.
        feedback_vi: Câu này là "không định đi", không phải "chưa từng đi".
        error_tag: ryeogo_vs_jeok
    explanation:
      vi: Chưa từng = V-(으)ㄴ 적이 없어요; hay dùng với -아/어 보다 - 가 본 적이 없어요. Nơi đến dùng 에.
    display_answer: 제주도에 가 본 적이 없어요.
