  - key: ko:exercise:pf-review-translate-couldnt-meet
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:gram-mot
    prompt:
      source_text: Tuần trước tôi không gặp bạn được.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 지난주에 친구를 못 만났어요.
        - 저는 지난주에 친구를 못 만났어요.
        - 전 지난주에 친구를 못 만났어요.
        - 지난주에 저는 친구를 못 만났어요.
        - 지난주에 친구 못 만났어요.
        - 지난주에 친구를 만나지 못했어요.
        - 저는 지난주에 친구를 만나지 못했어요.
    known_wrong:
      - answer: 지난주에 친구를 안 만났어요.
        feedback_vi: 안 만났어요 là "không gặp" (tự chọn không gặp). "Không gặp được" là 못 만났어요.
        error_tag: mot_vs_an
      - answer: 지난주에 친구를 못 만나요.
        feedback_vi: Tuần trước là quá khứ - 못 만났어요.
        error_tag: tense_past
      - answer: 지난주에 못 친구를 만났어요.
        feedback_vi: 못 đứng ngay trước động từ - 친구를 못 만났어요.
        error_tag: mot_position
      - answer: 지난주에 친구를 못 만나했어요.
        feedback_vi: 했어요 không gắn vào mọi động từ. 만나다 → 만났어요.
        error_tag: past_haesseoyo_overuse
    explanation:
      vi: '"Không ... được" là 못, đứng ngay trước động từ; tuần trước là quá khứ nên 만났어요 - 못 만났어요 [몬 만나써요].'
    display_answer: 지난주에 친구를 못 만났어요.

