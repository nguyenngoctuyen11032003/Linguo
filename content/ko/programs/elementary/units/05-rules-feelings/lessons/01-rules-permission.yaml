title:
  vi: Được phép hay không được? - -아/어도 되다, -(으)면 안 되다
objectives:
  - vi: Xin phép và cho phép bằng V-아/어도 돼요? / 네, V-아/어도 돼요.
  - vi: Nói điều bị cấm bằng V-(으)면 안 돼요 và "không cần… cũng được" bằng 안 V-아/어도 돼요.
  - vi: Đọc hiểu nội quy ký túc xá, bảng thông báo ở bảo tàng và văn phòng - 규칙, 금지, 통금 시간, 허락을 받다.
estimated_minutes: 18
skills: [grammar, vocabulary, reading, speaking]
prerequisites: [ko:lesson:travel-experiences-review]
