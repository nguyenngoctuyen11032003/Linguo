    item: ko:item:rf-gram-eumyeon-an-doeda
    prompt:
      source_text: 이 박물관에서는 사진을 찍어도 되지만 플래시를 쓰면 안 돼요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Ở bảo tàng này được chụp ảnh nhưng không được dùng đèn flash.
        - Ở bảo tàng này có thể chụp ảnh nhưng không được dùng đèn flash.
        - Trong bảo tàng này được chụp ảnh nhưng không được dùng đèn flash.
        - Ở bảo tàng này chụp ảnh cũng được nhưng không được dùng đèn flash.
        - Ở bảo tàng này được chụp ảnh nhưng không được dùng flash.
        - Bảo tàng này cho chụp ảnh nhưng không được dùng đèn flash.
        - Ở bảo tàng này bạn được chụp ảnh nhưng không được dùng đèn flash.
        - Ở bảo tàng này được phép chụp ảnh nhưng không được dùng đèn flash.
        - Ở bảo tàng này được chụp hình nhưng không được dùng đèn flash.
        - Ở bảo tàng này được chụp ảnh nhưng cấm dùng đèn flash.
        - Ở bảo tàng này được chụp ảnh nhưng không được bật đèn flash.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ở bảo tàng này không được chụp ảnh và không được dùng đèn flash.
        feedback_vi: 찍어도 되지만 là "được chụp, nhưng…" - chụp ảnh thì được phép.
        error_tag: permission_vs_prohibition
      - answer: Ở bảo tàng này được chụp ảnh và được dùng đèn flash.
        feedback_vi: 쓰면 안 돼요 là "không được dùng".
        error_tag: negation_missed
    explanation:
      vi: -아/어도 되지만 = được… nhưng; -(으)면 안 돼요 = không được. 쓰다 ở đây là "dùng".
    display_answer: Ở bảo tàng này được chụp ảnh nhưng không được dùng đèn flash.

  - key: ko:exercise:rf-perm-translate-no-need-office
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:rf-gram-ado-doeda
    prompt:
      source_text: Hôm nay bạn không cần đến văn phòng cũng được.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 오늘은 사무실에 안 와도 돼요.
        - 오늘 사무실에 안 와도 돼요.
        - 오늘은 사무실에 안 나와도 돼요.
        - 오늘 사무실에 안 나와도 돼요.
        - 오늘은 사무실에 오지 않아도 돼요.
        - 오늘 사무실에 오지 않아도 돼요.
        - 오늘은 사무실에 안 오셔도 돼요.
        - 오늘 사무실에 안 오셔도 돼요.
        - 오늘은 사무실에 안 가도 돼요.
        - 오늘 사무실에 안 가도 돼요.
        - 오늘은 회사에 안 와도 돼요.
        - 오늘은 사무실에 안 와도 됩니다.
    known_wrong:
      - answer: 오늘은 사무실에 오면 안 돼요.
        feedback_vi: -(으)면 안 돼요 là cấm "không được đến"; câu gốc là "không cần đến" - 안 와도 돼요.
        error_tag: an_ado_confusion
      - answer: 오늘은 사무실에 안 오면 안 돼요.
        feedback_vi: Hai lần phủ định - "không đến thì không được", tức là phải đến.
        error_tag: double_negation
      - answer: 오늘은 사무실에 와도 돼요.
        feedback_vi: Thiếu 안 - câu này nghĩa là "đến cũng được".
        error_tag: negation_missed
    explanation:
      vi: '"Không cần làm" = 안 + V-아/어도 돼요. 오다 → 와도; lịch sự hơn với người trên - 안 오셔도 돼요.'
    display_answer: 오늘은 사무실에 안 와도 돼요.
