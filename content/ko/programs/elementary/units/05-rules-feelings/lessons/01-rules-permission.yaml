      stem_lang: ko
      options:
        - { id: b3w, text: 사감 선생님이 허락하면 친구를 방에 데려와도 돼요., lang: ko }
        - { id: d9e, text: 친구는 허락 없이 방에 들어와도 돼요., lang: ko }
        - { id: s1y, text: 밤 11시에 세탁실을 써도 돼요., lang: ko }
