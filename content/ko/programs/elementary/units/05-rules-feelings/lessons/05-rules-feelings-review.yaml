title:
  vi: Ôn tập - Ngày đầu ở phòng gym gần ký túc xá
objectives:
  - vi: Hiểu nhân viên phòng gym giới thiệu nội quy (-아/어도 돼요, -(으)면 안 돼요, -지 마세요, -아/어야 해요).
  - vi: Trò chuyện tự nhiên với bạn cùng phòng bằng -네요, -지요?, -겠어요.
  - vi: Chia đúng các động từ bất quy tắc của unit trong câu thật - 걸어요, 들어요, 몰라요, 불러요, 사세요, 나아요.
