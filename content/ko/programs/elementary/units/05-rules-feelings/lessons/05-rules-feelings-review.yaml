    answer:
      accepted:
        - 와, 이 헬스장 정말 넓네요!
        - 와, 이 헬스장은 정말 넓네요!
        - 와, 이 헬스장이 정말 넓네요!
        - 와, 헬스장이 정말 넓네요!
        - 와, 이 헬스장 진짜 넓네요!
        - 와, 헬스장이 진짜 넓네요!
        - 이 헬스장 정말 넓네요!
        - 이 헬스장은 정말 넓네요!
        - 이 헬스장이 정말 넓네요!
        - 헬스장이 정말 넓네요!
        - 이 헬스장 진짜 넓네요!
        - 와, 이 헬스장 너무 넓네요!
        - 우와, 이 헬스장 정말 넓네요!
    known_wrong:
      - answer: 와, 이 헬스장 정말 넓으네요!
        feedback_vi: -네요 không thêm 으 - 넓네요 [널레요].
        error_tag: neyo_form
      - answer: 와, 이 헬스장 정말 넓지요?
        feedback_vi: -지요? là hỏi xác nhận; bạn vừa bước vào và thốt lên → -네요.
        error_tag: neyo_vs_jiyo
      - answer: 와, 이 헬스장 정말 넓겠어요!
        feedback_vi: Bạn đang tận mắt thấy, không cần đoán - dùng -네요.
        error_tag: neyo_vs_gesseoyo
    explanation:
      vi: Vừa nhìn thấy và thốt lên → -네요. 넓다 + 네요 → 넓네요, đọc [널레요] (ㄼ đọc ㄹ, ㄴ gặp ㄹ thành ㄹ).
    display_answer: 와, 이 헬스장 정말 넓네요!
