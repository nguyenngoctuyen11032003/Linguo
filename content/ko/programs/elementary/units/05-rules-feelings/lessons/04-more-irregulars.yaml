title:
  vi: Thêm động từ bất quy tắc - ㄷ, 르, ㄹ rơi, ㅅ
objectives:
  - vi: Chia đúng động từ bất quy tắc ㄷ (듣다 → 들어요, 걷다 → 걸어요, 묻다 → 물어요) và 르 (모르다 → 몰라요, 빠르다 → 빨라요, 부르다 → 불러요).
  - vi: Chia động từ gốc ㄹ với -(으)세요, -(으)ㅂ니다, -는 (살다 → 사세요, 삽니다, 사는) và bất quy tắc ㅅ (낫다 → 나아요, 짓다 → 지어요).
  - vi: Phân biệt với các từ có quy tắc dễ nhầm (받다, 닫다, 웃다, 씻다, 벗다) và với bất quy tắc ㅂ, ㅡ đã học.
