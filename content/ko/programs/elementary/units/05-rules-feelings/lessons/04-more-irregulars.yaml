  - key: ko:exercise:rf-irr-translate-know-person
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:rf-alda
    prompt:
      source_text: Thầy có biết người đó không ạ?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 선생님, 그 사람을 아세요?
        - 선생님은 그 사람을 아세요?
        - 선생님, 그 사람 아세요?
        - 선생님, 그분을 아세요?
        - 선생님, 그분 아세요?
        - 선생님은 그분을 아세요?
        - 선생님께서는 그 사람을 아세요?
        - 선생님께서는 그분을 아세요?
        - 선생님, 그 사람을 아십니까?
        - 선생님, 그분을 아십니까?
        - 그 사람을 아세요?
        - 그분을 아세요?
    known_wrong:
      - answer: 선생님, 그 사람을 알으세요?
        feedback_vi: Gốc ㄹ không thêm 으 và mất ㄹ trước ㅅ - 아세요.
        error_tag: l_drop
      - answer: 선생님, 그 사람을 알세요?
        feedback_vi: ㄹ phải rơi trước ㅅ - 아세요.
        error_tag: l_drop
      - answer: 선생님, 그 사람을 알아요?
        feedback_vi: Hỏi thầy giáo nên dùng kính ngữ - 아세요?.
        error_tag: honorific_missing
      - answer: 선생님, 그 사람을 몰라요?
        feedback_vi: 몰라요 là "không biết"; câu gốc hỏi "có biết không" - 아세요?.
        error_tag: vocab_meaning
    explanation:
      vi: Hỏi người trên → kính ngữ -(으)세요; 알다 → ㄹ rơi trước ㅅ → 아세요. Nói về người thứ ba lịch sự có thể dùng 그분.
    display_answer: 선생님, 그 사람을 아세요?
