    prompt:
      stem: "다음 글을 읽고 맞는 것을 고르십시오.\n저는 지난달에 학교 근처로 이사했어요. 지금 사는 집은 학교에서 걸어서 십 분쯤 걸려요. 집 앞에 작은 공원이 있어서 저녁마다 거기를 걸어요. 동네에 아는 사람이 아직 없어서 조금 심심해요. 하지만 옆집 할머니가 아주 친절하세요. 어제는 할머니께서 직접 만드신 김치를 주셨어요."
      stem_lang: ko
      options:
        - { id: h2y, text: 이 사람은 집에서 학교까지 걸어서 다녀요., lang: ko }
        - { id: s6u, text: 이 사람은 동네에 친구가 많아요., lang: ko }
        - { id: b9e, text: 이 사람은 공원에서 먼 곳에 살아요., lang: ko }
        - { id: n3r, text: 이 사람은 옆집 할머니께 김치를 만들어 드렸어요., lang: ko }
    answer:
      correct_option_id: h2y
    explanation:
      vi: 학교에서 걸어서 십 분 = đi bộ 10 phút đến trường. Người viết chưa quen ai (아는 사람이 없어서), nhà ngay trước công viên, và chính bà hàng xóm cho kimchi do bà làm (만드신 - 만들다 + kính ngữ, ㄹ rơi).
    display_answer: 이 사람은 집에서 학교까지 걸어서 다녀요.

  - key: ko:exercise:rf-irr-translate-medicine-vi
    type: translate
    stage: application
