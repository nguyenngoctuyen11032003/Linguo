    item: ko:item:rf-natda
    prompt:
      source_text: 이 약을 먹으면 감기가 빨리 나을 거예요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Nếu uống thuốc này thì cảm sẽ nhanh khỏi.
        - Uống thuốc này thì cảm sẽ nhanh khỏi.
        - Nếu uống thuốc này thì bệnh cảm sẽ khỏi nhanh.
        - Nếu uống thuốc này, cảm sẽ nhanh khỏi.
        - Uống thuốc này vào thì cảm sẽ nhanh khỏi thôi.
        - Nếu bạn uống thuốc này thì cảm sẽ nhanh khỏi.
        - Uống thuốc này thì bạn sẽ nhanh khỏi cảm.
        - Nếu uống thuốc này thì sẽ nhanh khỏi cảm.
        - Nếu uống thuốc này thì chắc cảm sẽ nhanh khỏi.
        - Nếu uống thuốc này thì cảm cúm sẽ nhanh khỏi.
