        feedback_vi: 낫다 là "khỏi bệnh", không phải "bị bệnh".
        error_tag: vocab_meaning
      - answer: Tôi đã uống thuốc này nên khỏi cảm rồi.
        feedback_vi: -(으)면 là "nếu", -(으)ㄹ 거예요 là dự đoán tương lai - câu gốc chưa xảy ra.
        error_tag: tense
    explanation:
      vi: 낫다 + -(으)ㄹ 거예요 → ㅅ rơi → 나을 거예요 (sẽ khỏi). 먹으면 = nếu uống; với thuốc, tiếng Hàn dùng 먹다.
