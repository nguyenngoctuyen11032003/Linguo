title:
  vi: Xin đừng…! - -지 마세요, phủ định dài -지 않다 / -지 못하다
objectives:
  - vi: Khuyên, nhắc "đừng làm…" bằng V-지 마세요 và hiểu thông báo trang trọng V-지 마십시오.
  - vi: Dùng phủ định dài V/A-지 않아요 và V-지 못해요, so sánh với 안 / 못 đã học.
  - vi: Hiểu các lời nhắc nơi công cộng - thư viện, bể bơi, rạp hát - 떠들다, 뛰다, 끄다, 함부로, 미루다.
