    prompt:
      source_text: 와, 벌써 열한 시네요. 시간이 정말 빨리 가네요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Ôi, đã 11 giờ rồi. Thời gian trôi nhanh thật.
        - Ôi, đã 11 giờ rồi. Thời gian trôi nhanh quá.
        - Ồ, đã 11 giờ rồi. Thời gian trôi nhanh thật.
        - Ồ, mới đó đã 11 giờ rồi. Thời gian trôi nhanh thật.
        - Ôi, đã mười một giờ rồi. Thời gian trôi nhanh thật.
        - Ôi, 11 giờ rồi. Thời gian trôi nhanh quá.
        - Ôi, đã 11 giờ rồi à. Thời gian trôi nhanh thật đấy.
        - Ôi, đã 11 giờ rồi. Thời gian đi nhanh thật.
        - Wow, đã 11 giờ rồi. Thời gian trôi nhanh thật.
        - Ôi, đã 11 giờ rồi. Thời gian qua nhanh thật.
        - Chà, đã 11 giờ rồi. Thời gian trôi nhanh thật.
    rubric:
