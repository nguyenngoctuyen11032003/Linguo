        error_tag: vocab_meaning
      - answer: Bây giờ là 11 giờ phải không? Thời gian trôi nhanh thật.
        feedback_vi: 열한 시네요 là cảm thán khi vừa nhận ra, không phải câu hỏi xác nhận.
