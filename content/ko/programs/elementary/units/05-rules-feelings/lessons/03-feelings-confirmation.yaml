key: ko:lesson:feelings-confirmation
order_index: 3
level: topik2
title:
  vi: Ồ, hay quá nhỉ! - -네요, -지요(죠)?, -겠어요
objectives:
  - vi: Thốt lên khi vừa phát hiện điều gì bằng A/V-네요 và N(이)네요.
  - vi: Hỏi lại để xác nhận điều mình đã biết bằng A/V-지요? / -죠?.
  - vi: Đoán và đồng cảm ngay tại chỗ bằng -겠어요 (맛있겠어요, 힘들겠어요) và nói về cảm xúc - 부럽다, 신기하다, 귀엽다, 기쁘다, 서운하다, 심심하다, 대단하다, 놀라다.
estimated_minutes: 20
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ko:lesson:rules-negative-requests]
