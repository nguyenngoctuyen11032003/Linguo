    display_answer: 할아버지는 연세가 어떻게 되세요?

  - key: ko:exercise:family-count-age-translate-children-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ko:item:ttal
    prompt:
      source_text: 저는 아들이 한 명, 딸이 두 명 있어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Tôi có một con trai và hai con gái.
        - Tôi có một con trai, hai con gái.
        - Tôi có một đứa con trai và hai đứa con gái.
        - Tôi có một cậu con trai và hai cô con gái.
        - Tôi có một con trai và hai đứa con gái.
        - Tôi có 1 con trai và 2 con gái.
        - Tôi có 1 con trai, 2 con gái.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi có hai con trai và một con gái.
        feedback_vi: 아들이 한 명 = một con trai, 딸이 두 명 = hai con gái.
        error_tag: number_counter
      - answer: Tôi có một em trai và hai em gái.
        feedback_vi: 아들/딸 là con trai/con gái. Em trai, em gái là 남동생, 여동생.
        error_tag: family_term
    explanation:
      vi: 아들 = con trai, 딸 = con gái; 한 명 = một người, 두 명 = hai người.
    display_answer: Tôi có một con trai và hai con gái.

