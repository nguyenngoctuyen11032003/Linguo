    explanation:
      vi: Trả lời 어때요? bằng tính từ - 키가 크고 (cao và) + 친절해요. Tính từ không đi với 를, không đứng trước 이에요; nối hai tính từ dùng -고.
    display_answer: 키가 크고 친절해요.

  - key: ko:exercise:describing-people-translate-to-vi
    type: translate
