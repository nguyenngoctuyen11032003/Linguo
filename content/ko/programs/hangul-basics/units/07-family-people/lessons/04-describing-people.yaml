        feedback_vi: 오빠 là anh trai (người nói là nữ), không phải em trai.
        error_tag: family_term
      - answer: Anh trai tôi phong độ. Và rất thân thiện.
        feedback_vi: 착해요 là hiền, tốt bụng; "thân thiện, tử tế" là 친절해요.
