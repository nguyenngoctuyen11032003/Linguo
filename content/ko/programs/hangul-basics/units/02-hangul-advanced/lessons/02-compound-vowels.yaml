key: ko:lesson:compound-vowels
order_index: 2
level: hangul
title:
  vi: Nguyên âm ghép "w" và ㅢ
objectives:
  - vi: Đọc và viết các nguyên âm ghép ㅘ ㅙ ㅚ ㅝ ㅞ ㅟ ㅢ.
  - vi: Biết ㅙ ㅚ ㅞ đọc gần như giống nhau, và ㅢ có ba cách đọc tuỳ vị trí.
  - vi: Đọc và viết các từ 회사, 돼지, 귀, 의자, 의사.
estimated_minutes: 14
skills: [reading, writing, listening, vocabulary]
prerequisites: [ko:lesson:y-vowels]
items:
  - item: ko:item:we-vowels
  - item: ko:item:vowel-wi
  - item: ko:item:vowel-ui
  - item: ko:item:hoesa
  - item: ko:item:dwaeji
  - item: ko:item:gwi
  - item: ko:item:uija
  - item: ko:item:uisa
