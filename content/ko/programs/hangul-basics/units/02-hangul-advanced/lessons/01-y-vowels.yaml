key: ko:lesson:y-vowels
order_index: 1
level: hangul
title:
  vi: Nguyên âm "y" đầy đủ và cặp ㅐ/ㅔ
objectives:
  - vi: Đọc và viết đủ sáu nguyên âm "y" - ㅑ ㅕ ㅛ ㅠ ㅒ ㅖ.
  - vi: Hiểu vì sao ㅐ/ㅔ và ㅒ/ㅖ nghe gần như giống nhau trong tiếng Seoul, và nhớ cách viết theo từng từ.
  - vi: Đọc và viết các từ 여자, 야구, 요리, 얘기, 시계.
estimated_minutes: 12
skills: [reading, writing, listening, vocabulary]
prerequisites: [ko:lesson:aspirated-tense]
items:
  - item: ko:item:vowel-yae-ye
  - item: ko:item:yeoja
