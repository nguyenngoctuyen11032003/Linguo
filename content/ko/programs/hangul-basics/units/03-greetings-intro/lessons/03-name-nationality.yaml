# DEMO — chưa kiểm duyệt
schema_version: 1
demo: true
status: published
reviewed_by: null
reviewed_at: null
key: ko:lesson:name-nationality
order_index: 3
level: topik1
title:
  vi: Tên và quốc tịch
objectives:
  - vi: Hỏi và trả lời tên - 이름이 뭐예요? / 저는 란이에요.
  - vi: Nói quốc tịch bằng tên nước + 사람 - 베트남 사람, 한국 사람.
  - vi: Dùng 씨 đúng cách - sau tên người khác, không bao giờ cho chính mình.
estimated_minutes: 14
skills: [speaking, listening, grammar, vocabulary]
prerequisites: [ko:lesson:i-am-student]
items:
  - item: ko:item:ireum
  - item: ko:item:ireumi-mwoyeyo
  - item: ko:item:ssi
  - item: ko:item:nara
  - item: ko:item:saram
  - item: ko:item:beteunam
  - item: ko:item:hanguk
    role: reuse
  - item: ko:item:eoneu-nara-saram
  - item: ko:item:copula-ieyo-yeyo
