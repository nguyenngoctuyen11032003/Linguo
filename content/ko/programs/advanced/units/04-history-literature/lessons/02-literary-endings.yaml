  - key: ko:exercise:hl-endings-order-geoniwa
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:hl-gram-geoniwa
    prompt:
      instruction: "Sắp xếp thành câu: \"Xin nhắc lại, di sản văn hoá một khi đã bị hư hại thì không thể lấy lại được.\""
      tokens:
        - { id: t-hun, text: 훼손되면 }
        - { id: t-mal, text: 말하거니와 }
        - { id: t-su, text: 수 }
        - { id: t-dasi, text: 다시 }
        - { id: t-eop, text: 없다 }
        - { id: t-geona, text: 말하거나 }
        - { id: t-mun, text: 문화재는 }
        - { id: t-doe, text: 되돌릴 }
        - { id: t-han, text: 한번 }
    answer:
      orders:
        - [t-dasi, t-mal, t-mun, t-han, t-hun, t-doe, t-su, t-eop]
        - [t-dasi, t-mal, t-han, t-hun, t-mun, t-doe, t-su, t-eop]
    explanation:
      vi: 다시 말하거니와 = "xin nhắc lại" - cách mở câu nhấn mạnh trong văn nghị luận. 말하거나 (hoặc nói) là token nhiễu do nhầm -거니와 với -거나.
    display_answer: 다시 말하거니와 문화재는 한번 훼손되면 되돌릴 수 없다.
