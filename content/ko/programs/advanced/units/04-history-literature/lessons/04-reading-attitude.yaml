  - key: ko:exercise:hl-reading-order-main
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:hl-jungsim-saenggak
    prompt:
      instruction: "Sắp xếp thành câu: \"Ý chính của bài này được thể hiện ở đoạn cuối.\""
      tokens:
        - { id: t-mun, text: 문단에 }
        - { id: t-i, text: 이 }
        - { id: t-it, text: 있다 }
        - { id: t-jung, text: 중심 }
        - { id: t-cheot, text: 첫 }
        - { id: t-geul, text: 글의 }
        - { id: t-deu, text: 드러나 }
        - { id: t-ma, text: 마지막 }
        - { id: t-saeng, text: 생각은 }
    answer:
      orders:
        - [t-i, t-geul, t-jung, t-saeng, t-ma, t-mun, t-deu, t-it]
    explanation:
      vi: 이 글의 중심 생각은 (chủ ngữ) + 마지막 문단에 (ở đoạn cuối) + 드러나 있다 (được thể hiện). 첫 (đầu tiên) là token nhiễu - trong tuỳ bút, ý chính thường ở cuối.
    display_answer: 이 글의 중심 생각은 마지막 문단에 드러나 있다.
