    known_wrong:
      - answer: Nhờ dùng nhiều đồ dùng một lần nên vấn đề rác thải đã được cải thiện.
        feedback_vi: 탓에 chỉ nguyên nhân xấu, và 악화되다 là "xấu đi", không phải "cải thiện".
        error_tag: meaning_reversed
      - answer: Vì dùng nhiều đồ dùng một lần nên vấn đề rác thải đã bị ác hoá.
