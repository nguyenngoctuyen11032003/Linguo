        - { id: r2m, text: Nhiệt độ đô thị cao hơn vùng xung quanh 3–4 độ., lang: vi }
        - { id: y9d, text: Nhà cửa và đường sá hấp thụ nhiệt nên cần phá bớt nhà., lang: vi }
