title:
  vi: Nguyên nhân - kết quả - giải pháp trong văn viết
objectives:
  - vi: Diễn đạt nguyên nhân xấu bằng -(으)ㄴ/는 탓에 và nguy cơ bằng -(으)ㄹ 우려가 있다.
  - vi: Diễn đạt phương thức và đóng góp bằng -(으)ㅁ으로써, -는 데(에) 기여하다, và sự phụ thuộc bằng N에 달려 있다.
  - vi: Nhận ra chuỗi nguyên nhân → kết quả → giải pháp trong đoạn đọc TOPIK II (dạng câu 35–38) để tìm ý chính.
