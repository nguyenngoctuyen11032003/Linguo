title:
  vi: Khí hậu & môi trường - từ vựng Hán Hàn và -(으)ㄹ수록
objectives:
  - vi: Hiểu và dùng đúng từ vựng môi trường trong báo chí - 기후 변화, 온실가스, 탄소 중립, 미세먼지, 재생 에너지, 생태계, 멸종 위기.
  - vi: Tránh bẫy Hán Việt - 환경 là "môi trường" chứ không phải "hoàn cảnh", 멸종 là "tuyệt chủng".
  - vi: Diễn đạt quan hệ tỉ lệ "càng … càng" bằng -(으)ㄹ수록 trong văn viết.
