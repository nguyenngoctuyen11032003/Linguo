        feedback_vi: 멸종 là "tuyệt chủng" (tự biến mất), và 위기 là "nguy cơ" - các loài chưa biến mất hẳn.
        error_tag: sino_viet_false_friend
      - answer: Do biến đổi khí hậu, nhiều loài động vật đã tuyệt chủng.
