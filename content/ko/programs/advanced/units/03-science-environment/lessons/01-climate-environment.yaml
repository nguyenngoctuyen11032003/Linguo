        - Do biến đổi khí hậu, nhiều loài động vật đã rơi vào nguy cơ tuyệt chủng.
        - Do biến đổi khí hậu, nhiều loài động vật rơi vào nguy cơ tuyệt chủng.
        - Do biến đổi khí hậu, nhiều loài động vật đang có nguy cơ tuyệt chủng.
        - Do biến đổi khí hậu, nhiều động vật đã rơi vào nguy cơ tuyệt chủng.
        - Vì biến đổi khí hậu, nhiều loài động vật đã rơi vào nguy cơ tuyệt chủng.
        - Vì biến đổi khí hậu, nhiều loài động vật đang có nguy cơ tuyệt chủng.
        - Biến đổi khí hậu khiến nhiều loài động vật rơi vào nguy cơ tuyệt chủng.
        - Biến đổi khí hậu đã khiến nhiều loài động vật rơi vào nguy cơ tuyệt chủng.
        - Biến đổi khí hậu khiến nhiều loài động vật có nguy cơ tuyệt chủng.
        - Nhiều loài động vật đã rơi vào nguy cơ tuyệt chủng do biến đổi khí hậu.
        - Nhiều loài động vật đang có nguy cơ tuyệt chủng do biến đổi khí hậu.
