    answer_lang: ko
    difficulty: 3
    item: ko:item:allyeojida
    prompt:
      instruction: "Sắp xếp thành câu: \"Chất này được biết là không có hại cho cơ thể người.\""
      tokens:
        - { id: y4, text: 알려져 있다 }
        - { id: y2, text: 인체에 }
        - { id: y6, text: 알려지어져 있다 }
        - { id: y3, text: 해가 없는 것으로 }
        - { id: y1, text: 이 물질은 }
    answer:
      orders:
        - [y1, y2, y3, y4]
    explanation:
      vi: Mẫu cố định -(으)ㄴ/는 것으로 알려져 있다 "được biết là". 알려지어져 là bị động kép, sai.
    display_answer: 이 물질은 인체에 해가 없는 것으로 알려져 있다.

  - key: ko:exercise:science-tech-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:balkyeojida
    prompt:
      source_text: 연구 결과 잠이 부족하면 기억력이 떨어진다는 사실이 밝혀졌다.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Kết quả nghiên cứu đã chứng minh rằng thiếu ngủ thì trí nhớ giảm sút.
        - Kết quả nghiên cứu đã chứng minh rằng nếu thiếu ngủ thì trí nhớ sẽ giảm sút.
        - Kết quả nghiên cứu đã chứng minh rằng thiếu ngủ thì trí nhớ giảm.
        - Kết quả nghiên cứu cho thấy thiếu ngủ thì trí nhớ giảm sút.
        - Kết quả nghiên cứu cho thấy nếu thiếu ngủ thì trí nhớ sẽ giảm sút.
        - Kết quả nghiên cứu cho thấy thiếu ngủ làm giảm trí nhớ.
        - Nghiên cứu đã làm rõ rằng thiếu ngủ thì trí nhớ giảm sút.
        - Nghiên cứu đã chứng minh rằng thiếu ngủ làm giảm trí nhớ.
        - Kết quả nghiên cứu đã làm rõ sự thật là thiếu ngủ thì trí nhớ giảm sút.
        - Kết quả nghiên cứu đã chỉ ra rằng thiếu ngủ thì trí nhớ giảm sút.
        - Kết quả nghiên cứu đã chỉ ra rằng thiếu ngủ làm giảm trí nhớ.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Kết quả nghiên cứu cho thấy ngủ nhiều thì trí nhớ giảm sút.
        feedback_vi: 잠이 부족하면 là "nếu thiếu ngủ", không phải "ngủ nhiều".
        error_tag: meaning_reversed
      - answer: Kết quả nghiên cứu cho thấy thiếu ngủ thì trí nhớ tăng lên.
        feedback_vi: 떨어지다 là "giảm, sụt", không phải "tăng".
        error_tag: meaning_reversed
    explanation:
      vi: 연구 결과 = kết quả nghiên cứu; -다는 사실이 밝혀졌다 = đã chứng minh/làm rõ (sự thật) rằng…; 기억력이 떨어지다 = trí nhớ giảm sút.
    display_answer: Kết quả nghiên cứu đã chứng minh rằng thiếu ngủ thì trí nhớ giảm sút.
