    item: ko:item:gaebalhada
    prompt:
      stem: "Bạn muốn viết: \"Khi AI phát triển, nhiều công việc đã thay đổi.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: s6m, text: 인공지능이 발전하면서 많은 일이 바뀌었다., lang: ko }
        - { id: g2b, text: 인공지능이 개발하면서 많은 일이 바뀌었다., lang: ko }
        - { id: n7c, text: 인공지능이 발전되어지면서 많은 일이 바뀌었다., lang: ko }
        - { id: t4e, text: 인공지능이 발전하면서 많은 일이 바뀌어졌다., lang: ko }
    answer:
      correct_option_id: s6m
    explanation:
      vi: AI "lớn mạnh lên" là 발전하다 (nội động từ). 개발하다 là "tạo ra cái mới" và cần người làm + tân ngữ. 발전되어지다 và 바뀌어지다 đều là bị động kép thừa.
    display_answer: 인공지능이 발전하면서 많은 일이 바뀌었다.

  - key: ko:exercise:science-tech-mcq-situation
