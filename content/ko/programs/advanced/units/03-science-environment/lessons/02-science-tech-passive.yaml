title:
  vi: Khoa học & công nghệ - bị động trong văn viết
objectives:
  - vi: Hiểu từ vựng tin khoa học, công nghệ - 인공지능, 개인 정보 유출, 자율 주행, 연구진, 실험, 개발하다.
  - vi: Dùng đúng bị động của văn báo chí - 밝혀지다, 알려지다, 개발되다, 유출되다 - và tránh bị động kép 되어지다.
  - vi: Phân biệt cặp tự động / gây khiến 줄다 - 줄이다, 늘다 - 늘리다 và nội động từ 발생하다.
