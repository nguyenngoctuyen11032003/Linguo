title:
  vi: Mục đích, quy trình và xu hướng - văn bài giảng và báo cáo
objectives:
  - vi: Nói mục đích trang trọng bằng -기 위한 N và -고자 하다 (mở đầu bài giảng, báo cáo nghiên cứu).
  - vi: Mô tả xu hướng bằng -는 추세이다 và lan rộng bằng 확산되다.
  - vi: Mô tả một quy trình theo bước - 과정, 단계, 거치다, 먼저 … 그다음 … 마지막으로.
