      stem_lang: vi
      options:
        - { id: g4c, text: Làm ráo nước rồi nghiền nhỏ., lang: vi }
        - { id: l1x, text: Nhặt bỏ túi nilon và xương., lang: vi }
        - { id: n7z, text: Cho vi sinh vật vào để lên men., lang: vi }
        - { id: u2h, text: Thu gom rác thực phẩm từ các hộ gia đình., lang: vi }
