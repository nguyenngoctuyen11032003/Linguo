  - key: ko:exercise:purpose-process-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:hyeonsang
    prompt:
      source_text: 도시의 기온이 주변 지역보다 높은 현상을 열섬 현상이라고 한다.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Hiện tượng nhiệt độ của thành phố cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ thành phố cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ đô thị cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ của đô thị cao hơn các khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ thành phố cao hơn vùng xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ đô thị cao hơn vùng xung quanh được gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ thành phố cao hơn khu vực xung quanh gọi là hiện tượng đảo nhiệt.
        - Hiện tượng nhiệt độ đô thị cao hơn khu vực xung quanh được gọi là đảo nhiệt đô thị.
        - Hiện tượng nhiệt độ thành phố cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt đô thị.
        - Hiện tượng nhiệt độ đô thị cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt đô thị.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Hiện tượng nhiệt độ thành phố thấp hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
        feedback_vi: 높다 là "cao", không phải "thấp".
        error_tag: meaning_reversed
      - answer: Thành phố có nhiệt độ cao hơn khu vực xung quanh nên được gọi là đảo.
        feedback_vi: Câu là định nghĩa - …는 현상을 N(이)라고 한다 "hiện tượng … được gọi là N", không nói thành phố là "đảo".
        error_tag: definition_pattern
    explanation:
      vi: Mẫu định nghĩa …는 현상을 N(이)라고 한다 = hiện tượng … được gọi là N. 열섬 (nhiệt đảo) là "đảo nhiệt"; 주변 지역보다 높다 = cao hơn khu vực xung quanh.
    display_answer: Hiện tượng nhiệt độ của thành phố cao hơn khu vực xung quanh được gọi là hiện tượng đảo nhiệt.
