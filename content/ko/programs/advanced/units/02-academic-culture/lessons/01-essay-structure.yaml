  - item: ko:item:ac-geureomeuro
  - item: ko:item:ac-iwa-gachi
  - item: ko:item:ac-jujanghada
  - item: ko:item:ac-geungeo
  - item: ko:item:ac-banbakhada
  - item: ko:item:ac-nonran
