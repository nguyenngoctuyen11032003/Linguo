    prompt:
      instruction: "Sắp xếp thành câu: \"Cần lập kế hoạch để không bị cả thèm chóng chán.\""
      tokens:
        - { id: t-se, text: 세워야 }
        - { id: t-an, text: 않도록 }
        - { id: t-il, text: 일석이조로 }
        - { id: t-han, text: 한다 }
        - { id: t-jak, text: 작심삼일로 }
        - { id: t-gye, text: 계획을 }
        - { id: t-kkeut, text: 끝나지 }
    answer:
      orders:
        - [t-jak, t-kkeut, t-an, t-gye, t-se, t-han]
    explanation:
      vi: -지 않도록 = "để không"; mệnh đề mục đích 작심삼일로 끝나지 않도록 đứng trước 계획을 세워야 한다. 일석이조로 là token nhiễu - sai nghĩa.
