title:
  vi: Ôn tập - chuyên mục sức khoẻ, tranh luận giáo dục và đoạn văn nghị luận kiểu câu 54
objectives:
  - vi: Đọc hiểu một chuyên mục sức khoẻ - tìm ý chính, số liệu và lời khuyên của người viết.
  - vi: Theo dõi một cuộc tranh luận giáo dục - nhận ra mẫu thừa nhận và phản biện.
  - vi: Luyện viết câu cho đoạn văn nghị luận kiểu TOPIK câu 54 - câu luận điểm, câu kết, văn phong -다.
