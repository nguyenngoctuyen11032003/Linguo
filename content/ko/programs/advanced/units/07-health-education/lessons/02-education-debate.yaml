      options:
        - { id: a6p, text: "학원도 도움이 되지만 결국 성적은 아이가 스스로 공부하기 나름입니다.", lang: ko }
        - { id: o3r, text: "학원도 도움이 되지만 결국 성적은 아이가 스스로 공부하는 나름입니다.", lang: ko }
        - { id: k8m, text: "학원도 도움이 되지만 결국 성적은 아이가 스스로 공부할락 말락입니다.", lang: ko }
        - { id: s5f, text: "학원도 도움이 되지만 결국 성적은 아이가 스스로 공부하는 둥 마는 둥입니다.", lang: ko }
    answer:
      correct_option_id: a6p
    explanation:
      vi: Ý "còn tuỳ vào việc tự học" = 공부하기 나름이다 (động từ + -기). -는 나름 sai hình thức; -(으)ㄹ락 말락 và -는 둥 마는 둥 là miêu tả, không diễn đạt sự phụ thuộc và cũng không đứng trước 입니다 như vậy.
    display_answer: "학원도 도움이 되지만 결국 성적은 아이가 스스로 공부하기 나름입니다."

