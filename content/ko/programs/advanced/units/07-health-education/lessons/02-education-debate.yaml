title:
  vi: Học thêm, thi cử và tự học - N 나름이다, -는 둥 마는 둥, -(으)ㄹ락 말락
objectives:
  - vi: Nói "còn tuỳ vào..." bằng N 나름이다 / V-기 나름이다, phân biệt với 나름대로.
  - vi: Miêu tả việc làm qua loa bằng -는 둥 마는 둥 và trạng thái suýt soát bằng -(으)ㄹ락 말락.
  - vi: Dùng từ vựng tranh luận giáo dục - 사교육 · 공교육, 입시 경쟁, 주입식 교육, 자기 주도 학습, 선행 학습, 학업 성취도, 적성.
