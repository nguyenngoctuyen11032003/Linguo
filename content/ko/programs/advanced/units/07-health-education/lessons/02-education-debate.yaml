    item: ko:item:he-jagi-judo-hakseup
    prompt:
      stem: "Phụ huynh nói - \"학원에 보내야 성적이 오르죠.\" Giáo viên muốn đáp lại rằng học thêm có ích, nhưng điểm số còn tuỳ vào việc trẻ tự học. Câu nào đúng?"
