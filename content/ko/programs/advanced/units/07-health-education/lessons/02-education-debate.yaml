    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:he-gram-l-rak-mallak
    prompt:
      instruction: "Sắp xếp thành câu: \"Giọng cô ấy nhỏ đến mức nghe lúc được lúc không.\""
      tokens:
        - { id: m8a, text: 할 }
        - { id: d4y, text: 말고 }
        - { id: t2o, text: 목소리는 }
        - { id: x6e, text: 말락 }
        - { id: g9s, text: 작았다 }
        - { id: q1j, text: 그녀의 }
        - { id: v3k, text: 들릴락 }
        - { id: i5w, text: 만큼 }
    answer:
      orders:
        - [q1j, t2o, v3k, x6e, m8a, i5w, g9s]
    explanation:
      vi: V-(으)ㄹ락 말락 하다 + -(으)ㄹ 만큼 (đến mức). 들리다 không patchim nên thêm ㄹ락 - 들릴락. 말고 là token nhiễu; vế sau luôn là 말락.
    display_answer: 그녀의 목소리는 들릴락 말락 할 만큼 작았다.

