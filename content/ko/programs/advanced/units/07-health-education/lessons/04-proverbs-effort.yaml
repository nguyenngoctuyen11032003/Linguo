title:
  vi: Thành ngữ và tục ngữ về nỗ lực, sức khoẻ và học tập
objectives:
  - vi: Hiểu và dùng sáu thành ngữ bốn chữ - 고진감래, 유비무환, 자업자득, 대기만성, 일취월장, 과유불급.
  - vi: Hiểu và trích dẫn bốn tục ngữ - 백문이 불여일견, 아는 길도 물어 가라, 병 주고 약 준다, 시작이 반이다.
  - vi: Trích dẫn đúng khuôn -(이)라고, -(이)라는 말처럼, -다는 말이 있듯이 trong lời nói và bài luận.
