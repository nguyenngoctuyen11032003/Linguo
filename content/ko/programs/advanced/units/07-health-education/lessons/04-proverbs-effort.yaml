      vi: 백문이 불여일견 (bách văn bất như nhất kiến) = trăm nghe không bằng một thấy; trích bằng -(이)라고, hoặc -(이)라는 말처럼; "tự mình đến thăm" = 직접 방문해 보다 / 찾아가 보다.
    display_answer: 백문이 불여일견이라고, 직접 그 학교를 방문해 보았다.
