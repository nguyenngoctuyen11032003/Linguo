      correct_option_id: k1j
    explanation:
      vi: 작심삼일 (quyết tâm ba ngày) mô tả việc bỏ cuộc, còn 시작이 반이다 động viên bắt đầu lại - đúng cặp đối lập trong bài. Các phương án khác dùng sai nghĩa và không có ý động viên.
    display_answer: "작심삼일이면 어때? 시작이 반이니까 다시 해 보자."

