    item: ko:item:ac-jaksimsamil
    prompt:
      stem: "Bạn cùng phòng quyết tâm tập thể dục nhưng mới ba ngày đã bỏ. Bạn muốn động viên bạn ấy bắt đầu lại. Câu nào hợp nhất?"
      stem_lang: vi
      options:
        - { id: k1j, text: "작심삼일이면 어때? 시작이 반이니까 다시 해 보자.", lang: ko }
        - { id: e6u, text: "자업자득이니까 다시는 하지 마.", lang: ko }
        - { id: w3b, text: "병 주고 약 주니까 운동하지 마.", lang: ko }
