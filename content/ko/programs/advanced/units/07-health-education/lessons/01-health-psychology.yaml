title:
  vi: Sức khoẻ thể chất và tinh thần - đọc chuyên mục y tế với -(으)ㄴ/는 듯하다
objectives:
  - vi: Hiểu từ vựng y tế, tâm lý của chuyên mục sức khoẻ - 만성 질환, 우울증, 스트레스 해소, 수면 부족, 면역력, 예방 접종, 증상, 진단.
  - vi: Phỏng đoán thận trọng trong văn viết bằng -(으)ㄴ/는 듯하다 · -(으)ㄹ 듯하다.
  - vi: Biết khi nào dùng -것 같다 (nói) và khi nào dùng -듯하다 (viết).
