      vi: Cảm xúc buồn nhẹ là tính từ 우울하다. 우울증 là danh từ chỉ bệnh - không ghép với 하다 hay 받다, và "mắc bệnh" phải là 우울증에 걸리다 (trợ từ 에).
    display_answer: "날씨 탓인지 요즘 좀 우울해요."

