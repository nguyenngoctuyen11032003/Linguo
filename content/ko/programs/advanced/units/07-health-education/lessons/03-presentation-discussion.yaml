title:
  vi: Thuyết trình và thảo luận học thuật - mở bài, lập luận, phản biện, kết bài
objectives:
  - vi: Mở đầu và kết thúc bài thuyết trình bằng các câu chuẩn - 지금부터 N에 대해 발표하겠습니다, 정리하자면, 이상으로 발표를 마치겠습니다.
  - vi: Lập luận bằng -다는 점에서 và N 측면에서, dẫn thông tin chung bằng -(으)ㄴ/는 것으로 알려져 있다.
  - vi: Phản biện lịch sự trong tranh luận bằng 물론 ~지만 và 그렇다고 해서 ~는 것은 아니다.
estimated_minutes: 30
skills: [speaking, listening, grammar]
