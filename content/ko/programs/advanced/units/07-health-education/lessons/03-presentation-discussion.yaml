    difficulty: 3
    item: ko:item:he-balpyo-yeolgi
    prompt:
      instruction: "Sắp xếp thành câu mở đầu thuyết trình: \"Sau đây tôi xin trình bày về thói quen ngủ của sinh viên.\""
      tokens:
        - { id: k2r, text: 발표하겠습니다 }
        - { id: f7e, text: 수면 }
        - { id: a0w, text: 대해 }
        - { id: s8m, text: 발표할게 }
        - { id: x3n, text: 지금부터 }
        - { id: h6b, text: 습관에 }
        - { id: q4y, text: 대학생의 }
    answer:
      orders:
        - [x3n, q4y, f7e, h6b, a0w, k2r]
    explanation:
      vi: Khuôn mở bài - 지금부터 + N에 대해 + 발표하겠습니다 (합쇼체). 발표할게 là 반말 thân mật, không dùng trước khán giả.
    display_answer: 지금부터 대학생의 수면 습관에 대해 발표하겠습니다.

  - key: ko:exercise:he-pres-mcq-rebuttal
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:he-ballon
    prompt:
      stem: "Đối phương nói - \"스마트폰은 집중력을 떨어뜨리니 학교에서 전면 금지해야 합니다.\" Bạn muốn thừa nhận một phần rồi phản biện lịch sự. Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: b7u, text: "물론 집중력에 영향을 줄 수는 있지만, 그렇다고 해서 수업에서의 활용까지 막아야 하는 것은 아닙니다.", lang: ko }
        - { id: n2c, text: "물론 집중력에 영향을 주지 않기 때문에 전면 금지해야 합니다.", lang: ko }
        - { id: e8j, text: "그렇다고 해서 스마트폰을 학교에서 전면 금지해야 합니다.", lang: ko }
        - { id: i5o, text: "정리하자면 지금부터 스마트폰에 대해 발표하겠습니다.", lang: ko }
    answer:
      correct_option_id: b7u
    explanation:
      vi: 물론 ~(으)ㄹ 수는 있지만 (thừa nhận) + 그렇다고 해서 ~는 것은 아닙니다 (bác bỏ suy luận "phải cấm hoàn toàn"). Phương án 2 tự mâu thuẫn, phương án 3 dùng 그렇다고 해서 mà không phủ định, phương án 4 là câu mở bài lạc chỗ.
    display_answer: "물론 집중력에 영향을 줄 수는 있지만, 그렇다고 해서 수업에서의 활용까지 막아야 하는 것은 아닙니다."

