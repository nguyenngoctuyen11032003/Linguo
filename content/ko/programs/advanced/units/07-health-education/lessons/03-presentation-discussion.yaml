body:
  - type: objective
    text:
      vi: Ở bậc cao cấp, bạn không chỉ cần hiểu bài thuyết trình mà còn phải tự trình bày và tranh luận ở seminar, hội thảo hay phần nói TOPIK. Bài này là "bộ khung" câu chữ cho một bài thuyết trình hoàn chỉnh và một lượt phản biện lịch sự.
  - type: explain
    text:
      vi: Bộ khung thuyết trình - chào và giới thiệu → 지금부터 N에 대해 발표하겠습니다 → bối cảnh (-(으)ㄴ/는 것으로 알려져 있습니다) → thân bài (N 측면에서 보면..., -다는 점에서...) → 정리하자면 ...다는 것입니다 → 이상으로 발표를 마치겠습니다. Mọi câu đều ở 합쇼체 (-습니다).
  - type: explain
    text:
      vi: -다는 점에서 là "ở chỗ..., xét ở điểm..." - nêu lý do để đánh giá, thường đi với 의의가 있다, 주목할 만하다, 문제가 있다. N 측면에서 là "xét về mặt N" - 비용 측면, 교육적 측면. Tiếng Việt cũng có "xét về mặt", nên chỉ cần nhớ 측면 nói về khía cạnh của vấn đề, còn 입장 là lập trường của người.
  - type: explain
    text:
      vi: Phản biện kiểu Hàn rất coi trọng thể diện - trước tiên thừa nhận (물론 ~(으)ㄹ 수도 있지만), rồi bác bỏ suy luận quá đà (그렇다고 해서 ~는 것은 아닙니다). Người Việt hay nói thẳng "tôi không đồng ý", nhưng trong tranh luận tiếng Hàn như vậy nghe gay gắt.
  - type: deep_explain
    text:
      vi: Cách chia -다는 점 - động từ -ㄴ/는다는 (늘린다는), quá khứ -았/었다는 (조사했다는), tính từ -다는 (크다는), danh từ -(이)라는 (처음이라는). -다고 해서 cũng đứng một mình được - 점수가 낮다고 해서 능력이 부족한 것은 아니다 (không phải điểm thấp là năng lực kém). Câu kết của phần này luôn là -(으)ㄴ/는 것은 아니다 để phủ định cả suy luận, không phủ định hành động.
  - type: example
    target: 안녕하십니까? 간호학과 박서연입니다. 지금부터 대학생의 카페인 섭취 실태에 대해 발표하겠습니다.
    target_lang: ko
    translation:
      vi: Xin chào quý vị. Tôi là Park Seo-yeon, khoa Điều dưỡng. Sau đây tôi xin trình bày về thực trạng tiêu thụ caffeine của sinh viên.
    note:
      vi: Mở bài chuẩn - chào, giới thiệu, nêu chủ đề bằng -에 대해 발표하겠습니다.
  - type: example
    target: 이 조사는 전국 20개 대학의 학생을 대상으로 했다는 점에서 신뢰도가 높다고 할 수 있습니다.
    target_lang: ko
    translation:
      vi: Khảo sát này có thể nói là đáng tin cậy ở chỗ đã thực hiện trên sinh viên của 20 trường đại học trên toàn quốc.
    note:
      vi: Quá khứ -았/었다는 점에서 + đánh giá.
  - type: example
    target: 교육적 측면에서 보면 토론 수업은 학생들의 비판적 사고력을 기르는 데 효과적입니다.
    target_lang: ko
    translation:
      vi: Xét về mặt giáo dục, giờ học tranh luận có hiệu quả trong việc rèn luyện tư duy phản biện của học sinh.
    note:
      vi: N적 측면에서 보면 - mở đầu một luận điểm.
  - type: example
    target: 물론 시험이 학습 동기를 높일 수도 있지만, 그렇다고 해서 시험을 늘리는 것만이 답은 아닙니다.
    target_lang: ko
    translation:
      vi: Tất nhiên thi cử có thể tăng động lực học tập, nhưng không vì thế mà tăng số bài thi là cách duy nhất.
    note:
      vi: Hai mẫu phản biện đi liền nhau - thừa nhận rồi bác bỏ suy luận.
  - type: example
    target: 정리하자면 카페인 섭취량보다 섭취 시간이 수면에 더 큰 영향을 준다는 것입니다. 이상으로 발표를 마치겠습니다.
    target_lang: ko
    translation:
      vi: Tóm lại, thời điểm uống caffeine ảnh hưởng đến giấc ngủ nhiều hơn lượng uống. Bài trình bày của tôi xin kết thúc tại đây.
    note:
      vi: 정리하자면 ... -다는 것입니다 rồi câu kết chuẩn.
  - type: common_mistake
    wrong: 그럼 지금부터 발표할게요.
    right: 그럼 지금부터 발표를 시작하겠습니다.
    target_lang: ko
    note:
      vi: -(으)ㄹ게요 là lời hứa thân mật. Trong thuyết trình dùng 합쇼체 với -겠습니다.
  - type: common_mistake
    wrong: 제 측면에서는 이 정책에 찬성하기 어렵습니다.
    right: 제 입장에서는 이 정책에 찬성하기 어렵습니다.
    target_lang: ko
    note:
      vi: 측면 là khía cạnh của vấn đề (비용 측면), 입장 là lập trường của một người. Tiếng Việt "từ phía tôi" dễ khiến bạn chọn nhầm 측면.
  - type: common_mistake
    wrong: 그렇다고 해서 스마트폰을 금지하지 않아야 합니다.
    right: 그렇다고 해서 스마트폰을 금지해야 하는 것은 아닙니다.
    target_lang: ko
    note:
      vi: Câu sai nghĩa là "phải không được cấm" - quá mạnh. 그렇다고 해서 cần kết bằng -(으)ㄴ/는 것은 아니다 để chỉ phủ định suy luận "vì vậy phải cấm".
  - type: summary
    points:
      - vi: Mở - 지금부터 N에 대해 발표하겠습니다 · Kết - 정리하자면 ...다는 것입니다 → 이상으로 발표를 마치겠습니다 · 경청해 주셔서 감사합니다.
      - vi: -다는 점에서 (ở chỗ...) + 의의가 있다 / 주목할 만하다; N 측면에서 보면 (xét về mặt N); 측면 ≠ 입장.
      - vi: -(으)ㄴ/는 것으로 알려져 있다 = được biết là (thông tin chung).
      - vi: Phản biện - 물론 ~(으)ㄹ 수도 있지만 → 그렇다고 해서 ~는 것은 아닙니다; 반론을 제기하다.
      - vi: 사회자 (người điều phối) ≠ 사회 (xã hội); 토론 (tranh luận hai phía) ≠ 토의 (bàn bạc chung).
exercises:
  # ---------------- recognition ----------------
  - key: ko:exercise:he-pres-mcq-mullon
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ko:item:he-mullon-jiman
    prompt:
      stem: "물론 온라인 수업이 편리하기는 하지만 학생 간 교류가 크게 줄어든다는 문제가 있습니다. - Ý chính của người nói là gì?"
      stem_lang: vi
      options:
        - { id: r9c, text: "Học trực tuyến làm giao lưu giữa học sinh giảm mạnh - đó là vấn đề.", lang: vi }
        - { id: e2k, text: "Học trực tuyến rất tiện lợi nên cần mở rộng ngay.", lang: vi }
        - { id: w6s, text: "Học trực tuyến hoàn toàn không tiện lợi.", lang: vi }
        - { id: h1y, text: "Giao lưu giữa học sinh đang tăng lên nhờ học trực tuyến.", lang: vi }
    answer:
      correct_option_id: r9c
    explanation:
      vi: 물론 ~기는 하지만 thừa nhận một phần (tiện lợi), còn phần sau 지만 mới là ý chính - giao lưu giảm (줄어든다는 문제). Người nói không phủ nhận sự tiện lợi, cũng không nói giao lưu tăng.
    display_answer: "Học trực tuyến làm giao lưu giữa học sinh giảm mạnh - đó là vấn đề."

  - key: ko:exercise:he-pres-listen-closing
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ko:item:he-balpyo-machim
    prompt:
      audio_asset_id: null
      fallback_text: 이상으로 발표를 마치겠습니다. 질문이 있으시면 편하게 말씀해 주십시오.
      options:
        - { id: d5x, text: "Bài trình bày xin kết thúc tại đây. Nếu có câu hỏi, xin quý vị cứ tự nhiên nêu ra.", lang: vi }
        - { id: m0f, text: "Bài trình bày có điều bất thường, xin quý vị đặt câu hỏi.", lang: vi }
        - { id: j4b, text: "Bài trình bày sẽ bắt đầu sau khi có câu hỏi.", lang: vi }
        - { id: t7n, text: "Bài trình bày kéo dài trên một tiếng, xin quý vị kiên nhẫn.", lang: vi }
    answer:
      correct_option_id: d5x
    explanation:
      vi: 이상으로 ... 마치겠습니다 = kết thúc với những điều trên. 이상 ở đây là "những điều đã nói ở trên", không phải "bất thường" hay "trở lên".
    display_answer: "Bài trình bày xin kết thúc tại đây. Nếu có câu hỏi, xin quý vị cứ tự nhiên nêu ra."

  - key: ko:exercise:he-pres-mcq-sahoeja
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ko:item:he-toron-sahoeja
    prompt:
      stem: "토론회에서 사회자의 역할은 무엇입니까? - Chọn đáp án đúng."
      stem_lang: vi
      options:
        - { id: p3w, text: "Điều phối buổi tranh luận và chia lượt phát biểu.", lang: vi }
        - { id: g8a, text: "Nghiên cứu xã hội học cho buổi tranh luận.", lang: vi }
        - { id: o1m, text: "Phản biện lại ý kiến của mọi người tham gia.", lang: vi }
        - { id: y5e, text: "Chấm điểm bài luận của người tham gia.", lang: vi }
    answer:
      correct_option_id: p3w
    explanation:
      vi: 사회자 (司會者) là người dẫn, điều phối - giới thiệu chủ đề, chia thời gian phát biểu. Đừng nhầm với 사회 (社會 - xã hội); người phản biện là 토론자.
    display_answer: "Điều phối buổi tranh luận và chia lượt phát biểu."

  - key: ko:exercise:he-pres-fill-cheungmyeon
    type: fill_blank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:he-gram-cheungmyeoneseo
    prompt:
      template: "비용 {{b1}}에서 보면 공공 도서관의 전자책 대여 서비스는 매우 효율적이다."
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - Xét về "mặt, khía cạnh" (側面) của vấn đề.
        - 측...
    answer:
      blanks:
        b1: [측면]
    known_wrong:
      - answer: 입장
        feedback_vi: 입장 là lập trường của một người (학생 입장에서). Với khía cạnh của vấn đề như chi phí, dùng 측면.
        error_tag: cheungmyeon_vs_ipjang
      - answer: 정면
        feedback_vi: 정면 là mặt trước, chính diện. "Xét về mặt chi phí" là 비용 측면에서.
        error_tag: vocab_meaning
    explanation:
      vi: N 측면에서 보면 = xét về mặt N. 측면 (trắc diện) là khía cạnh; dùng với 비용, 경제적, 교육적, 건강.
    display_answer: 비용 측면에서 보면 공공 도서관의 전자책 대여 서비스는 매우 효율적이다.

  - key: ko:exercise:he-pres-mcq-jeomeseo
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 4
    item: ko:item:he-gram-daneun-jeomeseo
    prompt:
      stem: "Chọn câu dùng đúng -다는 점에서."
      stem_lang: vi
      options:
        - { id: c6t, text: "이 연구는 농촌 노인의 수면 습관을 처음으로 조사했다는 점에서 의의가 있다.", lang: ko }
        - { id: l2h, text: "이 연구는 농촌 노인의 수면 습관을 처음으로 조사했는 점에서 의의가 있다.", lang: ko }
        - { id: u9v, text: "이 연구는 농촌 노인의 수면 습관을 처음으로 조사하다는 점에서 의의가 있다.", lang: ko }
        - { id: z4q, text: "이 연구는 농촌 노인의 수면 습관을 처음으로 조사했다는 점에게 의의가 있다.", lang: ko }
    answer:
      correct_option_id: c6t
    explanation:
      vi: Quá khứ - -았/었다는 점에서. Không có dạng -았는 점; động từ hiện tại phải là -ㄴ/는다는 (조사한다는), không phải -다는; 에게 chỉ dùng cho người.
    display_answer: "이 연구는 농촌 노인의 수면 습관을 처음으로 조사했다는 점에서 의의가 있다."

  # ---------------- recall ----------------
  - key: ko:exercise:he-pres-fill-jeomeseo-form
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:he-gram-daneun-jeomeseo
    prompt:
      template: "이 앱은 학생이 스스로 학습 계획을 (세우다 →) {{b1}} 점에서 기존 학습 앱과 다르다."
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [세운다는, 세우게 한다는, 세울 수 있다는, 세우도록 돕는다는]
    known_wrong:
      - answer: 세우다는
        feedback_vi: Động từ hiện tại chia -ㄴ/는다는 - 세운다는. -다는 không -ㄴ chỉ dành cho tính từ.
        error_tag: daneun_form
      - answer: 세우는다는
        feedback_vi: Gốc không patchim thêm -ㄴ다는 - 세운다는.
        error_tag: daneun_form
    explanation:
      vi: V-ㄴ/는다는 점에서 - 세우다 → 세운다는. Điểm khác biệt của ứng dụng là "học sinh tự lập kế hoạch".
    display_answer: 이 앱은 학생이 스스로 학습 계획을 세운다는 점에서 기존 학습 앱과 다르다.

  - key: ko:exercise:he-pres-fill-geureotago
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:he-geureotago-haeseo
    prompt:
      template: "성적이 높다고 해서 반드시 행복한 {{b1}} 아니다."
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [것은, 건, 것이, 게]
    known_wrong:
      - answer: 것을
        feedback_vi: Trước 아니다 dùng 은/는 hoặc 이/가 - 행복한 것은 아니다.
        error_tag: particle
      - answer: 거를
        feedback_vi: 아니다 không đi với tân ngữ 을/를. Viết 행복한 것은 (건) 아니다.
        error_tag: particle
    explanation:
      vi: -다고 해서 ... -(으)ㄴ/는 것은 아니다 = không phải cứ... là... Mẫu này bác bỏ suy luận "điểm cao thì hạnh phúc" mà không phủ nhận điểm cao.
    display_answer: 성적이 높다고 해서 반드시 행복한 것은 아니다.

  - key: ko:exercise:he-pres-translate-closing
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:he-balpyo-machim
    prompt:
      source_text: Bài trình bày của tôi xin kết thúc tại đây. Cảm ơn quý vị đã lắng nghe.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - "이상으로 발표를 마치겠습니다. 경청해 주셔서 감사합니다."
        - "이상으로 발표를 마치겠습니다. 경청해 주셔서 고맙습니다."
        - "이상으로 발표를 마치겠습니다. 들어 주셔서 감사합니다."
        - "이상으로 발표를 마치겠습니다. 들어 주셔서 고맙습니다."
