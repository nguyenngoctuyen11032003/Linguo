  - key: ko:exercise:le-edit-order-chwiji
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:le-jaegohada
    prompt:
      instruction: "Sắp xếp thành câu xã luận: \"Mục đích thì tốt, nhưng nếu là chế độ trái với công bằng thì phải xem xét lại.\""
      tokens:
        - { id: d6r, text: 재고해야 }
        - { id: u3m, text: 형평성을 }
        - { id: z9a, text: 좋으나 }
        - { id: i1k, text: 제도라면 }
        - { id: p7e, text: 취지는 }
        - { id: s4w, text: 한다 }
        - { id: g0v, text: 어긋나는 }
        - { id: n5c, text: 형평성에 }
    answer:
      orders:
        - [p7e, z9a, n5c, g0v, i1k, d6r, s4w]
    explanation:
      vi: Khuôn xã luận - 취지는 좋으나 (công nhận) → 형평성에 어긋나는 제도라면 (vấn đề) → 재고해야 한다 (kêu gọi). 어긋나다 đi với 에, nên 형평성을 là token nhiễu.
    display_answer: 취지는 좋으나 형평성에 어긋나는 제도라면 재고해야 한다.

  - key: ko:exercise:le-edit-mcq-concede
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:le-gram-dason-chideorado
    prompt:
      stem: "Bài xã luận ủng hộ đầu tư thiết bị an toàn cho tàu điện dù tốn kém. Câu nào vừa tạm chấp nhận lý lẽ \"tốn kém\" của phe phản đối vừa bác bỏ nó?"
      stem_lang: vi
      options:
        - { id: v2o, text: "비용이 많이 든다손 치더라도 시민의 생명보다 중요할 수는 없다.", lang: ko }
        - { id: j8s, text: "비용이 많이 든다손 치더라도 비용이 많이 드는 것은 사실이다.", lang: ko }
        - { id: c6y, text: "비용이 많이 들 리 만무하므로 투자할 필요가 없다.", lang: ko }
        - { id: h3f, text: "비용이야말로 시민의 생명보다 중요한 가치이다.", lang: ko }
    answer:
      correct_option_id: v2o
    explanation:
      vi: -다손 치더라도 tạm công nhận "tốn kém" rồi vế sau bác bỏ (không thể quan trọng hơn sinh mạng). Phương án 2 lặp ý, phương án 3 phủ định chi phí và phản đối đầu tư, phương án 4 ủng hộ phe phản đối.
    display_answer: "비용이 많이 든다손 치더라도 시민의 생명보다 중요할 수는 없다."

