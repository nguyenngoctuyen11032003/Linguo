title:
  vi: Lập luận trong xã luận - -(으)ㄹ 리 만무하다, -(으)ㄴ들, -다손 치더라도, N(이)야말로
objectives:
  - vi: Phủ định mạnh một khả năng bằng -(으)ㄹ 리 만무하다.
  - vi: Nhượng bộ để bác bỏ bằng -(으)ㄴ들 (tu từ "có... thì ích gì") và -다손 치더라도 ("cứ cho là...").
  - vi: Nhấn mạnh kết luận bằng N(이)야말로, kêu gọi bằng 재고해야 한다.
  - vi: Dùng từ vựng phê bình chính sách - 사설, 실효성, 형평성, 사각지대, 졸속, 취지.
