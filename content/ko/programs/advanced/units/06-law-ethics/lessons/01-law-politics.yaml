title:
  vi: Từ dự luật đến thi hành - từ vựng pháp luật và chính trị
objectives:
  - vi: Hiểu vòng đời của một đạo luật - 법안, 공청회, 개정, 시행, 위반, 처벌 - và các khái niệm 권리 · 의무, 여론.
  - vi: Phân biệt N에 의하면 (theo nguồn tin) với N에 의해(서) (bởi - chủ thể câu bị động, căn cứ).
  - vi: Chỉ ra cốt lõi vấn đề bằng (원인 / 문제는) -는 데 있다, viết đúng khoảng cách.
estimated_minutes: 25
