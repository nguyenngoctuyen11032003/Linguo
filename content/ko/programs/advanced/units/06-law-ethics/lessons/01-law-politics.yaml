      vi: Dẫn nguồn - N에 의하면 / N에 따르면 + -(으)ㄴ/는 것으로 나타났다. "Đa số người dân" = 국민 대다수; "dự luật" = 법안.
    display_answer: 여론 조사 결과에 의하면 국민 대다수가 이 법안에 반대하는 것으로 나타났다.

