  - key: ko:exercise:le-law-order-uihae
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:le-gwolli-uimu
    prompt:
      instruction: "Sắp xếp thành câu: \"Quyền và nghĩa vụ của người lao động được quy định bởi pháp luật.\""
      tokens:
        - { id: f3a, text: 의해 }
        - { id: y8d, text: 정한다 }
        - { id: u2k, text: 권리와 }
        - { id: b6s, text: 법에 }
        - { id: l1x, text: 정해진다 }
        - { id: i9m, text: 근로자의 }
        - { id: q4c, text: 의무는 }
        - { id: z7p, text: 의하면 }
    answer:
      orders:
        - [i9m, u2k, q4c, b6s, f3a, l1x]
    explanation:
      vi: N에 의해 + động từ bị động - 법에 의해 정해진다 (được quy định bởi luật). 정한다 là chủ động nên không hợp với 에 의해; 의하면 là "theo nguồn tin".
    display_answer: 근로자의 권리와 의무는 법에 의해 정해진다.

  - key: ko:exercise:le-law-mcq-news
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ko:item:le-gaejeong
    prompt:
      stem: "Đọc tin - 정부는 공청회에서 수렴한 의견을 반영해 개정안을 다시 마련하기로 했다. Điều nào đúng?"
      stem_lang: vi
      options:
        - { id: v5n, text: "Chính phủ sẽ soạn lại bản sửa đổi dựa trên ý kiến thu thập được ở buổi lấy ý kiến công chúng.", lang: vi }
        - { id: j0g, text: "Chính phủ đã thi hành luật sửa đổi mà không cần ý kiến người dân.", lang: vi }
        - { id: o3w, text: "Buổi lấy ý kiến công chúng bị huỷ vì dư luận phản đối.", lang: vi }
        - { id: k6u, text: "Quốc hội đã bác bỏ bản sửa đổi của chính phủ.", lang: vi }
    answer:
      correct_option_id: v5n
    explanation:
      vi: 공청회에서 수렴한 의견 = ý kiến tổng hợp được tại buổi lấy ý kiến; 반영하다 = phản ánh, đưa vào; 개정안을 다시 마련하다 = soạn lại dự thảo sửa đổi. Câu không nhắc đến việc thi hành, huỷ hay bác bỏ.
