title:
  vi: Thế khó đạo đức - -(으)ㄹ 바에야, -느니, -(으)ㄴ/는 마당에
objectives:
  - vi: Chọn cái ít tệ hơn bằng V-(으)ㄹ 바에야 (차라리) và V-느니 (차라리) - đặt đúng thứ tự lựa chọn.
  - vi: Nêu tình cảnh gay gắt bằng -(으)ㄴ/는 마당에 để phê phán hoặc khẳng định điều tất yếu.
  - vi: Dùng từ vựng đạo đức công vụ - 양심, 타협하다, 회피하다, 묵인하다, 부정부패, 내부 고발, 청렴하다.
