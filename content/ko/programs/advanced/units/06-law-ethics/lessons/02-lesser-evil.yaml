    prompt:
      instruction: "Sắp xếp thành câu: \"Trong lúc dư luận đang sục sôi thế này thì không thể né tránh trách nhiệm.\""
      tokens:
        - { id: g8v, text: 수는 }
        - { id: n2a, text: 책임을 }
        - { id: x4h, text: 마당에서 }
        - { id: r6p, text: 여론이 }
        - { id: j1e, text: 없다 }
        - { id: t3m, text: 회피할 }
        - { id: y7c, text: 마당에 }
        - { id: w5k, text: 들끓는 }
    answer:
      orders:
        - [r6p, w5k, y7c, n2a, t3m, g8v, j1e]
    explanation:
      vi: V-는 마당에 (tình cảnh đang diễn ra) + -(으)ㄹ 수는 없다. 마당에서 là token nhiễu - thêm 서 sẽ thành "ở ngoài sân", mất nghĩa cấu trúc.
    display_answer: 여론이 들끓는 마당에 책임을 회피할 수는 없다.

  - key: ko:exercise:le-evil-mcq-advice
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:le-naebu-gobal
    prompt:
      stem: "Đồng nghiệp tâm sự - \"부장님이 회계 장부를 고치라고 하시는데 어떻게 해야 할지 모르겠어.\" Lời khuyên nào hợp lý và đúng ngữ pháp?"
