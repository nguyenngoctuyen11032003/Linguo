        - { id: i4s, text: "내부 고발을 할 바에야 차라리 부정에 가담하는 게 양심적이야.", lang: ko }
        - { id: e7g, text: "장부를 고치는 마당에 다 같이 승진을 축하하자.", lang: ko }
        - { id: o0x, text: "부정에 가담하느니 장부를 더 많이 고치자.", lang: ko }
    answer:
      correct_option_id: p9b
    explanation:
      vi: Lời khuyên đúng gạt bỏ việc tiếp tay sai phạm (가담할 바에야) và chọn tố giác (차라리 내부 고발). Phương án 2 đảo thứ tự và gọi tiếp tay là "có lương tâm", phương án 3 dùng 마당에 cho dịp vui, phương án 4 vô lý vì vế sau vẫn là sai phạm.
    display_answer: "부정에 가담할 바에야 차라리 내부 고발을 하는 게 낫지 않을까?"

