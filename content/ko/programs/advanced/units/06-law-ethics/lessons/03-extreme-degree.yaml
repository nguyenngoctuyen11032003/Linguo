title:
  vi: Phẫn nộ và oan ức - mức độ cực điểm với -다 못해, -(으)ㄹ 지경이다, -기 그지없다 · 짝이 없다
objectives:
  - vi: Diễn tả việc chịu đựng đến giới hạn và mức độ cực điểm bằng V/A-다 못해.
  - vi: Nói tình trạng tồi tệ gần như không chịu nổi bằng -(으)ㄹ 지경이다, phân biệt với -(으)ㄹ 정도로.
  - vi: Chọn đúng A-기 그지없다 (trang trọng, cả nghĩa tốt lẫn xấu) và A-기 짝이 없다 (chê trách).
  - vi: Dùng từ vựng cảm xúc xã hội - 피해자 · 가해자, 억울하다, 분노, 무책임하다, 뻔뻔하다, 어처구니없다.
estimated_minutes: 25
skills: [grammar, vocabulary, reading]
prerequisites: [ko:lesson:lesser-evil]
