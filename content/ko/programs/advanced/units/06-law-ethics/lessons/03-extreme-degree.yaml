body:
  - type: objective
    text:
      vi: Tin về lừa đảo, tai nạn, hay một lời xin lỗi chiếu lệ thường kèm những câu cảm xúc rất mạnh. Bài này dạy bạn bốn cấu trúc mức độ cực điểm và bộ từ vựng để hiểu - và tự viết - những câu như vậy ở đúng văn phong.
  - type: explain
    text:
      vi: V-다 못해 là "chịu (chờ, nghe) đến giới hạn rồi không nổi nữa nên..." - 기다리다 못해 직접 찾아갔다. A-다 못해 là "... đến cực điểm, sang hẳn trạng thái khác" - 안타깝다 못해 화가 났다 (tiếc đến mức thành giận). 못해 ở đây không có nghĩa "không thể làm".
  - type: explain
    text:
      vi: -(으)ㄹ 지경이다 là "đến mức (sắp)..." cho tình trạng tồi tệ - 쓰러질 지경이다, 미칠 지경이다. Bạn đã học -(으)ㄹ 정도로 trung tính (có thể tốt), còn 지경 chỉ dùng cho điều xấu; câu 행복할 지경이다 nghe rất lạ.
  - type: explain
    text:
      vi: A-기 그지없다 và A-기 짝이 없다 đều là "vô cùng, hết chỗ nói". 그지없다 trang trọng, dùng trong diễn văn, thư xin lỗi, cả nghĩa tốt (감사하기 그지없다) lẫn xấu; 짝이 없다 gần như luôn để chê (무례하기 짝이 없다).
  - type: deep_explain
    text:
      vi: Vì sao người Việt hay sai - tiếng Việt chỉ cần "vô cùng, cực kỳ" cho mọi thứ, nên dễ dùng 짝이 없다 để cảm ơn hoặc dùng 지경 cho niềm vui. Hãy tự hỏi hai câu - văn bản có trang trọng không (그지없다), và mình đang khen hay chê (짝이 없다 chỉ để chê). Về chính tả - 그지없다, 어처구니없다, 참다못해 viết liền; 짝이 없다, 기다리다 못해, 할 지경 viết cách.
  - type: example
    target: 전세 사기 피해자들은 보증금을 돌려받을 길이 막막해 잠도 못 잘 지경이라고 호소했다.
    target_lang: ko
    translation:
      vi: Các nạn nhân lừa đảo thuê nhà jeonse kêu rằng không biết lấy lại tiền đặt cọc bằng cách nào, đến mức không ngủ được.
    note:
      vi: -(으)ㄹ 지경이다 trong lời kể khổ, trích dẫn bằng -다고 호소했다.
  - type: example
    target: 피해자의 억울한 사연을 듣고 있자니 안타깝다 못해 분노가 치밀었다.
    target_lang: ko
    translation:
      vi: Nghe câu chuyện oan ức của nạn nhân, tôi thương xót đến mức cơn giận bốc lên.
    note:
      vi: A-다 못해 - cảm xúc vượt ngưỡng và chuyển sang cảm xúc khác.
  - type: example
    target: 가해자가 반성은커녕 피해자를 탓하는 모습은 뻔뻔하기 짝이 없었다.
    target_lang: ko
    translation:
      vi: Kẻ gây hại chẳng những không hối lỗi mà còn đổ lỗi cho nạn nhân - thật trơ trẽn hết chỗ nói.
    note:
      vi: -기 짝이 없다 để chê trách; -은커녕 bạn đã học ở unit 2.
  - type: example
    target: 이번 사고로 피해를 입으신 분들과 유가족께 사죄의 말씀을 드리며 송구하기 그지없습니다.
    target_lang: ko
    translation:
      vi: Chúng tôi xin gửi lời tạ lỗi tới những người bị thiệt hại trong vụ tai nạn lần này và gia đình nạn nhân, và vô cùng hổ thẹn.
    note:
      vi: Thư xin lỗi chính thức - -기 그지없습니다 (trang trọng), không dùng 짝이 없다.
  - type: example
    target: 민원을 넣은 지 석 달이 지나도록 답이 없자 주민들은 기다리다 못해 직접 시청을 찾아갔다.
    target_lang: ko
    translation:
      vi: Gửi khiếu nại đã ba tháng mà vẫn không có hồi âm, cư dân hết chờ nổi nên đã tự tìm đến toà thị chính.
    note:
      vi: V-다 못해 - hành động sau khi sự chịu đựng đã cạn.
  - type: common_mistake
    wrong: 합격 소식을 듣고 너무 행복할 지경이었다.
    right: 합격 소식을 듣고 날아갈 듯이 행복했다.
    target_lang: ko
    note:
      vi: -(으)ㄹ 지경이다 chỉ dùng cho tình trạng xấu. Niềm vui thì dùng -(으)ㄹ 정도로, -(으)ㄴ/는 듯이 hoặc chỉ cần 너무.
  - type: common_mistake
    wrong: 귀한 시간을 내어 와 주신 여러분께 감사하기 짝이 없습니다.
    right: 귀한 시간을 내어 와 주신 여러분께 감사하기 그지없습니다.
    target_lang: ko
    note:
      vi: 짝이 없다 mang sắc thái chê trách nên không dùng để cảm ơn. Lời cảm ơn trang trọng dùng 그지없다.
  - type: common_mistake
    wrong: 시험을 망쳐서 너무 억울해요.
    right: 시험을 망쳐서 너무 속상해요.
    target_lang: ko
    note:
      vi: 억울하다 cần yếu tố bất công (bị đổ oan, bị đối xử không công bằng). Tự làm bài không tốt thì là 속상하다.
  - type: summary
    points:
      - vi: V-다 못해 = chịu đến giới hạn nên...; A-다 못해 = ... đến cực điểm, chuyển sang trạng thái khác.
      - vi: V/A-(으)ㄹ 지경이다 = đến mức (sắp)... - chỉ cho điều xấu; -(으)ㄹ 정도로 trung tính.
      - vi: A-기 그지없다 - trang trọng, cả tốt lẫn xấu · A-기 짝이 없다 - chê trách.
      - vi: 피해자 (bị hại) ↔ 가해자 (gây hại); 억울하다 (oan) ≠ 속상하다 (buồn bực); 뻔뻔하다 (trơ trẽn) ≠ 당당하다 (đường hoàng).
      - vi: Viết liền - 그지없다, 어처구니없다, 참다못해; viết cách - 짝이 없다, 기다리다 못해.
exercises:
  # ---------------- recognition ----------------
  - key: ko:exercise:le-degree-mcq-motae
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ko:item:le-gram-da-motae
    prompt:
      stem: "위층의 발소리를 참다못해 결국 관리사무소에 정식으로 항의했다. - Câu này nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: s3v, text: "Không chịu nổi tiếng bước chân từ tầng trên nữa, cuối cùng tôi đã chính thức phản ánh với ban quản lý.", lang: vi }
        - { id: y6b, text: "Vì không thể chịu đựng nên tôi đã không phản ánh với ban quản lý.", lang: vi }
        - { id: h1n, text: "Tôi cố chịu đựng tiếng bước chân và không làm gì cả.", lang: vi }
        - { id: c9t, text: "Tôi gây ồn ở tầng trên nên bị ban quản lý nhắc nhở.", lang: vi }
    answer:
      correct_option_id: s3v
    explanation:
      vi: 참다못해 = nhịn đến giới hạn, không chịu nổi nữa - và sau đó có hành động (항의했다). 못해 ở đây không phủ định hành động phía sau.
    display_answer: "Không chịu nổi tiếng bước chân từ tầng trên nữa, cuối cùng tôi đã chính thức phản ánh với ban quản lý."

  - key: ko:exercise:le-degree-listen-jjak
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ko:item:le-gram-gi-jjagi-eopda
    prompt:
      audio_asset_id: null
      fallback_text: 사고 처리 과정에서 보여 준 회사의 태도는 무책임하기 짝이 없었다.
      options:
        - { id: r4j, text: "Thái độ công ty thể hiện trong quá trình xử lý tai nạn thật vô trách nhiệm hết chỗ nói.", lang: vi }
        - { id: e8a, text: "Công ty không tìm được đối tác nào chịu trách nhiệm xử lý tai nạn.", lang: vi }
        - { id: k5z, text: "Công ty đã xử lý tai nạn rất có trách nhiệm.", lang: vi }
        - { id: w2g, text: "Không ai biết thái độ của công ty trong vụ tai nạn.", lang: vi }
    answer:
      correct_option_id: r4j
    explanation:
      vi: A-기 짝이 없다 = vô cùng, hết chỗ nói (để chê) - 무책임하기 짝이 없다. 짝 ở đây không phải "đối tác"; nghĩa đen là "không có gì sánh cặp".
    display_answer: "Thái độ công ty thể hiện trong quá trình xử lý tai nạn thật vô trách nhiệm hết chỗ nói."

  - key: ko:exercise:le-degree-mcq-apology
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 4
    item: ko:item:le-gram-gi-geujieopda
    prompt:
      stem: "Câu nào phù hợp nhất cho thư xin lỗi chính thức của công ty gửi khách hàng?"
      stem_lang: vi
      options:
        - { id: m7u, text: "고객 여러분께 큰 불편을 끼쳐 드려 송구하기 그지없습니다.", lang: ko }
        - { id: d3o, text: "고객 여러분께 큰 불편을 끼쳐 드려 송구하기 짝이 없어.", lang: ko }
        - { id: b0c, text: "고객 여러분께 큰 불편을 끼쳐 드려 송구할 지경이야.", lang: ko }
        - { id: g6s, text: "고객 여러분께 큰 불편을 끼쳐 드려 송구하다 못해 즐겁습니다.", lang: ko }
    answer:
      correct_option_id: m7u
    explanation:
      vi: Thư xin lỗi cần 합쇼체 và cấu trúc trang trọng - -기 그지없습니다. Hai phương án dùng 반말 (-어, -야) không hợp, và "hổ thẹn đến mức vui" là vô lý.
    display_answer: "고객 여러분께 큰 불편을 끼쳐 드려 송구하기 그지없습니다."

  - key: ko:exercise:le-degree-fill-pihaeja
    type: fill_blank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:le-pihaeja-gahaeja
    prompt:
      template: "전세 사기 {{b1}}들은 보증금을 돌려받지 못해 생계까지 위협받고 있다."
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - Người bị hại (被害者 - bị hại giả).
        - 피...
    answer:
      blanks:
        b1: [피해자]
    known_wrong:
      - answer: 가해자
        feedback_vi: 가해자 là người gây hại. Người không lấy lại được tiền cọc là người bị hại - 피해자.
        error_tag: pihae_vs_gahae
      - answer: 손해자
        feedback_vi: Không có từ 손해자. Người bị hại trong vụ lừa đảo là 피해자.
        error_tag: vocab_form
    explanation:
      vi: 피 (被 - bị) = chịu, 가 (加 - gia) = gây ra. Người mất tiền cọc, bị đe doạ sinh kế là 피해자.
    display_answer: 전세 사기 피해자들은 보증금을 돌려받지 못해 생계까지 위협받고 있다.

  - key: ko:exercise:le-degree-mcq-eogul
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:le-eogulhada
    prompt:
      stem: "Bạn bị đồng nghiệp đổ lỗi cho một sai sót mà bạn không hề gây ra. Từ nào diễn tả đúng cảm xúc của bạn?"
      stem_lang: vi
      options:
        - { id: q2f, text: "억울하다", lang: ko }
        - { id: z8k, text: "뻔뻔하다", lang: ko }
        - { id: l4w, text: "청렴하다", lang: ko }
        - { id: i7p, text: "무책임하다", lang: ko }
    answer:
      correct_option_id: q2f
    explanation:
      vi: Bị đổ lỗi oan là tình huống bất công - 억울하다. 뻔뻔하다 và 무책임하다 mô tả người đổ lỗi chứ không phải cảm xúc của bạn; 청렴하다 là liêm khiết.
    display_answer: "억울하다"

  # ---------------- recall ----------------
  - key: ko:exercise:le-degree-fill-jigyeong
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:le-gram-l-jigyeongida
    prompt:
      template: "월세와 대출 이자를 내고 나면 남는 돈이 없어 굶어 (죽다 →) {{b1}} 지경이다."
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [죽을]
    known_wrong:
      - answer: 죽는
        feedback_vi: -(으)ㄹ 지경이다 dùng định ngữ -(으)ㄹ - 죽을 지경이다.
        error_tag: jigyeong_form
      - answer: 죽은
        feedback_vi: Không dùng định ngữ quá khứ với 지경. Viết 죽을 지경.
        error_tag: jigyeong_form
    explanation:
      vi: 굶어 죽을 지경이다 = đến mức sắp chết đói - cách nói phóng đại quen thuộc khi than khổ. Gốc 죽 có patchim nên thêm 을.
    display_answer: 월세와 대출 이자를 내고 나면 남는 돈이 없어 굶어 죽을 지경이다.

  - key: ko:exercise:le-degree-fill-motae-adj
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 5
    item: ko:item:le-gram-da-motae
    prompt:
      template: "솜방망이 처벌 소식을 들은 유가족들은 허탈하다 {{b1}} 분노를 터뜨렸다."
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [못해, 못해서]
    known_wrong:
      - answer: 못하게
        feedback_vi: Cấu trúc mức độ là A-다 못해 - cảm xúc vượt ngưỡng rồi chuyển sang cảm xúc khác.
        error_tag: motae_form
      - answer: 않아
        feedback_vi: Không có cấu trúc -다 않아. Cảm xúc "đến cực điểm" là -다 못해.
        error_tag: motae_form
    explanation:
      vi: A-다 못해 - hụt hẫng (허탈하다) đến cực điểm rồi bùng thành phẫn nộ. 솜방망이 처벌 là "phạt bằng gậy bông" - hình phạt quá nhẹ.
    display_answer: 솜방망이 처벌 소식을 들은 유가족들은 허탈하다 못해 분노를 터뜨렸다.

  - key: ko:exercise:le-degree-translate-jjak
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:le-ppeonppeonhada
    prompt:
      source_text: Thái độ của kẻ gây hại thật trơ trẽn hết chỗ nói.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - "가해자의 태도는 뻔뻔하기 짝이 없다."
        - "가해자의 태도는 뻔뻔하기 짝이 없습니다."
        - "가해자의 태도는 뻔뻔하기 짝이 없었다."
        - "가해자의 태도는 뻔뻔하기 짝이 없어요."
        - "가해자의 태도는 뻔뻔하기 그지없다."
        - "가해자의 태도는 뻔뻔하기 그지없습니다."
        - "가해자의 태도는 뻔뻔하기 그지없었다."
        - "가해자의 태도는 정말 뻔뻔하기 짝이 없다."
        - "가해자의 태도는 정말 뻔뻔하기 짝이 없습니다."
    known_wrong:
      - answer: 가해자의 태도는 당당하기 짝이 없다.
        feedback_vi: 당당하다 là đường hoàng, tự tin (khen). "Trơ trẽn" là 뻔뻔하다.
        error_tag: ppeonppeon_vs_dangdang
      - answer: 피해자의 태도는 뻔뻔하기 짝이 없다.
        feedback_vi: Kẻ gây hại là 가해자; 피해자 là nạn nhân.
        error_tag: pihae_vs_gahae
