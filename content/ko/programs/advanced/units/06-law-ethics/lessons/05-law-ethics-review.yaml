        - "Chính việc lắng nghe ý kiến của người dùng và người đi bộ mới là cách nhanh nhất để xây dựng luật tốt."
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Quá trình lắng nghe người dùng và người đi bộ là con đường xa để làm ra luật tốt.
        feedback_vi: 지름길 là đường tắt, không phải đường xa; và thiếu ý nhấn mạnh "chính... mới là" của 이야말로.
        error_tag: meaning_changed
      - answer: Người dùng và người đi bộ đã làm ra luật tốt bằng con đường tắt.
        feedback_vi: Câu gốc không nói người dùng làm luật; nó nói quá trình lắng nghe họ mới là con đường tắt.
        error_tag: meaning_changed
    explanation:
      vi: N이야말로 = chính N mới là; 지름길 = đường tắt, cách nhanh nhất. Tiếng Việt cần "chính... mới là" để giữ sắc thái nhấn mạnh.
    display_answer: Chính quá trình lắng nghe tiếng nói của người dùng và người đi bộ mới là con đường tắt để làm ra luật tốt.

