    explanation:
      vi: Chủ trì buổi điều trần cần 합쇼체 và kính ngữ - 께서 말씀해 주시기 바랍니다. 반말 (말해 봐) là thất lễ; -(으)ㄹ 리 만무하다 và -(으)ㄴ들 phủ định, gạt bỏ người nói - không hợp với vai người chủ trì trung lập.
    display_answer: "다음으로 시민 단체 측 진술인께서 말씀해 주시기 바랍니다."

