        - { id: k0g, text: "다음으로 시민 단체 측 진술인께서 말씀해 주실 리 만무합니다.", lang: ko }
        - { id: h5s, text: "시민 단체 측 진술인께서 말씀하신들 무슨 소용이 있겠습니까?", lang: ko }
    answer:
