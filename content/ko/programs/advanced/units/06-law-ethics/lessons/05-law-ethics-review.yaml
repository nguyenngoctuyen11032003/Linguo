title:
  vi: Ôn tập - xã luận về xe trượt điện và buổi điều trần công khai
objectives:
  - vi: Đọc hiểu một bài xã luận - tìm chủ trương, nguyên nhân gốc và lời kêu gọi của người viết.
  - vi: Theo dõi một buổi điều trần (공청회) - phân biệt lập trường của doanh nghiệp và tổ chức dân sự.
  - vi: Tự kiểm tra các lỗi hay gặp - trật tự -(으)ㄹ 바에야, cách chia -다손 / -(으)ㄴ들, 그지없다 / 짝이 없다, 위반 / 침해.
