      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 환경 오염은 심각한 문제이다.
        - 환경 오염은 심각한 문제다.
        - 환경 오염이 심각한 문제이다.
        - 환경 오염이 심각한 문제다.
        - 환경 오염 문제는 심각하다.
        - 환경 오염 문제가 심각하다.
        - 환경 오염은 심각한 사회 문제이다.
        - 환경 오염은 심각한 사회 문제다.
    known_wrong:
