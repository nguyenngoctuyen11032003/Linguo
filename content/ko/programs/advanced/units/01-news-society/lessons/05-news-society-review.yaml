        feedback_vi: Đây là 해요체. Văn viết là 문제이다 / 문제다.
        error_tag: haeyo_in_writing
      - answer: 오염 환경은 심각한 문제이다.
        feedback_vi: Tiếng Hàn đặt phạm vi trước - 환경 오염 (môi trường + ô nhiễm).
        error_tag: sino_word_order
      - answer: 환경 오염 문제가 심각한다.
        feedback_vi: 심각하다 là tính từ nên giữ -다 - 심각하다.
        error_tag: adjective_nda
      - answer: 환경 오염은 심각한 문제입니다.
        feedback_vi: Đây là 합쇼체. Văn viết là 문제이다 / 문제다.
        error_tag: hapsyo_in_writing
    explanation:
      vi: 환경 오염 = ô nhiễm môi trường; "là vấn đề nghiêm trọng" = 심각한 문제이다 (sau nguyên âm có thể rút gọn 문제다). Cũng có thể nói 환경 오염 문제가 심각하다.
    display_answer: 환경 오염은 심각한 문제이다.

