  - key: ko:exercise:society-vocab-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ko:item:jaehwalyong
    prompt:
      source_text: 재활용은 환경 오염을 줄인다.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Tái chế làm giảm ô nhiễm môi trường.
        - Tái chế giúp giảm ô nhiễm môi trường.
        - Việc tái chế làm giảm ô nhiễm môi trường.
        - Việc tái chế giúp giảm ô nhiễm môi trường.
        - Tái chế giảm ô nhiễm môi trường.
        - Tái chế làm giảm thiểu ô nhiễm môi trường.
        - Tái chế giúp giảm thiểu ô nhiễm môi trường.
        - Tái chế giảm thiểu ô nhiễm môi trường.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tái chế làm tăng ô nhiễm môi trường.
        feedback_vi: 줄이다 là "làm giảm", không phải "tăng" (늘리다).
        error_tag: meaning_reversed
      - answer: Tái sử dụng làm giảm môi trường.
        feedback_vi: Thiếu "ô nhiễm" (오염). 환경 오염 là "ô nhiễm môi trường".
        error_tag: missing_word
    explanation:
      vi: 재활용 = tái chế, 환경 오염 = ô nhiễm môi trường, 줄인다 = làm giảm (động từ hiện tại văn viết). Câu nêu một sự thật chung nên dịch ở hiện tại.
    display_answer: Tái chế làm giảm ô nhiễm môi trường.
