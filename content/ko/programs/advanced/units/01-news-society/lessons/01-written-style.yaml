  - item: ko:item:bodohada
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu đuôi câu của tin tức và viết được một đoạn văn trang trọng bằng -ㄴ다/-는다/-다 - văn phong bắt buộc cho câu 53 (mô tả biểu đồ) và câu 54 (bài luận) của TOPIK II.
  - type: explain
    text:
      vi: Báo chí, sách, luận văn và bài thi viết TOPIK không có người nghe cụ thể nên không dùng 요 hay -ㅂ니다. Thay vào đó là đuôi "trung tính" -다, giống giọng văn tường thuật "Chính phủ công bố…" trong báo tiếng Việt.
  - type: explain
    text:
      vi: Hiện tại chia theo loại từ. Động từ có gốc kết thúc bằng nguyên âm hoặc ㄹ thêm -ㄴ다 (발표한다, 산다), gốc có patchim thêm -는다 (먹는다, 읽는다). Tính từ, 있다/없다 và 이다 giữ nguyên dạng từ điển (심각하다, 많다, 문제이다).
  - type: explain
    text:
      vi: Quá khứ chỉ cần đổi 요 thành 다 - 증가했어요 → 증가했다, 많았어요 → 많았다. Dự đoán dùng -(으)ㄹ 것이다 (될 것이다); phủ định dùng -지 않는다 sau động từ và -지 않다 sau tính từ.
  - type: deep_explain
    text:
      vi: Mẹo phân biệt động từ và tính từ - thử ghép -는 (định ngữ hiện tại). Nếu "-는 사람/것" tự nhiên thì đó là động từ (먹는 사람 → 먹는다); nếu phải dùng -(으)ㄴ thì là tính từ (큰 집 → 크다). Một số từ có cả hai nghĩa - 크다 "lớn" là tính từ (격차가 크다), nhưng 크다 "lớn lên" là động từ (아이들은 빨리 큰다). Trong bài luận, chủ ngữ ngôi thứ nhất là 나/우리 (không phải 저/저희), và cả bài phải dùng một đuôi duy nhất.
  - type: example
    target: 정부는 오늘 새로운 주택 정책을 발표했다.
    target_lang: ko
    translation:
      vi: Hôm nay chính phủ đã công bố chính sách nhà ở mới.
    note:
      vi: Câu mở đầu điển hình của tin tức - chủ thể + 은/는, động từ quá khứ -했다.
  - type: example
    target: 요즘 많은 사람들이 종이 신문 대신 인터넷으로 기사를 읽는다.
    target_lang: ko
    translation:
      vi: Ngày nay nhiều người đọc tin trên mạng thay cho báo giấy.
    note:
      vi: 읽다 có patchim nên thêm -는다; đọc là [잉는다].
  - type: example
    target: 청년 실업 문제는 생각보다 심각하다.
    target_lang: ko
    translation:
      vi: Vấn đề thất nghiệp ở thanh niên nghiêm trọng hơn ta nghĩ.
    note:
      vi: 심각하다 là tính từ nên giữ nguyên -하다, không thêm -ㄴ다.
  - type: example
    target: 이 문제는 쉽게 해결되지 않을 것이다.
    target_lang: ko
    translation:
      vi: Vấn đề này sẽ không dễ được giải quyết.
    note:
      vi: Phủ định (-지 않다) kết hợp với dự đoán (-(으)ㄹ 것이다).
  - type: common_mistake
    wrong: 저출산 문제가 심각해요. 따라서 정부는 대책을 마련해야 한다.
    right: 저출산 문제가 심각하다. 따라서 정부는 대책을 마련해야 한다.
    target_lang: ko
    note:
      vi: Người Việt quen 해요체 nên hay "lọt" vài câu -요 vào bài luận. Giám khảo TOPIK trừ điểm khi văn phong không thống nhất - mọi câu phải kết thúc bằng -다.
  - type: common_mistake
    wrong: 도시와 농촌의 소득 차이가 큰다.
    right: 도시와 농촌의 소득 차이가 크다.
    target_lang: ko
    note:
      vi: 크다 ở đây nghĩa là "lớn" (tính từ) nên giữ -다. Tiếng Việt không chia động từ - tính từ, nên bạn cần kiểm tra loại từ trước khi thêm -ㄴ다.
  - type: common_mistake
    wrong: 많은 사람들이 혼자 살는다.
    right: 많은 사람들이 혼자 산다.
    target_lang: ko
    note:
      vi: Gốc kết thúc bằng ㄹ (살-) được xử lý như gốc nguyên âm - bỏ ㄹ rồi thêm -ㄴ다. Tương tự 만들다 → 만든다.
  - type: summary
    points:
      - vi: Động từ - nguyên âm/ㄹ + -ㄴ다 (간다, 산다), patchim + -는다 (먹는다).
      - vi: Tính từ, 있다/없다, 이다 - giữ -다 (크다, 많다, 문제이다).
      - vi: Quá khứ -았/었다 · dự đoán -(으)ㄹ 것이다 · phủ định -지 않는다 (động từ) / -지 않다 (tính từ).
      - vi: Bài luận - chỉ một đuôi -다, ngôi thứ nhất là 나/우리.
exercises:
  # ---------------- recognition ----------------
  - key: ko:exercise:written-style-mcq-verb
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 2
    item: ko:item:written-nda-verb
    prompt:
      stem: "Chọn dạng văn viết hiện tại đúng của 읽다: 요즘 젊은이들은 인터넷 기사를 많이 ___."
      stem_lang: vi
      options:
        - { id: k7d, text: 읽는다, lang: ko }
        - { id: q2m, text: 읽은다, lang: ko }
        - { id: z9t, text: 읽다는, lang: ko }
        - { id: f4w, text: 읽어다, lang: ko }
    answer:
      correct_option_id: k7d
    explanation:
      vi: 읽다 là động từ có patchim ㄺ nên thêm -는다 thành 읽는다. -은다 không tồn tại; -다는 là định ngữ dẫn lời, không kết thúc câu.
    display_answer: 읽는다

  - key: ko:exercise:written-style-mcq-adjective
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-da-adjective
    prompt:
      stem: "Chọn đuôi đúng cho câu văn viết: 도시와 농촌의 소득 차이가 ___. (Chênh lệch thu nhập giữa thành thị và nông thôn lớn.)"
      stem_lang: vi
      options:
        - { id: p3x, text: 크다, lang: ko }
        - { id: h8n, text: 큰다, lang: ko }
        - { id: c5r, text: 크는다, lang: ko }
        - { id: u1j, text: 커다, lang: ko }
    answer:
      correct_option_id: p3x
    explanation:
      vi: 크다 ở đây là tính từ "lớn" nên ở văn viết hiện tại giữ nguyên 크다. 큰다 chỉ đúng khi 크다 mang nghĩa động từ "lớn lên" (아이가 큰다).
    display_answer: 크다

  - key: ko:exercise:written-style-listen-future
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ko:item:written-future-geosida
    prompt:
      audio_asset_id: null
      fallback_text: 정부는 다음 주에 조사 결과를 발표할 것이다.
      options:
        - { id: s6b, text: Tuần sau chính phủ sẽ công bố kết quả khảo sát., lang: vi }
        - { id: m9e, text: Tuần trước chính phủ đã công bố kết quả khảo sát., lang: vi }
        - { id: g2y, text: Chính phủ đang tiến hành khảo sát vào tuần này., lang: vi }
        - { id: w7a, text: Tuần sau chính phủ sẽ phát biểu về cuộc điều tra., lang: vi }
    answer:
      correct_option_id: s6b
    explanation:
      vi: 다음 주 là "tuần sau", -(으)ㄹ 것이다 là dự đoán/kế hoạch tương lai, 발표하다 là "công bố". Phương án "phát biểu" là bẫy Hán Việt - 발표 không phải "phát biểu ý kiến".
    display_answer: Tuần sau chính phủ sẽ công bố kết quả khảo sát.

  - key: ko:exercise:written-style-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ko
    difficulty: 2
    item: ko:item:written-nda-verb
    prompt:
      template: "농촌 인구가 매년 {{b1}}. (감소하다) 그래서 문제가 더 {{b2}}. (심각하다)"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Dân số nông thôn giảm hằng năm. Vì vậy vấn đề càng nghiêm trọng."
        - "Gợi ý: 감소하다 là động từ (-ㄴ다), 심각하다 là tính từ (giữ -다)."
    answer:
      blanks:
        b1: [감소한다]
        b2: [심각하다]
    known_wrong:
      - answer: 감소하는다
        feedback_vi: Gốc 감소하- kết thúc bằng nguyên âm nên chỉ thêm -ㄴ다 - 감소한다.
        error_tag: nda_neunda_choice
      - answer: 심각한다
        feedback_vi: 심각하다 là tính từ nên giữ nguyên -다, không thêm -ㄴ다.
        error_tag: adjective_nda
      - answer: 감소해요
        feedback_vi: Đây là 해요체. Văn viết dùng đuôi -다 - 감소한다.
        error_tag: haeyo_in_writing
      - answer: 심각해요
        feedback_vi: Đây là 해요체. Văn viết giữ 심각하다.
        error_tag: haeyo_in_writing
    explanation:
      vi: 감소하다 là động từ, gốc 감소하- kết thúc bằng nguyên âm nên thành 감소한다. 심각하다 là tính từ nên ở hiện tại giữ nguyên 심각하다.
    display_answer: 농촌 인구가 매년 감소한다. 그래서 문제가 더 심각하다.

  - key: ko:exercise:written-style-wb-announce
    type: word_bank
    stage: recognition
    answer_lang: ko
    difficulty: 2
    item: ko:item:balpyohada
    prompt:
      instruction: "Sắp xếp thành câu văn viết: \"Chính phủ đã công bố kết quả khảo sát.\""
      tokens:
        - { id: t4, text: 발표했다 }
        - { id: t2, text: 조사 }
        - { id: t5, text: 발표했어요 }
        - { id: t1, text: 정부는 }
        - { id: t3, text: 결과를 }
    answer:
      orders:
        - [t1, t2, t3, t4]
        - [t2, t3, t1, t4]
    explanation:
      vi: 조사 결과 là cụm "kết quả khảo sát" nên hai token đi liền nhau, động từ quá khứ văn viết 발표했다 đứng cuối. 발표했어요 là 해요체, không hợp với văn báo chí.
    display_answer: 정부는 조사 결과를 발표했다.

  # ---------------- recall ----------------
  - key: ko:exercise:written-style-fill-convert
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-negative-da
    prompt:
      template: "(물가가 많이 올랐어요.) → 물가가 많이 {{b1}}. (취업이 쉽지 않아요.) → 취업이 쉽지 {{b2}}."
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [올랐다]
        b2: [않다]
    known_wrong:
      - answer: 않는다
        feedback_vi: 쉽다 là tính từ nên phủ định cũng ở dạng tính từ - 쉽지 않다.
        error_tag: negative_adjective
      - answer: 오른다
        feedback_vi: Câu gốc ở quá khứ (올랐어요) nên văn viết là 올랐다.
        error_tag: tense_shift
      - answer: 올랐어요
        feedback_vi: Đây vẫn là 해요체. Đổi 요 thành 다 - 올랐다.
        error_tag: haeyo_in_writing
      - answer: 않아요
        feedback_vi: Đây vẫn là 해요체. Văn viết là 쉽지 않다.
        error_tag: haeyo_in_writing
    explanation:
      vi: Quá khứ chỉ cần đổi -어요 thành -다 - 올랐어요 → 올랐다. 않다 đi theo loại từ đứng trước - 쉽다 là tính từ nên giữ 않다, không phải 않는다.
    display_answer: 물가가 많이 올랐다. / 취업이 쉽지 않다.

  - key: ko:exercise:written-style-translate-live-alone
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-nda-verb
    prompt:
      source_text: Nhiều người trẻ sống một mình. (văn viết, đuôi -다)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 많은 젊은이들이 혼자 산다.
        - 많은 젊은이가 혼자 산다.
        - 많은 젊은이들은 혼자 산다.
        - 많은 청년들이 혼자 산다.
        - 많은 청년이 혼자 산다.
        - 많은 젊은 사람들이 혼자 산다.
        - 많은 젊은이들이 혼자서 산다.
        - 많은 청년들이 혼자서 산다.
        - 혼자 사는 젊은이들이 많다.
        - 혼자 사는 젊은이가 많다.
        - 혼자 사는 청년들이 많다.
        - 혼자 사는 청년이 많다.
    known_wrong:
      - answer: 많은 젊은이들이 혼자 살는다.
        feedback_vi: Gốc ㄹ bỏ ㄹ rồi thêm -ㄴ다 - 살다 → 산다.
        error_tag: l_stem_nda
      - answer: 많은 젊은이들이 혼자 살아요.
        feedback_vi: Đây là 해요체. Đề yêu cầu văn viết - 산다.
        error_tag: haeyo_in_writing
      - answer: 많은 젊은이들이 혼자 산다요.
        feedback_vi: Đuôi -다 đã là đuôi hoàn chỉnh, không thêm 요.
        error_tag: mixed_ending
      - answer: 많은 젊은이들이 혼자 살다.
        feedback_vi: 살다 là dạng từ điển. Động từ ở hiện tại văn viết phải chia - 산다.
        error_tag: dictionary_form
    explanation:
      vi: 살다 là động từ gốc ㄹ - bỏ ㄹ, thêm -ㄴ다 thành 산다. Cũng có thể đảo thành "người trẻ sống một mình thì nhiều" - 혼자 사는 젊은이들이 많다.
    display_answer: 많은 젊은이들이 혼자 산다.

  - key: ko:exercise:written-style-translate-not-easy
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-negative-da
    prompt:
      source_text: Vấn đề này không dễ. (văn viết, đuôi -다)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 이 문제는 쉽지 않다.
        - 이 문제가 쉽지 않다.
        - 이 문제는 쉽지가 않다.
        - 이 문제가 쉽지가 않다.
        - 이 문제는 쉬운 문제가 아니다.
        - 이 문제는 쉬운 것이 아니다.
    known_wrong:
      - answer: 이 문제는 쉽지 않는다.
        feedback_vi: 쉽다 là tính từ nên phủ định là 쉽지 않다, không phải 않는다.
        error_tag: negative_adjective
      - answer: 이 문제는 쉽지 않아요.
        feedback_vi: Đây là 해요체. Văn viết dùng 쉽지 않다.
        error_tag: haeyo_in_writing
      - answer: 이 문제는 안 쉽는다.
        feedback_vi: Tính từ không nhận -는다, và văn viết ưu tiên -지 않다 thay vì 안.
        error_tag: adjective_nda
      - answer: 이 문제는 쉽지 않습니다.
        feedback_vi: Đây là 합쇼체, dùng khi nói trước người nghe. Bài luận dùng -다.
        error_tag: hapsyo_in_writing
    explanation:
      vi: 쉽다 là tính từ nên 않다 giữ dạng tính từ - 쉽지 않다. Trong văn viết, -지 않다 tự nhiên hơn 안 + tính từ.
    display_answer: 이 문제는 쉽지 않다.

  # ---------------- application ----------------
  - key: ko:exercise:written-style-mcq-essay
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-first-person
    prompt:
      stem: Bạn đang viết bài luận TOPIK câu 54. Câu nào phù hợp nhất về văn phong?
      stem_lang: vi
      options:
        - { id: r5v, text: 우리 사회는 저출산 문제를 해결해야 한다., lang: ko }
        - { id: e8k, text: 우리 사회는 저출산 문제를 해결해야 해요., lang: ko }
        - { id: y1c, text: 저희 사회는 저출산 문제를 해결해야 한다., lang: ko }
        - { id: o6s, text: 우리 사회는 저출산 문제를 해결해야 합니다., lang: ko }
    answer:
      correct_option_id: r5v
    explanation:
      vi: Bài luận dùng đuôi -다 và ngôi thứ nhất 우리. 해요/합니다 là đuôi nói với người nghe; 저희 là khiêm nhường, không hợp với đuôi -다.
    display_answer: 우리 사회는 저출산 문제를 해결해야 한다.

  - key: ko:exercise:written-style-mcq-news-future
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:written-future-geosida
    prompt:
      stem: "Bạn viết tin: \"Dự kiến chính phủ sẽ công bố biện pháp mới vào tháng sau.\" Câu nào đúng văn phong báo chí?"
