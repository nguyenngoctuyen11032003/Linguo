key: ko:lesson:written-style-nda
order_index: 1
level: topik5
title:
  vi: Văn viết -ㄴ다/-는다/-다 trong báo chí và bài luận
objectives:
  - vi: Chia đúng đuôi văn viết hiện tại - động từ -ㄴ다/-는다, tính từ và 이다 giữ -다.
  - vi: Viết quá khứ, tương lai và phủ định ở văn viết (-었다, -(으)ㄹ 것이다, -지 않는다/-지 않다).
  - vi: Giữ một văn phong nhất quán trong bài luận TOPIK câu 53–54, không trộn 해요체 hay 합쇼체.
estimated_minutes: 18
skills: [grammar, writing, reading]
prerequisites: []
items:
  - item: ko:item:written-nda-verb
  - item: ko:item:written-da-adjective
  - item: ko:item:written-past-da
  - item: ko:item:written-future-geosida
  - item: ko:item:written-negative-da
  - item: ko:item:written-ida
  - item: ko:item:written-first-person
  - item: ko:item:jeongbu
