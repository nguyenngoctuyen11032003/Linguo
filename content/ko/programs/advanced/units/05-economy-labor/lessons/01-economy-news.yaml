        feedback_vi: Dịch máy móc 에 따라 thành "theo". V-(으)ㅁ에 따라 nghĩa là "cùng với việc, do" - giá tăng kéo theo thay đổi.
        error_tag: literal_translation
      - answer: Giá cả tăng nhưng số hộ gia đình ăn ngoài đã tăng.
        feedback_vi: Ngược nghĩa - 외식 대신 집에서 밥을 해 먹다 là nấu ở nhà thay vì ăn ngoài, và 에 따라 không phải "nhưng".
        error_tag: meaning_reversed
    explanation:
      vi: 오름에 따라 = cùng với việc (giá cả) tăng; 외식 대신 = thay vì ăn ngoài; 해 먹다 = tự nấu ăn. Hai thay đổi đi song song nên tiếng Việt tự nhiên dùng "do / cùng với việc... nên".
    display_answer: Cùng với việc giá cả tăng, số hộ gia đình nấu ăn ở nhà thay vì ăn ngoài đã tăng.

