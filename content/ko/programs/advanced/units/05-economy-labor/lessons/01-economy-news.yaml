title:
  vi: Đọc tin kinh tế - lãi suất, suy thoái và việc làm
objectives:
  - vi: Hiểu các từ khoá của bản tin kinh tế - 금리 인상 · 인하, 경기 침체, 소비 심리, 고용률 · 실업률, 비정규직, 최저임금, 가계 부채.
  - vi: Dùng N에 따라 / V-(으)ㅁ에 따라 để nói một thay đổi kéo theo thay đổi khác.
  - vi: Dùng -(으)ㄴ/는 가운데 để nêu bối cảnh như câu mở đầu bản tin, không nhầm với -는 동안.
estimated_minutes: 25
skills: [vocabulary, reading, grammar]
