title:
  vi: Nêu lý do trong văn bản doanh nghiệp - -(으)므로, -기에, -(으)ㄴ/는 이상
objectives:
  - vi: Viết lý do theo văn phong trang trọng bằng -(으)므로 và -기에, phân biệt với -아서/어서, -(으)니까, -기 때문에.
  - vi: Dùng -(으)ㄴ/는 이상 để rút ra nghĩa vụ hoặc kết luận tất yếu ("một khi đã... thì").
  - vi: Hiểu từ vựng báo cáo doanh nghiệp - 매출, 적자 · 흑자, 구조 조정, 인건비, 채용, 해고, 근로자.
estimated_minutes: 25
skills: [grammar, writing, reading]
prerequisites: [ko:lesson:economy-news-vocab]
