  - key: ko:exercise:el-reason-order-gimil
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:el-gram-eumeuro
    prompt:
      instruction: "Sắp xếp thành câu quy định: \"Vì là thông tin mật nên không được làm lộ ra bên ngoài.\""
      tokens:
        - { id: w3p, text: 외부에 }
        - { id: t8a, text: 안 }
        - { id: e1z, text: 정보이므로 }
        - { id: r6k, text: 된다 }
        - { id: y2m, text: 기밀 }
        - { id: o9s, text: 정보임으로써 }
        - { id: u5c, text: 유출해서는 }
    answer:
      orders:
        - [y2m, e1z, w3p, u5c, t8a, r6k]
    explanation:
      vi: N이므로 = "vì là N" (기밀 정보이므로). 정보임으로써 nghĩa là "bằng việc là thông tin" - sai nghĩa. -아/어서는 안 된다 là "không được" trong quy định.
    display_answer: 기밀 정보이므로 외부에 유출해서는 안 된다.

