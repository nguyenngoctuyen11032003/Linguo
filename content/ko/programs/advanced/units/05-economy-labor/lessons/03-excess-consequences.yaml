  - key: ko:exercise:el-excess-mcq-reply
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:el-halbu
    prompt:
      stem: "Bạn bạn nói - \"이번 달에 카드 할부로 노트북에 휴대폰까지 샀어.\" Câu đáp nào tự nhiên và đúng ngữ pháp?"
      stem_lang: vi
      options:
        - { id: b7j, text: "그렇게 할부를 겹치다 보면 나중에 카드값을 감당 못 하기 십상이야.", lang: ko }
        - { id: n3d, text: "그렇게 할부를 겹치면 돈이 금방 모이기 십상이야.", lang: ko }
        - { id: l0x, text: "할부를 겹친 나머지 돈을 많이 모았구나.", lang: ko }
        - { id: i6u, text: "할부를 겹치는 통에 곧 부자가 되겠다.", lang: ko }
    answer:
      correct_option_id: b7j
    explanation:
      vi: -기 십상이다, -(으)ㄴ 나머지, -는 통에 đều chỉ đi với kết quả xấu. Chỉ phương án đầu có kết quả xấu (không kham nổi tiền thẻ); ba phương án kia ghép các cấu trúc này với kết quả tốt (để dành được tiền, thành giàu).
    display_answer: "그렇게 할부를 겹치다 보면 나중에 카드값을 감당 못 하기 십상이야."

