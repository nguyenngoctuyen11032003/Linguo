title:
  vi: Tiêu xài quá đà và hậu quả - -(으)ㄴ 나머지, -기 십상이다, -는 통에
objectives:
  - vi: Kể hậu quả của việc làm quá mức bằng V/A-(으)ㄴ 나머지.
  - vi: Cảnh báo kết quả xấu gần như chắc chắn bằng V-기 십상이다.
  - vi: Phân biệt -는 통에 (tình cảnh rối ren kéo dài) với -는 바람에 (sự việc bất ngờ) và -는 탓에 (đổ lỗi).
  - vi: Dùng đúng cụm từ tài chính cá nhân - 충동구매, 과소비, 할부, 대출을 받다, 빚을 지다, 손해를 보다, 투자하다.
