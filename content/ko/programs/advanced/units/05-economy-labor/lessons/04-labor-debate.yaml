  - key: ko:exercise:el-debate-order-maknon
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:el-gram-eul-maknonhago
    prompt:
      instruction: "Sắp xếp thành câu: \"Bất kể quy mô doanh nghiệp, tranh cãi xoay quanh giờ làm việc vẫn đang tiếp diễn.\""
      tokens:
        - { id: z4h, text: 논쟁이 }
        - { id: b8w, text: 근로 }
        - { id: i3q, text: 막론하고 }
        - { id: r1e, text: 있다 }
        - { id: u7p, text: 규모를 }
        - { id: x2c, text: 둘러싼 }
        - { id: e6k, text: 기업 }
        - { id: l9t, text: 시간을 }
        - { id: o5m, text: 이어지고 }
        - { id: j0a, text: 규모에 }
    answer:
      orders:
        - [e6k, u7p, i3q, b8w, l9t, x2c, z4h, o5m, r1e]
        - [b8w, l9t, x2c, z4h, e6k, u7p, i3q, o5m, r1e]
    explanation:
      vi: N을/를 막론하고 - 기업 규모를 막론하고; cụm này có thể đứng đầu câu hoặc ngay trước vị ngữ. N을/를 둘러싼 N = "xoay quanh". 규모에 là token nhiễu vì 막론하다 cần 을/를.
    display_answer: 기업 규모를 막론하고 근로 시간을 둘러싼 논쟁이 이어지고 있다.

  - key: ko:exercise:el-debate-mcq-rebuttal
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:el-gram-l-beophada
    prompt:
      stem: "Trong buổi tranh luận, phe phản đối lo rằng tuần làm bốn ngày sẽ làm năng suất giảm. Câu nào vừa thừa nhận lo ngại đó là có lý, vừa phản bác bằng số liệu?"
      stem_lang: vi
      options:
        - { id: v3n, text: "그런 우려가 나올 법도 합니다만, 시범 운영 결과를 보면 생산성은 오히려 높아졌습니다.", lang: ko }
        - { id: c8f, text: "그런 우려는 나올 리가 없으니 생산성은 당연히 높아졌습니다.", lang: ko }
        - { id: y5s, text: "그런 우려가 나왔기 때문에 생산성이 높아졌습니다.", lang: ko }
        - { id: g1o, text: "그런 우려를 막론하고 생산성은 낮아졌습니다.", lang: ko }
    answer:
      correct_option_id: v3n
    explanation:
      vi: -(으)ㄹ 법도 합니다만 = "lo ngại đó cũng dễ hiểu, nhưng..." - thừa nhận rồi phản bác bằng kết quả thí điểm. Phương án 2 gạt bỏ lo ngại (-(으)ㄹ 리가 없다), phương án 3 vô lý về nhân quả, phương án 4 đồng ý rằng năng suất giảm.
    display_answer: "그런 우려가 나올 법도 합니다만, 시범 운영 결과를 보면 생산성은 오히려 높아졌습니다."

