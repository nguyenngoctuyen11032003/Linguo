        - "나이를 막론하고 누구나 지원할 수 있어요."
        - "나이를 불문하고 누구나 지원할 수 있다."
        - "나이를 불문하고 누구나 지원할 수 있습니다."
        - "나이를 불문하고 누구나 지원할 수 있어요."
        - "나이 불문하고 누구나 지원할 수 있다."
        - "나이 불문하고 누구나 지원할 수 있습니다."
        - "나이 불문하고 누구나 지원할 수 있어요."
