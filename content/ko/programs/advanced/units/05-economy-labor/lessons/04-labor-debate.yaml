title:
  vi: Tranh luận về lao động - giờ làm, đình công và tuần làm bốn ngày
objectives:
  - vi: Dẫn dắt số liệu người nghe đã biết, đã thấy bằng 아시다시피 / 보시다시피 (V-다시피).
  - vi: Thừa nhận lý lẽ của đối phương bằng -(으)ㄹ 법하다 trước khi phản bác.
  - vi: Khái quát "bất kể..." bằng N을/를 막론하고 · N을/를 불문하고.
  - vi: Hiểu từ vựng quan hệ lao động - 근로 시간, 주 4일제, 노조, 파업, 임금 협상, 과로, 재택근무.
