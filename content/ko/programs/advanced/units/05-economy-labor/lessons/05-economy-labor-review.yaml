    known_wrong:
      - answer: Theo gánh nặng chi phí nhân công và tiền thuê mặt bằng, số chủ cửa hàng cắt giảm nhân viên cũng tăng.
        feedback_vi: Dịch máy móc 에 따라 = "theo". -(으)ㅁ에 따라 = cùng với việc / do - một thay đổi kéo theo thay đổi khác.
        error_tag: literal_translation
      - answer: Gánh nặng chi phí nhân công và tiền thuê mặt bằng tăng nên số chủ cửa hàng tuyển thêm nhân viên cũng tăng.
        feedback_vi: 직원을 줄이다 là cắt giảm nhân viên, không phải tuyển thêm.
        error_tag: meaning_reversed
    explanation:
      vi: 커짐에 따라 = cùng với việc (gánh nặng) tăng; 직원을 줄이다 = cắt giảm nhân viên; 혼자 가게를 꾸려 가다 = tự mình xoay xở cửa hàng; 자영업자 = người tự kinh doanh, chủ cửa hàng nhỏ.
    display_answer: Cùng với việc gánh nặng chi phí nhân công và tiền thuê mặt bằng tăng lên, số chủ cửa hàng cắt giảm nhân viên và tự mình xoay xở cửa hàng cũng tăng lên.

  - key: ko:exercise:el-review-order-beop
    type: word_bank
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:el-gram-l-beophada
    prompt:
      instruction: "Sắp xếp thành lời phát biểu: \"Lo ngại như vậy cũng là điều dễ hiểu, nhưng kết quả thí điểm đã khác.\""
      tokens:
        - { id: m3s, text: 결과는 }
        - { id: t7e, text: 나올 }
        - { id: a1x, text: 달랐습니다 }
        - { id: q5n, text: 그런 }
        - { id: d9w, text: 운영 }
        - { id: y4c, text: 합니다만 }
        - { id: g2k, text: 걱정이 }
        - { id: e8h, text: 시범 }
        - { id: p6v, text: 법도 }
        - { id: j0r, text: 법이 }
    answer:
      orders:
        - [q5n, g2k, t7e, p6v, y4c, e8h, d9w, m3s, a1x]
    explanation:
      vi: V-(으)ㄹ 법도 합니다만 - thừa nhận ý đối phương rồi chuyển sang phản bác. 법이 là token nhiễu - trong cấu trúc này 법 chỉ đi với 하다 hoặc 도 하다, không có dạng 법이 하다.
    display_answer: 그런 걱정이 나올 법도 합니다만 시범 운영 결과는 달랐습니다.

  - key: ko:exercise:el-review-mcq-opening
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:el-gram-dasipi
    prompt:
      stem: "Bạn là giáo sư Kim trong toạ đàm. Bạn muốn mở đầu bằng cách chỉ vào biểu đồ đang chiếu trên màn hình. Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: k2u, text: "보시다시피 화면의 그래프는 지난 5년간 과로 관련 상담이 두 배로 늘었음을 보여 줍니다.", lang: ko }
        - { id: z6o, text: "보실 법하게 화면의 그래프는 지난 5년간 과로 관련 상담이 두 배로 늘었음을 보여 줍니다.", lang: ko }
        - { id: h0b, text: "보시다시피 하면 화면의 그래프는 지난 5년간 과로 관련 상담이 두 배로 늘었음을 보여 줍니다.", lang: ko }
        - { id: v9i, text: "보신 나머지 화면의 그래프는 지난 5년간 과로 관련 상담이 두 배로 늘었음을 보여 줍니다.", lang: ko }
    answer:
      correct_option_id: k2u
    explanation:
      vi: 보시다시피 = "như quý vị đang thấy" - mở đầu chuẩn khi chỉ vào số liệu. -(으)ㄹ 법하다 không có dạng trạng từ 법하게 ở đây, -다시피 하다 là "gần như", còn -(으)ㄴ 나머지 là "vì quá...".
    display_answer: "보시다시피 화면의 그래프는 지난 5년간 과로 관련 상담이 두 배로 늘었음을 보여 줍니다."

