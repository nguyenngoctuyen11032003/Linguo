    display_answer: 제가 사장님께 자료를 드렸습니다.

  - key: ko:exercise:honorifics-fill-yeojjwo
    type: fill_blank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:yeojjwoboda
    prompt:
      template: "잘 모르겠으면 팀장님께 {{b1}}."
      blanks:
        - { id: b1, width_hint: 6 }
      hint_levels:
        - "Nghĩa của câu: Nếu không rõ thì hãy hỏi trưởng nhóm."
        - "Gợi ý: dạng khiêm nhường của 물어보다, chia đuôi -세요."
    answer:
      blanks:
        b1: [여쭤보세요, 여쭤 보세요, 여쭈어 보세요, 여쭈어보세요, 여쭤보십시오, 여쭤 보십시오]
    known_wrong:
      - answer: 물어보세요
        feedback_vi: Hỏi người trên dùng từ khiêm nhường 여쭤보다, không dùng 물어보다.
        error_tag: humble_verb
      - answer: 여쭤보셨어요
        feedback_vi: Đây là lời khuyên cho người nghe nên dùng -세요, không phải quá khứ.
        error_tag: verb_ending
    explanation:
      vi: Người được hỏi là trưởng nhóm (đi với 께) nên động từ "hỏi" đổi thành 여쭤보다; -세요 là lời khuyên lịch sự với người nghe.
    display_answer: 잘 모르겠으면 팀장님께 여쭤보세요.

  - key: ko:exercise:honorifics-wb-neurago
    type: word_bank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:gram-neurago
    prompt:
      instruction: "Sắp xếp thành câu tiếng Hàn: \"Vì mải chuẩn bị họp nên tôi không ăn trưa được.\""
      tokens:
        - { id: p3, text: 못 먹었어요 }
        - { id: p4, text: 회의 준비했느라고 }
        - { id: p2, text: 점심도 }
        - { id: p1, text: 회의 준비하느라고 }
    answer:
      orders:
        - [p1, p2, p3]
        - [p2, p1, p3]
    explanation:
      vi: Vế -느라고 không chia quá khứ - 준비하느라고, không phải 준비했느라고. Kết quả không tốt (못 먹었어요) đứng cuối câu.
    display_answer: 회의 준비하느라고 점심도 못 먹었어요.

  # ---------------- recall ----------------
  - key: ko:exercise:honorifics-fill-neurago
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:gram-neurago
    prompt:
      template: "어제 보고서를 {{b1}} 잠을 못 잤어요. (쓰다 + -느라고)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [쓰느라고, 쓰느라]
    known_wrong:
      - answer: 썼느라고
        feedback_vi: Vế -느라고 không chia quá khứ dù việc đã xảy ra - 쓰느라고.
        error_tag: neurago_tense
      - answer: 쓰는라고
        feedback_vi: Viết là -느라고 (느), gắn thẳng vào gốc 쓰.
        error_tag: neurago_form
    explanation:
      vi: -느라고 gắn trực tiếp vào gốc động từ (쓰 + 느라고); thì quá khứ chỉ chia ở vế sau - 못 잤어요.
    display_answer: 어제 보고서를 쓰느라고 잠을 못 잤어요.

