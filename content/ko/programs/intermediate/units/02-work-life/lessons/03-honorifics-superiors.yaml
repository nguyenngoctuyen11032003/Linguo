      vi: 죄송합니다 nhận lỗi; -느라고 giải thích vì bận việc gì; 연락을 못 드렸습니다 - khiêm nhường vì người nhận liên lạc là sếp.
    display_answer: 죄송합니다. 회의 준비하느라고 연락을 못 드렸습니다.

