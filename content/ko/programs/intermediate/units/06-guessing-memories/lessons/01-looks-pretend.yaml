  - key: ko:exercise:gm-look-translate-injection-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ko:item:gm-gram-neun-cheokada
    prompt:
      source_text: 아이가 주사를 맞을 때 안 아픈 척했지만 눈물이 났어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Lúc tiêm, đứa bé giả vờ không đau nhưng nước mắt đã chảy ra.
        - Lúc bị tiêm, đứa bé giả vờ không đau nhưng nước mắt vẫn chảy ra.
        - Khi tiêm, đứa trẻ giả vờ không đau nhưng đã chảy nước mắt.
        - Khi bị tiêm, đứa bé giả vờ không đau nhưng nước mắt cứ chảy ra.
        - Lúc tiêm, bé giả vờ không đau nhưng nước mắt chảy ra.
        - Lúc tiêm, đứa bé làm như không đau nhưng nước mắt đã trào ra.
        - Khi tiêm, đứa bé giả vờ không đau nhưng vẫn rơi nước mắt.
        - Lúc bị tiêm, đứa trẻ giả vờ không đau nhưng đã khóc.
        - Khi tiêm, con giả vờ không đau nhưng nước mắt đã chảy ra.
        - Lúc tiêm, đứa bé tỏ ra không đau nhưng nước mắt đã chảy ra.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Lúc tiêm, đứa bé trông không đau nhưng nước mắt đã chảy ra.
        feedback_vi: -(으)ㄴ 척했지만 là "giả vờ… nhưng", không phải "trông có vẻ".
        error_tag: boida_vs_cheok
      - answer: Lúc tiêm, đứa bé giả vờ đau nhưng nước mắt đã chảy ra.
        feedback_vi: 안 아픈 척 là giả vờ KHÔNG đau.
        error_tag: negation_missed
    explanation:
      vi: 주사를 맞다 = bị tiêm; 안 아픈 척했지만 = giả vờ không đau nhưng; 눈물이 나다 = chảy nước mắt.
    display_answer: Lúc tiêm, đứa bé giả vờ không đau nhưng nước mắt đã chảy ra.

