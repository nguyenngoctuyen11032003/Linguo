key: ko:lesson:looks-pretend
order_index: 1
level: topik3
title:
  vi: Trông có vẻ… hay chỉ giả vờ? - A-아/어 보이다, -(으)ㄴ/는 척하다
objectives:
  - vi: Nhận xét vẻ bề ngoài bằng A-아/어 보이다 (피곤해 보여요, 맛있어 보여요) và biết vì sao không gắn được vào động từ.
  - vi: Nói "giả vờ…" bằng V-는 척하다 / A-(으)ㄴ 척하다 / V-(으)ㄴ 척하다 (자는 척, 바쁜 척, 못 들은 척).
  - vi: Miêu tả nét mặt và cảm xúc - 표정, 안색, 졸리다, 어색하다, 우울하다, 긴장하다, 행복하다, 들키다.
estimated_minutes: 22
skills: [grammar, vocabulary, speaking, reading]
prerequisites: [ko:lesson:housing-advice-review]
