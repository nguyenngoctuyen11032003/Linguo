title:
  vi: Biết đâu…, không lẽ nào…, hình như… - -(으)ㄹ지도 모르다, -(으)ㄹ 리가 없다, -(으)ㄴ/는 모양이다
objectives:
  - vi: Nói khả năng "biết đâu, có khi" bằng V/A-(으)ㄹ지도 모르다 (cả quá khứ -았/었을지도).
  - vi: Phủ nhận mạnh "không lẽ nào, làm gì có chuyện" bằng V/A-(으)ㄹ 리가 없다.
  - vi: Đoán dựa trên dấu hiệu bằng V/A-(으)ㄴ/는 모양이다, so sánh với -나 보다 và -것 같다; từ vựng chuyện công sở - 소문, 승진하다, 퇴사하다, 사귀다, 헤어지다, 설마, 눈치.
estimated_minutes: 22
skills: [grammar, vocabulary, reading, speaking]
prerequisites: [ko:lesson:looks-pretend]
