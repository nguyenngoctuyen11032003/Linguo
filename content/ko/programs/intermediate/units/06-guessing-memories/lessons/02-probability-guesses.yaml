  - key: ko:exercise:gm-prob-mcq-reading-messenger
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:gm-somun
    prompt:
      stem: "다음 대화를 읽고 내용과 같은 것을 고르십시오.\n지훈: 요즘 박 과장님이 매일 정시에 퇴근하세요. 무슨 일이 있으신 모양이에요.\n수아: 아, 지난달에 아기가 태어났대요.\n지훈: 그래요? 저는 전혀 몰랐어요. 설마 회사를 그만두시는 건 아니겠죠?\n수아: 그럴 리가요. 오히려 다음 달에 부장으로 승진하실지도 모른다는 소문이 있어요."
      stem_lang: ko
      options:
        - { id: s4z, text: 박 과장님이 다음 달에 승진할 수도 있어요., lang: ko }
        - { id: d8k, text: 박 과장님은 곧 회사를 그만둘 거예요., lang: ko }
        - { id: y1p, text: 지훈 씨는 박 과장님 아기에 대해 이미 알고 있었어요., lang: ko }
        - { id: k5o, text: 박 과장님은 요즘 밤늦게까지 일해요., lang: ko }
    answer:
      correct_option_id: s4z
    explanation:
      vi: 승진하실지도 모른다는 소문 = tin đồn rằng có thể ông ấy được thăng chức → có khả năng. 그럴 리가요 phủ nhận chuyện nghỉ việc; 지훈 nói 전혀 몰랐어요 (hoàn toàn không biết); ông ấy về đúng giờ (정시에 퇴근), không làm khuya.
    display_answer: 박 과장님이 다음 달에 승진할 수도 있어요.

  - key: ko:exercise:gm-prob-translate-neighbor-move-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ko:item:gm-gram-neun-moyangida
    prompt:
      source_text: 옆집 사람들이 상자에 짐을 싸고 있네요. 곧 이사 가는 모양이에요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Nhà bên cạnh đang đóng đồ vào thùng. Hình như họ sắp chuyển nhà.
        - Người nhà bên cạnh đang đóng gói đồ vào thùng. Hình như sắp chuyển nhà.
        - Hàng xóm đang xếp đồ vào thùng. Hình như họ sắp chuyển nhà.
        - Nhà bên đang đóng đồ vào thùng. Chắc là sắp chuyển nhà.
        - Nhà bên cạnh đang đóng đồ vào hộp. Hình như họ sắp chuyển đi.
        - Mọi người nhà bên cạnh đang đóng đồ vào thùng. Có vẻ họ sắp chuyển nhà.
        - Hàng xóm đang gói đồ vào thùng. Chắc họ sắp chuyển nhà.
        - Nhà bên cạnh đang đóng gói đồ đạc. Hình như sắp chuyển nhà.
        - Người nhà bên đang cho đồ vào thùng. Hình như họ sắp dọn nhà.
        - Nhà bên cạnh đang đóng đồ vào thùng. Có lẽ họ sắp chuyển nhà.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Nhà bên cạnh đang đóng đồ vào thùng. Họ không thể chuyển nhà được.
        feedback_vi: -는 모양이에요 là "hình như" (đoán có), không phải phủ định.
        error_tag: moyang_meaning
      - answer: Nhà bên cạnh đã chuyển nhà rồi.
        feedback_vi: 싸고 있네요 là đang đóng đồ; 곧 이사 가는 모양이에요 là sắp chuyển - chưa chuyển.
        error_tag: tense
    explanation:
      vi: 짐을 싸다 = đóng gói đồ; -네요 = vừa nhận thấy; -는 모양이에요 = hình như, đoán từ dấu hiệu (đồ đạc trong thùng).
    display_answer: Nhà bên cạnh đang đóng đồ vào thùng. Hình như họ sắp chuyển nhà.

  - key: ko:exercise:gm-prob-translate-cold-tomorrow
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-eulji-do-moreuda
    prompt:
      source_text: Có khi ngày mai trời lạnh đấy.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 내일은 추울지도 몰라요.
        - 내일 추울지도 몰라요.
        - 내일은 날씨가 추울지도 몰라요.
        - 내일 날씨가 추울지도 몰라요.
        - 어쩌면 내일은 추울지도 몰라요.
        - 어쩌면 내일 추울지도 몰라요.
        - 어쩌면 내일 날씨가 추울지도 몰라요.
        - 혹시 내일 추울지도 몰라요.
        - 내일은 추울지도 모릅니다.
        - 내일 날씨가 추울지도 모릅니다.
        - 내일은 쌀쌀할지도 몰라요.
    known_wrong:
      - answer: 내일은 춥을지도 몰라요.
        feedback_vi: 춥다 là bất quy tắc ㅂ - 추울지도.
        error_tag: b_irregular
      - answer: 내일은 추울 리가 없어요.
        feedback_vi: -(으)ㄹ 리가 없다 là "không thể nào lạnh" - ngược nghĩa.
        error_tag: riga_vs_jido
      - answer: 내일은 추운지 몰라요.
        feedback_vi: -(으)ㄴ지 몰라요 là "không biết có lạnh không"; "có khi lạnh" là 추울지도 몰라요.
        error_tag: neunji_vs_jido
    explanation:
      vi: '"Có khi, biết đâu" = -(으)ㄹ지도 몰라요; 춥다 (ㅂ) → 추울지도. 어쩌면 / 혹시 làm câu mềm hơn.'
    display_answer: 내일은 추울지도 몰라요.
