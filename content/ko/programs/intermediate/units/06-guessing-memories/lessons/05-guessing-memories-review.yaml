  - key: ko:exercise:gm-rev-mcq-correct-sentence
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:gm-gram-deoni
    prompt:
      stem: Câu nào đúng ngữ pháp và tự nhiên?
      stem_lang: vi
      options:
        - { id: s2g, text: 제가 자주 가던 빵집이 지난달에 문을 닫았어요., lang: ko }
        - { id: d5n, text: 제가 어제 늦게까지 공부하더니 오늘 피곤해요., lang: ko }
        - { id: m7j, text: 동생이 열심히 공부했더니 장학금을 받았어요., lang: ko }
        - { id: a4h, text: 그 친구는 지금 조용하던 사람이에요., lang: ko }
    answer:
      correct_option_id: s2g
    explanation:
      vi: 자주 가던 빵집 - thói quen lặp lại trong quá khứ → -던 đúng. -더니 không dùng cho chính mình (제가); -았/었더니 không dùng cho người khác (동생이); -던 nói về quá khứ nên mâu thuẫn với 지금.
    display_answer: 제가 자주 가던 빵집이 지난달에 문을 닫았어요.

  - key: ko:exercise:gm-rev-translate-comedian-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:gm-gram-deon
    prompt:
      source_text: 학교 다닐 때 그렇게 조용하던 친구가 지금은 유명한 개그맨이 됐대요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Nghe nói người bạn hồi đi học trầm tính như thế giờ đã trở thành diễn viên hài nổi tiếng.
        - Nghe nói cậu bạn hồi đi học ít nói như thế mà giờ đã thành diễn viên hài nổi tiếng.
        - Nghe nói người bạn từng rất trầm lặng hồi đi học nay đã trở thành diễn viên hài nổi tiếng.
        - Nghe nói người bạn hồi đi học rất ít nói giờ đã thành nghệ sĩ hài nổi tiếng.
        - Nghe nói người bạn trầm tính hồi đi học bây giờ đã trở thành diễn viên hài nổi tiếng.
        - Nghe bảo người bạn hồi đi học ít nói như vậy giờ đã thành diễn viên hài nổi tiếng.
        - Nghe nói đứa bạn hồi đi học trầm như thế giờ đã thành diễn viên hài nổi tiếng.
        - Nghe nói người bạn hồi còn đi học rất trầm tính giờ là diễn viên hài nổi tiếng.
        - Nghe nói người bạn hồi đi học im lặng như thế giờ đã trở thành danh hài nổi tiếng.
        - Nghe nói người bạn hồi đi học ít nói như thế giờ đã thành một diễn viên hài nổi tiếng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Người bạn hồi đi học rất ồn ào giờ đã trở thành diễn viên hài nổi tiếng.
        feedback_vi: 조용하던 là "từng trầm tính, ít nói", không phải "ồn ào"; và 됐대요 là "nghe nói".
        error_tag: meaning_mismatch
      - answer: Nghe nói người bạn hồi đi học trầm tính như thế sẽ trở thành diễn viên hài nổi tiếng.
        feedback_vi: 됐대요 là "đã trở thành" (nghe nói), không phải "sẽ".
        error_tag: tense
    explanation:
      vi: A-던 N - người bạn hồi đó (từng) trầm tính; 개그맨 = diễn viên hài; -이/가 됐대요 = nghe nói đã trở thành.
    display_answer: Nghe nói người bạn hồi đi học trầm tính như thế giờ đã trở thành diễn viên hài nổi tiếng.

