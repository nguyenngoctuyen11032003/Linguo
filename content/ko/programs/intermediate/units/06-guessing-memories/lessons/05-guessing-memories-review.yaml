        - { id: f1x, text: 그렇군요. 지난달에 승진하셨는데 그만두실지도 몰라요., lang: ko }
        - { id: q4b, text: 설마요. 지난달에 승진하셨는데 그만두는 척하세요., lang: ko }
        - { id: y9r, text: 설마요. 지난달에 승진하셨는데 그만두신 줄 알았어요., lang: ko }
    answer:
