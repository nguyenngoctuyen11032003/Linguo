title:
  vi: Cứ tưởng là… - -(으)ㄴ/는 줄 알았다/몰랐다, câu hỏi lồng -(으)ㄴ/는지
objectives:
  - vi: Kể chuyện nhầm tưởng bằng V/A-(으)ㄴ/는 줄 알았다 và "không biết là…" bằng -(으)ㄴ/는 줄 몰랐다.
  - vi: Lồng câu hỏi vào câu lớn bằng -는지 / -(으)ㄴ지 / N인지 + 알다, 모르다, 궁금하다, 물어보다, 기억나다.
  - vi: Phân biệt với -(으)ㄹ 줄 알다 (biết cách) đã học; từ vựng - 착각하다, 오해하다, 동갑, 기억나다, 확실하다, 헷갈리다, 궁금하다, 전혀.
