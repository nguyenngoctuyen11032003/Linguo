body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được những lần "cứ tưởng là…" (nhận nhầm người, nhầm ngày) và hỏi lịch sự "bạn có biết… ở đâu / khi nào / bao nhiêu không?" đúng ngữ pháp tiếng Hàn.
  - type: explain
    text:
      vi: "V/A-(으)ㄴ/는 줄 알았다 = \"cứ tưởng là…\" (nhưng sự thật khác): 집에 있는 줄 알았어요. -(으)ㄴ/는 줄 몰랐다 = \"không biết là…\" (giờ mới biết): 결혼한 줄 몰랐어요. Chọn định ngữ theo thì - động từ hiện tại -는 줄, việc đã xảy ra -(으)ㄴ 줄, tương lai -(으)ㄹ 줄, tính từ -(으)ㄴ 줄, danh từ N인 줄."
  - type: explain
    text:
      vi: "Đừng lẫn với -(으)ㄹ 줄 알다 \"biết cách làm\" đã học (운전할 줄 알아요). Mẹo: 줄 알다 về kỹ năng thường ở hiện tại (알아요/몰라요); còn mẫu \"cứ tưởng\" gần như luôn ở quá khứ (알았어요/몰랐어요) và kể về một sự việc."
  - type: explain
    text:
      vi: "Tiếng Việt lồng câu hỏi rất dễ - \"tôi không biết anh ấy ở đâu\". Tiếng Hàn phải đổi đuôi câu hỏi thành -는지 (động từ, 있다/없다), -(으)ㄴ지 (tính từ), N인지: 어디에 있는지 몰라요, 얼마나 비싼지 알아요?, 누구인지 궁금해요. Việc đã xảy ra -았/었는지, tương lai hoặc phỏng đoán -(으)ㄹ지."
  - type: deep_explain
    text:
      vi: "Câu hỏi có/không lồng vào câu lớn thường thêm 안 -는지 hoặc 아닌지: 그 사람이 오는지 안 오는지 몰라요, 사실인지 아닌지 확실하지 않아요. Mẫu 얼마나 A-(으)ㄴ지 몰라요 không có nghĩa \"không biết bao nhiêu\" mà là cách nhấn mạnh \"…không tả nổi\": 얼마나 맛있는지 몰라요 (ngon không thể tả). Với -(으)ㄴ/는 줄 알았다, người nói hay kèm 정말, 진짜; với -(으)ㄴ/는 줄 몰랐다 hay kèm 전혀 - 그런 줄 전혀 몰랐어요."
  - type: example
    target: 밖이 너무 조용해서 집에 아무도 없는 줄 알았어요.
    target_lang: ko
    translation:
      vi: Bên ngoài yên ắng quá nên tôi cứ tưởng không có ai ở nhà.
  - type: example
    target: 민호 씨가 한국 사람인 줄 알았는데 일본에서 왔대요.
    target_lang: ko
    translation:
      vi: Tôi cứ tưởng Minho là người Hàn, hoá ra nghe nói anh ấy đến từ Nhật.
  - type: example
    target: 오늘 쪽지 시험이 있는 줄 전혀 몰랐어요.
    target_lang: ko
    translation:
      vi: Tôi hoàn toàn không biết hôm nay có bài kiểm tra nhanh.
  - type: example
    target: 회의실이 몇 층에 있는지 아세요?
    target_lang: ko
    translation:
      vi: Bạn có biết phòng họp ở tầng mấy không?
  - type: example
    target: 그 드라마 마지막 회가 얼마나 슬픈지 몰라요. 계속 울었어요.
    target_lang: ko
    translation:
      vi: Tập cuối bộ phim đó buồn không tả nổi. Tôi khóc suốt.
    note:
      vi: 얼마나 A-(으)ㄴ지 몰라요 = nhấn mạnh, không phải "không biết".
  - type: common_mistake
    wrong: 그 사람이 어디에 가요 몰라요.
    right: 그 사람이 어디에 가는지 몰라요.
    target_lang: ko
    note:
      vi: Không ghép nguyên câu hỏi -아/어요 vào trước 모르다. Phải đổi đuôi thành -는지.
  - type: common_mistake
    wrong: 대학생 줄 알았어요.
    right: 대학생인 줄 알았어요.
    target_lang: ko
    note:
      vi: Danh từ cần 이다 ở dạng định ngữ - N인 줄. Người Việt hay bỏ 인 vì tiếng Việt không có "là" ở chỗ này.
  - type: common_mistake
    wrong: 이 신발이 저한테 작는지 모르겠어요.
    right: 이 신발이 저한테 작은지 모르겠어요.
    target_lang: ko
    note:
      vi: Tính từ dùng -(으)ㄴ지 (작은지, 비싼지); -는지 chỉ dành cho động từ và 있다/없다.
  - type: summary
    points:
      - vi: V-는 / V-(으)ㄴ / V-(으)ㄹ / A-(으)ㄴ / N인 줄 알았다 - cứ tưởng (nhưng không phải).
      - vi: … 줄 몰랐다 - không biết là… (giờ mới biết); hay đi với 전혀.
      - vi: Khác -(으)ㄹ 줄 알다 / 모르다 - biết / không biết cách làm.
      - vi: Câu hỏi lồng - V-는지 · A-(으)ㄴ지 · N인지 · -았/었는지 · -(으)ㄹ지 + 알다/모르다/궁금하다/물어보다.
      - vi: 얼마나 A-(으)ㄴ지 몰라요 - …không tả nổi.
      - vi: 착각하다 · 오해하다 · 동갑 · 기억나다 · 확실하다 · 헷갈리다 · 궁금하다 · 전혀.
exercises:
  # ---------------- recognition ----------------
  - key: ko:exercise:gm-mist-mcq-married-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ko:item:gm-gram-neun-jul-alda
    prompt:
      stem: "그 선배가 벌써 결혼한 줄 몰랐어요. nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: f2w, text: "Tôi không biết là anh tiền bối đó đã kết hôn rồi.", lang: vi }
        - { id: q8b, text: "Tôi cứ tưởng anh tiền bối đó đã kết hôn rồi.", lang: vi }
        - { id: e6l, text: "Anh tiền bối đó không biết cách tổ chức đám cưới.", lang: vi }
        - { id: m3y, text: "Tôi không biết anh tiền bối đó có kết hôn hay không.", lang: vi }
    answer:
      correct_option_id: f2w
    explanation:
      vi: -(으)ㄴ 줄 몰랐다 = "không biết là… (giờ mới biết)". "Cứ tưởng" là 줄 알았다; "biết cách" là -(으)ㄹ 줄 알다; "có… hay không" là câu hỏi lồng -았는지.
    display_answer: "Tôi không biết là anh tiền bối đó đã kết hôn rồi."

  - key: ko:exercise:gm-mist-listen-lookalike
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ko:item:gm-gram-neun-jul-alda
    prompt:
      audio_asset_id: null
      fallback_text: 아, 미안해요. 수진 씨 동생인 줄 알았어요. 두 분이 정말 많이 닮았네요.
      options:
        - { id: z5c, text: "À, xin lỗi. Tôi cứ tưởng bạn là em của Sujin. Hai người giống nhau thật.", lang: vi }
        - { id: a1j, text: "À, xin lỗi. Tôi không biết bạn là em của Sujin.", lang: vi }
        - { id: v7h, text: "À, xin lỗi. Bạn có biết em của Sujin không?", lang: vi }
        - { id: o4r, text: "À, xin lỗi. Sujin và em gái không giống nhau chút nào.", lang: vi }
    answer:
      correct_option_id: z5c
    explanation:
      vi: 동생인 줄 알았어요 = cứ tưởng là em (nhưng không phải) - vì thế mới xin lỗi. 닮았네요 = giống nhau thật (vừa nhận ra).
    display_answer: "À, xin lỗi. Tôi cứ tưởng bạn là em của Sujin. Hai người giống nhau thật."

  - key: ko:exercise:gm-mist-mcq-laptop-price
    type: mcq
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-neunji
    prompt:
      stem: "Chọn từ đúng: \"Bạn có biết cái máy tính xách tay này giá bao nhiêu không?\" 이 노트북이 ___ 아세요?"
      stem_lang: vi
      options:
        - { id: r9t, text: 얼마인지, lang: ko }
        - { id: k2e, text: 얼마는지, lang: ko }
        - { id: d6u, text: 얼마예요, lang: ko }
        - { id: x4n, text: 얼마인 줄, lang: ko }
    answer:
      correct_option_id: r9t
    explanation:
      vi: Lồng câu hỏi với danh từ (얼마) → N인지. -는지 không gắn thẳng vào danh từ; 얼마예요 là câu hỏi rời, không lồng được; 얼마인 줄 아세요 nghe như "bạn tưởng là bao nhiêu".
    display_answer: 얼마인지

  - key: ko:exercise:gm-mist-fill-teacher-time-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-neunji
    prompt:
      template: "선생님이 내일 몇 시에 {{b1}} 제가 물어볼게요."
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa của câu: Tôi sẽ hỏi xem ngày mai mấy giờ thầy đến."
        - "Gợi ý: 오다 + kính ngữ -시- + -는지."
    answer:
      blanks:
        b1: [오시는지, 오실지, 오는지]
    known_wrong:
      - answer: 오세요
        feedback_vi: Không ghép nguyên câu hỏi vào giữa câu - đổi thành -는지 (오시는지).
        error_tag: embedded_question
      - answer: 오신지
        feedback_vi: -(으)ㄴ지 với động từ là việc đã xảy ra; "ngày mai mấy giờ đến" dùng 오시는지 hoặc 오실지.
        error_tag: embedded_tense
      - answer: 오시는 줄
        feedback_vi: -는 줄 là "tưởng là"; hỏi "mấy giờ đến" cần câu hỏi lồng -는지.
        error_tag: jul_vs_neunji
    explanation:
      vi: Câu hỏi "mấy giờ đến?" lồng vào trước 물어보다 → 몇 시에 오시는지 (thầy - kính ngữ). -(으)ㄹ지 cũng đúng vì là chuyện ngày mai.
    display_answer: 선생님이 내일 몇 시에 오시는지 제가 물어볼게요.

  - key: ko:exercise:gm-mist-wb-keys
    type: word_bank
    stage: recognition
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gieongnada
    prompt:
      instruction: "Sắp xếp thành câu tiếng Hàn: \"Tôi không nhớ ra đã để chìa khoá ở đâu.\""
      tokens:
        - { id: t3, text: 뒀는지 }
        - { id: t5, text: 둔 줄 }
        - { id: t1, text: 열쇠를 }
        - { id: t4, text: 기억나지 않아요 }
        - { id: t2, text: 어디에 }
        - { id: t6, text: 뒀어요 }
    answer:
      orders:
        - [t1, t2, t3, t4]
        - [t2, t1, t3, t4]
    explanation:
      vi: Câu hỏi "đã để ở đâu?" lồng trước 기억나다 → 어디에 뒀는지 (quá khứ -았/었는지; 뒀- là 두었- rút gọn). 열쇠를 và 어디에 đổi chỗ được. 둔 줄, 뒀어요 là token thừa.
    display_answer: 열쇠를 어디에 뒀는지 기억나지 않아요.

  # ---------------- recall ----------------
  - key: ko:exercise:gm-mist-fill-friday
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-neun-jul-alda
    prompt:
      template: "(Tôi cứ tưởng hôm nay là thứ Sáu, hoá ra mới thứ Năm.) 오늘이 {{b1}} 알았는데 아직 목요일이네요."
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [금요일인 줄, 금요일인줄]
    known_wrong:
      - answer: 금요일 줄
        feedback_vi: Danh từ cần 이다 ở dạng định ngữ - 금요일인 줄.
        error_tag: copula_missing
      - answer: 금요일인지
        feedback_vi: -인지 là câu hỏi lồng ("có phải thứ Sáu không"); "cứ tưởng là" dùng N인 줄 알았다.
        error_tag: jul_vs_neunji
      - answer: 금요일이 줄
        feedback_vi: Định ngữ của 이다 là 인 - 금요일인 줄.
        error_tag: copula_missing
    explanation:
      vi: Danh từ + 인 줄 알았다 = cứ tưởng là N. -는데 nối sang sự thật khác (아직 목요일이네요).
    display_answer: 오늘이 금요일인 줄 알았는데 아직 목요일이네요.

  - key: ko:exercise:gm-mist-fill-gift
    type: fill_blank
    stage: recall
    answer_lang: ko
    difficulty: 4
    item: ko:item:gm-gram-neunji
    prompt:
      template: "(Tôi không biết bạn ấy có thích món quà này không.) 친구가 이 선물을 {{b1}} 모르겠어요."
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [좋아할지, 좋아하는지, 마음에 들어 할지]
    known_wrong:
      - answer: 좋아할지도
        feedback_vi: -(으)ㄹ지도 모르다 là "biết đâu sẽ thích" - khác ý "không biết có thích không".
        error_tag: neunji_vs_jido
      - answer: 좋아하는 줄
        feedback_vi: -는 줄 모르다 là "không biết là (bạn ấy) thích"; câu gốc là câu hỏi lồng - 좋아할지.
        error_tag: jul_vs_neunji
      - answer: 좋아해요
        feedback_vi: Không ghép câu -아/어요 vào trước 모르다 - đổi thành -(으)ㄹ지 / -는지.
        error_tag: embedded_question
    explanation:
      vi: Câu hỏi có/không lồng vào trước 모르겠어요 → -(으)ㄹ지 (phỏng đoán tương lai) hoặc -는지.
    display_answer: 친구가 이 선물을 좋아할지 모르겠어요.

  - key: ko:exercise:gm-mist-translate-restroom
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-neunji
    prompt:
      source_text: Xin lỗi, anh có biết nhà vệ sinh ở đâu không ạ?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 실례지만 화장실이 어디에 있는지 아세요?
        - 실례지만 화장실이 어디 있는지 아세요?
        - 실례합니다. 화장실이 어디에 있는지 아세요?
        - 죄송하지만 화장실이 어디에 있는지 아세요?
        - 죄송한데 화장실이 어디에 있는지 아세요?
        - 저기요, 화장실이 어디에 있는지 아세요?
        - 실례지만 화장실이 어디인지 아세요?
        - 실례지만 화장실이 어딘지 아세요?
        - 화장실이 어디에 있는지 아세요?
        - 화장실이 어디 있는지 아세요?
        - 실례지만 화장실이 어디에 있는지 아십니까?
        - 혹시 화장실이 어디에 있는지 아세요?
        - 실례지만 혹시 화장실이 어디에 있는지 아세요?
    known_wrong:
      - answer: 실례지만 화장실이 어디에 있어요 아세요?
        feedback_vi: Câu hỏi lồng phải đổi đuôi - 있는지 아세요?.
        error_tag: embedded_question
      - answer: 실례지만 화장실이 어디에 있은지 아세요?
        feedback_vi: 있다 luôn đi với -는지 - 있는지.
        error_tag: neunji_itda
      - answer: 실례지만 화장실이 어디에 있는지 알아요?
        feedback_vi: Hỏi người lạ nên dùng kính ngữ - 아세요?.
        error_tag: honorific_missing
      - answer: hwajangsiri eodie inneunji aseyo
        feedback_vi: Hãy viết bằng Hangul, không dùng phiên âm Latinh.
        error_tag: romanization
    explanation:
      vi: '"Ở đâu?" lồng vào trước 알다 → 어디에 있는지; hỏi người lạ dùng 아세요?. 실례지만 / 죄송하지만 mở đầu lịch sự.'
    display_answer: 실례지만 화장실이 어디에 있는지 아세요?

  # ---------------- application ----------------
  - key: ko:exercise:gm-mist-mcq-wrong-person
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:gm-gram-neun-jul-alda
    prompt:
      stem: "Ở siêu thị, bạn vỗ vai chào một người vì tưởng là thầy giáo mình, nhưng hoá ra là người lạ. Bạn xin lỗi thế nào?"
      stem_lang: vi
      options:
        - { id: p7d, text: "아, 죄송합니다. 저희 선생님이신 줄 알았어요.", lang: ko }
        - { id: h1q, text: "아, 죄송합니다. 저희 선생님이신지 알았어요.", lang: ko }
        - { id: c5x, text: "아, 죄송합니다. 저희 선생님이신 줄 몰랐어요.", lang: ko }
        - { id: u8s, text: "아, 죄송합니다. 저희 선생님이실지도 몰라요.", lang: ko }
    answer:
      correct_option_id: p7d
    explanation:
      vi: '"Tưởng nhầm là thầy" = 선생님이신 줄 알았어요 (kính ngữ 이시-). 줄 몰랐어요 nghĩa ngược lại "không biết đó là thầy"; -이신지 알았어요 sai cấu trúc; -실지도 몰라요 là "biết đâu là thầy".'
    display_answer: 아, 죄송합니다. 저희 선생님이신 줄 알았어요.

  - key: ko:exercise:gm-mist-mcq-reading-party-time
