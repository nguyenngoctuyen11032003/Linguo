title:
  vi: Nhớ lại ngày xưa - -던, -았/었던, -더니
objectives:
  - vi: Gợi lại kỷ niệm bằng định ngữ hồi tưởng V/A-던 (việc lặp lại, dở dang) và V/A-았/었던 (việc đã xong, trạng thái nay đã khác).
  - vi: Kể sự thay đổi mình đã quan sát được bằng V/A-더니, phân biệt với -았/었더니 và -더라고요 đã học.
  - vi: Từ vựng hồi ức - 추억, 어린 시절, 단골, 동창, 예전, 변하다, 졸업하다.
