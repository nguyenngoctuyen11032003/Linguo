  - key: ko:exercise:gm-mem-mcq-reading-hometown
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:gm-eorin-sijeol
    prompt:
      stem: "다음 글을 읽고 내용과 같은 것을 고르십시오.\n고향에 십 년 만에 다녀왔다. 어린 시절 친구들과 매일 놀던 강가에는 이제 높은 아파트가 서 있었다. 내가 다녔던 초등학교는 그대로였지만 자주 가던 문구점은 없어졌다. 할머니께서는 \"옛날에는 이 동네가 참 조용하더니 이제 사람이 많아졌지\" 하고 말씀하셨다. 많이 변했지만 고향은 여전히 따뜻한 추억이 있는 곳이다."
      stem_lang: ko
      options:
        - { id: x2d, text: 글쓴이가 다녔던 초등학교는 아직 남아 있다., lang: ko }
        - { id: e5q, text: 글쓴이는 해마다 고향에 간다., lang: ko }
        - { id: i8t, text: 글쓴이가 자주 가던 문구점은 지금도 장사를 한다., lang: ko }
        - { id: o1y, text: 옛날에도 이 동네에는 사람이 많았다., lang: ko }
    answer:
      correct_option_id: x2d
    explanation:
      vi: 다녔던 초등학교는 그대로였지만 = trường tiểu học từng học vẫn như cũ. Người viết mười năm mới về (십 년 만에); hiệu văn phòng phẩm hay đến đã biến mất (없어졌다); bà nói ngày xưa khu này yên tĩnh (조용하더니), giờ mới đông người.
    display_answer: 글쓴이가 다녔던 초등학교는 아직 남아 있다.

  - key: ko:exercise:gm-mem-translate-snack-bar-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:gm-gram-atdeon
    prompt:
      source_text: 대학 때 단골이었던 분식집이 없어져서 너무 아쉬웠어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Quán ăn vặt quen hồi đại học đã không còn nữa nên tôi rất tiếc.
        - Quán ăn vặt tôi hay ăn hồi đại học đã biến mất nên tôi tiếc lắm.
        - Quán ăn vặt quen thời đại học đã đóng cửa nên tôi rất tiếc.
        - Quán ăn vặt từng là chỗ quen của tôi hồi đại học không còn nữa nên tôi rất tiếc.
        - Quán ăn nhẹ quen hồi đại học đã không còn nên tôi thấy tiếc quá.
        - Quán ăn vặt quen hồi đại học đã biến mất nên tôi rất tiếc nuối.
        - Quán quen hồi đại học đã không còn nữa nên tôi tiếc lắm.
        - Vì quán ăn vặt quen hồi đại học đã biến mất nên tôi rất tiếc.
        - Quán ăn vặt quen hồi học đại học không còn nữa nên tôi rất tiếc.
        - Quán ăn vặt mà tôi hay đến hồi đại học đã không còn nên tôi rất tiếc.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Quán ăn vặt quen hồi đại học vẫn còn nên tôi rất vui.
        feedback_vi: 없어져서 là "đã biến mất, không còn"; 아쉬웠어요 là "tiếc".
        error_tag: meaning_mismatch
      - answer: Tôi sẽ mở một quán ăn vặt giống hồi đại học.
        feedback_vi: Câu gốc nói về quán quen ngày trước đã không còn, không phải dự định.
        error_tag: meaning_mismatch
    explanation:
      vi: N이었던 = từng là N (nay không còn); 단골 = quán quen; 없어지다 = biến mất; 아쉽다 = tiếc.
    display_answer: Quán ăn vặt quen hồi đại học đã không còn nữa nên tôi rất tiếc.

