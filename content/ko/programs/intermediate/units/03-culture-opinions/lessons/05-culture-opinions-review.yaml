        feedback_vi: 베트남에 비해 là "so với Việt Nam" - chủ đề đang nói là 한국.
        error_tag: e_bihae_reversed
      - answer: So với Việt Nam, ở Hàn Quốc cách nói giống nhau ở mọi tuổi.
