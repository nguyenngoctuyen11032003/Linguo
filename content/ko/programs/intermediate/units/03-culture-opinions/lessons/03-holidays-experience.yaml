      vi: 짧다 (ngắn) là tính từ → 짧아지다 (trở nên ngắn) → quá khứ 짧아졌어요. Kỳ nghỉ Tết là 설날 연휴 hoặc 설 연휴.
    display_answer: 요즘 설날 연휴가 짧아졌어요.
