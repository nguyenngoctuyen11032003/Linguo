      stem_lang: vi
      options:
        - { id: x6m, text: 길이 미끄러워서 걷다가 넘어졌어요., lang: ko }
        - { id: d2v, text: 길이 미끄럽어서 걷다가 넘어졌어요., lang: ko }
        - { id: f8k, text: 길이 미끄러워서 걷더니 넘어졌어요., lang: ko }
        - { id: b4n, text: 길이 미끄러워서 걷다가 넘어지세요., lang: ko }
    answer:
