      vi: Việc mình đã làm (nghỉ một ngày) + kết quả sau đó (khỏe hơn) → 쉬었더니. "Khỏe hơn" dùng 좋아졌어요 / 나아졌어요.
    display_answer: 하루 쉬었더니 많이 좋아졌어요.

