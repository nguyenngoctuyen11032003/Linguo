    difficulty: 4
    item: ko:item:gram-at-deoni
    prompt:
      source_text: Tôi nghỉ ngơi một ngày thì thấy khỏe hơn nhiều.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 하루 쉬었더니 많이 좋아졌어요.
        - 하루 쉬었더니 많이 괜찮아졌어요.
        - 하루 쉬었더니 많이 나아졌어요.
        - 하루 동안 쉬었더니 많이 좋아졌어요.
        - 하루 동안 쉬었더니 많이 나아졌어요.
        - 저는 하루 쉬었더니 많이 좋아졌어요.
        - 하루 쉬었더니 훨씬 좋아졌어요.
        - 하루 쉬었더니 훨씬 나아졌어요.
        - 하루 쉬었더니 몸이 많이 좋아졌어요.
    known_wrong:
      - answer: 하루 쉬더니 많이 좋아졌어요.
        feedback_vi: Người nghỉ là chính bạn, cần 았/었 - 쉬었더니.
        error_tag: deoni_first_person
      - answer: 하루 쉬다가 많이 좋아졌어요.
        feedback_vi: -다가 là "đang nghỉ thì…". Nghỉ xong rồi mới khỏe hơn - dùng 쉬었더니.
        error_tag: daga_vs_deoni
      - answer: 하루 쉬면 많이 좋아졌어요.
