    item: ko:item:gram-eul-tenikka
    prompt:
      stem: Đồng nghiệp sắp ra sân bay vào giờ tan tầm. Bạn khuyên "Chắc đường tắc đấy, chị đi tàu điện ngầm đi". Câu nào đúng?
      stem_lang: vi
      options:
        - { id: q5x, text: 길이 막힐 테니까 지하철을 타세요., lang: ko }
        - { id: z1g, text: 길이 막히는 바람에 지하철을 타세요., lang: ko }
        - { id: r8b, text: 길이 막혔더니 지하철을 타세요., lang: ko }
        - { id: s6y, text: 길이 막힐 뻔해서 지하철을 타세요., lang: ko }
