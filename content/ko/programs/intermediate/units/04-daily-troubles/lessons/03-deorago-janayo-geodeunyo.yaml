title:
  vi: "Kể chuyện rắc rối: -더라고요, -잖아요, -거든요"
objectives:
  - vi: Kể lại điều mình đã thấy, cảm nhận bằng -더라고요, không dùng cho hành động có chủ ý của chính mình.
  - vi: Nhắc điều người nghe đã biết bằng -잖아요.
  - vi: Đưa ra lý do người nghe chưa biết bằng -거든요, và biết không dùng nó khi viết.
  - vi: Bày tỏ cảm xúc - 답답하다, 짜증이 나다, 다행이다.
