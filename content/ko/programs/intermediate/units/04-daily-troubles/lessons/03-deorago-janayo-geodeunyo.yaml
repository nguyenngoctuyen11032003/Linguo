    known_wrong:
      - answer: 전화를 못 받아서 미안해요. 휴대폰을 잃어버렸잖아요.
        feedback_vi: Người nghe chưa biết bạn mất điện thoại, nên dùng -거든요.
        error_tag: janayo_vs_geodeunyo
      - answer: 전화를 못 받아서 미안해요. 휴대폰을 잊어버렸거든요.
        feedback_vi: 잊어버리다 là "quên"; làm mất đồ là 잃어버리다.
        error_tag: vocab_lose_forget
      - answer: 전화를 못 받아서 미안해요. 휴대폰을 잃어버리더라고요.
        feedback_vi: Làm mất điện thoại là việc của chính bạn, không dùng -더라고요.
