    display_answer: 전화를 못 받아서 미안해요. 휴대폰을 잃어버렸거든요.

  - key: ko:exercise:dt-chat-translate-always-traffic
    type: translate
    stage: recall
    answer_lang: ko
    difficulty: 3
    item: ko:item:gram-janayo
    prompt:
      source_text: Thứ Sáu đường vốn dĩ hay tắc mà.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 금요일에는 원래 길이 막히잖아요.
