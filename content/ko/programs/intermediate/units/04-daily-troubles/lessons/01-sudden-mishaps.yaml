level: topik3
title:
  vi: "Sự cố bất ngờ: -는 바람에 và -(으)ㄹ 뻔했다"
objectives:
  - vi: Kể nguyên nhân bất ngờ dẫn tới chuyện không may bằng -는 바람에.
  - vi: Nói "suýt nữa thì…" bằng 하마터면 … -(으)ㄹ 뻔했어요.
  - vi: Phân biệt -는 바람에 (kết quả xấu) với -(으)ㄴ 덕분에 (kết quả tốt).
  - vi: Dùng từ vựng về sự cố hằng ngày - mất ví, lỡ xe, ngã, bị thương.
estimated_minutes: 18
skills: [grammar, speaking, vocabulary]
prerequisites: [ko:lesson:culture-opinions-review]
