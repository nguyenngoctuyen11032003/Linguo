  - key: ko:exercise:tv-rev-mcq-reading-accident-news
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 5
    item: ko:item:tv-gram-passive
    prompt:
      stem: "다음 뉴스를 읽고 내용과 같은 것을 고르십시오.\n오늘 오전 8시쯤 강남역 근처에서 버스와 승용차가 부딪히는 사고가 났습니다. 이 사고로 승용차 운전자가 다쳐서 구급차에 실려 병원으로 갔습니다. 버스 승객들은 크게 다치지 않았습니다. 현재 사고 처리 때문에 강남대로 2차로가 닫혀 있어서 한동안 차가 많이 막히겠습니다."
      stem_lang: ko
      options:
        - { id: x6b, text: 승용차 운전자가 다쳐서 병원에 갔어요., lang: ko }
        - { id: f2r, text: 버스 승객들이 크게 다쳤어요., lang: ko }
        - { id: l8u, text: 사고는 저녁 8시쯤 났어요., lang: ko }
        - { id: d4e, text: 지금 강남대로는 차가 잘 다녀요., lang: ko }
    answer:
      correct_option_id: x6b
    explanation:
      vi: 승용차 운전자가 다쳐서 구급차에 실려 병원으로 갔습니다 = tài xế ô tô con bị thương, được chở lên xe cấp cứu đến bệnh viện (실리다 - bị động của 싣다). Hành khách xe buýt không bị thương nặng; tai nạn lúc 8 giờ sáng (오전); làn 2 đang bị đóng nên đường sẽ còn tắc.
    display_answer: 승용차 운전자가 다쳐서 병원에 갔어요.

  - key: ko:exercise:tv-rev-translate-grandma-feeds-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:tv-gram-neun-sai
    prompt:
      source_text: 할머니께서 아이에게 밥을 먹이시는 사이에 저는 잠깐 낮잠을 잤어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Trong lúc bà cho con ăn, tôi tranh thủ ngủ trưa một chút.
        - Trong lúc bà cho cháu ăn cơm, tôi ngủ trưa một lát.
        - Trong lúc bà cho bé ăn, tôi chợp mắt một chút.
        - Trong khi bà cho con ăn cơm, tôi ngủ trưa một chút.
        - Trong lúc bà cho đứa bé ăn, tôi đã ngủ một giấc ngắn.
        - Trong lúc bà đút cơm cho con, tôi tranh thủ chợp mắt một lát.
        - Trong lúc bà cho con ăn, tôi đã ngủ trưa một lát.
        - Lúc bà cho con ăn, tôi tranh thủ ngủ trưa một chút.
        - Trong lúc bà cho cháu ăn, tôi tranh thủ chợp mắt một chút.
        - Nhân lúc bà cho con ăn, tôi ngủ trưa một chút.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Trong lúc bà ăn cơm, tôi ngủ trưa một chút.
        feedback_vi: 먹이시다 là "cho (con) ăn" - sai khiến; người ăn là đứa bé, không phải bà.
        error_tag: causative_meaning
      - answer: Bà vừa cho con ăn xong là tôi đi ngủ trưa.
        feedback_vi: -는 사이에 là "trong lúc", không phải "vừa xong là" (-자마자).
        error_tag: sai_vs_jamaja
    explanation:
      vi: 먹이다 = cho ăn (kính ngữ 먹이시다); -는 사이에 = trong lúc (ngắn); 잠깐 낮잠을 자다 = ngủ trưa một lát.
    display_answer: Trong lúc bà cho con ăn, tôi tranh thủ ngủ trưa một chút.

  - key: ko:exercise:tv-rev-translate-front-seat
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:tv-anchida
    prompt:
      source_text: Không được cho trẻ em ngồi ở ghế trước.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 아이를 앞자리에 앉히면 안 돼요.
        - 아이를 앞좌석에 앉히면 안 돼요.
        - 아이들을 앞자리에 앉히면 안 돼요.
        - 아이들을 앞좌석에 앉히면 안 돼요.
        - 아이를 조수석에 앉히면 안 돼요.
        - 어린이를 앞좌석에 앉히면 안 돼요.
        - 어린이를 앞자리에 앉히면 안 돼요.
        - 아이는 앞자리에 앉히면 안 돼요.
        - 아이를 앞자리에 앉히면 안 됩니다.
        - 어린이를 앞좌석에 앉히면 안 됩니다.
        - 아이를 앞자리에 앉게 하면 안 돼요.
        - 아이를 앞좌석에 앉게 하면 안 돼요.
    known_wrong:
      - answer: 아이를 앞자리에 앉으면 안 돼요.
        feedback_vi: 앉다 không có tân ngữ; "cho trẻ ngồi" là sai khiến 앉히다 → 앉히면 안 돼요.
        error_tag: causative_missing
      - answer: 아이를 앞자리에 앉혀도 돼요.
        feedback_vi: -아/어도 돼요 là "được phép"; câu gốc là cấm - -(으)면 안 돼요.
        error_tag: permission_vs_prohibition
      - answer: 아이를 앞자리에 앉혀지면 안 돼요.
        feedback_vi: Không thêm -아/어지다; chỉ cần 앉히면 안 돼요.
        error_tag: double_suffix
    explanation:
      vi: '"Cho/đặt trẻ ngồi" = 앉히다 (hoặc 앉게 하다); "không được" = -(으)면 안 돼요. Ghế trước = 앞자리 / 앞좌석 / 조수석.'
    display_answer: 아이를 앞자리에 앉히면 안 돼요.
