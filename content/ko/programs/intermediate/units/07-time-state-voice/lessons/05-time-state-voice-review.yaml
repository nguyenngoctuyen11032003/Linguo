title:
  vi: Ôn tập - Ngày chuyển nhà, gửi con đi nhà trẻ & bản tin giao thông
objectives:
  - vi: Hiểu hội thoại của một gia đình trong ngày chuyển nhà và tin nhắn với nhà trẻ - -자마자, -는 동안, -는 사이에, -는 김에, -아/어 있다, -(으)ㄴ 채로, 대신.
  - vi: Nghe hiểu bản tin giao thông trang trọng (-습니다) có động từ bị động - 막히다, 닫히다, 실리다.
  - vi: Dùng đúng động từ bị động và sai khiến trong cùng một câu chuyện - 안기다 / 안다, 재우다, 먹이다, 앉히다.
estimated_minutes: 25
skills: [listening, reading, grammar, writing]
prerequisites: [ko:lesson:causative-verbs]
