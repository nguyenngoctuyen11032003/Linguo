    display_answer: 남자의 얼굴이 CCTV에 찍혔다.

  - key: ko:exercise:tv-pass-translate-baby-hug-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ko:item:tv-angida
    prompt:
      source_text: 아기가 아빠 품에 안기자마자 울음을 그쳤어요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Em bé vừa được bố ôm vào lòng là nín khóc.
        - Em bé vừa được bố bế vào lòng là nín khóc ngay.
        - Vừa được bố ôm vào lòng, em bé liền nín khóc.
        - Em bé vừa nằm trong vòng tay bố là nín khóc.
        - Đứa bé vừa được bố ôm là nín khóc.
        - Em bé vừa được bố ôm vào lòng là thôi khóc.
        - Bé vừa được bố ôm vào lòng là nín ngay.
        - Em bé vừa được bố bế là ngừng khóc.
        - Vừa được bố ôm, em bé đã nín khóc.
        - Em bé vừa được ba ôm vào lòng là nín khóc.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Em bé vừa ôm bố là nín khóc.
        feedback_vi: 안기다 là bị động - em bé được bố ôm, không phải em bé ôm bố.
        error_tag: active_vs_passive
      - answer: Em bé vừa được bố ôm vào lòng là bắt đầu khóc.
        feedback_vi: 울음을 그치다 là "nín khóc, thôi khóc".
        error_tag: meaning_mismatch
    explanation:
      vi: 안기다 = được ôm (bị động của 안다); N 품에 안기다 = nằm trong vòng tay N; -자마자 = vừa… là; 울음을 그치다 = nín khóc.
    display_answer: Em bé vừa được bố ôm vào lòng là nín khóc.

  - key: ko:exercise:tv-pass-translate-han-river
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:tv-boida
    prompt:
      source_text: Qua cửa sổ văn phòng nhìn thấy được sông Hàn.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 사무실 창문으로 한강이 보여요.
        - 사무실 창문에서 한강이 보여요.
        - 사무실 창문 밖으로 한강이 보여요.
        - 사무실 창으로 한강이 보여요.
        - 사무실 창문으로 한강이 보입니다.
        - 사무실 창문에서 한강이 보입니다.
        - 사무실 창문으로는 한강이 보여요.
        - 사무실 창문 너머로 한강이 보여요.
        - 우리 사무실 창문으로 한강이 보여요.
        - 사무실 창밖으로 한강이 보여요.
    known_wrong:
      - answer: 사무실 창문으로 한강을 보여요.
        feedback_vi: 보이다 là bị động - 한강이 (chủ ngữ).
        error_tag: particle_subject
      - answer: 사무실 창문으로 한강이 봐요.
        feedback_vi: 보다 là chủ động "xem, nhìn"; "nhìn thấy được" là 보이다 → 보여요.
        error_tag: active_vs_passive
      - answer: 사무실 창문으로 한강이 보여져요.
        feedback_vi: 보이다 đã là bị động; không thêm -아/어지다.
        error_tag: double_passive
    explanation:
      vi: 보다 + -이- → 보이다 (được nhìn thấy); thứ được thấy làm chủ ngữ với 이/가. "Qua cửa sổ" = 창문으로 / 창문 밖으로.
    display_answer: 사무실 창문으로 한강이 보여요.
