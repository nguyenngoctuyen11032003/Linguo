title:
  vi: Bị, được trong tiếng Hàn - động từ bị động -이/히/리/기
objectives:
  - vi: Nhận ra và dùng động từ bị động -이/히/리/기 - 보이다, 놓이다, 닫히다, 잡히다, 막히다, 열리다, 팔리다, 들리다, 안기다, 쫓기다.
  - vi: Đổi câu chủ động sang bị động - tân ngữ 을/를 thành chủ ngữ 이/가, người gây ra hành động đi với 에게/한테 hoặc 에.
  - vi: Hiểu vì sao tiếng Hàn hay dùng bị động cho việc "tự xảy ra" (소리가 들려요, 산이 보여요) trong khi tiếng Việt dùng câu chủ động.
