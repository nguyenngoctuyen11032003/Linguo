title:
  vi: Đang mở sẵn hay đang mở? - -아/어 있다, -(으)ㄴ 채로, 대신(에)
objectives:
  - vi: Phân biệt trạng thái V-아/어 있다 (문이 열려 있다) với hành động đang diễn ra V-고 있다 (문을 열고 있다), và trường hợp đặc biệt của 입다/신다/쓰다.
  - vi: Nói "để nguyên… mà…" bằng V-(으)ㄴ 채(로).
  - vi: Nói "thay cho, thay vì, bù lại" bằng N 대신(에) / V-는 대신(에) / A-(으)ㄴ 대신(에); từ vựng - 눕다, 신다, 켜지다, 꺼지다, 붙다, 남다.
estimated_minutes: 24
skills: [grammar, vocabulary, reading, writing]
prerequisites: [ko:lesson:time-moments]
