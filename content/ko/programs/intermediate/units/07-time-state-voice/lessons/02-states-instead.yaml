    prompt:
      source_text: 이 식당은 값이 좀 비싼 대신 양이 아주 많아요.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Nhà hàng này giá hơi đắt nhưng bù lại phần ăn rất nhiều.
        - Quán này giá hơi đắt nhưng bù lại đồ ăn rất nhiều.
        - Nhà hàng này hơi đắt nhưng bù lại suất ăn rất nhiều.
        - Nhà hàng này giá hơi đắt, đổi lại phần ăn rất nhiều.
        - Nhà hàng này giá hơi cao nhưng bù lại lượng đồ ăn rất nhiều.
        - Giá ở nhà hàng này hơi đắt nhưng bù lại phần ăn rất lớn.
        - Nhà hàng này tuy giá hơi đắt nhưng bù lại phần ăn rất nhiều.
        - Nhà hàng này hơi đắt nhưng được cái phần ăn rất nhiều.
        - Quán ăn này giá hơi đắt nhưng bù lại ăn rất nhiều.
        - Nhà hàng này giá hơi mắc nhưng bù lại phần ăn rất nhiều.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Nhà hàng này giá rẻ nhưng phần ăn rất ít.
        feedback_vi: 비싼 là "đắt", 양이 많아요 là "nhiều" - ngược hoàn toàn.
        error_tag: meaning_mismatch
      - answer: Thay vì nhà hàng này, phần ăn rất nhiều.
        feedback_vi: A-(으)ㄴ 대신 ở đây là "bù lại", không phải "thay vì N".
        error_tag: daesin_meaning
    explanation:
      vi: A-(으)ㄴ 대신 = …nhưng bù lại / đổi lại; 양 = lượng, phần ăn.
    display_answer: Nhà hàng này giá hơi đắt nhưng bù lại phần ăn rất nhiều.

  - key: ko:exercise:tv-state-translate-walk-instead
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:tv-gram-daesine
    prompt:
      source_text: Hôm nay thay vì đi xe buýt, tôi đi bộ đến.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 오늘은 버스를 타는 대신 걸어서 왔어요.
        - 오늘은 버스를 타는 대신에 걸어서 왔어요.
        - 오늘 버스를 타는 대신 걸어서 왔어요.
        - 오늘은 버스 대신 걸어서 왔어요.
        - 오늘 버스 대신 걸어서 왔어요.
        - 오늘은 버스를 타는 대신 걸어왔어요.
        - 오늘은 버스 대신 걸어왔어요.
        - 오늘은 버스를 타는 대신 걸어서 갔어요.
        - 오늘은 버스를 타지 않고 걸어서 왔어요.
        - 오늘은 버스를 안 타고 걸어서 왔어요.
        - 오늘은 버스를 타는 대신 걸었어요.
        - 오늘은 버스를 타는 대신 걸어서 왔습니다.
    known_wrong:
      - answer: 오늘은 버스를 탄 대신 걸어서 왔어요.
        feedback_vi: '"Thay vì làm" dùng V-는 대신 (타는 대신); 탄 대신 nghe như "đổi lại việc đã đi xe buýt".'
        error_tag: daesin_form
      - answer: 오늘은 버스를 타는 동안 걸어서 왔어요.
        feedback_vi: -는 동안 là "trong lúc" - vô lý về nghĩa.
        error_tag: dongan_vs_daesin
      - answer: 오늘은 버스 대신 걷어서 왔어요.
        feedback_vi: 걷다 là bất quy tắc ㄷ - 걸어서.
        error_tag: d_irregular
    explanation:
      vi: '"Thay vì làm A" = V-는 대신(에); "thay cho N" = N 대신. 걷다 → 걸어서 (ㄷ bất quy tắc).'
    display_answer: 오늘은 버스를 타는 대신 걸어서 왔어요.
