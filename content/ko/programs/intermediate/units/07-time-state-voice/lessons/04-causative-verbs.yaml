title:
  vi: Bắt, cho, làm cho - -게 하다 và động từ sai khiến -이/히/리/기/우/추
objectives:
  - vi: Nói "bắt/cho/khiến ai làm gì" bằng V-게 하다 với người được sai khiến đi kèm 에게/한테.
  - vi: Dùng động từ sai khiến từ vựng - 먹이다, 입히다, 앉히다, 울리다, 웃기다, 씻기다, 태우다, 깨우다, 낮추다 - và phân biệt với -게 하다.
  - vi: Kể việc chăm con, việc nhà bằng động từ sai khiến; nhận ra những từ trùng hình thức với bị động.
