title:
  vi: Vừa… là, trong lúc, nhân tiện - -자마자, -는 동안, -는 사이에, -는 김에
objectives:
  - vi: Nói hai việc xảy ra liền nhau bằng V-자마자 và hai việc song song bằng V-는 동안(에) / N 동안.
  - vi: Kể chuyện bất ngờ xảy ra "trong lúc sơ ý" bằng V-는 사이(에), và việc làm "nhân tiện" bằng V-는 김에 / V-(으)ㄴ 김에.
  - vi: Từ vựng sinh hoạt hằng ngày - 들르다, 장을 보다, 잠이 들다, 빨래하다, 퇴근하다, 도둑, 낮잠.
