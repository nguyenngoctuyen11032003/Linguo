        - Chỉ trong lúc họp mà có tận năm cuộc gọi nhỡ.
        - Trong lúc họp, có đến năm cuộc gọi nhỡ.
        - Trong lúc tôi đang họp thì có tận 5 cuộc gọi nhỡ.
        - Trong khi họp, có tận năm cuộc gọi nhỡ gọi đến.
        - Trong lúc họp tôi bị nhỡ tận năm cuộc gọi.
        - Trong lúc đang họp thì đã có những năm cuộc gọi nhỡ.
