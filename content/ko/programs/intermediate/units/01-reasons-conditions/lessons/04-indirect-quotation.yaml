    answer:
      accepted:
        - 친구가 주말에 같이 등산하자고 했어요.
        - 친구가 주말에 같이 등산 가자고 했어요.
        - 친구가 주말에 같이 산에 가자고 했어요.
        - 친구가 이번 주말에 같이 등산하자고 했어요.
        - 제 친구가 주말에 같이 등산하자고 했어요.
        - 친구가 주말에 같이 등산하재요.
        - 친구가 주말에 같이 등산 가재요.
        - 친구가 주말에 등산하자고 했어요.
        - 친구가 주말에 등산 가자고 했어요.
        - 친구가 이번 주말에 같이 등산 가자고 했어요.
        - 제 친구가 주말에 같이 등산 가자고 했어요.
        - 친구가 주말에 같이 등산을 하자고 했어요.
        - 친구가 주말에 같이 등산을 가자고 했어요.
        - 친구가 주말에 같이 산에 가재요.
        - 친구가 주말에 같이 등산하자고 해요.
    known_wrong:
      - answer: 친구가 주말에 같이 등산한다고 했어요.
        feedback_vi: -는다고 là câu kể ("bạn nói là sẽ leo núi"). Lời rủ dùng -자고.
        error_tag: jago_vs_dago
      - answer: 친구가 주말에 같이 등산하라고 했어요.
        feedback_vi: -(으)라고 là lời bảo, không phải lời rủ cùng làm. Dùng 등산하자고.
        error_tag: rago_vs_jago
    explanation:
      vi: Lời rủ (같이 등산해요/등산합시다) → -자고 하다, gắn thẳng vào thân - 등산하자고. Rút gọn khi nói là 등산하재요.
    display_answer: 친구가 주말에 같이 등산하자고 했어요.

  # ---------------- application ----------------
  - key: ko:exercise:quotation-mcq-relay
    type: mcq
    stage: application
    answer_lang: ko
    difficulty: 3
    item: ko:item:jeonhada
    prompt:
      stem: "Trưởng nhóm nhắn bạn: \"내일 회의는 3시로 바뀌었어요. 민수 씨에게도 전해 주세요.\" Bạn chuyển lời cho Minsu thế nào?"
      stem_lang: vi
      options:
        - { id: v2j, text: 내일 회의가 3시로 바뀌었대요., lang: ko }
        - { id: c6p, text: 내일 회의가 3시로 바뀌래요., lang: ko }
        - { id: k9n, text: 내일 회의가 3시로 바뀌었냬요., lang: ko }
        - { id: e4h, text: 내일 회의를 3시로 바꾸재요., lang: ko }
    answer:
      correct_option_id: v2j
    explanation:
      vi: Tin nhắn là câu kể ở quá khứ (바뀌었어요) → 바뀌었다고 해요 → 바뀌었대요. -래요 là lời bảo, -냬요 là câu hỏi, -재요 là lời rủ - đều không đúng với câu gốc.
    display_answer: 내일 회의가 3시로 바뀌었대요.

