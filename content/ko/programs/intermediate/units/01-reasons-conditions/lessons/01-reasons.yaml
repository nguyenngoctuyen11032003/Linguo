key: ko:lesson:reasons-aseo-nikka
order_index: 1
level: topik3
title:
  vi: "Vì… nên…: -아서/어서, -(으)니까, -기 때문에"
objectives:
  - vi: Nói lý do bằng -아서/어서 và biết hai giới hạn của nó - không gắn thì quá khứ, không đi với câu mệnh lệnh, rủ rê.
  - vi: Dùng -(으)니까 khi khuyên, rủ, yêu cầu kèm lý do.
  - vi: Giải thích trang trọng hơn bằng -기 때문에 và N 때문에, không thêm 그래서 thừa.
  - vi: Xin lỗi, viện lý do cho những rắc rối hằng ngày - ngủ quên, kẹt xe, máy hỏng, bị cảm.
estimated_minutes: 18
skills: [grammar, speaking, writing]
prerequisites: []
items:
  - item: ko:item:gram-aseo-reason
  - item: ko:item:gram-eunikka
  - item: ko:item:gram-gi-ttaemune
  - item: ko:item:neutjameul-jada
  - item: ko:item:giri-makhida
  - item: ko:item:gojang-nada
  - item: ko:item:gamgie-geollida
  - item: ko:item:jigakada
  - item: ko:item:yaksok
    role: reuse
  - item: ko:item:chwisohada
