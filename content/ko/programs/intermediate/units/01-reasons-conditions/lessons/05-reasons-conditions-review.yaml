  - key: ko:exercise:rc-review-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ko:item:yanghae
    prompt:
      source_text: 공사 때문에 불편을 드려 죄송합니다. 양해 부탁드립니다.
      source_lang: ko
      direction: target_to_vi
    answer:
      accepted:
        - Xin lỗi vì việc thi công gây bất tiện. Mong quý vị thông cảm.
        - Xin lỗi vì thi công gây bất tiện. Mong quý vị thông cảm.
        - Xin lỗi vì đã gây bất tiện do thi công. Mong quý vị thông cảm.
        - Chúng tôi xin lỗi vì thi công gây bất tiện. Mong quý vị thông cảm.
        - Xin lỗi vì việc thi công gây bất tiện. Mong mọi người thông cảm.
        - Xin lỗi vì việc thi công gây bất tiện. Rất mong quý vị thông cảm.
        - Xin lỗi vì công trình gây bất tiện. Mong quý vị thông cảm.
        - Xin lỗi vì sự bất tiện do thi công. Mong quý vị thông cảm.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Vì thi công nên rất tiện lợi. Mong quý vị thông cảm.
        feedback_vi: 불편 là "bất tiện" (불 = bất), không phải tiện lợi.
        error_tag: vocab_bulpyeon
      - answer: Xin lỗi vì việc thi công gây bất tiện. Xin hãy nhờ chúng tôi.
        feedback_vi: 양해 부탁드립니다 là "mong thông cảm", câu kết cố định của thông báo.
        error_tag: vocab_yanghae
    explanation:
      vi: 공사 때문에 = vì thi công; 불편을 드려 죄송합니다 = xin lỗi vì gây bất tiện; 양해 부탁드립니다 = mong quý vị thông cảm.
    display_answer: Xin lỗi vì việc thi công gây bất tiện. Mong quý vị thông cảm.

  - key: ko:exercise:rc-review-translate-matjip
    type: translate
    stage: application
    answer_lang: ko
    difficulty: 4
    item: ko:item:gram-adnominal
    prompt:
      source_text: Quán ăn ngon mà bạn tôi giới thiệu ở gần công ty.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 친구가 추천한 맛집이 회사 근처에 있어요.
        - 친구가 추천한 맛집은 회사 근처에 있어요.
        - 친구가 추천한 식당이 회사 근처에 있어요.
        - 친구가 추천한 식당은 회사 근처에 있어요.
        - 친구가 추천해 준 맛집이 회사 근처에 있어요.
        - 친구가 추천해 준 식당이 회사 근처에 있어요.
        - 친구가 추천한 맛있는 식당이 회사 근처에 있어요.
        - 제 친구가 추천한 맛집이 회사 근처에 있어요.
        - 친구가 추천한 맛집이 회사 가까이에 있어요.
        - 친구가 추천한 맛집이 회사 근처예요.
    known_wrong:
      - answer: 맛집이 친구가 추천한 회사 근처에 있어요.
        feedback_vi: Cụm 친구가 추천한 phải đứng ngay trước 맛집 - 친구가 추천한 맛집.
        error_tag: modifier_order
      - answer: 친구가 추천했는 맛집이 회사 근처에 있어요.
        feedback_vi: Định ngữ quá khứ của động từ là -(으)ㄴ - 추천한, không phải 추천했는.
        error_tag: modifier_tense
    explanation:
      vi: Quán bạn tôi (đã) giới thiệu - 친구가 추천한 맛집 (추천하다 → 추천한, định ngữ quá khứ đứng trước danh từ). Ở gần công ty - 회사 근처에 있어요.
    display_answer: 친구가 추천한 맛집이 회사 근처에 있어요.
