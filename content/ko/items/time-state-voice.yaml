items:
  # ---------------- bài 1: thời điểm ----------------
  - key: ko:item:tv-gram-jamaja
    type: grammar_point
    level: topik3
    difficulty: 3
    skill_tags: [grammar, speaking]
    front:
      text: V-자마자
      romanization: -jamaja
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: vừa… là (ngay)…, ngay sau khi… - hành động sau xảy ra liền ngay khi hành động trước kết thúc.
      examples:
        - target: 비행기가 착륙하자마자 휴대폰을 켰어요.
          translation:
            vi: Máy bay vừa hạ cánh là tôi bật điện thoại ngay.
        - target: 월급을 받자마자 부모님께 용돈을 보내 드렸어요.
          translation:
            vi: Vừa nhận lương là tôi gửi tiền tiêu vặt cho bố mẹ ngay.
      pronunciation_note:
        vi: ㅈ sau patchim căng - 받자마자 [받짜마자], 먹자마자 [먹짜마자].
      confusion:
        vi: -자마자 không bao giờ gắn quá khứ -았/었-; thì của cả câu đặt ở vế sau (도착하자마자 전화했어요, không phải 도착했자마자). Khác -고 나서 (sau khi… rồi), -자마자 nhấn mạnh "ngay lập tức".

  - key: ko:item:tv-gram-neun-dongan
    type: grammar_point
    level: topik3
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: V-는 동안(에) · N 동안
      romanization: -neun dongan(e)
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "trong lúc…, trong suốt thời gian… - hai việc diễn ra song song trong cùng một khoảng thời gian. Với danh từ chỉ thời lượng: 방학 동안, 세 시간 동안."
      examples:
        - target: 아이가 낮잠을 자는 동안 밀린 이메일을 정리했어요.
          translation:
            vi: Trong lúc con ngủ trưa, tôi xử lý đống email tồn đọng.
        - target: 휴가 동안 휴대폰을 거의 보지 않았어요.
          translation:
            vi: Trong suốt kỳ nghỉ tôi gần như không xem điện thoại.
      pronunciation_note:
        vi: 동안에 đọc nối [동아네].
      confusion:
        vi: "-는 동안 luôn dùng -는 (kể cả khi kể chuyện quá khứ) - 기다리는 동안, không viết 기다린 동안. Khác -(으)면서: -(으)면서 là một người làm hai việc cùng lúc; -는 동안 thường là hai chủ thể khác nhau hoặc nhấn mạnh khoảng thời gian."

  - key: ko:item:tv-gram-neun-sai
    type: grammar_point
    level: topik4
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: V-는 사이(에)
      romanization: -neun sai(e)
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "trong lúc (ngắn ngủi, sơ ý)… thì… - một việc (thường bất ngờ) xảy ra chen vào khoảng thời gian ngắn của việc kia. Rút gọn khẩu ngữ: -는 새(에)."
      examples:
        - target: 잠깐 화장실에 간 사이에 버스가 떠났어요.
          translation:
            vi: Chỉ trong lúc tôi đi vệ sinh một chút mà xe buýt đã chạy mất.
        - target: 엄마가 전화를 받는 사이에 아기가 과자를 다 먹어 버렸어요.
          translation:
            vi: Trong lúc mẹ nghe điện thoại, em bé đã ăn sạch bánh kẹo.
      pronunciation_note:
        vi: 사이에 đọc [사이에], khẩu ngữ hay rút thành 새에 [새에].
      confusion:
        vi: "-는 사이에 nhấn mạnh khoảng thời gian ngắn, sơ hở, hay đi với chuyện không mong muốn; -는 동안 trung tính và có thể kéo dài. Với việc đã xong trước đó dùng -(으)ㄴ 사이에 (간 사이에, 잠든 사이에)."

  - key: ko:item:tv-gram-neun-gime
    type: grammar_point
    level: topik4
    difficulty: 4
    skill_tags: [grammar, speaking]
    front:
      text: V-는 김에 · V-(으)ㄴ 김에
      romanization: -neun gime
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "nhân tiện…, tiện thể… - đang làm (hoặc đã làm) việc A thì làm luôn việc B. -는 김에 khi A đang/sắp diễn ra; -(으)ㄴ 김에 khi A đã xảy ra rồi."
      examples:
        - target: 우체국에 가는 김에 은행에도 들를게요.
          translation:
            vi: Tiện đi bưu điện, tôi ghé ngân hàng luôn.
        - target: 서울에 출장 온 김에 대학 친구를 만났어요.
          translation:
            vi: Nhân dịp đi công tác Seoul, tôi gặp bạn đại học.
      pronunciation_note:
        vi: 김에 đọc nối [기메].
      confusion:
        vi: Việc A phải là việc mình định làm thật, việc B là việc thêm vào cho tiện. Tiếng Việt "nhân tiện" đứng đầu câu (nhân tiện, cho tôi hỏi…) - nghĩa đó tiếng Hàn là 그런데 / 참, không phải -는 김에.

  - key: ko:item:tv-deulleuda
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 들르다
      romanization: deulleuda
      pos: động từ
    back:
      meaning:
        vi: ghé qua, tạt vào (một nơi trên đường đi)
      examples:
        - target: 집에 가는 길에 약국에 잠깐 들렀어요.
          translation:
            vi: Trên đường về nhà tôi ghé hiệu thuốc một chút.
      pronunciation_note:
        vi: Bất quy tắc ㅡ (không phải 르!) - 들러요, 들렀어요 [들럳써요].
      confusion:
        vi: Dù kết thúc bằng 르, 들르다 chia theo kiểu ㅡ - 들러요, không viết 들럴러요; cũng không viết 들리다 (đó là "được nghe thấy"). Nơi ghé đi với 에 - 편의점에 들르다.

  - key: ko:item:tv-jangeul-boda
    type: phrase
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 장을 보다
      romanization: jangeul boda
      pos: cụm động từ
    back:
      meaning:
        vi: đi chợ, đi mua thực phẩm
      examples:
        - target: 주말에 대형 마트에서 일주일 치 장을 봐요.
          translation:
            vi: Cuối tuần tôi đi siêu thị lớn mua đồ ăn cho cả tuần.
      pronunciation_note:
        vi: Đọc nối [장을 보다]; 장 có ㅈ không bật hơi.
      confusion:
        vi: 장 là "chợ"; 장을 보다 dùng cả khi đi siêu thị. Không nói 장을 사다 - mua món cụ thể thì là 채소를 사다.

  - key: ko:item:tv-jami-deulda
    type: phrase
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 잠이 들다
      romanization: jami deulda
      pos: cụm động từ
    back:
      meaning:
        vi: chìm vào giấc ngủ, ngủ thiếp đi
      examples:
        - target: 너무 피곤해서 소파에서 그대로 잠이 들었어요.
          translation:
            vi: Mệt quá nên tôi ngủ thiếp đi luôn trên sofa.
      pronunciation_note:
        vi: Đọc nối [자미 들다]; 들다 gốc ㄹ - 잠이 드는 (ㄹ rơi trước ㄴ).
      confusion:
        vi: 자다 là ngủ (trạng thái); 잠이 들다 (hay 잠들다) là khoảnh khắc bắt đầu ngủ. "Mãi không ngủ được" là 잠이 안 와요.

  - key: ko:item:tv-ppallaehada
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 빨래하다
      romanization: ppallaehada
      pos: động từ
    back:
      meaning:
        vi: giặt giũ, giặt quần áo
      examples:
        - target: 날씨가 맑아서 오전에 이불 빨래를 했어요.
          translation:
            vi: Trời nắng đẹp nên buổi sáng tôi giặt chăn.
      pronunciation_note:
        vi: Đọc [빨래하다]; ㅃ căng.
      confusion:
        vi: 빨래 là danh từ (đồ giặt, việc giặt); phơi đồ là 빨래를 널다, gấp đồ là 빨래를 개다. Giặt bằng máy cũng gọi là 빨래하다.

  - key: ko:item:tv-toegeunhada
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 퇴근하다
      romanization: toegeunhada
      pos: động từ
    back:
      meaning:
        vi: tan làm, đi làm về
      examples:
        - target: 오늘은 일이 많아서 아홉 시에 퇴근했어요.
          translation:
            vi: Hôm nay nhiều việc nên 9 giờ tôi mới tan làm.
      pronunciation_note:
        vi: Đọc [퇴근하다]; ㅚ gần như [웨].
      confusion:
        vi: Ngược với 출근하다 (đi làm). 퇴근하다 là tan làm hằng ngày; nghỉ hẳn công ty là 퇴사하다.

  - key: ko:item:tv-doduk
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 도둑
      romanization: doduk
      pos: danh từ
    back:
      meaning:
        vi: kẻ trộm
      examples:
        - target: 어젯밤에 옆 가게에 도둑이 들었대요.
          translation:
            vi: Nghe nói đêm qua cửa hàng bên cạnh bị trộm vào.
      pronunciation_note:
        vi: Đọc [도둑]; patchim ㄱ cuối đọc tắc.
      confusion:
        vi: '"Bị trộm vào nhà" nói 도둑이 들다; "bị mất cắp đồ" là 도둑을 맞다. 소매치기 là kẻ móc túi.'

  - key: ko:item:tv-natjam
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 낮잠
      romanization: natjam
      pos: danh từ
    back:
      meaning:
        vi: giấc ngủ trưa, ngủ ngày
      examples:
        - target: 점심을 먹고 삼십 분쯤 낮잠을 자면 오후가 덜 피곤해요.
          translation:
            vi: Ăn trưa xong ngủ khoảng 30 phút thì buổi chiều đỡ mệt hơn.
      pronunciation_note:
        vi: Đọc [낟짬] - ㅈ sau patchim căng thành ㅉ.
      confusion:
        vi: 낮 là ban ngày, 낮잠 là ngủ ban ngày (không chỉ buổi trưa). Động từ đi kèm là 자다 - 낮잠을 자다.

  # ---------------- bài 2: trạng thái ----------------
  - key: ko:item:tv-gram-a-itda
    type: grammar_point
    level: topik3
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: V-아/어 있다 (trạng thái)
      romanization: -a/eo itda
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "đang ở trạng thái… (kết quả của một hành động vẫn còn): 문이 열려 있어요 (cửa đang mở), 의자에 앉아 있어요 (đang ngồi). Dùng với động từ không có tân ngữ: 앉다, 서다, 눕다, 남다, 붙다, 열리다, 켜지다…"
      examples:
        - target: 냉장고에 어제 만든 반찬이 조금 남아 있어요.
          translation:
            vi: Trong tủ lạnh vẫn còn một ít món ăn kèm làm hôm qua.
        - target: 할아버지는 하루 종일 침대에 누워 계세요.
          translation:
            vi: Ông nằm trên giường cả ngày.
      pronunciation_note:
        vi: 열려 있어요 [열려 이써요]; 앉아 있어요 [안자 이써요].
      confusion:
        vi: "-고 있다 là hành động đang diễn ra (문을 열고 있어요 - đang mở cửa); -아/어 있다 là trạng thái sau khi hành động xong (문이 열려 있어요 - cửa đang mở sẵn). Kính ngữ: -아/어 계시다. Không dùng với động từ có tân ngữ - không nói 문을 열어 있어요."

  - key: ko:item:tv-gram-eun-chae
    type: grammar_point
    level: topik4
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: V-(으)ㄴ 채(로)
      romanization: -(eu)n chae(ro)
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "giữ nguyên trạng thái… mà (làm việc khác) - thường là trạng thái không bình thường: 불을 켠 채로 잤어요 (để nguyên đèn mà ngủ)."
      examples:
        - target: 신발을 신은 채로 방에 들어오면 안 돼요.
          translation:
            vi: Không được đi nguyên giày vào phòng.
        - target: 창문을 열어 놓은 채 외출해서 방에 먼지가 가득했어요.
          translation:
            vi: Tôi để nguyên cửa sổ mở rồi ra ngoài nên phòng đầy bụi.
      pronunciation_note:
        vi: 채로 đọc [채로]; 신은 채로 [시는 채로].
      confusion:
        vi: "Luôn dùng định ngữ quá khứ -(으)ㄴ (켠 채, 입은 채) vì trạng thái đã hình thành rồi; không nói 켜는 채. Phủ định thường không dùng 안 trước - nói 아무것도 먹지 않은 채 (không ăn gì mà…)."

  - key: ko:item:tv-gram-daesine
    type: grammar_point
    level: topik3
    difficulty: 3
    skill_tags: [grammar, speaking]
    front:
      text: N 대신(에) · V-는 대신(에)
      romanization: daesin(e) · -neun daesin(e)
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "thay cho N, thay vì… (N 대신, V-는 대신); hoặc bù lại, đổi lại… (이 집은 좁은 대신 월세가 싸요 - nhà chật nhưng bù lại rẻ)."
      examples:
        - target: 오늘은 쌀밥 대신 현미밥을 먹었어요.
          translation:
            vi: Hôm nay tôi ăn cơm gạo lứt thay cho cơm trắng.
        - target: 주말에 일하는 대신 평일에 하루 쉬어요.
          translation:
            vi: Đổi lại việc làm cuối tuần, tôi được nghỉ một ngày trong tuần.
      pronunciation_note:
        vi: 대신에 đọc nối [대시네].
      confusion:
        vi: "\"Làm thay cho ai\" là N 대신 - 팀장님 대신 제가 발표했어요. Nghĩa \"bù lại\" với tính từ dùng -(으)ㄴ 대신 (비싼 대신 품질이 좋아요). Người Việt hay đặt 대신 sau động từ chia sẵn (먹어요 대신) - phải đổi động từ thành định ngữ -는."

  - key: ko:item:tv-nupda
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 눕다
      romanization: nupda
      pos: động từ
    back:
      meaning:
        vi: nằm
      examples:
        - target: 허리가 아파서 바닥에 잠깐 누웠어요.
          translation:
            vi: Đau lưng nên tôi nằm xuống sàn một lát.
      pronunciation_note:
        vi: Đọc [눕따]; bất quy tắc ㅂ - 누워요, 누워 있어요.
      confusion:
        vi: Là động từ hiếm hoi có ㅂ bất quy tắc (đa số là tính từ). "Đang nằm" (trạng thái) là 누워 있다, không phải 눕고 있다.

  - key: ko:item:tv-sinda
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 신다
      romanization: sinda
      pos: động từ
    back:
      meaning:
        vi: đi, mang (giày, dép, tất)
      examples:
        - target: 오늘은 많이 걸어야 하니까 편한 운동화를 신으세요.
          translation:
            vi: Hôm nay phải đi bộ nhiều nên hãy đi giày thể thao thoải mái nhé.
      pronunciation_note:
        vi: Đọc [신따], 신고 [신꼬] - âm sau patchim ㄴ của động từ căng lên.
      confusion:
        vi: 'Tiếng Việt dùng "đi/mang" cho giày, tiếng Hàn tách riêng: 신다 (giày, tất), 입다 (quần áo), 쓰다 (mũ, kính), 끼다 (găng, nhẫn). Cởi giày là 벗다.'

  - key: ko:item:tv-kyeojida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 켜지다
      romanization: kyeojida
      pos: động từ
    back:
      meaning:
        vi: (đèn, máy) bật lên, sáng lên (tự động, không có người làm)
      examples:
        - target: 사람이 지나가면 복도 불이 자동으로 켜져요.
          translation:
            vi: Có người đi qua là đèn hành lang tự bật.
      pronunciation_note:
        vi: 켜져요 đọc [켜저요]; ㅋ bật hơi.
      confusion:
        vi: 켜다 (bật - có tân ngữ, có người làm) và 켜지다 (bật lên - chủ ngữ là đèn/máy). Trạng thái "đang bật" là 켜져 있다 - 불이 켜져 있어요.

  - key: ko:item:tv-kkeojida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 꺼지다
      romanization: kkeojida
      pos: động từ
    back:
      meaning:
        vi: (đèn, máy, lửa) tắt (tự tắt)
      examples:
        - target: 배터리가 없어서 휴대폰이 갑자기 꺼졌어요.
          translation:
            vi: Hết pin nên điện thoại đột nhiên tắt ngúm.
      pronunciation_note:
        vi: 꺼져요 [꺼저요]; ㄲ căng.
      confusion:
        vi: 끄다 là "tắt (cái gì)", 꺼지다 là "(cái gì) tắt". Cẩn thận - 꺼져! nói với người là câu chửi "biến đi".

  - key: ko:item:tv-butda
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 붙다
      romanization: butda
      pos: động từ
    back:
      meaning:
        vi: dính, được dán; (thi) đỗ
      examples:
        - target: 엘리베이터 안에 공사 안내문이 붙어 있어요.
          translation:
            vi: Trong thang máy có dán thông báo thi công.
      pronunciation_note:
        vi: Đọc [붇따]; 붙어 있어요 nối âm [부터 이써요].
      confusion:
        vi: 붙이다 là "dán (cái gì)" - có tân ngữ; 붙다 là "(cái gì) dính, được dán". Khẩu ngữ 시험에 붙다 = thi đỗ (ngược là 떨어지다).

  - key: ko:item:tv-namda
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 남다
      romanization: namda
      pos: động từ
    back:
      meaning:
        vi: còn lại, thừa ra
      examples:
        - target: 회의 시작까지 십 분 남았어요.
          translation:
            vi: Còn mười phút nữa là cuộc họp bắt đầu.
      pronunciation_note:
        vi: Đọc [남따]; 남아요 nối âm [나마요].
      confusion:
        vi: 남다 là động từ - "còn lại" thường chia quá khứ 남았어요 hoặc trạng thái 남아 있어요. "Để lại" (có tân ngữ) là 남기다 - 음식을 남기다.

  # ---------------- bài 3: bị động ----------------
  - key: ko:item:tv-gram-passive
    type: grammar_point
    level: topik3
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: Bị động -이/히/리/기 (보이다, 닫히다, 열리다, 안기다)
      romanization: pidong -i/hi/ri/gi
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Động từ bị động - chủ ngữ là người/vật chịu tác động: 문을 닫다 → 문이 닫히다. Thêm -이- (보이다, 놓이다), -히- (닫히다, 잡히다, 막히다), -리- (열리다, 팔리다, 들리다), -기- (안기다, 쫓기다). Người/vật gây ra hành động đi với 에게/한테 (người, động vật) hoặc 에 (vật, sự việc)."
      examples:
        - target: 바람에 창문이 갑자기 닫혔어요.
          translation:
            vi: Cửa sổ đột nhiên đóng sập vì gió.
        - target: 소매치기가 경찰에게 잡혔어요.
          translation:
            vi: Tên móc túi đã bị cảnh sát bắt.
      pronunciation_note:
        vi: ㅎ trong -히- hoà vào phụ âm trước - 닫히다 [다치다], 잡히다 [자피다], 막히다 [마키다].
      confusion:
        vi: "Tiếng Việt thêm \"bị/được\" trước động từ, nên người Việt hay nghĩ tiếng Hàn cũng có một từ chung. Thực ra mỗi động từ có hậu tố riêng, phải học thuộc theo từ; nhiều động từ (주다, 만나다, 공부하다…) không có dạng -이/히/리/기. Bị động văn viết với 되다 / -아/어지다 là mẫu khác, học ở trình độ cao hơn."

  - key: ko:item:tv-boida
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: 보이다
      romanization: boida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được nhìn thấy, trông thấy được (보다 → 보이다)
      examples:
        - target: 우리 집 창문에서 남산타워가 보여요.
          translation:
            vi: Từ cửa sổ nhà tôi nhìn thấy được tháp Namsan.
      pronunciation_note:
        vi: 보여요 đọc [보여요].
      confusion:
        vi: Thứ được thấy là chủ ngữ với 이/가 - 산이 보여요, không phải 산을 보여요. Cùng hình thức 보이다 còn có nghĩa "cho xem" (사진을 보여 주다) và "trông có vẻ" (A-아/어 보이다).

  - key: ko:item:tv-deullida
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary, listening]
    front:
      text: 들리다
      romanization: deullida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được nghe thấy, nghe thấy được (듣다 → 들리다)
      examples:
        - target: 옆방에서 기타 치는 소리가 들려요.
          translation:
            vi: Nghe thấy tiếng đàn guitar từ phòng bên.
      pronunciation_note:
        vi: 들려요 đọc [들려요].
      confusion:
        vi: 들리다 dùng khi âm thanh tự đến tai (không cố ý); 듣다 là chủ động lắng nghe. "Nghe không rõ" khi gọi điện - 잘 안 들려요. Đừng nhầm với 들르다 (ghé qua) - 들러요.

  - key: ko:item:tv-noida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 놓이다
      romanization: noida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được đặt, được để (ở đâu) (놓다 → 놓이다)
      examples:
        - target: 현관 앞에 택배 상자가 놓여 있었어요.
          translation:
            vi: Trước cửa có đặt sẵn một thùng hàng chuyển phát.
      pronunciation_note:
        vi: Đọc [노이다] - ㅎ câm; 놓여 [노여].
      confusion:
        vi: Rất hay đi với -아/어 있다 để tả vị trí đồ vật - 책상 위에 꽃병이 놓여 있어요. Ai đó đặt vào thì dùng 놓다 - 꽃병을 놓았어요.

  - key: ko:item:tv-dachida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 닫히다
      romanization: dachida
      pos: động từ (bị động)
    back:
      meaning:
        vi: bị đóng, đóng lại (닫다 → 닫히다)
      examples:
        - target: 지하철 문이 닫히기 직전에 겨우 탔어요.
          translation:
            vi: Tôi lên được tàu điện ngầm ngay trước khi cửa đóng lại.
      pronunciation_note:
        vi: Đọc [다치다] - ㄷ + ㅎ thành ㅊ.
      confusion:
        vi: Phát âm [다치다] giống hệt 다치다 (bị thương) nhưng viết khác. Cửa hàng "đóng cửa" (hết giờ) thường nói 문을 닫다 hoặc 문이 닫혀 있다.

  - key: ko:item:tv-yeollida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 열리다
      romanization: yeollida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được mở, mở ra; (sự kiện) được tổ chức (열다 → 열리다)
      examples:
        - target: 이번 주말에 시청 앞에서 벼룩시장이 열려요.
          translation:
            vi: Cuối tuần này có chợ đồ cũ được tổ chức trước toà thị chính.
      pronunciation_note:
        vi: 열려요 đọc [열려요].
      confusion:
        vi: Ngoài "cửa mở ra", 열리다 còn là "(hội chợ, lễ hội, cuộc họp) được tổ chức" - 축제가 열리다. Không nói 축제가 열어요.

  - key: ko:item:tv-japida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 잡히다
      romanization: japida
      pos: động từ (bị động)
    back:
      meaning:
        vi: bị bắt, bị tóm (잡다 → 잡히다)
      examples:
        - target: 편의점에서 물건을 훔친 범인이 한 시간 만에 잡혔어요.
          translation:
            vi: Kẻ trộm đồ ở cửa hàng tiện lợi đã bị bắt chỉ sau một tiếng.
      pronunciation_note:
        vi: Đọc [자피다] - ㅂ + ㅎ thành ㅍ.
      confusion:
        vi: Người bắt đi với 에게/한테 - 경찰에게 잡히다. Khẩu ngữ 약속이 잡히다 = cuộc hẹn được lên lịch.

  - key: ko:item:tv-pallida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 팔리다
      romanization: pallida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được bán, bán được (팔다 → 팔리다)
      examples:
        - target: 그 가수의 새 앨범이 하루 만에 십만 장이나 팔렸어요.
          translation:
            vi: Album mới của ca sĩ đó bán được tận một trăm nghìn bản chỉ trong một ngày.
      pronunciation_note:
        vi: 팔려요 [팔려요]; ㅍ bật hơi.
      confusion:
        vi: '"Bán chạy" là 잘 팔리다; "hết hàng" là 다 팔리다 hoặc 매진되다. Không nói 잘 팔아요 khi chủ ngữ là sản phẩm.'

  - key: ko:item:tv-angida
    type: vocab
    level: topik4
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 안기다
      romanization: angida
      pos: động từ (bị động)
    back:
      meaning:
        vi: được ôm, nằm trong vòng tay (안다 → 안기다)
      examples:
        - target: 아기가 엄마 품에 안겨서 곤히 자고 있어요.
          translation:
            vi: Em bé nằm trong vòng tay mẹ ngủ ngon lành.
      pronunciation_note:
        vi: Đọc [안기다].
      confusion:
        vi: Người ôm đi với 에게/한테 hoặc N 품에 - 아빠에게 안기다. 안기다 còn có nghĩa sai khiến "đưa cho ai bế" (아기를 할머니께 안기다) - phân biệt theo ngữ cảnh.

  - key: ko:item:tv-jjotgida
    type: vocab
    level: topik4
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: 쫓기다
      romanization: jjotgida
      pos: động từ (bị động)
    back:
      meaning:
        vi: bị đuổi, bị rượt; bị (thời gian, công việc) dồn ép (쫓다 → 쫓기다)
      examples:
        - target: 요즘 마감에 쫓겨서 주말에도 쉬지 못해요.
          translation:
            vi: Dạo này bị hạn chót dồn nên cuối tuần cũng không nghỉ được.
      pronunciation_note:
        vi: Đọc [쫃끼다] - ㄱ sau patchim căng.
      confusion:
        vi: Nghĩa bóng rất hay dùng - 시간에 쫓기다 (bị thời gian dí), 일에 쫓기다. Kẻ đuổi là người/vật thì dùng 에게, là sự việc thì dùng 에.

  # ---------------- bài 4: sai khiến ----------------
  - key: ko:item:tv-gram-ge-hada
    type: grammar_point
    level: topik3
    difficulty: 3
    skill_tags: [grammar, speaking]
    front:
      text: V/A-게 하다
      romanization: -ge hada
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "bắt/cho/khiến (ai) làm…, làm cho… - người được sai khiến đi với 을/를 hoặc 에게/한테: 아이에게 채소를 먹게 했어요."
      examples:
        - target: 선생님은 학생들에게 매일 일기를 쓰게 하셨어요.
          translation:
            vi: Thầy giáo bắt học sinh viết nhật ký mỗi ngày.
        - target: 늦게 연락해서 걱정하게 해서 미안해요.
          translation:
            vi: Xin lỗi vì báo muộn khiến bạn phải lo.
      pronunciation_note:
        vi: 게 sau patchim căng - 먹게 [먹께], 읽게 [일께].
      confusion:
        vi: "-게 하다 dùng được với hầu hết động từ, còn sai khiến từ vựng (먹이다, 입히다…) chỉ có ở một số từ. Hai cách có sắc thái khác: 먹이다 là tự tay cho ăn, 먹게 하다 là để/bắt người kia tự ăn. Đừng nhầm với -게 되다 (trở nên, rốt cuộc)."

  - key: ko:item:tv-gram-causative
    type: grammar_point
    level: topik4
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: Sai khiến -이/히/리/기/우/추 (먹이다, 입히다, 태우다)
      romanization: sadong -i/hi/ri/gi/u/chu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Động từ sai khiến - làm cho người/vật khác làm hoặc trở nên…: 먹다 → 먹이다 (cho ăn), 입다 → 입히다 (mặc cho), 울다 → 울리다 (làm khóc), 씻다 → 씻기다 (tắm cho), 타다 → 태우다 (chở, cho lên xe), 낮다 → 낮추다 (hạ thấp)."
      examples:
        - target: 엄마가 아이에게 따뜻한 옷을 입혔어요.
          translation:
            vi: Mẹ mặc áo ấm cho con.
        - target: 소리가 너무 커요. 볼륨 좀 낮춰 주세요.
          translation:
            vi: Tiếng to quá. Vặn nhỏ âm lượng giúp tôi với.
      pronunciation_note:
        vi: 입히다 [이피다], 앉히다 [안치다], 먹이다 [머기다], 웃기다 [욷끼다].
      confusion:
        vi: "Một số từ trùng hình thức với bị động (보이다 - được thấy / cho xem; 안기다 - được ôm / đưa cho bế); phân biệt nhờ có tân ngữ hay không. Như bị động, mỗi động từ có hậu tố riêng - không tự tạo từ mới, khi không chắc hãy dùng -게 하다."

  - key: ko:item:tv-meogida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 먹이다
      romanization: meogida
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: cho ăn, cho uống (thuốc) (먹다 → 먹이다)
      examples:
        - target: 고양이한테 하루에 두 번 사료를 먹여요.
          translation:
            vi: Tôi cho mèo ăn thức ăn hạt hai lần một ngày.
      pronunciation_note:
        vi: Đọc [머기다]; 먹여요 [머겨요].
      confusion:
        vi: Người/con vật được cho ăn đi với 에게/한테, món ăn đi với 을/를 - 아이에게 죽을 먹이다. Cho uống thuốc cũng dùng 약을 먹이다.

  - key: ko:item:tv-iphida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 입히다
      romanization: iphida
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: mặc (quần áo) cho ai (입다 → 입히다)
      examples:
        - target: 오늘은 쌀쌀하니까 아이에게 두꺼운 외투를 입히세요.
          translation:
            vi: Hôm nay se lạnh nên hãy mặc áo khoác dày cho con.
      pronunciation_note:
        vi: Đọc [이피다] - ㅂ + ㅎ thành ㅍ.
      confusion:
        vi: Mang giày cho ai là 신기다, đội mũ cho ai là 씌우다 - mỗi động từ "mặc/mang" có dạng sai khiến riêng.

  - key: ko:item:tv-anchida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 앉히다
      romanization: anchida
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: cho ngồi, đặt (ai) ngồi xuống (앉다 → 앉히다)
      examples:
        - target: 아이를 유아용 의자에 앉히고 안전벨트를 채웠어요.
          translation:
            vi: Tôi đặt bé ngồi vào ghế trẻ em rồi cài dây an toàn.
      pronunciation_note:
        vi: Đọc [안치다] - ㅈ + ㅎ thành ㅊ.
      confusion:
        vi: Hay dùng với trẻ nhỏ, người già cần giúp. Mời khách ngồi thì nói lịch sự 앉으세요, không dùng 앉히다.

  - key: ko:item:tv-ullida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 울리다
      romanization: ullida
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: làm (ai) khóc (울다 → 울리다); (chuông, điện thoại) reo
      examples:
        - target: 그 영화 마지막 장면이 관객들을 울렸어요.
          translation:
            vi: Cảnh cuối của bộ phim đó đã làm khán giả bật khóc.
      pronunciation_note:
        vi: Đọc [울리다], ㄹㄹ đọc như "l" dài.
      confusion:
        vi: Có tân ngữ (사람을 울리다) là "làm khóc"; không có tân ngữ (전화가 울리다) là "reo". Nghĩa phụ thuộc vào câu.

  - key: ko:item:tv-utgida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 웃기다
      romanization: utgida
      pos: động từ (sai khiến) / tính từ
    back:
      meaning:
        vi: làm (ai) cười (웃다 → 웃기다); (tính từ, khẩu ngữ) buồn cười, hài hước
      examples:
        - target: 동생이 재미있는 표정으로 할머니를 웃겼어요.
          translation:
            vi: Em tôi làm mặt hài khiến bà bật cười.
      pronunciation_note:
        vi: Đọc [욷끼다]; 웃겨요 [욷껴요].
      confusion:
        vi: 그 사람 정말 웃겨요 có thể là "người đó hài thật" hoặc (mỉa mai) "người đó thật nực cười" - nghe giọng để hiểu. Khen ai hài hước một cách lịch sự thì dùng 재미있다.

  - key: ko:item:tv-ssitgida
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 씻기다
      romanization: ssitgida
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: tắm cho, rửa cho (ai) (씻다 → 씻기다)
      examples:
        - target: 저녁마다 남편이 아이를 씻기고 제가 재워요.
          translation:
            vi: Tối nào chồng tôi cũng tắm cho con, còn tôi ru con ngủ.
      pronunciation_note:
        vi: Đọc [씯끼다] - ㄱ sau patchim căng.
      confusion:
        vi: Tự tắm là 씻다 / 샤워하다; tắm cho em bé, thú cưng là 씻기다. 재우다 (ru ngủ, cho ngủ) cũng là sai khiến của 자다.

  - key: ko:item:tv-taeuda
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 태우다
      romanization: taeuda
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: chở, cho (ai) lên xe (타다 → 태우다); làm cháy, đốt
      examples:
        - target: 퇴근길에 동료를 집 앞까지 차로 태워 줬어요.
          translation:
            vi: Trên đường tan làm tôi chở đồng nghiệp về tận trước nhà.
      pronunciation_note:
        vi: 태워요 đọc [태워요].
      confusion:
        vi: '"Chở ai đi" thường là 태워 주다 / 태워다 주다. Nghĩa "làm cháy" cũng là 태우다 - 고기를 태웠어요 (làm cháy thịt).'

  - key: ko:item:tv-kkaeuda
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 깨우다
      romanization: kkaeuda
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: đánh thức (깨다 → 깨우다)
      examples:
        - target: 내일 아침 여섯 시에 꼭 깨워 주세요.
          translation:
            vi: Sáng mai nhất định đánh thức tôi lúc 6 giờ nhé.
      pronunciation_note:
        vi: 깨워요 [깨워요]; ㄲ căng.
      confusion:
        vi: 깨다 là tự tỉnh dậy (잠이 깨다), 깨우다 là đánh thức người khác. 일어나다 là thức dậy, ngồi dậy.

  - key: ko:item:tv-natchuda
    type: vocab
    level: topik4
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 낮추다
      romanization: natchuda
      pos: động từ (sai khiến)
    back:
      meaning:
        vi: hạ thấp, giảm (âm lượng, nhiệt độ, giá) (낮다 → 낮추다)
      examples:
        - target: 여름에는 에어컨 온도를 너무 낮추지 마세요.
          translation:
            vi: Mùa hè đừng hạ nhiệt độ điều hoà thấp quá.
      pronunciation_note:
        vi: Đọc [낟추다]; 낮춰요 [낟춰요].
      confusion:
        vi: Ngược nghĩa là 높이다 (nâng cao). 말을 낮추다 là chuyển sang nói 반말 với ai - 말씀 낮추세요 (anh cứ nói trống không với em).

  # ---------------- bài 5: ôn tập ----------------
  - key: ko:item:tv-eorinijip
    type: vocab
    level: topik3
    difficulty: 2
    skill_tags: [vocabulary, culture]
    front:
      text: 어린이집
      romanization: eorinijip
      pos: danh từ
    back:
      meaning:
        vi: nhà trẻ (cho trẻ dưới tuổi mẫu giáo)
      examples:
        - target: 아침 여덟 시에 아이를 어린이집에 맡기고 출근해요.
          translation:
            vi: 8 giờ sáng tôi gửi con ở nhà trẻ rồi đi làm.
      pronunciation_note:
        vi: Đọc [어리니집].
      confusion:
        vi: 어린이집 nhận trẻ nhỏ (thường 0-5 tuổi); 유치원 là trường mẫu giáo (3-5 tuổi, thiên về giáo dục). "Gửi con" là 아이를 맡기다.

  - key: ko:item:tv-isatjim
    type: vocab
    level: topik3
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: 이삿짐
      romanization: isatjim
      pos: danh từ
    back:
      meaning:
        vi: đồ đạc chuyển nhà
      examples:
        - target: 이삿짐 센터 직원들이 오전 아홉 시에 오기로 했어요.
          translation:
            vi: Nhân viên công ty chuyển nhà hẹn 9 giờ sáng đến.
      pronunciation_note:
        vi: Đọc [이사찜 / 이삳찜] - ㅅ (사이시옷) làm ㅈ căng lên.
      confusion:
        vi: Có ㅅ chen giữa 이사 và 짐 (사이시옷) nên viết 이삿짐, không viết 이사짐. "Đóng đồ chuyển nhà" là 이삿짐을 싸다, "dỡ đồ" là 이삿짐을 풀다.
