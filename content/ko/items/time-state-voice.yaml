# Học liệu unit "Thời điểm, trạng thái, bị động & sai khiến" (TOPIK 3-4). Phiên âm Latinh theo Romanization chuẩn của Hàn Quốc, chỉ để tham khảo.
# Key dùng tiền tố tv- để không trùng với unit khác. -고 있다 và 길이 막히다 đã có ở unit trước; bị động văn viết (되다 / -아/어지다) thuộc chương trình cao cấp - ở đây chỉ dạy bị động từ vựng -이/히/리/기.
schema_version: 1
demo: false
