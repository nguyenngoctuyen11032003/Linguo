    difficulty: 3
    skill_tags: [vocabulary, reading]
    front:
      text: 안건
      romanization: angeon
      pos: danh từ
    back:
      meaning:
        vi: vấn đề cần bàn, nội dung nghị sự (của cuộc họp)
      examples:
        - target: 오늘 회의 안건은 두 가지입니다.
          translation:
