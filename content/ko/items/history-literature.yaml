# DEMO — chưa kiểm duyệt
# Học liệu unit "Lịch sử, văn học & ngôn ngữ trang trọng" (TOPIK 6). Phiên âm Latinh theo Romanization chuẩn của Hàn Quốc, chỉ để tham khảo.
schema_version: 1
demo: true
status: published
reviewed_by: null
