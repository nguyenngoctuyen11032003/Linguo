      pos: liên từ
    back:
      meaning:
        vi: nhưng
      examples:
        - target: やすいです。でも、おいしくないです。
          translation:
            vi: Rẻ. Nhưng không ngon.
      confusion:
        vi: でも đầu câu là "nhưng"; でも sau danh từ lại là "ngay cả/hoặc" (おちゃでも - trà chẳng hạn).
  - key: ja:item:n5-u17-dakara
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: だから
      romanization: dakara
      pos: liên từ
    back:
      meaning:
        vi: vì vậy, cho nên
      examples:
        - target: あめです。だから、かさをもっていきます。
          translation:
            vi: Trời mưa. Vì vậy tôi mang ô.
  - key: ja:item:n5-u17-mou-mada
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: もう V ました / まだ V ていません
      romanization: mou V-mashita / mada V-te imasen
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Hỏi và nói đã làm chưa: もう + V ました (đã ... rồi), まだ + V ていません (vẫn chưa ...). Hỏi - もう V ましたか; đáp - はい、もう V ました / いいえ、まだです."
      examples:
        - target: もうたべましたか。- いいえ、まだです。
          translation:
            vi: Bạn đã ăn chưa? - Chưa, vẫn chưa.
        - target: しゅくだいはもうしましたか。
          translation:
            vi: Bạn đã làm bài tập chưa?
      confusion:
        vi: Đáp ngắn - いいえ、まだです (không nói いいえ、しません). Hình thức ていません học kỹ ở N4.
