      examples:
        - target: コーヒーをにはいのみます。
          translation:
            vi: Tôi uống hai tách cà phê.
      pronunciation_note:
        vi: いっぱい, にはい, さんばい, よんはい... biến âm ぱ, は, ば. いっぱい còn có nghĩa "đầy, no".
  - key: ja:item:n5-u18-kai-floor
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 階
      reading: かい
      romanization: kai
      pos: trợ từ đếm
    back:
