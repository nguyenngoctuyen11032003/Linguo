      pronunciation_note:
        vi: いっかい, にかい, さんがい, よんかい, ごかい... さんがい biến âm; lưu ý khác ～かい (回, lần).
  - key: ja:item:n5-u18-ban-number
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 番
      reading: ばん
      romanization: ban
      pos: trợ từ đếm
    back:
      meaning:
        vi: ～số (thứ tự, số hiệu)
      examples:
        - target: ３ばんせんからでんしゃがでます。
          translation:
            vi: Tàu khởi hành từ sân ga số 3.
      pronunciation_note:
        vi: なんばん - số mấy; いちばん - số một / nhất.
  - key: ja:item:n5-u18-ko-counter
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 個
      reading: こ
      romanization: ko
      pos: trợ từ đếm
    back:
      meaning:
        vi: ～cái (vật nhỏ, tròn)
      examples:
        - target: りんごをみっつかいました。
          translation:
            vi: Tôi đã mua ba quả táo.
      pronunciation_note:
        vi: いっこ, にこ, さんこ, よんこ, ごこ...
  - key: ja:item:n5-u18-shuukan
    type: vocab
    level: n5
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: 週間
      reading: しゅうかん
      romanization: shuukan
      pos: trợ từ đếm
    back:
      meaning:
        vi: ～tuần (khoảng thời gian)
      examples:
        - target: いっしゅうかんやすみます。
          translation:
            vi: Tôi nghỉ một tuần.
      confusion:
        vi: しゅう (週) là tuần trong lịch; しゅうかん (週間) là khoảng thời gian tuần. らいしゅう (tuần sau) ≠ らいしゅうかん.
  - key: ja:item:n5-u18-kagetsu
    type: vocab
    level: n5
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: か月
      reading: かげつ
      romanization: kagetsu
      pos: trợ từ đếm
    back:
      meaning:
        vi: ～tháng (khoảng thời gian)
      examples:
        - target: にほんにさんかげつすみます。
          translation:
            vi: Tôi sống ở Nhật ba tháng.
      confusion:
        vi: がつ chỉ tháng trong lịch (３がつ - tháng 3); かげつ chỉ khoảng thời gian (３かげつ - ba tháng).
  - key: ja:item:n5-u18-nen-duration
