            vi: Lúc đầu thì khó.
  - key: ja:item:n5-u18-saigo
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 最後
      reading: さいご
      romanization: saigo
      pos: danh từ
    back:
