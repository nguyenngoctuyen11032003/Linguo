      confusion:
        vi: こんど vừa là "lần này" vừa là "lần sau", ngữ cảnh cho biết nghĩa (こんどのにちようび - chủ nhật tới).
  - key: ja:item:n5-u18-mousugu
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: もうすぐ
      romanization: mousugu
      pos: phó từ
    back:
      meaning:
        vi: sắp, chẳng bao lâu nữa
      examples:
        - target: もうすぐなつやすみです。
          translation:
