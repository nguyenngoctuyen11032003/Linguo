  - key: ja:item:n5-u18-kondo
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 今度
      reading: こんど
      romanization: kondo
      pos: danh từ
    back:
      meaning:
        vi: lần này; lần tới
      examples:
