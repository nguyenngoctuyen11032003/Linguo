          translation:
            vi: Tôi mua ba quyển sách.
      pronunciation_note:
        vi: いっさつ, にさつ, さんさつ, よんさつ, ごさつ... いっ là âm ngắt.
  - key: ja:item:n5-u18-hiki
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
