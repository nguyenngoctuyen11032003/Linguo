      reading: ねん
      romanization: nen
      pos: trợ từ đếm
    back:
      meaning:
        vi: ～năm (khoảng thời gian, tên năm)
      examples:
        - target: にほんごをにねんべんきょうしました。
          translation:
            vi: Tôi đã học tiếng Nhật hai năm.
      pronunciation_note:
        vi: いちねん, にねん, さんねん, よねん (không phải よんねん), ごねん...
  - key: ja:item:n5-u18-hajimete
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 初めて
