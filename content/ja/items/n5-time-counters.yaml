    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: まず
      romanization: mazu
      pos: phó từ
    back:
      meaning:
        vi: trước tiên
      examples:
        - target: まずおふろにはいります。
          translation:
