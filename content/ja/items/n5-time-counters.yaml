  - key: ja:item:n5-u18-tsugi
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 次
      reading: つぎ
      romanization: tsugi
      pos: danh từ
    back:
      meaning:
        vi: tiếp theo, kế tiếp
      examples:
        - target: つぎのえきでおります。
