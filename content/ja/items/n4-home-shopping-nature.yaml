  - key: ja:item:n4-u10-gram-hodo-kurai
    type: grammar_point
    level: n4
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: N / V辞書形 + ほど / ぐらい (くらい)
      romanization: N hodo / gurai
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Cỡ, mức, đến mức (ước lượng mức độ). ぐらい chỉ ước lượng số lượng/thời gian (一時間ぐらい); ほど nhấn mạnh mức độ, hay đi với phủ định (～ほど～ない).
      examples:
        - target: 駅から十分ぐらいかかります。
          translation:
            vi: Từ ga mất khoảng 10 phút.
        - target: 昨日ほど寒くないです。
          translation:
            vi: Không lạnh bằng hôm qua.
      confusion:
        vi: "ぐらい = ước lượng; ほど = mức độ (A は B ほど ～ない: A không ... bằng B)."
