# Học liệu unit "Khẩu ngữ, bổ sung ý và giả định" (JLPT N3). reading là cách đọc kana (furigana); romanization theo Hepburn, chỉ để tham khảo.
schema_version: 1
demo: false
status: published
reviewed_by: Claude Sonnet 5.5 (AI) — ủy quyền bởi Nguyễn Ngọc Tuyền
reviewed_at: 2026-10-21T12:00:00+07:00
source: src:linguo-demo
items:
  - key: ja:item:n3-u10-gram-toku
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: V て + おく → V とく / V で + おく → V どく
      romanization: V-toku / V-doku
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Dạng rút gọn khẩu ngữ của ～ておく (làm sẵn). Ví dụ 買っておく → 買っとく, 読んでおく → 読んどく.
      examples:
        - target: 先に切符を買っとくね。
          translation:
            vi: Mình mua vé trước nhé.
        - target: この本、読んどいて。
          translation:
            vi: Cuốn sách này, đọc trước đi nhé.
      confusion:
        vi: ておく là dạng chuẩn; とく / どく dùng với bạn bè, không dùng trong văn viết hay với người trên.
  - key: ja:item:n3-u10-gram-nakya
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: V ない → V なきゃ / V なくちゃ (いけない / ならない)
      romanization: V-nakya / V-nakucha
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Dạng rút gọn khẩu ngữ của ～なければならない / ～なくてはいけない: phải làm gì. Thường bỏ phần sau: もう帰らなきゃ (phải về rồi)."
      examples:
        - target: 明日は早いから、もう寝なきゃ。
          translation:
            vi: Mai dậy sớm nên phải đi ngủ thôi.
        - target: レポートを出さなくちゃ。
          translation:
            vi: Phải nộp báo cáo rồi.
  - key: ja:item:n3-u10-gram-tte
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: N / V thể thường + って / っていう
      romanization: tte / tte iu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Khẩu ngữ của と / という: trích dẫn, nêu chủ đề, hay hỏi lại. 彼が来るって (nghe nói anh ấy sẽ đến); 田中さんっていう人 (người tên là Tanaka)."
      examples:
        - target: 明日は雨だって。
          translation:
            vi: Nghe nói mai mưa đấy.
        - target: 田中さんっていう人を知ってる？
          translation:
            vi: Cậu có biết người tên Tanaka không?
      confusion:
        vi: って chỉ dùng trong khẩu ngữ; văn viết và lịch sự dùng と / という / そうです.
  - key: ja:item:n3-u10-gram-teru
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: V て + いる → V てる / V て + いた → V てた
      romanization: V-teru
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Rút gọn い trong ～ている thành ～てる trong khẩu ngữ: 食べている → 食べてる, 知っている → 知ってる."
      examples:
        - target: 今、何してるの？
          translation:
            vi: Giờ cậu đang làm gì đấy?
        - target: その人、知ってる？
          translation:
            vi: Cậu có biết người đó không?
  - key: ja:item:n3-u10-kanari
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: かなり
      romanization: kanari
      pos: phó từ
    back:
      meaning:
        vi: khá, tương đối (mức khá cao)
      examples:
        - target: 今日はかなり寒いですね。
          translation:
            vi: Hôm nay khá lạnh nhỉ.
  - key: ja:item:n3-u10-wariato
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 割と
      reading: わりと
      romanization: wari to
      pos: phó từ
    back:
      meaning:
        vi: tương đối, khá là (khẩu ngữ)
      examples:
        - target: この店は割と安いですよ。
          translation:
            vi: Quán này tương đối rẻ đấy.
  - key: ja:item:n3-u10-mecha
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: めっちゃ
      romanization: meccha
      pos: phó từ
    back:
      meaning:
        vi: cực kỳ, rất (khẩu ngữ trẻ, nhất là vùng Kansai)
      examples:
        - target: このラーメン、めっちゃおいしい。
          translation:
            vi: Mì này cực kỳ ngon.
      confusion:
        vi: Chỉ dùng thân mật; trong công việc dùng とても hoặc 非常に.
  - key: ja:item:n3-u10-yappari
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: やっぱり
      romanization: yappari
      pos: phó từ
    back:
      meaning:
        vi: quả nhiên, rốt cuộc vẫn là (khẩu ngữ của やはり)
      examples:
        - target: やっぱり、日本の夏は暑いですね。
          translation:
            vi: Quả nhiên mùa hè Nhật Bản nóng nhỉ.
  - key: ja:item:n3-u10-nanka
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: なんか
      romanization: nanka
      pos: trợ từ / phó từ
    back:
      meaning:
        vi: kiểu như, hình như; những thứ như (khẩu ngữ)
      examples:
        - target: なんか疲れたなあ。
          translation:
            vi: Sao thấy mệt thế nhỉ.
  - key: ja:item:n3-u10-maji
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: まじで
      romanization: maji de
      pos: phó từ
    back:
      meaning:
        vi: thật á, nghiêm túc (khẩu ngữ trẻ)
      examples:
        - target: まじで？ それはすごいね。
          translation:
            vi: Thật á? Giỏi quá nhỉ.
      confusion:
        vi: Rất thân mật, tránh dùng với người trên hay trong thư từ.
  - key: ja:item:n3-u10-gram-ue-ni
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: V / A / N + うえ(に)
      romanization: V / A / N ue (ni)
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Hơn nữa, thêm vào đó (cộng thêm một điều cùng chiều). Thể thường + うえに; N の / Na な + うえに.
      examples:
        - target: この店は安いうえに、おいしいです。
          translation:
            vi: Quán này vừa rẻ lại còn ngon.
        - target: 彼は頭がいいうえに、性格もいいです。
          translation:
            vi: Anh ấy vừa thông minh lại còn tính cách tốt.
      confusion:
        vi: Vế trước và vế sau cùng chiều (tốt + tốt hoặc xấu + xấu).
  - key: ja:item:n3-u10-gram-koto-kara
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: thể thường + ことから
      romanization: plain form koto kara
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Từ việc ... mà ... (nêu căn cứ, nguồn gốc của kết luận hay tên gọi).
      examples:
        - target: 足跡が残っていたことから、犯人が分かりました。
          translation:
            vi: Nhờ dấu chân còn lại mà tìm ra thủ phạm.
        - target: この橋は、赤い色をしていることから「赤橋」と呼ばれています。
          translation:
            vi: Cây cầu này được gọi là "Cầu đỏ" vì có màu đỏ.
  - key: ja:item:n3-u10-gram-to-shitara
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: thể thường + としたら / とすれば
      romanization: to shitara / to sureba
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Giả sử ... thì ...; nếu cho rằng ... (giả định, thường về điều chưa chắc).
      examples:
        - target: もし宝くじが当たったとしたら、何をしますか。
          translation:
            vi: Giả sử trúng xổ số thì bạn sẽ làm gì?
        - target: その話が本当だとすれば、大変なことです。
          translation:
            vi: Nếu chuyện đó là thật thì nghiêm trọng đấy.
  - key: ja:item:n3-u10-gram-te-irai
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: V て + 以来
      romanization: V-te irai
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Kể từ khi ... đến nay (khoảng thời gian dài liên tục). Thường đi với "chưa từng/luôn luôn".
      examples:
        - target: 大学を卒業して以来、一度も彼に会っていません。
          translation:
            vi: Từ khi tốt nghiệp đại học tôi chưa gặp anh ấy lần nào.
        - target: 日本へ来て以来、毎日日本語を勉強しています。
          translation:
            vi: Từ khi đến Nhật tôi học tiếng Nhật mỗi ngày.
  - key: ja:item:n3-u10-gram-ni-kansuru
    type: grammar_point
    level: n3
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: N に関して / に関する N
      romanization: N ni kanshite / ni kansuru
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Liên quan đến N, về N (trang trọng). に関して + động từ / に関する + N.
      examples:
        - target: 環境問題に関して、意見を聞かせてください。
          translation:
            vi: Xin cho tôi nghe ý kiến về vấn đề môi trường.
        - target: 日本の歴史に関する本を読みます。
          translation:
            vi: Tôi đọc sách liên quan đến lịch sử Nhật Bản.
  - key: ja:item:n3-u10-ika
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 以下
      reading: いか
      romanization: ika
      pos: danh từ
    back:
      meaning:
        vi: dưới, sau đây; từ ... trở xuống
      examples:
        - target: 以下の問題に答えてください。
          translation:
            vi: Xin hãy trả lời các câu hỏi sau đây.
  - key: ja:item:n3-u10-ijou
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 以上
      reading: いじょう
      romanization: ijou
      pos: danh từ
    back:
      meaning:
        vi: từ ... trở lên; trên đây
      examples:
        - target: 二十歳以上の方は入れます。
          translation:
            vi: Người từ 20 tuổi trở lên có thể vào.
  - key: ja:item:n3-u10-mokuteki
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 目的
      reading: もくてき
      romanization: mokuteki
      pos: danh từ
    back:
      meaning:
        vi: mục đích
      examples:
        - target: 旅行の目的は何ですか。
          translation:
            vi: Mục đích của chuyến đi là gì?
  - key: ja:item:n3-u10-genin
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 原因
      reading: げんいん
      romanization: genin
      pos: danh từ
    back:
      meaning:
        vi: nguyên nhân
      examples:
        - target: 事故の原因を調べています。
          translation:
            vi: Người ta đang điều tra nguyên nhân tai nạn.
  - key: ja:item:n3-u10-riyuu
    type: vocab
    level: n3
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 理由
      reading: りゆう
      romanization: riyuu
      pos: danh từ
    back:
      meaning:
        vi: lý do
      examples:
        - target: 遅れた理由を説明してください。
          translation:
            vi: Xin hãy giải thích lý do đến muộn.
