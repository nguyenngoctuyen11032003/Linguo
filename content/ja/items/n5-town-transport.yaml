  - key: ja:item:n5-u13-ni-ikimasu
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: V ます (bỏ ます) / N + に 行きます
      romanization: V-masu stem / N ni ikimasu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Đi đâu để làm gì: bỏ ます của động từ rồi thêm に + 行きます. Có thể dùng danh từ + に (かいものに いきます)."
      examples:
        - target: ほんをかいにほんやへいきます。
          translation:
            vi: Tôi đi hiệu sách để mua sách.
        - target: かいものにデパートへいきます。
          translation:
            vi: Tôi đi bách hoá để mua sắm.
      confusion:
        vi: "Mục đích に khác nơi đến へ/に: かいものに いきます (đi để mua sắm) - cả hai に không trùng nhau."
