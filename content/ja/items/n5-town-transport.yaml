  - key: ja:item:n5-u13-de-ikimasu
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: N で 行きます / 来ます / 帰ります
      romanization: N de ikimasu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Đi bằng phương tiện gì: phương tiện + で + động từ di chuyển. Đi bộ là あるいて (không dùng で)."
      examples:
        - target: でんしゃでかいしゃへいきます。
          translation:
            vi: Tôi đi làm bằng tàu điện.
        - target: タクシーでうちへかえります。
          translation:
            vi: Tôi về nhà bằng taxi.
      confusion:
        vi: Hỏi - なにで いきますか (đi bằng gì?); ngoại lệ - あるいていきます (đi bộ), không nói あるきで.
