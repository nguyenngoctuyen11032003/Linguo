    front:
      text: V辞書形 / V ない + ことがある
      romanization: V-jisho koto ga aru
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: Thỉnh thoảng có khi... Diễn tả việc không thường xuyên nhưng có xảy ra. Khác ～たことがある (từng làm).
      examples:
        - target: 休みの日は、一日中寝ていることがあります。
          translation:
            vi: Ngày nghỉ thỉnh thoảng tôi ngủ cả ngày.
        - target: 朝ご飯を食べないことがあります。
          translation:
            vi: Có khi tôi không ăn sáng.
      confusion:
        vi: V辞書形 + ことがある = thỉnh thoảng; V た + ことがある = đã từng.
