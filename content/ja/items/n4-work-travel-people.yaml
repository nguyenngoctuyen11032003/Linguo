items:
  - key: ja:item:n4-u9-gram-o-kudasai
    type: grammar_point
    level: n4
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: お / ご + V ます (bỏ ます) / N + ください
      romanization: o V-masu stem kudasai
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Cách nhờ hoặc mời lịch sự (kính ngữ): お待ちください (xin hãy đợi), ご覧ください (xin hãy xem), ご利用ください. Lịch sự hơn V てください."
      examples:
        - target: 少々お待ちください。
          translation:
            vi: Xin vui lòng đợi một chút.
        - target: こちらの書類にご記入ください。
          translation:
            vi: Xin điền vào giấy tờ này.
      confusion:
        vi: お + từ thuần Nhật (待ちます → お待ちください); ご + từ gốc Hán (記入 → ご記入ください).
