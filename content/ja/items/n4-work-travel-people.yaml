    type: grammar_point
    level: n4
    difficulty: 3
    skill_tags:
      - grammar
    front:
      text: N1 + という + N2
      romanization: N1 to iu N2
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "N2 có tên là N1 (giới thiệu một người, nơi chưa quen thuộc). Cũng dùng giải thích: ～という意味 (nghĩa là ...)."
      examples:
