        - target: 「Sakura」は桜という意味です。
          translation:
            vi: '"Sakura" nghĩa là 桜.'
      confusion:
        vi: という cũng có dạng khẩu ngữ って; N1 は N2 のことです cũng nghĩa tương tự.
