  - key: ja:item:n5-u16-kimasu
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 着ます
      reading: きます
      romanization: kimasu
      pos: động từ
    back:
      meaning:
        vi: mặc (áo, đồ phần thân)
      examples:
        - target: シャツをきます。
          translation:
            vi: Tôi mặc áo.
      confusion:
        vi: きます có ba chữ Hán - 来ます (đến), 着ます (mặc), 切ります (đọc きります). Ngữ cảnh ngay cho biết nghĩa.
  - key: ja:item:n5-u16-hakimasu
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 履きます
      reading: はきます
      romanization: hakimasu
      pos: động từ
    back:
      meaning:
        vi: mang, mặc (giày, tất, quần, váy)
      examples:
        - target: くつをはきます。
          translation:
            vi: Tôi đi giày.
      pronunciation_note:
        vi: "はきます dùng cho đồ mặc phần dưới và đồ mang chân: くつ, くつした, ズボン, スカート."
