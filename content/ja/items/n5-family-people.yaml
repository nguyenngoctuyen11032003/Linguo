items:
  - key: ja:item:n5-u10-chichi
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 父
      reading: ちち
      romanization: chichi
      pos: danh từ
    back:
      meaning:
        vi: bố (của mình) - dùng khi nói với người ngoài về bố mình
      examples:
        - target: ちちはかいしゃいんです。
          translation:
            vi: Bố tôi là nhân viên công ty.
      confusion:
        vi: Gọi bố mình trực tiếp hoặc nói về bố người khác thì dùng おとうさん, không dùng ちち.
