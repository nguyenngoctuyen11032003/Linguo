  - key: ja:item:n5-u10-oniisan-oneesan
    type: vocab
    level: n5
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: お兄さん / お姉さん
      reading: おにいさん / おねえさん
      romanization: oniisan / oneesan
      pos: danh từ
    back:
