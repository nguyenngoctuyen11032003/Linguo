      text: 今年
      reading: ことし
      romanization: kotoshi
      pos: danh từ
    back:
      meaning:
        vi: năm nay
      examples:
        - target: ことしはにじゅうごさいです。
          translation:
            vi: Năm nay tôi 25 tuổi.
  - key: ja:item:n5-u10-kyonen
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 去年
      reading: きょねん
      romanization: kyonen
      pos: danh từ
    back:
      meaning:
        vi: năm ngoái
      examples:
        - target: きょねんにほんへいきました。
          translation:
            vi: Năm ngoái tôi đã đến Nhật.
  - key: ja:item:n5-u10-rainen
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 来年
      reading: らいねん
      romanization: rainen
      pos: danh từ
    back:
      meaning:
        vi: năm sau, sang năm
      examples:
        - target: らいねんにほんへいきます。
          translation:
            vi: Sang năm tôi sẽ đi Nhật.
  - key: ja:item:n5-u10-toshi
    type: vocab
    level: n5
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: 年
      reading: とし
      romanization: toshi
      pos: danh từ
    back:
      meaning:
        vi: năm; tuổi (cách nói chung)
      examples:
        - target: としはいくつですか。
          translation:
            vi: Bạn bao nhiêu tuổi?
      confusion:
        vi: 年 đọc とし (năm, tuổi) khi đứng riêng; đọc ねん khi đếm năm (ごねん, 2025ねん).
  - key: ja:item:n5-u10-omedetou
    type: phrase
    level: n5
    difficulty: 1
    skill_tags:
      - speaking
      - vocabulary
    front:
      text: おめでとうございます
      romanization: omedetou gozaimasu
      pos: cụm từ
    back:
      meaning:
        vi: Chúc mừng! (dùng cho sinh nhật, đỗ đạt, kết hôn...)
      examples:
        - target: おたんじょうび、おめでとうございます。
          translation:
            vi: Chúc mừng sinh nhật.
  - key: ja:item:n5-u10-donna
    type: grammar_point
    level: n5
    difficulty: 1
    skill_tags:
      - grammar
    front:
      text: どんな + N ですか
      romanization: donna N desu ka
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: N thuộc loại thế nào? - hỏi tính cách, đặc điểm của người hoặc vật. Trả lời bằng tính từ hoặc mô tả ngắn.
      examples:
        - target: あのひとはどんなひとですか。- やさしいひとです。
          translation:
            vi: Người đó là người thế nào? - Là người hiền.
        - target: どんなくだものがすきですか。
          translation:
            vi: Bạn thích loại trái cây nào?
      confusion:
        vi: どんな hỏi loại, tính chất; どれ hỏi chọn trong số có sẵn; だれ hỏi ai.
  - key: ja:item:n5-u10-wa-ga-adj
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: N1 は N2 が Aい / Naです
      romanization: N1 wa N2 ga A desu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: N1 (chủ đề) có đặc điểm N2 là A - nói về một bộ phận hay đặc điểm của chủ đề. Ví dụ ぞうは はなが ながいです (Con voi mũi dài).
      examples:
        - target: あのひとはせがたかいです。
          translation:
            vi: Người đó cao.
        - target: ベトナムはたべものがおいしいです。
          translation:
            vi: Ở Việt Nam đồ ăn ngon.
      confusion:
        vi: Chủ đề は nêu cả đối tượng, が nêu bộ phận hay đặc điểm cụ thể. Không đảo hai danh từ.
  - key: ja:item:n5-u10-kyoudai-imasuka
    type: phrase
    level: n5
    difficulty: 2
    skill_tags:
      - speaking
      - vocabulary
    front:
      text: ご兄弟はいますか
      reading: ごきょうだいはいますか
      romanization: gokyoudai wa imasu ka
      pos: cụm từ
    back:
      meaning:
        vi: Bạn có anh chị em không? (cách hỏi lịch sự)
      examples:
        - target: ごきょうだいはいますか。- はい、あにがひとりいます。
          translation:
            vi: Bạn có anh chị em không? - Có, tôi có một anh trai.
