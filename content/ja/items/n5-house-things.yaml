  - key: ja:item:n5-u12-ichi-ni-arimasu
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: N1 の + vị trí + に N2 が あります / います
      romanization: N1 no ue ni N2 ga arimasu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Nói vị trí của vật hay người: nơi chốn に vật が あります (vật) / います (người, con vật). Vị trí gồm うえ, した, なか, そと, まえ, うしろ, となり, よこ, あいだ, ちかく."
      examples:
        - target: つくえのうえにほんがあります。
          translation:
            vi: Trên bàn có quyển sách.
        - target: いすのしたにねこがいます。
          translation:
            vi: Dưới ghế có con mèo.
      confusion:
        vi: Hỏi vị trí - N は どこに ありますか / いますか; đáp - N は 位置に あります / います. Hai kiểu câu cùng một ý nhưng đổi chủ đề.
