    back:
      meaning:
        vi: trả lại
      examples:
        - target: 図書館に本を返します。
          translation:
            vi: Tôi trả sách cho thư viện.
  - key: ja:item:n4-u7-mukaeru
    type: vocab
    level: n4
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: 迎える
      reading: むかえる
      romanization: mukaeru
      pos: động từ
    back:
      meaning:
        vi: đón, nghênh đón
      examples:
        - target: 駅まで友達を迎えに行きます。
          translation:
            vi: Tôi đi đón bạn ở ga.
  - key: ja:item:n4-u7-junban
    type: vocab
    level: n4
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: 順番
      reading: じゅんばん
      romanization: junban
      pos: danh từ
    back:
      meaning:
        vi: thứ tự, lượt
      examples:
        - target: 順番に並んでください。
          translation:
            vi: Xin hãy xếp hàng theo thứ tự.
  - key: ja:item:n4-u7-narabu
    type: vocab
    level: n4
    difficulty: 2
    skill_tags:
      - vocabulary
    front:
      text: 並ぶ
      reading: ならぶ
      romanization: narabu
      pos: động từ
    back:
      meaning:
        vi: xếp hàng, đứng thành hàng
      examples:
        - target: 店の前に人が並んでいます。
          translation:
            vi: Mọi người xếp hàng trước cửa hàng.
  - key: ja:item:n4-u7-sumu
    type: vocab
    level: n4
    difficulty: 3
    skill_tags:
      - vocabulary
    front:
      text: 済む
      reading: すむ
      romanization: sumu
      pos: động từ
    back:
      meaning:
        vi: xong, hoàn tất; đủ
      examples:
        - target: 手続きはもう済みました。
          translation:
            vi: Thủ tục đã xong rồi.
