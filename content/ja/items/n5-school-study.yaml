  - key: ja:item:n5-u15-ga-wakarimasu
    type: grammar_point
    level: n5
    difficulty: 2
    skill_tags:
      - grammar
    front:
      text: N が 分かります / できます
      romanization: N ga wakarimasu
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Hiểu được N: đối tượng của わかります đi với が. Phủ định - わかりません; hỏi - わかりますか。 Đáp - はい、わかります / いいえ、わかりません."
      examples:
        - target: にほんごがわかります。
          translation:
            vi: Tôi hiểu tiếng Nhật.
        - target: このもんだいがわかりません。
          translation:
            vi: Tôi không hiểu câu hỏi này.
      confusion:
        vi: Người Việt hay dùng を như "hiểu tiếng Nhật" - nhưng わかる là trạng thái, phải dùng が.
