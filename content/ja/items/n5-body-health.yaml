            vi: Tôi đau đầu.
  - key: ja:item:n5-u11-me
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 目
      reading: め
      romanization: me
      pos: danh từ
    back:
