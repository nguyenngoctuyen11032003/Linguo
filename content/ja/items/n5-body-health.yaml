items:
  - key: ja:item:n5-u11-karada
    type: vocab
    level: n5
    difficulty: 1
    skill_tags:
      - vocabulary
    front:
      text: 体
      reading: からだ
      romanization: karada
      pos: danh từ
    back:
      meaning:
        vi: cơ thể, thân thể; sức khoẻ
      examples:
        - target: からだがげんきです。
          translation:
            vi: Cơ thể tôi khoẻ mạnh.
