      vi: ～を懸念する - lo ngại (tin tức, văn bản). 危惧する cũng trang trọng và gần nghĩa.
    display_answer: 専門家は景気の悪化を懸念している。

  - key: ja:exercise:n1-u2-monotomosezu-yosoni-fill-kakan
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-kakan
    prompt:
      template: "選手たちは強豪相手に{{b1}}挑んだ。(một cách quả cảm)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [果敢に, かかんに]
    known_wrong:
      - answer: 無謀に
        feedback_vi: 無謀 là liều lĩnh thiếu suy nghĩ (chê); quả cảm (khen) là 果敢に.
        error_tag: vocab_meaning
      - answer: 果敢な
        feedback_vi: Bổ nghĩa cho động từ 挑む cần dạng phó từ - 果敢に.
        error_tag: grammar_form
    explanation:
      vi: 果敢に挑む - quả cảm đương đầu. な形容詞 + に thành phó từ.
    display_answer: 選手たちは強豪相手に果敢に挑んだ。

  - key: ja:exercise:n1-u2-monotomosezu-yosoni-translate-yoso
    type: translate
