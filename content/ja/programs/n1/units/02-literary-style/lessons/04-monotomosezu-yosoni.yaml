  - key: ja:exercise:n1-u2-monotomosezu-yosoni-mcq-kakan
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-kakan
    prompt:
      stem: 'Bạn viết tin thể thao: "Bất chấp cái nóng gay gắt, các cầu thủ đã quả cảm tấn công đến phút cuối." Câu nào đúng và tự nhiên nhất?'
      stem_lang: vi
      options:
        - { id: m3c, text: 厳しい暑さをものともせず、選手たちは最後まで果敢に攻め続けた。, lang: ja }
        - { id: f9x, text: 厳しい暑さをよそに、選手たちは最後まで果敢に攻め続けた。, lang: ja }
        - { id: u4w, text: 厳しい暑さをものともせず、選手たちは最後まで無謀に攻め続けた。, lang: ja }
        - { id: b1y, text: 厳しい暑さをものともせず、選手たちは最後まで果敢な攻め続けた。, lang: ja }
    answer:
      correct_option_id: m3c
    explanation:
      vi: 暑さ là trở ngại khách quan - ものともせず; 果敢に là phó từ "quả cảm". よそに cần thái độ của người khác; 無謀 là "liều lĩnh" (chê); 果敢な không bổ nghĩa cho động từ.
    display_answer: 厳しい暑さをものともせず、選手たちは最後まで果敢に攻め続けた。

