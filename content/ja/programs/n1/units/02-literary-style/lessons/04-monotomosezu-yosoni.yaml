      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 親の心配をよそに、息子は一人で海外旅行に出かけた。
        - 親の心配をよそに、息子は一人で海外旅行に行った。
        - 親の心配をよそに、息子は一人で海外旅行に出た。
        - 親の心配をよそに、息子は一人で海外へ旅行に行った。
        - 親の心配をよそに、息子は一人で海外に旅行に行った。
        - 親の心配をよそに、息子は一人で海外旅行に出かけました。
        - 親の心配をよそに、息子は一人で海外旅行に行きました。
        - 両親の心配をよそに、息子は一人で海外旅行に出かけた。
        - 両親の心配をよそに、息子は一人で海外旅行に行った。
        - 親の心配をよそに、息子は一人で海外へ旅立った。
        - 親の心配をよそに、息子は一人で外国へ旅行に行った。
        - 息子は親の心配をよそに、一人で海外旅行に出かけた。
        - 息子は親の心配をよそに、一人で海外旅行に行った。
        - おやのしんぱいをよそに、むすこはひとりでかいがいりょこうにいった。
    known_wrong:
      - answer: 親の心配をものともせず、息子は一人で海外旅行に行った。
        feedback_vi: ものともせず đi với trở ngại khách quan và mang ý khen; sự lo lắng của bố mẹ bị phớt lờ - dùng をよそに.
        error_tag: yoso_monotomo
      - answer: 親が心配をよそに、息子は一人で海外旅行に行った。
        feedback_vi: をよそに đi sau danh từ - 親の心配をよそに.
        error_tag: particle
    explanation:
      vi: 親の心配をよそに - mặc cho bố mẹ lo lắng; 一人で海外旅行に出かけた - một mình đi du lịch nước ngoài.
    display_answer: 親の心配をよそに、息子は一人で海外旅行に出かけた。

