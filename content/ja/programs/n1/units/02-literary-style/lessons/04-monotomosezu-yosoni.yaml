  - key: ja:exercise:n1-u2-monotomosezu-yosoni-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-monotomosezu
    prompt:
      stem: 'Chọn mẫu phù hợp: 彼は足のけが＿＿、最後まで走り抜いた。'
      stem_lang: vi
      options:
        - { id: n4q, text: をものともせず, lang: ja }
        - { id: s8f, text: をよそに, lang: ja }
        - { id: d2h, text: たるもの, lang: ja }
