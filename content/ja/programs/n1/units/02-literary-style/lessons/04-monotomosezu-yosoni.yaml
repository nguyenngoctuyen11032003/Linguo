    display_answer: をものともせず

  - key: ja:exercise:n1-u2-monotomosezu-yosoni-fill-yoso
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-wo-yoso-ni
    prompt:
      template: "住民の反対を{{b1}}、工事は着々と進められた。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Mặc kệ sự phản đối của cư dân, công trình vẫn được tiến hành đều đặn."
        - "Gợi ý: を＿＿に - 'mặc kệ'."
    answer:
      blanks:
        b1: [よそに, 余所に]
    known_wrong:
      - answer: ものともせず
        feedback_vi: ものともせず là "bất chấp trở ngại" với ý khen; sự phản đối của cư dân bị phớt lờ - dùng をよそに.
        error_tag: yoso_monotomo
      - answer: よそで
        feedback_vi: Mẫu cố định là をよそに.
        error_tag: grammar_form
    explanation:
      vi: 反対をよそに - mặc kệ sự phản đối (sắc thái phê phán).
    display_answer: 住民の反対をよそに、工事は着々と進められた。

