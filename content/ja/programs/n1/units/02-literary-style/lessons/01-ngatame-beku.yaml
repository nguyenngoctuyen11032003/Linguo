key: ja:lesson:n1-u2-ngatame-beku
order_index: 1
level: n1
title:
  vi: Mục đích trang trọng - ～んがため(に), ～べく
objectives:
  - vi: Diễn đạt mục đích mạnh mẽ, quyết tâm bằng ～んがため(に).
  - vi: Viết câu mục đích kiểu văn bản, tin tức bằng ～べく.
  - vi: Phân biệt べく (để) với べき (nên) và biết giới hạn của vế sau.
estimated_minutes: 25
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-formal-conditions-review]
items:
  - item: ja:item:n1-u2-kokorozasu
  - item: ja:item:n1-u2-higan
