    difficulty: 4
    item: ja:item:n1-u2-gram-tomonaruto
    prompt:
      stem: 'Đồng nghiệp hỏi: 「部長になって、何か変わりましたか。」 Bạn muốn nói: "Đã lên trưởng phòng thì trách nhiệm cũng nặng hơn hẳn." Câu nào phù hợp nhất?'
      stem_lang: vi
