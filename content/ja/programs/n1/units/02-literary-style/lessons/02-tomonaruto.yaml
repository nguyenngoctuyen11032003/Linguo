        - { id: a9f, text: 部長ともあろう者が、責任の重さが全然違いますね。, lang: ja }
        - { id: g4l, text: 部長ともなるべく、責任の重さが全然違いますね。, lang: ja }
        - { id: t1o, text: 部長なりに、責任の重さが全然違いますね。, lang: ja }
