  - key: ja:exercise:n1-u2-tomonaruto-mcq-tomoarou
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-tomoarou
    prompt:
      stem: 'Chọn từ phù hợp: 警察官＿＿者が、法律を破るとは信じられない。'
      stem_lang: vi
      options:
        - { id: r3s, text: ともあろう, lang: ja }
        - { id: j6n, text: ともなると, lang: ja }
        - { id: c8w, text: ともなれば, lang: ja }
        - { id: m1a, text: となると, lang: ja }
    answer:
      correct_option_id: r3s
    explanation:
      vi: N + ともあろう + 者 - đường đường là... mà lại (chê trách). ともなると / ともなれば / となると không đứng trực tiếp trước danh từ 者.
    display_answer: ともあろう

  - key: ja:exercise:n1-u2-tomonaruto-fill-tomonaruto
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-tomonaruto
    prompt:
      template: "大学4年生とも{{b1}}と、就職のことを真剣に考え始める。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Đã là sinh viên năm 4 thì bắt đầu nghiêm túc nghĩ đến chuyện xin việc."
        - "Gợi ý: ～とも＿＿と - động từ なる."
    answer:
      blanks:
        b1: [なる]
    known_wrong:
      - answer: あろう
        feedback_vi: ともあろう đi với danh từ chỉ người (者) và mang ý chê trách; ở đây là nhận định trung tính - ともなると.
        error_tag: tomoarou_tomonaruto
      - answer: なれ
        feedback_vi: なれ đi với ば (ともなれば). Trước と dùng thể từ điển なる.
        error_tag: grammar_form
    explanation:
      vi: 大学4年生ともなると - một khi đã là sinh viên năm 4 thì.
    display_answer: 大学4年生ともなると、就職のことを真剣に考え始める。

  - key: ja:exercise:n1-u2-tomonaruto-wb-kanrishoku
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-kanrishoku
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Đã lên chức quản lý thì phải chịu trách nhiệm cả về thất bại của cấp dưới.\""
      tokens:
        - { id: k3, text: 責任を負わなければならない }
        - { id: k4, text: 管理職ともあろう、 }
        - { id: k2, text: 部下の失敗にも }
        - { id: k1, text: 管理職ともなれば、 }
    answer:
      orders:
        - [k1, k2, k3]
    explanation:
      vi: 管理職ともなれば - đã lên chức quản lý thì. ともあろう không đứng một mình trước dấu phẩy, và mang ý chê trách.
    display_answer: 管理職ともなれば、部下の失敗にも責任を負わなければならない。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u2-tomonaruto-fill-juuseki
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-juuseki
    prompt:
      template: "彼は代表としての{{b1}}を立派に果たした。(trọng trách)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [重責, じゅうせき, 責任, せきにん, 責務, せきむ]
    known_wrong:
      - answer: じゅせき
        feedback_vi: じゅう là âm dài - じゅうせき.
        error_tag: long_vowel
      - answer: 重要
        feedback_vi: 重要 là tính từ "quan trọng"; trọng trách là danh từ 重責.
        error_tag: vocab_meaning
    explanation:
      vi: 重責を果たす - hoàn thành trọng trách. 責任 / 責務 cũng đúng nghĩa, nhưng 重責 nhấn mạnh sức nặng.
    display_answer: 彼は代表としての重責を立派に果たした。

  - key: ja:exercise:n1-u2-tomonaruto-fill-jikaku
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u2-jikaku
    prompt:
      template: "社会人としての{{b1}}を持って行動しなさい。(ý thức về vai trò của mình)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [自覚, じかく]
    known_wrong:
      - answer: じがく
        feedback_vi: かく không có dấu đục - じかく. じがく (自学) là "tự học".
        error_tag: dakuten
      - answer: 自信
        feedback_vi: 自信 là sự tự tin; ý thức về vai trò, trách nhiệm là 自覚.
        error_tag: vocab_meaning
    explanation:
      vi: ～としての自覚を持つ - có ý thức của một ~.
    display_answer: 社会人としての自覚を持って行動しなさい。

  - key: ja:exercise:n1-u2-tomonaruto-translate-tomonaruto
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-tomonaruto
    prompt:
      source_text: Cứ đến tháng 12 là phố phường đâu đâu cũng tất bật. (dùng ともなると)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 12月ともなると、街はどこも慌ただしくなる。
        - 12月ともなると、街はどこも慌ただしくなります。
        - 12月ともなると、町はどこも慌ただしくなる。
        - 12月ともなると、町はどこも慌ただしくなります。
        - 十二月ともなると、街はどこも慌ただしくなる。
        - 12月ともなると、街はどこもあわただしくなる。
        - 12月ともなると、どこの街も慌ただしくなる。
        - 12月ともなると、どの街も慌ただしくなる。
        - 12月ともなると、街はどこも忙しくなる。
        - 12月ともなると、街はどこもせわしくなる。
        - 師走ともなると、街はどこも慌ただしくなる。
        - 12月ともなると、街はどこも慌ただしい。
        - じゅうにがつともなると、まちはどこもあわただしくなる。
    known_wrong:
      - answer: 12月ともあろう、街はどこも慌ただしくなる。
        feedback_vi: ともあろう chỉ đứng trước danh từ chỉ người và mang ý chê trách. Ở đây dùng ともなると.
        error_tag: tomoarou_tomonaruto
      - answer: 12月ともなるので、街はどこも慌ただしくなる。
        feedback_vi: Mẫu cố định là ともなると / ともなれば, không nối bằng ので.
        error_tag: grammar_form
    explanation:
      vi: 12月ともなると - cứ đến tháng 12; 慌ただしくなる - trở nên tất bật.
    display_answer: 12月ともなると、街はどこも慌ただしくなる。

