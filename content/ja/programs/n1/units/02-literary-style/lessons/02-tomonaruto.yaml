        - { id: d3x, text: 明日ともなると、雨が降るそうだ。, lang: ja }
        - { id: z7q, text: 私ともなると、明日は早く起きよう。, lang: ja }
        - { id: h2e, text: 横綱ともなれば、一緒に相撲を見に行きましょう。, lang: ja }
    answer:
