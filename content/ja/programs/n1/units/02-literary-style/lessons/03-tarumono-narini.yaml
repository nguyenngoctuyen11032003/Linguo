  - key: ja:exercise:n1-u2-tarumono-narini-fill-tarumono
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-gram-tarumono
    prompt:
      template: "政治家{{b1}}、国民との約束を守るべきだ。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Đã là chính trị gia thì phải giữ lời hứa với người dân."
        - "Gợi ý: ＿＿もの - 'đã là... thì phải'."
    answer:
      blanks:
        b1: [たるもの, たる者, たるものは, たる者は]
    known_wrong:
      - answer: なりに
        feedback_vi: なりに là "theo khả năng riêng"; vế sau べきだ nêu chuẩn mực nên dùng たるもの.
        error_tag: narini_tarumono
      - answer: ともあろう
        feedback_vi: ともあろう phải có danh từ đi sau (者が) và mang ý chê trách hành vi đã xảy ra.
        error_tag: tomoarou_tarumono
    explanation:
      vi: 政治家たるもの、～べきだ - đã là chính trị gia thì phải...
    display_answer: 政治家たるもの、国民との約束を守るべきだ。

  - key: ja:exercise:n1-u2-tarumono-narini-wb-mohan
    type: word_bank
    stage: recognition
