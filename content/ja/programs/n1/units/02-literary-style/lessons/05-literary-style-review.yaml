  - key: ja:exercise:n1-literary-style-review-wb-shinnen
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u2-shinnen
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Bất chấp lời chỉ trích, ông ấy đã giữ vững niềm tin của mình suốt cả cuộc đời.\""
      tokens:
        - { id: e3, text: 自らの信念を }
        - { id: e5, text: 批判なりに、 }
        - { id: e1, text: 彼は }
        - { id: e4, text: 生涯貫いた }
        - { id: e2, text: 批判をものともせず、 }
    answer:
      orders:
        - [e1, e2, e3, e4]
    explanation:
      vi: 批判をものともせず - không nao núng trước lời chỉ trích (khen người kiên định); 自らの信念を生涯貫いた - giữ vững niềm tin cả đời. 批判なりに là vô nghĩa - なりに không đi với lời chỉ trích của người khác.
    display_answer: 彼は批判をものともせず、自らの信念を生涯貫いた。
