    known_wrong:
      - answer: 足る
        feedback_vi: Thành ngữ là dạng phủ định - 取るに足らない (không đáng kể).
        error_tag: taru_negative
      - answer: 値しない
        feedback_vi: Thành ngữ cố định là 取るに足らない; không nói 取るに値しない.
        error_tag: taru_atai
