key: ja:lesson:n1-u3-ni-taenai
order_index: 4
level: n1
title:
  vi: Đánh giá giá trị - ～に堪えない, ～に足る, ～に値する
objectives:
  - vi: Chê điều tệ đến mức không xem, nghe nổi bằng 見る / 聞く + に堪えない.
  - vi: Bày tỏ lòng biết ơn, tiếc nuối trang trọng bằng 感謝 / 遺憾 + に堪えない.
  - vi: Đánh giá "đáng", "đủ để" bằng ～に足る và ～に値する.
estimated_minutes: 24
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-u3-to-ittara-nai]
