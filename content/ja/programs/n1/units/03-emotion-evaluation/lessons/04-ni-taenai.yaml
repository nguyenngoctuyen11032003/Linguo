  - key: ja:exercise:n1-u3-ni-taenai-mcq-atai
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-ni-atai-suru
    prompt:
      stem: 'Chọn từ đúng: この報告書は、専門家でなくても一読＿＿。'
      stem_lang: vi
      options:
        - { id: g8p, text: に値する, lang: ja }
        - { id: u2f, text: に堪えない, lang: ja }
        - { id: o6c, text: を禁じ得ない, lang: ja }
        - { id: w4v, text: 極まりない, lang: ja }
    answer:
      correct_option_id: g8p
    explanation:
      vi: 一読に値する - đáng đọc qua một lần. に堪えない (với nghĩa chê) đi với 見る / 聞く / 読む; を禁じ得ない cần danh từ cảm xúc; 極まりない gắn vào tính từ な.
    display_answer: に値する

  - key: ja:exercise:n1-u3-ni-taenai-fill-shinrai
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u2-shinrai
    prompt:
      template: "彼は口数は少ないが、{{b1}}に足る人物だ。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Anh ấy ít nói nhưng là người đáng tin cậy."
        - "Gợi ý: từ Hán 'tin cậy' - しんらい."
    answer:
      blanks:
        b1: [信頼, しんらい, 信頼する, しんらいする]
    known_wrong:
      - answer: 称賛
        feedback_vi: 称賛 (ca ngợi) đi với に値する; người "đáng tin cậy" là 信頼に足る.
        error_tag: vocab_meaning
    explanation:
      vi: 信頼に足る人物 - người đáng tin cậy (đủ tiêu chuẩn để tin). Dạng động từ 信頼するに足る cũng đúng.
    display_answer: 彼は口数は少ないが、信頼に足る人物だ。

  - key: ja:exercise:n1-u3-ni-taenai-wb-kansha
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-ni-taenai
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Được rất nhiều người ủng hộ, tôi vô cùng biết ơn.\""
      tokens:
        - { id: t2, text: ご支援いただき、 }
        - { id: t4, text: 感謝に値しません }
        - { id: t3, text: 感謝に堪えません }
        - { id: t1, text: 多くの方々に }
