      vi: 感謝に堪えません - vô cùng biết ơn (trang trọng). 感謝に値しません nghĩa là "không đáng để cảm ơn" - sai ý.
    display_answer: 多くの方々にご支援いただき、感謝に堪えません。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u3-ni-taenai-fill-toru
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-ni-taru
    prompt:
      template: "取るに{{b1}}ことで、いちいち悩む必要はない。(nhỏ nhặt, không đáng kể)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
