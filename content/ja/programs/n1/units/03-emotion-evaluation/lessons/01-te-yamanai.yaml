      stem_lang: vi
      options:
        - { id: a3k, text: sự phẫn nộ trước điều bất công, lang: vi }
        - { id: m7q, text: sự thương cảm, lang: vi }
        - { id: z1w, text: sự kinh ngạc, lang: vi }
