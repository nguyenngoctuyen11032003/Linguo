    display_answer: 私が敬愛してやまない恩師が、今年で八十歳を迎えます。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u3-te-yamanai-fill-yamanai
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-te-yamanai
    prompt:
      template: "子どもたちの健やかな成長を願って{{b1}}。(không ngừng mong)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [やまない, やみません, 止まない, 止みません]
    known_wrong:
      - answer: いられない
        feedback_vi: てはいられない là "không thể cứ... mãi" - nghĩa khác. Mong ước không ngừng là てやまない.
        error_tag: yamanai_form
      - answer: やめない
        feedback_vi: やめない (không bỏ) là động từ hành động; mẫu cảm xúc là やまない (止む).
        error_tag: yamanai_form
    explanation:
      vi: 願ってやまない - không ngừng mong. Thể lịch sự やみません hay dùng trong lời chúc, phát biểu.
    display_answer: 子どもたちの健やかな成長を願ってやまない。

