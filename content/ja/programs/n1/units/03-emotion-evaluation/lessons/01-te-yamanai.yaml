  - key: ja:exercise:n1-u3-te-yamanai-mcq-kinjienai
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-wo-kinjienai
    prompt:
      stem: 'Chọn từ đúng: 罪のない子どもたちが犠牲になったという報道に、強い憤り＿＿。'
      stem_lang: vi
      options:
        - { id: g5b, text: を禁じ得ない, lang: ja }
        - { id: u1x, text: てやまない, lang: ja }
        - { id: w9s, text: に足る, lang: ja }
        - { id: k3p, text: を禁じる, lang: ja }
    answer:
      correct_option_id: g5b
    explanation:
      vi: Danh từ cảm xúc 憤り + を禁じ得ない - không kìm được phẫn nộ trước tin tức. てやまない cần động từ thể て; に足る là "đủ để"; を禁じる là "cấm".
    display_answer: を禁じ得ない

  - key: ja:exercise:n1-u3-te-yamanai-fill-setsuni
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u3-setsuni
    prompt:
      template: "一日も早い復興を{{b1}}願ってやみません。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Tôi tha thiết mong công cuộc tái thiết sớm hoàn thành."
        - "Gợi ý: phó từ trang trọng 'tha thiết' - せつに."
    answer:
      blanks:
        b1: [切に, せつに]
    known_wrong:
      - answer: 大切に
        feedback_vi: 大切に là "trân trọng, cẩn thận"; "tha thiết mong" là 切に願う.
        error_tag: vocab_meaning
      - answer: 必ず
        feedback_vi: 必ず là "nhất định"; đi với 願う để nói mong tha thiết dùng 切に.
        error_tag: vocab_meaning
    explanation:
      vi: 切に願う - tha thiết mong; kết hợp với てやみません tạo giọng văn rất trang trọng.
    display_answer: 一日も早い復興を切に願ってやみません。

