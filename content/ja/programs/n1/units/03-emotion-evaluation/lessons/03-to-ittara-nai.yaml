    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-kagiri-da
    prompt:
      stem: 'Chọn từ đúng: 長年の夢だった店をついに開くことができ、嬉しい＿＿です。'
      stem_lang: vi
      options:
        - { id: g1s, text: 限り, lang: ja }
        - { id: u5x, text: の至り, lang: ja }
        - { id: o9m, text: 極まりない, lang: ja }
        - { id: w3e, text: ったらありゃしない, lang: ja }
    answer:
