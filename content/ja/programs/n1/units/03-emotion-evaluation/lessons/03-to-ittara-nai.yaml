        error_tag: kagiri_form
    explanation:
      vi: 面倒くさいったらありゃしない - phiền kinh khủng (suồng sã). ったらない cũng được chấp nhận với cùng nghĩa.
    display_answer: 毎日満員電車に乗るのは、面倒くさいったらありゃしない。

