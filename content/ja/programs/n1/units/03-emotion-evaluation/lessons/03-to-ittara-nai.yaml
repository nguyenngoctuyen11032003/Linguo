  - key: ja:exercise:n1-u3-to-ittara-nai-fill-haradatashii
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-haradatashii
    prompt:
      template: "何度注意しても改善されないのは、{{b1}}といったらない。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Nhắc bao nhiêu lần vẫn không sửa, bực mình hết chỗ nói."
        - "Gợi ý: tính từ い 'đáng giận' - はらだたしい."
    answer:
      blanks:
        b1: [腹立たしい, はらだたしい]
    known_wrong:
      - answer: 腹が立つ
        feedback_vi: Chủ ngữ ở đây là sự việc (のは), nên dùng tính từ 腹立たしい (đáng giận). 腹が立つ nói về người đang giận.
        error_tag: haradatashii_form
      - answer: 心細い
        feedback_vi: 心細い là bơ vơ, bất an - không hợp tình huống bực vì bị phớt lờ.
        error_tag: vocab_meaning
    explanation:
      vi: 腹立たしい - đáng giận; ～といったらない - hết chỗ nói.
    display_answer: 何度注意しても改善されないのは、腹立たしいといったらない。

