    display_answer: 決勝で一点差で負けた時の悔しさといったらなかった。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u3-to-ittara-nai-fill-arya
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-gram-ttara-arya-shinai
    prompt:
      template: "毎日満員電車に乗るのは、面倒くさいったら{{b1}}。(than phiền: phiền kinh khủng)"
      blanks:
        - { id: b1, width_hint: 5 }
