        - お客様に多大なご迷惑をおかけしたことは、誠に遺憾に堪えない。
        - お客様に多大なご迷惑をおかけしたことは、遺憾に堪えない。
        - お客様に大きなご迷惑をおかけしたことは、誠に遺憾に堪えません。
        - お客様に大きなご迷惑をおかけしたことは、遺憾に堪えません。
        - お客様に多大なご迷惑をおかけしましたことは、誠に遺憾に堪えません。
        - お客様に多大な迷惑をかけたことは、遺憾に堪えない。
        - お客様に多大なご迷惑をおかけしたことは、誠に遺憾の念に堪えません。
        - お客様に多大なご迷惑をおかけしたことは、遺憾の念に堪えません。
        - お客様に多大なご迷惑をおかけしたことは、誠に遺憾にたえません。
        - お客さまに多大なご迷惑をおかけしたことは、誠に遺憾に堪えません。
        - おきゃくさまにただいなごめいわくをおかけしたことは、まことにいかんにたえません。
    known_wrong:
      - answer: お客様に多大なご迷惑をおかけしたことは、誠に遺憾に値します。
        feedback_vi: に値する là "đáng" (đánh giá giá trị); bày tỏ tiếc nuối trang trọng là 遺憾に堪えません.
        error_tag: atai_taenai
      - answer: お客様に多大なご迷惑をおかけしたことは、誠に遺憾の至りです。
        feedback_vi: Cụm cố định trong thông cáo là 遺憾に堪えません (hoặc 遺憾の念に堪えません).
        error_tag: collocation
    explanation:
      vi: 多大なご迷惑をおかけする - gây phiền hà lớn (khiêm nhường); 誠に遺憾に堪えません - thật vô cùng đáng tiếc.
    display_answer: お客様に多大なご迷惑をおかけしたことは、誠に遺憾に堪えません。

  - key: ja:exercise:n1-emotion-evaluation-review-translate-yorokobi
    type: translate
