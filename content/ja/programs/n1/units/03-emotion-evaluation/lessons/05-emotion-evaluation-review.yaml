      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 合格通知を受け取った時の喜びといったらなかった。
        - 合格通知を受け取ったときの喜びといったらなかった。
        - 合格通知を受け取った時の喜びといったらありませんでした。
        - 合格通知を受け取った時の嬉しさといったらなかった。
        - 合格通知を受け取ったときの嬉しさといったらなかった。
        - 合格通知をもらった時の喜びといったらなかった。
        - 合格通知をもらったときの喜びといったらなかった。
        - 合格通知をもらった時の嬉しさといったらなかった。
        - 合格の知らせを受け取った時の喜びといったらなかった。
        - 合格の通知を受け取った時の喜びといったらなかった。
        - 合格通知が届いた時の喜びといったらなかった。
        - 合格通知を受け取った時の喜びったらなかった。
        - ごうかくつうちをうけとったときのよろこびといったらなかった。
    known_wrong:
      - answer: 合格通知を受け取った時の喜びったらありゃしなかった。
        feedback_vi: ったらありゃしない dùng để than phiền; niềm vui dùng といったらなかった.
        error_tag: arya_shinai_positive
      - answer: 合格通知を受け取った時の喜びの至りだった。
        feedback_vi: の至り đi với một số danh từ cố định (光栄, 恐縮, 感激); câu này cần といったらなかった.
        error_tag: collocation
    explanation:
      vi: 合格通知 - thư báo đỗ; 受け取った時の喜び - niềm vui khi nhận; といったらなかった - không sao tả xiết (quá khứ).
    display_answer: 合格通知を受け取った時の喜びといったらなかった。

  # ---------------- application ----------------
  - key: ja:exercise:n1-emotion-evaluation-review-mcq-editorial
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u3-gram-wo-kinjienai
    prompt:
      stem: "Đọc xã luận: 「被災地の惨状を伝える映像には、誰もが涙を禁じ得なかっただろう。一方で、行政の対応の遅さは無責任極まりない。ただ、自ら現地に入り支援を続けるボランティアの存在は、称賛に値する。」 Thái độ của tác giả là gì?"
      stem_lang: vi
      options:
        - { id: c7r, text: "Xúc động trước cảnh thảm khốc, phê phán chính quyền chậm trễ và ca ngợi tình nguyện viên.", lang: vi }
        - { id: w1n, text: Khen chính quyền xử lý nhanh và phê phán tình nguyện viên., lang: vi }
        - { id: k5e, text: Cho rằng đoạn phim về vùng thiên tai không đáng xem., lang: vi }
        - { id: d9a, text: Thấy tình nguyện viên vô trách nhiệm vì tự ý vào vùng thiên tai., lang: vi }
    answer:
      correct_option_id: c7r
    explanation:
      vi: 涙を禁じ得なかった - không cầm được nước mắt; 無責任極まりない - vô trách nhiệm hết mức (chê chính quyền); 称賛に値する - đáng ca ngợi (khen tình nguyện viên).
    display_answer: Xúc động trước cảnh thảm khốc, phê phán chính quyền chậm trễ và ca ngợi tình nguyện viên.

