  - key: ja:exercise:n1-emotion-evaluation-review-mcq-kokuhyou
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-kokuhyou
    prompt:
      stem: 'Chọn từ phù hợp: 公開当初は評論家に＿＿された映画が、今では名作と呼ばれている。'
      stem_lang: vi
      options:
        - { id: b4x, text: 酷評, lang: ja }
        - { id: m8k, text: 謝辞, lang: ja }
        - { id: e2s, text: 心境, lang: ja }
        - { id: x6h, text: 惨状, lang: ja }
    answer:
      correct_option_id: b4x
    explanation:
      vi: 酷評される - bị chê thậm tệ; tương phản với 今では名作 (nay là kiệt tác). 謝辞 (lời cảm tạ), 心境 (tâm trạng), 惨状 (cảnh thảm khốc) không đi với される theo nghĩa này.
    display_answer: 酷評

  - key: ja:exercise:n1-emotion-evaluation-review-fill-sanjou
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-sanjou
    prompt:
      template: "地震の後の町の{{b1}}は、見るに{{b2}}ものだった。"
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Cảnh thảm khốc của thị trấn sau động đất thật không thể xem nổi."
        - "Gợi ý: 'cảnh thảm khốc' - さんじょう; 'không chịu nổi' - たえない."
    answer:
      blanks:
        b1: [惨状, さんじょう]
        b2: [堪えない, たえない]
    known_wrong:
      - answer: 値しない
        feedback_vi: 見るに値しない là "không đáng xem" (chê giá trị); cảnh quá thảm khốc không xem nổi là 見るに堪えない.
        error_tag: atai_taenai
      - answer: 心境
        feedback_vi: 心境 là tâm trạng; cảnh tượng thảm khốc là 惨状.
        error_tag: vocab_meaning
    explanation:
      vi: 町の惨状 - cảnh thảm khốc của thị trấn; 見るに堪えない - không thể xem nổi.
    display_answer: 地震の後の町の惨状は、見るに堪えないものだった。

  - key: ja:exercise:n1-emotion-evaluation-review-wb-shaji
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u3-shaji
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Tại lễ tốt nghiệp, đại diện sinh viên tốt nghiệp đã phát biểu lời cảm tạ.\""
      tokens:
        - { id: a3, text: 謝辞を }
        - { id: a1, text: 卒業式で、 }
        - { id: a5, text: 謝罪を }
        - { id: a4, text: 述べた }
        - { id: a2, text: 卒業生代表が }
    answer:
      orders:
