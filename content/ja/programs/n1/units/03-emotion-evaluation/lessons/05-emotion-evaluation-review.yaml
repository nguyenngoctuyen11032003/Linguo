body:
  - type: objective
    text:
      vi: Bài ôn tổng hợp đưa các mẫu cảm xúc, đánh giá vào ba dạng văn bản hay gặp trong đề đọc N1 - lời phát biểu cảm ơn (謝辞), bài phỏng vấn kể tâm trạng (心境) và bài bình luận khen chê (酷評, 称賛).
  - type: explain
    text:
      vi: 'Lời phát biểu trang trọng thường có khung: cảm ơn (感謝に堪えません / 光栄の至りです) → kể lại (その時の喜びといったらありませんでした) → lời chúc kết (今後のご発展を祈ってやみません).'
  - type: explain
    text:
      vi: 'Bài bình luận, xã luận dùng mẫu đánh giá: khen - ～に値する, ～に足る; chê - ～極まりない, 見るに堪えない; cảm xúc trước sự việc - ～を禁じ得ない. Từ mới: 謝辞 (lời cảm tạ), 心境 (tâm trạng), 酷評 (chê thậm tệ), 惨状 (cảnh thảm khốc).'
  - type: deep_explain
    text:
      vi: 'Khi đọc, hỏi hai câu: (1) Đây là khen hay chê? - に値する, に足る, の極み (贅沢の極み) thường là khen; 極まりない, に堪えない (見る / 聞く), ったらありゃしない là chê. (2) Cảm xúc của ai? - てやまない, 限りだ, の至り là của người nói; nếu câu nói về người khác, tác giả phải dùng định ngữ (彼が愛してやまない) hoặc ようだ / らしい. Bẫy hay gặp: に堪えない hai nghĩa - trước 感謝 / 遺憾 là "vô cùng", trước 見る / 聞く là "không chịu nổi".'
  - type: example
    target: 卒業式で、卒業生代表が謝辞を述べた。
    target_lang: ja
    translation:
      vi: Tại lễ tốt nghiệp, đại diện sinh viên tốt nghiệp đã phát biểu lời cảm tạ.
  - type: example
    target: 引退を決めた今の心境を、率直にお聞かせください。
    target_lang: ja
    translation:
      vi: Xin anh chia sẻ thẳng thắn tâm trạng lúc này khi đã quyết định giải nghệ.
  - type: example
    target: 公開当初は酷評された映画が、今では名作と呼ばれている。
    target_lang: ja
    translation:
      vi: Bộ phim từng bị chê thậm tệ lúc mới ra mắt nay lại được gọi là kiệt tác.
  - type: example
    target: 地震の後の町の惨状は、見るに堪えないものだった。
    target_lang: ja
    translation:
      vi: Cảnh thảm khốc của thị trấn sau động đất thật không thể xem nổi.
  - type: common_mistake
    wrong: 卒業式で、卒業生代表が謝罪を述べた。
    right: 卒業式で、卒業生代表が謝辞を述べた。
    target_lang: ja
    note:
      vi: 謝罪 là xin lỗi; lời cảm tạ trong buổi lễ là 謝辞.
  - type: common_mistake
    wrong: 監督は優勝して嬉しい限りだ。
    right: 監督は優勝して嬉しい限りだと語った。
    target_lang: ja
    note:
      vi: 限りだ là cảm xúc của người nói. Thuật lại cảm xúc của người khác cần dẫn lời (～と語った) hoặc dùng ようだ.
  - type: summary
    points:
      - vi: 'Phát biểu: 感謝に堪えません, 光栄の至りです, ～を祈ってやみません.'
      - vi: 'Đánh giá - khen: に値する, に足る; chê: 極まりない, 見るに堪えない.'
      - vi: 'Cảm xúc người nói: てやまない, 限りだ, の至り, といったらない.'
      - vi: 謝辞, 心境, 酷評, 惨状.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-emotion-evaluation-review-mcq-speech
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u3-shaji
    prompt:
      stem: "Đọc đoạn 謝辞: 「本日はこのような盛大な式を開いていただき、感謝に堪えません。入学した頃は知り合いもおらず、心細い限りでしたが、先生方の温かいご指導に支えられ、今日を迎えることができました。母校の今後ますますのご発展を祈ってやみません。」 Câu nào đúng với đoạn văn?"
      stem_lang: vi
      options:
        - { id: v2m, text: "Lúc mới nhập học người nói thấy bơ vơ, nhưng nhờ thầy cô dìu dắt đã đến được ngày hôm nay.", lang: vi }
        - { id: h6t, text: Người nói không chịu nổi buổi lễ quá long trọng., lang: vi }
        - { id: o4k, text: Lúc mới nhập học người nói đã có nhiều bạn bè thân thiết., lang: vi }
        - { id: s8f, text: Người nói đã ngừng mong trường cũ phát triển., lang: vi }
    answer:
      correct_option_id: v2m
    explanation:
      vi: 感謝に堪えません - vô cùng biết ơn (không phải "không chịu nổi"); 知り合いもおらず、心細い限りでした - không có người quen, bơ vơ vô cùng; 祈ってやみません - không ngừng cầu chúc.
    display_answer: Lúc mới nhập học người nói thấy bơ vơ, nhưng nhờ thầy cô dìu dắt đã đến được ngày hôm nay.

