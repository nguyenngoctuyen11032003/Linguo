    explanation:
      vi: 謝辞を述べる - phát biểu lời cảm tạ. 謝罪 là xin lỗi - không hợp lễ tốt nghiệp.
    display_answer: 卒業式で、卒業生代表が謝辞を述べた。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-emotion-evaluation-review-fill-mixed
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u3-gram-kiwamarinai
    prompt:
      template: "運転中にスマホを操作するのは危険{{b1}}が、彼の指摘は一考に{{b2}}。"
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [極まりない, きわまりない, 極まる, きわまる]
        b2: [値する, あたいする]
    known_wrong:
      - answer: の至りだ
        feedback_vi: の至り dành cho cảm xúc khiêm tốn của người nói; đánh giá một hành vi nguy hiểm dùng 危険極まりない.
        error_tag: itari_kiwamarinai
      - answer: 堪えない
        feedback_vi: 一考に値する - đáng để suy nghĩ; に堪えない không mang nghĩa "đáng".
        error_tag: atai_taenai
    explanation:
      vi: 危険極まりない - nguy hiểm hết mức (chê); 一考に値する - đáng để cân nhắc (khen). Một câu kết hợp cả chê lẫn khen.
    display_answer: 運転中にスマホを操作するのは危険極まりないが、彼の指摘は一考に値する。

