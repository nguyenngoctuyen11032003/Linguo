        - { id: f1p, text: Xin anh hãy suy nghĩ lại quyết định giải nghệ., lang: vi }
        - { id: j7d, text: Tôi muốn nói thẳng tâm trạng của mình khi giải nghệ., lang: vi }
    answer:
