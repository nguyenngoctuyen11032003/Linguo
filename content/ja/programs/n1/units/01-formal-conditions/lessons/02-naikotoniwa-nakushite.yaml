    display_answer: 聞かないことには

  - key: ja:exercise:n1-u1-naikotoniwa-nakushite-fill-kyouryoku
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u1-gram-nakushite
    prompt:
      template: "皆さんの協力{{b1}}、このイベントは実現できませんでした。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Nếu không có sự hợp tác của mọi người thì sự kiện này đã không thể thực hiện được."
        - "Gợi ý: mẫu \"không có N thì\" gắn thẳng vào danh từ, có thể thêm は."
    answer:
      blanks:
        b1: [なくしては, なくして, なしには, なしでは]
    known_wrong:
      - answer: をなくして
        feedback_vi: Thêm を thì なくして thành "làm mất". Gắn thẳng - 協力なくして(は).
        error_tag: nakushite_particle
      - answer: ないことには
        feedback_vi: ないことには gắn vào động từ thể ない; sau danh từ 協力 dùng なくして(は).
        error_tag: naikotoniwa_noun
    explanation:
      vi: 協力なくしては - "nếu không có sự hợp tác"; vế sau phủ định quá khứ - lời cảm ơn trang trọng. なしには / なしでは cùng nghĩa, ít trang trọng hơn.
    display_answer: 皆さんの協力なくしては、このイベントは実現できませんでした。

  - key: ja:exercise:n1-u1-naikotoniwa-nakushite-wb-jitsubutsu
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u1-jitsubutsu
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Chưa xem đồ thật thì tôi chưa nói được gì.\""
      tokens:
        - { id: q3, text: 何とも言えません }
        - { id: q4, text: 見たことには }
        - { id: q1, text: 実物を }
        - { id: q2, text: 見ないことには }
    answer:
      orders:
        - [q1, q2, q3]
    explanation:
      vi: 見る → 見ない + ことには; 何とも言えません - không nói được gì (chưa thể đánh giá). 見たことには không phải là mẫu ngữ pháp.
    display_answer: 実物を見ないことには、何とも言えません。

