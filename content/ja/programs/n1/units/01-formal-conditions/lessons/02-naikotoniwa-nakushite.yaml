  - key: ja:exercise:n1-u1-naikotoniwa-nakushite-mcq-form
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u1-gram-naikotoniwa
    prompt:
      stem: 'Chọn dạng đúng: 「本人に＿＿、本当の理由は分からない。」 (聞く)'
      stem_lang: vi
      options:
        - { id: i5a, text: 聞かないことには, lang: ja }
        - { id: j2b, text: 聞くないことには, lang: ja }
        - { id: k8c, text: 聞かなくして, lang: ja }
        - { id: l4d, text: 聞いたことには, lang: ja }
    answer:
