      stem_lang: vi
      options:
        - { id: a2c, text: "Chưa dùng thử thực tế thì chưa biết có tốt hay không.", lang: vi }
        - { id: b7f, text: "Dù không dùng thử thì cũng biết là tốt.", lang: vi }
        - { id: c4j, text: "Đã dùng thử rồi nhưng vẫn không biết có tốt không.", lang: vi }
        - { id: d9m, text: "Không nên dùng thử vì không biết có tốt không.", lang: vi }
