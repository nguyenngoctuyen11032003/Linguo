    item: ja:item:n1-u1-yamitsuki
    prompt:
      template: "このラーメンは一度{{b1}}最後、病みつきになる。(食べる)"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Món ramen này đã ăn một lần là nghiện luôn."
        - "Gợi ý: chia 食べる sang thể たら (hoặc thể た + が)."
    answer:
      blanks:
        b1: [食べたら, たべたら, 食べたが, たべたが]
    known_wrong:
      - answer: 食べるが
        feedback_vi: が最後 gắn vào thể た - 食べたが最後.
        error_tag: gasaigo_form
      - answer: 食べれば
        feedback_vi: Mẫu là たら最後 hoặc たが最後, không dùng ば.
        error_tag: tarasaigo_form
    explanation:
      vi: 食べたら最後 / 食べたが最後 - đã ăn thì không dứt ra được. 病みつき ở đây là cách nói vui, khen món ăn.
    display_answer: このラーメンは一度食べたら最後、病みつきになる。

