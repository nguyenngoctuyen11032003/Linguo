  vi: "Ôn tập: bản tin, thông báo và lời cảm ơn trang trọng"
objectives:
  - vi: Đọc hiểu một bản tin và một thông báo công ty dùng các mẫu điều kiện, giả định N1.
  - vi: Chọn đúng giữa とあれば/とあって, ないことには/なくして, たら最後/が最後, が早いか/や否や/なり theo ngữ cảnh.
