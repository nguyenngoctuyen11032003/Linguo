title:
  vi: Vừa... là ngay lập tức - ～が早いか, ～や否や, ～なり
objectives:
  - vi: Dùng ～が早いか, ～や否や, ～なり để kể hai hành động nối nhau tức thì.
  - vi: Phân biệt sắc thái - が早いか (nhanh như chớp), や否や (văn viết), なり (hành động bất ngờ của cùng một người).
  - vi: Không dùng ba mẫu này cho ý chí, mệnh lệnh hay chuyện của chính mình (với なり).
