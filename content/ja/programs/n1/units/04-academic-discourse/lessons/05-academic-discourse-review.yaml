        - Bất kể kết quả ra sao, có trách nhiệm giải thích cơ sở của nó.
        - Bất kể kết quả thế nào, vẫn có trách nhiệm giải thích cơ sở của điều đó.
        - Bất luận kết quả ra sao, vẫn có trách nhiệm giải thích căn cứ của nó.
        - Không kể kết quả ra sao, vẫn có trách nhiệm giải thích căn cứ của nó.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tuỳ theo kết quả mà có trách nhiệm giải thích căn cứ của nó.
        feedback_vi: いかんによらず là "bất kể", không phải "tuỳ theo" (いかんによって).
        error_tag: ikan_meaning
    explanation:
      vi: 結果のいかんによらず - bất kể kết quả ra sao; 根拠を説明する責任がある - có trách nhiệm giải thích căn cứ.
    display_answer: Bất kể kết quả ra sao, vẫn có trách nhiệm giải thích căn cứ của nó.

