  - key: ja:exercise:n1-academic-review-translate-teigen
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u4-teigen
    prompt:
      source_text: Nhóm nghiên cứu đã kiến nghị với Bộ trưởng việc rút ngắn thời gian làm việc. (dùng 提言)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 研究チームは、労働時間の短縮を大臣に提言した。
        - 研究チームは、大臣に労働時間の短縮を提言した。
        - 研究チームは、労働時間の短縮を大臣に提言しました。
        - 研究チームは、大臣に労働時間の短縮を提言しました。
        - 研究チームは、労働時間を短縮するよう大臣に提言した。
        - 研究チームは、大臣に労働時間を短縮するよう提言した。
        - 研究チームは、労働時間を短縮すべきだと大臣に提言した。
        - 研究チームは、大臣に対して労働時間の短縮を提言した。
        - 研究チームが、労働時間の短縮を大臣に提言した。
        - 研究グループは、労働時間の短縮を大臣に提言した。
        - けんきゅうチームは、ろうどうじかんのたんしゅくをだいじんにていげんした。
    known_wrong:
      - answer: 研究チームは、労働時間の短縮を大臣を提言した。
        feedback_vi: Người nhận kiến nghị đi với に - 大臣に提言する; を đã dành cho nội dung kiến nghị.
        error_tag: particle
      - answer: 大臣は、労働時間の短縮を研究チームに提言した。
        feedback_vi: Đảo chủ thể - người kiến nghị là nhóm nghiên cứu, người nhận là Bộ trưởng.
        error_tag: meaning
    explanation:
      vi: (nội dung) を + (người nhận) に + 提言する - kiến nghị điều gì với ai; 短縮 - sự rút ngắn. 提言 trang trọng hơn 提案 (đề xuất) - thường là chuyên gia gửi lên cơ quan có thẩm quyền.
    display_answer: 研究チームは、労働時間の短縮を大臣に提言した。

  - key: ja:exercise:n1-academic-review-translate-oite
    type: translate
    stage: recall
