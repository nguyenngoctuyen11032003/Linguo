  - key: ja:exercise:n1-academic-review-mcq-grammar
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u4-gram-ikan-dewa
    prompt:
      stem: 'Chọn từ phù hợp: 今回の調査結果＿＿、計画そのものを見直さざるを得なくなるかもしれない。'
      stem_lang: vi
      options:
        - { id: s6v, text: いかんによっては, lang: ja }
        - { id: k2b, text: いかんによらず, lang: ja }
        - { id: w9e, text: をおいて, lang: ja }
        - { id: h4p, text: といえども, lang: ja }
    answer:
      correct_option_id: s6v
    explanation:
      vi: Vế sau là khả năng (～かもしれない) nên dùng いかんによっては - tuỳ kết quả. いかんによらず là "bất kể", ngược nghĩa.
    display_answer: いかんによっては

  - key: ja:exercise:n1-academic-review-fill-ronten
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-ronten
    prompt:
      template: "議論の{{b1}}を整理してから、結論を出しましょう。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Hãy sắp xếp lại các luận điểm của cuộc tranh luận rồi mới đưa ra kết luận."
        - "Gợi ý: 'luận điểm' - ろんてん."
    answer:
      blanks:
        b1: [論点, ろんてん]
    known_wrong:
      - answer: 結論
        feedback_vi: Câu đã có 結論を出す ở vế sau; thứ cần sắp xếp trước là 論点 (luận điểm).
        error_tag: vocab_meaning
      - answer: ろんでん
        feedback_vi: Đọc ろんてん - て không có dấu đục.
        error_tag: reading
    explanation:
      vi: 論点を整理する - sắp xếp các luận điểm.
    display_answer: 議論の論点を整理してから、結論を出しましょう。

  - key: ja:exercise:n1-academic-review-wb-kenkai
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-kenkai
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Về vấn đề này, chính phủ vẫn chưa đưa ra quan điểm chính thức.\""
      tokens:
        - { id: v3, text: 公式な見解を }
        - { id: v5, text: 公式な根拠を }
        - { id: v1, text: この問題について、 }
        - { id: v4, text: 示していない }
        - { id: v2, text: 政府はまだ }
    answer:
