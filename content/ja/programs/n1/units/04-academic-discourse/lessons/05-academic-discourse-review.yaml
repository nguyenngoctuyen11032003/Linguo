    display_answer: この問題を解決できるのは、山田教授をおいて他にいない。

  # ---------------- application ----------------
  - key: ja:exercise:n1-academic-review-mcq-editorial
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u4-gram-nagaramo
    prompt:
      stem: "Đọc đoạn xã luận: 「市は財政難を理由に、図書館の開館時間を短縮すると発表した。厳しい財政事情は理解できるとはいえ、住民の声を聞かないまま決めたことは問題だ。市は住民の学ぶ機会を守ると言いながらも、その場を自ら狭めている。市民の実情に即した議論をやり直すべきだ。」 Người viết phê phán điều gì nhất?"
      stem_lang: vi
      options:
        - { id: z4c, text: Thành phố quyết định mà không nghe ý kiến cư dân và mâu thuẫn với lời hứa của chính mình., lang: vi }
        - { id: r7m, text: Thành phố đang gặp khó khăn tài chính nghiêm trọng., lang: vi }
        - { id: d1u, text: Cư dân không chịu sử dụng thư viện., lang: vi }
        - { id: l5g, text: Thư viện nên đóng cửa hoàn toàn để tiết kiệm ngân sách., lang: vi }
    answer:
      correct_option_id: z4c
    explanation:
      vi: 財政事情は理解できるとはいえ - vế công nhận (không phải ý chính); 住民の声を聞かないまま決めたことは問題だ - phê phán; 守ると言いながらも、自ら狭めている - nói vậy nhưng lại tự thu hẹp; 実情に即した議論をやり直すべきだ - kiến nghị.
    display_answer: Thành phố quyết định mà không nghe ý kiến cư dân và mâu thuẫn với lời hứa của chính mình.

  - key: ja:exercise:n1-academic-review-translate-to-vi
