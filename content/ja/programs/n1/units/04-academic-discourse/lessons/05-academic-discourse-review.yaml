    explanation:
      vi: 見解を示す - nêu quan điểm; 根拠 là căn cứ, không phải "quan điểm".
    display_answer: この問題について、政府はまだ公式な見解を示していない。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-academic-review-fill-konkyo
