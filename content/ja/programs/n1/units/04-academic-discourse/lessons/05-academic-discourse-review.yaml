        - この問題を解決できるのは、山田先生をおいて他にいない。
        - この問題を解決できるのは、山田先生をおいて他にいません。
        - この問題を解決できる人は、山田先生をおいて他にいない。
        - このもんだいをかいけつできるのは、やまだきょうじゅをおいてほかにいない。
    known_wrong:
      - answer: この問題を解決できるのは、山田教授を除いて他にいない。
        feedback_vi: を除いて là "trừ ra" - ngược nghĩa. Dùng をおいて.
