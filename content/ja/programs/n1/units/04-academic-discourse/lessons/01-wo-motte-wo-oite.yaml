key: ja:lesson:n1-u4-wo-motte-wo-oite
order_index: 1
level: n1
title:
  vi: Văn bản trang trọng - ～をもって, ～をおいて(他に)
objectives:
  - vi: Hiểu ～をもって với nghĩa mốc kết thúc / bắt đầu và nghĩa "bằng (phương tiện)".
  - vi: Đánh giá ai / cái gì là duy nhất bằng ～をおいて他に～ない.
  - vi: Đọc hiểu thông báo chính thức dùng 締め切る, 書面, 適任.
estimated_minutes: 24
skills: [grammar, reading, vocabulary]
prerequisites: [ja:lesson:n1-emotion-evaluation-review]
items:
  - item: ja:item:n1-u4-shimekiru
  - item: ja:item:n1-u4-tekinin
  - item: ja:item:n1-u4-shomen
  - item: ja:item:n1-u4-gram-wo-motte
  - item: ja:item:n1-u4-gram-wo-oite
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc được những câu rất "giấy tờ" như 本日をもって受付を締め切ります hay 彼をおいて他に適任者はいない - kiểu câu gặp thường xuyên trong thông báo, diễn văn và đề đọc hiểu N1.
  - type: explain
    text:
      vi: 'N + をもって (1) - mốc chính thức kết thúc hoặc bắt đầu: 本日をもって閉店いたします (đóng cửa kể từ hôm nay); 4月1日をもって社名を変更する. Dạng lịch sự hơn: をもちまして - 以上をもちまして終了いたします.'
  - type: explain
    text:
      vi: 'N + をもって (2) - phương tiện, căn cứ, trang trọng hơn で: 書面をもって通知する (thông báo bằng văn bản); 彼の実力をもってすれば、優勝も夢ではない (với thực lực của anh ấy thì...).'
  - type: explain
    text:
      vi: 'N + をおいて他に～ない - "ngoài N ra thì không có": この仕事を任せられるのは、彼をおいて他にいない. Có thể lược 他に: 彼をおいて適任者はいない. Vế sau luôn phủ định.'
  - type: deep_explain
    text:
      vi: 'Hai mẫu cùng dùng を nhưng khác hẳn: をもって gắn với mốc / công cụ, còn をおいて là "đặt sang một bên N thì không còn gì" - tức khen N là duy nhất. Đừng nhầm をおいて với を除いて (trừ N ra): 彼を除いて全員賛成した chỉ loại trừ, không đánh giá. Ngoài ra, をもって không phải hạn nộp: "nộp trước thứ Sáu" là 金曜日までに提出.'
  - type: example
    target: 本日をもちまして、受付を締め切らせていただきます。
    target_lang: ja
    translation:
      vi: Kể từ hôm nay, chúng tôi xin phép ngừng nhận hồ sơ.
  - type: example
    target: 結果は後日、書面をもってお知らせいたします。
    target_lang: ja
    translation:
      vi: Kết quả sẽ được thông báo bằng văn bản vào ngày khác.
  - type: example
    target: 彼女の語学力をもってすれば、通訳の仕事も十分こなせるだろう。
    target_lang: ja
    translation:
      vi: Với năng lực ngoại ngữ của cô ấy thì hoàn toàn có thể đảm đương công việc phiên dịch.
  - type: example
    target: 次の社長には、田中さんをおいて他に適任者はいない。
    target_lang: ja
    translation:
      vi: Làm giám đốc kế nhiệm thì ngoài anh Tanaka ra không còn ai thích hợp hơn.
  - type: common_mistake
    wrong: 金曜日をもって書類を提出してください。
    right: 金曜日までに書類を提出してください。
    target_lang: ja
    note:
      vi: をもって là mốc kết thúc / thay đổi tình trạng do bên thông báo quyết định (締め切る, 終了する), không dùng làm hạn chót cho người khác làm việc gì - hạn chót là までに.
  - type: common_mistake
    wrong: この役は、彼をおいて他に適任者がいる。
    right: この役は、彼をおいて他に適任者はいない。
    target_lang: ja
    note:
      vi: ～をおいて他に luôn đi với phủ định ở cuối câu (いない / ない); ý câu là "chỉ có N".
  - type: summary
    points:
      - vi: をもって (mốc) - 本日をもって終了; lịch sự hơn - をもちまして.
      - vi: をもって (phương tiện) - 書面をもって; ～をもってすれば - với (năng lực) ... thì.
      - vi: をおいて他に～ない - ngoài N ra không có; khác を除いて (trừ ra).
      - vi: 締め切る (khoá sổ), 書面 (văn bản), 適任 (thích hợp với vai trò).
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-u4-wo-motte-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n1-u4-gram-wo-motte
    prompt:
      stem: 「本日をもって閉店いたします」 - をもって ở đây nghĩa là gì?
      stem_lang: vi
      options:
        - { id: k3a, text: "kể từ, đến hết (mốc kết thúc chính thức)", lang: vi }
        - { id: p7d, text: "trước (hạn chót)", lang: vi }
        - { id: c2m, text: "mang theo", lang: vi }
        - { id: z9e, text: "ngoài ra thì không", lang: vi }
    answer:
      correct_option_id: k3a
    explanation:
      vi: 本日をもって閉店 - đóng cửa kể từ hôm nay (hôm nay là ngày cuối). Hạn chót là までに; "ngoài ra thì không" là をおいて他に～ない.
    display_answer: "kể từ, đến hết (mốc kết thúc chính thức)"

