  - key: ja:exercise:n1-u4-wo-motte-mcq-oite
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-gram-wo-oite
    prompt:
      stem: 'Chọn từ phù hợp: この難しい交渉を任せられるのは、山本さん＿＿他にいない。'
      stem_lang: vi
      options:
        - { id: f5s, text: をおいて, lang: ja }
        - { id: u2k, text: を除いて, lang: ja }
        - { id: d8v, text: をもって, lang: ja }
        - { id: l3j, text: に即して, lang: ja }
    answer:
      correct_option_id: f5s
    explanation:
      vi: ～をおいて他にいない - ngoài anh Yamamoto ra không còn ai (đánh giá cao nhất). を除いて chỉ là "trừ ra", không đi với 他にいない theo nghĩa khen.
    display_answer: をおいて

  - key: ja:exercise:n1-u4-wo-motte-fill-shomen
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u4-shomen
    prompt:
      template: "結果は後日、{{b1}}をもってお知らせいたします。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Kết quả sẽ được thông báo bằng văn bản vào ngày khác."
        - "Gợi ý: 'văn bản' (đối lập với nói miệng) - しょめん."
    answer:
      blanks:
        b1: [書面, しょめん]
    known_wrong:
      - answer: 書類
        feedback_vi: 書類 là giấy tờ, hồ sơ cụ thể; "bằng hình thức văn bản" là 書面.
        error_tag: vocab_meaning
      - answer: しょうめん
        feedback_vi: しょ là âm ngắn - しょめん. しょうめん (正面) là "mặt trước".
        error_tag: long_vowel
    explanation:
      vi: 書面をもって - bằng văn bản (trang trọng hơn 書面で).
    display_answer: 結果は後日、書面をもってお知らせいたします。

  - key: ja:exercise:n1-u4-wo-motte-wb-oite
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-tekinin
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Làm giám đốc kế nhiệm thì ngoài anh Tanaka ra không còn ai thích hợp.\""
      tokens:
        - { id: t3, text: 他に適任者はいない }
        - { id: t1, text: 次の社長には、 }
        - { id: t4, text: 田中さんをもって }
        - { id: t2, text: 田中さんをおいて }
    answer:
      orders:
        - [t1, t2, t3]
    explanation:
      vi: N + をおいて + 他に適任者はいない. をもって là mốc / phương tiện, không mang nghĩa "ngoài ra".
    display_answer: 次の社長には、田中さんをおいて他に適任者はいない。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u4-wo-motte-fill-shimekiru
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-shimekiru
    prompt:
      template: "応募は今月末をもって{{b1}}ます。(khoá sổ, ngừng nhận)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [締め切り, しめきり, 締切り]
    known_wrong:
      - answer: 閉め
        feedback_vi: 閉める là đóng (cửa, nắp); ngừng nhận hồ sơ là 締め切る.
        error_tag: vocab_meaning
      - answer: 締め切
