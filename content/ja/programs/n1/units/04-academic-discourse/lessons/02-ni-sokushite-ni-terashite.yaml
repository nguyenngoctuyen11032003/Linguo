  - key: ja:exercise:n1-u4-sokushite-fill-terashite
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u4-gram-ni-terashite
    prompt:
      template: "社内規定に{{b1}}、彼の行為は処分の対象となる。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Đối chiếu với quy định công ty, hành vi của anh ta thuộc diện bị xử lý."
        - "Gợi ý: động từ 照らす ở thể て."
    answer:
      blanks:
        b1: [照らして, てらして, 照らすと, 照らせば]
    known_wrong:
      - answer: 即して
        feedback_vi: Ở đây quy định là thước đo để phán xét - に照らして, không phải に即して.
        error_tag: sokushite_terashite
      - answer: 照らされて
        feedback_vi: 照らされて là bị động "bị chiếu sáng"; mẫu đối chiếu dùng 照らして.
        error_tag: grammar_form
    explanation:
      vi: 規定に照らして - đối chiếu với quy định; 処分の対象となる - thuộc diện bị xử lý.
    display_answer: 社内規定に照らして、彼の行為は処分の対象となる。

