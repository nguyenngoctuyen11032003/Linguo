      stem_lang: vi
      options:
        - { id: v2a, text: 安全基準に照らして、この製品には問題があると言わざるを得ない。, lang: ja }
        - { id: l6m, text: 安全基準に即して、この製品には問題があると言わざるを得ない。, lang: ja }
        - { id: t9f, text: 安全基準をおいて、この製品には問題があると言わざるを得ない。, lang: ja }
        - { id: d3y, text: 安全基準に照らされて、この製品には問題があると言わざるを得ない。, lang: ja }
