  - key: ja:exercise:n1-u4-towaie-mcq-shasetsu
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u4-shasetsu
    prompt:
      stem: "Đọc đoạn xã luận: 「政府は物価高に対して一定の措置を講じた。とはいえ、その効果は限定的だと言わざるを得ない。低所得世帯ほど負担が重いことを認識していながらも、支援の対象を絞り込んだからだ。より踏み込んだ対策が求められる。」 Quan điểm của bài xã luận là gì?"
      stem_lang: vi
      options:
        - { id: a8t, text: Biện pháp của chính phủ hiệu quả hạn chế; cần biện pháp mạnh hơn., lang: vi }
        - { id: n3k, text: Chính phủ chưa làm gì để đối phó giá cả leo thang., lang: vi }
        - { id: o6c, text: Biện pháp của chính phủ đã giải quyết triệt để vấn đề., lang: vi }
        - { id: e4v, text: Chính phủ không biết hộ thu nhập thấp chịu gánh nặng lớn., lang: vi }
    answer:
      correct_option_id: a8t
    explanation:
      vi: とはいえ、効果は限定的だ - tuy có biện pháp nhưng hiệu quả hạn chế; 認識していながらも - dù nhận thức được (nên không phải "không biết"); より踏み込んだ対策が求められる - cần biện pháp quyết liệt hơn.
    display_answer: Biện pháp của chính phủ hiệu quả hạn chế; cần biện pháp mạnh hơn.

