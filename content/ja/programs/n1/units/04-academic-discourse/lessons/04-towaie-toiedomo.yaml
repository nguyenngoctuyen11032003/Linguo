  - key: ja:exercise:n1-u4-towaie-fill-kenen
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u2-kenen
    prompt:
      template: "専門家の間では、副作用への{{b1}}が広がっている。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Trong giới chuyên gia, mối lo ngại về tác dụng phụ đang lan rộng."
        - "Gợi ý: 'lo ngại' (văn viết) - けねん."
    answer:
      blanks:
        b1: [懸念, けねん]
    known_wrong:
      - answer: けんねん
        feedback_vi: Đọc けねん - không có ん sau け.
        error_tag: reading
      - answer: 期待
        feedback_vi: 期待 là "kỳ vọng" - ngược sắc thái với tác dụng phụ. "Lo ngại" là 懸念.
        error_tag: vocab_meaning
    explanation:
      vi: ～への懸念 - mối lo ngại về ～; 懸念が広がる - nỗi lo lan rộng.
    display_answer: 専門家の間では、副作用への懸念が広がっている。

