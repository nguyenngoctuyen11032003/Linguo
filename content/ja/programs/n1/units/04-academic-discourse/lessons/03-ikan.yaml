key: ja:lesson:n1-u4-ikan
order_index: 3
level: n1
title:
  vi: Phụ thuộc và bất kể - ～いかんによらず, ～いかんでは
objectives:
  - vi: Nói "bất kể ... ra sao" bằng ～(の)いかんによらず / いかんにかかわらず / いかんを問わず.
  - vi: Nói "tuỳ vào ... mà có thể" bằng ～いかんでは / いかんによっては, và "phụ thuộc vào" bằng ～いかんだ.
  - vi: Đọc quy định, thông báo với 審査, 措置, 無断.
estimated_minutes: 25
skills: [grammar, reading, vocabulary]
prerequisites: [ja:lesson:n1-u4-ni-sokushite-ni-terashite]
items:
  - item: ja:item:n1-u4-shinsa
  - item: ja:item:n1-u4-sochi
