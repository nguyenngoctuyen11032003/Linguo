body:
  - type: objective
    text:
      vi: Bài ôn cuối unit đưa bạn vào dạng đọc N1 - đoạn văn bình luận về ngôn ngữ và văn hoá, trong đó thành ngữ vừa là nội dung vừa là công cụ diễn đạt.
  - type: explain
    text:
      vi: 'Ba loại: 慣用句 (顔が広い, 耳が痛い) - cụm cố định mang nghĩa bóng; ことわざ (猫に小判, 出る杭は打たれる) - câu tục ngữ có bài học; 四字熟語 (一期一会, 以心伝心) - bốn chữ Hán. Bàn về nguồn gốc: ～は～に由来する (bắt nguồn từ), ～は～というたとえだ (là lối ví von rằng ~).'
  - type: explain
    text:
      vi: 'Mẫu giải nghĩa hay gặp trong đề và từ điển: 「猫に小判」は、価値の分からない人に貴重なものを与えても無駄だというたとえだ. Mẫu trích dẫn: ～と言うように, ～と言うが, ～とはよく言ったものだ (ôn bài 2).'
  - type: deep_explain
    text:
      vi: 'Trong bài đọc, thành ngữ thường dùng để tóm ý hoặc chuyển ý: tác giả trích 出る杭は打たれる để mô tả hiện trạng rồi phản bác bằng しかし. Ý chính vẫn nằm sau từ nối và ở câu cuối. Khi gặp thành ngữ lạ, đừng dịch từng chữ - dựa vào câu xung quanh để đoán sắc thái tốt hay xấu.'
  - type: example
    target: 体の部分を使った慣用句は日常会話でよく使われる。
    target_lang: ja
    translation:
      vi: Quán dụng ngữ dùng bộ phận cơ thể được dùng nhiều trong hội thoại hằng ngày.
  - type: example
    target: 「一期一会」という言葉は茶道に由来する。
    target_lang: ja
    translation:
      vi: Cụm từ "nhất kỳ nhất hội" bắt nguồn từ trà đạo.
  - type: example
    target: 「猫に小判」は、価値の分からない人に貴重なものを与えても無駄だというたとえだ。
    target_lang: ja
    translation:
      vi: Câu "đưa vàng cho mèo" là lối ví von rằng đưa vật quý cho người không biết giá trị cũng vô ích.
  - type: example
    target: 出る杭は打たれると言うが、最近は個性を評価する会社も増えている。
    target_lang: ja
    translation:
      vi: Người ta nói cây cao đón gió, nhưng gần đây số công ty đánh giá cao cá tính cũng đang tăng.
  - type: common_mistake
    wrong: 「一期一会」という言葉は茶道を由来する。
    right: 「一期一会」という言葉は茶道に由来する。
    target_lang: ja
    note:
      vi: Bắt nguồn từ ~ dùng に - ～に由来する.
  - type: common_mistake
    wrong: 「花より団子」は有名な四字熟語だ。
    right: 「花より団子」は有名なことわざだ。
    target_lang: ja
    note:
      vi: 花より団子 không phải bốn chữ Hán ghép thành một từ - đó là ことわざ. 四字熟語 là dạng như 一石二鳥, 以心伝心.
  - type: summary
    points:
      - vi: 慣用句 - cụm nghĩa bóng; ことわざ - câu tục ngữ; 四字熟語 - thành ngữ bốn chữ.
      - vi: ～に由来する - bắt nguồn từ ~; ～というたとえ - lối ví von rằng ~.
      - vi: Trích dẫn - ～と言うように / ～と言うが / ～とはよく言ったものだ.
      - vi: Thư trang trọng - 拝啓 → 時候の挨拶 → ご清栄 → 本文 → ご自愛 → 略儀ながら → 敬具.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-idiom-culture-review-mcq-kind
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-kanyouku
    prompt:
      stem: 'Chọn từ phù hợp: 「顔が広い」や「耳が痛い」のように、体の部分を使った＿＿は多い。'
      stem_lang: vi
      options:
        - { id: d6v, text: 慣用句, lang: ja }
        - { id: k2s, text: 四字熟語, lang: ja }
        - { id: x9f, text: 敬語, lang: ja }
        - { id: o3w, text: 時候の挨拶, lang: ja }
    answer:
      correct_option_id: d6v
    explanation:
      vi: 顔が広い, 耳が痛い là quán dụng ngữ (慣用句). 四字熟語 phải là bốn chữ Hán; 敬語 là kính ngữ; 時候の挨拶 là lời chào theo mùa trong thư.
    display_answer: 慣用句

  - key: ja:exercise:n1-idiom-culture-review-listen-yurai
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n1-u5-yurai
    prompt:
      audio_asset_id: null
      fallback_text: 「一期一会」という言葉は茶道に由来する。
      options:
        - { id: t7b, text: Cụm từ "nhất kỳ nhất hội" bắt nguồn từ trà đạo., lang: vi }
        - { id: e4n, text: Cụm từ "nhất kỳ nhất hội" thường được dùng trong trà đạo hiện đại., lang: vi }
        - { id: w8c, text: Trà đạo bắt nguồn từ cụm từ "nhất kỳ nhất hội"., lang: vi }
        - { id: y2h, text: Cụm từ "nhất kỳ nhất hội" không liên quan đến trà đạo., lang: vi }
    answer:
      correct_option_id: t7b
    explanation:
      vi: AはBに由来する - A bắt nguồn từ B. Ở đây A là 一期一会, B là 茶道 (trà đạo).
    display_answer: Cụm từ "nhất kỳ nhất hội" bắt nguồn từ trà đạo.

  - key: ja:exercise:n1-idiom-culture-review-mcq-tatoe
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-tatoe
    prompt:
      stem: 'Câu nào giải thích đúng nghĩa của 「猫に小判」?'
      stem_lang: vi
      options:
        - { id: p1m, text: 価値の分からない人に貴重なものを与えても無駄だというたとえ, lang: ja }
        - { id: g5q, text: 上手な人でも失敗することがあるというたとえ, lang: ja }
        - { id: r7z, text: 我慢して続ければ必ず成果が出るというたとえ, lang: ja }
        - { id: h3k, text: 目立つ人は周りから攻撃されやすいというたとえ, lang: ja }
    answer:
      correct_option_id: p1m
    explanation:
      vi: 猫に小判 - đồ quý vô ích với người không biết giá trị. Các phương án khác lần lượt là 猿も木から落ちる, 石の上にも三年, 出る杭は打たれる.
    display_answer: 価値の分からない人に貴重なものを与えても無駄だというたとえ

  - key: ja:exercise:n1-idiom-culture-review-fill-yurai
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-yurai
    prompt:
      template: "「一期一会」という言葉は茶道{{b1}}{{b2}}する。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Cụm từ \"nhất kỳ nhất hội\" bắt nguồn từ trà đạo."
        - "Gợi ý: trợ từ + từ Hán 'do lai' (nguồn gốc) - ゆらい."
    answer:
      blanks:
        b1: [に]
        b2: [由来, ゆらい]
    known_wrong:
      - answer: を
        feedback_vi: 由来する đi với に - 茶道に由来する.
        error_tag: particle_ni
      - answer: 原因
        feedback_vi: 原因 là nguyên nhân của sự việc. Nguồn gốc của từ ngữ là 由来.
        error_tag: vocab_meaning
    explanation:
      vi: ～に由来する - bắt nguồn từ ~.
    display_answer: 「一期一会」という言葉は茶道に由来する。

  - key: ja:exercise:n1-idiom-culture-review-wb-kotowaza
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-deru-kui
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Người ta nói cây cao đón gió, nhưng gần đây số công ty đánh giá cao cá tính cũng đang tăng.\""
      tokens:
        - { id: c4, text: 増えている }
        - { id: c2, text: 最近は個性を }
        - { id: c5, text: 減っている }
        - { id: c1, text: 出る杭は打たれると言うが、 }
        - { id: c3, text: 評価する会社も }
    answer:
      orders:
        - [c1, c2, c3, c4]
    explanation:
      vi: ～と言うが - người ta nói ~ nhưng; 個性を評価する - đánh giá cao cá tính; 増えている - đang tăng. 減っている (đang giảm) sai nghĩa.
    display_answer: 出る杭は打たれると言うが、最近は個性を評価する会社も増えている。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-idiom-culture-review-fill-mimi
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-mimi-ga-itai
    prompt:
      template: "後輩に「先輩はいつも話が長い」と言われて、{{b1}}が痛かった。(nghe nhột vì bị nói trúng)"
      blanks:
        - { id: b1, width_hint: 1 }
    answer:
      blanks:
        b1: [耳, みみ]
    known_wrong:
      - answer: 頭
        feedback_vi: 頭が痛い là "đau đầu, đau đầu vì lo". Bị nói trúng lỗi mình là 耳が痛い.
        error_tag: idiom_meaning
      - answer: 腹
        feedback_vi: 腹が痛い chỉ là đau bụng; tức giận là 腹が立つ. Ở đây là 耳が痛い.
        error_tag: idiom_meaning
    explanation:
      vi: 耳が痛い - lời nói đúng lỗi của mình nên nghe khó chịu.
    display_answer: 後輩に「先輩はいつも話が長い」と言われて、耳が痛かった。

