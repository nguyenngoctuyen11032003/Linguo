title:
  vi: "Ôn tập: thành ngữ, tục ngữ và văn hoá trong bài đọc"
objectives:
  - vi: Phân biệt 慣用句, ことわざ, 四字熟語 và giải thích nguồn gốc bằng ～に由来する, ～というたとえ.
  - vi: Đọc hiểu đoạn văn bàn về văn hoá có dùng thành ngữ, tục ngữ.
  - vi: Chọn thành ngữ và câu thư từ đúng ngữ cảnh khi viết.
