        error_tag: idiom_literal
    explanation:
      vi: 高価な - đắt tiền; ～も、使わなければ - dù là ~, nếu không dùng; 猫に小判 - vô ích, phí của.
    display_answer: Từ điển đắt tiền mà không dùng thì cũng vô ích.

