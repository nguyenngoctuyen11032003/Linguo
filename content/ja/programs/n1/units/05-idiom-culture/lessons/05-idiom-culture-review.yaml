  # ---------------- application ----------------
  - key: ja:exercise:n1-idiom-culture-review-mcq-reading
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u5-ishin-denshin
    prompt:
      stem: "Đọc: 「『以心伝心』や『一期一会』のように、日本語には人間関係を大切にする言葉が多い。一方で、『出る杭は打たれる』ということわざに表れているように、周りと違うことを恐れる気持ちも根強い。言葉を学ぶことは、その国の価値観を知ることでもあるのだ。」 Ý chính của tác giả là gì?"
      stem_lang: vi
      options:
        - { id: n6c, text: Học thành ngữ của một ngôn ngữ cũng là tìm hiểu hệ giá trị của đất nước đó., lang: vi }
        - { id: a3x, text: Tiếng Nhật có quá nhiều thành ngữ nên rất khó học., lang: vi }
        - { id: s9p, text: Người Nhật không còn coi trọng các mối quan hệ., lang: vi }
        - { id: j1t, text: Câu "cây cao đón gió" đã không còn được người Nhật dùng., lang: vi }
    answer:
      correct_option_id: n6c
    explanation:
      vi: Câu cuối 言葉を学ぶことは、その国の価値観を知ることでもある - học ngôn ngữ cũng là biết giá trị quan của đất nước đó (ý chính). Hai câu đầu là ví dụ hai mặt - coi trọng quan hệ / sợ khác biệt.
    display_answer: Học thành ngữ của một ngôn ngữ cũng là tìm hiểu hệ giá trị của đất nước đó.

