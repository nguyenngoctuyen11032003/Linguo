title:
  vi: Thư từ trang trọng - 拝啓 / 敬具, 時候の挨拶
objectives:
  - vi: Nắm bố cục thư trang trọng - 頭語, 時候の挨拶, lời chào an khang, nội dung, lời kết, 結語.
  - vi: Ghép đúng cặp 頭語 - 結語 (拝啓 - 敬具, 前略 - 草々) và chọn lời chào theo mùa.
  - vi: Dùng các câu cố định trang trọng - ご清栄, 平素は～, 略儀ながら, ご自愛ください.
estimated_minutes: 25
skills: [writing, reading, vocabulary]
prerequisites: [ja:lesson:n1-u5-yoji-jukugo]
