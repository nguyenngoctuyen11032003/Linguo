    prompt:
      source_text: 寒さ厳しき折、どうぞご自愛ください。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Giữa lúc trời rét đậm, xin anh chị hãy giữ gìn sức khoẻ.
        - Giữa lúc trời rét đậm, xin hãy giữ gìn sức khoẻ.
        - Giữa lúc trời rét đậm, xin quý vị hãy giữ gìn sức khoẻ.
        - Giữa lúc trời rét đậm, kính chúc quý vị giữ gìn sức khoẻ.
        - Trong lúc trời rét đậm, xin hãy giữ gìn sức khoẻ.
        - Trong lúc trời lạnh khắc nghiệt, xin hãy giữ gìn sức khoẻ.
        - Giữa lúc trời lạnh khắc nghiệt, xin hãy giữ gìn sức khoẻ.
        - Giữa tiết trời giá lạnh, xin hãy giữ gìn sức khoẻ.
        - Giữa tiết trời giá lạnh, xin quý vị hãy giữ gìn sức khoẻ.
        - Trời đang rất lạnh, xin hãy giữ gìn sức khoẻ.
        - Trời đang rét đậm, xin hãy giữ gìn sức khoẻ.
        - Trời đang rất lạnh, xin hãy giữ gìn sức khỏe.
        - Giữa lúc trời rét đậm, xin hãy giữ gìn sức khỏe.
        - Giữa lúc trời rét đậm, xin hãy bảo trọng.
        - Trời đang rất lạnh, xin hãy bảo trọng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Trời đang rất lạnh, xin hãy yêu bản thân mình.
        feedback_vi: ご自愛 là lời chúc "giữ gìn sức khoẻ" cố định trong thư, không dịch sát "tự yêu mình".
        error_tag: letter_phrase
    explanation:
      vi: 寒さ厳しき折 - lúc cái lạnh khắc nghiệt (văn viết, 厳しき là dạng cổ của 厳しい); どうぞご自愛ください - xin hãy giữ gìn sức khoẻ.
    display_answer: Giữa lúc trời rét đậm, xin hãy giữ gìn sức khoẻ.

  - key: ja:exercise:n1-u5-formal-letters-wb-haikei
    type: word_bank
    stage: application
