  - key: ja:exercise:n1-u5-formal-letters-mcq-keigu
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-haikei-keigu
    prompt:
      stem: Lá thư mở đầu bằng 「拝啓」. Kết thư bằng từ nào?
      stem_lang: vi
      options:
        - { id: k7f, text: 敬具, lang: ja }
        - { id: w3b, text: 草々, lang: ja }
        - { id: n5h, text: 前略, lang: ja }
        - { id: g9d, text: 謹啓, lang: ja }
    answer:
      correct_option_id: k7f
    explanation:
      vi: 拝啓 - 敬具 là cặp tiêu chuẩn. 草々 đi với 前略; 前略 và 謹啓 là từ mở đầu.
    display_answer: 敬具

  - key: ja:exercise:n1-u5-formal-letters-listen-heiso
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u5-heiso
    prompt:
      audio_asset_id: null
      fallback_text: 平素は格別のお引き立てを賜り、厚く御礼申し上げます。
      options:
        - { id: a8u, text: Xin chân thành cảm ơn quý vị đã luôn đặc biệt ưu ái chúng tôi., lang: vi }
        - { id: s4e, text: Xin lỗi vì thường ngày đã gây phiền hà cho quý vị., lang: vi }
        - { id: o1p, text: Xin chúc mừng quý vị ngày càng hưng thịnh., lang: vi }
        - { id: x6g, text: Xin quý vị hãy giữ gìn sức khoẻ., lang: vi }
    answer:
      correct_option_id: a8u
    explanation:
      vi: 平素 - thường ngày; お引き立て - sự ưu ái, nâng đỡ; 賜り - được ban cho (khiêm nhường); 厚く御礼申し上げます - xin chân thành cảm ơn.
    display_answer: Xin chân thành cảm ơn quý vị đã luôn đặc biệt ưu ái chúng tôi.

  - key: ja:exercise:n1-u5-formal-letters-mcq-season
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-jikou-no-aisatsu
    prompt:
      stem: Bạn viết thư vào tháng 5. Lời chào theo mùa nào phù hợp?
      stem_lang: vi
      options:
        - { id: c2t, text: 新緑の候, lang: ja }
        - { id: j6w, text: 師走の候, lang: ja }
        - { id: e9r, text: 初秋の候, lang: ja }
        - { id: v1n, text: 厳寒の候, lang: ja }
    answer:
      correct_option_id: c2t
    explanation:
      vi: 新緑の候 - tiết cây lá xanh non (tháng 5). 師走 - tháng 12; 初秋 - đầu thu (tháng 9); 厳寒 - rét đậm (tháng 1).
    display_answer: 新緑の候

  - key: ja:exercise:n1-u5-formal-letters-fill-seiei
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-gosei-ei
    prompt:
      template: "貴社ますますご{{b1}}のこととお喜び申し上げます。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Xin chúc mừng quý công ty ngày càng hưng thịnh."
        - "Gợi ý: Hán Việt 'thanh vinh' - せいえい."
    answer:
      blanks:
        b1: [清栄, せいえい]
    known_wrong:
      - answer: 自愛
        feedback_vi: ご自愛 là lời chúc giữ sức khoẻ ở cuối thư. Chào an khang đầu thư là ご清栄.
        error_tag: letter_phrase
      - answer: せいえ
        feedback_vi: Thiếu âm cuối - せいえい (清栄).
        error_tag: reading
    explanation:
      vi: ますますご清栄のこととお喜び申し上げます - xin chúc mừng (quý vị) ngày càng hưng thịnh. Có thể thay bằng ご隆盛, ご発展 khi gửi công ty.
    display_answer: 貴社ますますご清栄のこととお喜び申し上げます。

  - key: ja:exercise:n1-u5-formal-letters-wb-ryakugi
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-ryakugi
    prompt:
      instruction: "Sắp xếp thành câu kết thư: \"Trước hết, xin được gửi lời cảm ơn qua thư dù còn sơ sài.\""
      tokens:
        - { id: r3, text: 書中にて }
        - { id: r1, text: まずは }
        - { id: r5, text: 草々ながら }
        - { id: r4, text: 御礼申し上げます }
        - { id: r2, text: 略儀ながら }
    answer:
      orders:
        - [r1, r2, r3, r4]
    explanation:
      vi: まずは略儀ながら書中にて～申し上げます - câu kết cố định. 草々 là từ kết thư đi với 前略, không dùng với ながら.
    display_answer: まずは略儀ながら書中にて御礼申し上げます。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u5-formal-letters-fill-sousou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-zenryaku-sousou
    prompt:
      template: "{{b1}}　取り急ぎ用件のみ申し上げます。……　草々"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [前略, ぜんりゃく]
    known_wrong:
      - answer: 拝啓
        feedback_vi: 拝啓 đi với 敬具. Kết bằng 草々 thì mở đầu là 前略.
        error_tag: letter_pair
      - answer: 謹啓
        feedback_vi: 謹啓 (rất trang trọng) đi với 謹白 / 謹言, không đi với 草々.
        error_tag: letter_pair
    explanation:
      vi: 前略 - 草々 - lược lời chào mùa, đi thẳng vào việc. 取り急ぎ - gấp nên xin.
    display_answer: 前略　取り急ぎ用件のみ申し上げます。……　草々

  - key: ja:exercise:n1-u5-formal-letters-fill-jiai
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-gojiai
    prompt:
      template: "時節柄、どうぞご{{b1}}ください。(giữ gìn sức khoẻ)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [自愛, じあい]
    known_wrong:
      - answer: 清栄
        feedback_vi: ご清栄 là lời chào an khang đầu thư. Chúc giữ sức khoẻ cuối thư là ご自愛ください.
        error_tag: letter_phrase
      - answer: 健康
        feedback_vi: ご健康ください không đúng ngữ pháp. Dùng ご自愛ください hoặc ご健康をお祈りいたします.
        error_tag: letter_phrase
    explanation:
      vi: 時節柄 - (vì) thời tiết lúc này; ご自愛ください - xin giữ gìn sức khoẻ.
    display_answer: 時節柄、どうぞご自愛ください。

  - key: ja:exercise:n1-u5-formal-letters-translate-heiso
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u5-heiso
    prompt:
      source_text: Thường ngày chúng tôi luôn nhận được nhiều sự giúp đỡ của quý vị. (câu chào mở đầu email công việc, dùng 平素)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 平素より大変お世話になっております。
        - 平素は大変お世話になっております。
        - 平素よりたいへんお世話になっております。
        - 平素は大変お世話になっています。
        - 平素より大変お世話になっています。
        - 平素よりお世話になっております。
        - へいそよりたいへんおせわになっております。
    known_wrong:
      - answer: 平素より大変お世話になります。
        feedback_vi: お世話になります là "sẽ nhờ quý vị giúp đỡ" (sắp tới); lời chào về sự giúp đỡ vẫn đang tiếp diễn dùng ～ております.
        error_tag: aspect
      - answer: 平素より大変お世話しております。
        feedback_vi: お世話する là mình chăm lo cho người khác - ngược nghĩa. Mình nhận sự giúp đỡ thì nói お世話になる.
        error_tag: vocab_meaning
    explanation:
      vi: 平素より / 平素は - thường ngày (văn viết của いつも); お世話になっております - đang nhận sự giúp đỡ (おる là khiêm nhường của いる). Đây là bản trang trọng của いつもお世話になっております, câu mở đầu gần như bắt buộc trong email gửi đối tác.
    display_answer: 平素より大変お世話になっております。

  # ---------------- application ----------------
  - key: ja:exercise:n1-u5-formal-letters-mcq-order
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u5-jikou-no-aisatsu
    prompt:
      stem: Đoạn mở đầu thư nào đúng thứ tự và đúng lễ nghi?
      stem_lang: vi
      options:
        - { id: m4k, text: 拝啓　陽春の候、貴社ますますご清栄のこととお喜び申し上げます。, lang: ja }
        - { id: h7y, text: 敬具　陽春の候、貴社ますますご清栄のこととお喜び申し上げます。, lang: ja }
        - { id: t1c, text: 拝啓　貴社ますますご清栄のこととお喜び申し上げます。陽春の候、ご自愛ください。, lang: ja }
        - { id: b8s, text: 前略　陽春の候、貴社ますますご清栄のこととお喜び申し上げます。, lang: ja }
    answer:
      correct_option_id: m4k
    explanation:
      vi: Thứ tự đúng - 拝啓 → 時候の挨拶 (陽春の候) → lời chào an khang. 敬具 là từ kết; ご自愛ください đặt cuối thư; sau 前略 không viết 時候の挨拶.
    display_answer: 拝啓　陽春の候、貴社ますますご清栄のこととお喜び申し上げます。

  - key: ja:exercise:n1-u5-formal-letters-translate-to-vi
