    difficulty: 5
    item: ja:item:n1-u5-haikei-keigu
    prompt:
      instruction: "Sắp xếp thành phần mở đầu thư gửi công ty: \"Kính gửi. Giữa tiết đầu thu, xin chúc mừng quý công ty ngày càng hưng thịnh.\""
