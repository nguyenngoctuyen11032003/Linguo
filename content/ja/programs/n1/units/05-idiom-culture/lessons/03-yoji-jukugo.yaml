objectives:
  - vi: Đọc đúng và hiểu nghĩa bảy thành ngữ bốn chữ thông dụng.
  - vi: Tận dụng âm Hán Việt để đoán nghĩa 四字熟語.
  - vi: Dùng 四字熟語 đúng chức năng trong câu - danh từ, tính từ đuôi な, phó từ.
