  - key: ja:exercise:n1-u5-yoji-jukugo-fill-ishin
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-ishin-denshin
    prompt:
      template: "長年一緒に働いてきたので、二人は{{b1}}心伝心で仕事を進められる。"
      blanks:
        - { id: b1, width_hint: 1 }
      hint_levels:
        - "Nghĩa: Đã làm việc cùng nhau nhiều năm nên hai người hiểu ý nhau mà triển khai công việc."
        - "Gợi ý: chữ 'dĩ' (bằng, lấy) - い."
    answer:
      blanks:
        b1: [以, い]
    known_wrong:
      - answer: 意
        feedback_vi: Dễ nhầm vì cùng đọc い, nhưng thành ngữ là 以心伝心 (dĩ tâm truyền tâm).
        error_tag: kanji_choice
      - answer: 一
        feedback_vi: Không phải 一心 - thành ngữ là 以心伝心.
        error_tag: kanji_choice
    explanation:
      vi: 以心伝心 - lấy tâm truyền tâm, hiểu nhau không cần lời.
    display_answer: 長年一緒に働いてきたので、二人は以心伝心で仕事を進められる。

