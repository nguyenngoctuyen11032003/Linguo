  - key: ja:exercise:n1-u5-body-idioms-mcq-me
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-me-ga-nai
    prompt:
      stem: 'Chọn từ đúng: 父は日本酒に＿＿、旅行先でも必ず地酒を買ってくる。'
      stem_lang: vi
      options:
        - { id: m9t, text: 目がなくて, lang: ja }
        - { id: b2g, text: 目が高くて, lang: ja }
        - { id: o6w, text: 耳が痛くて, lang: ja }
        - { id: x4k, text: 顔が広くて, lang: ja }
    answer:
      correct_option_id: m9t
    explanation:
      vi: ～に目がない - mê ~ (rượu sake) nên đi đâu cũng mua. 目が高い là tinh mắt, không đi với に theo nghĩa này.
    display_answer: 目がなくて

  - key: ja:exercise:n1-u5-body-idioms-fill-hara
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-hara-ga-tatsu
    prompt:
      template: "約束を何度も破られて、さすがに{{b1}}が立った。"
      blanks:
        - { id: b1, width_hint: 1 }
      hint_levels:
        - "Nghĩa: Bị thất hứa nhiều lần, quả thật tôi đã nổi giận."
        - "Gợi ý: bộ phận cơ thể 'bụng' - はら."
    answer:
      blanks:
        b1: [腹, はら]
    known_wrong:
      - answer: 頭
        feedback_vi: 頭にくる cũng là "tức", nhưng đi với くる, không đi với 立つ. Ở đây là 腹が立つ.
        error_tag: idiom_collocation
      - answer: 顔
        feedback_vi: 顔が立つ là "giữ được thể diện", khác nghĩa. Tức giận là 腹が立つ.
        error_tag: idiom_meaning
    explanation:
      vi: 腹が立つ - tức giận. さすがに - quả thật (đến mức này thì).
    display_answer: 約束を何度も破られて、さすがに腹が立った。

  - key: ja:exercise:n1-u5-body-idioms-wb-hana
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-hana-ga-takai
    prompt:
