  - key: ja:exercise:n1-u5-body-idioms-mcq-reading
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u5-hara-ga-tatsu
    prompt:
      stem: "Đọc: 「会議で私の企画をけなした課長に腹が立ったが、冷静に考えると、指摘はどれも耳が痛いものばかりだった。結局、同僚の中で私の肩を持ってくれる人はいなかった。」 Câu nào đúng với đoạn văn?"
      stem_lang: vi
      options:
        - { id: a6r, text: "Người viết tức trưởng ban, nhưng thừa nhận các góp ý đều đúng chỗ yếu; không đồng nghiệp nào bênh mình.", lang: vi }
        - { id: l2x, text: Người viết hãnh diện vì kế hoạch được trưởng ban khen trong cuộc họp., lang: vi }
        - { id: u9b, text: Trưởng ban bị đau tai nên không nghe rõ kế hoạch của người viết., lang: vi }
        - { id: q5e, text: Đồng nghiệp đều đứng về phía người viết để phản bác trưởng ban., lang: vi }
    answer:
