  # ---------------- recall ----------------
  - key: ja:exercise:n1-u5-body-idioms-fill-te
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u5-te-wo-yaku
    prompt:
      template: "新しいシステムのトラブルに、担当者たちはかなり手を{{b1}}いる。(vất vả xoay xở)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [焼いて, やいて]
    known_wrong:
      - answer: 貸して
        feedback_vi: 手を貸す là "giúp một tay". Vất vả với việc khó là 手を焼く.
        error_tag: idiom_meaning
      - answer: 抜いて
        feedback_vi: 手を抜く là "làm qua loa, ăn bớt công". Vất vả là 手を焼く.
        error_tag: idiom_meaning
    explanation:
      vi: ～に手を焼く - vất vả, bó tay với ~; ている - đang trong tình trạng đó.
    display_answer: 新しいシステムのトラブルに、担当者たちはかなり手を焼いている。

