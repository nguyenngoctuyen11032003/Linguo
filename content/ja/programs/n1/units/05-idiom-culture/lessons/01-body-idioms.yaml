      stem_lang: vi
      options:
        - { id: d8j, text: 耳が痛いです。次からは必ず期限を守ります。, lang: ja }
        - { id: n3u, text: 鼻が高いです。次からは必ず期限を守ります。, lang: ja }
        - { id: s7c, text: 目がないです。次からは必ず期限を守ります。, lang: ja }
        - { id: g1z, text: 腹が立ちます。次からは必ず期限を守ります。, lang: ja }
    answer:
      correct_option_id: d8j
    explanation:
      vi: 耳が痛い - nghe nhột vì bị nói trúng lỗi, thường dùng để thừa nhận lời phê bình. 鼻が高い (hãnh diện), 目がない (mê), 腹が立つ (tức) đều sai ngữ cảnh - nói 腹が立ちます với sếp còn thất lễ.
    display_answer: 耳が痛いです。次からは必ず期限を守ります。

