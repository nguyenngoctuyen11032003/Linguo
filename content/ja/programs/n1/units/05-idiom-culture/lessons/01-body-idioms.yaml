title:
  vi: Quán dụng ngữ với bộ phận cơ thể - 顔が広い, 腹が立つ, 耳が痛い
objectives:
  - vi: Hiểu nghĩa bóng của các quán dụng ngữ dùng 顔, 腹, 耳, 目, 鼻, 手, 肩.
  - vi: Dùng đúng trợ từ đi kèm - ～に目がない, ～に手を焼く, ～の肩を持つ.
  - vi: Chọn quán dụng ngữ hợp ngữ cảnh trong hội thoại và đề đọc JLPT N1.
