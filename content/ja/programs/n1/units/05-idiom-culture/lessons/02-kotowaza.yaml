  - key: ja:exercise:n1-u5-kotowaza-fill-isogaba
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u5-isogaba-maware
    prompt:
      template: "「急がば{{b1}}」と言うように、基礎からしっかり復習しよう。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Như câu \"dục tốc bất đạt\", hãy ôn kỹ từ nền tảng."
        - "Gợi ý: thể mệnh lệnh của 回る (đi vòng)."
    answer:
      blanks:
        b1: [回れ, まわれ]
    known_wrong:
      - answer: 回る
        feedback_vi: Tục ngữ dùng thể mệnh lệnh - 回れ.
        error_tag: kotowaza_form
      - answer: 走れ
        feedback_vi: 走れ là "hãy chạy" - ngược với ý tục ngữ. Đúng là 回れ (hãy đi vòng).
        error_tag: kotowaza_form
    explanation:
      vi: 急がば回れ - vội thì đi đường vòng (chắc chắn). ～と言うように - như câu ~ đã nói.
    display_answer: 「急がば回れ」と言うように、基礎からしっかり復習しよう。

