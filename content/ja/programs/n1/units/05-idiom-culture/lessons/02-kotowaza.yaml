  - key: ja:exercise:n1-u5-kotowaza-mcq-saru
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n1-u5-saru-mo-ki-kara
    prompt:
      stem: 「猿も木から落ちる」 gần nghĩa với câu tiếng Việt nào?
      stem_lang: vi
      options:
        - { id: v3k, text: Ngựa hay cũng có lúc vấp., lang: vi }
        - { id: j8w, text: Có công mài sắt có ngày nên kim., lang: vi }
        - { id: t5n, text: Đàn gảy tai trâu., lang: vi }
        - { id: z1h, text: Uống nước nhớ nguồn., lang: vi }
    answer:
      correct_option_id: v3k
    explanation:
      vi: 猿も木から落ちる - khỉ leo cây giỏi cũng có lúc ngã, tức người giỏi cũng có lúc sai. "Có công mài sắt" là 石の上にも三年; "đàn gảy tai trâu" gần 猫に小判.
    display_answer: Ngựa hay cũng có lúc vấp.

