title:
  vi: Tục ngữ ことわざ thông dụng
objectives:
  - vi: Hiểu nghĩa và hoàn cảnh dùng sáu câu tục ngữ Nhật thông dụng.
  - vi: Liên hệ với tục ngữ, thành ngữ tiếng Việt có nghĩa gần.
  - vi: Trích tục ngữ tự nhiên bằng ～と言うように / ～と言うが / ～とはよく言ったものだ.
