title:
  vi: Ôn tập - chân dung một nhà văn bí ẩn
objectives:
  - vi: Đọc hiểu bài chân dung nhân vật dùng かたわら, であれ, ずくめ, めいた, きらいがある.
  - vi: Chọn đúng mẫu theo sắc thái - song song, tiện thể, toàn là, lấm đầy, khuynh hướng.
  - vi: Viết câu nhận xét con người theo văn phong tạp chí.
