title:
  vi: Toàn là, lấm đầy, mang dáng dấp - ～ずくめ, ～まみれ, ～めく
objectives:
  - vi: Nói "toàn là..." bằng ～ずくめ (cả điều tốt lẫn xấu).
  - vi: Tả bề mặt lấm đầy chất lỏng, bụi bằng ～まみれ; phân biệt với だらけ (N2).
  - vi: Nói "mang dáng dấp, có hơi hướng" bằng ～めく / ～めいた.
estimated_minutes: 22
skills: [grammar, vocabulary]
