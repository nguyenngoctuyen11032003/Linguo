key: ja:lesson:n1-u8-de-are
order_index: 1
level: n1
title:
  vi: Dù là... đi nữa - ～であれ, ～であれ～であれ
objectives:
  - vi: Nói "dù là N đi nữa" bằng ～であれ, kể cả với từ để hỏi (何であれ, 誰であれ).
  - vi: Liệt kê hai trường hợp bằng ～であれ～であれ.
  - vi: Phân biệt であれ với でも và にしろ～にしろ.
estimated_minutes: 22
skills: [grammar, reading]
prerequisites: [ja:lesson:n1-norms-sequence-review]
