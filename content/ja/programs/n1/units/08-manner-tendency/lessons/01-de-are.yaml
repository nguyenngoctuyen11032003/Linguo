    difficulty: 4
    item: ja:item:n1-u8-gram-de-are
    prompt:
      template: "相手が{{b1}}、失礼な態度を取ってはならない。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Dù đối phương là ai đi nữa cũng không được có thái độ thất lễ."
        - "Gợi ý: từ để hỏi \"ai\" + であれ."
    answer:
      blanks:
        b1: [誰であれ, だれであれ]
    known_wrong:
      - answer: 誰であり
        feedback_vi: Mẫu "dù là ai" là 誰であれ (dạng mệnh lệnh cổ của ある), không phải であり.
        error_tag: deare_form
      - answer: 何であれ
        feedback_vi: 何であれ là "dù là gì" - dùng cho vật, việc; với người dùng 誰であれ.
        error_tag: question_word
    explanation:
      vi: 誰であれ - dù là ai. 取ってはならない - không được (văn viết của てはいけない).
    display_answer: 相手が誰であれ、失礼な態度を取ってはならない。

