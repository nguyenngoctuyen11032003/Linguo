  - item: ja:item:n1-u8-sekimu
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc và viết được những nguyên tắc chung kiểu văn bản - "Dù lý do là gì, bạo lực là không thể chấp nhận", "Dù là người lớn hay trẻ em, ai cũng phải tuân thủ luật".
  - type: explain
    text:
      vi: 'N + であれ - "dù là N đi nữa". Thường đi với たとえ: たとえ社長であれ、規則は守るべきだ. Với từ để hỏi: 何であれ (dù là gì), 誰であれ (dù là ai), どこであれ (dù ở đâu).'
  - type: explain
    text:
      vi: 'N1 であれ N2 であれ - "dù là A hay B thì cũng...". Hai danh từ cùng loại, thường đối lập: 男性であれ女性であれ, 平日であれ休日であれ. Vế sau là kết luận áp dụng cho mọi trường hợp.'
  - type: deep_explain
    text:
      vi: 'Ba mức trang trọng của cùng một ý: でも (hội thoại) → にしろ / にせよ (N2, văn viết nhẹ) → であれ (văn viết trang trọng, luật lệ, xã luận). Tiếng Việt chỉ cần "dù là... hay..."; tiếng Nhật đổi hình thức theo loại văn bản, nên trong email bạn bè dùng であれ sẽ nghe rất cứng.'
  - type: example
    target: 理由が何であれ、暴力は許されない。
    target_lang: ja
    translation:
      vi: Dù lý do là gì đi nữa, bạo lực cũng không thể được dung thứ.
  - type: example
    target: たとえ親であれ、子どもの手紙を勝手に読んではいけない。
    target_lang: ja
    translation:
      vi: Dù là cha mẹ đi nữa cũng không được tự ý đọc thư của con.
  - type: example
    target: 大人であれ子どもであれ、交通ルールを守らなければならない。
    target_lang: ja
    translation:
      vi: Dù là người lớn hay trẻ em đều phải tuân thủ luật giao thông.
  - type: example
    target: 子どもに教育を受けさせるのは親の責務だ。
    target_lang: ja
    translation:
      vi: Cho con đi học là trách nhiệm của cha mẹ.
  - type: common_mistake
    wrong: 大人であれ子どもでも、ルールは同じだ。
    right: 大人であれ子どもであれ、ルールは同じだ。
    target_lang: ja
    note:
      vi: Mẫu cặp phải giữ cùng một hình thức ở hai vế - であれ～であれ; trộn であれ với でも là sai.
  - type: common_mistake
    wrong: 暑いであれ寒いであれ、毎日走る。
    right: 暑くても寒くても、毎日走る。
    target_lang: ja
    note:
      vi: であれ đi với danh từ, không đi trực tiếp với tính từ đuôi い (×暑いであれ). Với tính từ い dùng ～ても～ても, hoặc văn viết ～かろうと～かろうと.
  - type: summary
    points:
      - vi: (たとえ) N + であれ - dù là N đi nữa.
      - vi: 何であれ / 誰であれ / どこであれ - dù là gì / ai / ở đâu.
      - vi: N1 であれ N2 であれ - dù A hay B đều...; chỉ đi với danh từ.
      - vi: 国籍 - quốc tịch · 責務 - trách nhiệm, nghĩa vụ.
