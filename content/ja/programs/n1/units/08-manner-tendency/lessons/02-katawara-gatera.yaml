title:
  vi: Song song và tiện thể - ～かたわら, ～がてら
objectives:
  - vi: Giới thiệu người làm hai việc song song lâu dài bằng ～かたわら.
  - vi: Nói "nhân tiện đi..., kết hợp..." bằng ～がてら.
  - vi: Phân biệt かたわら, がてら, ついでに (N3) và ながら.
