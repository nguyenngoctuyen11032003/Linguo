    answer:
      accepted:
        - 子どもの帰りを待つ親の気持ちは、想像に難くない。
        - 子どもの帰りを待つ親の気持ちは想像に難くない。
        - 子供の帰りを待つ親の気持ちは、想像に難くない。
        - 子どもの帰りを待つ両親の気持ちは、想像に難くない。
        - 子どもの帰りを待つ親の心情は、想像に難くない。
        - 子どもが帰ってくるのを待つ親の気持ちは、想像に難くない。
        - 子どもの帰りを待つ親の気持ちは、想像にかたくない。
        - こどものかえりをまつおやのきもちは、そうぞうにかたくない。
    known_wrong:
      - answer: 子どもの帰りを待つ親の気持ちは、想像に難しくない。
        feedback_vi: Mẫu cố định là 想像に難くない (難い đọc かたい), không phải 難しくない.
        error_tag: kataku_form
      - answer: 子どもの帰りを待つ親の気持ちは、想像に難い。
        feedback_vi: 想像に難い là "khó hình dung" - ngược nghĩa. Cần phủ định 難くない.
        error_tag: negation
    explanation:
      vi: N は想像に難くない - N không khó để hình dung. 子どもの帰りを待つ親 - cha mẹ chờ con về. Câu trang trọng, hay gặp trong xã luận, tiểu luận.
    display_answer: 子どもの帰りを待つ親の気持ちは、想像に難くない。

  - key: ja:exercise:n1-u8-kirai-write-kirai
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u8-gram-kirai-ga-aru
    prompt:
      source_text: Trưởng phòng có tật đánh giá con người chỉ qua vẻ bề ngoài. (dùng きらいがある)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 部長は人を見た目だけで判断するきらいがある。
        - 部長は、人を見た目だけで判断するきらいがある。
        - 部長は人を外見だけで判断するきらいがある。
        - 部長は人を見かけだけで判断するきらいがある。
        - 部長は見た目だけで人を判断するきらいがある。
        - 部長は外見だけで人を判断するきらいがある。
