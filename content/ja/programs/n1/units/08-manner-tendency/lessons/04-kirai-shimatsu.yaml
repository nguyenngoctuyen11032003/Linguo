      options:
        - { id: e4q, text: "Con trai đêm nào cũng thức khuya, rốt cuộc ra nông nỗi ngủ quên đúng ngày thi tuyển.", lang: vi }
        - { id: f9r, text: Con trai ngủ sớm nên đi thi đúng giờ., lang: vi }
        - { id: g3s, text: Con trai thức khuya ôn bài nên thi đỗ., lang: vi }
