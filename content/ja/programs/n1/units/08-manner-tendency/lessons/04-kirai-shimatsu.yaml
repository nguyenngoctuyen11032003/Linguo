key: ja:lesson:n1-u8-kirai-shimatsu
order_index: 4
level: n1
title:
  vi: Có tật, ra nông nỗi, không khó hình dung - ～きらいがある, ～しまつだ, ～に難くない
objectives:
  - vi: Nhận xét khuynh hướng xấu bằng ～きらいがある.
  - vi: Kể kết cục tệ hại bằng ～しまつだ.
  - vi: Nói "không khó để hình dung / đoán" bằng 想像に難くない, 察するに難くない.
estimated_minutes: 24
skills: [grammar, reading, writing]
prerequisites: [ja:lesson:n1-u8-zukume-mamire-meku]
items:
  - item: ja:item:n1-u8-gram-kirai-ga-aru
  - item: ja:item:n1-u8-gram-shimatsu-da
  - item: ja:item:n1-u8-gram-ni-kataku-nai
  - item: ja:item:n1-u8-rakkan
  - item: ja:item:n1-u8-souzou
body:
  - type: objective
    text:
      vi: Sau bài này, bạn viết được những nhận xét kiểu tiểu luận - "giới trẻ có xu hướng ngại thất bại", "rốt cuộc đến mức bỏ cả việc", "không khó để hình dung nỗi lo của cha mẹ".
  - type: explain
    text:
      vi: 'V-る / V-ない / N-の + きらいがある - "có tật, có khuynh hướng (không tốt)". Giọng nhận xét khách quan, hơi phê phán: 何でも一人で抱え込むきらいがある (có tật ôm mọi việc một mình). Không dùng cho khuynh hướng tốt.'
  - type: explain
    text:
      vi: 'V-る + しまつだ - "rốt cuộc đến mức..., ra nông nỗi...". Sau một loạt chuyện xấu, kết cục tệ nhất xảy ra, người nói bực bội: 何度注意しても直らず、ついには開き直るしまつだ. この / あのしまつだ - ra nông nỗi này.'
  - type: explain
    text:
      vi: 'N / V-る + に難(かた)くない - "không khó để...". Gần như chỉ đi với 想像, 察する, 理解: 親の悲しみは想像に難くない. Văn viết trang trọng; nói thường thì 簡単に想像できる.'
  - type: deep_explain
    text:
      vi: 'So với mẫu N2: がち là "hay bị" (tình trạng lặp lại, 遅れがち), きらいがある là "có tật" (tính cách, khuynh hướng suy nghĩ). あげく nối "quá trình → kết cục", しまつだ đứng cuối câu như tiếng thở dài "đến nước này đây". Tiếng Việt có "ra nông nỗi" và "có tật" - hai cách dịch rất sát.'
  - type: example
    target: 日本人は自分の意見をはっきり言わないきらいがある。
    target_lang: ja
    translation:
      vi: Người Nhật có khuynh hướng không nói rõ ý kiến của mình.
  - type: example
    target: 彼は遅刻ばかりして、最近では会議を無断で欠席するしまつだ。
    target_lang: ja
    translation:
      vi: Anh ta toàn đi muộn, dạo này còn đến mức vắng họp không xin phép.
  - type: example
    target: 一人で海外に渡った彼の苦労は、察するに難くない。
    target_lang: ja
    translation:
      vi: Không khó để đoán được những vất vả của anh ấy khi một mình sang nước ngoài.
  - type: example
    target: 専門家の多くは、景気の先行きを楽観していない。
    target_lang: ja
    translation:
      vi: Phần lớn chuyên gia không lạc quan về triển vọng kinh tế.
  - type: common_mistake
    wrong: 彼女はいつも笑顔で人に優しいきらいがある。
    right: 彼女はいつも笑顔で人に優しい。
    target_lang: ja
    note:
      vi: きらいがある chỉ dùng cho khuynh hướng không tốt; khen tính tốt thì nói thẳng.
  - type: common_mistake
    wrong: 一生懸命勉強して、ついに合格するしまつだ。
    right: 一生懸命勉強して、ついに合格した。
    target_lang: ja
    note:
      vi: しまつだ là kết cục tệ, mang giọng chê trách. Kết quả tốt kể bằng câu bình thường hoặc 末に.
  - type: summary
    points:
      - vi: V-る / V-ない / Nの + きらいがある - có tật, có khuynh hướng (xấu).
      - vi: V-る + しまつだ - rốt cuộc đến mức... (kết cục tệ, bực bội).
      - vi: 想像 / 察する + に難くない - không khó để hình dung / đoán.
      - vi: 楽観 - lạc quan · 想像 - tưởng tượng, hình dung.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-u8-kirai-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u8-gram-kirai-ga-aru
    prompt:
      stem: Câu 「兄は都合の悪い話になると、すぐ話題を変えるきらいがある。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a9k, text: Anh tôi có tật hễ gặp chuyện bất lợi là lập tức đổi đề tài., lang: vi }
        - { id: b5m, text: Anh tôi ghét những ai đổi đề tài., lang: vi }
        - { id: c1n, text: Anh tôi thích nói về những chuyện bất lợi., lang: vi }
        - { id: d6p, text: Anh tôi chưa bao giờ đổi đề tài., lang: vi }
    answer:
      correct_option_id: a9k
    explanation:
      vi: 話題を変えるきらいがある - có tật đổi đề tài. きらい ở đây không phải "ghét" (嫌い) mà là "khuynh hướng"; 都合の悪い話 - chuyện bất lợi cho mình.
    display_answer: Anh tôi có tật hễ gặp chuyện bất lợi là lập tức đổi đề tài.

