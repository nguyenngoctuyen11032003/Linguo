  - key: ja:exercise:n1-u8-kirai-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u8-gram-ni-kataku-nai
    prompt:
      stem: 'Chọn từ hợp nhất: 長年勤めた会社が倒産した時の彼のショックは、想像 ＿＿。 ("Không khó để hình dung cú sốc của anh ấy khi công ty làm việc nhiều năm phá sản.")'
      stem_lang: vi
      options:
        - { id: i4u, text: に難くない, lang: ja }
        - { id: j8v, text: するしまつだ, lang: ja }
        - { id: k3w, text: のきらいがある, lang: ja }
        - { id: l7x, text: に難しくない, lang: ja }
    answer:
      correct_option_id: i4u
    explanation:
      vi: 想像に難くない - không khó để hình dung (cụm cố định). しまつだ là kết cục tệ; きらいがある là khuynh hướng; に難しくない không phải dạng của mẫu này (難い đọc かたい).
    display_answer: に難くない

  - key: ja:exercise:n1-u8-kirai-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u8-gram-kirai-ga-aru
    prompt:
      template: "最近の若者は、失敗を恐れて挑戦しない{{b1}}がある、と言われる。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Người ta nói giới trẻ gần đây có khuynh hướng sợ thất bại nên không dám thử thách."
        - "Gợi ý: danh từ 3 chữ kana nghĩa \"khuynh hướng (xấu)\"."
    answer:
      blanks:
        b1: [きらい]
    known_wrong:
      - answer: しまつ
        feedback_vi: しまつだ là kết cục tệ của một chuyện cụ thể; nhận xét khuynh hướng chung dùng きらいがある.
        error_tag: kirai_shimatsu
      - answer: がち
        feedback_vi: がち gắn vào gốc ます (挑戦しがち) và không đi với がある; mẫu ở đây là ～ないきらいがある.
        error_tag: kirai_gachi
    explanation:
      vi: V-ない + きらいがある - có khuynh hướng không... と言われる - người ta nói. Kiểu câu nhận định xã hội rất hay gặp trong bài đọc N1.
    display_answer: 最近の若者は、失敗を恐れて挑戦しないきらいがある、と言われる。

  - key: ja:exercise:n1-u8-kirai-mcq-rakkan
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n1-u8-rakkan
    prompt:
      stem: Câu 「楽観的な見通しは捨てるべきだ。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: m5y, text: Nên bỏ những dự đoán lạc quan đi., lang: vi }
        - { id: n1z, text: Nên giữ những dự đoán lạc quan., lang: vi }
        - { id: o6a, text: Không nên bi quan về tương lai., lang: vi }
        - { id: p2b, text: Dự đoán bi quan là sai., lang: vi }
    answer:
      correct_option_id: m5y
    explanation:
      vi: 楽観的な見通し - dự đoán, triển vọng lạc quan; 捨てるべきだ - nên vứt bỏ. 楽観 là lạc quan, ngược với 悲観 (bi quan).
    display_answer: Nên bỏ những dự đoán lạc quan đi.

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u8-kirai-fill-recall
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u8-gram-shimatsu-da
    prompt:
      template: "彼は借金を重ね、ついには親の家まで売る{{b1}}だ。(ra nông nỗi)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [しまつ, 始末]
    known_wrong:
      - answer: きらい
        feedback_vi: きらいがある là khuynh hướng; kết cục tệ hại sau một chuỗi chuyện xấu là しまつだ.
        error_tag: kirai_shimatsu
      - answer: あげく
        feedback_vi: あげく nối quá trình với kết quả ở giữa câu, không đứng cuối với だ.
        error_tag: shimatsu_ageku
    explanation:
      vi: V-る + しまつだ - rốt cuộc đến mức...; ついには - cuối cùng thì. Bán cả nhà bố mẹ là kết cục tệ nhất - đúng chỗ của しまつだ.
    display_answer: 彼は借金を重ね、ついには親の家まで売るしまつだ。

