    explanation:
      vi: V-る + きらいがある - có tật...; 見た目 / 外見 - vẻ bề ngoài; 判断する - đánh giá. Giọng nhận xét khách quan nhưng ngầm phê phán.
    display_answer: 部長は人を見た目だけで判断するきらいがある。

  # ---------------- application ----------------
  - key: ja:exercise:n1-u8-kirai-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 5
    item: ja:item:n1-u8-gram-shimatsu-da
    prompt:
      source_text: 何度頼んでも部屋を片付けないどころか、弟は私の机まで散らかすしまつだ。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Nhờ bao nhiêu lần mà em trai không những không dọn phòng, rốt cuộc còn bày bừa cả bàn của tôi.
        - Nhờ mấy lần em tôi cũng không dọn phòng, đã thế còn ra nông nỗi bày bừa cả bàn tôi.
        - Bảo bao nhiêu lần em trai cũng chẳng dọn phòng, rốt cuộc còn làm bừa bộn cả bàn của tôi.
        - Dù nhờ bao nhiêu lần, em trai không dọn phòng mà còn bày bừa luôn cả bàn của tôi.
        - Nhờ mãi mà em trai chẳng những không dọn phòng, còn bày bừa đến cả bàn của tôi.
        - Em trai tôi nhờ bao nhiêu lần cũng không dọn phòng, rốt cuộc còn làm bừa cả bàn tôi.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Em trai tôi đã dọn sạch phòng và cả bàn của tôi.
        feedback_vi: 片付けない là "không dọn", 散らかす là "bày bừa" - ngược với dọn sạch.
        error_tag: meaning
    explanation:
      vi: 片付けないどころか - chẳng những không dọn mà còn...; 散らかすしまつだ - rốt cuộc đến mức bày bừa. Hai mẫu cùng diễn tả sự bực bội tăng dần.
    display_answer: Nhờ bao nhiêu lần mà em trai không những không dọn phòng, rốt cuộc còn bày bừa cả bàn của tôi.

  - key: ja:exercise:n1-u8-kirai-mcq-situation
