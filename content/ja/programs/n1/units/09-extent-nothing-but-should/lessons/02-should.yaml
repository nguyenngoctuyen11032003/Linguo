title:
  vi: Đương nhiên và phê phán - ～てしかるべき・～ともあろう・～であろうと・～ではあるまいし
objectives:
  - vi: Nói "đáng lẽ phải" bằng ～てしかるべきだ.
  - vi: Phê phán người có vị thế bằng ～ともあろう.
  - vi: Nói "bất kể" bằng ～であろうと và mỉa mai bằng ～ではあるまいし.
estimated_minutes: 22
skills:
