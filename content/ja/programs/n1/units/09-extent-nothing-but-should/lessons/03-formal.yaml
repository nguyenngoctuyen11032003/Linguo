title:
  vi: Văn trang trọng - ～てからというもの・～手前・～ごとき・～かたがた・～ないまでも
objectives:
  - vi: Nói "kể từ khi ... thì" bằng ～てからというもの.
  - vi: Nói "vì đã ... nên (nể mặt, thể diện)" bằng ～手前.
  - vi: Dùng ～ごとき / ごとく, ～かたがた và ～ないまでも trong văn trang trọng.
estimated_minutes: 22
skills:
  - grammar
  - reading
