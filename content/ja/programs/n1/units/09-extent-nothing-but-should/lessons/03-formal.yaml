    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u9-gram-temae
    prompt:
      template: みんなの前で約束した{{b1}}、やめるわけにはいきません。 (Vì đã hứa trước mọi người nên tôi không thể bỏ cuộc.)
      blanks:
