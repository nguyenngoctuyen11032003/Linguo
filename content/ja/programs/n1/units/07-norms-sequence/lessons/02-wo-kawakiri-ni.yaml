  # ---------------- application ----------------
  - key: ja:exercise:n1-u7-kawakiri-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-kawakiri-ni
    prompt:
