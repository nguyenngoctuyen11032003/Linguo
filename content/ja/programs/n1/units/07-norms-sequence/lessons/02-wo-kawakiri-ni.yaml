    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-kawakiri-ni
    prompt:
      stem: Câu 「このラーメン店は、福岡の一号店を皮切りに、国内外に五十店舗を展開している。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a6k, text: "Khởi đầu từ cửa hàng đầu tiên ở Fukuoka, tiệm ramen này đã mở 50 cửa hàng trong và ngoài nước.", lang: vi }
        - { id: b2m, text: Tiệm ramen này chỉ có một cửa hàng duy nhất ở Fukuoka., lang: vi }
        - { id: c9n, text: Tiệm ramen này định đóng cửa hàng ở Fukuoka để mở 50 cửa hàng khác., lang: vi }
        - { id: d4p, text: "Trong 50 cửa hàng, cửa hàng ở Fukuoka là lớn nhất.", lang: vi }
    answer:
