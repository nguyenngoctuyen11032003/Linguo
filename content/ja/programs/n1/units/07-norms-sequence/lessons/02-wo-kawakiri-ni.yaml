  # ---------------- recall ----------------
  - key: ja:exercise:n1-u7-kawakiri-fill-recall
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-kawakiri-ni
    prompt:
      template: "部長の辞任{{b1}}、役員が次々と会社を去った。(mở đầu bằng)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [を皮切りに, をかわきりに, を皮切りとして, を皮切りにして]
    known_wrong:
      - answer: をはじめ
        feedback_vi: Có trình tự "trưởng phòng từ chức trước rồi lần lượt các lãnh đạo khác" - dùng を皮切りに.
        error_tag: kawakiri_hajime
      - answer: を皮切りの
        feedback_vi: Không có dạng を皮切りの; trước cả vế câu dùng を皮切りに.
        error_tag: kawakiri_form
    explanation:
      vi: 辞任を皮切りに - mở đầu bằng việc từ chức; 次々と去った - lần lượt rời đi. Vế sau là chuỗi sự việc tiếp nối nên dùng を皮切りに; ở đây sắc thái trung tính, kể sự việc.
    display_answer: 部長の辞任を皮切りに、役員が次々と会社を去った。

