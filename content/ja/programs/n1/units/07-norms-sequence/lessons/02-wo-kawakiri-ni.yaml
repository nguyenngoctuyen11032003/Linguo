key: ja:lesson:n1-u7-wo-kawakiri-ni
order_index: 2
level: n1
title:
  vi: Mở màn bằng... rồi lan rộng - ～を皮切りに, ～を皮切りとして
objectives:
  - vi: Nói "khởi đầu bằng N, sau đó lần lượt..." bằng ～を皮切りに.
  - vi: Phân biệt を皮切りに (trình tự khởi đầu) với をはじめ (tiêu biểu khi liệt kê).
  - vi: Đọc hiểu tin về lưu diễn, mở chi nhánh, chuỗi sự kiện.
estimated_minutes: 22
skills: [grammar, reading]
prerequisites: [ja:lesson:n1-u7-majiki-bekarazu]
items:
  - item: ja:item:n1-u7-gram-wo-kawakiri-ni
  - item: ja:item:n1-u7-kouen
  - item: ja:item:n1-u7-kakuchi
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc được những câu tin tức như "Mở màn bằng buổi diễn ở Tokyo, ban nhạc sẽ lưu diễn khắp cả nước" hay "Bắt đầu từ cửa hàng ở Osaka, chuỗi cửa hàng lần lượt mở rộng ra châu Á".
  - type: explain
    text:
      vi: 'N + を皮切りに(して) / を皮切りとして - "mở màn bằng N, rồi lần lượt...". N là sự việc đầu tiên trong một chuỗi cùng loại; vế sau là sự phát triển, lan rộng: 大阪店を皮切りに、アジア各地に出店した.'
  - type: explain
    text:
      vi: '皮切り vốn là "nhát dao đầu tiên rạch qua da" khi châm cứu - từ đó có nghĩa "khởi đầu". Mẫu này hợp với văn tin tức, báo cáo; vế sau thường có 次々と, 相次いで, 各地で để nhấn sự lan rộng.'
  - type: explain
    text:
      vi: 'Đừng nhầm với ～をはじめ(として) - "tiêu biểu là N, (và nhiều cái khác)": 東京をはじめ、大阪や名古屋でも. をはじめ chỉ nêu ví dụ đại diện khi liệt kê, không có ý "trước rồi sau".'
  - type: deep_explain
    text:
      vi: 'Tiếng Việt có "mở màn", "khởi đầu bằng" - nghĩa rất gần. Khác biệt là を皮切りに đòi hỏi vế sau là một chuỗi sự việc tiếp nối và thường mang sắc thái tích cực hoặc trung tính (lưu diễn, mở cửa hàng, phát biểu). Chuyện chỉ xảy ra một lần, hoặc vế sau là ý chí, lời nhờ thì không dùng.'
  - type: example
    target: 新作映画は、来月の東京での上映を皮切りに、全国で公開される。
    target_lang: ja
    translation:
      vi: Mở màn bằng buổi chiếu ở Tokyo vào tháng sau, bộ phim mới sẽ được công chiếu trên toàn quốc.
  - type: example
    target: 社長の挨拶を皮切りに、記念式典が始まった。
    target_lang: ja
    translation:
      vi: Mở đầu bằng lời chào của giám đốc, buổi lễ kỷ niệm đã bắt đầu.
  - type: example
    target: 一件の通報を皮切りとして、同様の被害報告が相次いだ。
    target_lang: ja
    translation:
      vi: Bắt đầu từ một cuộc trình báo, hàng loạt báo cáo về thiệt hại tương tự liên tiếp xuất hiện.
  - type: example
    target: その劇団は、地方の小さな町でも公演を行っている。
    target_lang: ja
    translation:
      vi: Đoàn kịch đó còn biểu diễn cả ở những thị trấn nhỏ ở địa phương.
  - type: common_mistake
    wrong: 明日の会議を皮切りに、資料を準備してください。
    right: 明日の会議に向けて、資料を準備してください。
    target_lang: ja
    note:
      vi: を皮切りに không đi với lời nhờ ở vế sau, và cần một chuỗi sự việc tiếp nối. Chuẩn bị cho cuộc họp dùng に向けて.
  - type: common_mistake
    wrong: 日本の祭りには、祇園祭を皮切りに有名なものがたくさんある。
    right: 日本の祭りには、祇園祭をはじめ有名なものがたくさんある。
    target_lang: ja
    note:
      vi: Nêu ví dụ tiêu biểu trong một danh sách là をはじめ. を皮切りに chỉ dùng khi có trình tự "cái đầu tiên rồi lần lượt những cái sau".
  - type: summary
    points:
      - vi: N + を皮切りに / を皮切りとして - mở màn bằng N rồi lần lượt...
      - vi: Vế sau là chuỗi sự việc lan rộng (次々と, 各地で); không phải lời nhờ, ý chí.
      - vi: をはじめ - tiêu biểu là... (liệt kê), không có ý trình tự.
      - vi: 公演 - buổi biểu diễn · 各地 - các nơi.
