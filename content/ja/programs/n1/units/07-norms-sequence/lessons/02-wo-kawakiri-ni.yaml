      stem_lang: vi
      options:
        - { id: i5u, text: を皮切りに, lang: ja }
        - { id: j9v, text: をはじめ, lang: ja }
        - { id: k3w, text: にあるまじき, lang: ja }
        - { id: l7x, text: を皮切りの, lang: ja }
    answer:
      correct_option_id: i5u
    explanation:
      vi: Có trình tự "lời thú nhận đầu tiên → nhiều người lần lượt lên tiếng" (次々と) - đúng chỗ của を皮切りに. をはじめ chỉ nêu ví dụ tiêu biểu khi liệt kê; にあるまじき cần danh từ đi sau; を皮切りの không tồn tại.
    display_answer: を皮切りに

  - key: ja:exercise:n1-u7-kawakiri-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-kawakiri-ni
    prompt:
      template: "この大会は、一九六四年の東京開催{{b1}}、アジア各地で行われるようになった。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Giải đấu này, mở màn bằng lần tổ chức ở Tokyo năm 1964, đã dần được tổ chức ở nhiều nơi tại châu Á."
        - "Gợi ý: を + 皮切り + trợ từ."
    answer:
      blanks:
        b1: [を皮切りに, をかわきりに, を皮切りとして, を皮切りにして]
    known_wrong:
      - answer: をはじめ
        feedback_vi: Câu nói trình tự "lần đầu ở Tokyo rồi lan sang nơi khác" - dùng を皮切りに. をはじめ là nêu ví dụ tiêu biểu.
        error_tag: kawakiri_hajime
      - answer: 皮切りに
        feedback_vi: Cần trợ từ を trước 皮切り - を皮切りに.
        error_tag: particle
    explanation:
      vi: N + を皮切りに - mở màn bằng N. ～ようになった ở vế sau cho thấy sự lan rộng dần theo thời gian.
    display_answer: この大会は、一九六四年の東京開催を皮切りに、アジア各地で行われるようになった。

