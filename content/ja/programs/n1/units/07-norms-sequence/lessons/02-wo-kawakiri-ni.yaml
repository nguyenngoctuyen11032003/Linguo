    explanation:
      vi: 一号店を皮切りに - bắt đầu từ cửa hàng số 1; 展開している - đang mở rộng (chuỗi). Mẫu này nói trình tự khởi đầu rồi lan rộng, không nói về quy mô hay việc đóng cửa.
    display_answer: Khởi đầu từ cửa hàng đầu tiên ở Fukuoka, tiệm ramen này đã mở 50 cửa hàng trong và ngoài nước.

