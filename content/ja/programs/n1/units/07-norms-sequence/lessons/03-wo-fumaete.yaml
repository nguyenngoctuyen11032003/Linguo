body:
  - type: objective
    text:
      vi: Sau bài này, bạn viết được những câu kiểu báo cáo, kế hoạch như "Có tính đến kết quả khảo sát, chúng tôi đề xuất...", "Rút kinh nghiệm từ thất bại lần trước..." - mẫu xuất hiện rất nhiều trong văn bản công việc và bài đọc N1.
  - type: explain
    text:
      vi: 'N + を踏まえて - "trên cơ sở cân nhắc N, có tính đến N". N là một tiền đề đã có: kết quả, ý kiến, tình hình, bài học (調査結果, 皆さんの意見, 現状, 反省). Trước danh từ dùng を踏まえた: 現状を踏まえた対策.'
  - type: explain
    text:
      vi: '踏まえる nghĩa gốc là "giẫm chắc chân lên". Ý hình ảnh: đặt chân vững trên điều đã biết rồi bước tiếp. Vế sau thường là hành động trí óc - 考える, 検討する, 提案する, 決める, 計画を立てる.'
  - type: explain
    text:
      vi: 'So với に基づいて (N2): に基づいて là làm đúng theo một căn cứ cố định (luật, dữ liệu, quy định); を踏まえて là tiếp thu, cân nhắc một tiền đề rồi tự suy nghĩ, phát triển thêm. 法律に基づいて処分する nhưng 前回の失敗を踏まえて計画を見直す.'
  - type: deep_explain
    text:
      vi: 'Tiếng Việt hay nói "dựa trên" cho cả hai, nên người Việt dễ dùng lẫn. Mẹo: nếu thay được bằng "rút kinh nghiệm từ / có xét đến" thì là を踏まえて; nếu thay được bằng "căn cứ theo đúng" thì là に基づいて. を踏まえて gần như chỉ dùng trong văn trang trọng, hội thoại công việc lịch sự.'
  - type: example
    target: アンケート結果を踏まえて、来年度の計画を立てます。
    target_lang: ja
    translation:
      vi: Có tính đến kết quả khảo sát, chúng tôi sẽ lập kế hoạch cho năm tới.
  - type: example
    target: 前回の反省を踏まえ、今回は準備に時間をかけた。
    target_lang: ja
    translation:
      vi: Rút kinh nghiệm từ lần trước, lần này chúng tôi dành nhiều thời gian chuẩn bị.
    note:
      vi: 踏まえ - dạng văn viết của 踏まえて.
  - type: example
    target: 地域の実情を踏まえた支援が求められている。
    target_lang: ja
    translation:
      vi: Cần có sự hỗ trợ sát với tình hình thực tế của địa phương.
  - type: example
    target: 事故に至った経緯を詳しく調べる必要がある。
    target_lang: ja
    translation:
      vi: Cần điều tra kỹ đầu đuôi dẫn đến vụ tai nạn.
  - type: common_mistake
    wrong: 交通ルールを踏まえて、赤信号で止まった。
    right: 交通ルールに従って、赤信号で止まった。
    target_lang: ja
    note:
      vi: Dừng đèn đỏ là làm đúng theo quy tắc - dùng に従って (hoặc に基づいて). を踏まえて dùng cho việc cân nhắc, suy nghĩ dựa trên tiền đề.
  - type: common_mistake
    wrong: 専門家の意見を踏まえる提案をまとめた。
    right: 専門家の意見を踏まえた提案をまとめた。
    target_lang: ja
    note:
      vi: Trước danh từ (提案) dùng dạng た - を踏まえた. Dạng từ điển 踏まえる + N nghe không tự nhiên.
  - type: summary
    points:
      - vi: N + を踏まえて / を踏まえ - có tính đến, rút kinh nghiệm từ N.
      - vi: N + を踏まえた + N - N được xây dựng trên cơ sở ~.
      - vi: に基づいて - căn cứ đúng theo (luật, dữ liệu); を踏まえて - cân nhắc rồi phát triển.
      - vi: 経緯 - đầu đuôi sự việc · 教訓 - bài học kinh nghiệm.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-u7-fumaete-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      stem: Câu 「住民の要望を踏まえて、公園の設計を一部変更した。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a8k, text: "Có tính đến nguyện vọng của cư dân, chúng tôi đã thay đổi một phần thiết kế công viên.", lang: vi }
        - { id: b3m, text: "Bất chấp nguyện vọng của cư dân, thiết kế công viên vẫn giữ nguyên.", lang: vi }
        - { id: c7n, text: Cư dân đã tự thay đổi thiết kế công viên., lang: vi }
        - { id: d1p, text: Thiết kế công viên được giữ bí mật với cư dân., lang: vi }
    answer:
      correct_option_id: a8k
    explanation:
      vi: 要望を踏まえて - có tính đến nguyện vọng; 一部変更した - đã thay đổi một phần. を踏まえて là tiếp thu tiền đề, ngược với "bất chấp".
    display_answer: Có tính đến nguyện vọng của cư dân, chúng tôi đã thay đổi một phần thiết kế công viên.

  - key: ja:exercise:n1-u7-fumaete-listen-kyoukun
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-kyoukun
    prompt:
      audio_asset_id: null
      fallback_text: 震災の教訓を踏まえ、市は避難所の数を増やした。
      options:
        - { id: e2q, text: "Rút kinh nghiệm từ trận động đất, thành phố đã tăng số nơi lánh nạn.", lang: vi }
        - { id: f6r, text: "Vì trận động đất, thành phố đã đóng cửa các nơi lánh nạn.", lang: vi }
        - { id: g9s, text: Thành phố đã quên bài học từ trận động đất., lang: vi }
        - { id: h4t, text: Thành phố đang dạy học sinh về động đất., lang: vi }
    answer:
      correct_option_id: e2q
    explanation:
      vi: 震災の教訓 - bài học từ thảm hoạ động đất; 踏まえ - dạng văn viết của 踏まえて; 避難所を増やした - tăng nơi lánh nạn. 教訓 là "bài học kinh nghiệm", không phải "dạy học".
