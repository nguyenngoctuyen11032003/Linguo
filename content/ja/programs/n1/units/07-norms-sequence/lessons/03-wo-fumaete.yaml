key: ja:lesson:n1-u7-wo-fumaete
order_index: 3
level: n1
title:
  vi: Có tính đến, rút kinh nghiệm từ... - ～を踏まえて, ～を踏まえた
objectives:
  - vi: Nói "có tính đến kết quả, ý kiến, bài học..." bằng ～を踏まえて / を踏まえた + N.
  - vi: Phân biệt を踏まえて với に基づいて (N2).
  - vi: Viết câu báo cáo, đề xuất theo văn phong trang trọng.
estimated_minutes: 22
skills: [grammar, writing]
prerequisites: [ja:lesson:n1-u7-wo-kawakiri-ni]
