  - key: ja:exercise:n1-u7-fumaete-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-ni-motozuite
    prompt:
      stem: 'Chọn từ hợp nhất: 違反した社員は、就業規則 ＿＿ 処分される。 ("Nhân viên vi phạm sẽ bị xử lý căn cứ theo nội quy lao động.")'
      stem_lang: vi
      options:
        - { id: i6u, text: に基づいて, lang: ja }
        - { id: j1v, text: を皮切りに, lang: ja }
        - { id: k5w, text: にあるまじき, lang: ja }
        - { id: l9x, text: を踏まえた, lang: ja }
    answer:
      correct_option_id: i6u
    explanation:
      vi: Xử lý đúng theo một quy định cố định - に基づいて. を皮切りに là mở màn; にあるまじき cần danh từ đi sau; を踏まえた phải đứng trước danh từ, không đứng trước động từ 処分される.
    display_answer: に基づいて

  - key: ja:exercise:n1-u7-fumaete-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      template: "今年の売り上げ不振{{b1}}、来年は販売方法を見直すことにした。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Có xét đến việc doanh thu năm nay kém, năm sau chúng tôi quyết định xem lại cách bán hàng."
        - "Gợi ý: を + động từ 踏まえる ở dạng nối câu."
    answer:
      blanks:
        b1: [を踏まえて, をふまえて, を踏まえ, をふまえ]
    known_wrong:
      - answer: を踏まえた
        feedback_vi: を踏まえた đứng trước danh từ; ở đây phía sau là cả một vế câu - dùng を踏まえて.
        error_tag: fumaete_form
      - answer: を皮切りに
        feedback_vi: を皮切りに là mở màn một chuỗi sự việc; ở đây là cân nhắc kết quả kém để thay đổi - を踏まえて.
        error_tag: fumaete_kawakiri
    explanation:
      vi: 売り上げ不振を踏まえて - có xét đến doanh thu kém; 見直すことにした - quyết định xem lại. Vế sau là quyết định sau khi cân nhắc - đúng chỗ của を踏まえて.
    display_answer: 今年の売り上げ不振を踏まえて、来年は販売方法を見直すことにした。

  - key: ja:exercise:n1-u7-fumaete-mcq-keii
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-keii
    prompt:
      stem: Trong câu 「会見で社長は、契約が破棄された経緯を説明した。」, 経緯 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: m3y, text: "đầu đuôi, quá trình diễn biến của sự việc", lang: vi }
        - { id: n8z, text: số tiền bồi thường, lang: vi }
        - { id: o2a, text: kinh độ và vĩ độ, lang: vi }
        - { id: p7b, text: người chịu trách nhiệm, lang: vi }
    answer:
      correct_option_id: m3y
    explanation:
      vi: 経緯 - đầu đuôi sự việc (quá trình dẫn đến kết quả); 破棄される - bị huỷ bỏ. Nghĩa "kinh độ, vĩ độ" là 経度・緯度, không phải nghĩa trong tin tức.
    display_answer: đầu đuôi, quá trình diễn biến của sự việc

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u7-fumaete-fill-recall
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      template: "参加者の感想を{{b1}}改善案を、来週までに提出してください。(có tính đến - trước danh từ)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [踏まえた, ふまえた]
    known_wrong:
      - answer: 踏まえて
        feedback_vi: Ngay trước danh từ 改善案 dùng 踏まえた.
        error_tag: fumaete_form
      - answer: 踏まえる
        feedback_vi: Trước danh từ, mẫu này dùng dạng た - 踏まえた.
        error_tag: fumaete_form
    explanation:
      vi: N を踏まえた + N - N được xây dựng có tính đến ~. 感想を踏まえた改善案 - phương án cải thiện có tính đến cảm nhận của người tham gia.
    display_answer: 参加者の感想を踏まえた改善案を、来週までに提出してください。

  - key: ja:exercise:n1-u7-fumaete-write-fumaete
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      source_text: Có tính đến ý kiến của khách hàng, chúng tôi đã thay đổi bao bì sản phẩm. (dùng を踏まえて)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - お客様の意見を踏まえて、商品のパッケージを変更しました。
        - お客様の意見を踏まえて、商品のパッケージを変えました。
        - お客様のご意見を踏まえて、商品のパッケージを変更しました。
        - お客様の意見を踏まえ、商品のパッケージを変更しました。
        - 顧客の意見を踏まえて、商品のパッケージを変更した。
        - お客様の声を踏まえて、商品のパッケージを変更しました。
        - お客様の意見を踏まえて、製品のパッケージを変更しました。
        - お客様の意見を踏まえて、商品の包装を変更しました。
        - おきゃくさまのいけんをふまえて、しょうひんのパッケージをへんこうしました。
    known_wrong:
      - answer: お客様の意見を踏まえた、商品のパッケージを変更しました。
        feedback_vi: Trước vế câu dùng 踏まえて; 踏まえた chỉ nối trực tiếp vào danh từ.
        error_tag: fumaete_form
      - answer: お客様の意見に踏まえて、商品のパッケージを変更しました。
        feedback_vi: 踏まえる là ngoại động từ - đi với を (意見を踏まえて).
        error_tag: particle
    explanation:
      vi: N を踏まえて + V - làm V có tính đến N. ご意見 / 声 là cách nói lịch sự về ý kiến khách hàng; 変更する trang trọng hơn 変える.
    display_answer: お客様の意見を踏まえて、商品のパッケージを変更しました。

  - key: ja:exercise:n1-u7-fumaete-write-keii
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u7-keii
    prompt:
      source_text: Xin hãy báo cáo đầu đuôi sự việc bằng văn bản. (dùng 経緯)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 事件の経緯を文書で報告してください。
        - 経緯を文書で報告してください。
        - これまでの経緯を文書で報告してください。
        - 経緯を書面で報告してください。
        - 経緯を書面でご報告ください。
        - 事の経緯を文書で報告してください。
        - 経緯を文書にして報告してください。
        - 経緯を文書で報告して下さい。
        - けいいをぶんしょでほうこくしてください。
    known_wrong:
      - answer: 理由を文書で報告してください。
        feedback_vi: 理由 chỉ là lý do; đầu đuôi, cả quá trình là 経緯.
        error_tag: vocab_meaning
      - answer: 経緯に文書で報告してください。
        feedback_vi: 経緯 là tân ngữ của 報告する - dùng を.
        error_tag: particle
    explanation:
      vi: 経緯を報告する - báo cáo đầu đuôi; 文書で / 書面で - bằng văn bản. Người Nhật hay nói これまでの経緯 (diễn biến từ trước tới nay) khi bàn giao công việc.
    display_answer: 経緯を文書で報告してください。

  # ---------------- application ----------------
  - key: ja:exercise:n1-u7-fumaete-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      source_text: 高齢化の現状を踏まえた街づくりが急がれている。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Việc xây dựng đô thị có tính đến thực trạng già hoá dân số đang rất cấp bách.
        - Cần gấp rút xây dựng đô thị phù hợp với thực trạng già hoá dân số.
        - Việc quy hoạch thành phố có xét đến hiện trạng già hoá đang được đẩy nhanh.
        - Quy hoạch đô thị dựa trên thực trạng già hoá dân số đang là việc cấp bách.
        - Việc xây dựng thành phố có tính đến tình trạng già hoá dân số hiện nay đang cấp bách.
        - Cần khẩn trương xây dựng đô thị có tính đến thực trạng già hoá dân số.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Việc xây dựng đô thị đã làm dân số già đi nhanh hơn.
        feedback_vi: を踏まえた là "có tính đến" thực trạng, không phải nguyên nhân gây ra già hoá.
        error_tag: meaning
    explanation:
      vi: 高齢化の現状を踏まえた街づくり - xây dựng đô thị có tính đến thực trạng già hoá; 急がれている - đang được thúc giục, là việc cấp bách.
    display_answer: Việc xây dựng đô thị có tính đến thực trạng già hoá dân số đang rất cấp bách.

  - key: ja:exercise:n1-u7-fumaete-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u7-gram-wo-fumaete
    prompt:
      stem: Trong cuộc họp, bạn đề xuất lập lại kế hoạch sau khi rút kinh nghiệm từ sự cố tháng trước. Câu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: q4c, text: 先月のトラブルを踏まえて、計画を立て直してはいかがでしょうか。, lang: ja }
        - { id: r9d, text: 先月のトラブルを皮切りに、計画を立て直してはいかがでしょうか。, lang: ja }
        - { id: s3e, text: 先月のトラブルにあるまじき、計画を立て直してはいかがでしょうか。, lang: ja }
        - { id: t8f, text: 先月のトラブルを踏まえる、計画を立て直してはいかがでしょうか。, lang: ja }
    answer:
      correct_option_id: q4c
    explanation:
      vi: Rút kinh nghiệm từ sự cố rồi lập lại kế hoạch - を踏まえて, kèm lời đề xuất lịch sự ～てはいかがでしょうか. を皮切りに là mở màn một chuỗi; にあるまじき cần danh từ; 踏まえる không nối vế câu như thế.
    display_answer: 先月のトラブルを踏まえて、計画を立て直してはいかがでしょうか。

