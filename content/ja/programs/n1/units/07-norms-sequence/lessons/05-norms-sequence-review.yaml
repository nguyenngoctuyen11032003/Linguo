      direction: vi_to_target
    answer:
      accepted:
        - 長い歴史があればこそ、このクラブは変わらなければならないのだ。
        - 長い歴史があればこそ、このクラブは変わらなければならない。
        - 長い歴史があればこそ、このクラブは変わるべきなのだ。
        - 長い歴史があればこそ、このクラブは変わる必要があるのだ。
        - 歴史が長ければこそ、このクラブは変わらなければならないのだ。
        - 長い歴史を持つクラブであればこそ、変わらなければならないのだ。
        - 長い歴史があればこそ、このクラブは変わらなくてはならないのだ。
        - ながいれきしがあればこそ、このクラブはかわらなければならないのだ。
