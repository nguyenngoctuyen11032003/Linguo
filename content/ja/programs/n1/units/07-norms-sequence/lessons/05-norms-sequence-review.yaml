  vi: Ôn tập - xã luận về cải cách một câu lạc bộ thể thao
objectives:
  - vi: Đọc hiểu một bài xã luận dùng あるまじき, を皮切りに, を踏まえて, ゆえに, ばこそ.
  - vi: Chọn đúng mẫu theo sắc thái - phê phán, trình tự, căn cứ, nguyên nhân.
  - vi: Viết câu nhận định trang trọng về tổ chức và chuẩn mực.
