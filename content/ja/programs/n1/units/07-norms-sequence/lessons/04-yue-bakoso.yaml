    explanation:
      vi: Đứng trước danh từ 失敗 dùng ゆえの. ゆえに nối vế câu; ばこそ gắn vào thể ば, không gắn trực tiếp vào danh từ; ゆえな không tồn tại.
    display_answer: ゆえの

  - key: ja:exercise:n1-u7-yue-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u7-gram-bakoso
    prompt:
      template: "子どもを愛して{{b1}}、親は時に厳しく叱るのだ。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Chính vì yêu con nên đôi khi cha mẹ mới mắng nghiêm khắc."
        - "Gợi ý: いる ở thể ば + こそ."
    answer:
      blanks:
        b1: [いればこそ]
    known_wrong:
      - answer: いるこそ
        feedback_vi: こそ trong mẫu này gắn vào thể ば - いればこそ.
        error_tag: bakoso_form
      - answer: いるゆえ
        feedback_vi: ゆえ nêu nguyên nhân khách quan; nhấn "chính vì yêu nên mới..." dùng ばこそ.
        error_tag: bakoso_yue
    explanation:
      vi: 愛している → 愛していれば → 愛していればこそ. Hành động "mắng nghiêm" nghe ngược đời được giải thích bằng lý do tốt đẹp - đúng chức năng của ばこそ, và câu kết bằng のだ.
    display_answer: 子どもを愛していればこそ、親は時に厳しく叱るのだ。

  - key: ja:exercise:n1-u7-yue-mcq-kugen
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-kugen
    prompt:
      stem: Câu 「恩師は私の甘い計画に苦言を呈した。」 nghĩa gần nhất là gì?
      stem_lang: vi
      options:
        - { id: m7y, text: Người thầy cũ đã thẳng thắn góp ý về kế hoạch còn dễ dãi của tôi., lang: vi }
        - { id: n2z, text: Người thầy cũ đã khen kế hoạch của tôi., lang: vi }
        - { id: o6a, text: Người thầy cũ đã nói xấu tôi với người khác., lang: vi }
        - { id: p1b, text: Người thầy cũ đã tặng tôi một bản kế hoạch., lang: vi }
    answer:
      correct_option_id: m7y
    explanation:
      vi: 苦言を呈する - thẳng thắn góp ý những điều khó nghe (với thiện ý); 甘い計画 - kế hoạch dễ dãi, thiếu chặt chẽ. Không phải khen hay nói xấu.
    display_answer: Người thầy cũ đã thẳng thắn góp ý về kế hoạch còn dễ dãi của tôi.

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u7-yue-fill-recall
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-yue
    prompt:
      template: "この地域は交通が不便{{b1}}、若者が都市に流出している。(vì - văn viết)"
      blanks:
        - { id: b1, width_hint: 7 }
    answer:
      blanks:
        b1: [であるがゆえに, なるがゆえに, ゆえに]
    known_wrong:
      - answer: ゆえの
        feedback_vi: ゆえの đứng trước danh từ; ở đây phía sau là cả vế câu - であるがゆえに.
        error_tag: yue_form
      - answer: であればこそ
        feedback_vi: Giao thông bất tiện là nguyên nhân tiêu cực; ばこそ dành cho lý do tốt đẹp.
        error_tag: bakoso_yue
    explanation:
      vi: 不便 + であるがゆえに - vì bất tiện (văn viết). Với tính từ đuôi な có ba cách - 不便であるがゆえに, 不便なるがゆえに (cổ hơn) hoặc gọn 不便ゆえに. 流出 - chảy ra, ở đây là người trẻ rời đi.
    display_answer: この地域は交通が不便であるがゆえに、若者が都市に流出している。

  - key: ja:exercise:n1-u7-yue-write-bakoso
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u7-gram-bakoso
    prompt:
      source_text: Chính vì có khách hàng ủng hộ nên công ty mới tồn tại được. (dùng ばこそ)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - お客様の支えがあればこそ、会社は存続できるのだ。
        - お客様の支えがあればこそ、会社は存続できる。
        - お客様の支持があればこそ、会社は存続できるのだ。
        - お客様の支えがあればこそ、会社は続けられるのだ。
        - お客様の応援があればこそ、会社は存続できるのです。
        - お客様の支えがあればこそ、会社が存続できるのだ。
        - お客様が支えてくださればこそ、会社は存続できるのだ。
        - 顧客の支持があればこそ、会社は存続できるのだ。
        - おきゃくさまのささえがあればこそ、かいしゃはそんぞくできるのだ。
    known_wrong:
      - answer: お客様の支えがあるこそ、会社は存続できるのだ。
        feedback_vi: こそ trong mẫu này đi sau thể ば - あればこそ.
        error_tag: bakoso_form
      - answer: お客様の支えがあればこそ、会社は倒産したのだ。
        feedback_vi: ばこそ nêu lý do tốt dẫn tới kết quả tốt; "phá sản" ngược nghĩa câu gốc.
        error_tag: meaning
    explanation:
      vi: 支えがある → 支えがあれば → 支えがあればこそ - chính vì có sự ủng hộ; 存続できる - có thể tồn tại. のだ ở cuối nhấn giọng giải thích.
    display_answer: お客様の支えがあればこそ、会社は存続できるのだ。

