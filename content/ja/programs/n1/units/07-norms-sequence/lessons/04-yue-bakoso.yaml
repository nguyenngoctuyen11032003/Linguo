key: ja:lesson:n1-u7-yue-bakoso
order_index: 4
level: n1
title:
  vi: Vì..., chính vì... nên mới - ～ゆえ(に), ～ばこそ
objectives:
  - vi: Nêu nguyên nhân trong văn viết trang trọng bằng ～ゆえ(に) / ゆえの + N.
  - vi: Nhấn mạnh lý do tích cực bằng ～ばこそ.
  - vi: Phân biệt ばこそ với からこそ và ゆえ với から / ので.
estimated_minutes: 24
skills: [grammar, reading, writing]
prerequisites: [ja:lesson:n1-u7-wo-fumaete]
items:
  - item: ja:item:n1-u7-gram-yue
  - item: ja:item:n1-u7-gram-bakoso
  - item: ja:item:n1-u7-hinkon
  - item: ja:item:n1-u7-kugen
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu các câu lý do kiểu văn viết như "Chính vì nghèo nên...", "sai lầm do tuổi trẻ" và nói được câu giải thích sâu sắc "Chính vì nghĩ cho em nên anh mới nói thẳng".
  - type: explain
    text:
      vi: '～ゆえ(に) - "vì, do", bản văn viết cổ của から / ので. Cách nối: N + ゆえ / N + の + ゆえ, thể thường + (が)ゆえに: 貧しいがゆえに, 若さゆえに. Trước danh từ là ゆえの: 若さゆえの過ち (lỗi lầm do tuổi trẻ).'
  - type: explain
    text:
      vi: '～ばこそ - "chính vì... nên mới...". Lấy thể ば rồi thêm こそ: 思えばこそ, 健康であればこそ. Thường giải thích một hành động nghe ngược đời (nghiêm khắc, nói thẳng) bằng một lý do tốt đẹp, và hay kết bằng のだ / のです.'
  - type: deep_explain
    text:
      vi: 'Mức trang trọng: から < ので < ため < ゆえに. Còn ばこそ là bản văn chương của からこそ (N3): あなたを信じているからこそ = あなたを信じていればこそ. Cả hai nhấn lý do tích cực; với lý do tiêu cực, cách nói tự nhiên là ので / ため.'
  - type: example
    target: 責任ある立場ゆえに、軽はずみな発言は許されない。
    target_lang: ja
    translation:
      vi: Vì ở vị trí có trách nhiệm nên không được phép phát ngôn bừa bãi.
    note:
      vi: N + ゆえに.
  - type: example
    target: あれは若さゆえの過ちだったと、今では思う。
    target_lang: ja
    translation:
      vi: Bây giờ tôi nghĩ đó là sai lầm do tuổi trẻ.
    note:
      vi: ゆえの + N.
  - type: example
    target: 君の将来を思えばこそ、厳しいことを言うのだ。
    target_lang: ja
    translation:
      vi: Chính vì nghĩ cho tương lai của em nên tôi mới nói những lời nghiêm khắc.
  - type: example
    target: 家族の支えがあればこそ、ここまで頑張ってこられた。
    target_lang: ja
    translation:
      vi: Chính vì có gia đình ở bên nên tôi mới cố gắng được đến hôm nay.
  - type: example
    target: 部長はあえて部下に苦言を呈した。
    target_lang: ja
    translation:
      vi: Trưởng phòng đã cố ý góp ý thẳng thắn với cấp dưới.
  - type: common_mistake
    wrong: 頭が痛いゆえに、今日は休むね。
    right: 頭が痛いから、今日は休むね。
    target_lang: ja
    note:
      vi: ゆえに là văn viết cổ; trong câu nói thân mật nghe rất buồn cười. Hội thoại dùng から / ので.
  - type: common_mistake
    wrong: 雨が降っていればこそ、試合は中止になった。
    right: 雨が降っていたので、試合は中止になった。
    target_lang: ja
    note:
      vi: ばこそ nhấn lý do tốt đẹp, có ý "chính nhờ / chính vì nghĩ cho...". Nguyên nhân khách quan, tiêu cực như trời mưa dùng ので / ため.
  - type: summary
    points:
      - vi: N(の) / thể thường(が) + ゆえ(に) - vì (văn viết); ゆえの + N.
      - vi: V-ば / A-ければ / Nであれば + こそ - chính vì... nên mới... (lý do tích cực).
      - vi: ばこそ ≈ からこそ nhưng trang trọng, văn chương hơn.
      - vi: 貧困 - nghèo đói · 苦言 - lời góp ý thẳng thắn.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-u7-yue-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u7-gram-bakoso
    prompt:
      stem: Câu 「選手を信頼していればこそ、監督は何も言わずに任せたのだ。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a2k, text: Chính vì tin tưởng các cầu thủ nên huấn luyện viên mới giao phó mà không nói gì., lang: vi }
        - { id: b7m, text: Huấn luyện viên không tin cầu thủ nên không nói gì với họ., lang: vi }
        - { id: c3n, text: Nếu tin cầu thủ thì huấn luyện viên nên nói nhiều hơn., lang: vi }
        - { id: d8p, text: Cầu thủ tin huấn luyện viên nên làm theo mọi lời ông nói., lang: vi }
    answer:
      correct_option_id: a2k
    explanation:
      vi: 信頼していればこそ - chính vì tin tưởng (lý do tích cực); 任せたのだ - đã giao phó. ばこそ không phải câu điều kiện "nếu... thì nên".
    display_answer: Chính vì tin tưởng các cầu thủ nên huấn luyện viên mới giao phó mà không nói gì.

  - key: ja:exercise:n1-u7-yue-listen-hinkon
