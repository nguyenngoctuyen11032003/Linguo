    difficulty: 4
    item: ja:item:n1-u7-hinkon
    prompt:
      audio_asset_id: null
      fallback_text: 貧困ゆえに、学校に通えない子どもが今も大勢いる。
      options:
        - { id: e5q, text: "Vì nghèo đói, đến nay vẫn có rất nhiều trẻ em không được đi học.", lang: vi }
        - { id: f1r, text: "Dù nghèo, trẻ em ở đây vẫn được đi học đầy đủ.", lang: vi }
        - { id: g6s, text: Trường học đang giúp trẻ em thoát nghèo., lang: vi }
        - { id: h2t, text: Số trẻ em nghèo đã giảm mạnh., lang: vi }
    answer:
      correct_option_id: e5q
    explanation:
      vi: 貧困ゆえに - vì nghèo đói; 通えない - không thể đi học; 今も大勢いる - đến nay vẫn còn nhiều. ゆえに nêu nguyên nhân, không phải nhượng bộ "dù".
    display_answer: Vì nghèo đói, đến nay vẫn có rất nhiều trẻ em không được đi học.

  - key: ja:exercise:n1-u7-yue-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u7-gram-yue
    prompt:
      stem: 'Chọn dạng đúng: これは経験不足 ＿＿ 失敗だった。 ("Đây là thất bại do thiếu kinh nghiệm.")'
      stem_lang: vi
      options:
        - { id: i9u, text: ゆえの, lang: ja }
        - { id: j4v, text: ゆえに, lang: ja }
