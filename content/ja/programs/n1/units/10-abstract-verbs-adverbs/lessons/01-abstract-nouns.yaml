        feedback_vi: 枠組み là khuôn khổ; "củng cố" nền tảng dùng 基盤.
        error_tag: collocation
    explanation:
      vi: 基盤を固める - củng cố nền tảng.
    display_answer: 経済の基盤を固めます。
  - key: ja:exercise:n1-u10-abstract-n7
