    difficulty: 5
    item: ja:item:n1-u10-yochi
    prompt:
      source_text: Kế hoạch này còn dư địa để cải thiện.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - この計画には、改善の余地があります。
        - この計画には改善の余地があります。
        - このけいかくには、かいぜんのよちがあります。
        - この計画は改善の余地があります。
