        feedback_vi: 秩序 là trật tự; "cân bằng" là 均衡.
        error_tag: vocab_meaning
    explanation:
      vi: 均衡を保つ - giữ cân bằng.
    display_answer: 収入と支出の均衡を保ちます。
  - key: ja:exercise:n1-u10-abstract-n8
