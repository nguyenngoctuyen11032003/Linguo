    stage: recognition
    answer_lang: ja
    difficulty: 5
    item: ja:item:n1-u10-keiki-n1
    prompt:
      stem: Bạn xem xét lại chế độ nhân một sự kiện. Mẫu nào?
      stem_lang: vi
      options:
        - id: uyo
          text: これを基盤に、制度を見直します
          lang: ja
        - id: upa
          text: これを兆しに、制度を見直します
          lang: ja
        - id: bus
          text: これを余地に、制度を見直します
          lang: ja
        - id: nvk
          text: これを契機に、制度を見直します
          lang: ja
