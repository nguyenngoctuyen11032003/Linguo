  - key: ja:exercise:n1-u6-sura-dani-fill-bidou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-dani
    prompt:
      template: "宮殿の衛兵は、激しい雨の中でも微動{{b1}}しなかった。(không nhúc nhích mảy may)"
