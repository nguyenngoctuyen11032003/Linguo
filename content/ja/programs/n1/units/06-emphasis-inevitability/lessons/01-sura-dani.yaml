body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu và viết được những câu nhấn mạnh mạnh hơn さえ - "đến chuyên gia còn không biết", "chỉ tưởng tượng thôi đã rùng mình", "không được lơ là dù chỉ một giây".
  - type: explain
    text:
      vi: 'N + (で)すら - "ngay cả N": nêu ví dụ cực đoan để ngầm nói "huống chi cái khác". Nghĩa như さえ nhưng cứng, văn viết hơn; chủ ngữ là người thường thêm で - 専門家ですら.'
  - type: explain
    text:
      vi: '～だに có hai mẫu. (1) 考える / 想像する / 聞く / 思い出す + だに + cảm xúc: "chỉ cần... thôi đã...". (2) N + だに + phủ định, chủ yếu trong cụm cố định: 夢にだに思わない (nằm mơ cũng không nghĩ tới), 微動だにしない (không nhúc nhích mảy may).'
  - type: explain
    text:
      vi: '一 + lượng từ + たりとも + phủ định / cấm đoán: "dù chỉ một... cũng không" - 一円たりとも, 一日たりとも, 一瞬たりとも. Tiếng Việt cũng nói "dù chỉ một đồng", nên cách nghĩ giống nhau; chỉ khác là con số phải là đơn vị nhỏ nhất.'
  - type: deep_explain
    text:
      vi: 'Mức trang trọng tăng dần: さえ (hội thoại và văn viết) → すら (văn viết) → だに (văn chương, cụm cố định). すら không có mẫu điều kiện như さえ～ば - nói 時間さえあれば, không nói ×時間すらあれば. たりとも hay đi với 許されない, できない, 無駄にしない - giọng nghiêm, thường gặp trong lời huấn thị, khẩu hiệu, xã luận.'
  - type: example
    target: この漢字は、日本人ですら読めない人が多い。
    target_lang: ja
    translation:
      vi: Chữ Hán này, đến người Nhật cũng nhiều người không đọc được.
    note:
      vi: Người làm chủ ngữ + ですら.
  - type: example
    target: 戦争の話は、聞くだに胸が痛む。
    target_lang: ja
    translation:
      vi: Chuyện chiến tranh, chỉ nghe thôi đã thấy đau lòng.
    note:
      vi: 聞く + だに + cảm xúc.
  - type: example
    target: 先生に叱られても、彼は微動だにしなかった。
    target_lang: ja
    translation:
      vi: Dù bị thầy mắng, cậu ấy vẫn không nhúc nhích mảy may.
    note:
      vi: 微動だにしない - cụm cố định.
  - type: example
    target: この仕事では、一日たりとも休めない。
    target_lang: ja
    translation:
      vi: Công việc này không thể nghỉ dù chỉ một ngày.
    note:
      vi: 一日たりとも + phủ định.
  - type: example
    target: 優勝候補だからこそ、油断は禁物だ。
    target_lang: ja
    translation:
      vi: Chính vì là ứng viên vô địch nên tuyệt đối không được chủ quan.
    note:
      vi: 油断 - sự chủ quan; 禁物 - điều cấm kỵ.
  - type: example
    target: 税金の浪費を許してはならない。
    target_lang: ja
    translation:
      vi: Không được để tiền thuế bị phung phí.
    note:
      vi: 浪費 - lãng phí (văn viết).
  - type: common_mistake
    wrong: 三日たりとも休まなかった。
    right: 一日たりとも休まなかった。
    target_lang: ja
    note:
      vi: たりとも đi với 一 + lượng từ (đơn vị nhỏ nhất); "ba ngày" không mang nghĩa "dù chỉ một".
  - type: common_mistake
    wrong: 時間すらあれば、旅行に行きたい。
    right: 時間さえあれば、旅行に行きたい。
    target_lang: ja
    note:
      vi: Mẫu "chỉ cần... là..." chỉ có さえ～ば; すら không dùng trong câu điều kiện.
  - type: common_mistake
    wrong: 会社に行くだに疲れる。
    right: 会社のことを考えるだに気が重い。
    target_lang: ja
    note:
      vi: だに chỉ đi với các động từ nghĩ, nghe, tưởng tượng, nhớ lại - và vế sau là cảm xúc.
  - type: summary
    points:
      - vi: N + (で)すら - ngay cả N (văn viết, mạnh hơn さえ).
      - vi: 考える / 想像する / 聞く + だに - chỉ cần... thôi đã...
      - vi: 夢にだに思わない · 微動だにしない - cụm cố định với だに.
      - vi: 一 + lượng từ + たりとも + phủ định - dù chỉ một.
      - vi: 油断 - chủ quan · 浪費 - lãng phí.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n1-u6-sura-dani-mcq-taritomo
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n1-u6-gram-taritomo
    prompt:
      stem: Câu 「彼は入社以来、一日たりとも休まなかった。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a7k, text: Từ khi vào công ty anh ấy chưa nghỉ dù chỉ một ngày., lang: vi }
        - { id: b3m, text: Từ khi vào công ty anh ấy chỉ nghỉ đúng một ngày., lang: vi }
        - { id: c8n, text: Từ khi vào công ty anh ấy nghỉ mỗi ngày một chút., lang: vi }
        - { id: d2p, text: Từ khi vào công ty anh ấy không được nghỉ quá một ngày., lang: vi }
    answer:
      correct_option_id: a7k
    explanation:
      vi: 一日たりとも + phủ định = không... dù chỉ một ngày (phủ định tuyệt đối). Không phải "chỉ một ngày" hay "không quá một ngày".
    display_answer: Từ khi vào công ty anh ấy chưa nghỉ dù chỉ một ngày.

