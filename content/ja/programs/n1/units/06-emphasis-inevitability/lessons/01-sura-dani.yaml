  - key: ja:exercise:n1-u6-sura-dani-translate-yudan
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u6-yudan
    prompt:
      source_text: ベテラン選手の一瞬の油断が、思わぬ敗北を招いた。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Một giây chủ quan của tuyển thủ kỳ cựu đã dẫn đến thất bại không ngờ.
        - Phút chủ quan của tuyển thủ kỳ cựu đã dẫn đến thất bại không ngờ.
        - Một thoáng chủ quan của tuyển thủ kỳ cựu đã dẫn đến thất bại bất ngờ.
        - Một khoảnh khắc chủ quan của tuyển thủ kỳ cựu đã gây ra thất bại không ngờ.
        - Một giây lơ là của tuyển thủ kỳ cựu đã dẫn đến thất bại không ngờ.
        - Chỉ một thoáng lơ là của vận động viên kỳ cựu đã dẫn đến trận thua bất ngờ.
        - Sự chủ quan trong chốc lát của tuyển thủ kỳ cựu đã dẫn đến thất bại không ngờ.
        - Một phút lơ là của cầu thủ kỳ cựu đã dẫn đến thất bại không ngờ.
        - Một thoáng chủ quan của vận động viên lão luyện đã dẫn đến thất bại ngoài dự đoán.
        - Một khoảnh khắc lơ là của tuyển thủ kỳ cựu đã khiến đội thua bất ngờ.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Một giây chủ quan của tuyển thủ kỳ cựu đã dẫn đến chiến thắng không ngờ.
        feedback_vi: 敗北 là thất bại, không phải chiến thắng.
        error_tag: vocab_meaning
    explanation:
      vi: ベテラン選手 - tuyển thủ kỳ cựu; 一瞬の油断 - một thoáng chủ quan; 思わぬ敗北を招いた - dẫn đến thất bại không ngờ.
    display_answer: Một giây chủ quan của tuyển thủ kỳ cựu đã dẫn đến thất bại không ngờ.

  - key: ja:exercise:n1-u6-sura-dani-mcq-exam
