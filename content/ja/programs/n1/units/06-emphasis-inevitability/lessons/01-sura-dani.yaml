  - key: ja:exercise:n1-u6-sura-dani-mcq-dani
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-dani
    prompt:
      stem: 'Chọn từ đúng: あの事故の光景は、思い出す＿＿ぞっとする。'
      stem_lang: vi
      options:
        - { id: i6u, text: だに, lang: ja }
        - { id: j2v, text: たりとも, lang: ja }
        - { id: k7w, text: ならでは, lang: ja }
        - { id: l3x, text: すらに, lang: ja }
    answer:
      correct_option_id: i6u
    explanation:
      vi: 思い出すだにぞっとする - chỉ nhớ lại thôi đã rùng mình. たりとも cần 一 + lượng từ; ならでは đi sau danh từ; すらに không tồn tại.
    display_answer: だに

  - key: ja:exercise:n1-u6-sura-dani-fill-taritomo
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u6-gram-taritomo
    prompt:
      template: "警備員は一晩中、一秒{{b1}}モニターから目を離さなかった。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Người bảo vệ suốt đêm không rời mắt khỏi màn hình dù chỉ một giây."
        - "Gợi ý: 一 + lượng từ + (4 chữ kana) + phủ định."
    answer:
      blanks:
        b1: [たりとも]
    known_wrong:
      - answer: ならでは
        feedback_vi: ならでは là "chỉ có ở..."; "dù chỉ một giây" là 一秒たりとも.
        error_tag: taritomo
      - answer: ばかり
        feedback_vi: 一秒ばかり là "chừng một giây" - không mang nghĩa phủ định tuyệt đối.
        error_tag: taritomo
    explanation:
      vi: 一秒たりとも + 目を離さなかった - không rời mắt dù chỉ một giây.
    display_answer: 警備員は一晩中、一秒たりともモニターから目を離さなかった。

  - key: ja:exercise:n1-u6-sura-dani-wb-expert
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-sura
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Kết quả này, đến chuyên gia cũng không dự đoán được.\""
      tokens:
        - { id: t3, text: 予測できなかった }
        - { id: t4, text: 専門家たりとも }
        - { id: t2, text: 専門家ですら }
        - { id: t1, text: この結果は }
    answer:
      orders:
        - [t1, t2, t3]
        - [t2, t1, t3]
    explanation:
      vi: 専門家ですら - ngay cả chuyên gia (người + ですら). 専門家たりとも sai vì たりとも chỉ đi với 一 + lượng từ.
    display_answer: この結果は専門家ですら予測できなかった。

