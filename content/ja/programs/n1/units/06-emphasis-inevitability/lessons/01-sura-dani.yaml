key: ja:lesson:n1-u6-sura-dani
order_index: 1
level: n1
title:
  vi: Ngay cả, chỉ cần... thôi đã, dù chỉ một - ～すら, ～だに, ～たりとも
objectives:
  - vi: Nhấn mạnh "ngay cả..." bằng ～(で)すら trong văn viết.
  - vi: Hiểu ～だに với hai nghĩa - "chỉ cần nghĩ / nghe thôi đã..." và "đến cả... cũng không".
  - vi: Phủ định tuyệt đối bằng 一 + lượng từ + たりとも.
estimated_minutes: 24
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-idiom-culture-review]
