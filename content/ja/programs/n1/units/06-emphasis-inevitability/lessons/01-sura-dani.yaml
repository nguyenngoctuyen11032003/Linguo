        - { id: n9z, text: 試験当日まで、三日たりとも油断できない。, lang: ja }
        - { id: o4a, text: 試験当日まで、一日たりとも油断できる。, lang: ja }
        - { id: p8b, text: 試験当日まで、一日だにの油断できない。, lang: ja }
