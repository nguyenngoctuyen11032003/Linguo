        error_tag: dani_fixed
      - answer: ならでは
        feedback_vi: ならでは là "chỉ có ở", không đi với 微動.
        error_tag: dani_fixed
    explanation:
      vi: 微動だにしない - không nhúc nhích dù một chút (N + だに + phủ định).
    display_answer: 宮殿の衛兵は、激しい雨の中でも微動だにしなかった。

  - key: ja:exercise:n1-u6-sura-dani-translate-tax
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-rouhi
    prompt:
      source_text: Tiền thuế không được phép lãng phí dù chỉ một yên. (dùng たりとも)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 税金は一円たりとも浪費してはならない。
        - 税金を一円たりとも浪費してはならない。
        - 税金は一円たりとも浪費してはいけない。
        - 税金を一円たりとも浪費してはいけない。
        - 税金は一円たりとも浪費できない。
        - 税金は一円たりとも浪費は許されない。
        - 税金は一円たりとも無駄にしてはならない。
        - 税金を一円たりとも無駄にしてはならない。
        - 税金は一円たりとも無駄にしてはいけない。
        - 税金は一円たりとも無駄にできない。
        - 税金の浪費は一円たりとも許されない。
        - 税金は一円たりとも浪費してはなりません。
    known_wrong:
      - answer: 税金は三円たりとも浪費してはならない。
        feedback_vi: たりとも đi với đơn vị nhỏ nhất - 一円たりとも.
        error_tag: taritomo
      - answer: 税金は一円たりとも浪費してもいい。
        feedback_vi: たりとも luôn đi với phủ định hoặc cấm đoán.
        error_tag: taritomo_negative
    explanation:
      vi: 税金 - tiền thuế; 一円たりとも - dù chỉ một yên; 浪費してはならない - không được lãng phí.
    display_answer: 税金は一円たりとも浪費してはならない。

  - key: ja:exercise:n1-u6-sura-dani-translate-child
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n1-u6-gram-sura
    prompt:
      source_text: Chuyện đó thì ngay cả trẻ con cũng biết. (dùng すら)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - そんなことは子どもですら知っている。
        - そんなことは子どもすら知っている。
        - そんなことは子供ですら知っている。
        - そんなことは子供すら知っている。
        - それは子どもですら知っている。
        - それは子供ですら知っている。
        - それは子どもすら知っている。
        - そんなこと子どもですら知っている。
        - そんなことは子どもですら知っています。
        - それは子どもですら知っています。
        - そんなことは子どもですら分かる。
        - 子どもですらそれを知っている。
    known_wrong:
      - answer: そんなことは子どもたりとも知っている。
        feedback_vi: たりとも chỉ đi với 一 + lượng từ và phủ định; "ngay cả trẻ con" là 子どもですら.
        error_tag: sura_taritomo
      - answer: そんなことは子どもならでは知っている。
        feedback_vi: ならでは là "chỉ có ở"; "ngay cả" là すら.
        error_tag: sura_naradeha
    explanation:
      vi: '子どもですら - ngay cả trẻ con (ví dụ cực đoan: trẻ con còn biết, huống chi người lớn).'
    display_answer: そんなことは子どもですら知っている。

