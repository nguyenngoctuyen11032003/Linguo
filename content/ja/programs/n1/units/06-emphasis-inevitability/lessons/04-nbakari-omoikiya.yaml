  - key: ja:exercise:n1-u6-nbakari-omoikiya-mcq-tobakari
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-tobakari
    prompt:
      stem: 'Chọn từ đúng: 彼は「お前のせいだ」＿＿、私をにらみつけた。'
      stem_lang: vi
      options:
        - { id: i7u, text: とばかりに, lang: ja }
        - { id: j2v, text: んばかりに, lang: ja }
        - { id: k6w, text: ならではに, lang: ja }
        - { id: l1x, text: たりともに, lang: ja }
    answer:
      correct_option_id: i7u
    explanation:
      vi: Lời trong ngoặc + とばかりに - như muốn nói "tại mày". んばかり gắn vào gốc phủ định của động từ, không gắn sau lời trích dẫn; ならではに, たりともに không tồn tại.
    display_answer: とばかりに

  - key: ja:exercise:n1-u6-nbakari-omoikiya-fill-egao
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-nbakari
    prompt:
      template: "優勝した子どもたちは、はちきれ{{b1}}笑顔で手を振った。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Bọn trẻ vô địch vẫy tay với nụ cười rạng rỡ như sắp vỡ oà."
        - "Gợi ý: はちきれない → bỏ ない, thêm (5 chữ kana) + danh từ."
    answer:
      blanks:
        b1: [んばかりの]
    known_wrong:
      - answer: とばかりに
        feedback_vi: とばかりに đi sau lời trích dẫn; sau gốc động từ はちきれ cần んばかりの.
        error_tag: nbakari_tobakari
      - answer: んばかりに
        feedback_vi: Trước danh từ 笑顔 phải dùng んばかりの.
        error_tag: nbakari_no
    explanation:
      vi: はちきれんばかりの笑顔 - nụ cười như sắp vỡ oà (rạng rỡ hết cỡ).
    display_answer: 優勝した子どもたちは、はちきれんばかりの笑顔で手を振った。

  - key: ja:exercise:n1-u6-nbakari-omoikiya-wb-scold
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-to-omoikiya
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Cứ tưởng sẽ bị mắng, ai ngờ anh ấy lại cười và bỏ qua cho tôi.\""
      tokens:
        - { id: t2, text: 彼は }
        - { id: t4, text: 怒られると思いきやに }
        - { id: t3, text: 笑って許してくれた }
        - { id: t1, text: 怒られると思いきや、 }
    answer:
      orders:
        - [t1, t2, t3]
    explanation:
      vi: と思いきや là dự đoán của người nói nên đứng đầu câu, sau đó là sự thật trái ngược. 思いきやに không tồn tại.
    display_answer: 怒られると思いきや、彼は笑って許してくれた。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u6-nbakari-omoikiya-fill-cat
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-tobakari
    prompt:
      template: "猫は「ご飯をちょうだい」{{b1}}、私の足元にすり寄ってきた。(như muốn nói)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [とばかりに]
    known_wrong:
      - answer: んばかりに
        feedback_vi: んばかり gắn sau gốc phủ định của động từ; sau lời trích dẫn dùng とばかりに.
        error_tag: nbakari_tobakari
      - answer: と思いきや
        feedback_vi: と思いきや là "tưởng..., ai ngờ"; ở đây là ý ngầm trong cử chỉ của con mèo.
        error_tag: tobakari_omoikiya
    explanation:
      vi: 「ご飯をちょうだい」とばかりに - như muốn nói "cho tôi ăn đi"; tả cử chỉ của con mèo.
    display_answer: 猫は「ご飯をちょうだい」とばかりに、私の足元にすり寄ってきた。

  - key: ja:exercise:n1-u6-nbakari-omoikiya-fill-dog
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-nbakari
    prompt:
      template: "玄関のドアを開けると、犬が飛びつか{{b1}}勢いで走ってきた。(như sắp nhảy chồm lên)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [んばかりの]
    known_wrong:
      - answer: ないばかりの
        feedback_vi: ない phải đổi thành ん - 飛びつかんばかりの.
        error_tag: nbakari_form
      - answer: とばかりに
        feedback_vi: とばかりに đi sau lời trích dẫn; sau gốc động từ là んばかりの.
        error_tag: nbakari_tobakari
    explanation:
      vi: 飛びつかない → 飛びつか + んばかりの + 勢い - khí thế như sắp nhảy chồm lên.
    display_answer: 玄関のドアを開けると、犬が飛びつかんばかりの勢いで走ってきた。

  - key: ja:exercise:n1-u6-nbakari-omoikiya-translate-rain
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-to-omoikiya
    prompt:
      source_text: Cứ tưởng trời sẽ mưa, ai ngờ lại là một ngày nắng đẹp. (dùng と思いきや)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 雨が降ると思いきや、いい天気になった。
        - 雨が降ると思いきや、いい天気だった。
        - 雨が降ると思いきや、よく晴れた。
        - 雨が降ると思いきや、晴れた。
        - 雨が降ると思いきや、快晴だった。
        - 雨が降ると思いきや、晴天だった。
        - 雨が降ると思いきや、すっかり晴れた。
        - 雨になると思いきや、いい天気になった。
        - 雨になると思いきや、晴れた。
        - 雨かと思いきや、いい天気だった。
        - 雨だと思いきや、いい天気だった。
        - 雨が降るかと思いきや、いい天気になった。
    known_wrong:
      - answer: 雨が降ると思いきや、雨が降った。
        feedback_vi: Vế sau phải trái với dự đoán - "ai ngờ trời nắng".
        error_tag: omoikiya_contrast
      - answer: 雨が降るとばかりに、いい天気になった。
        feedback_vi: とばかりに tả cử chỉ "như muốn nói"; "tưởng là... ai ngờ" là と思いきや.
        error_tag: tobakari_omoikiya
    explanation:
      vi: 雨が降ると思いきや - cứ tưởng trời mưa; いい天気になった - (ai ngờ) trời lại đẹp.
    display_answer: 雨が降ると思いきや、いい天気になった。

