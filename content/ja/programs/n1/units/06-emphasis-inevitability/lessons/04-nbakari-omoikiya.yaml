key: ja:lesson:n1-u6-nbakari-omoikiya
order_index: 4
level: n1
title:
  vi: Như sắp..., như muốn nói..., tưởng là... ai ngờ - ～んばかり, ～とばかりに, ～と思いきや
objectives:
  - vi: Tả mức độ mạnh "như sắp... đến nơi" bằng V-(ない) + んばかり.
  - vi: Tả cử chỉ "như muốn nói..." của người khác bằng 「…」とばかりに.
  - vi: Kể chuyện trái dự đoán bằng ～と思いきや.
estimated_minutes: 24
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-u6-zuniwa-okanai]
items:
  - item: ja:item:n1-u6-gram-nbakari
  - item: ja:item:n1-u6-gram-tobakari
  - item: ja:item:n1-u6-gram-to-omoikiya
  - item: ja:item:n1-u6-hakushu
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu đoạn miêu tả giàu hình ảnh trong tiểu thuyết, phóng sự - "nụ cười như muốn tràn ra", "lườm như muốn nói 'tại mày'", "cứ tưởng thắng dễ, ai ngờ..." - và dùng được khi viết.
  - type: explain
    text:
      vi: 'V-ない (bỏ ない) + んばかりに / んばかりの N: "như thể sắp... đến nơi" - mức độ mạnh gần như xảy ra thật: 泣き出さんばかり, あふれんばかりの笑顔. ん là dạng cổ của ない; する → せんばかり.'
  - type: explain
    text:
      vi: '「lời」/ thể thường + とばかりに: "như muốn nói rằng..." - ý thể hiện qua cử chỉ, không nói ra. Chỉ dùng tả người, vật khác, vì người nói tự biết rõ ý mình.'
  - type: explain
    text:
      vi: 'Thể thường + と思いきや: "cứ tưởng là..., ai ngờ..." - vế sau là sự thật trái dự đoán, đã xảy ra. Giống tiếng Việt "tưởng... hoá ra...", nhưng là văn viết; hội thoại dùng と思ったら.'
  - type: deep_explain
    text:
      vi: 'Phân biệt nhanh: んばかり đo mức độ (gần như xảy ra), とばかりに đọc ý ngầm trong cử chỉ, と思いきや đảo ngược kỳ vọng. Cả ba đều là lối miêu tả của người kể chuyện, ít gặp trong hội thoại thường ngày. Đừng nhầm んばかり với ～たばかり (vừa mới) - 泣いたばかり là "vừa khóc xong".'
  - type: example
    target: 彼は今にも怒鳴り出さんばかりの勢いで部屋に入ってきた。
    target_lang: ja
    translation:
      vi: Anh ta xông vào phòng với khí thế như sắp quát tháo đến nơi.
    note:
      vi: 怒鳴り出さない → 怒鳴り出さ + んばかり.
  - type: example
    target: 庭には、あふれんばかりのバラが咲いていた。
    target_lang: ja
    translation:
      vi: Trong vườn, hoa hồng nở rộ như muốn tràn ra ngoài.
  - type: example
    target: 店員は「早く帰ってくれ」とばかりに、店の明かりを消し始めた。
    target_lang: ja
    translation:
      vi: Nhân viên bắt đầu tắt đèn quán như muốn nói "về nhanh giùm".
    note:
      vi: Cử chỉ của người khác + とばかりに.
  - type: example
    target: 合格したと思いきや、受験番号を見間違えていた。
    target_lang: ja
    translation:
      vi: Cứ tưởng mình đã đỗ, ai ngờ là nhìn nhầm số báo danh.
    note:
      vi: Kỳ vọng bị đảo ngược.
  - type: example
    target: 歌手が登場すると、観客は大きな拍手で迎えた。
    target_lang: ja
    translation:
      vi: Khi ca sĩ xuất hiện, khán giả chào đón bằng tràng vỗ tay lớn.
    note:
      vi: 拍手 - vỗ tay.
  - type: common_mistake
    wrong: 私は「もう帰りたい」とばかりに時計を見た。
    right: 彼は「もう帰りたい」とばかりに時計を見た。
    target_lang: ja
    note:
      vi: とばかりに tả cử chỉ của người khác; với chính mình bạn biết rõ ý nên không nói "như muốn nói".
  - type: common_mistake
    wrong: 子どもは泣くんばかりの顔をしていた。
    right: 子どもは泣かんばかりの顔をしていた。
    target_lang: ja
    note:
      vi: ん gắn vào gốc phủ định - 泣かない → 泣か + ん.
  - type: common_mistake
    wrong: 明日は晴れると思いきや、傘を持っていこう。
    right: 晴れると思いきや、午後から雨が降り出した。
    target_lang: ja
    note:
      vi: と思いきや kể sự thật đã xảy ra trái dự đoán; vế sau không thể là ý định hay mệnh lệnh.
  - type: summary
    points:
      - vi: V-(ない) + んばかりに / んばかりの N - như sắp... đến nơi (する → せんばかり).
      - vi: 「…」とばかりに - như muốn nói... (cử chỉ của người khác).
      - vi: Thể thường + と思いきや - cứ tưởng..., ai ngờ...
      - vi: 拍手 - vỗ tay; 拍手を送る - dành tràng pháo tay.
