      options:
        - { id: e9q, text: "Cứ tưởng thắng dễ dàng, ai ngờ đội đối phương mạnh hơn dự đoán.", lang: vi }
        - { id: f4r, text: "Đúng như dự đoán, đội ta đã thắng dễ dàng.", lang: vi }
        - { id: g8s, text: Vì đối phương mạnh nên chúng tôi nghĩ sẽ thua., lang: vi }
        - { id: h3t, text: "Dù đối phương mạnh, chúng tôi vẫn thắng dễ dàng.", lang: vi }
