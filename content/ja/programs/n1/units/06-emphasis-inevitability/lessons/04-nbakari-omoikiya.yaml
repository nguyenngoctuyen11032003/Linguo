  - key: ja:exercise:n1-u6-nbakari-omoikiya-wb-applause
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-hakushu
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Trận đấu kết thúc, khán giả đứng dậy vỗ tay cho cả hai đội.\""
      tokens:
