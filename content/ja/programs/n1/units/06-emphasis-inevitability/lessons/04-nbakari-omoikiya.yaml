  - key: ja:exercise:n1-u6-nbakari-omoikiya-translate-sigh
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u6-gram-tobakari
    prompt:
      source_text: 部長は「まだ分からないのか」とばかりに、深いため息をついた。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Trưởng phòng thở dài thườn thượt như muốn nói "vẫn chưa hiểu à".
        - Trưởng phòng thở dài như muốn nói "vẫn chưa hiểu sao".
        - Trưởng phòng thở dài sườn sượt như muốn nói "vẫn chưa hiểu à".
        - Trưởng phòng thở một hơi dài như muốn nói "vẫn chưa hiểu à".
        - Trưởng phòng thở dài như thể muốn nói "vẫn chưa hiểu à".
        - Trưởng phòng thở dài thườn thượt như muốn nói "vẫn chưa hiểu sao".
        - Như muốn nói "vẫn chưa hiểu à", trưởng phòng thở dài thườn thượt.
        - Trưởng phòng thở dài như muốn nói "vẫn không hiểu à".
        - Trưởng phòng thở dài như muốn nói "cậu vẫn chưa hiểu à".
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Trưởng phòng nói "vẫn chưa hiểu à" rồi thở dài.
        feedback_vi: とばかりに nghĩa là "như muốn nói" - ông ấy không nói ra thành lời.
        error_tag: tobakari_meaning
    explanation:
      vi: 「まだ分からないのか」とばかりに - như muốn nói "vẫn chưa hiểu à"; 深いため息をつく - thở dài thườn thượt.
    display_answer: Trưởng phòng thở dài thườn thượt như muốn nói "vẫn chưa hiểu à".

  - key: ja:exercise:n1-u6-nbakari-omoikiya-mcq-mother
