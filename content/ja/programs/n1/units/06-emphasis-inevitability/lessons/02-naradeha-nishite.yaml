    known_wrong:
      - answer: ならでは
        feedback_vi: ならでは là "chỉ có ở"; "mới hai mươi tuổi mà đã" là 二十歳にして.
        error_tag: nishite_naradeha
      - answer: にしたら
        feedback_vi: にしたら là "đứng ở góc độ của..." - không mang nghĩa "mới ... mà đã".
        error_tag: nishite_form
    explanation:
      vi: わずか二十歳にして - mới hai mươi tuổi mà đã (nhấn sự sớm, đáng nể).
    display_answer: わずか二十歳にして、彼は自分の会社を立ち上げた。

