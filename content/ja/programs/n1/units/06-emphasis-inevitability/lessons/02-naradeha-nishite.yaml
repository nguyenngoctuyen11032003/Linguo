key: ja:lesson:n1-u6-naradeha-nishite
order_index: 2
level: n1
title:
  vi: Chỉ có ở..., phải đến mức... mới - ～ならでは, ～にして
objectives:
  - vi: Khen nét đặc trưng riêng bằng N ならではの N / N ならではだ.
  - vi: Hiểu ～にして với nghĩa "phải là N mới..." và "ở tuổi N mà đã...".
  - vi: Dùng 老舗, 職人 khi viết về nghề truyền thống.
estimated_minutes: 24
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-u6-sura-dani]
items:
  - item: ja:item:n1-u6-gram-naradeha
  - item: ja:item:n1-u6-gram-nishite
  - item: ja:item:n1-u6-shinise
  - item: ja:item:n1-u6-shokunin
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu bài giới thiệu du lịch, phóng sự về nghệ nhân - "hương vị chỉ quán lâu đời mới có", "phải là bậc thầy mới làm được", "mới mười hai tuổi mà đã..." - và tự viết được.
  - type: explain
    text:
      vi: 'N + ならではの + N / N + ならではだ: "chỉ N mới có, đặc trưng riêng của N" - 雪国ならではの祭り. Luôn là lời khen, giống tiếng Việt "đúng là chỉ ... mới có".'
  - type: explain
    text:
      vi: '～にして có hai nghĩa chính. (1) N + にして初めて: "phải là N (đạt đến mức N) thì mới..." - 名人にして初めてできる. (2) Tuổi / giai đoạn + にして: "ở mức đó mà đã..." - わずか十二歳にしてプロになった.'
  - type: explain
    text:
      vi: 'Phân biệt: ならでは nhấn "độc nhất", にして初めて nhấn "điều kiện cần đạt tới". Sau ならでは phải có の khi nối với danh từ - ならではの味, không nói ×ならでは味.'
  - type: deep_explain
    text:
      vi: 'にして còn có nghĩa thứ ba trong văn chương - "đến N mà còn..." (名人にしてこの失敗), và nghĩa nối "vừa là... vừa là..." (彼は医者にして作家だ). Khi đọc, nhìn vế sau: có 初めて → điều kiện; có con số tuổi → "mới ... mà đã"; có lỗi, thất bại → "đến ... mà còn". 老舗 đọc しにせ là cách đọc đặc biệt phải thuộc lòng.'
  - type: example
    target: この店ならではの味を求めて、遠くから客が訪れる。
    target_lang: ja
    translation:
      vi: Khách từ xa tìm đến vì hương vị chỉ quán này mới có.
    note:
      vi: ならではの + danh từ.
  - type: example
    target: 雪国ならではの祭りを見に、北海道へ行った。
    target_lang: ja
    translation:
      vi: Tôi đã đến Hokkaido xem lễ hội chỉ vùng xứ tuyết mới có.
  - type: example
    target: 長年の経験を持つ彼にして初めて可能な判断だった。
    target_lang: ja
    translation:
      vi: Phải là người có nhiều năm kinh nghiệm như anh ấy mới đưa ra được quyết định đó.
    note:
      vi: にして初めて - điều kiện cần đạt tới.
  - type: example
    target: わずか十二歳にしてプロ棋士になった少年がいる。
    target_lang: ja
    translation:
      vi: Có cậu bé mới mười hai tuổi mà đã trở thành kỳ thủ chuyên nghiệp.
    note:
      vi: Tuổi + にして - "mới ... mà đã".
  - type: example
    target: 老舗の旅館で、職人の技が光る器に料理が盛られていた。
    target_lang: ja
    translation:
      vi: Ở lữ quán lâu đời, món ăn được bày trong những chiếc bát thể hiện rõ tay nghề nghệ nhân.
    note:
      vi: 老舗 しにせ · 職人 しょくにん.
  - type: common_mistake
    wrong: 京都ならでは景色を楽しんだ。
    right: 京都ならではの景色を楽しんだ。
    target_lang: ja
    note:
      vi: ならでは nối với danh từ phải có の.
  - type: common_mistake
    wrong: わずか十二歳にしたら、プロになった。
    right: わずか十二歳にして、プロになった。
    target_lang: ja
    note:
      vi: '"Mới ... tuổi mà đã" dùng にして; にしたら là "nếu xét từ phía..." - nghĩa khác hẳn.'
  - type: summary
    points:
      - vi: N ならではの N / N ならではだ - chỉ N mới có (khen).
      - vi: N にして初めて - phải là N mới...
      - vi: Tuổi + にして - mới ... mà đã...
      - vi: 老舗 (しにせ) - cửa hàng lâu đời · 職人 - nghệ nhân.
