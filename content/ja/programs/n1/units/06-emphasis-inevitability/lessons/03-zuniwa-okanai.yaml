      vi: Chủ ngữ là tác phẩm, tác động tất yếu lên người đọc → 与えずにはおかない. 余儀なくされる đi sau danh từ, không sau động từ; hai phương án còn lại sai dạng chia.
    display_answer: ずにはおかない

  - key: ja:exercise:n1-u6-zuniwa-okanai-fill-shazai
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-zuni-sumanai
    prompt:
      template: "取引先に大きな損害を与えたのだから、社長が自ら謝罪{{b1}}すまない。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Đã gây thiệt hại lớn cho đối tác thì giám đốc không tự mình xin lỗi là không xong."
        - "Gợi ý: 謝罪する → dạng phủ định cổ của する + には."
    answer:
      blanks:
        b1: [せずには, しないでは]
    known_wrong:
      - answer: しずには
        feedback_vi: する chia thành せず - 謝罪せずにはすまない.
        error_tag: zu_form
      - answer: すずには
        feedback_vi: Dạng phủ định cổ của する là せず, không phải すず.
        error_tag: zu_form
    explanation:
      vi: 謝罪せずにはすまない - không xin lỗi thì không xong (trách nhiệm xã hội). Dạng 謝罪しないではすまない cũng đúng.
    display_answer: 取引先に大きな損害を与えたのだから、社長が自ら謝罪せずにはすまない。

  - key: ja:exercise:n1-u6-zuniwa-okanai-wb-tettai
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-tettai
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Do doanh thu giảm, công ty đó buộc phải rút khỏi thị trường Mỹ.\""
      tokens:
        - { id: t4, text: 余儀なくされた }
        - { id: t2, text: その会社は }
        - { id: t5, text: 余儀なくせずには }
        - { id: t3, text: アメリカ市場からの撤退を }
        - { id: t1, text: 売り上げの減少により、 }
    answer:
      orders:
        - [t1, t2, t3, t4]
        - [t2, t1, t3, t4]
    explanation:
      vi: 撤退を余儀なくされた - buộc phải rút lui. 余儀なくせずには không phải dạng tồn tại.
    display_answer: 売り上げの減少により、その会社はアメリカ市場からの撤退を余儀なくされた。

  # ---------------- recall ----------------
  - key: ja:exercise:n1-u6-zuniwa-okanai-fill-kantoku
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-zuni-okanai
    prompt:
      template: "あの監督の作品は、いつも観客に社会の矛盾を考えさ{{b1}}。(chắc chắn khiến khán giả phải suy nghĩ)"
      blanks:
        - { id: b1, width_hint: 8 }
    answer:
      blanks:
        b1: [せずにはおかない]
    known_wrong:
      - answer: せずにはいられない
        feedback_vi: ずにはいられない là cảm xúc tự mình không kìm được; tác phẩm tác động lên khán giả là ずにはおかない.
        error_tag: okanai_irarenai
      - answer: せざるを得ない
        feedback_vi: ざるを得ない là "đành phải" theo phán đoán của chủ ngữ; tác phẩm không "đành phải".
        error_tag: okanai_zaru
    explanation:
      vi: 考えさせる (khiến suy nghĩ) → 考えさせずにはおかない - chắc chắn khiến (khán giả) phải suy nghĩ.
    display_answer: あの監督の作品は、いつも観客に社会の矛盾を考えさせずにはおかない。

  - key: ja:exercise:n1-u6-zuniwa-okanai-translate-injury
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-yogi-naku
    prompt:
      source_text: Vì chấn thương, tuyển thủ đó buộc phải giải nghệ. (dùng 引退 và を余儀なくされる)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - けがのため、その選手は引退を余儀なくされた。
        - 怪我のため、その選手は引退を余儀なくされた。
        - けがで、その選手は引退を余儀なくされた。
        - 怪我で、その選手は引退を余儀なくされた。
        - けがのため、その選手は引退を余儀なくされました。
        - 怪我のため、その選手は引退を余儀なくされました。
        - 負傷のため、その選手は引退を余儀なくされた。
        - けがのせいで、その選手は引退を余儀なくされた。
        - その選手はけがのため引退を余儀なくされた。
        - その選手は怪我のため引退を余儀なくされた。
        - その選手はけがで引退を余儀なくされた。
        - その選手は怪我で引退を余儀なくされた。
    known_wrong:
      - answer: けがのため、その選手は引退を余儀なくさせた。
        feedback_vi: Tuyển thủ là người bị ép nên dùng bị động 余儀なくされた; させた cần nguyên nhân làm chủ ngữ.
        error_tag: yogi_voice
      - answer: けがのため、その選手は引退せずにはおかなかった。
        feedback_vi: ずにはおかない là "nhất định sẽ / chắc chắn khiến"; bị hoàn cảnh ép buộc là を余儀なくされる.
        error_tag: okanai_yogi
    explanation:
      vi: けがのため - vì chấn thương; 引退を余儀なくされた - buộc phải giải nghệ.
    display_answer: けがのため、その選手は引退を余儀なくされた。

  - key: ja:exercise:n1-u6-zuniwa-okanai-translate-apology
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-zuni-sumanai
    prompt:
      source_text: Đã làm hỏng đồ của người khác thì không xin lỗi là không xong. (dùng ずにはすまない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 人の物を壊したのだから、謝らずにはすまない。
        - 人のものを壊したのだから、謝らずにはすまない。
        - 他人の物を壊したのだから、謝らずにはすまない。
        - 人の物を壊したのだから、謝らずには済まない。
        - 人の物を壊した以上、謝らずにはすまない。
        - 人の物を壊した以上、謝らずには済まない。
        - 人の物を壊したら、謝らずにはすまない。
        - 人の物を壊したのだから、謝らずにはすまないだろう。
        - 人の物を壊したのだから、謝罪せずにはすまない。
        - 他人のものを壊したのだから、謝らずにはすまない。
        - 人の物を壊したんだから、謝らずにはすまない。
    known_wrong:
      - answer: 人の物を壊したのだから、謝らずにはいられない。
        feedback_vi: ずにはいられない là cảm xúc không kìm được; "lẽ thường buộc phải làm" là ずにはすまない.
        error_tag: sumanai_irarenai
      - answer: 人の物を壊したのだから、謝らないずにはすまない。
        feedback_vi: Bỏ ない rồi mới thêm ず - 謝らずに.
        error_tag: zu_form
    explanation:
      vi: 人の物を壊したのだから - vì đã làm hỏng đồ người khác; 謝らずにはすまない - không xin lỗi thì không xong.
    display_answer: 人の物を壊したのだから、謝らずにはすまない。

  # ---------------- application ----------------
  - key: ja:exercise:n1-u6-zuniwa-okanai-translate-shougen
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n1-u6-gram-zuni-okanai
    prompt:
      source_text: 被害者の証言は、聞く者の胸を打たずにはおかない。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Lời kể của nạn nhân chắc chắn sẽ làm lay động lòng người nghe.
        - Lời khai của nạn nhân chắc chắn sẽ làm xúc động người nghe.
        - Lời kể của nạn nhân không thể không làm người nghe xúc động.
        - Lời khai của nạn nhân chắc chắn khiến người nghe xúc động.
        - Lời chứng của nạn nhân chắc chắn sẽ lay động người nghe.
        - Lời kể của nạn nhân nhất định sẽ khiến người nghe xúc động.
        - Lời khai của nạn nhân không thể không lay động lòng người nghe.
        - Lời kể của các nạn nhân chắc chắn sẽ làm người nghe xúc động.
        - Lời khai của nạn nhân chắc chắn làm rung động lòng người nghe.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Người nghe không thể kìm được việc làm chứng cho nạn nhân.
        feedback_vi: Chủ ngữ là 証言 (lời khai) - nó chắc chắn tác động lên người nghe; 胸を打つ là làm xúc động.
        error_tag: okanai_subject
    explanation:
      vi: 被害者の証言 - lời khai của nạn nhân; 聞く者の胸を打つ - làm xúc động người nghe; ずにはおかない - chắc chắn sẽ.
    display_answer: Lời kể của nạn nhân chắc chắn sẽ làm lay động lòng người nghe.

  - key: ja:exercise:n1-u6-zuniwa-okanai-mcq-song
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-zu-ni-irarenai
    prompt:
      stem: Bạn kể với bạn bè "Mỗi lần nghe bài hát này, tôi không kìm được nước mắt." Câu nào đúng nhất?
      stem_lang: vi
      options:
        - { id: m6i, text: この歌を聞くたびに、泣かずにはいられない。, lang: ja }
        - { id: n1j, text: この歌を聞くたびに、泣かずにはおかない。, lang: ja }
        - { id: o5k, text: この歌を聞くたびに、泣くを余儀なくされる。, lang: ja }
        - { id: p9l, text: この歌を聞くたびに、泣かざるにはいられない。, lang: ja }
    answer:
      correct_option_id: m6i
    explanation:
