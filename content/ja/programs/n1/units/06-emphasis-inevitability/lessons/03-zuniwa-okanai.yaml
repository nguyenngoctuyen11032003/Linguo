  - key: ja:exercise:n1-u6-zuniwa-okanai-mcq-novel
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n1-u6-gram-zuni-okanai
    prompt:
      stem: 'Chọn cách nói đúng: この小説は、読む人に深い感動を与え＿＿。'
      stem_lang: vi
      options:
        - { id: i8e, text: ずにはおかない, lang: ja }
        - { id: j3f, text: るを余儀なくされる, lang: ja }
        - { id: k7g, text: ずにはすまないの, lang: ja }
        - { id: l2h, text: ないずにはいられない, lang: ja }
    answer:
      correct_option_id: i8e
