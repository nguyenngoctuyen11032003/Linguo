key: ja:lesson:n1-u6-zuniwa-okanai
order_index: 3
level: n1
title:
  vi: Tất yếu và bị buộc phải - ～ずにはおかない, ～ずにはすまない, ～を余儀なくされる
objectives:
  - vi: Nói một sự việc "chắc chắn sẽ khiến..." hoặc quyết tâm "nhất định sẽ..." bằng ～ずにはおかない.
  - vi: Nói "theo lẽ thường không làm thì không xong" bằng ～ずにはすまない.
  - vi: Đọc tin tức "bị hoàn cảnh buộc phải..." với N を余儀なくされる, phân biệt với ずにはいられない và ざるを得ない (N2).
estimated_minutes: 25
skills: [grammar, vocabulary, reading]
prerequisites: [ja:lesson:n1-u6-naradeha-nishite]
items:
  - item: ja:item:n1-u6-gram-zuni-okanai
  - item: ja:item:n1-u6-gram-zuni-sumanai
