  - item: ja:item:n1-u6-tettai
  - item: ja:item:n2-u5-gram-zu-ni-irarenai
    role: reuse
  - item: ja:item:n2-u5-gram-zaru-wo-enai
    role: reuse
body:
  - type: objective
    text:
      vi: Sau bài này, bạn hiểu và dùng đúng bốn cách nói "không thể không" ở mức N2-N1, và đọc được tin tức kiểu "nhà máy buộc phải đóng cửa", "công ty buộc phải rút khỏi thị trường".
  - type: explain
    text:
      vi: 'V-ない (bỏ ない) + ずにはおかない: (1) chủ ngữ là tác phẩm, sự việc - "chắc chắn sẽ khiến (ai) phải...": 見る者を泣かせずにはおかない; (2) chủ ngữ là người nói - "nhất định sẽ...": 真相を明らかにせずにはおかない. する → せずにはおかない.'
  - type: explain
    text:
      vi: 'V-ない (bỏ ない) + ずにはすまない: "không làm... thì không xong" - lẽ thường, trách nhiệm xã hội buộc phải làm: 謝らずにはすまない. N + を余儀なくされる: "bị hoàn cảnh buộc phải N" - N là danh từ hành động (中止, 延期, 撤退, 引退), giọng khách quan của tin tức.'
  - type: explain
    text:
      vi: 'So với N2: ずにはいられない là cảm xúc của chính mình không kìm được (笑わずにはいられない); ざるを得ない là "đành phải" theo phán đoán chủ quan. ずにはおかない nói tác động tất yếu lên người khác, còn 余儀なくされる là bị ép bởi hoàn cảnh bên ngoài.'
  - type: deep_explain
    text:
      vi: 'Mẹo nhận diện: chủ ngữ là bộ phim, chính sách, sự kiện → ずにはおかない; chủ ngữ là "tôi" và cảm xúc → ずにはいられない; có từ chỉ nguyên nhân khách quan (台風, 不況, けが) + danh từ hành động → を余儀なくされる. Dạng chủ động を余儀なくさせる đặt nguyên nhân làm chủ ngữ - 不況が閉鎖を余儀なくさせた. Tiếng Việt chỉ có "buộc phải / không thể không", nên người Việt hay dùng lẫn lộn bốn mẫu này.'
  - type: example
    target: この映画は、見る者を泣かせずにはおかない。
    target_lang: ja
    translation:
      vi: Bộ phim này chắc chắn sẽ khiến người xem phải rơi nước mắt.
    note:
      vi: Chủ ngữ là tác phẩm + sai khiến 泣かせる + ずにはおかない.
  - type: example
    target: 警察は、必ず真相を明らかにせずにはおかないと述べた。
    target_lang: ja
    translation:
      vi: Cảnh sát tuyên bố nhất định sẽ làm sáng tỏ sự thật.
    note:
      vi: Quyết tâm của người nói; する → せずにはおかない.
  - type: example
    target: これほどの迷惑をかけたのだから、直接謝罪せずにはすまないだろう。
    target_lang: ja
    translation:
      vi: Đã gây phiền hà đến mức này thì không trực tiếp xin lỗi là không xong.
    note:
      vi: Lẽ thường xã hội buộc phải làm.
  - type: example
    target: 感染症の流行で、多くの店が休業を余儀なくされた。
    target_lang: ja
    translation:
      vi: Do dịch bệnh lan rộng, nhiều cửa hàng buộc phải tạm nghỉ kinh doanh.
    note:
      vi: Nguyên nhân khách quan + danh từ hành động + を余儀なくされた.
  - type: example
    target: 円安の影響で、その企業は海外市場からの撤退を余儀なくされた。
    target_lang: ja
    translation:
      vi: Do đồng yên mất giá, doanh nghiệp đó buộc phải rút khỏi thị trường nước ngoài.
    note:
      vi: 撤退 - rút lui.
  - type: common_mistake
    wrong: 彼の歌を聞くと、私は泣かずにはおかない。
    right: 彼の歌を聞くと、私は泣かずにはいられない。
    target_lang: ja
    note:
      vi: Cảm xúc của chính mình không kìm được là ずにはいられない; ずにはおかない nói tác động lên người khác hoặc quyết tâm.
  - type: common_mistake
    wrong: ミスを上司に報告しずにはすまない。
    right: ミスを上司に報告せずにはすまない。
    target_lang: ja
    note:
      vi: する chia thành せず - せずにはすまない, không phải しず.
  - type: common_mistake
    wrong: 大雨で、試合は中止を余儀なくした。
    right: 大雨で、試合は中止を余儀なくされた。
    target_lang: ja
    note:
      vi: Chủ ngữ là thứ bị ép (試合) thì dùng bị động 余儀なくされた; 余儀なくする không phải dạng chuẩn.
  - type: summary
    points:
      - vi: 作品 / 事件 + ずにはおかない - chắc chắn sẽ khiến...; người nói + ずにはおかない - nhất định sẽ...
      - vi: ずにはすまない - không làm thì không xong (lẽ thường).
      - vi: N を余儀なくされる - bị hoàn cảnh buộc phải N (tin tức).
      - vi: ずにはいられない - tự mình không kìm được · ざるを得ない - đành phải.
      - vi: 撤退 - rút lui.
