title:
  vi: "Ôn tập: đọc phóng sự thể thao - kỳ tích, lội ngược dòng và sự khiêm tốn"
objectives:
  - vi: Đọc hiểu một bài phóng sự thể thao dùng các mẫu nhấn mạnh, tất yếu và trái dự đoán của unit.
  - vi: Chọn đúng mẫu giữa すら / たりとも, ならでは / にして, ずにはおかない / を余儀なくされる, んばかり / とばかりに / と思いきや.
  - vi: Dùng 快挙, 逆転, 謙虚 khi viết về thành tích.
estimated_minutes: 25
skills: [reading, writing, grammar, vocabulary]
prerequisites: [ja:lesson:n1-u6-nbakari-omoikiya]
