      tokens:
        - { id: c3, text: 環境がいいと }
        - { id: c1, text: 子どもを育てるには、 }
        - { id: c5, text: 都会ほど }
        - { id: c4, text: 思います }
        - { id: c2, text: 田舎のほうが }
    answer:
      orders:
