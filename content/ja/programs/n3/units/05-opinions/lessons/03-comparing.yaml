    difficulty: 3
    item: ja:item:n3-gram-ippou-de
    prompt:
      stem: 'Chọn dạng đúng: 都会は便利＿＿、ストレスも多いです。'
      stem_lang: vi
      options:
        - { id: f4r, text: な一方で, lang: ja }
        - { id: l8j, text: の一方で, lang: ja }
        - { id: s2d, text: だ一方で, lang: ja }
