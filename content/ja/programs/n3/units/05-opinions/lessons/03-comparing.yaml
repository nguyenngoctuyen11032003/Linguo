  - key: ja:exercise:n3-comparing-fill-kurabete
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-ni-kurabete
    prompt:
      template: "東京は大阪{{b1}}物価が高いです。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Tokyo có vật giá cao hơn so với Osaka."
        - "Gợi ý: に + 比べる (so sánh) dạng て."
    answer:
      blanks:
        b1: [に比べて, と比べて, にくらべて, とくらべて, に比べると, と比べると]
    known_wrong:
      - answer: に対して
        feedback_vi: に対して là thái độ "đối với"; so sánh dùng に比べて.
        error_tag: kurabete_taishite
      - answer: ほど
        feedback_vi: ほど cần phủ định (ほど高くない). Câu khẳng định "cao hơn so với" dùng に比べて hoặc より.
        error_tag: hodo_negative
    explanation:
      vi: N + に比べて / と比べて - so với N. に比べると cũng đúng.
    display_answer: 東京は大阪に比べて物価が高いです。

