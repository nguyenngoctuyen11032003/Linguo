key: ja:lesson:n3-comparing
order_index: 3
level: n3
title:
  vi: So sánh thành phố và nông thôn - ～に比べて, ～ほど～ない, ～一方で
objectives:
  - vi: Nắm từ vựng 都会, 田舎, 物価, 環境.
  - vi: So sánh bằng ～に比べて và ～ほど～ない.
  - vi: Nêu hai mặt đối lập bằng ～一方で.
estimated_minutes: 20
skills: [vocabulary, grammar, writing]
prerequisites: [ja:lesson:n3-guessing]
