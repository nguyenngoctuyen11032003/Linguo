    explanation:
      vi: 田舎のほうが環境がいい - môi trường ở nông thôn tốt hơn. 都会ほど cần phủ định nên không dùng được ở đây.
    display_answer: 子どもを育てるには、田舎のほうが環境がいいと思います。

