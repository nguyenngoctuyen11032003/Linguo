body:
  - type: objective
    text:
      vi: Sau bài này, bạn tham gia được một cuộc thảo luận nhỏ - nói mình tán thành hay phản đối, vì sao, và công nhận ý người khác trước khi phản bác.
  - type: explain
    text:
      vi: 'Khung nêu ý kiến: 私は～に賛成です / 反対です。なぜなら～からです. Hỏi ý kiến: ～について、どう思いますか / 皆さんの意見を聞かせてください.'
  - type: explain
    text:
      vi: '～べきだ - "nên, phải" theo lẽ phải: ゴミは分別するべきだ. Phủ định: ～べきではない - 人の悪口を言うべきではない. する → するべき / すべき.'
  - type: explain
    text:
      vi: '確かに A が、B - công nhận A rồi nêu B: 確かに便利ですが、値段が高すぎると思います. N + に対して - thái độ nhắm vào ai/cái gì: 客に対して丁寧に話す; 意見に対する反論.'
  - type: deep_explain
    text:
      vi: Người Nhật ít nói thẳng "tôi phản đối". Họ hay dùng 確かに～が, ～と思います, ～のではないでしょうか để làm mềm ý kiến. べきだ khá mạnh - dùng khi bàn vấn đề xã hội, nguyên tắc; tránh dùng để khuyên trực tiếp người trên.
  - type: example
    target: 私はその計画に賛成です。
    target_lang: ja
    translation:
      vi: Tôi tán thành kế hoạch đó.
  - type: example
    target: 若い人はもっと選挙に行くべきだと思います。
    target_lang: ja
    translation:
      vi: Tôi nghĩ người trẻ nên đi bầu cử nhiều hơn.
  - type: example
    target: 確かに便利ですが、値段が高すぎると思います。
    target_lang: ja
    translation:
      vi: Đúng là tiện thật, nhưng tôi nghĩ giá đắt quá.
  - type: example
    target: 住民の意見に対して、市はまだ何も答えていません。
    target_lang: ja
    translation:
      vi: Đối với ý kiến của cư dân, thành phố vẫn chưa trả lời gì.
  - type: common_mistake
    wrong: 私はその計画を賛成です。
    right: 私はその計画に賛成です。
    target_lang: ja
    note:
      vi: Tán thành / phản đối cái gì dùng に - 計画に賛成, 留学に反対.
  - type: common_mistake
    wrong: 約束を守るべきではありません。
    right: 約束は守るべきです。
    target_lang: ja
    note:
      vi: Muốn nói "phải giữ lời hứa" dùng khẳng định べきです. べきではない là "không nên" - ngược nghĩa.
  - type: summary
    points:
      - vi: 意見, 賛成, 反対 - ～に賛成 / ～に反対.
      - vi: ～べきだ / べきではない - nên / không nên (lẽ phải).
      - vi: 確かに A が、B - phản bác mềm.
      - vi: ～に対して - đối với (thái độ); ～について - về (chủ đề).
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n3-giving-opinions-mcq-hantai
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n3-hantai
    prompt:
      stem: 「反対」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a5x, text: phản đối, lang: vi }
        - { id: k1m, text: tán thành, lang: vi }
        - { id: v7r, text: ý kiến, lang: vi }
        - { id: j3e, text: lý do, lang: vi }
    answer:
      correct_option_id: a5x
    explanation:
      vi: 反対 - phản đối (Hán Việt "phản đối"). Tán thành là 賛成, ý kiến là 意見, lý do là 理由.
    display_answer: phản đối

  - key: ja:exercise:n3-giving-opinions-listen-beki
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-gram-beki
    prompt:
      audio_asset_id: null
      fallback_text: 若い人はもっと選挙に行くべきだと思います。
      options:
        - { id: c8w, text: Tôi nghĩ người trẻ nên đi bầu cử nhiều hơn., lang: vi }
        - { id: m4q, text: Tôi nghĩ người trẻ không nên đi bầu cử., lang: vi }
        - { id: z2g, text: Nghe nói người trẻ đi bầu cử nhiều hơn., lang: vi }
        - { id: e6s, text: Tôi nghĩ người già nên đi bầu cử nhiều hơn., lang: vi }
    answer:
