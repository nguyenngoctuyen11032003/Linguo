  - key: ja:exercise:n3-giving-opinions-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-sansei
    prompt:
      stem: 'Trong cuộc họp, trưởng phòng hỏi: 「在宅勤務を増やすことについて、どう思いますか。」 Bạn đồng ý. Câu nào tự nhiên nhất?'
      stem_lang: vi
      options:
        - { id: f8t, text: 私は賛成です。通勤の時間が減るからです。, lang: ja }
        - { id: l2w, text: 私は賛成をします。通勤の時間が減るからです。, lang: ja }
        - { id: h6e, text: 私は反対です。通勤の時間が減るからです。, lang: ja }
        - { id: r4y, text: 私に賛成です。通勤の時間が減るからです。, lang: ja }
    answer:
      correct_option_id: f8t
    explanation:
      vi: 私は賛成です - tôi tán thành; ～からです - vì... 賛成をします không tự nhiên; 私に賛成 là "tán thành tôi"; 反対 ngược ý bạn.
    display_answer: 私は賛成です。通勤の時間が減るからです。
