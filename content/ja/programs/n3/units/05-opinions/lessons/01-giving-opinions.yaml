    explanation:
      vi: 確かに～が + ～のではないでしょうか - công nhận rồi nêu băn khoăn một cách mềm mỏng. Hai câu giữa quá gay gắt; 必ずしも phải đi với phủ định.
    display_answer: 確かに速いですが、値段が少し高いのではないでしょうか。

