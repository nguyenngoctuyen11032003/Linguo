    explanation:
      vi: 父 - bố tôi (khi nói với người ngoài); 留学に反対する - phản đối việc du học; ～ています - đang ở trạng thái phản đối.
    display_answer: 父は私の留学に反対しています。

  - key: ja:exercise:n3-giving-opinions-translate-beki
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-beki
    prompt:
      source_text: Tôi nghĩ nên giữ lời hứa. (dùng べき)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 約束は守るべきだと思います。
        - 約束を守るべきだと思います。
        - 約束は守るべきだと思う。
        - 約束を守るべきだと思う。
        - 約束は必ず守るべきだと思います。
        - 約束は守るべきです。
        - 約束を守るべきです。
        - 私は約束を守るべきだと思います。
        - 私は約束は守るべきだと思います。
