  - key: ja:exercise:n3-giving-opinions-mcq-taishite
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-ni-taishite
    prompt:
      stem: 'Chọn từ đúng: 店員はお客様＿＿、いつも丁寧に話さなければなりません。'
      stem_lang: vi
      options:
        - { id: g2n, text: に対して, lang: ja }
        - { id: u8d, text: について, lang: ja }
        - { id: o5b, text: によって, lang: ja }
        - { id: w9k, text: に比べて, lang: ja }
    answer:
      correct_option_id: g2n
    explanation:
      vi: Thái độ (lịch sự) nhắm vào khách - に対して. について là "về chủ đề"; によって là "bởi/tuỳ"; に比べて là "so với".
    display_answer: に対して

  - key: ja:exercise:n3-giving-opinions-fill-sansei
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-sansei
    prompt:
      template: "私はその計画{{b1}}{{b2}}です。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Tôi tán thành kế hoạch đó."
        - "Gợi ý: trợ từ chỉ đối tượng + từ Hán 'tán thành'."
    answer:
      blanks:
        b1: [に]
        b2: [賛成, さんせい]
    known_wrong:
      - answer: を
        feedback_vi: 賛成 đi với に, không đi với を.
        error_tag: particle_ni
      - answer: 反対
        feedback_vi: 反対 là phản đối; tán thành là 賛成.
        error_tag: vocab_meaning
    explanation:
      vi: ～に賛成です - tán thành ～.
    display_answer: 私はその計画に賛成です。

  - key: ja:exercise:n3-giving-opinions-wb-tashikani
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-tashikani
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Đúng là tiện thật, nhưng tôi nghĩ giá đắt quá.\""
      tokens:
        - { id: t3, text: 値段が高すぎると }
        - { id: t1, text: 確かに }
        - { id: t5, text: 必ず }
        - { id: t4, text: 思います }
        - { id: t2, text: 便利ですが、 }
    answer:
      orders:
        - [t1, t2, t3, t4]
    explanation:
      vi: 確かに A が、B - công nhận A rồi nêu ý kiến B. 必ず là "nhất định", không dùng để công nhận ý kiến.
    display_answer: 確かに便利ですが、値段が高すぎると思います。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-giving-opinions-fill-beki
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-beki
    prompt:
      template: "人の悪口を言う{{b1}}ではありません。(không nên)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [べき]
    known_wrong:
      - answer: はず
        feedback_vi: はずではない không mang nghĩa "không nên". Lẽ phải - べきではない.
        error_tag: beki_hazu
      - answer: ほう
        feedback_vi: ほうがいい mới mang nghĩa "nên"; ほうではない không đúng.
        error_tag: beki_hou
    explanation:
      vi: V thể từ điển + べきではない - không nên. 悪口を言う - nói xấu.
    display_answer: 人の悪口を言うべきではありません。

  - key: ja:exercise:n3-giving-opinions-translate-hantai
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-hantai
    prompt:
      source_text: Bố tôi phản đối việc tôi đi du học. (lịch sự)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 父は私の留学に反対しています。
        - 父は私の留学に反対です。
        - 父は私が留学することに反対しています。
        - 父は私が留学することに反対です。
        - 父は僕の留学に反対しています。
        - 父は私の留学に反対している。
        - 父が私の留学に反対しています。
        - 私の父は私の留学に反対しています。
        - 父は私が留学するのに反対しています。
        - 父は留学に反対しています。
        - ちちはわたしのりゅうがくにはんたいしています。
    known_wrong:
      - answer: 父は私の留学を反対しています。
        feedback_vi: 反対する đi với に - 留学に反対する.
        error_tag: particle_ni
      - answer: 父は私の留学に賛成しています。
        feedback_vi: 賛成 là tán thành - ngược nghĩa.
        error_tag: vocab_meaning
      - answer: お父さんは私の留学に反対しています。
        feedback_vi: Nói về bố mình với người khác dùng 父, không dùng お父さん.
