        error_tag: beki_hazu
    explanation:
      vi: 約束を守る - giữ lời hứa; 守るべきだと思います - tôi nghĩ nên giữ. Dùng は để nêu chủ đề cũng tự nhiên.
    display_answer: 約束は守るべきだと思います。

  # ---------------- application ----------------
  - key: ja:exercise:n3-giving-opinions-mcq-soft
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-tashikani
    prompt:
      stem: 'Đồng nghiệp đề xuất: "Mua máy in mới vì nhanh hơn." Bạn muốn công nhận nó nhanh nhưng lo về giá. Câu nào khéo léo nhất?'
      stem_lang: vi
      options:
        - { id: d3v, text: 確かに速いですが、値段が少し高いのではないでしょうか。, lang: ja }
        - { id: n7a, text: 速くても、絶対に買うべきではありません。, lang: ja }
        - { id: q1h, text: 値段が高いので、反対に決まっています。, lang: ja }
