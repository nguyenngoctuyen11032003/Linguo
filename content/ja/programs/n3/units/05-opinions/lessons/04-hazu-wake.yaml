    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-wake-dewa-nai
    prompt:
      source_text: Đồ đắt không hẳn là đồ tốt. (dùng 必ずしも và わけではない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 高い物が必ずしもいい物だというわけではありません。
        - 高い物が必ずしもいい物だというわけではない。
        - 高い物が必ずしもいい物だというわけではないです。
        - 高い物が必ずしもいいわけではありません。
        - 高い物が必ずしもいいわけではない。
        - 高い物が必ずしもいいというわけではありません。
        - 高い物は必ずしもいい物だというわけではありません。
        - 高い物は必ずしもいいわけではありません。
        - 高いものが必ずしもいいものだというわけではありません。
        - 高いものが必ずしもいいわけではありません。
        - 高いものは必ずしもいいわけではありません。
        - 高い物が必ずしも良い物だというわけではありません。
        - 高い物が必ずしも良いわけではありません。
        - たかいものがかならずしもいいものだというわけではありません。
    known_wrong:
      - answer: 高い物が必ずいい物です。
        feedback_vi: 必ず là "nhất định" - ngược nghĩa. "Không hẳn" là 必ずしも～わけではない.
        error_tag: kanarazushimo
      - answer: 高い物が必ずしもいい物です。
        feedback_vi: 必ずしも phải đi với phủ định ở cuối câu - ～わけではありません.
        error_tag: kanarazushimo
    explanation:
      vi: 必ずしも～わけではない - không hẳn là. Danh từ / なA nối bằng だという hoặc な - いい物だというわけではない, いいわけではない.
    display_answer: 高い物が必ずしもいい物だというわけではありません。

  # ---------------- application ----------------
  - key: ja:exercise:n3-hazu-wake-mcq-refuse
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-jijou
    prompt:
      stem: Đồng nghiệp mời bạn đi uống sau giờ làm. Bạn không ghét đi nhưng hôm nay có việc nhà. Câu từ chối nào khéo nhất?
      stem_lang: vi
      options:
        - { id: d7p, text: 行きたくないわけではないんですが、今日はちょっと家の事情があって…。, lang: ja }
        - { id: m3h, text: 行くはずがありません。家の事情があります。, lang: ja }
        - { id: u9a, text: 行くべきではないので、行きません。, lang: ja }
        - { id: k2s, text: 行きたくないわけです。家の事情があるからです。, lang: ja }
    answer:
      correct_option_id: d7p
    explanation:
      vi: 行きたくないわけではない - không phải là không muốn đi; 事情があって… - có chút việc riêng (bỏ lửng câu). Các câu kia nghe phũ hoặc sai nghĩa.
    display_answer: 行きたくないわけではないんですが、今日はちょっと家の事情があって…。

  - key: ja:exercise:n3-hazu-wake-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-gram-wake-da
    prompt:
      source_text: 毎日3時間も練習しているんですか。上手なわけですね。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Ngày nào cũng luyện những 3 tiếng à? Thảo nào giỏi thế.
        - Ngày nào cũng luyện tập những 3 tiếng à? Thảo nào giỏi thế.
        - Ngày nào cũng luyện tập 3 tiếng à? Thảo nào giỏi như vậy.
        - Mỗi ngày luyện tập tới 3 tiếng sao? Thảo nào giỏi vậy.
        - Mỗi ngày luyện những 3 tiếng à? Thảo nào giỏi thế.
        - Mỗi ngày luyện tập những 3 tiếng à? Thảo nào giỏi thế.
        - Ngày nào cũng tập những 3 tiếng à? Thảo nào giỏi thế.
        - Ngày nào cũng luyện tận 3 tiếng à? Thảo nào giỏi thế.
        - Ngày nào cũng luyện những 3 tiếng à? Hèn gì giỏi thế.
        - Ngày nào cũng luyện tập những 3 tiếng à? Hèn chi giỏi thế.
        - Bạn luyện tập 3 tiếng mỗi ngày à? Thảo nào giỏi thế.
        - Ngày nào cũng luyện những 3 tiếng sao? Thì ra vì vậy mà giỏi thế.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ngày nào cũng luyện những 3 tiếng à? Chắc chắn sẽ giỏi.
        feedback_vi: わけですね - thảo nào (đã thấy giỏi và hiểu ra lý do), không phải dự đoán tương lai.
        error_tag: wake_hazu
    explanation:
      vi: 3時間も - những 3 tiếng (nhấn mạnh nhiều); 上手なわけですね - thảo nào giỏi.
    display_answer: Ngày nào cũng luyện những 3 tiếng à? Thảo nào giỏi thế.

  - key: ja:exercise:n3-hazu-wake-wb-hazu
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-hazu-da
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Tôi chắc chắn đã khoá cửa rồi, vậy mà cửa lại mở.\""
      tokens:
        - { id: q3, text: 開いていました }
        - { id: q4, text: かけるべきですが、 }
        - { id: q1, text: 鍵を }
        - { id: q2, text: かけたはずですが、 }
    answer:
