    display_answer: Hành lý đã gửi hôm qua nên chắc chắn hôm nay sẽ đến.

  - key: ja:exercise:n3-hazu-wake-mcq-wake
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-wake-da
    prompt:
      stem: 'Bạn vừa biết đồng nghiệp từng sống ở Mỹ 10 năm. Bạn nói: 10年もアメリカに住んでいたんですか。英語が上手な＿＿ね。'
      stem_lang: vi
      options:
        - { id: n4c, text: わけです, lang: ja }
        - { id: e1t, text: はずです, lang: ja }
        - { id: j8v, text: べきです, lang: ja }
        - { id: r6b, text: わけではありません, lang: ja }
    answer:
      correct_option_id: n4c
    explanation:
      vi: Đã biết lý do (sống ở Mỹ 10 năm) rồi mới hiểu ra - わけです (thảo nào). はずです là đoán trước kết quả; べきです là "nên".
    display_answer: わけです

  - key: ja:exercise:n3-hazu-wake-fill-hazuganai
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-hazu-da
    prompt:
      template: "あんなに真面目な彼が、そんなことを言う{{b1}}がありません。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Anh ấy nghiêm túc như vậy, không thể nào nói điều như thế."
        - "Gợi ý: ～＿＿がない - 'không thể nào'."
    answer:
      blanks:
        b1: [はず]
    known_wrong:
      - answer: わけ
        feedback_vi: わけがない cũng có nghĩa gần, nhưng bài này luyện mẫu はずがない.
        error_tag: hazu_wake
      - answer: べき
        feedback_vi: べきがない không tồn tại.
        error_tag: grammar_form
    explanation:
      vi: ～はずがない - không thể nào (phủ định mạnh theo suy luận).
    display_answer: あんなに真面目な彼が、そんなことを言うはずがありません。

  - key: ja:exercise:n3-hazu-wake-wb-wakedewanai
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-wake-dewa-nai
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Không phải tôi ghét thịt, nhưng dạo này tôi ít ăn.\""
      tokens:
        - { id: w3, text: 最近はあまり食べません }
        - { id: w1, text: 肉が嫌いな }
        - { id: w4, text: はずではありませんが、 }
        - { id: w2, text: わけではありませんが、 }
    answer:
      orders:
        - [w1, w2, w3]
    explanation:
      vi: なA + な + わけではない - không phải là... はずではない không dùng với nghĩa này.
    display_answer: 肉が嫌いなわけではありませんが、最近はあまり食べません。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-hazu-wake-fill-touzen
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-touzen
    prompt:
      template: "毎日練習したのだから、上手になったのは{{b1}}です。(đương nhiên)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [当然, とうぜん, 当たり前, あたりまえ]
    known_wrong:
      - answer: とぜん
        feedback_vi: とう là âm dài - とうぜん.
        error_tag: long_vowel
      - answer: 必ず
        feedback_vi: 必ず là phó từ "nhất định"; không đứng trước です như tính từ. "Đương nhiên" - 当然.
        error_tag: vocab_meaning
    explanation:
      vi: ～のは当然です - việc ～ là đương nhiên. 当たり前 là cách nói thân mật hơn.
    display_answer: 毎日練習したのだから、上手になったのは当然です。

  - key: ja:exercise:n3-hazu-wake-translate-hazu
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-hazu-da
    prompt:
      source_text: Cuộc họp chắc chắn bắt đầu lúc 3 giờ. (dùng はず, lịch sự)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 会議は3時に始まるはずです。
        - 会議は3時から始まるはずです。
        - 会議は三時に始まるはずです。
        - 会議は三時から始まるはずです。
        - 会議は3時からのはずです。
        - 会議は3時のはずです。
        - 会議は午後3時に始まるはずです。
        - 会議は午後3時から始まるはずです。
        - 会議は3時に始まるはずですよ。
        - 会議は3時開始のはずです。
        - 会議は3時に始まるはず。
        - かいぎはさんじにはじまるはずです。
    known_wrong:
      - answer: 会議は3時に始まるべきです。
        feedback_vi: べきです là "nên"; "chắc chắn là" theo suy luận dùng はずです.
        error_tag: beki_hazu
      - answer: 会議は3時に始まったはずです。
        feedback_vi: Câu nói về cuộc họp sắp diễn ra - dùng thể từ điển 始まる.
        error_tag: tense
    explanation:
      vi: 3時に始まる - bắt đầu lúc 3 giờ; ～はずです - chắc chắn là. 3時のはずです (N + の + はず) cũng đúng.
    display_answer: 会議は3時に始まるはずです。

