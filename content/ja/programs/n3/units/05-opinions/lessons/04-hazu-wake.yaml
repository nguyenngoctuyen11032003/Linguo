    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-gram-hazu-da
    prompt:
      audio_asset_id: null
      fallback_text: 荷物は昨日送ったので、今日届くはずです。
      options:
        - { id: s8j, text: Hành lý đã gửi hôm qua nên chắc chắn hôm nay sẽ đến., lang: vi }
        - { id: a2m, text: Hành lý đã gửi hôm qua nhưng hôm nay vẫn chưa đến., lang: vi }
        - { id: o7e, text: Hành lý nên được gửi trước hôm nay., lang: vi }
        - { id: w5r, text: Nghe nói hành lý gửi hôm qua sẽ đến hôm nay., lang: vi }
