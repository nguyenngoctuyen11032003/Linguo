title:
  vi: Lập luận - ～はずだ, ～わけだ, ～わけではない
objectives:
  - vi: Kết luận có căn cứ bằng ～はずだ / ～はずがない.
  - vi: Nói "thảo nào" bằng ～わけだ.
  - vi: Phủ định một phần bằng ～わけではない, 必ずしも～ない.
