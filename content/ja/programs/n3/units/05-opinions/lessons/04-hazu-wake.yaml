        - [q1, q2, q3]
    explanation:
      vi: かけたはずですが - (theo trí nhớ) chắc chắn đã khoá, nhưng... Mẫu này diễn tả kết quả trái với điều mình tin chắc.
    display_answer: 鍵をかけたはずですが、開いていました。

  - key: ja:exercise:n3-hazu-wake-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-wake-dewa-nai
    prompt:
      stem: 'Bạn bè hỏi: 「日本の生活、嫌いなの？」 Bạn không ghét, chỉ thấy nhớ nhà. Câu nào phù hợp nhất?'
      stem_lang: vi
      options:
        - { id: y5e, text: 嫌いなわけじゃないよ。ただ、ちょっと家族に会いたいだけ。, lang: ja }
        - { id: c2r, text: 嫌いなはずだよ。ただ、ちょっと家族に会いたいだけ。, lang: ja }
        - { id: l7n, text: 嫌いなわけだよ。ただ、ちょっと家族に会いたいだけ。, lang: ja }
        - { id: b8g, text: 嫌いになるべきだよ。ただ、ちょっと家族に会いたいだけ。, lang: ja }
    answer:
      correct_option_id: y5e
    explanation:
      vi: わけじゃない (văn nói của わけではない) - không phải là ghét. はずだ / わけだ đều khẳng định là ghét; べきだ là "nên".
    display_answer: 嫌いなわけじゃないよ。ただ、ちょっと家族に会いたいだけ。
