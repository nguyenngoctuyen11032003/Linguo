key: ja:lesson:n3-opinions-review
order_index: 5
level: n3
title:
  vi: "Ôn tập: đọc bài viết nêu ý kiến"
objectives:
  - vi: Đọc hiểu đoạn văn ý kiến có số liệu khảo sát, so sánh và kết luận.
  - vi: Tìm ý chính của tác giả qua các từ nối 一方, つまり, 確かに～が.
  - vi: Viết câu nêu ý kiến có lý do, so sánh và kết luận.
estimated_minutes: 24
skills: [reading, writing, grammar]
prerequisites: [ja:lesson:n3-hazu-wake]
