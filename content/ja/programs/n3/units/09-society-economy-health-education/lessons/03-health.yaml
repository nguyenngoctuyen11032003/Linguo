body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về sức khoẻ và bệnh viện - 体調が悪いので、病院で検査を受けました。来週、退院できます。
  - type: explain
    text:
      vi: "Điều trị: 治療 (điều trị), 手術 (phẫu thuật), 入院 (nhập viện), 退院 (xuất viện), 検査 (kiểm tra, xét nghiệm). Mẫu: 検査を受ける, 手術をする, 入院している."
  - type: explain
    text:
      vi: "Sức khoẻ hằng ngày: 体調 (tình trạng sức khoẻ), 食欲 (chán/ham ăn), 睡眠 (giấc ngủ), 栄養 (dinh dưỡng), 予防 (phòng ngừa). Ví dụ 体調がいい / 悪い, 食欲がない, 睡眠を取る, 栄養を考える."
  - type: explain
    text:
      vi: Cách báo bác sĩ - 三日前から熱があります。食欲がありません。夜、あまり眠れません. Bác sĩ thường nói 検査をしましょう, 薬を出しておきます.
  - type: deep_explain
    text:
      vi: 受ける dùng với 検査・治療・手術 (検査を受ける = được kiểm tra), còn する dùng khi bác sĩ là người làm (手術をする). 入院 (nhập viện) và 退院 (xuất viện) đối nghĩa, hai chữ chỉ khác 入/退. 予防 hay đi với 病気・風邪 (風邪を予防する), và 予防接種 là tiêm phòng. Chữ Hán - 治療, 手術, 入院, 退院, 検査, 予防, 体調, 食欲, 睡眠, 栄養.
  - type: example
    target: 三日前から熱があって、食欲もありません。
    target_lang: ja
    translation:
      vi: Từ ba ngày trước tôi bị sốt và cũng chán ăn.
    note:
      vi: 食欲がない.
  - type: example
    target: 病院で検査を受けた結果、手術をすることになりました。
    target_lang: ja
    translation:
      vi: Làm xét nghiệm ở bệnh viện xong thì quyết định phẫu thuật.
    note:
      vi: 検査を受ける・手術をする.
  - type: example
    target: 父は三日前から入院しています。来週、退院できます。
    target_lang: ja
    translation:
      vi: Bố tôi nhập viện từ ba ngày trước. Tuần sau có thể xuất viện.
    note:
      vi: 入院・退院.
  - type: example
    target: 病気を予防するために、毎日運動しています。
    target_lang: ja
    translation:
      vi: Tôi tập thể dục mỗi ngày để phòng bệnh.
    note:
      vi: 予防.
  - type: common_mistake
    wrong: 検査をしました。(tôi được bác sĩ kiểm tra)
    right: 検査を受けました。
    target_lang: ja
    note:
      vi: Người bệnh "được kiểm tra" dùng 受ける; 検査をする là người làm xét nghiệm.
  - type: common_mistake
    wrong: 睡眠をします。
    right: 睡眠を取ります。
    target_lang: ja
    note:
      vi: Giấc ngủ dùng 取る (睡眠を取る); 睡眠をします không tự nhiên.
  - type: summary
    points:
      - vi: 治療 · 手術 · 入院 · 退院 · 検査.
      - vi: 体調 · 食欲 · 睡眠 · 栄養 · 予防.
      - vi: 検査 / 治療 / 手術 を 受ける.
      - vi: 入院 ↔ 退院.
