        error_tag: meaning
    explanation:
      vi: 検査の結果 - kết quả xét nghiệm; ことになった - được quyết định; 入院 - nhập viện.
    display_answer: Theo kết quả xét nghiệm, quyết định phẫu thuật. Nhập viện khoảng một tuần.
