      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Theo kết quả xét nghiệm, quyết định phẫu thuật. Nhập viện khoảng một tuần.
        - Kết quả xét nghiệm là phải phẫu thuật. Ở viện khoảng một tuần.
        - Sau khi xét nghiệm, tôi sẽ phải phẫu thuật. Nằm viện khoảng một tuần.
