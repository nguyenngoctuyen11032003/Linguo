  - key: ja:exercise:n3-economy-e8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-bukka
    prompt:
      source_text: Gần đây vật giá đang tăng.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 最近、物価が上がっています。
        - さいきん、ぶっかがあがっています。
        - 最近物価が上がっています。
        - このごろ物価が上がっています。
    known_wrong:
      - answer: 最近、物価を上がっています。
        feedback_vi: 上がる là tự động từ nên dùng が.
        error_tag: particle_ga_wo
    explanation:
      vi: 物価が上がっている - vật giá đang tăng.
    display_answer: 最近、物価が上がっています。
  - key: ja:exercise:n3-economy-e9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-u9-seisan
    prompt:
      source_text: この工場では車を生産して、外国へ輸出しています。売り上げは去年より増えました。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Nhà máy này sản xuất ô tô rồi xuất khẩu ra nước ngoài. Doanh thu đã tăng so với năm ngoái.
        - Nhà máy này sản xuất xe hơi và xuất khẩu. Doanh thu tăng so với năm trước.
        - Ở nhà máy này, ô tô được sản xuất và xuất khẩu ra nước ngoài. Doanh thu cao hơn năm ngoái.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Nhà máy này nhập khẩu ô tô từ nước ngoài. Doanh thu giảm so với năm ngoái.
        feedback_vi: 生産して輸出 là sản xuất và xuất khẩu.
        error_tag: meaning
    explanation:
      vi: 生産 - sản xuất; 輸出 - xuất khẩu; 売り上げが増えた - doanh thu tăng.
    display_answer: Nhà máy này sản xuất ô tô rồi xuất khẩu ra nước ngoài. Doanh thu đã tăng so với năm ngoái.
  - key: ja:exercise:n3-economy-e10
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u9-hiyou
    prompt:
      instruction: 'Sắp xếp thành câu tiếng Nhật: "Chi phí chuyển nhà thì đắt."'
      tokens:
        - id: t3
          text: 高いです。
        - id: t2
          text: 費用は
        - id: t1
          text: 引っ越しの
    answer:
      orders:
        - - t1
          - t2
          - t3
    explanation:
      vi: N の + 費用は + 高いです.
    display_answer: 引っ越しの費用は高いです。
  - key: ja:exercise:n3-economy-e11
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u9-shouhin
    prompt:
      stem: Công ty sắp tung ra sản phẩm mới. Từ nào hợp? 新しい___を発売します。
      stem_lang: vi
      options:
        - id: sy0
          text: 景気
          lang: ja
        - id: zxj
          text: 物価
          lang: ja
        - id: rsa
          text: 収入
          lang: ja
        - id: j7y
          text: 商品
          lang: ja
    answer:
      correct_option_id: j7y
    explanation:
      vi: 商品 là hàng hoá, sản phẩm. 景気, 物価, 収入 không phải thứ bán ra.
    display_answer: 商品
