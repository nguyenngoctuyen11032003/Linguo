body:
  - type: objective
    text:
      vi: Sau bài này, bạn hiểu tin kinh tế đơn giản - 最近、物価が上がっています。売り上げが増えて、利益も出ました。
  - type: explain
    text:
      vi: "Kinh tế vĩ mô: 景気 (tình hình kinh tế), 物価 (vật giá), 輸入 (nhập khẩu), 輸出 (xuất khẩu), 生産 (sản xuất), 商品 (hàng hoá). Ví dụ 景気がよい / 悪い, 物価が上がる / 下がる."
  - type: explain
    text:
      vi: "Kinh doanh: 利益 (lợi nhuận), 売り上げ (doanh thu), 費用 (chi phí). Quan hệ: 売り上げ − 費用 = 利益. Ví dụ 売り上げが二割増えました, 利益が出ました."
  - type: explain
    text:
      vi: "Gia đình: 収入 (thu nhập), 支出 (chi tiêu), 貯金 (tiền tiết kiệm, đã học ở N4). Ví dụ 収入が少ないので、支出を減らします."
  - type: deep_explain
    text:
      vi: 輸入 và 輸出 chỉ khác chữ đầu (入 vào / 出 ra), nên nhớ "nhập = đưa vào, xuất = đưa ra". 上がる/下がる (tự tăng giảm) dùng với 物価 (物価が上がる), còn 上げる/下げる dùng khi có người chủ động (値段を上げる). 景気 thường nói 景気がいい (tốt), 景気が悪い (xấu). Chữ Hán - 景気, 物価, 輸入, 輸出, 生産, 商品, 利益, 売り上げ, 費用, 収入, 支出.
  - type: example
    target: 最近、物価が上がっています。
    target_lang: ja
    translation:
      vi: Gần đây vật giá đang tăng.
    note:
      vi: 物価が上がる.
  - type: example
    target: 日本は石油を輸入し、車を輸出しています。
    target_lang: ja
    translation:
      vi: Nhật Bản nhập khẩu dầu mỏ và xuất khẩu ô tô.
    note:
      vi: 輸入 - 輸出.
  - type: example
    target: 今年は売り上げが増えて、利益も出ました。
    target_lang: ja
    translation:
      vi: Năm nay doanh thu tăng và còn có lợi nhuận.
    note:
      vi: 売り上げ - 利益.
  - type: example
    target: 収入が少ないので、支出を減らして、貯金します。
    target_lang: ja
    translation:
      vi: Vì thu nhập ít nên tôi giảm chi tiêu và tiết kiệm.
    note:
      vi: 収入 - 支出.
  - type: common_mistake
    wrong: 日本は車を輸入しています。(xuất khẩu)
    right: 日本は車を輸出しています。
    target_lang: ja
    note:
      vi: 輸出 là bán ra nước ngoài; 輸入 là mua từ nước ngoài.
  - type: common_mistake
    wrong: 物価を上がっています。
    right: 物価が上がっています。
    target_lang: ja
    note:
      vi: 上がる là tự động từ, đi với が.
  - type: summary
    points:
      - vi: 景気 · 物価 · 輸入 · 輸出 · 生産 · 商品.
      - vi: 売り上げ doanh thu · 費用 chi phí · 利益 lợi nhuận.
      - vi: 収入 thu nhập · 支出 chi tiêu · 貯金 tiết kiệm.
      - vi: 物価が上がる / 下がる.
exercises:
