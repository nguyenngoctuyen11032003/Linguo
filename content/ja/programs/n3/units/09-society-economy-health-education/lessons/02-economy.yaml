    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u9-yushutsu
    prompt:
      stem: Từ nào có nghĩa là “xuất khẩu”?
      stem_lang: vi
      options:
        - id: mnq
          text: 輸入
          lang: ja
        - id: sa6
          text: 生産
          lang: ja
        - id: cf8
          text: 輸出
          lang: ja
        - id: hvc
          text: 商品
          lang: ja
    answer:
      correct_option_id: cf8
    explanation:
      vi: 輸出 là xuất khẩu. 輸入 là nhập khẩu, 生産 là sản xuất, 商品 là hàng hoá.
    display_answer: 輸出
  - key: ja:exercise:n3-economy-e2
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u9-rieki
    prompt:
      stem: Lợi nhuận là bao nhiêu sau khi trừ chi phí khỏi doanh thu? Từ nào?
      stem_lang: vi
      options:
        - id: kdp
          text: 利益
          lang: ja
        - id: cd8
          text: 収入
          lang: ja
        - id: owx
          text: 費用
          lang: ja
        - id: vqw
          text: 支出
          lang: ja
    answer:
      correct_option_id: kdp
    explanation:
      vi: 利益 là lợi nhuận (doanh thu trừ chi phí). 費用 là chi phí, 収入 là thu nhập, 支出 là chi tiêu.
    display_answer: 利益
  - key: ja:exercise:n3-economy-e3
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-bukka
    prompt:
      audio_asset_id: null
      fallback_text: 最近、物価が上がっていますから、支出を減らさなければなりません。
      options:
        - id: vvq
          text: Gần đây thu nhập tăng nên không cần tiết kiệm.
          lang: vi
        - id: b8t
          text: Vật giá tăng nhưng thu nhập cũng tăng.
          lang: vi
        - id: e3g
          text: Gần đây vật giá đang giảm nên có thể tiêu nhiều hơn.
          lang: vi
        - id: s2z
          text: Gần đây vật giá đang tăng nên phải giảm chi tiêu.
          lang: vi
    answer:
      correct_option_id: s2z
    explanation:
      vi: 物価が上がっている - vật giá tăng; 支出を減らす - giảm chi tiêu.
    display_answer: Gần đây vật giá đang tăng nên phải giảm chi tiêu.
  - key: ja:exercise:n3-economy-e4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u9-uriage
    prompt:
      template: "{{b1}}が去年より二割増えました。 (Doanh thu tăng 20% so với năm ngoái.)"
      blanks:
        - id: b1
          width_hint: 5
      hint_levels:
        - Số tiền bán hàng thu về.
        - Bắt đầu bằng 売.
    answer:
      blanks:
        b1:
          - 売り上げ
          - 売上
          - うりあげ
    known_wrong:
      - answer: 利益
        feedback_vi: 利益 là lợi nhuận; "doanh thu" là 売り上げ.
        error_tag: vocab_meaning
    explanation:
      vi: 売り上げ - doanh thu.
    display_answer: 売り上げが去年より二割増えました。
  - key: ja:exercise:n3-economy-e5
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u9-keiki
    prompt:
      stem: Bạn nói “Kinh tế khá lên”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: wti
          text: 景気がよくなってきました。
          lang: ja
        - id: ghy
          text: 景気によくなってきました。
          lang: ja
        - id: yam
          text: 景気をよくなってきました。
          lang: ja
        - id: xvf
          text: 景気でよくなってきました。
          lang: ja
    answer:
      correct_option_id: wti
    explanation:
      vi: 景気がよくなる - kinh tế khá lên. を, に, で không dùng với なる ở đây.
    display_answer: 景気がよくなってきました。
  - key: ja:exercise:n3-economy-e6
    type: fill_blank
