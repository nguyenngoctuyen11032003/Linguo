body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc và nói về tin tức xã hội cơ bản - 来月、市長選挙があります。国民の多くが新しい制度に賛成しています。 - và nêu ví dụ - 社長をはじめ、全員が参加しました。
  - type: explain
    text:
      vi: "Từ vựng xã hội: 社会 (xã hội), 政治 (chính trị), 経済 (kinh tế), 法律 (pháp luật), 選挙 (bầu cử), 国民 (người dân), 制度 (chế độ, hệ thống), 税金 (thuế), 年金 (lương hưu). Chủ đề tin tức: 平和 (hoà bình), 戦争 (chiến tranh), 犯罪 (tội phạm), 事件 (vụ việc), 警察 (cảnh sát)."
  - type: explain
    text:
      vi: 'N をはじめ(として) = "mở đầu bằng N, và cả những ... khác": 社長をはじめ、社員全員が参加しました (từ giám đốc đến toàn thể nhân viên). N là ví dụ tiêu biểu, vế sau là cả nhóm. Thường dùng trong văn trang trọng.'
  - type: explain
    text:
      vi: Các cụm hay đi cùng - 選挙で投票する (bỏ phiếu), 法律を守る (tuân thủ luật), 税金を払う (nộp thuế), 制度が変わる (chế độ đổi), 犯罪が増える (tội phạm tăng), 事件が起きる (xảy ra vụ việc).
  - type: deep_explain
    text:
      vi: Cẩn thận phân biệt 事件 (vụ việc, thường là vụ án hay vấn đề lớn) và 事故 (tai nạn). 警察 là cơ quan cảnh sát (警察に電話する); 警官 là một viên cảnh sát (đã học ở N5). 国民 nhấn mạnh quan hệ với quốc gia (日本国民), còn 市民 là người dân thành phố. Chữ Hán - 社会, 政治, 経済, 法律, 選挙, 国民, 制度, 税金, 年金.
  - type: example
    target: 来月、市長選挙があります。
    target_lang: ja
    translation:
      vi: Tháng sau có cuộc bầu cử thị trưởng.
    note:
      vi: 選挙 - bầu cử.
  - type: example
    target: 国民の多くは、その制度に賛成しています。
    target_lang: ja
    translation:
      vi: Phần lớn người dân tán thành chế độ đó.
    note:
      vi: 国民 - người dân.
  - type: example
    target: 社長をはじめ、社員全員が参加しました。
    target_lang: ja
    translation:
      vi: Từ giám đốc đến toàn thể nhân viên đều tham gia.
    note:
      vi: N をはじめ - mở đầu bằng N.
  - type: example
    target: 昨日、駅の近くで事件があって、警察が来ました。
    target_lang: ja
    translation:
      vi: Hôm qua có một vụ việc gần nhà ga và cảnh sát đã đến.
    note:
      vi: 事件・警察.
  - type: common_mistake
    wrong: 昨日、駅の近くで事件がありました。(tai nạn xe)
    right: 昨日、駅の近くで事故がありました。
    target_lang: ja
    note:
      vi: Tai nạn giao thông là 事故; 事件 là vụ việc, vụ án.
  - type: common_mistake
    wrong: 先生をはじめにして、みんなが来ました。
    right: 先生をはじめ、みんなが来ました。
    target_lang: ja
    note:
      vi: Mẫu cố định là をはじめ(として), không dùng をはじめにして.
  - type: summary
    points:
      - vi: 社会 · 政治 · 経済 · 法律 · 選挙 · 国民 · 制度 · 税金 · 年金.
      - vi: 平和 · 戦争 · 犯罪 · 事件 · 警察.
      - vi: N をはじめ(として) - mở đầu bằng N, và cả ...
      - vi: 事件 (vụ việc) ≠ 事故 (tai nạn).
