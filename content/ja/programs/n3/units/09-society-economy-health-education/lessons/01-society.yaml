  - key: ja:exercise:n3-society-s8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u9-gram-wo-hajime
    prompt:
      source_text: Từ giám đốc đến toàn thể nhân viên đều tham gia.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 社長をはじめ、社員全員が参加しました。
        - 社長をはじめとして、社員全員が参加しました。
        - しゃちょうをはじめ、しゃいんぜんいんがさんかしました。
        - 社長をはじめ社員全員が参加しました。
    known_wrong:
      - answer: 社長をはじめに、社員全員が参加しました。
        feedback_vi: Mẫu cố định là をはじめ(として).
        error_tag: form
    explanation:
      vi: N をはじめ - mở đầu bằng N; 参加しました - đã tham gia.
    display_answer: 社長をはじめ、社員全員が参加しました。
  - key: ja:exercise:n3-society-s9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-u9-seido
    prompt:
      source_text: 新しい制度が始まりました。国民の多くが賛成していますが、反対する人もいます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Một chế độ mới đã bắt đầu. Phần lớn người dân tán thành nhưng cũng có người phản đối.
        - Chế độ mới đã được áp dụng. Nhiều người dân đồng ý nhưng cũng có người không.
        - Một hệ thống mới bắt đầu. Đa số người dân ủng hộ, nhưng vẫn có người phản đối.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Một chế độ mới đã bắt đầu. Toàn bộ người dân phản đối.
        feedback_vi: 国民の多くが賛成 là phần lớn người dân tán thành.
        error_tag: meaning
    explanation:
      vi: 制度 - chế độ; 賛成 - tán thành; 反対する - phản đối.
    display_answer: Một chế độ mới đã bắt đầu. Phần lớn người dân tán thành nhưng cũng có người phản đối.
