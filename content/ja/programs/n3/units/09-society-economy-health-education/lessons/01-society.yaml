  - key: ja:exercise:n3-society-s3
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-u9-hanzai
    prompt:
      audio_asset_id: null
      fallback_text: 最近、犯罪が増えています。警察はパトロールを強くしています。
      options:
        - id: ul6
          text: Gần đây tội phạm đang giảm. Cảnh sát đang giảm tuần tra.
          lang: vi
        - id: xf7
          text: Gần đây thuế đang tăng. Cảnh sát tuần tra ít hơn.
          lang: vi
        - id: w4r
          text: Gần đây tai nạn đang tăng. Cảnh sát nghỉ tuần tra.
          lang: vi
        - id: ixz
          text: Gần đây tội phạm đang gia tăng. Cảnh sát đang tăng cường tuần tra.
          lang: vi
    answer:
      correct_option_id: ixz
    explanation:
      vi: 犯罪が増えている - tội phạm gia tăng; 警察 - cảnh sát.
    display_answer: Gần đây tội phạm đang gia tăng. Cảnh sát đang tăng cường tuần tra.
  - key: ja:exercise:n3-society-s4
