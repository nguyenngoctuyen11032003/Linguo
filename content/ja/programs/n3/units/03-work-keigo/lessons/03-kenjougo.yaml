key: ja:lesson:n3-kenjougo
order_index: 3
level: n3
title:
  vi: Khiêm nhường ngữ - hạ mình khi nói với người trên
objectives:
  - vi: Lập khiêm nhường ngữ bằng お～する / ご～する cho hành động hướng về người kia.
  - vi: Dùng đúng 参る, 申す, 伺う, 拝見する khi nói về chính mình.
  - vi: Phân biệt cặp tôn kính - khiêm nhường (いらっしゃる/参る, ご覧になる/拝見する).
estimated_minutes: 20
skills: [grammar, vocabulary, speaking]
prerequisites: [ja:lesson:n3-sonkeigo]
