    display_answer: こちらの資料をご覧ください。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-sonkeigo-fill-ossharu
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-ossharu
    prompt:
      template: "先生が{{b1}}とおりにやってみます。(言う - tôn kính, quá khứ)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [おっしゃった]
    known_wrong:
      - answer: 言った
        feedback_vi: Thầy là người trên nên dùng tôn kính ngữ - おっしゃった.
        error_tag: missing_sonkeigo
      - answer: 申した
        feedback_vi: 申す là khiêm nhường (mình nói). Thầy nói - おっしゃる.
        error_tag: sonkeigo_kenjougo
      - answer: おっしゃりた
        feedback_vi: おっしゃる là động từ nhóm 1 - thể た là おっしゃった.
        error_tag: verb_conjugation
    explanation:
      vi: 言う → おっしゃる; thể た - おっしゃった. ～とおりに - đúng như.
    display_answer: 先生がおっしゃったとおりにやってみます。

