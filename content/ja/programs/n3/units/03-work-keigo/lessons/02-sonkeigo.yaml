title:
  vi: Tôn kính ngữ - nâng hành động của người trên
objectives:
  - vi: Biến động từ thường thành tôn kính ngữ bằng お～になる và ～(ら)れる.
  - vi: Dùng đúng các động từ tôn kính riêng - いらっしゃる, 召し上がる, おっしゃる, ご覧になる.
  - vi: Không dùng tôn kính ngữ cho hành động của chính mình.
