  - key: ja:exercise:n3-sonkeigo-fill-okaeri
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-sonkeigo
    prompt:
      template: "部長はもう{{b1}}になりました。(帰る)"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Trưởng phòng đã về rồi ạ."
        - "Gợi ý: お + 帰る bỏ ます (帰り) + になる."
    answer:
      blanks:
        b1: [お帰り, おかえり]
    known_wrong:
      - answer: お帰る
        feedback_vi: Sau お dùng dạng ます bỏ ます - 帰り, không dùng thể từ điển.
        error_tag: sonkeigo_form
      - answer: 帰り
        feedback_vi: Thiếu お ở đầu - お帰りになる.
        error_tag: sonkeigo_form
    explanation:
      vi: お + V(bỏ ます) + になる - お帰りになりました (đã về). Đây là khuôn tôn kính ngữ dùng được với hầu hết động từ không có từ riêng.
    display_answer: 部長はもうお帰りになりました。

  - key: ja:exercise:n3-sonkeigo-wb-goran
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-goran-ni-naru
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Xin mời xem tài liệu này ạ.\""
      tokens:
        - { id: t3, text: ご覧ください }
