title:
  vi: Gọi điện và nhận điện thoại ở công ty
objectives:
  - vi: Dùng các câu cố định khi nghe, gọi điện thoại công việc.
  - vi: Báo người được gọi đang vắng và hứa gọi lại.
  - vi: Nhờ vả lịch sự bằng ～ていただけませんか.
