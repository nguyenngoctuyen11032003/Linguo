        - 申し訳ありません。田中はただいま席を外しております。
        - 申し訳ありません、田中はただいま席を外しております。
        - 申し訳ありません。田中は今、席を外しております。
        - 申し訳ありません。田中は今席を外しております。
        - 申し訳ございません。ただいま田中は席を外しております。
        - 申し訳ありません。ただいま田中は席を外しております。
