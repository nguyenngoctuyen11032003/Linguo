        - Cảm ơn anh chị đã luôn giúp đỡ. Tôi gọi điện về việc hôm trước.
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện liên quan đến việc hôm trước.
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về vấn đề hôm trước.
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về việc hôm nọ.
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về việc mấy hôm trước.
        - Xin cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về việc hôm trước.
        - Cảm ơn anh luôn giúp đỡ. Tôi gọi điện về việc hôm trước.
        - Cảm ơn chị luôn giúp đỡ. Tôi gọi điện về việc hôm trước.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Cảm ơn anh chị luôn giúp đỡ. Xin hãy gọi điện cho tôi về việc hôm trước.
        feedback_vi: お電話いたしました là khiêm nhường - tôi đã gọi điện (chính là cuộc gọi này), không phải nhờ người kia gọi.
        error_tag: kenjougo_meaning
    explanation:
      vi: 先日の件で - về việc hôm trước; お電話いたしました - tôi gọi điện (khiêm nhường). お世話になっております không cần dịch sát.
    display_answer: Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về việc hôm trước.

  - key: ja:exercise:n3-phone-email-wb-dengon
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-te-itadakemasenka
    prompt:
      instruction: "Bạn gọi đến, người cần gặp vắng. Sắp xếp: \"Anh/chị có thể nhắn lại giúp là tôi đã gọi được không ạ?\""
      tokens:
        - { id: n4, text: いただけませんか }
        - { id: n2, text: 電話があったと }
        - { id: n5, text: しましょうか }
        - { id: n1, text: グエンから }
        - { id: n3, text: お伝え }
    answer:
