      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về việc hôm trước.
        - Cảm ơn anh/chị luôn giúp đỡ. Tôi gọi điện về việc hôm trước ạ.
        - Cảm ơn anh chị luôn giúp đỡ. Tôi gọi điện về chuyện hôm trước.
