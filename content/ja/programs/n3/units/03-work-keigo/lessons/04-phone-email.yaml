  - key: ja:exercise:n3-phone-email-mcq-osewa
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-osewa
    prompt:
      stem: Bạn gọi điện cho một công ty đối tác quen. Câu mở đầu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: c3j, text: お世話になっております。ABC社のグエンです。, lang: ja }
        - { id: v6u, text: お疲れ様です。ABC社のグエンです。, lang: ja }
        - { id: h8a, text: いらっしゃいませ。ABC社のグエンです。, lang: ja }
