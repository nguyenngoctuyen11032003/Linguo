    display_answer: 申し訳ございません。田中はただいま席を外しております。

  - key: ja:exercise:n3-phone-email-translate-itadake
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-te-itadakemasenka
    prompt:
      source_text: Anh/chị có thể nói chậm hơn một chút được không ạ? (rất lịch sự)
