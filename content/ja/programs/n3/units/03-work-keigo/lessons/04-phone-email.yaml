        - [n1, n2, n3, n4]
    explanation:
      vi: お伝えいただけませんか - có thể chuyển lời giúp không ạ (お + V bỏ ます + いただく). お伝えしましょうか là "để tôi chuyển lời nhé" - câu của người nghe máy, không phải người gọi.
    display_answer: グエンから電話があったとお伝えいただけませんか。

