    display_answer: 戻りましたら、折り返しお電話いたします。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-phone-email-fill-itadake
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-te-itadakemasenka
    prompt:
      template: "お名前をもう一度教えて{{b1}}か。(nhờ rất lịch sự)"
      blanks:
        - { id: b1, width_hint: 6 }
    answer:
      blanks:
        b1: [いただけません, いただけます, 頂けません, 頂けます]
    known_wrong:
      - answer: ください
        feedback_vi: ～てくださいか không đúng ngữ pháp. Nhờ lịch sự - ～ていただけませんか.
        error_tag: request_form
      - answer: いただきません
        feedback_vi: Cần thể khả năng いただける - いただけませんか (có thể ... giúp không).
        error_tag: potential_form
    explanation:
      vi: V-ていただけませんか / ていただけますか - anh/chị có thể... giúp tôi được không ạ. Dạng phủ định ませんか mềm hơn một chút.
    display_answer: お名前をもう一度教えていただけませんか。

