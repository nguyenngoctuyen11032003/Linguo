    display_answer: お世話になっております。ABC社のグエンです。

  - key: ja:exercise:n3-phone-email-fill-shoushou
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-shoushou
    prompt:
      template: "担当者に代わりますので、{{b1}}お待ちください。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Tôi xin chuyển máy cho người phụ trách, xin vui lòng chờ một chút."
        - "Gợi ý: cách nói trang trọng của ちょっと, viết bằng kanji lặp lại."
    answer:
      blanks:
        b1: [少々, しょうしょう]
    known_wrong:
      - answer: ちょっと
        feedback_vi: ちょっと đúng nghĩa nhưng suồng sã; với khách nói 少々.
        error_tag: register
    explanation:
      vi: 少々お待ちください - câu chuẩn khi bảo khách chờ. 々 là ký hiệu lặp lại kanji trước.
    display_answer: 担当者に代わりますので、少々お待ちください。

  - key: ja:exercise:n3-phone-email-wb-orikaeshi
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-orikaeshi
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Khi anh ấy quay lại, chúng tôi sẽ gọi lại cho anh/chị ạ.\""
      tokens:
        - { id: o3, text: お電話いたします }
