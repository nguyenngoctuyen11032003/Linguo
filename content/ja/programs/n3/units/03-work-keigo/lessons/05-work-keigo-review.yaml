  # ---------------- application ----------------
  - key: ja:exercise:n3-work-keigo-review-mcq-renraku
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-kenjougo
    prompt:
      stem: 'Bạn muốn viết cho đối tác: "Khi đã quyết định ngày, tôi sẽ liên lạc lại với anh/chị." Câu nào đúng?'
      stem_lang: vi
      options:
        - { id: f5t, text: 日程が決まりましたら、ご連絡いたします。, lang: ja }
        - { id: o8j, text: 日程が決まりましたら、ご連絡ください。, lang: ja }
        - { id: d2s, text: 日程が決まりましたら、ご連絡なさいます。, lang: ja }
        - { id: l7a, text: 日程が決まりましたら、お連絡いたします。, lang: ja }
    answer:
      correct_option_id: f5t
    explanation:
      vi: Mình liên lạc - ご連絡いたします. ご連絡ください là nhờ người kia liên lạc (ngược nghĩa); なさる là tôn kính; 連絡 là từ Hán nên dùng ご.
    display_answer: 日程が決まりましたら、ご連絡いたします。

