    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-shouchi
    prompt:
      source_text: Tôi rõ rồi ạ. Tôi sẽ chuẩn bị trước ngày mai. (trả lời sếp, khiêm nhường)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 承知しました。明日までに準備いたします。
