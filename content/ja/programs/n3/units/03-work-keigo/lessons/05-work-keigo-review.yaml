      vi: 承知しました / かしこまりました - tôi rõ rồi; 明日までに - trước (hạn) ngày mai; 準備いたします - tôi sẽ chuẩn bị (khiêm nhường).
    display_answer: 承知しました。明日までに準備いたします。

