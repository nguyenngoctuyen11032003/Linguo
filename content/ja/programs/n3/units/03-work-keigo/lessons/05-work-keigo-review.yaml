  - key: ja:exercise:n3-work-keigo-review-wb-email
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-te-itadakemasenka
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Anh/chị có thể gửi lại tài liệu cho tôi được không ạ?\""
      tokens:
        - { id: s3, text: 送って }
        - { id: s5, text: さしあげませんか }
        - { id: s1, text: 資料を }
        - { id: s4, text: いただけませんか }
        - { id: s2, text: もう一度 }
    answer:
      orders:
        - [s1, s2, s3, s4]
        - [s2, s1, s3, s4]
    explanation:
      vi: V-ていただけませんか - nhờ người kia làm cho mình. ～てさしあげる là mình làm cho người trên - sai hướng.
    display_answer: 資料をもう一度送っていただけませんか。

  - key: ja:exercise:n3-work-keigo-review-mcq-email
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-osewa
    prompt:
      stem: Bạn gửi email đầu tiên trong ngày cho anh Yamada ở công ty đối tác XYZ. Phần mở đầu nào phù hợp nhất?
      stem_lang: vi
