        - 承知いたしました。明日までに準備いたします。
        - 承知いたしました。明日までに準備します。
        - かしこまりました。明日までに準備いたします。
        - かしこまりました。明日までに準備します。
        - 承知しました、明日までに準備いたします。
        - 承知しました。明日までにご準備いたします。
        - 承知しました。明日までに用意いたします。
        - 承知しました。明日までに用意します。
        - しょうちしました。あしたまでにじゅんびいたします。
        - しょうちしました。あしたまでにじゅんびします。
    known_wrong:
      - answer: 了解です。明日までに準備します。
        feedback_vi: 了解です không nên dùng với sếp; dùng 承知しました.
        error_tag: register
