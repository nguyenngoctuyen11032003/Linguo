title:
  vi: Quy tắc và xã hội - 許可・禁止・制限・違反・義務・権利
objectives:
  - vi: Dùng 許可, 禁止, 制限, 違反, 義務, 権利 trong biển báo, nội quy, quy định.
  - vi: Dùng 承認, 提案, 協力, 援助 trong công việc nhóm.
  - vi: Đọc hiểu nội quy ngắn.
