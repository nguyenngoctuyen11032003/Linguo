          width_hint: 3
      hint_levels:
        - Điều chuyển nội bộ.
        - Bắt đầu bằng 異.
    answer:
      blanks:
        b1:
          - 異動
          - いどう
    known_wrong:
      - answer: 転職
        feedback_vi: 転職 là chuyển sang công ty khác; điều chuyển nội bộ là 異動.
        error_tag: noun_choice
    explanation:
      vi: 異動 - điều chuyển công tác.
    display_answer: 四月から大阪支店に異動します。
