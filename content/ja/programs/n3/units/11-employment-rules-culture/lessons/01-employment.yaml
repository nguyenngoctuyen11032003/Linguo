    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u11-boshuu
    prompt:
      stem: Từ nào có nghĩa là “tuyển, chiêu mộ”?
      stem_lang: vi
      options:
        - id: aa9
          text: 退職
          lang: ja
        - id: cc7
          text: 終了
          lang: ja
        - id: h1x
          text: 昇進
          lang: ja
        - id: r4h
          text: 募集
          lang: ja
    answer:
      correct_option_id: r4h
    explanation:
      vi: 募集 là tuyển. 退職 là nghỉ việc, 終了 là kết thúc, 昇進 là thăng chức.
    display_answer: 募集
  - key: ja:exercise:n3-employment-a2
