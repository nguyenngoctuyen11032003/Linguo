          lang: ja
        - id: rrk
          text: 決勝戦で募集して、優勝しました
          lang: ja
        - id: s3f
          text: 決勝戦で退職して、優勝しました
          lang: ja
    answer:
      correct_option_id: xsf
    explanation:
      vi: 勝つ - thắng. 優勝する - vô địch.
    display_answer: 決勝戦で勝って、優勝しました
