key: ja:lesson:n3-passive
order_index: 1
level: n3
title:
  vi: Được khen, bị mắng - thể bị động ～(ら)れる
objectives:
  - vi: Chia thể bị động của ba nhóm động từ.
  - vi: Kể chuyện mình được khen, bị mắng, được nhờ với người làm hành động đánh dấu bằng に.
  - vi: Dùng ～によって trong câu bị động mang tính thông tin (ai xây, ai viết, ai phát minh).
estimated_minutes: 18
skills: [grammar, speaking, reading]
prerequisites: [ja:lesson:n3-conditions-review]
items:
  - item: ja:item:n3-gram-passive
  - item: ja:item:n3-gram-niyotte
  - item: ja:item:n3-homeru
