      - answer: 友だちを1時間も待たせました。
        feedback_vi: Câu này là "tôi bắt bạn chờ một tiếng". Bạn là người phải chờ - 待たされました.
        error_tag: causative_passive_needed
    explanation:
      vi: 待つ → 待たされる (bị bắt chờ); 1時間も - đến cả một tiếng (も nhấn mạnh nhiều).
    display_answer: 友だちに1時間も待たされました。

