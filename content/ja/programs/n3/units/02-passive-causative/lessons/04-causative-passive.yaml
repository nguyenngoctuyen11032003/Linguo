  - key: ja:exercise:n3-causative-passive-mcq-three
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-gram-causative-passive
    prompt:
      stem: '「母に野菜を食べさせられた」 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: i4n, text: Tôi bị mẹ bắt ăn rau., lang: vi }
        - { id: u8d, text: Tôi bắt mẹ ăn rau., lang: vi }
        - { id: f2r, text: Rau của tôi bị mẹ ăn mất., lang: vi }
        - { id: c6g, text: Mẹ cho tôi ăn rau khi tôi muốn., lang: vi }
    answer:
      correct_option_id: i4n
