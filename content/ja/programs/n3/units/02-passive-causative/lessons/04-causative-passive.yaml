  - key: ja:exercise:n3-causative-passive-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-nomikai
    prompt:
      source_text: 新入社員のころ、飲み会でよく歌を歌わされました。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Hồi còn là nhân viên mới, tôi hay bị bắt hát ở các buổi nhậu.
        - Hồi là nhân viên mới, tôi hay bị bắt hát ở các buổi nhậu.
        - Hồi mới vào công ty, tôi hay bị bắt hát ở các buổi nhậu.
        - Hồi còn là nhân viên mới, ở các buổi nhậu tôi hay bị bắt hát.
        - Hồi là nhân viên mới, ở buổi nhậu tôi thường bị bắt hát.
        - Khi còn là nhân viên mới, tôi thường bị bắt hát ở các buổi nhậu.
        - Khi là nhân viên mới, tôi hay bị bắt hát ở buổi nhậu.
        - Hồi còn là nhân viên mới, tôi thường bị bắt hát ở buổi nhậu.
        - Hồi còn là nhân viên mới, tôi hay bị bắt hát trong các buổi nhậu.
        - Thời còn là nhân viên mới, tôi hay bị bắt hát ở các buổi nhậu.
        - Hồi mới vào làm, tôi hay bị bắt hát ở các buổi nhậu.
        - Hồi còn là lính mới, tôi hay bị bắt hát ở các buổi nhậu.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Hồi còn là nhân viên mới, tôi hay bắt mọi người hát ở các buổi nhậu.
        feedback_vi: 歌わされました là bị bắt hát, không phải bắt người khác hát.
        error_tag: causative_passive_meaning
    explanation:
      vi: 新入社員のころ - hồi còn là nhân viên mới; 歌わされる - bị bắt hát (歌う → 歌わせる → 歌わされる); よく - hay, thường.
    display_answer: Hồi còn là nhân viên mới, tôi hay bị bắt hát ở các buổi nhậu.

