  - key: ja:exercise:n3-causative-passive-mcq-reply
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-causative-passive
    prompt:
      stem: 'Bạn bè hỏi: 「どうしてそんなに疲れているの?」 Bạn trả lời "Hôm qua bị bắt dọn cả cái kho".'
      stem_lang: vi
      options:
        - { id: h9t, text: 昨日、倉庫を全部片付けさせられたんだ。, lang: ja }
        - { id: a3k, text: 昨日、倉庫を全部片付けさせたんだ。, lang: ja }
        - { id: s7p, text: 昨日、倉庫が全部片付けたんだ。, lang: ja }
        - { id: b1w, text: 昨日、倉庫を全部片付けられたんだ。, lang: ja }
    answer:
