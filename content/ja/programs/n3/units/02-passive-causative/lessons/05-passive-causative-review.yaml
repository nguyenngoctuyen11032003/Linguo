title:
  vi: "Ôn tập: bài giới thiệu, tin ngắn và chuyện kể"
objectives:
  - vi: Đọc hiểu đoạn giới thiệu địa danh và tin ngắn dùng bị động mang tính thông tin.
  - vi: Kể lại một trải nghiệm có cả bị động, sai khiến và bị động sai khiến.
  - vi: Nhận ra ai làm gì với ai trong câu dài.
estimated_minutes: 22
skills: [reading, grammar, writing]
prerequisites: [ja:lesson:n3-causative-passive]
