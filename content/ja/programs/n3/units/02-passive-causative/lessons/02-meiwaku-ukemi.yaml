key: ja:lesson:n3-meiwaku-ukemi
order_index: 2
level: n3
title:
  vi: Bị mưa, bị giẫm chân - bị động "bị làm phiền"
objectives:
  - vi: Kể chuyện xui xẻo bằng bị động gián tiếp - 雨に降られた, 隣の人に騒がれた.
  - vi: Giữ を cho đồ vật, bộ phận cơ thể của mình - 足を踏まれた, 財布を盗まれた.
  - vi: Tránh lối dịch từng chữ "chân tôi bị giẫm" thành 私の足が踏まれた.
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n3-passive]
