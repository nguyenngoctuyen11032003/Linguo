key: ja:lesson:n3-causative
order_index: 3
level: n3
title:
  vi: Bắt làm, cho làm, xin phép - thể sai khiến ～(さ)せる
objectives:
  - vi: Chia thể sai khiến của ba nhóm động từ.
  - vi: Nói "bắt ai làm" và "cho phép ai làm"; "làm ai lo, làm ai cười".
  - vi: Xin phép lịch sự bằng ～(さ)せてください / ～(さ)せていただけませんか.
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n3-meiwaku-ukemi]
