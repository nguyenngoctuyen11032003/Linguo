  - key: ja:exercise:n3-causative-mcq-wrong
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-causative
    prompt:
      stem: Câu nào KHÔNG phù hợp khi nói ở công ty?
      stem_lang: vi
      options:
        - { id: x5k, text: 部長にこの書類を読ませました。, lang: ja }
        - { id: g2e, text: 新入社員にコピーをさせました。, lang: ja }
        - { id: i9c, text: 部長にこの書類を読んでいただきました。, lang: ja }
        - { id: m6s, text: この件は私に担当させてください。, lang: ja }
    answer:
      correct_option_id: x5k
    explanation:
      vi: Thể sai khiến thể hiện người trên bắt người dưới; "bắt trưởng phòng đọc" là thất lễ. Với sếp dùng ～ていただきました. Hai câu còn lại (giao việc cho nhân viên mới, xin phụ trách) đều tự nhiên.
    display_answer: 部長にこの書類を読ませました。
