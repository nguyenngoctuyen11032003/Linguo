  - key: ja:exercise:n3-causative-mcq-yasumasete
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-sasete-kudasai
    prompt:
      stem: Bạn muốn xin sếp cho nghỉ ngày mai. Chọn cách nói đúng.
      stem_lang: vi
      options:
        - { id: c2n, text: 明日、休ませてください。, lang: ja }
        - { id: l7y, text: 明日、休んでください。, lang: ja }
        - { id: z4o, text: 明日、休まれてください。, lang: ja }
        - { id: a9g, text: 明日、休みさせてください。, lang: ja }
    answer:
      correct_option_id: c2n
    explanation:
      vi: Xin cho mình nghỉ - 休む → 休ませる + てください. 休んでください là bảo sếp nghỉ; hai dạng còn lại sai.
    display_answer: 明日、休ませてください。

  - key: ja:exercise:n3-causative-fill-narawasete
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-naraigoto
    prompt:
      template: "子どもにピアノを{{b1}}います。(習う)"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - "Nghĩa: Tôi đang cho con học piano."
        - "Gợi ý: 習う đuôi う → わ + せる, rồi chia thể て."
    answer:
      blanks:
        b1: [習わせて, ならわせて]
    known_wrong:
      - answer: 習あせて
        feedback_vi: Động từ đuôi う đổi thành わ, không phải あ - 習わせる.
        error_tag: causative_form
      - answer: 習われて
        feedback_vi: 習われる là bị động. "Cho con học" dùng sai khiến 習わせる.
        error_tag: passive_causative
    explanation:
      vi: 習う → 習わせる → 習わせています (đang cho học). Người được cho học (子ども) + に, môn học (ピアノ) + を.
    display_answer: 子どもにピアノを習わせています。

  - key: ja:exercise:n3-causative-wb-shinpai
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-shinpai-suru
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Tôi đã làm bố mẹ lo lắng.\""
      tokens:
        - { id: q3, text: 心配させてしまいました }
        - { id: q4, text: 心配してしまいました }
        - { id: q1, text: 両親を }
    answer:
      orders:
        - [q1, q3]
    explanation:
      vi: Bố mẹ lo vì mình - thể sai khiến 心配させる với を. 両親を心配してしまいました nghĩa là "tôi lỡ lo cho bố mẹ".
    display_answer: 両親を心配させてしまいました。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-causative-fill-two
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-causative
    prompt:
      template: "先生は学生に作文を{{b1}}。それから、意見を{{b2}}。(書く / 言う)"
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [書かせました, かかせました, 書かせた, かかせた]
        b2: [言わせました, いわせました, 言わせた, いわせた]
    known_wrong:
      - answer: 書かれました
        feedback_vi: 書かれる là bị động. Thầy bắt học sinh viết - sai khiến 書かせる.
        error_tag: passive_causative
      - answer: 言あせました
        feedback_vi: Đuôi う đổi thành わ - 言わせる.
        error_tag: causative_form
    explanation:
      vi: 書く → 書かせる; 言う → 言わせる. Thầy (người ra lệnh) は, học sinh (người làm) に.
    display_answer: 先生は学生に作文を書かせました。それから、意見を言わせました。

