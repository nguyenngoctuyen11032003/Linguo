        - { id: v1q, text: 部長に説明させてください。, lang: ja }
        - { id: d8p, text: 私が説明されてください。, lang: ja }
        - { id: n3j, text: 部長、説明してください。, lang: ja }
    answer:
      correct_option_id: b6w
    explanation:
      vi: Xin phép cho mình làm - 説明させていただけませんか (rất lịch sự). Câu 部長に説明させて là bắt trưởng phòng giải thích; 説明されてください sai; câu cuối là nhờ sếp giải thích.
    display_answer: 私に説明させていただけませんか。

