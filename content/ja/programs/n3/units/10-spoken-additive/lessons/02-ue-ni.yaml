  - key: ja:exercise:n3-ue-ni-koto-kara-u8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u10-gram-te-irai
    prompt:
      source_text: Từ khi đến Nhật tôi học tiếng Nhật mỗi ngày.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 日本へ来て以来、毎日日本語を勉強しています。
        - 日本に来て以来、毎日日本語を勉強しています。
        - にほんへきていらい、まいにちにほんごをべんきょうしています。
        - 日本へ来て以来毎日日本語を勉強しています。
    known_wrong:
      - answer: 日本へ来て以来、毎日日本語を勉強します。
        feedback_vi: て以来 đi với hiện tại hoàn thành (勉強しています) hoặc thì quá khứ.
        error_tag: tense
    explanation:
      vi: V て + 以来 - kể từ khi; 勉強しています - đang học (liên tục).
    display_answer: 日本へ来て以来、毎日日本語を勉強しています。
  - key: ja:exercise:n3-ue-ni-koto-kara-u9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-u10-riyuu
    prompt:
      source_text: 遅れた理由を説明してください。電車が止まったことから、遅れたのでしょう。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Xin hãy giải thích lý do đến muộn. Có lẽ vì tàu dừng nên bạn bị muộn.
        - Hãy giải thích lý do bạn muộn. Từ việc tàu dừng, chắc là vì thế mà bạn đến muộn.
        - Xin giải thích lý do chậm trễ. Do tàu dừng nên chắc bạn đã muộn.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Xin hãy giải thích lý do đến sớm. Có lẽ vì tàu chạy nhanh nên bạn đến sớm.
        feedback_vi: 遅れた là muộn.
        error_tag: meaning
    explanation:
      vi: 遅れた理由 - lý do muộn; 止まったことから - vì việc tàu dừng; のでしょう - có lẽ.
    display_answer: Xin hãy giải thích lý do đến muộn. Có lẽ vì tàu dừng nên bạn bị muộn.
