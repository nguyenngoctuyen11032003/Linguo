body:
  - type: objective
    text:
      vi: Sau bài này, bạn lập luận chặt chẽ hơn - この店は安いうえに、おいしいです。足跡があったことから、犯人が分かりました。もし宝くじが当たったとしたら...
  - type: explain
    text:
      vi: '～うえに = "hơn nữa, thêm vào đó": cộng thêm một điều cùng chiều với điều trước (tốt + tốt, xấu + xấu). Thể thường + うえに; N の / Na な + うえに. Ví dụ この店は安いうえに、おいしいです.'
  - type: explain
    text:
      vi: '～ことから = "từ việc ... mà ...": nêu căn cứ để kết luận hoặc nguồn gốc của tên gọi. Ví dụ 足跡が残っていたことから、犯人が分かりました. Gần với ～から nhưng trang trọng, có tính suy luận.'
  - type: explain
    text:
      vi: '～としたら / ～とすれば = "giả sử ... thì ...": giả định một điều chưa chắc rồi nói hệ quả. ～て以来 = "từ khi ... đến nay": khoảng thời gian dài liên tục. ～に関して / に関する = "liên quan đến ..." (trang trọng).'
  - type: deep_explain
    text:
      vi: "So sánh ～たら (nếu, khả năng thực tế) với ～としたら (giả sử, thường điều khó xảy ra hoặc chưa chắc). ～て以来 thường đi với phủ định hoặc trạng thái liên tục: 日本へ来て以来、一度も国へ帰っていません. Từ vựng đi kèm - 以上 (trên đây, từ ... trở lên), 以下 (sau đây, từ ... trở xuống), 目的 (mục đích), 原因 (nguyên nhân), 結果 (kết quả), 理由 (lý do)."
  - type: example
    target: この店は安いうえに、おいしいです。
    target_lang: ja
    translation:
      vi: Quán này vừa rẻ lại còn ngon.
    note:
      vi: うえに - hơn nữa.
  - type: example
    target: 足跡が残っていたことから、犯人が分かりました。
    target_lang: ja
    translation:
      vi: Nhờ dấu chân còn lại mà đã tìm ra thủ phạm.
    note:
      vi: ことから - căn cứ.
  - type: example
    target: もし宝くじが当たったとしたら、何をしますか。
    target_lang: ja
    translation:
      vi: Giả sử trúng xổ số thì bạn sẽ làm gì?
    note:
      vi: としたら - giả sử.
  - type: example
    target: 日本へ来て以来、毎日日本語を勉強しています。
    target_lang: ja
    translation:
      vi: Từ khi đến Nhật tôi học tiếng Nhật mỗi ngày.
    note:
      vi: て以来 - kể từ khi.
  - type: common_mistake
    wrong: この店は安いうえに、高いです。
    right: この店は安いうえに、おいしいです。
    target_lang: ja
    note:
      vi: うえに nối hai điều cùng chiều; "rẻ" và "đắt" mâu thuẫn.
  - type: common_mistake
    wrong: 日本へ来て以来、来月、国へ帰ります。
    right: 日本へ来て以来、一度も国へ帰っていません。
    target_lang: ja
    note:
      vi: て以来 mô tả khoảng thời gian liên tục từ đó đến hiện tại, không đi với tương lai (来月).
  - type: summary
    points:
      - vi: うえに - hơn nữa (cùng chiều).
      - vi: ことから - từ việc ... mà ...
      - vi: としたら / とすれば - giả sử.
      - vi: て以来 - kể từ khi · に関して / に関する - liên quan đến.
exercises:
  - key: ja:exercise:n3-ue-ni-koto-kara-u1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u10-gram-ue-ni
    prompt:
      stem: Chọn câu đúng - この店は安い___、おいしいです。
      stem_lang: vi
      options:
        - id: jeo
          text: うえに
          lang: ja
        - id: kc6
          text: ことから
          lang: ja
        - id: lgw
          text: としたら
          lang: ja
        - id: j8l
          text: て以来
          lang: ja
    answer:
      correct_option_id: jeo
    explanation:
      vi: うえに - hơn nữa (cùng chiều tốt). ことから là căn cứ, としたら là giả sử, て以来 là kể từ khi.
    display_answer: うえに
