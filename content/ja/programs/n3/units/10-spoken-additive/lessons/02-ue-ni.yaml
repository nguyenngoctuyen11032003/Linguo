key: ja:lesson:n3-ue-ni-koto-kara
order_index: 2
level: n3
title:
  vi: Bổ sung, căn cứ, giả định - ～うえに・～ことから・～としたら・～て以来
objectives:
  - vi: Nói "hơn nữa" bằng ～うえに và nêu căn cứ bằng ～ことから.
  - vi: Nói giả định bằng ～としたら / とすれば và khoảng thời gian bằng ～て以来.
  - vi: Nêu chủ đề bằng ～に関して / に関する và dùng 以上, 以下, 目的, 原因, 結果, 理由.
estimated_minutes: 18
skills:
  - grammar
  - vocabulary
  - reading
  - speaking
prerequisites:
  - ja:lesson:n3-spoken-contractions
