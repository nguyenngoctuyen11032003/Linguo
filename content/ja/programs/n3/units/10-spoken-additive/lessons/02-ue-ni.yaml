  - key: ja:exercise:n3-ue-ni-koto-kara-u11
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u10-mokuteki
    prompt:
      stem: Bạn muốn hỏi mục đích chuyến đi. Câu nào đúng?
      stem_lang: vi
      options:
        - id: xht
          text: 旅行の以上は何ですか。
          lang: ja
        - id: cxf
          text: 旅行の原因は何ですか。
          lang: ja
        - id: yc5
          text: 旅行の結果は何ですか。
          lang: ja
        - id: gqi
          text: 旅行の目的は何ですか。
