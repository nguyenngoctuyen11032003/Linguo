  - key: ja:exercise:n3-city-office-mcq-kinyuu
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-kinyuu
    prompt:
      stem: Nhân viên đưa bạn một tờ đơn và bảo điền thông tin. Câu nào nhân viên có thể nói?
      stem_lang: vi
      options:
        - { id: n2v, text: こちらの用紙にご記入ください。, lang: ja }
        - { id: g7c, text: こちらの用紙をご記入いたします。, lang: ja }
        - { id: u4b, text: こちらの用紙に記入されてください。, lang: ja }
        - { id: i9t, text: こちらの用紙でご記入になります。, lang: ja }
    answer:
      correct_option_id: n2v
    explanation:
      vi: ご + từ Hán + ください - ご記入ください (xin vui lòng điền). ご記入いたします là "tôi sẽ điền" (khiêm nhường); 記入されてください không tự nhiên; ご記入になります là trần thuật, không phải lời nhờ.
    display_answer: こちらの用紙にご記入ください。
