title:
  vi: Ở uỷ ban thành phố - ～について và ～場合は
objectives:
  - vi: Nắm từ vựng thủ tục hành chính - 市役所, 手続き, 窓口, 住民票, 在留カード, 記入する.
  - vi: Hỏi về một thủ tục bằng ～について.
  - vi: Hiểu và dùng hướng dẫn dạng ～場合は.
