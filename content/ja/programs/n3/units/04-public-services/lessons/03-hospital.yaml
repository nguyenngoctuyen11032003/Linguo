  - key: ja:exercise:n3-hospital-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-hokenshou
    prompt:
      stem: Bạn quên mang thẻ bảo hiểm khi đi khám. Nhân viên quầy nói gì?
      stem_lang: vi
      options:
        - { id: k5x, text: 保険証がない場合は、今日は全額お支払いいただきます。, lang: ja }
        - { id: v1d, text: 保険証がない場合は、薬が無料になります。, lang: ja }
        - { id: n7q, text: 保険証がない場合は、処方箋を記入してください。, lang: ja }
        - { id: i3s, text: 保険証がない場合は、診察が早くなります。, lang: ja }
    answer:
