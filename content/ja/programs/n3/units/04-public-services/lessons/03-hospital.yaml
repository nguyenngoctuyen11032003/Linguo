  - key: ja:exercise:n3-hospital-mcq-shoujou
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-shoujou
    prompt:
      stem: 'Bác sĩ hỏi: どんな症状がありますか。 Câu trả lời nào phù hợp?'
      stem_lang: vi
      options:
        - { id: o6p, text: 昨日から熱があって、咳も出ます。, lang: ja }
        - { id: e3t, text: 保険証を持ってきました。, lang: ja }
        - { id: l9g, text: 薬局はあちらです。, lang: ja }
        - { id: b4j, text: 診察は10時からです。, lang: ja }
    answer:
      correct_option_id: o6p
    explanation:
      vi: 症状 - triệu chứng. Trả lời bằng mô tả triệu chứng - 熱がある (sốt), 咳が出る (ho).
    display_answer: 昨日から熱があって、咳も出ます。

  - key: ja:exercise:n3-hospital-fill-hokenshou
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-hokenshou
    prompt:
      template: "受付で{{b1}}を出してください。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Hãy đưa thẻ bảo hiểm ở quầy tiếp đón."
        - "Gợi ý: 保険 (bảo hiểm) + 証 (giấy chứng)."
    answer:
      blanks:
        b1: [保険証, ほけんしょう]
    known_wrong:
      - answer: 処方箋
        feedback_vi: 処方箋 là đơn thuốc, nhận sau khi khám. Ở quầy tiếp đón đưa 保険証.
        error_tag: vocab_meaning
      - answer: ほけんしょ
        feedback_vi: しょう là âm dài - ほけんしょう.
        error_tag: long_vowel
    explanation:
      vi: 保険証 - thẻ bảo hiểm y tế, đưa ở quầy tiếp đón (受付) mỗi lần khám.
    display_answer: 受付で保険証を出してください。

  - key: ja:exercise:n3-hospital-wb-shohousen
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-shohousen
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Hãy cầm đơn thuốc này ra hiệu thuốc để lấy thuốc.\""
      tokens:
        - { id: d3, text: 薬局で }
        - { id: d1, text: この処方箋を持って、 }
        - { id: d5, text: 受付で }
        - { id: d4, text: 薬をもらってください }
    answer:
      orders:
        - [d1, d3, d4]
    explanation:
      vi: Đơn thuốc mang đến 薬局 (hiệu thuốc) để lấy thuốc. 受付 là quầy tiếp đón của phòng khám.
    display_answer: この処方箋を持って、薬局で薬をもらってください。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-hospital-fill-youni
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-you-ni-iu
    prompt:
      template: "医者に一日3回薬を{{b1}}ように言われました。(飲む)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [飲む, のむ]
    known_wrong:
      - answer: 飲んで
        feedback_vi: Trước ように dùng thể từ điển - 飲むように.
        error_tag: you_ni_form
      - answer: 飲みます
