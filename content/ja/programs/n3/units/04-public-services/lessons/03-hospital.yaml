    explanation:
      vi: 処方箋 - đơn thuốc. Thẻ bảo hiểm là 保険証, phiếu hỏi bệnh là 問診票, nhập viện là 入院.
    display_answer: đơn thuốc

  - key: ja:exercise:n3-hospital-listen-youniiu
