  - key: ja:exercise:n3-hospital-mcq-report
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-you-ni-iu
    prompt:
      stem: 'Bác sĩ nói với bạn: 「一週間、運動はしないでください。」 Về nhà bạn kể lại cho bạn cùng phòng. Câu nào đúng?'
      stem_lang: vi
      options:
        - { id: r2c, text: 一週間、運動しないように言われたよ。, lang: ja }
        - { id: m6u, text: 一週間、運動するように言われたよ。, lang: ja }
        - { id: z4f, text: 一週間、運動しないように言ったよ。, lang: ja }
        - { id: g8h, text: 一週間、運動しないでくださいように言われたよ。, lang: ja }
    answer:
      correct_option_id: r2c
    explanation:
      vi: しないでください → しないように; bác sĩ nói với mình → 言われた. 言った là mình nói; するように ngược nghĩa.
    display_answer: 一週間、運動しないように言われたよ。

