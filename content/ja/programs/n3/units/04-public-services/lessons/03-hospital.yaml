        error_tag: you_ni_form
    explanation:
      vi: V thể từ điển + ように言われる - được dặn làm gì. Lời gốc là 「一日3回薬を飲んでください」.
    display_answer: 医者に一日3回薬を飲むように言われました。

  - key: ja:exercise:n3-hospital-translate-shoujou
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-shoujou
    prompt:
      source_text: Tôi sốt từ 3 ngày trước, họng cũng đau. (lịch sự)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 3日前から熱があって、喉も痛いです。
        - 3日前から熱があって喉も痛いです。
        - 三日前から熱があって、喉も痛いです。
        - 三日前から熱があって喉も痛いです。
        - 3日前から熱があり、喉も痛いです。
        - 三日前から熱があり、喉も痛いです。
        - 3日前から熱があって、のども痛いです。
        - 三日前から熱があって、のども痛いです。
        - 3日前から熱があります。喉も痛いです。
        - 三日前から熱があります。喉も痛いです。
        - 3日前から熱が出て、喉も痛いです。
        - みっかまえからねつがあって、のどもいたいです。
    known_wrong:
      - answer: 3日前に熱があって、喉も痛いです。
        feedback_vi: Nghĩa "từ 3 ngày trước (đến giờ)" dùng から; 前に chỉ một thời điểm.
        error_tag: kara_ni
      - answer: 3日前から熱がして、喉も痛いです。
        feedback_vi: Sốt là 熱がある (hoặc 熱が出る), không dùng 熱がする.
        error_tag: collocation
    explanation:
      vi: 3日前から - từ 3 ngày trước; 熱がある - sốt; 喉も痛い - họng cũng đau. Nối hai câu bằng thể て.
    display_answer: 3日前から熱があって、喉も痛いです。

  - key: ja:exercise:n3-hospital-translate-youni
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-you-ni-iu
    prompt:
      source_text: Tôi bị bác sĩ dặn không được uống rượu. (lịch sự)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 医者にお酒を飲まないように言われました。
        - 医者に酒を飲まないように言われました。
        - お医者さんにお酒を飲まないように言われました。
        - 医者からお酒を飲まないように言われました。
        - お医者さんからお酒を飲まないように言われました。
        - 医者にお酒を飲まないように注意されました。
