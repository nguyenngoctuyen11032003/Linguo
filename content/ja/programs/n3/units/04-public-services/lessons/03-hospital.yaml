key: ja:lesson:n3-hospital
order_index: 3
level: n3
title:
  vi: Đi khám bệnh - ～ように言われる
objectives:
  - vi: Nắm từ vựng khám bệnh - 保険証, 症状, 診察, 処方箋.
  - vi: Mô tả triệu chứng với bác sĩ.
  - vi: Thuật lại lời dặn của bác sĩ bằng ～ように言われました.
estimated_minutes: 18
skills: [vocabulary, grammar, speaking]
prerequisites: [ja:lesson:n3-bank]
