  - key: ja:exercise:n3-bank-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-hikidasu
    prompt:
      stem: Bạn muốn rút tiền nhưng không biết cây ATM gần nhất. Bạn hỏi người qua đường thế nào?
      stem_lang: vi
      options:
        - { id: t8b, text: すみません、お金を下ろしたいんですが、この近くにATMはありますか。, lang: ja }
        - { id: o3n, text: すみません、お金を振り込みたいんですが、この近くに口座はありますか。, lang: ja }
        - { id: d6y, text: すみません、お金を貸したいんですが、この近くにATMはありますか。, lang: ja }
