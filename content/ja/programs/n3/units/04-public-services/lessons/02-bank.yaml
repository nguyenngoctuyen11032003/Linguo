  - key: ja:exercise:n3-bank-mcq-youni
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-you-ni-purpose
    prompt:
      stem: 'Chọn từ đúng: 暗証番号を忘れない＿＿、手帳に書いておきました。'
      stem_lang: vi
      options:
        - { id: p4d, text: ように, lang: ja }
        - { id: y8k, text: ために, lang: ja }
        - { id: c1r, text: ことに, lang: ja }
        - { id: m5z, text: のに, lang: ja }
    answer:
      correct_option_id: p4d
    explanation:
      vi: 忘れない (không quên) là trạng thái mong muốn, không phải hành động chủ ý - dùng ように. のに là "mặc dù", ことに là "quyết định".
    display_answer: ように

  - key: ja:exercise:n3-bank-fill-kouza
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-kouza
    prompt:
      template: "銀行で{{b1}}を作りたいんですが、何が必要ですか。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Tôi muốn mở tài khoản ở ngân hàng, cần những gì ạ?"
        - "Gợi ý: 'tài khoản' - こうざ."
    answer:
      blanks:
        b1: [口座, こうざ]
    known_wrong:
      - answer: アカウント
        feedback_vi: アカウント là tài khoản đăng nhập web. Tài khoản ngân hàng là 口座.
        error_tag: vocab_meaning
      - answer: こざ
        feedback_vi: こう là âm dài - こうざ.
        error_tag: long_vowel
    explanation:
      vi: 口座を作る - mở tài khoản ngân hàng.
    display_answer: 銀行で口座を作りたいんですが、何が必要ですか。

  - key: ja:exercise:n3-bank-wb-furikomu
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-furikomu
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Tôi đã chuyển tiền nhà vào tài khoản của chủ nhà.\""
      tokens:
        - { id: f3, text: 大家さんの口座に }
        - { id: f4, text: 振り込みました }
        - { id: f5, text: 引き出しました }
        - { id: f1, text: 家賃を }
    answer:
      orders:
        - [f1, f3, f4]
        - [f3, f1, f4]
    explanation:
      vi: 家賃を (tiền nhà) + 大家さんの口座に (vào tài khoản chủ nhà) + 振り込みました (đã chuyển khoản). 引き出す là rút ra.
    display_answer: 家賃を大家さんの口座に振り込みました。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-bank-fill-hikidasu
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-hikidasu
    prompt:
      template: "コンビニのATMでお金を{{b1}}ました。(rút)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [引き出し, ひきだし, 下ろし, おろし, 引出し]
    known_wrong:
      - answer: 振り込み
        feedback_vi: 振り込む là chuyển khoản. Rút tiền là 引き出す / 下ろす.
        error_tag: vocab_meaning
      - answer: 取り
        feedback_vi: お金を取る nghe như "lấy (trộm) tiền". Rút tiền - 引き出す / 下ろす.
        error_tag: vocab_meaning
    explanation:
      vi: お金を引き出す / お金を下ろす - rút tiền. Thể ます - 引き出します / 下ろします.
    display_answer: コンビニのATMでお金を引き出しました。

