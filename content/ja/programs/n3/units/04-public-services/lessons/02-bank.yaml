level: n3
title:
  vi: Ở ngân hàng - ～ように (mục đích)
objectives:
  - vi: Nắm từ vựng ngân hàng - 口座, 振り込む, 引き出す, 手数料, 暗証番号.
  - vi: Nói mục đích bằng ～ように với thể khả năng, thể ない.
  - vi: Phân biệt ～ように và ～ために.
estimated_minutes: 18
skills: [vocabulary, grammar, speaking]
prerequisites: [ja:lesson:n3-city-office]
