body:
  - type: objective
    text:
      vi: Bài ôn tập luyện kỹ năng thực tế nhất khi sống ở Nhật - đọc お知らせ trên 掲示板 và tờ hướng dẫn của uỷ ban, rồi biết mình phải làm gì, trước khi nào.
  - type: explain
    text:
      vi: 'Thông báo thường có khung: tiêu đề (～のお知らせ), thời gian (日時), địa điểm (場所), đối tượng (対象), cách đăng ký (申し込み方法), hạn (期限 / 締め切り), liên hệ (問い合わせ). Đọc tiêu đề và các mục này trước.'
  - type: explain
    text:
      vi: 'Từ hay gặp: 申し込む (đăng ký), 提出する (nộp), 期限 (thời hạn), 必要なもの (đồ cần mang), 事前に (trước), 以内 (trong vòng), 以降 (từ... trở đi), ～までに (trước...).'
  - type: deep_explain
    text:
      vi: Văn thông báo dùng nhiều thể trang trọng - ～ずに, ～場合は, ～ことになっています, ご～ください, và bị động (回収されません). Gặp câu dài, hãy tìm đuôi câu trước để biết đây là yêu cầu (ください), quy định (ことになっています) hay cấm (できません / いけません).
  - type: example
    target: 掲示板に水道工事のお知らせが貼ってあります。
    target_lang: ja
    translation:
      vi: Trên bảng tin có dán thông báo sửa đường ống nước.
  - type: example
    target: 日本語教室に申し込みたいんですが、どうすればいいですか。
    target_lang: ja
    translation:
      vi: Tôi muốn đăng ký lớp tiếng Nhật, phải làm thế nào ạ?
  - type: example
    target: 申込書は今月20日までに窓口に提出してください。
    target_lang: ja
    translation:
      vi: Đơn đăng ký hãy nộp ở quầy trước ngày 20 tháng này.
  - type: example
    target: 在留カードの有効期限を確認してください。
    target_lang: ja
    translation:
      vi: Hãy kiểm tra thời hạn hiệu lực của thẻ cư trú.
  - type: common_mistake
    wrong: 日本語教室を申し込みました。
    right: 日本語教室に申し込みました。
    target_lang: ja
    note:
      vi: Đăng ký tham gia cái gì dùng に - 教室に申し込む. を dùng cho thứ được đăng ký như 参加を申し込む.
  - type: common_mistake
    wrong: 書類を窓口で提出してください。
    right: 書類を窓口に提出してください。
    target_lang: ja
    note:
      vi: 提出する hướng tới nơi nhận - dùng に. で chỉ nơi diễn ra hành động, nghe không tự nhiên với 提出.
  - type: summary
    points:
      - vi: 掲示板 (bảng tin), 申し込む (đăng ký), 提出する (nộp), 期限 (thời hạn).
      - vi: Đọc thông báo - tiêu đề, 日時, 場所, 申し込み方法, 締め切り.
      - vi: 教室に申し込む; 窓口に提出する.
      - vi: Ôn các mẫu ～について, ～場合は, ～ように, ～ことになっている, ～ずに.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n3-public-services-review-mcq-reading
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-keijiban
    prompt:
      stem: "Đọc thông báo trên bảng tin: 「水道工事のお知らせ　10月25日（水）9時～15時、工事のため水が使えません。事前に水をためておいてください。」 Cư dân cần làm gì?"
      stem_lang: vi
      options:
        - { id: h3w, text: Trữ sẵn nước trước ngày 25 tháng 10., lang: vi }
        - { id: n6z, text: Đăng ký sửa đường ống nước trước ngày 25., lang: vi }
        - { id: c1k, text: Không dùng nước sau 15 giờ ngày 25., lang: vi }
        - { id: v8p, text: Đến uỷ ban lấy nước vào ngày 25., lang: vi }
    answer:
      correct_option_id: h3w
    explanation:
      vi: 9時～15時、水が使えません - không dùng được nước từ 9 đến 15 giờ; 事前に水をためておいてください - hãy trữ nước sẵn từ trước.
    display_answer: Trữ sẵn nước trước ngày 25 tháng 10.

