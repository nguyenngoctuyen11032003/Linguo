  vi: "Ôn tập: đọc thông báo và hướng dẫn thủ tục"
objectives:
  - vi: Đọc hiểu thông báo ở bảng tin và hướng dẫn đăng ký của cơ quan.
  - vi: Tìm nhanh thông tin quan trọng - hạn, nơi nộp, giấy tờ cần mang.
  - vi: Ôn ～について, ～場合は, ～ように, ～ことになっている, ～ずに.
