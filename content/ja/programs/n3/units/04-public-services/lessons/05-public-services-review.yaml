  - key: ja:exercise:n3-public-services-review-mcq-reading2
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-kigen
    prompt:
      stem: "Đọc hướng dẫn: 「在留カードの期限が切れる3か月前から更新の申請ができます。期限が切れた場合は、すぐに入管に相談してください。」 Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: q7j, text: Có thể xin gia hạn từ 3 tháng trước khi thẻ hết hạn., lang: vi }
        - { id: u3c, text: Chỉ được xin gia hạn sau khi thẻ đã hết hạn., lang: vi }
        - { id: a9n, text: Thẻ hết hạn thì phải đợi 3 tháng mới được xin lại., lang: vi }
        - { id: d6t, text: Thẻ cư trú có hạn 3 tháng., lang: vi }
    answer:
      correct_option_id: q7j
    explanation:
      vi: 期限が切れる3か月前から - từ 3 tháng trước khi hết hạn; 更新の申請 - xin gia hạn. Nếu đã hết hạn thì 入管 (cục xuất nhập cảnh) cần được hỏi ngay.
    display_answer: Có thể xin gia hạn từ 3 tháng trước khi thẻ hết hạn.

