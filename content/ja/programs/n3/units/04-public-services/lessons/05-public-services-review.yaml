  - key: ja:exercise:n3-public-services-review-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-ni-tsuite
    prompt:
      stem: Bạn gọi đến uỷ ban để hỏi về lớp tiếng Nhật miễn phí đã thấy trên bảng tin. Câu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: r5h, text: 掲示板で見た日本語教室について伺いたいんですが。, lang: ja }
        - { id: i2w, text: 掲示板で見た日本語教室を申し込まれたいんですが。, lang: ja }
        - { id: g8x, text: 掲示板で見た日本語教室によって伺いたいんですが。, lang: ja }
        - { id: p4b, text: 掲示板で見た日本語教室についておっしゃりたいんですが。, lang: ja }
    answer:
      correct_option_id: r5h
    explanation:
      vi: について (về) + 伺いたい (khiêm nhường - muốn hỏi). 申し込まれたい sai dạng; によって là "bởi/tuỳ"; おっしゃる là tôn kính, không dùng cho mình.
    display_answer: 掲示板で見た日本語教室について伺いたいんですが。
