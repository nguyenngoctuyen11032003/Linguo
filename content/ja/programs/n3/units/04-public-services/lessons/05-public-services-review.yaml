  # ---------------- recall ----------------
  - key: ja:exercise:n3-public-services-review-fill-moushikomi
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-moushikomu
    prompt:
      template: "日本語教室に{{b1}}たいんですが、どうすればいいですか。(đăng ký)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [申し込み, もうしこみ, 申込み]
    known_wrong:
      - answer: 申し込む
        feedback_vi: Trước たい dùng dạng ます bỏ ます - 申し込み.
        error_tag: verb_conjugation
      - answer: 提出し
        feedback_vi: 提出する là nộp giấy tờ; đăng ký tham gia lớp là 申し込む.
        error_tag: vocab_meaning
    explanation:
      vi: 申し込む → 申し込みたい (muốn đăng ký). 教室に申し込む - đăng ký lớp.
    display_answer: 日本語教室に申し込みたいんですが、どうすればいいですか。

