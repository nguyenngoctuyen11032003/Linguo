title:
  vi: Quy định khu dân cư - ～ことになっている và ～ずに
objectives:
  - vi: Hiểu quy định đổ rác và sơ tán khi có thiên tai.
  - vi: Nói quy định bằng ～ことになっている.
  - vi: Dùng ～ずに (= ～ないで) trong văn hướng dẫn.
