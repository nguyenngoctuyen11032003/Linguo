  - key: ja:exercise:n3-local-rules-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-moeru-gomi
    prompt:
      stem: Hàng xóm nhắc bạn vì bạn để chai nhựa vào túi rác cháy được. Họ nói gì?
      stem_lang: vi
      options:
        - { id: y3f, text: ペットボトルは燃えるゴミに入れないことになっていますよ。, lang: ja }
        - { id: l8r, text: ペットボトルは燃えるゴミに入れることになっていますよ。, lang: ja }
        - { id: o1w, text: ペットボトルは粗大ごみに申し込むことになっていますよ。, lang: ja }
        - { id: g5k, text: ペットボトルは燃えるゴミに入れずにことになっていますよ。, lang: ja }
    answer:
      correct_option_id: y3f
    explanation:
      vi: Quy định "không bỏ vào" - 入れないことになっています. ずに không đứng trước こと; chai nhựa không phải rác cồng kềnh.
    display_answer: ペットボトルは燃えるゴミに入れないことになっていますよ。
