  - key: ja:exercise:n3-local-rules-mcq-kotoninatteiru
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-koto-ni-natte-iru
    prompt:
      stem: 'Giải thích nội quy chung cư cho người mới: このマンションでは、ペットを飼わない＿＿。'
      stem_lang: vi
      options:
        - { id: k2d, text: ことになっています, lang: ja }
        - { id: z7h, text: ことにしています, lang: ja }
        - { id: a4c, text: ようにしています, lang: ja }
        - { id: m8w, text: ことになりました, lang: ja }
    answer:
      correct_option_id: k2d
    explanation:
      vi: Nội quy đang áp dụng - ことになっています. ことにしています / ようにしています là thói quen cá nhân; ことになりました là quyết định mới vừa có.
    display_answer: ことになっています

  - key: ja:exercise:n3-local-rules-fill-sezuni
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-zuni
    prompt:
      template: "ゴミを分別{{b1}}出すと、回収されません。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Nếu đem rác ra mà không phân loại thì sẽ không được thu gom."
        - "Gợi ý: する → dạng ずに đặc biệt."
    answer:
      blanks:
        b1: [せずに]
    known_wrong:
      - answer: しずに
        feedback_vi: する → せずに, không phải しずに.
        error_tag: zuni_suru
      - answer: しないで
        feedback_vi: 分別しないで cũng đúng nghĩa, nhưng bài này luyện dạng trang trọng ずに - せずに.
        error_tag: zuni_naide
    explanation:
      vi: ～ずに = ～ないで. する → せずに; 分別せずに - mà không phân loại.
    display_answer: ゴミを分別せずに出すと、回収されません。

  - key: ja:exercise:n3-local-rules-wb-moeru
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-moeru-gomi
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Rác cháy được đem ra vào sáng thứ Hai và thứ Năm.\""
      tokens:
        - { id: b3, text: 出します }
