    answer:
      orders:
        - [b1, b2, b3]
    explanation:
      vi: 燃えるゴミ - rác cháy được; 燃えないゴミ - rác không cháy được (ngược nghĩa).
    display_answer: 燃えるゴミは月曜日と木曜日の朝に出します。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-local-rules-fill-bunbetsu
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-bunbetsu
    prompt:
      template: "ゴミはきちんと{{b1}}して出してください。(phân loại)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [分別, ぶんべつ]
    known_wrong:
      - answer: ふんべつ
        feedback_vi: Phân loại rác đọc ぶんべつ; ふんべつ là "sự chín chắn".
        error_tag: reading
      - answer: 分類
        feedback_vi: 分類 là phân loại nói chung (khoa học, tài liệu); với rác người Nhật dùng 分別.
        error_tag: collocation
    explanation:
      vi: ゴミを分別する - phân loại rác. Đọc ぶんべつ.
    display_answer: ゴミはきちんと分別して出してください。

