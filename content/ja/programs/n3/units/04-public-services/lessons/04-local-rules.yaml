      stem_lang: vi
      options:
        - { id: w8e, text: 粗大ごみ, lang: ja }
        - { id: c4n, text: 燃えるゴミ, lang: ja }
        - { id: j1p, text: 資源ごみ, lang: ja }
        - { id: t6s, text: 生ゴミ, lang: ja }
    answer:
      correct_option_id: w8e
    explanation:
      vi: Đồ nội thất lớn là 粗大ごみ (rác cồng kềnh) - phải đăng ký trước. 資源ごみ là chai, lon; 生ゴミ là rác bếp.
    display_answer: 粗大ごみ

