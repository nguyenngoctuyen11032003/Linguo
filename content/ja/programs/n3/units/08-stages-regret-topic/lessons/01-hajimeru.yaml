key: ja:lesson:n3-hajimeru
order_index: 1
level: n3
title:
  vi: Giai đoạn của hành động - ～始める・～出す・～続ける・～終わる
objectives:
  - vi: Nói bắt đầu, tiếp tục, xong một việc bằng V ます-gốc + 始める / 出す / 続ける / 終わる.
  - vi: Phân biệt 始める (có ý chí) và 出す (đột ngột).
  - vi: Dùng 突然, 次第に, 以前, 現在, やがて để kể diễn biến.
estimated_minutes: 17
skills:
  - grammar
  - vocabulary
  - reading
  - speaking
prerequisites:
  - ja:lesson:n3-emphasis-degree-review
