      options:
        - id: a4z
          text: Suýt nữa tôi đến muộn nhưng đã kịp giờ sát nút.
          lang: vi
        - id: fmr
          text: Tôi đến muộn nên không kịp.
          lang: vi
        - id: foi
          text: Tôi quên mất giờ nên đến muộn.
          lang: vi
        - id: irt
