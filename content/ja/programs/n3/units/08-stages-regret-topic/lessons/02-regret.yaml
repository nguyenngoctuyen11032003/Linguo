key: ja:lesson:n3-regret
order_index: 2
level: n3
title:
  vi: Hối tiếc và suýt nữa - ～ところだった・～ばよかった・～ずに済む
objectives:
  - vi: Nói suýt nữa xảy ra bằng V辞書形 / V ない + ところだった.
  - vi: Nói hối tiếc bằng ～ばよかった / ～なければよかった.
  - vi: Nói không phải làm gì bằng ～ずに / ないで + 済む.
estimated_minutes: 17
skills:
  - grammar
  - vocabulary
  - speaking
  - listening
prerequisites:
  - ja:lesson:n3-hajimeru
items:
  - item: ja:item:n3-u8-gram-tokoro-datta
  - item: ja:item:n3-u8-gram-ba-yokatta
  - item: ja:item:n3-u8-gram-zu-ni-sumu
  - item: ja:item:n3-u8-ayauku
  - item: ja:item:n3-u8-koukai
