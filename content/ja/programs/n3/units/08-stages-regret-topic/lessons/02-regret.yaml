        feedback_vi: 反省 là tự kiểm điểm; "hối hận" là 後悔.
        error_tag: vocab_meaning
    explanation:
      vi: 後悔 - hối hận.
    display_answer: あの時、断らなかったことを後悔しています。
  - key: ja:exercise:n3-regret-r8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u8-gram-tokoro-datta
    prompt:
      source_text: Suýt nữa tôi lỡ chuyến tàu.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - もう少しで電車に乗り遅れるところでした。
        - 危うく電車に乗り遅れるところでした。
        - もうすこしででんしゃにのりおくれるところでした。
        - 電車に乗り遅れるところでした。
        - もう少しで電車に乗り遅れるところだった。
    known_wrong:
      - answer: 電車に乗り遅れるところです。
        feedback_vi: ところです là "sắp" (chưa xảy ra); "suýt nữa" dùng ところでした.
        error_tag: tense
    explanation:
      vi: もう少しで / 危うく + V辞書形 + ところだった.
    display_answer: もう少しで電車に乗り遅れるところでした。
  - key: ja:exercise:n3-regret-r9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-u8-gram-zu-ni-sumu
    prompt:
      source_text: 友達が手伝ってくれたので、残業しないで済みました。もっと早く頼めばよかったです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Bạn giúp tôi nên tôi không phải làm thêm giờ. Giá mà tôi đã nhờ sớm hơn.
        - Vì bạn giúp nên tôi không phải tăng ca. Giá mà tôi nhờ sớm hơn.
        - Nhờ bạn giúp mà tôi không phải làm thêm giờ. Giá như nhờ sớm hơn thì tốt.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Bạn giúp tôi nên tôi phải làm thêm giờ. Giá mà tôi đã nhờ sớm hơn.
        feedback_vi: 済みました nghĩa là xong suôn sẻ, không phải phải làm.
        error_tag: meaning
    explanation:
      vi: 残業しないで済んだ - không phải làm thêm giờ; 頼めばよかった - giá mà nhờ sớm hơn.
    display_answer: Bạn giúp tôi nên tôi không phải làm thêm giờ. Giá mà tôi đã nhờ sớm hơn.
