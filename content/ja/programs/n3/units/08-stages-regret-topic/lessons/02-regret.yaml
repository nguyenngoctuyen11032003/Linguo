    display_answer: Suýt nữa tôi đến muộn nhưng đã kịp giờ sát nút.
  - key: ja:exercise:n3-regret-r4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u8-gram-zu-ni-sumu
    prompt:
      template: 雨がやんだので、傘を買わ{{b1}}済みました。 (Vì mưa tạnh nên tôi không phải mua ô.)
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Dạng ず của ない.
        - Bắt đầu bằng ず.
    answer:
      blanks:
        b1:
          - ずに
          - ないで
    explanation:
      vi: V ず(に) + 済む - không phải làm.
    display_answer: 雨がやんだので、傘を買わずに済みました。
