      stem: Từ nào có nghĩa là “sơ ý, lơ đễnh”?
      stem_lang: vi
      options:
        - id: ikn
          text: 次第に
          lang: ja
        - id: mkz
          text: 突然
          lang: ja
        - id: bje
          text: うっかり
          lang: ja
        - id: gi5
          text: ぎりぎり
          lang: ja
    answer:
      correct_option_id: bje
    explanation:
      vi: うっかり là sơ ý. ぎりぎり là sát nút, 突然 là đột nhiên, 次第に là dần dần.
    display_answer: うっかり
  - key: ja:exercise:n3-regret-r6
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u8-gram-ba-yokatta
    prompt:
      template: あんなに食べ{{b1}}よかった。 (Giá mà tôi đã không ăn nhiều như thế.)
      blanks:
        - id: b1
          width_hint: 5
    answer:
      blanks:
        b1:
          - なければ
    known_wrong:
      - answer: ば
        feedback_vi: Phủ định cần なければ trước よかった.
        error_tag: form
      - answer: なくて
        feedback_vi: なくてよかった nghĩa là "mừng vì không...", không phải hối tiếc.
        error_tag: form
    explanation:
      vi: V なければ + よかった - giá mà không ...
    display_answer: あんなに食べなければよかった。
  - key: ja:exercise:n3-regret-r7
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-u8-koukai
    prompt:
      template: あの時、断らなかったことを{{b1}}しています。 (Tôi hối hận vì lúc đó đã không từ chối.)
      blanks:
        - id: b1
          width_hint: 3
    answer:
