  - item: ja:item:n3-u8-ukkari
body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được chuyện suýt gặp nạn, hối tiếc và may mắn không phải làm - 危うく遅刻するところでした。もっと早く寝ればよかった。傘を買わずに済みました。
  - type: explain
    text:
      vi: 'V辞書形 / V ない + ところだった = "suýt nữa thì...": sự việc không xảy ra. Thường đi với 危うく, もう少しで. Ví dụ もう少しで電車に乗り遅れるところでした. Chú ý khác với ところだ (đang/sắp làm).'
  - type: explain
    text:
      vi: 'V ば / V なければ + よかった = "giá mà..., giá mà không...": diễn tả hối tiếc về điều đã qua. Ví dụ もっと早く寝ればよかった (giá mà đã ngủ sớm hơn), あんなに食べなければよかった (giá mà không ăn nhiều như thế).'
  - type: explain
    text:
      vi: V ない / V ずに + 済む = "không cần phải, xong mà không phải ..." - 雨がやんだので、傘を買わずに済みました. Thường mang sắc thái may mắn, nhẹ nhõm. Từ liên quan - 後悔 (hối hận), 反省 (tự kiểm điểm), ぎりぎり (sát nút), うっかり (sơ ý).
  - type: deep_explain
    text:
      vi: 'Dạng ～たらよかった (早く寝ていたらよかった) có thể thay ばよかった; cả hai đều chỉ việc đã qua và không thể thay đổi. Với việc đã xảy ra theo hướng tốt, người Nhật nói ～てよかった (間に合ってよかった). ～ずに済む khác ～なくてもいい: 済む nhấn "kết thúc suôn sẻ, nhẹ nhõm", còn なくてもいい nhấn "được phép không làm".'
  - type: example
    target: もう少しで電車に乗り遅れるところでした。
    target_lang: ja
    translation:
      vi: Suýt nữa tôi lỡ chuyến tàu.
    note:
      vi: V辞書形 + ところだった.
  - type: example
    target: もっと早く寝ればよかった。
    target_lang: ja
    translation:
      vi: Giá mà tôi đã đi ngủ sớm hơn.
    note:
      vi: V ば + よかった.
  - type: example
    target: 友達が手伝ってくれたので、残業しないで済みました。
    target_lang: ja
    translation:
      vi: Bạn giúp tôi nên tôi không phải làm thêm giờ.
    note:
      vi: V ないで + 済む.
  - type: example
    target: うっかり傘を忘れて、ぎりぎり間に合いました。
    target_lang: ja
    translation:
      vi: Tôi sơ ý quên ô, và kịp giờ sát nút.
    note:
      vi: うっかり - sơ ý; ぎりぎり - sát nút.
  - type: common_mistake
    wrong: 危うく忘れるところでした。(đã thực sự quên)
    right: 危うく忘れるところでした。 / 忘れてしまいました。
    target_lang: ja
    note:
      vi: ところだった = suýt (chưa xảy ra). Nếu đã quên thật thì dùng 忘れてしまった.
  - type: common_mistake
    wrong: もっと勉強すればよかったです。(chưa muộn, còn có thể làm)
    right: もっと勉強すればよかったです。
    target_lang: ja
    note:
      vi: ばよかった chỉ dùng cho việc đã qua; việc còn có thể làm dùng ～たほうがいい.
  - type: summary
    points:
      - vi: V辞書形 / V ない + ところだった - suýt nữa (không xảy ra).
      - vi: V ば / V なければ + よかった - giá mà ...
      - vi: V ない / ずに + 済む - không phải ...
      - vi: 危うく · 後悔 · 反省 · ぎりぎり · うっかり.
exercises:
  - key: ja:exercise:n3-regret-r1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u8-gram-tokoro-datta
    prompt:
      stem: Chọn câu đúng - 危うく事故になる___。
      stem_lang: vi
      options:
        - id: szm
          text: ところでした
          lang: ja
        - id: kta
          text: ところにして
          lang: ja
        - id: d1x
          text: ところです
          lang: ja
        - id: rp7
          text: ところでしたら
          lang: ja
    answer:
      correct_option_id: szm
    explanation:
      vi: Suýt nữa xảy ra tai nạn - ところだった (ところでした). ところです là "đang/sắp", sai nghĩa.
    display_answer: ところでした
  - key: ja:exercise:n3-regret-r2
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-u8-gram-ba-yokatta
    prompt:
      stem: Chọn câu đúng - もっと早く___。
      stem_lang: vi
      options:
        - id: z5a
          text: 寝ばよかった
          lang: ja
        - id: s4i
          text: 寝るはよかった
          lang: ja
        - id: mk7
          text: 寝ればよかった
          lang: ja
        - id: rl0
          text: 寝たらいいだった
          lang: ja
    answer:
      correct_option_id: mk7
    explanation:
      vi: "V ば + よかった: 寝ればよかった. 寝ば, 寝るは, 寝たらいいだった đều sai."
    display_answer: 寝ればよかった
