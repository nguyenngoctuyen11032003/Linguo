key: ja:lesson:n3-dake-denaku
order_index: 4
level: n3
title:
  vi: Bổ sung, so sánh nhận định, nêu chủ đề - ～だけでなく・～というより・～といえば・～など
objectives:
  - vi: Nói "không chỉ... mà còn..." bằng ～だけでなく / ばかりでなく.
  - vi: Nói "đúng hơn là" bằng A というより B.
  - vi: Nêu chủ đề bằng ～といえば và liệt kê ví dụ khiêm tốn bằng ～など / なんて.
estimated_minutes: 18
skills:
