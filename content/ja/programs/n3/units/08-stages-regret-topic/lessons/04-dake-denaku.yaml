    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-u8-ninki
    prompt:
      source_text: この店は安いだけでなく、おいしくて人気があります。外見だけでなく、中身も大切です。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Cửa hàng này không chỉ rẻ mà còn ngon và được ưa chuộng. Không chỉ vẻ bề ngoài mà bên trong cũng quan trọng.
        - Quán này không chỉ rẻ mà còn ngon, được nhiều người thích. Không chỉ bề ngoài, nội dung bên trong cũng quan trọng.
        - Cửa hàng này vừa rẻ vừa ngon và nổi tiếng. Không chỉ ngoại hình mà phần bên trong cũng quan trọng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Cửa hàng này rẻ nhưng không ngon, không được ưa chuộng. Chỉ vẻ bề ngoài là quan trọng.
        feedback_vi: おいしくて人気がある là ngon và được ưa chuộng.
        error_tag: meaning
    explanation:
      vi: だけでなく ～も - không chỉ... mà còn; 人気がある - được ưa chuộng.
    display_answer: Cửa hàng này không chỉ rẻ mà còn ngon và được ưa chuộng. Không chỉ vẻ bề ngoài mà bên trong cũng quan trọng.
