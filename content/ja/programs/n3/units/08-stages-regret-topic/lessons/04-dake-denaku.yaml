body:
  - type: objective
    text:
      vi: Sau bài này, bạn trao đổi ý kiến linh hoạt - この店は安いだけでなく、おいしいです。暑いというより、蒸し暑いです。日本といえば、富士山ですね。
  - type: explain
    text:
      vi: N / V + だけでなく ～も = "không chỉ ... mà còn ...". Vế sau (có も) thường là thông tin thêm vào, đôi khi nổi bật hơn. ばかりでなく là dạng văn viết hơn.
  - type: explain
    text:
      vi: A というより B = "nói A cũng được nhưng nói B thì đúng hơn". Ví dụ 暑いというより、蒸し暑いです (không hẳn là nóng mà đúng hơn là oi bức). A là cách nói phổ biến, B chính xác hơn.
  - type: explain
    text:
      vi: 'N といえば / というと = "nhắc đến N thì (nghĩ ngay đến...)" - 日本といえば、富士山ですね. Dùng để mở chủ đề hay nhớ ra chuyện liên quan. N など / なんて = "những thứ như N" (khiêm tốn hoặc hạ thấp): 私などにはできません; なんて còn diễn tả bất ngờ: 彼が来るなんて.'
  - type: deep_explain
    text:
      vi: など lịch sự, hay xuất hiện trong liệt kê (りんごやみかんなど); なんて thân mật hơn và thường chứa cảm xúc (そんなことを言うなんて - ai ngờ lại nói thế). Từ vựng - 魅力 (sức hấp dẫn), 人気 (được ưa chuộng), 話題 (chủ đề bàn tán), 流行 (thịnh hành), 印象 (ấn tượng), 外見 (bề ngoài), 中身 (bên trong), 本物 (đồ thật).
  - type: example
    target: 彼は英語だけでなく、中国語も話せます。
    target_lang: ja
    translation:
      vi: Anh ấy không chỉ nói được tiếng Anh mà cả tiếng Trung.
    note:
      vi: だけでなく ～も.
  - type: example
    target: 暑いというより、蒸し暑いです。
    target_lang: ja
    translation:
      vi: Không hẳn là nóng mà đúng hơn là oi bức.
    note:
      vi: A というより B.
  - type: example
    target: 日本といえば、富士山ですね。
    target_lang: ja
    translation:
      vi: Nhắc đến Nhật Bản là nghĩ ngay đến núi Phú Sĩ nhỉ.
    note:
      vi: N といえば.
  - type: example
    target: 外見だけでなく、中身も大切です。
    target_lang: ja
    translation:
      vi: Không chỉ vẻ bề ngoài mà bên trong cũng quan trọng.
    note:
      vi: 外見・中身.
  - type: common_mistake
    wrong: この店は安いだけでおいしいです。
    right: この店は安いだけでなく、おいしいです。
    target_lang: ja
    note:
      vi: Cần だけでなく ... も để diễn tả "không chỉ... mà còn".
  - type: common_mistake
    wrong: 日本といえばの富士山です。
    right: 日本といえば、富士山です。
    target_lang: ja
    note:
      vi: といえば đứng độc lập, theo sau là dấu phẩy rồi nhận xét.
  - type: summary
    points:
      - vi: N / V + だけでなく ～も - không chỉ ... mà còn ...
      - vi: A というより B - đúng hơn là B.
      - vi: N といえば - nhắc đến N thì ...
      - vi: N など / なんて - những thứ như N.
