title:
  vi: Khi, tốt nhất là, không cần - ～際に・～に限る・～ことはない
objectives:
  - vi: Nói "khi" trang trọng bằng ～際(に).
  - vi: Nói "tốt nhất là" bằng ～に限る.
  - vi: Nói "không cần phải" bằng V辞書形 + ことはない.
