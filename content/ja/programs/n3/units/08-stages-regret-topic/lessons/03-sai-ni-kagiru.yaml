body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu thông báo và đưa lời khuyên - ご利用の際は受付で名前を書いてください。疲れた時は寝るに限る。心配することはありません。
  - type: explain
    text:
      vi: '～際(に) nghĩa là "khi, vào dịp" - dùng trong văn trang trọng, thông báo, hướng dẫn. V辞書形 / V た / N の + 際: 利用する際は, 来た際に, ご使用の際は. Cảm giác cứng hơn とき.'
  - type: explain
    text:
      vi: '～に限る nghĩa là "không gì bằng, tốt nhất là". V辞書形 / N + に限る: 疲れた時は寝るに限る, 暑い日はビールに限る. Phủ định - V ないに限る (tốt nhất là đừng...). Thể hiện ý kiến chủ quan của người nói.'
  - type: explain
    text:
      vi: 'V辞書形 + ことはない = "không cần phải, không có lý do để": 心配することはありません (không cần lo), 謝ることはない. Từ liên quan - 無駄 (vô ích), 安心 (yên tâm), 心配 (lo lắng), 注意 (chú ý), 不要 (không cần), 最適 (phù hợp nhất).'
  - type: deep_explain
    text:
      vi: "Chú ý ～ことはない (không cần) khác ～たことがない (chưa từng). Lời khuyên dùng ～に限る thường là ý riêng của người nói nên không dùng để ra lệnh hay khi chưa chắc. ～際に thường thấy trên biển báo: 非常の際は (khi khẩn cấp), 降りる際は (khi xuống xe)."
  - type: example
    target: ご利用の際は、受付で名前を書いてください。
    target_lang: ja
    translation:
      vi: Khi sử dụng, xin hãy ghi tên ở quầy lễ tân.
    note:
      vi: N の + 際は - khi.
  - type: example
    target: 疲れた時は寝るに限る。
    target_lang: ja
    translation:
      vi: Khi mệt thì không gì bằng ngủ.
    note:
      vi: V + に限る.
  - type: example
    target: 心配することはありません。必ずうまくいきますよ。
    target_lang: ja
    translation:
      vi: Không cần phải lo lắng đâu. Chắc chắn sẽ thuận lợi.
    note:
      vi: V + ことはない.
  - type: example
    target: 不要な物は捨てて、部屋をきれいにしましょう。
    target_lang: ja
    translation:
      vi: Hãy vứt những thứ không cần và dọn phòng cho sạch.
    note:
      vi: 不要 - không cần thiết.
  - type: common_mistake
    wrong: 日本へ来る際は、連絡してください。(thân mật)
    right: 日本へ来るときは、連絡してください。
    target_lang: ja
    note:
      vi: 際 trang trọng; với bạn bè dùng とき.
  - type: common_mistake
    wrong: 急ぐことがありません。
    right: 急ぐことはありません。
    target_lang: ja
    note:
      vi: Mẫu là ことはない, không dùng ことがない.
  - type: summary
    points:
      - vi: V / N の + 際(に) - khi, vào dịp (trang trọng).
      - vi: V辞書形 / N + に限る - không gì bằng, tốt nhất.
      - vi: V辞書形 + ことはない - không cần phải.
      - vi: 無駄 · 安心 · 心配 · 注意 · 不要 · 最適.
