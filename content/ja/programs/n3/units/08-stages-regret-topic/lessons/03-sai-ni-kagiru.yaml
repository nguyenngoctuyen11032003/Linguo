        feedback_vi: 無理をしないに限る nghĩa là tốt nhất là đừng gắng sức.
        error_tag: meaning
    explanation:
      vi: 無理をしない - không gắng sức; に限る - tốt nhất là; ことはない - không cần.
    display_answer: Khi bị cảm thì tốt nhất là đừng gắng sức. Không cần phải lo lắng.
