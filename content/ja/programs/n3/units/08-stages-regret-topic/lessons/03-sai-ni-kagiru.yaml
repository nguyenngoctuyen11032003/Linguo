      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Khi bị cảm thì tốt nhất là đừng gắng sức. Không cần phải lo lắng.
        - Lúc cảm cúm thì không gì bằng đừng cố quá sức. Không cần lo đâu.
        - Khi bị cảm, tốt nhất là không nên gắng sức. Đừng lo lắng.
    rubric:
      diacritics: lenient
    known_wrong:
