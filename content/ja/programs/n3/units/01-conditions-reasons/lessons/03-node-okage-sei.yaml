  - key: ja:exercise:n3-node-okage-sei-mcq-nanode
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-node
    prompt:
      stem: 'Chọn dạng đúng: 明日は休み＿＿、ゆっくり寝ます。'
      stem_lang: vi
      options:
        - { id: c9w, text: なので, lang: ja }
        - { id: f3a, text: だので, lang: ja }
        - { id: k6o, text: ので, lang: ja }
        - { id: x2u, text: のので, lang: ja }
    answer:
      correct_option_id: c9w
    explanation:
      vi: 休み là danh từ nên nối bằng なので. だので và のので không tồn tại; ので gắn thẳng sau danh từ là thiếu な.
    display_answer: なので

  - key: ja:exercise:n3-node-okage-sei-fill-sei
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-seide
    prompt:
      template: "事故{{b1}}、電車が一時間も止まりました。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Tại tai nạn mà tàu điện dừng đến một tiếng."
        - "Gợi ý: danh từ + の + từ chỉ nguyên nhân xấu."
    answer:
      blanks:
        b1: [のせいで, で]
    known_wrong:
      - answer: のおかげで
        feedback_vi: Tàu dừng một tiếng là kết quả xấu - dùng せいで, không dùng おかげで.
        error_tag: okage_sei
      - answer: せいで
        feedback_vi: Sau danh từ phải có の - 事故のせいで.
        error_tag: missing_no
    explanation:
      vi: Kết quả xấu nên dùng のせいで. Chỉ dùng で (事故で) cũng đúng - đó là cách nêu nguyên nhân trung tính.
    display_answer: 事故のせいで、電車が一時間も止まりました。

