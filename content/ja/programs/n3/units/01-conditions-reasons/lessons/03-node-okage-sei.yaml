key: ja:lesson:n3-node-okage-sei
order_index: 3
level: n3
title:
  vi: Vì, nhờ, tại - ～ので, ～おかげで, ～せいで
objectives:
  - vi: Dùng ～ので để nêu lý do lịch sự khi xin phép, xin lỗi.
  - vi: Phân biệt ～おかげで (nhờ - kết quả tốt) và ～せいで (tại - kết quả xấu).
  - vi: Nối đúng danh từ và tính từ な với なので, のおかげで, のせいで.
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n3-to-nara]
