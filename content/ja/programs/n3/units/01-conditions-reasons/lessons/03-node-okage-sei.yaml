  - key: ja:exercise:n3-node-okage-sei-mcq-report
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-node
    prompt:
      stem: Bạn đến công ty muộn vì tàu trễ. Câu nào phù hợp nhất để nói với trưởng phòng?
      stem_lang: vi
      options:
        - { id: d5h, text: 電車が遅れたので、遅くなりました。申し訳ありません。, lang: ja }
        - { id: p8e, text: 電車のせいで遅れたんです。私は悪くないです。, lang: ja }
        - { id: w3j, text: 電車が遅れたおかげで、遅くなりました。, lang: ja }
        - { id: n1y, text: 電車が遅れたのに、遅くなりました。, lang: ja }
    answer:
      correct_option_id: d5h
    explanation:
      vi: Nêu nguyên nhân khách quan bằng ので rồi xin lỗi là cách chuẩn ở công sở. Câu せいで kèm "tôi không có lỗi" nghe đổ lỗi; おかげで sai sắc thái; のに vô nghĩa ở đây.
    display_answer: 電車が遅れたので、遅くなりました。申し訳ありません。

