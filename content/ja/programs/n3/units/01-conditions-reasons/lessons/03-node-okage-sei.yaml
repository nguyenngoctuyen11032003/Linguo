  - key: ja:exercise:n3-node-okage-sei-mcq-okage
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-okagede
    prompt:
      stem: '"Nhờ bạn giúp mà tôi xong sớm." Chọn từ điền vào: 友だちが手伝ってくれた＿＿、早く終わりました。'
      stem_lang: vi
      options:
        - { id: h3k, text: おかげで, lang: ja }
        - { id: v8p, text: せいで, lang: ja }
        - { id: b1r, text: のに, lang: ja }
        - { id: z6m, text: ても, lang: ja }
    answer:
      correct_option_id: h3k
    explanation:
      vi: Xong sớm là kết quả tốt và có ý cảm ơn bạn - おかげで. せいで dùng cho kết quả xấu; のに là "vậy mà"; ても là "dù".
    display_answer: おかげで

