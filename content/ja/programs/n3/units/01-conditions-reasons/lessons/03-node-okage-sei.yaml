  # ---------------- recall ----------------
  - key: ja:exercise:n3-node-okage-sei-fill-two
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-okagede
    prompt:
      template: "薬を飲んだ{{b1}}、熱が下がりました。でも、寝不足の{{b2}}、頭が痛いです。"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [おかげで]
        b2: [せいで, せいか]
    known_wrong:
      - answer: のおかげで
        feedback_vi: Sau động từ (飲んだ) gắn thẳng おかげで, không thêm の.
        error_tag: extra_no
    explanation:
      vi: Hạ sốt là kết quả tốt - おかげで; đau đầu là kết quả xấu - せいで (せいか - "có lẽ tại" cũng tự nhiên). Sau động từ không cần の, sau danh từ 寝不足 đã có の sẵn.
    display_answer: 薬を飲んだおかげで、熱が下がりました。でも、寝不足のせいで、頭が痛いです。

