    display_answer: Đi thẳng đường này là thấy bưu điện ở cuối đường.

  - key: ja:exercise:n3-to-nara-mcq-nara
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-nara
    prompt:
      stem: 'A: 日本のお土産を買いたいんですが…。 B: お土産＿＿、駅前のデパートがおすすめですよ。'
      stem_lang: ja
      options:
        - { id: r9u, text: なら, lang: ja }
        - { id: e2s, text: と, lang: ja }
        - { id: i6h, text: ので, lang: ja }
        - { id: a4j, text: ても, lang: ja }
    answer:
      correct_option_id: r9u
    explanation:
      vi: B nhận lại chủ đề "quà" mà A vừa nói rồi giới thiệu - dùng なら. と không gắn sau danh từ để làm điều kiện như vậy; ので là "vì", ても là "dù".
    display_answer: なら

  - key: ja:exercise:n3-to-nara-fill-wo-ni
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-magaru
    prompt:
      template: "その角{{b1}}右{{b2}}曲がると、駅があります。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 1 }
      hint_levels:
        - "Nghĩa: Rẽ phải ở góc đó là thấy ga."
        - "Gợi ý: chỗ đi qua để rẽ dùng を; hướng rẽ dùng に."
    answer:
      blanks:
        b1: [を]
        b2: [に, へ]
    known_wrong:
      - answer: で
        feedback_vi: Chỗ rẽ là nơi bạn đi qua nên dùng を - 角を曲がる, không dùng で.
        error_tag: particle_route
    explanation:
      vi: 角を曲がる - rẽ ở góc (を chỉ nơi đi qua); 右に曲がる - rẽ sang phải (に chỉ hướng, へ cũng được).
    display_answer: その角を右に曲がると、駅があります。

  - key: ja:exercise:n3-to-nara-wb-bank
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-to-cond
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Rẽ phải ở đèn giao thông thứ hai là thấy ngân hàng.\""
      tokens:
        - { id: u4, text: 銀行が見えます }
        - { id: u2, text: 右に }
        - { id: u5, text: 曲がってください }
        - { id: u1, text: 二つ目の信号を }
        - { id: u3, text: 曲がると }
    answer:
      orders:
        - [u1, u2, u3, u4]
    explanation:
      vi: Chỉ đường - "rẽ là thấy" dùng 曲がると. 曲がってください là lời nhờ, không nối được với 銀行が見えます. Chỗ rẽ (二つ目の信号を) thường đứng trước hướng rẽ (右に).
    display_answer: 二つ目の信号を右に曲がると、銀行が見えます。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-to-nara-fill-iku-nara
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-nara
    prompt:
      template: "A: 週末、北海道に行きます。 B: 北海道に{{b1}}、コートを持っていったほうがいいですよ。"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [行くなら, いくなら]
    known_wrong:
      - answer: 行ったら
        feedback_vi: Mang áo khoác là việc làm trước khi đi, nên dùng 行くなら. 行ったら là sau khi đã đến nơi.
        error_tag: nara_timing
      - answer: 行くと
        feedback_vi: Vế sau là lời khuyên (～たほうがいい) nên không dùng と.
        error_tag: to_advice
    explanation:
      vi: B nhận lại chủ đề "đi Hokkaido" và khuyên việc cần làm trước khi đi - 行くなら.
    display_answer: 北海道に行くなら、コートを持っていったほうがいいですよ。

