key: ja:lesson:n3-to-nara
order_index: 2
level: n3
title:
  vi: Chỉ đường và khuyên nhủ - ～と và ～なら
objectives:
  - vi: Dùng ～と để chỉ đường, hướng dẫn cách dùng máy, nói quy luật luôn xảy ra.
  - vi: Dùng ～なら để nhận lại chủ đề người kia nói rồi khuyên hoặc giới thiệu.
  - vi: Phân biệt と, たら, ば, なら trong những câu dễ nhầm.
estimated_minutes: 18
skills: [grammar, speaking, listening]
prerequisites: [ja:lesson:n3-tara-ba]
