    item: ja:item:n3-tsukiatari
    prompt:
      source_text: Đến cuối đường thì rẽ trái. (lời nhờ lịch sự)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 突き当たりを左に曲がってください。
        - 突き当たりを左へ曲がってください。
        - 突き当たりを左に曲がって下さい。
        - つきあたりを左に曲がってください。
