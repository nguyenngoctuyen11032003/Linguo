  - key: ja:exercise:n3-to-nara-wb-souvenir
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-nara
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Nếu là quà lưu niệm thì tôi gợi ý bánh ngọt này.\""
      tokens:
        - { id: s3, text: このお菓子が }
        - { id: s4, text: おすすめです }
        - { id: s5, text: お土産と }
        - { id: s1, text: お土産なら }
    answer:
      orders:
