    display_answer: 突き当たりを左に曲がってください。

  # ---------------- application ----------------
  - key: ja:exercise:n3-to-nara-mcq-kyoto
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-nara
    prompt:
      stem: Bạn của bạn sắp đi Kyoto. Bạn muốn khuyên nên mua vé tàu Shinkansen trước. Câu nào đúng?
      stem_lang: vi
      options:
        - { id: o7b, text: 京都に行くなら、新幹線の切符を先に買ったほうがいいですよ。, lang: ja }
        - { id: c3n, text: 京都に行ったら、新幹線の切符を先に買ったほうがいいですよ。, lang: ja }
        - { id: m9e, text: 京都に行くと、新幹線の切符を先に買ったほうがいいですよ。, lang: ja }
        - { id: f6w, text: 京都に行けば、新幹線の切符を先に買います。, lang: ja }
    answer:
      correct_option_id: o7b
    explanation:
      vi: Mua vé là việc trước khi đi, lại là lời khuyên - dùng 行くなら. 行ったら là sau khi đã đến Kyoto; と không đi với lời khuyên; câu ば cuối nói về việc của chính mình, không phải lời khuyên.
    display_answer: 京都に行くなら、新幹線の切符を先に買ったほうがいいですよ。

