    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n3-tsukiatari
    prompt:
      audio_asset_id: null
      fallback_text: この道をまっすぐ行くと、突き当たりに郵便局があります。
      options:
        - { id: n4w, text: Đi thẳng đường này là thấy bưu điện ở cuối đường., lang: vi }
        - { id: k1e, text: Đi thẳng đường này là thấy ngân hàng ở góc phố., lang: vi }
        - { id: s6y, text: Rẽ phải ở đường này là thấy bưu điện., lang: vi }
        - { id: d3o, text: Bưu điện ở ngay đầu đường này., lang: vi }
    answer:
      correct_option_id: n4w
    explanation:
