      stem_lang: vi
      options:
        - { id: s7d, text: のに, lang: ja }
        - { id: a2g, text: ので, lang: ja }
        - { id: e9k, text: おかげで, lang: ja }
        - { id: u4b, text: なら, lang: ja }
    answer:
