  - key: ja:exercise:n3-noni-temo-fill-nanoni
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-noni
    prompt:
      template: "日曜日{{b1}}、会社に行かなければなりません。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Chủ nhật vậy mà vẫn phải đi làm."
        - "Gợi ý: danh từ + な + từ chỉ 'vậy mà'."
    answer:
      blanks:
        b1: [なのに]
    known_wrong:
      - answer: のに
        feedback_vi: Sau danh từ phải thêm な - 日曜日なのに.
        error_tag: nanoni_form
      - answer: だのに
        feedback_vi: Dạng chuẩn là なのに; だのに là cách nói cũ, văn chương.
        error_tag: nanoni_form
    explanation:
      vi: 日曜日 là danh từ nên dùng なのに. Câu này là sự thật có ý than, đúng chức năng của のに.
    display_answer: 日曜日なのに、会社に行かなければなりません。

  - key: ja:exercise:n3-noni-temo-wb-akirameru
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-akirameru
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Dù thất bại cũng đừng bỏ cuộc nhé.\""
      tokens:
        - { id: k2, text: 諦めないでください }
        - { id: k3, text: 失敗したのに }
        - { id: k1, text: 失敗しても }
    answer:
