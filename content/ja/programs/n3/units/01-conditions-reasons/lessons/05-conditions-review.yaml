    display_answer: Tại bão mà lễ hội pháo hoa bị huỷ.

  - key: ja:exercise:n3-conditions-review-fill-sanka
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-sanka
    prompt:
      template: "参加したい方は、15日{{b1}}管理人{{b2}}連絡してください。"
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 1 }
      hint_levels:
        - "Nghĩa: Ai muốn tham gia xin liên lạc với người quản lý trước ngày 15."
        - "Gợi ý: hạn chót dùng までに; liên lạc với ai dùng に."
    answer:
      blanks:
        b1: [までに]
        b2: [に]
    known_wrong:
      - answer: まで
        feedback_vi: まで là "cho đến" (kéo dài liên tục); hạn chót để làm một việc dùng までに.
        error_tag: made_madeni
      - answer: を
        feedback_vi: Liên lạc với ai dùng に - 管理人に連絡する.
        error_tag: particle_ni
    explanation:
      vi: までに - trước (hạn chót); 管理人に連絡する - liên lạc với người quản lý.
    display_answer: 参加したい方は、15日までに管理人に連絡してください。

  - key: ja:exercise:n3-conditions-review-wb-noni
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-noni
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Mình đã mong mãi vậy mà (bị huỷ).\""
      tokens:
        - { id: n2, text: していたのに }
        - { id: n3, text: していたので }
        - { id: n1, text: 楽しみに }
    answer:
      orders:
        - [n1, n2]
    explanation:
      vi: 楽しみにする - mong chờ; のに ở cuối câu - than tiếc vì điều mong đợi không thành. ので là "vì", không mang ý tiếc.
    display_answer: 楽しみにしていたのに。

  # ---------------- recall ----------------
  - key: ja:exercise:n3-conditions-review-fill-mix
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-tara
    prompt:
      template: "雨が{{b1}}、お祭りは延期です。でも、少し雨が{{b2}}、お祭りはやります。(降る)"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [降ったら, 降れば, ふったら, ふれば]
        b2: [降っても, ふっても]
    known_wrong:
      - answer: 降ったのに
        feedback_vi: Câu nói về kế hoạch tương lai nên dùng ても ("dù có mưa"), không dùng のに.
        error_tag: noni_temo
    explanation:
      vi: Vế đầu là điều kiện - 降ったら / 降れば. Vế sau là "dù mưa một chút vẫn tổ chức" - 降っても.
    display_answer: 雨が降ったら、お祭りは延期です。でも、少し雨が降っても、お祭りはやります。

