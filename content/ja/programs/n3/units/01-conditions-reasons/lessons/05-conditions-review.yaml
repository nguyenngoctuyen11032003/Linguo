  # ---------------- application ----------------
  - key: ja:exercise:n3-conditions-review-mcq-infer
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n3-oshirase
    prompt:
      stem: "Đọc thông báo: 「明日はビルの点検のため、エレベーターが止まります。重い荷物がある方は、今日中に運んでください。」 Điều nào suy ra được?"
      stem_lang: vi
      options:
        - { id: p5r, text: Ngày mai cư dân phải đi cầu thang bộ., lang: vi }
        - { id: u1h, text: Hôm nay thang máy không dùng được., lang: vi }
        - { id: g7c, text: Ngày mai không được mang đồ vào toà nhà., lang: vi }
        - { id: j4x, text: Việc kiểm tra toà nhà đã bị hoãn., lang: vi }
    answer:
      correct_option_id: p5r
    explanation:
      vi: 'Thang máy dừng ngày mai (明日...止まります) nên phải đi cầu thang bộ - điều này không viết thẳng nhưng suy ra được. Hôm nay vẫn dùng được, vì thông báo bảo hãy chuyển đồ nặng trong hôm nay (今日中に).'
    display_answer: Ngày mai cư dân phải đi cầu thang bộ.

