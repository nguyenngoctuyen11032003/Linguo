  - key: ja:exercise:n3-conditions-review-mcq-reply
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-temo
    prompt:
      stem: 'Bạn nhắn cho Yuki: "Dù lễ hội bị hoãn, tuần sau mình vẫn đi được." Câu nào đúng?'
      stem_lang: vi
      options:
        - { id: s3a, text: お祭りが延期になっても、来週なら行けるよ。, lang: ja }
        - { id: m6d, text: お祭りが延期になったのに、来週なら行けるよ。, lang: ja }
        - { id: b9f, text: お祭りが中止になっても、来週なら行けるよ。, lang: ja }
        - { id: y2t, text: お祭りが延期になるので、来週も行けないよ。, lang: ja }
    answer:
      correct_option_id: s3a
    explanation:
      vi: Giả định "dù có bị hoãn" - ても; 来週なら - "nếu là tuần sau". Câu のに dùng cho chuyện đã xảy ra, không hợp; 中止 là huỷ thì không có "tuần sau"; câu cuối ngược nghĩa.
    display_answer: お祭りが延期になっても、来週なら行けるよ。

  - key: ja:exercise:n3-conditions-review-wb-notice
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-chuushi
    prompt:
      instruction: "Sắp xếp thành câu thông báo: \"Nếu trời mưa, chợ phiên đồ cũ sẽ bị huỷ.\""
      tokens:
        - { id: m4, text: 中止になります }
        - { id: m2, text: フリーマーケットは }
        - { id: m5, text: 中止をなります }
        - { id: m1, text: 雨が降ったら }
    answer:
      orders:
        - [m1, m2, m4]
        - [m2, m1, m4]
    explanation:
      vi: Sự kiện "bị huỷ" dùng 中止になります - danh từ + に + なる (trở thành). 中止をなります sai trợ từ. Chủ đề và điều kiện có thể đổi chỗ.
    display_answer: 雨が降ったら、フリーマーケットは中止になります。
