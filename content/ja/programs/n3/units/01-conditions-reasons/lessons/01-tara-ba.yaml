title:
  vi: Nếu... thì - ～たら và ～ば
objectives:
  - vi: Chia đúng thể たら và thể ば của động từ, tính từ, danh từ.
  - vi: Dùng ～たら cho lời nhờ, lời hẹn sau một mốc thời gian; dùng ～ば để nêu điều kiện cần.
  - vi: Tránh lỗi ghép ～ば (động từ hành động) với lời nhờ, lời rủ ở vế sau.
