  - key: ja:exercise:n3-tara-ba-fill-areba
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n3-gram-ba
    prompt:
      template: "時間が{{b1}}、手伝います。(ある)"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Nếu có thời gian thì tôi sẽ giúp."
        - "Gợi ý: ある → đổi る thành れ rồi thêm ば (hoặc dùng thể た + ら)."
    answer:
      blanks:
        b1: [あれば, あったら]
    known_wrong:
      - answer: あるば
        feedback_vi: ば không gắn vào thể từ điển. ある → あれば.
        error_tag: ba_form
      - answer: あるたら
        feedback_vi: たら gắn vào thể た - あった → あったら.
        error_tag: tara_form
    explanation:
      vi: ある là trạng thái nên cả あれば và あったら đều tự nhiên. Vế sau là ý định (手伝います) vẫn dùng được với ば vì vế trước không phải hành động.
    display_answer: 時間があれば、手伝います。

  - key: ja:exercise:n3-tara-ba-wb-maniau
    type: word_bank
