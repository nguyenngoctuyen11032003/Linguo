  - key: ja:exercise:n3-wari-fill-bag
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-hinshitsu
    prompt:
      template: "このかばんは安い{{b1}}、品質がいいです。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Cái túi này rẻ thế mà chất lượng lại tốt."
        - "Gợi ý: 'so với... thì (lại)...' - kết quả hơn kỳ vọng."
    answer:
      blanks:
        b1: [わりに, わりには, 割に, 割には]
    known_wrong:
      - answer: かわりに
        feedback_vi: Rẻ và chất lượng tốt đều là điểm tốt - không phải "đổi lại". "So với... thì" là わりに.
        error_tag: wari_kawari
      - answer: のわりに
        feedback_vi: Tính từ đuôi い nối thẳng - 安いわりに.
        error_tag: no_after_adjective
    explanation:
      vi: 安い + わりに - rẻ mà...; 品質がいい - chất lượng tốt, vượt kỳ vọng so với giá.
    display_answer: このかばんは安いわりに、品質がいいです。

