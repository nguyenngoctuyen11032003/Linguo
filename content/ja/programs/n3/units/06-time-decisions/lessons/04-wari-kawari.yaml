key: ja:lesson:n3-wari-kawari
order_index: 4
level: n3
title:
  vi: So với... thì, thay vì / đổi lại - ～わりに, ～かわりに
objectives:
  - vi: Nói kết quả khác kỳ vọng bằng ～わりに(は).
  - vi: Nói "thay cho, thay vì" và "đổi lại, bù lại" bằng ～かわりに.
  - vi: Không nhầm わりに với かわりに và với のに.
estimated_minutes: 20
skills: [grammar, vocabulary, reading, speaking]
prerequisites: [ja:lesson:n3-tabi-tsuide]
