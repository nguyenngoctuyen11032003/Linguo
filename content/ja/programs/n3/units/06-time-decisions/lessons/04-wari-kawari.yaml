body:
  - type: objective
    text:
      vi: Sau bài này, bạn nhận xét như người Nhật - "so với giá thì ngon", "ăn nhiều mà không béo" - và nói được chuyện đổi chác, thay thế, cái được cái mất khi chọn việc làm hay nhà ở.
  - type: explain
    text:
      vi: '～わりに(は) là "so với... thì (lại)...": kết quả lệch khỏi điều người ta thường nghĩ từ A. 値段のわりにおいしい - giá rẻ thế mà ngon. Nối: thể thường, Aい, Naな, Nの + わりに.'
  - type: explain
    text:
      vi: '～かわりに (代わりに) có ba nghĩa: thay cho (部長の代わりに私が出ます), đổi lại (教えてもらう代わりに教えます), bù lại - mặt tốt đi kèm mặt xấu (給料が高い代わりに休みが少ない). Nối: Nの, V-る, thể thường.'
  - type: explain
    text:
      vi: 'Hai mẫu chỉ khác một chữ か nhưng nghĩa khác hẳn. わりに so mức độ với kỳ vọng; かわりに đổi một thứ lấy một thứ. Khi hai sự thật trái ngược hoàn toàn (mưa mà vẫn thi đấu), dùng のに chứ không phải わりに.'
  - type: deep_explain
    text:
      vi: 'わりに thường kèm đánh giá chủ quan, nên vế sau hay là tính từ (おいしい, 若い, 安い) hoặc kết quả bất ngờ. Đừng viết 変わりに (変わる - thay đổi); "thay thế" là 代わり (代わる). Trong văn nói, わりと / わりに đứng một mình còn là phó từ "khá là" - わりと簡単だった (khá dễ).'
  - type: example
    target: このレストランは値段のわりに、料理がおいしいです。
    target_lang: ja
    translation:
      vi: Nhà hàng này so với giá thì đồ ăn rất ngon.
    note:
      vi: N + の + わりに.
  - type: example
    target: 弟はたくさん食べるわりに、全然太りません。
    target_lang: ja
    translation:
      vi: Em trai tôi ăn nhiều thế mà chẳng béo chút nào.
    note:
      vi: V-る + わりに - kết quả trái kỳ vọng.
  - type: example
    target: 今日は田中さんの代わりに、私が会議に出ます。
    target_lang: ja
    translation:
      vi: Hôm nay tôi sẽ dự họp thay cho anh Tanaka.
    note:
      vi: Nghĩa (1) - thay cho.
  - type: example
    target: 友だちに日本語を教えてもらう代わりに、ベトナム語を教えています。
    target_lang: ja
    translation:
      vi: Bạn dạy tôi tiếng Nhật, đổi lại tôi dạy bạn ấy tiếng Việt.
    note:
      vi: Nghĩa (2) - đổi lại.
  - type: example
    target: この仕事は給料が高いかわりに、休みが少ないです。
    target_lang: ja
    translation:
      vi: Công việc này lương cao nhưng bù lại ít ngày nghỉ.
    note:
      vi: Nghĩa (3) - bù lại; 給料 - tiền lương.
  - type: common_mistake
    wrong: このかばんは値段にわりに、軽いです。
    right: このかばんは値段のわりに、軽いです。
    target_lang: ja
    note:
      vi: Danh từ nối với わりに bằng の.
  - type: common_mistake
    wrong: 雨が降ったわりに、試合が行われました。
    right: 雨が降ったのに、試合が行われました。
    target_lang: ja
    note:
      vi: Đây là sự thật trái ngược, không phải so mức độ - dùng のに.
  - type: common_mistake
    wrong: 母の変わりに、私が料理をします。
    right: 母の代わりに、私が料理をします。
    target_lang: ja
    note:
      vi: '"Thay cho" viết 代わり (代わる - thay thế), không phải 変わり (変わる - thay đổi).'
  - type: summary
    points:
      - vi: Thể thường / Aい / Naな / Nの + わりに - so với... thì (lệch kỳ vọng).
      - vi: Nの / V-る + 代わりに - thay cho / đổi lại / bù lại.
      - vi: Sự thật trái ngược hoàn toàn - dùng のに, không dùng わりに.
      - vi: 品質 chất lượng · 給料 tiền lương · 経験 kinh nghiệm.
