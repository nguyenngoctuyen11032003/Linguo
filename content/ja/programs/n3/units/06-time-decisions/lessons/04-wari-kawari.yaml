    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-wari-ni
    prompt:
      stem: '"Anh ấy học ít thế mà điểm lại cao." 彼はあまり勉強しない＿＿、成績がいい。'
      stem_lang: vi
      options:
        - { id: x3a, text: "わりに", lang: ja }
        - { id: q8s, text: "かわりに", lang: ja }
        - { id: l5d, text: "たびに", lang: ja }
        - { id: h1f, text: "ついでに", lang: ja }
    answer:
      correct_option_id: x3a
    explanation:
      vi: Kết quả (điểm cao) vượt kỳ vọng so với việc học ít - わりに. かわりに là "thay cho / đổi lại"; たびに "mỗi lần"; ついでに "nhân tiện".
    display_answer: わりに

