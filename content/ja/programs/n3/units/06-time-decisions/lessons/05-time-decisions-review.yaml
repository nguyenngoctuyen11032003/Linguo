title:
  vi: 'Ôn tập: blog "Tôi bắt đầu tự nấu ăn"'
objectives:
  - vi: Đọc hiểu một bài blog kể sự thay đổi lối sống.
  - vi: Dùng lại たばかり, ようになる, ことにする, たびに, ついでに, わりに, かわりに trong một câu chuyện.
  - vi: Viết vài câu kể thói quen mới của chính mình.
