key: ja:lesson:n3-you-ni-naru
order_index: 2
level: n3
title:
  vi: Thay đổi và quyết định - ～ようになる, ～ことにする
objectives:
  - vi: Kể sự thay đổi dần về khả năng, thói quen bằng ～ようになる.
  - vi: Nói quyết định của chính mình bằng ～ことにする, quy tắc riêng bằng ～ことにしている.
  - vi: Phân biệt ことにする (mình quyết) với ことになる (người khác / hoàn cảnh quyết).
estimated_minutes: 22
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:n3-tokoro]
