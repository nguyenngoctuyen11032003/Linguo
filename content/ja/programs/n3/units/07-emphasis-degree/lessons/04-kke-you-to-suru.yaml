title:
  vi: Hỏi lại điều quên và định làm - ～っけ, ～ようとする
objectives:
  - vi: Hỏi lại điều mình từng biết mà quên bằng ～っけ.
  - vi: Nói "vừa định... thì" và "cố... mà không được" bằng ～ようとする.
  - vi: Nói người khác "nhất quyết không chịu" bằng ～ようとしない.
