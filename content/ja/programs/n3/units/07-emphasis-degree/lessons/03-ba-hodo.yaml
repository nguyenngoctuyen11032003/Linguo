    role: reuse
  - item: ja:item:n3-gram-hodo-nai
    role: reuse
body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "càng luyện càng giỏi", "càng rẻ càng tốt" và "càng nghĩ càng không hiểu" - một mẫu giống hệt cặp "càng... càng..." của tiếng Việt.
  - type: explain
    text:
      vi: 'Lặp lại cùng một từ hai lần: dạng ば + dạng thường + ほど. Động từ - 読めば読むほど; tính từ い - 安ければ安いほど; tính từ な - 静かなら静かなほど (hoặc 静かであればあるほど).'
  - type: explain
    text:
      vi: 'Có thể bỏ nửa đầu và chỉ giữ V-る + ほど: 練習するほど上手になる. Vế sau là kết quả thay đổi theo, thường đi với なる, 増える, 難しくなる.'
  - type: deep_explain
    text:
      vi: 'ほど còn xuất hiện trong ～ほど～ない (không... bằng) mà bạn đã học: 東京ほど物価は高くない. Dấu hiệu nhận biết: ば～ほど luôn lặp lại cùng một từ, còn ほど～ない đứng sau danh từ và kết thúc bằng phủ định. Vế sau của ば～ほど không dùng quá khứ của một lần cụ thể.'
  - type: example
    target: 日本語は勉強すればするほど、面白くなります。
    target_lang: ja
    translation:
      vi: Tiếng Nhật càng học càng thấy thú vị.
  - type: example
    target: 部屋は広ければ広いほどいいですが、家賃も高くなります。
    target_lang: ja
    translation:
      vi: Phòng càng rộng càng tốt, nhưng tiền thuê cũng đắt hơn.
  - type: example
    target: 仕事は簡単なら簡単なほど、すぐ飽きてしまう。
    target_lang: ja
    translation:
      vi: Công việc càng đơn giản thì tôi càng nhanh chán.
    note:
      vi: Tính từ đuôi な - なら + な + ほど.
  - type: example
    target: 新しい町に慣れるほど、一人で出かけるのが楽しくなった。
    target_lang: ja
    translation:
      vi: Càng quen với thành phố mới, tôi càng thấy vui khi đi chơi một mình.
    note:
      vi: Dạng rút gọn - chỉ giữ V-る + ほど.
  - type: common_mistake
    wrong: 練習すれば練習したほど、上手になる。
    right: 練習すれば練習するほど、上手になる。
    target_lang: ja
    note:
      vi: Nửa sau dùng thể từ điển (するほど), không dùng thể た. ば～ほど nói quy luật chung, không phải chuyện một lần.
  - type: common_mistake
    wrong: 静かければ静かなほど、よく眠れる。
    right: 静かなら静かなほど、よく眠れる。
    target_lang: ja
    note:
      vi: 静か là tính từ đuôi な - dạng điều kiện là なら, không phải ければ.
  - type: summary
    points:
      - vi: V-ば + V-る + ほど; A-ければ + A-い + ほど; Na-なら + Na-な + ほど - càng... càng....
      - vi: Rút gọn - V-る + ほど.
      - vi: Khác ～ほど～ない (không... bằng).
      - vi: 上達 - tiến bộ (kỹ năng); 慣れる - quen.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n3-ba-hodo-mcq-form
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-ba-hodo
    prompt:
      stem: '"Rau càng tươi càng ngon." Chọn câu đúng.'
      stem_lang: vi
      options:
        - { id: v2b, text: 野菜は新鮮なら新鮮なほどおいしい。, lang: ja }
        - { id: n6m, text: 野菜は新鮮ければ新鮮なほどおいしい。, lang: ja }
        - { id: q1w, text: 野菜は新鮮なら新鮮だほどおいしい。, lang: ja }
        - { id: e5r, text: 野菜は新鮮ほど新鮮ならおいしい。, lang: ja }
    answer:
      correct_option_id: v2b
    explanation:
      vi: 新鮮 là tính từ đuôi な - なら + 新鮮な + ほど. ければ chỉ dùng cho tính từ い; trước ほど cần な, không phải だ.
    display_answer: 野菜は新鮮なら新鮮なほどおいしい。

