key: ja:lesson:n3-ba-hodo
order_index: 3
level: n3
title:
  vi: Càng... càng... - ～ば～ほど
objectives:
  - vi: Nói "càng... càng..." bằng ～ば～ほど với động từ, tính từ い và な.
  - vi: Rút gọn thành V-る + ほど khi muốn nói ngắn.
  - vi: Phân biệt ほど trong "càng... càng" với ほど～ない (không... bằng).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n3-koso-toori]
items:
  - item: ja:item:n3-gram-ba-hodo
  - item: ja:item:n3-joutatsu
