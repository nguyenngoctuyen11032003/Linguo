title:
  vi: Ôn tập - nhật ký "Năm nay nhất định chạy được 10 km"
objectives:
  - vi: Đọc hiểu một đoạn nhật ký dùng こそ, さえ～ば, ば～ほど, とおり, ようとする.
  - vi: Chọn đúng さえ (ngay cả) / さえ～ば (chỉ cần) và とおり / どおり theo ngữ cảnh.
  - vi: Viết vài câu kể về mục tiêu và quá trình cố gắng của mình.
estimated_minutes: 22
