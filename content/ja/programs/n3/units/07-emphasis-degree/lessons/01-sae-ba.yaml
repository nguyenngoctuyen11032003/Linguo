    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-sae
    prompt:
      instruction: "Sắp xếp thành câu: \"Chuyện đó tôi đến bạn thân cũng chưa kể.\""
      tokens:
        - { id: k4, text: 話していません }
