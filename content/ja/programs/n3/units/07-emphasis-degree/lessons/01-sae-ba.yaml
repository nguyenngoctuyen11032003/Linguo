title:
  vi: Ngay cả, chỉ cần - ～さえ và ～さえ～ば
objectives:
  - vi: Nhấn mạnh ví dụ cực đoan bằng ～さえ ("ngay cả").
  - vi: Nói điều kiện duy nhất là đủ bằng ～さえ～ば ("chỉ cần... là").
  - vi: Đặt さえ đúng chỗ với danh từ, trợ từ và động từ.
estimated_minutes: 18
skills: [grammar, speaking]
