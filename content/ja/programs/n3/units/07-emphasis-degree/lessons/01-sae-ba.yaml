  - key: ja:exercise:n3-sae-ba-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-sae
    prompt:
      template: "弟はとても忙しくて、家族{{b1}}連絡しない。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Em trai tôi bận đến mức ngay cả gia đình cũng không liên lạc."
        - "Gợi ý: trợ từ chỉ người nhận (に) + さえ."
    answer:
      blanks:
        b1: [にさえ]
    known_wrong:
      - answer: さえに
        feedback_vi: Với trợ từ に, さえ đứng sau - にさえ.
        error_tag: sae_position
      - answer: がさえ
        feedback_vi: Liên lạc "với" gia đình dùng に; さえ không đứng sau が.
        error_tag: sae_position
    explanation:
      vi: 家族に連絡する - liên lạc với gia đình; thêm さえ sau に - 家族にさえ (đến cả gia đình). Đây là ví dụ cực đoan, ngầm nói "huống chi bạn bè".
    display_answer: 弟はとても忙しくて、家族にさえ連絡しない。

