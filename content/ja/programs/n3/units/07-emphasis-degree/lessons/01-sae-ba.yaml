body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "bận đến mức cơm cũng không kịp ăn", "đến trẻ con cũng biết" và "chỉ cần có thời gian là tôi đi" - hai cách dùng rất khác nhau của cùng một chữ さえ.
  - type: explain
    text:
      vi: 'N + さえ - "ngay cả, đến cả": đưa ra trường hợp cực đoan để ngầm nói "huống chi cái khác". さえ thay は/が/を: 子どもさえ知っている. Với trợ từ khác thì さえ đứng sau: 親にさえ言わなかった (đến bố mẹ cũng không nói).'
  - type: explain
    text:
      vi: 'N + さえ + V-ば - "chỉ cần... là": 時間さえあれば, 地図さえあれば. Với động từ, chen さえ vào giữa: Vます-gốc + さえすれば - 練習しさえすれば, 薬を飲みさえすれば. Tiếng Việt cũng có cặp "chỉ cần... là..." đúng y như vậy.'
  - type: deep_explain
    text:
      vi: 'Cách phân biệt nhanh: phía sau có ば thì là "chỉ cần", không có ば (thường là phủ định hoặc câu ngạc nhiên) thì là "ngay cả". Chủ ngữ là người hay thêm で: 先生でさえ分からない. Văn N1 có すら cùng nghĩa "ngay cả" nhưng cứng hơn.'
  - type: example
    target: 引っ越したばかりで、近くのスーパーの場所さえ知らない。
    target_lang: ja
    translation:
      vi: Mới chuyển đến nên tôi đến chỗ siêu thị gần nhà cũng chưa biết.
  - type: example
    target: この問題は、先生でさえ難しいと言っていた。
    target_lang: ja
    translation:
      vi: Bài này đến thầy cũng nói là khó.
    note:
      vi: Chủ ngữ là người - でさえ.
  - type: example
    target: 材料さえそろえば、この料理は十分で作れます。
    target_lang: ja
    translation:
      vi: Chỉ cần đủ nguyên liệu là món này nấu trong mười phút.
  - type: example
    target: 毎日少しずつ練習しさえすれば、必ず上手になります。
    target_lang: ja
    translation:
      vi: Chỉ cần mỗi ngày luyện tập một chút là chắc chắn sẽ giỏi lên.
    note:
      vi: Động từ - Vます-gốc + さえすれば.
  - type: common_mistake
    wrong: 時間がさえあれば、旅行に行きたい。
    right: 時間さえあれば、旅行に行きたい。
    target_lang: ja
    note:
      vi: さえ thay luôn が, không đứng sau が. Chỉ với trợ từ khác như に, で mới giữ lại - 家族にさえ.
  - type: common_mistake
    wrong: 毎日練習するさえば、上手になる。
    right: 毎日練習しさえすれば、上手になる。
    target_lang: ja
    note:
      vi: Với động từ, さえ chen vào giữa gốc ます và すれば - 練習しさえすれば. Không gắn さえば vào thể từ điển.
  - type: summary
    points:
      - vi: N + (で)さえ - ngay cả, đến cả (ví dụ cực đoan); thay は/が/を.
      - vi: N + さえ + V-ば - chỉ cần... là.
      - vi: Vます-gốc + さえすれば - chỉ cần làm V là.
      - vi: 材料 - nguyên liệu; 道具 - dụng cụ.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n3-sae-ba-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n3-gram-sae
    prompt:
      stem: 'Câu 疲れて、シャワーを浴びる元気さえなかった。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: q3w, text: Mệt đến mức đến sức để tắm cũng không còn., lang: vi }
        - { id: e8r, text: Chỉ cần tắm là hết mệt ngay., lang: vi }
        - { id: t2y, text: Dù mệt nhưng tôi vẫn đi tắm., lang: vi }
        - { id: u7i, text: Tôi mệt vì tắm quá lâu., lang: vi }
    answer:
      correct_option_id: q3w
    explanation:
      vi: さえ không có ば phía sau và vế cuối phủ định (なかった) - nghĩa "ngay cả... cũng không". 元気 ở đây là sức lực để làm việc gì.
    display_answer: Mệt đến mức đến sức để tắm cũng không còn.

