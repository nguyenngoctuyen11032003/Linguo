  - key: ja:exercise:n3-sae-ba-wb-sae
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n3-gram-sae-ba
    prompt:
      instruction: "Sắp xếp thành câu: \"Chỉ cần trời đẹp là ngày mai sẽ đi biển.\""
      tokens:
        - { id: s3, text: 明日は海へ行きます }
        - { id: s1, text: 天気さえ }
        - { id: s4, text: よくさえ }
        - { id: s2, text: よければ }
    answer:
      orders:
        - [s1, s2, s3]
    explanation:
      vi: N さえ + A-ければ - chỉ cần (thời tiết) tốt là... いい → よければ. よくさえ thiếu ば và không đi với 天気さえ nên sai.
    display_answer: 天気さえよければ、明日は海へ行きます。

