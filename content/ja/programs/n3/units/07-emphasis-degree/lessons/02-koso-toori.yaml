    display_answer: 思ったとおり、今日のテストはとても難しかった。

  - key: ja:exercise:n3-koso-toori-wb-toori
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-setsumeisho
    prompt:
      instruction: "Sắp xếp thành câu: \"Hãy cài đặt đúng như sách hướng dẫn.\""
      tokens:
