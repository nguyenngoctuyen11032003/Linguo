      stem_lang: vi
      options:
        - id: qy4
          text: 避ける
          lang: ja
        - id: sl8
          text: 逃げる
          lang: ja
        - id: y1k
          text: 認める
          lang: ja
        - id: z2f
          text: 迷う
          lang: ja
    answer:
      correct_option_id: qy4
    explanation:
      vi: 避ける là tránh, né. 逃げる là chạy trốn, 迷う là do dự, 認める là thừa nhận.
    display_answer: 避ける
  - key: ja:exercise:n2-u12-verbs-v2
