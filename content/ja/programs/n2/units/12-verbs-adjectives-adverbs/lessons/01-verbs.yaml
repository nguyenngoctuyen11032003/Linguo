    difficulty: 5
    item: ja:item:n2-u12-mayou
    prompt:
      stem: Bạn phân vân không biết chọn bên nào. Câu nào đúng?
      stem_lang: vi
      options:
        - id: tky
          text: どちらにするか迷っています
          lang: ja
        - id: e60
          text: どちらにするか認めています
          lang: ja
        - id: a3h
          text: どちらにするか鍛えています
