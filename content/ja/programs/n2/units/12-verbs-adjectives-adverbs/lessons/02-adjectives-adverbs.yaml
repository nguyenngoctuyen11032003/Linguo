    difficulty: 5
    item: ja:item:n2-u12-kibishii
    prompt:
      source_text: Bố tôi là người nghiêm khắc trong giáo dục.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 父は教育に厳しい人です。
        - 父は教育に厳しいです。
        - ちちはきょういくにきびしいひとです。
        - 父は教育に厳しい人だ。
    known_wrong:
