title:
  vi: Ôn tập - bản tin về dự án cải tạo khu trước nhà ga
objectives:
  - vi: Đọc hiểu một bản tin địa phương dùng において, をめぐって, に基づいて, 末に.
  - vi: Chọn đúng あげく / 末に / 上で và に応じて / に基づいて theo ngữ cảnh.
  - vi: Viết lại tin ngắn bằng văn phong báo chí.
estimated_minutes: 22
skills: [reading, grammar, writing]
prerequisites: [ja:lesson:n2-u6-gachi-gimi]
