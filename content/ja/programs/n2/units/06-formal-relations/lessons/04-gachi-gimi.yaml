title:
  vi: Hay bị, hơi bị, có vẻ, đầy - ～がち, ～気味, ～っぽい, ～だらけ
objectives:
  - vi: Nói khuynh hướng xấu hay lặp lại bằng ～がち.
  - vi: Nói trạng thái nhẹ hiện tại bằng ～気味.
  - vi: Phân biệt ～っぽい (có vẻ, hay) và ～だらけ (đầy thứ không mong muốn).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-u6-ageku-sueni]
items:
  - item: ja:item:n2-u6-gram-gachi
  - item: ja:item:n2-u6-gram-gimi
