  - item: ja:item:n2-u6-nebusoku
body:
  - type: objective
    text:
      vi: Sau bài này, bạn tả sức khoẻ và tính cách tinh tế hơn - "dạo này hơi cảm", "mùa đông dễ lười vận động", "anh ấy hay quên", "bài văn đầy lỗi" - thay vì chỉ dùng よく hay たくさん.
  - type: explain
    text:
      vi: 'Vます-gốc / N + がち - "hay (bị), dễ..." cho chuyện không tốt lặp đi lặp lại: 遅れがち, 忘れがち, 病気がち, 曇りがち. Tiếng Việt nói "hay bị", tiếng Nhật gói vào một hậu tố và chia như tính từ đuôi な.'
  - type: explain
    text:
      vi: 'Vます-gốc / N + 気味 (ぎみ) - "hơi bị..., có dấu hiệu..." ở mức nhẹ, ngay bây giờ: 風邪気味, 疲れ気味, 太り気味. Khác がち: がち là chuyện hay lặp lại, 気味 là tình trạng hiện tại.'
  - type: explain
    text:
      vi: '～っぽい (khẩu ngữ): "trông giống, mang vẻ" (子どもっぽい, 白っぽい) hoặc "hay..." (忘れっぽい, 怒りっぽい). N + だらけ - "đầy, toàn là" thứ không mong muốn: 間違いだらけ, 傷だらけ, 泥だらけ.'
  - type: deep_explain
    text:
      vi: 'Cả bốn hậu tố đều nghiêng về nghĩa xấu, nên không dùng để khen. Thứ tốt đầy ắp nói いっぱい (花がいっぱい), không nói 花だらけ. っぽい khác らしい: 大人っぽい là "trông chín chắn (dù chưa phải người lớn)", 大人らしい là "người lớn cư xử đúng chất người lớn".'
  - type: example
    target: 一人暮らしを始めると、食事が偏りがちになる。
    target_lang: ja
    translation:
      vi: Bắt đầu sống một mình thì dễ ăn uống thiếu cân bằng.
  - type: example
    target: 昨日から少し風邪気味なので、今日は早めに寝ます。
    target_lang: ja
    translation:
      vi: Từ hôm qua tôi hơi bị cảm nên hôm nay sẽ ngủ sớm.
  - type: example
    target: 祖父は最近忘れっぽくなって、同じ話を何度もする。
    target_lang: ja
    translation:
      vi: Dạo này ông tôi hay quên, cứ kể đi kể lại một chuyện.
  - type: example
    target: 急いで書いたレポートは、間違いだらけだった。
    target_lang: ja
    translation:
      vi: Bản báo cáo viết vội đầy lỗi sai.
  - type: common_mistake
    wrong: 彼は毎日よく勉強しがちだ。
    right: 彼は毎日よく勉強する。
    target_lang: ja
    note:
      vi: がち chỉ dùng cho khuynh hướng không tốt. Thói quen tốt thì nói thẳng bằng động từ, hoặc dùng よく / いつも.
  - type: common_mistake
    wrong: この公園は春になると花だらけで、とてもきれいだ。
    right: この公園は春になると花がいっぱいで、とてもきれいだ。
    target_lang: ja
    note:
      vi: だらけ mang nghĩa "đầy thứ phiền phức", không hợp với lời khen. Thứ tốt, đẹp đầy ắp dùng いっぱい.
  - type: summary
    points:
      - vi: Vます / N + がち - hay bị (chuyện xấu lặp lại); chia như tính từ な.
      - vi: Vます / N + 気味 - hơi bị (trạng thái nhẹ, hiện tại).
      - vi: ～っぽい - trông giống / hay...; N + だらけ - đầy thứ không mong muốn.
      - vi: 寝不足 - thiếu ngủ.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u6-gachi-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-gram-gimi
    prompt:
      stem: 'Chọn từ hợp nhất: 面接の前なので、少し緊張 ＿＿ です。 ("Vì sắp phỏng vấn nên tôi hơi căng thẳng.")'
      stem_lang: vi
      options:
        - { id: f3g, text: 気味, lang: ja }
        - { id: i8j, text: だらけ, lang: ja }
        - { id: m4n, text: っぽさ, lang: ja }
        - { id: p9q, text: がちだけ, lang: ja }
    answer:
      correct_option_id: f3g
    explanation:
      vi: Một trạng thái nhẹ, xảy ra ngay lúc này - 緊張気味 (hơi căng thẳng). だらけ là "đầy" thứ gì đó trên bề mặt; っぽさ là danh từ "vẻ giống"; がちだけ không có.
    display_answer: 気味

  - key: ja:exercise:n2-u6-gachi-listen-gachi
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u6-gram-gachi
    prompt:
      audio_asset_id: null
      fallback_text: 梅雨の時期は、電車が遅れがちなので早めに家を出ます。
      options:
        - { id: s2t, text: Mùa mưa tàu hay bị trễ nên tôi ra khỏi nhà sớm., lang: vi }
        - { id: v7w, text: Mùa mưa tàu luôn chạy đúng giờ nên tôi ra khỏi nhà muộn., lang: vi }
        - { id: y3z, text: Hôm nay tàu bị trễ một lần nên tôi đến muộn., lang: vi }
        - { id: c8d, text: Mùa mưa tôi hay quên mang ô khi ra khỏi nhà., lang: vi }
    answer:
      correct_option_id: s2t
    explanation:
      vi: 遅れがち - hay bị trễ (khuynh hướng lặp lại, không phải một lần); 梅雨の時期 - mùa mưa; 早めに - sớm hơn một chút.
    display_answer: Mùa mưa tàu hay bị trễ nên tôi ra khỏi nhà sớm.

  - key: ja:exercise:n2-u6-gachi-fill-darake
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-gram-darake
    prompt:
      template: "雨の中でサッカーをして、ユニフォームが泥{{b1}}になった。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Chơi bóng dưới mưa nên bộ đồng phục lấm lem toàn bùn."
        - "Gợi ý: hậu tố \"đầy, toàn là (thứ bẩn, không mong muốn)\", ba chữ kana."
    answer:
      blanks:
        b1: [だらけ]
    known_wrong:
      - answer: いっぱい
        feedback_vi: いっぱい dùng cho thứ tốt hoặc trung tính; bị phủ đầy bùn bẩn là だらけ, nối thẳng vào danh từ (泥だらけ).
        error_tag: darake_ippai
      - answer: 気味
        feedback_vi: 気味 là "hơi bị" (trạng thái cơ thể, cảm xúc), không dùng cho bùn đất phủ trên áo.
        error_tag: darake_gimi
    explanation:
      vi: 泥だらけ - toàn bùn đất. だらけ chỉ một bề mặt bị phủ kín bởi thứ không mong muốn; になる ở cuối là "trở nên".
    display_answer: 雨の中でサッカーをして、ユニフォームが泥だらけになった。

  - key: ja:exercise:n2-u6-gachi-mcq-ppoi
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u6-gram-ppoi
    prompt:
      stem: 'Câu 彼女は中学生なのに、話し方が大人っぽい。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: g4h, text: Cô ấy mới học cấp hai mà cách nói chuyện đã chững chạc như người lớn., lang: vi }
        - { id: k9l, text: Cô ấy là người lớn nhưng nói chuyện như học sinh cấp hai., lang: vi }
        - { id: n5o, text: Cô ấy học cấp hai và không thích nói chuyện với người lớn., lang: vi }
        - { id: r1s, text: Cô ấy nói chuyện rất trẻ con so với tuổi., lang: vi }
    answer:
      correct_option_id: g4h
    explanation:
      vi: 大人っぽい - trông, nghe giống người lớn (dù thực ra chưa phải). なのに - vậy mà, cho thấy điều bất ngờ so với tuổi. Trẻ con là 子どもっぽい.
    display_answer: Cô ấy mới học cấp hai mà cách nói chuyện đã chững chạc như người lớn.

  - key: ja:exercise:n2-u6-gachi-wb-nebusoku
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-nebusoku
    prompt:
      instruction: "Sắp xếp thành câu: \"Vì đang mùa thi nên dạo này tôi hơi thiếu ngủ.\""
      tokens:
        - { id: n3, text: 寝不足気味です }
        - { id: n1, text: 試験の前なので }
        - { id: n4, text: 寝不足だらけです }
        - { id: n2, text: 最近 }
    answer:
      orders:
        - [n1, n2, n3]
        - [n2, n1, n3]
    explanation:
      vi: 寝不足気味 - hơi thiếu ngủ (trạng thái nhẹ, hiện tại). だらけ chỉ dùng cho thứ phủ đầy trên bề mặt (泥, 傷, 間違い), không gắn vào 寝不足.
    display_answer: 試験の前なので、最近寝不足気味です。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u6-gachi-fill-gachi
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-gachi
    prompt:
      template: "忙しいと、つい家族との約束を{{b1}}がちだ。(忘れる)"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [忘れ, わすれ]
    known_wrong:
      - answer: 忘れる
        feedback_vi: がち gắn vào gốc ます của động từ - 忘れます → 忘れがち.
        error_tag: gachi_form
      - answer: 忘れて
        feedback_vi: Không dùng thể て trước がち; dùng gốc ます - 忘れがち.
        error_tag: gachi_form
    explanation:
      vi: Vます-gốc + がち - hay bị... (忘れがち = hay quên). つい - lỡ, vô tình; khuynh hướng không tốt và lặp lại nên dùng がち.
    display_answer: 忙しいと、つい家族との約束を忘れがちだ。

  - key: ja:exercise:n2-u6-gachi-write-gimi
