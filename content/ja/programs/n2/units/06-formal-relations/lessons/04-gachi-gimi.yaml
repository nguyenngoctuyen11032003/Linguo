      vi: Mệt nhẹ ngay lúc này - 疲れ気味; お休みをいただけないでしょうか là lời xin phép lịch sự. 疲れだらけ không có; 疲れっぽいから…ね quá suồng sã; 疲れがち nói về khuynh hướng hay mệt, không hợp với lý do xin nghỉ hôm nay.
    display_answer: 少し疲れ気味なので、午前中はお休みをいただけないでしょうか。

