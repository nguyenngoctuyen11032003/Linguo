      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Căn phòng vừa chuyển đến toàn thùng các-tông, đến chỗ ngồi cũng không có.
        - Căn phòng mới chuyển đến đầy thùng các-tông, không có cả chỗ để ngồi.
        - Căn phòng vừa dọn đến chất đầy thùng giấy, chẳng có chỗ mà ngồi.
        - Phòng vừa chuyển tới toàn là thùng các tông, không có chỗ ngồi.
        - Căn phòng mới dọn vào toàn thùng carton, đến chỗ ngồi cũng chẳng có.
        - Căn phòng vừa chuyển nhà đến đầy thùng carton, không còn chỗ để ngồi.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Căn phòng vừa chuyển đến rất rộng, có nhiều chỗ ngồi.
        feedback_vi: 段ボールだらけ là "toàn thùng các-tông"; 座る場所もない là "đến chỗ ngồi cũng không có".
        error_tag: meaning
    explanation:
      vi: 引っ越したばかり - vừa mới chuyển đến; 段ボールだらけ - toàn thùng các-tông (phiền, bừa bộn); 座る場所もない - đến chỗ ngồi cũng không có.
    display_answer: Căn phòng vừa chuyển đến toàn thùng các-tông, đến chỗ ngồi cũng không có.

  - key: ja:exercise:n2-u6-gachi-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-gimi
    prompt:
      stem: Bạn gọi điện cho trưởng phòng xin nghỉ buổi sáng vì thấy hơi mệt, không quá nặng. Câu nào tự nhiên và lịch sự nhất?
      stem_lang: vi
      options:
        - { id: d6e, text: 少し疲れ気味なので、午前中はお休みをいただけないでしょうか。, lang: ja }
        - { id: h1i, text: 疲れだらけなので、午前中はお休みをいただけないでしょうか。, lang: ja }
        - { id: l7m, text: 少し疲れっぽいから、午前中休むね。, lang: ja }
        - { id: o2p, text: 少し疲れがちなので、今日の午前中はお休みをいただけないでしょうか。, lang: ja }
    answer:
      correct_option_id: d6e
