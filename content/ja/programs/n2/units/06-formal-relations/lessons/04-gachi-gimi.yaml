        - 最近太り気味なので、ジョギングを始めました。
        - 最近太り気味なので、ジョギングを始めた。
        - 最近少し太り気味なので、ジョギングを始めました。
        - 最近太り気味だから、ジョギングを始めました。
        - 最近太り気味なので、ランニングを始めました。
        - 最近ちょっと太り気味なので、ジョギングを始めました。
        - 最近太り気味なので、走り始めました。
