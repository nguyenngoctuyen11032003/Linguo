        feedback_vi: だらけ chỉ thứ phủ đầy trên bề mặt; tính hay nổi nóng dùng 怒りっぽい.
        error_tag: ppoi_darake
    explanation:
      vi: 'Vます-gốc + っぽい - hay..., dễ... (tính cách): 怒りっぽい, 忘れっぽい, 飽きっぽい. Người Nhật hay nói うちの部長 khi kể về sếp mình với người ngoài.'
    display_answer: うちの部長は怒りっぽいけど、いい人です。

