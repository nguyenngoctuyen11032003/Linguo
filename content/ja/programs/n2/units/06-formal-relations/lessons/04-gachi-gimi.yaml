        error_tag: gimi_form
      - answer: 最近太りがちなので、ジョギングを始めました。
        feedback_vi: Tăng cân lúc này là trạng thái hiện tại ở mức nhẹ - 太り気味. がち là chuyện hay lặp đi lặp lại.
        error_tag: gachi_gimi
    explanation:
      vi: 太り気味 - hơi béo lên (trạng thái hiện tại, mức nhẹ). Người Nhật dùng 気味 để nói về cơ thể một cách nhẹ nhàng, không quá nặng nề như 太った.
    display_answer: 最近太り気味なので、ジョギングを始めました。

  - key: ja:exercise:n2-u6-gachi-write-ppoi
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-ppoi
    prompt:
      source_text: Trưởng phòng của tôi dễ nổi nóng nhưng là người tốt. (dùng っぽい)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - うちの部長は怒りっぽいけど、いい人です。
        - うちの部長は怒りっぽいけど、いい人だ。
        - うちの部長は怒りっぽいですが、いい人です。
        - 私の部長は怒りっぽいけど、いい人です。
        - 部長は怒りっぽいけど、いい人です。
