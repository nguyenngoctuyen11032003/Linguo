key: ja:lesson:n2-u6-ni-oite-meguru
order_index: 1
level: n2
title:
  vi: Nơi chốn, đề tài và tâm điểm tranh luận - ～において, ～に関して, ～をめぐって
objectives:
  - vi: Thay で bằng において / における trong thông báo, báo cáo.
  - vi: Nêu đề tài trang trọng bằng に関して / に関する.
  - vi: Nói về vấn đề gây tranh cãi bằng をめぐって / をめぐる.
estimated_minutes: 20
skills: [grammar, reading]
prerequisites: [ja:lesson:n2-certainty-obligation-review]
items:
  - item: ja:item:n2-u6-gram-ni-oite
  - item: ja:item:n2-u6-gram-ni-kanshite
