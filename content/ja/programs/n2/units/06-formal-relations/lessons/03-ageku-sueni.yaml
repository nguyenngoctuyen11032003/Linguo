body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được "chờ mãi rốt cuộc bị huỷ", "suy nghĩ kỹ cuối cùng quyết định chuyển việc" và hiểu dòng chữ "xin đọc kỹ rồi mới ký" trên hợp đồng.
  - type: explain
    text:
      vi: 'V-た / N-の + あげく - "sau bao nhiêu..., rốt cuộc lại...". Quá trình dài, mệt mỏi và kết quả đáng thất vọng; người nói thường đang than phiền: さんざん迷ったあげく、何も買わなかった.'
  - type: explain
    text:
      vi: 'V-た / N-の + 末(に) - "sau khi... mãi, cuối cùng...". Cũng là quá trình dài (suy nghĩ, bàn bạc, cố gắng) nhưng trung tính, kết quả có thể tốt: 悩んだ末に、留学を決めた. Văn viết, báo chí dùng rất nhiều.'
  - type: explain
    text:
      vi: 'V-た / N-の + 上で - "sau khi đã... (rồi mới)...". Bước 1 là điều kiện cần cho bước 2: よく読んだ上で署名してください. Văn bản hành chính hay viết gọn: ご確認の上、お申し込みください.'
  - type: deep_explain
    text:
      vi: 'Cả ba đều nối "quá trình → kết quả", khác nhau ở cảm xúc và mục đích. あげく = than phiền ("rốt cuộc lại..."), 末に = kể khách quan ("cuối cùng thì..."), 上で = khuyên làm đúng thứ tự ("làm A cho kỹ đã rồi hãy B"). V-る + 上で lại mang nghĩa khác - "trong việc...": 外国で暮らす上で大切なこと (điều quan trọng khi sống ở nước ngoài).'
  - type: example
    target: 店員に一時間も説明させたあげく、その客は何も買わずに帰った。
    target_lang: ja
    translation:
      vi: Bắt nhân viên giải thích suốt cả tiếng đồng hồ, rốt cuộc vị khách đó lại về mà không mua gì.
  - type: example
    target: 三年間の研究の末、新しい薬が完成した。
    target_lang: ja
    translation:
      vi: Sau ba năm nghiên cứu, cuối cùng loại thuốc mới đã hoàn thành.
    note:
      vi: N-の + 末 - không cần に khi đứng giữa câu văn viết.
  - type: example
    target: 何度も検討を重ねた末に、計画は中止された。
    target_lang: ja
    translation:
      vi: Sau nhiều lần cân nhắc, cuối cùng kế hoạch đã bị dừng lại.
  - type: example
    target: 契約書の内容をよく確認した上で、サインしてください。
    target_lang: ja
    translation:
      vi: Xin hãy kiểm tra kỹ nội dung hợp đồng rồi mới ký.
  - type: common_mistake
    wrong: 一生懸命練習したあげく、優勝できました。
    right: 一生懸命練習した末に、優勝できました。
    target_lang: ja
    note:
      vi: Kết quả tốt đẹp không đi với あげく - nó mang giọng than phiền. Kể thành công sau cố gắng dùng 末に.
  - type: common_mistake
    wrong: 確認する上で、ご連絡ください。
    right: 確認した上で、ご連絡ください。
    target_lang: ja
    note:
      vi: Nghĩa "sau khi đã... rồi" cần thể た - 確認した上で (hoặc ご確認の上). V-る + 上で là "trong việc...", nghĩa khác hẳn.
  - type: summary
    points:
      - vi: V-た / Nの + あげく - rốt cuộc lại... (kết cục đáng than phiền).
      - vi: V-た / Nの + 末(に) - sau... mãi, cuối cùng... (trung tính, văn viết).
      - vi: V-た / Nの + 上で - sau khi đã... rồi mới...; V-る + 上で - trong việc....
      - vi: 悩む - băn khoăn, day dứt; 契約 - hợp đồng.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u6-ageku-mcq-choose
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-gram-ageku
    prompt:
      stem: 'Chọn từ hợp nhất: 道に迷って一時間も歩き回った ＿＿、結局タクシーを呼ぶことになった。 ("Lạc đường đi lòng vòng cả tiếng, rốt cuộc lại phải gọi taxi.")'
      stem_lang: vi
      options:
        - { id: e2f, text: あげく, lang: ja }
        - { id: h7i, text: 上で, lang: ja }
        - { id: l3m, text: うちに, lang: ja }
        - { id: o8p, text: 最中に, lang: ja }
    answer:
      correct_option_id: e2f
    explanation:
      vi: Quá trình dài, vất vả và kết quả không như ý (phải gọi taxi) - đúng sắc thái than phiền của あげく. 上で là "làm xong A rồi mới B"; うちに và 最中に chỉ thời điểm.
    display_answer: あげく

  - key: ja:exercise:n2-u6-ageku-listen-sueni
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u6-gram-sue-ni
    prompt:
      audio_asset_id: null
      fallback_text: 家族と何度も相談した末に、彼は田舎に帰ることを決めた。
      options:
        - { id: q4r, text: "Sau nhiều lần bàn bạc với gia đình, cuối cùng anh ấy quyết định về quê.", lang: vi }
        - { id: t9u, text: Anh ấy về quê rồi mới bàn bạc với gia đình., lang: vi }
        - { id: w5x, text: Gia đình đã bàn nhiều lần nhưng anh ấy vẫn chưa quyết định., lang: vi }
        - { id: z1a, text: Anh ấy quyết định về quê mà không bàn với gia đình., lang: vi }
    answer:
      correct_option_id: q4r
    explanation:
      vi: 何度も相談した末に - sau khi bàn bạc nhiều lần, cuối cùng...; 帰ることを決めた - đã quyết định về. 末に luôn có quá trình đi trước rồi mới đến kết quả.
    display_answer: Sau nhiều lần bàn bạc với gia đình, cuối cùng anh ấy quyết định về quê.

  - key: ja:exercise:n2-u6-ageku-fill-uede
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-gram-ue-de
    prompt:
      template: "ご注文の内容をご確認{{b1}}、「購入する」ボタンを押してください。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Xin kiểm tra nội dung đơn hàng rồi mới bấm nút \"Mua\"."
        - "Gợi ý: N + の + 上 - dạng gọn hay gặp trên web và giấy tờ."
    answer:
      blanks:
        b1: [の上, のうえ, の上で]
    known_wrong:
      - answer: の末
        feedback_vi: 末 là kết quả sau quá trình dài; ở đây là bước cần làm trước - の上.
        error_tag: ue_sue
      - answer: のあげく
        feedback_vi: あげく mang giọng than phiền, không dùng trong lời hướng dẫn.
        error_tag: ue_ageku
    explanation:
      vi: ご確認の上 - sau khi kiểm tra (rồi mới...). Đây là cách viết rút gọn của 確認した上で, rất hay gặp trên trang mua hàng và đơn đăng ký.
    display_answer: ご注文の内容をご確認の上、「購入する」ボタンを押してください。

  - key: ja:exercise:n2-u6-ageku-mcq-nayamu
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n2-u6-nayamu
    prompt:
      stem: 'Câu 姉は長い間、肩こりに悩んでいる。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: b6c, text: Chị tôi đã khổ sở vì chứng đau mỏi vai từ lâu., lang: vi }
        - { id: e1f, text: Chị tôi đang suy nghĩ có nên đi mát xa vai không., lang: vi }
        - { id: h8i, text: Chị tôi lâu rồi không bị đau vai nữa., lang: vi }
        - { id: k3l, text: Chị tôi lo lắng cho vai của người khác., lang: vi }
    answer:
      correct_option_id: b6c
    explanation:
      vi: N に悩む - khổ sở, phiền não vì N (bệnh, rắc rối). 肩こり - mỏi vai; ている ở đây là tình trạng kéo dài đến nay.
    display_answer: Chị tôi đã khổ sở vì chứng đau mỏi vai từ lâu.

  - key: ja:exercise:n2-u6-ageku-wb-sueni
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u6-gram-sue-ni
    prompt:
      instruction: "Sắp xếp thành câu: \"Sau khi băn khoăn mãi, tôi đã quyết định không ký hợp đồng.\""
      tokens:
        - { id: s3, text: 契約しないことにした }
