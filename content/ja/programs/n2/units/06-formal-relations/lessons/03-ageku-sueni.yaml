    explanation:
      vi: V-た + あげく - sau khi (làm) mãi, rốt cuộc lại... Phàn nàn cả tiếng mà không đề xuất gì - đúng kiểu kết cục đáng bực của あげく.
    display_answer: 彼は会議で一時間も文句を言ったあげく、何も提案しなかった。

  - key: ja:exercise:n2-u6-ageku-write-keiyaku
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-keiyaku
    prompt:
      source_text: Tôi sẽ bàn với cấp trên rồi mới ký hợp đồng. (dùng 上で)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 上司と相談した上で、契約します。
        - 上司と相談した上で契約します。
        - 上司に相談した上で、契約します。
        - 上司と相談した上で、契約いたします。
        - 上司と相談した上で、契約を結びます。
        - 上司に相談した上で、契約を結びます。
        - 上司と相談の上、契約します。
        - 上司と相談の上、契約いたします。
        - じょうしとそうだんしたうえで、けいやくします。
    known_wrong:
      - answer: 上司と相談する上で、契約します。
        feedback_vi: Nghĩa "sau khi đã bàn" cần thể た - 相談した上で. V-る + 上で là "trong việc...".
        error_tag: ue_de_form
      - answer: 上司と相談した末に、契約します。
        feedback_vi: 末に kể kết quả đã xảy ra sau quá trình dài; nói kế hoạch "bàn rồi mới ký" dùng 上で.
        error_tag: ue_sue
    explanation:
      vi: V-た + 上で - làm bước 1 (bàn với cấp trên) làm cơ sở rồi mới bước 2 (ký). 相談の上 là dạng gọn trang trọng; 契約する / 契約を結ぶ đều là "ký hợp đồng".
    display_answer: 上司と相談した上で、契約します。

  - key: ja:exercise:n2-u6-ageku-write-kentou
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u3-kentou
    prompt:
      source_text: Sau nhiều lần cân nhắc, cuối cùng công ty đã quyết định mở chi nhánh ở Việt Nam. (dùng 末に)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 何度も検討した末に、会社はベトナムに支店を出すことを決めた。
        - 何度も検討した末に、会社はベトナムに支店を出すことにした。
        - 何度も検討した末に、会社はベトナムに支店を開くことを決めた。
        - 何度も検討した末、会社はベトナムに支店を出すことを決めた。
        - 検討を重ねた末に、会社はベトナムに支店を出すことを決めた。
        - 検討を重ねた末、会社はベトナムに支店を出すことを決めた。
        - 会社は何度も検討した末に、ベトナムに支店を出すことを決めた。
        - 会社は検討を重ねた末に、ベトナムに支店を出すことを決めた。
        - 何度も検討した末に、会社はベトナムに支店を出すことを決めました。
        - 何度も検討した末に、会社はベトナムに支店を開設することを決めた。
    known_wrong:
      - answer: 何度も検討するの末に、会社はベトナムに支店を出すことを決めた。
        feedback_vi: Động từ trước 末に dùng thể た (検討した); の chỉ đi sau danh từ (検討の末に).
        error_tag: sue_form
      - answer: 何度も検討したあげく、会社はベトナムに支店を出すことを決めた。
        feedback_vi: Mở chi nhánh là kết quả bình thường, không có gì phải than phiền - dùng 末に.
        error_tag: ageku_sue
    explanation:
      vi: V-た + 末に - sau quá trình dài (検討 = cân nhắc kỹ) cuối cùng đi đến kết quả. 検討を重ねる - cân nhắc nhiều lần; 支店を出す / 開く - mở chi nhánh.
    display_answer: 何度も検討した末に、会社はベトナムに支店を出すことを決めた。

  # ---------------- application ----------------
  - key: ja:exercise:n2-u6-ageku-translate-vi
    type: translate
