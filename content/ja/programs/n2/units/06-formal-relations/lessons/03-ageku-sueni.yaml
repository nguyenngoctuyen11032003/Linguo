      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Em trai tôi làm bố mẹ lo lắng đủ điều, rốt cuộc lại bỏ đại học.
        - Em trai tôi khiến bố mẹ lo lắng đủ điều, cuối cùng lại bỏ học đại học.
