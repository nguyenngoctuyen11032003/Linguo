      vi: さんざん悩んだ末に - sau khi băn khoăn hết mức, cuối cùng... 末に cần thể た (悩んだ); 悩む上で là "trong việc băn khoăn", sai nghĩa.
    display_answer: さんざん悩んだ末に、契約しないことにした。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u6-ageku-fill-ageku
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-ageku
    prompt:
      template: "彼は会議で一時間も文句を{{b1}}あげく、何も提案しなかった。(言う)"
