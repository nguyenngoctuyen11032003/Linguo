    display_answer: Em trai tôi làm bố mẹ lo lắng đủ điều, rốt cuộc lại bỏ đại học.

  - key: ja:exercise:n2-u6-ageku-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u6-gram-ue-de
    prompt:
      stem: Bạn nhận được lời mời làm việc nhưng muốn bàn với gia đình trước khi trả lời. Bạn nói gì với người tuyển dụng một cách lịch sự?
      stem_lang: vi
      options:
        - { id: n2o, text: 家族と相談した上で、改めてお返事いたします。, lang: ja }
        - { id: r7s, text: 家族と相談したあげく、改めてお返事いたします。, lang: ja }
        - { id: v3w, text: 家族と相談する上で、改めてお返事いたします。, lang: ja }
        - { id: y8z, text: 家族と相談の末、改めて返事するよ。, lang: ja }
    answer:
      correct_option_id: n2o
    explanation:
      vi: Kế hoạch "bàn xong rồi mới trả lời" - V-た + 上で, kèm khiêm nhường お返事いたします. あげく là than phiền; 相談する上で sai thể; phương án cuối dùng 末 cho việc chưa xảy ra và kết bằng giọng suồng sã.
    display_answer: 家族と相談した上で、改めてお返事いたします。

