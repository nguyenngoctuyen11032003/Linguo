key: ja:lesson:n2-u6-ageku-sueni
order_index: 3
level: n2
title:
  vi: Kết cục sau một quá trình - ～あげく, ～末に, ～上で
objectives:
  - vi: Kể kết cục đáng thất vọng sau quá trình dài bằng ～あげく.
  - vi: Kể kết quả sau nhiều cân nhắc, cố gắng bằng ～末に.
  - vi: Nói "sau khi đã... rồi mới..." bằng ～上で.
estimated_minutes: 20
skills: [grammar, writing]
prerequisites: [ja:lesson:n2-u6-ni-motozuite]
