      diacritics: lenient
    known_wrong:
      - answer: Cùng với sự thay đổi của thời đại, cách làm việc của mọi người đã thay đổi hoàn toàn.
        feedback_vi: つつある là "đang dần thay đổi", quá trình chưa xong - không phải "đã thay đổi hoàn toàn".
        error_tag: tsutsu_meaning
      - answer: Vì cách làm việc thay đổi nên thời đại thay đổi.
        feedback_vi: Quan hệ ngược - thời đại thay đổi (vế trước) kéo theo cách làm việc thay đổi (vế sau).
        error_tag: order_meaning
    explanation:
      vi: 時代の変化とともに - cùng với sự thay đổi của thời đại; 働き方 - cách làm việc; 変わりつつある - đang dần thay đổi.
    display_answer: Cùng với sự thay đổi của thời đại, cách làm việc của mọi người cũng đang dần thay đổi.

