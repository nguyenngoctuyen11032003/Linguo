    display_answer: 町の様子は急速に変わりつつある。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u1-review-fill-email
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u1-gram-shidai
    prompt:
      template: "会議の{{b1}}にお電話をいただき、失礼いたしました。資料は確認でき{{b2}}、お送りいたします。"
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 2 }
    answer:
      blanks:
        b1: [最中, さいちゅう]
        b2: [次第, しだい]
    known_wrong:
      - answer: とたん
        feedback_vi: とたん đi với thể た và không dùng cho lời hứa. Sau gốc ます でき dùng 次第.
        error_tag: totan_shidai
      - answer: うち
        feedback_vi: 会議のうちに không tự nhiên; cuộc gọi xen vào đúng lúc đang họp dùng 最中に.
        error_tag: uchini_saichuu
    explanation:
      vi: Vế đầu kể chuyện đã xảy ra - 会議の最中に. Vế sau là lời hứa - 確認でき次第 (gốc ます của できる + 次第).
    display_answer: 会議の最中にお電話をいただき、失礼いたしました。資料は確認でき次第、お送りいたします。

