  - key: ja:exercise:n2-u1-review-fill-mix
    type: fill_blank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u1-gram-uchini
    prompt:
      template: "商店街の店は減る{{b1}}だ。今の{{b2}}に、好きな店に行っておこう。"
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 2 }
    answer:
      blanks:
        b1: [一方, いっぽう]
        b2: [うち]
    known_wrong:
      - answer: 最中
        feedback_vi: '"Nhân lúc bây giờ còn (cửa hàng)" dùng 今のうちに. 最中 là đúng lúc đang làm dở một việc cụ thể.'
        error_tag: uchini_saichuu
      - answer: つつある
        feedback_vi: つつある gắn vào gốc ます (減りつつある) và không có だ phía sau. Sau 減る + だ dùng 一方.
        error_tag: tsutsu_form
    explanation:
      vi: 減る一方だ - cứ giảm mãi; 今のうちに - nhân lúc bây giờ (còn kịp), trước khi cửa hàng biến mất.
    display_answer: 商店街の店は減る一方だ。今のうちに、好きな店に行っておこう。
