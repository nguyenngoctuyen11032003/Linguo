  - key: ja:exercise:n2-u1-totan-fill-tachiagatta
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n2-u1-gram-totan
    prompt:
      template: "椅子から{{b1}}とたん、めまいがした。(立ち上がる)"
      blanks:
        - { id: b1, width_hint: 6 }
      hint_levels:
        - "Nghĩa: Vừa đứng dậy khỏi ghế thì tôi bị chóng mặt."
        - "Gợi ý: とたん luôn đi với thể た."
    answer:
      blanks:
        b1: [立ち上がった, たちあがった, 立ちあがった]
    known_wrong:
      - answer: 立ち上がる
        feedback_vi: とたん không gắn vào thể từ điển - 立ち上がったとたん.
        error_tag: totan_form
      - answer: 立ち上がり
        feedback_vi: Gốc ます đi với 次第, không đi với とたん. Dùng 立ち上がったとたん.
        error_tag: totan_shidai
    explanation:
      vi: 立ち上がる → 立ち上がった + とたん. Chóng mặt là chuyện ngoài ý muốn, rất hợp với たとたん.
    display_answer: 椅子から立ち上がったとたん、めまいがした。

  - key: ja:exercise:n2-u1-totan-wb-hanmei
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-hanmei
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Ngay khi xác định được nguyên nhân sự cố, chúng tôi sẽ thông báo.\""
      tokens:
        - { id: h3, text: お知らせします }
        - { id: h4, text: 判明した次第 }
        - { id: h1, text: 事故の原因が }
        - { id: h2, text: 判明し次第 }
    answer:
      orders:
        - [h1, h2, h3]
    explanation:
      vi: 判明する → 判明し + 次第. 判明した次第 sai vì 次第 không gắn vào thể た. 原因が判明する - nguyên nhân được làm rõ (tự động từ, dùng が).
    display_answer: 事故の原因が判明し次第、お知らせします。

  - key: ja:exercise:n2-u1-totan-mcq-orikaeshi
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n2-u1-orikaesu
    prompt:
      stem: Nhân viên công ty nói qua điện thoại 「後ほど折り返しお電話いたします。」 Ý họ là gì?
      stem_lang: vi
      options:
        - { id: o4m, text: Lát nữa chúng tôi sẽ gọi lại cho anh/chị., lang: vi }
        - { id: d9t, text: Xin anh/chị lát nữa gọi lại., lang: vi }
        - { id: k2r, text: Chúng tôi sẽ chuyển máy cho người phụ trách., lang: vi }
        - { id: f7a, text: Anh/chị đã gọi nhầm số., lang: vi }
    answer:
      correct_option_id: o4m
    explanation:
      vi: 折り返し電話する - phía nhận cuộc gọi chủ động gọi lại. いたします là khiêm nhường ngữ, chủ ngữ là "chúng tôi". Nhờ khách gọi lại sẽ là かけ直していただけますか.
    display_answer: Lát nữa chúng tôi sẽ gọi lại cho anh/chị.

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u1-totan-fill-touchaku
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-touchaku
    prompt:
      template: "荷物が{{b1}}次第、お知らせします。(到着する)"
