    known_wrong:
      - answer: 到着した
        feedback_vi: 次第 không gắn vào thể た. Dùng 到着し次第 (gốc ます) hoặc 到着次第 (danh từ).
        error_tag: shidai_form
      - answer: 到着する
        feedback_vi: 次第 không gắn vào thể từ điển. Dùng 到着し次第 hoặc 到着次第.
        error_tag: shidai_form
    explanation:
      vi: Với động từ する, 次第 gắn vào し (到着し次第) hoặc thẳng vào danh từ (到着次第) - cả hai đều đúng.
    display_answer: 荷物が到着し次第、お知らせします。

