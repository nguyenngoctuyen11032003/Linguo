      vi: ～にしたがう (従う) - làm theo, tuân theo; 規則 / ルール - quy định. 規則を守る (giữ quy định) cũng diễn đạt được ý này.
    display_answer: 会社の規則にしたがってください。

  # ---------------- application ----------------
  - key: ja:exercise:n2-u1-tsurete-mcq-natural
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u1-gram-nitsurete
    prompt:
      stem: Câu nào dùng ～につれて tự nhiên?
      stem_lang: vi
      options:
        - { id: l7a, text: 日本語が上手になるにつれて、日本の生活が楽しくなってきた。, lang: ja }
        - { id: q3e, text: 日本に来るにつれて、すぐ友達に電話した。, lang: ja }
        - { id: d8s, text: 先生の指示につれて、レポートを書いてください。, lang: ja }
        - { id: g4m, text: 春になったにつれて、桜が咲きました。, lang: ja }
    answer:
      correct_option_id: l7a
    explanation:
      vi: Tiếng Nhật giỏi dần - cuộc sống vui dần, hai vế đều là thay đổi. Gọi điện một lần không hợp; "theo chỉ thị" phải dùng にしたがって; につれて không gắn vào thể た.
    display_answer: 日本語が上手になるにつれて、日本の生活が楽しくなってきた。

  - key: ja:exercise:n2-u1-tsurete-translate-to-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u1-fukyuu
    prompt:
      source_text: スマートフォンが普及するにつれて、公衆電話が減ってきた。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Điện thoại thông minh càng phổ biến thì điện thoại công cộng càng ít đi.
        - Điện thoại thông minh càng phổ biến thì điện thoại công cộng càng giảm.
        - Điện thoại thông minh càng phổ biến thì điện thoại công cộng càng ít.
        - Smartphone càng phổ biến thì điện thoại công cộng càng ít đi.
        - Smartphone càng phổ biến thì điện thoại công cộng càng giảm.
        - Cùng với sự phổ biến của điện thoại thông minh, điện thoại công cộng đã giảm đi.
        - Cùng với sự phổ biến của điện thoại thông minh, điện thoại công cộng giảm dần.
        - Cùng với sự phổ cập của điện thoại thông minh, điện thoại công cộng đã giảm đi.
        - Khi điện thoại thông minh ngày càng phổ biến thì điện thoại công cộng giảm dần.
        - Khi điện thoại thông minh trở nên phổ biến, điện thoại công cộng đã ít dần đi.
        - Điện thoại thông minh ngày càng phổ biến nên điện thoại công cộng ít dần.
        - Điện thoại thông minh càng phổ biến, điện thoại công cộng càng ít đi.
        - Điện thoại thông minh càng phổ biến, điện thoại công cộng càng giảm.
        - Theo sự phổ cập của điện thoại thông minh, điện thoại công cộng đã giảm đi.
        - Điện thoại di động thông minh càng phổ biến thì điện thoại công cộng càng ít đi.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Điện thoại thông minh càng phổ biến thì điện thoại công cộng càng nhiều.
        feedback_vi: 減ってきた là giảm dần, ít đi - không phải nhiều lên.
        error_tag: vocab_meaning
      - answer: Vì điện thoại công cộng giảm nên điện thoại thông minh phổ biến.
        feedback_vi: Quan hệ ngược - smartphone phổ biến (vế trước) kéo theo điện thoại công cộng giảm (vế sau).
        error_tag: order_meaning
    explanation:
      vi: 普及するにつれて - càng phổ biến; 公衆電話 - điện thoại công cộng; 減ってきた - đã ít dần đi.
    display_answer: Điện thoại thông minh càng phổ biến thì điện thoại công cộng càng ít đi.

