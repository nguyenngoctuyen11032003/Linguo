      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 年を取るにつれて、体力が落ちる。
        - 年を取るにつれて、体力が落ちてくる。
        - 年を取るにつれて、体力が落ちていく。
        - 年を取るにつれて、体力が落ちてきた。
        - 年を取るにつれて、体力が落ちます。
        - 年を取るにつれて、体力が落ちてきます。
        - 年を取るにつれて、体力が落ちていきます。
        - 年を取るにつれて、体力が低下する。
        - 年を取るにつれて、体力が低下していく。
        - 年を取るにつれて、体力が衰える。
        - 年を取るにつれて、体力が衰えていく。
        - 年を取るにつれて、体力が弱くなる。
        - 年を取るにつれて、体力がなくなってくる。
        - 年をとるにつれて、体力が落ちる。
        - 年をとるにつれて、体力が落ちてくる。
        - 年をとるにつれて、体力が落ちていく。
        - 年齢が上がるにつれて、体力が落ちる。
        - 年齢が上がるにつれて、体力が落ちていく。
