      direction: vi_to_target
    answer:
      accepted:
        - 会社の規則にしたがってください。
        - 会社の規則に従ってください。
        - 会社のルールにしたがってください。
        - 会社のルールに従ってください。
        - 会社の規則にしたがって行動してください。
        - 会社の規則に従って行動してください。
        - 会社のルールにしたがって行動してください。
        - 会社のルールに従って行動してください。
        - 会社の規則を守ってください。
        - 会社のルールを守ってください。
        - 会社の決まりに従ってください。
        - 会社の決まりにしたがってください。
