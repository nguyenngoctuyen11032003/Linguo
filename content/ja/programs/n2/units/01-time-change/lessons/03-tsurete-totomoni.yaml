  - key: ja:exercise:n2-u1-tsurete-fill-shiji
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-gram-nishitagatte
    prompt:
      template: "係員の指示{{b1}}、避難してください。"
      blanks:
        - { id: b1, width_hint: 6 }
      hint_levels:
        - "Nghĩa: Xin hãy sơ tán theo hướng dẫn của nhân viên."
        - "Gợi ý: nghĩa \"tuân theo\" chỉ có ở một trong ba mẫu của bài."
    answer:
      blanks:
        b1: [にしたがって, に従って, にしたがい, に従い]
    known_wrong:
      - answer: につれて
        feedback_vi: につれて chỉ có nghĩa "càng... càng...", không có nghĩa "tuân theo". Dùng にしたがって.
        error_tag: tsurete_shitagatte
      - answer: とともに
        feedback_vi: 指示とともに là "cùng với chỉ thị", không phải "làm theo chỉ thị". Dùng にしたがって.
        error_tag: totomoni_shitagatte
    explanation:
      vi: 指示にしたがって - làm theo chỉ thị. Văn bản thông báo hay viết にしたがい hoặc に従い.
    display_answer: 係員の指示にしたがって、避難してください。

  - key: ja:exercise:n2-u1-tsurete-wb-fukyuu
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-gram-totomoni
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Cùng với sự phổ cập của Internet, cuộc sống đã thay đổi rất nhiều.\""
      tokens:
        - { id: f3, text: 生活が }
        - { id: f5, text: 普及しとともに }
        - { id: f4, text: 大きく変わった }
        - { id: f2, text: 普及とともに }
        - { id: f1, text: インターネットの }
    answer:
      orders:
        - [f1, f2, f3, f4]
        - [f3, f1, f2, f4]
    explanation:
      vi: Danh từ + とともに - 普及とともに (hoặc động từ thể từ điển - 普及するとともに). 普及しとともに sai dạng. 生活が có thể đứng đầu câu.
    display_answer: インターネットの普及とともに、生活が大きく変わった。

  - key: ja:exercise:n2-u1-tsurete-mcq-koureika
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n2-u1-koureika
    prompt:
      stem: 「日本では高齢化が進んでいる。」 Từ 高齢化 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: r5h, text: sự già hoá dân số, lang: vi }
        - { id: t1k, text: sự giảm tỉ lệ sinh, lang: vi }
        - { id: v6w, text: sự đô thị hoá, lang: vi }
        - { id: c2o, text: sự tăng dân số, lang: vi }
    answer:
      correct_option_id: r5h
    explanation:
      vi: 高齢 - tuổi cao; 化 - hoá. 高齢化が進む - dân số già hoá ngày càng tăng. Giảm tỉ lệ sinh là 少子化.
    display_answer: sự già hoá dân số

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u1-tsurete-fill-zouka
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-zouka
    prompt:
      template: "観光客が{{b1}}につれて、ホテルも増えてきた。(増加する)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [増加する, ぞうかする]
    known_wrong:
      - answer: 増加した
        feedback_vi: につれて gắn vào thể từ điển - 増加するにつれて.
        error_tag: tsurete_form
      - answer: 増加し
        feedback_vi: Gốc ます không đi với につれて. Dùng 増加するにつれて.
        error_tag: tsurete_form
    explanation:
      vi: Trước につれて có が nên cần động từ - 増加するにつれて. Nếu dùng danh từ thì là 観光客の増加につれて.
    display_answer: 観光客が増加するにつれて、ホテルも増えてきた。

  - key: ja:exercise:n2-u1-tsurete-translate-tairyoku
