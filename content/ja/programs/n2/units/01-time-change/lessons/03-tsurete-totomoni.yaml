    known_wrong:
      - answer: 年を取ったにつれて、体力が落ちる。
        feedback_vi: につれて gắn vào thể từ điển - 年を取るにつれて.
        error_tag: tsurete_form
      - answer: 年を取るにつれて、体力が上がる。
        feedback_vi: 上がる là tăng; "giảm" là 落ちる / 低下する / 衰える.
        error_tag: vocab_meaning
    explanation:
      vi: 年を取る - có tuổi, già đi; 体力が落ちる - thể lực giảm. ～てくる / ～ていく nhấn mạnh thay đổi dần.
    display_answer: 年を取るにつれて、体力が落ちていく。

  - key: ja:exercise:n2-u1-tsurete-translate-rule
    type: translate
    stage: recall
