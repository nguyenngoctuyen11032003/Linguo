    answer:
      correct_option_id: g6n
    explanation:
      vi: ～に夢中になる - mải mê, say mê với ... Chữ 夢 (mơ) dễ khiến người học nghĩ đến "giấc mơ", nhưng 夢中 là say mê.
    display_answer: Em trai đang mải mê chơi game.

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u1-uchini-fill-jugyou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-gram-saichuuni
    prompt:
      template: "授業の{{b1}}に、携帯電話が鳴ってしまった。(đúng lúc đang giữa chừng)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [最中, さいちゅう]
    known_wrong:
      - answer: うち
        feedback_vi: うちに mang ý "nhân lúc còn..."; chuyện xen vào cắt ngang đúng lúc đang học dùng 最中に.
        error_tag: uchini_saichuu
      - answer: 間
        feedback_vi: 授業の間に là "trong khoảng giờ học", không nhấn "đúng lúc đang giữa chừng". Gợi ý trong ngoặc cần 最中.
        error_tag: aida_saichuu
    explanation:
      vi: 授業の最中に - đúng lúc đang học thì điện thoại reo (chuyện ngoài ý muốn, nên có てしまった).
    display_answer: 授業の最中に、携帯電話が鳴ってしまった。

