  - key: ja:exercise:n2-u1-uchini-fill-samenai
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-sameru
    prompt:
      template: "スープが{{b1}}うちに、飲んでください。(冷める)"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Hãy uống canh trước khi nó nguội."
        - "Gợi ý: \"trước khi... xảy ra\" dùng thể ない + うちに."
    answer:
      blanks:
        b1: [冷めない, さめない]
    known_wrong:
      - answer: 冷める
        feedback_vi: '"Trước khi nguội" phải dùng thể ない - 冷めないうちに. 冷めるうちに không có nghĩa.'
        error_tag: naiuchini
      - answer: 冷めた
        feedback_vi: うちに không đi với thể た. Dùng 冷めないうちに (trước khi nguội).
        error_tag: uchini_form
    explanation:
      vi: 冷めないうちに - nhân lúc chưa nguội, tức "trước khi nguội". Ý câu là uống ngay kẻo mất cơ hội uống nóng.
    display_answer: スープが冷めないうちに、飲んでください。

  - key: ja:exercise:n2-u1-uchini-wb-ryouri
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n2-u1-gram-saichuuni
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Đang nấu ăn dở thì điện thoại reo.\""
      tokens:
