  - key: ja:exercise:n2-u1-uchini-translate-teiden
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-teiden
    prompt:
      source_text: Đang nấu ăn giữa chừng thì bị mất điện. (dùng 最中)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 料理をしている最中に、停電した。
        - 料理をしている最中に、停電しました。
        - 料理をしている最中に、停電になった。
