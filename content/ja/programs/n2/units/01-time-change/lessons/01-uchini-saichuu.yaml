    explanation:
      vi: Động từ trước 最中に phải ở dạng ている - 料理をしている最中に. 料理をする最中に là lỗi hay gặp.
    display_answer: 料理をしている最中に、電話が鳴った。

  - key: ja:exercise:n2-u1-uchini-mcq-muchuu
