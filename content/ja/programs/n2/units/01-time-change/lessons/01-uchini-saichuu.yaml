    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n2-u1-muchuu
    prompt:
      stem: 「弟はゲームに夢中になっている。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: g6n, text: Em trai đang mải mê chơi game., lang: vi }
        - { id: b2x, text: Em trai đã chán chơi game., lang: vi }
        - { id: u5j, text: Em trai bị cấm chơi game., lang: vi }
