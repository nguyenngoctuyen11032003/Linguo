  - key: ja:exercise:n2-u1-kake-fill-ippou
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-gram-ippouda
    prompt:
      template: "最近、物価は{{b1}}一方だ。(上がる)"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Dạo này vật giá cứ tăng mãi."
        - "Gợi ý: 一方だ gắn vào thể từ điển."
    answer:
      blanks:
        b1: [上がる, あがる]
    known_wrong:
      - answer: 上がっている
        feedback_vi: 一方だ không đi với ている - 上がる一方だ.
        error_tag: ippou_form
      - answer: 上がった
        feedback_vi: 一方だ không đi với thể た - 上がる一方だ.
        error_tag: ippou_form
    explanation:
      vi: 上がる一方だ - cứ tăng mãi, không có dấu hiệu dừng. Câu có giọng than phiền.
    display_answer: 最近、物価は上がる一方だ。

