    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u1-gram-tsutsuaru
    prompt:
      stem: Câu nào dùng ～つつある tự nhiên?
      stem_lang: vi
      options:
        - { id: c5t, text: 日本に住む外国人の数は増えつつある。, lang: ja }
        - { id: h7v, text: 弟は今、部屋でゲームをしつつある。, lang: ja }
        - { id: y2n, text: 私は毎朝コーヒーを飲みつつある。, lang: ja }
        - { id: m9f, text: 人口が減るつつある。, lang: ja }
    answer:
      correct_option_id: c5t
    explanation:
      vi: 増える là động từ thay đổi, số người nước ngoài đang dần tăng. Chơi game, uống cà phê là hành động bình thường - dùng ている; 減るつつある sai dạng (phải là 減りつつある).
    display_answer: 日本に住む外国人の数は増えつつある。

