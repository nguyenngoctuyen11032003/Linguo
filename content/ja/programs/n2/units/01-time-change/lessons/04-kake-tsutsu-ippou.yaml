  - key: ja:exercise:n2-u1-kake-mcq-ippou
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u1-gram-ippouda
    prompt:
      stem: 'Bạn than với đồng nghiệp: "Việc thì cứ tăng mãi, mệt quá." Câu nào hợp nhất?'
      stem_lang: vi
      options:
        - { id: w3a, text: 仕事は増える一方で、疲れたよ。, lang: ja }
        - { id: b8e, text: 仕事は増えかけで、疲れたよ。, lang: ja }
        - { id: i1g, text: 仕事は増えた一方で、疲れたよ。, lang: ja }
        - { id: t6r, text: 仕事は増え次第で、疲れたよ。, lang: ja }
    answer:
      correct_option_id: w3a
    explanation:
      vi: 増える一方で - cứ tăng mãi (dạng nối của 一方だ), có giọng than phiền. 増えかけ là "tăng dở", 増えた一方 sai dạng, 増え次第 là "ngay khi tăng".
    display_answer: 仕事は増える一方で、疲れたよ。

  - key: ja:exercise:n2-u1-kake-fill-mix
    type: fill_blank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u1-gram-tsutsuaru
    prompt:
      template: "この町の人口は減り{{b1}}。一方で、高齢者の数は増える{{b2}}。"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [つつある]
        b2: [一方だ, いっぽうだ, 一方です, いっぽうです]
    known_wrong:
      - answer: かけだ
        feedback_vi: かけ là "dở dang", không dùng cho dân số đang thay đổi. Sau gốc ます 減り dùng つつある.
        error_tag: kake_tsutsu
      - answer: 次第だ
        feedback_vi: 次第 là "ngay khi... sẽ", không nói thay đổi đang diễn ra.
        error_tag: shidai_meaning
    explanation:
      vi: 減り (gốc ます) + つつある - đang dần giảm; 増える (thể từ điển) + 一方だ - cứ tăng mãi. Dạng của động từ đứng trước cho biết mẫu nào phù hợp.
    display_answer: この町の人口は減りつつある。一方で、高齢者の数は増える一方だ。
