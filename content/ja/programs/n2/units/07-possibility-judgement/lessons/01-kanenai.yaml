key: ja:lesson:n2-u7-kanenai
order_index: 1
level: n2
title:
  vi: Có nguy cơ dẫn đến... - ～かねない (so với ～かねる và ～恐れがある)
objectives:
  - vi: Cảnh báo kết quả xấu có thể xảy ra bằng Vます-gốc + かねない.
  - vi: Phân biệt かねない (có thể xảy ra) với かねる (khó mà làm được).
  - vi: Chọn giữa かねない (chủ quan, hội thoại) và 恐れがある (khách quan, thông báo).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-formal-relations-review]
items:
  - item: ja:item:n2-u7-gram-kanenai
  - item: ja:item:n2-u7-jiko
