      vi: コップを割る - làm vỡ cốc (割る dùng cho thuỷ tinh, gốm); てしまった - lỡ; 弁償しました - đã đền.
    display_answer: 店のコップを割ってしまったので、弁償しました。

  - key: ja:exercise:n2-u7-review-write-suginai
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-ni-suginai
    prompt:
      source_text: Lần này chỉ là lỗi nhỏ, nhưng lần sau xin hãy cẩn thận. (dùng に過ぎない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 今回は小さなミスにすぎないが、次は気をつけてください。
        - 今回は小さなミスにすぎませんが、次は気をつけてください。
        - 今回は小さなミスに過ぎないが、次は気をつけてください。
        - 今回は小さなミスにすぎないけど、次は気をつけてください。
        - 今回は小さなミスにすぎないが、次回は気をつけてください。
        - 今回は小さなミスにすぎないが、次は注意してください。
        - 今回はちょっとしたミスにすぎないが、次は気をつけてください。
        - こんかいはちいさなミスにすぎないが、つぎはきをつけてください。
    known_wrong:
      - answer: 今回は小さなミスすぎないが、次は気をつけてください。
        feedback_vi: Thiếu に - ミスにすぎない.
        error_tag: suginai_form
      - answer: 今回は小さなミスにすぎるが、次は気をつけてください。
        feedback_vi: すぎる là "quá"; "chỉ là" cần にすぎない.
        error_tag: suginai_sugiru
    explanation:
      vi: 小さなミスにすぎない - chỉ là lỗi nhỏ (hạ thấp mức độ); が - nhưng; 次は気をつけてください - lần sau hãy cẩn thận.
    display_answer: 今回は小さなミスにすぎないが、次は気をつけてください。

  # ---------------- application ----------------
  - key: ja:exercise:n2-u7-review-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u7-gram-kanenai
    prompt:
      source_text: 責任者が誰か決めておかないと、問題が起きた時に対応が遅れかねない。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Nếu không quyết định trước ai là người phụ trách thì khi có vấn đề không khéo sẽ xử lý chậm.
        - Không định sẵn ai là người chịu trách nhiệm thì khi xảy ra vấn đề có thể ứng phó bị chậm.
        - Nếu không quyết định trước người phụ trách là ai thì khi có sự cố việc xử lý có nguy cơ bị chậm.
        - Không quyết sẵn người chịu trách nhiệm thì lúc xảy ra vấn đề không chừng sẽ xử lý chậm trễ.
        - Nếu chưa quyết định trước ai phụ trách thì khi có chuyện, việc ứng phó có thể bị chậm.
        - Không xác định trước người phụ trách thì khi vấn đề xảy ra có nguy cơ phản ứng chậm.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Đã quyết định ai là người phụ trách nên xử lý vấn đề rất nhanh.
        feedback_vi: 決めておかないと là "nếu không quyết định trước"; 遅れかねない là "có nguy cơ chậm".
        error_tag: kanenai_meaning
    explanation:
      vi: 責任者 - người phụ trách, chịu trách nhiệm; 決めておかないと - nếu không quyết định sẵn; 対応が遅れかねない - không khéo ứng phó chậm.
    display_answer: Nếu không quyết định trước ai là người phụ trách thì khi có vấn đề không khéo sẽ xử lý chậm.

  - key: ja:exercise:n2-u7-review-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-sekinin
    prompt:
      stem: Bạn làm mất tài liệu của khách. Bạn gặp trưởng phòng để xin lỗi và nhận trách nhiệm. Câu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: c6r, text: 大変申し訳ございません。この件は私が責任を取ります。, lang: ja }
        - { id: g1v, text: 大変申し訳ございません。この件は私の責任にすぎません。, lang: ja }
        - { id: k5z, text: 大変申し訳ございません。この件は私の責任のわけがありません。, lang: ja }
        - { id: o9d, text: 大変申し訳ございません。この件は私が責任を受けかねます。, lang: ja }
    answer:
      correct_option_id: c6r
    explanation:
      vi: 責任を取ります - tôi xin chịu trách nhiệm. にすぎません làm nhẹ lỗi của mình (thiếu thành ý); わけがない là chối bỏ; 責任を受けかねます vừa sai từ vừa là lời từ chối.
    display_answer: 大変申し訳ございません。この件は私が責任を取ります。

  - key: ja:exercise:n2-u7-review-write-yougania
    type: translate
    stage: application
    answer_lang: ja
    difficulty: 5
    item: ja:item:n2-u7-gram-you-ga-nai
