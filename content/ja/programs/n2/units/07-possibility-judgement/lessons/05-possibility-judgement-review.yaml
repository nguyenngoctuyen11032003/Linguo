      - answer: データが全部消えてしまったので、元に戻すようがない。
        feedback_vi: ようがない gắn vào gốc ます - 戻します → 戻し + ようがない.
        error_tag: you_ga_nai_form
      - answer: データが全部消えてしまったので、元に戻しかねない。
        feedback_vi: かねない là "có nguy cơ (xấu)"; "không có cách nào" là ようがない.
        error_tag: you_ga_nai_kanenai
    explanation:
      vi: '元に戻す / 復元する - khôi phục; 戻しようがない - không có cách nào khôi phục. N の + しようがない: 復元のしようがない cũng đúng.'
    display_answer: データが全部消えてしまったので、元に戻しようがない。

  - key: ja:exercise:n2-u7-review-mcq-choose
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-wake-ga-nai
    prompt:
      stem: 'Đồng nghiệp nói: "Nghe nói máy chiếu hỏng là do anh Tanaka." Bạn biết hôm đó anh Tanaka nghỉ phép. Bạn đáp thế nào?'
      stem_lang: vi
      options:
        - { id: d4f, text: 田中さんはその日休んでいたから、壊せるわけがないよ。, lang: ja }
