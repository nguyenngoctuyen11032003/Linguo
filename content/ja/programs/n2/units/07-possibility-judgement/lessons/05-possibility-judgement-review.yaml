body:
  - type: objective
    text:
      vi: 'Câu chuyện ôn tập: máy chiếu mượn của khách bị hỏng ngay trước buổi thuyết trình. Ai chịu trách nhiệm, có phải đền không, và làm sao giải thích cho khéo - bạn sẽ dùng cả bốn mẫu của unit.'
  - type: explain
    text:
      vi: 'Bốn mẫu chia hai nhóm. Nhóm "khả năng": かねない (có nguy cơ xấu) và ようがない (không có cách nào). Nhóm "đánh giá": わけがない (phủ định chắc chắn) và にすぎない (hạ thấp, chỉ là).'
  - type: explain
    text:
      vi: 'Hai từ mới: 責任 (trách nhiệm - 責任を取る: chịu trách nhiệm) và 弁償 (đền bù đồ hỏng, đồ mất - 弁償する). Người Nhật xin lỗi rất kỹ trước rồi mới nói đến 弁償.'
  - type: deep_explain
    text:
      vi: 'Khi bị trách, người Nhật tránh nói thẳng "không phải lỗi tôi". Họ dùng にすぎない để hạ thấp vai trò (私は言われた通りにしたにすぎません) hoặc わけではない để phủ định nhẹ. わけがない quá mạnh, dễ nghe như cãi lại cấp trên.'
  - type: example
    target: プロジェクターが故障して、資料の映しようがなかった。
    target_lang: ja
    translation:
      vi: Máy chiếu bị hỏng nên chẳng có cách nào chiếu tài liệu.
  - type: example
    target: 新しく買ったばかりの機械が、すぐ壊れるわけがない。
    target_lang: ja
    translation:
      vi: Cái máy vừa mới mua thì làm gì có chuyện hỏng ngay được.
  - type: example
    target: 借りた物を壊したのだから、弁償するのは当然です。
    target_lang: ja
    translation:
      vi: Đã làm hỏng đồ đi mượn thì đền là đương nhiên.
  - type: example
    target: 誰の責任かをはっきりさせないと、同じ問題が起きかねない。
    target_lang: ja
    translation:
      vi: Không làm rõ trách nhiệm của ai thì không khéo lại xảy ra vấn đề tương tự.
  - type: common_mistake
    wrong: この件の責任を受けます。
    right: この件の責任を取ります。
    target_lang: ja
    note:
      vi: '"Chịu trách nhiệm" là 責任を取る. Tiếng Việt nói "nhận trách nhiệm" nên người Việt hay dùng nhầm 受ける.'
  - type: common_mistake
    wrong: 壊したカメラを弁償をあげます。
    right: 壊したカメラを弁償します。
    target_lang: ja
    note:
      vi: 弁償 là danh từ + する - 弁償します (tôi sẽ đền). Không dùng あげる với 弁償.
  - type: summary
    points:
      - vi: かねない - có nguy cơ (xấu); ようがない - không có cách nào.
      - vi: わけがない - không đời nào; にすぎない - chỉ là, chẳng qua là.
      - vi: 責任を取る - chịu trách nhiệm; 弁償する - đền bù.
