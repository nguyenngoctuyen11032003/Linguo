title:
  vi: Ôn tập - sự cố máy chiếu và cuộc họp trách nhiệm
objectives:
  - vi: Đọc hiểu một câu chuyện công sở dùng かねない, ようがない, わけがない, にすぎない.
  - vi: Chọn đúng mẫu theo ý "có nguy cơ", "không có cách", "không đời nào", "chỉ là".
  - vi: Nói về trách nhiệm và đền bù một cách lịch sự.
