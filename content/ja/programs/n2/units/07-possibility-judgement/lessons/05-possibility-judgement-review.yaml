  - key: ja:exercise:n2-u7-review-mcq-reading
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u7-gram-ni-suginai
    prompt:
      stem: 'Đọc đoạn: 「今回の故障は、機械の寿命によるものにすぎず、担当者に責任があるわけではない。ただし、点検を怠れば同じことが起きかねない。」 Điều nào đúng với đoạn văn?'
      stem_lang: vi
      options:
        - { id: b2l, text: "Hỏng hóc chỉ do máy hết tuổi thọ, người phụ trách không có lỗi, nhưng không kiểm tra thì có thể tái diễn.", lang: vi }
        - { id: f7q, text: Người phụ trách chắc chắn có lỗi trong sự cố lần này., lang: vi }
        - { id: j3u, text: Máy đã được kiểm tra kỹ nên không bao giờ hỏng lại., lang: vi }
        - { id: n8y, text: Không có cách nào biết nguyên nhân của sự cố., lang: vi }
    answer:
      correct_option_id: b2l
    explanation:
      vi: によるものにすぎず - chỉ là do...; 責任があるわけではない - không hẳn là có trách nhiệm; 怠れば～かねない - nếu lơ là thì không chừng tái diễn.
    display_answer: Hỏng hóc chỉ do máy hết tuổi thọ, người phụ trách không có lỗi, nhưng không kiểm tra thì có thể tái diễn.

  - key: ja:exercise:n2-u7-review-fill-mix
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-kanenai
    prompt:
      template: "電源コードが切れていて、充電の{{b1}}がない。このままでは、明日の発表に間に合わなくなり{{b2}}。"
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Dây nguồn bị đứt nên chẳng có cách nào sạc. Cứ thế này thì không khéo sẽ không kịp buổi thuyết trình ngày mai."
        - "Gợi ý: chỗ 1 là しよう (N の + しようがない); chỗ 2 là mẫu \"có nguy cơ (xấu)\"."
    answer:
      blanks:
        b1: [しよう]
        b2: [かねない]
    known_wrong:
      - answer: かねる
        feedback_vi: かねる là "khó mà làm"; cảnh báo nguy cơ dùng かねない.
        error_tag: kanenai_kaneru
      - answer: する
        feedback_vi: Cấu trúc là N の + しようがない - 充電のしようがない.
        error_tag: you_ga_nai_form
    explanation:
      vi: '充電のしようがない - không có cách nào sạc; 間に合わなくなりかねない - không khéo sẽ không kịp. Hai mẫu khác nhau: một là "không có cách", một là "có nguy cơ".'
    display_answer: 電源コードが切れていて、充電のしようがない。このままでは、明日の発表に間に合わなくなりかねない。

  - key: ja:exercise:n2-u7-review-wb-sekinin
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-sekinin
    prompt:
      instruction: "Sắp xếp thành câu: \"Trưởng nhóm đã nhận trách nhiệm về thất bại.\""
      tokens:
        - { id: k3, text: 責任を取った }
        - { id: k1, text: リーダーが }
        - { id: k4, text: 責任をあげた }
        - { id: k2, text: 失敗の }
    answer:
      orders:
        - [k1, k2, k3]
        - [k2, k1, k3]
    explanation:
      vi: N の責任を取る - chịu trách nhiệm về N. 責任をあげる không phải cách nói của tiếng Nhật. Chủ ngữ リーダーが và 失敗の責任 có thể đổi chỗ nhưng の phải dính với 責任.
    display_answer: リーダーが失敗の責任を取った。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u7-review-fill-wake
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-wake-ga-nai
    prompt:
      template: "鍵はずっと私が持っていたから、他の人が部屋に入れる{{b1}}。(làm gì có chuyện)"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [わけがない, 訳がない, はずがない]
    known_wrong:
      - answer: わけではない
        feedback_vi: わけではない là "không hẳn"; có lý do chắc chắn (giữ chìa khoá) thì dùng わけがない.
        error_tag: wake_ga_wa
      - answer: ようがない
        feedback_vi: ようがない là "không có cách"; câu đề nói "làm gì có chuyện vào được" - わけがない.
        error_tag: wake_you
    explanation:
      vi: 入れるわけがない - làm gì có chuyện vào được. はずがない cũng đúng vì đây là suy luận có căn cứ.
    display_answer: 鍵はずっと私が持っていたから、他の人が部屋に入れるわけがない。

  - key: ja:exercise:n2-u7-review-write-benshou
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-benshou
    prompt:
      source_text: Tôi đã làm vỡ cốc của nhà hàng nên đã đền tiền. (dùng 弁償)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 店のコップを割ってしまったので、弁償しました。
        - 店のコップを割ったので、弁償しました。
        - レストランのコップを割ってしまったので、弁償しました。
        - 店のグラスを割ってしまったので、弁償しました。
        - レストランのグラスを割ってしまったので、弁償しました。
        - お店のコップを割ってしまったので、弁償しました。
        - 店のコップを割ってしまったから、弁償した。
