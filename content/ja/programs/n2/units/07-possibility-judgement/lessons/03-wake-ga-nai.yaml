key: ja:lesson:n2-u7-wake-ga-nai
order_index: 3
level: n2
title:
  vi: Làm gì có chuyện! - ～わけがない (so với わけではない, ないわけにはいかない)
objectives:
  - vi: Phủ định mạnh "không đời nào" bằng thể thường + わけがない.
  - vi: Nối đúng わけがない sau tính từ な và danh từ.
  - vi: Phân biệt ba mẫu わけがない / わけではない / ないわけにはいかない.
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-u7-you-ga-nai]
