      vi: 満点が取れる - đạt được điểm tuyệt đối (thể khả năng); + わけがない - làm gì có chuyện. あんなに - đến mức kia (chỉ thứ ở xa người nói).
    display_answer: あんなに難しい試験で、満点が取れるわけがない。

  - key: ja:exercise:n2-u7-wakeganai-write-ikanai
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-nai-wake-ni-ikanai
    prompt:
      source_text: Đã hứa với khách rồi nên không thể không đi. (dùng ないわけにはいかない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - お客様と約束したので、行かないわけにはいかない。
        - お客様と約束したから、行かないわけにはいかない。
        - お客様と約束したので、行かないわけにはいきません。
        - お客さんと約束したので、行かないわけにはいかない。
        - お客様に約束したので、行かないわけにはいかない。
        - お客様と約束してしまったので、行かないわけにはいかない。
        - 客と約束したので、行かないわけにはいかない。
