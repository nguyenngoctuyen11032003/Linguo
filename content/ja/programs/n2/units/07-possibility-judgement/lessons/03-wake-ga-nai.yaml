body:
  - type: objective
    text:
      vi: Sau bài này, bạn phản bác chắc nịch kiểu "anh ấy làm gì có chuyện nói dối", "rẻ thế này thì không đời nào ngon" - và không còn lẫn với "không hẳn là..." hay "không thể không...".
  - type: explain
    text:
      vi: 'Thể thường + わけがない - "không đời nào..., làm gì có chuyện...". Người nói có lý do chắc chắn nên phủ định 100%: あの真面目な人が嘘をつくわけがない. Hội thoại thân mật hay rút gọn thành わけない.'
  - type: explain
    text:
      vi: 'Cách nối: V/A-い thể thường + わけがない (来るわけがない, 安いわけがない); な-tính từ giữ な (簡単なわけがない); danh từ + の hoặc である (本物のわけがない).'
  - type: explain
    text:
      vi: 'Ba mẫu dễ lẫn: わけがない = chắc chắn không; わけではない = không hẳn là (phủ định một phần - N3); ないわけにはいかない = không thể không làm (nghĩa vụ - N2). Tiếng Việt dịch ba câu này hoàn toàn khác nhau.'
  - type: deep_explain
    text:
      vi: 'はずがない cũng là "không thể có chuyện", nhưng nghiêng về suy luận logic, khách quan (鍵をかけたから、開いているはずがない). わけがない mang cảm xúc, phản bác mạnh hơn, nhất là trong hội thoại: そんなことあるわけないでしょう!'
  - type: example
    target: 一度も練習していないのに、上手に弾けるわけがない。
    target_lang: ja
    translation:
      vi: Chưa tập lần nào thì làm gì có chuyện đàn hay được.
  - type: example
    target: こんなに安い指輪が、本物のダイヤのわけがない。
    target_lang: ja
    translation:
      vi: Chiếc nhẫn rẻ thế này thì không đời nào là kim cương thật.
    note:
      vi: Danh từ + の + わけがない.
  - type: example
    target: 冗談だよ。本気で怒るわけないじゃない。
    target_lang: ja
    translation:
      vi: Đùa thôi mà. Làm gì có chuyện mình giận thật.
    note:
      vi: Khẩu ngữ - わけない.
  - type: example
    target: 甘いものが嫌いなわけではないが、今日はやめておく。
    target_lang: ja
    translation:
      vi: Không phải tôi ghét đồ ngọt, nhưng hôm nay thì thôi.
    note:
      vi: わけではない - phủ định một phần, khác hẳn わけがない.
  - type: common_mistake
    wrong: この問題は簡単わけがない。
    right: この問題は簡単なわけがない。
    target_lang: ja
    note:
      vi: Tính từ な phải giữ な trước わけ - 簡単なわけがない.
  - type: common_mistake
    wrong: 肉が嫌いなわけがないけど、今日は魚にする。
    right: 肉が嫌いなわけではないけど、今日は魚にする。
    target_lang: ja
    note:
      vi: Ý "không hẳn là ghét" (phủ định nhẹ) dùng わけではない. わけがない là phủ định tuyệt đối, không đi với vế "nhưng hôm nay thì..." như thế.
  - type: summary
    points:
      - vi: Thể thường + わけがない - không đời nào, làm gì có chuyện (phủ định mạnh).
      - vi: なA + な / N + の (である) + わけがない.
      - vi: わけではない - không hẳn là; ないわけにはいかない - không thể không làm.
      - vi: 冗談 - lời đùa; 本気 - nghiêm túc, thật lòng.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u7-wakeganai-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u7-gram-wake-ga-nai
    prompt:
      stem: 'Câu 彼は甘いものが大好きだから、ケーキを断るわけがない。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: a2r, text: Anh ấy rất thích đồ ngọt nên không đời nào từ chối bánh., lang: vi }
        - { id: e7v, text: Anh ấy rất thích đồ ngọt nhưng không hẳn sẽ nhận bánh., lang: vi }
        - { id: i3z, text: Anh ấy rất thích đồ ngọt nên không thể không từ chối bánh., lang: vi }
        - { id: m8d, text: Anh ấy rất thích đồ ngọt nên đã từ chối bánh., lang: vi }
    answer:
      correct_option_id: a2r
    explanation:
      vi: '断るわけがない - không đời nào từ chối (phủ định mạnh vì có lý do chắc chắn: rất thích đồ ngọt).'
    display_answer: Anh ấy rất thích đồ ngọt nên không đời nào từ chối bánh.

  - key: ja:exercise:n2-u7-wakeganai-listen-joudan
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u7-joudan
    prompt:
      audio_asset_id: null
      fallback_text: 会社を辞めるなんて冗談でしょう。部長がそんなことを言うわけがない。
      options:
        - { id: b5h, text: "Nghỉ việc á, đùa đấy à. Trưởng phòng làm gì có chuyện nói thế.", lang: vi }
        - { id: f1l, text: Trưởng phòng đã nói đùa rằng sẽ nghỉ việc., lang: vi }
        - { id: j6p, text: Trưởng phòng không hẳn đã nói sẽ nghỉ việc., lang: vi }
        - { id: n2t, text: Trưởng phòng buộc phải nói chuyện nghỉ việc., lang: vi }
    answer:
      correct_option_id: b5h
    explanation:
      vi: 冗談でしょう - đùa à?; 言うわけがない - làm gì có chuyện nói (phủ định mạnh). Không phải "không hẳn" (わけではない) hay "buộc phải".
    display_answer: Nghỉ việc á, đùa đấy à. Trưởng phòng làm gì có chuyện nói thế.

  - key: ja:exercise:n2-u7-wakeganai-mcq-three
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n3-gram-wake-dewa-nai
    prompt:
      stem: 'Chọn mẫu đúng: "Không phải tôi không có tiền, chỉ là không muốn mua thôi." お金がない＿＿、買いたくないだけだ。'
      stem_lang: vi
      options:
        - { id: c4w, text: わけではなく, lang: ja }
        - { id: g9a, text: ことがなく, lang: ja }
        - { id: k5e, text: わけにはいかなく, lang: ja }
        - { id: o1i, text: ようがなく, lang: ja }
    answer:
      correct_option_id: c4w
    explanation:
      vi: '"Không phải là... (mà là...)" - phủ định một phần, dùng わけではなく. ことがなく không nối được với ない như thế, わけにはいかない là "không thể làm", ようがない là "không có cách".'
    display_answer: わけではなく

  - key: ja:exercise:n2-u7-wakeganai-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-gram-wake-ga-nai
    prompt:
      template: "あんなに静かな人が、そんな乱暴なことをする{{b1}}がない。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Người trầm tính như thế làm gì có chuyện làm điều thô bạo như vậy."
        - "Gợi ý: từ hai chữ kana đi với がない - \"không đời nào\"."
    answer:
      blanks:
        b1: [わけ, 訳, はず]
    known_wrong:
      - answer: よう
        feedback_vi: ようがない là "không có cách nào để làm"; phủ định chắc chắn "không đời nào" dùng わけがない.
        error_tag: wake_you
      - answer: こと
        feedback_vi: ことがない là "chưa từng"; ở đây là phủ định chắc chắn - わけがない.
        error_tag: wake_koto
    explanation:
      vi: 'するわけがない - làm gì có chuyện làm. はずがない cũng đúng nghĩa (suy luận logic). Lý do chắc chắn ở vế trước: あんなに静かな人.'
    display_answer: あんなに静かな人が、そんな乱暴なことをするわけがない。

  - key: ja:exercise:n2-u7-wakeganai-wb-honki
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-honki
    prompt:
      instruction: "Sắp xếp thành câu: \"Lần này tôi nghiêm túc. Không phải nói đùa đâu.\""
      tokens:
        - { id: h3, text: 冗談じゃないよ }
        - { id: h1, text: 今回は }
        - { id: h4, text: 本気がないよ }
        - { id: h2, text: 本気だ。 }
    answer:
      orders:
        - [h1, h2, h3]
    explanation:
      vi: 本気だ - (tôi) nghiêm túc; 冗談じゃない - không phải đùa. 本気がない không phải cách nói tự nhiên ("có/không có nghiêm túc").
    display_answer: 今回は本気だ。冗談じゃないよ。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u7-wakeganai-fill-na
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-wake-ga-nai
    prompt:
      template: "毎日残業している彼が、{{b1}}わけがない。(暇 - rảnh)"
      blanks:
        - { id: b1, width_hint: 2 }
