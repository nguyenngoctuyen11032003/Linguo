        - { id: h1n, text: 甘いものが嫌いな私が、食べるわけではないじゃない。, lang: ja }
        - { id: l7r, text: 甘いものが嫌いな私が、食べないわけにはいかない。, lang: ja }
        - { id: p3v, text: 甘いものが嫌いな私が、食べようがないじゃない。, lang: ja }
    answer:
