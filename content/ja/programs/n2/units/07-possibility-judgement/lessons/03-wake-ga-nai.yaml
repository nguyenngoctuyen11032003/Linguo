      direction: vi_to_target
    answer:
      accepted:
        - あんなに難しい試験で、満点が取れるわけがない。
        - あんなに難しい試験で満点を取れるわけがない。
        - あんなに難しい試験で、満点を取れるわけがない。
        - あんな難しい試験で、満点が取れるわけがない。
        - あんなに難しいテストで、満点が取れるわけがない。
        - あんなに難しい試験で、百点が取れるわけがない。
        - あんなに難しい試験で、満点が取れるわけがありません。
        - あんなに難しい試験で、満点なんて取れるわけがない。
