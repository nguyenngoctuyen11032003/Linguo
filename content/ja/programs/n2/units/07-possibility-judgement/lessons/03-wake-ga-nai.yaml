        feedback_vi: 行くわけがない là "làm gì có chuyện đi" - ngược ý. Nghĩa vụ phải đi dùng 行かないわけにはいかない.
        error_tag: wake_ga_nikanai
      - answer: お客様と約束したので、行くわけにはいかない。
        feedback_vi: 行くわけにはいかない là "không thể đi". Cần thể ない - 行かないわけにはいかない.
