    known_wrong:
      - answer: 暇
        feedback_vi: Tính từ な phải giữ な trước わけ - 暇なわけがない.
        error_tag: na_adjective
      - answer: 暇だ
        feedback_vi: Trước わけ, だ của tính từ な đổi thành な - 暇なわけがない.
        error_tag: na_adjective
    explanation:
      vi: 暇な + わけがない - làm gì có chuyện rảnh. Ngày nào cũng làm thêm giờ là lý do chắc chắn cho phủ định mạnh.
    display_answer: 毎日残業している彼が、暇なわけがない。

  - key: ja:exercise:n2-u7-wakeganai-write-uso
