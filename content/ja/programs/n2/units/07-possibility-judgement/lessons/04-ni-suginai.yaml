key: ja:lesson:n2-u7-ni-suginai
order_index: 4
level: n2
title:
  vi: Chẳng qua chỉ là... - ～にすぎない, ～に過ぎず
objectives:
  - vi: Hạ thấp mức độ "chỉ là, chẳng qua là" bằng N / thể thường + にすぎない.
  - vi: Dùng に過ぎず để nối hai vế trong văn viết.
  - vi: Phân biệt にすぎない với だけだ và với tính từ 単なる.
estimated_minutes: 18
skills: [grammar, reading]
prerequisites: [ja:lesson:n2-u7-wake-ga-nai]
items:
  - item: ja:item:n2-u7-gram-ni-suginai
  - item: ja:item:n2-u7-ichibu
