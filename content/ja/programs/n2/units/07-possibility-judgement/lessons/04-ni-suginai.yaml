  - item: ja:item:n3-uwasa
    role: reuse
body:
  - type: objective
    text:
      vi: Sau bài này, bạn viết được những câu kiểu báo cáo, bình luận - "đây chỉ là một ví dụ", "đó chẳng qua là tin đồn", "người đồng ý chỉ chiếm 20%" - nhấn rằng điều gì đó nhỏ, không đáng kể.
  - type: explain
    text:
      vi: 'N / thể thường + にすぎない - "chỉ là..., chẳng qua chỉ là...". Người nói cố ý hạ thấp, coi nhẹ: それは一つの意見にすぎない (đó chỉ là một ý kiến). Với số liệu: 全体の5%にすぎない (chỉ vỏn vẹn 5%).'
  - type: explain
    text:
      vi: 'Văn viết nối câu bằng に過ぎず: これは一例に過ぎず、他にも多くの問題がある (đây chỉ là một ví dụ, còn nhiều vấn đề khác). Lịch sự: にすぎません.'
  - type: explain
    text:
      vi: 'だけだ cũng là "chỉ", nhưng trung tính; にすぎない thêm sắc thái "không đáng kể, không hơn". 単なる + N (đơn thuần chỉ là) hay đi cùng: 単なる噂にすぎない.'
  - type: deep_explain
    text:
      vi: 'Vì nghĩa là hạ thấp, にすぎない không dùng để khen (×彼は天才にすぎない). Trong lời khiêm tốn về bản thân lại rất tự nhiên: 私は一社員にすぎませんが… (tôi chỉ là một nhân viên quèn nhưng...). Tiếng Việt "chẳng qua", "vỏn vẹn" là tương đương sát nhất.'
  - type: example
    target: 彼が社長になるというのは、単なる噂にすぎない。
    target_lang: ja
    translation:
      vi: Chuyện anh ấy lên làm giám đốc chẳng qua chỉ là tin đồn.
  - type: example
    target: 賛成したのは、出席者の二割にすぎなかった。
    target_lang: ja
    translation:
      vi: Người tán thành chỉ vỏn vẹn hai phần mười số người có mặt.
  - type: example
    target: 今回の問題は一部に過ぎず、根本的な見直しが必要だ。
    target_lang: ja
    translation:
      vi: Vấn đề lần này chỉ là một phần, cần xem xét lại từ gốc rễ.
    note:
      vi: に過ぎず - dạng nối của văn viết.
  - type: example
    target: 私は通訳として言葉を伝えたにすぎません。
    target_lang: ja
    translation:
      vi: Tôi chẳng qua chỉ chuyển lời với tư cách phiên dịch thôi.
    note:
      vi: Thể thường (伝えた) + にすぎない.
  - type: common_mistake
    wrong: 彼女の歌は素晴らしいにすぎない。
    right: 彼女の歌は本当に素晴らしい。
    target_lang: ja
    note:
      vi: にすぎない là hạ thấp, không dùng để khen. Muốn khen thì nói thẳng.
  - type: common_mistake
    wrong: それは単なるだ。
    right: それは単なる偶然にすぎない。
    target_lang: ja
    note:
      vi: 単なる chỉ đứng trước danh từ, không làm vị ngữ một mình. Cần danh từ phía sau - 単なる偶然.
  - type: summary
    points:
      - vi: N / thể thường + にすぎない - chỉ là, chẳng qua là (hạ thấp).
      - vi: に過ぎず - dạng nối câu; にすぎません - lịch sự.
      - vi: 単なる + N - đơn thuần là; hay đi cùng にすぎない.
      - vi: 一部 - một phần.
