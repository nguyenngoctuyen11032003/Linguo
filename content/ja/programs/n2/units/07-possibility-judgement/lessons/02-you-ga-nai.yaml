reviewed_at: "2026-10-16T12:00:00+07:00"
key: ja:lesson:n2-u7-you-ga-nai
order_index: 2
level: n2
title:
  vi: Không có cách nào - ～ようがない, ～ようもない
objectives:
  - vi: Nói "không có cách nào để..." bằng Vます-gốc + ようがない.
  - vi: Dùng đúng dạng N の + しようがない với động từ する.
  - vi: Phân biệt ようがない (không có cách) với できない (không làm được).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-u7-kanenai]
items:
  - item: ja:item:n2-u7-gram-you-ga-nai
  - item: ja:item:n2-u7-renrakusaki
  - item: ja:item:n2-u7-shudan
body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "không có số điện thoại nên chẳng có cách nào liên lạc", "hỏng đến mức này thì hết cách sửa" - lối nói rất hay gặp khi than phiền hoặc giải thích vì sao không làm được.
  - type: explain
    text:
      vi: 'Vます-gốc + ようがない - "không có cách nào để...". Người nói muốn làm nhưng không có phương tiện, thông tin hay đường nào: 連絡先が分からないので、連絡しようがない. ようもない nhấn mạnh hơn: どうしようもない (hết cách).'
  - type: explain
    text:
      vi: 'Với danh từ + する, tiếng Nhật thường tách: N の + しようがない - 説明のしようがない (không biết giải thích thế nào), 返事のしようがない. Nói 説明しようがない cũng được.'
  - type: explain
    text:
      vi: 'Khác できない: できない có thể do mình thiếu năng lực (泳げない - không biết bơi); ようがない nhấn "không tồn tại cách nào", ai làm cũng vậy. Tiếng Việt "hết cách", "chịu" gần nghĩa nhất.'
  - type: deep_explain
    text:
      vi: 'Cụm cố định: どうしようもない - hết cách, vô phương (cả nghĩa "tệ hết thuốc chữa": どうしようもない人). しょうがない / 仕方がない cũng là "đành chịu" nhưng là thái độ chấp nhận, không nói cụ thể việc gì không làm được.'
  - type: example
    target: 名前も住所も分からないので、探しようがない。
    target_lang: ja
    translation:
      vi: Cả tên lẫn địa chỉ đều không biết nên chẳng có cách nào tìm.
  - type: example
    target: ここまで壊れてしまったら、もう直しようがありません。
    target_lang: ja
    translation:
      vi: Hỏng đến mức này thì không còn cách nào sửa nữa.
  - type: example
    target: あの時の気持ちは、言葉では説明のしようがない。
    target_lang: ja
    translation:
      vi: Cảm xúc lúc ấy không có cách nào giải thích được bằng lời.
    note:
      vi: 説明する → 説明のしようがない.
  - type: example
    target: 山の中で携帯の電波がなく、助けを呼ぶ手段がなかった。
    target_lang: ja
    translation:
      vi: Trong núi không có sóng điện thoại, không có phương tiện nào để gọi cứu giúp.
  - type: common_mistake
    wrong: 連絡先が分からないので、連絡するようがない。
    right: 連絡先が分からないので、連絡しようがない。
    target_lang: ja
    note:
      vi: ようがない gắn vào gốc ます - 連絡します → 連絡し + ようがない. Không dùng thể từ điển.
  - type: common_mistake
    wrong: 私は泳ぎようがないので、プールに行きません。
    right: 私は泳げないので、プールに行きません。
    target_lang: ja
    note:
      vi: Không biết bơi là thiếu khả năng của bản thân - dùng できない / thể khả năng. ようがない chỉ dùng khi hoàn cảnh không cho phép cách nào.
  - type: summary
    points:
      - vi: Vます-gốc + ようがない / ようもない - không có cách nào để...
      - vi: N + する → N の + しようがない (説明のしようがない).
      - vi: どうしようもない - hết cách, vô phương.
      - vi: 連絡先 - thông tin liên lạc; 手段 - phương tiện, cách thức.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u7-youganai-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      stem: 'Câu 電車が全部止まっているので、会社に行きようがない。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: b4n, text: Tàu ngừng chạy hết nên chẳng có cách nào đến công ty., lang: vi }
        - { id: f9s, text: Tàu ngừng chạy hết nhưng tôi vẫn không muốn đến công ty., lang: vi }
        - { id: j2w, text: Tàu ngừng chạy hết nên tôi không cần đến công ty., lang: vi }
        - { id: n7c, text: Tàu ngừng chạy hết nên tôi đã đi bộ đến công ty., lang: vi }
    answer:
      correct_option_id: b4n
    explanation:
      vi: 行きようがない - không có cách nào để đi (vì hoàn cảnh), không phải "không muốn" hay "không cần".
    display_answer: Tàu ngừng chạy hết nên chẳng có cách nào đến công ty.

  - key: ja:exercise:n2-u7-youganai-listen-renraku
