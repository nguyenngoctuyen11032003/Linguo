  - key: ja:exercise:n2-u7-youganai-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      template: "パスワードを忘れてしまったので、ファイルを{{b1}}ようがない。"
      blanks:
        - { id: b1, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Quên mất mật khẩu nên chẳng có cách nào mở file."
        - "Gợi ý: gốc ます của 開く (mở)."
    answer:
      blanks:
        b1: [開き, ひらき]
    known_wrong:
      - answer: 開く
        feedback_vi: ようがない gắn vào gốc ます - 開きます → 開き.
        error_tag: you_ga_nai_form
      - answer: 開か
        feedback_vi: Không dùng thể ない; dùng gốc ます - 開き + ようがない.
        error_tag: you_ga_nai_form
    explanation:
      vi: 開きようがない - không có cách nào mở. Gốc ます + ようがない; mật khẩu là "phương tiện" duy nhất đã mất.
    display_answer: パスワードを忘れてしまったので、ファイルを開きようがない。

  - key: ja:exercise:n2-u7-youganai-mcq-shudan
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-shudan
    prompt:
      stem: 'Chọn từ phù hợp: この島への交通＿＿は、一日二本の船しかない。 ("Phương tiện đi đến hòn đảo này chỉ có hai chuyến tàu mỗi ngày.")'
      stem_lang: vi
      options:
        - { id: c8m, text: 手段, lang: ja }
        - { id: g3t, text: 連絡先, lang: ja }
        - { id: k6b, text: 故障, lang: ja }
        - { id: o1f, text: 事故, lang: ja }
    answer:
      correct_option_id: c8m
    explanation:
      vi: 交通手段 - phương tiện đi lại. 連絡先 là thông tin liên lạc, 故障 là hỏng hóc, 事故 là tai nạn.
    display_answer: 手段

  - key: ja:exercise:n2-u7-youganai-wb-setsumei
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      instruction: "Sắp xếp thành câu: \"Vị của món này khó mà diễn tả được.\""
      tokens:
        - { id: s3, text: 表現のしようがない }
        - { id: s1, text: この料理の }
        - { id: s4, text: 表現するようがない }
        - { id: s2, text: 味は }
    answer:
      orders:
        - [s1, s2, s3]
    explanation:
      vi: 表現する → 表現のしようがない (N の + しようがない). 表現するようがない sai vì ようがない không gắn vào thể từ điển.
    display_answer: この料理の味は表現のしようがない。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u7-youganai-fill-dou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      template: "台風で飛行機が飛ばないのは、どう{{b1}}もないことだ。(hết cách)"
      blanks:
        - { id: b1, width_hint: 3 }
    answer:
      blanks:
        b1: [しよう]
    known_wrong:
      - answer: する
        feedback_vi: Cụm cố định là どうしようもない - しよう là gốc ます し + よう.
        error_tag: you_ga_nai_form
      - answer: しない
        feedback_vi: Không có どうしないもない; cụm "hết cách" là どうしようもない.
        error_tag: fixed_phrase
    explanation:
      vi: どうしようもない - hết cách, không làm gì được. Đây là ようもない (nhấn mạnh hơn ようがない) gắn vào どう + し.
    display_answer: 台風で飛行機が飛ばないのは、どうしようもないことだ。

  - key: ja:exercise:n2-u7-youganai-write-sagasu
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-renrakusaki
    prompt:
      source_text: Không có thông tin liên lạc của khách hàng nên chẳng có cách nào liên lạc. (dùng ようがない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - お客様の連絡先がないので、連絡しようがない。
        - お客様の連絡先がないので、連絡のしようがない。
        - お客様の連絡先がないので、連絡しようがありません。
        - お客様の連絡先がないので、連絡のしようがありません。
        - 客の連絡先がないので、連絡しようがない。
        - お客様の連絡先が分からないので、連絡しようがない。
        - お客様の連絡先がないから、連絡しようがない。
        - お客さんの連絡先がないので、連絡しようがない。
        - おきゃくさまのれんらくさきがないので、れんらくしようがない。
    known_wrong:
      - answer: お客様の連絡先がないので、連絡するようがない。
        feedback_vi: ようがない gắn vào gốc ます - 連絡し + ようがない.
        error_tag: you_ga_nai_form
      - answer: お客様の連絡先がないので、連絡できるようがない。
        feedback_vi: Không ghép thể khả năng với ようがない; nói 連絡しようがない hoặc 連絡できない.
        error_tag: you_ga_nai_form
    explanation:
      vi: 連絡先がない - không có thông tin liên lạc; 連絡しようがない / 連絡のしようがない - không có cách nào liên lạc.
    display_answer: お客様の連絡先がないので、連絡しようがない。

  - key: ja:exercise:n2-u7-youganai-write-naosu
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      source_text: Đã nói ra rồi thì không có cách nào rút lại lời được. (dùng ようがない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 一度言ってしまったことは、取り消しようがない。
        - 言ってしまったことは、取り消しようがない。
        - 一度口にしたことは、取り消しようがない。
        - 一度言ったことは、取り消しようがない。
        - 一度言ってしまった言葉は、取り消しようがない。
        - 言ってしまった言葉は、取り消しようがない。
        - 一度言ってしまったことは、取り消しようがありません。
        - いちどいってしまったことは、とりけしようがない。
    known_wrong:
      - answer: 一度言ってしまったことは、取り消すようがない。
        feedback_vi: ようがない gắn vào gốc ます - 取り消します → 取り消し.
        error_tag: you_ga_nai_form
      - answer: 一度言ってしまったことは、取り消しかねない。
        feedback_vi: かねない là "không chừng sẽ (điều xấu)"; "không có cách nào" là ようがない.
        error_tag: you_ga_nai_kanenai
    explanation:
      vi: 取り消す - rút lại, huỷ; 取り消しようがない - không có cách nào rút lại. てしまった nhấn sự đã rồi, không cứu vãn.
    display_answer: 一度言ってしまったことは、取り消しようがない。

  # ---------------- application ----------------
  - key: ja:exercise:n2-u7-youganai-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      source_text: 原因が分からない以上、対策の立てようがない。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Một khi chưa biết nguyên nhân thì không có cách nào đề ra biện pháp đối phó.
        - Chừng nào chưa biết nguyên nhân thì chẳng có cách nào lập biện pháp.
        - Đã không biết nguyên nhân thì không có cách nào đưa ra đối sách.
        - Khi chưa rõ nguyên nhân thì không có cách nào đề ra biện pháp.
        - Không biết nguyên nhân thì không có cách nào lập ra biện pháp đối phó.
        - Vì không biết nguyên nhân nên chẳng có cách nào đưa ra biện pháp.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Chưa biết nguyên nhân nhưng đã có biện pháp đối phó.
        feedback_vi: 立てようがない là "không có cách nào lập ra", không phải "đã có".
        error_tag: you_ga_nai_meaning
    explanation:
      vi: 以上 - một khi, đã... thì; 対策を立てる - đề ra biện pháp; 立てようがない - không có cách nào đề ra.
    display_answer: Một khi chưa biết nguyên nhân thì không có cách nào đề ra biện pháp đối phó.

  - key: ja:exercise:n2-u7-youganai-mcq-situation
    type: mcq
    stage: application
