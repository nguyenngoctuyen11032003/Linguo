        - { id: i9x, text: 文字化けしていて内容が読めないので、返事しかねないんです。, lang: ja }
        - { id: m4c, text: 文字化けしていて内容が読めないので、返事するようがないんです。, lang: ja }
        - { id: u2h, text: 文字化けしていて内容が読めないので、返事のしようがあるんです。, lang: ja }
