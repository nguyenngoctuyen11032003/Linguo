      options:
        - { id: q5h, text: Tôi quên hỏi thông tin liên lạc của anh ấy nên chẳng có cách nào nói lời cảm ơn., lang: vi }
        - { id: s1d, text: Tôi đã hỏi thông tin liên lạc của anh ấy để nói lời cảm ơn., lang: vi }
        - { id: v6k, text: Anh ấy quên cho tôi số điện thoại nên không thèm cảm ơn tôi., lang: vi }
        - { id: x3r, text: Tôi không muốn cảm ơn anh ấy vì anh ấy quên liên lạc., lang: vi }
    answer:
