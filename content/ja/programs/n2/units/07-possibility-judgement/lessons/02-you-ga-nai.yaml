    display_answer: 文字化けしていて内容が読めないので、返事のしようがないんです。

  - key: ja:exercise:n2-u7-youganai-write-shudan
    type: translate
    stage: application
    answer_lang: ja
    difficulty: 5
    item: ja:item:n2-u7-shudan
    prompt:
      source_text: Đêm khuya không còn phương tiện đi lại nào nên tôi chẳng có cách nào về nhà. (dùng 手段 và ようがない)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 夜遅くて交通手段がないので、家に帰りようがない。
        - 夜遅くて交通手段がないから、家に帰りようがない。
        - 深夜で交通手段がないので、家に帰りようがない。
        - 夜遅くて交通手段がないので、帰りようがない。
        - 夜遅くて交通手段がないので、家に帰りようがありません。
        - 夜遅くなって交通手段がないので、家に帰りようがない。
        - 夜中で交通手段がないので、家に帰りようがない。
        - よるおそくてこうつうしゅだんがないので、いえにかえりようがない。
    known_wrong:
      - answer: 夜遅くて交通手段がないので、家に帰るようがない。
        feedback_vi: ようがない gắn vào gốc ます - 帰ります → 帰り + ようがない.
        error_tag: you_ga_nai_form
      - answer: 夜遅くて交通手段がないので、家に帰りかねる。
        feedback_vi: かねる là từ chối lịch sự "khó mà làm"; nói hoàn cảnh không có cách nào dùng ようがない.
        error_tag: you_ga_nai_kaneru
    explanation:
      vi: 交通手段 - phương tiện đi lại; 帰りようがない - không có cách nào về. Lý do (không có phương tiện) là hoàn cảnh khách quan, đúng chỗ của ようがない.
    display_answer: 夜遅くて交通手段がないので、家に帰りようがない。

  - key: ja:exercise:n2-u7-youganai-wb-dou
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u7-gram-you-ga-nai
    prompt:
      instruction: "Sắp xếp thành câu: \"Chuyện đã qua rồi thì giờ có hối hận cũng hết cách.\""
      tokens:
        - { id: d3, text: 後悔しても }
        - { id: d5, text: どうするようもない }
        - { id: d1, text: 過ぎたことは }
        - { id: d4, text: どうしようもない }
        - { id: d2, text: 今さら }
    answer:
      orders:
        - [d1, d2, d3, d4]
        - [d2, d1, d3, d4]
    explanation:
      vi: どうしようもない - hết cách (cụm cố định). 今さら - giờ mới (thì đã muộn); có thể đứng đầu câu hoặc sau chủ đề. どうするようもない sai dạng.
    display_answer: 過ぎたことは今さら後悔してもどうしようもない。
