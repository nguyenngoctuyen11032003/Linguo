  - key: ja:exercise:n2-u2-nitotte-toshite-mcq-situation
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u2-gram-ni-totte
    prompt:
      stem: 'Bạn viết khảo sát cho công ty: "Đối với người cao tuổi, bậc thang ở nhà ga là gánh nặng lớn." Câu nào đúng?'
      stem_lang: vi
      options:
        - { id: g5h, text: 高齢者にとって、駅の階段は大きな負担です。, lang: ja }
        - { id: s2b, text: 高齢者に対して、駅の階段は大きな負担です。, lang: ja }
        - { id: o8r, text: 高齢者として、駅の階段は大きな負担です。, lang: ja }
        - { id: l3x, text: 高齢者にとって、駅の階段は大きな価値です。, lang: ja }
    answer:
      correct_option_id: g5h
    explanation:
      vi: Đánh giá từ góc nhìn người cao tuổi - にとって + 負担です. に対して là thái độ hướng vào ai; として là tư cách; 価値 là giá trị - sai nghĩa.
    display_answer: 高齢者にとって、駅の階段は大きな負担です。
