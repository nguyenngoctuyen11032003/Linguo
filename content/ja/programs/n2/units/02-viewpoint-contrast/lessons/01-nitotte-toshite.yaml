title:
  vi: Góc nhìn và tư cách - ～にとって, ～として, ～からすると
objectives:
  - vi: Đánh giá một việc từ góc nhìn của ai đó bằng ～にとって.
  - vi: Nói tư cách, vai trò bằng ～として / としての.
  - vi: Nêu lập trường hoặc suy đoán từ căn cứ bằng ～からすると / からすれば.
