  # ---------------- recall ----------------
  - key: ja:exercise:n2-u2-nitotte-toshite-fill-nitotte
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u2-gram-ni-totte
    prompt:
      template: "私{{b1}}、家族が一番大切です。(đối với tôi)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [にとって, にとっては]
    known_wrong:
      - answer: に対して
        feedback_vi: に対して là thái độ hướng vào ai. Đánh giá "đối với tôi thì quan trọng" dùng にとって.
        error_tag: nitotte_nitaishite
      - answer: として
        feedback_vi: として là "với tư cách". Góc nhìn đánh giá dùng にとって.
        error_tag: nitotte_toshite
      - answer: にとて
        feedback_vi: Thiếu âm ngắt っ - にとって.
        error_tag: sokuon
    explanation:
      vi: N + にとって - đối với N; vế sau là đánh giá (一番大切です).
    display_answer: 私にとって、家族が一番大切です。

