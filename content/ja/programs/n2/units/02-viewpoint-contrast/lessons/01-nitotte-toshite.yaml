    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u2-gram-kara-suru-to
    prompt:
      source_text: 子どもからすると、大人のルールは不公平に見えるかもしれない。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Từ góc nhìn của trẻ con, quy tắc của người lớn có thể trông không công bằng.
        - Từ góc nhìn của trẻ em, quy tắc của người lớn có thể trông không công bằng.
        - Từ góc nhìn của trẻ em, luật lệ của người lớn có lẽ trông không công bằng.
        - Từ phía trẻ con mà nói, quy tắc của người lớn có thể trông không công bằng.
        - Đứng từ phía trẻ em, quy tắc của người lớn có lẽ có vẻ không công bằng.
        - Đối với trẻ em, quy tắc của người lớn có thể trông không công bằng.
        - Đối với trẻ con, quy tắc của người lớn có lẽ trông bất công.
        - Từ góc nhìn của trẻ em, quy tắc của người lớn có thể có vẻ bất công.
        - Theo cách nhìn của trẻ em, quy tắc của người lớn có thể trông không công bằng.
        - Nhìn từ phía trẻ em, quy tắc của người lớn có lẽ trông không công bằng.
        - Với trẻ em, quy tắc của người lớn có thể trông không công bằng.
        - Từ góc nhìn của trẻ con, quy tắc của người lớn có lẽ trông không công bằng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Với tư cách là trẻ con, quy tắc của người lớn không công bằng.
        feedback_vi: からすると là "từ góc nhìn của", không phải "với tư cách" (として). かもしれない - có thể.
        error_tag: karasuruto_meaning
    explanation:
      vi: 子どもからすると - đứng từ phía trẻ em; 不公平に見える - trông không công bằng; かもしれない - có thể.
    display_answer: Từ góc nhìn của trẻ con, quy tắc của người lớn có thể trông không công bằng.

