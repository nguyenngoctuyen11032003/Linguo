    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u2-gram-kara-suru-to
    prompt:
      stem: 'Bạn nghe một người nói giọng Kansai và đoán quê họ. Câu nào tự nhiên nhất?'
      stem_lang: vi
      options:
