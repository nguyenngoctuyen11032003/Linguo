title:
  vi: "Ôn tập: đọc bài bình luận đa góc nhìn"
objectives:
  - vi: Đọc hiểu bài bình luận ngắn nêu hiện trạng, bối cảnh và nhiều góc nhìn khác nhau.
  - vi: Xác định ý tác giả qua các mẫu tương phản ものの, にもかかわらず, どころか.
  - vi: Viết câu nêu quan điểm có giới hạn, bổ sung và tương phản.
estimated_minutes: 26
skills: [reading, writing, grammar]
prerequisites: [ja:lesson:n2-u2-monono-kuseni]
