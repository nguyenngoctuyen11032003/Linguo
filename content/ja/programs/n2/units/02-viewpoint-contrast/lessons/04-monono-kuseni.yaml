key: ja:lesson:n2-u2-monono-kuseni
order_index: 4
level: n2
title:
  vi: Tương phản - ～ものの, ～にもかかわらず, ～くせに
objectives:
  - vi: Nói "tuy A nhưng thực tế B" bằng ～ものの.
  - vi: Nói "mặc dù A (vậy mà) B" trang trọng bằng ～にもかかわらず.
  - vi: Nhận ra sắc thái chê trách của ～くせに và tránh dùng sai chỗ.
estimated_minutes: 22
skills: [grammar, vocabulary, speaking]
prerequisites: [ja:lesson:n2-u2-bakarika-dokoroka]
