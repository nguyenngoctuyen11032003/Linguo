  - key: ja:exercise:n2-u3-meeting-requests-mcq-decline
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u3-gram-kanemasu
    prompt:
      stem: Khách yêu cầu giao hàng ngay ngày mai, nhưng công ty bạn không thể. Câu trả lời nào lịch sự và đúng nhất?
      stem_lang: vi
      options:
        - { id: b2v, text: 大変申し訳ございませんが、明日のお届けはいたしかねます。, lang: ja }
        - { id: f9e, text: 大変申し訳ございませんが、明日のお届けはいたしかねない状況です。, lang: ja }
        - { id: j6o, text: 明日は無理です。できません。, lang: ja }
        - { id: t3a, text: 大変申し訳ございませんが、明日のお届けはなさいかねます。, lang: ja }
    answer:
      correct_option_id: b2v
    explanation:
      vi: いたしかねます - (chúng tôi) khó có thể làm. かねない là nguy cơ xấu - sai nghĩa; 無理です quá thẳng; なさる là tôn kính, không dùng cho phía mình.
    display_answer: 大変申し訳ございませんが、明日のお届けはいたしかねます。

