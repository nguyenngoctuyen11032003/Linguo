title:
  vi: Họp, nhờ vả và từ chối khéo
objectives:
  - vi: Nhờ việc khó một cách rất lịch sự bằng ～ていただけないでしょうか, 差し支えなければ.
  - vi: Từ chối mềm bằng ～かねます, 遠慮させていただきます, せっかくですが.
  - vi: Hiểu 検討いたします trong cuộc họp có thể là đồng ý hay từ chối khéo.
