    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u3-toritsugu
    prompt:
      stem: 「田中様にお取り次ぎいただけますか。」 Người nói muốn gì?
      stem_lang: vi
      options:
        - { id: h7a, text: Nhờ chuyển máy cho anh Tanaka., lang: vi }
        - { id: w1u, text: Hỏi anh Tanaka đã về chưa., lang: vi }
        - { id: m6e, text: Nhờ anh Tanaka gọi lại., lang: vi }
        - { id: j3r, text: Hẹn gặp anh Tanaka., lang: vi }
    answer:
      correct_option_id: h7a
    explanation:
      vi: 取り次ぐ - chuyển (máy, lời) cho người khác; お取り次ぎいただけますか - anh/chị có thể chuyển máy giúp không ạ.
    display_answer: Nhờ chuyển máy cho anh Tanaka.

  - key: ja:exercise:n2-u3-phone-message-fill-uketamawaru
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u3-uketamawaru
    prompt:
      template: "よろしければ、ご伝言を{{b1}}ましょうか。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Nếu anh/chị muốn, tôi xin nhận lời nhắn nhé?"
        - "Gợi ý: khiêm nhường của 受ける/聞く, chữ đầu giống 承知."
    answer:
      blanks:
        b1: [承り, うけたまわり]
    known_wrong:
      - answer: 承る
        feedback_vi: Trước ましょう dùng dạng ます bỏ ます - 承り.
        error_tag: verb_conjugation
      - answer: 聞き
        feedback_vi: Đúng nghĩa gần nhưng thiếu kính ngữ; nhận lời nhắn của khách dùng 承る.
        error_tag: missing_kenjougo
    explanation:
      vi: 承る - (khiêm nhường) nhận, nghe; ご伝言を承りましょうか - câu chuẩn khi đề nghị nhận lời nhắn.
    display_answer: よろしければ、ご伝言を承りましょうか。

  - key: ja:exercise:n2-u3-phone-message-wb-moushitsutaeru
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u3-moushitsutaeru
    prompt:
      instruction: "Sắp xếp: \"Khi anh Tanaka về, tôi sẽ chuyển lời ạ.\" (nói với khách)"
      tokens:
        - { id: d3, text: 申し伝えます }
        - { id: d1, text: 田中が }
        - { id: d4, text: お伝えになります }
        - { id: d2, text: 戻りましたら、 }
    answer:
      orders:
        - [d1, d2, d3]
    explanation:
      vi: Mình chuyển lời đến đồng nghiệp - 申し伝えます (khiêm nhường). お伝えになる là tôn kính - sai người làm.
    display_answer: 田中が戻りましたら、申し伝えます。

