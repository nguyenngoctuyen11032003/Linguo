title:
  vi: Nghe gọi điện thoại công việc - chuyển máy, lời nhắn, gọi lại
objectives:
  - vi: Nghe hiểu các câu chuyển máy (取り次ぎ) và báo vắng mặt bằng あいにく.
  - vi: Nhận lời nhắn (伝言) bằng 承る, 申し伝える và xác nhận lại bằng 念のため.
  - vi: Nắm được ai sẽ gọi lại cho ai, khi nào (折り返し) trong một cuộc gọi.
