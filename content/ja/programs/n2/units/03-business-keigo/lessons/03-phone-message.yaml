      options:
        - { id: c5y, text: "Anh Suzuki về khoảng 3 giờ, về là bên này sẽ gọi lại cho khách.", lang: vi }
        - { id: o2d, text: "Anh Suzuki đi đến 3 giờ, khách hãy gọi lại sau 3 giờ.", lang: vi }
        - { id: g9f, text: "Anh Suzuki sẽ gọi lại cho khách lúc 3 giờ đúng.", lang: vi }
