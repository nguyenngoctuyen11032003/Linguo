  - key: ja:exercise:n2-u3-phone-message-listen-ainiku
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u3-ainiku
    prompt:
      audio_asset_id: null
      fallback_text: あいにく田中は本日休みを取っております。
      options:
        - { id: b6w, text: "Tiếc là hôm nay anh Tanaka nghỉ phép ạ.", lang: vi }
        - { id: t3m, text: "Tiếc là anh Tanaka vừa đi ra ngoài ạ.", lang: vi }
        - { id: e8k, text: "Anh Tanaka đã lấy tài liệu hôm nay rồi ạ.", lang: vi }
        - { id: r1z, text: "Anh Tanaka hôm nay đang họp ạ.", lang: vi }
    answer:
      correct_option_id: b6w
    explanation:
      vi: あいにく - tiếc là; 休みを取っております - (khiêm nhường) đang nghỉ phép; 本日 - hôm nay. Ra ngoài là 外出しております, đang họp là 会議中でございます.
    display_answer: Tiếc là hôm nay anh Tanaka nghỉ phép ạ.

