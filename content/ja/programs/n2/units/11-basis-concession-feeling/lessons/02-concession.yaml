title:
  vi: Nhượng bộ và biện bạch - ～からといって・～にしても・～ものだから・～っこない・～ものか
objectives:
  - vi: Phản bác suy luận bằng ～からといって.
  - vi: Nhượng bộ bằng ～にしても / ～にしろ / ～にせよ.
  - vi: Biện bạch bằng ～ものだから; phủ nhận mạnh bằng ～っこない / ～ものか.
estimated_minutes: 20
skills:
