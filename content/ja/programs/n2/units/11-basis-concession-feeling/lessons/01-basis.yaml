  - key: ja:exercise:n2-u11-basis-b4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u11-gram-ni-sotte
    prompt:
      template: 計画{{b1}}、作業を進めます。 (Tôi sẽ tiến hành công việc theo đúng kế hoạch.)
      blanks:
        - id: b1
          width_hint: 5
      hint_levels:
        - Cụm nghĩa "theo đúng".
        - Bắt đầu bằng に.
    answer:
