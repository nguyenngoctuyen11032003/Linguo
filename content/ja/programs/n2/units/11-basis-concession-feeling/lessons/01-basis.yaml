      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 年齢を問わず、誰でも参加できます。
        - 年齢を問わず誰でも参加できます。
        - ねんれいをとわず、だれでもさんかできます。
        - 年齢に関係なく、誰でも参加できます。
    known_wrong:
      - answer: 年齢に反して、誰でも参加できます。
        feedback_vi: 反して là trái với, không phải bất kể.
        error_tag: nuance
    explanation:
