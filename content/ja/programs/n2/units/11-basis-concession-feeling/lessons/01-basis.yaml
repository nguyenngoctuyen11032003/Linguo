      correct_option_id: c48
    explanation:
      vi: N にかけては - về N thì. Các mẫu còn lại không có nghĩa khen kỹ năng.
    display_answer: 料理にかけては、彼女に勝てる人はいません。
  - key: ja:exercise:n2-u11-basis-b6
