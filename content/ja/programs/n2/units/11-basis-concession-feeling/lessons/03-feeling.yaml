    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u11-gram-te-naranai
    prompt:
      stem: Chọn câu đúng - 試験の結果が心配___。
      stem_lang: vi
      options:
        - id: sjv
          text: がならない
          lang: ja
        - id: o8u
          text: にならない
          lang: ja
        - id: kfn
          text: をならない
          lang: ja
        - id: nwr
          text: でならない
          lang: ja
    answer:
      correct_option_id: nwr
    explanation:
      vi: Na で + ならない - không chịu nổi. にならない, がならない, をならない sai.
    display_answer: でならない
