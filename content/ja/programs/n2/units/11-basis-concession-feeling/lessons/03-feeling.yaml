      stem_lang: vi
      options:
        - id: lk2
          text: 悔しい
          lang: ja
        - id: x4b
          text: 感動
          lang: ja
        - id: u01
          text: 無理
          lang: ja
        - id: iv4
          text: 面倒
          lang: ja
