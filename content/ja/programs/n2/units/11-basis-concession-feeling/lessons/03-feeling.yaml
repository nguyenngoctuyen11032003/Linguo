  - key: ja:exercise:n2-u11-feeling-f8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n2-u11-gram-te-naranai
    prompt:
      source_text: Tôi lo lắng kết quả kỳ thi đến không chịu nổi.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 試験の結果が心配でならない。
        - 試験の結果が心配でたまらない。
