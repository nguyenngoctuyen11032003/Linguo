title:
  vi: Nói về số liệu, biểu đồ - ～を占める, 増加・減少, ～に伴って, 前年比
objectives:
  - vi: Mô tả tỉ lệ bằng ～を占める, 過半数, 割.
  - vi: Mô tả xu hướng bằng 増加 / 減少 / 横ばい và 前年比.
  - vi: Nối hai sự thay đổi bằng ～に伴って / ～に伴い.
estimated_minutes: 24
skills: [reading, grammar, vocabulary]
prerequisites: [ja:lesson:n2-u4-headlines]
