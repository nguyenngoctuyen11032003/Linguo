    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u4-gram-to-wa-kagiranai
    prompt:
      template: "値段が高いからといって、品質がいい{{b1}}。"
      blanks:
        - { id: b1, width_hint: 6 }
      hint_levels:
        - "Nghĩa: Không phải cứ giá cao là chất lượng tốt."
        - "Gợi ý: と + は + 限る (thể phủ định)."
    answer:
      blanks:
        b1: [とは限らない, とはかぎらない, とは限りません, とはかぎりません]
    known_wrong:
      - answer: はずがない
        feedback_vi: はずがない là "không thể nào" - phủ định hoàn toàn. Ở đây chỉ là "chưa chắc" - とは限らない.
        error_tag: partial_negation
      - answer: とは限る
        feedback_vi: ～からといって cần phủ định ở cuối - とは限らない.
        error_tag: grammar_form
    explanation:
      vi: ～からといって、～とは限らない - không phải cứ... là...
    display_answer: 値段が高いからといって、品質がいいとは限らない。

