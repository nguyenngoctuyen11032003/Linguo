title:
  vi: Phủ định một phần - ～わけではない, ～ないことはない, ～とは限らない
objectives:
  - vi: Phủ định mềm, tránh hiểu lầm bằng ～わけではない / ～わけでもない.
  - vi: Thừa nhận miễn cưỡng bằng ～ないことはない và phân biệt với ～ことはない (không cần).
  - vi: Bác bỏ khái quát hoá bằng ～とは限らない và 一概に～とは言えない.
estimated_minutes: 24
skills: [grammar, speaking, reading]
