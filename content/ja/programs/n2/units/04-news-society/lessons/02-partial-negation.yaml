  - key: ja:exercise:n2-u4-partial-negation-mcq-kotowanai
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-gram-nai-koto-wa-nai
    prompt:
      stem: Câu nào có nghĩa "Không cần phải xin lỗi đâu."?
      stem_lang: vi
      options:
        - { id: s7d, text: 謝ることはないよ。, lang: ja }
        - { id: e4w, text: 謝らないことはないよ。, lang: ja }
        - { id: n6j, text: 謝るとは限らないよ。, lang: ja }
        - { id: b2y, text: 謝るわけだよ。, lang: ja }
    answer:
      correct_option_id: s7d
    explanation:
      vi: V thể từ điển + ことはない - không cần. 謝らないことはない là "không phải là không xin lỗi"; 謝るとは限らない là "chưa chắc sẽ xin lỗi"; 謝るわけだ là "thảo nào xin lỗi".
    display_answer: 謝ることはないよ。

