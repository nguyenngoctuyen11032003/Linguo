  - key: ja:exercise:n2-u4-hearsay-fill-sareru
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-gram-to-sareru
    prompt:
      template: "一般に、緑茶は体にいい{{b1}}います。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Nói chung, trà xanh được cho là tốt cho cơ thể."
        - "Gợi ý: と + bị động của する + て."
    answer:
      blanks:
        b1: [とされて, と言われて, といわれて]
    known_wrong:
      - answer: とのことで
        feedback_vi: とのことだ dùng chuyển một lời nhắn cụ thể và không đi với います. Nhận định chung - とされています.
        error_tag: hearsay_form
      - answer: として
        feedback_vi: としています là "(ai đó) cho rằng" - cần chủ thể phát ngôn. "Được cho là" dùng bị động とされています.
        error_tag: passive
    explanation:
      vi: ～とされている - được cho là (nhận định chung). と言われている cũng đúng nghĩa.
    display_answer: 一般に、緑茶は体にいいとされています。

  - key: ja:exercise:n2-u4-hearsay-wb-niyoruto
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u4-gram-ni-yoru-to
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Theo tin tức, ngày mai tàu điện sẽ ngừng chạy.\""
      tokens:
        - { id: t3, text: 電車が止まるそうです }
        - { id: t1, text: ニュースによると、 }
        - { id: t4, text: 電車が止まるはずです }
        - { id: t2, text: 明日は }
    answer:
      orders:
        - [t1, t2, t3]
    explanation:
      vi: ～によると、～そうです - dẫn nguồn tin và kết bằng mẫu truyền đạt. はずです là suy luận của người nói, không hợp với によると.
    display_answer: ニュースによると、明日は電車が止まるそうです。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u4-hearsay-fill-tonokoto
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u4-gram-to-no-koto-da
    prompt:
      template: "部長から連絡があって、今日は直接取引先に行く{{b1}}です。(truyền lời nhắn)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [とのこと, ということ]
    known_wrong:
      - answer: はず
        feedback_vi: はずです là suy luận của bạn; ở đây bạn chuyển lời nhắn của trưởng phòng - とのことです.
        error_tag: hearsay_form
      - answer: つもり
        feedback_vi: つもりです là ý định của chính người nói. Chuyển lời người khác - とのことです.
        error_tag: hearsay_form
    explanation:
      vi: ～とのことです - (trưởng phòng) nhắn là... ということです cũng dùng được với nghĩa truyền đạt.
    display_answer: 部長から連絡があって、今日は直接取引先に行くとのことです。

