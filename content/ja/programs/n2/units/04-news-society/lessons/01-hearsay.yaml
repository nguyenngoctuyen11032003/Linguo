        - { id: b7m, text: Nói ý định của chính mình, lang: vi }
        - { id: e2q, text: Suy đoán dựa trên những gì mắt thấy, lang: vi }
        - { id: w9z, text: Ra lệnh một cách lịch sự, lang: vi }
