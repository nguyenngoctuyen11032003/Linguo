        - 人手不足が深刻になっています。
        - 人手不足が深刻になってきている。
        - 人手不足が深刻になってきています。
        - 人手不足が深刻化している。
        - 人手不足が深刻化しています。
        - 人手不足がますます深刻になっている。
        - 人手不足がますます深刻になっています。
        - 人手不足がますます深刻化している。
        - 人手不足がますます深刻化しています。
        - 人手不足はますます深刻になっています。
        - 人手不足は深刻になっています。
        - 人手不足は深刻化しています。
