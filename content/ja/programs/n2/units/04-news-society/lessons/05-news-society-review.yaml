        - 政府の発表によると、生まれた子どもの数は前年比5%減ったとのことです。
        - 政府の発表によると、生まれた子供の数は前年比5%減少したそうです。
        - 政府の発表によると、生まれた子供の数は前年比5%減ったそうです。
        - 政府の発表によると、生まれた子供の数は前年比5%減少したという。
        - 政府の発表によると、出生数は前年比5%減少したそうです。
        - 政府の発表によると、出生数は前年比5%減少したという。
        - 政府の発表によると、出生数は前年比5%減少したとのことです。
        - 政府の発表によると、出生数は前年比5%減ったそうです。
        - 政府の発表によると、出生数は前年比5%減ったという。
        - 政府の発表によれば、生まれた子どもの数は前年比5%減少したそうです。
        - 政府の発表によれば、出生数は前年比5%減少したそうです。
        - 政府の発表によれば、出生数は前年比5%減少したという。
        - 政府の発表によると、生まれた子どもの数は前年比5％減少したそうです。
        - 政府の発表によると、出生数は前年比5％減少したそうです。
