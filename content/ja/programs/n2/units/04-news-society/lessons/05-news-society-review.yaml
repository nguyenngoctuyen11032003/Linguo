  - key: ja:exercise:n2-news-society-review-fill-susumu
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-shoushi-koureika
    prompt:
      template: "日本では少子高齢化が{{b1}}います。"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Ở Nhật, tình trạng giảm sinh và già hoá dân số đang tiến triển."
        - "Gợi ý: động từ 'tiến triển' - すすむ, thể て."
    answer:
      blanks:
        b1: [進んで, すすんで]
    known_wrong:
      - answer: 増えて
        feedback_vi: 少子高齢化 là một quá trình - đi với 進む, không đi với 増える.
        error_tag: collocation
      - answer: 進めて
        feedback_vi: 進める là tha động từ (thúc đẩy cái gì). Tự tiến triển - 進んでいる.
        error_tag: transitivity
    explanation:
      vi: 少子高齢化が進んでいる - tình trạng giảm sinh và già hoá đang tiến triển.
    display_answer: 日本では少子高齢化が進んでいます。

  - key: ja:exercise:n2-news-society-review-wb-chousa
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-gram-ni-yoru-to
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: \"Theo một cuộc khảo sát, quá nửa số doanh nghiệp cảm thấy thiếu nhân lực.\""
      tokens:
        - { id: c3, text: 人手不足を }
        - { id: c5, text: 感じるはずだ }
        - { id: c1, text: ある調査によると、 }
        - { id: c4, text: 感じているという }
        - { id: c2, text: 企業の過半数が }
    answer:
      orders:
        - [c1, c2, c3, c4]
    explanation:
      vi: ～によると、～という - dẫn thông tin khảo sát. はずだ là suy luận của người viết, không hợp với によると.
    display_answer: ある調査によると、企業の過半数が人手不足を感じているという。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-news-society-review-fill-hitode
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-hitode-busoku
    prompt:
      template: "若い働き手が減り、建設業界では{{b1}}が続いている。(thiếu nhân lực)"
      blanks:
