        - 政府の発表によると、出生数は前年比で5%減少したそうです。
    known_wrong:
      - answer: 政府の発表によると、出生数は前年比5%増加したそうです。
        feedback_vi: 増加 là tăng; giảm là 減少 / 減る.
        error_tag: vocab_meaning
      - answer: 政府の発表によると、出生数は前年比5%減少しました。
        feedback_vi: Câu có ～によると cần kết bằng mẫu truyền đạt - ～そうです / ～という / ～とのことです.
        error_tag: hearsay_form
    explanation:
