        feedback_vi: 深刻 là tính từ đuôi な - 深刻になる hoặc danh động từ 深刻化する.
        error_tag: grammar_form
      - answer: 人出不足が深刻になっています。
        feedback_vi: 人出 là lượng người ra đường. Thiếu nhân lực - 人手不足.
        error_tag: kanji
    explanation:
      vi: 深刻になっている / 深刻化している - đang trở nên nghiêm trọng. Thêm ますます để nhấn "ngày càng".
    display_answer: 人手不足がますます深刻になっている。

