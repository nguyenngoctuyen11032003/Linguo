    known_wrong:
      - answer: ひとでふそく
        feedback_vi: 不足 trong từ ghép đọc đục - ひとでぶそく.
        error_tag: reading
      - answer: 人出不足
        feedback_vi: 人出 là lượng người ra đường. Người làm, sức người - 人手.
        error_tag: kanji
    explanation:
      vi: 人手不足が続いている - tình trạng thiếu nhân lực kéo dài. 働き手 - người lao động; 減り là dạng nối văn viết của 減って.
    display_answer: 若い働き手が減り、建設業界では人手不足が続いている。

