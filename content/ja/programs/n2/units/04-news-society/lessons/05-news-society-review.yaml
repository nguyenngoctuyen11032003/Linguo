    display_answer: 政府の発表によると、生まれた子どもの数は前年比5%減少したそうです。

  - key: ja:exercise:n2-news-society-review-translate-shinkoku
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u4-hitode-busoku
