body:
  - type: objective
    text:
      vi: Bài ôn cuối unit đưa bạn vào một bản tin hoàn chỉnh về vấn đề xã hội Nhật Bản - giảm sinh, già hoá, thiếu nhân lực - và luyện đúng kỹ năng đề N2 hay hỏi - ai nói điều này, và người viết nghĩ gì.
  - type: explain
    text:
      vi: 'Cấu trúc bản tin: 見出し (tiêu đề) → リード文 (câu tóm tắt: ai, cái gì, khi nào) → số liệu (～によると、～を占める / 前年比～%減) → nhận định (～とされる, 専門家は～と指摘している) → triển vọng (～する方針だ / ～見通しだ).'
  - type: explain
    text:
      vi: 'Từ vựng chủ đề: 少子高齢化 (giảm sinh và già hoá dân số) - đi với 進む; 人手不足 (thiếu nhân lực) - đi với 深刻だ / 深刻化する; 対策 (biện pháp đối phó) - ～への対策, 対策をとる / 進める.'
  - type: deep_explain
    text:
      vi: 'Khi đọc, hãy gạch chân đuôi câu. ～という, ～とのことだ, ～とされる, ～によると = thông tin dẫn lại, không phải ý người viết. ～とは限らない, ～必要があるだろう, ～べきではないか = ý kiến của người viết. Câu hỏi "筆者の考えに合うものはどれか" thường nhắm vào câu sau ただ / しかし ở cuối đoạn.'
  - type: example
    target: ある調査によると、65歳以上の人が人口の約3割を占めるという。
    target_lang: ja
    translation:
      vi: Theo một cuộc khảo sát, người từ 65 tuổi trở lên chiếm khoảng 30% dân số.
  - type: example
    target: 少子高齢化に伴って、働く人の数が減っている。
    target_lang: ja
    translation:
      vi: Cùng với tình trạng giảm sinh và già hoá dân số, số người lao động đang giảm.
  - type: example
    target: 介護の現場では人手不足が深刻です。
    target_lang: ja
    translation:
      vi: Trong ngành chăm sóc người cao tuổi, tình trạng thiếu nhân lực đang nghiêm trọng.
  - type: example
    target: 政府は人手不足への対策として、外国人労働者の受け入れを拡大する方針だ。
    target_lang: ja
    translation:
      vi: Như một biện pháp đối phó với thiếu nhân lực, chính phủ có chủ trương mở rộng tiếp nhận lao động nước ngoài.
  - type: common_mistake
    wrong: 会社は人手不足を対策している。
    right: 会社は人手不足への対策を進めている。
    target_lang: ja
    note:
      vi: 対策 là danh từ, không dùng như động từ với を. Nói ～への対策を進める / ～の対策をとる.
  - type: common_mistake
    wrong: 日本では少子高齢化が増えている。
    right: 日本では少子高齢化が進んでいる。
    target_lang: ja
    note:
      vi: 少子高齢化 là một quá trình - đi với 進む (tiến triển), không đi với 増える.
  - type: summary
    points:
      - vi: 少子高齢化が進む; 人手不足が深刻だ; ～への対策.
      - vi: Thông tin dẫn lại - によると, という, とされる, とのことだ.
      - vi: Ý người viết - とは限らない, ～だろう, thường sau ただ / しかし.
      - vi: Ôn を占める, に伴って, 前年比, tiêu đề ～へ.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-news-society-review-mcq-reading
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u4-shoushi-koureika
    prompt:
      stem: "Đọc: 「ある調査によると、65歳以上の人が人口の約3割を占めるという。少子高齢化に伴って働く人の数が減り、多くの業界で人手不足が深刻になっている。」 Câu nào đúng với đoạn văn?"
      stem_lang: vi
      options:
        - { id: h2q, text: "Người từ 65 tuổi chiếm khoảng 30% dân số, và thiếu nhân lực trở nên nghiêm trọng ở nhiều ngành.", lang: vi }
        - { id: w7d, text: Người từ 65 tuổi chỉ chiếm khoảng 3% dân số., lang: vi }
        - { id: k5j, text: Số người lao động đang tăng nhờ già hoá dân số., lang: vi }
        - { id: c1x, text: Người viết khẳng định nên tăng tỉ lệ sinh ngay., lang: vi }
    answer:
      correct_option_id: h2q
    explanation:
      vi: 約3割を占める - chiếm khoảng 30%; 働く人の数が減り - số người lao động giảm; 人手不足が深刻 - thiếu nhân lực nghiêm trọng. Đoạn văn không có ý kiến "nên".
    display_answer: Người từ 65 tuổi chiếm khoảng 30% dân số, và thiếu nhân lực trở nên nghiêm trọng ở nhiều ngành.

