key: ja:lesson:n2-u4-headlines
order_index: 3
level: n2
title:
  vi: Đọc tiêu đề báo và từ Hán ngữ trong tin tức
objectives:
  - vi: Hiểu tiêu đề báo rút gọn - lược trợ từ, kết bằng danh từ, ～へ, ～か.
  - vi: Nhận ra và đọc đúng từ Hán ngữ hay gặp trong tin tức (政府, 発生, 逮捕, 被害, 方針, 値上げ).
  - vi: Viết lại tiêu đề thành câu đầy đủ.
estimated_minutes: 24
skills: [reading, vocabulary, grammar]
prerequisites: [ja:lesson:n2-u4-partial-negation]
