title:
  vi: Đọc bài bình luận (評論文) - tìm chủ trương tác giả qua のである, つまり, とはいえ
objectives:
  - vi: Nhận ra câu chứa chủ trương (主張) của tác giả trong một đoạn bình luận.
  - vi: Hiểu vai trò của のである, つまり, とはいえ trong mạch lập luận.
  - vi: Phân biệt chủ trương với căn cứ (根拠) và ví dụ khi trả lời câu hỏi đọc hiểu.
