  - key: ja:exercise:n2-u5-hyouron-fill-towaie
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u5-gram-towaie
    prompt:
      template: "在宅勤務は通勤がなくて便利だ。{{b1}}、同僚と話す機会が減るという問題もある。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Làm việc tại nhà tiện vì không phải đi lại. Tuy nói vậy, cũng có vấn đề là ít dịp nói chuyện với đồng nghiệp hơn."
        - "Gợi ý: từ nối 4 chữ kana, nghĩa \"tuy nói vậy nhưng\"."
    answer:
      blanks:
        b1: [とはいえ, とは言え, とは言っても, とはいっても, しかし, だが, でも]
    known_wrong:
      - answer: つまり
        feedback_vi: Câu sau trái chiều với câu trước (tiện → có vấn đề), không phải nói lại cùng ý - dùng とはいえ.
        error_tag: connector_choice
      - answer: だから
        feedback_vi: だから nêu kết quả. "Có vấn đề" không phải kết quả của "tiện" - cần từ nhượng bộ とはいえ.
        error_tag: connector_choice
    explanation:
      vi: とはいえ - công nhận ý trước (tiện) rồi nêu mặt hạn chế. しかし / だが cũng đúng nghĩa.
    display_answer: 在宅勤務は通勤がなくて便利だ。とはいえ、同僚と話す機会が減るという問題もある。

