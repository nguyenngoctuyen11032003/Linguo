  - key: ja:exercise:n2-u5-monoda-wb-kawaru
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-monoda
    prompt:
      instruction: "Sắp xếp thành câu: \"Lòng người vốn không dễ thay đổi.\""
      tokens:
        - { id: p3, text: 変わらない }
        - { id: p5, text: ことだ }
        - { id: p1, text: 人の気持ちは }
        - { id: p4, text: ものだ }
        - { id: p2, text: なかなか }
    answer:
      orders:
        - [p1, p2, p3, p4]
    explanation:
      vi: Bản chất, lẽ thường - ものだ. なかなか + phủ định - mãi không, không dễ. ことだ là lời khuyên nên không hợp.
    display_answer: 人の気持ちは、なかなか変わらないものだ。
