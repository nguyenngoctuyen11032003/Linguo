  # ---------------- application ----------------
  - key: ja:exercise:n2-u5-monoda-mcq-senpai
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-kotoda
    prompt:
      stem: 'Đàn em than "Em hay quên từ vựng quá." Bạn (đàn anh) khuyên: "Muốn nhớ thì tốt nhất là dùng từ đó trong câu." Câu nào hợp nhất?'
      stem_lang: vi
      options:
        - { id: n1p, text: 覚えたければ、その言葉を文の中で使ってみることだ。, lang: ja }
        - { id: o5q, text: 覚えたければ、その言葉を文の中で使ってみたものだ。, lang: ja }
        - { id: p8r, text: 覚えたければ、その言葉を文の中で使ってみるものがある。, lang: ja }
        - { id: q2s, text: 覚えたければ、その言葉を文の中で使ってみざるを得ない。, lang: ja }
    answer:
      correct_option_id: n1p
    explanation:
      vi: Lời khuyên cụ thể cho người dưới - ことだ. たものだ là hồi tưởng; ものがある là cảm nhận; ざるを得ない là "đành phải" - đều không phải lời khuyên.
    display_answer: 覚えたければ、その言葉を文の中で使ってみることだ。

