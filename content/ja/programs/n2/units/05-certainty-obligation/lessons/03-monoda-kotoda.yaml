        - 時間がたつのは早いものですね。
        - 時間が経つのは早いものですね。
        - 時間がたつのは速いものですね。
        - 時がたつのは早いものですね。
        - 時が経つのは早いものですね。
        - 時間のたつのは早いものですね。
        - 時間の経つのは早いものですね。
        - 時間がたつのは本当に早いものですね。
        - 時間が経つのは本当に早いものですね。
        - じかんがたつのははやいものですね。
