body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "hồi nhỏ tôi hay bơi ở sông", khuyên đàn em "muốn đỗ thì luyện mỗi ngày", và khen một bộ phim "có cái gì đó làm người ta xúc động".
  - type: explain
    text:
      vi: '～ものだ có ba cách dùng chính. (1) Bản chất, lẽ thường: 人は変わるものだ, 時間がたつのは早いものだ. (2) Lời khuyên theo lẽ thường, cho mọi người: 目上の人には敬語を使うものだ. (3) V-たものだ - hồi tưởng việc ngày xưa hay làm: 学生の頃は、よく徹夜したものだ.'
  - type: explain
    text:
      vi: '～ことだ - lời khuyên cụ thể cho người nghe: V từ điển hoặc V-ない + ことだ. 上手になりたければ、毎日練習することだ; 疲れているなら、無理をしないことだ. Thường có điều kiện ở vế trước (～たければ, ～なら).'
  - type: explain
    text:
      vi: '～ものがある - "có cái gì đó...", cảm nhận một nét đặc biệt: 彼の演技には人を引きつけるものがある. Hay đi với 感動させる, 心を打つ, 迫力, 驚く, 寂しい.'
  - type: deep_explain
    text:
      vi: ものだ nói về "người ta nói chung"; ことだ nói với "bạn, trong trường hợp này". ことだ mang giọng người trên - người có kinh nghiệm khuyên người dưới, nên không dùng với cấp trên, thầy cô; với họ dùng ～たほうがいいと思います hoặc ～てはいかがでしょうか. Hồi tưởng ～たものだ chỉ dùng cho việc lặp lại nhiều lần, không dùng cho một sự kiện duy nhất.
  - type: example
    target: 子供の頃は、毎日暗くなるまで外で遊んだものだ。
    target_lang: ja
    translation:
      vi: Hồi nhỏ ngày nào tôi cũng chơi ngoài trời đến tối mịt.
    note:
      vi: Thói quen lặp lại trong quá khứ - V-たものだ.
  - type: example
    target: 人の気持ちは、なかなか変わらないものだ。
    target_lang: ja
    translation:
      vi: Lòng người vốn không dễ thay đổi.
  - type: example
    target: 日本語が上手になりたければ、日本人と話す機会をたくさん作ることだ。
    target_lang: ja
    translation:
      vi: Muốn giỏi tiếng Nhật thì tốt nhất là tạo thật nhiều cơ hội nói chuyện với người Nhật.
  - type: example
    target: この映画には、見る人を感動させるものがある。迫力も満点だ。
    target_lang: ja
    translation:
      vi: Bộ phim này có điều gì đó làm người xem xúc động. Độ hoành tráng cũng tuyệt vời.
  - type: common_mistake
    wrong: 部長、少し休むことですよ。
    right: 部長、少しお休みになったほうがいいと思います。
    target_lang: ja
    note:
      vi: ことだ là giọng người trên khuyên người dưới, nói với cấp trên là thất lễ. Tiếng Việt "anh nên nghỉ chút" không phân biệt vai vế nên người Việt dễ dùng sai.
  - type: common_mistake
    wrong: 子供の頃、よく川で泳ぐものだ。
    right: 子供の頃、よく川で泳いだものだ。
    target_lang: ja
    note:
      vi: Hồi tưởng phải dùng thể た + ものだ. 泳ぐものだ lại thành "người ta vốn phải bơi" - lẽ thường.
  - type: summary
    points:
      - vi: ～ものだ - bản chất, lẽ thường, lời khuyên chung; V-たものだ - hồi tưởng thói quen xưa.
      - vi: V-る/ない + ことだ - lời khuyên cụ thể; không dùng với người trên.
      - vi: ～ものがある - có nét đặc biệt (cảm nhận của người nói).
      - vi: 感動する - cảm động (～に感動する); 迫力 - sức hút, độ hoành tráng.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u5-monoda-mcq-recall
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u5-gram-monoda
    prompt:
      stem: 「学生の頃は、よく徹夜したものだ。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: a1c, text: Hồi còn sinh viên tôi hay thức trắng đêm., lang: vi }
        - { id: b4d, text: Sinh viên thì phải thức trắng đêm., lang: vi }
        - { id: c7e, text: Hồi sinh viên tôi đã thức trắng một đêm., lang: vi }
        - { id: d2f, text: Sinh viên không nên thức trắng đêm., lang: vi }
    answer:
      correct_option_id: a1c
    explanation:
      vi: V-たものだ đi với よく - hồi tưởng thói quen lặp lại ngày xưa. Không phải lời khuyên, cũng không phải một lần duy nhất.
    display_answer: Hồi còn sinh viên tôi hay thức trắng đêm.

  - key: ja:exercise:n2-u5-monoda-listen-kotoda
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u5-gram-kotoda
    prompt:
      audio_asset_id: null
      fallback_text: 疲れているなら、無理をしないことだ。
      options:
        - { id: e5g, text: "Nếu mệt thì tốt nhất là đừng cố quá.", lang: vi }
        - { id: f8h, text: "Dù mệt cũng phải cố gắng.", lang: vi }
        - { id: g3i, text: "Nếu mệt thì không thể không cố.", lang: vi }
        - { id: h6j, text: "Tôi mệt vì đã cố quá sức.", lang: vi }
    answer:
      correct_option_id: e5g
    explanation:
      vi: V-ない + ことだ - lời khuyên "tốt nhất là đừng...". 無理をする - cố quá sức.
    display_answer: "Nếu mệt thì tốt nhất là đừng cố quá."

  - key: ja:exercise:n2-u5-monoda-mcq-monogaaru
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u5-gram-mono-ga-aru
    prompt:
      stem: 「彼の歌には、人の心を打つものがある。」 nghĩa là gì?
      stem_lang: vi
      options:
        - { id: i2k, text: Bài hát của anh ấy có điều gì đó chạm đến lòng người., lang: vi }
        - { id: j7l, text: Anh ấy có một món đồ để đánh vào tim người khác., lang: vi }
        - { id: k4m, text: Người ta nên hát bài của anh ấy bằng cả trái tim., lang: vi }
        - { id: l9n, text: Bài hát của anh ấy từng làm người ta đau lòng., lang: vi }
    answer:
      correct_option_id: i2k
    explanation:
      vi: ものがある ở đây không phải "có một đồ vật" mà là cảm nhận - "có cái gì đó". 心を打つ - chạm đến trái tim, gây xúc động.
    display_answer: Bài hát của anh ấy có điều gì đó chạm đến lòng người.

  - key: ja:exercise:n2-u5-monoda-fill-oyoida
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u5-gram-monoda
    prompt:
      template: "子供の頃、夏はよくこの川で{{b1}}ものだ。(泳ぐ)"
      blanks:
        - { id: b1, width_hint: 3 }
      hint_levels:
        - "Nghĩa: Hồi nhỏ, mùa hè tôi hay bơi ở con sông này."
        - "Gợi ý: hồi tưởng dùng thể た trước ものだ."
    answer:
      blanks:
        b1: [泳いだ, およいだ]
    known_wrong:
      - answer: 泳ぐ
        feedback_vi: 泳ぐものだ là lẽ thường "người ta vốn bơi"; hồi tưởng phải dùng thể た - 泳いだものだ.
        error_tag: monoda_ta
      - answer: 泳いでいる
        feedback_vi: Hồi tưởng dùng thể た đơn giản - 泳いだものだ.
        error_tag: monoda_ta
    explanation:
      vi: 泳ぐ → 泳いだ (ぐ → いだ). よく + V-たものだ - hồi tưởng thói quen.
    display_answer: 子供の頃、夏はよくこの川で泳いだものだ。

  - key: ja:exercise:n2-u5-monoda-wb-kandou
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u5-kandou
    prompt:
      instruction: "Sắp xếp thành câu: \"Bộ phim này có điều gì đó làm người xem xúc động.\""
      tokens:
        - { id: m3, text: 感動させる }
        - { id: m1, text: この映画には }
        - { id: m5, text: 感動する }
        - { id: m4, text: ものがある }
        - { id: m2, text: 見る人を }
    answer:
      orders:
        - [m1, m2, m3, m4]
    explanation:
      vi: 見る人を感動させる - làm người xem cảm động (thể sai khiến, có tân ngữ を). 見る人を感動する sai vì 感動する không nhận を.
    display_answer: この映画には、見る人を感動させるものがある。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u5-monoda-fill-kotoda
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u5-gram-kotoda
    prompt:
      template: "日本語が上手になりたければ、毎日少しずつでも{{b1}}ことだ。(練習する)"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [練習する, れんしゅうする]
    known_wrong:
      - answer: 練習した
        feedback_vi: Lời khuyên ことだ đi với thể từ điển - 練習することだ.
        error_tag: kotoda_form
      - answer: 練習
        feedback_vi: Danh từ không gắn thẳng ことだ trong lời khuyên; dùng động từ 練習する.
        error_tag: kotoda_form
    explanation:
      vi: V từ điển + ことだ - "tốt nhất là...". Vế trước ～たければ nêu mục tiêu của người nghe.
    display_answer: 日本語が上手になりたければ、毎日少しずつでも練習することだ。

