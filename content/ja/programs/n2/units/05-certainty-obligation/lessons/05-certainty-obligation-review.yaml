  # ---------------- application ----------------
  - key: ja:exercise:n2-certainty-obligation-review-mcq-choose
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-nai-wake-ni-ikanai
    prompt:
      stem: 'Bạn muốn bỏ điện thoại cả cuối tuần, nhưng sếp có thể gọi gấp. Bạn viết: "Vì có thể có liên lạc từ công ty nên không thể không mang điện thoại theo."'
      stem_lang: vi
      options:
        - { id: m4p, text: 会社から連絡が来るかもしれないので、スマホを持って行かないわけにはいかない。, lang: ja }
        - { id: n7q, text: 会社から連絡が来るかもしれないので、スマホを持って行くわけにはいかない。, lang: ja }
        - { id: o2r, text: 会社から連絡が来るかもしれないので、スマホを持って行かずにはいられない。, lang: ja }
        - { id: p5s, text: 会社から連絡が来るかもしれないので、スマホを持って行くことだ。, lang: ja }
    answer:
      correct_option_id: m4p
    explanation:
      vi: Trách nhiệm với công ty - ないわけにはいかない. 持って行くわけにはいかない ngược nghĩa; ずにはいられない là cảm xúc; ことだ là lời khuyên người khác.
    display_answer: 会社から連絡が来るかもしれないので、スマホを持って行かないわけにはいかない。

  - key: ja:exercise:n2-certainty-obligation-review-mcq-advice
