        - 大切なのは、使うか使わないかではなく、どう使うかなのである。
        - 大切なのは使うか使わないかではなく、どう使うかなのである。
        - 大切なのは、使うか使わないかではなく、どのように使うかなのである。
        - 大事なのは、使うか使わないかではなく、どう使うかなのである。
        - 大事なのは、使うか使わないかではなく、どのように使うかなのである。
        - 重要なのは、使うか使わないかではなく、どう使うかなのである。
        - 重要なのは、使うか使わないかではなく、どのように使うかなのである。
        - 大切なのは、使うかどうかではなく、どう使うかなのである。
        - 大切なのは、使うかどうかではなく、どのように使うかなのである。
