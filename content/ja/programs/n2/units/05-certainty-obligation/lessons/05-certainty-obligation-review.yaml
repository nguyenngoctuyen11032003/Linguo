body:
  - type: objective
    text:
      vi: Bài ôn là một bài bình luận về "nghiện điện thoại" - đề tài rất hay ra trong đọc hiểu N2. Bạn đọc, tìm chủ trương của tác giả và dùng lại toàn bộ ngữ pháp chắc chắn, bắt buộc, lẽ thường của unit.
  - type: explain
    text:
      vi: 'Bài đọc: 「電車の中を見渡すと、ほとんどの人がスマホを見ている。一日中スマホを手放せない人が増えているのは間違いない。このままでは、人と直接話す力が弱まる恐れがあるという声もある。確かに、スマホに依存しすぎるのは問題だ。とはいえ、仕事でも生活でも、今やスマホを使わざるを得ない場面が多い。スマホを一方的に悪いものだと決めつけるべきではない。つまり、大切なのは使うか使わないかではなく、どう使うかなのである。」'
  - type: explain
    text:
      vi: 'Phân tích: câu 1–2 nêu hiện tượng (căn cứ); câu 3 là ý kiến của người khác (という声もある); 確かに～ là ý tác giả công nhận tạm thời; sau とはいえ là phản bác; câu cuối つまり～なのである là chủ trương - điều quan trọng là dùng thế nào.'
  - type: deep_explain
    text:
      vi: Câu hỏi đọc hiểu thường đưa phương án "nên hạn chế dùng điện thoại" - khớp với câu 確かに nhưng không phải chủ trương. Hãy luôn hỏi "sau とはいえ / しかし, tác giả nói gì?" và "câu có つまり / のである nói gì?". Ngoài ra, ～という声もある, ～と言われる là ý kiến người khác, tác giả không nhất thiết đồng ý.
  - type: example
    target: このままでは、人と直接話す力が弱まる恐れがある。
    target_lang: ja
    translation:
      vi: Cứ thế này thì có nguy cơ khả năng nói chuyện trực tiếp với người khác bị suy yếu.
  - type: example
    target: 今やスマホを使わざるを得ない場面が多い。
    target_lang: ja
    translation:
      vi: Bây giờ có rất nhiều tình huống buộc phải dùng điện thoại.
  - type: example
    target: 大切なのは、使うか使わないかではなく、どう使うかなのである。
    target_lang: ja
    translation:
      vi: Điều quan trọng không phải là dùng hay không dùng, mà là dùng như thế nào.
  - type: example
    target: 通知が来ると、つい見ずにはいられない。人間とはそういうものだ。
    target_lang: ja
    translation:
      vi: Có thông báo đến là không kìm được mà xem ngay. Con người vốn là như thế.
  - type: common_mistake
    wrong: スマホを依存している人が多い。
    right: スマホに依存している人が多い。
    target_lang: ja
    note:
      vi: 依存する đi với に (phụ thuộc vào). Tiếng Việt "nghiện điện thoại" không có giới từ nên dễ dùng を.
  - type: common_mistake
    wrong: 筆者は、スマホを使うべきではないと主張している。
    right: 筆者は、スマホをどう使うかが大切だと主張している。
    target_lang: ja
    note:
      vi: Tác giả chỉ công nhận tạm thời "phụ thuộc quá là vấn đề" (確かに), rồi phản bác bằng とはいえ. Chủ trương nằm ở câu つまり～なのである.
  - type: summary
    points:
      - vi: 依存する (～に) - phụ thuộc; 手放せない - không rời tay được; 一方的 - phiến diện, một chiều.
      - vi: 'Bài bình luận: hiện tượng → ý kiến người khác → 確かに (công nhận) → とはいえ (phản bác) → つまり～のである (chủ trương).'
      - vi: に違いない / 恐れがある - chắc chắn / nguy cơ; ざるを得ない / ずにはいられない / ないわけにはいかない - ba kiểu "phải".
      - vi: ものだ - lẽ thường; ことだ - lời khuyên; ものがある - cảm nhận.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-certainty-obligation-review-mcq-claim
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: ja:item:n2-u5-shuchou
    prompt:
      stem: "Đọc lại bài bình luận trong phần giải thích. Chủ trương của tác giả là gì?"
      stem_lang: vi
      options:
        - { id: a2c, text: Điều quan trọng là dùng điện thoại như thế nào., lang: vi }
        - { id: b5d, text: Nên hạn chế dùng điện thoại càng nhiều càng tốt., lang: vi }
        - { id: c8e, text: Điện thoại làm mất khả năng nói chuyện trực tiếp., lang: vi }
        - { id: d1f, text: Không thể làm việc nếu không có điện thoại., lang: vi }
    answer:
      correct_option_id: a2c
    explanation:
      vi: Câu cuối つまり～どう使うかなのである là chủ trương. "Mất khả năng nói chuyện" là ý kiến người khác (という声もある); "hạn chế dùng" gần với ý công nhận tạm thời 確かに.
    display_answer: Điều quan trọng là dùng điện thoại như thế nào.

  - key: ja:exercise:n2-certainty-obligation-review-mcq-koe
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u5-gram-osore-ga-aru
    prompt:
      stem: Câu 「人と直接話す力が弱まる恐れがあるという声もある。」 trong bài có vai trò gì?
      stem_lang: vi
      options:
        - { id: e4g, text: Giới thiệu một ý kiến của người khác về nguy cơ., lang: vi }
        - { id: f7h, text: Là kết luận cuối cùng của tác giả., lang: vi }
        - { id: g2i, text: Là số liệu khảo sát làm căn cứ., lang: vi }
        - { id: h9j, text: Là lời khuyên trực tiếp cho người đọc., lang: vi }
    answer:
      correct_option_id: e4g
    explanation:
      vi: ～という声もある - "cũng có tiếng nói cho rằng...", tức là ý kiến người khác. 恐れがある - có nguy cơ (điều xấu).
    display_answer: Giới thiệu một ý kiến của người khác về nguy cơ.

  - key: ja:exercise:n2-certainty-obligation-review-listen-tebanasu
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u5-tebanasu
    prompt:
      audio_asset_id: null
      fallback_text: 一日中スマホを手放せない人が増えている。
      options:
        - { id: i3k, text: Số người cả ngày không rời được điện thoại đang tăng., lang: vi }
        - { id: j6l, text: Số người bán điện thoại cũ đang tăng., lang: vi }
        - { id: k1m, text: Số người không dùng điện thoại cả ngày đang tăng., lang: vi }
        - { id: l8n, text: Số người làm mất điện thoại đang tăng., lang: vi }
    answer:
      correct_option_id: i3k
    explanation:
      vi: 手放せない - không thể rời tay (thể khả năng phủ định của 手放す). Bán đi cũng là nghĩa của 手放す, nhưng ở đây đi với 一日中 nên là "không rời tay".
    display_answer: Số người cả ngày không rời được điện thoại đang tăng.

  - key: ja:exercise:n2-certainty-obligation-review-fill-izon
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u5-izon
    prompt:
      template: "確かに、スマホ{{b1}}依存しすぎるのは問題だ。{{b2}}、今やスマホを使わざるを得ない場面が多い。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Đúng là phụ thuộc quá nhiều vào điện thoại là vấn đề. Tuy nói vậy, bây giờ có nhiều tình huống buộc phải dùng điện thoại."
        - "Gợi ý: 依存する đi với trợ từ gì? Từ nối nhượng bộ 4 kana."
    answer:
      blanks:
        b1: [に]
        b2: [とはいえ, とは言え, とは言っても, とはいっても, しかし, だが, でも]
    known_wrong:
      - answer: を
        feedback_vi: 依存する đi với に - スマホに依存する.
        error_tag: particle_ni
      - answer: つまり
        feedback_vi: Câu sau trái chiều với câu 確かに, cần từ nhượng bộ - とはいえ.
        error_tag: connector_choice
    explanation:
      vi: ～に依存する - phụ thuộc vào. 確かに A。とはいえ B - công nhận A rồi phản bác bằng B.
    display_answer: 確かに、スマホに依存しすぎるのは問題だ。とはいえ、今やスマホを使わざるを得ない場面が多い。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-certainty-obligation-review-fill-mix
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-zu-ni-irarenai
    prompt:
      template: "通知が来ると、つい{{b1}}ずにはいられない。人間とはそういう{{b2}}だ。(見る)"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 2 }
    answer:
      blanks:
        b1: [見, み]
        b2: [もの]
    known_wrong:
      - answer: 見ら
        feedback_vi: 見る là động từ nhóm 2 - thể ない 見ない, bỏ ない còn 見 + ずにはいられない.
        error_tag: zuni_form
      - answer: こと
        feedback_vi: Nói bản chất con người dùng ものだ; ことだ là lời khuyên.
        error_tag: mono_koto
    explanation:
      vi: 見る → 見ずにはいられない (không kìm được mà xem). そういうものだ - vốn là như thế (bản chất).
    display_answer: 通知が来ると、つい見ずにはいられない。人間とはそういうものだ。

