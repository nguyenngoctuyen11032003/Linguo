        - 私たちの生活は、どんどんスマホに依存するようになっている。
        - 我々の生活は、ますますスマホに依存するようになった。
        - 私たちの生活は、ますますスマホに依存するようになってきた。
        - 私たちの生活は、ますますスマホに依存しつつある。
