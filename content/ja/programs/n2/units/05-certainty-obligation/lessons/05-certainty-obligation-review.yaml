    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u5-gram-kotoda
    prompt:
      stem: 'Em họ bạn than ngủ không ngon vì xem điện thoại đến khuya. Bạn khuyên: "Muốn ngủ ngon thì tốt nhất là đừng xem điện thoại trước khi ngủ."'
      stem_lang: vi
