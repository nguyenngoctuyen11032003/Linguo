        - Không nên phiến diện mà khẳng định điện thoại là thứ xấu.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Nên cho rằng điện thoại là thứ xấu.
        feedback_vi: べきではない là "không nên". Câu có phủ định ở cuối.
