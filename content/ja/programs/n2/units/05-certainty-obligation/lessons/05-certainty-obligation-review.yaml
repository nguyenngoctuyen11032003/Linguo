        - Không nên đơn phương kết luận điện thoại là thứ xấu.
        - Không nên phiến diện kết luận điện thoại là thứ xấu.
        - Không nên một chiều cho rằng điện thoại là thứ xấu.
        - Không nên một mực cho rằng điện thoại là thứ xấu.
        - Không nên phiến diện quy kết điện thoại là thứ xấu.
        - Không nên phiến diện cho rằng điện thoại thông minh là thứ xấu.
        - Không nên một chiều kết luận điện thoại thông minh là thứ xấu.
