      stem: 'Đồng nghiệp hỏi sao bạn đi làm thứ Bảy. Bạn đáp: "Dự án sắp đến hạn nên đành phải đi làm." Câu nào tự nhiên nhất?'
      stem_lang: vi
      options:
        - { id: d2f, text: 締め切りが近いので、出勤せざるを得ないんです。, lang: ja }
        - { id: g6h, text: 締め切りが近いので、出勤せずにはいられないんです。, lang: ja }
        - { id: i1j, text: 締め切りが近いので、出勤するわけにはいかないんです。, lang: ja }
        - { id: k8l, text: 締め切りが近いので、出勤しざるを得ないんです。, lang: ja }
    answer:
      correct_option_id: d2f
    explanation:
      vi: Hạn chót là hoàn cảnh ép buộc - ざるを得ない, する → せざる. ずにはいられない là cảm xúc; 出勤するわけにはいかない là "không thể đi làm"; しざる sai chia.
    display_answer: 締め切りが近いので、出勤せざるを得ないんです。
