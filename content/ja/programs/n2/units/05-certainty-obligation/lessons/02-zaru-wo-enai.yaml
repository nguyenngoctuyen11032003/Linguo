    item: ja:item:n2-u5-gram-zaru-wo-enai
    prompt:
      template: "電車が止まったので、会社まで歩いて{{b1}}を得なかった。(行く)"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Tàu dừng chạy nên tôi đành phải đi bộ đến công ty."
        - "Gợi ý: 行く → thể ない 行かない → bỏ ない, thêm ざる."
    answer:
      blanks:
        b1: [行かざる, いかざる]
    known_wrong:
      - answer: 行くざる
        feedback_vi: ざる gắn vào thể ない đã bỏ ない - 行か + ざる.
        error_tag: zaru_form
      - answer: 行かない
        feedback_vi: Trước を得ない phải là dạng ざる - 行かざるを得ない.
        error_tag: zaru_form
    explanation:
      vi: 行かない → 行か + ざるを得ない. Thì quá khứ đặt ở cuối - 得なかった.
    display_answer: 電車が止まったので、会社まで歩いて行かざるを得なかった。

