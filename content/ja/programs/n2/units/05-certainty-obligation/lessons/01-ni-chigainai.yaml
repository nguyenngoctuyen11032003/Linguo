title:
  vi: Chắc chắn và nguy cơ - ～に違いない, ～に相違ない, ～恐れがある
objectives:
  - vi: Nói điều mình tin chắc bằng ～に違いない, nhận ra dạng văn viết ～に相違ない.
  - vi: Hiểu và dùng ～恐れがある để nói nguy cơ xấu trong tin tức, cảnh báo.
  - vi: Nối đúng danh từ, tính từ な với hai mẫu này (bỏ だ, thêm の).
estimated_minutes: 20
skills: [grammar, reading]
prerequisites: [ja:lesson:n2-news-society-review]
