  - key: ja:exercise:n2-u8-karaniwa-mcq-uewa
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-gram-ue-wa
    prompt:
      stem: 'Câu nào dùng 上 với nghĩa "một khi đã... thì (quyết tâm)"?'
      stem_lang: vi
      options:
        - { id: c7g, text: 社長に頼まれた上は、断るわけにはいかない。, lang: ja }
        - { id: g2k, text: よく考えた上で、お返事します。, lang: ja }
        - { id: k8o, text: 机の上は、本でいっぱいだ。, lang: ja }
        - { id: o3s, text: 内容をご確認の上、ご署名ください。, lang: ja }
    answer:
      correct_option_id: c7g
    explanation:
      vi: 頼まれた上は～わけにはいかない - đã được giám đốc nhờ thì không thể từ chối (quyết tâm, nghĩa vụ). 上で / の上 là "làm xong A rồi mới B"; 机の上 là "trên bàn".
    display_answer: 社長に頼まれた上は、断るわけにはいかない。

  - key: ja:exercise:n2-u8-karaniwa-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u8-gram-kara-niwa
    prompt:
      template: "マラソンに参加する{{b1}}、完走したい。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Đã tham gia marathon thì tôi muốn chạy hết chặng."
        - "Gợi ý: bốn chữ kana - \"một khi đã... thì\"."
    answer:
      blanks:
        b1: [からには]
    known_wrong:
      - answer: から
        feedback_vi: から chỉ nêu lý do; ý "đã... thì muốn/phải..." cần からには.
        error_tag: kara_karaniwa
      - answer: うえで
        feedback_vi: 上で là "làm A rồi mới B"; ở đây là quyết tâm sau khi đã quyết tham gia - からには.
        error_tag: ue_de_karaniwa
    explanation:
      vi: 参加するからには、完走したい - đã tham gia thì muốn chạy hết. Vế sau là mong muốn (～たい) nên hợp với からには.
    display_answer: マラソンに参加するからには、完走したい。

  - key: ja:exercise:n2-u8-karaniwa-wb-chousen
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u8-chousen
    prompt:
      instruction: "Sắp xếp thành câu: \"Năm nay tôi muốn thử sức với kỳ thi N1.\""
      tokens:
        - { id: c3, text: 挑戦したい }
        - { id: c1, text: 今年は }
        - { id: c4, text: 挑戦をしたいに }
        - { id: c2, text: N1の試験に }
    answer:
      orders:
        - [c1, c2, c3]
        - [c2, c1, c3]
    explanation:
      vi: N に挑戦する - thử sức với N (trợ từ に). 今年は có thể đứng đầu hoặc sau N1の試験に. 挑戦をしたいに sai ngữ pháp.
    display_answer: 今年はN1の試験に挑戦したい。

  # ---------------- recall ----------------
  - key: ja:exercise:n2-u8-karaniwa-fill-dearu
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-gram-ijou-wa
    prompt:
      template: "プロ{{b1}}以上、言い訳は許されない。(là - văn viết)"
      blanks:
