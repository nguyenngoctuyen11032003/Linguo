body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "đã nhận lời thì phải làm đến cùng", "đã là sinh viên thì phải học", "đến nước này thì chỉ còn cách cố" - ba mức trang trọng của cùng một ý quyết tâm.
  - type: explain
    text:
      vi: 'Thể thường + からには - "một khi đã... thì (nhất định)...". Vế trước là việc đã quyết hoặc đã thành sự thật; vế sau là ý chí, nghĩa vụ, lời khuyên: 試合に出るからには、優勝を目指す. Danh từ dùng である: 学生であるからには.'
  - type: explain
    text:
      vi: 'Thể thường + 以上(は) - cùng nghĩa nhưng khách quan, trang trọng hơn, hay gặp trong quy định, phát biểu: 約束した以上は、守るべきだ. V-る / V-た + 上は - dạng văn viết cứng nhất: こうなった上は、覚悟を決めるしかない.'
  - type: explain
    text:
      vi: 'Vế sau của cả ba mẫu không thể là mô tả sự thật bình thường. Nó phải là ～たい, ～つもりだ, ～べきだ, ～なければならない, ～しかない, ～てください... Tiếng Việt "đã... thì phải..." giúp bạn kiểm tra: nếu không thêm được "phải / nên / muốn" thì đừng dùng.'
  - type: deep_explain
    text:
      vi: '上は (một khi đã) khác 上で (unit 6 - làm A rồi mới B). Mẹo: 上は = "đến nước này thì..." (quyết tâm); 上で = "sau khi... (rồi mới)" (thứ tự). 以上 còn nghĩa "trở lên" (二十歳以上) và "hết" (以上です) - chỉ khi đứng sau một mệnh đề mới là "đã... thì".'
  - type: example
    target: リーダーを引き受けたからには、責任を持ってチームをまとめたい。
    target_lang: ja
    translation:
      vi: Một khi đã nhận làm trưởng nhóm thì tôi muốn có trách nhiệm gắn kết cả đội.
  - type: example
    target: 自分で選んだ道である以上、簡単には諦められない。
    target_lang: ja
    translation:
      vi: Đã là con đường tự mình chọn thì không thể dễ dàng bỏ cuộc.
    note:
      vi: Danh từ + である + 以上.
  - type: example
    target: 会社が倒産した上は、新しい仕事を探すしかない。
    target_lang: ja
    translation:
      vi: Một khi công ty đã phá sản thì chỉ còn cách tìm việc mới.
  - type: example
    target: 難しい挑戦だが、やると決めたからには覚悟はできている。
    target_lang: ja
    translation:
      vi: Thử thách khó, nhưng đã quyết làm thì tôi đã chuẩn bị tinh thần.
  - type: common_mistake
    wrong: 日本に来たからには、毎日雨が降っています。
    right: 日本に来たからには、日本の文化をたくさん学びたいです。
    target_lang: ja
    note:
      vi: Vế sau của からには phải là ý chí, nghĩa vụ của người nói, không phải mô tả sự việc như thời tiết.
  - type: common_mistake
    wrong: 学生からには、しっかり勉強しなさい。
    right: 学生であるからには、しっかり勉強しなさい。
    target_lang: ja
    note:
      vi: Danh từ không nối thẳng với からには - cần である (学生であるからには).
  - type: summary
    points:
      - vi: Thể thường + からには - một khi đã... thì phải (ý chí, nghĩa vụ).
      - vi: Thể thường + 以上(は) - đã... thì (trang trọng, khách quan).
      - vi: V-る / V-た + 上は - một khi đã (văn viết); khác 上で (làm A rồi mới B).
      - vi: Danh từ cần である trước からには / 以上.
      - vi: 覚悟 - chuẩn bị tinh thần; 挑戦 - thử thách, thử sức.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u8-karaniwa-mcq-meaning
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u8-gram-kara-niwa
    prompt:
      stem: 'Câu 高いお金を払ったからには、最後まで通うつもりだ。 nghĩa là gì?'
      stem_lang: vi
      options:
        - { id: a5d, text: Đã trả nhiều tiền thì tôi định đi học đến cùng., lang: vi }
        - { id: e1h, text: Vì trả nhiều tiền nên tôi định nghỉ học giữa chừng., lang: vi }
        - { id: i6l, text: Dù đã trả nhiều tiền nhưng tôi không định đi học., lang: vi }
        - { id: m2p, text: Tôi đi học đến cùng rồi mới trả tiền., lang: vi }
    answer:
      correct_option_id: a5d
    explanation:
      vi: 払ったからには - một khi đã trả; 最後まで通うつもりだ - định đi học đến cùng (ý chí). からには nối việc đã xảy ra với quyết tâm.
    display_answer: Đã trả nhiều tiền thì tôi định đi học đến cùng.

  - key: ja:exercise:n2-u8-karaniwa-listen-ijou
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u8-gram-ijou-wa
    prompt:
      audio_asset_id: null
      fallback_text: ルールを決めた以上は、全員が守らなければなりません。
      options:
        - { id: b3f, text: Đã đặt ra quy tắc thì mọi người đều phải tuân thủ., lang: vi }
        - { id: f8j, text: Quy tắc trở lên thì không ai phải tuân thủ., lang: vi }
        - { id: j4n, text: Mọi người phải tuân thủ rồi mới đặt ra quy tắc., lang: vi }
        - { id: n9r, text: Quy tắc đã định thì chỉ một vài người phải giữ., lang: vi }
    answer:
      correct_option_id: b3f
    explanation:
      vi: 決めた以上は - đã quyết định thì...; 全員が守らなければなりません - mọi người phải tuân thủ. 以上 sau mệnh đề là "đã... thì", không phải "trở lên".
