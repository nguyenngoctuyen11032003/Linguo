title:
  vi: Một khi đã... thì phải - ～からには, ～以上(は), ～上は
objectives:
  - vi: Nói quyết tâm, nghĩa vụ sau một quyết định bằng ～からには.
  - vi: Dùng ～以上(は) trong lời nói trang trọng về trách nhiệm.
  - vi: Nhận ra ～上は trong văn viết và phân biệt với ～上で.
estimated_minutes: 20
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-possibility-judgement-review]
