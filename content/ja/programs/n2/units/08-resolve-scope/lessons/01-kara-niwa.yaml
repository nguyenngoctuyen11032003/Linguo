    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-kakugo
    prompt:
      source_text: Đã quyết định mở cửa hàng thì tôi đã chuẩn bị tinh thần cho mọi khó khăn. (dùng からには và 覚悟)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
