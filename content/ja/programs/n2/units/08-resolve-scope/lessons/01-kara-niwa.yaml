        - 店を開くと決めたからには、どんな苦労も覚悟しています。
        - 店を開くと決めたからには、どんな苦労も覚悟の上だ。
        - 店を開くと決めたからには、どんな困難も覚悟している。
        - 店を開くことにしたからには、どんな苦労も覚悟している。
        - お店を開くと決めたからには、どんな苦労も覚悟している。
        - 店を出すと決めたからには、どんな苦労も覚悟している。
        - 店を開くと決めたからには、どんな苦労でも覚悟している。
        - 店を開くと決めたからには、あらゆる苦労を覚悟している。
        - みせをひらくときめたからには、どんなくろうもかくごしている。
    known_wrong:
      - answer: 店を開くと決めたから、どんな苦労も覚悟している。
        feedback_vi: から chỉ là "vì"; ý "đã quyết thì..." mạnh hơn cần からには.
        error_tag: kara_karaniwa
      - answer: 店を開くと決めた上で、どんな苦労も覚悟している。
        feedback_vi: 上で là "làm A rồi mới B"; quyết tâm sau quyết định dùng からには (hoặc 上は).
        error_tag: ue_de_karaniwa
