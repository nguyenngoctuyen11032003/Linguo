        - Một khi đã được chọn làm đại diện thì không thể phụ lòng mong đợi của mọi người.
        - Đã được chọn làm đại diện rồi thì không thể làm mọi người thất vọng.
        - Đã được bầu làm đại diện thì không thể phản bội kỳ vọng của mọi người.
        - Một khi được chọn làm đại diện thì tôi không thể phụ lòng kỳ vọng của mọi người.
