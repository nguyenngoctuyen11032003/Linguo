      vi: 決めたからには - đã quyết thì; どんな苦労も覚悟している - đã sẵn sàng đón nhận mọi vất vả. 覚悟の上だ cũng là cách nói tự nhiên "đã lường trước".
    display_answer: 店を開くと決めたからには、どんな苦労も覚悟している。

  - key: ja:exercise:n2-u8-karaniwa-write-ijou
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-gram-ijou-wa
    prompt:
      source_text: Đã ký hợp đồng thì phải giữ đúng thời hạn. (dùng 以上は)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 契約した以上は、期限を守らなければならない。
        - 契約した以上は、期限を守らなければなりません。
        - 契約を結んだ以上は、期限を守らなければならない。
        - 契約した以上は、期限を守るべきだ。
        - 契約した以上は、締め切りを守らなければならない。
        - 契約した以上は、納期を守らなければならない。
        - 契約した以上は、期限を守らないといけない。
        - 契約した以上は、必ず期限を守らなければならない。
        - けいやくしたいじょうは、きげんをまもらなければならない。
    known_wrong:
      - answer: 契約した以上は、期限を守った。
        feedback_vi: Vế sau của 以上は phải là nghĩa vụ, ý chí - 守らなければならない, không phải sự việc đã xảy ra.
        error_tag: ijou_consequent
      - answer: 契約する以上で、期限を守らなければならない。
        feedback_vi: Không có 以上で; dùng 契約した以上は.
        error_tag: ijou_form
    explanation:
      vi: 契約した以上は - đã ký hợp đồng thì...; 期限を守る - giữ đúng thời hạn; ～なければならない - phải. Lời nói về trách nhiệm hay dùng 以上は.
    display_answer: 契約した以上は、期限を守らなければならない。

