        - Chính vì là tuyển thủ được kỳ vọng nhiều nên việc thua ngay trận đầu càng thành tin nóng.
        - Vì là vận động viên được kỳ vọng nên việc bị loại từ trận đầu càng trở thành tin lớn.
        - Chính vì là vận động viên được mong đợi nên việc thua ở trận đầu tiên đã thành tin tức lớn.
        - Chính bởi là tuyển thủ được kỳ vọng, việc bị loại ngay trận mở màn đã trở thành tin lớn.
        - Đã là vận động viên được kỳ vọng nên việc bị loại ngay trận đầu càng trở thành tin lớn.
