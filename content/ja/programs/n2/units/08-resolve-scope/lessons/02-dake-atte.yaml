      options:
        - { id: q4b, text: "Quả không hổ là ngày nào cũng tập, cô ấy chơi piano giỏi.", lang: vi }
        - { id: u9f, text: Ngày nào cũng tập nhưng cô ấy chơi piano chưa giỏi., lang: vi }
        - { id: y5j, text: Cô ấy chỉ tập piano mỗi ngày thôi., lang: vi }
        - { id: c1n, text: Vì chơi piano giỏi nên cô ấy không cần tập mỗi ngày., lang: vi }
