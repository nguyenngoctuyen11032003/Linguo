key: ja:lesson:n2-u8-dake-atte
order_index: 2
level: n2
title:
  vi: Quả không hổ danh, chính vì vậy càng - ～だけあって, ～だけのことはある, ～だけに
objectives:
  - vi: Khen "quả không hổ là..." bằng ～だけあって / ～だけのことはある.
  - vi: Nói "chính vì... nên càng..." bằng ～だけに, cả nghĩa tốt lẫn xấu.
  - vi: Không nhầm だけあって / だけに với だけ (chỉ).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-u8-kara-niwa]
items:
  - item: ja:item:n2-u8-gram-dake-atte
  - item: ja:item:n2-u8-gram-dake-ni
