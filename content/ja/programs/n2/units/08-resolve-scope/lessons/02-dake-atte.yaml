  - item: ja:item:n2-u8-ichiryuu
body:
  - type: objective
    text:
      vi: Sau bài này, bạn khen tự nhiên kiểu người Nhật - "quả không hổ là khách sạn hạng sang, phục vụ tuyệt vời" - và nói được "chính vì kỳ vọng nên càng thất vọng".
  - type: explain
    text:
      vi: 'Thể thường (なAな / N) + だけあって - "quả không hổ là..., đúng là... có khác". Kết quả xứng với danh tiếng, nỗ lực, giá tiền: 一流ホテルだけあって、サービスが素晴らしい. Hay đi với さすが.'
  - type: explain
    text:
      vi: 'Đặt cuối câu: ～だけのことはある - "thật xứng đáng với...": この味なら、行列ができるだけのことはある (vị thế này thì người ta xếp hàng là phải).'
  - type: explain
    text:
      vi: 'Thể thường + だけに - "chính vì..., nên càng...". Lý do khiến cảm xúc, kết quả mạnh hơn bình thường; dùng được cả chiều xấu: 楽しみにしていただけに、中止は残念だ (chính vì háo hức nên huỷ càng tiếc).'
  - type: deep_explain
    text:
      vi: 'だけあって chỉ dùng để khen, đánh giá tích cực. だけに là "càng", hai chiều - người Việt hay dùng だけあって cho chuyện xấu là sai. Còn だけ đứng một mình chỉ là "chỉ" - 一つだけ (chỉ một cái).'
  - type: example
    target: さすがプロの料理人だけあって、包丁の使い方が違う。
    target_lang: ja
    translation:
      vi: Quả không hổ là đầu bếp chuyên nghiệp, cách dùng dao khác hẳn.
  - type: example
    target: 評判の店だけあって、平日でも満席だった。
    target_lang: ja
    translation:
      vi: Đúng là quán nổi tiếng có khác, ngày thường mà vẫn kín chỗ.
  - type: example
    target: この景色を見れば、遠くから来ただけのことはある。
    target_lang: ja
    translation:
      vi: Ngắm cảnh này thì việc đi từ xa đến thật xứng đáng.
  - type: example
    target: 長い間準備してきただけに、失敗したショックは大きかった。
    target_lang: ja
    translation:
      vi: Chính vì đã chuẩn bị suốt thời gian dài nên cú sốc thất bại càng lớn.
  - type: common_mistake
    wrong: 高いホテルだけあって、サービスがひどかった。
    right: 高いホテルなのに、サービスがひどかった。
    target_lang: ja
    note:
      vi: だけあって chỉ dùng để khen kết quả xứng đáng. Kết quả trái với kỳ vọng dùng のに / わりに.
  - type: common_mistake
    wrong: 有名だだけあって、観光客が多い。
    right: 有名なだけあって、観光客が多い。
    target_lang: ja
    note:
      vi: Tính từ な giữ な trước だけ - 有名なだけあって.
  - type: summary
    points:
      - vi: ～だけあって / だけのことはある - quả không hổ là (khen).
      - vi: ～だけに - chính vì... nên càng (tốt hoặc xấu).
      - vi: なA + な / N + (trực tiếp) + だけあって, だけに.
      - vi: 評判 - tiếng tăm, đánh giá; 一流 - hạng nhất.
