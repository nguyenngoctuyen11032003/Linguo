        feedback_vi: 敗退 là "thua, bị loại", không phải "thắng".
        error_tag: meaning
    explanation:
      vi: 期待されていた選手 - vận động viên được kỳ vọng; だっただけに - chính vì là...; 初戦での敗退 - bị loại ở trận đầu.
    display_answer: Chính vì là vận động viên được kỳ vọng nên việc bị loại ngay trận đầu đã trở thành tin lớn.

