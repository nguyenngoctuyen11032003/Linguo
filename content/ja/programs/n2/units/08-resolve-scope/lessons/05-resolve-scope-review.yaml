body:
  - type: objective
    text:
      vi: 'Bài ôn tập là một phóng sự: chị Sato, nhân viên văn phòng, tập chạy suốt năm năm, đăng ký giải marathon quốc tế và về đích ở vị trí đáng nể. Cả bốn nhóm mẫu của unit đều xuất hiện trong vài đoạn ngắn.'
  - type: explain
    text:
      vi: 'Ba nhóm cần phân biệt: quyết tâm (からには / 以上 / 上は - vế sau là ý chí, nghĩa vụ), đánh giá (だけあって khen; だけに "càng"; はともかく gác lại), phạm vi (にわたって quy mô lớn; から～にかけて khoảng mờ).'
  - type: explain
    text:
      vi: 'Ba từ mới: 選手 (vận động viên), 期待 (kỳ vọng - 期待に応える: đáp ứng kỳ vọng), 応募 (ứng tuyển, đăng ký dự thi - ～に応募する).'
  - type: deep_explain
    text:
      vi: 'Phóng sự Nhật thường mở đầu bằng thời gian, quy mô (五年にわたる練習), rồi trích lời nhân vật thể hiện quyết tâm (出るからには…), và kết bằng đánh giá (さすが…だけあって). Nhận ra khung này giúp bạn đọc nhanh bài đọc dài trong đề N2.'
  - type: example
    target: 佐藤さんは五年にわたって、毎朝欠かさず走り続けてきた。
    target_lang: ja
    translation:
      vi: Suốt năm năm, chị Sato đã chạy đều đặn mỗi sáng không bỏ buổi nào.
  - type: example
    target: 国際マラソン大会に応募したところ、見事に出場が決まった。
    target_lang: ja
    translation:
      vi: Chị đăng ký giải marathon quốc tế và đã được chọn tham gia một cách xuất sắc.
  - type: example
    target: 毎日練習してきただけあって、彼女は三位という好成績を残した。
    target_lang: ja
    translation:
      vi: Quả không hổ là ngày nào cũng tập, chị ấy đạt thành tích tốt - hạng ba.
  - type: example
    target: 家族の期待が大きかっただけに、ゴールの瞬間は涙が止まらなかった。
    target_lang: ja
    translation:
      vi: Chính vì kỳ vọng của gia đình rất lớn nên khoảnh khắc về đích, nước mắt chị không ngừng rơi.
  - type: common_mistake
    wrong: 大会にエントリーを応募した。
    right: 大会に応募した。
    target_lang: ja
    note:
      vi: 応募する đã là "đăng ký dự thi"; nơi đăng ký đi với に. Thêm エントリーを là thừa.
  - type: common_mistake
    wrong: 選手たちは期待を応えた。
    right: 選手たちは期待に応えた。
    target_lang: ja
    note:
      vi: '"Đáp ứng kỳ vọng" là 期待に応える - trợ từ に, không phải を.'
  - type: summary
    points:
      - vi: 'からには / 以上 / 上は - đã... thì phải (vế sau: ý chí, nghĩa vụ).'
      - vi: だけあって - quả không hổ là; だけに - chính vì... nên càng.
      - vi: はともかく - chưa bàn đến; にわたって - suốt; から～にかけて - khoảng từ... đến.
      - vi: 選手 - vận động viên; 期待に応える - đáp ứng kỳ vọng; 応募する - đăng ký dự thi.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:n2-u8-review-listen-oubo
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n2-u8-oubo
    prompt:
      audio_asset_id: null
      fallback_text: このボランティアには、十八歳以上なら誰でも応募できます。
      options:
        - { id: a6g, text: Ai từ 18 tuổi trở lên cũng có thể đăng ký làm tình nguyện viên này., lang: vi }
        - { id: e2k, text: Chỉ người dưới 18 tuổi mới được đăng ký tình nguyện., lang: vi }
        - { id: i7o, text: Công việc tình nguyện này đã hết hạn đăng ký., lang: vi }
        - { id: m3s, text: Một khi đã 18 tuổi thì bắt buộc phải làm tình nguyện., lang: vi }
    answer:
