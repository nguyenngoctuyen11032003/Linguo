title:
  vi: Ôn tập - phóng sự về một vận động viên marathon địa phương
objectives:
  - vi: Đọc hiểu một bài phóng sự thể thao dùng からには, だけあって, はともかく, にわたって.
  - vi: Chọn đúng からには / 以上 / 上は, だけあって / だけに, にわたって / にかけて theo ngữ cảnh.
  - vi: Kể về quyết tâm và đánh giá thành tích một cách tự nhiên.
estimated_minutes: 22
skills: [reading, grammar, writing]
prerequisites: [ja:lesson:n2-u8-ni-watatte]
