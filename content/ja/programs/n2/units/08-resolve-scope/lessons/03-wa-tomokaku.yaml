    role: reuse
body:
  - type: objective
    text:
      vi: Sau bài này, bạn đánh giá được kiểu "vẻ ngoài thì chưa nói, nhưng vị rất ngon" và điều khiển cuộc họp "chuyện đùa tạm gác lại, vào việc chính nhé".
  - type: explain
    text:
      vi: 'N + はともかく(として) - "N thì chưa bàn, (nhưng)...". Người nói tạm không đánh giá N để nhấn vế sau quan trọng hơn: 値段はともかく、品質はいい (giá thì chưa nói, nhưng chất lượng tốt).'
  - type: explain
    text:
      vi: 'N + はさておき - "tạm gác N lại" - chủ động bỏ qua một chuyện để chuyển sang việc chính, rất hay dùng khi dẫn họp, phát biểu: 前置きはさておき、本題に入ります.'
  - type: explain
    text:
      vi: 'Đừng nhầm với はもちろん (unit 2): はもちろん là "N thì đương nhiên rồi, và cả..." - cộng thêm; はともかく là "N thì gác lại" - không cộng mà loại ra. Tiếng Việt "chưa kể" dễ gây nhầm hai mẫu này.'
  - type: deep_explain
    text:
      vi: 'Dạng nghi vấn: ～かどうかはともかく (có... hay không thì chưa bàn): 合格できるかどうかはともかく、最後まで頑張りたい. Câu này rất tự nhiên khi bạn muốn tách kết quả ra khỏi nỗ lực.'
  - type: example
    target: 見た目はともかく、このパンは本当においしい。
    target_lang: ja
    translation:
      vi: Vẻ ngoài thì chưa nói, nhưng bánh mì này thật sự rất ngon.
  - type: example
    target: 他の人はともかくとして、私は彼の意見に賛成だ。
    target_lang: ja
    translation:
      vi: Người khác thì không bàn, còn tôi tán thành ý kiến của anh ấy.
  - type: example
    target: 冗談はさておき、来月の予定を確認しましょう。
    target_lang: ja
    translation:
      vi: Đùa thế đủ rồi, hãy xác nhận lịch tháng sau nhé.
  - type: example
    target: 勝てるかどうかはともかく、全力を出すことが大切だ。
    target_lang: ja
    translation:
      vi: Thắng được hay không thì chưa bàn, điều quan trọng là dốc hết sức.
  - type: common_mistake
    wrong: 子どもはともかく、大人も楽しめる映画です。
    right: 子どもはもちろん、大人も楽しめる映画です。
    target_lang: ja
    note:
      vi: Ý "trẻ em đương nhiên rồi, cả người lớn cũng..." là cộng thêm - dùng はもちろん. はともかく là gác trẻ em sang một bên, sai ý.
  - type: common_mistake
    wrong: 味がともかく、値段が高すぎる。
    right: 味はともかく、値段が高すぎる。
    target_lang: ja
    note:
      vi: Mẫu cố định là N + は + ともかく; không dùng が.
  - type: summary
    points:
      - vi: N はともかく(として) - N thì chưa bàn, (nhưng)...
      - vi: N はさておき - tạm gác N, chuyển sang việc chính.
      - vi: ～かどうかはともかく - có... hay không thì chưa bàn.
      - vi: はもちろん - cộng thêm; はともかく - gác lại.
      - vi: 見た目 - vẻ ngoài.
