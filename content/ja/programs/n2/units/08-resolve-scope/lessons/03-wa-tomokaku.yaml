key: ja:lesson:n2-u8-wa-tomokaku
order_index: 3
level: n2
title:
  vi: Chưa bàn đến..., tạm gác lại - ～はともかく(として), ～はさておき
objectives:
  - vi: Gác một mặt sang bên để nói điều quan trọng hơn bằng ～はともかく.
  - vi: Chuyển sang chủ đề chính bằng ～はさておき.
  - vi: Phân biệt はともかく (gác lại) với はもちろん (đương nhiên, cộng thêm).
estimated_minutes: 18
skills: [grammar, speaking]
prerequisites: [ja:lesson:n2-u8-dake-atte]
items:
  - item: ja:item:n2-u8-gram-wa-tomokaku
  - item: ja:item:n2-u8-gram-wa-sateoki
