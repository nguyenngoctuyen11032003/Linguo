  - key: ja:exercise:n2-u8-tomokaku-wb-tomokaku
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-gram-wa-tomokaku
    prompt:
      instruction: "Sắp xếp thành câu: \"Người khác nghĩ sao thì không bàn, tôi muốn làm điều mình thích.\""
      tokens:
        - { id: k4, text: 好きなことをしたい }
        - { id: k2, text: 他人がどう思うかは }
        - { id: k5, text: さておく、 }
        - { id: k1, text: ともかく、 }
        - { id: k3, text: 私は }
    answer:
      orders:
        - [k2, k1, k3, k4]
        - [k3, k2, k1, k4]
    explanation:
      vi: 疑問詞 + か + はともかく - (ai nghĩ thế nào) thì chưa bàn. 私は có thể đứng đầu câu. さておく là thể từ điển, không nối câu được - phải là さておき.
    display_answer: 他人がどう思うかはともかく、私は好きなことをしたい。
