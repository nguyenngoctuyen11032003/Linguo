  - key: ja:exercise:n2-u8-watatte-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n2-u8-gram-ni-watatte
    prompt:
      template: "会議は三日間{{b1}}開かれ、多くの意見が出された。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - "Nghĩa: Hội nghị được tổ chức suốt ba ngày, nhiều ý kiến đã được đưa ra."
        - "Gợi ý: mẫu \"suốt (quy mô lớn)\" - dạng văn viết bốn chữ kana, hoặc dạng て."
    answer:
      blanks:
        b1: [にわたり, にわたって]
    known_wrong:
      - answer: にかけて
        feedback_vi: にかけて đi theo cặp から～にかけて; nói "suốt ba ngày" dùng にわたって.
        error_tag: watatte_kakete
      - answer: にわたる
        feedback_vi: にわたる chỉ đứng trước danh từ; trước động từ 開かれ dùng にわたり / にわたって.
        error_tag: noun_modifier_form
    explanation:
      vi: 三日間にわたり / にわたって - suốt ba ngày. にわたり là dạng văn viết.
    display_answer: 会議は三日間にわたり開かれ、多くの意見が出された。

