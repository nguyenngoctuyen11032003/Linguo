body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu thông báo, dự báo thời tiết kiểu "thi công kéo dài suốt ba tháng", "từ tối nay đến sáng mai có mưa lớn ở khu vực..." - hai mẫu xuất hiện dày đặc trong tin tức.
  - type: explain
    text:
      vi: 'N + にわたって - "suốt (cả)..., trải khắp...". N là một khoảng thời gian, không gian hoặc số lần lớn: 二年にわたって, 全国にわたって, 十回にわたって. Trước danh từ: にわたる - 長期にわたる工事.'
  - type: explain
    text:
      vi: 'N1 から N2 にかけて - "khoảng từ N1 đến N2", ranh giới không rõ ràng: 今夜から明日の朝にかけて雨が降る. Dự báo thời tiết, thông báo giao thông dùng mẫu này rất nhiều.'
  - type: explain
    text:
      vi: 'から～まで (N5) là mốc chính xác: 9時から5時まで. から～にかけて là khoảng ước chừng: 夕方から夜にかけて. Không dùng にかけて cho giờ chính xác (×9時から5時にかけて営業).'
  - type: deep_explain
    text:
      vi: 'にわたって luôn nhấn "quy mô lớn, kéo dài", nên không dùng cho khoảng ngắn bình thường (×五分にわたって). Văn viết hay dùng にわたり: 三日間にわたり開催された. Tiếng Việt "suốt", "trải dài" là sát nghĩa nhất.'
  - type: example
    target: 祖父は四十年にわたって、この町で医者を続けた。
    target_lang: ja
    translation:
      vi: Ông tôi đã làm bác sĩ ở thị trấn này suốt bốn mươi năm.
  - type: example
    target: 駅前では、半年にわたる道路工事が始まった。
    target_lang: ja
    translation:
      vi: Ở trước nhà ga, công trình làm đường kéo dài nửa năm đã bắt đầu.
    note:
      vi: にわたる + danh từ (工事).
  - type: example
    target: 今夜から明日の朝にかけて、強い風が吹くでしょう。
    target_lang: ja
    translation:
      vi: Từ tối nay đến sáng mai, có lẽ sẽ có gió mạnh.
  - type: example
    target: この地域では、六月から七月にかけて雨が多い。
    target_lang: ja
    translation:
      vi: Ở khu vực này, khoảng từ tháng Sáu đến tháng Bảy mưa nhiều.
  - type: common_mistake
    wrong: 授業は五分にわたって休憩した。
    right: 授業の途中で五分休憩した。
    target_lang: ja
    note:
      vi: にわたって dành cho khoảng thời gian, phạm vi lớn. Năm phút nghỉ là chuyện nhỏ, nói bình thường là đủ.
  - type: common_mistake
    wrong: 銀行は午前9時から午後3時にかけて開いています。
    right: 銀行は午前9時から午後3時まで開いています。
    target_lang: ja
    note:
      vi: Giờ mở cửa là mốc chính xác - dùng から～まで. から～にかけて chỉ khoảng ước chừng, ranh giới mờ.
  - type: summary
    points:
      - vi: N + にわたって / にわたる N - suốt, trải khắp (quy mô lớn).
      - vi: N1 から N2 にかけて - khoảng từ... đến... (ranh giới mờ).
      - vi: から～まで - mốc chính xác.
      - vi: 地域 - khu vực; 工事 - thi công.
