key: ja:lesson:n2-u8-ni-watatte
order_index: 4
level: n2
title:
  vi: Suốt, trải khắp, khoảng từ... đến - ～にわたって, ～から～にかけて
objectives:
  - vi: Nhấn quy mô lớn của thời gian, phạm vi bằng ～にわたって / にわたる.
  - vi: Nói phạm vi "khoảng từ... đến..." bằng ～から～にかけて.
  - vi: Phân biệt から～にかけて (ranh giới mờ) với から～まで (mốc rõ).
estimated_minutes: 18
skills: [grammar, reading]
prerequisites: [ja:lesson:n2-u8-wa-tomokaku]
