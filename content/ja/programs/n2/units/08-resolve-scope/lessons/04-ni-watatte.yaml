  - key: ja:exercise:n2-u8-watatte-wb-wataru
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u8-gram-ni-watatte
    prompt:
      instruction: "Sắp xếp thành câu: \"Sau cuộc điều tra kéo dài nhiều năm, nguyên nhân đã được làm rõ.\""
      tokens:
        - { id: w4, text: 原因が明らかになった }
        - { id: w2, text: 調査の結果、 }
        - { id: w5, text: 長年にかけての }
        - { id: w1, text: 長年にわたる }
