    explanation:
      vi: 長年にわたる調査 - cuộc điều tra kéo dài nhiều năm (にわたる + danh từ). 長年にかけて sai vì thiếu cặp から.
    display_answer: 長年にわたる調査の結果、原因が明らかになった。
