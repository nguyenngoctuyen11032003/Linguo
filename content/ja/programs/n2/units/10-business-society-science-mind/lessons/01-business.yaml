      stem: Bạn mua cổ phiếu và có lãi. Cụm nào đúng?
      stem_lang: vi
      options:
        - id: mjh
          text: 株を交渉して、利益を出しました
          lang: ja
        - id: a5j
          text: 株を貿易して、利益を出しました
          lang: ja
        - id: yxx
          text: 株を買って、利益を出しました
          lang: ja
        - id: kzk
          text: 株を倒産して、利益を出しました
          lang: ja
    answer:
