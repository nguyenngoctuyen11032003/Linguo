  - key: ja:exercise:n2-u10-science-c4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 4
    item: ja:item:n2-u10-bunseki
    prompt:
      template: データを{{b1}}します。 (Tôi phân tích dữ liệu.)
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Chia nhỏ dữ liệu để hiểu.
