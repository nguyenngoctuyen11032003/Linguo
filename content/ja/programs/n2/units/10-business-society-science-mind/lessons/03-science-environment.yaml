      stem_lang: vi
      options:
        - id: gm9
          text: 太陽光で発電します。
          lang: ja
        - id: ewb
          text: 太陽光が発電します。
          lang: ja
        - id: k27
          text: 太陽光に発電します。
          lang: ja
        - id: oun
          text: 太陽光を発電します。
          lang: ja
    answer:
      correct_option_id: gm9
    explanation:
      vi: 太陽光で発電する - phát điện bằng ánh sáng mặt trời. を, に, が không đúng ở đây.
    display_answer: 太陽光で発電します。
