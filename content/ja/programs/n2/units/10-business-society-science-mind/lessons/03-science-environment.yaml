    difficulty: 5
    item: ja:item:n2-u10-osen
    prompt:
      source_text: Ô nhiễm không khí rất nghiêm trọng.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 大気汚染が深刻です。
        - 大気汚染は深刻です。
        - たいきおせんがしんこくです。
        - 大気汚染が深刻な問題です。
