      options:
        - id: uf1
          text: Hãy săn các động vật quý hiếm.
          lang: vi
        - id: d1g
          text: Hãy nuôi nhiều động vật ở nhà.
          lang: vi
        - id: umb
          text: Các động vật đã tuyệt chủng sẽ quay lại.
