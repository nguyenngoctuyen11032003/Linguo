  - key: ja:exercise:n2-u9-uru-kaneru-u6
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 5
    item: ja:item:n2-u9-gram-kaneru
    prompt:
      template: 私一人では決め{{b1}}ています。 (Một mình tôi khó mà quyết định.)
