      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Họp xong thì hãy quay lại chỗ ngồi ngay.
        - Khi cuộc họp kết thúc, xin hãy quay về chỗ ngay.
        - Sau khi họp xong, hãy trở lại chỗ ngồi liền nhé.
    rubric:
