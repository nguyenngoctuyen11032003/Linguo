    known_wrong:
      - answer: Hãy ra ngoài ngay khi họp xong.
        feedback_vi: 席に戻る là quay lại chỗ ngồi.
        error_tag: meaning
    explanation:
      vi: 終わったら - khi xong; すぐ - ngay; 席に戻る - quay lại chỗ.
    display_answer: Họp xong thì hãy quay lại chỗ ngồi ngay.
