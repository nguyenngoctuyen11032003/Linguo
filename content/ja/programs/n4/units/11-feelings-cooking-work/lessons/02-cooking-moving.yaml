title:
  vi: Nấu ăn và di chuyển - 沸かす・炒める・包む・戻る・訪ねる
objectives:
  - vi: Dùng 沸かす, 炒める, 包む trong ngữ cảnh nấu ăn, gói quà.
  - vi: Dùng 戻る, 訪ねる, 迎える cho di chuyển và thăm hỏi.
  - vi: Phân biệt 戻る / 帰る / 返す.
estimated_minutes: 15
skills:
  - vocabulary
  - reading
  - speaking
  - listening
