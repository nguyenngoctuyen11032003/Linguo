    display_answer: 先生は遅刻した学生に怒りました。
  - key: ja:exercise:n4-feelings-states-a7
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-u11-nureru
    prompt:
