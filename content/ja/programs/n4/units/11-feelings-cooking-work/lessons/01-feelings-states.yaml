          - t2
          - t3
        - - t2
          - t1
          - t3
    explanation:
      vi: Chủ ngữ (が) → まだ → 乾いていません.
    display_answer: 洗濯物がまだ乾いていません。
  - key: ja:exercise:n4-feelings-states-a11
