          lang: ja
        - id: q4x
          text: 父は子どもが遅く帰ったので怒っています
          lang: ja
        - id: vkn
          text: 父は子どもが遅く帰ったので偉いです
          lang: ja
        - id: ypb
          text: 父は子どもが遅く帰ったので乾いています
          lang: ja
    answer:
      correct_option_id: q4x
    explanation:
      vi: 怒っています - đang giận. 濡れる, 乾く không hợp ngữ cảnh.
    display_answer: 父は子どもが遅く帰ったので怒っています
