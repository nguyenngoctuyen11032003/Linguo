      options:
        - id: zwu
          text: 希望
          lang: ja
        - id: to5
          text: 計画
          lang: ja
        - id: lhm
          text: 相談
          lang: ja
        - id: iyq
          text: 修理
          lang: ja
    answer:
      correct_option_id: to5
    explanation:
      vi: 計画 là kế hoạch. 相談 là bàn bạc, 希望 là nguyện vọng, 修理 là sửa chữa.
