title:
  vi: Ôn tập - hẹn đi chơi cuối tuần
objectives:
  - vi: Phối hợp sở thích, dự định, thời tiết và rủ rê trong một cuộc trò chuyện.
  - vi: Nhận lời, từ chối và đổi hẹn một cách tự nhiên.
  - vi: Đọc hiểu một tin nhắn hẹn gặp ngắn.
estimated_minutes: 15
skills: [grammar, reading, speaking, listening]
