      vi: 梅雨になったら - khi vào mùa mưa; 降るでしょう - có lẽ sẽ mưa; 毎日 - mỗi ngày.
    display_answer: Khi vào mùa mưa, có lẽ ngày nào cũng mưa.

  - key: ja:exercise:n4-wea-order-quiet
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-naru
    prompt:
      instruction: 'Sắp xếp thành câu: "Buổi tối thị trấn trở nên yên tĩnh."'
      tokens:
        - { id: t-narimasu, text: なります }
        - { id: t-shizukani, text: 静かに }
        - { id: t-machi, text: 町が }
        - { id: t-yoru, text: 夜は }
        - { id: t-shizukaku, text: 静かく }
    answer:
      orders:
        - [t-yoru, t-machi, t-shizukani, t-narimasu]
    explanation:
      vi: 静か là tính từ đuôi な - thêm に trước なります. 静かく là cách chia của tính từ đuôi い, sai ở đây.
    display_answer: 夜は町が静かになります。

  - key: ja:exercise:n4-wea-mcq-genki
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-gram-sou-looks
    prompt:
      stem: Bạn gặp lại thầy giáo cũ, thấy thầy trông khỏe mạnh. Câu nào tự nhiên?
      stem_lang: vi
      options:
        - { id: v4x, text: 先生、お元気そうですね。, lang: ja }
        - { id: j7r, text: 先生、お元気だそうですね。, lang: ja }
        - { id: c1o, text: 先生、お元気になりましたね。, lang: ja }
        - { id: n5g, text: 先生、お元気でしょうね。, lang: ja }
    answer:
      correct_option_id: v4x
    explanation:
      vi: Nhìn thấy mà đoán - 元気そう. 元気だそう là "nghe nói khỏe"; 元気になりました là "đã khỏe lại" (sau ốm); でしょうね là phỏng đoán khi không nhìn thấy.
    display_answer: 先生、お元気そうですね。

  - key: ja:exercise:n4-wea-translate-cold
    type: translate
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-gram-deshou
    prompt:
      source_text: Ngày mai có lẽ sẽ lạnh hơn.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 明日はもっと寒くなるでしょう。
        - あしたはもっとさむくなるでしょう。
        - 明日はもっと寒いでしょう。
        - あしたはもっとさむいでしょう。
        - 明日は今日より寒くなるでしょう。
        - 明日は今日より寒いでしょう。
        - 明日はもう少し寒くなるでしょう。
        - 明日はさらに寒くなるでしょう。
        - 明日はもっと寒くなると思います。
        - 明日は寒くなるでしょう。
    known_wrong:
      - answer: 明日はもっと寒いになるでしょう。
        feedback_vi: Tính từ đuôi い - 寒い → 寒く + なる.
        error_tag: naru_form
      - answer: 明日はもっと寒いだでしょう。
        feedback_vi: Tính từ đuôi い nối thẳng - 寒いでしょう.
        error_tag: deshou_form
    explanation:
      vi: 寒い → 寒くなる (trở nên lạnh) + でしょう (có lẽ). もっと là "hơn nữa".
    display_answer: 明日はもっと寒くなるでしょう。
