  - key: ja:exercise:n4-wea-listen-forecast
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-tenki-yohou
    prompt:
      audio_asset_id: null
      fallback_text: 天気予報によると、明日は雪が降るそうです。
      options:
        - { id: a8u, text: "Theo dự báo thời tiết, ngày mai nghe nói có tuyết.", lang: vi }
        - { id: q2z, text: "Theo dự báo thời tiết, hôm nay trời có vẻ sắp có tuyết.", lang: vi }
        - { id: d6l, text: "Theo dự báo thời tiết, ngày mai trời mưa.", lang: vi }
        - { id: s9f, text: "Theo dự báo thời tiết, ngày mai không có tuyết.", lang: vi }
    answer:
      correct_option_id: a8u
    explanation:
      vi: 天気予報によると - theo dự báo; 降るそうです (sau thể thường) - nghe nói; 雪 là tuyết, 明日 là ngày mai.
    display_answer: Theo dự báo thời tiết, ngày mai nghe nói có tuyết.

  - key: ja:exercise:n4-wea-fill-rain
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-sou-looks
    prompt:
      template: "Trời tối quá. Có vẻ sắp mưa. - 空が暗いですね。雨が{{b1}}です。"
      blanks:
        - { id: b1, width_hint: 4 }
      hint_levels:
        - Lấy thể ます của 降る rồi bỏ ます.
        - 降ります → 降り + そう.
    answer:
      blanks:
        b1: [降りそう, ふりそう]
    known_wrong:
      - answer: 降るそう
        feedback_vi: 降るそうです là "nghe nói sẽ mưa". Mình tự nhìn thấy thì dùng gốc 降り + そう.
        error_tag: sou_looks_hearsay
      - answer: 降りでしょう
        feedback_vi: でしょう đứng sau thể thường - 降るでしょう. Ở đây đã có です, cần そう.
        error_tag: sou_looks_hearsay
    explanation:
      vi: 降ります → 降り + そうです - đoán từ bầu trời tối mà mình đang thấy.
    display_answer: 空が暗いですね。雨が降りそうです。

  # ---------------- recall ----------------
  - key: ja:exercise:n4-wea-fill-suzushii
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-suzushii
    prompt:
      template: "Sang thu, trời đã mát hơn. - 秋{{b1}}なって、{{b2}}なりました。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [に]
        b2: [涼しく, すずしく]
    known_wrong:
      - answer: 涼しい
        feedback_vi: Tính từ đuôi い đổi い → く trước なる - 涼しく.
        error_tag: naru_form
      - answer: 涼しいに
        feedback_vi: Chỉ tính từ đuôi な và danh từ mới thêm に. 涼しい → 涼しく.
        error_tag: naru_form
      - answer: が
        feedback_vi: Danh từ + になる - 秋になる.
        error_tag: naru_form
    explanation:
      vi: Danh từ + になる (秋になって); tính từ đuôi い - い → く + なる (涼しくなりました).
    display_answer: 秋になって、涼しくなりました。

  - key: ja:exercise:n4-wea-fill-deshou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-deshou
    prompt:
      template: "Từ chiều có lẽ sẽ mưa. - 午後から{{b1}}。"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [雨でしょう, あめでしょう, 雨が降るでしょう, あめがふるでしょう]
    known_wrong:
      - answer: 雨だでしょう
        feedback_vi: Danh từ nối thẳng với でしょう - 雨でしょう.
        error_tag: deshou_form
      - answer: 雨が降りでしょう
        feedback_vi: でしょう đứng sau thể thường - 降るでしょう.
        error_tag: deshou_form
    explanation:
      vi: 雨でしょう hoặc 雨が降るでしょう - có lẽ sẽ mưa.
    display_answer: 午後から雨でしょう。

  - key: ja:exercise:n4-wea-translate-season
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-kisetsu
    prompt:
      source_text: Bạn thích mùa nào nhất?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - どの季節が一番好きですか。
        - どのきせつがいちばんすきですか。
        - どの季節がいちばん好きですか。
        - 季節の中でどれが一番好きですか。
        - 季節の中で、どれが一番好きですか。
        - 季節の中でいつが一番好きですか。
        - 季節の中で、いつが一番好きですか。
        - 一番好きな季節は何ですか。
        - 一番好きな季節はいつですか。
        - いちばんすきなきせつはなんですか。
    known_wrong:
      - answer: どの季節を一番好きですか。
        feedback_vi: 好き đi với が - どの季節が.
        error_tag: particle_ga_suki
      - answer: 何の季節が一番好きですか。
        feedback_vi: Chọn một trong nhóm có sẵn dùng どの (どの季節).
        error_tag: question_word
