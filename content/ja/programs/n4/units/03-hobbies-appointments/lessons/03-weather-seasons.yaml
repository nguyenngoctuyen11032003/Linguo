title:
  vi: Thời tiết và mùa - そうです, なります, でしょう
objectives:
  - vi: Đoán từ những gì nhìn thấy bằng Vます-gốc / A-gốc + そうです.
  - vi: Nói sự thay đổi bằng A-く / Na-に / N-に + なります.
  - vi: Hiểu dự báo thời tiết với でしょう.
estimated_minutes: 15
skills: [grammar, vocabulary, listening, speaking]
prerequisites: [ja:lesson:n4-try-intend]
items:
  - item: ja:item:n4-gram-sou-looks
  - item: ja:item:n4-gram-naru
