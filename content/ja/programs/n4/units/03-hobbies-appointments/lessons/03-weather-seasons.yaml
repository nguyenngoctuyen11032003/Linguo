      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Khi vào mùa mưa, có lẽ ngày nào cũng mưa.
        - Khi vào mùa mưa thì có lẽ ngày nào cũng mưa.
        - Vào mùa mưa thì có lẽ ngày nào cũng mưa.
        - Vào mùa mưa, có lẽ ngày nào cũng mưa.
        - Đến mùa mưa thì có lẽ ngày nào cũng mưa.
        - Đến mùa mưa, có lẽ ngày nào cũng mưa.
        - Khi đến mùa mưa, chắc là ngày nào cũng mưa.
        - Vào mùa mưa thì chắc là ngày nào cũng mưa.
        - Đến mùa mưa thì chắc ngày nào cũng mưa.
        - Khi vào mùa mưa, có lẽ trời mưa mỗi ngày.
        - Vào mùa mưa thì có lẽ trời mưa mỗi ngày.
        - Đến mùa mưa thì có lẽ trời mưa mỗi ngày.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Mùa mưa đã qua, ngày nào cũng nắng.
        feedback_vi: 梅雨になったら là "khi vào mùa mưa", 雨が降る là mưa.
        error_tag: vocab_meaning
      - answer: Khi vào mùa mưa, nghe nói ngày nào cũng mưa.
        feedback_vi: でしょう là "có lẽ" (phỏng đoán), không phải "nghe nói".
        error_tag: sou_looks_hearsay
