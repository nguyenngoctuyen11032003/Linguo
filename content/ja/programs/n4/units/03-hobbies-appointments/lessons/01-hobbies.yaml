    prompt:
      template: "Hôm nay trời mưa, tôi lại mệt nên sẽ ở nhà. - 今日は雨{{b1}}、疲れているし、家にいます。"
      blanks:
        - { id: b1, width_hint: 2 }
    answer:
      blanks:
        b1: [だし]
    known_wrong:
      - answer: し
        feedback_vi: 雨 là danh từ - trước し phải có だ (雨だし).
        error_tag: shi_da
      - answer: なし
        feedback_vi: な chỉ dùng khi tính từ đuôi な đứng trước danh từ; trước し dùng だ - 雨だし.
        error_tag: shi_da
    explanation:
      vi: N + だし - "vừa là... (lý do 1)"; 疲れているし - lại đang mệt (lý do 2). Hai lý do cùng hướng dẫn tới quyết định 家にいます.
    display_answer: 今日は雨だし、疲れているし、家にいます。

