title:
  vi: Sở thích - ことです, のが好きです và lý do với ～し
objectives:
  - vi: Giới thiệu sở thích bằng 趣味は V辞書形 + ことです.
  - vi: Nói thích, giỏi, kém việc gì bằng V + のが 好き・上手・下手です.
  - vi: Kể vài lý do vì sao mình thích bằng ～し、～し.
  - vi: Hỏi và trả lời về sở thích một cách tự nhiên, khiêm tốn.
