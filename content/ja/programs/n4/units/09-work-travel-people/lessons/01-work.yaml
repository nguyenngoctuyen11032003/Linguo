body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được những điều cơ bản ở công ty - 部長は今、会議中です。 - và nhờ lịch sự - 少々お待ちください。
  - type: explain
    text:
      vi: "Chức danh - 社長 (giám đốc, chủ tịch), 部長 (trưởng phòng cấp cao), 課長 (quản lý nhóm). Theo sau tên người, thêm chức danh thay cho さん: 田中部長 (trưởng phòng Tanaka)."
  - type: explain
    text:
      vi: Công việc - 打ち合わせ (họp bàn công việc), 担当 (phụ trách), 休暇 (nghỉ phép). Tìm việc - 就職 (đi làm), 面接 (phỏng vấn), 履歴書 (sơ yếu lý lịch). Chào đồng nghiệp - お疲れ様です.
  - type: explain
    text:
      vi: "お / ご + V ます-gốc / N + ください là cách nhờ lịch sự hơn ～てください: お待ちください (xin hãy đợi), ご覧ください (xin hãy xem), ご記入ください (xin điền). お dùng với động từ thuần Nhật, ご dùng với từ gốc Hán."
  - type: deep_explain
    text:
      vi: お疲れ様です vừa là lời chào đồng nghiệp trong ngày vừa là lời cảm ơn khi tan ca (お疲れ様でした). Không dùng với người trên khi họ giúp mình - khi đó nói ありがとうございます. 履歴書 là bản ghi lý lịch bằng viết tay hoặc đánh máy gửi kèm hồ sơ xin việc; 面接 là bước tiếp theo.
  - type: example
    target: 部長は今、会議中です。少々お待ちください。
    target_lang: ja
    translation:
      vi: Trưởng phòng hiện đang họp. Xin vui lòng đợi một chút.
    note:
      vi: お待ちください - kính ngữ nhờ.
  - type: example
    target: こちらの書類にご記入ください。
    target_lang: ja
    translation:
      vi: Xin hãy điền vào giấy tờ này.
    note:
      vi: ご + từ gốc Hán + ください.
  - type: example
    target: 明日、会社で面接があります。履歴書を持っていきます。
    target_lang: ja
    translation:
      vi: Ngày mai tôi có phỏng vấn ở công ty. Tôi mang sơ yếu lý lịch đi.
    note:
      vi: 面接 - phỏng vấn.
  - type: example
    target: お疲れ様です。お先に失礼します。
    target_lang: ja
    translation:
      vi: Bạn vất vả rồi. Tôi xin phép về trước.
    note:
      vi: Câu chào khi tan ca.
  - type: common_mistake
    wrong: 少々待ちください。
    right: 少々お待ちください。
    target_lang: ja
    note:
      vi: "Mẫu kính ngữ cần お trước ます-gốc: お待ちください."
  - type: common_mistake
    wrong: お記入ください。
    right: ご記入ください。
    target_lang: ja
    note:
      vi: Từ gốc Hán (記入) dùng ご, không dùng お.
  - type: summary
    points:
      - vi: 社長 · 部長 · 課長 - chức danh.
      - vi: 打ち合わせ họp bàn · 担当 phụ trách · 休暇 nghỉ phép · 就職 · 面接 · 履歴書.
      - vi: お + ます-gốc + ください · ご + N + ください.
      - vi: お疲れ様です - chào đồng nghiệp.
exercises:
  - key: ja:exercise:n4-work-w1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u9-gram-o-kudasai
    prompt:
      stem: Bạn muốn nhờ khách chờ một chút một cách lịch sự. Câu nào đúng?
      stem_lang: vi
      options:
        - id: lbp
          text: 少々お待ちください。
          lang: ja
        - id: ynt
          text: 少々待ちなさい。
          lang: ja
        - id: d39
          text: 少々待つください。
          lang: ja
        - id: r4i
          text: 少々待ってくださいます。
          lang: ja
    answer:
      correct_option_id: lbp
    explanation:
      vi: "お + ます-gốc + ください là cách lịch sự: お待ちください. Các dạng còn lại sai hình thức hoặc quá thẳng."
    display_answer: 少々お待ちください。
  - key: ja:exercise:n4-work-w2
