    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u9-mensetsu
    prompt:
      stem: Từ nào có nghĩa là “phỏng vấn”?
      stem_lang: vi
      options:
        - id: xbf
          text: 会議
          lang: ja
        - id: vzb
          text: 休暇
          lang: ja
        - id: vxx
          text: 面接
          lang: ja
        - id: ree
          text: 就職
          lang: ja
    answer:
      correct_option_id: vxx
    explanation:
      vi: 面接 là phỏng vấn. 会議 là cuộc họp, 休暇 là nghỉ phép, 就職 là đi làm/tìm được việc.
    display_answer: 面接
  - key: ja:exercise:n4-work-w3
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n4-u9-buchou
    prompt:
      audio_asset_id: null
      fallback_text: 部長は今、会議中です。少々お待ちください。
      options:
        - id: o5w
          text: Trưởng phòng đang đi vắng. Xin gọi lại sau.
          lang: vi
        - id: l5u
          text: Trưởng phòng đã về. Xin mời vào.
          lang: vi
        - id: eln
          text: Giám đốc đang họp. Xin đợi ở ngoài.
          lang: vi
        - id: qsl
          text: Trưởng phòng đang họp. Xin vui lòng đợi một chút.
          lang: vi
    answer:
      correct_option_id: qsl
    explanation:
      vi: 部長 - trưởng phòng; 会議中 - đang họp; お待ちください - xin vui lòng đợi.
    display_answer: Trưởng phòng đang họp. Xin vui lòng đợi một chút.
  - key: ja:exercise:n4-work-w4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u9-gram-o-kudasai
    prompt:
      template: こちらの書類に{{b1}}ください。 (Xin hãy điền vào giấy tờ này.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Tiền tố cho từ gốc Hán.
        - Bắt đầu bằng ご.
    answer:
      blanks:
        b1:
          - ご記入
          - ごきにゅう
    known_wrong:
      - answer: お記入
        feedback_vi: Từ gốc Hán 記入 đi với ご.
        error_tag: honorific_prefix
    explanation:
      vi: ご + N (gốc Hán) + ください - kính ngữ nhờ.
    display_answer: こちらの書類にご記入ください。
  - key: ja:exercise:n4-work-w5
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u9-otsukaresama
    prompt:
      stem: Bạn chào đồng nghiệp khi hết giờ làm. Câu nào tự nhiên?
      stem_lang: vi
      options:
        - id: o3w
          text: お疲れ様でした。お先に失礼します。
          lang: ja
        - id: xj5
          text: お休みなさい。いってきます。
          lang: ja
        - id: k0x
          text: ごちそうさまでした。いらっしゃいませ。
          lang: ja
        - id: zqg
          text: おめでとうございます。ただいま。
          lang: ja
    answer:
      correct_option_id: o3w
    explanation:
      vi: お疲れ様でした là lời chào khi tan ca; お先に失礼します là xin phép về trước. Các câu còn lại không phù hợp bối cảnh.
    display_answer: お疲れ様でした。お先に失礼します。
  - key: ja:exercise:n4-work-w6
    type: fill_blank
