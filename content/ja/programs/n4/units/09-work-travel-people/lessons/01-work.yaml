          width_hint: 3
    answer:
      blanks:
        b1:
          - 担当
          - たんとう
    known_wrong:
      - answer: 就職
        feedback_vi: 就職 là đi làm; "phụ trách" là 担当.
        error_tag: vocab_meaning
    explanation:
      vi: 担当 là phụ trách. 担当する - phụ trách.
    display_answer: この件は田中さんが担当しています。
  - key: ja:exercise:n4-work-w8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u9-gram-o-kudasai
    prompt:
      source_text: Xin vui lòng đợi một chút.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 少々お待ちください。
        - しょうしょうおまちください。
        - ちょっとお待ちください。
        - 少しお待ちください。
        - ちょっとおまちください。
    known_wrong:
      - answer: 少々お待ちします。
        feedback_vi: お待ちします là "tôi sẽ đợi", không phải xin người khác đợi.
        error_tag: honorific
    explanation:
      vi: お + ます-gốc + ください - kính ngữ nhờ.
    display_answer: 少々お待ちください。
  - key: ja:exercise:n4-work-w9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u9-shuushoku
    prompt:
      source_text: 大学を卒業したら、日本の会社に就職したいです。面接の準備をしています。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tốt nghiệp đại học xong tôi muốn vào làm ở công ty Nhật. Tôi đang chuẩn bị cho phỏng vấn.
        - Sau khi tốt nghiệp đại học, tôi muốn làm việc ở một công ty Nhật. Tôi đang chuẩn bị phỏng vấn.
        - Khi tốt nghiệp đại học tôi muốn vào công ty Nhật. Tôi đang chuẩn bị cho buổi phỏng vấn.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tốt nghiệp đại học xong tôi muốn học tiếp ở Nhật. Tôi đang chuẩn bị thi.
        feedback_vi: 就職 là vào làm ở công ty, không phải học tiếp.
        error_tag: meaning
    explanation:
      vi: 就職したい - muốn đi làm; 面接 - phỏng vấn; 準備 - chuẩn bị.
    display_answer: Tốt nghiệp đại học xong tôi muốn vào làm ở công ty Nhật. Tôi đang chuẩn bị cho phỏng vấn.
