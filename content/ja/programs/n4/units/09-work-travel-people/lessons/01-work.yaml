    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u9-rirekisho
    prompt:
      template: 面接の前に、{{b1}}を送ります。 (Trước buổi phỏng vấn tôi gửi sơ yếu lý lịch.)
      blanks:
        - id: b1
          width_hint: 4
    answer:
      blanks:
        b1:
