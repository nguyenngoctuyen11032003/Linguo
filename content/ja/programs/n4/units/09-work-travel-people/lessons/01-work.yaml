        - id: t1
          text: 午後三時から
    answer:
      orders:
        - - t1
          - t2
          - t3
    explanation:
      vi: Thời gian (午後三時から) → chủ ngữ (打ち合わせが) → あります.
    display_answer: 午後三時から打ち合わせがあります。
  - key: ja:exercise:n4-work-w11
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u9-kyuuka
    prompt:
      stem: Bạn muốn xin nghỉ phép tháng sau. Câu nào đúng?
      stem_lang: vi
      options:
        - id: xn3
          text: 来月、休暇を取りたいです。
          lang: ja
        - id: zet
          text: 来月、休暇に取りたいです。
          lang: ja
        - id: m4s
          text: 来月、休暇を取れたいです。
          lang: ja
        - id: ks7
          text: 来月、休暇で取りたいです。
          lang: ja
    answer:
      correct_option_id: xn3
    explanation:
      vi: 休暇を取る - nghỉ phép; 取りたいです - muốn lấy. Các dạng khác sai trợ từ hoặc hình thức.
    display_answer: 来月、休暇を取りたいです。
