          - りれきしょ
    known_wrong:
      - answer: 面接
        feedback_vi: 面接 là buổi phỏng vấn; thứ gửi đi là 履歴書.
        error_tag: vocab_meaning
    explanation:
      vi: 履歴書 là sơ yếu lý lịch.
    display_answer: 面接の前に、履歴書を送ります。
  - key: ja:exercise:n4-work-w7
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u9-tantou
    prompt:
      template: この件は田中さんが{{b1}}しています。 (Việc này do anh Tanaka phụ trách.)
      blanks:
