title:
  vi: Công việc và công ty - 部長・面接・お疲れ様です
objectives:
  - vi: "Gọi chức danh và nói về công việc: 部長, 課長, 社長, 担当, 打ち合わせ."
  - vi: "Nói về tìm việc: 面接, 履歴書, 就職, 休暇."
  - vi: Dùng お / ご + ます-gốc + ください để nhờ lịch sự.
estimated_minutes: 16
