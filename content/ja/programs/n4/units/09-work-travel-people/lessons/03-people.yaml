title:
  vi: Quan hệ con người - 付き合う・謝る・祝う
objectives:
  - vi: "Nói về bạn bè và quan hệ: 親友, 恋人, 付き合う, 喧嘩, 謝る, 許す."
  - vi: "Nói về quà và lời cảm ơn: 祝う, 贈る, 感謝, お世話になる."
  - vi: Giới thiệu người, địa điểm chưa quen bằng N1 という N2.
estimated_minutes: 16
