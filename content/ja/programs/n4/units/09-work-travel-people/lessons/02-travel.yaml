  - vi: "Dùng từ vựng đi tàu: 乗り換える, 急行, 特急, 運賃, 改札, 発車, 出口, 入口."
  - vi: "Nói vé và chỗ ngồi: 片道, 往復, 空席, 満席."
  - vi: Nói việc thỉnh thoảng xảy ra bằng V辞書形 + ことがあります.
