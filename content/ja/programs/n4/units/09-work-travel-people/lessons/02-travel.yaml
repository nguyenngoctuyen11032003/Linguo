    difficulty: 3
    item: ja:item:n4-u9-gram-koto-ga-aru
    prompt:
      source_text: Có khi tôi không ăn sáng.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 朝ご飯を食べないことがあります。
        - あさごはんをたべないことがあります。
        - 朝ごはんを食べないことがあります。
        - 朝食を食べないことがあります。
    known_wrong:
      - answer: 朝ご飯を食べないことがありました。
        feedback_vi: Câu nói thói quen hiện tại nên dùng あります.
        error_tag: tense
      - answer: 朝ご飯を食べたことがあります。
        feedback_vi: 食べたことがある là "đã từng ăn", không phải "thỉnh thoảng không ăn".
        error_tag: form
    explanation:
      vi: V ない + ことがあります - có khi không ...
    display_answer: 朝ご飯を食べないことがあります。
  - key: ja:exercise:n4-train-travel-r9
