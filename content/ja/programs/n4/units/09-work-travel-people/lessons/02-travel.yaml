body:
  - type: objective
    text:
      vi: Sau bài này, bạn mua vé và đi tàu ở Nhật - 往復の切符を二枚お願いします。新宿で乗り換えます。 - và nói thói quen - 朝ご飯を食べないことがあります。
  - type: explain
    text:
      vi: Tàu - 急行 (tàu nhanh), 特急 (tàu tốc hành đặc biệt, nhanh hơn 急行), 乗り換える (đổi tàu), 発車 (xuất bến), 改札 (cổng soát vé), 出口 / 入口 (lối ra / lối vào), 運賃 (giá vé).
  - type: explain
    text:
      vi: Vé và chỗ - 片道 (một chiều), 往復 (khứ hồi), 空席 (ghế trống), 満席 (hết chỗ). Ví dụ 往復の切符を二枚お願いします; その電車は満席でした.
  - type: explain
    text:
      vi: V辞書形 / V ない + ことがある = "thỉnh thoảng có khi..." - 休みの日は、一日中寝ていることがあります. Khác V た + ことがある (đã từng làm) bạn đã học ở bài trước.
  - type: deep_explain
    text:
      vi: "Ở Nhật, giá vé phụ thuộc quãng đường và loại tàu: 特急 và 新幹線 đắt hơn vì phải trả thêm 特急料金 (phụ phí tốc hành). Thẻ IC (Suica, Pasmo) dùng chạm ở 改札 nên bạn không phải mua vé từng chặng. Câu hỏi hay gặp - 乗り換えはありますか (Có phải đổi tàu không?)."
  - type: example
    target: 新宿で電車を乗り換えて、渋谷へ行きます。
    target_lang: ja
    translation:
      vi: Tôi đổi tàu ở Shinjuku rồi đi Shibuya.
    note:
      vi: 乗り換えて - đổi tàu rồi.
  - type: example
    target: 往復の切符を二枚お願いします。
    target_lang: ja
    translation:
      vi: Cho tôi hai vé khứ hồi.
    note:
      vi: 往復 - khứ hồi.
  - type: example
    target: その電車は満席で、乗れませんでした。
    target_lang: ja
    translation:
      vi: Chuyến tàu đó hết chỗ nên tôi không lên được.
    note:
      vi: 満席 - hết chỗ.
  - type: example
    target: 朝ご飯を食べないことがあります。
    target_lang: ja
    translation:
      vi: Có khi tôi không ăn sáng.
    note:
      vi: V ない + ことがある.
  - type: common_mistake
    wrong: 急行は特急より速いです。
    right: 特急は急行より速いです。
    target_lang: ja
    note:
      vi: 特急 (tốc hành đặc biệt) nhanh hơn 急行 (tàu nhanh).
  - type: common_mistake
    wrong: 一年に一回ことがあります。(thỉnh thoảng)
    right: 一年に一回、行くことがあります。
    target_lang: ja
    note:
      vi: ことがある cần động từ trước nó (行く).
  - type: summary
    points:
      - vi: 急行 · 特急 · 乗り換える · 発車 · 改札 · 出口 · 入口 · 運賃.
      - vi: 片道 một chiều · 往復 khứ hồi · 空席 chỗ trống · 満席 hết chỗ.
      - vi: V辞書形 / V ない + ことがある - thỉnh thoảng có khi.
      - vi: V た + ことがある - đã từng.
