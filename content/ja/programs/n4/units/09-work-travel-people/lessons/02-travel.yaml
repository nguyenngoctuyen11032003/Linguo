  - key: ja:exercise:n4-train-travel-r4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u9-katamichi
    prompt:
      template: "{{b1}}三千円です。往復は五千円です。 (Một chiều 3.000 yên. Khứ hồi 5.000 yên.)"
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Từ nghĩa "một chiều".
        - Bắt đầu bằng 片.
    answer:
      blanks:
        b1:
          - 片道
          - かたみち
    known_wrong:
      - answer: 往復
        feedback_vi: 往復 là khứ hồi; câu sau đã nói 往復 nên chỗ trống là 片道.
        error_tag: vocab_meaning
    explanation:
      vi: 片道 là một chiều.
    display_answer: 片道三千円です。往復は五千円です。
