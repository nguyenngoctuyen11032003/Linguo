    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u9-norikaeru
    prompt:
      source_text: 大阪まで特急で行きます。往復の切符を買って、新宿で電車を乗り換えます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tôi đi Osaka bằng tàu tốc hành. Tôi mua vé khứ hồi rồi đổi tàu ở Shinjuku.
        - Tôi đi đến Osaka bằng tàu tốc hành, mua vé khứ hồi và đổi tàu ở Shinjuku.
        - Tôi đến Osaka bằng tàu tốc hành. Mua vé khứ hồi, rồi đổi tàu ở Shinjuku.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi đi Osaka bằng xe buýt. Tôi mua vé một chiều rồi đổi tàu ở Shinjuku.
        feedback_vi: 特急 là tàu tốc hành; 往復 là khứ hồi.
        error_tag: meaning
    explanation:
      vi: 特急 - tàu tốc hành; 往復 - khứ hồi; 乗り換える - đổi tàu.
    display_answer: Tôi đi Osaka bằng tàu tốc hành. Tôi mua vé khứ hồi rồi đổi tàu ở Shinjuku.
