    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n4-u7-gram-aida-ni
    prompt:
      audio_asset_id: null
      fallback_text: 私が寝ている間に、友達が電話をかけました。
      options:
        - id: n9e
          text: Khi tôi tỉnh dậy, bạn tôi đã ngủ.
          lang: vi
        - id: v5t
          text: Trong lúc tôi ngủ, bạn tôi đã gọi điện.
          lang: vi
        - id: pse
