  - key: ja:exercise:n4-made-ni-m8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u7-gram-made-ni
    prompt:
      source_text: Xin hãy nộp báo cáo trước ngày mai.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 明日までにレポートを出してください。
        - あしたまでにレポートをだしてください。
        - 明日までにレポートを提出してください。
