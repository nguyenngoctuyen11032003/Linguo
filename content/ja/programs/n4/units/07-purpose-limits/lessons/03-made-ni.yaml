    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u7-kaesu
    prompt:
      template: 図書館に本を{{b1}}。 (Tôi trả sách cho thư viện.)
      blanks:
        - id: b1
          width_hint: 5
