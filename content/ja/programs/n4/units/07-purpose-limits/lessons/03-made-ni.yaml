key: ja:lesson:n4-made-ni
order_index: 3
level: n4
title:
  vi: Thời hạn và khoảng thời gian - までに・間に
objectives:
  - vi: Phân biệt まで (kéo dài đến) và までに (hạn chót).
  - vi: Dùng ～間に nói việc xảy ra trong một khoảng thời gian.
  - vi: Dùng 返事, 返す, 迎える, 順番, 並ぶ, 済む trong việc hằng ngày.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - reading
prerequisites:
  - ja:lesson:n4-dake-shika
