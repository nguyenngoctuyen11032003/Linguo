    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u7-gram-made-ni
    prompt:
      template: 五時{{b1}}帰ります。 (Tôi sẽ về trước 5 giờ.)
      blanks:
        - id: b1
          width_hint: 4
    answer:
