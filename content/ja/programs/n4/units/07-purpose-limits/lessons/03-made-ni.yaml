      stem_lang: vi
      options:
        - id: log
          text: 駅まで友達を返しに行きます。
          lang: ja
        - id: f6v
          text: 駅まで友達を並びに行きます。
          lang: ja
        - id: wge
          text: 駅まで友達を済みに行きます。
          lang: ja
        - id: mpj
          text: 駅まで友達を迎えに行きます。
          lang: ja
    answer:
      correct_option_id: mpj
    explanation:
      vi: 迎えに行きます - đi đón. 返す là trả lại, 並ぶ là xếp hàng, 済む là xong - không hợp.
    display_answer: 駅まで友達を迎えに行きます。
