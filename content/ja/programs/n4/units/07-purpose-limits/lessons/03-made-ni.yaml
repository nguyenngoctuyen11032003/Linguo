    display_answer: Trong lúc tôi ngủ, bạn tôi đã gọi điện.
  - key: ja:exercise:n4-made-ni-m4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u7-gram-aida-ni
    prompt:
      template: 夏休みの{{b1}}、資格を取りたいです。 (Trong kỳ nghỉ hè tôi muốn lấy chứng chỉ.)
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Cụm "trong lúc" cần có に.
        - Bắt đầu bằng 間 - 間に.
    answer:
      blanks:
        b1:
          - 間に
          - あいだに
    known_wrong:
      - answer: 間
        feedback_vi: 間 không có に nghĩa là "suốt khoảng đó" - ở đây là việc làm trong khoảng nên cần 間に.
        error_tag: form
    explanation:
      vi: N の + 間に - trong khoảng thời gian.
    display_answer: 夏休みの間に、資格を取りたいです。
