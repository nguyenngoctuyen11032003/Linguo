  - item: ja:item:n4-u7-sumu
body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói về hạn chót và khoảng thời gian - 明日までにレポートを出してください。 夏休みの間に資格を取りたいです。
  - type: explain
    text:
      vi: 'まで = "cho đến" - hành động kéo dài liên tục cho tới thời điểm đó: 五時まで働きます (làm việc đến 5 giờ). までに = "trước, muộn nhất là" - hành động hoàn tất một lần trước hạn: 五時までに終わります (xong trước 5 giờ).'
  - type: explain
    text:
      vi: '～間に = "trong lúc, trong khoảng" - việc khác xảy ra chen vào khoảng thời gian đó: 私が寝ている間に雨が降りました. Trước 間に là V ている hoặc N の; còn 夏休みの間に (trong kỳ nghỉ hè).'
  - type: explain
    text:
      vi: Từ liên quan - 返事 (hồi âm), 返す (trả lại), 迎える (đón), 順番 (thứ tự), 並ぶ (xếp hàng), 済む (xong). Ví dụ 順番に並んでください, 手続きは済みました.
  - type: deep_explain
    text:
      vi: Mẹo chọn まで hay までに - hỏi "hành động kéo dài suốt khoảng đó hay chỉ cần xong một lần?". 夜十二時まで勉強する (học liên tục đến nửa đêm) và 夜十二時までに寝る (đi ngủ trước nửa đêm). Với 間に, hai việc diễn ra ở hai chủ thể khác nhau là bình thường; còn 間 (không に) nghĩa là hai việc song song suốt khoảng thời gian - 子どもが寝ている間、本を読みます.
  - type: example
    target: 明日までにレポートを出してください。
    target_lang: ja
    translation:
      vi: Xin hãy nộp báo cáo trước ngày mai.
    note:
      vi: までに - hạn chót.
  - type: example
    target: 夜十二時まで勉強しました。
    target_lang: ja
    translation:
      vi: Tôi đã học đến 12 giờ đêm.
    note:
      vi: まで - liên tục đến.
  - type: example
    target: 夏休みの間に、日本語の資格を取りたいです。
    target_lang: ja
    translation:
      vi: Trong kỳ nghỉ hè tôi muốn lấy chứng chỉ tiếng Nhật.
    note:
      vi: N の + 間に.
  - type: example
    target: 私が寝ている間に、地震がありました。
    target_lang: ja
    translation:
      vi: Trong lúc tôi ngủ thì có động đất.
    note:
      vi: V ている + 間に.
  - type: common_mistake
    wrong: 五時までに働きます。(làm việc suốt đến 5 giờ)
    right: 五時まで働きます。
    target_lang: ja
    note:
      vi: Hành động kéo dài liên tục dùng まで, không dùng までに.
  - type: common_mistake
    wrong: 明日まで、メールの返事を出してください。(hạn chót)
    right: 明日までに、メールの返事を出してください。
    target_lang: ja
    note:
      vi: Hạn chót để hoàn tất một việc dùng までに.
  - type: summary
    points:
      - vi: まで - liên tục đến · までに - trước hạn.
      - vi: ～間に - trong lúc (V ている / N の).
      - vi: 返事 · 返す · 迎える · 順番 · 並ぶ · 済む.
      - vi: 間 (không に) - suốt khoảng đó.
exercises:
  - key: ja:exercise:n4-made-ni-m1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u7-gram-made-ni
    prompt:
      stem: Chọn câu đúng - 明日___レポートを出してください。
      stem_lang: vi
      options:
        - id: b6z
          text: までに
          lang: ja
        - id: htq
          text: まで
          lang: ja
        - id: ew4
          text: ずつ
          lang: ja
        - id: zty
          text: あいだに
          lang: ja
    answer:
      correct_option_id: b6z
    explanation:
      vi: Hạn chót để nộp một lần dùng までに. まで là liên tục đến, あいだに là trong khoảng, ずつ là mỗi.
    display_answer: までに
