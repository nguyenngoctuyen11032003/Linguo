    difficulty: 2
    item: ja:item:n4-u7-narabu
    prompt:
      stem: Mọi người xếp hàng trước cửa hàng. Từ nào nghĩa là “xếp hàng”?
      stem_lang: vi
      options:
        - id: mfm
          text: 迎える
          lang: ja
        - id: ewa
          text: 済む
          lang: ja
        - id: kcn
          text: 返す
          lang: ja
        - id: ox7
          text: 並ぶ
          lang: ja
    answer:
      correct_option_id: ox7
    explanation:
      vi: 並ぶ là xếp hàng. 済む là xong, 返す là trả lại, 迎える là đón.
    display_answer: 並ぶ
  - key: ja:exercise:n4-made-ni-m6
