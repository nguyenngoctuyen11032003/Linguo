  - key: ja:exercise:n4-made-ni-m9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u7-henji
    prompt:
      source_text: 来週までに返事をください。その間に、いろいろ考えます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Xin hãy trả lời cho tôi trước tuần sau. Trong lúc đó, tôi sẽ suy nghĩ nhiều.
        - Xin hồi âm trước tuần sau. Trong thời gian đó, tôi sẽ cân nhắc nhiều thứ.
        - Hãy cho tôi câu trả lời trước tuần sau. Trong khoảng thời gian đó tôi sẽ nghĩ thêm.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Xin hãy trả lời cho tôi cho đến tuần sau. Suốt thời gian đó, tôi không suy nghĩ gì.
        feedback_vi: 来週までに là trước tuần sau (hạn chót).
        error_tag: form
    explanation:
      vi: 来週までに - trước tuần sau; その間に - trong lúc đó.
    display_answer: Xin hãy trả lời cho tôi trước tuần sau. Trong lúc đó, tôi sẽ suy nghĩ nhiều.
