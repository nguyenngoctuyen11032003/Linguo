title:
  vi: Mục đích - ～ために・～のに
objectives:
  - vi: Nói mục đích bằng V辞書形 / N の + ために.
  - vi: Nói công dụng, nhu cầu bằng V辞書形 + のに + 使います / 必要です.
  - vi: "Kể về dự định và ước mơ: 留学, 資格, 将来, 夢, 目指す, 頑張る."
estimated_minutes: 16
