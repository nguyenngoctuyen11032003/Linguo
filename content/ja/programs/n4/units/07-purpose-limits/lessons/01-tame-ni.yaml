      options:
        - id: q63
          text: Sang năm tôi đi du lịch Nhật. Vì thế tháng nào tôi cũng đi chơi.
          lang: vi
        - id: gxo
          text: Sang năm tôi làm việc ở Nhật. Vì thế tôi mua vé.
          lang: vi
        - id: m11
          text: Sang năm tôi đi du học Nhật. Vì thế tháng nào tôi cũng tiết kiệm.
