    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u7-gram-tame-ni
    prompt:
      stem: Chọn câu đúng - 日本へ留学する___、貯金しています。
      stem_lang: vi
      options:
        - id: eap
          text: ことために
          lang: ja
        - id: ynv
          text: ために
          lang: ja
        - id: xwg
          text: ようために
          lang: ja
        - id: xfv
          text: のために
          lang: ja
    answer:
      correct_option_id: ynv
    explanation:
      vi: V辞書形 + ために. Với danh từ mới thêm の. のために, ことために, ようために đều không đúng ở vị trí này.
    display_answer: ために
