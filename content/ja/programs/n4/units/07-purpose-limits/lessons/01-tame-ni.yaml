body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được mục đích và ước mơ - 日本へ留学するために、お金を貯めています。 - và công dụng - このはさみは紙を切るのに使います。
  - type: explain
    text:
      vi: 'V辞書形 / N の + ために = "để, vì". Hai vế cùng chủ ngữ và vế sau là hành động có chủ ý: 日本へ行くために、貯金します; 健康のために、運動します. Danh từ cần の trước ために.'
  - type: explain
    text:
      vi: V辞書形 + のに + 使います / 必要です / 便利です / かかります diễn tả "dùng để, cần để". Ví dụ 紙を切るのに使います (dùng để cắt giấy); 日本語を勉強するのに、辞書が必要です.
  - type: explain
    text:
      vi: Từ vựng kể dự định - 準備 (chuẩn bị), 貯金 (tiết kiệm), 留学 (du học), 資格 (chứng chỉ), 将来 (tương lai), 夢 (ước mơ), 目指す (nhắm tới), 頑張る (cố gắng).
  - type: deep_explain
    text:
      vi: Cẩn thận hai cách dùng của のに - のに (mục đích) đi với 使う, 必要, 便利, còn のに (mặc dù, N3) nối hai mệnh đề trái ngược. Với ために, khi vế trước là trạng thái không do chủ ý (khả năng, さむい) thì không dùng. Với thể phủ định mục đích, nói ～ないために (để không...) hoặc ～ないように (N3).
  - type: example
    target: 将来、医者になるために、一生懸命勉強しています。
    target_lang: ja
    translation:
      vi: Để tương lai trở thành bác sĩ, tôi đang học hết sức.
    note:
      vi: V辞書形 + ために.
  - type: example
    target: 健康のために、毎朝走っています。
    target_lang: ja
    translation:
      vi: Vì sức khoẻ, mỗi sáng tôi chạy bộ.
    note:
      vi: N の + ために.
  - type: example
    target: このはさみは紙を切るのに使います。
    target_lang: ja
    translation:
      vi: Cái kéo này dùng để cắt giấy.
    note:
      vi: V + のに + 使います.
  - type: example
    target: 留学するのに、お金がたくさん必要です。
    target_lang: ja
    translation:
      vi: Để đi du học cần rất nhiều tiền.
    note:
      vi: V + のに + 必要です.
  - type: common_mistake
    wrong: 日本語を勉強するために、先生が教えます。
    right: 日本語を勉強するために、私は学校へ行きます。
    target_lang: ja
    note:
      vi: ために đòi hai vế cùng chủ ngữ (tôi). Câu sai có hai chủ ngữ khác nhau.
  - type: common_mistake
    wrong: 健康にために、運動します。
    right: 健康のために、運動します。
    target_lang: ja
    note:
      vi: Danh từ + の + ために, không dùng に.
  - type: summary
    points:
      - vi: V辞書形 / N の + ために - để, vì (cùng chủ ngữ).
      - vi: V辞書形 + のに + 使います / 必要です - dùng để, cần để.
      - vi: 準備 · 貯金 · 留学 · 資格 · 将来 · 夢 · 目指す · 頑張る.
      - vi: のに (mục đích) ≠ のに (mặc dù).
exercises:
