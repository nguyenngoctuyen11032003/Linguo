    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u7-gram-tame-ni
    prompt:
      source_text: Để đi du học Nhật, tôi đang tiết kiệm tiền.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 日本へ留学するために、貯金しています。
        - 日本へ留学するために、お金を貯めています。
        - にほんへりゅうがくするために、ちょきんしています。
