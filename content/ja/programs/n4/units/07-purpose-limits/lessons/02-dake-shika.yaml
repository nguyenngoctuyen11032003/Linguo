title:
  vi: Giới hạn và số lượng - だけ・しか・ばかり・ずつ
objectives:
  - vi: Phân biệt だけ (chỉ) và しか～ない (chỉ có, ít ỏi).
  - vi: Dùng ばかり (toàn, chỉ toàn) và ずつ (mỗi, từng chút).
  - vi: Nói về lượng bằng 全部, 半分, 残る, 足りる, 余る, ほとんど.
estimated_minutes: 16
skills:
