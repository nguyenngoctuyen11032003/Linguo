key: ja:lesson:n4-giving-receiving
order_index: 2
level: n4
title:
  vi: Cho và nhận - あげる, もらう, くれる
objectives:
  - vi: Chọn đúng あげる, もらう, くれる theo hướng của món quà.
  - vi: Dùng đúng trợ từ に, から, が với người cho và người nhận.
  - vi: Kể về quà sinh nhật, quà lưu niệm.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, reading]
prerequisites: [ja:lesson:n4-potential]
