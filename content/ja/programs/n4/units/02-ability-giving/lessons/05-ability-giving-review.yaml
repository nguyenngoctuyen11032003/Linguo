key: ja:lesson:n4-ability-giving-review
order_index: 5
level: n4
title:
  vi: Ôn tập - nhờ bạn giúp chuyển nhà
objectives:
  - vi: Phối hợp thể khả năng, cho - nhận và なければなりません trong một tình huống.
  - vi: Nhờ giúp, cảm ơn và mời người khác tự nhiên.
  - vi: Kể lại ai đã làm gì cho mình.
estimated_minutes: 15
skills: [grammar, listening, speaking, writing]
prerequisites: [ja:lesson:n4-obligation]
