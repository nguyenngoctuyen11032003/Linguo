key: ja:lesson:n4-te-iku-kuru
order_index: 1
level: n4
title:
  vi: Đi - đến và thay đổi - ～ていく・～てくる
objectives:
  - vi: Dùng V て + 行く / 来る để nói mang đi, mang đến, làm rồi đi/đến.
  - vi: Nói sự thay đổi diễn ra dần bằng ～ていく / ～てくる.
  - vi: Dùng 増える, 減る, 太る, 痩せる, 変わる, だんだん để mô tả thay đổi.
estimated_minutes: 17
skills:
  - grammar
  - vocabulary
  - speaking
  - reading
prerequisites:
  - ja:lesson:n4-made-ni
