key: ja:lesson:n4-sa-kata
order_index: 3
level: n4
title:
  vi: Danh từ hoá - ～さ・～方
objectives:
  - vi: Danh từ hoá tính từ bằng さ (高さ, 重さ, 長さ, 大きさ).
  - vi: Nói "cách làm" bằng V ます (bỏ ます) + 方 (使い方, 読み方, 作り方).
  - vi: Dùng 方法, 種類, 形, 特徴, 他, 別 để mô tả.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - reading
prerequisites:
  - ja:lesson:n4-ni-suru
