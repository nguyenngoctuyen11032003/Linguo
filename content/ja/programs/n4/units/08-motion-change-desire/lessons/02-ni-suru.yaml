key: ja:lesson:n4-ni-suru
order_index: 2
level: n4
title:
  vi: Chọn và làm cho thay đổi - ～にする・～くする
objectives:
  - vi: Chọn món, chọn đồ bằng N にします.
  - vi: Làm cho một thứ thay đổi bằng A く / Na に / N に + します.
  - vi: Dùng 選ぶ, 音, 温度, 上げる, 下げる trong yêu cầu thường ngày.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - listening
prerequisites:
  - ja:lesson:n4-te-iku-kuru
