title:
  vi: Mong muốn người khác - ～てほしい・～たがる
objectives:
  - vi: Nói mong người khác làm gì bằng V て + ほしい.
  - vi: Nói ngôi thứ ba muốn gì bằng V たがる / たがっている.
  - vi: Dùng 助ける, 頼る, 喜ぶ, 驚く, 相手, お願い.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - listening
prerequisites:
  - ja:lesson:n4-sa-kata
