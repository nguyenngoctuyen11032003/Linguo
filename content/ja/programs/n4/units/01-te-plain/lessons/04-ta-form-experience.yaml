key: ja:lesson:n4-ta-form-experience
order_index: 4
level: n4
title:
  vi: Thể た, たことがあります và たり～たりします
objectives:
  - vi: Chia quá khứ thể thường (書いた, 読んだ, 食べなかった).
  - vi: Kể kinh nghiệm "đã từng" bằng V-たことがあります.
  - vi: Liệt kê vài việc tiêu biểu bằng V-たり、V-たりします.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:n4-plain-nai]
items:
  - item: ja:item:n4-gram-ta-form
  - item: ja:item:n4-gram-ta-koto-ga-aru
