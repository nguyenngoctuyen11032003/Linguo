key: ja:lesson:n4-te-form
order_index: 1
level: n4
title:
  vi: Thể て - nhờ vả bằng てください và nối hành động
objectives:
  - vi: Chia thể て cho cả ba nhóm động từ, kể cả ngoại lệ 行って.
  - vi: Nhờ người khác lịch sự bằng V-てください.
  - vi: Nối nhiều hành động theo thứ tự bằng V-て、V.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: []
