    display_answer: 日本の町の中で、どこが一番好きですか。

  # ---------------- recall ----------------
  - key: ja:exercise:n4-cmp-fill-hou-ga
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-yori-hou-ga
    prompt:
      template: "Shinkansen nhanh hơn xe buýt. - バス{{b1}}新幹線{{b2}}速いです。"
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [より]
        b2: [のほうが, の方が]
    known_wrong:
      - answer: のほうは
        feedback_vi: Mẫu cố định là のほうが.
        error_tag: comparison
      - answer: から
        feedback_vi: So sánh dùng より, không dùng から.
        error_tag: comparison
    explanation:
      vi: B より A のほうが～ - A hơn B. Ở đây A là 新幹線.
    display_answer: バスより新幹線のほうが速いです。

