key: ja:lesson:n4-comparing
order_index: 3
level: n4
title:
  vi: So sánh - より, のほうが, 一番
objectives:
  - vi: So sánh hai thứ bằng より và のほうが.
  - vi: Hỏi "cái nào hơn" bằng AとBとどちらが.
  - vi: Nói "nhất" trong một nhóm bằng Nの中で～が一番.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, reading]
prerequisites: [ja:lesson:n4-toki-nagara]
items:
  - item: ja:item:n4-gram-yori-hou-ga
