        - { id: y1n, text: 聞くながら, lang: ja }
        - { id: e7c, text: 聞いてながら, lang: ja }
        - { id: h4b, text: 聞きたながら, lang: ja }
    answer:
      correct_option_id: r5t
    explanation:
      vi: ながら gắn vào gốc ます - 聞きます → 聞きながら.
    display_answer: 聞きながら

