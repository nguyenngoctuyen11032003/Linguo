key: ja:lesson:n4-toki-nagara
order_index: 2
level: n4
title:
  vi: Khi và vừa - とき, ながら
objectives:
  - vi: Nói "khi …" bằng とき sau động từ, tính từ và danh từ.
  - vi: Nói "vừa … vừa …" bằng Vます-gốc + ながら.
  - vi: Kể chuyện đi tham quan, lạc đường, ngắm cảnh.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:n4-before-after]
items:
  - item: ja:item:n4-gram-toki
  - item: ja:item:n4-gram-nagara
  - item: ja:item:n4-kankou
