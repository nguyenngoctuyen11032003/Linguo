  - key: ja:exercise:n4-tkn-fill-child
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-toki
    prompt:
      template: "Hồi nhỏ, tôi hay bơi ở biển. - 子ども{{b1}}とき、よく海で泳ぎました。"
      blanks:
        - { id: b1, width_hint: 1 }
      hint_levels:
        - 子ども là danh từ.
        - Danh từ nối với とき bằng một trợ từ.
    answer:
      blanks:
        b1: [の]
    known_wrong:
      - answer: な
        feedback_vi: な dành cho tính từ đuôi な. Danh từ dùng の.
        error_tag: toki_form
      - answer: だ
        feedback_vi: Danh từ + の + とき.
        error_tag: toki_form
    explanation:
      vi: Danh từ + の + とき - 子どものとき (hồi còn nhỏ).
    display_answer: 子どものとき、よく海で泳ぎました。

  # ---------------- recall ----------------
  - key: ja:exercise:n4-tkn-fill-keshiki
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-keshiki
    prompt:
      template: "Tôi vừa ngắm cảnh vừa ăn cơm hộp. - 景色を{{b1}}、お弁当を食べました。"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [見ながら, みながら]
    known_wrong:
      - answer: 見るながら
        feedback_vi: ながら gắn vào gốc ます - 見ます → 見ながら.
        error_tag: nagara_form
      - answer: 見て
        feedback_vi: 見て là "xem rồi" (nối tiếp), không phải "vừa xem vừa".
        error_tag: nagara_form
    explanation:
      vi: 見ます → 見ながら; việc chính 食べました ở cuối.
    display_answer: 景色を見ながら、お弁当を食べました。

  - key: ja:exercise:n4-tkn-translate-map
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-chizu
    prompt:
      source_text: Khi không biết đường, tôi dùng bản đồ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 道がわからないとき、地図を使います。
        - 道がわからないとき地図を使います。
        - みちがわからないとき、ちずをつかいます。
        - 道が分からないとき、地図を使います。
        - 道がわからない時、地図を使います。
        - 道が分からない時、地図を使います。
        - 道がわからないときは、地図を使います。
        - 道がわからないとき、地図を見ます。
        - 道が分からないとき、地図を見ます。
    known_wrong:
      - answer: 道がわからなかったとき、地図を使います。
        feedback_vi: Thói quen chung dùng わからないとき (hiện tại).
        error_tag: toki_form
      - answer: 道をわからないとき、地図を使います。
        feedback_vi: わかる đi với が - 道がわからない.
        error_tag: particle_ga_wakaru
    explanation:
      vi: わからない (thể thường phủ định) + とき; 地図を使います - dùng bản đồ.
    display_answer: 道がわからないとき、地図を使います。

  - key: ja:exercise:n4-tkn-fill-kankou
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-kankou
    prompt:
      template: "Khi đi tham quan Nara, tôi đã cho hươu ăn. - 奈良を{{b1}}とき、鹿にえさをあげました。"
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [観光した, かんこうした]
    known_wrong:
      - answer: 観光する
        feedback_vi: Việc cho hươu ăn xảy ra khi đang ở Nara (đã đến nơi) - dùng 観光したとき.
        error_tag: toki_tense
      - answer: 観光の
        feedback_vi: Đã có tân ngữ 奈良を nên cần động từ - 観光したとき.
        error_tag: toki_form
    explanation:
      vi: Việc ở vế sau xảy ra khi đã đến và đang tham quan nên dùng 観光したとき.
    display_answer: 奈良を観光したとき、鹿にえさをあげました。

