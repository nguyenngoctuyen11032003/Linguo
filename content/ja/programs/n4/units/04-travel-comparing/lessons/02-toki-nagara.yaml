  - key: ja:exercise:n4-tkn-order-stroll
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-gram-nagara
    prompt:
      instruction: 'Sắp xếp thành câu: "Lúc rảnh, tôi vừa xem bản đồ vừa đi dạo phố."'
      tokens:
