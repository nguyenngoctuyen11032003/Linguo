    item: ja:item:n4-mayou
    prompt:
      audio_asset_id: null
      fallback_text: 道に迷ったとき、駅員さんに聞きました。
      options:
        - { id: a8u, text: "Khi bị lạc đường, tôi đã hỏi nhân viên nhà ga.", lang: vi }
        - { id: q2z, text: "Khi bị lạc đường, nhân viên nhà ga đã hỏi tôi.", lang: vi }
        - { id: d6l, text: "Khi đến ga, tôi đã hỏi đường.", lang: vi }
