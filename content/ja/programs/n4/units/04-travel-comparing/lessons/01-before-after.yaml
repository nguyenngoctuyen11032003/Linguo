key: ja:lesson:n4-before-after
order_index: 1
level: n4
title:
  vi: Trước và sau - 前に, 後で, てから
objectives:
  - vi: Nói "trước khi" bằng V辞書形 / Nの + 前に.
  - vi: Nói "sau khi" bằng V-た / Nの + 後で.
  - vi: Nhấn mạnh thứ tự "làm xong rồi mới" bằng V-てから.
estimated_minutes: 15
skills: [grammar, vocabulary, listening, writing]
prerequisites: [ja:lesson:n4-hobbies-appointments-review]
items:
  - item: ja:item:n4-gram-mae-ni
  - item: ja:item:n4-gram-ato-de
