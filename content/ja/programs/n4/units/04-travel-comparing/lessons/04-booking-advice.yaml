key: ja:lesson:n4-booking-advice
order_index: 4
level: n4
title:
  vi: Đặt phòng và lời khuyên - たほうがいい, ておく
objectives:
  - vi: Khuyên nên / không nên bằng V-た / V-ない + ほうがいいです.
  - vi: Nói chuẩn bị sẵn bằng V-ておきます.
  - vi: Đặt phòng, hỏi giờ nhận phòng và hủy đặt chỗ.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:n4-comparing]
items:
  - item: ja:item:n4-gram-ta-hou-ga-ii
  - item: ja:item:n4-gram-te-oku
  - item: ja:item:n4-yoyaku
