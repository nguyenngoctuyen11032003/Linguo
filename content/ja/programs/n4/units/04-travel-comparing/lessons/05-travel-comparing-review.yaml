  - key: ja:exercise:n4-tcr-mcq-ki-ni-iru
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-ki-ni-iru
    prompt:
      stem: '"Tôi rất ưng lữ quán đó." Chọn câu đúng.'
      stem_lang: vi
      options:
        - { id: r5t, text: その旅館がとても気に入りました。, lang: ja }
        - { id: y1n, text: その旅館がとても気に入れました。, lang: ja }
        - { id: e7c, text: その旅館がとても気に入ていました。, lang: ja }
        - { id: h4b, text: その旅館がとても気が入りました。, lang: ja }
    answer:
      correct_option_id: r5t
    explanation:
      vi: 気に入る - 入る chia nhóm 1 → 気に入りました. Trợ từ trong cụm cố định là 気に.
    display_answer: その旅館がとても気に入りました。

  - key: ja:exercise:n4-tcr-fill-before
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-te-oku
    prompt:
      template: "Trước khi đi Kyoto, tôi đã đặt sẵn lữ quán. - 京都へ行く前に、旅館を予約して{{b1}}。"
      blanks:
        - { id: b1, width_hint: 5 }
      hint_levels:
        - Làm sẵn để chuẩn bị - mẫu ておく.
        - Quá khứ lịch sự của おく.
    answer:
      blanks:
        b1: [おきました]
    known_wrong:
      - answer: 置きました
        feedback_vi: ておく viết bằng hiragana - おきました.
        error_tag: te_oku
      - answer: おきます
        feedback_vi: Việc đã làm xong trước chuyến đi - dùng quá khứ おきました.
        error_tag: tense_past
    explanation:
      vi: 予約しておきました - đã đặt sẵn. 前に đi với 行く (thể từ điển).
    display_answer: 京都へ行く前に、旅館を予約しておきました。

  # ---------------- recall ----------------
  - key: ja:exercise:n4-tcr-fill-temple
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-nagara
    prompt:
      template: "Sau khi đến nơi, tôi vừa xem bản đồ vừa tham quan chùa. - 着いた後で、地図を{{b1}}お寺を観光しました。"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [見ながら, みながら]
    known_wrong:
      - answer: 見るながら
        feedback_vi: ながら gắn vào gốc ます - 見ながら.
        error_tag: nagara_form
      - answer: 見たながら
        feedback_vi: ながら không mang thì - 見ながら.
        error_tag: nagara_form
    explanation:
      vi: 見ます → 見ながら; thì quá khứ nằm ở 観光しました.
    display_answer: 着いた後で、地図を見ながらお寺を観光しました。

  - key: ja:exercise:n4-tcr-translate-best
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-ichiban
    prompt:
      source_text: Trong chuyến đi, bạn thích nơi nào nhất?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 旅行の中で、どこが一番好きでしたか。
        - 旅行の中でどこが一番好きでしたか。
        - りょこうのなかで、どこがいちばんすきでしたか。
        - 旅行の中で、どこが一番好きですか。
        - 旅行の中で、どこが一番よかったですか。
        - 旅行の中で、どこが一番気に入りましたか。
        - 旅行で、どこが一番好きでしたか。
        - 旅行で、どこが一番よかったですか。
        - 旅行で行った所の中で、どこが一番好きでしたか。
        - 旅行で行ったところの中で、どこが一番好きでしたか。
    known_wrong:
      - answer: 旅行の中で、どちらが一番好きでしたか。
        feedback_vi: どちら chỉ dùng cho hai thứ. Nhiều nơi dùng どこ.
        error_tag: question_word
      - answer: 旅行の中で、どこを一番好きでしたか。
        feedback_vi: 好き đi với が - どこが.
        error_tag: particle_ga_suki
    explanation:
      vi: Nの中で + どこが一番～ - nơi nào nhất. Hỏi về chuyến đi đã qua có thể dùng 好きでしたか / よかったですか.
    display_answer: 旅行の中で、どこが一番好きでしたか。

  - key: ja:exercise:n4-tcr-fill-advice
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-ta-hou-ga-ii
    prompt:
      template: "Lữ quán đó rất được ưa chuộng nên bạn nên đặt sớm. - あの旅館は人気があるから、早く{{b1}}ほうがいいです。"
      blanks:
        - { id: b1, width_hint: 4 }
    answer:
      blanks:
        b1: [予約した, よやくした]
    known_wrong:
      - answer: 予約して
        feedback_vi: Trước ほうがいい dùng thể た - 予約した.
        error_tag: hou_ga_ii_form
      - answer: 予約しない
        feedback_vi: しないほうがいい là "không nên đặt" - ngược nghĩa.
        error_tag: negation
    explanation:
      vi: 予約する → 予約した + ほうがいいです - nên đặt.
    display_answer: あの旅館は人気があるから、早く予約したほうがいいです。

  # ---------------- application ----------------
  - key: ja:exercise:n4-tcr-translate-story
    type: translate
    stage: application
    answer_lang: vi
