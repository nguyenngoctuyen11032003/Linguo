title:
  vi: Ôn tập - lên kế hoạch và kể lại chuyến đi
objectives:
  - vi: Phối hợp so sánh, lời khuyên và chuẩn bị sẵn khi lên kế hoạch du lịch.
  - vi: Kể lại chuyến đi bằng 前に, 後で, とき, ながら.
  - vi: Hỏi gợi ý và nói cảm nghĩ về chuyến đi.
estimated_minutes: 15
skills: [grammar, reading, speaking, writing]
prerequisites: [ja:lesson:n4-booking-advice]
