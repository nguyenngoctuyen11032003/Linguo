      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đã đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh, nên tôi đã đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh, nên tôi đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh hơn nên tôi đã đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh hơn nên tôi đi Shinkansen.
        - Tàu Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đã đi tàu Shinkansen.
        - Tàu Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đi tàu Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng vì nhanh nên tôi đã đi Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng vì nhanh nên tôi đi bằng Shinkansen.
        - Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đã đi bằng Shinkansen.
        - Tàu cao tốc đắt hơn xe buýt nhưng nhanh nên tôi đã đi tàu cao tốc.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Xe buýt đắt hơn Shinkansen nhưng nhanh nên tôi đã đi xe buýt.
        feedback_vi: より đứng sau cái đem ra so - Shinkansen mới là cái đắt hơn.
        error_tag: comparison
      - answer: Shinkansen rẻ hơn xe buýt và nhanh nên tôi đã đi Shinkansen.
        feedback_vi: 高い là đắt.
        error_tag: vocab_meaning
    explanation:
      vi: バスより高い - đắt hơn xe buýt; 速いので - vì nhanh; 新幹線で行きました - đã đi bằng Shinkansen.
    display_answer: Shinkansen đắt hơn xe buýt nhưng nhanh nên tôi đã đi Shinkansen.

  - key: ja:exercise:n4-tcr-order-when
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-gram-toki
    prompt:
      instruction: 'Sắp xếp thành câu: "Khi đi Kyoto, tôi đã mặc kimono."'
      tokens:
        - { id: t-kimashita, text: 着ました }
        - { id: t-kimono, text: 着物を }
        - { id: t-itta, text: 京都へ行ったとき、 }
        - { id: t-iku, text: 京都へ行くとき、 }
    answer:
      orders:
        - [t-itta, t-kimono, t-kimashita]
    explanation:
      vi: Mặc kimono khi đã ở Kyoto nên dùng 行ったとき. 行くとき là lúc đang trên đường, chưa tới.
    display_answer: 京都へ行ったとき、着物を着ました。

  - key: ja:exercise:n4-tcr-mcq-recommend
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-phrase-osusume
    prompt:
      stem: 'Khách hỏi bạn: この町のおすすめは何ですか。 Bạn muốn giới thiệu chợ buổi sáng. Trả lời thế nào?'
      stem_lang: vi
      options:
        - { id: v4x, text: 朝市がおすすめです。, lang: ja }
        - { id: j7r, text: 朝市をおすすめは何ですか。, lang: ja }
        - { id: c1o, text: 朝市に行かないほうがいいです。, lang: ja }
        - { id: n5g, text: 朝市が気に入りました。, lang: ja }
    answer:
      correct_option_id: v4x
    explanation:
      vi: Trả lời gợi ý - ～がおすすめです. 気に入りました là kể mình đã ưng, không phải gợi ý cho khách.
    display_answer: 朝市がおすすめです。

  - key: ja:exercise:n4-tcr-translate-diary
    type: translate
    stage: application
    answer_lang: ja
    difficulty: 4
    item: ja:item:n4-gram-mae-ni
    prompt:
      source_text: Trước khi ngủ, tôi đã vừa nghe nhạc vừa viết nhật ký.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 寝る前に、音楽を聞きながら日記を書きました。
        - 寝る前に音楽を聞きながら日記を書きました。
        - ねるまえに、おんがくをききながらにっきをかきました。
        - 寝る前に、音楽を聞きながら、日記を書きました。
        - 寝る前に、音楽を聴きながら日記を書きました。
        - 寝る前に、音楽を聴きながら、日記を書きました。
        - 寝る前に、音楽を聞きながら日記を書いた。
    known_wrong:
      - answer: 寝た前に、音楽を聞きながら日記を書きました。
        feedback_vi: Trước 前に luôn là thể từ điển - 寝る前に.
        error_tag: mae_ni_form
      - answer: 寝る前に、音楽を聞くながら日記を書きました。
        feedback_vi: ながら gắn vào gốc ます - 聞きながら.
        error_tag: nagara_form
    explanation:
      vi: 寝る前に - trước khi ngủ; 聞きながら - vừa nghe; 日記を書きました - (việc chính) đã viết nhật ký.
    display_answer: 寝る前に、音楽を聞きながら日記を書きました。
