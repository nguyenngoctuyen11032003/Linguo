          - t3
          - t4
    explanation:
      vi: Dụng cụ (掃除機で) → đối tượng (部屋を) → きれいにします (làm cho sạch).
    display_answer: 掃除機で部屋をきれいにします。
  - key: ja:exercise:n4-housework-h11
