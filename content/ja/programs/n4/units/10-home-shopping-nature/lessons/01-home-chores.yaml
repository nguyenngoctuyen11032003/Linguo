    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u10-futon
    prompt:
      stem: Người Nhật hay dùng gì để ngủ ở nhà kiểu truyền thống?
      stem_lang: vi
      options:
        - id: gc9
          text: 布団
          lang: ja
        - id: ejy
          text: 食器
          lang: ja
        - id: wbv
          text: ごみ
          lang: ja
        - id: aqe
          text: 電子レンジ
          lang: ja
    answer:
      correct_option_id: gc9
    explanation:
      vi: 布団 là nệm, chăn kiểu Nhật. 食器 là bát đĩa, 電子レンジ là lò vi sóng, ごみ là rác.
    display_answer: 布団
