  - key: ja:exercise:n4-shopping-s8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u10-shichaku
    prompt:
      source_text: Tôi mặc thử được không ạ?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 試着してもいいですか。
        - しちゃくしてもいいですか。
        - 試着してもいいでしょうか。
        - 試着できますか。
        - 試着してもよろしいですか。
    known_wrong:
      - answer: 試着をいいですか。
        feedback_vi: Mẫu xin phép dùng ～てもいいですか.
