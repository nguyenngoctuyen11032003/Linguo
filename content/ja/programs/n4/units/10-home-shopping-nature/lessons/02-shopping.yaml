          lang: vi
        - id: bvj
          text: Bạn có cần túi không?
          lang: vi
    answer:
      correct_option_id: bvj
    explanation:
      vi: 袋 là túi; いりますか - có cần không. Hoá đơn là 領収書, mặc thử là 試着.
    display_answer: Bạn có cần túi không?
