    display_answer: 試着してもいいですか。
  - key: ja:exercise:n4-shopping-s9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u10-henpin
    prompt:
      source_text: サイズが合わなかったので、返品しました。領収書があったので、お金が戻りました。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Vì cỡ không vừa nên tôi đã trả hàng. Vì có hoá đơn nên tôi đã được hoàn tiền.
        - Cỡ không vừa nên tôi trả hàng. Có hoá đơn nên đã nhận lại tiền.
        - Do cỡ không vừa tôi đã trả lại hàng. Vì có hoá đơn nên tiền được hoàn lại.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Vì cỡ vừa nên tôi đã mua. Vì không có hoá đơn nên tôi không được hoàn tiền.
        feedback_vi: 合わなかった là không vừa; 返品 là trả hàng.
        error_tag: meaning
    explanation:
      vi: 合わなかった - không vừa; 返品 - trả hàng; 領収書 - hoá đơn; お金が戻りました - tiền được hoàn lại.
    display_answer: Vì cỡ không vừa nên tôi đã trả hàng. Vì có hoá đơn nên tôi đã được hoàn tiền.
