body:
  - type: objective
    text:
      vi: Sau bài này, bạn mua sắm tự tin ở Nhật - 試着してもいいですか。もう少し大きいサイズはありますか。レジで現金で払います。
  - type: explain
    text:
      vi: Giá cả - 割引 (giảm giá), セール (đợt hạ giá), 現金 (tiền mặt), お釣り (tiền thối), 領収書 (hoá đơn), 袋 (túi). Quần áo - サイズ (cỡ), 試着 (mặc thử). Thanh toán ở レジ (quầy thu ngân).
  - type: explain
    text:
      vi: Hỏi và nhờ - 試着してもいいですか (Tôi mặc thử được không?), もう少し大きいサイズはありますか (Có cỡ lớn hơn không?), 袋をください (Cho tôi túi), 領収書をお願いします (Cho tôi hoá đơn).
  - type: explain
    text:
      vi: Trả hàng - 返品する. Cửa hàng Nhật thường yêu cầu giữ hoá đơn và chỉ cho đổi trong thời hạn quy định. Học sinh, sinh viên thường được 割引 - 学生割引があります.
  - type: deep_explain
    text:
      vi: Các mẫu hội thoại cửa hàng hay có - 袋はいりますか。 (Bạn có cần túi không?) - はい、お願いします / いいえ、大丈夫です. お釣りは二百円です - tiền thối 200 yên. サイズ trong tiếng Nhật dùng katakana cho quần áo (S, M, L). Chữ Hán - 割引, 袋, 試着, 現金, 返品, 領収書, お釣り.
  - type: example
    target: 試着してもいいですか。- はい、どうぞ。
    target_lang: ja
    translation:
      vi: Tôi mặc thử được không ạ? - Vâng, xin mời.
    note:
      vi: 試着 - mặc thử.
  - type: example
    target: もう少し大きいサイズはありますか。
    target_lang: ja
    translation:
      vi: Có cỡ lớn hơn chút không?
    note:
      vi: サイズ - cỡ.
  - type: example
    target: 学生割引があるので、千円安くなります。
    target_lang: ja
    translation:
      vi: Vì có giảm giá cho sinh viên nên rẻ đi 1.000 yên.
    note:
      vi: 割引 - giảm giá.
  - type: example
    target: 現金で払うと、お釣りは二百円です。
    target_lang: ja
    translation:
      vi: Trả bằng tiền mặt thì tiền thối là 200 yên.
    note:
      vi: 現金・お釣り.
  - type: common_mistake
    wrong: レジで試着します。
    right: 試着室で試着します。
    target_lang: ja
    note:
      vi: Mặc thử ở phòng thử đồ (試着室); レジ là quầy thu ngân.
  - type: common_mistake
    wrong: お釣りをください。(muốn xin hoá đơn)
    right: 領収書をください。
    target_lang: ja
    note:
      vi: Hoá đơn là 領収書; お釣り là tiền thối.
  - type: summary
    points:
      - vi: 割引 giảm giá · セール hạ giá · 現金 tiền mặt · お釣り tiền thối · 領収書 hoá đơn · 袋 túi.
      - vi: サイズ cỡ · 試着 mặc thử · レジ quầy thu ngân · 返品 trả hàng.
      - vi: 試着してもいいですか。
      - vi: もう少し大きいサイズはありますか。
exercises:
