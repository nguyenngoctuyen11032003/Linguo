    explanation:
      vi: 試着 là mặc thử. 返品 là trả hàng, 割引 là giảm giá, 現金 là tiền mặt - đều không hợp.
    display_answer: 試着してもいいですか。
  - key: ja:exercise:n4-shopping-s2
