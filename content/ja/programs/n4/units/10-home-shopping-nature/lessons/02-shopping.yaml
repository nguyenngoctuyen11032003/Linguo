    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-saizu
    prompt:
      template: もう少し大きい{{b1}}はありますか。 (Có cỡ lớn hơn chút không?)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Katakana, nghĩa là cỡ.
        - Bắt đầu bằng サ.
    answer:
      blanks:
        b1:
          - サイズ
    known_wrong:
      - answer: セール
        feedback_vi: セール là đợt giảm giá; cỡ quần áo là サイズ.
        error_tag: vocab_meaning
    explanation:
      vi: サイズ là cỡ quần áo.
    display_answer: もう少し大きいサイズはありますか。
