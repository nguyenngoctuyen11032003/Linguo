    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-shichaku
    prompt:
      stem: Bạn muốn mặc thử áo. Câu nào đúng?
      stem_lang: vi
      options:
        - id: t5v
          text: 返品してもいいですか。
          lang: ja
        - id: jdf
          text: 現金してもいいですか。
          lang: ja
        - id: o4i
          text: 割引してもいいですか。
          lang: ja
        - id: ilp
          text: 試着してもいいですか。
