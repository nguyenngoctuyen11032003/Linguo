        error_tag: transitivity
      - answer: 日にちが決めました。
        feedback_vi: 決める là tha động từ cần を.
        error_tag: transitivity
    explanation:
      vi: 日にちが決まる - ngày được định.
    display_answer: 日にちが決まりました。
  - key: ja:exercise:n4-verb-pairs-v9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u10-atsumaru-atsumeru
    prompt:
      source_text: 切手を集めています。みんなが集まったら、見せます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tôi đang sưu tập tem. Khi mọi người tập trung, tôi sẽ cho xem.
        - Tôi sưu tầm tem. Khi mọi người đã đến đủ thì tôi cho xem.
        - Tôi đang thu thập tem. Khi mọi người tụ lại tôi sẽ cho xem.
