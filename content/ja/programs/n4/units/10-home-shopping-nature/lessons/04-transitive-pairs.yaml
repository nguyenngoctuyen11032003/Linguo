      options:
        - id: zh7
          text: Chìa khoá bị mất. May quá.
          lang: vi
        - id: uh9
          text: Tôi tìm thấy chìa khoá hôm qua. Rất vui.
          lang: vi
        - id: zj3
          text: Tôi làm mất chìa khoá. Tiếc quá.
          lang: vi
        - id: tiq
