      diacritics: lenient
    known_wrong:
      - answer: Tôi đang bán tem. Khi mọi người tập trung, tôi sẽ cho xem.
        feedback_vi: 集める là sưu tập, không phải bán.
        error_tag: meaning
    explanation:
      vi: 切手を集める - sưu tập tem (tha động từ); みんなが集まる - mọi người tụ lại (tự động từ).
    display_answer: Tôi đang sưu tập tem. Khi mọi người tập trung, tôi sẽ cho xem.
