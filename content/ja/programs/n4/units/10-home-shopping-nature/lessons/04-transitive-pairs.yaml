title:
  vi: Tự động từ và tha động từ - 止まる・止める
objectives:
  - vi: "Phân biệt từng cặp tự động từ / tha động từ: 止まる / 止める, 集まる / 集める, 決まる / 決める."
  - vi: "Chọn trợ từ đúng: が với tự động từ, を với tha động từ."
  - vi: Dùng các cặp 見つかる / 見つける, 治る / 治す, 割れる / 割る, 落ちる / 落とす.
estimated_minutes: 17
skills:
