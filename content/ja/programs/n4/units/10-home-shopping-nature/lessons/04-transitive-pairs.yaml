          lang: vi
    answer:
      correct_option_id: tiq
    explanation:
      vi: 見つかる là tự động từ - chìa khoá "được tìm thấy"; よかった - may quá.
    display_answer: Chìa khoá đã được tìm thấy. May quá.
  - key: ja:exercise:n4-verb-pairs-v4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-tomaru-tomeru
    prompt:
      template: 電車が{{b1}}。 (Tàu đã dừng.)
      blanks:
        - id: b1
          width_hint: 7
      hint_levels:
        - Tự động từ - tàu tự dừng.
        - Bắt đầu bằng 止.
    answer:
      blanks:
        b1:
          - 止まりました
          - とまりました
    known_wrong:
      - answer: 止めました
        feedback_vi: 止める là tha động từ (làm cho dừng); chủ ngữ là tàu nên dùng 止まる.
        error_tag: transitivity
    explanation:
      vi: 止まる - dừng (tự dừng).
    display_answer: 電車が止まりました。
  - key: ja:exercise:n4-verb-pairs-v5
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-wareru-waru
    prompt:
      stem: Bạn làm vỡ cốc. Câu nào đúng?
      stem_lang: vi
      options:
        - id: djm
          text: コップが割りました。
          lang: ja
        - id: zoq
          text: コップを割れました。
          lang: ja
        - id: qjr
          text: コップを割りました。
          lang: ja
        - id: ile
          text: コップが割ります。
          lang: ja
    answer:
      correct_option_id: qjr
    explanation:
      vi: 割る là tha động từ - làm vỡ, đi với を. 割れる (tự vỡ) đi với が.
    display_answer: コップを割りました。
  - key: ja:exercise:n4-verb-pairs-v6
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u10-ochiru-otosu
    prompt:
      template: 財布を{{b1}}。 (Tôi đã làm rơi ví.)
      blanks:
        - id: b1
          width_hint: 7
    answer:
