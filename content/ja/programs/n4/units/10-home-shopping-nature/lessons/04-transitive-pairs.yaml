    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-kimaru-kimeru
    prompt:
      stem: Chọn câu đúng - 日にち___決めます。
      stem_lang: vi
      options:
        - id: nql
          text: を
          lang: ja
        - id: ggy
          text: が
          lang: ja
        - id: gr0
          text: で
          lang: ja
        - id: awe
          text: に
          lang: ja
    answer:
      correct_option_id: nql
    explanation:
      vi: 決める là tha động từ nên tân ngữ đi với を. 決まる mới đi với が.
    display_answer: を
  - key: ja:exercise:n4-verb-pairs-v3
