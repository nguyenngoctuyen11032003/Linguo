body:
  - type: objective
    text:
      vi: Sau bài này, bạn chọn đúng giữa tự động từ và tha động từ - 電車が止まりました。 / 私は車を止めました。 - dựa vào trợ từ が và を.
  - type: explain
    text:
      vi: Nhiều động từ tiếng Nhật đi thành cặp - tự động từ (自動詞, sự việc tự xảy ra, chủ ngữ + が) và tha động từ (他動詞, có người làm, tân ngữ + を). Ví dụ 電車が止まる (tàu dừng) ↔ 車を止める (dừng xe).
  - type: explain
    text:
      vi: Cách nhớ - tự động từ nhấn kết quả, trạng thái ("cửa mở" - ドアが開く); tha động từ nhấn người làm ("tôi mở cửa" - ドアを開ける). Các cặp ở bài này - 止まる/止める, 集まる/集める, 決まる/決める, 見つかる/見つける, 治る/治す, 割れる/割る, 切れる/切る, 落ちる/落とす, 上がる/上げる, 変わる/変える.
  - type: explain
    text:
      vi: Mẫu hay dùng - 日にちが決まりました (ngày đã được định) / 日にちを決めます (tôi quyết định ngày). かぎが見つかりました (chìa khoá đã được tìm thấy) / かぎを見つけました (tôi tìm thấy chìa khoá).
  - type: deep_explain
    text:
      vi: 'Một số cặp có hình thức giống nhau và dễ nhầm - 治る/治す (bệnh khỏi / chữa) khác 直る/直す (sửa, hỏng được sửa) cùng cách đọc. 落ちる/落とす: 財布が落ちた (ví rơi) vs 財布を落とした (làm rơi ví - cũng thường dùng khi bị mất). Khi hỏi người ngoài, hay dùng tự động từ để tránh nói rằng mình làm ra - 電池が切れました (pin hết) thay vì "tôi làm hết pin".'
  - type: example
    target: 電車が止まりました。
    target_lang: ja
    translation:
      vi: Tàu đã dừng.
    note:
      vi: Tự động từ + が.
  - type: example
    target: 私は駅の前で車を止めました。
    target_lang: ja
    translation:
      vi: Tôi dừng xe trước ga.
    note:
      vi: Tha động từ + を.
  - type: example
    target: みんなが集まったら、始めましょう。
    target_lang: ja
    translation:
      vi: Khi mọi người tập trung đủ thì bắt đầu nhé.
    note:
      vi: 集まる - tập trung.
  - type: example
    target: 財布を落としましたが、かぎは見つかりました。
    target_lang: ja
    translation:
      vi: Tôi làm rơi ví nhưng chìa khoá đã được tìm thấy.
    note:
      vi: 落とす / 見つかる.
  - type: common_mistake
    wrong: 電車を止まりました。
    right: 電車が止まりました。
    target_lang: ja
    note:
      vi: Tự động từ đi với が, không dùng を.
  - type: common_mistake
    wrong: 日にちが決めました。
    right: 日にちを決めました。 / 日にちが決まりました。
    target_lang: ja
    note:
      vi: Tha động từ 決める cần を; tự động từ 決まる đi với が.
  - type: summary
    points:
      - vi: "Tự động từ + が: 止まる · 集まる · 決まる · 見つかる · 治る · 割れる · 切れる · 落ちる · 上がる · 変わる."
      - vi: "Tha động từ + を: 止める · 集める · 決める · 見つける · 治す · 割る · 切る · 落とす · 上げる · 変える."
      - vi: Ví dụ - 日にちが決まりました / 日にちを決めます.
      - vi: 治る/治す (bệnh) ≠ 直る/直す (sửa).
exercises:
  - key: ja:exercise:n4-verb-pairs-v1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-tomaru-tomeru
    prompt:
      stem: Chọn câu đúng - 電車___止まりました。
      stem_lang: vi
      options:
        - id: n4l
          text: を
          lang: ja
        - id: t4e
          text: に
          lang: ja
        - id: ic9
          text: が
          lang: ja
        - id: cc2
          text: で
          lang: ja
    answer:
      correct_option_id: ic9
    explanation:
      vi: 止まる là tự động từ nên chủ ngữ đi với が. を dùng với tha động từ 止める.
    display_answer: が
