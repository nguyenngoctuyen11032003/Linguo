      source_text: 今日の気温は三十五度です。雷も鳴っています。台風が来るかもしれません。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Nhiệt độ hôm nay là 35 độ. Sấm cũng đang nổ. Có thể bão sắp đến.
        - Hôm nay nhiệt độ 35 độ. Cũng có sấm. Có thể có bão.
        - Nhiệt độ hôm nay là 35 độ, sấm đang nổ, có thể bão sẽ tới.
    rubric:
