  - key: ja:exercise:n4-disasters-d4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u10-sonaeru
    prompt:
      template: 地震に{{b1}}、水を用意します。 (Để phòng động đất, tôi chuẩn bị nước.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Động từ nghĩa "chuẩn bị phòng khi".
        - Bắt đầu bằng 備.
    answer:
      blanks:
        b1:
          - 備えて
          - そなえて
    known_wrong:
      - answer: 防いで
        feedback_vi: 防ぐ là ngăn chặn (ngăn tai nạn xảy ra); "chuẩn bị phòng khi" là 備える.
        error_tag: verb_choice
    explanation:
      vi: 備える - chuẩn bị phòng khi.
    display_answer: 地震に備えて、水を用意します。
