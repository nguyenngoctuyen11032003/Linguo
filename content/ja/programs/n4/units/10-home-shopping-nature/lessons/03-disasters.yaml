  - key: ja:exercise:n4-disasters-d8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u10-sonaeru
    prompt:
      source_text: Để phòng động đất, tôi chuẩn bị nước và đồ ăn.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 地震に備えて、水と食べ物を用意します。
        - じしんにそなえて、みずとたべものをようい します。
        - 地震に備えて、水と食べ物を準備します。
        - 地震に備えて水と食べ物を用意します。
    known_wrong:
      - answer: 地震を備えて、水と食べ物を用意します。
        feedback_vi: "備える đi với に: 地震に備えて."
        error_tag: particle_ni_wo
    explanation:
      vi: N に備えて - để phòng N; 用意します - chuẩn bị.
    display_answer: 地震に備えて、水と食べ物を用意します。
  - key: ja:exercise:n4-disasters-d9
