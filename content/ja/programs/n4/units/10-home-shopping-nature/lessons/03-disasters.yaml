      vi: 気温 - nhiệt độ; 雷が鳴る - sấm nổ; 来るかもしれません - có thể sẽ đến.
    display_answer: Nhiệt độ hôm nay là 35 độ. Sấm cũng đang nổ. Có thể bão sắp đến.
