body:
  - type: objective
    text:
      vi: Sau bài này, bạn hiểu thông báo thiên tai cơ bản - 台風が近づいています。 - và nói cách chuẩn bị - 地震に備えて、水を用意します。
  - type: explain
    text:
      vi: Thiên tai - 地震 (động đất), 台風 (bão), 洪水 (lũ lụt), 津波 (sóng thần), 雷 (sấm sét), 火事 (hoả hoạn). Hậu quả - 停電 (mất điện), 怪我 (bị thương). 揺れる (rung lắc) mô tả động đất.
  - type: explain
    text:
      vi: Nhật Bản có nhiều động đất và bão nên người dân luôn chuẩn bị - 備える (chuẩn bị phòng khi), 防ぐ (ngăn ngừa). Ví dụ 地震に備えて、水と食べ物を用意します; 事故を防ぐために、気をつけます.
  - type: explain
    text:
      vi: Thời tiết - 気温 (nhiệt độ không khí). Thông báo hay có - 台風が近づいています。外に出ないでください。 / 大きい地震がありました。津波に注意してください.
  - type: deep_explain
    text:
      vi: Cẩn thận 火事 (かじ, hoả hoạn) giống đọc 家事 (việc nhà). Khi nghe thông báo, hay gặp 注意 (chú ý), 避難 (sơ tán, đã học ở N3), 警報 (cảnh báo). Sau động đất người Nhật thường kiểm tra 津波 nếu ở gần biển. Từ 備える còn dùng trong 試験に備える (chuẩn bị cho kỳ thi).
  - type: example
    target: 昨日、大きい地震がありました。家が揺れました。
    target_lang: ja
    translation:
      vi: Hôm qua có trận động đất lớn. Nhà rung lắc.
    note:
      vi: 地震・揺れる.
  - type: example
    target: 台風で停電しました。
    target_lang: ja
    translation:
      vi: Vì bão nên bị mất điện.
    note:
      vi: 停電 - mất điện.
  - type: example
    target: 地震に備えて、水と食べ物を用意します。
    target_lang: ja
    translation:
      vi: Để phòng động đất, tôi chuẩn bị nước và đồ ăn.
    note:
      vi: 備える - chuẩn bị phòng khi.
  - type: example
    target: 転んで怪我をしました。
    target_lang: ja
    translation:
      vi: Tôi bị ngã và bị thương.
    note:
      vi: 怪我をする - bị thương.
  - type: common_mistake
    wrong: 地震が近づいています。
    right: 台風が近づいています。
    target_lang: ja
    note:
      vi: 近づく đi với bão (台風); động đất không "đến gần" trước mà xảy ra bất ngờ.
  - type: common_mistake
    wrong: 火事になりました。(việc nhà)
    right: 家事をしました。
    target_lang: ja
    note:
      vi: 火事 là hoả hoạn; việc nhà là 家事.
  - type: summary
    points:
      - vi: 地震 · 台風 · 洪水 · 津波 · 雷 · 火事.
      - vi: 停電 mất điện · 怪我 bị thương · 揺れる rung lắc.
      - vi: 備える chuẩn bị · 防ぐ ngăn ngừa · 気温 nhiệt độ.
      - vi: 火事 (hoả hoạn) ≠ 家事 (việc nhà).
exercises:
