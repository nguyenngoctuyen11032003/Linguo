    item: ja:item:n4-u6-gram-n-desu
    prompt:
      stem: Chọn câu đúng - 今日は行けません。実は、___。
      stem_lang: vi
      options:
        - id: t3g
          text: 用事がありますんです
          lang: ja
        - id: dxh
          text: 用事があるでんです
          lang: ja
        - id: lqk
          text: 用事があるんです
          lang: ja
