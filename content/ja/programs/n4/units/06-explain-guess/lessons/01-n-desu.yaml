  - key: ja:exercise:n4-n-desu-n7
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u6-gram-n-desu
    prompt:
      template: どうして遅れた{{b1}}ですか。 (Sao bạn đến muộn vậy?)
      blanks:
        - id: b1
          width_hint: 2
    answer:
      blanks:
        b1:
          - ん
    known_wrong:
      - answer: の
        feedback_vi: ん là dạng rút gọn của の trong んです; viết ですか sau ん, không dùng のんです.
        error_tag: form
    explanation:
      vi: 遅れたんですか - hỏi lý do với んです.
    display_answer: どうして遅れたんですか。
  - key: ja:exercise:n4-n-desu-n8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u6-gram-n-desu
    prompt:
      source_text: Xin lỗi, tôi bị đau bụng nên hôm nay nghỉ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - すみません、お腹が痛いんです。今日は休みます。
        - すみません、おなかがいたいんです。きょうはやすみます。
        - すみません、お腹が痛いので、今日は休みます。
        - すみません、おなかがいたいので、きょうはやすみます。
        - すみません、お腹が痛いんですが、今日は休みます。
    known_wrong:
      - answer: すみません、お腹が痛いですんです。今日は休みます。
        feedback_vi: んです không đi với です; dùng 痛いんです.
        error_tag: form
      - answer: すみません、お腹がいたいだんです。
        feedback_vi: Tính từ い + んです trực tiếp, không thêm だ.
        error_tag: form
    explanation:
      vi: お腹が痛いんです giải thích lý do; hoặc dùng ので nêu nguyên nhân.
    display_answer: すみません、お腹が痛いんです。今日は休みます。
  - key: ja:exercise:n4-n-desu-n9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u6-jitsuwa
    prompt:
      source_text: 実は、昨日財布を落としたんです。それで、お金がないんです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Thật ra hôm qua tôi làm rơi ví. Vì thế tôi không có tiền.
        - Nói thật là hôm qua tôi đánh rơi ví nên không có tiền.
        - Thật ra là hôm qua tôi bị rơi mất ví, cho nên tôi không còn tiền.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Thật ra hôm qua tôi nhặt được ví. Vì thế tôi có tiền.
        feedback_vi: 落とした là làm rơi, không phải nhặt.
        error_tag: meaning
    explanation:
      vi: 実は - thật ra; 落とした - đã làm rơi; それで - vì thế; んです giải thích lý do.
    display_answer: Thật ra hôm qua tôi làm rơi ví. Vì thế tôi không có tiền.
