          lang: ja
        - id: zwr
          text: すみません、駅へ行きたいんですが。
          lang: ja
        - id: v4n
          text: すみません、駅へ行きますんですが。
          lang: ja
        - id: teh
          text: すみません、駅へ行くなんですが。
          lang: ja
    answer:
      correct_option_id: zwr
    explanation:
      vi: ～たいんですが - muốn..., nhưng; thể thường たい + んです. Các dạng khác sai ngữ pháp.
    display_answer: すみません、駅へ行きたいんですが。
