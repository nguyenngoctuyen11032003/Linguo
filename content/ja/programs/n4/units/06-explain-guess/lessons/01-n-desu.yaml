order_index: 1
level: n4
title:
  vi: Giải thích lý do - ～んです・～んですが
objectives:
  - vi: Giải thích lý do và hoàn cảnh bằng thể thường + んです.
  - vi: Hỏi lý do mềm mỏng bằng どうして／なぜ ～んですか.
  - vi: Mở lời nhờ vả hay hỏi han bằng ～んですが.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - listening
prerequisites:
