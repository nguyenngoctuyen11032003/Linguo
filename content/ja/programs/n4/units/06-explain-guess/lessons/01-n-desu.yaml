body:
  - type: objective
    text:
      vi: Sau bài này, bạn giải thích được vì sao mình đến muộn hay không đi được - 電車が遅れたんです。 - và mở lời lịch sự bằng ちょっとお聞きしたいんですが。
  - type: explain
    text:
      vi: ～んです gắn vào thể thường (rút gọn của のです). Động từ và tính từ い giữ nguyên thể thường - 遅れたんです, 痛いんです, 行かないんです. Danh từ và tính từ な thêm な - 病気なんです, 暇なんです.
  - type: explain
    text:
      vi: Dùng ～んです khi muốn giải thích lý do hay hoàn cảnh. Hỏi lý do thân thiện - どうして遅れたんですか。 Câu trả lời cũng kết thúc bằng んです - 電車が止まったんです。 Dạng không んです (遅れました) chỉ nêu sự việc, không mang sắc thái giải thích.
  - type: explain
    text:
      vi: ～んですが mở lời trước khi nhờ hay hỏi - すみません、道を聞きたいんですが。 Đây là cách nói lịch sự và mềm hơn nói thẳng ～たいです. Vế sau (yêu cầu) thường được hiểu ngầm.
  - type: deep_explain
    text:
      vi: Lưu ý ba điểm. (1) Với danh từ hiện tại phải dùng なんです chứ không dùng だんです. (2) んです là khẩu ngữ; trong văn viết và thông báo người ta dùng のです. (3) Dùng quá nhiều んです nghe như đang bào chữa; câu hỏi thông tin thuần tuý như これはいくらですか không cần んです.
  - type: example
    target: どうして遅刻したんですか。- 電車が事故で止まったんです。
    target_lang: ja
    translation:
      vi: Sao bạn đến muộn vậy? - Vì tàu dừng do tai nạn.
    note:
      vi: Hỏi lý do và đáp lý do đều dùng んです.
  - type: example
    target: 頭が痛いんです。今日は帰ってもいいですか。
    target_lang: ja
    translation:
      vi: Tôi bị đau đầu. Hôm nay tôi về được không ạ?
    note:
      vi: 痛いんです - giải thích lý do xin về.
  - type: example
    target: すみません、ちょっとお聞きしたいんですが。
    target_lang: ja
    translation:
      vi: Xin lỗi, tôi muốn hỏi một chút.
    note:
      vi: ～んですが - mở lời.
  - type: example
    target: 実は、用事があるんです。
    target_lang: ja
    translation:
      vi: Thật ra là tôi có việc bận.
    note:
      vi: 実は + んです - thú nhận lý do.
  - type: common_mistake
    wrong: 今日は病気だんです。
    right: 今日は病気なんです。
    target_lang: ja
    note:
      vi: "Danh từ + んです phải dùng な: 病気なんです, không dùng だんです."
  - type: common_mistake
    wrong: どうして遅れましたんですか。
    right: どうして遅れたんですか。
    target_lang: ja
    note:
      vi: んです đi với thể thường (遅れた), không đi với thể ます.
  - type: summary
    points:
      - vi: Thể thường + んです - giải thích lý do, hoàn cảnh.
      - vi: Danh từ / tính từ な + なんです.
      - vi: ～んですが - mở lời nhờ, hỏi.
      - vi: どうしたんですか - hỏi khi thấy ai đó khác thường.
exercises:
  - key: ja:exercise:n4-n-desu-n1
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u6-gram-n-desu
    prompt:
      stem: Chọn câu đúng - 今日は休みます。___。
      stem_lang: vi
      options:
        - id: r95
          text: 頭が痛いんです
          lang: ja
        - id: o1y
          text: 頭が痛いですんです
          lang: ja
        - id: nwv
          text: 頭が痛いだんです
          lang: ja
        - id: vjg
          text: 頭が痛くなんです
          lang: ja
    answer:
      correct_option_id: r95
    explanation:
      vi: "Tính từ い + んです: 痛いんです. Thêm です trước んです hay dùng だ, な với tính từ い đều sai."
    display_answer: 頭が痛いんです
