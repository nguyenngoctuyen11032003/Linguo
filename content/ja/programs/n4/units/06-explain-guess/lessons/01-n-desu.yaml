  - key: ja:exercise:n4-n-desu-n4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u6-gram-n-desu
    prompt:
      template: 今日は休みます。病気{{b1}}です。 (Tôi nghỉ hôm nay. Tôi bị bệnh.)
      blanks:
        - id: b1
          width_hint: 2
      hint_levels:
        - Danh từ dùng な trước んです.
        - Một chữ - な.
    answer:
      blanks:
        b1:
          - な
    known_wrong:
      - answer: だ
        feedback_vi: "だんです là dạng sai; danh từ thêm な: 病気なんです."
        error_tag: na_form
      - answer: の
        feedback_vi: "Dạng ～のです cũng đúng nhưng trước の phải là な: 病気なのです."
        error_tag: na_form
    explanation:
      vi: Danh từ + な + んです - 病気なんです.
    display_answer: 今日は休みます。病気なんです。
  - key: ja:exercise:n4-n-desu-n5
