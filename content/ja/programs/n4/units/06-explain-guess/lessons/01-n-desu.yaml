    display_answer: すみません、ちょっとお聞きしたいんですが。
  - key: ja:exercise:n4-n-desu-n11
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u6-doushita-ndesuka
    prompt:
      stem: Bạn thấy đồng nghiệp trông rất mệt mỏi. Bạn hỏi gì tự nhiên nhất?
      stem_lang: vi
      options:
        - id: yei
          text: どうしましたんですか。
          lang: ja
        - id: wjz
          text: どうしたんですか。
          lang: ja
        - id: pju
          text: どうしたですか。
          lang: ja
        - id: tl6
          text: どうしたなんですか。
          lang: ja
    answer:
      correct_option_id: wjz
    explanation:
      vi: どうしたんですか - thể thường (した) + んですか. Các dạng khác sai về cách nối.
    display_answer: どうしたんですか。
