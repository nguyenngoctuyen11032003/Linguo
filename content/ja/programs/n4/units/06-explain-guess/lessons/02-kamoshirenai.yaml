  - key: ja:exercise:n4-kamoshirenai-k8
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-u6-gram-kamoshirenai
    prompt:
      source_text: Ngày mai có thể sẽ mưa.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - 明日は雨が降るかもしれません。
        - あしたはあめがふるかもしれません。
        - 明日は雨かもしれません。
        - あしたはあめかもしれません。
        - 明日、雨が降るかもしれません。
    known_wrong:
      - answer: 明日は雨が降るでしょうかもしれません。
        feedback_vi: Không dùng でしょう cùng かもしれません.
        error_tag: form
      - answer: 明日は雨だかもしれません。
        feedback_vi: 雨だかもしれません là sai.
        error_tag: na_form
    explanation:
      vi: ～かもしれません - có thể; 雨が降る - trời mưa.
    display_answer: 明日は雨が降るかもしれません。
  - key: ja:exercise:n4-kamoshirenai-k9
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: ja:item:n4-u6-zettai
    prompt:
      source_text: 絶対に行きません。でも、友達は来るかもしれません。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tôi tuyệt đối không đi. Nhưng bạn tôi có thể sẽ đến.
        - Tôi nhất định không đi. Nhưng có thể bạn tôi sẽ đến.
        - Tôi tuyệt đối sẽ không đi, nhưng biết đâu bạn tôi sẽ đến.
    rubric:
      diacritics: lenient
    known_wrong:
