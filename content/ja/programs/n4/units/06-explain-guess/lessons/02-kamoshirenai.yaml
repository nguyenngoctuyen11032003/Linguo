    prompt:
      stem: Bạn không chắc, chỉ thấy khả năng nhỏ. Từ nào hợp nhất? ___ 来ないかもしれません。
      stem_lang: vi
      options:
        - id: u9z
          text: 必ず
          lang: ja
        - id: h1p
          text: もしかしたら
          lang: ja
        - id: x49
          text: きっと
