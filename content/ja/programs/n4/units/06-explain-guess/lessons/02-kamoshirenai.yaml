        feedback_vi: でしょうか là câu hỏi; ở đây là câu khẳng định "có thể không đến".
        error_tag: form
    explanation:
      vi: ～ない + かもしれません - có thể không ...
    display_answer: 山田さんは来ないかもしれません。
  - key: ja:exercise:n4-kamoshirenai-k5
