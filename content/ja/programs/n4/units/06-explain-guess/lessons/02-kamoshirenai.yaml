title:
  vi: Phỏng đoán - ～かもしれません・でしょう・たぶん
objectives:
  - vi: Nói khả năng "có thể" bằng ～かもしれません.
  - vi: Dùng たぶん, きっと, かならず, ぜったい để thể hiện mức chắc chắn.
  - vi: "Nói về an toàn và nguy hiểm: 安全, 危険, 危ない."
estimated_minutes: 16
