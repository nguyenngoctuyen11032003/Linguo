    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u6-gram-kamoshirenai
    prompt:
      stem: Chọn câu đúng - 明日は___かもしれません。
      stem_lang: vi
      options:
        - id: dzx
          text: 雨の
          lang: ja
        - id: evb
          text: 雨
          lang: ja
        - id: brf
          text: 雨で
          lang: ja
        - id: mlh
          text: 雨だ
          lang: ja
    answer:
      correct_option_id: evb
    explanation:
      vi: Danh từ + かもしれません (không thêm だ). 雨だかもしれません là sai.
    display_answer: 雨
  - key: ja:exercise:n4-kamoshirenai-k2
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u6-kitto
    prompt:
      stem: Từ nào có nghĩa là “chắc chắn là” (mức rất chắc)?
      stem_lang: vi
      options:
        - id: qok
          text: きっと
          lang: ja
        - id: xl6
          text: たぶん
          lang: ja
        - id: jt0
          text: もしかしたら
          lang: ja
        - id: viz
          text: あまり
          lang: ja
    answer:
      correct_option_id: qok
    explanation:
      vi: きっと là chắc chắn. もしかしたら là biết đâu (thấp), たぶん là có lẽ (vừa), あまり + phủ định là "không...lắm".
    display_answer: きっと
