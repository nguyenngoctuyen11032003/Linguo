    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: ja:item:n4-u6-tabun
    prompt:
      audio_asset_id: null
      fallback_text: 明日はたぶん雨でしょう。かさを持っていきましょう。
      options:
        - id: nh3
          text: Ngày mai chắc chắn sẽ nắng. Không cần ô.
          lang: vi
        - id: f8f
          text: Ngày mai có thể có tuyết. Mang áo ấm.
          lang: vi
        - id: d6y
          text: Hôm qua có lẽ mưa. Tôi quên ô.
          lang: vi
        - id: od4
          text: Ngày mai có lẽ sẽ mưa. Mang ô theo nhé.
          lang: vi
    answer:
      correct_option_id: od4
    explanation:
      vi: たぶん - có lẽ; 雨でしょう - chắc sẽ mưa; 明日 - ngày mai.
    display_answer: Ngày mai có lẽ sẽ mưa. Mang ô theo nhé.
  - key: ja:exercise:n4-kamoshirenai-k4
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:n4-u6-gram-kamoshirenai
    prompt:
      template: 山田さんは来ない{{b1}}。 (Anh Yamada có thể không đến.)
      blanks:
        - id: b1
          width_hint: 8
      hint_levels:
        - Cụm nghĩa "có thể".
        - Bắt đầu bằng か - かもしれません.
    answer:
      blanks:
        b1:
          - かもしれません
          - かもしれない
    known_wrong:
