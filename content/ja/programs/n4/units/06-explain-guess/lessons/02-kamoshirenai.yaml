          lang: ja
        - id: ygz
          text: 危険
          lang: ja
        - id: f1a
          text: 安全
          lang: ja
    answer:
      correct_option_id: f1a
    explanation:
      vi: 安全 là an toàn. 危険 là nguy hiểm, 不便 là bất tiện, 心配 là lo lắng.
    display_answer: 安全
  - key: ja:exercise:n4-kamoshirenai-k6
