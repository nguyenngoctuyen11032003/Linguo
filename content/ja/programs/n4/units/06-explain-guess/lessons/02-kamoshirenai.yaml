          lang: ja
    answer:
      correct_option_id: h1p
    explanation:
      vi: もしかしたら + かもしれません - biết đâu. 必ず, ぜったい, きっと diễn tả mức chắc chắn cao nên mâu thuẫn với かもしれません.
    display_answer: もしかしたら
