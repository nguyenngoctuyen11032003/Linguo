body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được mức độ chắc chắn - 明日は雨が降るかもしれません。たぶん来ないでしょう。きっと大丈夫です。
  - type: explain
    text:
      vi: ～かもしれません nghĩa là "có thể, biết đâu". Gắn vào thể thường (行くかもしれません, 高いかもしれません); danh từ và tính từ な dùng thẳng (雨かもしれません, 静かかもしれません) không thêm だ/な. Khả năng chỉ khoảng 30-50%.
  - type: explain
    text:
      vi: "Các phó từ chỉ mức chắc chắn: たぶん (có lẽ, ~70%), きっと (chắc chắn, ~90%), かならず (nhất định, ~100%), ぜったい (tuyệt đối), もしかしたら (biết đâu, có thể). たぶん thường đi với でしょう."
  - type: explain
    text:
      vi: Phủ định - 行かないかもしれません (có thể không đi); khác với 行けないかもしれません (có thể không đi được). Câu hỏi かもしれませんか không thường dùng; hỏi khả năng dùng でしょうか.
  - type: deep_explain
    text:
      vi: かもしれません mang ý khả năng thấp hơn でしょう. Với việc đã chắc chắn như hứa hẹn thì dùng かならず, ví dụ 明日かならず行きます. ぜったい thường đi với phủ định mạnh hoặc lời quyết - ぜったい行きません. Nói rút gọn thân mật - かもしれない / かも. Chữ Hán - 多分, 必ず, 絶対, 危ない, 危険, 安全.
  - type: example
    target: 明日は雨が降るかもしれません。かさを持っていきましょう。
    target_lang: ja
    translation:
      vi: Ngày mai có thể sẽ mưa. Chúng ta mang ô theo nhé.
    note:
      vi: かもしれません - có thể.
  - type: example
    target: たぶん山田さんは来ないでしょう。
    target_lang: ja
    translation:
      vi: Có lẽ anh Yamada sẽ không đến.
    note:
      vi: たぶん + でしょう.
  - type: example
    target: この道は危ないかもしれません。気をつけてください。
    target_lang: ja
    translation:
      vi: Con đường này có thể nguy hiểm. Hãy cẩn thận.
    note:
      vi: 危ない - nguy hiểm.
  - type: example
    target: 必ず連絡します。
    target_lang: ja
    translation:
      vi: Nhất định tôi sẽ liên lạc.
    note:
      vi: 必ず - nhất định.
  - type: common_mistake
    wrong: 明日は雨だかもしれません。
    right: 明日は雨かもしれません。
    target_lang: ja
    note:
      vi: Với danh từ và tính từ な, かもしれません gắn trực tiếp, không thêm だ.
  - type: common_mistake
    wrong: たぶん来るかもしれません。
    right: たぶん来るでしょう。 / 来るかもしれません。
    target_lang: ja
    note:
      vi: たぶん đi với でしょう; かもしれません đã mang ý khả năng nên không cần たぶん.
  - type: summary
    points:
      - vi: ～かもしれません - có thể; danh từ / Na bỏ だ.
      - vi: たぶん - có lẽ · きっと - chắc chắn · かならず - nhất định · ぜったい - tuyệt đối.
      - vi: 危ない・危険 nguy hiểm · 安全 an toàn.
      - vi: もしかしたら - biết đâu.
exercises:
