key: ja:lesson:n4-to-omou
order_index: 3
level: n4
title:
  vi: Ý kiến và trích dẫn - ～と思います・～と言いました
objectives:
  - vi: Nói ý kiến của mình bằng ～と思います.
  - vi: Dẫn lời người khác trực tiếp 「～」と言いました và gián tiếp ～と言いました.
  - vi: Hỏi ý kiến bằng どう思いますか và dùng 考える, 信じる, 伝える.
estimated_minutes: 16
skills:
  - grammar
  - vocabulary
  - speaking
  - reading
prerequisites:
  - ja:lesson:n4-kamoshirenai
