title:
  vi: Rủ rê và từ bất định - 何か・誰か・お茶でも
objectives:
  - vi: Dùng だれか, なにか, どこか, いつか để nói "ai đó, cái gì đó, nơi nào đó, lúc nào đó".
  - vi: Rủ nhẹ nhàng bằng N でも ～ませんか.
  - vi: Dùng 誘う, 断る, 招待, 紹介 trong hội thoại mời và từ chối.
estimated_minutes: 16
