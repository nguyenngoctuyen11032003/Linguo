title:
  vi: Ôn tập - ngày đầu ở căn hộ mới
objectives:
  - vi: Kể chuyện sự cố bằng てしまう / ちゃう và than phiền bằng すぎる, にくい.
  - vi: Hỏi thông tin lịch sự bằng ～か / ～かどうか教えていただけますか.
  - vi: Tả căn phòng bằng tự động từ + ている và tha động từ + てある.
