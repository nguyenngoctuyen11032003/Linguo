        - Phần giải thích này dài quá nên khó hiểu.
        - Lời giải thích này quá dài nên khó hiểu.
        - Phần giải thích này quá dài nên khó hiểu.
        - Lời giải thích này dài quá, khó hiểu.
        - Bản hướng dẫn này dài quá nên khó hiểu.
        - Phần hướng dẫn này quá dài nên khó hiểu.
