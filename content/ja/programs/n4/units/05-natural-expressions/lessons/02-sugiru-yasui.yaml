        - { id: b2, text: 小さすぎて、 }
        - { id: b3, text: 読みやすいです }
        - { id: b4, text: 黒板の字が }
    answer:
      orders:
        - [b4, b2, b1]
    explanation:
      vi: 小さすぎて (nhỏ quá nên) dẫn tới kết quả xấu - 読みにくい (khó đọc). 読みやすい (dễ đọc) trái nghĩa.
    display_answer: 黒板の字が小さすぎて、読みにくいです。

