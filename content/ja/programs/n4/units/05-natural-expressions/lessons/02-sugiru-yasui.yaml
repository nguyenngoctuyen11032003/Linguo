    display_answer: Lời giải thích này dài quá nên khó hiểu.

  - key: ja:exercise:n4-sugi-mcq-shop
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-kutsu
    prompt:
      stem: Bạn thử một đôi giày ở cửa hàng nhưng nó chật quá. Bạn nói gì với nhân viên?
      stem_lang: vi
      options:
        - { id: u3e, text: "ちょっと小さすぎます。もう少し大きいのはありますか。", lang: ja }
        - { id: i7n, text: "ちょっと小さいすぎます。もう少し大きいのはありますか。", lang: ja }
        - { id: w1c, text: "ちょっと小さにくいです。もう少し大きいのはありますか。", lang: ja }
        - { id: r8v, text: "ちょっと小さすぎましょう。もう少し大きいのはありますか。", lang: ja }
    answer:
      correct_option_id: u3e
    explanation:
      vi: 小さい → 小さすぎます (nhỏ quá); もう少し大きいの - cái to hơn một chút. にくい chỉ ghép với động từ; ましょう là rủ rê.
    display_answer: ちょっと小さすぎます。もう少し大きいのはありますか。

  - key: ja:exercise:n4-sugi-wb-board
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:n4-gram-yasui-nikui
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: “Chữ trên bảng nhỏ quá nên khó đọc.”"
      tokens:
