        - この言葉がどういう意味か、辞書で調べてください。
        - この言葉はどういう意味か、辞書で調べてください。
        - この言葉がどんな意味か、辞書で調べてください。
        - この言葉はどんな意味か、辞書で調べてください。
        - 辞書でこの言葉がどういう意味か調べてください。
        - 辞書でこの言葉はどういう意味か調べてください。
        - 辞書でこの言葉がどんな意味か調べてください。
        - このことばがどういういみか、じしょでしらべてください。
