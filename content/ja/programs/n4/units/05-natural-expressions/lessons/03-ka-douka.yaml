title:
  vi: Câu hỏi lồng trong câu - ～か và ～かどうか
objectives:
  - vi: Lồng câu hỏi có từ để hỏi vào câu lớn - 何時に始まるか分かりません.
  - vi: Lồng câu hỏi có/không bằng ～かどうか.
  - vi: Hỏi thông tin lịch sự bằng ～か教えてください.
estimated_minutes: 18
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:n4-sugiru-yasui]
