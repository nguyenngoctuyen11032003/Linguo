        feedback_vi: Câu nhỏ bỏ です - どういう意味か.
        error_tag: embedded_masu
      - answer: この言葉がどういう意味かどうか、辞書で調べてください。
        feedback_vi: Có từ để hỏi どういう nên chỉ dùng か.
