title:
  vi: Tự động từ, tha động từ - ている và てある
objectives:
  - vi: Phân biệt cặp tự / tha động từ - 開く / 開ける, 閉まる / 閉める, つく / つける, 消える / 消す, 始まる / 始める.
  - vi: Tả trạng thái bằng tự động từ + ています (電気がついています).
  - vi: Nói "đã được làm sẵn" bằng tha động từ + てあります (窓が開けてあります).
estimated_minutes: 20
skills: [grammar, vocabulary, reading, speaking]
