key: ja:lesson:n4-te-shimau
order_index: 1
level: n4
title:
  vi: Lỡ làm, làm xong hẳn - てしまう và ちゃう
objectives:
  - vi: Nói "làm xong hẳn" bằng V-てしまいます.
  - vi: Nói "lỡ làm, chẳng may" kèm cảm giác tiếc nuối bằng V-てしまいました.
  - vi: Nhận ra và dùng dạng nói thân mật ～ちゃう / ～じゃう với bạn bè.
estimated_minutes: 18
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:n4-travel-comparing-review]
