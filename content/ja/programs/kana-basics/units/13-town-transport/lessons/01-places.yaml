title:
  vi: Các nơi trong thành phố - ぎんこう・スーパー・えいがかん
objectives:
  - vi: "Gọi tên các nơi trong thành phố: まち, ぎんこう, ほんや, はなや, レストラン, スーパー, コンビニ, デパート."
  - vi: Gọi tên えいがかん, きっさてん, だいがく, くうこう.
  - vi: Nói đi đâu để làm gì bằng N に いきます (かいものに いきます).
