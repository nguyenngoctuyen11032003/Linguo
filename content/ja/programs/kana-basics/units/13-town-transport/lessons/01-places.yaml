  - key: ja:exercise:town-places-ni-iku
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u13-ni-ikimasu
    prompt:
      stem: Bạn muốn nói “Tôi đi hiệu sách để mua sách”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: hnr
          text: ほんをかいにほんやへいきます。
          lang: ja
        - id: f1w
          text: ほんをかいでほんやへいきます。
          lang: ja
        - id: xz2
          text: ほんをかいをほんやへいきます。
          lang: ja
        - id: se9
          text: ほんをかうにほんやへいきます。
          lang: ja
    answer:
      correct_option_id: hnr
    explanation:
      vi: "Mục đích: ます (bỏ ます) + に. かう là dạng từ điển, không đi với に chỉ mục đích; を và で không tạo nghĩa này."
    display_answer: ほんをかいにほんやへいきます。
  - key: ja:exercise:town-places-ni-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-ni-ikimasu
    prompt:
      template: ともだちとえいがを{{b1}}えいがかんへいきます。 (Tôi cùng bạn đi rạp để xem phim.)
      blanks:
        - id: b1
          width_hint: 3
    answer:
      blanks:
        b1:
          - みに
          - 見に
    known_wrong:
      - answer: みる
        feedback_vi: Không dùng dạng từ điển みる trước に; dùng みに.
        error_tag: conjugation
      - answer: みて
        feedback_vi: みて là dạng て, không dùng để chỉ mục đích.
        error_tag: conjugation
    explanation:
      vi: みに - ます bỏ ます (み) + に. えいがをみにいきます - đi xem phim.
    display_answer: ともだちとえいがをみにえいがかんへいきます。
