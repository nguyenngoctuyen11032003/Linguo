    item: ja:item:n5-u13-depaato
    prompt:
      source_text: Tôi đi bách hoá để mua sắm.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - かいものにデパートへいきます。
        - デパートへかいものにいきます。
        - かいものにデパートにいきます。
        - 買い物にデパートへ行きます。
        - デパートにかいものにいきます。
    known_wrong:
      - answer: かいものをデパートへいきます。
        feedback_vi: "Mục đích dùng に: かいものに いきます."
        error_tag: purpose_ni
      - answer: かいものにデパートでいきます。
        feedback_vi: Nơi đến dùng へ hoặc に, không dùng で.
        error_tag: particle_ni_de
    explanation:
      vi: かいものに = để mua sắm; デパートへ いきます - đi đến bách hoá.
    display_answer: かいものにデパートへいきます。
