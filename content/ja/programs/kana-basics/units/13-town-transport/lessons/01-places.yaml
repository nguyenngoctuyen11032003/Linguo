body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được thành phố mình có những nơi nào và đi đến đó làm gì - ほんをかいにほんやへいきます。
  - type: explain
    text:
      vi: "Cửa hàng và nơi công cộng: ぎんこう (ngân hàng), ほんや (hiệu sách), はなや (cửa hàng hoa), スーパー (siêu thị), コンビニ (cửa hàng tiện lợi), デパート (bách hoá), レストラン (nhà hàng), きっさてん (quán cà phê), えいがかん (rạp phim), だいがく (đại học), くうこう (sân bay)."
  - type: explain
    text:
      vi: "Hậu tố ～や (屋) chỉ cửa hàng chuyên một loại hàng: ほんや (hiệu sách), はなや (cửa hàng hoa), さかなや (cửa hàng cá). Từ gốc đứng trước や - ほん + や = ほんや."
  - type: explain
    text:
      vi: Đi đến một nơi để làm gì - V ます (bỏ ます) + に + いきます. Ví dụ ほんをかいに ほんやへ いきます (đi hiệu sách để mua sách). Với danh từ - かいものに いきます, えいがを みに いきます.
  - type: deep_explain
    text:
      vi: "Chú ý hai trợ từ に khác nhau - に chỉ mục đích (かいに) khác へ / に chỉ đích đến (ほんやへ). Câu あした、ともだちとえいがをみにえいがかんへいきます có cả hai: みに (mục đích) và えいがかんへ (đích đến). Chữ Hán - 町, 銀行, 本屋, 花屋, 映画館, 喫茶店, 大学, 空港."
  - type: example
    target: ほんをかいに、ほんやへいきます。
    target_lang: ja
    translation:
      vi: Tôi đi hiệu sách để mua sách.
    note:
      vi: かい - gốc của かいます; に - mục đích.
  - type: example
    target: にちようびはともだちとえいがをみにいきます。
    target_lang: ja
    translation:
      vi: Chủ nhật tôi cùng bạn đi xem phim.
    note:
      vi: みに いきます - đi để xem.
  - type: example
    target: スーパーでやさいとくだものをかいます。
    target_lang: ja
    translation:
      vi: Tôi mua rau và hoa quả ở siêu thị.
    note:
      vi: で - nơi diễn ra hành động.
  - type: example
    target: きっさてんでコーヒーをのみます。
    target_lang: ja
    translation:
      vi: Tôi uống cà phê ở quán cà phê.
    note:
      vi: きっさてん - quán cà phê kiểu Nhật.
  - type: common_mistake
    wrong: ほんをかうにほんやへいきます。
    right: ほんをかいにほんやへいきます。
    target_lang: ja
    note:
      vi: Mục đích dùng dạng ます bỏ ます (かい) + に, không dùng dạng từ điển かう.
  - type: common_mistake
    wrong: かいものをいきます。
    right: かいものにいきます。
    target_lang: ja
    note:
      vi: "Danh từ chỉ mục đích đi với に: かいものに いきます."
  - type: summary
    points:
      - vi: ぎんこう · ほんや · はなや · スーパー · コンビニ · デパート · レストラン · きっさてん · えいがかん · だいがく · くうこう.
      - vi: V ます bỏ ます + に いきます - đi để làm gì.
      - vi: N に いきます - かいものに いきます.
      - vi: で - nơi diễn ra hành động; へ - đích đến.
