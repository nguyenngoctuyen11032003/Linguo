  - key: ja:exercise:directions-massugu-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-massugu
    prompt:
      source_text: Đi thẳng rồi rẽ phải ở đèn giao thông thứ hai.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - まっすぐいって、ふたつめのしんごうをみぎです。
        - まっすぐいって、ふたつめのしんごうをみぎにまがります。
        - まっすぐいって、ふたつめの信号を右です。
        - まっすぐいって、ふたつめの信号を右に曲がります。
    known_wrong:
