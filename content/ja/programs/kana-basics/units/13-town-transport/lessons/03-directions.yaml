    difficulty: 1
    item: ja:item:n5-u13-migi
    prompt:
      stem: Từ nào có nghĩa là “bên phải”?
      stem_lang: vi
      options:
        - id: wke
          text: かど
          lang: ja
        - id: ahr
          text: ひだり
          lang: ja
        - id: i4w
          text: まっすぐ
