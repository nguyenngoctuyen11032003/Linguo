    difficulty: 1
    item: ja:item:n5-u13-massugu
    prompt:
      audio_asset_id: null
      fallback_text: まっすぐいって、ひとつめのしんごうをみぎです。
      options:
        - id: zbd
          text: Đến ngã tư thứ nhất thì đi thẳng.
          lang: vi
        - id: ift
          text: Đi thẳng, đến đèn giao thông thứ hai thì rẽ trái.
