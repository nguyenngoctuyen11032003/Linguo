body:
  - type: objective
    text:
      vi: Sau bài này, bạn hỏi được đường và hiểu lời chỉ đường - まっすぐいって、ふたつめのかどをみぎです。
  - type: explain
    text:
      vi: "Từ chỉ hướng: みぎ (phải), ひだり (trái), まっすぐ (thẳng). Mốc để chỉ đường: かど (góc đường), しんごう (đèn giao thông), こうさてん (ngã tư), はし (cầu), みち (đường). Đếm mốc bằng ～め - ひとつめ (cái thứ nhất), ふたつめ (cái thứ hai)."
  - type: explain
    text:
      vi: Chỉ đường điển hình - まっすぐいって、ひとつめのしんごうをみぎです (đi thẳng, đến đèn giao thông thứ nhất thì rẽ phải). Băng qua - はしを わたります, みちを わたります.
  - type: explain
    text:
      vi: Hỏi đường - すみません、えきはどこですか (Xin lỗi, nhà ga ở đâu?) hoặc えきまでどうやっていきますか (Đến ga thì đi như thế nào?). Cảm ơn - ありがとうございました.
  - type: deep_explain
    text:
      vi: Cách rẽ - みぎ/ひだり + に まがります (rẽ phải/trái); まがります (曲がります, rẽ) sẽ được dạy chi tiết ở N3. Khi chỉ đường nhanh, người Nhật hay lược bỏ động từ - ひとつめのかどをみぎです (Góc đầu tiên thì phải). Chữ Hán - 右, 左, 角, 信号, 橋, 道, 渡ります, 交差点, 一つ目.
  - type: example
    target: まっすぐいって、ひとつめのしんごうをみぎです。
    target_lang: ja
    translation:
      vi: Đi thẳng, đến đèn giao thông thứ nhất thì rẽ phải.
    note:
      vi: まっすぐ - thẳng; ひとつめ - cái thứ nhất.
  - type: example
    target: はしをわたって、ひだりにまがります。
    target_lang: ja
    translation:
      vi: Qua cầu rồi rẽ trái.
    note:
      vi: わたって - qua (thể て, sẽ học kỹ ở N4); まがります - rẽ.
  - type: example
    target: すみません、えきはどこですか。- あのかどをみぎです。
    target_lang: ja
    translation:
      vi: Xin lỗi, nhà ga ở đâu? - Rẽ phải ở góc đằng kia.
    note:
      vi: どこ - ở đâu; あの - đằng kia.
  - type: example
    target: えきまでどうやっていきますか。
    target_lang: ja
    translation:
      vi: Đến ga thì đi như thế nào?
    note:
      vi: どうやって - bằng cách nào.
  - type: common_mistake
    wrong: みぎをまっすぐです。(đi thẳng)
    right: まっすぐです。
    target_lang: ja
    note:
      vi: まっすぐ là "thẳng", không đi với みぎ. Rẽ phải nói みぎです hoặc みぎに まがります.
  - type: common_mistake
    wrong: はしをのります。
    right: はしをわたります。
    target_lang: ja
    note:
      vi: Băng qua cầu, đường dùng わたります; のります là lên xe.
  - type: summary
    points:
      - vi: みぎ phải · ひだり trái · まっすぐ thẳng · かど góc · しんごう đèn giao thông · こうさてん ngã tư · はし cầu · みち đường.
      - vi: ひとつめ · ふたつめ - đếm mốc theo thứ tự.
      - vi: わたります băng qua · どうやって いきますか đi như thế nào?
      - vi: すみません、～は どこですか - hỏi nơi chốn lịch sự.
exercises:
