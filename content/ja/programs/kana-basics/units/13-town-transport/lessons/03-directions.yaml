title:
  vi: Chỉ đường - みぎ・ひだり・まっすぐ
objectives:
  - vi: Dùng みぎ, ひだり, まっすぐ, かど, しんごう, はし để chỉ đường.
  - vi: Hiểu và nói các câu chỉ đường với わたります, ひとつめ, こうさてん.
  - vi: Hỏi đường bằng どうやって いきますか và ～は どこですか.
