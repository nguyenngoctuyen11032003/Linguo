        feedback_vi: Câu yêu cầu rẽ phải (みぎ), không phải trái.
        error_tag: direction
    explanation:
      vi: まっすぐ - thẳng; ふたつめ - cái thứ hai; みぎ - phải.
    display_answer: まっすぐいって、ふたつめのしんごうをみぎです。
