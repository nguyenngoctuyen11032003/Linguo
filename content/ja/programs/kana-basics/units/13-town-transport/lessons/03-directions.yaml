  - key: ja:exercise:directions-hashi-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u13-watarimasu
    prompt:
      template: "{{b1}}をわたります。 (Tôi qua cầu.)"
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Công trình bắc qua sông.
        - Hai chữ - はし.
    answer:
      blanks:
        b1:
          - はし
          - 橋
    known_wrong:
      - answer: しんごう
        feedback_vi: しんごう là đèn giao thông; ở đây cần thứ để "băng qua" - はし.
        error_tag: vocab_meaning
    explanation:
      vi: はし là cầu. はしをわたります - qua cầu. Đọc giống はし (đũa) nhưng ngữ cảnh khác.
    display_answer: はしをわたります。
  - key: ja:exercise:directions-douyatte
