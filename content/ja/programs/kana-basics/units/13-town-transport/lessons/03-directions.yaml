      correct_option_id: ow1
    explanation:
      vi: どうやって hỏi cách đi. なにを hỏi "cái gì" (tân ngữ), だれが hỏi "ai", いくら hỏi giá tiền.
    display_answer: えきまでどうやっていきますか。
  - key: ja:exercise:directions-hidari-fill
