          - t4
    explanation:
      vi: Thời gian → phương tiện (バスで) → đích đến (かいしゃへ) → động từ cuối.
    display_answer: まいあさ、バスでかいしゃへいきます。
  - key: ja:exercise:transport-situ
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-norimasu
    prompt:
      stem: Bạn xuống xe buýt ở ga. Câu nào đúng?
      stem_lang: vi
      options:
        - id: cls
          text: えきをのみます。
          lang: ja
        - id: lb3
          text: えきにのります。
          lang: ja
        - id: jle
          text: えきをみがきます。
          lang: ja
        - id: x5o
          text: えきでおります。
          lang: ja
    answer:
      correct_option_id: x5o
    explanation:
      vi: Xuống ở nơi nào dùng で + おります. のります là lên; のみます (uống) và みがきます (đánh bóng) không phù hợp.
    display_answer: えきでおります。
