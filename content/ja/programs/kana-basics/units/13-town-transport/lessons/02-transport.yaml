body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được mình đi bằng phương tiện gì - バスでがっこうへいきます。- và hỏi người khác なにでいきますか。
  - type: explain
    text:
      vi: "Phương tiện: バス (xe buýt), タクシー (taxi), ちかてつ (tàu điện ngầm), じてんしゃ (xe đạp), ふね (tàu thuỷ). Máy bay và tàu điện bạn đã gặp ở các bài trước."
  - type: explain
    text:
      vi: Đi bằng phương tiện - N で いきます / きます / かえります. Hỏi - なにで いきますか。 Đi bộ là ngoại lệ - あるいて いきます (không nói あるきで). Nhắc lại - えきまで あるきます (đi bộ đến ga).
  - type: explain
    text:
      vi: Lên xe - N に のります (バスに のります); xuống xe - N を おります hoặc N で おります (つぎの えきで おります). Mất bao lâu - ～かかります (バスで さんじゅっぷん かかります).
  - type: deep_explain
    text:
      vi: Hai động từ のります và おります hay đi cùng nhau - バスにのって、えきでおります. Chú ý trợ từ - のります dùng に, おります dùng を (rời khỏi phương tiện) hoặc で (xuống ở ga nào). Bán vé và sân ga - きっぷ (vé), ばんせん (sân ga số). Chữ Hán - 地下鉄, 自転車, 船, 乗ります, 降ります, 歩きます, 番線.
  - type: example
    target: まいあさ、バスでかいしゃへいきます。
    target_lang: ja
    translation:
      vi: Sáng nào tôi cũng đi làm bằng xe buýt.
    note:
      vi: N で いきます - đi bằng N.
  - type: example
    target: えきからうちまであるいてかえります。
    target_lang: ja
    translation:
      vi: Tôi đi bộ từ ga về nhà.
    note:
      vi: あるいて - đi bộ (không dùng で).
  - type: example
    target: ちかてつにのって、つぎのえきでおります。
    target_lang: ja
    translation:
      vi: Tôi lên tàu điện ngầm rồi xuống ở ga tiếp theo.
    note:
      vi: のって - lên (thể て), おります - xuống.
  - type: example
    target: バスでさんじゅっぷんかかります。
    target_lang: ja
    translation:
      vi: Đi bằng xe buýt mất 30 phút.
    note:
      vi: かかります - mất (thời gian).
  - type: common_mistake
    wrong: バスをのります。
    right: バスにのります。
    target_lang: ja
    note:
      vi: Lên phương tiện dùng に (バスに のります), không dùng を.
  - type: common_mistake
    wrong: あるきでがっこうへいきます。
    right: あるいてがっこうへいきます。
    target_lang: ja
    note:
      vi: Đi bộ là あるいて; không dùng あるきで.
  - type: summary
    points:
      - vi: バス xe buýt · タクシー taxi · ちかてつ tàu điện ngầm · じてんしゃ xe đạp · ふね tàu thuỷ.
      - vi: N で いきます - đi bằng N; なにで いきますか - đi bằng gì?
      - vi: N に のります · N を / で おります · あるいて いきます.
      - vi: ばんせん sân ga số · かかります mất (thời gian).
