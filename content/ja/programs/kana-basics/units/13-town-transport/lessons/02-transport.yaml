  - key: ja:exercise:transport-de-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u13-de-ikimasu
    prompt:
      template: タクシー{{b1}}くうこうへいきます。 (Tôi đến sân bay bằng taxi.)
      blanks:
        - id: b1
          width_hint: 2
      hint_levels:
        - Trợ từ chỉ phương tiện.
        - Một chữ - で.
    answer:
      blanks:
        b1:
          - で
    known_wrong:
      - answer: に
        feedback_vi: に không chỉ phương tiện; dùng で.
        error_tag: particle_ni_de
      - answer: を
        feedback_vi: を là tân ngữ; phương tiện dùng で.
        error_tag: particle_wo_de
    explanation:
      vi: "で chỉ phương tiện: タクシーで - bằng taxi."
    display_answer: タクシーでくうこうへいきます。
  - key: ja:exercise:transport-nande
