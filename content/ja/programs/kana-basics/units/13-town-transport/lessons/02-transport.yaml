    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u13-de-ikimasu
    prompt:
      stem: Bạn muốn hỏi “Bạn đi học bằng gì?”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: lg4
          text: なにでがっこうへいきますか。
          lang: ja
        - id: ray
          text: なにへがっこうへいきますか。
          lang: ja
        - id: cma
          text: なにをがっこうへいきますか。
          lang: ja
        - id: wav
          text: なにがっこうへいきますか。
          lang: ja
    answer:
      correct_option_id: lg4
    explanation:
      vi: Hỏi phương tiện dùng なにで (bằng gì). なにを hỏi tân ngữ, và các dạng còn lại không tạo thành câu đúng.
    display_answer: なにでがっこうへいきますか。
  - key: ja:exercise:transport-arukimasu-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-arukimasu
    prompt:
      template: えきまで{{b1}}いきます。 (Tôi đi bộ đến ga.)
      blanks:
        - id: b1
          width_hint: 5
    answer:
      blanks:
        b1:
          - あるいて
          - 歩いて
    known_wrong:
      - answer: あるきで
        feedback_vi: Không nói あるきで; đi bộ là あるいて いきます.
        error_tag: conjugation
      - answer: あるく
        feedback_vi: "Trước いきます phải dùng thể て: あるいて."
        error_tag: conjugation
    explanation:
      vi: あるいて là thể て của あるきます - đi bộ. Đi bộ không dùng で.
    display_answer: えきまであるいていきます。
  - key: ja:exercise:transport-norimasu-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-norimasu
    prompt:
      template: バス{{b1}}のります。 (Tôi lên xe buýt.)
      blanks:
        - id: b1
          width_hint: 2
    answer:
      blanks:
        b1:
          - に
    known_wrong:
      - answer: を
        feedback_vi: Lên phương tiện dùng に, không dùng を.
        error_tag: particle_ni_wo
      - answer: で
        feedback_vi: で chỉ phương tiện khi đi; với のります dùng に.
        error_tag: particle_ni_de
    explanation:
      vi: N に のります - lên N (xe, tàu).
    display_answer: バスにのります。
  - key: ja:exercise:transport-jitensha-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-jitensha
    prompt:
      source_text: Tôi đi học bằng xe đạp.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - じてんしゃでがっこうへいきます。
        - 自転車で学校へ行きます。
        - じてんしゃでがっこうにいきます。
        - わたしはじてんしゃでがっこうへいきます。
    known_wrong:
      - answer: じてんしゃをがっこうへいきます。
        feedback_vi: Phương tiện dùng で, không dùng を.
        error_tag: particle_wo_de
      - answer: でんしゃでがっこうへいきます。
        feedback_vi: でんしゃ là tàu điện; xe đạp là じてんしゃ.
        error_tag: vocab_meaning
    explanation:
      vi: じてんしゃ = xe đạp; N で いきます - đi bằng N.
    display_answer: じてんしゃでがっこうへいきます。
  - key: ja:exercise:transport-chikatetsu-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u13-chikatetsu
    prompt:
      source_text: ちかてつにのって、つぎのえきでおります。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tôi lên tàu điện ngầm rồi xuống ở ga tiếp theo.
        - Lên tàu điện ngầm rồi xuống ở ga kế tiếp.
        - Tôi đi tàu điện ngầm rồi xuống ở ga tiếp theo.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi xuống tàu điện ngầm rồi lên ở ga tiếp theo.
        feedback_vi: "のります là lên, おります là xuống; thứ tự: lên rồi xuống."
        error_tag: verb_choice
    explanation:
      vi: のって là thể て của のります (lên) và nối với おります (xuống) theo thứ tự.
    display_answer: Tôi lên tàu điện ngầm rồi xuống ở ga tiếp theo.
  - key: ja:exercise:transport-basu-wb
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u13-basu
    prompt:
      instruction: 'Sắp xếp thành câu tiếng Nhật: "Sáng nào tôi cũng đi làm bằng xe buýt."'
      tokens:
        - id: t3
