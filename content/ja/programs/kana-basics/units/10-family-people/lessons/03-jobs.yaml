body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được nghề của mình và người thân - あねはぎんこういんです。- và biết hỏi おしごとはなんですか。
  - type: explain
    text:
      vi: Nghề nghiệp nói theo mẫu N は (nghề) です. Nhiều nghề có ～いん (員, nhân viên) - ぎんこういん (nhân viên ngân hàng), かいしゃいん (nhân viên công ty), てんいん (nhân viên cửa hàng).
  - type: explain
    text:
      vi: "Cấp học ghép từ ～せい (学生, học sinh): しょうがくせい (tiểu học), ちゅうがくせい (trung học cơ sở), こうこうせい (trung học phổ thông), だいがくせい (đại học). りゅうがくせい là du học sinh."
  - type: explain
    text:
      vi: Hỏi nghề - おしごとはなんですか。 (Công việc của bạn là gì?). Với người trên, thêm お vào しごと. Trả lời - ぎんこういんです. Với học sinh, hỏi - なんねんせいですか。(học năm mấy?) hoặc だいがくせいですか。
  - type: deep_explain
    text:
      vi: けいかん (警官) là cảnh sát thường dân, còn ở thông báo hay tin tức bạn sẽ thấy けいさつかん (警察官). かしゅ là ca sĩ, しゅふ là người nội trợ (nam nữ đều dùng). Người Nhật thường nói công ty trước nghề - ○○のてんいん (nhân viên cửa hàng ○○). Chữ Hán - 店員, 銀行員, 警官, 歌手, 主婦, 大学生, 留学生.
  - type: example
    target: あねはぎんこういんで、あにはけいかんです。
    target_lang: ja
    translation:
      vi: Chị gái tôi là nhân viên ngân hàng, anh trai tôi là cảnh sát.
    note:
      vi: ぎんこういん - nhân viên ngân hàng; けいかん - cảnh sát.
  - type: example
    target: おしごとはなんですか。- てんいんです。
    target_lang: ja
    translation:
      vi: Công việc của bạn là gì? - Tôi là nhân viên cửa hàng.
    note:
      vi: お + しごと - cách nói lịch sự khi hỏi người khác.
  - type: example
    target: わたしはにほんのだいがくせいです。
    target_lang: ja
    translation:
      vi: Tôi là sinh viên đại học Nhật.
    note:
      vi: だいがくせい - sinh viên đại học.
  - type: example
    target: かれはりゅうがくせいで、ベトナムからきました。
    target_lang: ja
    translation:
      vi: Anh ấy là du học sinh, đến từ Việt Nam.
    note:
      vi: りゅうがくせい - du học sinh.
  - type: common_mistake
    wrong: わたしのしごとはなんですか。(hỏi người khác)
    right: おしごとはなんですか。
    target_lang: ja
    note:
      vi: Hỏi người khác thì dùng おしごと và bỏ わたしの; ghép わたしの vào câu hỏi sẽ thành "công việc của tôi là gì".
  - type: common_mistake
    wrong: ちゅうがくせいはだいがくのがくせいです。
    right: だいがくせいはだいがくのがくせいです。
    target_lang: ja
    note:
      vi: "Cấp học và trường phải khớp: だいがくせい học ở だいがく (đại học), ちゅうがくせい học ở ちゅうがっこう (cấp hai)."
  - type: summary
    points:
      - vi: てんいん nhân viên cửa hàng · ぎんこういん nhân viên ngân hàng · けいかん cảnh sát · かしゅ ca sĩ · しゅふ nội trợ.
      - vi: しょうがくせい · ちゅうがくせい · こうこうせい · だいがくせい · りゅうがくせい.
      - vi: Hỏi - おしごとはなんですか。 Đáp - ○○です。
      - vi: ～いん (員) - nhân viên; ～せい (生) - học sinh, sinh viên.
