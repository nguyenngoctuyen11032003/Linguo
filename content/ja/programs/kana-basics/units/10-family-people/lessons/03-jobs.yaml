    difficulty: 1
    item: ja:item:n5-u10-tenin
    prompt:
      template: コンビニで はたらきます。{{b1}}です。 (Tôi là nhân viên cửa hàng.)
      blanks:
        - id: b1
          width_hint: 5
      hint_levels:
        - Người làm việc ở cửa hàng.
        - Bắt đầu bằng て - てんいん.
    answer:
