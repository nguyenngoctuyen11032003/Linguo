        feedback_vi: ぎんこういん là nhân viên ngân hàng; làm ở cửa hàng tiện lợi là てんいん.
        error_tag: vocab_meaning
      - answer: かいしゃいん
        feedback_vi: かいしゃいん là nhân viên công ty; làm ở cửa hàng là てんいん.
        error_tag: vocab_meaning
    explanation:
      vi: てんいん là nhân viên cửa hàng. Ghép てん (店, cửa hàng) và いん (員, nhân viên).
    display_answer: コンビニではたらきます。てんいんです。
