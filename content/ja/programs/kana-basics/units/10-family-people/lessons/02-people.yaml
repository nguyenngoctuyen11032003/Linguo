title:
  vi: Con người - どんなひとですか
objectives:
  - vi: "Gọi người theo giới tính, tuổi: おとこのひと, おんなのひと, おとな, あかちゃん."
  - vi: Dùng かれ, かのじょ, あなた, みなさん để chỉ người.
  - vi: Miêu tả người bằng どんなひと, わかい, やさしい, おもしろい và mẫu N は N が A です.
estimated_minutes: 15
skills:
  - vocabulary
  - speaking
  - reading
prerequisites:
