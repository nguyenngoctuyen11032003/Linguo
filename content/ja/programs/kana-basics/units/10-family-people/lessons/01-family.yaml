    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u10-imouto
    prompt:
      stem: Bạn có một em gái. Từ nào dùng để nói về em gái của mình?
      stem_lang: vi
      options:
        - id: me3
          text: おとうと
          lang: ja
        - id: c7r
          text: いもうと
          lang: ja
        - id: fdw
          text: あね
          lang: ja
        - id: gp6
          text: あに
          lang: ja
    answer:
