title:
  vi: Gia đình - ちち・はは・あに・あね
objectives:
  - vi: "Gọi tên các thành viên trong gia đình mình: ちち, はは, あに, あね, おとうと, いもうと."
  - vi: Phân biệt cách nói về gia đình mình và gia đình người khác (ちち / おとうさん).
  - vi: Nói và hỏi về anh chị em bằng ごきょうだいはいますか.
