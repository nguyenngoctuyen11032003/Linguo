  - key: ja:exercise:family-members-haha-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u10-haha
    prompt:
      template: わたしの{{b1}}はせんせいです。 (Mẹ tôi là giáo viên - nói với người ngoài)
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Mẹ (của mình) khi nói với người ngoài.
        - Bắt đầu bằng は - はは.
    answer:
      blanks:
        b1:
          - はは
          - 母
    known_wrong:
      - answer: おかあさん
        feedback_vi: Khi nói về mẹ mình với người ngoài, người Nhật dùng はは khiêm nhường. おかあさん dành cho mẹ người khác hoặc khi gọi trực tiếp.
        error_tag: family_term
      - answer: ちち
        feedback_vi: ちち là bố. Mẹ là はは.
        error_tag: vocab_meaning
    explanation:
      vi: はは là cách nói khiêm nhường về mẹ mình. Câu hoàn chỉnh - わたしのははは せんせいです。
    display_answer: わたしのはははせんせいです。
  - key: ja:exercise:family-members-kyoudai-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u10-kyoudai
    prompt:
      template: わたしの{{b1}}はさんにんです。 (Anh chị em của tôi có ba người.)
      blanks:
        - id: b1
          width_hint: 6
    answer:
      blanks:
        b1:
          - きょうだい
          - 兄弟
    known_wrong:
      - answer: かぞく
        feedback_vi: かぞく là cả gia đình, còn anh chị em là きょうだい.
        error_tag: vocab_meaning
      - answer: こども
        feedback_vi: こども là con cái hoặc trẻ em.
        error_tag: vocab_meaning
    explanation:
      vi: きょうだい chỉ anh chị em trong nhà, không tính bố mẹ.
    display_answer: わたしのきょうだいはさんにんです。
  - key: ja:exercise:family-members-otouto-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u10-otouto
    prompt:
      source_text: Tôi có một em trai.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - おとうとがひとりいます。
        - 弟が一人います。
        - わたしにはおとうとがひとりいます。
        - わたしにはおとうとがひとりおります。
        - わたしはおとうとがひとりいます。
    known_wrong:
      - answer: あにがひとりいます。
        feedback_vi: あに là anh trai. Em trai là おとうと.
        error_tag: family_term
      - answer: おとうとがふたりいます。
        feedback_vi: ふたり là hai người; một người là ひとり.
        error_tag: counter
      - answer: いもうとがひとりいます。
        feedback_vi: いもうと là em gái, không phải em trai.
        error_tag: family_term
    explanation:
      vi: Em trai là おとうと; có (người) là います; một người là ひとり. Mẫu - N が ひとり います.
    display_answer: おとうとがひとりいます。
  - key: ja:exercise:family-members-chichi-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u10-chichi
    prompt:
      source_text: Bố tôi là nhân viên công ty.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - ちちはかいしゃいんです。
        - 父は会社員です。
        - わたしのちちはかいしゃいんです。
        - わたしの父は会社員です。
    known_wrong:
