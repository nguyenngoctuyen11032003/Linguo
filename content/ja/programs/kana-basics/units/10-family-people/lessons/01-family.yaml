body:
  - type: objective
    text:
      vi: Sau bài này, bạn giới thiệu được gia đình mình - ちちはかいしゃいんです。はははせんせいです。- và hỏi người khác về gia đình họ.
  - type: explain
    text:
      vi: "Tiếng Nhật có hai bộ từ cho gia đình. Khi nói về gia đình mình với người ngoài, dùng từ ngắn khiêm nhường: ちち, はは, あに, あね, おとうと, いもうと. Khi gọi hoặc nói về gia đình người khác, dùng từ có さん: おとうさん, おかあさん, おにいさん, おねえさん."
  - type: explain
    text:
      vi: Tiếng Việt chỉ có "bố, mẹ, anh, chị" cho mọi trường hợp, nên người Việt hay dùng おとうさん cho cả bố mình. Hãy nhớ quy tắc đơn giản - nhà mình thì ngắn, nhà người khác thì さん.
  - type: explain
    text:
      vi: Hỏi người khác có anh chị em không - ごきょうだいはいますか。Trả lời - はい、あにがひとりいます (Có, tôi có một anh trai) hoặc いいえ、いません (Không có). Số người đếm bằng ひとり, ふたり, さんにん.
  - type: deep_explain
    text:
      vi: Cách đếm người - ひとり (1), ふたり (2), さんにん (3), よにん (4) - đã học ở bài đếm người. Một nhà có bố mẹ và hai con thì nói よにんかぞく (gia đình bốn người). りょうしん nghĩa là cả bố lẫn mẹ, còn こども là con cái. Chữ Hán - 父, 母, 兄, 姉, 弟, 妹, 両親, 兄弟.
  - type: example
    target: ちちはかいしゃいんで、はははせんせいです。
    target_lang: ja
    translation:
      vi: Bố tôi là nhân viên công ty, mẹ tôi là giáo viên.
    note:
      vi: ちち・はは - nói về bố mẹ mình với người ngoài.
  - type: example
    target: おとうさんはおげんきですか。
    target_lang: ja
    translation:
      vi: Bố bạn có khỏe không ạ?
    note:
      vi: おとうさん - bố của người nghe nên thêm さん.
  - type: example
    target: あにがひとり、いもうとがふたりいます。
    target_lang: ja
    translation:
      vi: Tôi có một anh trai và hai em gái.
    note:
      vi: N が + số người + います - có ... người.
  - type: example
    target: ごきょうだいはいますか。- いいえ、いません。ひとりっこです。
    target_lang: ja
    translation:
      vi: Bạn có anh chị em không? - Không, tôi là con một.
    note:
      vi: ひとりっこ - con một.
  - type: common_mistake
    wrong: わたしのおとうさんはせんせいです。(nói với người ngoài)
    right: わたしのちちはせんせいです。
    target_lang: ja
    note:
      vi: Với người ngoài, gọi bố mình bằng ちち khiêm nhường; おとうさん dành cho bố người khác hoặc khi gọi trực tiếp.
  - type: common_mistake
    wrong: いもうとはにじゅっさいです。(em trai)
    right: おとうとはにじゅっさいです。
    target_lang: ja
    note:
      vi: おとうと là em trai, いもうと là em gái - hai từ chỉ khác hai chữ đầu nên rất dễ lẫn.
  - type: summary
    points:
      - vi: ちち bố · はは mẹ · あに anh · あね chị · おとうと em trai · いもうと em gái (gia đình mình).
      - vi: おとうさん・おかあさん・おにいさん・おねえさん - gia đình người khác, hoặc khi gọi trực tiếp.
      - vi: りょうしん bố mẹ · きょうだい anh chị em · こども con cái · おじいさん ông · おばあさん bà.
      - vi: Hỏi - ごきょうだいはいますか。 Đáp - あにがひとりいます。
