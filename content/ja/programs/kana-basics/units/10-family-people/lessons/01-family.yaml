      vi: ちち là bố của mình. Cấu trúc N は N です.
    display_answer: ちちはかいしゃいんです。
  - key: ja:exercise:family-members-ane-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u10-ane
    prompt:
      source_text: あねはがくせいで、あにはかいしゃいんです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Chị gái tôi là sinh viên, anh trai tôi là nhân viên công ty.
        - Chị tôi là sinh viên còn anh tôi là nhân viên công ty.
        - Chị gái tôi là học sinh, anh trai tôi là nhân viên công ty.
        - Chị gái mình là sinh viên, anh trai mình là nhân viên công ty.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Anh trai tôi là sinh viên, chị gái tôi là nhân viên công ty.
        feedback_vi: あね là chị gái, あに là anh trai - bạn đã đảo hai người.
        error_tag: family_term
    explanation:
      vi: あね = chị gái (của mình), あに = anh trai (của mình). Vế đầu về chị gái, vế sau về anh trai.
    display_answer: Chị gái tôi là sinh viên, anh trai tôi là nhân viên công ty.
