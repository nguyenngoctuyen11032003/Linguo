title:
  vi: Katakana ハ đến ン
objectives:
  - vi: Đọc và viết các hàng ハ, マ, ヤ, ラ, ワ và chữ ン.
  - vi: Phân biệt cặp dễ nhầm ン (n) và ソ (so).
  - vi: Hiểu vì sao "hotel" thành ホテル - âm "l" và phụ âm cuối trong từ ngoại lai.
