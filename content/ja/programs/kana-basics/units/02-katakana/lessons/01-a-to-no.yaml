title:
  vi: Katakana ア đến ノ
objectives:
  - vi: Hiểu khi nào tiếng Nhật dùng Katakana thay cho Hiragana.
  - vi: Đọc và viết năm hàng đầu ア, カ, サ, タ, ナ.
  - vi: Phân biệt cặp dễ nhầm シ (shi) và ツ (tsu); đọc アイス, ネクタイ.
estimated_minutes: 12
skills: [reading, writing]
prerequisites: [ja:lesson:hira-yoon-sokuon-long]
