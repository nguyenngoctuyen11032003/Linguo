title:
  vi: Ôn tập - Hiragana và Katakana
objectives:
  - vi: Chọn đúng bảng chữ - Hiragana cho từ thuần Nhật, Katakana cho từ ngoại lai.
  - vi: Phân biệt các cặp dễ nhầm シ/ツ, ン/ソ, ぬ/め và chữ nhỏ/chữ to.
  - vi: Đọc và viết lại các từ đã học trong hai unit đầu.
