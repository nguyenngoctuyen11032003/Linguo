key: ja:lesson:kata-dakuten-yoon
order_index: 3
level: kana
title:
  vi: Katakana - âm đục, âm ghép và âm ngắt
objectives:
  - vi: Đọc Katakana có dấu ゛ và ゜ (ガ, ザ, ダ, バ, パ).
  - vi: Đọc âm ghép (キャ, シュ, チョ) và âm ngắt ッ trong Katakana.
  - vi: Đọc các từ パン, テレビ, シャツ, ベッド.
estimated_minutes: 12
skills: [reading, writing, listening]
prerequisites: [ja:lesson:kata-ha-to-n]
