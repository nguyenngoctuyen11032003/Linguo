body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được món mình thích và gọi tên nhiều món ăn - すきなたべものはラーメンです。ぶたにくがすきです。
  - type: explain
    text:
      vi: "Thức ăn: たまご (trứng), くだもの (trái cây) gồm りんご (táo), みかん (quýt), バナナ (chuối). Món ăn: おにぎり (cơm nắm), ラーメン (mì), サラダ (salad), スープ (súp), おべんとう (cơm hộp), りょうり (món ăn, nấu ăn)."
  - type: explain
    text:
      vi: Thịt gọi theo con vật + にく - ぶたにく (thịt lợn), とりにく (thịt gà), ぎゅうにく (thịt bò). にく đứng một mình là "thịt" nói chung. たべもの là đồ ăn nói chung - hỏi すきなたべものはなんですか.
  - type: explain
    text:
      vi: Súp dùng のみます (uống) chứ không dùng たべます - スープをのみます. Nấu ăn là りょうりをします / つくります, giỏi nấu ăn là りょうりがじょうずです.
  - type: deep_explain
    text:
      vi: Bữa sáng ở Nhật hay có たまご, パン hoặc ごはん và スープ; bữa trưa mang theo おべんとう. おにぎり (cơm nắm) bán ở コンビニ rất phổ biến và rẻ. Chữ Hán - 卵, 果物, 豚肉, 鶏肉, 牛肉, お弁当, 料理, 食べ物.
  - type: example
    target: あさごはんにたまごとパンをたべます。
    target_lang: ja
    translation:
      vi: Bữa sáng tôi ăn trứng và bánh mì.
    note:
      vi: と - liệt kê.
  - type: example
    target: ぶたにくよりとりにくがすきです。
    target_lang: ja
    translation:
      vi: Tôi thích thịt gà hơn thịt lợn.
    note:
      vi: より - so với (sẽ học kỹ ở N4).
  - type: example
    target: コンビニでおにぎりをかいます。
    target_lang: ja
    translation:
      vi: Tôi mua cơm nắm ở cửa hàng tiện lợi.
    note:
      vi: で - nơi mua.
  - type: example
    target: スープをのみます。
    target_lang: ja
    translation:
      vi: Tôi ăn (uống) súp.
    note:
      vi: Súp dùng のみます.
  - type: common_mistake
    wrong: スープをたべます。
    right: スープをのみます。
    target_lang: ja
    note:
      vi: Súp dùng のみます (uống), không dùng たべます.
  - type: common_mistake
    wrong: ぶたをたべます。(thịt lợn)
    right: ぶたにくをたべます。
    target_lang: ja
    note:
      vi: "Nói tên món cần にく: ぶたにく; ぶた là con lợn."
  - type: summary
    points:
      - vi: たまご trứng · くだもの trái cây · りんご táo · みかん quýt · バナナ chuối.
      - vi: おにぎり cơm nắm · ラーメン mì · サラダ salad · スープ súp · おべんとう cơm hộp.
      - vi: ぶたにく lợn · とりにく gà · ぎゅうにく bò.
      - vi: スープを のみます (uống).
