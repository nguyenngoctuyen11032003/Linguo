    item: ja:item:n5-u19-obentou
    prompt:
      source_text: まいあさおべんとうをつくります。たまごとおにぎりをいれます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Sáng nào tôi cũng làm cơm hộp. Tôi bỏ trứng và cơm nắm vào.
        - Mỗi sáng tôi làm cơm hộp. Cho trứng và cơm nắm vào.
        - Sáng nào tôi cũng làm cơm hộp, bỏ trứng và cơm nắm vào.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Sáng nào tôi cũng mua cơm hộp. Tôi bỏ trứng và cơm nắm vào.
        feedback_vi: つくります là làm, không phải mua.
        error_tag: verb_choice
    explanation:
      vi: つくります - làm; いれます - bỏ vào; おべんとう - cơm hộp.
    display_answer: Sáng nào tôi cũng làm cơm hộp. Tôi bỏ trứng và cơm nắm vào.
