    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u19-onaka-sukimashita
    prompt:
      stem: Bạn muốn nói “Tôi đói rồi”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: zhv
          text: おなかがいたいです。
          lang: ja
        - id: nof
          text: ねむいです。
          lang: ja
        - id: spd
          text: のどがかわきました。
          lang: ja
        - id: zml
          text: おなかがすきました。
          lang: ja
    answer:
      correct_option_id: zml
    explanation:
      vi: おなかがすきました là đói. おなかがいたい là đau bụng, のどがかわきました là khát, ねむい là buồn ngủ.
    display_answer: おなかがすきました。
