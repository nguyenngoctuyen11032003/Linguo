body:
  - type: objective
    text:
      vi: Sau bài này, bạn hoàn thành một lần ăn ở nhà hàng - ちゅうもんをおねがいします。ごちそうさまでした。おかいけいをおねがいします。
  - type: explain
    text:
      vi: Cảm giác - おなかがすきました (đói rồi), のどがかわきました (khát rồi). Cả hai đều dùng thì quá khứ nhưng nghĩa là "đã đói/khát" tức là bây giờ đang đói/khát.
  - type: explain
    text:
      vi: Ở nhà hàng - nhân viên nói いらっしゃいませ; bạn nhờ メニューをおねがいします, gọi món ちゅうもんをおねがいします rồi N を ください. Trước khi ăn nói いただきます, sau khi ăn ごちそうさまでした.
  - type: explain
    text:
      vi: Tính tiền - おかいけいをおねがいします (làm ơn tính tiền). Hỏi giá - いくらですか; cảm ơn - ごちそうさまでした. Ở Nhật thường không có tiền boa.
  - type: deep_explain
    text:
      vi: おなかがすきました và のどがかわきました dùng thì quá khứ ました nhưng thực ra mô tả trạng thái hiện tại - giống "tôi đói rồi" trong tiếng Việt. Khi muốn rủ, nói おなかがすきましたね、なにかたべませんか (Đói rồi nhỉ, mình ăn gì nhé?). Chữ Hán - 注文, お会計.
  - type: example
    target: おなかがすきました。ラーメンをたべませんか。
    target_lang: ja
    translation:
      vi: Tôi đói rồi. Chúng ta ăn ramen nhé?
    note:
      vi: おなかがすきました - đói rồi.
  - type: example
    target: すみません、ちゅうもんをおねがいします。ラーメンとビールをください。
    target_lang: ja
    translation:
      vi: Xin lỗi, cho tôi gọi món. Cho tôi ramen và bia.
    note:
      vi: ちゅうもん - gọi món.
  - type: example
    target: のどがかわきました。みずをください。
    target_lang: ja
    translation:
      vi: Tôi khát rồi. Cho tôi nước.
    note:
      vi: のどがかわきました - khát rồi.
  - type: example
    target: ごちそうさまでした。おかいけいをおねがいします。
    target_lang: ja
    translation:
      vi: Cảm ơn bữa ăn. Làm ơn tính tiền.
    note:
      vi: おかいけい - thanh toán.
  - type: common_mistake
    wrong: おなかがすきます。(đang đói)
    right: おなかがすきました。
    target_lang: ja
    note:
      vi: Nói "đói rồi" dùng ました; すきます nghe như thói quen hoặc tương lai.
  - type: common_mistake
    wrong: いただきますといいます。(sau bữa ăn)
    right: ごちそうさまでしたといいます。
    target_lang: ja
    note:
      vi: Sau bữa ăn nói ごちそうさまでした; いただきます nói trước khi ăn.
  - type: summary
    points:
      - vi: おなかがすきました · のどがかわきました - đói, khát.
      - vi: メニューを おねがいします · ちゅうもんを おねがいします · N を ください.
      - vi: おかいけいを おねがいします - tính tiền.
      - vi: いただきます (trước) · ごちそうさまでした (sau).
exercises:
