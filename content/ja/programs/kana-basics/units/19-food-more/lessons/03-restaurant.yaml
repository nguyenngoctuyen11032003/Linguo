title:
  vi: Ở nhà hàng - ちゅうもん・おなかがすきました
objectives:
  - vi: Nói đói, khát bằng おなかがすきました, のどがかわきました.
  - vi: Gọi món và thanh toán bằng ちゅうもん, メニュー, おかいけい.
  - vi: Hội thoại mẫu ở nhà hàng từ lúc vào đến lúc trả tiền.
