body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi tên đồ uống, gia vị và đồ dùng khi ăn - しおをとってください。コップにみずをいれます。
  - type: explain
    text:
      vi: "Đồ uống: のみもの (đồ uống nói chung), ジュース (nước ép, nước ngọt), ビール (bia), おさけ (rượu), ぎゅうにゅう (sữa bò), みず, おちゃ, コーヒー (đã học). Hỏi - のみものはなにがいいですか."
  - type: explain
    text:
      vi: "Gia vị: さとう (đường), しお (muối), しょうゆ (xì dầu). Đồ dùng ăn: はし (đũa), スプーン (thìa), さら (đĩa), コップ (cốc), ちゃわん (bát cơm)."
  - type: explain
    text:
      vi: Nhờ lấy đồ ở bàn - しおをとってください (xin lấy giúp tôi muối). てください sẽ học kỹ ở N4; bây giờ bạn nhận ra và dùng cụm này như một câu mẫu.
  - type: deep_explain
    text:
      vi: はし (箸, đũa) đọc giống はし (橋, cầu) nhưng ngữ cảnh khác. おさけ trong hội thoại là đồ uống có cồn nói chung; Nhật Bản gọi rượu gạo là にほんしゅ hoặc おさけ. ちゃわん dùng cho cơm và chén trà; コップ dùng cho nước, nhưng cũng có từ カップ cho tách cà phê. Chữ Hán - 飲み物, 牛乳, 砂糖, 塩, 醤油, 箸, 皿, 茶碗.
  - type: example
    target: のみものはなにがいいですか。- ジュースをください。
    target_lang: ja
    translation:
      vi: Bạn muốn uống gì? - Cho tôi nước ép.
    note:
      vi: N をください - xin cho N.
  - type: example
    target: コップにみずをいれます。
    target_lang: ja
    translation:
      vi: Tôi rót nước vào cốc.
    note:
      vi: いれます - cho vào.
  - type: example
    target: はしでごはんをたべます。
    target_lang: ja
    translation:
      vi: Tôi ăn cơm bằng đũa.
    note:
      vi: で - phương tiện.
  - type: example
    target: しおをとってください。
    target_lang: ja
    translation:
      vi: Xin lấy giúp tôi muối.
    note:
      vi: とって - thể て của とります.
  - type: common_mistake
    wrong: スプーンでごはんをたべます。(cơm Nhật thường dùng đũa)
    right: はしでごはんをたべます。
    target_lang: ja
    note:
      vi: Cơm thường ăn bằng はし; スプーン dùng cho súp hoặc món như curry.
  - type: common_mistake
    wrong: ジュースをたべます。
    right: ジュースをのみます。
    target_lang: ja
    note:
      vi: Đồ uống dùng のみます.
  - type: summary
    points:
      - vi: のみもの đồ uống · ジュース · ビール · おさけ · ぎゅうにゅう.
      - vi: さとう đường · しお muối · しょうゆ xì dầu.
      - vi: はし đũa · スプーン thìa · さら đĩa · コップ cốc · ちゃわん bát.
      - vi: しおを とってください - nhờ lấy muối.
