        - Xin lỗi, lấy giúp tôi muối. Cảm ơn bạn.
        - Xin lỗi, làm ơn lấy muối giúp tôi. Cảm ơn.
        - Xin lỗi, lấy hộ tôi lọ muối. Xin cảm ơn.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Xin lỗi, lấy giúp tôi đường. Cảm ơn bạn.
        feedback_vi: しお là muối, さとう mới là đường.
        error_tag: vocab_meaning
