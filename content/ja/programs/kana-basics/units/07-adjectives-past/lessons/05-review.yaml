title:
  vi: Ôn tập - Kể chuyện cuối tuần
objectives:
  - vi: Kể lại một chuyến đi cuối tuần bằng động từ quá khứ ました / ませんでした.
  - vi: Tả cảm nghĩ bằng tính từ い và な ở hiện tại và quá khứ.
  - vi: Hỏi và trả lời どうでしたか một cách tự nhiên.
estimated_minutes: 20
skills: [grammar, vocabulary, reading, speaking, writing]
prerequisites: [ja:lesson:adjective-past]
