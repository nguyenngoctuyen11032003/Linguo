key: ja:lesson:na-adjectives
order_index: 2
level: n5
title:
  vi: Tính từ đuôi な - しずかです・しずかなまち
objectives:
  - vi: Miêu tả nơi chốn, con người bằng tính từ đuôi な + です.
  - vi: Phủ định tính từ な bằng じゃありません (giống danh từ).
  - vi: Thêm な khi tính từ đứng trước danh từ - しずかなまち.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:i-adjectives]
items:
  - item: ja:item:na-adjective
  - item: ja:item:kirei
  - item: ja:item:shizuka-nigiyaka
  - item: ja:item:yuumei
