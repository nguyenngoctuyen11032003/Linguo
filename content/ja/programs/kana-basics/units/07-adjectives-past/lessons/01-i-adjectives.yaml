key: ja:lesson:i-adjectives
order_index: 1
level: n5
title:
  vi: Tính từ đuôi い - おおきいです・おおきくないです
objectives:
  - vi: Miêu tả đồ vật, thời tiết bằng tính từ đuôi い + です.
  - vi: Đổi tính từ い sang phủ định くないです, kể cả いい → よくないです.
  - vi: Đặt tính từ い ngay trước danh từ - ちいさいかばん.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:food-shopping-review]
items:
  - item: ja:item:i-adjective
  - item: ja:item:ookii-chiisai
