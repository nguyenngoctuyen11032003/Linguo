title:
  vi: Đi, đến, về - いきます・きます・かえります
objectives:
  - vi: Nói đi đâu bằng nơi chốn + へ + いきます.
  - vi: Phân biệt いきます (đi), きます (đến chỗ người nói), かえります (về).
  - vi: Viết đúng trợ từ へ (đọc "e") và phủ định ません.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:places-existence]
