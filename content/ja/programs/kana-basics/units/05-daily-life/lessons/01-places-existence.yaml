key: ja:lesson:places-existence
order_index: 1
level: n5
title:
  vi: Ở đâu? - ここ・そこ・あそこ, あります・います
objectives:
  - vi: Hỏi đường đơn giản bằng N はどこですか và chỉ chỗ bằng ここ / そこ / あそこ.
  - vi: Nói "có" đúng loại - あります (đồ vật) và います (người, con vật).
  - vi: Dùng nơi chốn + に với あります / います.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:numbers-time-review]
items:
  - item: ja:item:koko-soko-asoko
  - item: ja:item:doko
  - item: ja:item:arimasu-imasu
  - item: ja:item:gakkou
  - item: ja:item:eki
  - item: ja:item:toire
  - item: ja:item:sumimasen
    role: reuse
  - item: ja:item:neko
