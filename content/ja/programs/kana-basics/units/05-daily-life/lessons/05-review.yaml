title:
  vi: Ôn tập - Một ngày của tôi
objectives:
  - vi: Kể lịch sinh hoạt hằng ngày bằng câu có thời gian, nơi chốn, đối tượng và động từ.
  - vi: Chọn đúng trợ từ に (thời điểm, nơi tồn tại), へ (hướng), で (nơi hành động), を (đối tượng).
  - vi: Phân biệt あります / います và ます / ません.
estimated_minutes: 15
skills: [grammar, speaking, listening, writing]
