title:
  vi: Một ngày của tôi - đuôi ます・ません
objectives:
  - vi: Kể lịch sinh hoạt bằng động từ đuôi ます - おきます, ねます, はたらきます, べんきょうします.
  - vi: Nói giờ làm việc gì bằng 〜じに; biết từ nào không đi với に.
  - vi: Phủ định bằng ません.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:going]
