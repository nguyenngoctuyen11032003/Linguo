title:
  vi: Âm ghép, âm ngắt っ và trường âm
objectives:
  - vi: Đọc âm ghép với ゃ ゅ ょ viết nhỏ (きゃ, しゅ, ちょ…).
  - vi: Đọc và viết âm ngắt っ (きって, がっこう).
  - vi: Phân biệt nguyên âm ngắn và dài (おばさん / おばあさん).
