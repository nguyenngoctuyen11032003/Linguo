key: ja:lesson:hira-dakuten
order_index: 4
level: kana
title:
  vi: Âm đục ゛ và âm bán đục ゜
objectives:
  - vi: Đổi k→g, s→z, t→d, h→b bằng dấu ゛ (dakuten).
  - vi: Đổi h→p bằng vòng tròn ゜ (handakuten).
  - vi: Đọc các từ かぎ, かばん, えんぴつ.
estimated_minutes: 12
skills: [reading, writing, listening]
prerequisites: [ja:lesson:hira-ha-to-n]
items:
  - item: ja:item:hira-dakuten
  - item: ja:item:hira-handakuten
