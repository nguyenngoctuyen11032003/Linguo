key: ja:lesson:hira-ha-to-n
order_index: 3
level: kana
title:
  vi: Hàng は, ま, や, ら, わ và ん
objectives:
  - vi: Đọc và viết các hàng は, ま, や, ら, わ và chữ ん.
  - vi: Phát âm đúng ふ (fu), âm r của tiếng Nhật và ん đứng cuối.
  - vi: Đọc các từ はな, やま, さくら, わたし, ほん.
estimated_minutes: 14
skills: [reading, writing, listening]
prerequisites: [ja:lesson:hira-sa-ta-na]
items:
  - item: ja:item:hira-ha
  - item: ja:item:hira-ma
  - item: ja:item:hira-ya
  - item: ja:item:hira-ra
