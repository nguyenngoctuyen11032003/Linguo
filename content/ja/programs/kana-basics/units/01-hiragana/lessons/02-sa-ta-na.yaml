key: ja:lesson:hira-sa-ta-na
order_index: 2
level: kana
title:
  vi: Hàng さ, た, な
objectives:
  - vi: Đọc và viết ba hàng さ, た, な.
  - vi: Nhớ ba chữ đọc khác quy luật - し (shi), ち (chi), つ (tsu).
  - vi: Đọc các từ すし, いぬ, ねこ.
estimated_minutes: 12
skills: [reading, writing, listening]
prerequisites: [ja:lesson:hira-vowels-ka]
items:
  - item: ja:item:hira-sa
  - item: ja:item:hira-ta
  - item: ja:item:hira-na
