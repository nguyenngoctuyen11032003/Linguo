body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được thời điểm trong ngày - まいあさ６じにおきます。ごご３じにかえります。こんばんともだちにあいます。
  - type: explain
    text:
      vi: "Các buổi: あさ (sáng), ひる (trưa), ゆうがた (chiều tối), よる / ばん (tối, đêm). Giờ: ごぜん (trước 12 giờ), ごご (sau 12 giờ) - ごぜん９じ (9 giờ sáng), ごご３じ (3 giờ chiều)."
  - type: explain
    text:
      vi: "Mỗi + buổi: まいあさ (sáng nào cũng), まいばん (tối nào cũng), まいにち (ngày nào cũng). こんばん là tối nay; ゆうべ là tối hôm qua. Không thêm に sau các từ này - まいあさ コーヒーを のみます."
  - type: explain
    text:
      vi: "Chuỗi ngày: おととい (hôm kia), きのう (hôm qua), きょう (hôm nay), あした (ngày mai), あさって (ngày kia). Các từ chỉ ngày như きのう, きょう, あした không đi với に."
  - type: deep_explain
    text:
      vi: 'Quy tắc に: từ chỉ thời điểm cụ thể có số (３じに, にちようびに) dùng に; từ chỉ tương đối (きのう, あした, まいあさ, こんばん) không dùng に. こんばんは (xin chào buổi tối) viết は nhưng đọc "wa". Chữ Hán - 朝, 昼, 夜, 晩, 午前, 午後, 夕方, 今晩, 毎朝, 毎晩, 明後日, 一昨日.'
  - type: example
    target: まいあさ６じにおきます。
    target_lang: ja
    translation:
      vi: Sáng nào tôi cũng dậy lúc 6 giờ.
    note:
      vi: まいあさ - không có に; ６じに - có に.
  - type: example
    target: ごぜん９じにあいましょう。
    target_lang: ja
    translation:
      vi: Hẹn gặp nhau lúc 9 giờ sáng.
    note:
      vi: ごぜん + giờ - giờ buổi sáng.
  - type: example
    target: ゆうべはおそくねました。きょうはねむいです。
    target_lang: ja
    translation:
      vi: Tối qua tôi ngủ muộn. Hôm nay tôi buồn ngủ.
    note:
      vi: ゆうべ - tối qua.
  - type: example
    target: おとといともだちにあいました。あさってもあいます。
    target_lang: ja
    translation:
      vi: Hôm kia tôi đã gặp bạn. Ngày kia cũng gặp.
    note:
      vi: おととい / あさって - hôm kia / ngày kia.
  - type: common_mistake
    wrong: まいあさにコーヒーをのみます。
    right: まいあさコーヒーをのみます。
    target_lang: ja
    note:
      vi: まいあさ không dùng に.
  - type: common_mistake
    wrong: きのうにえいがをみました。
    right: きのうえいがをみました。
    target_lang: ja
    note:
      vi: きのう, あした, きょう không dùng に.
  - type: summary
    points:
      - vi: あさ · ひる · ゆうがた · よる / ばん · ごぜん · ごご.
      - vi: まいあさ · まいばん · こんばん · ゆうべ.
      - vi: おととい · きのう · きょう · あした · あさって.
      - vi: Từ chỉ tương đối không dùng に; giờ cụ thể thì dùng に.
