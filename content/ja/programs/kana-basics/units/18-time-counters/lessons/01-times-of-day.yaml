title:
  vi: Các buổi trong ngày - あさ・ひる・よる・ごぜん・ごご
objectives:
  - vi: "Gọi các buổi trong ngày: あさ, ひる, よる, ゆうがた, ごぜん, ごご."
  - vi: "Nói mốc thời gian hằng ngày: まいあさ, まいばん, こんばん, ゆうべ."
  - vi: "Nói ngày hôm kia, hôm qua, hôm nay, ngày mai, ngày kia: おととい, きのう, きょう, あした, あさって."
