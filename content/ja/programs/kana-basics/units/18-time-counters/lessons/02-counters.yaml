body:
  - type: objective
    text:
      vi: Sau bài này, bạn đếm được thêm nhiều đồ vật và thời gian - ほんをさんさつかいます。ねこがにひきいます。にほんにさんかげつすみます。
  - type: explain
    text:
      vi: "Mỗi loại vật có trợ từ đếm riêng: ～さつ (sách, vở), ～ひき (chó, mèo, cá), ～はい (cốc, chén, bát), ～かい (tầng nhà), ～こ (vật nhỏ, tròn), ～ばん (số hiệu). Số đứng trước trợ từ - ほん３さつ, ねこ２ひき."
  - type: explain
    text:
      vi: "Một số trợ từ đổi âm - ～ひき: いっぴき, にひき, さんびき; ～はい: いっぱい, にはい, さんばい; ～かい: いっかい, にかい, さんがい. Hãy học thuộc các dạng đặc biệt của 1, 3, 6, 8, 10."
  - type: explain
    text:
      vi: Đếm thời lượng - ～しゅうかん (tuần), ～かげつ (tháng), ～ねん (năm). Khác với ～がつ, ～にち, ～ねん dùng trong lịch. Ví dụ ３かげつ là "ba tháng", ３がつ là "tháng 3".
  - type: deep_explain
    text:
      vi: Hỏi số lượng - なんさつ, なんびき, なんばい, なんがい, なんこ, なんしゅうかん, なんかげつ, なんねん. Chú ý ～かい có hai nghĩa - 回 (lần) và 階 (tầng); さんがい là tầng ba, さんかい là ba lần. Dạng よねん (4 năm) bất quy tắc, không nói よんねん. Chữ Hán - 冊, 匹, 杯, 階, 番, 個, 週間, か月, 年.
  - type: example
    target: ほんをさんさつかいました。
    target_lang: ja
    translation:
      vi: Tôi đã mua ba quyển sách.
    note:
      vi: さんさつ - ba quyển.
  - type: example
    target: ねこがにひきいます。
    target_lang: ja
    translation:
      vi: Có hai con mèo.
    note:
      vi: にひき - hai con.
  - type: example
    target: コーヒーをにはいのみました。
    target_lang: ja
    translation:
      vi: Tôi đã uống hai tách cà phê.
    note:
      vi: にはい - hai tách.
  - type: example
    target: にほんにさんかげつすみます。
    target_lang: ja
    translation:
      vi: Tôi sống ở Nhật ba tháng.
    note:
      vi: さんかげつ - ba tháng (thời lượng).
  - type: common_mistake
    wrong: ほんをさんほんかいます。
    right: ほんをさんさつかいます。
    target_lang: ja
    note:
      vi: Sách đếm bằng ～さつ, không dùng ～ほん (～ほん dành cho vật dài như bút, chai).
  - type: common_mistake
    wrong: ここにねこがさんひきいます。(sai âm)
    right: ここにねこがさんびきいます。
    target_lang: ja
    note:
      vi: ３ + ひき đọc さんびき (biến âm ひ → び).
  - type: summary
    points:
      - vi: ～さつ sách · ～ひき con vật nhỏ · ～はい cốc, chén · ～かい tầng · ～こ vật nhỏ, tròn.
      - vi: Biến âm - いっぴき · さんびき · いっぱい · さんばい · さんがい.
      - vi: ～しゅうかん · ～かげつ · ～ねん - thời lượng.
      - vi: Hỏi - なんさつ, なんびき, なんかげつ...
exercises:
