      stem_lang: vi
      options:
        - id: xwt
          text: ～だい
          lang: ja
        - id: ybv
          text: ～さつ
          lang: ja
        - id: e2l
          text: ～ほん
          lang: ja
        - id: q3r
          text: ～まい
          lang: ja
