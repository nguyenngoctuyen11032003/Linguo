  - key: ja:exercise:more-counters-hai-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u18-hai-counter
    prompt:
      template: コーヒーを{{b1}}のみました。 (Tôi đã uống hai tách cà phê.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Số 2 + trợ từ đếm cốc, chén.
        - Bắt đầu bằng に - にはい.
    answer:
      blanks:
        b1:
          - にはい
          - ２はい
          - ２杯
          - 二杯
    known_wrong:
      - answer: にほん
        feedback_vi: ほん dành cho vật dài; cốc là はい.
        error_tag: counter
      - answer: にひき
        feedback_vi: ひき dành cho con vật nhỏ.
        error_tag: counter
    explanation:
      vi: "Cốc, chén đếm bằng ～はい: いっぱい, にはい, さんばい."
    display_answer: コーヒーをにはいのみました。
