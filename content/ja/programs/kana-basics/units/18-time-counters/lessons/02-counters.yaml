    explanation:
      vi: Sách, vở đếm bằng ～さつ. ～ほん dành cho vật dài, ～まい cho vật mỏng, ～だい cho máy móc, xe.
    display_answer: ～さつ
  - key: ja:exercise:more-counters-hiki
