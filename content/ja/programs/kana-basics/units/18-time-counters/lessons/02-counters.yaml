    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u18-hiki
    prompt:
      source_text: Nhà tôi có hai con mèo.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - うちにねこがにひきいます。
        - 家に猫が二匹います。
        - わたしのうちにねこがにひきいます。
        - うちにはねこがにひきいます。
    known_wrong:
      - answer: うちにねこがにほんいます。
        feedback_vi: Con vật đếm bằng ひき.
        error_tag: counter
      - answer: うちにねこがふたりいます。
        feedback_vi: ふたり dùng cho người.
        error_tag: counter
    explanation:
      vi: ねこ + にひき - hai con mèo; います - có (con vật).
    display_answer: うちにねこがにひきいます。
