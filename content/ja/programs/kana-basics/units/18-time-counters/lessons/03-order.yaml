body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được một quá trình theo thứ tự - まずおゆをわかします。つぎにおちゃをいれます。さいごにのみます。
  - type: explain
    text:
      vi: "Từ chỉ thứ tự: はじめて (lần đầu), さいしょ (đầu tiên), さいご (cuối cùng), つぎ (tiếp theo), まず (trước tiên). Câu kể thứ tự thường theo khuôn まず - つぎに - さいごに."
  - type: explain
    text:
      vi: "Thời điểm: もうすぐ (sắp), こんど (lần này, lần sau), ずっと (suốt, mãi). Ví dụ もうすぐなつやすみです; こんどのにちようびにあいましょう; ずっとここにすみたいです."
  - type: explain
    text:
      vi: Nối bằng そして (và), それから (sau đó). Câu hoàn chỉnh - まずあさごはんをたべます。それから、がっこうへいきます。さいごに、ともだちにあいます.
  - type: deep_explain
    text:
      vi: 'こんど nghĩa là "lần này" khi kể chuyện đã xảy ra gần đây, nhưng khi nói về tương lai nghĩa là "lần tới" - こんどのにちようび (Chủ nhật tới). さいしょ và はじめて khác nhau: はじめて là "lần đầu tiên làm gì" (はじめてにほんへきました), さいしょ là "đầu tiên, ban đầu" (さいしょはむずかしかったです). ずっと cũng dùng để so sánh "hơn hẳn" (N4). Chữ Hán - 初めて, 最初, 最後, 次, 今度.'
  - type: example
    target: はじめてにほんへきました。
    target_lang: ja
    translation:
      vi: Tôi đến Nhật lần đầu.
    note:
      vi: はじめて - lần đầu tiên.
  - type: example
    target: まずてをあらいます。つぎにごはんをたべます。さいごにおちゃをのみます。
    target_lang: ja
    translation:
      vi: Trước tiên tôi rửa tay. Tiếp theo ăn cơm. Cuối cùng uống trà.
    note:
      vi: まず - つぎに - さいごに.
  - type: example
    target: もうすぐなつやすみです。
    target_lang: ja
    translation:
      vi: Sắp đến kỳ nghỉ hè.
    note:
      vi: もうすぐ - sắp.
  - type: example
    target: こんどのにちようびにあいましょう。
    target_lang: ja
    translation:
      vi: Chủ nhật tuần tới hãy gặp nhau.
    note:
      vi: こんどの - tới, sau.
  - type: common_mistake
    wrong: さいしょにほんへきました。(lần đầu đến Nhật)
    right: はじめてにほんへきました。
    target_lang: ja
    note:
      vi: Lần đầu tiên làm gì dùng はじめて; さいしょ chỉ thứ tự đầu tiên.
  - type: common_mistake
    wrong: つぎにおりません。
    right: つぎのえきでおります。
    target_lang: ja
    note:
      vi: つぎ + の + danh từ để nói "tiếp theo"; つぎに là "tiếp đó" đứng đầu vế sau.
  - type: summary
    points:
      - vi: はじめて lần đầu · さいしょ đầu tiên · さいご cuối cùng · つぎ tiếp theo · まず trước tiên.
      - vi: もうすぐ sắp · こんど lần này, lần tới · ずっと suốt, mãi.
      - vi: "まず - つぎに - さいごに: khuôn kể quá trình."
      - vi: そして · それから nối các bước.
