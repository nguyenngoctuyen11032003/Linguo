title:
  vi: Trăm, nghìn, vạn và tiền yên
objectives:
  - vi: Nói số đến hàng chục nghìn bằng ひゃく, せん, まん.
  - vi: Nhớ các số đổi âm - さんびゃく, ろっぴゃく, はっぴゃく, さんぜん, はっせん.
  - vi: Hỏi giá bằng いくらですか và đọc giá tiền yên.
estimated_minutes: 15
skills: [vocabulary, listening, speaking]
prerequisites: [ja:lesson:numbers-0-99]
