        - { id: b2, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Bây giờ là mấy giờ? - 5 giờ rưỡi."
        - Chỗ thứ nhất là "bây giờ"; chỗ thứ hai là "rưỡi".
    answer:
      blanks:
        b1: [いま, 今]
        b2: [はん, 半, さんじゅっぷん, さんじっぷん]
    known_wrong:
      - answer: きょう
        feedback_vi: きょう là hôm nay; "bây giờ" là いま.
        error_tag: time_word
    explanation:
      vi: いま - bây giờ; ごじはん - 5 giờ rưỡi.
    display_answer: いまなんじですか。- ごじはんです。

