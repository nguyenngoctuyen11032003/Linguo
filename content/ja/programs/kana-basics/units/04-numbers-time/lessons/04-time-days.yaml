  - key: ja:exercise:timedays-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:ima
    prompt:
      template: "{{b1}}なんじですか。- ごじ{{b2}}です。"
      blanks:
