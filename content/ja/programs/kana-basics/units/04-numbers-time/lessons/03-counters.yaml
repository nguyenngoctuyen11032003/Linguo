title:
  vi: Đếm đồ vật và đếm người
objectives:
  - vi: Đếm đồ vật từ 1 đến 10 bằng ひとつ, ふたつ… とお; hỏi bằng いくつ.
  - vi: Đếm người bằng 〜にん, nhớ ひとり, ふたり, よにん; hỏi bằng なんにん.
  - vi: Nói gia đình mình có bao nhiêu người.
