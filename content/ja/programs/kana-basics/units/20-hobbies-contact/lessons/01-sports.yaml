body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được sở thích và khả năng - テニスがすきです。ピアノがじょうずです。
  - type: explain
    text:
      vi: "Thể thao: スポーツ, テニス, サッカー, やきゅう (bóng chày), ゴルフ. Dùng する với thể thao và trò chơi - テニスをします, サッカーをします, ゲームをします."
  - type: explain
    text:
      vi: Nhạc cụ dùng ひきます - ピアノをひきます, ギターをひきます. Hát là うたをうたいます (カラオケでうたいます). Vẽ tranh là えをかきます, nhảy là ダンスをします.
  - type: explain
    text:
      vi: "Sở thích - しゅみは ～です. Câu mẫu: わたしの しゅみは どくしょです. Hỏi - しゅみは なんですか. Thích - N が すきです, giỏi - N が じょうずです."
  - type: deep_explain
    text:
      vi: Với thể thao xem hay chơi có hai cách nói - テニスをします (chơi tennis) và テニスをみます (xem tennis). Nhạc cụ thường dùng ひく cho đàn có dây, phím (ピアノ, ギター); thổi sáo là ふえをふきます. かいもの là mua sắm; thường ghép かいものに いきます. Chữ Hán - 野球, 歌, 絵, 買い物, 読書.
  - type: example
    target: にちようびにともだちとテニスをします。
    target_lang: ja
    translation:
      vi: Chủ nhật tôi chơi tennis với bạn.
    note:
      vi: N と N をします - chơi cùng.
  - type: example
    target: わたしのしゅみはピアノをひくことです。
    target_lang: ja
    translation:
      vi: Sở thích của tôi là chơi piano.
    note:
      vi: ひくこと - việc chơi (đàn).
  - type: example
    target: カラオケでうたをうたいます。
    target_lang: ja
    translation:
      vi: Tôi hát ở karaoke.
    note:
      vi: うたをうたいます - hát bài hát.
  - type: example
    target: えがじょうずです。
    target_lang: ja
    translation:
      vi: Tôi vẽ giỏi.
    note:
      vi: N が じょうずです.
  - type: common_mistake
    wrong: ピアノをします。
    right: ピアノをひきます。
    target_lang: ja
    note:
      vi: Đàn dùng ひきます, không dùng します.
  - type: common_mistake
    wrong: サッカーをうたいます。
    right: サッカーをします。
    target_lang: ja
    note:
      vi: Thể thao dùng します; うたいます chỉ dùng với うた.
  - type: summary
    points:
      - vi: スポーツ · テニス · サッカー · やきゅう · ゴルフ · ゲーム · ダンス - dùng します.
      - vi: ピアノ · ギター - ひきます · うた - うたいます · え - かきます.
      - vi: しゅみは ～です · N が すき / じょうずです.
      - vi: かいもの · どくしょ · カラオケ.
