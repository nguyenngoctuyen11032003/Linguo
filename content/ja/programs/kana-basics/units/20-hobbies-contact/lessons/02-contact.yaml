    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u20-denwa
    prompt:
      stem: Bạn gọi điện cho bạn. Cụm nào đúng?
      stem_lang: vi
      options:
        - id: ze9
          text: でんわをかきます
          lang: ja
        - id: g2d
          text: でんわをおくります
          lang: ja
        - id: jzi
          text: でんわをかけます
          lang: ja
        - id: pyk
          text: でんわをみます
          lang: ja
    answer:
      correct_option_id: jzi
    explanation:
      vi: Gọi điện dùng でんわを かけます. おくります dùng cho thư, email; かきます là viết; みます là xem.
    display_answer: でんわをかけます
