body:
  - type: objective
    text:
      vi: Sau bài này, bạn hỏi và nói thông tin liên lạc - でんわばんごうはなんばんですか。メールをおくります。
  - type: explain
    text:
      vi: "Liên lạc: でんわ (điện thoại), けいたい (di động), スマホ (smartphone), メール (email, tin nhắn), じゅうしょ (địa chỉ), ばんごう (số). でんわばんごう là số điện thoại, đã học ở bài đếm số."
  - type: explain
    text:
      vi: "Động từ: でんわを かけます (gọi), でんわに でます (nghe máy), メールを おくります (gửi), なまえと じゅうしょを かきます (viết). Mở đầu cuộc gọi - もしもし, rồi giới thiệu tên - もしもし、たなかです."
  - type: explain
    text:
      vi: Hỏi thông tin - でんわばんごうは なんばんですか (Số điện thoại là số mấy?), じゅうしょは どこですか (Địa chỉ ở đâu?). Trả lời từng chữ số - ０９０の１２３４の５６７８.
  - type: deep_explain
    text:
      vi: Số điện thoại đọc từng chữ số và dùng の để ngăn nhóm số - ゼロきゅうゼロ の いちにさんよん の ごろくななはち. けいたい là viết tắt của けいたいでんわ; ngày nay hay nói スマホ. おくります nghĩa là "gửi" (thư, email) và cũng là "tiễn" (ともだちを えきまで おくります); khác おくれます (muộn). Chữ Hán - 電話, 携帯, 住所, 番号, 送ります.
  - type: example
    target: もしもし、たなかです。
    target_lang: ja
    translation:
      vi: A lô, Tanaka đây ạ.
    note:
      vi: もしもし - mở đầu khi gọi/nghe điện thoại.
  - type: example
    target: でんわばんごうはなんばんですか。
    target_lang: ja
    translation:
      vi: Số điện thoại là số mấy?
    note:
      vi: なんばん - số mấy.
  - type: example
    target: ともだちにメールをおくります。
    target_lang: ja
    translation:
      vi: Tôi gửi email cho bạn.
    note:
      vi: に - người nhận.
  - type: example
    target: じゅうしょとなまえをかきます。
    target_lang: ja
    translation:
      vi: Tôi viết địa chỉ và tên.
    note:
      vi: と - liệt kê.
  - type: common_mistake
    wrong: でんわをします。(gọi cho ai đó)
    right: ともだちにでんわをかけます。
    target_lang: ja
    note:
      vi: Gọi cho ai dùng でんわを かけます. でんわを します cũng dùng nhưng ít hơn và không rõ người nhận.
  - type: common_mistake
    wrong: メールをかけます。
    right: メールをおくります。
    target_lang: ja
    note:
      vi: Gửi email dùng おくります; かけます dùng cho でんわ.
  - type: summary
    points:
      - vi: でんわ điện thoại · けいたい di động · スマホ smartphone · メール email.
      - vi: じゅうしょ địa chỉ · ばんごう số · でんわばんごう số điện thoại.
      - vi: でんわを かけます · メールを おくります · もしもし.
      - vi: なんばんですか - số mấy?
exercises:
