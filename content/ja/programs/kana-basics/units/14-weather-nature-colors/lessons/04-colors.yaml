    difficulty: 2
    item: ja:item:n5-u14-akai
    prompt:
      source_text: あかいくるまとしろいくるまがあります。あかいくるまはわたしのです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Có xe màu đỏ và xe màu trắng. Xe màu đỏ là của tôi.
        - Có một chiếc xe đỏ và một chiếc xe trắng. Xe đỏ là của tôi.
        - Có xe đỏ và xe trắng. Chiếc xe đỏ là xe của tôi.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Có xe màu đỏ và xe màu trắng. Xe màu trắng là của tôi.
        feedback_vi: あかい là đỏ; xe của tôi là xe đỏ.
        error_tag: color
    explanation:
      vi: あかい / しろい trước くるま bổ nghĩa; わたしのです - là của tôi (の thay danh từ).
    display_answer: Có xe màu đỏ và xe màu trắng. Xe màu đỏ là của tôi.
