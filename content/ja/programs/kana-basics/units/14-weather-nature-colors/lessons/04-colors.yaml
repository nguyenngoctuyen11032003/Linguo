body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được màu sắc - あかいくるま, しろいシャツ - và hỏi なにいろですか。
  - type: explain
    text:
      vi: Màu có đuôi い là tính từ い - あかい (đỏ), あおい (xanh dương), しろい (trắng), くろい (đen), きいろい (vàng). Đứng trước danh từ giữ nguyên - あかいくるま (xe màu đỏ).
  - type: explain
    text:
      vi: Màu không có い là danh từ - ちゃいろ (nâu), みどり (xanh lá), ピンク (hồng), オレンジ (cam). Nối với danh từ bằng の - ちゃいろのくつ (giày màu nâu), ピンクのシャツ (áo màu hồng).
  - type: explain
    text:
      vi: Hỏi màu - なにいろですか (màu gì?) hoặc すきないろはなんですか (màu bạn thích là gì?). Trả lời - あかです / あかがすきです. Nhớ đèn xanh giao thông gọi là あおしんごう, dù màu thật là xanh lá.
  - type: deep_explain
    text:
      vi: Tiếng Nhật xưa có ít từ chỉ màu nên あお bao gồm cả xanh dương lẫn xanh lá. Vì vậy あおしんごう (đèn xanh), あおいそら (bầu trời xanh), あおいりんご (táo xanh). みどり (緑) dùng cho cây cỏ. Chữ Hán - 色, 赤い, 青い, 白い, 黒い, 黄色い, 茶色, 緑.
  - type: example
    target: あかいくるまとしろいくるまがあります。
    target_lang: ja
    translation:
      vi: Có xe màu đỏ và xe màu trắng.
    note:
      vi: あかい + N - tính từ い trước danh từ.
  - type: example
    target: ちゃいろのくつをかいます。
    target_lang: ja
    translation:
      vi: Tôi mua đôi giày màu nâu.
    note:
      vi: ちゃいろ + の + N - màu danh từ cần の.
  - type: example
    target: すきないろはなんですか。- あおです。
    target_lang: ja
    translation:
      vi: Màu bạn thích là gì? - Màu xanh.
    note:
      vi: すきな + N - N yêu thích.
  - type: example
    target: このかばんはなにいろですか。- くろです。
    target_lang: ja
    translation:
      vi: Cái cặp này màu gì? - Màu đen.
    note:
      vi: なにいろ - màu gì.
  - type: common_mistake
    wrong: ちゃいろいくつをかいます。
    right: ちゃいろのくつをかいます。
    target_lang: ja
    note:
      vi: ちゃいろ là danh từ nên nối với の; không thêm い.
  - type: common_mistake
    wrong: くろいのかばんをもっています。
    right: くろいかばんをもっています。
    target_lang: ja
    note:
      vi: "Không thêm の giữa tính từ い và danh từ: くろい + かばん."
  - type: summary
    points:
      - vi: あかい đỏ · あおい xanh dương · しろい trắng · くろい đen · きいろい vàng.
      - vi: ちゃいろ nâu · みどり xanh lá · ピンク hồng · オレンジ cam - nối bằng の.
      - vi: なにいろですか · すきないろは なんですか.
      - vi: あお gồm cả xanh dương lẫn xanh lá.
