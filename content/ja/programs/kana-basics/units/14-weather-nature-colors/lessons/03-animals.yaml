    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u14-kaimasu-pet
    prompt:
      template: いぬを{{b1}}たいです。 (Tôi muốn nuôi chó.)
      blanks:
        - id: b1
          width_hint: 3
    answer:
      blanks:
