body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về các con vật và thú cưng - うちにねこがいます。どうぶつえんでぞうをみます。
  - type: explain
    text:
      vi: "Con vật: いぬ (chó), ねこ (mèo), とり (chim), うま (ngựa), うし (bò), ぶた (lợn), さる (khỉ), くま (gấu), ぞう (voi), むし (côn trùng). どうぶつ là động vật nói chung, どうぶつえん là sở thú."
  - type: explain
    text:
      vi: Con vật dùng います (không dùng あります) - うちにねこがいます. Thú cưng là ペット; nuôi là かいます (飼います) - ねこをかいます (nuôi mèo). Số lượng đếm bằng ひき (一匹, hai con - にひき).
  - type: explain
    text:
      vi: Chú ý かいます có hai nghĩa - 買います (mua) và 飼います (nuôi). Người Việt hay bối rối vì cùng cách đọc; câu ねこをかいます nghĩa là "nuôi mèo" do ngữ cảnh con vật.
  - type: deep_explain
    text:
      vi: Thịt các con vật có từ riêng - ぶたにく (thịt lợn), ぎゅうにく (thịt bò), とりにく (thịt gà). ぞう là con voi và còn xuất hiện trong câu quen thuộc ぞうははながながいです. ペット đếm bằng ひき; chim và côn trùng nhỏ cũng đếm ひき hoặc わ. Chữ Hán - 鳥, 馬, 牛, 豚, 虫, 象, 猿, 熊, 動物, 動物園, 飼います.
  - type: example
    target: うちにいぬとねこがいます。
    target_lang: ja
    translation:
      vi: Nhà tôi có chó và mèo.
    note:
      vi: います - có (con vật).
  - type: example
    target: ぞうははながながいです。
    target_lang: ja
    translation:
      vi: Con voi mũi dài.
    note:
      vi: N は N が A.
  - type: example
    target: にちようびにどうぶつえんへいきます。
    target_lang: ja
    translation:
      vi: Chủ nhật tôi đi sở thú.
    note:
      vi: どうぶつえん - sở thú.
  - type: example
    target: ねこをかいたいです。
    target_lang: ja
    translation:
      vi: Tôi muốn nuôi mèo.
    note:
      vi: "かいたい - muốn nuôi (たい: muốn)."
  - type: common_mistake
    wrong: うちにねこがあります。
    right: うちにねこがいます。
    target_lang: ja
    note:
      vi: Con vật dùng います, không dùng あります.
  - type: common_mistake
    wrong: ねこをいます。
    right: ねこをかいます。
    target_lang: ja
    note:
      vi: います (có, ở) không đi với を. Nuôi mèo là ねこをかいます (飼います).
  - type: summary
    points:
      - vi: いぬ chó · ねこ mèo · とり chim · うま ngựa · うし bò · ぶた lợn · さる khỉ · くま gấu · ぞう voi · むし côn trùng.
      - vi: どうぶつ động vật · どうぶつえん sở thú · ペット thú cưng.
      - vi: ペットを かいます - nuôi thú cưng (飼います) ≠ かいます - mua (買います).
      - vi: Con vật - います; vật vô tri - あります.
