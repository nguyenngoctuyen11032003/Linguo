      stem: Chọn câu đúng - うちにねこが ___。
      stem_lang: vi
      options:
        - id: fix
          text: いきます
          lang: ja
        - id: tlk
          text: います
          lang: ja
        - id: dhp
          text: あります
          lang: ja
        - id: o5v
          text: ありません
