body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được những điều cơ bản về trường học - しゅくだいがあります。らいしゅうしけんです。
  - type: explain
    text:
      vi: "Ở trường: きょうしつ (lớp học), じゅぎょう (tiết học), しゅくだい (bài tập về nhà), しけん (kỳ thi), こくばん (bảng đen), きょうかしょ (sách giáo khoa), クラス (lớp - nhóm học sinh)."
  - type: explain
    text:
      vi: Câu hỏi có hai từ - もんだい là câu hỏi trong bài thi hay bài tập (cũng có nghĩa "vấn đề"), しつもん là câu hỏi bạn hỏi người khác (せんせい、しつもんがあります). こたえ là đáp án.
  - type: explain
    text:
      vi: がくせい là học sinh, sinh viên nói chung; せいと thường chỉ học sinh trường phổ thông (tiểu học đến cấp ba). Gọi một người đang học ở trường nào thì dùng だいがくせい, こうこうせい như bài trước.
  - type: deep_explain
    text:
      vi: 'Tiếng Việt dùng "câu hỏi" cho cả もんだい và しつもん nên người học hay lẫn. Quy tắc: ai đưa ra? Nếu là người ra đề - もんだい; nếu là người muốn biết thông tin - しつもん. しけん và しゅくだい thường dùng với あります (có) hoặc だします (nộp) và します (làm). Chữ Hán - 教室, 授業, 宿題, 試験, 黒板, 教科書, 問題, 答え, 質問, 生徒.'
  - type: example
    target: せんせい、しつもんがあります。
    target_lang: ja
    translation:
      vi: Thưa thầy, em có câu hỏi.
    note:
      vi: しつもん - câu hỏi bạn muốn hỏi.
  - type: example
    target: らいしゅうしけんがありますから、いまべんきょうします。
    target_lang: ja
    translation:
      vi: Tuần sau có kỳ thi nên bây giờ tôi học bài.
    note:
      vi: から nêu lý do.
  - type: example
    target: せんせいがこくばんにかきます。
    target_lang: ja
    translation:
      vi: Giáo viên viết lên bảng.
    note:
      vi: こくばん - bảng đen; に - lên bảng.
  - type: example
    target: このもんだいのこたえはなんですか。
    target_lang: ja
    translation:
      vi: Đáp án của câu hỏi này là gì?
    note:
      vi: もんだい - câu hỏi trong bài; こたえ - đáp án.
  - type: common_mistake
    wrong: せんせいにもんだいがあります。(muốn hỏi)
    right: せんせいにしつもんがあります。
    target_lang: ja
    note:
      vi: Muốn hỏi thầy dùng しつもん, không dùng もんだい (もんだい là câu trong bài thi, hoặc vấn đề).
  - type: common_mistake
    wrong: わたしのクラスのせいとはだいがくせいです。
    right: わたしのクラスのがくせいはだいがくせいです。
    target_lang: ja
    note:
      vi: せいと chỉ học sinh phổ thông; sinh viên đại học dùng がくせい / だいがくせい.
  - type: summary
    points:
      - vi: きょうしつ lớp học · じゅぎょう tiết học · しゅくだい bài tập · しけん kỳ thi · こくばん bảng · きょうかしょ sách giáo khoa.
      - vi: もんだい câu hỏi trong bài thi · しつもん câu hỏi bạn hỏi · こたえ đáp án.
      - vi: せいと học sinh phổ thông · がくせい học sinh, sinh viên · クラス lớp.
      - vi: せんせい、しつもんが あります - cách mở lời hỏi giáo viên.
