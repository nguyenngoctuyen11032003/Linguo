title:
  vi: Ngôn ngữ và môn học - にほんご・えいご・すうがく
objectives:
  - vi: "Gọi tên các ngôn ngữ và đất nước: にほんご, えいご, くに, がいこく, がいこくじん, ことば."
  - vi: "Gọi tên môn học: すうがく, れきし, おんがく, たいいく."
  - vi: Nói môn mình thích hay giỏi bằng N が すきです / じょうずです.
