title:
  vi: Học và nói - おしえます・わかります・はなします
objectives:
  - vi: "Dùng các động từ học tập: おしえます, わかります, かきます, はなします, いいます, こたえます, まちがえます."
  - vi: "Gọi tên hoạt động học: れんしゅう, ふくしゅう, よしゅう."
  - vi: Nhờ nói lại bằng もういちど おねがいします.
estimated_minutes: 16
