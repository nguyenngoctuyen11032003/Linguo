body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng được nhiều tính từ な hơn - りょうりがとくいです。すうがくがにがてです。
  - type: explain
    text:
      vi: Tính từ な thêm な khi đứng trước danh từ - たいせつな ともだち (người bạn quý), かんたんな もんだい (câu hỏi dễ). Làm vị ngữ chỉ cần です - この もんだいは かんたんです.
  - type: explain
    text:
      vi: Nối hai tính từ な - bỏ な thêm で. Ví dụ ここは しずかで、きれいです (nơi này yên tĩnh và sạch). Phủ định - かんたんじゃ ありません; quá khứ - かんたんでした.
  - type: explain
    text:
      vi: Giỏi và kém - とくい (giỏi, sở trường), にがて (kém, ngại), だいすき (rất thích). Đối tượng đi với が - りょうりが とくいです; すうがくが にがてです.
  - type: deep_explain
    text:
      vi: Phân biệt じょうず (giỏi - nhận xét người khác) và とくい (sở trường - nói về mình). にがて nhẹ hơn へた (kém); dùng にがて lịch sự hơn nói へた. たいへん là tính từ な nhưng cũng là trạng từ "rất" trong văn viết. Chữ Hán - 大変, 大切, 簡単, 丈夫, 幸せ, 必要, 苦手, 得意, 大好き, 本当.
  - type: example
    target: ここはしずかで、きれいなまちです。
    target_lang: ja
    translation:
      vi: Đây là thị trấn yên tĩnh và sạch đẹp.
    note:
      vi: しずかで - nối tính từ な; きれいな + N.
  - type: example
    target: りょうりがとくいで、うたもじょうずです。
    target_lang: ja
    translation:
      vi: Tôi nấu ăn giỏi và hát cũng hay.
    note:
      vi: とくいで nối hai ý.
  - type: example
    target: すうがくがにがてですから、しゅくだいがたいへんです。
    target_lang: ja
    translation:
      vi: Tôi kém toán nên bài tập vất vả.
    note:
      vi: にがて - kém; たいへん - vất vả.
  - type: example
    target: ほんとうですか。- ほんとうです。
    target_lang: ja
    translation:
      vi: Thật không? - Thật đấy.
    note:
      vi: ほんとう - sự thật.
  - type: common_mistake
    wrong: かんたんいもんだいです。
    right: かんたんなもんだいです。
    target_lang: ja
    note:
      vi: Tính từ な trước danh từ dùng な, không dùng い.
  - type: common_mistake
    wrong: ここはしずかいです。
    right: ここはしずかです。
    target_lang: ja
    note:
      vi: しずか là tính từ な, đi trực tiếp với です.
  - type: summary
    points:
      - vi: たいへん vất vả · たいせつ quan trọng · かんたん đơn giản · じょうぶ bền · しあわせ hạnh phúc · ひつよう cần thiết.
      - vi: とくい giỏi · にがて kém · だいすき rất thích · いろいろ nhiều loại.
      - vi: Trước danh từ + な; nối bằng で.
      - vi: N が とくい / にがて / だいすき.
