title:
  vi: Trạng từ và từ nối - とても・もう・まだ・でも
objectives:
  - vi: "Dùng trạng từ mức độ và số lượng: とても, すこし, たくさん, いちばん, もっと."
  - vi: Dùng もう, まだ, すぐ, ゆっくり để nói thời điểm và tốc độ.
  - vi: Nối câu bằng そして, それから, でも, だから.
