  - key: ja:exercise:adverbs-connectors-mou-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u17-mou
    prompt:
      source_text: もうたべましたか。- いいえ、まだです。いっしょにたべませんか。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Bạn ăn chưa? - Chưa, vẫn chưa. Cùng ăn không?
        - Bạn đã ăn chưa? - Chưa. Chúng ta cùng ăn nhé?
        - Bạn ăn rồi chưa? - Chưa, vẫn chưa. Cùng ăn nhé?
