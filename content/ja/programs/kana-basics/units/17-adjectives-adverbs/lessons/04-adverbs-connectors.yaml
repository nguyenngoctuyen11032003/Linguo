  - key: ja:exercise:adverbs-connectors-mou-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u17-mou-mada
    prompt:
      template: "{{b1}}たべましたか。- いいえ、まだです。 (Bạn ăn chưa? - Chưa, vẫn chưa.)"
      blanks:
        - id: b1
          width_hint: 3
      hint_levels:
        - Phó từ nghĩa "đã ... rồi".
        - Hai chữ - もう.
    answer:
      blanks:
        b1:
          - もう
    known_wrong:
      - answer: まだ
        feedback_vi: まだ dùng trong câu trả lời; câu hỏi "đã ăn chưa" dùng もう.
        error_tag: adverb_choice
    explanation:
      vi: もう + V ましたか - đã làm chưa.
    display_answer: もうたべましたか。いいえ、まだです。
