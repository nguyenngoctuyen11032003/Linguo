    display_answer: ゆっくり
  - key: ja:exercise:adverbs-connectors-soshite-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u17-soshite
    prompt:
      template: あさおきます。{{b1}}、ごはんをたべます。 (Sáng tôi dậy. Rồi tôi ăn cơm.)
      blanks:
        - id: b1
          width_hint: 4
    answer:
      blanks:
        b1:
          - そして
          - それから
    known_wrong:
      - answer: でも
        feedback_vi: でも là nhưng; đây là hai việc nối tiếp nhau.
        error_tag: conjunction
      - answer: だから
        feedback_vi: だから là vì vậy (quan hệ nguyên nhân).
        error_tag: conjunction
    explanation:
      vi: そして / それから - rồi, sau đó (nối việc tiếp nối).
    display_answer: あさおきます。そして、ごはんをたべます。
