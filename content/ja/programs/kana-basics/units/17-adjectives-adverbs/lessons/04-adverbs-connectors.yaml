body:
  - type: objective
    text:
      vi: Sau bài này, bạn nối câu mượt hơn - やすいです。でも、おいしくないです。だから、かいません。- và nói đã làm hay chưa làm.
  - type: explain
    text:
      vi: Trạng từ mức độ - とても (rất), すこし (một chút), たくさん (nhiều), いちばん (nhất), もっと (hơn nữa). Chúng đứng ngay trước tính từ hay động từ - とてもおいしいです, すこしあります, もっとたべます.
  - type: explain
    text:
      vi: Thời điểm và tốc độ - すぐ (ngay), ゆっくり (từ từ), もう (đã... rồi), まだ (vẫn chưa). Hỏi đã làm chưa - もう V ましたか; đáp - はい、もう V ました / いいえ、まだです.
  - type: explain
    text:
      vi: Từ nối - そして (và), それから (sau đó), でも (nhưng), だから (vì vậy). Đứng đầu câu và theo sau là dấu phẩy - でも、おいしくないです.
  - type: deep_explain
    text:
      vi: もう còn có nghĩa "thêm nữa" khi đi với số - もうひとつ ください (cho tôi thêm một cái). まだ có nghĩa "vẫn còn" khi đi với trạng thái đang tiếp diễn - まだ あります. でも ở đầu câu là "nhưng"; sau danh từ lại là "chẳng hạn" (おちゃでも のみませんか - uống chút trà nhé). Hình thức まだ V ていません (vẫn chưa làm) học kỹ ở N4.
  - type: example
    target: とてもおいしいです。もっとたべたいです。
    target_lang: ja
    translation:
      vi: Rất ngon. Tôi muốn ăn nữa.
    note:
      vi: とても・もっと - trạng từ mức độ.
  - type: example
    target: もうたべましたか。- いいえ、まだです。
    target_lang: ja
    translation:
      vi: Bạn ăn chưa? - Chưa, vẫn chưa.
    note:
      vi: もう / まだ - đã / vẫn chưa.
  - type: example
    target: やすいです。でも、おいしくないです。だから、かいません。
    target_lang: ja
    translation:
      vi: Rẻ. Nhưng không ngon. Vì vậy tôi không mua.
    note:
      vi: でも / だから - từ nối.
  - type: example
    target: ゆっくりはなしてください。
    target_lang: ja
    translation:
      vi: Xin hãy nói chậm lại.
    note:
      vi: ゆっくり - chậm rãi.
  - type: common_mistake
    wrong: もうたべていません。
    right: まだたべていません。
    target_lang: ja
    note:
      vi: Vẫn chưa làm là まだ ... ていません; もう dùng với câu khẳng định hay hỏi.
  - type: common_mistake
    wrong: でもおいしいです。(đầu câu, thiếu dấu phẩy)
    right: でも、おいしいです。
    target_lang: ja
    note:
      vi: Sau từ nối đầu câu nên có dấu phẩy để tách ý.
  - type: summary
    points:
      - vi: とても rất · すこし một chút · たくさん nhiều · いちばん nhất · もっと hơn nữa.
      - vi: もう đã... rồi · まだ vẫn chưa · すぐ ngay · ゆっくり từ từ.
      - vi: そして và · それから sau đó · でも nhưng · だから vì vậy.
      - vi: Hỏi - もう V ましたか; đáp - まだです.
exercises:
  - key: ja:exercise:adverbs-connectors-totemo
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u17-totemo
    prompt:
      stem: Từ nào có nghĩa là “rất”?
      stem_lang: vi
      options:
        - id: x1r
          text: すこし
          lang: ja
        - id: eeb
          text: ぜんぜん
          lang: ja
        - id: e4c
          text: とても
          lang: ja
        - id: uwn
          text: あまり
          lang: ja
    answer:
      correct_option_id: e4c
    explanation:
      vi: とても là rất. すこし là một chút, あまり + phủ định là "không...lắm", ぜんぜん + phủ định là "hoàn toàn không".
    display_answer: とても
  - key: ja:exercise:adverbs-connectors-mada
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u17-mada
    prompt:
      stem: Bạn chưa ăn cơm. Người ta hỏi “もうたべましたか”. Bạn đáp gì?
      stem_lang: vi
      options:
        - id: sw8
          text: いいえ、まだです。
          lang: ja
        - id: l5k
          text: はい、たべません。
          lang: ja
        - id: nzk
          text: はい、まだです。
          lang: ja
        - id: yfo
          text: いいえ、もうです。
          lang: ja
    answer:
      correct_option_id: sw8
    explanation:
      vi: Trả lời chưa làm là いいえ、まだです. はい、まだです trái nghĩa nhau; いいえ、もうです không tự nhiên; はい、たべません chưa đúng ngữ pháp.
    display_answer: いいえ、まだです。
