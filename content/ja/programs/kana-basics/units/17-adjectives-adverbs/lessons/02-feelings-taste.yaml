body:
  - type: objective
    text:
      vi: Sau bài này, bạn diễn tả được cảm xúc và vị món ăn - プレゼントをもらってうれしいです。このケーキはあまいです。
  - type: explain
    text:
      vi: 'Cảm xúc: うれしい (vui, mừng), かなしい (buồn), たのしい (vui vẻ, đã học), つまらない (chán), こわい (sợ, đáng sợ), ねむい (buồn ngủ). Chủ thể thường là "tôi" nên không cần nói わたしは.'
  - type: explain
    text:
      vi: "Vị giác: あまい (ngọt), にがい (đắng), しょっぱい (mặn), からい (cay), おいしい (ngon), まずい (dở). Nói はっきり まずい nghe thô; lịch sự hơn là あまりおいしくないです."
  - type: explain
    text:
      vi: "Khen chê: かわいい (dễ thương), すごい (tuyệt, ghê), きたない (bẩn) - đối nghĩa với きれい (sạch, đẹp). Nối lý do - ～て (うれしくて, かなしくて) hoặc ～から."
  - type: deep_explain
    text:
      vi: きれい và きたない không cùng loại - きれい là tính từ な (きれいな へや) còn きたない là tính từ い (きたない へや). すごい dùng cả khen lẫn lúc ngạc nhiên - すごい！ (Giỏi quá!). こわい dùng cho đối tượng sợ - いぬが こわい (sợ chó). Chữ Hán - 悲しい, 怖い, 眠い, 甘い, 苦い, 汚い.
  - type: example
    target: プレゼントをもらって、うれしいです。
    target_lang: ja
    translation:
      vi: Nhận được quà, tôi vui.
    note:
      vi: もらって - thể て nêu lý do.
  - type: example
    target: このケーキはあまくて、おいしいです。
    target_lang: ja
    translation:
      vi: Cái bánh này ngọt và ngon.
    note:
      vi: あまくて - nối hai tính từ.
  - type: example
    target: くすりはにがいですから、きらいです。
    target_lang: ja
    translation:
      vi: Thuốc đắng nên tôi ghét.
    note:
      vi: から nêu lý do.
  - type: example
    target: このねこはかわいくて、すごいです。
    target_lang: ja
    translation:
      vi: Con mèo này dễ thương và giỏi quá.
    note:
      vi: すごい - giỏi, ghê gớm.
  - type: common_mistake
    wrong: このへやはきたないなです。
    right: このへやはきたないです。
    target_lang: ja
    note:
      vi: きたない là tính từ い nên đi thẳng với です, không thêm な.
  - type: common_mistake
    wrong: ゆうべおそくねましたから、ねむいでした。
    right: ゆうべおそくねましたから、ねむかったです。
    target_lang: ja
    note:
      vi: Quá khứ của tính từ い - bỏ い thêm かったです, không dùng いでした.
  - type: summary
    points:
      - vi: うれしい vui · かなしい buồn · つまらない chán · こわい sợ · ねむい buồn ngủ.
      - vi: あまい ngọt · にがい đắng · しょっぱい mặn · まずい dở.
      - vi: かわいい dễ thương · すごい tuyệt · きたない bẩn.
      - vi: Quá khứ - ねむい → ねむかったです.
