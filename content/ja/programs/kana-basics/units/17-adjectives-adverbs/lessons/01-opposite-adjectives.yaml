body:
  - type: objective
    text:
      vi: Sau bài này, bạn miêu tả được đồ vật và nơi chốn bằng các cặp tính từ ngược nghĩa - へやはひろいです。えきはちかいです。
  - type: explain
    text:
      vi: Tính từ い học theo cặp ngược nghĩa dễ nhớ - ながい/みじかい (dài/ngắn), ひろい/せまい (rộng/hẹp), おもい/かるい (nặng/nhẹ), つよい/よわい (mạnh/yếu), おおい/すくない (nhiều/ít), あかるい/くらい (sáng/tối), ちかい/とおい (gần/xa), たかい/ひくい (cao/thấp), ふとい/ほそい (to/mảnh).
  - type: explain
    text:
      vi: Chia tính từ い - bỏ い thêm くないです (phủ định), かったです (quá khứ), くなかったです (quá khứ phủ định). Ví dụ ひろいです → ひろくないです → ひろかったです.
  - type: explain
    text:
      vi: Nối hai tính từ い - bỏ い thêm くて. Ví dụ ひろくて、あかるいです (rộng và sáng). Chú ý おおい (nhiều) khác おおきい (to); たかい vừa là "cao" vừa là "đắt" nên dùng ひくい khi nói "thấp" và やすい khi nói "rẻ".
  - type: deep_explain
    text:
      vi: Một số tính từ có nghĩa thay đổi theo đối tượng - ながい dùng cho dài (tóc, sông), nhưng "thời gian dài" cũng là ながい. おおい / すくない thường làm vị ngữ (ひとが おおい) chứ ít đứng trước danh từ; trước danh từ người ta dùng おおくの hay たくさんの. たかい và ひくい không đối nghĩa trong "giá cả" vì "rẻ" là やすい. Chữ Hán - 長い, 短い, 広い, 狭い, 重い, 軽い, 強い, 弱い, 多い, 少ない, 明るい, 暗い, 近い, 遠い, 低い, 太い, 細い.
  - type: example
    target: わたしのへやはひろくて、あかるいです。
    target_lang: ja
    translation:
      vi: Phòng tôi rộng và sáng.
    note:
      vi: ひろくて - dạng て của tính từ い.
  - type: example
    target: えきはちかいですが、こうえんはとおいです。
    target_lang: ja
    translation:
      vi: Nhà ga gần nhưng công viên xa.
    note:
      vi: が - nhưng (liên từ).
  - type: example
    target: このかばんはおもくないです。
    target_lang: ja
    translation:
      vi: Cái cặp này không nặng.
    note:
      vi: おもくないです - phủ định.
  - type: example
    target: ゆうべのパーティーはひとがおおかったです。
    target_lang: ja
    translation:
      vi: Bữa tiệc tối qua có nhiều người.
    note:
      vi: おおかった - quá khứ của おおい.
  - type: common_mistake
    wrong: このかばんはひくいです。(muốn nói rẻ)
    right: このかばんはやすいです。
    target_lang: ja
    note:
      vi: ひくい chỉ độ cao thấp; "rẻ" là やすい. Đừng dùng ひくい cho giá.
  - type: common_mistake
    wrong: おおきいひとがきました。(nhiều người đến)
    right: おおくのひとがきました。
    target_lang: ja
    note:
      vi: Nhiều người dùng おおくの hoặc たくさんの; おおきい là to lớn.
  - type: summary
    points:
      - vi: ながい/みじかい · ひろい/せまい · おもい/かるい · つよい/よわい · おおい/すくない · あかるい/くらい · ちかい/とおい · たかい/ひくい.
      - vi: Chia - ひろいです → ひろくないです → ひろかったです.
      - vi: Nối - ひろくて、あかるいです.
      - vi: おおい (số lượng) ≠ おおきい (kích thước).
