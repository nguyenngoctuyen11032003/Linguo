title:
  vi: Tính từ đối nghĩa - ながい・ひろい・おもい・ちかい
objectives:
  - vi: "Dùng các cặp tính từ đối nghĩa: ながい / みじかい, ひろい / せまい, おもい / かるい, つよい / よわい, ちかい / とおい."
  - vi: Phân biệt おおい (nhiều) - おおきい (to) và たかい (cao, đắt) - ひくい (thấp).
  - vi: Miêu tả đồ vật, nơi chốn bằng các tính từ trên.
estimated_minutes: 15
skills:
