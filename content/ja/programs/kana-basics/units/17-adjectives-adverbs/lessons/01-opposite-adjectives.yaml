  - key: ja:exercise:opposite-adjectives-omoi-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u17-omoi-karui
    prompt:
      template: このかばんは{{b1}}です。ほんがたくさんあります。 (Cái cặp này nặng. Có nhiều sách.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Tính từ ngược nghĩa với かるい.
        - Bắt đầu bằng お - おもい.
    answer:
      blanks:
        b1:
          - おもい
          - 重い
    known_wrong:
      - answer: かるい
        feedback_vi: かるい là nhẹ; nhiều sách nên nặng.
        error_tag: adj_choice
    explanation:
      vi: おもい là nặng. かばんに ほんが たくさん あるので おもい.
    display_answer: このかばんはおもいです。ほんがたくさんあります。
