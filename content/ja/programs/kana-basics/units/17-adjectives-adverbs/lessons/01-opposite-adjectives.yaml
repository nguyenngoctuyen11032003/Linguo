  - key: ja:exercise:opposite-adjectives-ooi-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u17-ooi-sukunai
    prompt:
      source_text: Bữa tiệc tối qua có nhiều người.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - ゆうべのパーティーはひとがおおかったです。
        - きのうのパーティーはひとがおおかったです。
        - ゆうべのパーティーはひとがたくさんいました。
        - きのうのばんのパーティーはひとがおおかったです。
    known_wrong:
      - answer: ゆうべのパーティーはひとがおおきかったです。
        feedback_vi: おおきい là to; nhiều người là おおい.
        error_tag: adj_choice
      - answer: ゆうべのパーティーはひとがおおいです。
        feedback_vi: Chuyện đã qua nên dùng quá khứ おおかった.
        error_tag: tense
    explanation:
      vi: おおかったです là quá khứ của おおい (nhiều); ゆうべ - tối qua.
    display_answer: ゆうべのパーティーはひとがおおかったです。
  - key: ja:exercise:opposite-adjectives-karui-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u17-omoi-karui
    prompt:
      source_text: このかばんはおもいですが、あのかばんはかるいです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Cái cặp này nặng nhưng cái cặp kia nhẹ.
        - Cái cặp này nặng, còn cái cặp đó thì nhẹ.
        - Chiếc cặp này nặng nhưng chiếc cặp kia nhẹ.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Cái cặp này nhẹ nhưng cái cặp kia nặng.
        feedback_vi: おもい là nặng, かるい là nhẹ.
        error_tag: adj_choice
    explanation:
      vi: この = cái này; あの = cái kia; が = nhưng, nối hai vế tương phản.
    display_answer: Cái cặp này nặng nhưng cái cặp kia nhẹ.
