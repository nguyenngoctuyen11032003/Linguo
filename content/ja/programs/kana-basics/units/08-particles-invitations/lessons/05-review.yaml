title:
  vi: Ôn tập - Nhắn tin hẹn đi chơi cuối tuần
objectives:
  - vi: Nhắn tin rủ bạn đi chơi - hỏi rảnh không, rủ, hẹn giờ và nơi gặp.
  - vi: Dùng đúng と, から〜まで, も, が trong một đoạn hội thoại.
  - vi: Nhận lời, từ chối khéo và hỏi ý bằng ませんか / ましょう / ましょうか.
estimated_minutes: 20
skills: [grammar, vocabulary, reading, speaking, writing]
prerequisites: [ja:lesson:invitations]
