title:
  vi: Từ... đến... - から・まで, 〜じかん, 〜ぐらい
objectives:
  - vi: Nói khoảng thời gian và quãng đường bằng から〜まで.
  - vi: Phân biệt 〜じ (lúc mấy giờ) với 〜じかん (bao nhiêu tiếng).
  - vi: Hỏi "bao lâu" bằng どのくらい và trả lời "khoảng" bằng 〜ぐらい.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:to-ya]
