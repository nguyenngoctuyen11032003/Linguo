key: ja:lesson:to-ya
order_index: 2
level: n5
title:
  vi: Và, cùng với - と, や〜など, いっしょに, ひとりで
objectives:
  - vi: Nối danh từ bằng と (kể đủ) và や〜など (kể ví dụ).
  - vi: Nói làm việc cùng ai bằng N と (いっしょに).
  - vi: Nói làm một mình bằng ひとりで.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:ga-mo]
