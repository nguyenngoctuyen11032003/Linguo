    display_answer: Tôi đã mua táo, chuối, v.v. ở siêu thị.

  - key: ja:exercise:to-ya-mcq-alone
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:hitori-de
    prompt:
      stem: "Đồng nghiệp hỏi về chuyến đi của bạn - だれといきましたか。 Bạn đi một mình. Bạn trả lời thế nào?"
      stem_lang: vi
      options:
        - { id: h8d, text: ひとりでいきました。, lang: ja }
        - { id: j3f, text: ひとりといきました。, lang: ja }
        - { id: k7g, text: ひとりがいきました。, lang: ja }
        - { id: l2h, text: ひとりでいきます。, lang: ja }
    answer:
      correct_option_id: h8d
    explanation:
      vi: Một mình - ひとりで; chuyến đi đã qua - いきました. ひとりと nghĩa là "cùng với một người"; いきます là hiện tại.
    display_answer: ひとりでいきました。

  - key: ja:exercise:to-ya-order-supermarket
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:issho-ni
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: “Tôi đã đi siêu thị cùng với bạn.”"
      tokens:
        - { id: t1, text: スーパーへ }
        - { id: t2, text: いきました }
        - { id: t3, text: いっしょに }
        - { id: t4, text: ともだちと }
    answer:
      orders:
        - [t4, t3, t1, t2]
        - [t1, t4, t3, t2]
    explanation:
      vi: ともだちと いっしょに luôn đi liền nhau (と trước いっしょに); スーパーへ có thể đứng trước hoặc sau cụm đó; động từ cuối câu.
    display_answer: ともだちといっしょにスーパーへいきました。
