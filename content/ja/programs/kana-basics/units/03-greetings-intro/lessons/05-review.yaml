  - key: ja:exercise:gi-review-write-whose
    type: translate
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:no-possessive
    prompt:
      source_text: Đây là đồng hồ của anh Tanaka.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - これはたなかさんのとけいです。
        - これは田中さんの時計です。
        - これはたなかさんの時計です。
        - これは田中さんのとけいです。
    known_wrong:
      - answer: これはとけいのたなかさんです。
        feedback_vi: Người sở hữu đứng trước の - たなかさんのとけい.
        error_tag: word_order
      - answer: それはたなかさんのとけいです。
        feedback_vi: '"Đây" là これ; それ là "đó".'
        error_tag: demonstrative
      - answer: これはたなかのとけいです。
        feedback_vi: Gọi tên người khác thêm さん - たなかさん.
        error_tag: missing_san
    explanation:
      vi: これ (đây) + は + たなかさん + の + とけい + です.
    display_answer: これはたなかさんのとけいです。

  - key: ja:exercise:gi-review-mcq-are
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 3
    item: ja:item:kore-sore-are
    prompt:
      stem: Lan và Tanaka đứng cạnh nhau, nhìn một chiếc đồng hồ treo ở cuối phòng. Lan muốn hỏi "Kia là đồng hồ của thầy giáo phải không?". Câu nào đúng?
      stem_lang: vi
      options:
        - { id: n5x, text: あれはせんせいのとけいですか。, lang: ja }
        - { id: a7g, text: それはせんせいのとけいですか。, lang: ja }
        - { id: u2s, text: あれはとけいのせんせいですか。, lang: ja }
        - { id: o9d, text: あれはせんせいのとけいです。, lang: ja }
    answer:
      correct_option_id: n5x
    explanation:
      vi: Vật xa cả hai người dùng あれ; それ là vật gần người nghe. Người sở hữu đứng trước の - せんせいのとけい (đồng hồ của thầy), đảo lại thành "thầy của đồng hồ". Câu hỏi phải có か ở cuối.
    display_answer: あれはせんせいのとけいですか。
