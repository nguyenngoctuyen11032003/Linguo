    display_answer: わたしはがくせいじゃありません。かいしゃいんです。

  # ---------------- application ----------------
  - key: ja:exercise:gi-review-translate-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:jin
    prompt:
      source_text: はじめまして。ランです。ベトナムじんです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Rất vui được gặp bạn. Tôi là Lan. Tôi là người Việt Nam.
        - Rất vui được gặp bạn. Tôi là Lan. Tôi là người Việt.
        - Rất hân hạnh được gặp bạn. Tôi là Lan. Tôi là người Việt Nam.
        - Hân hạnh được gặp bạn. Tôi là Lan. Tôi là người Việt Nam.
