        - はじめまして。どうぞよろしくお願いします。
        - はじめまして、よろしくおねがいします。
        - はじめまして、どうぞよろしくおねがいします。
        - 初めまして。よろしくお願いします。
        - 初めまして。どうぞよろしくお願いします。
        - はじめましてよろしくおねがいします。
        - はじめましてどうぞよろしくおねがいします。
        - はじめましてよろしくお願いします。
        - はじめましてどうぞよろしくお願いします。
        - 初めましてよろしくお願いします。
