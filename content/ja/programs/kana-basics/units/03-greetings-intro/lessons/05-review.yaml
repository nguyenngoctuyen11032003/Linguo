body:
  - type: objective
    text:
      vi: Sau bài này, bạn tự tin làm quen với một người Nhật - chào, giới thiệu tên, quốc tịch, nghề, hỏi về đồ vật và chào tạm biệt.
  - type: explain
    text:
      vi: Một cuộc làm quen thường theo thứ tự - こんにちは → はじめまして → tên + です → quốc tịch, nghề → よろしくおねがいします. Bạn đã có đủ mẫu câu cho từng bước.
  - type: explain
    text:
      vi: Ba trợ từ của chủ đề này - は (chủ đề, đọc "wa"), か (câu hỏi, cuối câu), の (sở hữu, giữa hai danh từ). Phần lớn lỗi của người Việt là đặt sai vị trí hoặc viết は thành わ.
  - type: deep_explain
    text:
      vi: Tiếng Nhật thích bỏ những gì đã rõ - không lặp わたしは, trả lời はい、そうです (vâng, đúng vậy) thay vì nói lại cả câu. Gọi người đối diện bằng tên + さん thay cho "bạn"; từ あなた (bạn) có, nhưng dùng nhiều sẽ nghe xa cách. Các chủ đề tiếp theo - số đếm, giờ giấc, động từ - đều xây trên mẫu N は N です này.
  - type: example
    target: こんにちは。はじめまして。たなかです。- はじめまして。ランです。よろしくおねがいします。
    target_lang: ja
    translation:
      vi: Xin chào. Rất vui được gặp chị. Tôi là Tanaka. - Rất vui được gặp anh. Tôi là Lan. Mong anh giúp đỡ.
    note:
      vi: Cả hai cùng nói はじめまして vì đều gặp lần đầu.
  - type: example
    target: ランさんはベトナムじんですか。- はい、そうです。
    target_lang: ja
    translation:
      vi: Chị Lan là người Việt Nam phải không? - Vâng, đúng vậy.
    note:
      vi: はい、そうです là cách trả lời "đúng vậy" rất tự nhiên.
  - type: example
    target: たなかさんはがくせいですか。- いいえ、がくせいじゃありません。かいしゃいんです。
    target_lang: ja
    translation:
      vi: Anh Tanaka là sinh viên à? - Không, tôi không phải sinh viên. Tôi là nhân viên công ty.
    note:
      vi: Phủ định じゃありません rồi nói thông tin đúng.
  - type: example
    target: すみません、それはなんですか。- これはにほんのとけいです。
    target_lang: ja
    translation:
      vi: Xin lỗi, đó là cái gì vậy? - Đây là đồng hồ của Nhật.
    note:
      vi: Đồng hồ trong tay Tanaka - Lan hỏi それ, Tanaka trả lời これ.
  - type: common_mistake
    wrong: わたしはランさんです。ベトナムじんです。
    right: わたしはランです。ベトナムじんです。
    target_lang: ja
    note:
      vi: Không thêm さん vào tên của chính mình.
  - type: common_mistake
    wrong: たなかさんわにほんじんですか。
    right: たなかさんはにほんじんですか。
    target_lang: ja
    note:
      vi: Trợ từ chủ đề đọc "wa" nhưng luôn viết は.
  - type: summary
    points:
      - vi: Làm quen - はじめまして → (tên) です → よろしくおねがいします.
      - vi: Hỏi - おなまえは？ · (nước) じんですか · がくせいですか.
      - vi: は chủ đề · か câu hỏi · の sở hữu · じゃありません phủ định.
      - vi: これ gần mình · それ gần người nghe · あれ xa cả hai.
exercises:
  # ---------------- recognition ----------------
  - key: ja:exercise:gi-review-mcq-iie
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:hai-iie
    prompt:
      stem: "Chọn từ đúng cho chỗ trống. Lan - たなかさんはがくせいですか。 Tanaka - ___、かいしゃいんです。"
      stem_lang: vi
      options:
        - { id: z8q, text: いいえ, lang: ja }
        - { id: c3t, text: はい, lang: ja }
        - { id: w6f, text: ありがとうございます, lang: ja }
        - { id: j1k, text: こんにちは, lang: ja }
    answer:
      correct_option_id: z8q
    explanation:
      vi: Tanaka là nhân viên công ty, không phải sinh viên, nên trả lời いいえ (không). はい (vâng) mâu thuẫn với phần sau.
    display_answer: いいえ

  - key: ja:exercise:gi-review-listen-intro
    type: listen
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:jin
    prompt:
      audio_asset_id: null
      fallback_text: はじめまして。ナムです。ベトナムじんです。
      options:
        - { id: r2m, text: Rất vui được gặp bạn. Tôi là Nam. Tôi là người Việt Nam., lang: vi }
        - { id: e9w, text: Rất vui được gặp bạn. Tôi là Nam. Tôi là người Nhật., lang: vi }
        - { id: b4n, text: Xin chào. Anh Nam là sinh viên., lang: vi }
        - { id: y7c, text: Rất vui được gặp bạn. Tôi không phải người Việt Nam., lang: vi }
    answer:
      correct_option_id: r2m
    explanation:
      vi: ベトナムじんです là "là người Việt Nam"; người Nhật là にほんじん, còn phủ định cần じゃありません.
    display_answer: Rất vui được gặp bạn. Tôi là Nam. Tôi là người Việt Nam.

  - key: ja:exercise:gi-review-order-not-teacher
    type: word_bank
    stage: recognition
    answer_lang: ja
    difficulty: 2
    item: ja:item:ja-arimasen
    prompt:
      instruction: "Sắp xếp thành câu tiếng Nhật: “Chị Lan không phải là giáo viên.”"
      tokens:
        - { id: w1, text: じゃありません }
        - { id: w2, text: きょうし }
        - { id: w3, text: は }
        - { id: w4, text: ランさん }
        - { id: w5, text: の }
        - { id: w6, text: か }
    answer:
      orders:
        - [w4, w3, w2, w1]
    explanation:
      vi: ランさん + は + きょうし + じゃありません. Câu kể nên không có か; の chỉ sở hữu, không dùng ở đây.
    display_answer: ランさんはきょうしじゃありません。

  - key: ja:exercise:gi-review-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:no-possessive
    prompt:
      template: "それはだれ{{b1}}かさですか。- わたし{{b2}}です。"
      blanks:
        - { id: b1, width_hint: 1 }
        - { id: b2, width_hint: 1 }
      hint_levels:
        - "Nghĩa: Đó là ô của ai? - Của tôi."
        - Cả hai chỗ đều là trợ từ sở hữu.
    answer:
      blanks:
        b1: [の]
        b2: [の]
    known_wrong:
      - answer: は
        feedback_vi: は là trợ từ chủ đề; "của" dùng の.
        error_tag: particle_no
      - answer: no
        feedback_vi: Hãy gõ bằng Hiragana (の), không dùng phiên âm Latinh.
        error_tag: romanization
    explanation:
      vi: だれのかさ - ô của ai; わたしのです - của tôi (bỏ かさ vì đã rõ).
    display_answer: それはだれのかさですか。- わたしのです。

