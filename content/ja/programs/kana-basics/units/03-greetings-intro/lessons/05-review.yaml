        - がくせいではありません。かいしゃいんです。
        - 私は学生じゃありません。会社員です。
        - 私は学生ではありません。会社員です。
        - 学生じゃありません。会社員です。
        - 学生ではありません。会社員です。
        - わたしは学生じゃありません。会社員です。
        - わたしはがくせいじゃありませんかいしゃいんです。
        - わたしはがくせいじゃありませんわたしはかいしゃいんです。
        - がくせいじゃありませんかいしゃいんです。
        - わたしはがくせいではありませんかいしゃいんです。
        - がくせいではありませんかいしゃいんです。
        - 私は学生じゃありません会社員です。
        - 私は学生ではありません会社員です。
        - 学生じゃありません会社員です。
        - 学生ではありません会社員です。
        - わたしは学生じゃありません会社員です。
