    display_answer: はじめまして。よろしくおねがいします。

  - key: ja:exercise:gi-review-fill-question
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:question-ka
    prompt:
      template: "Anh Tanaka là người Nhật phải không? - たなか{{b1}}はにほんじんです{{b2}}。"
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 1 }
    answer:
      blanks:
        b1: [さん]
        b2: [か]
    known_wrong:
      - answer: ちゃん
        feedback_vi: ちゃん dùng cho trẻ nhỏ, người rất thân. Gọi lịch sự dùng さん.
        error_tag: honorific_suffix
      - answer: san
        feedback_vi: Hãy gõ bằng Hiragana (さん), không dùng phiên âm Latinh.
        error_tag: romanization
    explanation:
      vi: Gọi người khác - tên + さん; câu hỏi có/không - thêm か ở cuối.
    display_answer: たなかさんはにほんじんですか。

