title:
  vi: Tên, quốc tịch và câu hỏi có/không
objectives:
  - vi: Tự giới thiệu trọn vẹn - はじめまして → tên → quốc tịch → よろしくおねがいします.
  - vi: Hỏi có/không bằng か và trả lời はい / いいえ, phủ định bằng じゃありません.
  - vi: Gọi người khác bằng tên + さん, nói quốc tịch bằng tên nước + じん.
estimated_minutes: 15
skills: [speaking, listening, grammar, writing]
