title:
  vi: これ・それ・あれ - Cái này là gì?
objectives:
  - vi: Chọn đúng これ / それ / あれ theo vị trí của đồ vật.
  - vi: Hỏi "Cái này là gì?" bằng なんですか và trả lời.
  - vi: Nói sở hữu bằng N1 の N2 - わたしのほん (sách của tôi).
estimated_minutes: 14
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:name-nationality]
