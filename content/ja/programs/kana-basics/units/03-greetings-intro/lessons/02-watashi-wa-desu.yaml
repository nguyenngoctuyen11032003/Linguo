title:
  vi: わたしは〜です - Tôi là…
objectives:
  - vi: Nói "Tôi là + nghề" bằng わたしは N です.
  - vi: Viết đúng trợ từ は (đọc "wa") và đặt です ở cuối câu.
  - vi: Gọi tên bốn nghề - がくせい, せんせい, かいしゃいん, いしゃ.
estimated_minutes: 14
skills: [grammar, vocabulary, speaking, writing]
prerequisites: [ja:lesson:greetings]
