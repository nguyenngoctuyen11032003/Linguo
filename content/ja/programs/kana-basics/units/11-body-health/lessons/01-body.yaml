    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u11-onaka
    prompt:
      stem: Bạn đói bụng. Bạn nói “おなかが ___”. Từ nào hợp?
      stem_lang: vi
      options:
        - id: kz9
          text: ながいです
          lang: ja
        - id: gu2
          text: おいしいです
          lang: ja
        - id: bjn
          text: すきました
          lang: ja
        - id: vr2
          text: たかいです
          lang: ja
    answer:
      correct_option_id: bjn
    explanation:
      vi: おなかがすきました nghĩa là "đói rồi". おいしい (ngon), ながい (dài), たかい (cao/đắt) không đi với おなか.
    display_answer: すきました
