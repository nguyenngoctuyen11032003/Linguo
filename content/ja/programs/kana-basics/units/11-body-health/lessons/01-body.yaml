    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u11-atama
    prompt:
      source_text: Tôi đau đầu.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - あたまがいたいです。
        - 頭が痛いです。
        - わたしはあたまがいたいです。
        - あたまがいたい。
    known_wrong:
      - answer: あたまをいたいです。
        feedback_vi: Với いたい, bộ phận đi với が, không dùng を.
        error_tag: particle_ga_wo
      - answer: おなかがいたいです。
        feedback_vi: おなか là bụng; đầu là あたま.
        error_tag: vocab_meaning
    explanation:
      vi: あたま = đầu; N が いたいです = đau ở N.
    display_answer: あたまがいたいです。
  - key: ja:exercise:body-parts-zou-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u11-hana-nose
    prompt:
      source_text: ぞうははながながいです。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Con voi mũi dài.
        - Voi có cái mũi dài.
        - Con voi thì mũi dài.
        - Voi mũi dài.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Con voi tai dài.
        feedback_vi: はな là mũi, tai là みみ.
        error_tag: vocab_meaning
    explanation:
      vi: N は N が A - voi (chủ đề), mũi (bộ phận), dài. はな ở đây là mũi.
    display_answer: Con voi mũi dài.
  - key: ja:exercise:body-parts-kuchi-wb
