body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi được tên các bộ phận cơ thể và nói chỗ đau - あたまがいたいです。おなかがいたいです。
  - type: explain
    text:
      vi: "Các bộ phận cơ thể đều ngắn và hay gặp: あたま (đầu), め (mắt), みみ (tai), はな (mũi), くち (miệng), は (răng), て (tay), あし (chân), おなか (bụng), のど (họng). かお (mặt) bạn đã học ở bảng Hiragana."
  - type: explain
    text:
      vi: Nói đau ở đâu - bộ phận + が + いたいです. Ví dụ あたまがいたいです (đau đầu), はがいたいです (đau răng). Trợ từ đi trước いたい là が, không phải を hay は.
  - type: explain
    text:
      vi: Mẫu miêu tả bộ phận - N は N が A です. Ví dụ ぞうははながながいです (voi thì mũi dài); わたしはかみがながいです (tôi tóc dài). Chủ đề là は, bộ phận là が.
  - type: deep_explain
    text:
      vi: 'Những chữ dễ lẫn - は (歯, răng) viết giống trợ từ は nhưng đọc "ha"; はな (鼻, mũi) đọc giống はな (花, hoa); かみ (髪, tóc) đọc giống かみ (紙, giấy). Ngữ cảnh luôn phân biệt: はながいたい (đau mũi), かみがながい (tóc dài). Chữ Hán - 頭, 目, 耳, 鼻, 口, 歯, 手, 足, お腹, 体.'
  - type: example
    target: あたまがいたいです。
    target_lang: ja
    translation:
      vi: Tôi đau đầu.
    note:
      vi: Bộ phận が いたいです.
  - type: example
    target: のどがいたくて、おなかもいたいです。
    target_lang: ja
    translation:
      vi: Tôi đau họng và đau cả bụng.
    note:
      vi: いたくて nối hai ý; も - cũng.
  - type: example
    target: ぞうははながながいです。
    target_lang: ja
    translation:
      vi: Con voi mũi dài.
    note:
      vi: N は N が A - miêu tả đặc điểm.
  - type: example
    target: てをあらってください。
    target_lang: ja
    translation:
      vi: Hãy rửa tay.
    note:
      vi: Mẫu てください sẽ học ở N4; bây giờ bạn chỉ cần nhận ra てをあらいます.
  - type: common_mistake
    wrong: はをいたいです。
    right: はがいたいです。
    target_lang: ja
    note:
      vi: Với いたい, bộ phận được đánh dấu bằng が, không dùng を.
  - type: common_mistake
    wrong: くちとくつがいたいです。(đau miệng)
    right: くちがいたいです。
    target_lang: ja
    note:
      vi: くつ là giày, không phải miệng. Hai từ chỉ khác chữ thứ hai.
  - type: summary
    points:
      - vi: あたま đầu · め mắt · みみ tai · はな mũi · くち miệng · は răng · て tay · あし chân · おなか bụng · のど họng · かみ tóc.
      - vi: Bộ phận + が + いたいです - đau ở đâu.
      - vi: "N は N が A - miêu tả bộ phận: ぞうははながながい."
      - vi: Cẩn thận - は (răng) đọc ha; はな mũi ≠ はな hoa; かみ tóc ≠ かみ giấy.
