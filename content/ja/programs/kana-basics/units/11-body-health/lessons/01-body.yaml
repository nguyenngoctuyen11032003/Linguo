    item: ja:item:n5-u11-karada
    prompt:
      stem: Bác sĩ hỏi “どこがいたいですか。” (Bạn đau ở đâu?). Câu trả lời nào đúng?
      stem_lang: vi
      options:
        - id: w97
          text: おなかにいたいです。
          lang: ja
        - id: ua9
          text: おなかをいたいです。
          lang: ja
        - id: c3k
          text: おなかはいたいです。
          lang: ja
        - id: dd7
          text: おなかがいたいです。
          lang: ja
    answer:
