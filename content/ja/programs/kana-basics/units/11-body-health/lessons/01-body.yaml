      - answer: め
        feedback_vi: め là mắt.
        error_tag: vocab_meaning
    explanation:
      vi: は là răng. Cẩn thận - đọc "ha", không đọc "wa" như trợ từ.
    display_answer: はがいたいです。
  - key: ja:exercise:body-parts-onaka
