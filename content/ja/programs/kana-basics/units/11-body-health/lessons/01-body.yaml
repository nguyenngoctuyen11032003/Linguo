    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u11-ha-tooth
    prompt:
      template: "{{b1}}がいたいです。 (Tôi đau răng.)"
      blanks:
        - id: b1
          width_hint: 2
      hint_levels:
        - Bộ phận dùng để nhai.
        - Chỉ một chữ - は.
    answer:
      blanks:
        b1:
          - は
          - 歯
    known_wrong:
