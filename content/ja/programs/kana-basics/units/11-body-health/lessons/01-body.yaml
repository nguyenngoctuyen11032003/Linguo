title:
  vi: Các bộ phận cơ thể - あたま・め・てをあらいます
objectives:
  - vi: "Gọi tên các bộ phận cơ thể: あたま, め, みみ, はな, くち, は, て, あし, おなか, のど."
  - vi: Dùng mẫu N が いたいです để nói đau ở đâu.
  - vi: Miêu tả đặc điểm bằng N は N が A (ぞうははながながいです).
