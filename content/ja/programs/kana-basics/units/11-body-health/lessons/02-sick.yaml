title:
  vi: Ốm và đi bệnh viện - かぜ・ねつ・くすり
objectives:
  - vi: "Nói bị cảm, sốt, đau và uống thuốc: かぜをひきました, ねつがあります, くすりをのみます."
  - vi: Nghỉ học, nghỉ làm vì ốm bằng やすみます và びょうきで.
  - vi: Hiểu câu hỏi của bác sĩ どうしましたか và lời chúc おだいじに.
estimated_minutes: 15
