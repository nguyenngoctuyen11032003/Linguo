  - key: ja:exercise:hand-verbs-tsukuru-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u16-tsukurimasu
    prompt:
      source_text: まいばんごはんをつくって、しおをいれます。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tối nào tôi cũng nấu cơm và cho muối vào.
        - Mỗi tối tôi nấu cơm rồi cho muối vào.
        - Tối nào tôi cũng nấu cơm, cho muối vào.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tối nào tôi cũng mua cơm và lấy muối.
        feedback_vi: つくります là nấu, いれます là bỏ vào.
        error_tag: verb_choice
    explanation:
      vi: つくって là thể て của つくります (nấu); いれます - bỏ vào; しお - muối.
    display_answer: Tối nào tôi cũng nấu cơm và cho muối vào.
