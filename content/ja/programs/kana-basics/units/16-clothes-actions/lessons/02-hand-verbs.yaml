title:
  vi: Động từ thao tác - もつ・とる・つくる・きる
objectives:
  - vi: "Dùng các động từ thao tác: もちます, とります, つくります, きります, うります, かります."
  - vi: Dùng だします, いれます, おきます, おします trong các tình huống hằng ngày.
  - vi: Phân biệt かいます (mua) - うります (bán) và かります (mượn) - かします (cho mượn).
