body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng được các động từ thao tác thường ngày - ごはんをつくります。しおをとります。ともだちにほんをかります。
  - type: explain
    text:
      vi: "Động từ về tay: もちます (cầm, mang), とります (lấy), つくります (làm, nấu), きります (cắt), いれます (bỏ vào), おきます (đặt để), おします (ấn, đẩy), だします (đưa ra, gửi). Tất cả đều là động từ ngoại động nên đi với を."
  - type: explain
    text:
      vi: Hai cặp đối nghĩa - かいます (mua) ↔ うります (bán); かります (mượn vào mình) ↔ かします (cho người khác mượn). Người cho mượn dùng に - ともだちに ほんを かします (cho bạn mượn sách).
  - type: explain
    text:
      vi: Chú ý おきます - 起きます (thức dậy) và 置きます (đặt) đọc giống nhau; 置きます đi với を - ほんをおきます, còn 起きます không có を - あさ６じにおきます.
  - type: deep_explain
    text:
      vi: "Mượn đi với に chỉ nguồn - ともだちに かります (mượn của bạn). Cho mượn あげます/かします: ともだちに かします (cho bạn mượn). つくります dùng cả cho làm đồ và nấu ăn - りょうりを つくります; だします có nghĩa gửi thư (てがみを だします) và nộp bài (しゅくだいを だします). Chữ Hán - 持ちます, 取ります, 作ります, 切ります, 売ります, 借ります, 出します, 入れます, 置きます, 押します."
  - type: example
    target: まいばんごはんをつくります。
    target_lang: ja
    translation:
      vi: Tối nào tôi cũng nấu cơm.
    note:
      vi: つくります - nấu, làm.
  - type: example
    target: ともだちにほんをかります。
    target_lang: ja
    translation:
      vi: Tôi mượn sách của bạn.
    note:
      vi: に - nguồn mượn (từ bạn).
  - type: example
    target: コーヒーにさとうをいれます。
    target_lang: ja
    translation:
      vi: Tôi cho đường vào cà phê.
    note:
      vi: いれます - bỏ vào.
  - type: example
    target: つくえのうえにかばんをおきます。
    target_lang: ja
    translation:
      vi: Tôi đặt cặp lên bàn.
    note:
      vi: おきます - đặt, để.
  - type: common_mistake
    wrong: ともだちからほんをかします。(muốn nói mượn)
    right: ともだちにほんをかります。
    target_lang: ja
    note:
      vi: Mượn vào mình là かります; かします là cho người khác mượn.
  - type: common_mistake
    wrong: あさ６じにほんをおきます。(đặt sách)
    right: あさ６じにおきます。
    target_lang: ja
    note:
      vi: Thức dậy là おきます không có を; có を (ほんを) thì là 置きます (đặt).
  - type: summary
    points:
      - vi: もちます cầm · とります lấy · つくります làm, nấu · きります cắt · いれます bỏ vào · おきます đặt · おします ấn · だします gửi, nộp.
      - vi: うります bán ↔ かいます mua.
      - vi: かります mượn ↔ かします cho mượn.
      - vi: おきます đặt (を) ≠ おきます thức dậy.
