    item: ja:item:n5-u16-tsukurimasu
    prompt:
      stem: Bạn nấu cơm. Động từ nào đúng?
      stem_lang: vi
      options:
        - id: ygq
          text: つくります
          lang: ja
        - id: yom
          text: きります
          lang: ja
        - id: wwt
          text: とります
          lang: ja
        - id: i4a
          text: おします
          lang: ja
    answer:
      correct_option_id: ygq
    explanation:
      vi: つくります là làm, nấu. とります là lấy, きります là cắt, おします là ấn.
    display_answer: つくります
