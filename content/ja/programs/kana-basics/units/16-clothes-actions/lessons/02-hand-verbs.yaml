    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u16-kirimasu
    prompt:
      template: やさいを{{b1}}。 (Tôi thái rau.)
      blanks:
        - id: b1
          width_hint: 5
      hint_levels:
        - Động từ dùng với dao.
        - Bắt đầu bằng き - きります.
    answer:
      blanks:
