body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được mình mặc gì - あかいセーターをきます。くろいくつをはきます。- và chọn động từ đúng cho từng món đồ.
  - type: explain
    text:
      vi: "Quần áo: ふく (quần áo nói chung), シャツ (áo sơ mi, áo thun), ズボン (quần dài), スカート (váy), コート (áo khoác), セーター (áo len), くつした (tất), くつ (giày)."
  - type: explain
    text:
      vi: "Tiếng Nhật có động từ riêng cho từng loại đồ - きます (mặc thân trên: シャツ, セーター, コート), はきます (đi, mặc phần dưới: くつ, くつした, ズボン, スカート), かぶります (đội: ぼうし), かけます (đeo kính: めがね). Cởi ra dùng chung ぬぎます."
  - type: explain
    text:
      vi: 'Tiếng Việt chỉ cần "mặc" hay "đi" nên người học hay dùng きます cho mọi thứ. Hãy nhớ bốn nhóm: きる, はく, かぶる, かける. Câu mẫu - シャツをきます, くつをはきます, ぼうしをかぶります, めがねをかけます.'
  - type: deep_explain
    text:
      vi: きます có hai nghĩa khác - 来ます (đến) và 切ります (きります, cắt). Chữ Hán 着ます làm rõ nghĩa "mặc". Với đồ mặc chân như くつした và ズボン bạn dùng はきます, nhưng với đồ mặc thân trên bạn dùng きます. Khi bước vào nhà Nhật, ぬぎます áp dụng cho くつ (giày) ở げんかん. Chữ Hán - 服, 靴下, 着ます, 履きます, 脱ぎます, 被ります, 掛けます.
  - type: example
    target: あかいセーターをきて、くろいくつをはきます。
    target_lang: ja
    translation:
      vi: Tôi mặc áo len đỏ và đi giày đen.
    note:
      vi: きて・はきます - dùng đúng động từ cho từng đồ.
  - type: example
    target: ふゆはコートをきて、ぼうしをかぶります。
    target_lang: ja
    translation:
      vi: Mùa đông tôi mặc áo khoác và đội mũ.
    note:
      vi: かぶります - đội mũ.
  - type: example
    target: げんかんでくつをぬぎます。
    target_lang: ja
    translation:
      vi: Tôi cởi giày ở lối vào.
    note:
      vi: ぬぎます - cởi.
  - type: example
    target: めがねをかけて、しんぶんをよみます。
    target_lang: ja
    translation:
      vi: Tôi đeo kính để đọc báo.
    note:
      vi: かけて - đeo (thể て).
  - type: common_mistake
    wrong: ズボンをきます。
    right: ズボンをはきます。
    target_lang: ja
    note:
      vi: Quần dùng はきます (mặc, mang phần dưới); きます dành cho áo.
  - type: common_mistake
    wrong: めがねをかぶります。
    right: めがねをかけます。
    target_lang: ja
    note:
      vi: Kính dùng かけます; かぶります chỉ dùng cho mũ nón.
  - type: summary
    points:
      - vi: ふく · シャツ · ズボン · スカート · コート · セーター · くつ · くつした.
      - vi: きます (áo, thân trên) · はきます (quần, giày, tất) · かぶります (mũ) · かけます (kính).
      - vi: ぬぎます - cởi ra (mọi thứ).
      - vi: Chọn động từ theo loại đồ.
