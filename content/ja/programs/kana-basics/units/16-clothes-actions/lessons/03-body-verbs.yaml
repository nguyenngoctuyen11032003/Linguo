title:
  vi: Động từ chuyển động - はしる・すわる・はいる・でる
objectives:
  - vi: "Dùng các động từ chuyển động: はしります, たちます, すわります, はいります, でます, あそびます."
  - vi: "Nói những động tác của cảm xúc: わらいます, なきます, うたいます."
  - vi: "Dùng đúng trợ từ: N に すわります / はいります, N を でます, N に あいます."
estimated_minutes: 16
