key: ja:lesson:kara-reason
order_index: 1
level: n5
title:
  vi: Vì... nên... - から và どうして
objectives:
  - vi: Nối lý do với kết quả bằng 〜から、〜.
  - vi: Hỏi "tại sao?" bằng どうして / なぜ và trả lời bằng 〜から(です).
  - vi: Phân biệt から "vì" với から "từ" đã học.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:particles-invitations-review]
