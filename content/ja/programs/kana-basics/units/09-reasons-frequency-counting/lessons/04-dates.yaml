key: ja:lesson:dates
order_index: 4
level: n5
title:
  vi: Ngày tháng - なんがつなんにち, ついたち, ふつか...
objectives:
  - vi: Nói tên 12 tháng, nhớ しがつ, しちがつ, くがつ.
  - vi: Đọc đúng ngày 1 - 10, 14, 20, 24 (ついたち, ふつか... はつか).
  - vi: Hỏi và nói ngày sinh nhật, lịch hẹn bằng なんがつなんにち.
estimated_minutes: 18
skills: [vocabulary, speaking, listening]
prerequisites: [ja:lesson:counters-hon-mai]
