title:
  vi: Có thường làm không? - いつも, よく, ときどき, あまり, ぜんぜん
objectives:
  - vi: Nói mức độ thường xuyên bằng いつも, よく, ときどき.
  - vi: Nói "ít khi", "hoàn toàn không" bằng あまり / ぜんぜん + phủ định.
  - vi: Nói thói quen theo tuần, tháng, năm bằng まいしゅう, まいつき, まいとし.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:kara-reason]
