title:
  vi: Lượng từ riêng - 〜ほん, 〜まい, 〜だい, 〜かい
objectives:
  - vi: Đếm vật dài bằng 〜ほん và nhớ các âm biến đổi (いっぽん, さんぼん, ろっぽん).
  - vi: Đếm vật mỏng bằng 〜まい, máy móc - xe bằng 〜だい, số lần bằng 〜かい.
  - vi: Hỏi số lượng bằng なんぼん, なんまい, なんだい, なんかい.
