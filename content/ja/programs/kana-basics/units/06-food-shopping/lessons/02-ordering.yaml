key: ja:lesson:ordering
order_index: 2
level: n5
title:
  vi: Gọi món ở quán - 〜をください
objectives:
  - vi: Gọi món bằng N をください / N をおねがいします, kèm số lượng.
  - vi: Hiểu câu chào của nhân viên - いらっしゃいませ, なんめいさまですか.
  - vi: Nói いただきます và ごちそうさまでした đúng lúc.
estimated_minutes: 15
skills: [speaking, listening, grammar]
prerequisites: [ja:lesson:food-drinks]
items:
  - item: ja:item:o-kudasai
  - item: ja:item:onegaishimasu
  - item: ja:item:irasshaimase
  - item: ja:item:itadakimasu
  - item: ja:item:menyuu
  - item: ja:item:tsu-counter
    role: reuse
