title:
  vi: Mua sắm - この・その・あの, たかい・やすい
objectives:
  - vi: Chỉ món hàng bằng この / その / あの + danh từ.
  - vi: Hỏi giá, nhận xét đắt / rẻ bằng たかいです / やすいです.
  - vi: Mua hàng bằng 〜をください và nói かいます.
estimated_minutes: 16
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [ja:lesson:likes-wants]
