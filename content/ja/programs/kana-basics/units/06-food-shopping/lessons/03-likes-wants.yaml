title:
  vi: Thích, ghét và muốn - すき・ほしい・〜たい
objectives:
  - vi: Nói thích / không thích bằng N がすきです / きらいです.
  - vi: Nói muốn có gì bằng N がほしいです, muốn làm gì bằng V たいです.
  - vi: Khen món ăn bằng おいしいです.
estimated_minutes: 16
skills: [grammar, speaking, writing]
prerequisites: [ja:lesson:ordering]
