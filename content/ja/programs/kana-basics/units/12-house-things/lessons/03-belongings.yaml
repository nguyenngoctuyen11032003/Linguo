    explanation:
      vi: おかね - tiền; ありません - không có; きっぷ - vé; かいません - không mua.
    display_answer: Vì không có tiền nên tôi không mua vé.
  - key: ja:exercise:belongings-megane-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-megane
    prompt:
      template: わたしは{{b1}}をかけます。 (Tôi đeo kính.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Vật đeo trên mắt để nhìn rõ.
        - Bắt đầu bằng め - めがね.
    answer:
      blanks:
        b1:
          - めがね
          - 眼鏡
    known_wrong:
      - answer: ぼうし
        feedback_vi: ぼうし là mũ; mũ đi với かぶります, không đi với かけます.
        error_tag: vocab_meaning
    explanation:
      vi: めがね là kính đeo mắt. めがねをかけます - đeo kính.
    display_answer: わたしはめがねをかけます。
  - key: ja:exercise:belongings-dare-no
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-kippu
    prompt:
      stem: Cái ô này của bạn. Ai đó hỏi “これはだれのかさですか。”. Bạn trả lời gì?
      stem_lang: vi
      options:
        - id: e82
          text: わたしがです。
          lang: ja
        - id: zcb
          text: わたしをです。
          lang: ja
        - id: g1a
          text: わたしにです。
          lang: ja
        - id: tan
          text: わたしのです。
          lang: ja
    answer:
      correct_option_id: tan
    explanation:
      vi: Trả lời “của tôi” là わたしのです - の thay cho danh từ. を, が, に không tạo ra nghĩa sở hữu.
    display_answer: わたしのです。
  - key: ja:exercise:belongings-shashin-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-shashin
    prompt:
      template: かぞくの{{b1}}があります。 (Có ảnh gia đình.)
      blanks:
        - id: b1
          width_hint: 5
    answer:
      blanks:
        b1:
          - しゃしん
          - 写真
    known_wrong:
      - answer: てがみ
        feedback_vi: てがみ là thư; ảnh là しゃしん.
        error_tag: vocab_meaning
    explanation:
      vi: しゃしん là ảnh. かぞくのしゃしん - ảnh của gia đình.
    display_answer: かぞくのしゃしんがあります。
  - key: ja:exercise:belongings-tegami-fill
    type: fill_blank
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-tegami
    prompt:
      template: ともだちに{{b1}}をかきます。 (Tôi viết thư cho bạn.)
      blanks:
        - id: b1
          width_hint: 4
    answer:
      blanks:
        b1:
          - てがみ
          - 手紙
    known_wrong:
      - answer: しんぶん
        feedback_vi: しんぶん là báo; người ta không viết báo gửi bạn.
        error_tag: vocab_meaning
      - answer: しゃしん
        feedback_vi: しゃしん là ảnh; viết gửi bạn là てがみ.
        error_tag: vocab_meaning
    explanation:
      vi: てがみ là thư. ともだちに - cho bạn; かきます - viết.
    display_answer: ともだちにてがみをかきます。
  - key: ja:exercise:belongings-shinbun-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-shinbun
    prompt:
      source_text: Sáng nào tôi cũng đọc báo.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - まいあさしんぶんをよみます。
        - 毎朝新聞を読みます。
        - まいあさ、しんぶんをよみます。
        - あさ、まいにちしんぶんをよみます。
    known_wrong:
      - answer: まいあさしんぶんをたべます。
        feedback_vi: たべます là ăn; đọc báo là よみます.
        error_tag: verb_choice
      - answer: まいあさしんぶんをかいます。
        feedback_vi: かいます là mua, không phải đọc.
        error_tag: verb_choice
    explanation:
      vi: まいあさ là mỗi sáng; しんぶんをよみます - đọc báo.
    display_answer: まいあさしんぶんをよみます。
  - key: ja:exercise:belongings-okane-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u12-okane
    prompt:
      source_text: おかねがありませんから、ざっしをかいません。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Vì không có tiền nên tôi không mua tạp chí.
        - Tôi không có tiền nên không mua tạp chí.
        - Do không có tiền nên tôi không mua tạp chí.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Vì có tiền nên tôi mua tạp chí.
        feedback_vi: ありません và かいません đều là phủ định.
        error_tag: negation
    explanation:
      vi: "ありませんから - vì không có; かいません - không mua. Câu có hai vế: lý do trước, kết quả sau."
    display_answer: Vì không có tiền nên tôi không mua tạp chí.
  - key: ja:exercise:belongings-dare-wb
    type: word_bank
    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-pen
    prompt:
      instruction: 'Sắp xếp thành câu tiếng Nhật: "Cái bút này của ai?"'
      tokens:
        - id: t3
          text: ペンですか。
        - id: t1
          text: これは
        - id: t2
          text: だれの
    answer:
      orders:
        - - t1
          - t2
          - t3
    explanation:
      vi: これは (chủ đề) → だれの (của ai) → ペンですか (danh từ + câu hỏi).
    display_answer: これはだれのペンですか。
  - key: ja:exercise:belongings-situ
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-boushi
    prompt:
      stem: Trời nắng, bạn muốn nói “Tôi đội mũ”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: cho
          text: ぼうしをよみます。
          lang: ja
        - id: zl3
          text: ぼうしをかけます。
          lang: ja
        - id: o75
          text: ぼうしをかぶります。
          lang: ja
        - id: xvg
          text: ぼうしをのみます。
          lang: ja
    answer:
      correct_option_id: o75
    explanation:
      vi: Mũ đi với かぶります (đội). かけます dùng cho kính, のみます là uống, よみます là đọc.
    display_answer: ぼうしをかぶります。
