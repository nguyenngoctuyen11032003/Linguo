body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi tên được đồ dùng quanh mình và hỏi đồ vật của ai - これはだれのペンですか。- わたしのです。
  - type: explain
    text:
      vi: "Đồ dùng học tập: えんぴつ (bút chì), ペン (bút bi), けしゴム (cục tẩy), ノート (vở), じしょ (từ điển). Giấy tờ: てがみ (thư), しゃしん (ảnh), しんぶん (báo), ざっし (tạp chí), きっぷ (vé)."
  - type: explain
    text:
      vi: "Đồ cá nhân: めがね (kính), ぼうし (mũ), おかね (tiền). Trước おかね có お lịch sự nên hầu như luôn nói おかね. Dùng ～を かけます cho đeo kính (めがねをかけます) và ～を かぶります cho đội mũ (ぼうしをかぶります)."
  - type: explain
    text:
      vi: Hỏi vật của ai - これはだれのですか。 (Cái này của ai?) Trả lời - わたしのです / たなかさんのです. Từ の thay cho danh từ - "của tôi" và không cần nhắc lại tên vật.
  - type: deep_explain
    text:
      vi: "Động từ đi với trang phục và phụ kiện khác nhau - めがねをかけます (đeo kính), ぼうしをかぶります (đội mũ), くつをはきます (đi giày), シャツをきます (mặc áo). Bạn sẽ học các động từ này ở bài về trang phục. きっぷ (vé) khác きって (tem): きっぷ là vé tàu, きって là tem bưu điện. Chữ Hán - 鉛筆, 辞書, 手紙, 写真, 新聞, 雑誌, 眼鏡, 帽子, 切符, お金."
  - type: example
    target: これはだれのペンですか。- わたしのです。
    target_lang: ja
    translation:
      vi: Cái bút này của ai? - Của tôi.
    note:
      vi: N の です - của N; không cần lặp lại danh từ.
  - type: example
    target: まいあさしんぶんをよみます。
    target_lang: ja
    translation:
      vi: Sáng nào tôi cũng đọc báo.
    note:
      vi: しんぶん - báo; よみます - đọc.
  - type: example
    target: おかねがありませんから、きっぷをかいません。
    target_lang: ja
    translation:
      vi: Vì không có tiền nên tôi không mua vé.
    note:
      vi: ありません - không có; かいません là phủ định của かいます.
  - type: example
    target: ともだちにてがみをかきます。
    target_lang: ja
    translation:
      vi: Tôi viết thư cho bạn.
    note:
      vi: に - cho, tới (người nhận).
  - type: common_mistake
    wrong: めがねをかぶります。
    right: めがねをかけます。
    target_lang: ja
    note:
      vi: Kính dùng かける; かぶる dành cho mũ, nón.
  - type: common_mistake
    wrong: これはわたしのペンのです。
    right: これはわたしのペンです。 / これはわたしのです。
    target_lang: ja
    note:
      vi: Không thêm の thừa sau danh từ. Dùng わたしのペン hoặc わたしの (thay danh từ), không dùng cả hai.
  - type: summary
    points:
      - vi: えんぴつ bút chì · ペン bút · けしゴム tẩy · ノート vở · じしょ từ điển.
      - vi: てがみ thư · しゃしん ảnh · しんぶん báo · ざっし tạp chí · きっぷ vé · おかね tiền.
      - vi: めがね kính (かける) · ぼうし mũ (かぶる).
      - vi: だれのですか - của ai? - わたしのです.
exercises:
  - key: ja:exercise:belongings-enpitsu
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-enpitsu
    prompt:
      stem: Từ nào có nghĩa là “bút chì”?
      stem_lang: vi
      options:
        - id: ubd
          text: ペン
          lang: ja
        - id: no4
          text: けしゴム
          lang: ja
        - id: qtg
          text: ノート
          lang: ja
        - id: ftk
          text: えんぴつ
          lang: ja
    answer:
      correct_option_id: ftk
    explanation:
      vi: えんぴつ là bút chì. ペン là bút bi/bút mực, けしゴム là cục tẩy, ノート là vở.
    display_answer: えんぴつ
  - key: ja:exercise:belongings-jisho
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-jisho
    prompt:
      stem: Bạn muốn tra nghĩa của một từ. Bạn dùng gì?
      stem_lang: vi
      options:
        - id: sj7
          text: ざっし
          lang: ja
        - id: ezl
          text: しんぶん
          lang: ja
        - id: o0n
          text: てがみ
          lang: ja
        - id: sde
          text: じしょ
          lang: ja
    answer:
      correct_option_id: sde
    explanation:
      vi: じしょ là từ điển - dùng để tra từ. しんぶん là báo, てがみ là thư, ざっし là tạp chí.
    display_answer: じしょ
  - key: ja:exercise:belongings-kippu
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: ja:item:n5-u12-kippu
    prompt:
      audio_asset_id: null
      fallback_text: おかねがありませんから、きっぷをかいません。
      options:
        - id: rd4
          text: Vì có tiền nên tôi mua vé.
          lang: vi
        - id: sqh
          text: Vì không có thư nên tôi không viết thư.
          lang: vi
        - id: i6w
          text: Vì không có thời gian nên tôi không đi.
          lang: vi
        - id: z7o
          text: Vì không có tiền nên tôi không mua vé.
          lang: vi
    answer:
