      fallback_text: つくえのうえにほんがあります。いすのしたにねこがいます。
      options:
        - id: aut
          text: Dưới bàn học có quyển sách. Trên ghế có con mèo.
          lang: vi
        - id: gg7
          text: Trên bàn học có con mèo. Dưới ghế có quyển sách.
