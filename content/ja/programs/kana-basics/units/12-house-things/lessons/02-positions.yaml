    item: ja:item:n5-u12-shita
    prompt:
      stem: Từ nào có nghĩa là “dưới”?
      stem_lang: vi
      options:
        - id: p2d
          text: うえ
          lang: ja
        - id: v5n
          text: まえ
          lang: ja
        - id: ykb
          text: した
          lang: ja
        - id: cq9
          text: なか
          lang: ja
    answer:
      correct_option_id: ykb
    explanation:
