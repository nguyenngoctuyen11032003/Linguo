  - key: ja:exercise:positions-ushiro-fill
    type: fill_blank
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-ushiro
    prompt:
      template: いえの{{b1}}ににわがあります。 (Sau nhà có vườn.)
      blanks:
        - id: b1
          width_hint: 4
      hint_levels:
        - Vị trí ngược với まえ.
        - Bắt đầu bằng う - うしろ.
    answer:
      blanks:
        b1:
          - うしろ
          - 後ろ
    known_wrong:
      - answer: まえ
        feedback_vi: まえ là trước nhà; sau nhà là うしろ.
        error_tag: position
      - answer: よこ
        feedback_vi: よこ là bên hông.
        error_tag: position
    explanation:
      vi: うしろ là phía sau. N の うしろに - ở phía sau N.
    display_answer: いえのうしろににわがあります。
  - key: ja:exercise:positions-arimasu
    type: mcq
    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-ichi-ni-arimasu
    prompt:
      stem: Chọn câu đúng - いすのしたに ねこが ___。
      stem_lang: vi
      options:
        - id: vpp
          text: あります
          lang: ja
        - id: i74
          text: います
          lang: ja
        - id: c9d
          text: いません
          lang: ja
        - id: lc0
          text: ありません
          lang: ja
    answer:
      correct_option_id: i74
    explanation:
      vi: Mèo là con vật nên dùng います. あります dành cho vật vô tri; ありません/いません là phủ định.
    display_answer: います
  - key: ja:exercise:positions-naka-fill
