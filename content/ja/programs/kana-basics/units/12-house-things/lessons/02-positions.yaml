body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được đồ vật hay người ở đâu - つくえのうえにほんがあります。いすのしたにねこがいます。
  - type: explain
    text:
      vi: 'Từ chỉ vị trí đứng sau の: N の うえ (trên N), した (dưới), なか (trong), そと (ngoài), まえ (trước), うしろ (sau), となり (cạnh, nhà bên), よこ (bên hông), あいだ (giữa), ちかく (gần). Thứ tự giống tiếng Việt đảo lại - "trên bàn" là つくえのうえ.'
  - type: explain
    text:
      vi: Mẫu câu - N1 の 位置 に N2 が あります (vật) / います (người, động vật). Ví dụ つくえのうえにほんがあります; いすのしたにねこがいます. Hỏi - N は どこに ありますか。 Đáp - N は 位置 に あります.
  - type: explain
    text:
      vi: "Hai từ となり và よこ khá gần nghĩa nhưng khác nhau - となり dùng cho hai vật cùng loại đứng sát nhau (ぎんこうのとなり: bên cạnh ngân hàng), よこ chỉ bên hông, bên sườn của một vật (ドアのよこ: bên cạnh cửa)."
  - type: deep_explain
    text:
      vi: 'あいだ cần hai danh từ nối bằng と: AとBのあいだ (giữa A và B). Khi nói vị trí của người hay vật, thêm に sau từ chỉ vị trí; nếu không có に (ví dụ すしはつくえのうえです) thì thành câu khẳng định "sushi ở trên bàn" kiểu mô tả. Chữ Hán - 上, 下, 中, 外, 前, 後ろ, 隣, 横, 間, 近く.'
  - type: example
    target: つくえのうえにほんがあります。
    target_lang: ja
    translation:
      vi: Trên bàn học có quyển sách.
    note:
      vi: うえ - trên; vật vô tri dùng あります.
  - type: example
    target: いすのしたにねこがいます。
    target_lang: ja
    translation:
      vi: Dưới ghế có con mèo.
    note:
      vi: います - có (con vật, người).
  - type: example
    target: ぎんこうのとなりにきっさてんがあります。
    target_lang: ja
    translation:
      vi: Bên cạnh ngân hàng có quán cà phê.
    note:
      vi: となり - bên cạnh (cùng loại, sát nhau).
  - type: example
    target: えきとぎんこうのあいだにこうえんがあります。
    target_lang: ja
    translation:
      vi: Giữa ga và ngân hàng có công viên.
    note:
      vi: A と B の あいだ - giữa A và B.
  - type: common_mistake
    wrong: つくえのうえをほんがあります。
    right: つくえのうえにほんがあります。
    target_lang: ja
    note:
      vi: Vị trí đi với に, không dùng を.
  - type: common_mistake
    wrong: いすのしたにねこがあります。
    right: いすのしたにねこがいます。
    target_lang: ja
    note:
      vi: Con vật và người dùng います, không dùng あります.
  - type: summary
    points:
      - vi: うえ trên · した dưới · なか trong · そと ngoài · まえ trước · うしろ sau · となり cạnh · よこ bên hông · あいだ giữa · ちかく gần.
      - vi: N1 の 位置 に N2 が あります (vật) / います (người, con vật).
      - vi: Hỏi - N は どこに ありますか / いますか。
      - vi: A と B の あいだ - giữa A và B.
exercises:
