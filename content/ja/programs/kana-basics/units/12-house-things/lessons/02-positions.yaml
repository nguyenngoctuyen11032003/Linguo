  - key: ja:exercise:positions-chikaku-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-chikaku
    prompt:
      source_text: Gần ga có siêu thị.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - えきのちかくにスーパーがあります。
        - 駅の近くにスーパーがあります。
        - えきのちかくにスーパーがあります
        - えきちかくにスーパーがあります。
    known_wrong:
      - answer: えきのちかくでスーパーがあります。
        feedback_vi: Có vật ở đâu dùng に, không dùng で.
        error_tag: particle_ni_de
      - answer: えきのまえにスーパーがいます。
        feedback_vi: Siêu thị là vật vô tri dùng あります.
        error_tag: arimasu_imasu
    explanation:
      vi: ちかく là gần; N の ちかくに - gần N; スーパー là vật vô tri nên dùng あります.
    display_answer: えきのちかくにスーパーがあります。
  - key: ja:exercise:positions-aida-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u12-aida
    prompt:
      source_text: えきとぎんこうのあいだにこうえんがあります。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Giữa ga và ngân hàng có công viên.
        - Giữa nhà ga và ngân hàng có một công viên.
        - Ở giữa ga và ngân hàng có công viên.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Giữa công viên và ngân hàng có nhà ga.
        feedback_vi: A と B の あいだ - giữa A và B; ở đây あいだ là ga và ngân hàng, công viên nằm giữa.
        error_tag: meaning
    explanation:
      vi: A と B の あいだ に C が あります - C nằm giữa A và B.
    display_answer: Giữa ga và ngân hàng có công viên.
