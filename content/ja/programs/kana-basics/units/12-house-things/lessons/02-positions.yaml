title:
  vi: Vị trí - うえ・した・なか・となり
objectives:
  - vi: "Gọi tên các từ chỉ vị trí: うえ, した, なか, そと, まえ, うしろ, となり, よこ, あいだ, ちかく."
  - vi: Nói vị trí bằng N1 の うえ に N2 が あります / います.
  - vi: Hỏi vị trí bằng どこに ありますか / いますか.
estimated_minutes: 15
