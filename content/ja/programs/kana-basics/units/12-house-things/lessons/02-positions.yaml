    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-ichi-ni-arimasu
    prompt:
      stem: Bạn hỏi “Cái ô ở đâu?”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: rbs
          text: かさはなにがありますか。
          lang: ja
        - id: b1y
          text: かさはどこがいますか。
          lang: ja
        - id: qkx
          text: かさはどこをありますか。
          lang: ja
        - id: zge
          text: かさはどこにありますか。
          lang: ja
    answer:
