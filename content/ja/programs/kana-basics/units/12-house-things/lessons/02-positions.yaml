    item: ja:item:n5-u12-naka
    prompt:
      stem: Từ nào có nghĩa là “trong, bên trong”?
      stem_lang: vi
      options:
        - id: ina
          text: となり
          lang: ja
        - id: cjx
          text: そと
          lang: ja
        - id: ar5
          text: なか
          lang: ja
