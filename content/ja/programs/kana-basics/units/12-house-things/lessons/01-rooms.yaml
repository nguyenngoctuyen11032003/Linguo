    display_answer: ほんだなにほんがたくさんあります。
  - key: ja:exercise:rooms-furniture-heya-tr
    type: translate
    stage: recall
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-heya
    prompt:
      source_text: Trong phòng tôi có bàn học và giường.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - わたしのへやにはつくえとベッドがあります。
        - わたしのへやにつくえとベッドがあります。
        - 私の部屋には机とベッドがあります。
        - へやにはつくえとベッドがあります。
        - へやにつくえとベッドがあります。
    known_wrong:
      - answer: わたしのへやでつくえとベッドがあります。
        feedback_vi: Nơi có vật dùng に, không dùng で.
        error_tag: particle_ni_de
      - answer: わたしのへやにつくえとベッドがいます。
        feedback_vi: Vật vô tri dùng あります; います dành cho người, động vật.
        error_tag: arimasu_imasu
    explanation:
      vi: N に N が あります - có vật ở nơi chốn. と nối hai vật.
    display_answer: わたしのへやにはつくえとベッドがあります。
  - key: ja:exercise:rooms-furniture-genkan-tr
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: ja:item:n5-u12-genkan
    prompt:
      source_text: げんかんでくつをぬいで、へやにはいります。
      source_lang: ja
      direction: target_to_vi
    answer:
      accepted:
        - Tôi cởi giày ở lối vào rồi vào phòng.
        - Cởi giày ở sảnh vào rồi vào phòng.
        - Tôi cởi giày ở cửa ra vào rồi đi vào phòng.
        - Tôi cởi giày ở lối vào rồi bước vào phòng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi đi giày ở lối vào rồi vào phòng.
        feedback_vi: ぬぐ là cởi, không phải đi/mang giày.
        error_tag: verb_choice
    explanation:
      vi: ぬいで là thể て của ぬぐ (cởi); はいります là vào. ～て nối hai hành động theo thứ tự.
    display_answer: Tôi cởi giày ở lối vào rồi vào phòng.
