  - key: ja:exercise:rooms-furniture-situ
    type: mcq
    stage: application
    answer_lang: ja
    difficulty: 2
    item: ja:item:n5-u12-beddo
    prompt:
      stem: Bạn muốn nói “Trong phòng tôi có một cái giường”. Câu nào đúng?
      stem_lang: vi
      options:
        - id: svs
          text: わたしのへやにベッドがいます。
          lang: ja
        - id: d4t
          text: わたしのへやをベッドがあります。
          lang: ja
        - id: xnk
          text: わたしのへやでベッドがあります。
          lang: ja
        - id: sd1
          text: わたしのへやにベッドがあります。
          lang: ja
    answer:
      correct_option_id: sd1
    explanation:
      vi: "Có vật vô tri ở nơi chốn: に + あります. で dành cho nơi diễn ra hành động, います dành cho người và động vật, を không dùng ở đây."
    display_answer: わたしのへやにベッドがあります。
