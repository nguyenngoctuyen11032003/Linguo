    stage: recognition
    answer_lang: ja
    difficulty: 1
    item: ja:item:n5-u12-kaidan
    prompt:
      template: "{{b1}}でへやへいきます。 (Tôi đi lên phòng bằng cầu thang.)"
      blanks:
        - id: b1
          width_hint: 5
      hint_levels:
