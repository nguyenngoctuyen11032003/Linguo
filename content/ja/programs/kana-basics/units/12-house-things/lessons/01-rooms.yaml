body:
  - type: objective
    text:
      vi: Sau bài này, bạn tả được căn phòng của mình - わたしのへやにはつくえとベッドがあります。- và gọi tên các đồ trong nhà.
  - type: explain
    text:
      vi: "Nhà ở: へや (phòng), だいどころ (bếp), げんかん (lối vào), にわ (vườn), かいだん (cầu thang), まど (cửa sổ), ドア (cửa). げんかん là nơi cởi giày - nhà Nhật có bậc thấp để bạn bỏ giày ở đó."
  - type: explain
    text:
      vi: "Đồ nội thất: つくえ (bàn học), テーブル (bàn ăn, bàn tiếp khách), いす (ghế), ベッド (giường), ほんだな (giá sách), エアコン (điều hoà), でんき (điện, đèn). つくえ và テーブル khác nhau - つくえ để học hoặc làm việc, テーブル để ăn hay tiếp khách."
  - type: explain
    text:
      vi: Nói trong phòng có gì - Nơi chốn に + vật が あります. Ví dụ へやにつくえとベッドがあります (Trong phòng có bàn học và giường). Hỏi - へやになにがありますか。
  - type: deep_explain
    text:
      vi: Bật tắt thiết bị - でんきをつけます (bật đèn), でんきをけします (tắt đèn), エアコンをつけます (bật điều hoà). Mở đóng cửa - まどをあけます (mở cửa sổ), ドアをしめます (đóng cửa). Các động từ あけます, しめます, つけます, けします sẽ được dạy kỹ ở N4. Chữ Hán - 部屋, 窓, 机, 椅子, 電気, 台所, 玄関, 庭, 階段, 本棚.
  - type: example
    target: わたしのへやにはつくえとベッドがあります。
    target_lang: ja
    translation:
      vi: Trong phòng tôi có bàn học và giường.
    note:
      vi: に + あります - có (vật vô tri) ở nơi chốn.
  - type: example
    target: だいどころにテーブルといすがあります。
    target_lang: ja
    translation:
      vi: Trong bếp có bàn và ghế.
    note:
      vi: と - và (liệt kê vật).
  - type: example
    target: げんかんでくつをぬぎます。
    target_lang: ja
    translation:
      vi: Tôi cởi giày ở lối vào.
    note:
      vi: で - nơi diễn ra hành động.
  - type: example
    target: へやになにがありますか。- ほんだながあります。
    target_lang: ja
    translation:
      vi: Trong phòng có gì? - Có một giá sách.
    note:
      vi: なに - cái gì.
  - type: common_mistake
    wrong: へやでつくえがあります。
    right: へやにつくえがあります。
    target_lang: ja
    note:
      vi: Nói có vật ở đâu dùng に, không dùng で (で dành cho nơi diễn ra hành động).
  - type: common_mistake
    wrong: いすはつくえです。(ghế là bàn)
    right: いすとつくえがあります。
    target_lang: ja
    note:
      vi: Muốn nói "có ghế và bàn" thì dùng と và あります, không nối bằng です.
  - type: summary
    points:
      - vi: へや phòng · だいどころ bếp · げんかん lối vào · にわ vườn · かいだん cầu thang · まど cửa sổ · ドア cửa.
      - vi: つくえ bàn học · テーブル bàn ăn · いす ghế · ベッド giường · ほんだな giá sách · エアコン điều hoà · でんき đèn.
      - vi: N に N が あります - có vật ở nơi chốn.
      - vi: Hỏi - なにが ありますか。
