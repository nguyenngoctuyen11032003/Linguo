  vi: Kana và giao tiếp nền tảng
description:
  vi: Hai bảng chữ Hiragana và Katakana (âm đục, âm ghép, âm ngắt, trường âm, từ ngoại lai) rồi giao tiếp đầu tiên - chào hỏi và giới thiệu, số đếm và thời gian, sinh hoạt hằng ngày, ăn uống và mua sắm, tính từ và thì quá khứ, trợ từ が・も・と・から〜まで và lời rủ ませんか・ましょう (Kana đến N5). Câu tiếng Nhật trong bài viết bằng kana để bạn đọc được ngay; chữ Hán xem trên thẻ từ vựng.
