    explanation:
      vi: Một đặc điểm trong quá khứ nay đã thay đổi - used to + V nguyên mẫu (used to be). I'm used to being là "tôi quen với việc nhút nhát" - sai nghĩa; hai câu còn lại sai cấu trúc.
