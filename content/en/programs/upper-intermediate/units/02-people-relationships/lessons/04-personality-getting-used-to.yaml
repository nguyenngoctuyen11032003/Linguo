        - { id: b2w, text: "I'm used to being very shy, but now I'm much more self-confident.", lang: en }
        - { id: l5j, text: "I was used to be very shy, but now I'm much more self-confident.", lang: en }
        - { id: v0r, text: "I used to being very shy, but now I'm much more self-confident.", lang: en }
