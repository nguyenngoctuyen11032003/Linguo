  - key: en:exercise:personality-mcq-situation-generous
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:generous
    prompt:
      stem: Bạn muốn khen một người bạn lúc nào cũng sẵn lòng chia sẻ và hay trả tiền cho cả nhóm. Câu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: i4s, text: "She's really generous - she always pays for everyone.", lang: en }
        - { id: u9k, text: "She's really selfish - she always pays for everyone.", lang: en }
        - { id: h1d, text: "She's really stubborn - she always pays for everyone.", lang: en }
        - { id: c7q, text: "She's really bad-tempered - she always pays for everyone.", lang: en }
    answer:
      correct_option_id: i4s
    explanation:
      vi: Hay cho đi, hay trả tiền cho người khác là generous (hào phóng). Selfish (ích kỷ), stubborn (cứng đầu), bad-tempered (nóng tính) đều là lời chê, không khớp với ý sau.
    display_answer: "She's really generous - she always pays for everyone."

  - key: en:exercise:personality-mcq-used-to-meaning
    type: mcq
