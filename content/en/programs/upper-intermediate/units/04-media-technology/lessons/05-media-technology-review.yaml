  - key: en:exercise:media-review-mcq-situation-comment
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:zero-article-general
    prompt:
      stem: Bạn viết bình luận dưới bài blog, đồng ý một phần với tác giả. Câu nào đúng ngữ pháp và đúng tinh thần bản tin khoa học?
      stem_lang: vi
      options:
        - { id: r8t, text: "Great post! Research suggests that screen time is linked to poor sleep, although it doesn't prove that phones are the only cause.", lang: en }
        - { id: e5n, text: "Great post! The researches prove that the screen time causes poor sleep.", lang: en }
        - { id: l2g, text: "Great post! A research suggests that screen time is linked to poor sleep, which prove phones are bad.", lang: en }
        - { id: i6c, text: "Great post! Researches suggest that the screen time is linked to the poor sleep.", lang: en }
    answer:
      correct_option_id: r8t
    explanation:
      vi: Research không đếm được (không a, không -s), screen time nói chung không có the, và nghiên cứu chỉ suggest - không prove. Phương án đúng vừa đúng ngữ pháp vừa phản ánh chính xác giới hạn của nghiên cứu.
    display_answer: "Great post! Research suggests that screen time is linked to poor sleep, although it doesn't prove that phones are the only cause."
