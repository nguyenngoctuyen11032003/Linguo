  - vi: Kết hợp mệnh đề quan hệ không xác định, mệnh đề phân từ, mạo từ và cấu tạo từ trong văn bản liền mạch.
  - vi: Đánh giá độ tin cậy của tin tức bằng ngôn ngữ đưa tin khoa học (suggest, claim, a link between).
