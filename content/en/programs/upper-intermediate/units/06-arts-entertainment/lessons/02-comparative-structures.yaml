key: en:lesson:arts-comparative-structures
order_index: 2
level: b2
title:
  vi: Càng… càng…, hơn hẳn, kém xa - so sánh nâng cao
objectives:
  - vi: Dùng cấu trúc so sánh kép The more…, the more… cho hai thay đổi đi cùng nhau.
  - vi: Nhấn mạnh mức chênh lệch bằng much / far / a lot / slightly + so sánh hơn và by far the + so sánh nhất.
  - vi: So sánh kém và bằng với nowhere near as, not nearly as, just as, twice as … as.
  - vi: Bàn về ngành giải trí - box office, blockbuster, critically acclaimed.
estimated_minutes: 25
skills: [grammar, speaking, writing]
prerequisites: [en:lesson:arts-reviews-adjectives]
