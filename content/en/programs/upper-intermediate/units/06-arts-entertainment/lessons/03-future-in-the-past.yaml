key: en:lesson:arts-future-in-past
order_index: 3
level: b2
title:
  vi: Đã định…, vừa sắp… - tương lai trong quá khứ
objectives:
  - vi: Nói về kế hoạch đã thay đổi bằng was / were going to + V.
  - vi: Kể việc sắp xảy ra thì bị cắt ngang bằng was / were about to + V.
  - vi: Dùng would cho dự đoán, lời hứa nhìn từ quá khứ và was supposed to cho kế hoạch không thành.
  - vi: Nói về biểu diễn - premiere, rehearsal, sell out, live performance.
estimated_minutes: 25
skills: [grammar, speaking, vocabulary]
prerequisites: [en:lesson:arts-comparative-structures]
