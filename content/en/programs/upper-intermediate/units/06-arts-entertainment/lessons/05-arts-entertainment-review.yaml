title:
  vi: "Ôn tập: Bài review hoà nhạc & thảo luận trên diễn đàn phim"
objectives:
  - vi: Viết một bài review buổi hoà nhạc kết hợp tính từ cực, so sánh nâng cao và tương lai trong quá khứ.
  - vi: Tham gia thảo luận trên diễn đàn phim - tránh tiết lộ nội dung, bày tỏ ý kiến trái chiều.
  - vi: Dùng lại toàn bộ cấu trúc của unit trong văn bản liền mạch.
estimated_minutes: 25
skills: [writing, reading, grammar, vocabulary]
prerequisites: [en:lesson:arts-ever-no-matter]
