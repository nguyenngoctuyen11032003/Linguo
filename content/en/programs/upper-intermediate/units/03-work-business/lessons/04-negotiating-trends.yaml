    known_wrong:
      - answer: Sau một cuộc thảo luận dài, hai bên đã đạt được thỏa thuận về giá.
        feedback_vi: Gần đúng, nhưng compromise là thỏa hiệp (mỗi bên nhượng bộ một phần); thỏa thuận là agreement.
