key: en:lesson:law-justice-investigation
order_index: 3
level: b2
title:
  vi: Hồ sơ điều tra - quá khứ hoàn thành tiếp diễn (had been doing)
objectives:
  - vi: Dùng had been + V-ing cho hành động kéo dài trước một mốc trong quá khứ.
  - vi: Chọn had been doing (quá trình) hay had done (kết quả, số lượng).
  - vi: Giải thích dấu vết ở hiện trường bằng hoạt động đã diễn ra trước đó.
  - vi: Dùng từ vựng điều tra - investigation into, detective, crime scene, fingerprints, CCTV footage, alibi.
estimated_minutes: 25
skills: [grammar, writing, reading]
prerequisites: [en:lesson:law-justice-past-modals]
