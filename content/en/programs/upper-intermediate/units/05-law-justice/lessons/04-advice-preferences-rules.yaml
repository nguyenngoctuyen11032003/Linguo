title:
  vi: Had better, would rather, it's time & be supposed to - bàn về hình phạt
objectives:
  - vi: Cảnh báo bằng had better (not) + V và phân biệt với should.
  - vi: Nói lựa chọn ưu tiên bằng would rather + V và would rather + somebody + quá khứ đơn.
  - vi: Phê bình việc chậm trễ bằng It's (high) time + quá khứ đơn; nói quy định bằng be supposed to.
  - vi: Thảo luận về hình phạt - community service, deter, reoffend, rehabilitation.
estimated_minutes: 25
skills: [grammar, speaking, writing]
prerequisites: [en:lesson:law-justice-investigation]
items:
  - item: en:item:had-better
  - item: en:item:would-rather
  - item: en:item:would-rather-someone-did
  - item: en:item:its-high-time
  - item: en:item:be-supposed-to
  - item: en:item:community-service
