key: en:lesson:law-justice-crime-vocabulary
order_index: 1
level: b2
title:
  vi: Tội phạm & toà án - accuse of, charge with, sentence to
objectives:
  - vi: Đọc hiểu tin tức về tội phạm và xét xử với các từ suspect, court, trial, plead guilty.
  - vi: Dùng đúng giới từ đi kèm - accuse of, charge with, arrest for, sentence to, blame for/on.
  - vi: Phân biệt các bước của một vụ án - bị bắt, bị khởi tố, ra toà, bị tuyên án.
estimated_minutes: 25
skills: [vocabulary, reading, grammar]
prerequisites: [en:lesson:media-technology-review]
