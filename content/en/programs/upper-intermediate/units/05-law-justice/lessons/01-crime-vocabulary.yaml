  - item: en:item:commit-a-crime
  - item: en:item:accuse-of
  - item: en:item:charge-with
  - item: en:item:arrest-for
  - item: en:item:sentence-to
  - item: en:item:blame-for
  - item: en:item:be-found-guilty-of
