  - key: en:exercise:opsoc-rev-translate-take-action
    type: translate
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:take-action
    prompt:
      source_text: Theo tôi, chính quyền nên hành động ngay để giảm ùn tắc giao thông.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - In my view, the authorities should take action now to reduce traffic congestion.
        - In my opinion, the authorities should take action now to reduce traffic congestion.
        - In my view, the authorities should take action immediately to reduce traffic congestion.
        - In my opinion, the authorities should take action immediately to reduce traffic congestion.
        - In my view, the authorities should act now to reduce traffic congestion.
        - I'd argue that the authorities should take action now to reduce traffic congestion.
        - I think the authorities should take action now to reduce traffic congestion.
        - In my view, the government should take action now to reduce traffic congestion.
        - In my opinion, the government should take action now to reduce traffic congestion.
        - In my view, the authorities should take immediate action to reduce traffic congestion.
        - I would argue that the authorities should take action now to reduce traffic congestion.
        - In my opinion, the authorities should act now to reduce traffic congestion.
        - In my view, the authorities should act immediately to reduce traffic congestion.
        - In my opinion, the authorities should take immediate action to reduce traffic congestion.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: In my opinion, I think the authorities should take action now to reduce traffic congestion.
        feedback_vi: In my opinion đã có nghĩa "tôi nghĩ" - bỏ I think.
        error_tag: redundant_opinion
      - answer: In my view, the authorities should do action now to reduce traffic congestion.
        feedback_vi: Collocation đúng là take action, không phải do action.
        error_tag: collocation
      - answer: In my view, the authorities should make action now to reduce traffic congestion.
        feedback_vi: Collocation đúng là take action, không phải make action.
        error_tag: collocation
    explanation:
      vi: Mở đầu bằng In my view (không thêm I think); "hành động" trong ngữ cảnh chính sách là take action. "Để giảm" là to + V - to reduce.
    display_answer: In my view, the authorities should take action now to reduce traffic congestion.

  - key: en:exercise:opsoc-rev-translate-warn
    type: translate
