title:
  vi: Người ấy thế nào?
objectives:
  - vi: Miêu tả ngoại hình bằng tall, short, young, beautiful, handsome.
  - vi: Miêu tả tính cách bằng kind, friendly, funny, shy.
  - vi: Đặt tính từ đúng chỗ - trước danh từ (a kind teacher) hoặc sau be (She is kind).
estimated_minutes: 12
skills: [vocabulary, grammar, writing]
prerequisites: [en:lesson:have-got]
