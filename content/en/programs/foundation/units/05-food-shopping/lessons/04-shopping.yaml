      vi: Tiếng Việt nói "cái áo này năm đô" không cần "là", nhưng tiếng Anh cần is (hoặc dùng costs). Năm đô là số nhiều nên viết five dollars.
    display_answer: This T-shirt is five dollars.

  - key: en:exercise:shopping-order-size
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 2
    item: en:item:size
    prompt:
      instruction: "Người bán hỏi bạn mặc cỡ nào. Sắp xếp thành câu: \"Bạn mặc cỡ nào?\""
      tokens:
        - { id: z-are, text: are }
        - { id: z-you, text: you }
        - { id: z-size, text: size }
        - { id: z-what, text: What }
        - { id: z-do, text: do }
        - { id: z-is, text: is }
    answer:
      orders:
        - [z-what, z-size, z-are, z-you]
    explanation:
      vi: Hỏi cỡ của một người dùng What size are you? - be (are) đứng trước you vì là câu hỏi. Không nói What size you are?
    display_answer: What size are you?
