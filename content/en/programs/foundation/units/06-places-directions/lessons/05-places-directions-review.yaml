  - key: en:exercise:places-directions-review-translate-walk
    type: translate
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:can-cant
    prompt:
      source_text: Bệnh viện không xa đâu. Bạn có thể đi bộ đến đó.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - The hospital isn't far. You can walk there.
        - The hospital's not far. You can walk there.
        - The hospital isn't far. You can go there on foot.
        - The hospital's not far. You can go there on foot.
        - The hospital isn't far. You can walk.
        - The hospital's not far. You can walk.
        - The hospital isn't far. You can get there on foot.
        - The hospital's not far. You can get there on foot.
        - The hospital isn't far away. You can walk there.
        - The hospital's not far away. You can walk there.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: The hospital isn't far. You can to walk there.
        feedback_vi: Sau can không có to - You can walk there.
        error_tag: can_to
      - answer: The hospital not far. You can walk there.
        feedback_vi: Thiếu is - The hospital isn't far (The hospital is not far).
        error_tag: missing_be
      - answer: The hospital isn't far. You can go there by foot.
        feedback_vi: Đi bộ nói chuẩn là on foot, không phải by foot.
        error_tag: on_foot
      - answer: The hospital isn't far. You can walking there.
        feedback_vi: Sau can dùng động từ nguyên mẫu walk, không dùng walking.
        error_tag: can_verb_form
      - answer: The hospital isn't far. You can walk to there.
        feedback_vi: There đã có nghĩa "đến đó", không thêm to - walk there.
        error_tag: go_to_there
    explanation:
      vi: "\"Không xa\" cần be - The hospital isn't far. \"Có thể đi bộ\" là can + walk (nguyên mẫu), hoặc go there on foot."
    display_answer: The hospital isn't far. You can walk there.

  - key: en:exercise:places-directions-review-mcq-reply
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:take-the-second-left
    prompt:
      stem: "Một du khách hỏi: \"Excuse me, is there a pharmacy near here?\" Câu trả lời nào đúng hoàn toàn?"
      stem_lang: vi
      options:
        - { id: v8h, text: "Yes, there is. Go straight on and take the second right. It's next to the bank.", lang: en }
        - { id: a2y, text: "Yes, there's. Go straight on and take the second right. It's next to the bank.", lang: en }
        - { id: j7m, text: "Yes, it has. Go straight on and take the second right. It's next to the bank.", lang: en }
        - { id: d4t, text: "Yes, there is. Go straight on and take the two right. It's next the bank.", lang: en }
    answer:
      correct_option_id: v8h
    explanation:
      vi: Câu hỏi Is there…? trả lời Yes, there is (không rút gọn there's, không dùng has). Ngã rẽ thứ hai là the second right, và next luôn đi với to.
    display_answer: "Yes, there is. Go straight on and take the second right. It's next to the bank."
