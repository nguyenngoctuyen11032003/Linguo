        - Băng qua đường ở chỗ đèn giao thông. Bệnh viện ở bên tay trái bạn.
        - Qua đường ở chỗ đèn giao thông. Bệnh viện ở bên tay trái bạn.
        - Sang đường ở đèn giao thông. Bệnh viện ở bên trái bạn.
        - Sang đường ở chỗ đèn giao thông. Bệnh viện ở bên trái bạn.
        - Băng qua đường ở đèn giao thông. Bệnh viện ở bên trái bạn.
        - Sang đường ở chỗ đèn xanh đèn đỏ. Bệnh viện ở bên tay trái bạn.
        - Bạn sang đường ở chỗ đèn giao thông. Bệnh viện ở bên tay trái bạn.
