  - key: en:exercise:places-directions-review-listen-bank
    type: listen
    stage: recognition
    answer_lang: en
    difficulty: 1
    item: en:item:is-there-are-there
    prompt:
      audio_asset_id: null
      fallback_text: Is there a bank near here? - Yes, there is. It's next to the post office.
      options:
        - { id: r2v, text: "Gần đây có ngân hàng không? - Có. Nó ở cạnh bưu điện.", lang: vi }
        - { id: k9d, text: "Gần đây có ngân hàng không? - Có. Nó ở đối diện bưu điện.", lang: vi }
        - { id: f5s, text: "Ngân hàng ở đâu? - Nó ở cạnh bưu điện.", lang: vi }
        - { id: x1g, text: "Gần đây có bưu điện không? - Có. Nó ở cạnh ngân hàng.", lang: vi }
    answer:
      correct_option_id: r2v
    explanation:
      vi: Is there a bank…? là "có ngân hàng không?", không phải Where is (ở đâu). Next to là "cạnh", còn đối diện là opposite.
    display_answer: "Gần đây có ngân hàng không? - Có. Nó ở cạnh bưu điện."

  - key: en:exercise:places-directions-review-mcq-at-lights
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 1
    item: en:item:traffic-lights
    prompt:
      stem: "Chọn từ đúng cho chỗ trống: Turn left ___ the traffic lights."
      stem_lang: vi
      options:
        - { id: n4c, text: at, lang: en }
        - { id: p7e, text: in, lang: en }
        - { id: z3w, text: to, lang: en }
        - { id: l6q, text: on, lang: en }
    answer:
      correct_option_id: n4c
    explanation:
      vi: Rẽ ở một điểm mốc trên đường (đèn giao thông, ngân hàng, góc phố) dùng at. In là ở bên trong, to là hướng tới, on không dùng với điểm rẽ.
    display_answer: at

  - key: en:exercise:places-directions-review-order-cross
    type: word_bank
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:cross
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Sang đường ở chỗ đèn giao thông.\""
      tokens:
        - { id: c-lights, text: lights }
        - { id: c-the1, text: the }
        - { id: c-cross, text: Cross }
        - { id: c-at, text: at }
        - { id: c-go, text: Go }
        - { id: c-street, text: street }
        - { id: c-the2, text: the }
        - { id: c-on, text: on }
        - { id: c-traffic, text: traffic }
    answer:
      orders:
        - [c-cross, c-the1, c-street, c-at, c-the2, c-traffic, c-lights]
        - [c-cross, c-the2, c-street, c-at, c-the1, c-traffic, c-lights]
    explanation:
      vi: Câu chỉ đường bắt đầu bằng động từ Cross, ngay sau là the street (không cần giới từ). Chỗ đèn giao thông là at the traffic lights.
    display_answer: Cross the street at the traffic lights.

  - key: en:exercise:places-directions-review-fill-is-there-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 1
    item: en:item:is-there-are-there
    prompt:
      template: "{{b1}} there a post office on this street? - Yes, there {{b2}}."
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 2 }
      hint_levels:
        - "Nghĩa của câu: Trên con phố này có bưu điện không? - Có."
        - "Gợi ý: một bưu điện là số ít; câu trả lời ngắn lặp lại cùng động từ."
    answer:
      blanks:
        b1: [Is]
        b2: [is]
    known_wrong:
      - answer: Are
        feedback_vi: A post office là số ít nên hỏi Is there, trả lời there is.
        error_tag: there_be_agreement
      - answer: Have
        feedback_vi: Hỏi "có… không?" về sự tồn tại dùng Is there, không dùng have.
        error_tag: have_for_there_is
      - answer: has
        feedback_vi: Trả lời câu Is there…? là Yes, there is, không dùng has.
        error_tag: have_for_there_is
    explanation:
      vi: Một bưu điện là số ít nên hỏi Is there…? Câu trả lời ngắn lặp lại is - Yes, there is.
    display_answer: Is there a post office on this street? - Yes, there is.

  # ---------------- recall ----------------
  - key: en:exercise:places-directions-review-fill-route
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 2
    item: en:item:on-your-left-right
    prompt:
      template: "Go straight {{b1}}, turn left {{b2}} the supermarket, and it's {{b3}} your right."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 2 }
        - { id: b3, width_hint: 2 }
    answer:
      blanks:
        b1: [on, ahead]
        b2: [at]
        b3: [on]
    known_wrong:
      - answer: to
        feedback_vi: Turn left không cần to; rẽ ở siêu thị dùng at.
        error_tag: turn_to
      - answer: in
        feedback_vi: Rẽ ở một điểm mốc dùng at; bên tay phải dùng on your right.
        error_tag: preposition_place
      - answer: straightly
        feedback_vi: Straight vừa là tính từ vừa là trạng từ, không thêm -ly. Đi thẳng là go straight on.
        error_tag: go_straight
    explanation:
      vi: Đi thẳng là go straight on (hoặc go straight ahead). Rẽ ở một điểm mốc dùng at the supermarket, và bên tay phải là on your right.
    display_answer: Go straight on, turn left at the supermarket, and it's on your right.

  - key: en:exercise:places-directions-review-translate-any-bank
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 2
    item: en:item:there-is-there-are
    prompt:
      source_text: Xin lỗi, gần đây có ngân hàng nào không?
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Excuse me, is there a bank near here?
        - Excuse me, is there a bank nearby?
        - Excuse me, is there a bank around here?
        - Excuse me, are there any banks near here?
        - Excuse me, are there any banks nearby?
        - Excuse me, is there any bank near here?
        - Excuse me, is there a bank close by?
        - Excuse me, are there any banks around here?
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: Excuse me, have a bank near here?
        feedback_vi: Không dịch "có" thành have. Hỏi sự tồn tại dùng is there - is there a bank near here?
        error_tag: have_for_there_is
      - answer: Excuse me, has a bank near here?
        feedback_vi: Không dịch "có" thành has. Hỏi sự tồn tại dùng is there.
        error_tag: have_for_there_is
      - answer: Excuse me, are there a bank near here?
        feedback_vi: A bank là số ít nên dùng is there.
        error_tag: there_be_agreement
      - answer: Excuse me, near here have a bank?
        feedback_vi: Không giữ trật tự câu tiếng Việt. Is there đứng đầu, near here ở cuối.
        error_tag: have_for_there_is
    explanation:
      vi: "\"Có… nào không?\" là câu hỏi về sự tồn tại - đảo is lên trước there: Is there a bank near here? Nếu hỏi nhiều ngân hàng thì Are there any banks…?"
    display_answer: Excuse me, is there a bank near here?

  - key: en:exercise:places-directions-review-translate-between
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 2
    item: en:item:between
    prompt:
      source_text: Thư viện ở giữa công viên và bến xe buýt.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - The library is between the park and the bus station.
        - The library is between the bus station and the park.
        - The library is between the park and the bus stop.
        - The library is between the bus stop and the park.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: The library is between the park with the bus station.
        feedback_vi: Between nối hai nơi bằng and, không dùng with.
        error_tag: between_and
      - answer: The library between the park and the bus station.
        feedback_vi: Thiếu is - The library is between…
        error_tag: missing_be
      - answer: The library is in the middle the park and the bus station.
        feedback_vi: Ở giữa hai nơi là between, không dùng in the middle.
        error_tag: preposition_place
      - answer: The library is between the park or the bus station.
        feedback_vi: Between A and B dùng and, không dùng or.
        error_tag: between_and
    explanation:
      vi: Chủ ngữ the library + is + between the park and the bus station. Between luôn nối hai nơi bằng and.
    display_answer: The library is between the park and the bus station.

