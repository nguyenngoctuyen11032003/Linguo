      fallback_text: What's the weather like in Da Lat? - It's cool and cloudy.
      options:
        - { id: t6b, text: "Thời tiết ở Đà Lạt thế nào? - Trời mát và nhiều mây.", lang: vi }
        - { id: a1k, text: "Thời tiết ở Đà Lạt thế nào? - Trời lạnh và có gió.", lang: vi }
        - { id: n8p, text: "Bạn có thích Đà Lạt không? - Có, trời mát.", lang: vi }
        - { id: e4s, text: "Thời tiết ở Đà Lạt thế nào? - Trời nóng và nắng.", lang: vi }
    answer:
