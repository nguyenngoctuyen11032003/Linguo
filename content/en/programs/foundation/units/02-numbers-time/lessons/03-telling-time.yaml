        b1: ["o'clock"]
    known_wrong:
      - answer: hours
        feedback_vi: Hours là số tiếng (khoảng thời gian). Giờ trên đồng hồ là o'clock.
        error_tag: hour_oclock
      - answer: hour
        feedback_vi: Giờ trên đồng hồ là o'clock, không phải hour.
        error_tag: hour_oclock
    explanation:
      vi: Đúng sáu giờ (6:00) là giờ chẵn, nên dùng o'clock - It's six o'clock.
    display_answer: "A: What time is it? B: It's six o'clock."

  - key: en:exercise:telling-time-order-ten-to
    type: word_bank
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:past-to
    prompt:
      instruction: "Sắp xếp thành câu: \"Bây giờ là chín giờ kém mười.\" (8:50)"
      tokens:
        - { id: t-nine, text: nine }
        - { id: t-past, text: past }
        - { id: t-ten, text: ten }
        - { id: t-its, text: "It's" }
        - { id: t-eight, text: eight }
        - { id: t-to, text: to }
        - { id: t-hours, text: hours }
    answer:
      orders:
        - [t-its, t-ten, t-to, t-nine]
    explanation:
      vi: Kém dịch là to, và phút đứng trước giờ - ten to nine. Giờ đi với to là giờ sắp tới (nine), không phải giờ hiện tại (eight).
    display_answer: "It's ten to nine."

