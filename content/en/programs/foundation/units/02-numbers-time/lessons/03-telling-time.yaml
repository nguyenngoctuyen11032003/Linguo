  - key: en:exercise:telling-time-fill-oclock-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 1
    item: en:item:oclock
    prompt:
      template: "A: What time is it? B: It's six {{b1}}."
      blanks:
        - { id: b1, width_hint: 7 }
      hint_levels:
        - "Nghĩa của câu: Mấy giờ rồi? - Sáu giờ."
        - "Gợi ý: từ chỉ giờ chẵn, viết có dấu nháy - o'c…"
    answer:
