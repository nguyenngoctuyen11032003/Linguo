  - key: en:exercise:telling-time-fill-past-to
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 3
    item: en:item:past-to
    prompt:
      template: "9:15 = It's quarter {{b1}} nine. · 4:40 = It's twenty {{b2}} five."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [past, after]
        b2: [to]
    known_wrong:
      - answer: before
        feedback_vi: Phút còn thiếu đến giờ sau dùng to - twenty to five.
        error_tag: past_to
      - answer: over
        feedback_vi: Phút đã qua dùng past - quarter past nine.
        error_tag: past_to
    explanation:
      vi: 9:15 là đã qua chín giờ 15 phút, nên dùng past (người Mỹ cũng nói after). 4:40 là còn 20 phút nữa đến năm giờ, nên dùng to và nói giờ sắp tới (five).
    display_answer: "9:15 = It's quarter past nine. · 4:40 = It's twenty to five."

  - key: en:exercise:telling-time-translate-seven
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 2
    item: en:item:oclock
    prompt:
      source_text: Bây giờ là bảy giờ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - "It's seven o'clock."
        - "It is seven o'clock."
        - "It's seven."
        - "It is seven."
        - "It's 7 o'clock."
        - "It is 7 o'clock."
        - "It's 7:00."
        - "It is 7:00."
        - "It's seven o'clock now."
        - "It is seven o'clock now."
        - "It's 7."
        - "It is 7."
        - "It's seven now."
        - "It is seven now."
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: "It's seven hours."
        feedback_vi: Seven hours là "bảy tiếng". Giờ trên đồng hồ là seven o'clock.
        error_tag: hour_oclock
      - answer: "It is seven hours."
        feedback_vi: Seven hours là "bảy tiếng". Giờ trên đồng hồ là seven o'clock.
        error_tag: hour_oclock
      - answer: "Now is seven o'clock."
        feedback_vi: Câu nói giờ bắt đầu bằng It's, không bắt đầu bằng Now is.
        error_tag: missing_it
      - answer: "Is seven o'clock."
        feedback_vi: Tiếng Anh cần chủ ngữ It - It's seven o'clock.
        error_tag: missing_it
    explanation:
      vi: Câu nói giờ luôn có chủ ngữ It (It's…), dù tiếng Việt không có từ tương ứng. Bảy giờ chẵn là seven o'clock hoặc chỉ seven.
    display_answer: "It's seven o'clock."

