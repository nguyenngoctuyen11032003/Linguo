    item: en:item:half-past
    prompt:
      stem: "\"It's half past seven.\" là mấy giờ?"
      stem_lang: vi
      options:
        - { id: r6t, text: "6:30", lang: en }
        - { id: g3m, text: "7:30", lang: en }
        - { id: n8v, text: "7:15", lang: en }
        - { id: x1c, text: "8:30", lang: en }
