  - key: en:exercise:telling-time-translate-half-six
    type: translate
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:digital-time
    prompt:
      source_text: Bây giờ là sáu giờ rưỡi.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - "It's half past six."
        - "It is half past six."
        - "It's six thirty."
        - "It is six thirty."
        - "It's 6:30."
        - "It is 6:30."
        - "It's half six."
        - "It's half past six now."
        - "It's six thirty now."
        - "It is half six."
        - "It is half past six now."
        - "It is six thirty now."
        - "It's 6:30 now."
        - "It is 6:30 now."
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: "It's six and a half."
        feedback_vi: Tiếng Anh không nói giờ bằng and a half. Dùng half past six hoặc six thirty.
        error_tag: half_past
      - answer: "It's six thirty o'clock."
        feedback_vi: O'clock chỉ đi với giờ chẵn - It's six thirty.
        error_tag: oclock_minutes
      - answer: "It's half past seven."
        feedback_vi: Half past tính từ giờ được nói - half past seven là 7:30. Sáu rưỡi là half past six.
        error_tag: half_past
      - answer: "It's six hours thirty."
        feedback_vi: Giờ trên đồng hồ không dùng hours - It's six thirty.
        error_tag: hour_oclock
    explanation:
      vi: Sáu giờ rưỡi có hai cách nói - six thirty (giờ + phút) hoặc half past six (đã qua sáu giờ nửa tiếng). Câu luôn bắt đầu bằng It's.
    display_answer: "It's half past six."
