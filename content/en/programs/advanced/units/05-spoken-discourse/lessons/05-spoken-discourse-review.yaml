title:
  vi: "Ôn tập: Bản ghi một podcast phỏng vấn & thư phản hồi"
objectives:
  - vi: Theo dõi một cuộc phỏng vấn podcast về du lịch bền vững và nhận ra chức năng của từng từ đánh dấu diễn ngôn.
  - vi: Kết hợp cụm khuyết thiếu, câu điều kiện không dùng if và đảo ngữ nhượng bộ trong lời nói liền mạch.
  - vi: Viết một thư phản hồi ngắn cho chương trình, vừa nhượng bộ vừa phản biện một cách tinh tế.
