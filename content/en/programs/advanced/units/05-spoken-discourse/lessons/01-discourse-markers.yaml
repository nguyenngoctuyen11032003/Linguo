title:
  vi: Mind you, then again… - từ đánh dấu diễn ngôn trong văn nói
objectives:
  - vi: Hiểu chức năng của các từ đánh dấu diễn ngôn trong hội thoại tự nhiên - thêm ý ngược, tự phản biện, quay lại chủ đề.
  - vi: Phân biệt mind you, then again, all the same, if anything theo hướng lập luận.
  - vi: Dùng as it happens, come to think of it, as I was saying để hội thoại trôi chảy như người bản ngữ.
  - vi: Nhận biết khi nào nên đổi sang từ nối trang trọng trong văn viết.
estimated_minutes: 25
skills: [speaking, listening, vocabulary]
prerequisites: [en:lesson:critical-reading-writing-review]
