title:
  vi: Strange as it may seem… - đảo ngữ nhượng bộ và nhấn mạnh
objectives:
  - vi: Dùng cấu trúc tính từ/trạng từ + as/though + S + V để nói "dù… đến mấy" một cách nhấn mạnh.
  - vi: Dùng Much as, Try as… might, However + tính từ để nhượng bộ trước khi phản đối hoặc kể thất bại.
  - vi: Dùng For all + danh từ và Even so để nối các ý nhượng bộ trong bài nói và bài viết.
  - vi: Tránh các lỗi thêm mạo từ, very hoặc although trong cấu trúc đảo.
estimated_minutes: 25
skills: [grammar, writing, speaking]
prerequisites: [en:lesson:spoken-discourse-conditionals]
