key: en:lesson:spoken-discourse-conditionals
order_index: 3
level: c1
title:
  vi: Were to, but for, supposing… - câu điều kiện không cần if
objectives:
  - vi: Dùng were to để nêu giả định xa hoặc nhạy cảm một cách dè dặt.
  - vi: Dùng but for + danh từ và otherwise để nói "nếu không có/nếu không thì".
  - vi: Phân biệt supposing, assuming, on condition that, in the event of theo mức độ chắc chắn và văn phong.
  - vi: Viết điều khoản và kịch bản rủi ro trong hợp đồng, kế hoạch dự án.
estimated_minutes: 25
skills: [grammar, writing, speaking]
prerequisites: [en:lesson:spoken-discourse-modality]
