title:
  vi: Bound to, may well, might as well - đo độ chắc chắn bằng cụm khuyết thiếu
objectives:
  - vi: Xếp được các cụm khuyết thiếu theo độ chắc chắn - be bound to, there's every chance, may well, be liable to, can't possibly.
  - vi: Phân biệt may well (rất có thể) với might as well (thôi thì cứ…).
  - vi: Dùng could hardly và can't possibly để từ chối hoặc phủ định lịch sự mà dứt khoát.
  - vi: Đưa ra dự đoán trong công việc mà không nghe quá chắc hoặc quá mơ hồ.
estimated_minutes: 25
skills: [grammar, speaking, writing]
prerequisites: [en:lesson:spoken-discourse-markers]
