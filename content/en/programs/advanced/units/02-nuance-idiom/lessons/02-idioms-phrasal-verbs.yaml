  - key: en:exercise:idiom-mcq-literal
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:literal-idiom-translation
    prompt:
      stem: "Bạn muốn nói với đồng nghiệp người Anh rằng nhắc nhở anh Nam bao nhiêu lần cũng như \"nước đổ đầu vịt\". Câu nào tự nhiên nhất?"
      stem_lang: vi
      options:
        - { id: s6q, text: "Reminding Nam is pointless - it's like water off a duck's back.", lang: en }
        - { id: f2w, text: "Reminding Nam is like pouring water on a duck's head.", lang: en }
        - { id: h9e, text: "Reminding Nam is a blessing in disguise.", lang: en }
        - { id: u3r, text: "Reminding Nam is the elephant in the room.", lang: en }
    answer:
      correct_option_id: s6q
    explanation:
      vi: Tiếng Anh có thành ngữ gần giống - like water off a duck's back (nói gì cũng chẳng ảnh hưởng). Dịch sát chữ "pouring water on a duck's head" khiến người nghe khó hiểu; hai thành ngữ còn lại sai nghĩa.
    display_answer: "Reminding Nam is pointless - it's like water off a duck's back."

  - key: en:exercise:idiom-mcq-register
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:idiom-register
    prompt:
      stem: "Câu nào phù hợp nhất cho kết luận của một báo cáo gửi hội đồng quản trị?"
      stem_lang: vi
      options:
        - { id: k8z, text: "The supplier appears to have compromised on quality in order to reduce costs.", lang: en }
        - { id: d4x, text: "The supplier cut corners big time to save a few bucks.", lang: en }
        - { id: p1c, text: "The supplier beat around the bush and cut corners, which was a blessing in disguise.", lang: en }
        - { id: g5v, text: "The supplier was on the fence about quality, so they cut the corners.", lang: en }
    answer:
      correct_option_id: k8z
    explanation:
      vi: Báo cáo trang trọng nên nói thẳng nghĩa và rào đón (appears to, compromised on quality). Big time, a few bucks quá thân mật; câu nhồi nhiều thành ngữ sáo rỗng và sai nghĩa; cut the corners sai dạng thành ngữ.
    display_answer: "The supplier appears to have compromised on quality in order to reduce costs."

  - key: en:exercise:idiom-order-carry-off
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:carry-off
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Đó là một vai diễn khó, nhưng cô ấy đã thể hiện thành công một cách xuất sắc.\""
      tokens:
        - { id: c-off, text: off }
        - { id: c-difficult, text: a difficult role }
        - { id: c-she, text: she }
        - { id: c-it, text: it }
        - { id: c-but, text: but }
        - { id: c-was, text: It was }
        - { id: c-carried, text: carried }
        - { id: c-brilliantly, text: brilliantly }
        - { id: c-into, text: into }
    answer:
      orders:
        - [c-was, c-difficult, c-but, c-she, c-carried, c-it, c-off, c-brilliantly]
        - [c-was, c-difficult, c-but, c-she, c-brilliantly, c-carried, c-it, c-off]
    explanation:
      vi: Carry it off là "làm thành công một việc khó"; đại từ it đặt giữa carried và off. Trạng từ brilliantly đứng cuối hoặc ngay trước carried đều tự nhiên. Đừng nhầm với carry out (thực hiện kế hoạch, nghiên cứu) hay carry on (tiếp tục).
    display_answer: It was a difficult role, but she carried it off brilliantly.

