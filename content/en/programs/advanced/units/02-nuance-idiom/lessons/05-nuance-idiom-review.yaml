  - key: en:exercise:nuance-review-mcq-correct
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:economic-economical
    prompt:
      stem: "Câu nào trong bài xã luận của một sinh viên KHÔNG cần sửa?"
      stem_lang: vi
      options:
        - { id: b5x, text: "The economic slowdown has forced many families to find more economical ways to travel.", lang: en }
        - { id: n2y, text: "The economical slowdown has forced many families to find more economic ways to travel.", lang: en }
        - { id: e9z, text: "The economic slowdown has effected many families, who now travel more economic.", lang: en }
        - { id: s4q, text: "The economic slowdown has had a big affect on how many families travel.", lang: en }
    answer:
      correct_option_id: b5x
    explanation:
      vi: Economic slowdown (suy thoái kinh tế) và more economical ways (cách tiết kiệm hơn) đều đúng. Các câu khác đảo economic/economical, dùng effected thay cho affected, hoặc affect thay cho danh từ effect.
    display_answer: "The economic slowdown has forced many families to find more economical ways to travel."
