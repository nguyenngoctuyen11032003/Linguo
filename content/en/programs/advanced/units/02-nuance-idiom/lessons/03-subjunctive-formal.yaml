      tokens:
        - { id: s-funding, text: further funding }
        - { id: s-recommended, text: The committee recommended }
        - { id: s-being, text: being }
        - { id: s-be, text: be }
        - { id: s-project, text: the project }
        - { id: s-until, text: until }
        - { id: s-that, text: that }
        - { id: s-secured, text: is secured }
        - { id: s-postponed, text: postponed }
