    known_wrong:
      - answer: It is vital that every employee to be trained before using the new system.
        feedback_vi: Sau that cần mệnh đề có động từ - every employee be trained, không có to.
        error_tag: verb_pattern
      - answer: It is vital that every employee was trained before using the new system.
        feedback_vi: Was là quá khứ; yêu cầu cho tương lai dùng be trained.
        error_tag: subjunctive
    explanation:
      vi: It is vital that + S + be + V3 là giả định cách bị động, rất hợp văn bản quy định. Should be trained (Anh Anh) cũng đúng; is/are trained chấp nhận được nhưng kém trang trọng hơn.
    display_answer: It is vital that every employee be trained before using the new system.

  - key: en:exercise:subjunctive-mcq-be-that-as-it-may
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:be-that-as-it-may
    prompt:
      stem: "Trong cuộc họp hội đồng, một thành viên nói: \"The renovation will be costly.\" Bạn muốn thừa nhận ý đó nhưng vẫn ủng hộ dự án một cách trang trọng. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: j3h, text: "Be that as it may, the building will not pass the next safety inspection without it.", lang: en }
        - { id: w9g, text: "Whatever, the building won't pass the next safety check without it.", lang: en }
        - { id: r5f, text: "Be it as it is, the building will not pass the next safety inspection without it.", lang: en }
        - { id: e2d, text: "Come what may, the renovation will be costly.", lang: en }
    answer:
      correct_option_id: j3h
    explanation:
      vi: Be that as it may là cách trang trọng để nói "dù vậy" rồi đưa ra lập luận ngược lại. Whatever thô lỗ; Be it as it is sai dạng cụm cố định; Come what may không có nghĩa thừa nhận - phản bác.
    display_answer: "Be that as it may, the building will not pass the next safety inspection without it."

  - key: en:exercise:subjunctive-fill-if-need-be
    type: fill_blank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:if-need-be
    prompt:
      template: "We can work through the weekend if need {{b1}}. Were it not {{b2}} the tight deadline, we would hire extra staff."
      blanks:
        - { id: b1, width_hint: 2 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [be]
        b2: [for]
    known_wrong:
      - answer: is
        feedback_vi: If need be là cụm cố định giữ dạng giả định be.
        error_tag: subjunctive
      - answer: because
        feedback_vi: Cấu trúc cố định là Were it not for + danh từ.
        error_tag: inversion
      - answer: about
        feedback_vi: Cấu trúc cố định là Were it not for + danh từ.
        error_tag: inversion
    explanation:
      vi: If need be = if necessary (nếu cần). Were it not for the tight deadline = If it were not for… - nói về hiện tại nên vế sau là would hire.
    display_answer: We can work through the weekend if need be. Were it not for the tight deadline, we would hire extra staff.
