  - key: en:exercise:ellipsis-order-auxiliary
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:ellipsis-auxiliary
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Cô ấy hứa sẽ hoàn thành dự án trước hạn, và cô ấy đã làm được.\""
      tokens:
        - { id: e-did, text: did }
        - { id: e-before, text: before the deadline }
        - { id: e-she2, text: she }
        - { id: e-promised, text: She promised }
        - { id: e-finishing, text: finishing }
        - { id: e-and, text: and }
        - { id: e-finish, text: to finish }
        - { id: e-project, text: the project }
    answer:
      orders:
        - [e-promised, e-finish, e-project, e-before, e-and, e-she2, e-did]
        - [e-promised, e-finish, e-project, e-before, e-and, e-did]
    explanation:
      vi: Vế sau chỉ cần trợ động từ did, thay cho finished the project before the deadline - đó là tỉnh lược. Promise + to V nên dùng to finish; finishing không hợp sau promised. Bỏ she ở vế sau (…, and did) cũng đúng.
    display_answer: She promised to finish the project before the deadline, and she did.

  - key: en:exercise:ellipsis-mcq-irony
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:understatement
    prompt:
      stem: "Đồng nghiệp hỏi về khách sạn bạn vừa ở: phòng nhỏ, ồn, giá rất cao. Bạn muốn chê một cách hóm hỉnh, lịch sự. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: m7c, text: "Let's just say it wasn't exactly good value for money.", lang: en }
        - { id: r2b, text: "It was not bad at all - great value for money.", lang: en }
        - { id: s9n, text: "It was the worst, most terrible hotel ever!!!", lang: en }
        - { id: k5u, text: "It was hardly expensive and really quiet.", lang: en }
    answer:
      correct_option_id: m7c
    explanation:
      vi: Wasn't exactly good value là lối nói giảm - người nghe hiểu là "rất không đáng tiền" nhưng câu vẫn lịch sự. Not bad at all là khen; câu cảm thán thô và quá lời; hardly expensive nghĩa là "rẻ", ngược ý.
    display_answer: "Let's just say it wasn't exactly good value for money."

