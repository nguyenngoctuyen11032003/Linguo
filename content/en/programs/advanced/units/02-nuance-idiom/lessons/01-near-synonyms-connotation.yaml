body:
  - type: objective
    text:
      vi: Ở trình độ C2, chọn đúng nghĩa thôi chưa đủ - bạn cần chọn đúng sắc thái. Sau bài này, bạn biết vì sao "She's slim" là khen còn "She's skinny" có thể làm người nghe phật lòng.
  - type: explain
    text:
      vi: Nhiều từ tiếng Anh có cùng nghĩa từ điển (denotation) nhưng khác sắc thái (connotation). Determined và stubborn đều là "không chịu bỏ cuộc", nhưng một từ khen, một từ chê. Tiếng Việt cũng vậy - "kiên định" và "cố chấp", "tiết kiệm" và "keo kiệt".
  - type: explain
    text:
      vi: Khi viết trang trọng hoặc nói về người khác, hãy ưu tiên từ trung tính hoặc tích cực - inexpensive thay cho cheap, slim thay cho skinny. Chỉ dùng từ mang sắc thái chê khi bạn thực sự muốn phê phán.
  - type: explain
    text:
      vi: Có những cặp không khác sắc thái mà khác hẳn nghĩa, chỉ giống mặt chữ - economic (thuộc kinh tế) và economical (tiết kiệm), affect (động từ) và effect (danh từ), sensible (hợp lý) và sensitive (nhạy cảm). Người Việt hay nhầm vì dịch theo từ Hán Việt "kinh tế".
  - type: deep_explain
    text:
      vi: Một mẹo phân tích - đặt từ vào thang từ "khen" đến "chê" - slender, slim → thin → skinny, scrawny, bony. Với tiền bạc - thrifty, frugal → economical → tight, stingy, mean. Người viết C2 dùng thang này có chủ ý, ví dụ một bài phê bình có thể gọi cùng một chính sách là "bold" hoặc "reckless".
  - type: example
    target: She is determined to get the scholarship, and she studies every evening.
    target_lang: en
    translation:
      vi: Cô ấy quyết tâm giành học bổng nên tối nào cũng học.
    note:
      vi: Determined - người nói đánh giá tích cực sự kiên trì.
  - type: example
    target: He is too stubborn to listen to anyone else's advice.
    target_lang: en
    translation:
      vi: Anh ta quá cứng đầu, chẳng chịu nghe lời khuyên của ai.
    note:
      vi: Stubborn - cùng sự kiên trì, nhưng người nói phê phán.
  - type: example
    target: We are looking for an inexpensive venue that can hold 200 guests.
    target_lang: en
    translation:
      vi: Chúng tôi đang tìm một địa điểm giá phải chăng, chứa được 200 khách.
    note:
      vi: Inexpensive lịch sự hơn cheap trong email công việc; cheap venue nghe như "chỗ rẻ tiền".
  - type: example
    target: Buying a hybrid car is more economical in the long run.
    target_lang: en
    translation:
      vi: Về lâu dài, mua xe hybrid tiết kiệm hơn.
    note:
      vi: Economical = tiết kiệm chi phí; economic chỉ dùng cho những gì liên quan đến nền kinh tế.
  - type: example
    target: The storm affected thousands of homes, but its effect on tourism was limited.
    target_lang: en
    translation:
      vi: Cơn bão ảnh hưởng đến hàng nghìn ngôi nhà, nhưng tác động của nó lên du lịch không lớn.
    note:
      vi: Affected là động từ; effect là danh từ, đi với on.
  - type: common_mistake
    wrong: I want to buy an economic car to save money.
    right: I want to buy an economical car to save money.
    target_lang: en
    note:
      vi: “Xe tiết kiệm” là economical; economic chỉ nghĩa "thuộc về kinh tế" (economic policy).
  - type: common_mistake
    wrong: The new policy will effect on many families.
    right: The new policy will affect many families.
    target_lang: en
    note:
      vi: Affect là động từ và đi thẳng với tân ngữ, không có on. Nếu muốn dùng on, đổi sang have an effect on.
  - type: common_mistake
    wrong: You look so skinny! Have you been to the gym?
    right: You look so slim! Have you been going to the gym?
    target_lang: en
    note:
      vi: Muốn khen ngoại hình thì dùng slim; skinny dễ bị hiểu là "gầy nhom, ốm yếu".
  - type: common_mistake
    wrong: That's a very sensible question, so let's discuss it privately.
    right: That's a very sensitive question, so let's discuss it privately.
    target_lang: en
    note:
      vi: “Nhạy cảm” là sensitive; sensible nghĩa là "hợp lý, biết điều".
  - type: summary
    points:
      - vi: Connotation là sắc thái khen/chê/trung tính đi kèm từ; chọn từ là chọn thái độ.
      - vi: Khen - slim, determined, frugal, childlike, renowned, assertive. Chê - skinny, stubborn, stingy, childish, notorious, pushy.
      - vi: Văn trang trọng - inexpensive/affordable thay cho cheap.
      - vi: economic (kinh tế) ≠ economical (tiết kiệm); affect (động từ) ≠ effect (danh từ, have an effect on).
      - vi: sensible = hợp lý; sensitive = nhạy cảm.
exercises:
  # ---------------- recognition ----------------
  - key: en:exercise:connotation-mcq-compliment
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:thin-slim-skinny
    prompt:
      stem: "Bạn muốn khen một đồng nghiệp vừa giảm cân. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: p3k, text: "You look really slim these days!", lang: en }
        - { id: z8q, text: "You look really skinny these days!", lang: en }
        - { id: m1v, text: "You look really bony these days!", lang: en }
        - { id: t6w, text: "You look really scrawny these days!", lang: en }
    answer:
      correct_option_id: p3k
    explanation:
      vi: Slim mang sắc thái tích cực (thon thả). Skinny, bony, scrawny đều gợi "gầy nhom, trơ xương", nghe như chê sức khoẻ của người đó.
    display_answer: "You look really slim these days!"

  - key: en:exercise:connotation-mcq-negative
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:stubborn-determined
    prompt:
      stem: "Từ nào thể hiện người nói CHÊ một người không chịu thay đổi ý kiến?"
      stem_lang: vi
      options:
        - { id: h2r, text: stubborn, lang: en }
        - { id: c9d, text: determined, lang: en }
        - { id: y4n, text: persistent, lang: en }
        - { id: k7s, text: resolute, lang: en }
    answer:
      correct_option_id: h2r
    explanation:
      vi: Stubborn là "cứng đầu, bướng bỉnh" - chê. Determined, persistent, resolute đều khen sự kiên trì, quyết tâm.
    display_answer: stubborn

  - key: en:exercise:connotation-listen-notorious
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: en:item:renowned-notorious
    prompt:
      audio_asset_id: null
      fallback_text: This stretch of road is notorious for traffic jams during the rainy season.
      options:
        - { id: f5b, text: Đoạn đường này khét tiếng hay kẹt xe vào mùa mưa., lang: vi }
        - { id: w2j, text: Đoạn đường này nổi tiếng đẹp vào mùa mưa., lang: vi }
        - { id: e8u, text: Đoạn đường này hiếm khi kẹt xe vào mùa mưa., lang: vi }
        - { id: g1x, text: Đoạn đường này mới được sửa trước mùa mưa., lang: vi }
    answer:
      correct_option_id: f5b
    explanation:
      vi: Notorious for là "khét tiếng vì" một điều xấu - ở đây là kẹt xe. Nếu muốn khen, người nói sẽ dùng renowned for hoặc famous for.
    display_answer: Đoạn đường này khét tiếng hay kẹt xe vào mùa mưa.

  - key: en:exercise:connotation-fill-affect-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:affect-effect
    prompt:
      template: "Lack of sleep can {{b1}} your concentration, and it can have a serious {{b2}} on your mood."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 6 }
      hint_levels:
        - "Nghĩa: Thiếu ngủ có thể ảnh hưởng đến khả năng tập trung, và có thể gây tác động nghiêm trọng đến tâm trạng."
        - "Gợi ý: ô 1 là động từ (a…), ô 2 là danh từ đứng sau a serious (e…)."
    answer:
      blanks:
        b1: [affect, impair, harm, hurt, damage, undermine, reduce, hinder, hamper, weaken, diminish, disrupt, impact, limit]
        b2: [effect, impact, influence]
    known_wrong:
      - answer: effects
        feedback_vi: Effect(s) là danh từ - ô sau can cần động từ affect, còn sau a serious cần danh từ số ít effect.
        error_tag: affect_effect
      - answer: affection
        feedback_vi: Affection là "tình cảm, sự trìu mến", không phải "tác động".
        error_tag: affect_effect
    explanation:
      vi: Sau can cần động từ - affect (ảnh hưởng đến). Sau a serious cần danh từ - effect (tác động). Hai từ đọc gần giống nhau nên phải dựa vào vị trí trong câu.
    display_answer: Lack of sleep can affect your concentration, and it can have a serious effect on your mood.

  # ---------------- recall ----------------
  - key: en:exercise:connotation-fill-economical
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 4
    item: en:item:economic-economical
    prompt:
      template: "During the {{b1}} downturn (suy thoái kinh tế), many families switched to more {{b2}} ways (tiết kiệm chi phí hơn) of heating their homes."
      blanks:
        - { id: b1, width_hint: 10 }
        - { id: b2, width_hint: 10 }
    answer:
      blanks:
        b1: [economic, financial]
        b2: [economical, cost-effective, affordable, inexpensive]
    known_wrong:
      - answer: economy
        feedback_vi: Economy là danh từ; trước downturn cần tính từ economic (economic downturn).
        error_tag: word_form
      - answer: economics
        feedback_vi: Economics là môn kinh tế học, không đứng trước danh từ để nói "thuộc về kinh tế".
        error_tag: word_form
      - answer: cheap
        feedback_vi: More cheap sai dạng so sánh (cheaper), và cheap dễ gợi "rẻ tiền"; ý "tiết kiệm chi phí" là economical.
        error_tag: economic_economical
    explanation:
      vi: Economic downturn là "suy thoái kinh tế" - liên quan đến nền kinh tế. More economical ways là "cách tiết kiệm hơn" - liên quan đến chi tiêu ít. Người Việt hay đảo hai từ này vì cùng dịch là "kinh tế".
    display_answer: During the economic downturn, many families switched to more economical ways of heating their homes.

  - key: en:exercise:connotation-fill-sensible
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 3
    item: en:item:sensible-sensitive
    prompt:
      template: "Bringing an umbrella was a {{b1}} decision, but please avoid {{b2}} topics like politics at dinner."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 9 }
    answer:
      blanks:
        b1: [sensible, wise, smart, prudent, practical, reasonable, sound, good, right, clever, rational, shrewd]
        b2: [sensitive, controversial, delicate, contentious, divisive, touchy, difficult, tricky, awkward, heated, taboo]
    known_wrong:
      - answer: sensational
        feedback_vi: Sensational là "giật gân" hoặc "tuyệt vời", không phải "hợp lý" hay "nhạy cảm".
        error_tag: sensible_sensitive
    explanation:
      vi: Mang ô là quyết định hợp lý - sensible. Chính trị là chủ đề nhạy cảm - sensitive. Sensible là "false friend" vì trông giống "nhạy cảm".
    display_answer: Bringing an umbrella was a sensible decision, but please avoid sensitive topics like politics at dinner.

  - key: en:exercise:connotation-translate-frugal
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 4
    item: en:item:frugal-stingy
    prompt:
