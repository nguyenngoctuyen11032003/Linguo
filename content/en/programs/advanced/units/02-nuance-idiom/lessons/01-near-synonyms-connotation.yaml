    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: My grandmother is very stingy, but she is never frugal with her neighbours.
        feedback_vi: Bạn đảo hai từ - tằn tiện (khen) là frugal, keo kiệt (chê) là stingy.
        error_tag: connotation
      - answer: My grandmother is very cheap, but she is never stingy with her neighbours.
        feedback_vi: Nói người là cheap nghĩa là "keo kiệt", trùng với stingy; "tằn tiện" mang ý khen nên dùng frugal hoặc thrifty.
        error_tag: connotation
      - answer: My grandmother is very economic, but she is never stingy with her neighbours.
        feedback_vi: Economic là "thuộc về kinh tế"; người tằn tiện là frugal hoặc thrifty.
        error_tag: economic_economical
    explanation:
      vi: “Tằn tiện” là khen sự biết tiết kiệm - frugal/thrifty; “keo kiệt” là chê - stingy/mean. Câu đối lập hai sắc thái này bằng but.
    display_answer: My grandmother is very frugal, but she is never stingy with her neighbours.

