    explanation:
      vi: Childlike mang sắc thái tích cực - hồn nhiên, trong sáng. Despite his age dịch tự nhiên là "dù đã lớn tuổi".
    display_answer: Dù đã lớn tuổi, ông ấy vẫn có sự tò mò hồn nhiên như trẻ thơ về mọi thứ.

  # ---------------- application ----------------
  - key: en:exercise:connotation-mcq-ad-copy
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:cheap-inexpensive
    prompt:
      stem: "Bạn viết quảng cáo cho một khách sạn bình dân nhưng sạch đẹp. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: v3a, text: "Comfortable rooms at affordable prices, right in the city centre.", lang: en }
        - { id: n9c, text: "Cheap rooms at cheap prices, right in the city centre.", lang: en }
        - { id: d6e, text: "Stingy prices for basic rooms, right in the city centre.", lang: en }
        - { id: q2m, text: "Economic rooms at economic prices, right in the city centre.", lang: en }
    answer:
      correct_option_id: v3a
    explanation:
      vi: Affordable nghe tích cực ("vừa túi tiền") nên hợp với quảng cáo. Cheap dễ gợi "rẻ tiền, kém chất lượng"; stingy chỉ dùng cho người keo kiệt; economic là "thuộc về kinh tế".
    display_answer: "Comfortable rooms at affordable prices, right in the city centre."

  - key: en:exercise:connotation-order-affect
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:affect-effect
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Giá nhiên liệu tăng đã có tác động nghiêm trọng đến các hãng hàng không giá rẻ.\""
      tokens:
