    known_wrong:
      - answer: Dù đã lớn tuổi, ông ấy vẫn trẻ con và thiếu chín chắn về mọi thứ.
        feedback_vi: Childlike là khen (hồn nhiên); "trẻ con, thiếu chín chắn" là nghĩa của childish.
