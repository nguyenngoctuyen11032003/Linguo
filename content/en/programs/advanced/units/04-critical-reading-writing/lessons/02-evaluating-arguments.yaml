  - vi: Gọi tên sáu ngụy biện phổ biến - straw man, ad hominem, false dilemma, slippery slope, hasty generalisation, nhầm tương quan với nhân quả.
  - vi: Nhận xét lập luận bằng tiếng Anh lịch sự - It does not necessarily follow that…, The evidence is largely anecdotal….
