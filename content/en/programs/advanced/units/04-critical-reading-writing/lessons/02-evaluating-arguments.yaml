body:
  - type: objective
    text:
      vi: Đọc phản biện nghĩa là không tin ngay - hỏi nguồn có đáng tin không, bằng chứng có đủ không, kết luận có thật sự suy ra từ bằng chứng không. Sau bài này, bạn nhận ra những lỗ hổng lập luận thường gặp trong báo chí, quảng cáo, mạng xã hội và gọi tên chúng bằng tiếng Anh.
  - type: explain
    text:
      vi: Đánh giá nguồn bằng bốn câu hỏi - Ai viết? Viết khi nào? Ai tài trợ? Đã qua bình duyệt (peer-reviewed) chưa? Nguồn tốt là a credible / reliable source; nguồn bị lợi ích chi phối là biased. Vài câu chuyện cá nhân chỉ là anecdotal evidence - bằng chứng giai thoại, không đủ để khái quát.
  - type: explain
    text:
      vi: Sáu ngụy biện (fallacies) phổ biến - straw man (bóp méo ý đối phương rồi bác bỏ bản méo), ad hominem (công kích con người thay vì lập luận), false dilemma (chỉ đưa hai lựa chọn cực đoan), slippery slope (một bước nhỏ ắt dẫn tới thảm họa), hasty generalisation (khái quát từ vài trường hợp), và nhầm tương quan với nhân quả - correlation does not imply causation.
  - type: explain
    text:
      vi: Nhận xét lập luận một cách lịch sự, nhắm vào lập luận chứ không vào người - It does not necessarily follow that… (không nhất thiết suy ra…), The argument rests on the assumption that… (lập luận dựa trên giả định…), The evidence is largely anecdotal, This is a classic straw man.
  - type: deep_explain
    text:
      vi: Lỗi từ loại hay gặp - bias là danh từ/động từ, tính từ là biased (the article is biased); necessary là tính từ, cụm phản biện cần trạng từ necessarily; anecdote là danh từ, anecdotal là tính từ. Evidence không đếm được - little / much evidence, a piece of evidence, không nói many evidences. Khi gọi tên ngụy biện, nói That's a straw man hoặc That's an ad hominem attack, không nói "a fallacy of straw man".
  - type: example
    target: "\"My opponent wants to cut the military budget. Clearly, he wants to leave the country defenceless.\" - This is a straw man: nobody proposed abolishing the army."
    target_lang: en
    translation:
      vi: "\"Đối thủ của tôi muốn cắt ngân sách quân sự. Rõ ràng ông ta muốn bỏ mặc đất nước không có gì phòng thủ.\" - Đây là ngụy biện người rơm: không ai đề xuất giải tán quân đội."
    note:
      vi: Straw man thổi phồng đề xuất "cắt giảm" thành "bỏ mặc", rồi tấn công phiên bản cực đoan đó.
  - type: example
    target: "\"Either we ban cars from the city centre completely, or we accept that our children will breathe toxic air.\" - a false dilemma, since there are many options in between."
    target_lang: en
    translation:
      vi: "\"Hoặc cấm hoàn toàn ô tô vào trung tâm, hoặc chấp nhận để con cái chúng ta hít không khí độc hại.\" - một lưỡng nan giả, vì còn rất nhiều phương án ở giữa."
    note:
      vi: Dấu hiệu Either… or… với hai cực đoan; các phương án như thu phí, giới hạn giờ bị lờ đi.
  - type: example
    target: Crime has fallen since the cameras were installed, but it does not necessarily follow that the cameras caused the fall.
    target_lang: en
    translation:
      vi: Tội phạm đã giảm từ khi lắp camera, nhưng không nhất thiết vì thế mà camera là nguyên nhân.
    note:
      vi: Hai sự việc xảy ra cùng lúc chưa chứng minh được nhân quả - có thể còn yếu tố khác.
  - type: example
    target: The study is not peer-reviewed, it was funded by a sugar company, and its evidence is largely anecdotal. It is hardly a credible source.
    target_lang: en
    translation:
      vi: Nghiên cứu chưa qua bình duyệt, được một công ty đường tài trợ, và bằng chứng phần lớn mang tính giai thoại. Khó có thể coi là một nguồn đáng tin cậy.
    note:
      vi: Ba câu hỏi đánh giá nguồn trong một đoạn - bình duyệt, nguồn tài trợ, chất lượng bằng chứng.
  - type: common_mistake
    wrong: The newspaper is very bias, so I don't trust it.
    right: The newspaper is heavily biased, so I don't trust it.
    target_lang: en
    note:
      vi: Sau be cần tính từ biased; bias là danh từ (a bias towards the government). Biased thường đi với heavily / clearly / slightly.
  - type: common_mistake
    wrong: The author gives many evidences for his claim.
    right: The author gives a lot of evidence for his claim.
    target_lang: en
    note:
      vi: Evidence không đếm được - a lot of / much / little evidence, a piece of evidence.
  - type: common_mistake
    wrong: Sales rose after the advert, but it doesn't necessary follow that the advert worked.
    right: Sales rose after the advert, but it doesn't necessarily follow that the advert worked.
    target_lang: en
    note:
      vi: Bổ nghĩa cho động từ follow cần trạng từ necessarily, không phải tính từ necessary.
  - type: summary
    points:
      - vi: Đánh giá nguồn - ai viết, khi nào, ai tài trợ, peer-reviewed chưa; credible / reliable ↔ biased.
      - vi: Anecdotal evidence - vài câu chuyện cá nhân, không đủ để khái quát; evidence không đếm được.
      - vi: Ngụy biện - straw man, ad hominem, false dilemma, slippery slope, hasty generalisation; correlation does not imply causation.
      - vi: Phản biện lịch sự - It does not necessarily follow that…; The argument rests on the assumption that….
      - vi: Từ loại - biased (tính từ), necessarily (trạng từ), anecdotal (tính từ).
exercises:
  # ---------------- recognition ----------------
  - key: en:exercise:crw-eval-mcq-straw-man
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-straw-man
    prompt:
      stem: "\"My opponent wants to cut the military budget. Clearly, he wants to leave the country defenceless.\" Đây là kiểu ngụy biện nào?"
      stem_lang: vi
      options:
        - { id: s3m, text: "a straw man", lang: en }
        - { id: a7h, text: "an ad hominem attack", lang: en }
        - { id: d1f, text: "a false dilemma", lang: en }
        - { id: l5p, text: "a slippery slope", lang: en }
    answer:
      correct_option_id: s3m
    explanation:
      vi: Người nói bóp méo đề xuất "cắt ngân sách" thành "bỏ mặc đất nước" rồi tấn công phiên bản méo đó - ngụy biện người rơm. Không có công kích cá nhân, không có hai lựa chọn cực đoan, cũng không có chuỗi hệ quả.
    display_answer: "a straw man"

  - key: en:exercise:crw-eval-listen-false-dilemma
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: en:item:crw-false-dilemma
    prompt:
      audio_asset_id: null
      fallback_text: "Either we ban cars from the city centre completely, or we accept that our children will breathe toxic air."
      options:
        - { id: x6b, text: "Người nói chỉ đưa ra hai lựa chọn cực đoan và bỏ qua mọi phương án ở giữa.", lang: vi }
        - { id: e2n, text: "Người nói đưa ra số liệu đo chất lượng không khí ở trung tâm.", lang: vi }
        - { id: i8c, text: "Người nói công kích cá nhân những người lái ô tô.", lang: vi }
        - { id: o4w, text: "Người nói đề xuất thu phí ô tô vào trung tâm vào giờ cao điểm.", lang: vi }
    answer:
      correct_option_id: x6b
    explanation:
      vi: Either… or… với hai cực đoan (cấm hoàn toàn hoặc chấp nhận không khí độc) là dấu hiệu của false dilemma. Câu nói không có số liệu, không nhắm vào người lái xe và không nêu phương án thu phí.
    display_answer: "Người nói chỉ đưa ra hai lựa chọn cực đoan và bỏ qua mọi phương án ở giữa."

  - key: en:exercise:crw-eval-fill-source-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-peer-reviewed
    prompt:
      template: "The study was never {{b1}}-reviewed, and the author's evidence is largely {{b2}} - just a few stories from friends and neighbours."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 10 }
      hint_levels:
        - "Nghĩa: Nghiên cứu chưa bao giờ được bình duyệt, và bằng chứng của tác giả phần lớn mang tính giai thoại - chỉ là vài câu chuyện của bạn bè và hàng xóm."
        - "Gợi ý: ô 1 là \"người cùng ngành\" (p…); ô 2 là tính từ của anecdote."
    answer:
      blanks:
        b1: [peer]
        b2: [anecdotal]
    known_wrong:
      - answer: pair
        feedback_vi: Pair là "cặp"; người cùng ngành là peer - peer-reviewed.
        error_tag: spelling
      - answer: anecdote
        feedback_vi: Sau is largely cần tính từ - anecdotal; anecdote là danh từ.
        error_tag: word_form
    explanation:
      vi: Peer-reviewed = đã qua bình duyệt của các chuyên gia cùng ngành. Anecdotal evidence = bằng chứng dựa trên chuyện cá nhân.
    display_answer: The study was never peer-reviewed, and the author's evidence is largely anecdotal - just a few stories from friends and neighbours.

  - key: en:exercise:crw-eval-mcq-error-free
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-biased
    prompt:
      stem: Câu nào KHÔNG có lỗi?
      stem_lang: vi
      options:
        - { id: b6r, text: "The report is clearly biased: it was funded by the company whose product it praises.", lang: en }
        - { id: t2k, text: "The report is clearly bias: it was funded by the company whose product it praises.", lang: en }
        - { id: g9v, text: "The report gives many evidences that the product is safe.", lang: en }
        - { id: m3z, text: "The report proves the product is safe, but it doesn't necessary follow that it works.", lang: en }
    answer:
      correct_option_id: b6r
    explanation:
      vi: Biased là tính từ đúng sau is. Bias là danh từ; evidence không đếm được nên không có evidences; cụm phản biện cần trạng từ necessarily.
    display_answer: "The report is clearly biased: it was funded by the company whose product it praises."

  # ---------------- recall ----------------
  - key: en:exercise:crw-eval-fill-causation
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 4
    item: en:item:crw-correlation-causation
    prompt:
      template: "Umbrella sales and colds both rise in winter, but it does not {{b1}} follow that umbrellas cause colds. Correlation does not {{b2}} causation. Attacking the researcher's age instead of her data is an {{b3}} hominem argument."
      blanks:
        - { id: b1, width_hint: 11 }
        - { id: b2, width_hint: 5 }
        - { id: b3, width_hint: 2 }
    answer:
      blanks:
        b1: [necessarily]
        b2: [imply, mean, prove, equal, establish, entail]
        b3: [ad]
    known_wrong:
      - answer: necessary
        feedback_vi: Bổ nghĩa cho động từ follow cần trạng từ - necessarily.
        error_tag: word_form
      - answer: implies
        feedback_vi: Sau does not dùng động từ nguyên mẫu - does not imply.
        error_tag: verb_form
    explanation:
      vi: It does not necessarily follow that… = không nhất thiết suy ra…. Correlation does not imply causation = tương quan không có nghĩa là nhân quả. Ad hominem = công kích cá nhân.
    display_answer: Umbrella sales and colds both rise in winter, but it does not necessarily follow that umbrellas cause colds. Correlation does not imply causation. Attacking the researcher's age instead of her data is an ad hominem argument.

