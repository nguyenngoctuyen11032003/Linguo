  - key: en:exercise:crw-eval-mcq-respond-anecdote
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-anecdotal-evidence
    prompt:
      stem: "Một người bạn nói: \"My grandfather smoked every day and lived to 95, so smoking can't be that harmful.\" Câu phản hồi nào chỉ ra lỗ hổng lập luận mà không mắc ngụy biện?"
      stem_lang: vi
      options:
        - { id: k7a, text: "That's anecdotal evidence - one case can't outweigh decades of large-scale studies.", lang: en }
        - { id: w3e, text: "You're just too stupid to understand science.", lang: en }
        - { id: c9u, text: "So you think everyone should start smoking?", lang: en }
        - { id: p1o, text: "Either you quit smoking today, or you'll die young like everyone else.", lang: en }
    answer:
      correct_option_id: k7a
    explanation:
      vi: Câu đúng gọi tên vấn đề - một trường hợp cá nhân (anecdotal evidence) không thể bác bỏ nghiên cứu quy mô lớn. Các câu khác lần lượt là ad hominem, straw man và false dilemma.
    display_answer: "That's anecdotal evidence - one case can't outweigh decades of large-scale studies."

  - key: en:exercise:crw-eval-mcq-credible-source
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: en:item:crw-credible-source
    prompt:
      stem: Bạn viết bài luận về tác động của cà phê đối với sức khỏe. Nguồn nào đáng tin cậy nhất (the most credible source)?
      stem_lang: vi
      options:
        - { id: r5c, text: "Một nghiên cứu đã qua bình duyệt trên tạp chí y khoa, công khai nguồn tài trợ.", lang: vi }
        - { id: y8g, text: "Bài blog trên trang web của một hãng cà phê lớn.", lang: vi }
        - { id: n6s, text: "Bình luận của một người nói mình uống mười cốc mỗi ngày mà vẫn khỏe.", lang: vi }
        - { id: h2t, text: "Một video lan truyền trên mạng xã hội không rõ tác giả.", lang: vi }
    answer:
      correct_option_id: r5c
    explanation:
      vi: Nghiên cứu peer-reviewed, minh bạch tài trợ là nguồn credible. Blog của hãng cà phê có thể biased; lời kể cá nhân là anecdotal evidence; video không rõ tác giả không kiểm chứng được.
    display_answer: "Một nghiên cứu đã qua bình duyệt trên tạp chí y khoa, công khai nguồn tài trợ."

