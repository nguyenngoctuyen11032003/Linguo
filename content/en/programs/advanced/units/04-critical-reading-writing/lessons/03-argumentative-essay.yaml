  - key: en:exercise:crw-essay-order-overlooks
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-this-view-overlooks
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Tuy nhiên, quan điểm này bỏ qua thực tế là đa số người lao động thích sự linh hoạt.\""
      tokens:
        - { id: o-fact, text: the fact that }
        - { id: o-prefer, text: prefer flexibility }
        - { id: o-over, text: overlooks }
        - { id: o-how, text: "However," }
        - { id: o-most, text: most workers }
        - { id: o-overs, text: oversees }
        - { id: o-view, text: this view }
    answer:
      orders:
        - [o-how, o-view, o-over, o-fact, o-most, o-prefer]
    explanation:
      vi: However, this view overlooks the fact that + mệnh đề. Oversees (giám sát) là token thừa, dễ nhầm với overlooks (bỏ sót).
    display_answer: However, this view overlooks the fact that most workers prefer flexibility.

  - key: en:exercise:crw-essay-mcq-topic-sentence
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-topic-sentence
    prompt:
      stem: "Đoạn thân bài sau thiếu câu chủ đề: \"___ For example, LED street lights use half as much power, and solar panels on public buildings now pay for themselves within six years.\" Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: l3g, text: "Firstly, green technology saves cities a considerable amount of money.", lang: en }
        - { id: f6r, text: "Solar panels were invented in the nineteenth century.", lang: en }
        - { id: s9b, text: "In conclusion, green technology is too expensive for most cities.", lang: en }
        - { id: d2c, text: "I like green technology very much.", lang: en }
    answer:
      correct_option_id: l3g
    explanation:
      vi: Câu chủ đề phải khái quát được các ví dụ phía sau (tiết kiệm điện, hoàn vốn) - tức là tiết kiệm tiền. Các câu khác lạc đề, mâu thuẫn với ví dụ, hoặc chỉ là cảm xúc cá nhân.
    display_answer: "Firstly, green technology saves cities a considerable amount of money."

