body:
  - type: objective
    text:
      vi: Bài luận nghị luận (argumentative essay) thuyết phục người đọc bằng cấu trúc chứ không bằng cảm xúc. Sau bài này, bạn dựng khung một bài luận C1 hoàn chỉnh - mở bài có luận điểm, thân bài có phản đề và bác bỏ, kết bài cân nhắc hai phía.
  - type: explain
    text:
      vi: Mở bài - một hai câu bối cảnh, rồi câu luận điểm (thesis statement) nêu rõ lập trường và lý do chính, ví dụ This essay argues that… because…. Tránh câu chỉ giới thiệu chủ đề như In this essay I will talk about….
  - type: explain
    text:
      vi: Thân bài - mỗi đoạn mở bằng một câu chủ đề (topic sentence), sau đó giải thích và cho ví dụ. Một đoạn dành cho phản đề (counter-argument) - It could be argued that… / Opponents of X contend that… - rồi bác bỏ - However, this view overlooks…. Dẫn hệ quả logic bằng It follows that….
  - type: explain
    text:
      vi: Kết bài - On balance, … hoặc In conclusion, … nhắc lại luận điểm bằng lời khác, cho thấy bạn đã cân nhắc (weigh up) cả hai phía, không đưa ý mới. Mức độ đồng ý - I agree to a large extent / to some extent, although….
  - type: deep_explain
    text:
      vi: Lỗi người Việt hay mắc - (1) At last để kết bài - at last là "cuối cùng thì (sau khi chờ đợi)"; kết bài dùng In conclusion / On balance; (2) In my opinion, I think… - lặp ý, chỉ cần một trong hai; (3) to some extents / in a large extent - extent số ít, đi với to; (4) I am agree - agree là động từ; (5) On the other hand dùng như "thêm nữa" - cụm này chỉ dùng khi đưa ra mặt đối lập.
  - type: example
    target: Short-haul flights account for a growing share of transport emissions. This essay argues that cities should replace them with high-speed rail, because rail is cleaner, faster door to door and cheaper in the long run.
    target_lang: en
    translation:
      vi: Các chuyến bay chặng ngắn chiếm tỉ trọng ngày càng lớn trong lượng khí thải giao thông. Bài luận này cho rằng các thành phố nên thay chúng bằng đường sắt cao tốc, vì đường sắt sạch hơn, nhanh hơn nếu tính từ cửa đến cửa và rẻ hơn về lâu dài.
    note:
      vi: Câu bối cảnh + thesis statement có lập trường rõ và ba lý do - ba lý do này sẽ thành ba đoạn thân bài.
  - type: example
    target: Opponents of the tax contend that it hurts small businesses. However, this view overlooks the fact that the smallest firms are exempt.
    target_lang: en
    translation:
      vi: Những người phản đối loại thuế này cho rằng nó gây hại cho doanh nghiệp nhỏ. Tuy nhiên, quan điểm này bỏ qua thực tế là các doanh nghiệp nhỏ nhất được miễn thuế.
    note:
      vi: Nêu phản đề công bằng rồi bác bỏ bằng một dữ kiện - mạnh hơn nhiều so với lờ đi phía bên kia.
  - type: example
    target: Class sizes are rising and fewer graduates are training as teachers. It follows that, without action, the shortage will only get worse.
    target_lang: en
    translation:
      vi: Sĩ số lớp đang tăng và ngày càng ít sinh viên theo ngành sư phạm. Từ đó suy ra rằng, nếu không hành động, tình trạng thiếu giáo viên sẽ chỉ tệ hơn.
    note:
      vi: It follows that… nối hai tiền đề với kết luận - người đọc thấy rõ mạch suy luận.
  - type: example
    target: On balance, while banning cars from city centres has real costs, the benefits for public health are far greater.
    target_lang: en
    translation:
      vi: Xét về tổng thể, dù việc cấm ô tô vào trung tâm có cái giá thật sự, lợi ích cho sức khỏe cộng đồng lớn hơn nhiều.
    note:
      vi: Kết bài thừa nhận mặt trái (while…) rồi khẳng định lại luận điểm - không đưa ý mới.
  - type: common_mistake
    wrong: At last, I believe that public transport should be free.
    right: In conclusion, I believe that public transport should be free.
    target_lang: en
    note:
      vi: At last = cuối cùng thì (sau khi chờ đợi lâu); để mở kết bài dùng In conclusion / On balance / To conclude.
  - type: common_mistake
    wrong: I agree with this statement to some extents.
    right: I agree with this statement to some extent.
    target_lang: en
    note:
      vi: Extent luôn ở số ít trong cụm này - to some / a large / a certain extent.
  - type: common_mistake
    wrong: In my opinion, I think that homework should be banned.
    right: In my opinion, homework should be banned.
    target_lang: en
    note:
      vi: In my opinion và I think cùng nghĩa - chọn một. Trong bài luận học thuật, nhiều khi chỉ cần nêu lập trường trực tiếp.
  - type: summary
    points:
      - vi: Mở bài - bối cảnh + thesis statement (This essay argues that… because…).
      - vi: Thân bài - topic sentence + giải thích + ví dụ; It follows that… cho hệ quả logic.
      - vi: Phản đề - It could be argued that… / Opponents of… contend that…; bác bỏ - However, this view overlooks….
      - vi: Kết bài - On balance / In conclusion, cân nhắc (weigh up) hai phía, không thêm ý mới; to a large / some extent.
      - vi: Tránh - At last để kết bài, In my opinion I think, to some extents, I am agree.
exercises:
  # ---------------- recognition ----------------
  - key: en:exercise:crw-essay-mcq-thesis
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-thesis-statement
    prompt:
      stem: Đề bài - "Should cities replace short-haul flights with high-speed rail?" Câu nào là thesis statement tốt nhất?
      stem_lang: vi
      options:
        - { id: t4q, text: "This essay argues that cities should replace short-haul flights with high-speed rail, because rail is cleaner and cheaper in the long run.", lang: en }
        - { id: i9w, text: "In this essay, I will talk about trains and planes.", lang: en }
        - { id: e3s, text: "Trains are good and planes are also good in some ways.", lang: en }
        - { id: u6d, text: "There are many advantages and disadvantages of transport nowadays.", lang: en }
    answer:
      correct_option_id: t4q
    explanation:
      vi: Thesis statement tốt nêu lập trường rõ (should replace) và lý do chính. Các câu khác chỉ giới thiệu chủ đề hoặc nói chung chung, không có lập trường.
    display_answer: "This essay argues that cities should replace short-haul flights with high-speed rail, because rail is cleaner and cheaper in the long run."

  - key: en:exercise:crw-essay-listen-overlooks
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: en:item:crw-this-view-overlooks
    prompt:
      audio_asset_id: null
      fallback_text: "Opponents of the tax contend that it hurts small businesses. However, this view overlooks the fact that the smallest firms are exempt."
      options:
        - { id: q2f, text: "Người nói nêu lập luận của phía phản đối rồi bác bỏ - các doanh nghiệp nhỏ nhất được miễn thuế.", lang: vi }
        - { id: z5j, text: "Người nói đồng ý rằng loại thuế này gây hại cho doanh nghiệp nhỏ.", lang: vi }
        - { id: b8y, text: "Người nói cho rằng nên miễn thuế cho tất cả doanh nghiệp.", lang: vi }
        - { id: v1m, text: "Người nói giám sát việc thu thuế của các doanh nghiệp nhỏ.", lang: vi }
    answer:
      correct_option_id: q2f
    explanation:
      vi: Opponents… contend that… nêu phản đề; However, this view overlooks… bác bỏ bằng dữ kiện bị bỏ sót. Overlook là "bỏ sót", không phải oversee (giám sát).
    display_answer: "Người nói nêu lập luận của phía phản đối rồi bác bỏ - các doanh nghiệp nhỏ nhất được miễn thuế."

  - key: en:exercise:crw-essay-fill-argued-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-it-could-be-argued-that
    prompt:
      template: "It could be {{b1}} that homework puts too much pressure on young children. {{b2}} balance, however, its benefits outweigh its drawbacks."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 2 }
      hint_levels:
        - "Nghĩa: Có thể lập luận rằng bài tập về nhà gây quá nhiều áp lực cho trẻ nhỏ. Tuy nhiên, xét về tổng thể, lợi ích của nó lớn hơn hạn chế."
        - "Gợi ý: ô 1 là quá khứ phân từ của argue; ô 2 là giới từ trong cụm \"xét về tổng thể\"."
    answer:
      blanks:
        b1: [argued, claimed, contended, maintained, suggested, said]
        b2: ["On"]
    known_wrong:
      - answer: argue
        feedback_vi: Cấu trúc bị động It could be + quá khứ phân từ - argued.
        error_tag: verb_form
      - answer: In
        feedback_vi: Cụm cố định là on balance; in balance nghĩa là "ở trạng thái cân bằng".
        error_tag: preposition
    explanation:
      vi: It could be argued that… nêu phản đề một cách khách quan. On balance = xét về tổng thể, sau khi cân nhắc.
    display_answer: It could be argued that homework puts too much pressure on young children. On balance, however, its benefits outweigh its drawbacks.

  - key: en:exercise:crw-essay-mcq-conclusion
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 3
    item: en:item:crw-in-conclusion
    prompt:
      stem: Câu nào là câu mở kết bài phù hợp nhất cho bài luận ủng hộ việc cấm ô tô vào trung tâm thành phố?
      stem_lang: vi
      options:
        - { id: c7n, text: "In conclusion, while banning cars has costs, the benefits for public health are greater.", lang: en }
        - { id: a4x, text: "At last, banning cars is good.", lang: en }
        - { id: g1h, text: "In conclusion, another reason is that cars are very noisy at night.", lang: en }
        - { id: k8e, text: "Finally, I will now talk about my opinion.", lang: en }
    answer:
      correct_option_id: c7n
    explanation:
      vi: Kết bài nhắc lại luận điểm và cân nhắc hai phía. At last không dùng để kết bài; kết bài không đưa lý do mới; câu cuối chỉ thông báo chứ không kết luận.
    display_answer: "In conclusion, while banning cars has costs, the benefits for public health are greater."

  # ---------------- recall ----------------
  - key: en:exercise:crw-essay-fill-contend
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 4
    item: en:item:crw-opponents-contend
    prompt:
      template: "Opponents of the policy {{b1}} that it is too expensive. However, this view {{b2}} the long-term savings. I therefore agree with the statement to a large {{b3}}."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 9 }
        - { id: b3, width_hint: 6 }
    answer:
      blanks:
        b1: [contend, argue, claim, maintain, insist, assert, believe, say, feel]
        b2: [overlooks, ignores, neglects, disregards, underestimates, misses]
        b3: [extent, degree]
    known_wrong:
      - answer: contends
        feedback_vi: Opponents là số nhiều - contend, không có s.
        error_tag: subject_verb_agreement
      - answer: overlook
        feedback_vi: Chủ ngữ this view số ít - overlooks.
        error_tag: subject_verb_agreement
      - answer: extents
        feedback_vi: Trong cụm to a large extent, extent ở số ít.
        error_tag: word_form
      - answer: oversees
        feedback_vi: Oversee là "giám sát"; "bỏ qua, bỏ sót" là overlook.
        error_tag: word_choice
    explanation:
      vi: Opponents (số nhiều) + contend; this view (số ít) + overlooks; to a large extent / degree = phần lớn.
    display_answer: Opponents of the policy contend that it is too expensive. However, this view overlooks the long-term savings. I therefore agree with the statement to a large extent.

