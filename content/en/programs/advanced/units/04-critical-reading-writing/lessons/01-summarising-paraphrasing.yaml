key: en:lesson:crw-summarising-paraphrasing
order_index: 1
level: c1
title:
  vi: Tóm tắt & diễn đạt lại (summarising, paraphrasing)
objectives:
  - vi: Phân biệt tóm tắt (summarise) và diễn đạt lại (paraphrase), nắm đại ý (the gist) của một đoạn văn C1.
  - vi: Diễn đạt lại bằng ba kỹ thuật - đổi từ đồng nghĩa có chọn lọc, đổi từ loại, đổi cấu trúc câu.
  - vi: Tường thuật ý tác giả bằng argue, claim, acknowledge, dismiss… và tránh lỗi according to me, suggest to V, summary dùng làm động từ.
estimated_minutes: 20
skills: [reading, writing, vocabulary, grammar]
