  - key: en:exercise:crw-sum-order-according-to
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-according-to
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Theo tác giả, du lịch đại trà đang làm hại thành phố.\""
      tokens:
        - { id: a-harm, text: is harming }
        - { id: a-me, text: "me," }
        - { id: a-city, text: the city }
        - { id: a-acc, text: According to }
        - { id: a-mass, text: mass tourism }
        - { id: a-auth, text: "the author," }
    answer:
      orders:
        - [a-acc, a-auth, a-mass, a-harm, a-city]
    explanation:
      vi: According to + nguồn (the author). Me là token thừa - không nói according to me; câu gốc cũng nói về ý của tác giả.
    display_answer: According to the author, mass tourism is harming the city.

  - key: en:exercise:crw-sum-mcq-one-sentence-summary
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-summarise
    prompt:
      stem: Bạn cần tóm tắt một bài báo về tuần làm việc bốn ngày trong MỘT câu cho báo cáo. Câu nào tốt nhất?
      stem_lang: vi
      options:
        - { id: s8v, text: "The article argues that a four-day week raises productivity, although it acknowledges that most evidence comes from small firms.", lang: en }
        - { id: h3n, text: "According to me, the four-day week is a great idea and every company should try it.", lang: en }
        - { id: e6c, text: "The article summaries that a four-day week is good for productivity.", lang: en }
        - { id: u1l, text: "The article mentions a study from 2019, then a survey of 300 managers, then a trial in Iceland, then interviews with staff.", lang: en }
    answer:
      correct_option_id: s8v
    explanation:
      vi: Câu đúng nêu lập luận chính và điều tác giả thừa nhận bằng động từ tường thuật. Các câu khác đưa ý kiến cá nhân (và according to me sai), dùng summary làm động từ, hoặc liệt kê chi tiết thay vì rút ra ý chính.
    display_answer: "The article argues that a four-day week raises productivity, although it acknowledges that most evidence comes from small firms."

  - key: en:exercise:crw-sum-mcq-verbatim
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: en:item:crw-verbatim
    prompt:
      stem: Bạn muốn dùng nguyên văn (verbatim) một câu của tác giả trong bài luận. Cách nào đúng?
      stem_lang: vi
      options:
        - { id: v2a, text: "Đặt câu đó trong ngoặc kép và ghi rõ nguồn.", lang: vi }
        - { id: q5r, text: "Đổi một hai từ là đủ, không cần ghi nguồn.", lang: vi }
        - { id: o9k, text: "Không cần ghi nguồn vì câu đó ngắn.", lang: vi }
        - { id: j4p, text: "Dịch sang tiếng Việt rồi dịch ngược lại để thành câu của mình.", lang: vi }
    answer:
      correct_option_id: v2a
    explanation:
      vi: Trích nguyên văn thì phải có ngoặc kép và nguồn. Đổi vài từ, bỏ nguồn hay dịch đi dịch lại đều vẫn là đạo văn (plagiarism) - muốn dùng lời mình thì phải paraphrase thật sự và vẫn ghi nguồn.
    display_answer: "Đặt câu đó trong ngoặc kép và ghi rõ nguồn."

