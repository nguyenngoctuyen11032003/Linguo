  - key: en:exercise:crw-reg-order-contact
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:crw-get-in-touch
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh trang trọng: \"Vui lòng liên hệ với chúng tôi nếu anh/chị cần thêm thông tin.\""
      tokens:
        - { id: c-info, text: further information }
        - { id: c-us, text: us }
        - { id: c-with, text: with }
        - { id: c-if, text: if you require }
        - { id: c-please, text: Please }
        - { id: c-contact, text: contact }
    answer:
      orders:
        - [c-please, c-contact, c-us, c-if, c-info]
    explanation:
      vi: Contact + tân ngữ trực tiếp (contact us). With là token thừa - "liên hệ với" không chuyển thành contact with. Require và further information làm câu trang trọng hơn need và more information.
    display_answer: Please contact us if you require further information.

  - key: en:exercise:crw-reg-mcq-spoken-to-written
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:crw-vague-language
    prompt:
      stem: "Bạn chuyển câu nói trong cuộc họp thành một câu trong báo cáo: \"There's loads of stuff we can do to cut costs, like, energy and things like that.\" Câu nào tốt nhất?"
      stem_lang: vi
      options:
        - { id: v6n, text: "Several measures could be taken to reduce costs, notably in energy use.", lang: en }
        - { id: d4h, text: "There is loads of stuff that we can do to cut costs, like energy.", lang: en }
        - { id: z1q, text: "Several measures could be taken to reduce costs, like, energy and things.", lang: en }
        - { id: i7f, text: "Kindly be advised that loads of measures hereby exist for cost reduction.", lang: en }
    answer:
      correct_option_id: v6n
    explanation:
      vi: Câu đúng thay loads of stuff bằng several measures, bỏ từ đệm like và thay things like that bằng một ví dụ cụ thể. Các phương án khác vẫn mơ hồ, còn từ đệm, hoặc trộn từ cứng nhắc (kindly be advised, hereby) với từ thân mật (loads of).
    display_answer: "Several measures could be taken to reduce costs, notably in energy use."

  - key: en:exercise:crw-reg-mcq-formal-to-informal
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:register-shift
    prompt:
      stem: "Thông báo chính thức: \"Please be advised that the party has been postponed until further notice.\" Bạn báo tin này vào nhóm chat của bạn bè. Câu nào tự nhiên và nhất quán về văn phong?"
      stem_lang: vi
      options:
        - { id: g2y, text: "Heads up - the party's off for now. I'll let you know the new date!", lang: en }
        - { id: p9c, text: "Please be advised, guys, that the party has been postponed until further notice.", lang: en }
        - { id: t6l, text: "The party is hereby postponed until further notice, lol.", lang: en }
        - { id: m1s, text: "Heads up - kindly be informed that the party has been postponed until further notice.", lang: en }
    answer:
      correct_option_id: g2y
    explanation:
      vi: Câu đúng thân mật từ đầu đến cuối - heads up, the party's off, I'll let you know. Ba câu còn lại trộn văn phong - từ hành chính (be advised, hereby, kindly be informed) đi cùng từ thân mật (guys, lol, heads up).
    display_answer: "Heads up - the party's off for now. I'll let you know the new date!"

