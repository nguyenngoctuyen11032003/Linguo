title:
  vi: Chuyển đổi văn phong - trang trọng ↔ thân mật, văn nói ↔ văn viết
objectives:
  - vi: Chuyển một câu qua lại giữa trang trọng và thân mật bằng từ vựng (sort out ↔ resolve), lượng từ và cấu trúc vô nhân xưng (It is recommended that…).
  - vi: Biến lời nói thành văn viết - bỏ từ đệm (you know, like), thay ngôn ngữ mơ hồ (stuff, kind of) bằng từ chính xác.
  - vi: Viết email lịch sự mà không cứng nhắc - I would appreciate it if…, Please note that…, và biết khi nào dùng Just a quick note….
estimated_minutes: 22
skills: [writing, speaking, vocabulary, grammar]
prerequisites: [en:lesson:crw-argumentative-essay]
