body:
  - type: objective
    text:
      vi: Bài ôn tập này đưa bạn qua cả quy trình đọc phản biện - đọc một bài xã luận đề xuất cấm điện thoại thông minh trong trường học, tóm tắt nó, chỉ ra chỗ yếu của lập luận, rồi viết phản hồi bằng hai văn phong khác nhau.
  - type: explain
    text:
      vi: Quy trình bốn bước - (1) nắm đại ý (the gist) và tóm tắt bằng The author argues that…; (2) đánh giá nguồn và bằng chứng - ai nói, dựa trên gì, có anecdotal không; (3) tìm ngụy biện - sweeping statement, cherry-picking, nhầm tương quan với nhân quả, slippery slope, false dilemma; (4) phản hồi - phản đề, bác bỏ, kết luận cân nhắc, đúng văn phong người đọc.
  - type: explain
    text:
      vi: Hai cụm mới - a sweeping statement (nhận định vơ đũa cả nắm - All teenagers are…) và cherry-picking (chỉ chọn dữ liệu có lợi, lờ phần còn lại). Phản bác lịch sự - That is a sweeping statement; The author cherry-picks the data.
  - type: deep_explain
    text:
      vi: Khi tự kiểm tra bài viết C2 - (1) động từ tường thuật có đúng mẫu không (suggests + V-ing / that…, không phải suggests to V); (2) từ loại - biased, necessarily, anecdotal; (3) evidence không đếm được; (4) phản biện nhắm vào lập luận, không vào người viết; (5) văn phong nhất quán - báo cáo không có stuff, like; tin nhắn bạn bè không có hereby.
  - type: example
    target: "Smartphones are destroying our children's ability to concentrate. Every teacher I have spoken to agrees. One school in Manchester banned phones last year, and its exam results rose by 12 per cent. If we allow phones in classrooms today, tomorrow students will be unable to read a single page. Either we ban phones completely, or we accept a generation that cannot think."
    target_lang: en
    translation:
      vi: "Điện thoại thông minh đang hủy hoại khả năng tập trung của con em chúng ta. Mọi giáo viên mà tôi từng nói chuyện đều đồng ý. Một trường ở Manchester đã cấm điện thoại năm ngoái, và điểm thi của trường tăng 12 phần trăm. Nếu hôm nay chúng ta cho phép điện thoại trong lớp, ngày mai học sinh sẽ không đọc nổi một trang sách. Hoặc chúng ta cấm điện thoại hoàn toàn, hoặc chấp nhận một thế hệ không biết suy nghĩ."
    note:
      vi: Bài xã luận - năm câu, năm vấn đề - nhận định vơ đũa, bằng chứng giai thoại, chọn lọc dữ liệu kèm nhầm nhân quả, dốc trượt, lưỡng nan giả.
  - type: example
    target: The author argues that smartphones should be banned in schools, claiming that they damage students' concentration.
    target_lang: en
    translation:
      vi: Tác giả cho rằng nên cấm điện thoại thông minh trong trường học, khẳng định rằng chúng làm hại khả năng tập trung của học sinh.
    note:
      vi: Tóm tắt một câu - động từ tường thuật argues và claiming, diễn đạt lại bằng lời của mình.
  - type: example
    target: However, the evidence is largely anecdotal, and the author cherry-picks a single school. Even there, it does not necessarily follow that the ban caused the higher marks.
    target_lang: en
    translation:
      vi: Tuy nhiên, bằng chứng phần lớn mang tính giai thoại, và tác giả chỉ chọn đúng một trường. Ngay cả ở đó, không nhất thiết vì thế mà lệnh cấm là nguyên nhân khiến điểm cao hơn.
    note:
      vi: Đoạn phản biện - nhắm vào bằng chứng và lập luận, không công kích người viết.
  - type: example
    target: "Report: It is recommended that schools limit phone use during lessons rather than impose a complete ban. → Message to a friend: Honestly, I think schools should just keep phones off in class - a total ban seems a bit much."
    target_lang: en
    translation:
      vi: "Báo cáo: Khuyến nghị các trường hạn chế dùng điện thoại trong giờ học thay vì cấm hoàn toàn. → Nhắn cho bạn: Thật ra mình nghĩ trường chỉ cần cho tắt điện thoại trong giờ học thôi - cấm hẳn thì hơi quá."
    note:
      vi: Cùng một kết luận, hai văn phong - câu vô nhân xưng trang trọng và lời nhắn thân mật.
  - type: common_mistake
    wrong: The author suggests to ban phones in all schools.
    right: The author suggests banning phones in all schools.
    target_lang: en
    note:
      vi: Suggest + V-ing hoặc suggest that phones should be banned; không dùng suggest to V.
  - type: common_mistake
    wrong: The article is very bias and gives many evidences.
    right: The article is heavily biased and offers little real evidence.
    target_lang: en
    note:
      vi: Sau be cần tính từ biased; evidence không đếm được, không có dạng evidences.
  - type: common_mistake
    wrong: All teenagers are addicted to their phones, so the ban is necessary.
    right: Many teenagers spend several hours a day on their phones, which may justify some restrictions.
    target_lang: en
    note:
      vi: Nhận định vơ đũa cả nắm (all teenagers) làm lập luận yếu; dùng ngôn ngữ rào đón (many, may) và nêu dữ kiện cụ thể.
  - type: summary
    points:
      - vi: Quy trình - nắm the gist → đánh giá nguồn và bằng chứng → tìm ngụy biện → phản hồi đúng văn phong.
      - vi: Cụm mới - a sweeping statement (vơ đũa cả nắm), cherry-picking / cherry-pick the data (chọn lọc dữ liệu có lợi).
      - vi: Phản biện - The evidence is largely anecdotal; It does not necessarily follow that…; However, this view overlooks….
      - vi: Kết luận - On balance, …; mức độ đồng ý - to a large / some extent.
      - vi: Văn phong - báo cáo dùng It is recommended that…, I would appreciate it if…; tin nhắn bạn bè dùng câu ngắn, thân mật.
exercises:
  # ---------------- recognition ----------------
  - key: en:exercise:crw-review-mcq-gist
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: en:item:crw-the-gist
    prompt:
      stem: Đại ý (the gist) của bài xã luận về điện thoại thông minh trong phần ví dụ là gì?
      stem_lang: vi
      options:
        - { id: g5h, text: "Nên cấm hoàn toàn điện thoại trong trường vì chúng làm hại khả năng tập trung của học sinh.", lang: vi }
        - { id: w2n, text: "Trường học nên dùng điện thoại thông minh để dạy học tốt hơn.", lang: vi }
        - { id: c8t, text: "Một trường ở Manchester có điểm thi cao nhất nước Anh.", lang: vi }
        - { id: j6q, text: "Giáo viên nên được phép dùng điện thoại trong giờ học.", lang: vi }
    answer:
      correct_option_id: g5h
    explanation:
      vi: Cả bài xoay quanh một luận điểm - cấm điện thoại vì chúng hủy hoại sự tập trung. Chi tiết về trường ở Manchester chỉ là bằng chứng (yếu) cho luận điểm đó, không phải ý chính.
    display_answer: "Nên cấm hoàn toàn điện thoại trong trường vì chúng làm hại khả năng tập trung của học sinh."

  - key: en:exercise:crw-review-mcq-weakness
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 5
    item: en:item:crw-correlation-causation
    prompt:
      stem: "Câu \"One school in Manchester banned phones last year, and its exam results rose by 12 per cent.\" yếu ở điểm nào?"
      stem_lang: vi
      options:
        - { id: p3w, text: "Chỉ chọn một trường có kết quả đẹp và coi việc tăng điểm là do lệnh cấm - chọn lọc dữ liệu và nhầm tương quan với nhân quả.", lang: vi }
        - { id: k9d, text: "Câu này công kích cá nhân các giáo viên ở Manchester.", lang: vi }
        - { id: s4b, text: "Câu này chỉ đưa ra hai lựa chọn cực đoan.", lang: vi }
        - { id: f1x, text: "Câu này không có điểm yếu vì đã có số liệu cụ thể.", lang: vi }
    answer:
      correct_option_id: p3w
    explanation:
      vi: Một trường là quá ít (cherry-picking), và điểm tăng sau lệnh cấm chưa chứng minh lệnh cấm là nguyên nhân - correlation does not imply causation. Có con số cụ thể không có nghĩa là bằng chứng mạnh.
    display_answer: "Chỉ chọn một trường có kết quả đẹp và coi việc tăng điểm là do lệnh cấm - chọn lọc dữ liệu và nhầm tương quan với nhân quả."

  - key: en:exercise:crw-review-listen-cherry-picking
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 4
    item: en:item:crw-cherry-picking
    prompt:
      audio_asset_id: null
      fallback_text: "Opponents might say this is cherry-picking. However, the trend holds across all forty schools in the study, not just the best one."
      options:
        - { id: e7m, text: "Người nói lường trước lời chỉ trích chọn lọc dữ liệu rồi bác bỏ - xu hướng đúng ở cả bốn mươi trường.", lang: vi }
        - { id: o2k, text: "Người nói thừa nhận mình chỉ chọn trường có kết quả tốt nhất.", lang: vi }
        - { id: y8v, text: "Người nói kể về một chuyến đi hái anh đào cùng học sinh.", lang: vi }
        - { id: u5c, text: "Người nói cho rằng nghiên cứu chỉ có một trường tham gia.", lang: vi }
    answer:
      correct_option_id: e7m
    explanation:
      vi: Cherry-picking là chọn lọc dữ liệu có lợi, không liên quan đến hái quả. Opponents might say… nêu phản đề; However… bác bỏ bằng dữ kiện - xu hướng đúng với cả bốn mươi trường.
    display_answer: "Người nói lường trước lời chỉ trích chọn lọc dữ liệu rồi bác bỏ - xu hướng đúng ở cả bốn mươi trường."

  - key: en:exercise:crw-review-fill-sweeping-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 4
    item: en:item:crw-sweeping-statement
    prompt:
      template: "\"All teenagers are addicted to their phones\" is a {{b1}} statement. The author also {{b2}}-picks the data, citing only the one school where results improved."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 6 }
      hint_levels:
        - "Nghĩa: \"Tất cả thiếu niên đều nghiện điện thoại\" là một nhận định vơ đũa cả nắm. Tác giả cũng chọn lọc dữ liệu, chỉ dẫn ra một trường có kết quả tốt lên."
        - "Gợi ý: ô 1 là tính từ \"quét sạch, bao trùm\" (s…); ô 2 là một loại quả (c…)."
    answer:
      blanks:
        b1: [sweeping, blanket]
        b2: [cherry]
    known_wrong:
      - answer: sweep
        feedback_vi: Trước danh từ statement cần tính từ đuôi -ing - a sweeping statement.
        error_tag: word_form
      - answer: cherries
        feedback_vi: Trong động từ ghép cherry-pick, cherry ở số ít.
        error_tag: word_form
    explanation:
      vi: A sweeping statement = nhận định vơ đũa cả nắm; cherry-pick the data = chỉ chọn dữ liệu có lợi.
    display_answer: "\"All teenagers are addicted to their phones\" is a sweeping statement. The author also cherry-picks the data, citing only the one school where results improved."

  # ---------------- recall ----------------
  - key: en:exercise:crw-review-fill-mixed
    type: fill_blank
    stage: recall
    answer_lang: en
    difficulty: 5
    item: en:item:crw-does-not-follow
    prompt:
      template: "The author {{b1}} that phones should be banned. However, it does not necessarily {{b2}} that the higher marks were caused by the ban. {{b3}} balance, the evidence is too weak to support such a strong claim."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 6 }
        - { id: b3, width_hint: 2 }
    answer:
      blanks:
        b1: [argues, claims, contends, maintains, asserts, insists, suggests, believes, states]
        b2: [follow]
        b3: ["On"]
    known_wrong:
      - answer: argue
        feedback_vi: Chủ ngữ the author số ít - argues.
        error_tag: subject_verb_agreement
      - answer: follows
        feedback_vi: Sau does not necessarily dùng động từ nguyên mẫu - follow.
        error_tag: verb_form
      - answer: In
        feedback_vi: Cụm cố định là on balance.
        error_tag: preposition
    explanation:
      vi: The author argues that… tường thuật luận điểm; It does not necessarily follow that… chỉ ra lỗ hổng nhân quả; On balance mở câu kết luận.
    display_answer: The author argues that phones should be banned. However, it does not necessarily follow that the higher marks were caused by the ban. On balance, the evidence is too weak to support such a strong claim.

