        - { id: d5k, text: "Hey parents, make sure your kids' phones are, like, off in class, OK?", lang: en }
        - { id: l7w, text: "We would appreciate if parents could ensure that phones are switched off during lessons.", lang: en }
        - { id: q1j, text: "It is recommended that parents ensures that phones are switched off during lessons.", lang: en }
