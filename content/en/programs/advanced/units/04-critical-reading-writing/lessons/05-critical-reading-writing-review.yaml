  - key: en:exercise:crw-review-mcq-rebuttal
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:crw-this-view-overlooks
    prompt:
      stem: Bạn viết đoạn phản hồi bài xã luận. Câu nào nêu phản đề rồi bác bỏ đúng chuẩn bài luận C2?
      stem_lang: vi
      options:
        - { id: n8r, text: "It could be argued that phones distract students. However, this view overlooks the fact that phones can also be powerful learning tools.", lang: en }
        - { id: h4e, text: "The author only says that because he is old and hates technology.", lang: en }
        - { id: z6o, text: "So the author wants children to have no technology at all?", lang: en }
        - { id: b3l, text: "It could be argue that phones distract students, but in other hand they are useful.", lang: en }
    answer:
      correct_option_id: n8r
    explanation:
      vi: Câu đúng nêu phản đề khách quan rồi bác bỏ bằng điều bị bỏ qua. Các câu khác là ad hominem, straw man, hoặc sai ngữ pháp (could be argue, in other hand thay cho on the other hand).
    display_answer: "It could be argued that phones distract students. However, this view overlooks the fact that phones can also be powerful learning tools."

  - key: en:exercise:crw-review-mcq-newsletter
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:crw-would-appreciate-it-if
    prompt:
      stem: Bạn viết bản tin trang trọng gửi phụ huynh về quy định điện thoại. Câu nào phù hợp và không có lỗi?
