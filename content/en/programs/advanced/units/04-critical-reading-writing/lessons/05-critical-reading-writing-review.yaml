  vi: Ôn tập - Đọc phản biện một bài xã luận & viết phản hồi
objectives:
  - vi: Tóm tắt đại ý một bài xã luận và đánh giá bằng chứng, nguồn và các ngụy biện trong đó.
  - vi: Viết đoạn phản hồi có phản đề, bác bỏ và kết luận cân nhắc; chuyển cùng một nội dung sang văn phong phù hợp với người đọc.
  - vi: Tự sửa lỗi hay gặp - suggest to V, biased/bias, evidences, to some extents, I would appreciate if….
