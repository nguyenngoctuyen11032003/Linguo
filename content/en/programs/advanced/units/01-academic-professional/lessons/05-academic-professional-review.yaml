title:
  vi: Ôn tập - Email & tóm tắt báo cáo trang trọng
objectives:
  - vi: Đọc hiểu một email công việc và một đoạn tóm tắt báo cáo, nhận ra rào đón, danh từ hoá, đảo ngữ và từ nối.
  - vi: Phối hợp các cấu trúc của cả unit khi viết câu trang trọng.
  - vi: Tự sửa các lỗi hay gặp - Although… but…, despite of, Not only he is…, researches, lạm dụng very.
