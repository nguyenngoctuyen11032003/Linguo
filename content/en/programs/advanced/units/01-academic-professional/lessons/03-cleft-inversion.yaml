        feedback_vi: Sau did là động từ nguyên mẫu - increase, không phải increased.
        error_tag: verb_form
      - answer: Not only increased the campaign sales, but it also improved the brand image.
        feedback_vi: Không đảo động từ chính; mượn trợ động từ did - Not only did the campaign increase….
        error_tag: inversion
    explanation:
      vi: Quá khứ đơn không có trợ động từ nên mượn did và đưa lên trước chủ ngữ; động từ chính trở về nguyên mẫu. Vế sau dùng but… also với trật tự bình thường.
    display_answer: Not only did the campaign increase sales, but it also improved our brand image.

  - key: en:exercise:cleft-mcq-email-should
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:inversion-conditional
    prompt:
      stem: "Bạn kết thúc một email trang trọng gửi khách hàng. Câu nào phù hợp và đúng ngữ pháp nhất?"
      stem_lang: vi
      options:
        - { id: e7v, text: "Should you have any further questions, please do not hesitate to contact me.", lang: en }
        - { id: k1z, text: "If should you have any further questions, please do not hesitate to contact me.", lang: en }
        - { id: w4d, text: "Should you have any further questions, don't hesitate to ping me!", lang: en }
        - { id: q8h, text: "Do you have any further questions, please do not hesitate to contact me.", lang: en }
    answer:
