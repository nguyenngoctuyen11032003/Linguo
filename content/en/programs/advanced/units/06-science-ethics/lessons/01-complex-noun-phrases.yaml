key: en:lesson:science-ethics-noun-phrases
order_index: 1
level: c1
title:
  vi: The rapidly ageing rural population - cụm danh từ phức trong văn học thuật
objectives:
  - vi: Nén một mệnh đề dài thành cụm danh từ bằng bổ ngữ đứng trước (trạng từ + tính từ + danh từ phụ).
  - vi: Thêm chi tiết sau danh từ bằng cụm giới từ, cụm phân từ và to + V thay cho mệnh đề quan hệ.
  - vi: Dùng collocation học thuật về khoa học và chính sách - far-reaching, unintended consequences, long-term implications, evidence-based.
  - vi: Tránh lỗi thứ tự từ do ảnh hưởng của tiếng Việt (danh từ chính đứng trước).
estimated_minutes: 25
skills: [grammar, writing, reading]
prerequisites: [en:lesson:spoken-discourse-review]
items:
  - item: en:item:sci-noun-phrase-premodification
  - item: en:item:sci-noun-phrase-postmodification
  - item: en:item:sci-far-reaching
  - item: en:item:sci-ageing-population
  - item: en:item:sci-unintended-consequences
  - item: en:item:sci-cutting-edge
  - item: en:item:sci-long-term-implications
