title:
  vi: On ethical grounds… - ngôn ngữ tranh luận về đạo đức khoa học
objectives:
  - vi: Nêu nghi vấn đạo đức một cách học thuật bằng It is debatable whether, raise the question of.
  - vi: Cân nhắc lợi - hại bằng the benefits outweigh the risks, at the expense of, there is a fine line between.
  - vi: Lập luận về trách nhiệm bằng a moral obligation, on ethical grounds, err on the side of caution.
  - vi: Viết một đoạn lập luận cân bằng về một vấn đề khoa học gây tranh cãi.
estimated_minutes: 25
skills: [writing, speaking, vocabulary]
prerequisites: [en:lesson:science-ethics-idioms]
