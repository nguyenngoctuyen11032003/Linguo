  - vi: Nhận ra lập luận cân bằng và các tín hiệu rào đón, nghi vấn đạo đức trong bài.
  - vi: Viết một đoạn phản hồi ngắn kết hợp ngôn ngữ tranh luận đạo đức, thành ngữ và cụm danh từ học thuật.
