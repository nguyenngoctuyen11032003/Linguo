  - key: en:exercise:persuade-review-order-while
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:while-it-is-true-that
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Tuy đúng là kế hoạch tốn kém, nhưng cái giá của việc không hành động còn cao hơn nhiều.\""
      tokens:
        - { id: w-far, text: is far higher }
        - { id: w-but, text: but }
        - { id: w-while, text: While it is true }
        - { id: w-cost, text: the cost of inaction }
        - { id: w-that, text: that the plan is expensive, }
    answer:
      orders:
        - [w-while, w-that, w-cost, w-far]
    explanation:
      vi: While it is true that X, Y - vế Y không cần but, khác tiếng Việt "tuy… nhưng…". But là token thừa. Far higher = cao hơn nhiều.
    display_answer: While it is true that the plan is expensive, the cost of inaction is far higher.

  - key: en:exercise:persuade-review-mcq-rebut
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:rebut
    prompt:
      stem: "Đối phương nói: \"Shorter weeks always mean lower output - everybody knows that.\" Bạn có một lượt để phản bác. Câu nào tốt nhất?"
      stem_lang: vi
      options:
        - { id: t8u, text: "I see it somewhat differently. \"Everybody knows\" is hardly evidence - and the data from three trials points the other way.", lang: en }
        - { id: a5k, text: "You are wrong, everybody knows nothing.", lang: en }
        - { id: l2s, text: "Actually, I agree that shorter weeks always mean lower output.", lang: en }
        - { id: n7z, text: "While it is true that everybody knows that, but we should try anyway.", lang: en }
    answer:
      correct_option_id: t8u
    explanation:
      vi: Câu đúng phản đối mềm, chỉ ra lỗ hổng lập luận (dựa vào "ai cũng biết") rồi đưa bằng chứng. Các câu khác công kích người nói, đầu hàng lập luận, hoặc mắc lỗi While… but.
    display_answer: "I see it somewhat differently. \"Everybody knows\" is hardly evidence - and the data from three trials points the other way."

  - key: en:exercise:persuade-review-mcq-error-free
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:give-a-presentation-on
    prompt:
      stem: Câu nào KHÔNG có lỗi?
      stem_lang: vi
      options:
        - { id: b9e, text: "Last month she gave a presentation on staff wellbeing and emphasised the need for flexible hours.", lang: en }
        - { id: g4p, text: "Last month she presented about staff wellbeing and emphasised the need for flexible hours.", lang: en }
        - { id: s1x, text: "Last month she gave a presentation on staff wellbeing and emphasised about flexible hours.", lang: en }
        - { id: v6h, text: "Last month she gave a presentation on staff wellbeing, which actually is being discussed about.", lang: en }
    answer:
      correct_option_id: b9e
    explanation:
      vi: Give a presentation on + chủ đề và emphasise + tân ngữ đều đúng. Các câu khác thừa about sau present, emphasise, discuss; câu cuối còn dùng actually sai nghĩa "hiện nay".
    display_answer: "Last month she gave a presentation on staff wellbeing and emphasised the need for flexible hours."

