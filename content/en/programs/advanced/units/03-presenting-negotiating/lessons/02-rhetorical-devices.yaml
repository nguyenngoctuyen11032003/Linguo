  # ---------------- application ----------------
  - key: en:exercise:rhetoric-order-question-is-not
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 5
    item: en:item:the-question-is-not-whether
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Câu hỏi không phải là chúng ta có đủ khả năng chi trả hay không, mà là chúng ta có thể không làm hay không.\""
      tokens:
        - { id: r-but, text: but }
        - { id: r-afford-not, text: whether we can afford not to }
        - { id: r-if, text: if can we }
        - { id: r-question, text: The question is not }
        - { id: r-afford, text: whether we can afford it, }
    answer:
      orders:
        - [r-question, r-afford, r-but, r-afford-not]
    explanation:
      vi: The question is not whether… but whether… tạo phép đối hai vế song song. If can we là token thừa - sai trật tự (cần we can) và lặp ý.
    display_answer: The question is not whether we can afford it, but whether we can afford not to.

  - key: en:exercise:rhetoric-mcq-closing
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:let-us-not-forget
    prompt:
      stem: Bạn cần một câu kết mạnh cho bài nói kêu gọi đầu tư vào đào tạo nhân viên. Câu nào hiệu quả và đúng nhất?
      stem_lang: vi
      options:
        - { id: k2p, text: "Let us not forget that our people are not our biggest cost but our greatest asset.", lang: en }
        - { id: f7x, text: "Let's don't forget that our people are our biggest cost and our greatest asset.", lang: en }
        - { id: b4q, text: "Don't forget about our people, they are very, very important.", lang: en }
        - { id: z6h, text: "Let us not forgetting that our people are our greatest asset.", lang: en }
    answer:
      correct_option_id: k2p
    explanation:
      vi: Let us not forget + phép đối not X but Y tạo câu kết đáng nhớ. Let's don't là dạng không chuẩn (chỉ gặp trong khẩu ngữ); very, very important yếu và thiếu tu từ; sau Let us not cần động từ nguyên mẫu, không phải V-ing.
    display_answer: "Let us not forget that our people are not our biggest cost but our greatest asset."

  - key: en:exercise:rhetoric-translate-all-we-need
    type: translate
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:all-we-need-is
    prompt:
      source_text: Tất cả những gì chúng ta cần là sự ủng hộ của các bạn.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - All we need is your support.
        - All that we need is your support.
        - All we need is your backing.
        - All that we need is your backing.
        - All we need now is your support.
        - The only thing we need is your support.
        - All we need from you is your support.
        - All that we need now is your support.
        - All we need now is your backing.
        - The one thing we need is your support.
        - The one thing we need is your backing.
        - The only thing we need is your backing.
        - All we need is for you to support us.
        - All we need is for you to back us.
        - All that we need is for you to support us.
        - Everything we need is your support.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: All we need are your support.
        feedback_vi: All we need (điều duy nhất ta cần) chia số ít - is; support cũng là danh từ không đếm được.
        error_tag: subject_verb_agreement
      - answer: All of us need your support.
        feedback_vi: All of us need nghĩa là "tất cả chúng ta đều cần", không nhấn mạnh "chỉ cần một điều".
        error_tag: all_cleft
    explanation:
      vi: All (that) we need is + danh từ nhấn mạnh rằng chỉ cần một điều. Đây là câu chẻ với All, tương tự What we need is….
    display_answer: All we need is your support.

  - key: en:exercise:rhetoric-mcq-antithesis
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 4
    item: en:item:antithesis
    prompt:
      stem: Câu nào dùng phép đối (antithesis) để nhấn mạnh ý "chúng ta cần hành động, không chỉ hứa hẹn"?
      stem_lang: vi
      options:
        - { id: u5j, text: "What we need now is not more promises but more action.", lang: en }
        - { id: c1v, text: "We need more promises and more action now.", lang: en }
        - { id: h8s, text: "Promises are good, action is also good, everything is good.", lang: en }
        - { id: t3l, text: "We need now not more promises, more action.", lang: en }
    answer:
      correct_option_id: u5j
    explanation:
      vi: What-cleft (What we need now is…) kết hợp not X but Y đặt promises đối lập với action trong cấu trúc song song. Các phương án khác hoặc không đối lập, hoặc thiếu but nên sai ngữ pháp.
    display_answer: "What we need now is not more promises but more action."
