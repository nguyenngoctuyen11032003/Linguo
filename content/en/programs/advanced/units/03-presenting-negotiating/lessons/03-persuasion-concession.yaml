order_index: 3
level: c1
title:
  vi: Thuyết phục bằng nhượng bộ & trạng từ quan điểm
objectives:
  - vi: Thuyết phục bằng lập luận nhượng bộ - thừa nhận một điểm rồi phản bác với Admittedly…, Granted…, While it is true that…, That said….
  - vi: Thể hiện mức độ chắc chắn bằng trạng từ quan điểm - undeniably, presumably, conceivably, There is no denying that….
  - vi: Phân biệt actually (thật ra) với currently (hiện nay).
estimated_minutes: 20
skills: [speaking, writing, grammar, vocabulary]
