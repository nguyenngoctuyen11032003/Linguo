title:
  vi: She told me to wait - gọi tổng đài, say/tell và kể lại lời yêu cầu
objectives:
  - vi: Phân biệt say và tell - tell luôn có người nghe ngay sau, say thì không.
  - vi: Kể lại lời yêu cầu và lời nhờ bằng tell / ask somebody (not) to + V.
  - vi: Dùng các cụm khi gọi tổng đài - be on hold, put somebody through, cancel, deal with.
estimated_minutes: 20
skills: [grammar, speaking, listening]
prerequisites: [en:lesson:money-services-money]
