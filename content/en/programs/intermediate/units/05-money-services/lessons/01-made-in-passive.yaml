title:
  vi: Made in Vietnam, delivered tomorrow - câu bị động hiện tại đơn và quá khứ đơn
objectives:
  - vi: Dùng bị động is/are + V3 và was/were + V3 khi nói về sản phẩm, đơn hàng, dịch vụ.
  - vi: Biết khi nào thêm by + người làm và khi nào nên bỏ.
  - vi: Phân biệt made of / made from / made in / made by.
estimated_minutes: 20
skills: [grammar, reading]
prerequisites: [en:lesson:travel-culture-review]
