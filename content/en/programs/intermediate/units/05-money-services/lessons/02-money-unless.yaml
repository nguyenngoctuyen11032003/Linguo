key: en:lesson:money-services-money
order_index: 2
level: b1
title:
  vi: If you pay late, you pay more - tiền bạc, điều kiện loại 0 và unless
objectives:
  - vi: Nói quy định và kết quả luôn đúng bằng câu điều kiện loại 0 (If + hiện tại đơn, hiện tại đơn).
  - vi: Dùng unless thay cho if … not mà không thêm phủ định thừa.
  - vi: Nói về chi tiêu cá nhân với afford, borrow/lend, save up for, spend on, owe, waste money.
estimated_minutes: 20
skills: [grammar, vocabulary, speaking]
prerequisites: [en:lesson:money-services-passive]
