  vi: Ôn tập - Bài đánh giá sản phẩm và cuộc gọi đổi hàng
objectives:
  - vi: Đọc hiểu và viết một bài đánh giá sản phẩm ngắn có so sánh, bị động và nhận xét về giá trị.
  - vi: Kể lại cuộc gọi tổng đài - nhân viên đã bảo bạn làm gì - bằng tell/ask somebody (not) to.
  - vi: Dùng unless, câu điều kiện loại 0 và từ vựng tiền bạc khi giải thích chính sách đổi trả.
