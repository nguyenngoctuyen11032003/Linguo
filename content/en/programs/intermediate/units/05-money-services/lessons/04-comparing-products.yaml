title:
  vi: Much cheaper, not as good as - so sánh sản phẩm trước khi mua
objectives:
  - vi: Nói mức chênh lệch bằng much / far / a lot / a bit / slightly + so sánh hơn.
  - vi: So sánh bằng và không bằng với as … as, not as … as; the same as, different from, similar to.
  - vi: Đánh giá giá trị món hàng với value for money, be worth + V-ing, second-hand.
estimated_minutes: 20
skills: [grammar, vocabulary, speaking]
prerequisites: [en:lesson:money-services-say-tell]
