  vi: To raise money, so that everyone can… - nói mục đích khi kêu gọi cộng đồng
objectives:
  - vi: Nói mục đích bằng to + V, in order (not) to + V và so that + chủ ngữ + can/will.
  - vi: Phân biệt for + danh từ với to + động từ.
  - vi: Viết lời kêu gọi ngắn với campaign, raise money, take part in, community centre.
