key: en:lesson:community-future-might
order_index: 1
level: b1
title:
  vi: Our city in 2040 - may, might và mức độ chắc chắn khi dự đoán
objectives:
  - vi: Dự đoán tương lai với các mức chắc chắn khác nhau - will, will probably, may/might, probably won't, won't.
  - vi: Dùng may not / might not và I doubt (that)… đúng nghĩa, không phủ định hai lần.
  - vi: Nói về vấn đề đô thị - pollution, flooding, overcrowded, electric vehicles.
estimated_minutes: 20
skills: [grammar, speaking, vocabulary]
prerequisites: [en:lesson:money-services-review]
