key: en:lesson:community-future-make-let
order_index: 2
level: b1
title:
  vi: They make us sort our rubbish - make, let, allow và want somebody to
objectives:
  - vi: Nói về quy định và sự cho phép bằng make / let + người + V và allow + người + to + V.
  - vi: Nói mong muốn về người khác bằng want / would like + người + to + V.
  - vi: Bàn về nội quy chung cư - residents, recycling, litter, noise, parking spaces.
estimated_minutes: 20
skills: [grammar, speaking, writing]
prerequisites: [en:lesson:community-future-might]
items:
  - item: en:item:make-someone-do
  - item: en:item:let-someone-do
  - item: en:item:allow-someone-to
  - item: en:item:want-someone-to
  - item: en:item:resident
  - item: en:item:recycle
