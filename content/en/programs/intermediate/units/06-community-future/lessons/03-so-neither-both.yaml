title:
  vi: So do I, neither can I - đồng tình, và both / either / neither khi làm tình nguyện
objectives:
  - vi: Đồng tình ngắn gọn bằng So + trợ động từ + I và Neither / Nor + trợ động từ + I, chọn đúng trợ động từ.
  - vi: Phân biệt Me too và Me neither.
  - vi: Nối hai lựa chọn bằng both … and, either … or, neither … nor.
estimated_minutes: 20
skills: [grammar, speaking]
prerequisites: [en:lesson:community-future-make-let]
