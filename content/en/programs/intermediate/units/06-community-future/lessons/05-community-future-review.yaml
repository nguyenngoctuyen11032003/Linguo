        - Nhờ có bốn mươi tình nguyện viên, công viên đã sạch trở lại, và chính quyền địa phương đồng ý lắp thêm thùng rác để công viên luôn sạch như vậy.
        - Nhờ bốn mươi tình nguyện viên, công viên đã sạch trở lại và chính quyền địa phương đã đồng ý đặt thêm thùng rác để giữ cho nó luôn sạch.
        - Nhờ 40 tình nguyện viên, công viên đã sạch trở lại, và chính quyền địa phương đã đồng ý lắp thêm thùng rác để công viên luôn sạch như vậy.
    rubric:
