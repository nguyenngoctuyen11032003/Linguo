    explanation:
      vi: Thanks to là "nhờ"; the council là "chính quyền địa phương"; so that it stays that way là mục đích - "để công viên luôn (sạch) như vậy".
    display_answer: Nhờ bốn mươi tình nguyện viên, công viên đã sạch trở lại, và chính quyền địa phương đã đồng ý lắp thêm thùng rác để công viên luôn sạch như vậy.
