    answer:
      accepted:
        - Cô ấy không còn sống ở Hà Nội nữa. Cô ấy đã chuyển về quê năm ngoái.
        - Cô ấy không còn sống ở Hà Nội nữa. Cô ấy chuyển về quê năm ngoái.
        - Cô ấy không còn sống ở Hà Nội nữa. Năm ngoái cô ấy đã chuyển về quê.
        - Cô ấy không còn sống ở Hà Nội nữa. Năm ngoái cô ấy chuyển về quê.
        - Cô ấy không còn sống ở Hà Nội nữa. Cô ấy đã chuyển về nông thôn năm ngoái.
        - Cô ấy không còn sống ở Hà Nội nữa. Năm ngoái cô ấy đã chuyển về nông thôn.
        - Cô ấy không sống ở Hà Nội nữa. Cô ấy đã chuyển về quê năm ngoái.
        - Cô ấy không sống ở Hà Nội nữa. Năm ngoái cô ấy chuyển về quê.
        - Cô ấy không còn ở Hà Nội nữa. Cô ấy đã chuyển về quê năm ngoái.
        - Chị ấy không còn sống ở Hà Nội nữa. Chị ấy đã chuyển về quê năm ngoái.
        - Chị ấy không còn sống ở Hà Nội nữa. Năm ngoái chị ấy chuyển về quê.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Cô ấy vẫn sống ở Hà Nội. Cô ấy đã chuyển về quê năm ngoái.
        feedback_vi: No longer là "không còn… nữa", không phải "vẫn".
        error_tag: word_meaning
    explanation:
      vi: No longer lives là "không còn sống… nữa". Moved to the countryside last year là "chuyển về quê năm ngoái" - quá khứ đơn vì có mốc last year.
    display_answer: Cô ấy không còn sống ở Hà Nội nữa. Cô ấy đã chuyển về quê năm ngoái.

  - key: en:exercise:yet-used-to-translate-grew-up
    type: translate
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:grow-up
    prompt:
      source_text: Mình lớn lên ở một ngôi làng nhỏ, nhưng bây giờ mình sống ở thành phố.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - I grew up in a small village, but now I live in the city.
        - I grew up in a small village, but I live in the city now.
        - I grew up in a small village, but nowadays I live in the city.
        - I grew up in a small village, but I now live in the city.
        - I grew up in a small village, but now I live in a city.
        - I grew up in a small village, but I live in a city now.
        - I grew up in a little village, but now I live in the city.
        - I grew up in a small village, but now I am living in the city.
        - I grew up in a small village, but I am living in the city now.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: I grow up in a small village, but now I live in the city.
        feedback_vi: Việc lớn lên đã xong trong quá khứ - dùng grew up.
        error_tag: verb_form
      - answer: I growed up in a small village, but now I live in the city.
        feedback_vi: Grow là động từ bất quy tắc - grow, grew, grown.
        error_tag: irregular_verb
      - answer: I was grown up in a small village, but now I live in the city.
        feedback_vi: Grow up không dùng ở thể bị động - I grew up.
        error_tag: verb_form
    explanation:
      vi: Grow up có quá khứ bất quy tắc là grew up. Nơi bạn sống lâu dài bây giờ dùng hiện tại đơn, có thể thêm now hoặc nowadays.
    display_answer: I grew up in a small village, but now I live in the city.

  - key: en:exercise:yet-used-to-order-moved
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 2
    item: en:item:move-house
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Nhà mình vừa mới chuyển nhà.\""
      tokens:
        - { id: m-house, text: house }
        - { id: m-moved, text: moved }
        - { id: m-just, text: just }
        - { id: m-weve, text: We've }
        - { id: m-yet, text: yet }
        - { id: m-move, text: move }
    answer:
      orders:
