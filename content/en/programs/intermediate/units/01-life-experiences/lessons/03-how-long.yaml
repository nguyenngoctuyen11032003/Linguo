        error_tag: continuous_for_duration
      - answer: I've been practising the guitar since six months and I've improved a lot.
        feedback_vi: Six months là độ dài, dùng for - for six months.
        error_tag: since_for
      - answer: I practise the guitar for six months and I've improved a lot.
        feedback_vi: "\"Được sáu tháng rồi\" cần present perfect - I've been practising."
        error_tag: tense_choice
      - answer: I've been practising the guitar for six months and I've improved better.
        feedback_vi: Improve đã có nghĩa "tốt lên", không thêm better - I've improved a lot.
        error_tag: word_choice
    explanation:
      vi: Việc tập bắt đầu sáu tháng trước và vẫn tiếp tục, nên dùng have been + V-ing với for. Kết quả đến nay (tiến bộ) dùng present perfect - I've improved a lot.
    display_answer: I've been practising the guitar for six months and I've improved a lot.

  - key: en:exercise:how-long-order-known
    type: word_bank
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:stative-verbs-perfect
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Mình quen Minh từ hồi tiểu học.\""
      tokens:
        - { id: k-since, text: since }
        - { id: k-school, text: school }
        - { id: k-minh, text: Minh }
        - { id: k-known, text: known }
        - { id: k-primary, text: primary }
        - { id: k-ive, text: I've }
        - { id: k-for, text: for }
        - { id: k-been, text: been }
        - { id: k-knowing, text: knowing }
    answer:
      orders:
        - [k-ive, k-known, k-minh, k-since, k-primary, k-school]
    explanation:
      vi: Know là động từ trạng thái nên dùng I've known, không dùng been knowing. Primary school là mốc bắt đầu nên dùng since.
