title:
  vi: I couldn't type, but now I can - could và be good at
objectives:
  - vi: Nói điều mình làm được và không làm được trong quá khứ bằng could / couldn't + V.
  - vi: Hỏi Could you… when you were…? và trả lời ngắn Yes, I could / No, I couldn't.
  - vi: Nói điểm mạnh, điểm yếu bằng be good at / not very good at + danh từ hoặc V-ing.
estimated_minutes: 15
skills: [grammar, speaking]
prerequisites: [en:lesson:jobs-skills-workplaces]
