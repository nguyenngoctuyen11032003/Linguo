title:
  vi: What do you do? - nghề nghiệp và nơi làm việc
objectives:
  - vi: Hỏi và trả lời về nghề nghiệp bằng What do you do? và I'm a/an…, I work as a/an….
  - vi: Chọn đúng giới từ sau work - work in (lĩnh vực, loại nơi chốn), at (địa điểm cụ thể), for (công ty).
  - vi: Gọi tên một số nghề phổ biến - nurse, chef, receptionist, accountant, mechanic, shop assistant.
estimated_minutes: 15
skills: [vocabulary, speaking]
prerequisites: [en:lesson:everyday-now-review]
