title:
  vi: Across the bridge, through the park - đường đi làm và giới từ chuyển động
objectives:
  - vi: Tả đường đi làm bằng động từ chuyển động + across, along, through, past, into, out of, up, down.
  - vi: Phân biệt cross (động từ) với across (giới từ), và get on/off với get into/out of.
  - vi: Nói về quãng đường đi làm hằng ngày bằng commute và take + thời gian.
