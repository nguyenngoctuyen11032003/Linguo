body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được một ngày đã qua - "Hôm qua mình dọn phòng, nấu cơm rồi xem phim" - với động từ thêm -ed viết và đọc đúng.
  - type: explain
    text:
      vi: Thì quá khứ đơn dùng cho việc đã xảy ra và kết thúc, thường đi với yesterday, last week, two days ago. Với phần lớn động từ, bạn chỉ cần thêm -ed - watch → watched, play → played. Dạng này giống nhau cho mọi chủ ngữ - I watched, she watched, they watched.
  - type: explain
    text:
      vi: Tiếng Việt không đổi động từ, chỉ cần "hôm qua" hoặc "đã". Tiếng Anh thì bắt buộc đổi - nói "Yesterday I watch TV" nghe như sai thì, dù có yesterday.
  - type: explain
    text:
      vi: "Ba quy tắc chính tả: tận cùng -e thì chỉ thêm -d (like → liked); phụ âm + y thì đổi thành -ied (study → studied), nhưng nguyên âm + y thì giữ y (play → played); từ ngắn kết thúc bằng một nguyên âm + một phụ âm thì gấp đôi phụ âm (stop → stopped)."
  - type: explain
    text:
      vi: "-ed có ba cách đọc: /ɪd/ sau âm /t/ hoặc /d/ (visited, started) - thêm một âm tiết; /t/ sau âm vô thanh như /k/, /p/, /s/, /ʃ/, /tʃ/ (cooked, stopped, watched); /d/ sau các âm còn lại (played, cleaned, stayed)."
  - type: deep_explain
    text:
      vi: Cách nhận âm vô thanh - đặt tay lên cổ họng, nếu không thấy rung khi phát âm cuối (như /k/, /p/, /s/) thì -ed đọc /t/. Người Việt quen âm cuối đơn nên hay nuốt mất -ed, khiến cooked nghe thành cook; hãy bật nhẹ âm cuối. Quy tắc gấp đôi phụ âm chỉ áp dụng khi trọng âm rơi vào âm tiết cuối - visit nhấn âm đầu nên viết visited, không gấp đôi t.
  - type: example
    target: Yesterday I cleaned my room and cooked dinner.
    target_lang: en
    translation:
      vi: Hôm qua mình dọn phòng và nấu bữa tối.
    note:
      vi: Cả hai động từ đều thêm -ed. Cleaned đọc /d/, cooked đọc /t/.
  - type: example
    target: Last Sunday we visited our grandparents.
    target_lang: en
    translation:
      vi: Chủ Nhật tuần trước chúng mình đến thăm ông bà.
    note:
      vi: Visited đọc /ˈvɪzɪtɪd/ - thêm một âm tiết /ɪd/ vì visit tận cùng bằng âm /t/. Visit không cần to.
  - type: example
    target: She studied all evening, then she stopped and listened to music.
    target_lang: en
    translation:
      vi: Cô ấy học cả buổi tối, rồi dừng lại nghe nhạc.
    note:
      vi: Study → studied (đổi y), stop → stopped (gấp đôi p), listen to → listened to.
  - type: example
    target: The film started at eight, so we stayed at home until seven thirty.
    target_lang: en
    translation:
      vi: Phim bắt đầu lúc tám giờ nên chúng mình ở nhà đến bảy rưỡi.
    note:
      vi: Stay giữ y vì trước y là nguyên âm a - stayed.
  - type: common_mistake
    wrong: Yesterday I watch TV with my family.
    right: Yesterday I watched TV with my family.
    target_lang: en
    note:
      vi: Có yesterday vẫn phải thêm -ed. Tiếng Anh đánh dấu quá khứ ngay trên động từ, không như tiếng Việt.
  - type: common_mistake
    wrong: I was cook dinner last night.
    right: I cooked dinner last night.
    target_lang: en
    note:
      vi: Người Việt hay dùng was như "đã". Was không đi với động từ nguyên mẫu; chỉ cần cooked.
  - type: common_mistake
    wrong: He studyed for the test and stoped at nine.
    right: He studied for the test and stopped at nine.
    target_lang: en
    note:
      vi: Phụ âm + y đổi thành -ied; stop ngắn, kết thúc bằng nguyên âm + phụ âm nên gấp đôi p.
  - type: summary
    points:
      - vi: Việc đã xảy ra và kết thúc → quá khứ đơn; động từ có quy tắc thêm -ed, giống nhau mọi chủ ngữ.
      - vi: Có yesterday, last week… vẫn phải đổi động từ. Không dùng was + động từ nguyên mẫu.
      - vi: Chính tả - like → liked, study → studied, play → played, stop → stopped.
      - vi: Phát âm - /ɪd/ sau /t/, /d/; /t/ sau âm vô thanh; /d/ sau các âm còn lại.
exercises:
  # ---------------- recognition ----------------
  - key: en:exercise:past-regular-mcq-watched
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 1
    item: en:item:past-simple-regular
    prompt:
      stem: "Chọn câu đúng: \"Hôm qua mình xem một bộ phim.\""
      stem_lang: vi
      options:
        - { id: u5r, text: Yesterday I watched a film., lang: en }
        - { id: c1x, text: Yesterday I watch a film., lang: en }
        - { id: j8m, text: Yesterday I was watch a film., lang: en }
        - { id: o3e, text: Yesterday I watching a film., lang: en }
    answer:
      correct_option_id: u5r
    explanation:
      vi: Việc đã xong trong quá khứ nên dùng watched. Watch thiếu dấu hiệu quá khứ dù có yesterday; was watch và watching không phải dạng quá khứ đơn.
    display_answer: Yesterday I watched a film.

  - key: en:exercise:past-regular-mcq-spelling
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:ed-spelling
    prompt:
      stem: Dạng quá khứ của study viết thế nào?
      stem_lang: vi
      options:
        - { id: i4w, text: studyed, lang: en }
        - { id: v9a, text: studied, lang: en }
        - { id: l2h, text: studed, lang: en }
        - { id: e6q, text: studdied, lang: en }
    answer:
      correct_option_id: v9a
    explanation:
      vi: Study tận cùng bằng phụ âm d + y, nên đổi y thành i rồi thêm -ed - studied. Không gấp đôi d vì quy tắc gấp đôi chỉ áp dụng khi tận cùng là nguyên âm + phụ âm.
    display_answer: studied

  - key: en:exercise:past-regular-mcq-sound
    type: mcq
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:ed-pronunciation
    prompt:
      stem: Trong từ nào đuôi -ed được đọc thành một âm tiết riêng /ɪd/?
      stem_lang: vi
      options:
        - { id: s7k, text: cooked, lang: en }
        - { id: a3n, text: played, lang: en }
        - { id: w8d, text: started, lang: en }
        - { id: g5y, text: cleaned, lang: en }
    answer:
      correct_option_id: w8d
    explanation:
      vi: Start tận cùng bằng âm /t/, nên -ed đọc /ɪd/ - STAR-tid. Cooked đọc /t/ (sau /k/), played và cleaned đọc /d/.
    display_answer: started

  - key: en:exercise:past-regular-listen-visited
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: en:item:visited
    prompt:
      audio_asset_id: null
      fallback_text: We visited our grandparents last Sunday.
      options:
        - { id: b6t, text: Chủ Nhật tuần trước chúng tôi đến thăm ông bà., lang: vi }
        - { id: r2o, text: Chủ Nhật nào chúng tôi cũng đến thăm ông bà., lang: vi }
        - { id: h4c, text: Chủ Nhật tới chúng tôi sẽ đến thăm ông bà., lang: vi }
        - { id: m9z, text: Chủ Nhật tuần trước ông bà đến thăm chúng tôi., lang: vi }
    answer:
      correct_option_id: b6t
    explanation:
      vi: Visited (có đuôi /ɪd/) và last Sunday cho biết việc đã xảy ra tuần trước. Chủ ngữ là we nên chính "chúng tôi" đi thăm ông bà.
    display_answer: Chủ Nhật tuần trước chúng tôi đến thăm ông bà.

  - key: en:exercise:past-regular-fill-hinted
    type: fill_blank
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:cleaned
    prompt:
      template: "Last Saturday I {{b1}} (clean) my room, and my brother {{b2}} (play) football."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 6 }
      hint_levels:
        - "Nghĩa của câu: Thứ Bảy tuần trước mình dọn phòng, còn em trai mình chơi bóng đá."
        - "Gợi ý: cả hai việc đã xảy ra, thêm -ed; play giữ nguyên y."
    answer:
      blanks:
        b1: [cleaned]
        b2: [played]
    known_wrong:
      - answer: clean
        feedback_vi: Việc đã xảy ra vào thứ Bảy vừa qua, nên thêm -ed.
        error_tag: no_past_marking
      - answer: play
        feedback_vi: Việc đã xảy ra vào thứ Bảy vừa qua, nên thêm -ed.
        error_tag: no_past_marking
      - answer: plaied
        feedback_vi: Trước y là nguyên âm a nên giữ y - played.
        error_tag: ed_spelling
      - answer: cleanned
        feedback_vi: Clean có hai nguyên âm ea trước n nên không gấp đôi phụ âm - cleaned.
        error_tag: ed_spelling
    explanation:
      vi: Hai việc đã xảy ra nên dùng quá khứ đơn - cleaned, played. Play có nguyên âm trước y nên chỉ thêm -ed.
    display_answer: Last Saturday I cleaned my room, and my brother played football.

  - key: en:exercise:past-regular-order-music
    type: word_bank
    stage: recognition
    answer_lang: en
    difficulty: 2
    item: en:item:listened-to
    prompt:
      instruction: "Sắp xếp thành câu tiếng Anh: \"Chúng mình ở nhà và nghe nhạc.\""
      tokens:
        - { id: w-music, text: music }
        - { id: w-and, text: and }
        - { id: w-listen, text: listen }
        - { id: w-stayed, text: stayed }
        - { id: w-to, text: to }
        - { id: w-home, text: home }
        - { id: w-we, text: We }
        - { id: w-listened, text: listened }
        - { id: w-at, text: at }
        - { id: w-stay, text: stay }
    answer:
      orders:
        - [w-we, w-stayed, w-at, w-home, w-and, w-listened, w-to, w-music]
        - [w-we, w-listened, w-to, w-music, w-and, w-stayed, w-at, w-home]
        - [w-we, w-stayed, w-home, w-and, w-listened, w-to, w-music]
        - [w-we, w-listened, w-to, w-music, w-and, w-stayed, w-home]
    explanation:
      vi: Hai việc đã xảy ra nên dùng stayed và listened. Listen luôn cần to trước thứ được nghe - listened to music.
    display_answer: We stayed at home and listened to music.

