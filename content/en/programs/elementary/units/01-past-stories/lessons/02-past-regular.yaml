        error_tag: ed_spelling
      - answer: stoped
        feedback_vi: Stop ngắn, tận cùng nguyên âm + phụ âm, nên gấp đôi p - stopped.
        error_tag: ed_spelling
      - answer: visitted
        feedback_vi: Visit nhấn âm đầu nên không gấp đôi t - visited.
        error_tag: ed_spelling
      - answer: study
        feedback_vi: Chuyện xảy ra Chủ Nhật tuần trước nên động từ phải ở quá khứ.
        error_tag: no_past_marking
      - answer: stop
        feedback_vi: Chuyện xảy ra Chủ Nhật tuần trước nên động từ phải ở quá khứ.
        error_tag: no_past_marking
      - answer: visit
        feedback_vi: Chuyện xảy ra Chủ Nhật tuần trước nên động từ phải ở quá khứ.
        error_tag: no_past_marking
    explanation:
      vi: Study → studied (phụ âm + y), stop → stopped (gấp đôi phụ âm), visit → visited (trọng âm ở âm đầu nên chỉ thêm -ed).
    display_answer: Last Sunday Mai studied in the morning, stopped at a café for lunch and visited her aunt.

  - key: en:exercise:past-regular-translate-cooked
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 2
    item: en:item:cooked
    prompt:
      source_text: Hôm qua bố tôi nấu bữa tối.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - My father cooked dinner yesterday.
        - My dad cooked dinner yesterday.
        - Yesterday my father cooked dinner.
        - Yesterday, my father cooked dinner.
        - Yesterday my dad cooked dinner.
        - Yesterday, my dad cooked dinner.
        - My father made dinner yesterday.
        - My dad made dinner yesterday.
        - Yesterday my father made dinner.
        - Yesterday my dad made dinner.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: Yesterday my father cook dinner.
        feedback_vi: Có yesterday vẫn phải đổi động từ - cooked.
        error_tag: no_past_marking
      - answer: My father cook dinner yesterday.
        feedback_vi: Có yesterday vẫn phải đổi động từ - cooked.
        error_tag: no_past_marking
      - answer: My father was cook dinner yesterday.
        feedback_vi: Không dùng was + động từ nguyên mẫu; chỉ cần cooked.
        error_tag: was_plus_verb
      - answer: My father cooks dinner yesterday.
        feedback_vi: Cooks là hiện tại; việc xảy ra hôm qua nên dùng cooked.
        error_tag: no_past_marking
    explanation:
      vi: Việc đã xong hôm qua nên dùng quá khứ đơn cooked, giống nhau với mọi chủ ngữ. Yesterday đặt cuối câu hoặc đầu câu đều được.
    display_answer: My father cooked dinner yesterday.

  - key: en:exercise:past-regular-translate-started
    type: translate
    stage: recall
    answer_lang: en
    difficulty: 3
    item: en:item:started
    prompt:
      source_text: Tối qua buổi hòa nhạc bắt đầu lúc tám giờ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - The concert started at eight o'clock last night.
        - The concert started at eight last night.
        - The concert started at 8 o'clock last night.
        - The concert started at 8 last night.
        - Last night the concert started at eight o'clock.
        - Last night, the concert started at eight o'clock.
        - Last night the concert started at eight.
        - Last night the concert started at 8.
        - The concert began at eight o'clock last night.
        - Last night the concert began at eight o'clock.
        - The concert began at eight last night.
        - Last night the concert began at eight.
        - The concert started at 8 p.m. last night.
        - The concert started at 8pm last night.
    rubric:
      typo_tolerance: 1
    known_wrong:
      - answer: The concert start at eight o'clock last night.
        feedback_vi: Việc xảy ra tối qua nên dùng started.
        error_tag: no_past_marking
      - answer: The concert was start at eight o'clock last night.
        feedback_vi: Không dùng was + động từ nguyên mẫu; chỉ cần started.
        error_tag: was_plus_verb
      - answer: The concert started in eight o'clock last night.
        feedback_vi: Giờ cụ thể dùng at - at eight o'clock.
        error_tag: time_preposition
      - answer: The concert started at eight o'clock yesterday night.
        feedback_vi: "\"Tối qua\" là last night, không nói yesterday night."
        error_tag: last_night
    explanation:
      vi: Start → started (đọc /ɪd/ vì sau âm /t/). Giờ cụ thể dùng at; "tối qua" là last night.
    display_answer: The concert started at eight o'clock last night.

