  - key: en:exercise:past-regular-mcq-sunday
    type: mcq
    stage: application
    answer_lang: en
    difficulty: 3
    item: en:item:past-simple-regular
    prompt:
      stem: "Thứ Hai, đồng nghiệp hỏi: \"What did you do on Sunday?\" Bạn muốn kể mình đã dọn nhà và nấu bữa trưa cho cả nhà. Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: k8f, text: I cleaned the house and cooked lunch for my family., lang: en }
        - { id: p1v, text: I clean the house and cook lunch for my family., lang: en }
        - { id: x6s, text: I was clean the house and cook lunch for my family., lang: en }
        - { id: q3j, text: I cleaned the house and cook lunch for my family., lang: en }
    answer:
