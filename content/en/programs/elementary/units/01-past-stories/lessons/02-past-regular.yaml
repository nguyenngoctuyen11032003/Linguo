    difficulty: 3
    item: en:item:ed-spelling
    prompt:
      template: "Last Sunday Mai {{b1}} (study) in the morning, {{b2}} (stop) at a café for lunch and {{b3}} (visit) her aunt."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 7 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [studied]
        b2: [stopped]
        b3: [visited]
    known_wrong:
