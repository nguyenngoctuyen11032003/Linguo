items:
  # ================= Bài 1: Mệnh đề quan hệ Nominativ/Akkusativ =================
  - key: de:item:b1u02-g-relativsatz-nom-akk
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Relativsatz (Nominativ/Akkusativ): der Freund, der mir hilft · der Freund, den ich kenne"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Mệnh đề quan hệ bổ nghĩa cho một danh từ, giống phần \"mà …\" trong tiếng Việt; nó mở đầu bằng đại từ quan hệ, động từ chia đứng cuối và có dấu phẩy ngăn cách với câu chính. Nominativ: der, die, das, die (số nhiều); Akkusativ: den, die, das, die. Chỉ giống đực số ít có hai dạng khác nhau: der (chủ ngữ) và den (tân ngữ)."
      examples:
        - target: Paul ist ein Freund, der immer ehrlich ist.
          translation:
            vi: Paul là một người bạn luôn thành thật.
        - target: Der Film, den wir gestern gesehen haben, war sehr lustig.
          translation:
            vi: Bộ phim mà chúng tôi xem hôm qua rất buồn cười.
        - target: Die Leute, die neben uns wohnen, sind sehr hilfsbereit.
          translation:
            vi: Những người sống cạnh nhà chúng tôi rất hay giúp đỡ.
      confusion:
        vi: "Khi mệnh đề quan hệ chen vào giữa câu chính, cần dấu phẩy ở cả hai đầu: Der Film, den wir gesehen haben, war lustig."

  - key: de:item:b1u02-g-relativpronomen-wahl
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Relativpronomen wählen: Genus und Numerus vom Nomen, Kasus aus dem Relativsatz"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Giống và số của đại từ quan hệ lấy theo danh từ đứng trước nó (der Freund → der/den, die Freundin → die, das Kind → das, số nhiều → die). Cách thì lấy theo vai trò của nó trong chính mệnh đề quan hệ, không theo câu chính. Ich kenne den Mann, der dort steht: câu chính có den Mann, nhưng trong mệnh đề quan hệ người đàn ông là chủ ngữ của steht nên dùng der."
      examples:
        - target: Ich kenne den Mann, der dort an der Tür steht.
          translation:
            vi: Tôi biết người đàn ông đang đứng ở cửa đằng kia.
        - target: Der Mann, den du dort siehst, ist mein Nachbar.
          translation:
            vi: Người đàn ông mà bạn thấy ở đằng kia là hàng xóm của tôi.
      confusion:
        vi: "Mẹo: tách mệnh đề quan hệ thành một câu riêng – Der Mann steht dort (chủ ngữ → der); Du siehst den Mann (tân ngữ → den). Với người, không dùng was hay wo làm đại từ quan hệ."

  - key: de:item:b1u02-freundschaft
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Freundschaft, -en
      pos: danh từ
    back:
      meaning:
        vi: tình bạn
      examples:
        - target: Für mich ist Freundschaft sehr wichtig.
          translation:
            vi: Với tôi, tình bạn rất quan trọng.
        - target: Unsere Freundschaft hat in der Schule begonnen.
          translation:
            vi: Tình bạn của chúng tôi bắt đầu từ hồi đi học.
      confusion:
        vi: "Danh từ đuôi -schaft là giống cái: die Freundschaft, die Mannschaft. Ghép với Freund (der) nhưng giống theo đuôi -schaft."

  - key: de:item:b1u02-vertrauen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: vertrauen (+ Dativ)
      pos: động từ
    back:
      meaning:
        vi: tin tưởng, tin cậy (ai)
      examples:
        - target: Ich vertraue meiner besten Freundin.
          translation:
            vi: Tôi tin tưởng người bạn thân nhất của mình.
        - target: Vertraust du ihm?
          translation:
            vi: Bạn có tin anh ấy không?
      confusion:
        vi: "vertrauen đi với Dativ: Ich vertraue dir (không nói Ich vertraue dich). Danh từ tương ứng là das Vertrauen (lòng tin)."

  - key: de:item:b1u02-ehrlich
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: ehrlich
      pos: tính từ
    back:
      meaning:
        vi: thành thật, trung thực
      examples:
        - target: Er ist immer ehrlich zu mir.
          translation:
            vi: Anh ấy luôn thành thật với tôi.
        - target: Ehrlich gesagt habe ich heute keine Lust.
          translation:
            vi: Nói thật là hôm nay tôi không có hứng.
      confusion:
        vi: "ehrlich zu + Dativ = thành thật với ai. ehrlich gesagt (nói thật thì) đứng ở đầu câu."

  - key: de:item:b1u02-hilfsbereit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: hilfsbereit
      pos: tính từ
    back:
      meaning:
        vi: hay giúp đỡ, sẵn lòng giúp người khác
      examples:
        - target: Meine Nachbarin ist sehr hilfsbereit.
          translation:
            vi: Chị hàng xóm của tôi rất hay giúp đỡ người khác.
        - target: Die Kollegen sind nett und hilfsbereit.
          translation:
            vi: Các đồng nghiệp dễ mến và sẵn lòng giúp đỡ.
      confusion:
        vi: "Từ ghép: die Hilfe (sự giúp đỡ) + s + bereit (sẵn sàng)."

  - key: de:item:b1u02-charakter
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Charakter, -e
      ipa: /kaˈʁaktɐ/
      pos: danh từ
    back:
      meaning:
        vi: tính cách
      examples:
        - target: Sie hat einen starken Charakter.
          translation:
            vi: Cô ấy có tính cách mạnh mẽ.
        - target: Mein Bruder und ich haben ganz verschiedene Charaktere.
          translation:
            vi: Anh trai tôi và tôi có tính cách hoàn toàn khác nhau.
      pronunciation_note:
        vi: "Ch ở đầu từ này đọc như \"k\", trọng âm ở âm tiết thứ hai: Cha-RAK-ter. Ở số nhiều die Charaktere, trọng âm chuyển sang -te-: /kaʁakˈteːʁə/."

  - key: de:item:b1u02-eigenschaft
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Eigenschaft, -en
      pos: danh từ
    back:
      meaning:
        vi: đặc điểm, phẩm chất, tính chất
      examples:
        - target: Welche Eigenschaften hat ein guter Freund?
          translation:
            vi: Một người bạn tốt có những phẩm chất gì?
        - target: Ehrlichkeit ist für mich die wichtigste Eigenschaft.
          translation:
            vi: Với tôi, sự thành thật là phẩm chất quan trọng nhất.
      confusion:
        vi: "der Charakter là toàn bộ tính cách của một người; die Eigenschaft là một đặc điểm riêng lẻ (ehrlich, geduldig, neugierig …)."

  - key: de:item:b1u02-kennenlernen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: kennenlernen (lernt kennen, hat kennengelernt)
      pos: động từ
    back:
      meaning:
        vi: làm quen, bắt đầu quen (ai, cái gì)
      examples:
        - target: Wo habt ihr euch kennengelernt?
          translation:
            vi: Hai bạn quen nhau ở đâu?
        - target: In Deutschland möchte ich viele neue Leute kennenlernen.
          translation:
            vi: Ở Đức tôi muốn làm quen với nhiều người mới.
      confusion:
        vi: "kennen = biết, đã quen; kennenlernen = lần đầu gặp và bắt đầu quen. Khi chia, hai phần tách ra: Ich lerne ihn kennen; Perfekt: Ich habe ihn kennengelernt."

  - key: de:item:b1u02-partner
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Partner, -
      pos: danh từ
    back:
      meaning:
        vi: bạn đời, người yêu; đối tác, bạn cùng làm
      examples:
        - target: Mein Partner und ich wohnen seit zwei Jahren zusammen.
          translation:
            vi: Bạn đời của tôi và tôi sống chung đã hai năm.
        - target: Für die Übung brauchst du einen Partner.
          translation:
            vi: Để làm bài luyện này bạn cần một bạn cùng làm.
      confusion:
        vi: "Dạng nữ: die Partnerin, -nen. Người Đức hay nói mein Partner / meine Partnerin cho người yêu hoặc bạn đời, dù đã cưới hay chưa."

  - key: de:item:b1u02-beziehung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Beziehung, -en
      pos: danh từ
    back:
      meaning:
        vi: mối quan hệ; quan hệ yêu đương
      examples:
        - target: Wir haben eine gute Beziehung zu unseren Nachbarn.
          translation:
            vi: Chúng tôi có quan hệ tốt với hàng xóm.
        - target: Bist du gerade in einer Beziehung?
          translation:
            vi: Hiện giờ bạn có đang yêu ai không?
      confusion:
        vi: "Quan hệ với ai: eine Beziehung zu + Dativ. Đứng một mình, in einer Beziehung sein thường có nghĩa là đang có người yêu."

  # Từ bổ sung (Zusatzwortschatz) bài 1 – tình bạn, tính cách
  - key: de:item:b1u02-treu
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: treu
      pos: tính từ
    back:
      meaning:
        vi: chung thủy, trung thành
      examples:
        - target: Ein treuer Freund hilft dir auch in schweren Zeiten.
          translation:
            vi: Một người bạn trung thành giúp bạn cả trong lúc khó khăn.
        - target: Er ist seiner Frau immer treu geblieben.
          translation:
            vi: Anh ấy luôn chung thủy với vợ.
      confusion:
        vi: "Chung thủy với ai: jemandem treu sein (Dativ, không có giới từ)."

  - key: de:item:b1u02-egoistisch
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: egoistisch
      ipa: /eɡoˈɪstɪʃ/
      pos: tính từ
    back:
      meaning:
        vi: ích kỷ
      examples:
        - target: Sei nicht so egoistisch!
          translation:
            vi: Đừng ích kỷ như vậy!
        - target: Ich finde sein Verhalten sehr egoistisch.
          translation:
            vi: Tôi thấy cách cư xử của anh ấy rất ích kỷ.
      pronunciation_note:
        vi: "o và i đọc tách thành hai âm tiết: e-go-is-tisch, trọng âm ở -is-."

  - key: de:item:b1u02-neugierig
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: neugierig
      pos: tính từ
    back:
      meaning:
        vi: tò mò
      examples:
        - target: Kinder sind sehr neugierig.
          translation:
            vi: Trẻ con rất tò mò.
        - target: Ich bin neugierig – wie ist dein neuer Freund?
          translation:
            vi: Mình tò mò quá – bạn trai mới của bạn thế nào?
      confusion:
        vi: "neugierig auf + Akkusativ = tò mò, háo hức muốn biết về điều gì: Ich bin neugierig auf das Ergebnis."

  - key: de:item:b1u02-grosszuegig
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: großzügig
      pos: tính từ
    back:
      meaning:
        vi: hào phóng, rộng rãi
      examples:
        - target: Mein Onkel ist sehr großzügig.
          translation:
            vi: Chú tôi rất hào phóng.
        - target: Vielen Dank für das großzügige Geschenk!
          translation:
            vi: Cảm ơn nhiều vì món quà hào phóng!
      confusion:
        vi: "Trái nghĩa thường gặp: geizig (keo kiệt)."

  - key: de:item:b1u02-humorvoll
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: humorvoll
      pos: tính từ
    back:
      meaning:
        vi: hài hước, có khiếu hài hước
      examples:
        - target: Meine Kollegin ist klug und humorvoll.
          translation:
            vi: Đồng nghiệp của tôi thông minh và hài hước.
        - target: Ich suche einen humorvollen Partner.
          translation:
            vi: Tôi tìm một người bạn đời có khiếu hài hước.
      confusion:
        vi: "Đuôi -voll nghĩa là \"đầy, có nhiều\": der Humor → humorvoll. Cũng có thể nói: Er hat viel Humor."

  - key: de:item:b1u02-kumpel
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Kumpel, -
      pos: danh từ
    back:
      meaning:
        vi: bạn, bạn thân (khẩu ngữ)
      examples:
        - target: Tom ist ein alter Kumpel von mir.
          translation:
            vi: Tom là bạn lâu năm của tôi.
        - target: Mein Kumpel hilft mir am Samstag beim Umzug.
          translation:
            vi: Thứ bảy, bạn tôi giúp tôi chuyển nhà.
      confusion:
        vi: "Từ khẩu ngữ, dùng khi nói chuyện thân mật. Số nhiều là die Kumpel, khi nói cũng hay nghe die Kumpels."

  - key: de:item:b1u02-freundeskreis
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Freundeskreis, -e
      pos: danh từ
    back:
      meaning:
        vi: nhóm bạn, vòng bạn bè
      examples:
        - target: Sie hat einen großen Freundeskreis.
          translation:
            vi: Cô ấy có rất nhiều bạn bè.
        - target: In meinem Freundeskreis sprechen alle Deutsch.
          translation:
            vi: Trong nhóm bạn của tôi, ai cũng nói tiếng Đức.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối: der Kreis (vòng tròn) → der Freundeskreis; giữa hai từ có -es-."

  - key: de:item:b1u02-sich-melden
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich melden (bei + Dativ)
      pos: động từ
    back:
      meaning:
        vi: liên lạc, báo tin (cho ai)
      examples:
        - target: Melde dich, wenn du in Berlin bist!
          translation:
            vi: Khi nào đến Berlin thì liên lạc với mình nhé!
        - target: Er hat sich lange nicht bei mir gemeldet.
          translation:
            vi: Lâu rồi anh ấy không liên lạc với tôi.
      confusion:
        vi: "sich bei jemandem melden = gọi điện, nhắn tin cho ai. Khác anmelden (đăng ký) ở A1."

  # ================= Bài 2: Mệnh đề quan hệ Dativ và có giới từ =================
  - key: de:item:b1u02-g-relativsatz-dativ
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Relativsatz im Dativ: dem, der, dem, denen"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Khi danh từ đóng vai Dativ trong mệnh đề quan hệ (ví dụ sau helfen, danken, vertrauen, erzählen), đại từ quan hệ ở Dativ: dem (giống đực), der (giống cái), dem (giống trung), denen (số nhiều). Dạng số nhiều denen khác mạo từ den, và đây là chỗ hay sai nhất. Động từ vẫn đứng cuối, dấu phẩy ở hai bên."
      examples:
        - target: Das ist die Kollegin, der ich am meisten vertraue.
          translation:
            vi: Đó là chị đồng nghiệp mà tôi tin tưởng nhất.
        - target: Die Freunde, denen ich geholfen habe, haben mich zum Essen eingeladen.
          translation:
            vi: Những người bạn mà tôi đã giúp đã mời tôi đi ăn.
        - target: Der Mann, dem das Auto gehört, wohnt neben uns.
          translation:
            vi: Người đàn ông sở hữu chiếc xe sống cạnh nhà chúng tôi.
      confusion:
        vi: "Đừng nhầm denen (đại từ quan hệ Dativ số nhiều) với den (mạo từ Dativ số nhiều: mit den Kindern, hoặc Akkusativ giống đực: den Mann)."

  - key: de:item:b1u02-g-relativsatz-praeposition
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Relativsatz mit Präposition: die Frau, mit der ich … · der Film, über den wir …"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Nếu động từ trong mệnh đề quan hệ cần giới từ (sprechen über, sich verlieben in, zusammenleben mit …), giới từ đứng ngay trước đại từ quan hệ, ở đầu mệnh đề: die Frau, mit der ich zusammenlebe. Giới từ quyết định cách: mit + Dativ → mit dem/der/denen; über + Akkusativ → über den/die/das. Tiếng Đức không để giới từ ở cuối mệnh đề như tiếng Anh hay tiếng Việt."
      examples:
        - target: Der Film, über den wir gestern gesprochen haben, läuft jetzt im Kino.
          translation:
            vi: Bộ phim mà hôm qua chúng ta nói tới giờ đang chiếu ở rạp.
        - target: Die Stadt, in der wir uns kennengelernt haben, liegt am Meer.
          translation:
            vi: Thành phố nơi chúng tôi quen nhau nằm bên bờ biển.
        - target: Thomas ist der Mann, mit dem ich seit zehn Jahren verheiratet bin.
          translation:
            vi: Thomas là người đàn ông mà tôi đã kết hôn được mười năm.
      confusion:
        vi: "Với nơi chốn có thể dùng wo thay cho giới từ + đại từ: die Stadt, wo wir uns kennengelernt haben. Với người thì cần giới từ + đại từ quan hệ: die Freundin, mit der ich wohne."

  - key: de:item:b1u02-liebe
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Liebe (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: tình yêu
      examples:
        - target: Bei uns war es Liebe auf den ersten Blick.
          translation:
            vi: Với chúng tôi, đó là tình yêu sét đánh.
        - target: Ihre Liebe zur Musik hat sie von ihrem Vater.
          translation:
            vi: Tình yêu âm nhạc của cô ấy là do bố truyền lại.
      confusion:
        vi: "Liebe / Lieber ở đầu thư (Liebe Lan, Lieber Minh) là tính từ lieb (thân mến), không phải danh từ die Liebe. Tình yêu đối với điều gì: die Liebe zu + Dativ."

  - key: de:item:b1u02-sich-verlieben-in
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich verlieben in (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: phải lòng, bắt đầu yêu (ai)
      examples:
        - target: Sie hat sich sofort in ihn verliebt.
          translation:
            vi: Cô ấy phải lòng anh ấy ngay lập tức.
        - target: Ich habe mich im Urlaub in einen Spanier verliebt.
          translation:
            vi: Trong kỳ nghỉ tôi đã phải lòng một anh chàng người Tây Ban Nha.
      confusion:
        vi: "sich verlieben in = bắt đầu yêu (sự việc); trạng thái đang yêu dùng tính từ: in jemanden verliebt sein (Ich bin in ihn verliebt). Perfekt dùng haben: Sie hat sich verliebt."

  - key: de:item:b1u02-sich-trennen
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich trennen (von + Dativ)
      pos: động từ
    back:
      meaning:
        vi: chia tay (ai), chia tay nhau
      examples:
        - target: Sie haben sich nach fünf Jahren getrennt.
          translation:
            vi: Họ chia tay nhau sau năm năm.
        - target: Anna hat sich von ihrem Freund getrennt.
          translation:
            vi: Anna đã chia tay bạn trai.
      confusion:
        vi: "Có sich: chia tay (sich von jemandem trennen). Không có sich (A2U08): tách, phân loại – den Müll trennen."

  - key: de:item:b1u02-trennung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Trennung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự chia tay, sự chia cắt
      examples:
        - target: Nach der Trennung war er lange traurig.
          translation:
            vi: Sau khi chia tay, anh ấy buồn rất lâu.
        - target: Die Trennung war für beide nicht leicht.
          translation:
            vi: Việc chia tay không dễ dàng với cả hai người.
      confusion:
        vi: "Danh từ đuôi -ung là giống cái: die Trennung, die Beziehung, die Enttäuschung."

  - key: de:item:b1u02-ehe
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Ehe, -n
      ipa: /ˈeːə/
      pos: danh từ
    back:
      meaning:
        vi: hôn nhân, cuộc hôn nhân
      examples:
        - target: Nach zwanzig Jahren Ehe lieben sie sich immer noch.
          translation:
            vi: Sau hai mươi năm chung sống, họ vẫn yêu nhau.
        - target: Ihre Ehe ist sehr glücklich.
          translation:
            vi: Cuộc hôn nhân của họ rất hạnh phúc.
      pronunciation_note:
        vi: "h giữa hai nguyên âm không đọc, chỉ làm e đầu dài: E-he đọc là /ˈeːə/."

  - key: de:item:b1u02-ehemann
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Ehemann, ¨-er
      pos: danh từ
    back:
      meaning:
        vi: người chồng
      examples:
        - target: Ihr Ehemann arbeitet als Koch.
          translation:
            vi: Chồng cô ấy làm đầu bếp.
        - target: Das ist mein Ehemann Thomas.
          translation:
            vi: Đây là Thomas, chồng tôi.
      confusion:
        vi: "Khi nói, người Đức thường nói mein Mann (chồng tôi); der Ehemann trang trọng hơn hoặc dùng để nói rõ. Số nhiều: die Ehemänner."

  - key: de:item:b1u02-ehefrau
