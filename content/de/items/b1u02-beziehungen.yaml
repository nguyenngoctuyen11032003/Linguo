      meaning:
        vi: người độc thân
      examples:
        - target: In Großstädten leben viele Singles.
          translation:
            vi: Ở các thành phố lớn có nhiều người sống độc thân.
        - target: Ich bin seit einem Jahr Single.
          translation:
            vi: Tôi độc thân được một năm rồi.
      confusion:
        vi: "Từ mượn tiếng Anh, đọc gần như trong tiếng Anh. Sau sein thường không có mạo từ: Ich bin Single."

  # ================= Bài 3: darauf / worauf, động từ + giới từ =================
  - key: de:item:b1u02-g-pronominaladverbien
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "da(r)- / wo(r)- + Präposition: darauf, damit, darüber · worauf, womit, worüber · aber Personen: auf ihn, mit wem"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Khi nói về vật hay sự việc, tiếng Đức thay giới từ + đại từ bằng da(r)- + giới từ (auf das Wochenende → darauf, mit dem Ergebnis → damit), và câu hỏi dùng wo(r)- + giới từ: Worauf freust du dich? Chữ r được chèn vào khi giới từ bắt đầu bằng nguyên âm (darüber, woran), không chèn khi bắt đầu bằng phụ âm (damit, wofür). Khi nói về người thì giữ giới từ + đại từ: auf ihn, mit ihr, Auf wen wartest du?"
      examples:
        - target: Worauf freust du dich? – Auf das Wochenende. Darauf freue ich mich schon lange.
          translation:
            vi: Bạn đang mong điều gì? – Cuối tuần. Mình mong nó lâu lắm rồi.
        - target: Mit wem hast du telefoniert? – Mit meiner Schwester. Ich telefoniere jeden Sonntag mit ihr.
          translation:
            vi: Bạn đã gọi điện với ai vậy? – Với chị gái mình. Chủ nhật nào mình cũng gọi cho chị ấy.
        - target: Hast du Zeit für das Projekt? – Nein, dafür habe ich leider keine Zeit.
          translation:
            vi: Bạn có thời gian cho dự án không? – Không, tiếc là mình không có thời gian cho việc đó.
      confusion:
        vi: "Không nói Ich freue mich auf es mà nói Ich freue mich darauf. Ngược lại, với người không dùng darauf: Ich warte auf ihn."

  - key: de:item:b1u02-g-verben-praeposition-b1
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Verben mit Präposition (B1): sich ärgern über, sich verlassen auf, sich kümmern um, sich gewöhnen an (+ Akk) · sich streiten mit, sich bedanken bei (+ Dat)"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Nhiều động từ phản thân đi với một giới từ cố định, và giới từ quyết định cách: über, auf, um, an trong các cụm này đi với Akkusativ, còn mit và bei đi với Dativ. Giới từ thường khác tiếng Việt (bực về → über, lo cho → um), nên hãy học cả cụm: động từ + giới từ + cách. Một số động từ có hai giới từ cho hai đối tượng: sich bei jemandem für etwas bedanken / entschuldigen."
      examples:
        - target: Ich ärgere mich über den Lärm.
          translation:
            vi: Tôi bực mình vì tiếng ồn.
        - target: Kann ich mich auf dich verlassen?
          translation:
            vi: Mình có thể trông cậy vào bạn không?
        - target: Ich muss mich noch an das Wetter in Deutschland gewöhnen.
          translation:
            vi: Tôi vẫn phải làm quen với thời tiết ở Đức.
      confusion:
        vi: "an, auf, über trong các cụm này đi với Akkusativ, không theo câu hỏi Wo?/Wohin?. Nhưng cũng có cụm dùng Dativ (Angst haben vor + Dativ), nên mỗi cụm phải học kèm cách của nó."

  - key: de:item:b1u02-sich-aergern-ueber
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich ärgern über (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: bực mình, tức (về điều gì, ai)
      examples:
        - target: Ich ärgere mich über den Lärm von nebenan.
          translation:
            vi: Tôi bực mình vì tiếng ồn từ nhà bên cạnh.
        - target: Ärgere dich nicht darüber!
          translation:
            vi: Đừng bực mình vì chuyện đó!
      confusion:
        vi: "Không có sich, ärgern + Akk nghĩa là chọc tức ai: Mein Bruder ärgert mich. Tính từ: ärgerlich (đáng bực mình)."

  - key: de:item:b1u02-sich-verlassen-auf
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich verlassen auf (+ Akk), verlässt sich, verließ sich, hat sich verlassen
      pos: động từ
    back:
      meaning:
        vi: tin cậy, trông cậy vào (ai, điều gì)
      examples:
        - target: Auf meine Schwester kann ich mich immer verlassen.
          translation:
            vi: Tôi luôn có thể trông cậy vào chị gái mình.
        - target: Kann ich mich darauf verlassen?
          translation:
            vi: Tôi có thể tin chắc vào điều đó không?
      confusion:
        vi: "verlassen + Akk không có sich (B1U01) nghĩa là rời bỏ, rời khỏi: Er hat seine Familie verlassen. Có sich + auf thì nghĩa là tin cậy."

  - key: de:item:b1u02-sich-kuemmern-um
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich kümmern um (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: chăm sóc, lo liệu (cho ai, việc gì)
      examples:
        - target: Wer kümmert sich um die Kinder?
          translation:
            vi: Ai chăm sóc bọn trẻ?
        - target: Keine Sorge, ich kümmere mich darum.
          translation:
            vi: Đừng lo, tôi sẽ lo việc đó.
      confusion:
        vi: "Tiếng Việt \"lo cho\" dễ khiến bạn dùng für, nhưng tiếng Đức là um: sich um jemanden kümmern."

  - key: de:item:b1u02-sich-streiten
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: "sich streiten, streitet sich, stritt sich, hat sich gestritten (mit + Dat, über + Akk)"
      pos: động từ
    back:
      meaning:
        vi: cãi nhau, tranh cãi
      examples:
        - target: Ich habe mich mit meinem Bruder gestritten.
          translation:
            vi: Tôi đã cãi nhau với anh trai.
        - target: Worüber streitet ihr euch?
          translation:
            vi: Các bạn cãi nhau về chuyện gì vậy?
      confusion:
        vi: "Cãi nhau với ai: mit + Dativ; cãi nhau về chuyện gì: über + Akkusativ. Danh từ: der Streit."

  - key: de:item:b1u02-sich-gewoehnen-an
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich gewöhnen an (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: làm quen với, quen dần với
      examples:
        - target: Ich habe mich an das kalte Wetter gewöhnt.
          translation:
            vi: Tôi đã quen với thời tiết lạnh.
        - target: Daran gewöhnst du dich schnell.
          translation:
            vi: Bạn sẽ quen với chuyện đó nhanh thôi.
      confusion:
        vi: "Quá trình: sich an etwas gewöhnen; trạng thái đã quen: an etwas gewöhnt sein (Ich bin daran gewöhnt)."

  - key: de:item:b1u02-sich-entschuldigen
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich entschuldigen (bei + Dat, für + Akk)
      pos: động từ
    back:
      meaning:
        vi: xin lỗi (ai, vì điều gì)
      examples:
        - target: Ich möchte mich bei dir für gestern entschuldigen.
          translation:
            vi: Mình muốn xin lỗi bạn về chuyện hôm qua.
        - target: Er hat sich für die Verspätung entschuldigt.
          translation:
            vi: Anh ấy đã xin lỗi vì đến muộn.
      confusion:
        vi: "Người nhận lời xin lỗi đi với bei + Dativ, lý do đi với für + Akkusativ. Câu ngắn Entschuldigung! / Entschuldige! dùng khi xin lỗi nhanh."

  - key: de:item:b1u02-sich-bedanken
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich bedanken (bei + Dat, für + Akk)
      pos: động từ
    back:
      meaning:
        vi: cảm ơn (ai, vì điều gì)
      examples:
        - target: Ich möchte mich bei Ihnen für Ihre Hilfe bedanken.
          translation:
            vi: Tôi muốn cảm ơn ông/bà vì đã giúp đỡ.
        - target: Hast du dich schon für das Geschenk bedankt?
          translation:
            vi: Bạn đã cảm ơn về món quà chưa?
      confusion:
        vi: "sich bei jemandem bedanken = danken + Dativ (Ich danke dir). sich bedanken nghe trang trọng hơn một chút."

  - key: de:item:b1u02-sich-unterhalten
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: "sich unterhalten, unterhält sich, unterhielt sich, hat sich unterhalten (mit + Dat, über + Akk)"
      pos: động từ
    back:
      meaning:
        vi: trò chuyện, nói chuyện (với ai, về điều gì)
      examples:
        - target: Wir haben uns lange über unsere Kindheit unterhalten.
          translation:
            vi: Chúng tôi trò chuyện rất lâu về tuổi thơ.
        - target: Worüber habt ihr euch unterhalten?
          translation:
            vi: Các bạn đã nói chuyện về gì vậy?
      confusion:
        vi: "unter- ở đây không tách: wir unterhalten uns, Partizip unterhalten (không có ge-)."

  # Từ bổ sung (Zusatzwortschatz) bài 3 – quan hệ hằng ngày
  - key: de:item:b1u02-sich-beschaeftigen-mit
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich beschäftigen mit (+ Dat)
      pos: động từ
    back:
      meaning:
        vi: bận bịu với, dành thời gian cho, tìm hiểu về (điều gì)
      examples:
        - target: Zurzeit beschäftige ich mich viel mit Fotografie.
          translation:
            vi: Dạo này tôi dành nhiều thời gian cho nhiếp ảnh.
        - target: Womit beschäftigst du dich in deiner Freizeit?
          translation:
            vi: Lúc rảnh bạn hay làm gì?
      confusion:
        vi: "mit luôn đi với Dativ: Womit? – Damit."

  - key: de:item:b1u02-sich-sorgen-machen-um
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich Sorgen machen um (+ Akk)
      pos: cụm động từ
    back:
      meaning:
        vi: lo lắng cho (ai, điều gì)
      examples:
        - target: Meine Mutter macht sich immer Sorgen um mich.
          translation:
            vi: Mẹ tôi lúc nào cũng lo cho tôi.
        - target: Mach dir keine Sorgen!
          translation:
            vi: Đừng lo!
      confusion:
        vi: "Đại từ phản thân ở đây là Dativ, hãy học như một cụm cố định: ich mache mir Sorgen, du machst dir Sorgen, er macht sich Sorgen."

  - key: de:item:b1u02-sich-verabreden
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich verabreden (mit + Dat)
      pos: động từ
    back:
      meaning:
        vi: hẹn gặp (ai)
      examples:
        - target: Ich habe mich mit Lisa zum Kaffee verabredet.
          translation:
            vi: Tôi đã hẹn Lisa đi uống cà phê.
        - target: Wollen wir uns für Samstag verabreden?
          translation:
            vi: Mình hẹn nhau thứ bảy nhé?
      confusion:
        vi: "Danh từ: die Verabredung (cuộc hẹn). Partizip không có ge-: verabredet."

  - key: de:item:b1u02-sich-wundern-ueber
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich wundern über (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: ngạc nhiên, lấy làm lạ (về điều gì)
      examples:
        - target: Ich wundere mich über sein Verhalten.
          translation:
            vi: Tôi lấy làm lạ về cách cư xử của anh ấy.
        - target: Wundere dich nicht, wenn er zu spät kommt.
          translation:
            vi: Đừng ngạc nhiên nếu anh ấy đến muộn.
      confusion:
        vi: "sich wundern thường là ngạc nhiên kèm chút khó hiểu; ngạc nhiên vui vì bất ngờ thì dùng überrascht sein."

  - key: de:item:b1u02-sich-versoehnen
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich versöhnen (mit + Dat)
      pos: động từ
    back:
      meaning:
        vi: làm lành, làm hòa (với ai)
      examples:
        - target: Nach dem Streit haben sie sich schnell wieder versöhnt.
          translation:
            vi: Sau trận cãi nhau, họ đã nhanh chóng làm lành.
        - target: Hast du dich mit deiner Schwester versöhnt?
          translation:
            vi: Bạn đã làm lành với chị gái chưa?
      confusion:
        vi: "Partizip không có ge-: versöhnt. Làm lành với ai: mit + Dativ."

  - key: de:item:b1u02-nachdenken-ueber
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: nachdenken über (+ Akk), denkt nach, dachte nach, hat nachgedacht
      pos: động từ
    back:
      meaning:
        vi: suy nghĩ kỹ (về điều gì)
      examples:
        - target: Ich muss noch darüber nachdenken.
          translation:
            vi: Tôi còn phải suy nghĩ thêm về chuyện đó.
        - target: Worüber denkst du nach?
          translation:
            vi: Bạn đang nghĩ ngợi về chuyện gì vậy?
      confusion:
        vi: "Động từ tách: Ich denke darüber nach. Khác denken an + Akk (nghĩ đến, nhớ đến): Ich denke an dich."

  - key: de:item:b1u02-sich-aufregen-ueber
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich aufregen über (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: nổi nóng, bực bội (về điều gì)
      examples:
        - target: Reg dich nicht so auf!
          translation:
            vi: Đừng nổi nóng như vậy!
        - target: Mein Vater regt sich über jede Kleinigkeit auf.
          translation:
            vi: Bố tôi chuyện nhỏ gì cũng nổi nóng.
      confusion:
        vi: "Động từ tách: Ich rege mich auf. Mạnh hơn sich ärgern. Tính từ aufgeregt thường có nghĩa khác: hồi hộp."

  - key: de:item:b1u02-streit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Streit, -e
      pos: danh từ
    back:
      meaning:
        vi: cuộc cãi nhau, sự tranh cãi
      examples:
        - target: Wir hatten gestern einen großen Streit.
          translation:
            vi: Hôm qua chúng tôi cãi nhau to.
        - target: Nach dem Streit haben wir lange nicht miteinander gesprochen.
          translation:
            vi: Sau trận cãi nhau, chúng tôi không nói chuyện với nhau một thời gian dài.
      confusion:
        vi: "Số nhiều die Streite ít dùng; nói nhiều vụ tranh chấp thường dùng die Streitigkeiten. Động từ: sich streiten."

  # ================= Bài 4: obwohl / trotzdem, tính từ + giới từ =================
  - key: de:item:b1u02-g-obwohl-trotzdem
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "obwohl + Nebensatz (Verb am Ende) ↔ trotzdem + Hauptsatz (Verb an Position 2)"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "obwohl (mặc dù) mở đầu câu phụ, động từ chia đứng cuối: Ich gehe zur Arbeit, obwohl ich krank bin. trotzdem (dù vậy) là trạng từ trong câu chính: đứng ở vị trí 1 thì động từ theo ngay sau (Trotzdem gehe ich zur Arbeit), hoặc đứng sau động từ (Ich gehe trotzdem zur Arbeit). Tiếng Việt nói \"mặc dù … nhưng …\", còn tiếng Đức không thêm aber sau câu obwohl."
      examples:
        - target: Obwohl ich müde bin, gehe ich noch mit dir ins Kino.
          translation:
            vi: Mặc dù mệt, mình vẫn đi xem phim với bạn.
        - target: Ich bin müde. Trotzdem gehe ich noch mit dir ins Kino.
          translation:
            vi: Mình mệt. Dù vậy, mình vẫn đi xem phim với bạn.
      confusion:
        vi: "Câu obwohl đứng đầu chiếm vị trí 1, nên câu chính bắt đầu ngay bằng động từ: Obwohl es regnet, gehen wir spazieren (không nói …, aber wir gehen spazieren)."

  - key: de:item:b1u02-g-adjektive-praeposition
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Adjektive mit Präposition: stolz auf, eifersüchtig auf, wütend auf, traurig über, verliebt in (+ Akk) · zufrieden mit, enttäuscht von (+ Dat)"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Nhiều tính từ chỉ cảm xúc đi với một giới từ cố định, và giới từ quyết định cách: stolz auf, eifersüchtig auf, wütend auf, traurig über, verliebt in + Akkusativ; zufrieden mit, enttäuscht von + Dativ. Mẫu thường gặp: sein + tính từ + giới từ + danh từ (Ich bin stolz auf dich). Với vật và sự việc, hỏi và trả lời bằng wo(r)-/da(r)- như với động từ: Worauf bist du stolz? – Darauf bin ich stolz."
      examples:
        - target: Meine Eltern sind sehr stolz auf mich.
          translation:
            vi: Bố mẹ tôi rất tự hào về tôi.
        - target: Bist du zufrieden mit deiner neuen Wohnung?
          translation:
            vi: Bạn có hài lòng với căn hộ mới không?
        - target: Er ist enttäuscht von seinem besten Freund.
          translation:
            vi: Anh ấy thất vọng về người bạn thân nhất của mình.
      confusion:
        vi: "Một số tính từ đổi giới từ theo đối tượng: wütend auf + người (wütend auf meinen Bruder), wütend über + việc (wütend über die Verspätung); enttäuscht von + người, enttäuscht über + việc."

  - key: de:item:b1u02-gefuehl
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Gefühl, -e
      pos: danh từ
    back:
      meaning:
        vi: cảm giác, cảm xúc, tình cảm
      examples:
        - target: Ich habe ein gutes Gefühl.
          translation:
            vi: Tôi có linh cảm tốt.
        - target: Er zeigt seine Gefühle nicht gern.
          translation:
            vi: Anh ấy không thích bộc lộ cảm xúc.
      confusion:
        vi: "Động từ cùng gốc: sich fühlen (cảm thấy) – Ich fühle mich wohl."

  - key: de:item:b1u02-eifersuechtig
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: eifersüchtig (auf + Akk)
      pos: tính từ
    back:
      meaning:
        vi: ghen, ghen tuông
      examples:
        - target: Mein Freund ist schnell eifersüchtig.
          translation:
            vi: Bạn trai tôi rất dễ ghen.
        - target: Bist du eifersüchtig auf sie?
          translation:
            vi: Bạn ghen với cô ấy à?
      confusion:
        vi: "eifersüchtig = ghen vì sợ mất người mình yêu hay bạn thân; neidisch = ghen tị vì muốn có cái người khác có."

  - key: de:item:b1u02-enttaeuscht
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: enttäuscht (von + Dat)
      pos: tính từ
    back:
      meaning:
        vi: thất vọng
      examples:
        - target: Ich bin sehr enttäuscht von dir.
          translation:
            vi: Mình rất thất vọng về bạn.
        - target: Sie war enttäuscht, weil niemand gekommen ist.
          translation:
            vi: Cô ấy thất vọng vì không ai đến.
      confusion:
        vi: "Partizip của enttäuschen (làm ai thất vọng) dùng như tính từ, không có ge-. Danh từ: die Enttäuschung."

  - key: de:item:b1u02-stolz
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: stolz (auf + Akk)
      pos: tính từ
    back:
      meaning:
        vi: tự hào, kiêu hãnh
      examples:
        - target: Wir sind stolz auf unsere Tochter.
          translation:
            vi: Chúng tôi tự hào về con gái mình.
        - target: Darauf kannst du stolz sein!
          translation:
            vi: Bạn có thể tự hào về điều đó!
      confusion:
        vi: "Tiếng Việt \"tự hào về\", tiếng Anh \"proud of\", nhưng tiếng Đức là auf: stolz auf + Akkusativ. Danh từ: der Stolz."

  - key: de:item:b1u02-zufrieden
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: zufrieden (mit + Dat)
      pos: tính từ
    back:
      meaning:
        vi: hài lòng
      examples:
        - target: Bist du mit deiner Arbeit zufrieden?
          translation:
            vi: Bạn có hài lòng với công việc của mình không?
        - target: Der Chef ist sehr zufrieden mit uns.
          translation:
            vi: Sếp rất hài lòng với chúng tôi.
      confusion:
        vi: "Trái nghĩa: unzufrieden. Cụm mit + Dativ có thể đứng trước hoặc sau tính từ: mit der Arbeit zufrieden / zufrieden mit der Arbeit."

  - key: de:item:b1u02-wuetend
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: wütend (auf + Akk)
      pos: tính từ
    back:
      meaning:
        vi: giận dữ, tức giận
      examples:
        - target: Warum bist du so wütend?
          translation:
            vi: Sao bạn tức giận thế?
        - target: Sie ist wütend auf ihren Bruder.
          translation:
            vi: Cô ấy giận anh trai mình.
      confusion:
        vi: "wütend auf + người; wütend über + việc (wütend über die Verspätung). Danh từ: die Wut."

  - key: de:item:b1u02-traurig
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: traurig (über + Akk)
      pos: tính từ
    back:
      meaning:
        vi: buồn
      examples:
        - target: Ich bin traurig, weil mein bester Freund wegzieht.
          translation:
            vi: Tôi buồn vì người bạn thân nhất sắp chuyển đi.
        - target: Sie war traurig über die schlechte Nachricht.
          translation:
            vi: Cô ấy buồn vì tin xấu.
      confusion:
        vi: "Buồn vì điều gì: traurig über + Akkusativ hoặc câu weil."

  - key: de:item:b1u02-einsam
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: einsam
      pos: tính từ
    back:
      meaning:
        vi: cô đơn
      examples:
        - target: Am Anfang habe ich mich in Deutschland sehr einsam gefühlt.
          translation:
            vi: Lúc đầu ở Đức tôi cảm thấy rất cô đơn.
        - target: Viele alte Menschen sind einsam.
          translation:
            vi: Nhiều người già cô đơn.
      confusion:
        vi: "einsam = cô đơn (cảm xúc); allein = một mình (có thể vẫn vui): Ich wohne allein, aber ich bin nicht einsam."

  - key: de:item:b1u02-gluecklich
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: glücklich
      pos: tính từ
    back:
      meaning:
        vi: hạnh phúc
      examples:
        - target: Die beiden sind sehr glücklich zusammen.
          translation:
            vi: Hai người họ rất hạnh phúc bên nhau.
        - target: Ich bin so glücklich, dass du da bist!
          translation:
            vi: Mình hạnh phúc quá vì có bạn ở đây!
      confusion:
        vi: "glücklich = hạnh phúc (sâu, lâu dài); froh = vui, mừng vì một việc cụ thể (Ich bin froh, dass es geklappt hat)."

  # Từ bổ sung (Zusatzwortschatz) bài 4 – cảm xúc
  - key: de:item:b1u02-wut
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Wut (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: cơn giận, sự giận dữ
      examples:
        - target: Seine Wut war schnell wieder vorbei.
          translation:
            vi: Cơn giận của anh ấy qua đi nhanh.
        - target: Ich konnte meine Wut kaum kontrollieren.
          translation:
            vi: Tôi gần như không kìm được cơn giận.
      confusion:
        vi: "Tính từ: wütend. Nói mình đang giận thường dùng tính từ: Ich bin wütend."

  - key: de:item:b1u02-eifersucht
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Eifersucht (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự ghen tuông
      examples:
        - target: Eifersucht kann eine Beziehung kaputt machen.
          translation:
            vi: Ghen tuông có thể phá hỏng một mối quan hệ.
        - target: Ich verstehe seine Eifersucht nicht.
          translation:
            vi: Tôi không hiểu sao anh ấy ghen như vậy.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối (die Sucht), nên là giống cái. Tính từ: eifersüchtig."

  - key: de:item:b1u02-enttaeuschung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Enttäuschung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự thất vọng; điều gây thất vọng
      examples:
        - target: Das Konzert war eine große Enttäuschung.
          translation:
            vi: Buổi hòa nhạc thật đáng thất vọng.
        - target: Ich verstehe deine Enttäuschung.
          translation:
            vi: Mình hiểu nỗi thất vọng của bạn.
      confusion:
        vi: "Tính từ: enttäuscht (người thấy thất vọng). Sự việc gây thất vọng: Das war eine Enttäuschung."

  - key: de:item:b1u02-erleichtert
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: erleichtert
      pos: tính từ
    back:
      meaning:
        vi: nhẹ nhõm
      examples:
        - target: Nach der Prüfung war ich sehr erleichtert.
          translation:
            vi: Thi xong tôi thấy rất nhẹ nhõm.
        - target: Zum Glück ist nichts passiert – ich bin so erleichtert!
          translation:
            vi: May mà không có chuyện gì – mình nhẹ cả người!
      confusion:
        vi: "Partizip của erleichtern (làm nhẹ bớt) dùng như tính từ: erleichtert sein."

  - key: de:item:b1u02-nervoes
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: nervös
      ipa: /nɛʁˈvøːs/
      pos: tính từ
    back:
      meaning:
        vi: hồi hộp, lo lắng, bồn chồn
      examples:
        - target: Vor der Prüfung bin ich immer nervös.
          translation:
            vi: Trước kỳ thi tôi lúc nào cũng hồi hộp.
        - target: Warum bist du so nervös?
          translation:
            vi: Sao bạn bồn chồn thế?
      pronunciation_note:
        vi: "v trong từ gốc Latinh này đọc như \"v\" tiếng Việt (không như f), trọng âm ở -vös."

  - key: de:item:b1u02-freude
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Freude, -n
      pos: danh từ
    back:
      meaning:
        vi: niềm vui
      examples:
        - target: Das Geschenk hat ihr große Freude gemacht.
          translation:
            vi: Món quà làm cô ấy rất vui.
        - target: Ich habe viel Freude an meiner Arbeit.
          translation:
            vi: Tôi rất vui với công việc của mình.
      confusion:
        vi: "Động từ cùng gốc: sich freuen auf/über (A2). Freude an + Dativ = niềm vui với việc gì."

  - key: de:item:b1u02-weinen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: weinen
      pos: động từ
    back:
      meaning:
        vi: khóc
      examples:
        - target: Bei traurigen Filmen weine ich oft.
          translation:
            vi: Xem phim buồn tôi hay khóc.
        - target: Warum weint das Kind?
          translation:
            vi: Sao đứa bé khóc vậy?
      confusion:
        vi: "Động từ có quy tắc: weinte, hat geweint. Trái nghĩa: lachen (cười)."

  - key: de:item:b1u02-laune
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Laune, -n
      pos: danh từ
    back:
      meaning:
        vi: tâm trạng, tính khí lúc đó
      examples:
        - target: Heute habe ich gute Laune.
          translation:
            vi: Hôm nay tâm trạng tôi rất tốt.
        - target: Warum hast du so schlechte Laune?
          translation:
            vi: Sao hôm nay bạn khó chịu thế?
      confusion:
        vi: "Thường đi với haben và không có mạo từ: gute/schlechte Laune haben."

  - key: de:item:b1u02-neidisch
