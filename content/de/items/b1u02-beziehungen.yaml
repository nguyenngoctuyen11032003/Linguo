    skill_tags: [vocabulary]
    front:
      text: die Ehefrau, -en
      pos: danh từ
    back:
      meaning:
        vi: người vợ
      examples:
        - target: Seine Ehefrau kommt aus Vietnam.
          translation:
            vi: Vợ anh ấy là người Việt Nam.
        - target: Er hat seine Ehefrau im Studium kennengelernt.
          translation:
            vi: Anh ấy quen vợ hồi học đại học.
      confusion:
        vi: "Khi nói thường dùng meine Frau (vợ tôi). die Frau vừa là \"người phụ nữ\" vừa là \"vợ\", tùy ngữ cảnh."

  - key: de:item:b1u02-zusammenziehen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: zusammenziehen, zieht zusammen, zog zusammen, ist zusammengezogen
      pos: động từ
    back:
      meaning:
        vi: dọn về sống chung
      examples:
        - target: Nach einem Jahr sind wir zusammengezogen.
          translation:
            vi: Sau một năm, chúng tôi dọn về sống chung.
        - target: Wann zieht ihr zusammen?
          translation:
            vi: Khi nào hai bạn dọn về ở chung?
      confusion:
        vi: "Động từ tách, Perfekt dùng sein vì là chuyển chỗ ở: Wir sind zusammengezogen. Sống chung (trạng thái) là zusammenleben hoặc zusammenwohnen."

  # Từ bổ sung (Zusatzwortschatz) bài 2 – tình yêu, hôn nhân
  - key: de:item:b1u02-sich-verloben
    type: phrase
