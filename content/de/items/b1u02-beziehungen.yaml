    front:
      text: der Liebeskummer (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: nỗi buồn vì tình, thất tình
      examples:
        - target: Nach der Trennung hatte er wochenlang Liebeskummer.
          translation:
            vi: Sau khi chia tay, anh ấy buồn vì tình suốt mấy tuần.
        - target: Meine Schwester hat Liebeskummer.
          translation:
            vi: Em gái tôi đang thất tình.
      confusion:
        vi: "Thường dùng không có mạo từ: Liebeskummer haben. Từ ghép: die Liebe + s + der Kummer (nỗi buồn), nên là giống đực."

  - key: de:item:b1u02-sich-scheiden-lassen
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich scheiden lassen, lässt sich scheiden, ließ sich scheiden, hat sich scheiden lassen
      pos: động từ
    back:
      meaning:
        vi: ly hôn
      examples:
        - target: Meine Eltern haben sich scheiden lassen, als ich zehn war.
          translation:
            vi: Bố mẹ tôi ly hôn khi tôi lên mười.
        - target: Sie lassen sich nach zwanzig Jahren scheiden.
          translation:
            vi: Họ ly hôn sau hai mươi năm.
      confusion:
        vi: "Perfekt: hat sich scheiden lassen (lassen ở dạng nguyên thể, giống modal). Danh từ: die Scheidung; tính từ: geschieden (đã ly hôn)."

  - key: de:item:b1u02-single
    type: vocab
    level: b1
