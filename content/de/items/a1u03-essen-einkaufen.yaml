      pronunciation_note:
        vi: Ở Đức thường nhấn âm đầu (KA-phê); ở Áo hay nhấn âm cuối (ka-PHÊ).

  - key: de:item:a1u03-wasser
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Wasser (Sg.)
