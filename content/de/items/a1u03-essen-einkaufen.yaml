        vi: "sp đầu từ đọc \"shp\": \"SHPAI-dơ-kar-tơ\"."
      confusion:
        vi: "Từ ghép die Speise (món ăn) + die Karte (tấm thẻ): giống theo phần cuối, nên là die Speisekarte."

  - key: de:item:a1u03-bestellen
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: bestellen
