            vi: Tôi thích ăn táo.
      pronunciation_note:
        vi: "pf đọc liền: môi khép như \"p\" rồi bật ra \"ph\". Số nhiều: die Äpfel."

  - key: de:item:a1u03-wurst
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Wurst, ¨-e
      ipa: /vʊʁst/
      pos: danh từ
    back:
      meaning:
        vi: xúc xích; giò, chả nguội thái lát
      examples:
        - target: Mein Vater isst gern Wurst.
          translation:
            vi: Bố tôi thích ăn xúc xích.
      confusion:
        vi: "Wurst là giống cái: die Wurst, số nhiều die Würste."

  - key: de:item:a1u03-butter
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Butter (Sg.)
      ipa: /ˈbʊtɐ/
      pos: danh từ
    back:
      meaning:
        vi: bơ (làm từ sữa)
      examples:
        - target: Ich esse gern Brot mit Butter.
          translation:
            vi: Tôi thích ăn bánh mì phết bơ.
      confusion:
        vi: Quả bơ là die Avocado; die Butter chỉ là bơ sữa.

  - key: de:item:a1u03-fruehstueck
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Frühstück, -e
      ipa: /ˈfʁyːʃtʏk/
      pos: danh từ
    back:
      meaning:
        vi: bữa sáng
      examples:
        - target: Das Frühstück ist fertig!
          translation:
            vi: Bữa sáng xong rồi!
      confusion:
        vi: "Từ ghép früh (sớm) + das Stück (miếng): giống theo phần cuối, nên là das Frühstück."

  - key: de:item:a1u03-banane
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Banane, -n
      ipa: /baˈnaːnə/
      pos: danh từ
    back:
      meaning:
        vi: quả chuối
      examples:
        - target: Die Bananen sind noch grün.
          translation:
            vi: Chuối vẫn còn xanh.

  - key: de:item:a1u03-wein
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Wein, -e
      ipa: /vaɪ̯n/
      pos: danh từ
    back:
      meaning:
        vi: rượu vang
      examples:
        - target: Trinken Sie gern Wein?
          translation:
            vi: Ông/bà có thích uống rượu vang không?
      pronunciation_note:
        vi: "w = \"v\", ei = \"ai\": đọc \"vain\"."

  # ---------------- Bài 2: Ich nehme den Salat. ----------------
  - key: de:item:a1u03-g-akkusativ
    type: grammar_point
    level: a1
    difficulty: 2
    skill_tags: [grammar]
    front:
      text: "Akkusativ: den / einen / keinen / meinen"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Tân ngữ trực tiếp (trả lời câu hỏi Wen? / Was?) đứng ở cách Akkusativ. Chỉ danh từ giống đực số ít đổi mạo từ: der → den, ein → einen, kein → keinen, mein → meinen. Giống cái (die, eine), giống trung (das, ein) và số nhiều (die) giữ nguyên như Nominativ."
      examples:
        - target: Ich nehme den Salat.
          translation:
            vi: Tôi gọi món salad.
        - target: Wir haben keinen Reis mehr.
          translation:
            vi: Chúng tôi hết gạo rồi.
        - target: Ich trinke meinen Kaffee schwarz.
          translation:
            vi: Tôi uống cà phê đen (không sữa, không đường).
      confusion:
        vi: "Chủ ngữ vẫn ở Nominativ: Der Salat ist lecker. Nhưng: Ich nehme den Salat. Đừng đổi giống cái thành \"einen\": Ich nehme eine Suppe."

  - key: de:item:a1u03-nehmen
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: nehmen (du nimmst)
      ipa: /ˈneːmən/
      pos: động từ
    back:
      meaning:
        vi: lấy; (ở nhà hàng, cửa hàng) chọn, gọi món
      examples:
        - target: Ich nehme den Fisch.
          translation:
            vi: Tôi gọi món cá.
        - target: Was nimmst du?
          translation:
            vi: Bạn gọi món gì?
      confusion:
        vi: "ich nehme, du nimmst, er/sie/es nimmt (e → i, mất h và viết hai chữ m), wir nehmen, ihr nehmt, sie/Sie nehmen."

  - key: de:item:a1u03-salat
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Salat, -e
      ipa: /zaˈlaːt/
      pos: danh từ
    back:
      meaning:
        vi: món salad, rau trộn; rau xà lách
      examples:
        - target: Ich nehme den Salat.
          translation:
            vi: Tôi gọi món salad.
      pronunciation_note:
        vi: "Nhấn âm cuối: sa-LAT, s đầu đọc gần \"d\" giọng Bắc."

  - key: de:item:a1u03-suppe
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Suppe, -n
      ipa: /ˈzʊpə/
      pos: danh từ
    back:
      meaning:
        vi: món súp, canh
      examples:
        - target: Die Suppe ist heiß.
          translation:
            vi: Súp nóng.

  - key: de:item:a1u03-fleisch
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Fleisch (Sg.)
      ipa: /flaɪ̯ʃ/
      pos: danh từ
    back:
      meaning:
        vi: thịt
      examples:
        - target: Ich esse kein Fleisch.
          translation:
            vi: Tôi không ăn thịt.
      pronunciation_note:
        vi: "ei = \"ai\", sch = \"s\" uốn lưỡi tròn môi: \"phlaish\"."

  - key: de:item:a1u03-fisch
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Fisch, -e
      ipa: /fɪʃ/
      pos: danh từ
    back:
      meaning:
        vi: cá; món cá
      examples:
        - target: Wir nehmen den Fisch.
          translation:
            vi: Chúng tôi gọi món cá.

  - key: de:item:a1u03-reis
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Reis (Sg.)
      ipa: /ʁaɪ̯s/
      pos: danh từ
    back:
      meaning:
        vi: gạo; cơm
      examples:
        - target: Wir essen oft Reis.
          translation:
            vi: Chúng tôi hay ăn cơm.
      confusion:
        vi: "Tiếng Đức chỉ có một từ Reis cho cả gạo và cơm. Đừng nhầm với die Reise (chuyến đi)."

  - key: de:item:a1u03-speisekarte
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Speisekarte, -n
