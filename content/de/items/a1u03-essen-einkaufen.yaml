            vi: Cho tôi thanh toán!

  - key: de:item:a1u03-zusammen-oder-getrennt
    type: phrase
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: Zusammen oder getrennt?
      ipa: /tsuˈzamən oːdɐ ɡəˈtʁɛnt/
      pos: cụm từ
    back:
      meaning:
        vi: Trả chung hay trả riêng? (nhân viên hỏi khi tính tiền)
      examples:
        - target: Zusammen oder getrennt? – Getrennt, bitte.
          translation:
            vi: Trả chung hay riêng ạ? – Riêng ạ.
      confusion:
        vi: Ở Đức, mỗi người trong nhóm trả phần của mình là chuyện bình thường; nhân viên sẽ tính riêng từng người.

  - key: de:item:a1u03-kellner
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Kellner, - / die Kellnerin, -nen
