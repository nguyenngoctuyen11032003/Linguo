items:
  # ---------------- Bài 1: Was isst du gern? ----------------
  - key: de:item:a1u03-g-vokalwechsel
    type: grammar_point
    level: a1
    difficulty: 2
    skill_tags: [grammar]
    front:
      text: "Vokalwechsel: essen → du isst, er isst"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Một số động từ đổi nguyên âm gốc chỉ ở ngôi du và er/sie/es: e → i (essen – isst, sprechen – spricht), e → ie (sehen – sieht, lesen – liest), a → ä (fahren – fährt, schlafen – schläft). Các ngôi ich, wir, ihr, sie/Sie chia bình thường: ich esse, wir essen."
      examples:
        - target: Was isst du gern?
          translation:
            vi: Bạn thích ăn gì?
        - target: Meine Schwester liest gern.
          translation:
            vi: Chị gái tôi thích đọc sách.
        - target: Lena fährt gern Fahrrad.
          translation:
            vi: Lena thích đạp xe.
      confusion:
        vi: "Đuôi vẫn là -st (du) và -t (er/sie/es), chỉ nguyên âm trong gốc đổi. Gốc essen tận cùng bằng s nên du chỉ thêm -t: du isst (không phải du esst, du issst)."

  - key: de:item:a1u03-g-gern
    type: grammar_point
    level: a1
    difficulty: 1
    skill_tags: [grammar]
    front:
      text: "gern / nicht gern: Ich esse gern Obst."
      ipa: /ɡɛʁn/
      pos: ngữ pháp
    back:
      meaning:
        vi: "Muốn nói mình thích làm gì, bạn dùng động từ chính rồi thêm gern ngay sau động từ đã chia: Ich trinke gern Kaffee. Không thích: nicht gern. Động từ chia vẫn ở vị trí 2."
      examples:
        - target: Ich trinke gern Kaffee.
          translation:
            vi: Tôi thích uống cà phê.
        - target: Isst du gern Gemüse? – Nein, nicht so gern.
          translation:
            vi: Bạn có thích ăn rau không? – Không, không thích lắm.
      confusion:
        vi: "Tiếng Việt nói \"thích + ăn\"; tiếng Đức không ghép hai động từ như vậy mà dùng động từ chính + gern. Không nói \"Ich mag essen\" hay \"Ich gern esse\"."

  - key: de:item:a1u03-essen
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: essen (du isst)
      ipa: /ˈɛsn̩/
      pos: động từ
    back:
      meaning:
        vi: ăn
      examples:
        - target: Wir essen heute zu Hause.
          translation:
            vi: Hôm nay chúng tôi ăn ở nhà.
        - target: Was isst du gern?
          translation:
            vi: Bạn thích ăn gì?
      confusion:
        vi: "ich esse, du isst, er/sie/es isst, wir essen, ihr esst, sie/Sie essen. Chú ý: ihr esst (đúng) nhưng du isst."

  - key: de:item:a1u03-trinken
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: trinken
      ipa: /ˈtʁɪŋkn̩/
      pos: động từ
    back:
      meaning:
        vi: uống
      examples:
        - target: Ich trinke gern Wasser.
          translation:
            vi: Tôi thích uống nước.
        - target: Was trinkst du?
          translation:
            vi: Bạn uống gì?
      pronunciation_note:
        vi: "nk đọc như \"ng\" + \"k\": \"tring-kơn\"; r đọc nhẹ ở cuống họng, gần \"g\" mềm."

  - key: de:item:a1u03-brot
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Brot, -e
      ipa: /bʁoːt/
      pos: danh từ
    back:
      meaning:
        vi: bánh mì (loại ổ lớn, thường cắt lát)
      examples:
        - target: Das Brot hier ist sehr gut.
          translation:
            vi: Bánh mì ở đây rất ngon.
      confusion:
        vi: "Ổ bánh mì nhỏ ăn sáng là das Brötchen. Người Đức có hàng trăm loại Brot, phần lớn là bánh mì đen hoặc nâu."

  - key: de:item:a1u03-milch
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Milch (Sg.)
      ipa: /mɪlç/
      pos: danh từ
    back:
      meaning:
        vi: sữa
      examples:
        - target: Trinkst du gern Milch?
          translation:
            vi: Bạn có thích uống sữa không?
      pronunciation_note:
        vi: "ch sau l, i, e đọc như hơi \"h\" xì nhẹ giữa lưỡi và vòm miệng (ich-Laut), không đọc \"kh\"."

  - key: de:item:a1u03-kaffee
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Kaffee (Sg.)
      ipa: /ˈkafe/
      pos: danh từ
