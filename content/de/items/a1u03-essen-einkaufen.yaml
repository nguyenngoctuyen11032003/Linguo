            vi: Tôi gọi một đĩa salad.
      pronunciation_note:
        vi: "be- không nhấn, nhấn vào STEL; st đầu âm tiết đọc \"sht\"."

  - key: de:item:a1u03-rechnung
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: die Rechnung, -en
      ipa: /ˈʁɛçnʊŋ/
      pos: danh từ
    back:
      meaning:
        vi: hoá đơn
      examples:
        - target: Die Rechnung, bitte!
