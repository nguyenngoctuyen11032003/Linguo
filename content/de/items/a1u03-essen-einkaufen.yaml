      pos: danh từ
    back:
      meaning:
        vi: nước
      examples:
        - target: Das Wasser ist kalt.
          translation:
            vi: Nước lạnh.
      pronunciation_note:
        vi: "w đọc như \"v\" tiếng Việt; -er cuối đọc thành \"a\" nhẹ: \"va-xa\"."

  - key: de:item:a1u03-saft
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Saft, ¨-e
      ipa: /zaft/
      pos: danh từ
    back:
      meaning:
        vi: nước ép, nước quả
      examples:
        - target: Die Kinder trinken gern Saft.
          translation:
            vi: Bọn trẻ thích uống nước ép.
      pronunciation_note:
        vi: "s đầu từ đứng trước nguyên âm đọc gần \"d\" giọng Bắc. Số nhiều: die Säfte."

  - key: de:item:a1u03-obst
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Obst (Sg.)
      ipa: /oːpst/
      pos: danh từ
    back:
      meaning:
        vi: trái cây, hoa quả (nói chung)
      examples:
        - target: Obst ist gesund.
          translation:
            vi: Trái cây tốt cho sức khoẻ.
      confusion:
        vi: Obst là danh từ chung không đếm được; muốn nói một quả cụ thể thì dùng tên quả (ein Apfel, eine Banane).

  - key: de:item:a1u03-gemuese
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: das Gemüse (Sg.)
      ipa: /ɡəˈmyːzə/
      pos: danh từ
    back:
      meaning:
        vi: rau, rau củ (nói chung)
      examples:
        - target: Isst du gern Gemüse?
          translation:
            vi: Bạn có thích ăn rau không?
      pronunciation_note:
        vi: "Nhấn âm thứ hai: ge-MÜ-se. ü đọc như \"i\" nhưng tròn môi như \"u\"."

  - key: de:item:a1u03-apfel
    type: vocab
    level: a1
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: der Apfel, ¨-
      ipa: /ˈapfl̩/
