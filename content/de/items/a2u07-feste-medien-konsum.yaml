  - key: de:item:a2u07-video
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: "das Video, -s"
      ipa: /ˈviːdeo/
      pos: danh từ
    back:
      meaning:
        vi: video, đoạn phim
      examples:
        - target: Hast du Peters neues Video gesehen?
