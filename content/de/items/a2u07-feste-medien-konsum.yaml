            vi: Bạn xem video mới của Peter chưa?
      pronunciation_note:
        vi: "V ở đây đọc như \"v\" (từ gốc Latinh), không đọc \"f\"."

  - key: de:item:a2u07-herunterladen
    type: vocab
    level: a2
