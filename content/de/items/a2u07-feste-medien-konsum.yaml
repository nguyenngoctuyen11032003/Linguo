      pronunciation_note:
        vi: "Trọng âm ở he-RUN-ter."
      confusion:
        vi: "Động từ tách: Ich lade die App herunter. Trái nghĩa: hochladen (tải lên)."

  - key: de:item:a2u07-passwort
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Passwort, ¨-er"
      pos: danh từ
    back:
      meaning:
        vi: mật khẩu
      examples:
        - target: Ich habe mein Passwort vergessen.
          translation:
            vi: Tôi quên mật khẩu rồi.
      pronunciation_note:
        vi: "w đọc như \"v\": PASS-vort. Số nhiều: die Passwörter."

  - key: de:item:a2u07-online
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: online
      pos: tính từ / trạng từ
    back:
      meaning:
        vi: trực tuyến, đang trên mạng
      examples:
        - target: Bist du gerade online?
          translation:
            vi: Bạn đang online à?
      confusion:
        vi: "Không có đuôi: Ich bin online. Ich kaufe online ein."

  - key: de:item:a2u07-bildschirm
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Bildschirm, -e"
      pos: danh từ
    back:
      meaning:
        vi: màn hình
      examples:
        - target: Der Bildschirm von meinem Handy ist kaputt.
          translation:
            vi: Màn hình điện thoại của tôi bị vỡ rồi.
      confusion:
        vi: "das Bild (hình) + der Schirm (tấm che) → der Bildschirm (giống đực theo từ cuối)."

  - key: de:item:a2u07-smartphone
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: "das Smartphone, -s"
      pos: danh từ
    back:
      meaning:
        vi: điện thoại thông minh
      examples:
        - target: Mit dem Smartphone mache ich viele Fotos.
          translation:
            vi: Tôi chụp nhiều ảnh bằng điện thoại thông minh.
      confusion:
        vi: "Trong văn nói người Đức hay gọi là das Handy."

  - key: de:item:a2u07-tablet
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: "das Tablet, -s"
      pos: danh từ
    back:
      meaning:
        vi: máy tính bảng
      examples:
        - target: Meine Oma liest die Zeitung auf dem Tablet.
          translation:
            vi: Bà tôi đọc báo trên máy tính bảng.
      confusion:
        vi: "Đừng nhầm với die Tablette (viên thuốc)."

  - key: de:item:a2u07-hochladen
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: "hochladen, lädt hoch, lud hoch, hat hochgeladen"
      pos: động từ (tách)
    back:
      meaning:
        vi: tải lên (mạng)
      examples:
        - target: Ich lade die Fotos von der Party heute Abend hoch.
          translation:
            vi: Tối nay mình tải ảnh bữa tiệc lên.
      confusion:
        vi: "Động từ tách, đổi nguyên âm ở du/er: du lädst hoch, er lädt hoch."

  - key: de:item:a2u07-loeschen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: löschen
      pos: động từ
    back:
      meaning:
        vi: xoá (dữ liệu, ảnh, bài đăng)
      examples:
        - target: Bitte lösch das Foto!
          translation:
            vi: Làm ơn xoá tấm ảnh đó đi!
      confusion:
        vi: "Động từ có quy tắc: er löscht, hat gelöscht."

  - key: de:item:a2u07-link
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: "der Link, -s"
      pos: danh từ
    back:
      meaning:
        vi: đường link, đường dẫn
      examples:
        - target: Schick mir bitte den Link!
          translation:
            vi: Gửi mình đường link nhé!

  - key: de:item:a2u07-profil
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Profil, -e"
      pos: danh từ
    back:
      meaning:
        vi: trang cá nhân, hồ sơ (trên mạng)
      examples:
        - target: Auf meinem Profil gibt es nur wenige Fotos.
          translation:
            vi: Trên trang cá nhân của mình chỉ có ít ảnh.
      pronunciation_note:
        vi: "Trọng âm ở âm tiết cuối: pro-FIL, i dài."
