  # ================= bài 3: truyền thông – was für ein, es geht um =================
  - key: de:item:a2u07-g-was-fuer-ein
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Was für ein …? – Was für einen Film siehst du gern?"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Was für ein …? hỏi về loại, kiểu (phim gì, chương trình loại nào); welcher hỏi chọn cái nào trong một nhóm đã biết. ein biến cách theo vai trò của danh từ trong câu, không theo für: Was für ein Film ist das? (Nominativ) – Was für einen Film siehst du? (Akkusativ). Với số nhiều và danh từ không đếm được thì bỏ ein: Was für Filme? Was für Musik?"
      examples:
        - target: Was für eine Sendung ist das? – Eine Talkshow.
          translation:
            vi: Đây là chương trình gì vậy? – Một chương trình trò chuyện.
        - target: Was für einen Film möchtest du sehen? – Einen Krimi.
          translation:
            vi: Bạn muốn xem phim loại gì? – Một phim trinh thám.
        - target: Was für Musik hörst du gern?
          translation:
            vi: Bạn thích nghe nhạc gì?
      confusion:
        vi: "Welcher Film? = phim nào (trong mấy phim đang chiếu). Was für ein Film? = phim loại gì (hài, trinh thám…)."

  - key: de:item:a2u07-g-es-geht-um
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Es geht um + Akkusativ: In dem Artikel geht es um …"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Để nói một bài báo, bộ phim hay cuộc nói chuyện có nội dung về gì, dùng (In dem Film) geht es um + Akkusativ. Chủ ngữ luôn là es nên ở thì hiện tại động từ luôn là geht, kể cả khi chủ đề ở số nhiều. Trong cấu trúc này chỉ dùng um, không dùng über (über chỉ đi sau danh từ: ein Film über Berlin)."
      examples:
        - target: In dem Artikel geht es um Handys in der Schule.
          translation:
            vi: Bài báo nói về điện thoại di động trong trường học.
        - target: In der Serie geht es um eine Familie in Berlin.
          translation:
            vi: Bộ phim kể về một gia đình ở Berlin.
        - target: Im Film geht es um einen jungen Koch.
          translation:
            vi: Bộ phim kể về một anh đầu bếp trẻ.
      confusion:
        vi: "Ở vị trí 1 có thể là phần In dem Film (… geht es um …) hoặc chính es (Es geht in dem Film um …). Không nói \"Der Film geht um …\"."

  - key: de:item:a2u07-zeitung
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Zeitung, -en"
      ipa: /ˈt͡saɪ̯tʊŋ/
      pos: danh từ
    back:
      meaning:
        vi: tờ báo
      examples:
        - target: Mein Vater liest jeden Morgen die Zeitung.
          translation:
            vi: Sáng nào bố tôi cũng đọc báo.
      pronunciation_note:
        vi: "Z đầu từ đọc là \"ts\"; ei đọc như \"ai\"."

  - key: de:item:a2u07-zeitschrift
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Zeitschrift, -en"
      pos: danh từ
    back:
      meaning:
        vi: tạp chí
      examples:
        - target: Am Bahnhof kaufe ich manchmal eine Zeitschrift.
          translation:
            vi: Thỉnh thoảng tôi mua một cuốn tạp chí ở nhà ga.
      confusion:
        vi: "die Zeitung ra thường xuyên (hằng ngày hoặc hằng tuần), giấy mỏng, nhiều tin tức; die Zeitschrift là tạp chí, thường có nhiều ảnh, theo chủ đề."

  - key: de:item:a2u07-artikel
