      confusion:
        vi: "Từ ghép lấy giống của từ cuối: der Film → der Dokumentarfilm."

  # ================= bài 4: blog của Anna – Annas, einer/keiner =================
  - key: de:item:a2u07-g-genitiv-namen
    type: grammar_point
    level: a2
    difficulty: 2
    skill_tags: [grammar]
    front:
      text: "Annas Blog, Peters Handy – das Handy von Peter"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Để nói đồ vật của ai, thêm -s vào tên riêng và đặt trước danh từ, không có mạo từ và không có dấu nháy: Annas Blog (blog của Anna). Tên tận cùng bằng -s, -ß, -x, -z thì chỉ thêm dấu nháy: Max' Handy. Trong văn nói người Đức thường dùng von + Dativ: das Handy von Max."
      examples:
        - target: Das ist Annas Blog.
          translation:
            vi: Đây là blog của Anna.
        - target: Wie ist Peters Passwort?
          translation:
            vi: Mật khẩu của Peter là gì?
        - target: Das Video von Lisa ist super.
          translation:
            vi: Video của Lisa hay tuyệt.
      confusion:
        vi: "Thứ tự ngược với tiếng Việt: blog của Anna → Annas Blog (chủ sở hữu đứng trước). Không thêm mạo từ: der Annas Blog là sai."

  - key: de:item:a2u07-g-indefinitpronomen-einer
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "einer / eine / eins, keiner / keine / keins, meiner …: Hast du einen Laptop? – Ja, ich habe einen."
      pos: ngữ pháp
    back:
      meaning:
        vi: "Để khỏi lặp lại danh từ, ein/kein/mein đứng một mình làm đại từ và mang đuôi đầy đủ: einer (der), eine (die), eins (das); Akkusativ giống đực là einen. Số nhiều: welche (có một ít) – keine (không có cái nào). Giống trung cũng nói được eines, keines, meines (trang trọng hơn eins, keins, meins)."
      examples:
        - target: Hast du ein Tablet? – Nein, ich habe keins.
          translation:
            vi: Bạn có máy tính bảng không? – Không, mình không có.
        - target: Ist das dein Handy? – Nein, das ist nicht meins.
          translation:
            vi: Đây là điện thoại của bạn à? – Không, không phải của mình.
        - target: Ich brauche Fotos für meinen Blog. Hast du welche?
          translation:
            vi: Mình cần ảnh cho blog. Bạn có ảnh nào không?
      confusion:
        vi: "Trước danh từ: Ich habe einen Laptop / ein Tablet. Đứng một mình: Ich habe einen / eins. Giống đực Nominativ khác hẳn: ein Laptop → einer (Da ist einer.)."

  - key: de:item:a2u07-blog
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Blog, -s"
      pos: danh từ
    back:
      meaning:
        vi: blog, nhật ký trên mạng
      examples:
        - target: Anna schreibt einen Blog über Reisen.
          translation:
            vi: Anna viết blog về du lịch.
      confusion:
        vi: "Cũng có người nói das Blog; trong bài này dùng der Blog."

  - key: de:item:a2u07-posten
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
