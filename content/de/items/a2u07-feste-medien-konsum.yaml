            vi: Bạn đọc bài báo về bảo tàng mới chưa?
      pronunciation_note:
        vi: "Trọng âm ở âm tiết thứ hai: ar-TI-kel."
      confusion:
        vi: "Cùng một từ cho hai nghĩa: der Artikel trong báo và der Artikel (der/die/das) trong ngữ pháp."

  - key: de:item:a2u07-fernsehen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Fernsehen (Sg.)"
      pos: danh từ
    back:
      meaning:
        vi: truyền hình (các chương trình trên tivi)
      examples:
        - target: Was kommt heute Abend im Fernsehen?
          translation:
