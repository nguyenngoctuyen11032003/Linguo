            vi: Cuối tuần tôi thích xem phim bộ.
      pronunciation_note:
        vi: "S đầu từ đọc như \"d\" nhẹ; ie ở cuối tách thành hai âm: SE-ri-e."

  - key: de:item:a2u07-werbung
    type: vocab
    level: a2
    difficulty: 2
