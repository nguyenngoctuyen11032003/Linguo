items:
  # ================= bài 1: lễ hội – dieser, jeder, sondern =================
  - key: de:item:a2u07-g-dieser-jeder
    type: grammar_point
    level: a2
    difficulty: 2
    skill_tags: [grammar]
    front:
      text: "dieser, jeder, welcher, alle: dieser Film, diese Kerze, dieses Fest, alle Gäste"
      pos: ngữ pháp
    back:
      meaning:
        vi: "dieser (này), jeder (mỗi), welcher (nào) có đuôi giống mạo từ xác định: der → dieser/jeder, die → diese/jede, das → dieses/jedes; Akkusativ giống đực -en (diesen, jeden), Dativ -em/-er/-em (an diesem Tag). jeder chỉ dùng với số ít; số nhiều dùng alle (alle Gäste). Tính từ đứng sau những từ này có đuôi như sau der/die/das: dieser schöne Baum, alle neuen Produkte."
      examples:
        - target: Dieses Fest feiern wir jedes Jahr im Februar.
          translation:
            vi: Năm nào chúng tôi cũng ăn lễ này vào tháng Hai.
        - target: Welche Kerze möchtest du? – Diese rote Kerze hier.
          translation:
            vi: Bạn muốn cây nến nào? – Cây nến đỏ này đây.
        - target: Alle Gäste kommen um acht Uhr.
          translation:
            vi: Tất cả khách đến lúc tám giờ.
      confusion:
        vi: "jeder Gast (mỗi người khách, số ít) – alle Gäste (tất cả khách, số nhiều). Không nói jede Gäste."

  - key: de:item:a2u07-g-sondern
    type: grammar_point
    level: a2
    difficulty: 2
    skill_tags: [grammar]
    front:
      text: "nicht …, sondern … / kein …, sondern …"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Sau một phủ định (nicht, kein), sondern đưa ra thông tin đúng để thay vào: không phải A mà là B. aber thì chỉ thêm một ý trái ngược, không sửa lại vế trước. sondern đứng ở vị trí 0 như aber và luôn có dấu phẩy đứng trước."
      examples:
        - target: Wir feiern nicht am 24., sondern am 25. Dezember.
          translation:
            vi: Chúng tôi không ăn mừng vào ngày 24 mà vào ngày 25 tháng Mười hai.
        - target: Das ist kein Geburtstagsgeschenk, sondern ein Hochzeitsgeschenk.
          translation:
            vi: Đây không phải quà sinh nhật mà là quà cưới.
        - target: Das Geschenk ist nicht teuer, aber sehr schön.
          translation:
            vi: Món quà không đắt nhưng rất đẹp.
      confusion:
        vi: "Vế sau sửa lại vế trước (không phải A → mà là B): sondern. Vế sau chỉ nói thêm một ý ngược chiều (không đắt nhưng đẹp): aber."

  - key: de:item:a2u07-fest
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Fest, -e"
      pos: danh từ
    back:
      meaning:
        vi: lễ, dịp lễ, lễ hội; buổi tiệc lớn
      examples:
        - target: Das wichtigste Fest in Vietnam ist Tết.
          translation:
            vi: Lễ quan trọng nhất ở Việt Nam là Tết.
      confusion:
        vi: "das Fest là dịp lễ hay lễ hội nói chung (Weihnachten ist ein Fest); die Feier là một buổi tổ chức cụ thể (die Geburtstagsfeier); die Party là bữa tiệc vui, thân mật."

  - key: de:item:a2u07-feiern
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: feiern
      pos: động từ
    back:
      meaning:
        vi: ăn mừng, tổ chức (lễ, tiệc)
      examples:
        - target: Wir feiern Silvester bei Freunden.
          translation:
            vi: Chúng tôi đón giao thừa ở nhà bạn bè.
      confusion:
        vi: "feiern là động từ có quy tắc: ich feiere, du feierst; Perfekt: hat gefeiert."

  - key: de:item:a2u07-weihnachten
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: Weihnachten
      ipa: /ˈvaɪ̯naxtn̩/
      pos: tên lễ (thường không có mạo từ)
    back:
      meaning:
        vi: lễ Giáng sinh, Nô-en
      examples:
        - target: An Weihnachten fahre ich zu meinen Eltern.
          translation:
            vi: Giáng sinh tôi về nhà bố mẹ.
      pronunciation_note:
        vi: "W đọc như \"v\"; ch sau a là âm \"kh\" sát ở cuống họng."
      confusion:
        vi: "Nói an Weihnachten (hay gặp ở miền Nam nước Đức) hoặc zu Weihnachten (hay gặp ở miền Bắc), cả hai đều đúng. Lời chúc: Frohe Weihnachten!"

  - key: de:item:a2u07-ostern
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: Ostern
      ipa: /ˈoːstɐn/
      pos: tên lễ (thường không có mạo từ)
    back:
      meaning:
        vi: lễ Phục sinh (vào tháng Ba hoặc tháng Tư, mỗi năm một ngày khác)
      examples:
        - target: Zu Ostern suchen die Kinder Ostereier im Garten.
          translation:
            vi: Vào lễ Phục sinh, trẻ con đi tìm trứng Phục sinh trong vườn.
      confusion:
        vi: "Giống Weihnachten: nói zu Ostern hoặc an Ostern. Lời chúc: Frohe Ostern!"

  - key: de:item:a2u07-silvester
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: Silvester
      ipa: /zɪlˈvɛstɐ/
      pos: tên lễ (thường không có mạo từ)
    back:
      meaning:
        vi: đêm giao thừa dương lịch (31/12)
      examples:
        - target: Was machst du an Silvester? – Ich feiere mit Freunden.
          translation:
            vi: Giao thừa bạn làm gì? – Mình đón giao thừa với bạn bè.
      pronunciation_note:
        vi: "S đầu từ đọc như \"d\" nhẹ (giọng Bắc); v ở đây đọc như \"v\" (từ gốc Latinh), không đọc \"f\"; trọng âm ở âm tiết thứ hai: sil-VES-ter."

  - key: de:item:a2u07-neujahr
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Neujahr (Sg.)"
      pos: danh từ
    back:
      meaning:
        vi: ngày đầu năm mới dương lịch (1/1)
      examples:
        - target: An Neujahr besuchen wir meine Großeltern.
          translation:
            vi: Ngày mùng một tháng Một chúng tôi đi thăm ông bà.
      confusion:
        vi: "Neujahr thường dùng không có mạo từ (an Neujahr). Tết Nguyên Đán gọi là das vietnamesische Neujahrsfest hoặc đơn giản là Tết. Lời chúc: Frohes neues Jahr!"

  - key: de:item:a2u07-geschenk
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Geschenk, -e"
      pos: danh từ
    back:
      meaning:
        vi: quà, món quà
      examples:
        - target: Das Geschenk für meine Mutter habe ich schon gekauft.
          translation:
            vi: Quà cho mẹ thì tôi mua rồi.
      confusion:
        vi: "Động từ tặng là schenken: Ich schenke dir ein Buch."

  - key: de:item:a2u07-kerze
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Kerze, -n"
      ipa: /ˈkɛʁt͡sə/
      pos: danh từ
    back:
      meaning:
        vi: cây nến
      examples:
        - target: Auf dem Tisch stehen viele Kerzen.
          translation:
            vi: Trên bàn có nhiều cây nến.
      pronunciation_note:
        vi: "z đọc là \"ts\": KER-tse."

  - key: de:item:a2u07-gast
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Gast, ¨-e"
      pos: danh từ
    back:
      meaning:
        vi: khách
      examples:
        - target: Zu unserer Party kommen zwanzig Gäste.
          translation:
            vi: Có hai mươi khách đến bữa tiệc của chúng tôi.
      confusion:
        vi: "Số nhiều có biến âm: die Gäste. Dùng cho cả nam và nữ (Sie ist unser Gast)."

  - key: de:item:a2u07-hochzeit
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Hochzeit, -en"
      ipa: /ˈhɔxt͡saɪ̯t/
      pos: danh từ
    back:
      meaning:
        vi: đám cưới
      examples:
        - target: Im Juni sind wir auf einer Hochzeit in Hanoi.
          translation:
            vi: Tháng Sáu chúng tôi đi dự một đám cưới ở Hà Nội.
      pronunciation_note:
        vi: "Theo phát âm chuẩn (Duden), o trong Hochzeit (đám cưới) đọc ngắn, khác với hoch (cao) có o dài; z đọc là \"ts\"."
      confusion:
        vi: "Đi dự đám cưới: auf eine Hochzeit gehen; đang ở đám cưới: auf einer Hochzeit sein."

  - key: de:item:a2u07-heiligabend
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Heiligabend, -e"
      pos: danh từ
    back:
      meaning:
        vi: đêm Giáng sinh, tối 24/12
      examples:
        - target: Am Heiligabend bekommen die Kinder ihre Geschenke.
          translation:
            vi: Tối 24 trẻ con được nhận quà.
      confusion:
        vi: "Ở Đức, nhiều gia đình tặng quà vào tối 24/12 (Heiligabend), không phải sáng 25/12 như ở nhiều nước khác."

  - key: de:item:a2u07-weihnachtsbaum
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Weihnachtsbaum, ¨-e"
      pos: danh từ
    back:
      meaning:
        vi: cây thông Nô-en
      examples:
        - target: Unser Weihnachtsbaum steht im Wohnzimmer.
          translation:
            vi: Cây thông Nô-en nhà mình đặt ở phòng khách.
      confusion:
        vi: "Từ ghép Weihnacht + s + Baum lấy giống của từ cuối: der Baum → der Weihnachtsbaum. Số nhiều: die Weihnachtsbäume."

  - key: de:item:a2u07-feier
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Feier, -n"
      pos: danh từ
    back:
      meaning:
        vi: buổi lễ, buổi tiệc (một dịp tổ chức cụ thể)
      examples:
        - target: Die Feier beginnt um 19 Uhr.
          translation:
            vi: Buổi tiệc bắt đầu lúc 19 giờ.
      confusion:
        vi: "Hay gặp trong từ ghép: die Geburtstagsfeier (tiệc sinh nhật), die Hochzeitsfeier (tiệc cưới)."

  - key: de:item:a2u07-wuenschen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: wünschen
      pos: động từ
    back:
      meaning:
        vi: chúc; mong muốn
      examples:
        - target: Wir wünschen Ihnen ein frohes neues Jahr!
          translation:
            vi: Chúng tôi chúc anh/chị năm mới vui vẻ!
      confusion:
        vi: "Người nhận lời chúc ở Dativ, điều được chúc ở Akkusativ: Ich wünsche dir (Dat) viel Glück (Akk)."

  - key: de:item:a2u07-anstossen
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: "anstoßen, stößt an, stieß an, hat angestoßen"
      pos: động từ (tách)
    back:
      meaning:
        vi: cụng ly, nâng ly chúc mừng
      examples:
        - target: Um Mitternacht stoßen wir an und wünschen uns ein frohes neues Jahr.
          translation:
            vi: Đúng nửa đêm chúng tôi cụng ly và chúc nhau năm mới vui vẻ.
      confusion:
        vi: "Động từ tách: Wir stoßen an. Khi cụng ly người Đức hay nói \"Prost!\" hoặc \"Zum Wohl!\"."

  # ================= bài 2: mua sắm trực tuyến – tính từ không mạo từ =================
  - key: de:item:a2u07-g-adj-nullartikel
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Adjektiv ohne Artikel: frischer Kaffee, frische Milch, frisches Brot, frische Brötchen"
      pos: ngữ pháp
    back:
      meaning:
        vi: "Khi trước tính từ không có mạo từ, tính từ tự mang đuôi của mạo từ xác định: -er (der), -e (die), -es (das), -e (số nhiều). Akkusativ giống đực -en (frischen Kaffee); Dativ -em, -er, -em, số nhiều -en (mit frischem Obst, Mit freundlichen Grüßen). Câu quảng cáo, đánh giá và lời chào cuối thư dùng dạng này rất nhiều."
      examples:
        - target: Ich trinke morgens gern schwarzen Kaffee.
          translation:
            vi: Buổi sáng tôi thích uống cà phê đen.
        - target: Hier gibt es gebrauchte Bücher in guter Qualität.
          translation:
            vi: Ở đây có sách cũ chất lượng tốt.
        - target: Mit freundlichen Grüßen
          translation:
            vi: Trân trọng (câu chào cuối thư trang trọng)
      confusion:
        vi: "Có mạo từ thì mạo từ đã cho biết giống và cách, nên tính từ chỉ cần -e/-en: der frische Kaffee. Không có mạo từ thì tính từ phải tự \"làm mạo từ\": frischer Kaffee."

  - key: de:item:a2u07-online-shop
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Online-Shop, -s"
      pos: danh từ
    back:
      meaning:
        vi: cửa hàng trực tuyến
      examples:
        - target: In diesem Online-Shop kaufe ich oft Kleidung.
          translation:
            vi: Tôi hay mua quần áo ở cửa hàng online này.
      confusion:
        vi: "Cũng viết liền: der Onlineshop. Giống đực vì từ cuối là der Shop."

  - key: de:item:a2u07-warenkorb
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Warenkorb, ¨-e"
      pos: danh từ
    back:
      meaning:
        vi: giỏ hàng (trên trang mua sắm)
      examples:
        - target: Ich lege die Schuhe in den Warenkorb.
          translation:
            vi: Tôi bỏ đôi giày vào giỏ hàng.
      confusion:
        vi: "die Ware (hàng hóa) + der Korb (cái giỏ) → der Warenkorb."

  - key: de:item:a2u07-liefern
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: liefern
      pos: động từ
    back:
      meaning:
        vi: giao hàng
      examples:
        - target: Der Shop liefert auch am Samstag.
          translation:
            vi: Cửa hàng giao cả thứ Bảy.
      confusion:
        vi: "Động từ có quy tắc: er liefert, hat geliefert."

  - key: de:item:a2u07-zurueckschicken
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: zurückschicken
      pos: động từ (tách)
    back:
      meaning:
        vi: gửi trả lại
      examples:
        - target: Die Jacke ist zu klein. Ich schicke sie zurück.
          translation:
            vi: Cái áo khoác nhỏ quá. Tôi gửi trả lại.
      confusion:
        vi: "Động từ tách: Ich schicke die Jacke zurück. Perfekt: hat zurückgeschickt."

  - key: de:item:a2u07-umtauschen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: umtauschen
      pos: động từ (tách)
    back:
      meaning:
        vi: đổi (hàng đã mua lấy hàng khác)
      examples:
        - target: Kann ich die Hose umtauschen? Sie passt mir nicht.
          translation:
            vi: Tôi đổi cái quần này được không? Nó không vừa với tôi.
      confusion:
        vi: "umtauschen = đổi lấy món khác; zurückschicken/zurückgeben = trả lại hàng. Động từ tách: Ich tausche die Hose um."

  - key: de:item:a2u07-qualitaet
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Qualität, -en"
      ipa: /kvaliˈtɛːt/
      pos: danh từ
    back:
      meaning:
        vi: chất lượng
      examples:
        - target: Die Qualität ist gut, aber der Preis ist hoch.
          translation:
            vi: Chất lượng tốt nhưng giá cao.
      pronunciation_note:
        vi: "qu đọc là \"kv\"; trọng âm ở âm tiết cuối: kva-li-TÄT."

  - key: de:item:a2u07-marke
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Marke, -n"
      pos: danh từ
    back:
      meaning:
        vi: thương hiệu, nhãn hiệu
      examples:
        - target: Welche Marke ist das? – Das ist eine deutsche Marke.
          translation:
            vi: Đây là thương hiệu nào? – Đây là một thương hiệu Đức.
      confusion:
        vi: "Con tem thư là die Briefmarke."

  - key: de:item:a2u07-produkt
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "das Produkt, -e"
      ipa: /pʁoˈdʊkt/
      pos: danh từ
    back:
      meaning:
        vi: sản phẩm
      examples:
        - target: Alle Produkte sind heute zehn Prozent billiger.
          translation:
            vi: Hôm nay mọi sản phẩm đều rẻ hơn mười phần trăm.
      pronunciation_note:
        vi: "Trọng âm ở âm tiết thứ hai: pro-DUKT."

  - key: de:item:a2u07-kunde
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Kunde, -n"
      pos: danh từ
    back:
      meaning:
        vi: khách hàng (nam hoặc chung); nữ là die Kundin, -nen
      examples:
        - target: Der Kunde möchte die Jacke umtauschen.
          translation:
            vi: Vị khách muốn đổi cái áo khoác.
      confusion:
        vi: "der Kunde thêm -n ở mọi cách trừ Nominativ số ít: den Kunden (Akk), dem Kunden (Dat). Đừng nhầm với der Gast (khách mời, khách ở nhà hàng)."

  - key: de:item:a2u07-gebraucht
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: gebraucht
      pos: tính từ
    back:
      meaning:
        vi: đã qua sử dụng, cũ (đồ second-hand)
      examples:
        - target: Ich kaufe oft gebrauchte Bücher im Internet.
          translation:
            vi: Tôi hay mua sách cũ trên mạng.
      confusion:
        vi: "Trái nghĩa: neu. gebraucht vốn là Partizip II của brauchen nhưng ở đây dùng như tính từ nên có đuôi: ein gebrauchtes Fahrrad."

  - key: de:item:a2u07-bestellung
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Bestellung, -en"
      pos: danh từ
    back:
      meaning:
        vi: đơn hàng, việc đặt hàng
      examples:
        - target: Ihre Bestellung ist unterwegs.
          translation:
            vi: Đơn hàng của quý khách đang trên đường giao.
      confusion:
        vi: "Từ động từ bestellen (đặt hàng, gọi món) + hậu tố -ung; danh từ tạo bằng hậu tố -ung là giống cái (die Zeitung, die Wohnung)."

  - key: de:item:a2u07-bewertung
