      examples:
        - target: Die Sendung hat viele junge Zuschauer.
          translation:
            vi: Chương trình có nhiều khán giả trẻ.

  - key: de:item:a2u07-talkshow
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Talkshow, -s"
      pos: danh từ
    back:
      meaning:
        vi: chương trình trò chuyện (có khách mời)
      examples:
        - target: In der Talkshow sprechen heute vier Gäste über das Internet.
          translation:
            vi: Hôm nay trong chương trình trò chuyện có bốn khách mời nói về Internet.

  - key: de:item:a2u07-dokumentarfilm
