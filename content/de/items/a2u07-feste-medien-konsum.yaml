  - key: de:item:a2u07-kommentar
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Kommentar, -e"
      pos: danh từ
    back:
      meaning:
        vi: lời bình luận
      examples:
        - target: Unter dem Video gibt es viele Kommentare.
          translation:
            vi: Dưới video có rất nhiều bình luận.
      pronunciation_note:
