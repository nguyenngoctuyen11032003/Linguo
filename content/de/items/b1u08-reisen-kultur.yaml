        vi: không khí (của một sự kiện); tâm trạng
      examples:
        - target: Die Stimmung auf dem Fest war toll.
          translation:
            vi: Không khí ở lễ hội thật tuyệt.
        - target: Heute bin ich nicht in Stimmung.
          translation:
            vi: Hôm nay tôi không có hứng.
      confusion:
        vi: "Stimmung là không khí, cảm xúc chung; die Atmosphäre gần nghĩa. Đừng nhầm với die Stimme (giọng nói)."

  - key: de:item:b1u08-festumzug
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Festumzug, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: đoàn diễu hành lễ hội
      examples:
        - target: Am Rosenmontag zieht in Köln ein großer Festumzug durch die Stadt.
          translation:
            vi: Vào ngày Thứ Hai Hoa Hồng, một đoàn diễu hành lớn đi qua thành phố Köln.
        - target: Beim Festumzug werfen die Leute Süßigkeiten von den Wagen.
          translation:
            vi: Trong đoàn diễu hành, người ta ném kẹo từ trên xe xuống.
      confusion:
        vi: "der Umzug có hai nghĩa: chuyển nhà và đoàn diễu hành; Festumzug chỉ có nghĩa diễu hành. Số nhiều: die Festumzüge."

  - key: de:item:b1u08-bundesland
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Bundesland, ¨-er
      pos: danh từ
    back:
      meaning:
        vi: bang (của Đức, Áo)
      examples:
        - target: Deutschland hat 16 Bundesländer.
          translation:
            vi: Nước Đức có 16 bang.
        - target: Die Schulferien sind in jedem Bundesland anders.
          translation:
            vi: Kỳ nghỉ học ở mỗi bang mỗi khác.
      confusion:
        vi: "Số nhiều đổi nguyên âm: die Bundesländer. Trong văn bản hành chính, bang thường được gọi ngắn là das Land (das Land Berlin)."

  - key: de:item:b1u08-faehre
    type: vocab
