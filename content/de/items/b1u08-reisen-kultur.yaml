    back:
      meaning:
        vi: phà
      examples:
        - target: Die Fähre zur Insel fährt jede Stunde.
          translation:
            vi: Phà ra đảo chạy mỗi giờ một chuyến.
        - target: Wir setzen mit der Fähre über.
          translation:
            vi: Chúng tôi đi phà sang bờ bên kia.
      confusion:
        vi: "mit der Fähre fahren / übersetzen (đi phà). Đừng nhầm với fahren (lái, đi xe)."

  # ================= Bài 4: Lên kế hoạch chuyến đi – đề nghị bằng Konjunktiv II =================
  - key: de:item:b1u08-g-vorschlag-konjunktiv
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Vorschläge mit Konjunktiv II: Wir könnten … · Wie wäre es, wenn …? · Hättest du Lust, … zu …? · Ich würde vorschlagen, dass … · Es wäre besser, wenn …"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Đề nghị bằng Konjunktiv II nghe mềm và lịch sự hơn câu mệnh lệnh: Wir könnten am Samstag fahren. Wie wäre es, wenn …? và Hättest du Lust, … zu …? mời người kia cùng quyết định. Khi muốn đưa phương án khác: Es wäre besser, wenn … / Ich würde vorschlagen, dass …"
      examples:
        - target: Wir könnten doch mit dem Zug fahren.
          translation:
            vi: Mình đi tàu cũng được mà.
        - target: Wie wäre es, wenn wir in einer Jugendherberge übernachten?
          translation:
            vi: Hay là mình ngủ ở nhà nghỉ thanh niên?
        - target: Hättest du Lust, eine Rundreise durch Bayern zu machen?
          translation:
            vi: Bạn có muốn đi một vòng quanh Bayern không?
      confusion:
        vi: "Sau wenn và dass, động từ đứng cuối (… wenn wir zelten). könnten (Konjunktiv II, có thể) khác konnten (Präteritum, đã có thể): chỉ khác dấu chấm trên o."

  - key: de:item:b1u08-unterkunft
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Unterkunft, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: chỗ ở (khi đi xa)
      examples:
        - target: Wir suchen noch eine günstige Unterkunft.
          translation:
            vi: Chúng tôi vẫn đang tìm một chỗ ở giá rẻ.
        - target: Die Unterkunft war sauber und ruhig.
          translation:
            vi: Chỗ ở sạch sẽ và yên tĩnh.
      confusion:
        vi: "Số nhiều đổi nguyên âm: die Unterkünfte. Unterkunft là từ chung cho mọi loại: Hotel, Pension, Jugendherberge, Ferienwohnung."

  - key: de:item:b1u08-jugendherberge
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Jugendherberge, -n
      pos: danh từ
    back:
      meaning:
        vi: nhà nghỉ thanh niên (chỗ ở giá rẻ, thường có phòng nhiều giường)
      examples:
        - target: Wir haben zwei Nächte in einer Jugendherberge übernachtet.
          translation:
            vi: Chúng tôi ngủ hai đêm ở một nhà nghỉ thanh niên.
        - target: In der Jugendherberge schläft man oft in Zimmern mit mehreren Betten.
          translation:
            vi: Ở nhà nghỉ thanh niên, người ta thường ngủ phòng nhiều giường.
      confusion:
        vi: "Từ ghép: die Jugend (tuổi trẻ) + die Herberge (nhà trọ). Điều kiện ở (thẻ thành viên, giới hạn tuổi) tuỳ từng nơi và có thể thay đổi."

  - key: de:item:b1u08-pension
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Pension, -en
      pos: danh từ
    back:
      meaning:
        vi: nhà nghỉ nhỏ (thường do gia đình kinh doanh); lương hưu
      examples:
        - target: Wir haben ein Zimmer in einer kleinen Pension gebucht.
          translation:
            vi: Chúng tôi đặt một phòng ở một nhà nghỉ nhỏ.
        - target: Die Pension liegt direkt am See.
          translation:
            vi: Nhà nghỉ nằm ngay cạnh hồ.
      confusion:
        vi: "Pension còn có nghĩa là lương hưu (in Pension gehen = về hưu). Halbpension = gồm bữa sáng và một bữa chính; Vollpension = gồm ba bữa."
      pronunciation_note:
        vi: "Từ gốc Pháp, nhấn âm cuối: /pãˈzi̯oːn/; nhiều người cũng đọc /paŋˈzi̯oːn/ hoặc /pɛnˈzi̯oːn/."

  - key: de:item:b1u08-campingplatz
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Campingplatz, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: khu cắm trại
      examples:
        - target: Auf dem Campingplatz kann man ein Zelt aufbauen.
          translation:
            vi: Ở khu cắm trại có thể dựng lều.
        - target: Der Campingplatz liegt direkt am Meer.
          translation:
            vi: Khu cắm trại nằm ngay sát biển.
      pronunciation_note:
        vi: "Camping đọc theo kiểu tiếng Anh: /ˈkɛmpɪŋ/."

  - key: de:item:b1u08-rundreise
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Rundreise, -n
      pos: danh từ
    back:
      meaning:
        vi: chuyến đi vòng (qua nhiều nơi)
      examples:
        - target: Wir machen eine Rundreise durch Vietnam.
          translation:
            vi: Chúng tôi đi một vòng khắp Việt Nam.
        - target: Die Rundreise dauert zwei Wochen.
          translation:
            vi: Chuyến đi vòng kéo dài hai tuần.
      confusion:
        vi: "eine Rundreise durch + Akk machen (đi vòng qua một vùng). Chuyến đi ngắn trong ngày: der Ausflug."

  - key: de:item:b1u08-verbindung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Verbindung, -en
      pos: danh từ
    back:
      meaning:
        vi: tuyến (tàu, xe) kết nối; đường liên lạc
      examples:
        - target: Gibt es eine direkte Verbindung nach Prag?
          translation:
            vi: Có tuyến đi thẳng đến Praha không?
        - target: Die Verbindung ist schlecht, ich höre dich kaum.
          translation:
            vi: Đường truyền kém quá, mình gần như không nghe thấy bạn.
      confusion:
        vi: "Trên ứng dụng tàu xe, Verbindung là một phương án đi (giờ đi, giờ đến, số lần đổi tàu). Động từ: verbinden (nối)."

  - key: de:item:b1u08-ermaessigung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Ermäßigung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự giảm giá (cho một nhóm người)
      examples:
        - target: Studenten bekommen eine Ermäßigung.
          translation:
            vi: Sinh viên được giảm giá.
        - target: Gibt es eine Ermäßigung für Gruppen?
          translation:
            vi: Có giảm giá cho nhóm không?
      confusion:
        vi: "Ermäßigung là giảm giá cho đối tượng (sinh viên, trẻ em, nhóm); der Rabatt là chiết khấu khi mua; das Sonderangebot là hàng khuyến mãi. Tính từ: ermäßigt (ermäßigter Eintritt)."

  - key: de:item:b1u08-stornieren
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: stornieren
      pos: động từ
    back:
      meaning:
        vi: huỷ (đặt chỗ, đơn hàng)
      examples:
        - target: Ich möchte meine Buchung stornieren.
          translation:
            vi: Tôi muốn huỷ đặt chỗ của mình.
        - target: Kann man das Zimmer kostenlos stornieren?
          translation:
            vi: Có huỷ phòng miễn phí được không?
      confusion:
        vi: "Đuôi -ieren nên Partizip không có ge-: storniert. Huỷ một cuộc hẹn thường dùng absagen; huỷ đặt chỗ, đơn hàng dùng stornieren."

  # Zusatzwortschatz B1U08L4 (10 lemma, trường: lưu trú, đi lại)
  - key: de:item:b1u08-buchung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Buchung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự đặt chỗ, đơn đặt (phòng, vé)
      examples:
        - target: Vielen Dank für Ihre Buchung!
          translation:
            vi: Cảm ơn quý khách đã đặt chỗ!
        - target: Die Buchungsnummer finden Sie in der E-Mail.
          translation:
            vi: Quý khách tìm mã đặt chỗ trong e-mail.
      confusion:
        vi: "Động từ: buchen (đặt). Ghép: die Buchungsnummer (mã đặt chỗ), có âm nối -s-."

  - key: de:item:b1u08-anreise
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Anreise, -n
      pos: danh từ
    back:
      meaning:
        vi: chuyến đi đến; ngày đến (nơi lưu trú)
      examples:
        - target: Die Anreise ist am Freitag ab 15 Uhr möglich.
          translation:
            vi: Có thể nhận phòng từ 15 giờ thứ Sáu.
        - target: Wie lange dauert die Anreise mit dem Zug?
          translation:
            vi: Đi tàu đến đó mất bao lâu?
      confusion:
        vi: "Anreise (đến) ↔ Abreise (rời đi). Động từ: anreisen, ist angereist."

  - key: de:item:b1u08-abreise
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Abreise, -n
      pos: danh từ
    back:
      meaning:
        vi: lúc rời đi; ngày trả phòng
      examples:
        - target: Am Tag der Abreise muss man das Zimmer oft bis 10 Uhr verlassen.
          translation:
            vi: Vào ngày đi, thường phải trả phòng trước 10 giờ.
        - target: Kurz vor der Abreise wurde ich krank.
          translation:
            vi: Ngay trước hôm đi thì tôi bị ốm.
      confusion:
        vi: "Động từ: abreisen, ist abgereist (tách, dùng sein)."

  - key: de:item:b1u08-stornierung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Stornierung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự huỷ (đặt chỗ)
      examples:
        - target: Eine kostenlose Stornierung ist bis zwei Tage vor der Anreise möglich.
          translation:
            vi: Có thể huỷ miễn phí đến hai ngày trước ngày đến.
        - target: Ich habe die Bestätigung meiner Stornierung noch nicht bekommen.
          translation:
            vi: Tôi vẫn chưa nhận được xác nhận huỷ.
      confusion:
        vi: "Danh từ của stornieren, đuôi -ung nên giống cái. Điều kiện huỷ miễn phí khác nhau ở mỗi nơi, nên luôn đọc kỹ."

  - key: de:item:b1u08-mitfahrgelegenheit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Mitfahrgelegenheit, -en
      pos: danh từ
    back:
      meaning:
        vi: đi nhờ xe (chia tiền xăng với người lái)
      examples:
        - target: Ich fahre mit einer Mitfahrgelegenheit nach Hamburg.
          translation:
            vi: Tôi đi nhờ xe (có góp tiền) đến Hamburg.
        - target: Mitfahrgelegenheiten findet man oft im Internet.
          translation:
            vi: Chuyến đi nhờ xe thường tìm được trên mạng.
      confusion:
        vi: "Từ ghép dài: mitfahren (đi cùng) + die Gelegenheit (cơ hội). Giống cái theo từ cuối."

  - key: de:item:b1u08-mietwagen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Mietwagen, -
      pos: danh từ
    back:
      meaning:
        vi: xe thuê (ô tô)
      examples:
        - target: Mit dem Mietwagen sind wir flexibler.
          translation:
            vi: Đi xe thuê thì chúng ta linh hoạt hơn.
        - target: Den Mietwagen holen wir am Flughafen ab.
          translation:
            vi: Chúng tôi nhận xe thuê ở sân bay.
      confusion:
        vi: "Từ ghép: mieten (thuê) + der Wagen. Số nhiều giống số ít: die Mietwagen."

  - key: de:item:b1u08-strecke
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Strecke, -n
      pos: danh từ
    back:
      meaning:
        vi: quãng đường; tuyến đường
      examples:
        - target: Die Strecke von Berlin nach München ist etwa 600 Kilometer lang.
          translation:
            vi: Quãng đường từ Berlin đến München dài khoảng 600 ki-lô-mét.
        - target: Auf dieser Strecke fahren die Züge jede halbe Stunde.
          translation:
            vi: Trên tuyến này, cứ nửa tiếng có một chuyến tàu.
      confusion:
        vi: "Strecke là quãng/tuyến (khoảng cách, đường đi); der Weg là đường đi nói chung, cách đi."

  - key: de:item:b1u08-aufenthalt
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Aufenthalt, -e
      pos: danh từ
    back:
      meaning:
        vi: thời gian lưu lại, kỳ lưu trú
      examples:
        - target: Wir wünschen Ihnen einen schönen Aufenthalt!
          translation:
            vi: Chúc quý khách có kỳ lưu trú vui vẻ!
        - target: Während meines Aufenthalts in Wien habe ich viel gelernt.
          translation:
            vi: Trong thời gian ở Viên, tôi đã học được nhiều điều.
      confusion:
        vi: "Ở ga tàu, Aufenthalt còn là thời gian tàu dừng: Der Zug hat fünf Minuten Aufenthalt."

  - key: de:item:b1u08-reiseziel
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Reiseziel, -e
      pos: danh từ
    back:
      meaning:
        vi: điểm đến (du lịch)
      examples:
        - target: Die Ostsee ist ein beliebtes Reiseziel.
          translation:
            vi: Biển Baltic là một điểm đến được ưa chuộng.
        - target: Was ist dein nächstes Reiseziel?
          translation:
            vi: Điểm đến tiếp theo của bạn là đâu?
      confusion:
        vi: "Từ ghép: die Reise + das Ziel (đích), nên giống trung theo từ cuối."

  - key: de:item:b1u08-wanderung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Wanderung, -en
      pos: danh từ
    back:
      meaning:
        vi: chuyến đi bộ đường dài (dã ngoại)
      examples:
        - target: Wir könnten eine Wanderung in den Bergen machen.
          translation:
            vi: Mình có thể đi bộ đường dài trên núi.
        - target: Die Wanderung dauert etwa vier Stunden.
          translation:
            vi: Chuyến đi bộ kéo dài khoảng bốn tiếng.
      confusion:
        vi: "eine Wanderung machen = wandern (đi bộ đường dài). Khác với spazieren gehen (đi dạo ngắn)."
