        vi: trang phục hoá trang; bộ vest nữ
      examples:
        - target: Was für ein Kostüm trägst du im Karneval?
          translation:
            vi: Dịp Karneval bạn mặc đồ hoá trang gì?
        - target: Die Kinder haben ihre Kostüme selbst gemacht.
          translation:
            vi: Bọn trẻ tự làm đồ hoá trang của mình.
      confusion:
        vi: "Ngoài đồ hoá trang, das Kostüm còn là bộ vest nữ (áo khoác + váy). Trọng âm ở âm tiết thứ hai: Kos-TÜM."

  - key: de:item:b1u08-sich-verkleiden
