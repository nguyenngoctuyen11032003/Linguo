    skill_tags: [vocabulary]
    front:
      text: die Lederhose, -n
      pos: danh từ
    back:
      meaning:
        vi: quần da (trang phục truyền thống vùng Bayern, Áo)
      examples:
        - target: Zum Volksfest trägt er eine Lederhose.
          translation:
            vi: Anh ấy mặc quần da đi lễ hội.
        - target: Lederhosen sind teuer, aber sie halten sehr lange.
          translation:
            vi: Quần da đắt nhưng dùng được rất lâu.
      confusion:
        vi: "Từ ghép: das Leder (da) + die Hose, nên giống cái theo từ cuối. Trang phục nữ tương ứng là das Dirndl."

  - key: de:item:b1u08-schmuecken
    type: vocab
