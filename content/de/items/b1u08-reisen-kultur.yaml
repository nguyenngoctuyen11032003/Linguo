      examples:
        - target: Auf dem Weihnachtsmarkt trinken viele Leute Glühwein.
          translation:
            vi: Ở chợ Giáng sinh, nhiều người uống rượu vang nóng.
        - target: Für Kinder gibt es Punsch ohne Alkohol.
          translation:
            vi: Trẻ em thì có nước trái cây nóng không cồn.
      confusion:
        vi: "Từ ghép: glühen (nóng rực) + der Wein. Ở nhiều chợ, cốc được tính thêm tiền cọc (Pfand) và trả lại khi bạn trả cốc."

  - key: de:item:b1u08-lederhose
    type: vocab
