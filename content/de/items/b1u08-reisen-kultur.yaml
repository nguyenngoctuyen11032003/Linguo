      pos: danh từ
    back:
      meaning:
        vi: chợ Giáng sinh
      examples:
        - target: Viele Weihnachtsmärkte öffnen Ende November.
          translation:
            vi: Nhiều chợ Giáng sinh mở cửa vào cuối tháng Mười Một.
        - target: Wollen wir am Samstag auf den Weihnachtsmarkt gehen?
          translation:
            vi: Thứ Bảy mình đi chợ Giáng sinh nhé?
      confusion:
        vi: "Số nhiều đổi nguyên âm: die Weihnachtsmärkte. Đi chợ: auf den Weihnachtsmarkt gehen (Wohin? + Akk); ở chợ: auf dem Weihnachtsmarkt."

  - key: de:item:b1u08-gluehwein
    type: vocab
