    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: schmücken
      pos: động từ
    back:
      meaning:
        vi: trang trí (cho đẹp, nhất là dịp lễ)
      examples:
        - target: Vor Weihnachten schmücken viele Familien einen Weihnachtsbaum.
          translation:
            vi: Trước Giáng sinh, nhiều gia đình trang trí cây thông Noel.
        - target: Zum Tết schmücken viele Familien ihre Wohnung mit Blumen.
          translation:
            vi: Dịp Tết, nhiều gia đình trang trí nhà cửa bằng hoa.
      confusion:
        vi: "Động từ yếu: schmückte, hat geschmückt. Danh từ der Schmuck = đồ trang sức, đồ trang trí."

  - key: de:item:b1u08-stimmung
    type: vocab
