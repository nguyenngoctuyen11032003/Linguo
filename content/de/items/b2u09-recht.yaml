        vi: sự chung sống, quan hệ với nhau
      examples:
        - target: Ein gutes Miteinander im Haus ist uns wichtig.
          translation:
            vi: Quan hệ tốt đẹp giữa mọi người trong toà nhà rất quan trọng với chúng tôi.
        - target: Das Miteinander der Generationen funktioniert hier gut.
          translation:
            vi: Ở đây các thế hệ sống chung với nhau rất hoà hợp.
      confusion:
        vi: "Danh từ (viết hoa, có mạo từ das) khác trạng từ miteinander (viết thường): Wir reden miteinander."

  - key: de:item:b2u09-gegenseitig
    type: vocab
