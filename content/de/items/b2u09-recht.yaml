# Học liệu unit B2U09 "Luật pháp và cuộc sống chung" (Recht und Zusammenleben), chương trình de:program:b2.
# Theo ma trận docs/superpowers/specs/2026-10-17-linguo-german-syllabus.md (B2U09L1–L4); từ bổ sung (Zusatzwortschatz) ghi chú ngay trên nhóm item.
# Lưu ý chung: đây chỉ là học liệu luyện ngôn ngữ, không phải tư vấn pháp lý; mọi tình huống, tên người, tên công ty là hư cấu.
schema_version: 1
demo: false
status: published
reviewed_by: "Claude (AI) — ủy quyền bởi Nguyễn Ngọc Tuyền; chưa qua giáo viên tiếng Đức bản ngữ"
reviewed_at: "2026-10-17T12:00:00+07:00"
