          translation:
            vi: Nội quy quy định xe đạp phải để dưới tầng hầm.
        - target: Du kannst mir nicht vorschreiben, was ich anziehe.
          translation:
            vi: Cậu không thể bắt mình phải mặc gì.
      confusion:
        vi: "Động từ tách: Das Gesetz schreibt es vor. Danh từ: die Vorschrift."

  # ================= Bài 4: Khiếu nại trang trọng =================
  - key: de:item:b2u09-g-beschwerde-redemittel
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "Redemittel für Beschwerden: Hiermit möchte ich mich über … beschweren. · Ich fordere Sie auf, … zu … · Ich gehe davon aus, dass … · Andernfalls sehe ich mich gezwungen, …"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Thư khiếu nại trang trọng thường đi theo thứ tự: sự việc (Am 3. Mai habe ich … bestellt), vấn đề, yêu cầu cụ thể kèm thời hạn (Ich fordere Sie auf, … bis zum … zu …) và bước tiếp theo nếu không được giải quyết (Andernfalls sehe ich mich gezwungen, …). Giọng văn kiên quyết nhưng lịch sự: Konjunktiv II làm lời yêu cầu mềm hơn (Ich wäre Ihnen dankbar, wenn …), còn lời lẽ gay gắt (Das ist eine Frechheit!) làm thư mất tác dụng. Ich gehe davon aus, dass … (tôi cho rằng …) cho thấy bạn coi điều đó là đương nhiên."
      examples:
        - target: Hiermit möchte ich mich über die mangelhafte Reparatur beschweren.
          translation:
            vi: Bằng thư này, tôi muốn khiếu nại về việc sửa chữa kém chất lượng.
        - target: Ich fordere Sie auf, mir den Kaufpreis bis zum 30. November zu erstatten.
          translation:
            vi: Tôi yêu cầu quý công ty hoàn trả tiền hàng cho tôi chậm nhất là ngày 30 tháng 11.
        - target: Andernfalls sehe ich mich gezwungen, mich an die Verbraucherzentrale zu wenden.
          translation:
            vi: Nếu không, tôi buộc phải liên hệ trung tâm tư vấn người tiêu dùng.
      confusion:
        vi: "Ich fordere Sie auf (yêu cầu dứt khoát) mạnh hơn Ich bitte Sie (đề nghị). Đừng quá rụt rè (Vielleicht könnten Sie eventuell …) nhưng cũng đừng đe doạ; luôn nêu yêu cầu cụ thể và thời hạn."

  - key: de:item:b2u09-reklamation
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Reklamation, -en
      pos: danh từ
    back:
      meaning:
        vi: khiếu nại về hàng hoá/dịch vụ bị lỗi
      examples:
        - target: Ich habe eine Reklamation zu meiner Bestellung.
          translation:
            vi: Tôi có khiếu nại về đơn hàng của mình.
        - target: Ihre Reklamation wird so schnell wie möglich bearbeitet.
          translation:
            vi: Khiếu nại của quý khách sẽ được xử lý nhanh nhất có thể.
      confusion:
        vi: "Reklamation là khiếu nại về hàng lỗi (đòi sửa, đổi, trả tiền); die Beschwerde rộng hơn (cả thái độ phục vụ, tiếng ồn …). Không nhầm với die Reklame (quảng cáo)."

  - key: de:item:b2u09-reklamieren
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: reklamieren
      pos: động từ
    back:
      meaning:
        vi: khiếu nại (hàng lỗi), đòi đổi/sửa
      examples:
        - target: Ich möchte diesen Wasserkocher reklamieren.
          translation:
            vi: Tôi muốn khiếu nại chiếc ấm đun nước này.
        - target: Sie hat die kaputte Lampe beim Händler reklamiert.
          translation:
            vi: Cô ấy đã khiếu nại chiếc đèn hỏng với cửa hàng.
      confusion:
        vi: "Đuôi -ieren nên Partizip không có ge-: hat reklamiert. Tân ngữ là món hàng (Akk): etwas reklamieren."

  - key: de:item:b2u09-erstattung
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Erstattung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự hoàn trả (tiền)
      examples:
        - target: Ich bitte um Erstattung des Kaufpreises.
          translation:
            vi: Tôi đề nghị được hoàn trả tiền hàng.
        - target: Wann erhalte ich die Erstattung?
          translation:
            vi: Khi nào tôi nhận được tiền hoàn trả?
      confusion:
        vi: "Từ erstatten. Cụm trang trọng: um Erstattung bitten; die Erstattung + Genitiv (des Kaufpreises, der Kosten)."

  - key: de:item:b2u09-erstatten
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: erstatten
      pos: động từ
    back:
      meaning:
        vi: hoàn trả (tiền, chi phí)
      examples:
        - target: Wir erstatten Ihnen den vollen Betrag.
          translation:
            vi: Chúng tôi hoàn trả cho quý khách toàn bộ số tiền.
        - target: Die Fahrtkosten werden erstattet.
          translation:
            vi: Chi phí đi lại được hoàn trả.
      confusion:
        vi: "jemandem (Dat) etwas (Akk) erstatten. Cụm khác: Anzeige erstatten (trình báo với cảnh sát)."

  - key: de:item:b2u09-mangel
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: der Mangel, ¨-
      pos: danh từ
    back:
      meaning:
        vi: khuyết tật, lỗi (của hàng hoá, nhà); sự thiếu
      examples:
        - target: Das Gerät hat einen technischen Mangel.
          translation:
            vi: Thiết bị có một lỗi kỹ thuật.
        - target: Bei der Übergabe der Wohnung haben wir mehrere Mängel festgestellt.
          translation:
            vi: Khi nhận bàn giao căn hộ, chúng tôi phát hiện nhiều chỗ hư hỏng.
      confusion:
        vi: "Số nhiều đổi a → ä: die Mängel. Mangel an + Dat = sự thiếu (Mangel an Zeit, aus Mangel an Beweisen)."

  - key: de:item:b2u09-entschaedigung
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Entschädigung, -en
      pos: danh từ
    back:
      meaning:
        vi: tiền bồi thường, sự đền bù
      examples:
        - target: Wegen der Verspätung habe ich eine Entschädigung bekommen.
          translation:
            vi: Vì chuyến đi bị trễ, tôi đã nhận được tiền bồi thường.
        - target: Die Firma bot uns eine kleine Entschädigung an.
          translation:
            vi: Công ty đề nghị bồi thường cho chúng tôi một khoản nhỏ.
      confusion:
        vi: "Entschädigung (bồi thường cho thiệt hại, phiền phức) khác Erstattung (trả lại đúng số tiền đã trả)."

  - key: de:item:b2u09-kulanz
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Kulanz (Sg.)
      ipa: /kuˈlants/
      pos: danh từ
    back:
      meaning:
        vi: thiện chí (người bán tự nguyện giải quyết dù không bắt buộc)
      examples:
        - target: Aus Kulanz hat der Händler das Gerät umgetauscht.
          translation:
            vi: Vì thiện chí, cửa hàng đã đổi thiết bị cho tôi.
        - target: Vielleicht repariert die Firma das Handy auf Kulanz.
          translation:
            vi: Có thể công ty sẽ sửa điện thoại theo diện thiện chí.
      confusion:
        vi: "Cụm cố định: aus Kulanz, auf Kulanz, eine Kulanzlösung. Kulanz là thiện chí, không phải nghĩa vụ."

  - key: de:item:b2u09-fristgerecht
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: fristgerecht
      pos: tính từ
    back:
      meaning:
        vi: đúng hạn, trong thời hạn
      examples:
        - target: Ich habe die Ware fristgerecht zurückgeschickt.
          translation:
            vi: Tôi đã gửi trả hàng đúng hạn.
        - target: Bitte zahlen Sie die Rechnung fristgerecht.
          translation:
            vi: Xin thanh toán hoá đơn đúng hạn.
      confusion:
        vi: "die Frist (thời hạn) + gerecht (phù hợp). Gần nghĩa: rechtzeitig (kịp lúc) – từ hằng ngày hơn."

  # --- Từ bổ sung B2U09L4 (9 lemma: khiếu nại, quyền người tiêu dùng) ---
  - key: de:item:b2u09-mangelhaft
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: mangelhaft
      pos: tính từ
    back:
      meaning:
        vi: có lỗi, kém chất lượng
      examples:
        - target: Die gelieferte Ware war mangelhaft.
          translation:
            vi: Hàng được giao bị lỗi.
        - target: Die Reparatur wurde mangelhaft ausgeführt.
          translation:
            vi: Việc sửa chữa được làm kém chất lượng.
      confusion:
        vi: "Trong mua bán, mangelhaft = hàng có khuyết tật (der Mangel). Ở trường học Đức, mangelhaft còn là điểm 5 (không đạt) trong thang 1–6 (1 sehr gut … 5 mangelhaft, 6 ungenügend); đừng nhầm hai nghĩa."

  - key: de:item:b2u09-beschaedigt
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: beschädigt
      pos: tính từ
    back:
      meaning:
        vi: bị hư hỏng
      examples:
        - target: Das Paket kam beschädigt an.
          translation:
            vi: Gói hàng đến nơi trong tình trạng bị hỏng.
        - target: Die beschädigte Ware schicke ich Ihnen zurück.
          translation:
            vi: Tôi gửi trả quý công ty món hàng bị hỏng.
      confusion:
        vi: "Phân từ của beschädigen (làm hỏng), dùng như tính từ nên có đuôi: die beschädigte Ware, ein beschädigtes Paket."

  - key: de:item:b2u09-bestellnummer
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Bestellnummer, -n
      pos: danh từ
    back:
      meaning:
        vi: mã số đơn hàng
      examples:
        - target: Nennen Sie mir bitte Ihre Bestellnummer.
          translation:
            vi: Xin quý khách cho tôi biết mã đơn hàng.
        - target: Die Bestellnummer finden Sie in der Bestätigungsmail.
          translation:
            vi: Mã đơn hàng có trong email xác nhận.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối: die Nummer → die Bestellnummer."

  - key: de:item:b2u09-ersatz
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Ersatz (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: đồ thay thế; sự bồi thường
      examples:
        - target: Als Ersatz bekommen Sie ein neues Gerät.
          translation:
            vi: Quý khách sẽ nhận một thiết bị mới để thay thế.
        - target: Ich erwarte umgehend Ersatz.
          translation:
            vi: Tôi mong được thay thế ngay.
      confusion:
        vi: "als Ersatz = để thay thế. Từ ghép hay gặp: das Ersatzteil (phụ tùng), der Schadensersatz (tiền bồi thường thiệt hại)."

  - key: de:item:b2u09-kaufbeleg
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Kaufbeleg, -e
      pos: danh từ
    back:
      meaning:
        vi: chứng từ mua hàng (hoá đơn, biên lai)
      examples:
        - target: Bitte legen Sie eine Kopie des Kaufbelegs bei.
          translation:
            vi: Xin gửi kèm bản sao chứng từ mua hàng.
        - target: Ohne Kaufbeleg ist ein Umtausch oft schwierig.
          translation:
            vi: Không có hoá đơn thì việc đổi hàng thường khó khăn.
      confusion:
        vi: "der Beleg = chứng từ; der Kassenbon/der Kassenzettel là cách nói thường ngày cho biên lai ở quầy thu ngân."

  - key: de:item:b2u09-gutschrift
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Gutschrift, -en
      pos: danh từ
    back:
      meaning:
        vi: khoản ghi có, tiền được trả lại vào tài khoản; phiếu ghi có
      examples:
        - target: Die Gutschrift erscheint in wenigen Tagen auf Ihrem Konto.
          translation:
            vi: Khoản tiền hoàn sẽ hiện trong tài khoản của quý khách sau vài ngày.
        - target: Statt Bargeld hat sie eine Gutschrift bekommen.
          translation:
            vi: Thay vì tiền mặt, cô ấy nhận được phiếu ghi có.
      confusion:
        vi: "Gutschrift khác der Gutschein (phiếu quà tặng, phiếu mua hàng), dù nghĩa gần nhau."

  - key: de:item:b2u09-verbraucherzentrale
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Verbraucherzentrale, -n
      pos: danh từ
    back:
      meaning:
        vi: trung tâm tư vấn bảo vệ người tiêu dùng
      examples:
        - target: Bei Problemen kann man sich an die Verbraucherzentrale wenden.
          translation:
            vi: Khi gặp vấn đề, có thể liên hệ trung tâm tư vấn người tiêu dùng.
        - target: Die Verbraucherzentrale hat mich gut beraten.
          translation:
            vi: Trung tâm tư vấn người tiêu dùng đã tư vấn cho tôi rất tốt.
      confusion:
        vi: "Ở Đức, mỗi bang có một Verbraucherzentrale riêng; dịch vụ và chi phí tư vấn có thể khác nhau và thay đổi, nên hỏi trước."

  - key: de:item:b2u09-unverzueglich
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: unverzüglich
      pos: tính từ
    back:
      meaning:
        vi: ngay lập tức, không chậm trễ (trang trọng)
      examples:
        - target: Bitte melden Sie Schäden unverzüglich.
          translation:
            vi: Xin báo hư hỏng ngay lập tức.
        - target: Ich bitte Sie, den Fehler unverzüglich zu beheben.
          translation:
            vi: Tôi đề nghị quý công ty khắc phục lỗi ngay.
      confusion:
        vi: "Từ văn bản trang trọng; khi nói hằng ngày dùng sofort. Gần nghĩa: umgehend."

  - key: de:item:b2u09-zumutung
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Zumutung, -en
      pos: danh từ
    back:
      meaning:
        vi: điều quá đáng, khó chấp nhận
      examples:
        - target: Drei Wochen ohne Heizung sind eine Zumutung.
          translation:
            vi: Ba tuần không có lò sưởi là điều không thể chấp nhận được.
        - target: Diese Wartezeit ist eine Zumutung für die Kunden.
          translation:
            vi: Thời gian chờ như thế này là quá đáng với khách hàng.
      confusion:
        vi: "Từ khá mạnh: trong thư trang trọng, bạn có thể viết mềm hơn (Das ist für mich nicht akzeptabel). Động từ: jemandem etwas zumuten."
