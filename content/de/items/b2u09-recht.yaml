          translation:
            vi: Hàng xóm giúp đỡ lẫn nhau.
        - target: Gegenseitiger Respekt ist die Grundlage.
          translation:
            vi: Tôn trọng lẫn nhau là nền tảng.
      confusion:
        vi: "sich gegenseitig là cách nói hằng ngày cho \"lẫn nhau\"; einander trang trọng hơn. Không dùng cả hai cùng lúc (\"sich gegenseitig einander\" là sai)."

  - key: de:item:b2u09-vorschreiben
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: vorschreiben, schrieb vor, hat vorgeschrieben
      pos: động từ
    back:
