        - target: Ohne Rücksichtnahme funktioniert das Zusammenleben nicht.
          translation:
            vi: Thiếu sự nhường nhịn thì không thể sống chung được.
      confusion:
        vi: "Danh từ hoá từ cụm Rücksicht nehmen (auf + Akk). Văn bản thông báo hay dùng Rücksichtnahme; khi nói thường dùng Rücksicht."

  - key: de:item:b2u09-miteinander
