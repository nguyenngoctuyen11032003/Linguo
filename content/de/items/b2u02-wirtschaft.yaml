items:
  # ================= Bài 1: Thay thế bị động (sich lassen, sein/haben + zu) =================
  - key: de:item:b2u02-g-sich-lassen
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "sich lassen + Infinitiv: Das Problem lässt sich lösen. (= kann gelöst werden)"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "sich lassen + nguyên thể diễn tả một việc CÓ THỂ được làm, giống \"… được\" trong \"vấn đề này giải quyết được\". Chủ ngữ là vật hay việc chịu tác động, lassen chia theo chủ ngữ, nguyên thể đứng cuối: Das Problem lässt sich lösen = Das Problem kann gelöst werden. Phủ định bằng nicht: Das lässt sich nicht ändern."
      examples:
        - target: Viele Probleme lassen sich durch eine bessere Planung lösen.
          translation:
            vi: Nhiều vấn đề có thể giải quyết được nhờ lập kế hoạch tốt hơn.
        - target: Der Verlust ließ sich leider nicht vermeiden.
          translation:
            vi: Tiếc là khoản lỗ đã không thể tránh được.
      confusion:
        vi: "Khác với lassen ở A2 (Ich lasse mein Auto reparieren = tôi mang xe đi sửa): ở đây có sich và chủ ngữ là vật, không phải người nhờ. Cấu trúc này thường dùng với động từ có tân ngữ Akkusativ như lösen, ändern, erklären, vermeiden."

  - key: de:item:b2u02-g-sein-zu
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "sein + zu + Infinitiv: Der Antrag ist bis Freitag einzureichen."
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "sein + zu + nguyên thể thay cho câu bị động, mang nghĩa \"phải được\" hoặc \"có thể được\" tùy ngữ cảnh: Der Antrag ist bis Freitag einzureichen = muss eingereicht werden; Das Problem ist leicht zu lösen = kann leicht gelöst werden. Với động từ tách, zu chen giữa tiền tố và gốc, viết liền: einzureichen, abzugeben."
      examples:
        - target: Die Rechnung ist innerhalb von 14 Tagen zu bezahlen.
          translation:
            vi: Hóa đơn phải được thanh toán trong vòng 14 ngày.
        - target: Der Rückgang des Umsatzes ist kaum zu erklären.
          translation:
            vi: Sự sụt giảm doanh thu hầu như không thể giải thích được.
      confusion:
        vi: "Đừng đọc \"ist zu …\" thành \"đóng\": Die Tür ist zu = cửa đóng, nhưng Die Tür ist leicht zu öffnen = cửa dễ mở. Hạn chót, quy định thường cho nghĩa \"phải\"; leicht, schwer, kaum, nicht thường cho nghĩa \"có thể / không thể\"."

  - key: de:item:b2u02-g-haben-zu
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "haben + zu + Infinitiv: Wir haben das bis morgen zu erledigen. (= müssen)"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "haben + zu + nguyên thể là câu chủ động có nghĩa như müssen, nghe trang trọng hoặc mang tính yêu cầu hơn. Chủ ngữ là người phải làm việc đó, khác với sein + zu (chủ ngữ là việc được làm). Wir haben den Bericht bis Freitag abzugeben = Wir müssen den Bericht bis Freitag abgeben."
      examples:
        - target: Wir haben noch einige Fragen zu klären.
          translation:
            vi: Chúng tôi còn phải làm rõ một vài câu hỏi.
        - target: Ich habe heute noch viel zu tun.
          translation:
            vi: Hôm nay tôi còn nhiều việc phải làm.
      confusion:
        vi: "Người làm → haben zu (Wir haben den Bericht abzugeben); việc được làm → sein zu (Der Bericht ist abzugeben). Ich habe nichts zu tun = tôi không có việc gì để làm."

  # --- Từ mới theo ma trận (trường: thị trường) ---
  - key: de:item:b2u02-wirtschaft
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Wirtschaft (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: nền kinh tế, kinh tế
      examples:
        - target: Der Tourismus spielt für die Wirtschaft vieler Länder eine wichtige Rolle.
          translation:
            vi: Du lịch đóng vai trò quan trọng đối với nền kinh tế của nhiều nước.
        - target: Die Krise hat der Wirtschaft stark geschadet.
          translation:
            vi: Cuộc khủng hoảng đã gây thiệt hại nặng cho nền kinh tế.
      confusion:
        vi: "Từ ghép thường gặp: die Wirtschaftskrise (khủng hoảng kinh tế), der Wirtschaftsteil (mục kinh tế trên báo). Ở miền Nam nước Đức và Áo, die Wirtschaft trong khẩu ngữ còn có nghĩa là quán ăn bình dân."

  - key: de:item:b2u02-wirtschaftlich
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: wirtschaftlich
      pos: tính từ
    back:
      meaning:
        vi: (thuộc về) kinh tế; tiết kiệm, có hiệu quả kinh tế
      examples:
        - target: Die wirtschaftliche Lage des Unternehmens ist schwierig.
          translation:
            vi: Tình hình kinh tế của doanh nghiệp đang khó khăn.
        - target: Dieses Auto fährt sehr wirtschaftlich.
          translation:
            vi: Chiếc xe này chạy rất tiết kiệm (nhiên liệu).
      confusion:
        vi: "Hai nghĩa: \"thuộc về kinh tế\" (die wirtschaftliche Entwicklung) và \"tiết kiệm, hiệu quả\" (wirtschaftlich arbeiten). Danh từ: die Wirtschaftlichkeit."

  - key: de:item:b2u02-markt
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Markt, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: chợ; thị trường
      examples:
        - target: Samstags kaufe ich Gemüse auf dem Markt.
          translation:
            vi: Thứ Bảy nào tôi cũng mua rau ở chợ.
        - target: Das Unternehmen will ein neues Produkt auf den Markt bringen.
          translation:
            vi: Doanh nghiệp muốn tung một sản phẩm mới ra thị trường.
      confusion:
        vi: "Dùng giới từ auf: auf dem Markt (ở chợ, trên thị trường), auf den Markt bringen (tung ra thị trường). Số nhiều: die Märkte."

  - key: de:item:b2u02-nachfrage
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Nachfrage (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: cầu, nhu cầu (mua hàng)
      examples:
        - target: Im Sommer steigt die Nachfrage nach Klimaanlagen.
          translation:
            vi: Vào mùa hè, nhu cầu mua máy điều hòa tăng lên.
        - target: Angebot und Nachfrage bestimmen den Preis.
          translation:
            vi: Cung và cầu quyết định giá cả.
      confusion:
        vi: "die Nachfrage nach + Dativ (nhu cầu về cái gì). Cặp từ: das Angebot (cung) – die Nachfrage (cầu)."

  - key: de:item:b2u02-wettbewerb
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Wettbewerb, -e
      pos: danh từ
    back:
      meaning:
        vi: sự cạnh tranh; cuộc thi
      examples:
        - target: Der Wettbewerb zwischen den Supermärkten ist hart.
          translation:
            vi: Sự cạnh tranh giữa các siêu thị rất gay gắt.
        - target: Sie hat einen Wettbewerb für junge Gründer gewonnen.
          translation:
            vi: Cô ấy đã thắng một cuộc thi dành cho những người khởi nghiệp trẻ.
      confusion:
        vi: "der Wettbewerb nói về sự cạnh tranh như một hiện tượng (hoặc một cuộc thi); die Konkurrenz cũng là sự cạnh tranh nhưng còn chỉ các đối thủ: zur Konkurrenz wechseln."

  - key: de:item:b2u02-konkurrenz
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Konkurrenz (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự cạnh tranh; các đối thủ cạnh tranh
      examples:
        - target: Die Konkurrenz aus dem Ausland ist groß.
          translation:
            vi: Sự cạnh tranh từ nước ngoài rất lớn.
        - target: Viele Kunden sind zur Konkurrenz gewechselt.
          translation:
            vi: Nhiều khách hàng đã chuyển sang đối thủ cạnh tranh.
      confusion:
        vi: "die Konkurrenz là danh từ tập hợp (các đối thủ nói chung). Một đối thủ cụ thể: der Konkurrent / die Konkurrentin."

  - key: de:item:b2u02-umsatz
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Umsatz, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: doanh thu
      examples:
        - target: Der Umsatz ist im letzten Quartal gestiegen.
          translation:
            vi: Doanh thu đã tăng trong quý vừa rồi.
        - target: Die Firma macht einen Umsatz von zwei Millionen Euro im Jahr.
          translation:
            vi: Công ty đạt doanh thu hai triệu euro mỗi năm.
      confusion:
        vi: "der Umsatz (doanh thu: tổng tiền bán được) khác der Gewinn (lợi nhuận: doanh thu trừ chi phí). Một công ty có thể có doanh thu cao mà vẫn lỗ."

  - key: de:item:b2u02-gewinn
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Gewinn, -e
      pos: danh từ
    back:
      meaning:
        vi: lợi nhuận; giải thưởng (xổ số, trò chơi)
      examples:
        - target: Trotz des hohen Umsatzes war der Gewinn gering.
          translation:
            vi: Mặc dù doanh thu cao, lợi nhuận vẫn thấp.
        - target: Im ersten Jahr hat die Firma noch keinen Gewinn gemacht.
          translation:
            vi: Năm đầu tiên công ty chưa có lãi.
      confusion:
        vi: "Gewinn machen / erzielen = có lãi. Động từ gewinnen = thắng, giành được. Trái nghĩa: der Verlust."

  - key: de:item:b2u02-verlust
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Verlust, -e
      pos: danh từ
    back:
      meaning:
        vi: khoản lỗ; sự mất mát
      examples:
        - target: Das Geschäft hat zwei Jahre lang Verluste gemacht.
          translation:
            vi: Cửa hàng đã thua lỗ suốt hai năm.
        - target: Der Verlust des Arbeitsplatzes ist für viele Menschen ein Schock.
          translation:
            vi: Mất việc làm là một cú sốc với nhiều người.
      confusion:
        vi: "Verluste machen = bị lỗ. Động từ tương ứng là verlieren (mất)."

  # --- Từ bổ sung bài 1 (Zusatzwortschatz, trường thị trường) ---
  - key: de:item:b2u02-anbieter
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Anbieter, -
      pos: danh từ
    back:
      meaning:
        vi: nhà cung cấp (hàng hóa, dịch vụ)
      examples:
        - target: Ich habe zu einem günstigeren Stromanbieter gewechselt.
          translation:
            vi: Tôi đã chuyển sang một nhà cung cấp điện rẻ hơn.
        - target: Auf dem Markt gibt es viele Anbieter von Sprachkursen.
          translation:
            vi: Trên thị trường có nhiều nơi cung cấp khóa học ngoại ngữ.
      confusion:
        vi: "Từ động từ anbieten (chào bán, cung cấp). Giống cái: die Anbieterin."

  - key: de:item:b2u02-hersteller
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Hersteller, -
      pos: danh từ
    back:
      meaning:
        vi: nhà sản xuất
      examples:
        - target: Der Hersteller gibt auf das Gerät zwei Jahre Garantie.
          translation:
            vi: Nhà sản xuất bảo hành thiết bị này hai năm.
        - target: Viele Hersteller lassen ihre Produkte im Ausland produzieren.
          translation:
            vi: Nhiều nhà sản xuất cho sản xuất sản phẩm của họ ở nước ngoài.
      confusion:
        vi: "Từ herstellen (sản xuất). der Hersteller làm ra hàng, der Händler bán hàng."

  - key: de:item:b2u02-dienstleistung
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Dienstleistung, -en
      pos: danh từ
    back:
      meaning:
        vi: dịch vụ
      examples:
        - target: Unsere Firma verkauft keine Waren, sondern Dienstleistungen.
          translation:
            vi: Công ty chúng tôi không bán hàng hóa mà bán dịch vụ.
        - target: Banken und Versicherungen bieten Dienstleistungen an.
          translation:
            vi: Ngân hàng và công ty bảo hiểm cung cấp dịch vụ.
      confusion:
        vi: "die Ware (hàng hóa, vật cụ thể) – die Dienstleistung (dịch vụ). der Dienstleistungssektor = khu vực dịch vụ."

  - key: de:item:b2u02-krise
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Krise, -n
      pos: danh từ
    back:
      meaning:
        vi: cuộc khủng hoảng
      examples:
        - target: Das Unternehmen steckt in einer tiefen Krise.
          translation:
            vi: Doanh nghiệp đang lâm vào khủng hoảng sâu.
        - target: Während der Krise haben viele Betriebe Personal abgebaut.
          translation:
            vi: Trong thời kỳ khủng hoảng, nhiều cơ sở đã cắt giảm nhân sự.
      confusion:
        vi: "in einer Krise stecken = đang lâm vào khủng hoảng. Từ ghép: die Wirtschaftskrise, die Finanzkrise."

  - key: de:item:b2u02-aufschwung
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: der Aufschwung, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: sự phục hồi, đà tăng trưởng (kinh tế)
      examples:
        - target: Nach der Krise kam nur ein langsamer Aufschwung.
          translation:
            vi: Sau khủng hoảng chỉ có một sự phục hồi chậm.
        - target: Der Tourismus in der Region erlebt einen Aufschwung.
          translation:
            vi: Du lịch trong vùng đang khởi sắc.
      confusion:
        vi: "Trái nghĩa: der Abschwung (suy thoái) hoặc die Krise. Số nhiều die Aufschwünge ít dùng."

  - key: de:item:b2u02-wachstum
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Wachstum (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự tăng trưởng
      examples:
        - target: Ein schnelles Wachstum bringt auch Risiken.
          translation:
            vi: Tăng trưởng nhanh cũng mang lại rủi ro.
        - target: Das Wachstum der Firma hat sich verlangsamt.
          translation:
            vi: Tốc độ tăng trưởng của công ty đã chậm lại.
      confusion:
        vi: "Danh từ đuôi -tum phần lớn là giống trung (das Wachstum), nhưng có ngoại lệ: der Irrtum, der Reichtum. Động từ: wachsen (wuchs, ist gewachsen)."

  - key: de:item:b2u02-erzielen
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: erzielen
      pos: động từ
    back:
      meaning:
        vi: đạt được (kết quả, lợi nhuận, doanh thu)
      examples:
        - target: Das Unternehmen hat einen hohen Gewinn erzielt.
          translation:
            vi: Doanh nghiệp đã đạt lợi nhuận cao.
        - target: Mit der neuen Strategie wollen wir bessere Ergebnisse erzielen.
          translation:
            vi: Với chiến lược mới, chúng tôi muốn đạt kết quả tốt hơn.
      confusion:
        vi: "erzielen đi với Gewinn, Umsatz, Ergebnis, Erfolg; với Ziel (mục tiêu) thì dùng erreichen: ein Ziel erreichen."

  - key: de:item:b2u02-ware
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Ware, -n
      pos: danh từ
    back:
      meaning:
        vi: hàng hóa
      examples:
        - target: Die Ware wird morgen geliefert.
          translation:
            vi: Hàng sẽ được giao vào ngày mai.
        - target: Im Hamburger Hafen kommen Waren aus der ganzen Welt an.
          translation:
            vi: Hàng hóa từ khắp thế giới cập cảng Hamburg.
      confusion:
        vi: "Số ít die Ware thường dùng như danh từ tập hợp (lô hàng, hàng). Từ ghép: das Warenhaus (cửa hàng bách hóa)."

  - key: de:item:b2u02-konkurrent
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: der Konkurrent, -en
      pos: danh từ
    back:
      meaning:
        vi: đối thủ cạnh tranh
      examples:
        - target: Unser größter Konkurrent hat die Preise gesenkt.
          translation:
            vi: Đối thủ cạnh tranh lớn nhất của chúng tôi đã hạ giá.
        - target: Wir müssen schneller sein als unsere Konkurrenten.
          translation:
            vi: Chúng tôi phải nhanh hơn các đối thủ.
      confusion:
        vi: "n-Deklination: den/dem/des Konkurrenten. Giống cái: die Konkurrentin; nói chung các đối thủ: die Konkurrenz."

  - key: de:item:b2u02-klaeren
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: klären
      pos: động từ
    back:
      meaning:
        vi: làm rõ, giải quyết (một câu hỏi, một việc)
      examples:
        - target: Diese Frage müssen wir noch mit der Chefin klären.
          translation:
            vi: Câu hỏi này chúng ta còn phải làm rõ với chị trưởng phòng.
        - target: Die Sache ist noch nicht geklärt.
          translation:
            vi: Việc này vẫn chưa được làm rõ.
      confusion:
        vi: "klären dùng với câu hỏi, sự việc chưa rõ; lösen dùng với vấn đề, bài toán. Tính từ gốc: klar (rõ ràng)."

  # ================= Bài 2: Cụm phân từ mở rộng =================
  - key: de:item:b2u02-g-partizipialattribut-erweitert
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "Erweitertes Partizipialattribut: die von der Regierung beschlossenen Maßnahmen"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Giữa mạo từ và danh từ có thể chen cả một cụm dài: mạo từ + [bổ ngữ] + Partizip I/II có đuôi tính từ + danh từ. Khi đọc, đi từ mạo từ nhảy thẳng tới danh từ (die … Maßnahmen), rồi mới đọc phần giữa như một mệnh đề quan hệ rút gọn. Partizip I (steigend) mang nghĩa chủ động, đang diễn ra; Partizip II (beschlossen) thường mang nghĩa bị động hoặc đã xong."
      examples:
        - target: Die seit Monaten steigenden Preise belasten viele Familien.
          translation:
            vi: Giá cả tăng liên tục từ nhiều tháng nay đang đè nặng lên nhiều gia đình.
        - target: Die von der Regierung beschlossenen Maßnahmen sollen die Verbraucher entlasten.
          translation:
            vi: Các biện pháp do chính phủ thông qua nhằm giảm gánh nặng cho người tiêu dùng.
      confusion:
        vi: "Partizip vẫn nhận đuôi như mọi tính từ đứng trước danh từ: die steigenden Preise, ein stark gestiegener Umsatz. Tiếng Việt đặt phần bổ nghĩa sau danh từ, tiếng Đức đặt trước."

  - key: de:item:b2u02-g-relativsatz-partizip-umformung
    type: grammar_point
    level: b2
    difficulty: 4
    skill_tags: [grammar]
    front:
      text: "Relativsatz ↔ Partizipialattribut: die Preise, die seit Monaten steigen ↔ die seit Monaten steigenden Preise"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Chuyển mệnh đề quan hệ thành cụm phân từ qua 4 bước: (1) bỏ đại từ quan hệ; (2) động từ chủ động diễn ra cùng lúc → Partizip I (steigen → steigend), câu bị động (werden + Partizip II) → giữ Partizip II, bỏ werden; (3) đặt phần còn lại của mệnh đề giữa mạo từ và Partizip, giữ thứ tự; (4) thêm đuôi tính từ theo mạo từ và cách. Điều kiện: đại từ quan hệ là chủ ngữ; mệnh đề Akkusativ chủ động (die Waren, die wir importieren) phải đổi sang bị động trước (die von uns importierten Waren), mệnh đề Dativ thì không chuyển được. Khi đọc thì làm ngược lại: bóc cụm ra thành mệnh đề quan hệ."
      examples:
        - target: "die Waren, die aus Asien importiert werden → die aus Asien importierten Waren"
          translation:
            vi: hàng hóa được nhập khẩu từ châu Á
        - target: "der Umsatz, der stark gestiegen ist → der stark gestiegene Umsatz"
          translation:
            vi: doanh thu đã tăng mạnh
      confusion:
        vi: "Động từ chia Perfekt với sein (steigen, sinken) cũng dùng Partizip II nhưng nghĩa chủ động đã xong: die gestiegenen Preise = giá đã tăng; die steigenden Preise = giá đang tăng."

  # --- Từ mới theo ma trận (trường: giá cả, thu nhập) ---
  - key: de:item:b2u02-inflation
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Inflation (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: lạm phát
      examples:
        - target: Bei hoher Inflation verliert das Geld an Wert.
          translation:
            vi: Khi lạm phát cao, đồng tiền mất giá.
        - target: Die Zentralbank versucht, die Inflation niedrig zu halten.
          translation:
            vi: Ngân hàng trung ương cố gắng giữ lạm phát ở mức thấp.
      confusion:
        vi: "Inflation là khi giá cả nói chung tăng và đồng tiền mua được ít hơn. die Inflationsrate = tỉ lệ lạm phát."

  - key: de:item:b2u02-preisanstieg
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Preisanstieg, -e
      pos: danh từ
    back:
      meaning:
        vi: sự tăng giá
      examples:
        - target: Der Preisanstieg bei Lebensmitteln trifft vor allem Familien mit wenig Geld.
          translation:
            vi: Việc giá thực phẩm tăng ảnh hưởng nhất tới các gia đình ít tiền.
        - target: Viele Verbraucher klagen über den Preisanstieg.
          translation:
            vi: Nhiều người tiêu dùng than phiền về việc tăng giá.
      confusion:
        vi: "Từ ghép der Preis + der Anstieg, giống đực theo từ cuối. Gần nghĩa: die Preiserhöhung (việc người bán chủ động tăng giá)."

  - key: de:item:b2u02-kaufkraft
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Kaufkraft (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sức mua
      examples:
        - target: Wenn die Preise schneller steigen als die Löhne, sinkt die Kaufkraft.
          translation:
            vi: Khi giá cả tăng nhanh hơn tiền lương, sức mua giảm.
        - target: Durch die Inflation verliert das Einkommen an Kaufkraft.
          translation:
            vi: Do lạm phát, thu nhập bị giảm sức mua.
      confusion:
        vi: "kaufen + die Kraft (sức) → giống cái theo Kraft."

  - key: de:item:b2u02-lebenshaltungskosten
    type: vocab
    level: b2
    difficulty: 4
    skill_tags: [vocabulary]
    front:
      text: die Lebenshaltungskosten (Pl.)
      pos: danh từ
    back:
      meaning:
        vi: chi phí sinh hoạt
      examples:
        - target: In Großstädten sind die Lebenshaltungskosten meist höher als auf dem Land.
          translation:
            vi: Ở các thành phố lớn, chi phí sinh hoạt thường cao hơn ở nông thôn.
        - target: Wenn die Lebenshaltungskosten steigen, müssen viele Familien sparen.
          translation:
            vi: Khi chi phí sinh hoạt tăng, nhiều gia đình phải tiết kiệm.
      confusion:
        vi: "Chỉ có số nhiều như die Kosten, nên động từ chia số nhiều: Die Lebenshaltungskosten sind … / steigen."

  - key: de:item:b2u02-verbraucher
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Verbraucher, -
      pos: danh từ
    back:
      meaning:
        vi: người tiêu dùng
      examples:
        - target: Die neuen Regeln sollen die Verbraucher besser schützen.
          translation:
            vi: Các quy định mới nhằm bảo vệ người tiêu dùng tốt hơn.
        - target: Viele Verbraucher kaufen inzwischen auch Lebensmittel online.
          translation:
            vi: Nhiều người tiêu dùng nay mua cả thực phẩm qua mạng.
      confusion:
        vi: "Từ verbrauchen (tiêu thụ). Giống cái: die Verbraucherin. Đồng nghĩa trang trọng hơn: der Konsument."

  - key: de:item:b2u02-konsum
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Konsum (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự tiêu dùng
      examples:
        - target: Der private Konsum ist für die Wirtschaft sehr wichtig.
          translation:
            vi: Tiêu dùng của tư nhân rất quan trọng đối với nền kinh tế.
        - target: Viele junge Leute wollen ihren Konsum bewusst reduzieren.
          translation:
            vi: Nhiều người trẻ muốn có ý thức giảm bớt tiêu dùng.
      confusion:
        vi: "Động từ: konsumieren. Trọng âm ở âm tiết thứ hai: Kon-SUM."

  - key: de:item:b2u02-einkommen
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Einkommen, -
      pos: danh từ
    back:
      meaning:
        vi: thu nhập
      examples:
        - target: Einen großen Teil ihres Einkommens gibt sie für die Miete aus.
          translation:
            vi: Cô ấy chi một phần lớn thu nhập cho tiền thuê nhà.
        - target: Familien mit niedrigem Einkommen sparen vor allem beim Essen.
          translation:
            vi: Các gia đình thu nhập thấp tiết kiệm chủ yếu ở khoản ăn uống.
      confusion:
        vi: "das Einkommen (mọi khoản thu) – das Gehalt (lương tháng) – der Lohn (tiền công, thường theo giờ). Genitiv: des Einkommens."

  - key: de:item:b2u02-steuer
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Steuer, -n
      pos: danh từ
    back:
      meaning:
        vi: thuế
      examples:
        - target: Die Regierung will die Steuern für kleine Unternehmen senken.
          translation:
            vi: Chính phủ muốn giảm thuế cho các doanh nghiệp nhỏ.
        - target: Auf fast alle Waren zahlt man Mehrwertsteuer.
          translation:
            vi: Hầu như mọi hàng hóa đều phải chịu thuế giá trị gia tăng.
      confusion:
        vi: "Đừng nhầm: das Steuer, - = tay lái, vô lăng (am Steuer sitzen). die Steuer = thuế; Steuern zahlen = nộp thuế."

  # --- Từ bổ sung bài 2 (Zusatzwortschatz, trường giá cả – thu nhập) ---
  - key: de:item:b2u02-erhoehen
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: erhöhen
      pos: động từ
    back:
      meaning:
        vi: tăng, nâng (giá, thuế, lương)
      examples:
        - target: Der Vermieter will die Miete erhöhen.
          translation:
            vi: Chủ nhà muốn tăng tiền thuê.
        - target: Die Firma hat die Löhne um drei Prozent erhöht.
          translation:
            vi: Công ty đã tăng lương thêm ba phần trăm.
      confusion:
        vi: "erhöhen: ai tăng cái gì (Perfekt với haben); steigen: cái gì tự tăng (Perfekt với sein). Die Händler haben die Preise erhöht ↔ Die Preise sind gestiegen."

  - key: de:item:b2u02-senken
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: senken
      pos: động từ
    back:
      meaning:
        vi: hạ, giảm (giá, thuế, chi phí)
      examples:
        - target: Der Supermarkt hat die Preise für Obst gesenkt.
          translation:
            vi: Siêu thị đã hạ giá trái cây.
        - target: Wir müssen die Kosten senken.
          translation:
            vi: Chúng ta phải giảm chi phí.
      confusion:
        vi: "senken (ai hạ cái gì, haben gesenkt) khác sinken (cái gì tự giảm, ist gesunken): Die Preise sind gesunken."

  - key: de:item:b2u02-erhoehung
    type: vocab
    level: b2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Erhöhung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự tăng (giá, lương, thuế)
      examples:
        - target: Die Gewerkschaft fordert eine Erhöhung der Löhne.
          translation:
            vi: Công đoàn đòi tăng lương.
        - target: Die Erhöhung der Miete kam überraschend.
          translation:
            vi: Việc tăng tiền thuê nhà đến bất ngờ.
      confusion:
        vi: "Từ ghép: die Preiserhöhung, die Steuererhöhung, die Gehaltserhöhung. Trái nghĩa: die Senkung."

  - key: de:item:b2u02-zins
