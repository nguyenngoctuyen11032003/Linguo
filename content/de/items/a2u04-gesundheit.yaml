      examples:
        - target: Meine Kinder essen gern Süßigkeiten.
          translation:
            vi: Các con tôi thích ăn bánh kẹo.

  # ================= bài 4: hiệu thuốc, wenn điều kiện =================
  - key: de:item:a2u04-g-wenn-konditional
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "wenn + Nebensatz (Bedingung): Wenn du Fieber hast, geh zum Arzt."
      pos: ngữ pháp
    back:
      meaning:
        vi: "wenn (nếu) mở đầu câu phụ nêu một điều kiện có thể xảy ra; động từ chia đứng cuối câu phụ. Câu wenn đứng trước thì câu chính bắt đầu ngay bằng động từ: Wenn es nicht besser wird, gehe ich zum Arzt. Câu wenn cũng có thể đứng sau: Ich gehe zum Arzt, wenn es nicht besser wird."
      examples:
        - target: Wenn du Fieber hast, geh zum Arzt.
          translation:
            vi: Nếu bạn bị sốt thì đi khám bác sĩ đi.
        - target: Wenn ich Kopfschmerzen habe, lege ich mich hin.
          translation:
            vi: Nếu bị đau đầu thì tôi nằm nghỉ.
        - target: Rufen Sie die 112 an, wenn es ein Notfall ist.
          translation:
            vi: Nếu là trường hợp khẩn cấp, hãy gọi số 112.
      confusion:
        vi: "wenn (nếu) khác wann (khi nào? – từ để hỏi): Wann kommt der Arzt? ↔ Wenn du Schmerzen hast, …"

  - key: de:item:a2u04-medikament
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: das Medikament, -e
      pos: danh từ
    back:
      meaning:
        vi: thuốc (chữa bệnh)
      examples:
        - target: Nehmen Sie regelmäßig Medikamente?
          translation:
            vi: Ông/bà có dùng thuốc thường xuyên không?
      confusion:
        vi: "Từ có đuôi -ment thường là giống trung: das Medikament. Một viên thuốc là eine Tablette."

  - key: de:item:a2u04-salbe
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: die Salbe, -n
      pos: danh từ
    back:
      meaning:
        vi: thuốc mỡ, thuốc bôi
      examples:
        - target: Haben Sie eine Salbe gegen Rückenschmerzen?
          translation:
            vi: Chị có thuốc bôi trị đau lưng không?

  - key: de:item:a2u04-allergie
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: die Allergie, -n
      pos: danh từ
    back:
      meaning:
        vi: dị ứng
      examples:
        - target: Haben Sie eine Allergie?
          translation:
            vi: Ông/bà có bị dị ứng gì không?
        - target: Ich habe eine Allergie gegen Katzen.
          translation:
            vi: Tôi bị dị ứng với mèo.
      pronunciation_note:
        vi: "Trọng âm ở âm cuối: Al-ler-GIE. Số nhiều die Allergien có thêm một âm tiết: Al-ler-GI-en."

  - key: de:item:a2u04-schmerz
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: der Schmerz, -en
      pos: danh từ
    back:
      meaning:
        vi: cơn đau, sự đau
      examples:
        - target: Wo haben Sie Schmerzen?
          translation:
            vi: Ông/bà đau ở đâu?
      confusion:
        vi: "Thường dùng số nhiều: Ich habe Schmerzen. Ghép với bộ phận cơ thể: Kopfschmerzen, Bauchschmerzen, Rückenschmerzen."

  - key: de:item:a2u04-krankenkasse
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: die Krankenkasse, -n
      pos: danh từ
    back:
      meaning:
        vi: quỹ bảo hiểm y tế
      examples:
        - target: Bei welcher Krankenkasse sind Sie?
          translation:
            vi: Anh/chị đóng bảo hiểm y tế ở quỹ nào?

  - key: de:item:a2u04-versichertenkarte
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Versichertenkarte, -n
      pos: danh từ
    back:
      meaning:
        vi: thẻ bảo hiểm y tế
      examples:
        - target: Bitte bringen Sie Ihre Versichertenkarte mit.
          translation:
            vi: Xin mang theo thẻ bảo hiểm y tế của anh/chị.
      confusion:
        vi: "Ở Đức tên chính thức là elektronische Gesundheitskarte; người ta cũng nói Versichertenkarte hoặc Krankenkassenkarte."

  - key: de:item:a2u04-notfall
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: der Notfall, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: trường hợp khẩn cấp, cấp cứu
      examples:
        - target: Im Notfall rufen Sie die 112 an.
          translation:
            vi: Trong trường hợp khẩn cấp, hãy gọi số 112.

  - key: de:item:a2u04-krankenwagen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: der Krankenwagen, -
      pos: danh từ
    back:
      meaning:
        vi: xe cứu thương
      examples:
        - target: Schnell, ruf einen Krankenwagen!
          translation:
            vi: Nhanh lên, gọi xe cứu thương đi!
      confusion:
        vi: "der Krankenwagen (xe cứu thương) khác das Krankenhaus (bệnh viện)."

  - key: de:item:a2u04-einnehmen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: einnehmen, nimmt ein, nahm ein, hat eingenommen
      pos: động từ
    back:
      meaning:
        vi: uống (thuốc), dùng (thuốc)
      examples:
