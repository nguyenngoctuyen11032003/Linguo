          translation:
            vi: Anh/chị uống thuốc ba lần một ngày, sau khi ăn.
      confusion:
        vi: "Tiếng Việt nói \"uống thuốc\", nhưng tiếng Đức không dùng trinken với viên thuốc: Tabletten einnehmen hoặc nói ngắn Tabletten nehmen."

  - key: de:item:a2u04-nebenwirkung
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Nebenwirkung, -en
      pos: danh từ
    back:
      meaning:
        vi: tác dụng phụ
      examples:
        - target: Hat das Medikament Nebenwirkungen?
          translation:
            vi: Thuốc này có tác dụng phụ không?
      confusion:
        vi: "Danh từ đuôi -ung là giống cái: die Nebenwirkung, số nhiều -en."

  - key: de:item:a2u04-verschreiben
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: verschreiben, verschrieb, hat verschrieben
      pos: động từ
    back:
      meaning:
        vi: kê (đơn thuốc)
      examples:
        - target: Die Ärztin hat mir eine Salbe verschrieben.
          translation:
            vi: Bác sĩ đã kê cho tôi một loại thuốc mỡ.
      confusion:
        vi: "Tiền tố ver- không tách, Partizip II không có ge-: verschrieben."

  - key: de:item:a2u04-rezeptfrei
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: rezeptfrei
      pos: tính từ
    back:
      meaning:
        vi: không cần đơn thuốc
      examples:
        - target: Ist das Medikament rezeptfrei?
          translation:
            vi: Thuốc này mua không cần đơn phải không?
      confusion:
        vi: "-frei = không có, không cần: rezeptfrei (không cần đơn), alkoholfrei (không cồn)."

  - key: de:item:a2u04-pflaster
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: das Pflaster, -
      pos: danh từ
    back:
      meaning:
        vi: băng dán cá nhân
      examples:
        - target: Ich habe mich geschnitten. Hast du ein Pflaster?
          translation:
            vi: Mình bị đứt tay rồi. Bạn có băng dán cá nhân không?

  - key: de:item:a2u04-tropfen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: der Tropfen, -
      pos: danh từ
    back:
      meaning:
        vi: giọt; (số nhiều) thuốc nhỏ
      examples:
        - target: Die Tropfen sind für die Augen.
          translation:
            vi: Thuốc nhỏ này dùng cho mắt.

  - key: de:item:a2u04-wirken
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: wirken
      pos: động từ
    back:
      meaning:
        vi: có tác dụng
      examples:
        - target: Das Medikament wirkt nach einer Stunde.
          translation:
            vi: Thuốc có tác dụng sau một tiếng.
      confusion:
        vi: "Danh từ: die Wirkung (tác dụng) – như trong die Nebenwirkung."

  - key: de:item:a2u04-notaufnahme
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Notaufnahme, -n
      pos: danh từ
    back:
      meaning:
        vi: khoa cấp cứu (của bệnh viện)
      examples:
        - target: In der Notaufnahme muss man manchmal lange warten.
          translation:
            vi: Ở khoa cấp cứu đôi khi phải chờ lâu.

  - key: de:item:a2u04-kopfschmerzen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: die Kopfschmerzen (Pl.)
      pos: danh từ
    back:
      meaning:
        vi: (chứng) đau đầu
      examples:
        - target: Ich habe Kopfschmerzen.
          translation:
            vi: Tôi bị đau đầu.
      confusion:
        vi: "Thường dùng số nhiều, không có mạo từ: Ich habe Kopfschmerzen (không nói \"Ich bin Kopfschmerzen\"). Cùng nghĩa: Mir tut der Kopf weh."

  - key: de:item:a2u04-apotheker
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: der Apotheker, - / die Apothekerin, -nen
      pos: danh từ
