items:
  # ================= Bài 1: Sống khoẻ – bị động với modal, falls =================
  - key: de:item:b1u05-g-passiv-modal
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Passiv mit Modalverb: Das Obst muss gewaschen werden. · …, dass das Obst gewaschen werden muss."
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Động từ khiếm khuyết (müssen, sollen, können, dürfen) chia ở vị trí 2, cuối câu là Partizip II + werden ở dạng nguyên thể: Das Obst sollte gewaschen werden. Trong câu phụ, động từ khiếm khuyết đã chia đứng sau cùng: …, dass das Obst gewaschen werden sollte. Cấu trúc này hay gặp trong lời khuyên, hướng dẫn và nội quy, khi việc cần làm quan trọng hơn người làm."
      examples:
        - target: Obst und Gemüse sollten vor dem Essen gewaschen werden.
          translation:
            vi: Rau quả nên được rửa trước khi ăn.
        - target: Hier darf nicht geraucht werden.
          translation:
            vi: Ở đây không được hút thuốc.
        - target: Viele Ärzte sagen, dass mehr für die Gesundheit getan werden muss.
          translation:
            vi: Nhiều bác sĩ nói rằng cần phải làm nhiều hơn cho sức khoẻ.
      confusion:
        vi: "werden luôn đứng sau Partizip II: Das muss gemacht werden (không nói Das muss werden gemacht). Câu chủ động tương ứng dùng man: Man sollte das Obst waschen."

  - key: de:item:b1u05-g-falls
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "falls: Falls du Fragen hast, ruf mich an."
      pos: liên từ
    back:
      meaning:
        vi: "falls mở đầu câu phụ điều kiện, động từ đứng cuối giống như sau wenn. falls nhấn mạnh rằng điều kiện có thể xảy ra mà cũng có thể không (\"trong trường hợp\", \"lỡ như\"); trong nhiều câu điều kiện, wenn và falls thay cho nhau được. Khác với wenn, falls không mang nghĩa thời gian \"khi, mỗi khi\"."
      examples:
        - target: Falls du Fragen hast, ruf mich einfach an.
          translation:
            vi: Nếu bạn có câu hỏi gì thì cứ gọi cho mình.
        - target: Nimm einen Regenschirm mit, falls es regnet.
          translation:
            vi: Mang theo ô đi, lỡ trời mưa.
      confusion:
        vi: "Wenn ich nach Hause komme, koche ich (khi về đến nhà – việc chắc chắn xảy ra) thì không thay wenn bằng falls được."

  - key: de:item:b1u05-ernaehrung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Ernährung (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: chế độ ăn uống, dinh dưỡng
      examples:
        - target: Eine gesunde Ernährung ist wichtig.
          translation:
            vi: Ăn uống lành mạnh là điều quan trọng.
        - target: Ich achte sehr auf meine Ernährung.
          translation:
            vi: Tôi rất chú ý đến việc ăn uống của mình.
      confusion:
        vi: "Danh từ đuôi -ung là giống cái: die Ernährung. Động từ tương ứng là sich ernähren."

  - key: de:item:b1u05-sich-ernaehren
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: sich ernähren
      pos: động từ
    back:
      meaning:
        vi: ăn uống (theo một cách nào đó), nuôi sống bản thân
      examples:
        - target: Wie ernährst du dich?
          translation:
            vi: Bạn ăn uống thế nào?
        - target: Sie ernährt sich seit zwei Jahren vegetarisch.
          translation:
            vi: Cô ấy ăn chay đã hai năm nay.
      confusion:
        vi: "Cần đại từ phản thân: ich ernähre mich, du ernährst dich. Thường đi với một tính từ chỉ cách: sich gesund / vegetarisch / vegan ernähren."

  - key: de:item:b1u05-bewegung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Bewegung (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự vận động (cơ thể)
      examples:
        - target: Ich brauche mehr Bewegung.
          translation:
            vi: Tôi cần vận động nhiều hơn.
        - target: Bewegung an der frischen Luft tut gut.
          translation:
            vi: Vận động ngoài trời rất tốt cho cơ thể.
      confusion:
        vi: "Với nghĩa \"vận động\" thường dùng số ít. Động từ: sich bewegen (A2). Theo nghĩa \"phong trào\" thì có số nhiều die Bewegungen."

  - key: de:item:b1u05-vegetarisch
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: vegetarisch
      pos: tính từ
    back:
      meaning:
        vi: chay (không ăn thịt, cá)
      examples:
        - target: Isst du vegetarisch?
          translation:
            vi: Bạn ăn chay à?
        - target: Gibt es hier auch vegetarische Gerichte?
          translation:
            vi: Ở đây có món chay không?
      confusion:
        vi: "Người ăn chay: der Vegetarier / die Vegetarierin. Ăn chay kiểu Đức thường vẫn ăn trứng, sữa; không ăn cả những thứ đó là vegan."

  - key: de:item:b1u05-vegan
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: vegan
      pos: tính từ
    back:
      meaning:
        vi: thuần chay (không ăn mọi sản phẩm từ động vật)
      examples:
        - target: Mein Bruder lebt vegan. Er isst keine Eier und trinkt keine Milch.
          translation:
            vi: Anh trai tôi sống thuần chay. Anh ấy không ăn trứng và không uống sữa.
        - target: Das Restaurant bietet viele vegane Gerichte an.
          translation:
            vi: Nhà hàng có nhiều món thuần chay.
      pronunciation_note:
        vi: "Ở Đức thường đọc là ve-GAN, v đọc như \"v\", trọng âm ở âm tiết sau."

  - key: de:item:b1u05-kalorie
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Kalorie, -n
      pos: danh từ
    back:
      meaning:
        vi: calo
      examples:
        - target: Dieser Kuchen hat sehr viele Kalorien.
          translation:
            vi: Cái bánh này có rất nhiều calo.
        - target: Wie viele Kalorien hat ein Apfel?
          translation:
            vi: Một quả táo có bao nhiêu calo?

  - key: de:item:b1u05-vitamin
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Vitamin, -e
      pos: danh từ
    back:
      meaning:
        vi: vitamin
      examples:
        - target: Orangen haben viel Vitamin C.
          translation:
            vi: Cam có nhiều vitamin C.
        - target: In frischem Obst sind viele Vitamine.
          translation:
            vi: Trái cây tươi có nhiều vitamin.
      pronunciation_note:
        vi: "Trọng âm ở cuối: vi-ta-MIN; V đọc như \"v\"."

  - key: de:item:b1u05-ausgewogen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: ausgewogen
      pos: tính từ
    back:
      meaning:
        vi: cân bằng, cân đối
      examples:
        - target: Eine ausgewogene Ernährung ist für viele Menschen das Ziel.
          translation:
            vi: Với nhiều người, ăn uống cân bằng là mục tiêu.
        - target: Mein Frühstück ist nicht sehr ausgewogen.
          translation:
            vi: Bữa sáng của tôi không cân đối lắm.

  - key: de:item:b1u05-verzichten-auf
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: verzichten auf (+ Akk)
      pos: động từ
    back:
      meaning:
        vi: từ bỏ, nhịn, không dùng (cái gì)
      examples:
        - target: Ich verzichte auf Zucker im Kaffee.
          translation:
            vi: Tôi không cho đường vào cà phê.
        - target: Im Moment verzichtet er auf Alkohol.
          translation:
            vi: Hiện giờ anh ấy kiêng rượu bia.
      confusion:
        vi: "Luôn cần auf + Akkusativ: Ich verzichte auf Fleisch (không nói Ich verzichte Fleisch). Partizip II: hat verzichtet."

  # Từ bổ sung (Zusatzwortschatz) bài 1 – trường dinh dưỡng
