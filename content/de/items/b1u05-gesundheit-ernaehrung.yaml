      pos: danh từ
    back:
      meaning:
        vi: giá trị dinh dưỡng
      examples:
        - target: Die Nährwerte stehen auf der Rückseite der Verpackung.
          translation:
            vi: Giá trị dinh dưỡng được ghi ở mặt sau bao bì.
        - target: Dieses Müsli hat einen hohen Nährwert.
          translation:
            vi: Món ngũ cốc này có giá trị dinh dưỡng cao.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối: der Wert → der Nährwert."

  - key: de:item:b1u05-nuss
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Nuss, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: "hạt (quả hạch: óc chó, hạnh nhân…)"
      examples:
        - target: Ich bin allergisch gegen Nüsse.
          translation:
            vi: Tôi bị dị ứng với các loại hạt.
        - target: Kann Spuren von Nüssen enthalten.
          translation:
            vi: Có thể chứa vết các loại hạt.
      confusion:
        vi: "Số nhiều đổi nguyên âm và vẫn viết ss: die Nüsse (u ngắn, nên ss)."

  - key: de:item:b1u05-wuerstchen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Würstchen, -
      pos: danh từ
    back:
      meaning:
        vi: xúc xích nhỏ
      examples:
        - target: Die Kinder essen gern Würstchen.
          translation:
            vi: Bọn trẻ thích ăn xúc xích.
        - target: Ein Würstchen mit Senf, bitte.
          translation:
            vi: Cho một cái xúc xích với mù tạt.
      confusion:
        vi: "Hậu tố -chen làm danh từ nhỏ đi và cho giống trung, thường kèm biến âm: die Wurst → das Würstchen."

  # ================= Bài 4: Không còn nữa – phủ định mở rộng =================
  - key: de:item:b1u05-g-negation-erweitert
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "nicht mehr · kein … mehr · noch nicht · noch kein · gar nicht · überhaupt nicht · nie wieder"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "nicht mehr / kein … mehr = không … nữa (trước kia có, bây giờ thì không): Ich rauche nicht mehr. Ich trinke keinen Alkohol mehr. noch nicht / noch kein = chưa (có thể sau này sẽ có): Ich habe noch keinen Termin. gar nicht, überhaupt nicht nhấn mạnh \"hoàn toàn không\", còn nie wieder là \"không bao giờ … nữa\"."
      examples:
        - target: Seit einem Jahr rauche ich nicht mehr.
          translation:
            vi: Đã một năm nay tôi không hút thuốc nữa.
        - target: Ich habe noch keine Lösung gefunden.
          translation:
            vi: Tôi vẫn chưa tìm ra cách giải quyết.
        - target: Ich gehe heute nicht ins Fitnessstudio.
          translation:
            vi: Hôm nay tôi không đi tập gym.
      confusion:
        vi: "\"không … nữa\" là nicht mehr (không nói nicht noch), \"chưa\" là noch nicht. Phủ định cả câu: nicht đứng gần cuối, trước phần cuối khung câu hoặc cụm nơi chốn (heute nicht ins Fitnessstudio); phủ định riêng một thành phần: nicht đứng ngay trước nó (nicht heute, sondern morgen)."

  - key: de:item:b1u05-sucht
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Sucht, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: chứng nghiện, cơn nghiện
      examples:
        - target: Rauchen kann schnell zur Sucht werden.
          translation:
            vi: Hút thuốc có thể nhanh chóng trở thành nghiện.
        - target: Er hat seine Sucht überwunden.
          translation:
            vi: Anh ấy đã cai được nghiện.
      confusion:
        vi: "Hay gặp trong từ ghép: die Spielsucht (nghiện cờ bạc), die Handysucht (nghiện điện thoại)."

  - key: de:item:b1u05-suechtig
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: süchtig
      pos: tính từ
    back:
      meaning:
        vi: nghiện
      examples:
        - target: Viele Raucher sind süchtig nach Nikotin.
          translation:
            vi: Nhiều người hút thuốc nghiện nicotin.
        - target: Ich bin fast süchtig nach Schokolade.
          translation:
            vi: Tôi gần như nghiện sô-cô-la. (nói đùa)
      confusion:
        vi: "Nghiện cái gì: süchtig nach + Dativ."

  - key: de:item:b1u05-alkohol
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Alkohol (Sg.)
      pos: danh từ
    back:
      meaning:
