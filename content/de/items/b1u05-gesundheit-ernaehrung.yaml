            vi: Nước ép này chứa bao nhiêu đường?
      confusion:
        vi: "ent- không tách, Partizip II không có ge-: hat enthalten (giống hệt nguyên thể)."

  - key: de:item:b1u05-zusatzstoff
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Zusatzstoff, -e
      pos: danh từ
    back:
      meaning:
        vi: chất phụ gia
      examples:
        - target: Dieses Brot ist ohne Zusatzstoffe.
          translation:
            vi: Bánh mì này không có chất phụ gia.
        - target: Auf der Verpackung stehen auch die Zusatzstoffe.
          translation:
            vi: Trên bao bì cũng ghi cả chất phụ gia.

  - key: de:item:b1u05-metzgerei
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Metzgerei, -en
