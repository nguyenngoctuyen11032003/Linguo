    back:
      meaning:
        vi: cửa hàng thịt
      examples:
        - target: Fleisch und Wurst kaufe ich in der Metzgerei.
          translation:
            vi: Thịt và xúc xích tôi mua ở cửa hàng thịt.
        - target: Die Metzgerei an der Ecke hat heute geschlossen.
          translation:
            vi: Cửa hàng thịt ở góc phố hôm nay đóng cửa.
      confusion:
        vi: "Đuôi -ei → giống cái: die Metzgerei, die Bäckerei. Ở miền Bắc nước Đức người ta hay nói die Fleischerei."

  - key: de:item:b1u05-biologisch
    type: vocab
    level: b1
