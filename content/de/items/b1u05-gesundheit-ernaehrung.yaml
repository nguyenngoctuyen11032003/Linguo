      text: das Eiweiß, -e
      pos: danh từ
    back:
      meaning:
        vi: chất đạm, protein; lòng trắng trứng
      examples:
        - target: Linsen und Bohnen haben viel Eiweiß.
          translation:
            vi: Đậu lăng và các loại đậu có nhiều chất đạm.
