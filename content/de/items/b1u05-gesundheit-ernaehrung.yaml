        vi: "Tiền tố ver- không tách, Partizip II không có ge-: vermieden."

  - key: de:item:b1u05-empfehlung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Empfehlung, -en
      pos: danh từ
    back:
      meaning:
        vi: lời khuyên, sự khuyến nghị
      examples:
        - target: Das ist nur eine Empfehlung, keine Regel.
          translation:
            vi: Đó chỉ là lời khuyên, không phải quy định.
        - target: Auf Empfehlung meiner Ärztin esse ich weniger Salz.
          translation:
            vi: Theo lời khuyên của bác sĩ, tôi ăn ít muối hơn.
      confusion:
        vi: "Danh từ của empfehlen (A2). Đuôi -ung → giống cái, số nhiều -en."

  - key: de:item:b1u05-schaden
    type: phrase
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: schaden (+ Dat)
      pos: động từ
    back:
      meaning:
        vi: gây hại (cho ai, cái gì)
      examples:
        - target: Rauchen schadet der Gesundheit.
          translation:
            vi: Hút thuốc có hại cho sức khoẻ.
        - target: Ein Stück Kuchen schadet nicht.
          translation:
            vi: Một miếng bánh thì chẳng sao đâu.
      confusion:
        vi: "Đi với Dativ: Das schadet dir (không nói dich). Danh từ der Schaden (thiệt hại) có số nhiều die Schäden."

  - key: de:item:b1u05-fettarm
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: fettarm
      pos: tính từ
    back:
      meaning:
        vi: ít béo, ít chất béo
      examples:
        - target: Ich kaufe meistens fettarme Milch.
          translation:
            vi: Tôi thường mua sữa ít béo.
