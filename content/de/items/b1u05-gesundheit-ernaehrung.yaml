    skill_tags: [vocabulary]
    front:
      text: biologisch
      pos: tính từ
    back:
      meaning:
        vi: hữu cơ (canh tác); thuộc sinh học
      examples:
        - target: Das Gemüse kommt aus biologischem Anbau.
          translation:
            vi: Rau này được trồng theo phương pháp hữu cơ.
        - target: Biologische Lebensmittel sind oft teurer.
          translation:
            vi: Thực phẩm hữu cơ thường đắt hơn.
      confusion:
        vi: "Trong đời thường người ta hay nói tắt là Bio (Bio-Gemüse, im Bioladen)."

  - key: de:item:b1u05-naehrwert
