          translation:
            vi: Cá thường ít béo và nhẹ bụng.
      confusion:
        vi: "-arm nghĩa là \"ít\": fettarm, zuckerarm, salzarm."

  - key: de:item:b1u05-salz
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Salz (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: muối
      examples:
        - target: Die Suppe braucht noch etwas Salz.
          translation:
            vi: Món súp cần thêm chút muối.
        - target: Zu viel Salz ist ungesund.
          translation:
            vi: Ăn quá nhiều muối không tốt cho sức khoẻ.
      confusion:
        vi: "Tính từ: salzig (mặn). Số nhiều die Salze chỉ dùng trong hoá học."

  # ================= Bài 2: Ở bác sĩ chuyên khoa – tính từ đủ 4 cách, tính từ danh từ hoá =================
  - key: de:item:b1u05-g-adj-dekl-vollstaendig
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Adjektivdeklination mit Genitiv: wegen des starken Fiebers · trotz starker Schmerzen · ein gesünderes Leben"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Ở Genitiv, sau des/der hoặc eines/einer/keines/meines… tính từ luôn có đuôi -en: wegen des starken Fiebers, trotz einer langen Behandlung. Không có mạo từ thì giống đực và giống trung có -en (trotz schlechten Wetters), giống cái và số nhiều có -er (wegen starker Schmerzen). Tính từ so sánh hơn và so sánh nhất đứng trước danh từ cũng thêm đuôi theo ba bảng: ein gesünderes Leben, die beste Lösung."
      examples:
        - target: Wegen des starken Fiebers musste sie im Bett bleiben.
          translation:
            vi: Vì sốt cao, cô ấy phải nằm trên giường.
        - target: Trotz starker Schmerzen ging er zur Arbeit.
          translation:
            vi: Dù đau nhiều, anh ấy vẫn đi làm.
        - target: Das ist die beste Lösung für unsere Familie.
          translation:
            vi: Đó là giải pháp tốt nhất cho gia đình chúng tôi.
      confusion:
        vi: "Danh từ giống đực và trung ở Genitiv thêm -s/-es (des Fiebers, des Arztes), giống cái và số nhiều thì không. Tính từ so sánh hơn giữ -er rồi mới thêm đuôi: ein besserer Arzt, eine bessere Ärztin."

  - key: de:item:b1u05-g-nominalisierte-adjektive
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Adjektive als Nomen: der Kranke, ein Kranker, die Kranken · etwas Neues, nichts Besonderes"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Nhiều tính từ dùng được như danh từ chỉ người: viết hoa nhưng vẫn mang đuôi tính từ theo ba bảng – der Kranke, die Kranke, ein Kranker, eine Kranke, die Kranken. Sau etwas, nichts, viel, wenig, tính từ viết hoa và thêm -es: etwas Neues, nichts Besonderes, viel Gutes. Sau alles thì đuôi là -e: alles Gute."
      examples:
        - target: Der Kranke braucht jetzt viel Ruhe.
          translation:
            vi: Người bệnh bây giờ cần được nghỉ ngơi nhiều.
        - target: Gibt es etwas Neues? – Nein, nichts Besonderes.
          translation:
            vi: Có gì mới không? – Không, chẳng có gì đặc biệt.
        - target: Mein Nachbar ist ein Deutscher, seine Frau ist Vietnamesin.
          translation:
            vi: Hàng xóm của tôi là người Đức, vợ anh ấy là người Việt.
      confusion:
        vi: "der Deutsche nhưng ein Deutscher (sau ein, giống đực Nominativ có -er như tính từ), không phải ein Deutsche. Tiếng Đức (ngôn ngữ) là Deutsch: Ich spreche Deutsch."

  - key: de:item:b1u05-facharzt
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Facharzt, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: bác sĩ chuyên khoa
      examples:
        - target: Mein Hausarzt hat mich an einen Facharzt überwiesen.
          translation:
            vi: Bác sĩ gia đình đã chuyển tôi đến bác sĩ chuyên khoa.
        - target: Auf einen Termin beim Facharzt muss man oft lange warten.
          translation:
            vi: Hẹn khám bác sĩ chuyên khoa thường phải chờ lâu.
      confusion:
        vi: "Nữ: die Fachärztin, -nen. Số nhiều đổi nguyên âm: die Fachärzte."

  - key: de:item:b1u05-untersuchung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Untersuchung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự khám bệnh, cuộc kiểm tra (y tế)
      examples:
        - target: Die Untersuchung dauert etwa zwanzig Minuten.
          translation:
            vi: Buổi khám kéo dài khoảng hai mươi phút.
        - target: Für die Untersuchung müssen Sie nüchtern sein.
          translation:
            vi: Trước khi khám, ông/bà phải nhịn ăn.
      confusion:
        vi: "nüchtern ở phòng khám nghĩa là \"chưa ăn gì\" (nhịn đói); trong đời thường nó còn có nghĩa \"không say\"."

  - key: de:item:b1u05-untersuchen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: untersuchen
      pos: động từ
    back:
      meaning:
        vi: khám, kiểm tra
      examples:
        - target: Die Ärztin hat mich gründlich untersucht.
          translation:
            vi: Bác sĩ đã khám kỹ cho tôi.
        - target: Ich muss mein Knie untersuchen lassen.
          translation:
            vi: Tôi phải đi khám đầu gối.
      confusion:
        vi: "unter- ở đây không tách và Partizip II không có ge-: Ich untersuche, hat untersucht."

  - key: de:item:b1u05-diagnose
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Diagnose, -n
      pos: danh từ
    back:
      meaning:
        vi: chẩn đoán
      examples:
        - target: Die Diagnose war zum Glück nicht schlimm.
          translation:
            vi: May là chẩn đoán không có gì nghiêm trọng.
        - target: Erst nach der Untersuchung kann der Arzt eine Diagnose stellen.
          translation:
            vi: Phải khám xong bác sĩ mới đưa ra chẩn đoán được.
      confusion:
        vi: "Cụm cố định: eine Diagnose stellen (đưa ra chẩn đoán), không dùng machen."

  - key: de:item:b1u05-behandlung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Behandlung, -en
      pos: danh từ
    back:
      meaning:
        vi: sự điều trị, đợt điều trị
      examples:
        - target: Die Behandlung dauert drei Wochen.
          translation:
            vi: Đợt điều trị kéo dài ba tuần.
        - target: Ist die Behandlung schmerzhaft?
          translation:
            vi: Điều trị có đau không?

  - key: de:item:b1u05-behandeln
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: behandeln
      pos: động từ
    back:
      meaning:
        vi: điều trị, chữa
      examples:
        - target: Welcher Arzt behandelt Sie?
          translation:
            vi: Bác sĩ nào đang điều trị cho ông/bà?
        - target: Die Entzündung muss schnell behandelt werden.
          translation:
            vi: Chỗ viêm phải được điều trị sớm.
      confusion:
        vi: "be- không tách, Partizip II không có ge-: hat behandelt."

  - key: de:item:b1u05-patient
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Patient, -en
      pos: danh từ
    back:
      meaning:
        vi: bệnh nhân
      examples:
        - target: Die Ärztin spricht mit dem Patienten.
          translation:
            vi: Bác sĩ nói chuyện với bệnh nhân.
        - target: Im Wartezimmer warten schon fünf Patienten.
          translation:
            vi: Trong phòng chờ đã có năm bệnh nhân đang đợi.
      pronunciation_note:
        vi: "ti ở đây đọc là \"tsi\": pa-TSI-ent."
      confusion:
        vi: "n-Deklination: den/dem/des Patienten. Nữ: die Patientin, -nen."

  - key: de:item:b1u05-spritze
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Spritze, -n
      pos: danh từ
    back:
      meaning:
        vi: mũi tiêm; ống tiêm
      examples:
        - target: Der Arzt gibt mir eine Spritze.
          translation:
            vi: Bác sĩ tiêm cho tôi một mũi.
        - target: Viele Kinder haben Angst vor Spritzen.
          translation:
            vi: Nhiều trẻ em sợ tiêm.
      confusion:
        vi: "Tiêm cho ai: jemandem eine Spritze geben."

  - key: de:item:b1u05-operation
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Operation, -en
      pos: danh từ
    back:
      meaning:
        vi: ca phẫu thuật, ca mổ
      examples:
        - target: Nach der Operation musste er eine Woche im Krankenhaus bleiben.
          translation:
            vi: Sau ca mổ anh ấy phải nằm viện một tuần.
        - target: Die Operation ist gut verlaufen.
          translation:
            vi: Ca mổ đã diễn ra tốt đẹp.
      confusion:
        vi: "Đuôi -ion là giống cái. Động từ: operieren (hat operiert)."

  - key: de:item:b1u05-chronisch
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: chronisch
      pos: tính từ
    back:
      meaning:
        vi: mạn tính
      examples:
        - target: Sie hat chronische Rückenschmerzen.
          translation:
            vi: Cô ấy bị đau lưng mạn tính.
        - target: Diabetes ist eine chronische Krankheit.
          translation:
            vi: Tiểu đường là một bệnh mạn tính.
      pronunciation_note:
        vi: "ch ở đầu từ gốc Hy Lạp này đọc như \"k\": KRO-nisch."

  # Từ bổ sung (Zusatzwortschatz) bài 2 – trường khám chuyên khoa
  - key: de:item:b1u05-symptom
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Symptom, -e
      pos: danh từ
    back:
      meaning:
        vi: triệu chứng
      examples:
        - target: Welche Symptome haben Sie?
          translation:
            vi: Ông/bà có những triệu chứng gì?
        - target: Fieber und Husten sind typische Symptome einer Grippe.
          translation:
            vi: Sốt và ho là triệu chứng điển hình của cúm.

  - key: de:item:b1u05-beschwerden
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Beschwerden (Pl.)
      pos: danh từ
    back:
      meaning:
        vi: những chỗ khó chịu, triệu chứng đau ốm
      examples:
        - target: Seit wann haben Sie diese Beschwerden?
          translation:
            vi: Ông/bà bị khó chịu như thế này từ bao giờ?
        - target: Ich habe Beschwerden beim Gehen.
          translation:
            vi: Tôi thấy đau khi đi lại.
      confusion:
        vi: "Số ít die Beschwerde thường có nghĩa khác: lời phàn nàn, khiếu nại."

  - key: de:item:b1u05-entzuendung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Entzündung, -en
      pos: danh từ
    back:
      meaning:
        vi: chứng viêm, chỗ viêm
      examples:
        - target: Die Ärztin hat eine Entzündung im Ohr festgestellt.
          translation:
            vi: Bác sĩ phát hiện tai bị viêm.
        - target: Gegen die Entzündung bekommen Sie eine Salbe.
          translation:
            vi: Ông/bà sẽ được kê thuốc mỡ để chữa viêm.

  - key: de:item:b1u05-hausarzt
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Hausarzt, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: bác sĩ gia đình
      examples:
        - target: Gehen Sie am besten zuerst zu Ihrem Hausarzt.
          translation:
            vi: Tốt nhất ông/bà nên đến bác sĩ gia đình trước.
        - target: Mein Hausarzt kennt mich seit vielen Jahren.
          translation:
            vi: Bác sĩ gia đình biết tôi đã nhiều năm.
      confusion:
        vi: "Nữ: die Hausärztin, -nen. Ở Đức, người ta thường đến bác sĩ gia đình trước, rồi được chuyển (überweisen) đến bác sĩ chuyên khoa khi cần."

  - key: de:item:b1u05-hautarzt
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Hautarzt, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: bác sĩ da liễu
      examples:
        - target: Mit diesem Problem sollten Sie zum Hautarzt gehen.
          translation:
            vi: Với vấn đề này ông/bà nên đi khám bác sĩ da liễu.
        - target: Meine Schwester hat morgen einen Termin beim Hautarzt.
          translation:
            vi: Ngày mai chị tôi có hẹn khám da liễu.
      confusion:
        vi: "Đừng nhầm Hautarzt (die Haut = da) với Hausarzt (das Haus = nhà): chỉ khác một chữ t/s."

  - key: de:item:b1u05-orthopaede
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Orthopäde, -n
      pos: danh từ
    back:
      meaning:
        vi: bác sĩ chỉnh hình (xương khớp)
      examples:
        - target: Wegen meiner Rückenschmerzen gehe ich zum Orthopäden.
          translation:
            vi: Vì đau lưng nên tôi đi khám bác sĩ xương khớp.
        - target: Der Orthopäde hat mein Knie untersucht.
          translation:
            vi: Bác sĩ chỉnh hình đã khám đầu gối cho tôi.
      confusion:
        vi: "n-Deklination: den/dem/des Orthopäden. Nữ: die Orthopädin, -nen."

  - key: de:item:b1u05-blut
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Blut (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: máu
      examples:
        - target: Morgen früh wird Ihnen Blut abgenommen.
          translation:
            vi: Sáng mai ông/bà sẽ được lấy máu.
        - target: Ich kann kein Blut sehen.
          translation:
            vi: Tôi không thể nhìn thấy máu.
      confusion:
        vi: "Lấy máu (xét nghiệm): Blut abnehmen. Xét nghiệm máu: die Blutuntersuchung."

  - key: de:item:b1u05-roentgen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: röntgen
      pos: động từ
    back:
      meaning:
        vi: chụp X-quang
      examples:
        - target: Das Bein muss geröntgt werden.
          translation:
            vi: Chân cần được chụp X-quang.
        - target: Wir röntgen zur Sicherheit auch die Hand.
          translation:
            vi: Để chắc chắn, chúng tôi chụp cả bàn tay nữa.
      confusion:
        vi: "Partizip II: geröntgt. Tên gọi theo nhà vật lý Wilhelm Conrad Röntgen."

  - key: de:item:b1u05-befund
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Befund, -e
      pos: danh từ
    back:
      meaning:
        vi: kết quả khám, kết quả xét nghiệm
      examples:
        - target: Den Befund bekommen Sie in einer Woche.
          translation:
            vi: Một tuần nữa ông/bà sẽ nhận được kết quả.
        - target: Der Befund war zum Glück unauffällig.
          translation:
            vi: May là kết quả bình thường.
      confusion:
        vi: "unauffällig trên kết quả khám nghĩa là \"không có gì bất thường\"."

  - key: de:item:b1u05-krankheit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Krankheit, -en
      pos: danh từ
    back:
      meaning:
        vi: bệnh, căn bệnh
      examples:
        - target: Grippe ist eine ansteckende Krankheit.
          translation:
            vi: Cúm là một bệnh truyền nhiễm.
        - target: Viele Krankheiten kann man heute gut behandeln.
          translation:
            vi: Ngày nay nhiều bệnh có thể chữa trị tốt.
      confusion:
        vi: "Đuôi -heit là giống cái: die Krankheit, die Gesundheit. Tính từ: krank."

  # ================= Bài 3: Thực phẩm – hậu tố danh từ quyết định giống =================
  - key: de:item:b1u05-g-wortbildung-nomen
    type: grammar_point
    level: b1
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Endung und Genus: die Verpackung, Gesundheit, Flüssigkeit, Landwirtschaft, Portion, Qualität, Metzgerei, Musik · das Würstchen, Medikament, Datum · der Lehrling, Tourismus, Motor, Bäcker"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Danh từ có hậu tố -ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ik hầu như là giống cái và có số nhiều -en (die Verpackung, die Qualität). Hậu tố -chen, -lein, -ment, -um và động từ nguyên thể dùng làm danh từ thường là giống trung (das Würstchen, das Medikament, das Kochen). Hậu tố -ling, -ismus, -or và -er chỉ người làm việc gì thường là giống đực (der Lehrling, der Tourismus, der Motor, der Bäcker)."
      examples:
        - target: Die Zubereitung dauert nur zehn Minuten.
          translation:
            vi: Khâu chế biến chỉ mất mười phút.
        - target: Das Würstchen ist zu salzig.
          translation:
            vi: Cái xúc xích này mặn quá.
        - target: Der Vegetarismus wird in Deutschland immer beliebter.
          translation:
            vi: Ăn chay ngày càng được ưa chuộng ở Đức.
      confusion:
        vi: "Chỉ xét đúng hậu tố, không xét chữ cái cuối ngẫu nhiên: der Kuchen (không có hậu tố -chen), das Labor (ngoại lệ của -or), die Butter, das Fenster, die Mutter (không phải -er chỉ người)."

  - key: de:item:b1u05-lebensmittel
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Lebensmittel, -
      pos: danh từ
    back:
      meaning:
        vi: thực phẩm
      examples:
        - target: Frische Lebensmittel kaufe ich am liebsten auf dem Markt.
          translation:
            vi: Thực phẩm tươi tôi thích mua ở chợ nhất.
        - target: Dieses Lebensmittel ist bis Ende Mai haltbar.
          translation:
            vi: Thực phẩm này dùng được đến cuối tháng Năm.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối: das Mittel → das Lebensmittel. Thường dùng ở số nhiều: die Lebensmittel."

  - key: de:item:b1u05-zutat
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Zutat, -en
      pos: danh từ
    back:
      meaning:
        vi: nguyên liệu, thành phần (món ăn)
      examples:
        - target: Für den Salat brauchen wir nur fünf Zutaten.
          translation:
            vi: Món salad này chỉ cần năm nguyên liệu.
        - target: Lies bitte die Zutaten auf der Packung!
          translation:
            vi: Bạn đọc thành phần trên bao bì giúp mình nhé!
      confusion:
        vi: "-at không có trong danh sách hậu tố, nên giống của Zutat phải học thuộc: die Zutat."

  - key: de:item:b1u05-mahlzeit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Mahlzeit, -en
      pos: danh từ
    back:
      meaning:
        vi: bữa ăn
      examples:
        - target: Für mich ist das Frühstück die wichtigste Mahlzeit des Tages.
          translation:
            vi: Với tôi, bữa sáng là bữa ăn quan trọng nhất trong ngày.
        - target: Wir essen drei Mahlzeiten am Tag.
          translation:
            vi: Chúng tôi ăn ba bữa một ngày.
      confusion:
        vi: "Ở nhiều nơi làm việc tại Đức, đồng nghiệp chào nhau buổi trưa bằng \"Mahlzeit!\" (khẩu ngữ, tuỳ vùng)."

  - key: de:item:b1u05-gesundheit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Gesundheit (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sức khoẻ
      examples:
        - target: Rauchen schadet der Gesundheit.
          translation:
            vi: Hút thuốc có hại cho sức khoẻ.
        - target: Die Gesundheit ist das Wichtigste.
          translation:
            vi: Sức khoẻ là quan trọng nhất.
      confusion:
        vi: "Đuôi -heit → giống cái: die Gesundheit (không phải das). Khi ai đó hắt hơi, người Đức nói: Gesundheit!"

  - key: de:item:b1u05-frisch
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: frisch
      pos: tính từ
    back:
      meaning:
        vi: tươi, mới
      examples:
        - target: Das Brot ist ganz frisch.
          translation:
            vi: Bánh mì còn mới nguyên.
        - target: Ich koche gern mit frischem Gemüse.
          translation:
            vi: Tôi thích nấu ăn với rau tươi.

  - key: de:item:b1u05-haltbar
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: haltbar
      pos: tính từ
    back:
      meaning:
        vi: để được lâu, (còn) dùng được
      examples:
        - target: Die Milch ist noch bis Freitag haltbar.
          translation:
            vi: Sữa còn dùng được đến thứ Sáu.
        - target: Nudeln und Reis sind lange haltbar.
          translation:
            vi: Mì và gạo để được lâu.
      confusion:
        vi: "Trên bao bì: mindestens haltbar bis … = hạn sử dụng tốt nhất trước ngày …"

  - key: de:item:b1u05-regional
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: regional
      pos: tính từ
    back:
      meaning:
        vi: của địa phương, trong vùng
      examples:
        - target: Ich kaufe gern regionale Produkte.
          translation:
            vi: Tôi thích mua sản phẩm địa phương.
        - target: Das Obst kommt von einem regionalen Bauernhof.
          translation:
            vi: Trái cây này đến từ một trang trại trong vùng.

  - key: de:item:b1u05-verpackung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Verpackung, -en
      pos: danh từ
    back:
      meaning:
        vi: bao bì
      examples:
        - target: Auf der Verpackung stehen alle Zutaten.
          translation:
            vi: Trên bao bì có ghi tất cả thành phần.
        - target: Viele Verpackungen sind aus Plastik.
          translation:
            vi: Nhiều bao bì làm bằng nhựa.

  - key: de:item:b1u05-inhaltsstoff
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Inhaltsstoff, -e
      pos: danh từ
    back:
      meaning:
        vi: thành phần (chất có trong sản phẩm)
      examples:
        - target: Die Inhaltsstoffe stehen auf der Rückseite.
          translation:
            vi: Thành phần được ghi ở mặt sau.
        - target: Welche Inhaltsstoffe hat diese Creme?
          translation:
            vi: Kem này có những thành phần gì?
      confusion:
        vi: "Âm nối -s-: Inhalt + s + Stoff. Zutat dùng cho món ăn, Inhaltsstoff dùng cho cả mỹ phẩm, thuốc."

  # Từ bổ sung (Zusatzwortschatz) bài 3 – trường thực phẩm, nhãn mác
  - key: de:item:b1u05-fluessigkeit
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Flüssigkeit, -en
      pos: danh từ
    back:
      meaning:
        vi: chất lỏng, nước (uống)
      examples:
        - target: Bei Fieber braucht der Körper viel Flüssigkeit.
          translation:
            vi: Khi sốt, cơ thể cần nhiều nước.
        - target: Diese Flüssigkeit darf man nicht trinken.
          translation:
            vi: Không được uống chất lỏng này.
      confusion:
        vi: "Đuôi -keit → giống cái. Tính từ: flüssig (lỏng)."

  - key: de:item:b1u05-landwirtschaft
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
