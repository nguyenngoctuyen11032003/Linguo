      examples:
        - target: Ich trinke keinen Alkohol mehr.
          translation:
            vi: Tôi không uống rượu bia nữa.
        - target: Zu viel Alkohol ist ungesund.
          translation:
            vi: Uống quá nhiều rượu bia có hại cho sức khoẻ.
      confusion:
        vi: "Thường không có mạo từ và không có số nhiều: Alkohol trinken, keinen Alkohol mehr."

  - key: de:item:b1u05-zigarette
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Zigarette, -n
      pos: danh từ
    back:
      meaning:
        vi: điếu thuốc lá
      examples:
        - target: Früher hat er eine Schachtel Zigaretten am Tag geraucht.
          translation:
            vi: Trước đây anh ấy hút một bao thuốc mỗi ngày.
        - target: Sie hat seit drei Monaten keine Zigarette mehr geraucht.
          translation:
            vi: Đã ba tháng nay cô ấy không hút điếu thuốc nào nữa.
      pronunciation_note:
        vi: "Z đọc là \"ts\": tsi-ga-RE-tte."

  - key: de:item:b1u05-schlaf
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Schlaf (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: giấc ngủ
      examples:
        - target: Guter Schlaf ist wichtig für die Gesundheit.
          translation:
            vi: Ngủ ngon rất quan trọng cho sức khoẻ.
        - target: Ich brauche mindestens sieben Stunden Schlaf.
          translation:
            vi: Tôi cần ngủ ít nhất bảy tiếng.

  - key: de:item:b1u05-entspannung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Entspannung (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: sự thư giãn
      examples:
        - target: Zur Entspannung höre ich Musik.
          translation:
            vi: Để thư giãn, tôi nghe nhạc.
        - target: Nach der Arbeit brauche ich ein bisschen Entspannung.
          translation:
            vi: Sau giờ làm tôi cần thư giãn một chút.
      confusion:
        vi: "Động từ: sich entspannen (A2). Đuôi -ung → giống cái."

  - key: de:item:b1u05-meditieren
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: meditieren
      pos: động từ
    back:
      meaning:
        vi: thiền
      examples:
        - target: Seit einem Jahr meditiere ich jeden Morgen zehn Minuten.
          translation:
            vi: Đã một năm nay sáng nào tôi cũng thiền mười phút.
        - target: Hast du schon einmal meditiert?
          translation:
            vi: Bạn đã bao giờ thiền chưa?
      confusion:
        vi: "Động từ đuôi -ieren: Partizip II không có ge- – hat meditiert."

  - key: de:item:b1u05-druck
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Druck (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: áp lực, sức ép
      examples:
        - target: Bei der Arbeit stehe ich ständig unter Druck.
          translation:
            vi: Ở chỗ làm tôi luôn bị áp lực.
        - target: Vor den Prüfungen war der Druck sehr groß.
          translation:
            vi: Trước kỳ thi áp lực rất lớn.
      confusion:
        vi: "Cụm cố định: unter Druck stehen (bị áp lực), jemanden unter Druck setzen (gây sức ép cho ai)."

  # Từ bổ sung (Zusatzwortschatz) bài 4 – trường thói quen, căng thẳng
  - key: de:item:b1u05-raucher
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Raucher, -
      pos: danh từ
    back:
      meaning:
        vi: người hút thuốc
      examples:
        - target: Mein Vater war lange Raucher.
          translation:
            vi: Bố tôi đã hút thuốc nhiều năm.
        - target: Hier dürfen Raucher nur draußen rauchen.
          translation:
            vi: Ở đây người hút thuốc chỉ được hút ở bên ngoài.
      confusion:
        vi: "Nữ: die Raucherin, -nen. Đuôi -er chỉ người làm việc gì → giống đực. Nghề nghiệp, vai trò sau sein thường không có mạo từ: Ich bin Raucher."

  - key: de:item:b1u05-nichtraucher
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Nichtraucher, -
      pos: danh từ
    back:
      meaning:
        vi: người không hút thuốc
      examples:
        - target: Seit drei Jahren bin ich Nichtraucher.
          translation:
            vi: Đã ba năm nay tôi không hút thuốc.
        - target: Das ist ein Zimmer für Nichtraucher.
          translation:
            vi: Đây là phòng dành cho người không hút thuốc.
      confusion:
        vi: "Nữ: die Nichtraucherin, -nen. Ich bin Nichtraucher có thể nghĩa là chưa bao giờ hút, hoặc đã bỏ thuốc."

  - key: de:item:b1u05-schlafstoerung
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: die Schlafstörung, -en
      pos: danh từ
    back:
      meaning:
        vi: chứng rối loạn giấc ngủ, mất ngủ
      examples:
        - target: Viele Menschen leiden unter Schlafstörungen.
          translation:
            vi: Nhiều người bị rối loạn giấc ngủ.
        - target: Stress kann zu Schlafstörungen führen.
          translation:
            vi: Căng thẳng có thể dẫn đến mất ngủ.
      confusion:
        vi: "Từ ghép lấy giống của từ cuối: die Störung → die Schlafstörung. Bị bệnh gì: leiden unter + Dativ."

  - key: de:item:b1u05-rueckfall
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Rückfall, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: sự tái phát, sự quay lại (thói quen cũ)
      examples:
        - target: Nach drei Monaten hatte er einen Rückfall.
          translation:
            vi: Sau ba tháng anh ấy lại tái nghiện.
        - target: Ein Rückfall ist kein Grund aufzugeben.
          translation:
            vi: Tái phát một lần không phải là lý do để bỏ cuộc.

  - key: de:item:b1u05-erholsam
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: erholsam
      pos: tính từ
    back:
      meaning:
        vi: giúp nghỉ ngơi, hồi sức (thư thái)
      examples:
        - target: Der Urlaub war sehr erholsam.
          translation:
            vi: Kỳ nghỉ rất thư thái.
        - target: Nach einer erholsamen Nacht bin ich wieder fit.
          translation:
            vi: Sau một đêm ngủ ngon, tôi lại khoẻ khoắn.
      confusion:
        vi: "Từ sich erholen (A2) + hậu tố -sam (tính từ): erholsam."

  - key: de:item:b1u05-vorsatz
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: der Vorsatz, ¨-e
      pos: danh từ
    back:
      meaning:
        vi: quyết tâm, dự định (thay đổi bản thân)
      examples:
        - target: "Mein Vorsatz für das neue Jahr: keine Zigaretten mehr!"
          translation:
            vi: "Quyết tâm năm mới của tôi: không hút thuốc nữa!"
        - target: Viele Menschen haben gute Vorsätze, aber nur wenige halten sie.
          translation:
            vi: Nhiều người có quyết tâm tốt, nhưng ít người giữ được.

  - key: de:item:b1u05-durchschlafen
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: durchschlafen, schläft durch, schlief durch, hat durchgeschlafen
      pos: động từ
    back:
      meaning:
        vi: ngủ một mạch (không thức giấc giữa đêm)
      examples:
        - target: Seit Wochen kann ich nicht mehr durchschlafen.
          translation:
            vi: Đã mấy tuần nay tôi không ngủ một mạch được nữa.
        - target: Das Baby hat heute zum ersten Mal durchgeschlafen.
          translation:
            vi: Hôm nay em bé lần đầu tiên ngủ một mạch cả đêm.
      confusion:
        vi: "Động từ tách: Ich schlafe nicht durch. Khác einschlafen (thiếp đi) và ausschlafen (ngủ bù, ngủ cho đã)."

  - key: de:item:b1u05-nikotin
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: das Nikotin (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: nicotin
      examples:
        - target: Zigaretten enthalten Nikotin.
          translation:
            vi: Thuốc lá có chứa nicotin.
        - target: Nikotin macht schnell süchtig.
          translation:
            vi: Nicotin gây nghiện nhanh.
      pronunciation_note:
        vi: "Trọng âm ở cuối: ni-ko-TIN."
