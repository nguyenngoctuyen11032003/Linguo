            vi: Ở vùng này nhiều người làm nông nghiệp.
        - target: Die Kartoffeln kommen aus der regionalen Landwirtschaft.
          translation:
            vi: Khoai tây này từ nông nghiệp địa phương.
      confusion:
        vi: "Đuôi -schaft → giống cái: die Landwirtschaft, die Freundschaft."

  - key: de:item:b1u05-zubereitung
