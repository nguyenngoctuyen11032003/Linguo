        - target: Auch Gemüse und Obst liefern Ballaststoffe.
          translation:
            vi: Rau và trái cây cũng cung cấp chất xơ.
      confusion:
        vi: "Thường dùng ở số nhiều: die Ballaststoffe."

  - key: de:item:b1u05-eiweiss
    type: vocab
    level: b1
    difficulty: 3
    skill_tags: [vocabulary]
