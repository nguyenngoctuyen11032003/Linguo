        - target: Die Zubereitung dauert etwa eine halbe Stunde.
          translation:
            vi: Chế biến mất khoảng nửa tiếng.
      confusion:
        vi: "Công thức nấu ăn tiếng Đức hay dùng động từ nguyên thể ở cuối như mệnh lệnh: Die Zwiebeln schneiden."

  - key: de:item:b1u05-enthalten
