    skill_tags: [vocabulary]
    front:
      text: "die Linie, -n"
      pos: danh từ
    back:
      meaning:
        vi: tuyến (xe buýt, tàu điện); đường kẻ, vạch
      examples:
        - target: Nehmen Sie die Linie 3 bis zum Bahnhof.
          translation:
            vi: Anh/chị đi tuyến số 3 đến nhà ga.
        - target: Die Linie 5 fährt heute nicht.
          translation:
            vi: Hôm nay tuyến số 5 không chạy.

  # Zusatzwortschatz (từ bổ sung, trường: thông báo giao thông)
  - key: de:item:a2u08-fahrgast
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Fahrgast, ¨-e"
      pos: danh từ
    back:
      meaning:
        vi: hành khách (trên tàu, xe)
      examples:
        - target: Liebe Fahrgäste, wir kommen in wenigen Minuten in Hamburg an.
          translation:
            vi: Kính thưa quý khách, vài phút nữa chúng ta sẽ đến Hamburg.
        - target: Alle Fahrgäste müssen hier aussteigen.
          translation:
            vi: Tất cả hành khách phải xuống ở đây.
      confusion:
        vi: "Số nhiều có biến âm: die Fahrgäste. Thông báo trên tàu, xe hay mở đầu bằng Liebe Fahrgäste …"

  # Zusatzwortschatz (từ bổ sung, trường: thông báo giao thông)
  - key: de:item:a2u08-voraussichtlich
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: voraussichtlich
      pos: trạng từ
    back:
      meaning:
        vi: dự kiến, theo dự tính
      examples:
        - target: Der Zug hat voraussichtlich zwanzig Minuten Verspätung.
          translation:
            vi: Tàu dự kiến trễ hai mươi phút.
        - target: Die Baustelle dauert voraussichtlich bis Mai.
          translation:
            vi: Công trường dự kiến kéo dài đến tháng Năm.
      confusion:
        vi: "Từ rất hay gặp trong thông báo: thông tin chưa chắc chắn, có thể thay đổi."

  # Zusatzwortschatz (từ bổ sung, trường: thông báo giao thông)
  - key: de:item:a2u08-gepaeck
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: das Gepäck (Sg.)
      pos: danh từ
    back:
      meaning:
        vi: hành lý
      examples:
        - target: Hast du viel Gepäck?
          translation:
            vi: Bạn có nhiều hành lý không?
        - target: Ist das Ihr Gepäck?
          translation:
            vi: Đây có phải hành lý của anh/chị không?
      confusion:
        vi: "Không đếm được: viel Gepäck (không nói die Gepäcke). Một kiện hành lý: ein Gepäckstück."

  # Zusatzwortschatz (từ bổ sung, trường: thông báo giao thông)
  - key: de:item:a2u08-gesperrt
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: gesperrt
      pos: tính từ
    back:
      meaning:
        vi: bị chặn, bị đóng (đường, ga, lối đi)
      examples:
        - target: Die Straße ist bis Freitag gesperrt.
          translation:
            vi: Con đường bị chặn đến thứ Sáu.
        - target: Gleis 4 ist heute gesperrt.
          translation:
            vi: Hôm nay đường ray số 4 bị đóng.
      confusion:
        vi: "Dùng với sein: Die Straße ist gesperrt. Với cửa hàng, cơ quan thì dùng geschlossen (đóng cửa)."

  # Zusatzwortschatz (từ bổ sung, trường: thông báo giao thông)
  - key: de:item:a2u08-stoerung
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "die Störung, -en"
      pos: danh từ
    back:
      meaning:
        vi: sự cố (kỹ thuật), trục trặc
      examples:
        - target: Es gibt eine technische Störung.
          translation:
            vi: Có sự cố kỹ thuật.
        - target: Auf der Linie 2 gibt es zurzeit eine Störung.
          translation:
            vi: Hiện tuyến số 2 đang gặp sự cố.
      confusion:
        vi: "Hậu tố -ung (stören → die Störung) cho danh từ giống cái. Biển hay gặp: Bitte nicht stören! (Xin đừng làm phiền!)"

  # ================= Bài 4: Cùng lên kế hoạch – đề nghị =================
  - key: de:item:a2u08-g-vorschlag-wir
    type: grammar_point
    level: a2
    difficulty: 3
    skill_tags: [grammar]
    front:
      text: "Vorschläge: Gehen wir …! Lass uns … gehen! Wollen wir …? Wie wäre es mit …?"
      pos: cấu trúc ngữ pháp
    back:
      meaning:
        vi: "Bài này học bốn mẫu để đề nghị cùng làm gì: Gehen wir ins Kino! (động từ đầu câu + wir), Lass uns ins Kino gehen! (nguyên thể cuối câu), Wollen wir ins Kino gehen? (câu hỏi), Wie wäre es mit + Dativ? Tất cả tương đương \"… nhé!\", \"… đi!\" trong tiếng Việt."
      examples:
        - target: Gehen wir heute Abend essen!
          translation:
            vi: Tối nay mình đi ăn đi!
        - target: Lass uns am Samstag grillen!
          translation:
            vi: Thứ Bảy mình nướng thịt đi!
        - target: Wollen wir zusammen kochen?
          translation:
            vi: Mình cùng nấu ăn nhé?
        - target: Wie wäre es mit einem Picknick im Park?
          translation:
            vi: Đi picnic ở công viên thì sao?
      confusion:
        vi: "Theo chuẩn: Lass uns khi nói với một người bạn (du), Lasst uns với nhiều người (ihr), Lassen Sie uns khi trang trọng; trong khẩu ngữ Lass uns cũng hay được dùng với cả nhóm. Nguyên thể đứng cuối câu: Lass uns ins Kino gehen (không phải Lass uns gehen ins Kino)."

  - key: de:item:a2u08-planen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: planen
      pos: động từ
    back:
      meaning:
        vi: lên kế hoạch
      examples:
        - target: Wir planen eine Party für Lena.
          translation:
            vi: Chúng tôi đang lên kế hoạch tổ chức một bữa tiệc cho Lena.
        - target: Was plant ihr für den Sommer?
          translation:
            vi: Các bạn định làm gì vào mùa hè?
      confusion:
        vi: "Danh từ: der Plan, die Pläne. planen là động từ có quy tắc: ich plane, ich habe geplant."

  - key: de:item:a2u08-vorschlagen
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: vorschlagen, schlägt vor, schlug vor, hat vorgeschlagen
      pos: động từ
    back:
      meaning:
        vi: đề nghị, đề xuất
      examples:
        - target: Was schlägst du vor?
          translation:
            vi: Bạn đề xuất gì?
        - target: Ich schlage vor, wir treffen uns um acht.
          translation:
            vi: Mình đề nghị tám giờ gặp nhau.
      confusion:
        vi: "Động từ tách và đổi nguyên âm: ich schlage vor, du schlägst vor. Danh từ: der Vorschlag."

  - key: de:item:a2u08-organisieren
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: organisieren
      pos: động từ
    back:
      meaning:
        vi: tổ chức, lo liệu
      examples:
        - target: Wer organisiert die Party?
          translation:
            vi: Ai tổ chức bữa tiệc?
        - target: Ich habe schon alles organisiert.
          translation:
            vi: Mình đã lo xong mọi thứ rồi.
      confusion:
        vi: "Động từ đuôi -ieren không có ge- ở Partizip: organisiert."

  - key: de:item:a2u08-idee
    type: vocab
    level: a2
    difficulty: 1
    skill_tags: [vocabulary]
    front:
      text: "die Idee, -n"
      ipa: /iˈdeː/
      pos: danh từ
    back:
      meaning:
        vi: ý tưởng, ý kiến
      examples:
        - target: Hast du eine Idee für das Wochenende?
          translation:
            vi: Bạn có ý tưởng gì cho cuối tuần không?
        - target: Das ist eine tolle Idee!
          translation:
            vi: Ý tưởng tuyệt quá!
      pronunciation_note:
        vi: Nhấn âm sau i-DEE, ee đọc "ê" dài. Số nhiều die Ideen có ba âm tiết i-DE-en.
      confusion:
        vi: "Câu đáp ngắn Gute Idee! (đã học) dùng để đồng ý với một đề nghị."

  - key: de:item:a2u08-einverstanden
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: einverstanden
      pos: tính từ
    back:
      meaning:
        vi: đồng ý
      examples:
        - target: Treffen wir uns um sieben? – Einverstanden!
          translation:
            vi: Bảy giờ mình gặp nhau nhé? – Đồng ý!
        - target: Bist du einverstanden?
          translation:
            vi: Bạn có đồng ý không?
      confusion:
        vi: "Đi với sein: Ich bin einverstanden (không nói Ich einverstanden). Đứng một mình như câu đáp ngắn cũng được: Einverstanden!"

  - key: de:item:a2u08-absagen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: absagen
      pos: động từ
    back:
      meaning:
        vi: hủy (hẹn), báo không đến được
      examples:
        - target: Ich muss leider absagen, ich bin krank.
          translation:
            vi: Tiếc là mình phải hủy, mình bị ốm.
        - target: Lena hat das Treffen abgesagt.
          translation:
            vi: Lena đã hủy buổi gặp.
      confusion:
        vi: "Ngược nghĩa: zusagen (nhận lời). Khác ausfallen: absagen là người chủ động hủy, ausfallen là sự việc bị hủy."

  - key: de:item:a2u08-zusagen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: zusagen
      pos: động từ
    back:
      meaning:
        vi: nhận lời, xác nhận sẽ đến
      examples:
        - target: Tom hat schon zugesagt.
          translation:
            vi: Tom đã nhận lời rồi.
        - target: Fünf Freunde haben für die Party zugesagt.
          translation:
            vi: Năm người bạn đã nhận lời đến bữa tiệc.
      confusion:
        vi: "Động từ tách: ich sage zu, Partizip zugesagt (ge nằm sau tiền tố)."

  - key: de:item:a2u08-verschieben
    type: vocab
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: verschieben, verschob, hat verschoben
      pos: động từ
    back:
      meaning:
        vi: dời, hoãn (sang lúc khác)
      examples:
        - target: Können wir das Treffen auf Montag verschieben?
          translation:
            vi: Mình dời buổi gặp sang thứ Hai được không?
        - target: Wir haben die Party verschoben.
          translation:
            vi: Chúng tôi đã hoãn bữa tiệc.
      confusion:
        vi: "Dời sang ngày nào: verschieben auf + Akkusativ (auf Montag, auf nächste Woche). Tiền tố ver- không tách và không có ge-: verschoben."

  - key: de:item:a2u08-treffpunkt
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Treffpunkt, -e"
      pos: danh từ
    back:
      meaning:
        vi: điểm hẹn, chỗ gặp
      examples:
        - target: Unser Treffpunkt ist vor dem Kino.
          translation:
            vi: Điểm hẹn của chúng ta là trước rạp chiếu phim.
        - target: Wo ist der Treffpunkt?
          translation:
            vi: Điểm hẹn ở đâu?
      confusion:
        vi: "Từ ghép treffen (gặp) + der Punkt (điểm), giống theo từ cuối: der Treffpunkt."

  - key: de:item:a2u08-wie-waere-es-mit
    type: phrase
    level: a2
    difficulty: 3
    skill_tags: [vocabulary]
    front:
      text: "Wie wäre es mit …? (+ Dativ)"
      pos: cụm từ
    back:
      meaning:
        vi: "… thì sao? (đưa ra đề nghị)"
      examples:
        - target: Wie wäre es mit Samstag?
          translation:
            vi: Thứ Bảy thì sao?
        - target: Wie wäre es mit einem Picknick im Park?
          translation:
            vi: Đi picnic ở công viên thì sao?
      confusion:
        vi: "Học như một mẫu cố định. Sau mit là danh từ ở Dativ (mit einem Picknick, mit der Pizzeria) hoặc ngày, giờ (mit Samstag, mit acht Uhr); muốn dùng động từ thì hỏi: Wollen wir …?"

  # Zusatzwortschatz (từ bổ sung, trường: sắp xếp)
  - key: de:item:a2u08-vorschlag
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "der Vorschlag, ¨-e"
      pos: danh từ
    back:
      meaning:
        vi: lời đề nghị, đề xuất
      examples:
        - target: "Ich habe einen Vorschlag: Wir kochen zusammen."
          translation:
            vi: "Mình có một đề nghị: chúng ta cùng nấu ăn."
        - target: Danke für deinen Vorschlag!
          translation:
            vi: Cảm ơn đề nghị của bạn!
      confusion:
        vi: "Số nhiều có biến âm: die Vorschläge. Động từ: vorschlagen."

  # Zusatzwortschatz (từ bổ sung, trường: sắp xếp)
  - key: de:item:a2u08-mitbringen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: mitbringen, bringt mit, brachte mit, hat mitgebracht
      pos: động từ
    back:
      meaning:
        vi: mang theo (đến)
      examples:
        - target: Was soll ich mitbringen?
          translation:
            vi: Mình nên mang gì đến?
        - target: Ich bringe einen Salat mit.
          translation:
            vi: Mình sẽ mang một món salad đến.
      confusion:
        vi: "Động từ tách, quá khứ bất quy tắc: brachte mit, hat mitgebracht."

  # Zusatzwortschatz (từ bổ sung, trường: sắp xếp)
  - key: de:item:a2u08-grillen
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: grillen
      pos: động từ
    back:
      meaning:
        vi: nướng (thịt, rau – thường ngoài trời)
      examples:
        - target: Am Sonntag grillen wir im Garten.
          translation:
            vi: Chủ nhật chúng tôi nướng thịt ngoài vườn.
        - target: Wollen wir am See grillen?
          translation:
            vi: Mình ra hồ nướng thịt nhé?
      confusion:
        vi: "Ở nhiều công viên chỉ được nướng ở khu cho phép – hãy xem biển báo (quy định khác nhau tùy nơi)."

  # Zusatzwortschatz (từ bổ sung, trường: sắp xếp)
  - key: de:item:a2u08-gemeinsam
    type: vocab
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: gemeinsam
      pos: tính từ, trạng từ
    back:
      meaning:
        vi: cùng nhau; chung
      examples:
        - target: Wir planen den Ausflug gemeinsam.
          translation:
            vi: Chúng tôi cùng nhau lên kế hoạch cho chuyến đi chơi.
        - target: Wir haben ein gemeinsames Hobby.
          translation:
            vi: Chúng tôi có một sở thích chung.
      confusion:
        vi: "Gần nghĩa zusammen; nhưng chỉ gemeinsam dùng được làm tính từ trước danh từ: ein gemeinsames Hobby."

  # Zusatzwortschatz (từ bổ sung, trường: sắp xếp)
  - key: de:item:a2u08-bescheid-sagen
    type: phrase
    level: a2
    difficulty: 2
    skill_tags: [vocabulary]
    front:
      text: "Bescheid sagen (+ Dativ)"
      pos: cụm từ
    back:
      meaning:
        vi: báo cho (ai) biết
      examples:
        - target: Sag mir bitte bis Freitag Bescheid!
          translation:
            vi: Chậm nhất thứ Sáu báo mình biết nhé!
        - target: Ich sage dir morgen Bescheid.
          translation:
            vi: Mai mình báo bạn.
      confusion:
        vi: "Bescheid là danh từ nên viết hoa, không có mạo từ; người được báo ở Dativ (mir, dir, Ihnen). Trang trọng: Bitte geben Sie mir Bescheid."
