  - key: de:exercise:b1u06l3-fill-sodass
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-g-sodass
    prompt:
      template: "Es hat wochenlang nicht geregnet, {{b1}} die Felder ganz trocken sind. Die alte Heizung war {{b2}} schlecht, dass sie sehr viel Energie verbraucht hat."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [sodass, so dass, weshalb, weswegen]
        b2: [so]
    known_wrong:
      - answer: deshalb
        feedback_vi: Sau deshalb động từ đứng ở vị trí 2 (deshalb sind die Felder …). Ở đây động từ sind đứng cuối, nên cần sodass.
        error_tag: verb_position
      - answer: denn
        feedback_vi: denn nêu lý do, không nêu hệ quả, và kéo theo V2. Ở đây cần sodass.
        error_tag: conjunction
      - answer: sehr
        feedback_vi: Trước dass cần so + tính từ (so schlecht, dass …); sehr không đi với dass.
        error_tag: word_choice
      - answer: zu
        feedback_vi: zu schlecht không nối với dass. Muốn nói đến nỗi thì dùng so … dass.
        error_tag: word_choice
    explanation:
      vi: "Vế sau là hệ quả và động từ sind đứng cuối: …, sodass die Felder ganz trocken sind (weshalb/weswegen cũng đúng nhưng trang trọng hơn). Câu thứ hai có dass ở sau, nên trước tính từ cần so: so schlecht, dass …"
    display_answer: "Es hat wochenlang nicht geregnet, sodass die Felder ganz trocken sind. Die alte Heizung war so schlecht, dass sie sehr viel Energie verbraucht hat."

  - key: de:exercise:b1u06l3-tr-so-teuer
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-g-sodass
    prompt:
      source_text: "Điện đắt đến nỗi chúng tôi phải tiết kiệm."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Der Strom ist so teuer, dass wir sparen müssen.
        - Strom ist so teuer, dass wir sparen müssen.
        - Der Strom ist so teuer, dass wir Strom sparen müssen.
        - Der Strom ist so teuer, dass wir Energie sparen müssen.
        - Der Strom ist sehr teuer, sodass wir sparen müssen.
        - Der Strom ist sehr teuer, so dass wir sparen müssen.
        - Strom ist sehr teuer, sodass wir sparen müssen.
        - Strom ist so teuer, dass wir Strom sparen müssen.
        - Strom ist so teuer, dass wir Energie sparen müssen.
    known_wrong:
      - answer: Der Strom ist so teuer, dass wir müssen sparen.
        feedback_vi: Trong câu phụ dass, động từ chia müssen đứng cuối – … dass wir sparen müssen.
        error_tag: verb_position
      - answer: Der Strom ist sehr teuer, dass wir sparen müssen.
        feedback_vi: Muốn nói đến nỗi thì cần so trước tính từ – so teuer, dass …
        error_tag: word_choice
      - answer: Der Strom ist so teuer, sodass wir sparen müssen.
        feedback_vi: Đã có so trước tính từ thì nối bằng dass – so teuer, dass … (sodass dùng khi không có so).
        error_tag: word_choice
    explanation:
      vi: "\"đắt đến nỗi\" = so teuer, dass …; trong câu phụ dass, động từ khiếm khuyết müssen đứng cuối, sau nguyên thể sparen. Cũng có thể nói: Der Strom ist sehr teuer, sodass wir sparen müssen."
    display_answer: Der Strom ist so teuer, dass wir sparen müssen.

