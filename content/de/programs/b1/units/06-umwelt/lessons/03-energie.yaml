    difficulty: 2
    item: de:item:b1u06-stromrechnung
    prompt:
      stem: "Chọn mạo từ đúng: ___ Stromrechnung ist dieses Jahr sehr hoch."
      stem_lang: vi
      options:
        - { id: s4e, text: "Die", lang: de }
        - { id: s8r, text: "Der", lang: de }
        - { id: s2a, text: "Das", lang: de }
        - { id: s6n, text: "Den", lang: de }
    answer:
      correct_option_id: s4e
    explanation:
      vi: "Từ ghép lấy giống của từ cuối: der Strom + die Rechnung = die Stromrechnung. Chủ ngữ ở Nominativ nên dùng Die; Den là Akkusativ giống đực."
    display_answer: Die

  - key: de:exercise:b1u06l3-mcq-fugen-s
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u06-g-komposita-fugen
    prompt:
      stem: "Từ ghép nào có âm nối -s- giữa hai phần?"
      stem_lang: vi
      options:
        - { id: f3v, text: "das Verkehrsmittel", lang: de }
        - { id: f7u, text: "der Umweltschutz", lang: de }
        - { id: f1w, text: "die Windkraft", lang: de }
        - { id: f5s, text: "die Stromrechnung", lang: de }
    answer:
      correct_option_id: f3v
    explanation:
      vi: "Verkehr + s + Mittel: chữ s không thuộc từ nào, đó là âm nối. Trong Umweltschutz, s là chữ đầu của Schutz; Windkraft và Stromrechnung ghép thẳng, không có âm nối."
    display_answer: das Verkehrsmittel

  - key: de:exercise:b1u06l3-mcq-lesen-winter
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u06-solaranlage
    prompt:
      stem: "Familie Wagner hat seit letztem Jahr eine Solaranlage auf dem Dach. An sonnigen Tagen produziert die Anlage so viel Strom, dass die Familie fast keinen Strom kaufen muss. Im Winter scheint die Sonne weniger, sodass die Wagners dann mehr Strom aus dem Netz brauchen. Außerdem sparen sie Energie: Sie schalten Geräte ganz aus, wenn sie sie nicht benutzen. — Richtig oder falsch? Im Winter produziert die Solaranlage mehr Strom als im Sommer."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Im Winter scheint die Sonne weniger, sodass die Wagners dann mehr Strom aus dem Netz brauchen – mùa đông ít nắng nên gia đình phải mua thêm điện. Vậy mùa đông hệ thống sản xuất ít điện hơn, câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u06l3-mcq-lesen-geraete
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u06-g-sodass
    prompt:
      stem: "Familie Wagner hat seit letztem Jahr eine Solaranlage auf dem Dach. An sonnigen Tagen produziert die Anlage so viel Strom, dass die Familie fast keinen Strom kaufen muss. Im Winter scheint die Sonne weniger, sodass die Wagners dann mehr Strom aus dem Netz brauchen. Außerdem sparen sie Energie: Sie schalten Geräte ganz aus, wenn sie sie nicht benutzen. — Richtig oder falsch? An sonnigen Tagen muss die Familie kaum Strom kaufen."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "An sonnigen Tagen produziert die Anlage so viel Strom, dass die Familie fast keinen Strom kaufen muss – ngày nắng, hệ thống tạo nhiều điện đến nỗi gia đình gần như không phải mua điện. kaum = hầu như không, nên câu này đúng."
    display_answer: Richtig

