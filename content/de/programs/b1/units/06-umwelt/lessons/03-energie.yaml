body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được hệ quả và dùng từ ghép về năng lượng, ví dụ: \"Der Strom ist so teuer geworden, dass wir mehr sparen. Wir haben jetzt eine Solaranlage, sodass unsere Stromrechnung niedriger ist.\""
  - type: explain
    text:
      vi: "sodass mở câu phụ nêu hệ quả (nên, cho nên), động từ chia đứng cuối: Es war sehr kalt, sodass wir mehr heizen mussten. Câu sodass luôn đứng sau câu chính, không đứng đầu câu. Có thể viết liền sodass hoặc tách so dass."
  - type: explain
    text:
      vi: "Muốn nhấn mạnh mức độ (đến nỗi), đặt so trước tính từ hoặc trạng từ trong câu chính, rồi nối bằng dass: Der Strom ist so teuer, dass wir sparen müssen. Tiếng Việt nói \"đắt đến nỗi\", tiếng Đức tách làm hai: so ở câu chính, dass ở câu phụ."
  - type: explain
    text:
      vi: "Từ ghép tiếng Đức đặt từ chính ở cuối, ngược với tiếng Việt: \"hoá đơn tiền điện\" là die Stromrechnung (Strom + Rechnung). Giống của từ ghép theo từ cuối: der Wind + die Kraft = die Windkraft, die Sonne + das Licht = das Sonnenlicht."
  - type: explain
    text:
      vi: "Giữa hai phần đôi khi có âm nối: -s- (der Arbeitsplatz, das Verkehrsmittel), -n- (die Sonnenenergie), -es- (das Tageslicht), hoặc không có gì (der Umweltschutz, der Klimaschutz). Sau các hậu tố danh từ giống cái bạn đã học ở B1U05 (-ung, -heit, -keit, -ion, -tät) thường có -s-: die Wohnungstür, das Gesundheitsamt; các từ khác bạn nên học thuộc cả từ."
  - type: deep_explain
    text:
      vi: "Âm nối -s- không phải số nhiều hay sở hữu cách, nó chỉ là \"keo dán\" giúp đọc trơn; vì vậy Arbeitsplatz không có nghĩa là \"chỗ của công việc\" theo kiểu Genitiv. Một số từ đổi dạng khi ghép: die Schule → das Schulbuch (bỏ -e), das Kind → das Kinderzimmer (-er-). So sánh ba cách nói hệ quả: …, deshalb + V2 (Es war kalt, deshalb haben wir mehr geheizt); …, sodass + động từ cuối; so + tính từ …, dass + động từ cuối. Đừng nhầm sodass (hệ quả) với damit (mục đích, để): Wir haben eine Solaranlage, damit wir Strom sparen (mục đích) – …, sodass wir Strom sparen (kết quả). Khi viết về năng lượng, những từ ghép hay gặp là der Stromverbrauch, die Stromrechnung, das Kraftwerk, die Wärmepumpe, der Ökostrom."
  - type: example
    target: Der Strom ist so teuer geworden, dass viele Familien Energie sparen müssen.
    target_lang: de
    translation:
      vi: Điện đã đắt đến mức nhiều gia đình phải tiết kiệm năng lượng.
    note:
      vi: "so + tính từ (teuer) ở câu chính, câu phụ dass có động từ chia (müssen) ở cuối."
  - type: example
    target: Wir haben jetzt eine Solaranlage auf dem Dach, sodass unsere Stromrechnung viel niedriger ist.
    target_lang: de
    translation:
      vi: Giờ nhà chúng tôi có hệ thống điện mặt trời trên mái, nên hoá đơn tiền điện thấp hơn nhiều.
    note:
      vi: "sodass nêu kết quả, ist đứng cuối. die Solaranlage, die Stromrechnung: giống cái theo die Anlage, die Rechnung."
  - type: example
    target: Unser alter Kühlschrank hat so viel Strom verbraucht, dass wir einen neuen gekauft haben.
    target_lang: de
    translation:
      vi: Tủ lạnh cũ nhà tôi tốn điện đến nỗi chúng tôi đã mua cái mới.
    note:
      vi: "so viel = nhiều đến nỗi. verbrauchen không có ge- ở Partizip II: verbraucht."
  - type: example
    target: Windkraft und Sonnenenergie sind erneuerbar und wichtig für den Klimaschutz.
    target_lang: de
    translation:
      vi: Năng lượng gió và năng lượng mặt trời là năng lượng tái tạo và quan trọng cho việc bảo vệ khí hậu.
    note:
      vi: "Sonne + n + Energie (âm nối -n-); Klima + Schutz (không có âm nối). Wind + Kraft → die Windkraft (giống cái theo die Kraft)."
  - type: example
    target: Wer Energie spart, tut etwas für den Umweltschutz und zahlt weniger.
    target_lang: de
    translation:
      vi: Ai tiết kiệm năng lượng là đang làm điều tốt cho môi trường và trả ít tiền hơn.
    note:
      vi: "der Umweltschutz: die Umwelt + der Schutz, giống đực theo từ cuối."
  - type: example
    target: Schalte alles aus, was du gerade nicht brauchst. So sparst du Strom.
    target_lang: de
    translation:
      vi: Hãy tắt mọi thứ bạn đang không dùng. Như vậy bạn tiết kiệm được điện.
    note:
      vi: "alles, was …: câu quan hệ với was (đã học ở B1U04), động từ brauchst đứng cuối. Lời khuyên cho bạn bè (du)."
  - type: common_mistake
    wrong: Ich suche einen neuen Arbeitplatz.
    right: Ich suche einen neuen Arbeitsplatz.
    target_lang: de
    note:
      vi: "Arbeit + Platz cần âm nối -s-: der Arbeitsplatz."
  - type: common_mistake
    wrong: Es war sehr kalt, sodass wir mussten mehr heizen.
    right: Es war sehr kalt, sodass wir mehr heizen mussten.
    target_lang: de
    note:
      vi: "sodass mở câu phụ, nên động từ chia (mussten) đứng cuối, không ở vị trí 2."
  - type: common_mistake
    wrong: Das Stromrechnung ist sehr hoch.
    right: Die Stromrechnung ist sehr hoch.
    target_lang: de
    note:
      vi: "Giống của từ ghép theo từ cuối: die Rechnung → die Stromrechnung (không theo der Strom)."
  - type: summary
    points:
      - vi: "…, sodass + câu phụ (động từ cuối) = nên, cho nên; đứng sau câu chính."
      - vi: "so + tính từ …, dass … = đến nỗi: so teuer, dass wir sparen müssen."
      - vi: "deshalb + V2 (trạng từ) · sodass + động từ cuối (câu phụ)."
      - vi: "Từ ghép: từ chính đứng cuối và quyết định giống (die Stromrechnung)."
      - vi: "Âm nối: -s- (Arbeitsplatz, Verkehrsmittel), -n- (Sonnenenergie), -es- (Tageslicht), không có (Umweltschutz)."
      - vi: "Sau -ung, -heit, -keit, -ion, -tät thường có -s-."
      - vi: "Từ vựng: die Energie, der Strom, erneuerbar, die Solaranlage, die Windkraft, verbrauchen, der Verbrauch, nachhaltig."
