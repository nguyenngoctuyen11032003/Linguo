title:
  vi: Trong tương lai – Futur I (Es wird wärmer werden.)
objectives:
  - vi: Dùng Futur I (werden + nguyên thể) để dự báo, nói quyết tâm và hứa hẹn.
  - vi: Phỏng đoán điều đang xảy ra bằng werden + wohl (Er wird wohl krank sein).
  - vi: Đọc hiểu một đoạn dự báo ngắn về khí hậu.
