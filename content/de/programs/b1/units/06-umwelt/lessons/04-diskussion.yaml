      correct_option_id: m3a
    explanation:
      vi: "Das sehe ich anders = tôi thấy khác (phản đối). Lý lẽ: Viele Menschen brauchen ihr Auto für die Arbeit = nhiều người cần ô tô để đi làm."
    display_answer: Người nói phản đối lệnh cấm xe ở trung tâm, vì nhiều người cần ô tô để đi làm.

  - key: de:exercise:b1u06l4-listen-einerseits
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u06-vorteil
    prompt:
      audio_asset_id: null
      fallback_text: Einerseits ist Ökostrom gut für die Umwelt, andererseits kann er etwas teurer sein. Trotzdem kaufe ich nur noch Ökostrom.
      options:
        - { id: o2a, text: "Điện xanh tốt cho môi trường nhưng có thể đắt hơn một chút; dù vậy người nói giờ chỉ mua điện xanh.", lang: vi }
        - { id: o6b, text: "Điện xanh tốt cho môi trường nhưng đắt hơn, vì vậy người nói không mua nữa.", lang: vi }
        - { id: o9c, text: "Điện xanh vừa rẻ hơn vừa tốt cho môi trường, nên người nói chỉ mua điện xanh.", lang: vi }
        - { id: o4d, text: "Điện xanh không tốt cho môi trường lắm, nhưng người nói vẫn mua vì rẻ.", lang: vi }
    answer:
      correct_option_id: o2a
    explanation:
      vi: "Einerseits … gut für die Umwelt (ưu điểm), andererseits … etwas teurer (nhược điểm: có thể đắt hơn một chút). Trotzdem kaufe ich nur noch Ökostrom = dù vậy, giờ tôi chỉ mua điện xanh."
    display_answer: Điện xanh tốt cho môi trường nhưng có thể đắt hơn một chút; dù vậy người nói giờ chỉ mua điện xanh.

  - key: de:exercise:b1u06l4-mcq-meinung-v2
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u06-g-meinung-redemittel
    prompt:
      stem: "Câu nào đúng? (Theo tôi, lệnh cấm này hợp lý.)"
      stem_lang: vi
      options:
        - { id: v2a, text: "Meiner Meinung nach ist das Verbot sinnvoll.", lang: de }
        - { id: v6b, text: "Meiner Meinung nach das Verbot ist sinnvoll.", lang: de }
        - { id: v9c, text: "Meiner Meinung nach ich finde das Verbot sinnvoll.", lang: de }
        - { id: v4d, text: "Meine Meinung nach ist das Verbot sinnvoll.", lang: de }
