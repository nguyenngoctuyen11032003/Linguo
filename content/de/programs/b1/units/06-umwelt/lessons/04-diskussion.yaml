body:
  - type: objective
    text:
      vi: "Sau bài này, bạn tham gia được một cuộc thảo luận ngắn về môi trường, ví dụ: \"Meiner Meinung nach sollten weniger Autos in die Innenstadt fahren. – Da stimme ich dir zu. – Das sehe ich anders.\""
  - type: explain
    text:
      vi: "Meiner Meinung nach (theo ý tôi) chiếm vị trí 1, nên động từ chia đứng ngay sau, rồi mới đến chủ ngữ: Meiner Meinung nach ist das Verbot sinnvoll. Tiếng Việt nói \"theo tôi, lệnh cấm này hợp lý\" với chủ ngữ đứng trước động từ, nên người Việt hay quên đảo. Đừng thêm ich denke hay ich finde sau cụm này."
  - type: explain
    text:
      vi: "Ich bin der Meinung, dass … và Ich bin der Ansicht, dass … nghe trang trọng hơn Ich finde, dass … một chút; sau dass động từ đứng cuối. Muốn nêu lập trường: Mein Standpunkt ist … hoặc Ich stehe auf dem Standpunkt, dass …"
  - type: explain
    text:
      vi: "Đồng ý: Da stimme ich dir/Ihnen zu. – Da hast du recht. Phản đối nhẹ nhàng: Das sehe ich anders. – Da muss ich dir/Ihnen widersprechen. – Das finde ich übertrieben. zustimmen và widersprechen đều đi với Dativ (dir, Ihnen)."
  - type: explain
    text:
      vi: "Khi cân nhắc hai mặt, dùng Einerseits …, andererseits … (một mặt …, mặt khác …), mỗi vế động từ đứng ngay sau: Einerseits ist das Auto praktisch, andererseits ist es teuer. Nêu ưu, nhược điểm: Ein Vorteil ist, dass … / Ein Nachteil ist, dass …"
  - type: deep_explain
    text:
      vi: "meiner trong Meiner Meinung nach là Dativ (nach + Dativ, nhưng ở đây nach đứng sau danh từ); cũng có thể nói Nach meiner Meinung ist … Ich bin der Meinung dùng Nominativ (der Meinung), còn Ich bin anderer Meinung (tôi có ý kiến khác) là Genitiv không mạo từ, một cụm cố định. Câu Ich bin mit dir einverstanden không sai ngữ pháp, nhưng thường dùng để đồng ý với một đề nghị (Ich bin einverstanden = tôi đồng ý làm thế); khi tranh luận, Da hast du recht hoặc Da stimme ich dir zu tự nhiên hơn. Với người lạ, người lớn tuổi hay trong buổi thảo luận trang trọng, dùng Sie: Da stimme ich Ihnen zu. Theo hiểu biết lúc soạn bài, kỳ thi Goethe B1 có phần nghe một cuộc thảo luận và phần nói cần nêu, bảo vệ ý kiến; cấu trúc đề có thể thay đổi, hãy xem tài liệu mẫu chính thức."
  - type: example
    target: Meiner Meinung nach sollten weniger Autos in die Innenstadt fahren.
    target_lang: de
    translation:
      vi: Theo tôi, nên có ít ô tô chạy vào trung tâm thành phố hơn.
    note:
      vi: "Meiner Meinung nach ở vị trí 1, động từ sollten ngay sau, chủ ngữ weniger Autos theo sau."
  - type: example
    target: Ich bin der Ansicht, dass ein Fahrverbot keine gute Lösung ist.
    target_lang: de
    translation:
      vi: Tôi cho rằng lệnh cấm xe không phải là giải pháp tốt.
    note:
      vi: "Ich bin der Ansicht, dass … – câu phụ dass, động từ ist đứng cuối."
  - type: example
    target: Wir sollten Plastiktüten ganz verbieten. – Da stimme ich dir zu. Es gibt doch gute Alternativen.
    target_lang: de
    translation:
      vi: Chúng ta nên cấm hẳn túi ni-lông. – Mình đồng ý với bạn. Đâu thiếu gì lựa chọn tốt khác.
    note:
      vi: "Hai người bạn (du): Da stimme ich dir zu (zustimmen + Dativ dir, động từ tách)."
  - type: example
    target: Das sehe ich anders. Viele Menschen brauchen ihr Auto für die Arbeit.
    target_lang: de
    translation:
      vi: Tôi thấy khác. Nhiều người cần ô tô để đi làm.
    note:
      vi: "Phản bác lịch sự rồi đưa ngay một lý lẽ (ein Argument)."
  - type: example
    target: Einerseits ist ein Verbot sinnvoll, andererseits ist es für manche Menschen ein großer Nachteil.
    target_lang: de
    translation:
      vi: Một mặt lệnh cấm là hợp lý, mặt khác nó là một bất lợi lớn đối với một số người.
    note:
      vi: "Einerseits …, andererseits …: sau mỗi từ, động từ ist đứng ngay sau (chỉ cần nhận biết ở bài này)."
  - type: example
    target: Die Stadt plant ein Fahrverbot. Was hältst du davon? – Ich bin dafür, aber mein Mann ist dagegen.
    target_lang: de
    translation:
      vi: Thành phố định cấm xe. Bạn nghĩ sao về chuyện đó? – Mình tán thành, nhưng chồng mình thì phản đối.
    note:
      vi: "halten von + Dativ → davon (thay cho \"von diesem Fahrverbot\"). dafür/dagegen sein = tán thành/phản đối."
  - type: common_mistake
    wrong: Meiner Meinung nach ich denke, das ist gut.
    right: Meiner Meinung nach ist das gut.
    target_lang: de
    note:
      vi: "Meiner Meinung nach đã có nghĩa \"tôi nghĩ\"; không thêm ich denke, và động từ ist đứng ngay sau."
  - type: common_mistake
    wrong: Meiner Meinung nach das Verbot ist sinnvoll.
    right: Meiner Meinung nach ist das Verbot sinnvoll.
    target_lang: de
    note:
      vi: "Cụm Meiner Meinung nach là vị trí 1, nên động từ ist ở vị trí 2."
  - type: common_mistake
    wrong: Ich stimme dich zu.
    right: Ich stimme dir zu.
    target_lang: de
    note:
      vi: "zustimmen đi với Dativ: dir (du), Ihnen (Sie)."
  - type: common_mistake
    wrong: Ich bin einverstanden mit dir, das Argument ist gut.
    right: Da hast du recht, das Argument ist gut.
    target_lang: de
    note:
      vi: "Câu đầu không sai ngữ pháp nhưng nghe nặng và hay dùng để đồng ý một đề nghị. Trong tranh luận, nói Da hast du recht hoặc Da stimme ich dir zu."
  - type: summary
    points:
      - vi: "Meiner Meinung nach + động từ ngay sau: Meiner Meinung nach ist das sinnvoll."
      - vi: "Ich bin der Meinung/Ansicht, dass … (động từ cuối); Mein Standpunkt ist …"
      - vi: "Đồng ý: Da stimme ich dir zu. / Da hast du recht."
      - vi: "Phản đối: Das sehe ich anders. / Da muss ich dir widersprechen. / Das finde ich übertrieben."
      - vi: "zustimmen, widersprechen + Dativ (dir, Ihnen)."
      - vi: "Einerseits …, andererseits … (nhận biết); Ein Vorteil/Nachteil ist, dass …"
      - vi: "Từ vựng: die Meinung, die Ansicht, der Standpunkt, das Argument, überzeugen, der Vorteil, der Nachteil."
