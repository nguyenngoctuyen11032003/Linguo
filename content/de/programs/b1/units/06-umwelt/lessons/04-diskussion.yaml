  # ---------------- recall ----------------
  - key: de:exercise:b1u06l4-fill-redemittel
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-g-meinung-redemittel
    prompt:
      template: "Anna: Ich bin der {{b1}}, dass wir weniger Plastik benutzen sollten. – Ben: Da {{b2}} ich dir zu. – Clara: Das {{b3}} ich anders."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 7 }
        - { id: b3, width_hint: 5 }
    answer:
      blanks:
        b1: [Meinung, Ansicht]
        b2: [stimme]
        b3: [sehe]
    known_wrong:
      - answer: Standpunkt
        feedback_vi: Không nói Ich bin der Standpunkt; dùng Ich bin der Meinung/Ansicht, dass … (hoặc Ich stehe auf dem Standpunkt, dass …).
        error_tag: word_choice
      - answer: stimmt
        feedback_vi: Chủ ngữ là ich – ich stimme … zu.
        error_tag: verb_form
      - answer: sieht
        feedback_vi: Chủ ngữ là ich – Das sehe ich anders.
        error_tag: verb_form
    explanation:
      vi: "Ba câu mẫu: Ich bin der Meinung (Ansicht), dass … – Da stimme ich dir zu (zustimmen, tách) – Das sehe ich anders. Da và Das ở vị trí 1, nên động từ đứng ngay sau, chủ ngữ ich theo sau."
    display_answer: "Anna: Ich bin der Meinung, dass wir weniger Plastik benutzen sollten. – Ben: Da stimme ich dir zu. – Clara: Das sehe ich anders."

  - key: de:exercise:b1u06l4-fill-dir-ihnen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-zustimmen
    prompt:
      template: "(zu einer Freundin) Da stimme ich {{b1}} zu. – (zu einem Kunden) Da muss ich {{b2}} leider widersprechen."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [dir]
        b2: [Ihnen]
    known_wrong:
      - answer: dich
        feedback_vi: zustimmen đi với Dativ – dir, không phải dich.
        error_tag: case_dat_akk
      - answer: Sie
        feedback_vi: widersprechen đi với Dativ – Ihnen (lịch sự), không phải Sie.
        error_tag: case_dat_akk
    explanation:
      vi: "zustimmen và widersprechen cần Dativ. Với bạn bè (du): dir; với khách hàng (Sie): Ihnen, viết hoa."
    display_answer: "(zu einer Freundin) Da stimme ich dir zu. – (zu einem Kunden) Da muss ich Ihnen leider widersprechen."

  - key: de:exercise:b1u06l4-tr-verbot-sinnvoll
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-sinnvoll
    prompt:
      source_text: "Theo tôi, lệnh cấm này là hợp lý. (bắt đầu bằng Meiner Meinung nach)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Meiner Meinung nach ist dieses Verbot sinnvoll.
        - Meiner Meinung nach ist das Verbot sinnvoll.
        - Meiner Meinung nach ist dieses Verbot vernünftig.
        - Meiner Meinung nach ist das Verbot vernünftig.
    known_wrong:
      - answer: Meiner Meinung nach dieses Verbot ist sinnvoll.
        feedback_vi: Meiner Meinung nach ở vị trí 1 thì động từ ist ở vị trí 2 – Meiner Meinung nach ist …
        error_tag: verb_position
      - answer: Meiner Meinung nach ich finde dieses Verbot sinnvoll.
        feedback_vi: Không thêm ich finde sau Meiner Meinung nach – Meiner Meinung nach ist dieses Verbot sinnvoll.
        error_tag: word_order
      - answer: Meine Meinung nach ist dieses Verbot sinnvoll.
        feedback_vi: Cụm cố định dùng Dativ – Meiner Meinung nach.
        error_tag: case_dat_akk
    explanation:
      vi: "Meiner Meinung nach (vị trí 1) + ist (vị trí 2) + dieses/das Verbot + sinnvoll. das Verbot là giống trung nên \"lệnh cấm này\" là dieses Verbot."
    display_answer: Meiner Meinung nach ist dieses Verbot sinnvoll.

