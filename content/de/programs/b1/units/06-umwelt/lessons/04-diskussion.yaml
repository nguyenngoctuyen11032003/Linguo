      options:
        - { id: l2a, text: "Theo người nói, trong thành phố nên đi xe đạp nhiều hơn vì tốt cho sức khỏe và cho môi trường.", lang: vi }
        - { id: l6b, text: "Người nói cho rằng đi xe đạp trong thành phố quá nguy hiểm.", lang: vi }
        - { id: l9c, text: "Theo người nói, nên đi ô tô nhiều hơn vì nhanh hơn.", lang: vi }
        - { id: l4d, text: "Người nói kể rằng hôm qua mình đã đi xe đạp trong thành phố.", lang: vi }
    answer:
      correct_option_id: l2a
    explanation:
      vi: "Meiner Meinung nach sollten wir … mehr Fahrrad fahren = theo tôi, chúng ta nên đi xe đạp nhiều hơn. gesünder = tốt cho sức khỏe hơn; besser für die Umwelt = tốt hơn cho môi trường."
    display_answer: Theo người nói, trong thành phố nên đi xe đạp nhiều hơn vì tốt cho sức khỏe và cho môi trường.

  - key: de:exercise:b1u06l4-listen-anders
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u06-argument
    prompt:
      audio_asset_id: null
      fallback_text: Ein Fahrverbot in der Innenstadt? Das sehe ich anders. Viele Menschen brauchen ihr Auto für die Arbeit.
      options:
        - { id: m3a, text: "Người nói phản đối lệnh cấm xe ở trung tâm, vì nhiều người cần ô tô để đi làm.", lang: vi }
        - { id: m7b, text: "Người nói ủng hộ lệnh cấm xe ở trung tâm thành phố.", lang: vi }
        - { id: m1c, text: "Người nói phản đối lệnh cấm xe, vì ô tô không gây ô nhiễm.", lang: vi }
