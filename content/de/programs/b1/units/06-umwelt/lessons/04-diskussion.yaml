title:
  vi: Thảo luận về môi trường – nêu ý kiến (Meiner Meinung nach …)
objectives:
  - vi: Nêu ý kiến bằng Meiner Meinung nach …, Ich bin der Meinung/Ansicht, dass …
  - vi: Đồng ý và phản bác lịch sự (Da stimme ich dir zu. / Das sehe ich anders.), nêu ưu và nhược điểm.
  - vi: Nghe hiểu ai ủng hộ, ai phản đối trong một cuộc thảo luận ngắn.
