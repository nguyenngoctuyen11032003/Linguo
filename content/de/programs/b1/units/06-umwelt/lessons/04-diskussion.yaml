        feedback_vi: Cần tính từ übertrieben (dạng Partizip II), không phải nguyên thể übertreiben.
        error_tag: participle_form
    explanation:
      vi: "Bạn nói đúng = (Da) hast du recht / Du hast recht (với haben). \"Hơi quá\" = ein bisschen/etwas übertrieben. Sau aber, câu giữ trật tự V2 bình thường: ich finde das … hoặc das finde ich …"
    display_answer: Da hast du recht, aber ich finde das ein bisschen übertrieben.

