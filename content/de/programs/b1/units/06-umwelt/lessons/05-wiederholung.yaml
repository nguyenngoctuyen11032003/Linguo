  - key: de:exercise:b1u06l5-mcq-anzeige-lan
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u06-stromrechnung
    prompt:
      stem: "Lan wohnt zur Miete. Ihre Stromrechnung war im letzten Jahr sehr hoch, und sie weiß nicht, wie sie sparen kann. — Welche Anzeige passt zu Lan?"
      stem_lang: de
      options:
        - { id: an1, text: "Repair-Café im Stadtteilzentrum: Jeden ersten Samstag im Monat reparieren Freiwillige kostenlos Elektrogeräte, Fahrräder und Kleidung.", lang: de }
        - { id: an2, text: "Fahrradkurs für Erwachsene: An fünf Abenden lernen Sie, sicher im Stadtverkehr zu fahren. Leihräder sind vorhanden. Kosten: 40 Euro.", lang: de }
        - { id: an3, text: "Energieberatung für Mieter: Wir zeigen Ihnen, wie Sie Strom und Heizkosten sparen können. Die erste Beratung ist kostenlos.", lang: de }
        - { id: an4, text: "Kleidertausch im Jugendzentrum: Bringen Sie Kleidung mit, die Sie nicht mehr tragen, und nehmen Sie kostenlos andere Sachen mit. Für alle ab 16 Jahren.", lang: de }
        - { id: an5, text: "Gemeinschaftsgarten sucht Helfer: Gemüse anbauen mitten in der Stadt, jeden Mittwochnachmittag. Gartenwerkzeug ist da.", lang: de }
    answer:
      correct_option_id: an3
    explanation:
      vi: "Lan đi thuê nhà (zur Miete) và muốn biết cách tiết kiệm điện. Quảng cáo Energieberatung für Mieter (tư vấn năng lượng cho người thuê nhà) chỉ cách tiết kiệm điện và tiền sưởi, buổi tư vấn đầu miễn phí."
    display_answer: "Energieberatung für Mieter: Wir zeigen Ihnen, wie Sie Strom und Heizkosten sparen können. Die erste Beratung ist kostenlos."

