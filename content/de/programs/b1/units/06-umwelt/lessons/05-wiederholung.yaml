  # ---------------- recognition: nghe ----------------
  - key: de:exercise:b1u06l5-listen-unwetter
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u06-unwetter
    prompt:
      audio_asset_id: null
      fallback_text: Achtung, Unwetterwarnung! Wegen der großen Hitze wird es heute Abend wahrscheinlich Gewitter geben. Bitte bleiben Sie während des Unwetters im Haus.
      options:
        - { id: u2a, text: "Vì nắng nóng, tối nay có lẽ sẽ có dông. Trong lúc có dông, mọi người nên ở trong nhà.", lang: vi }
        - { id: u6b, text: "Vì nắng nóng, sáng mai có lẽ sẽ có dông. Trong lúc có dông, mọi người nên ở trong nhà.", lang: vi }
        - { id: u9c, text: "Dù trời nóng, tối nay sẽ không có dông, nên mọi người có thể ra ngoài.", lang: vi }
        - { id: u4d, text: "Vì mưa kéo dài, tối nay có thể bị ngập. Mọi người nên rời khỏi nhà.", lang: vi }
    answer:
      correct_option_id: u2a
    explanation:
      vi: "Wegen der großen Hitze = vì nắng nóng (wegen + Genitiv). wird es heute Abend wahrscheinlich Gewitter geben = tối nay có lẽ sẽ có dông (Futur I). während des Unwetters = trong lúc có giông bão (während + Genitiv)."
    display_answer: Vì nắng nóng, tối nay có lẽ sẽ có dông. Trong lúc có dông, mọi người nên ở trong nhà.

  - key: de:exercise:b1u06l5-listen-heizkosten
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u06-verbrauchen
    prompt:
      audio_asset_id: null
      fallback_text: Da unsere Heizkosten so hoch waren, haben wir neue Fenster einbauen lassen. Jetzt verbrauchen wir viel weniger Energie.
      options:
        - { id: h3a, text: "Vì tiền sưởi quá cao, họ đã cho lắp cửa sổ mới, và giờ họ tiêu thụ ít năng lượng hơn nhiều.", lang: vi }
        - { id: h7b, text: "Vì tiền sưởi quá cao, họ đã tự lắp cửa sổ mới, nhưng vẫn tiêu thụ nhiều năng lượng.", lang: vi }
        - { id: h1c, text: "Vì tiền điện quá cao, họ đã mua một tủ lạnh mới.", lang: vi }
        - { id: h5d, text: "Họ muốn lắp cửa sổ mới vì cửa sổ cũ quá xấu.", lang: vi }
    answer:
      correct_option_id: h3a
    explanation:
      vi: "Da … so hoch waren = vì (tiền sưởi) cao quá. haben … einbauen lassen = đã nhờ người lắp (lassen + nguyên thể, không phải tự làm). viel weniger Energie verbrauchen = tiêu thụ ít năng lượng hơn nhiều."
    display_answer: Vì tiền sưởi quá cao, họ đã cho lắp cửa sổ mới, và giờ họ tiêu thụ ít năng lượng hơn nhiều.

  # ---------------- recall ----------------
  - key: de:exercise:b1u06l5-fill-forum
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u06-g-meinung-redemittel
    prompt:
      template: "{{b1}} Meinung nach sollten weniger Autos in die Innenstadt fahren. Ein großer {{b2}} ist, dass die Luft dann sauberer wird. Ein {{b3}} ist aber, dass manche Menschen dann längere Wege haben."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 8 }
        - { id: b3, width_hint: 8 }
    answer:
      blanks:
        b1: [Meiner]
        b2: [Vorteil]
        b3: [Nachteil]
    known_wrong:
      - answer: Meine
        feedback_vi: Cụm cố định dùng Dativ – Meiner Meinung nach.
        error_tag: case_dat_akk
      - answer: Vorteile
        feedback_vi: Sau ein (số ít) cần Vorteil, không phải số nhiều.
        error_tag: plural_form
    explanation:
      vi: "Meiner Meinung nach + V2 (sollten). Không khí sạch hơn là ưu điểm: ein großer Vorteil; đường đi dài hơn là nhược điểm: ein Nachteil (aber báo hiệu ý ngược lại)."
    display_answer: "Meiner Meinung nach sollten weniger Autos in die Innenstadt fahren. Ein großer Vorteil ist, dass die Luft dann sauberer wird. Ein Nachteil ist aber, dass manche Menschen dann längere Wege haben."

