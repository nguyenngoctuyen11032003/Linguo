body:
  - type: objective
    text:
      vi: Sau bài này, bạn chọn được quảng cáo phù hợp với nhu cầu của từng người, nghe hiểu thông báo ngắn về thời tiết và năng lượng, và viết được bài diễn đàn khoảng 80 từ nêu ý kiến về một chủ đề môi trường.
  - type: explain
    text:
      vi: "Với dạng ghép người – quảng cáo, hãy đọc nhu cầu của người trước và gạch chân điều quan trọng nhất (muốn gì, không muốn gì, bao nhiêu tuổi, có tiền không). Sau đó tìm quảng cáo khớp mọi điều kiện, không chỉ khớp một từ giống nhau; thường có quảng cáo thừa không hợp với ai."
  - type: explain
    text:
      vi: "Bài diễn đàn (Forumsbeitrag) là ý kiến cá nhân: mở đầu bằng trải nghiệm hoặc lập trường của bạn, đưa hai, ba lý do có ví dụ, nhắc một ý ngược lại, rồi kết luận. Không cần lời chào như e-mail; người viết thường xưng ich và viết thân mật nhưng rõ ràng."
  - type: explain
    text:
      vi: "Để bài viết đạt mức B1, hãy dùng các cấu trúc của unit: Meiner Meinung nach + V2, wegen + Genitiv, da/weil + động từ cuối, sodass/so … dass cho hệ quả, Ein Vorteil/Nachteil ist, dass … và Futur I cho dự đoán. Đếm khoảng 80 từ: viết quá ngắn hoặc thiếu ý là mất điểm."
  - type: deep_explain
    text:
      vi: "Theo hiểu biết lúc soạn bài, Goethe-Zertifikat B1 có một phần đọc ghép người với quảng cáo và một phần viết bài diễn đàn khoảng 80 từ; số câu, thời gian và thang điểm có thể thay đổi, nên hãy xem tài liệu mẫu chính thức của Goethe-Institut. Khi ghép, cẩn thận với quảng cáo có từ giống hệt trong mô tả nhưng sai một điều kiện (giá, tuổi, ngày). Trong bài diễn đàn, thứ tự gợi ý: (1) Ich wohne … / Ich finde das Thema wichtig, weil … (2) Meiner Meinung nach … (3) Ein Vorteil ist, dass … (4) Andererseits … / Natürlich … (5) Deshalb finde ich … Viết xong, kiểm tra lại động từ: V2 trong câu chính, động từ cuối sau weil, da, dass, sodass, wenn."
  - type: example
    target: "Ich wohne seit fünf Jahren in der Innenstadt, und meiner Meinung nach sollten dort weniger Autos fahren. Wegen des starken Verkehrs ist die Luft oft schlecht, und es ist sehr laut. Viele Kinder fahren nicht mit dem Rad zur Schule, da die Straßen zu gefährlich sind. Natürlich brauchen manche Menschen ihr Auto, zum Beispiel ältere Leute. Deshalb finde ich ein komplettes Verbot übertrieben. Aber wenn Busse und Bahnen billiger werden, werden sicher mehr Menschen ihr Auto stehen lassen."
    target_lang: de
    translation:
      vi: "Tôi sống ở trung tâm thành phố đã năm năm, và theo tôi ở đó nên có ít ô tô hơn. Vì xe cộ đông đúc nên không khí thường xấu và rất ồn. Nhiều trẻ em không đi xe đạp đến trường vì đường sá quá nguy hiểm. Dĩ nhiên một số người cần ô tô, ví dụ người lớn tuổi. Vì vậy tôi thấy cấm hoàn toàn là quá đà. Nhưng nếu xe buýt và tàu rẻ hơn, chắc chắn sẽ có nhiều người để ô tô ở nhà hơn."
    note:
      vi: "Bài mẫu khoảng 80 từ: lập trường (meiner Meinung nach) – lý do (wegen + Genitiv, da) – ý ngược lại (Natürlich …) – kết luận và dự đoán (deshalb, werden … stehen lassen)."
  - type: example
    target: Warum ist die Luft heute so schlecht? – Das wird wohl am Verkehr liegen.
    target_lang: de
    translation:
      vi: Sao hôm nay không khí xấu thế? – Chắc là do xe cộ.
    note:
      vi: "werden + wohl + nguyên thể: phỏng đoán điều đang xảy ra. liegen an + Dativ = do, tại."
  - type: example
    target: Ich trenne meinen Müll, da Plastik sehr lange in der Natur bleibt.
    target_lang: de
    translation:
      vi: Tôi phân loại rác, vì nhựa tồn tại rất lâu trong tự nhiên.
    note:
      vi: "Câu phụ da đứng sau câu chính cũng được; động từ bleibt ở cuối."
  - type: common_mistake
    wrong: Wegen dem Verkehr ist die Luft schlecht. (im Prüfungstext)
    right: Wegen des Verkehrs ist die Luft schlecht.
    target_lang: de
    note:
      vi: "Trong bài viết thi, dùng wegen + Genitiv: des Verkehrs."
  - type: common_mistake
    wrong: In Zukunft ich werde mehr Rad fahren.
    right: In Zukunft werde ich mehr Rad fahren.
    target_lang: de
    note:
      vi: "In Zukunft ở vị trí 1, nên werde ở vị trí 2."
  - type: common_mistake
    wrong: Es war so kalt, sodass wir mehr heizen mussten.
    right: Es war so kalt, dass wir mehr heizen mussten.
    target_lang: de
    note:
      vi: "Đã có so trước tính từ thì nối bằng dass; sodass dùng khi không có so."
  - type: summary
    points:
      - vi: "Ghép quảng cáo: đọc nhu cầu trước, khớp mọi điều kiện, cẩn thận quảng cáo thừa."
      - vi: "Bài diễn đàn ~80 từ: lập trường – lý do + ví dụ – ý ngược lại – kết luận."
      - vi: "Meiner Meinung nach + V2; Ich bin der Meinung, dass … (động từ cuối)."
      - vi: "wegen/trotz/während + Genitiv; da/weil + động từ cuối; nämlich giữa câu."
      - vi: "…, sodass … / so + tính từ, dass …; Futur I: werden + nguyên thể cuối câu."
      - vi: "werden + wohl = phỏng đoán hiện tại; từ ghép: giống theo từ cuối, âm nối -s-/-n-."
