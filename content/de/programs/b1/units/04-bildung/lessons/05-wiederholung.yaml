  vi: Ôn tập + trình bày – hệ thống giáo dục Việt Nam và Đức (Wiederholung)
objectives:
  - vi: Chuẩn bị bài nói kiểu Goethe B1 Sprechen Teil 2 về chủ đề học nghề hay học đại học – giới thiệu chủ đề, kinh nghiệm bản thân, tình hình ở Việt Nam, ưu và nhược điểm, kết luận.
  - vi: Đọc hiểu một văn bản dài có cấu trúc (kiểu Goethe B1 Lesen Teil 2) và chọn richtig/falsch.
  - vi: Ôn Konjunktiv II, liên từ hai vế, je … desto, was/wo và brauchen … zu trong một bài nói mạch lạc.
