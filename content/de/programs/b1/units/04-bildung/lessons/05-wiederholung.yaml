body:
  - type: objective
    text:
      vi: "Sau bài này, bạn trình bày được khoảng hai phút về chủ đề \"Ausbildung oder Studium?\", theo đủ năm phần như trong bài thi nói Goethe B1, và đọc hiểu được một văn bản dài về chủ đề này."
  - type: explain
    text:
      vi: "Bài trình bày kiểu Goethe B1 Sprechen Teil 2 thường có năm phần: giới thiệu chủ đề, kinh nghiệm của bạn, tình hình ở nước bạn, ưu và nhược điểm kèm ý kiến riêng, kết luận và cảm ơn. Mở đầu: Ich möchte heute über das Thema … sprechen. Kết thúc: Zum Schluss möchte ich sagen, dass … Vielen Dank fürs Zuhören."
  - type: explain
    text:
      vi: "Phần kinh nghiệm và tình hình ở Việt Nam: Ich habe selbst … gemacht. / In Vietnam ist es so, dass … / Viele Eltern wünschen sich, dass ihre Kinder studieren. Để nói giả định, dùng Konjunktiv II: Wenn ich noch einmal wählen könnte, würde ich …"
  - type: explain
    text:
      vi: "Phần ưu và nhược điểm là chỗ để dùng liên từ hai vế: Eine Ausbildung ist zwar kürzer, aber …; Man verdient nicht nur Geld, sondern sammelt auch Erfahrung. je … desto giúp bạn nêu một nhận định chung: Je besser die Ausbildung ist, desto größer sind die Chancen."
  - type: explain
    text:
      vi: "Khi đọc một văn bản dài (Lesen Teil 2), trước hết đọc tiêu đề và các câu hỏi, rồi tìm đoạn chứa thông tin. Chú ý các từ làm đổi nghĩa: zwar … aber, nicht nur … sondern auch, weder … noch, và Konjunktiv II (Ich wünschte … = thực tế không như vậy)."
  - type: deep_explain
    text:
      vi: "Hệ thống học nghề kép ở Đức (duale Ausbildung) kết hợp làm việc trong doanh nghiệp với học lý thuyết ở Berufsschule, thường kéo dài 2–3,5 năm và người học nhận một khoản trợ cấp học nghề hằng tháng. Nhiều nghề như thợ điện, thợ cơ khí ô tô hay nhân viên văn phòng được học theo cách này, còn bác sĩ hay giáo viên thì phải học đại học. Ở Việt Nam, nhiều gia đình coi việc vào đại học là con đường chính, nên khi trình bày bạn có thể so sánh hai quan niệm này. Trong bài thi, đừng học thuộc lòng cả bài (giám khảo thường nhận ra); hãy học thuộc các cụm mở bài, chuyển ý và kết bài, phần nội dung thì nói tự nhiên. Ngoài ra, sau bài trình bày, bạn thi cặp và giám khảo thường phản hồi và hỏi bạn một câu (Teil 3), nên hãy chuẩn bị vài câu như: Das ist eine gute Frage. Ich glaube, … Lưu ý: cấu trúc đề thi có thể thay đổi, hãy kiểm tra thông tin mới nhất của Goethe-Institut."
  - type: example
    target: Ich möchte heute über das Thema Ausbildung oder Studium sprechen. Zuerst erzähle ich von meinen eigenen Erfahrungen.
    target_lang: de
    translation:
      vi: Hôm nay tôi muốn nói về chủ đề học nghề hay học đại học. Trước hết tôi sẽ kể về kinh nghiệm của bản thân.
    note:
      vi: "Câu mở đầu và câu nêu bố cục – hai câu nên thuộc lòng cho phần thi nói."
  - type: example
    target: In Vietnam wünschen sich viele Eltern, dass ihre Kinder an die Universität gehen.
    target_lang: de
    translation:
      vi: Ở Việt Nam, nhiều bậc cha mẹ mong con mình vào đại học.
    note:
      vi: "sich wünschen, dass … (hiện tại) nói một mong muốn có thể thành hiện thực – khác với Ich wünschte, … (điều không có thật)."
  - type: example
    target: Eine Ausbildung dauert zwar nicht so lange, aber man verdient schon Geld und sammelt Erfahrung.
    target_lang: de
    translation:
      vi: Học nghề tuy không kéo dài bằng, nhưng người học đã có tiền và tích luỹ được kinh nghiệm.
    note:
      vi: "zwar … aber nêu ưu điểm và nhược điểm trong cùng một câu; aber không làm đổi trật tự từ."
  - type: example
    target: Wenn ich noch einmal wählen könnte, würde ich zuerst eine Ausbildung machen und dann studieren.
    target_lang: de
    translation:
      vi: Nếu được chọn lại, tôi sẽ học nghề trước rồi mới học đại học.
    note:
      vi: "Câu điều kiện không thật: könnte (cuối vế wenn), würde … machen (vế chính, bắt đầu bằng động từ)."
  - type: example
    target: Zum Schluss möchte ich sagen, dass beide Wege gut sind. Vielen Dank fürs Zuhören!
    target_lang: de
    translation:
      vi: Cuối cùng, tôi muốn nói rằng cả hai con đường đều tốt. Cảm ơn mọi người đã lắng nghe!
    note:
      vi: "Câu kết bài: Zum Schluss … + lời cảm ơn. fürs = für das."
  - type: common_mistake
    wrong: Wenn ich noch einmal wählen könnte, ich würde eine Ausbildung machen.
    right: Wenn ich noch einmal wählen könnte, würde ich eine Ausbildung machen.
    target_lang: de
    note:
      vi: "Vế wenn đứng đầu chiếm vị trí 1, nên vế chính bắt đầu ngay bằng động từ würde."
  - type: common_mistake
    wrong: In Vietnam gibt es weder genug Studienplätze noch keine guten Berufsschulen.
    right: In Vietnam gibt es weder genug Studienplätze noch genug gute Berufsschulen.
    target_lang: de
    note:
      vi: "weder … noch đã là phủ định; không thêm kein."
  - type: common_mistake
    wrong: Das ist alles, das ich über das Thema sagen möchte.
    right: Das ist alles, was ich über das Thema sagen möchte.
    target_lang: de
    note:
      vi: "Sau alles dùng was."
  - type: summary
    points:
      - vi: "Bố cục bài nói: chủ đề → kinh nghiệm → tình hình ở Việt Nam → ưu/nhược điểm + ý kiến → kết luận + cảm ơn."
      - vi: "Mở bài: Ich möchte heute über das Thema … sprechen. Kết bài: Zum Schluss möchte ich sagen, dass … Vielen Dank fürs Zuhören."
      - vi: "Giả định và ước: Wenn ich … könnte, würde ich …; Ich wünschte, ich hätte …"
      - vi: "Ưu/nhược điểm: zwar … aber, nicht nur … sondern auch, weder … noch, je … desto."
      - vi: "alles, was …; die Stadt, wo …; Man braucht nicht/nur … zu …"
exercises:
  # ---------------- recognition: đọc hiểu (kiểu Lesen Teil 2) ----------------
  - key: de:exercise:b1u04l5-mcq-lesen-betrieb
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u01-ausbildung
    prompt:
      stem: "Eine duale Ausbildung dauert meistens drei Jahre. Man arbeitet in einem Betrieb und lernt an ein oder zwei Tagen pro Woche in der Berufsschule. So verdient man nicht nur Geld, sondern sammelt auch früh Berufserfahrung. Ein Studium an einer Hochschule ist dagegen eher theoretisch. Studenten bekommen zwar kein Gehalt, aber für manche Berufe, zum Beispiel Arzt oder Lehrer, braucht man ein Studium. — Richtig oder falsch? Bei einer dualen Ausbildung lernt man nur in der Berufsschule."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Văn bản viết: Man arbeitet in einem Betrieb und lernt an ein oder zwei Tagen pro Woche in der Berufsschule – người học làm việc ở doanh nghiệp và chỉ học ở trường nghề một hai ngày mỗi tuần. Vì vậy câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u04l5-mcq-lesen-gehalt
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-zweiteilige-konnektoren
    prompt:
      stem: "Eine duale Ausbildung dauert meistens drei Jahre. Man arbeitet in einem Betrieb und lernt an ein oder zwei Tagen pro Woche in der Berufsschule. So verdient man nicht nur Geld, sondern sammelt auch früh Berufserfahrung. Ein Studium an einer Hochschule ist dagegen eher theoretisch. Studenten bekommen zwar kein Gehalt, aber für manche Berufe, zum Beispiel Arzt oder Lehrer, braucht man ein Studium. — Richtig oder falsch? Wer studiert, bekommt dafür kein Gehalt."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "Studenten bekommen zwar kein Gehalt, aber … – sinh viên tuy không có lương nhưng … zwar thừa nhận ý thứ nhất (không có lương) là đúng, aber chỉ đưa thêm ý ngược lại. Câu này đúng."
    display_answer: Richtig

  - key: de:exercise:b1u04l5-mcq-lesen-eltern
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-irrealer-wunsch
    prompt:
      stem: "Mai, 22, kommt aus Vietnam und macht in München eine Ausbildung zur Hotelfachfrau. Sie sagt: Ich wünschte, meine Eltern würden das deutsche System besser kennen. Für sie zählt nur die Universität. Aber je länger ich hier arbeite, desto sicherer bin ich, dass die Ausbildung die richtige Wahl für mich ist. — Richtig oder falsch? Die Eltern von Mai kennen das deutsche System gut."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Ich wünschte, meine Eltern würden das deutsche System besser kennen – lời ước bằng Konjunktiv II cho biết thực tế ngược lại: bố mẹ Mai không hiểu rõ hệ thống của Đức. Câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u04l5-mcq-lesen-sicher
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-je-desto
    prompt:
      stem: "Mai, 22, kommt aus Vietnam und macht in München eine Ausbildung zur Hotelfachfrau. Sie sagt: Ich wünschte, meine Eltern würden das deutsche System besser kennen. Für sie zählt nur die Universität. Aber je länger ich hier arbeite, desto sicherer bin ich, dass die Ausbildung die richtige Wahl für mich ist. — Richtig oder falsch? Mai ist sich immer sicherer, dass die Ausbildung gut für sie ist."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "je länger ich hier arbeite, desto sicherer bin ich = tôi làm ở đây càng lâu thì càng chắc chắn rằng học nghề là lựa chọn đúng. Câu này đúng."
    display_answer: Richtig

  # ---------------- recognition: nghe ----------------
  - key: de:exercise:b1u04l5-listen-waehlen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u04-g-irreale-bedingung
    prompt:
      audio_asset_id: null
      fallback_text: Wenn ich noch einmal wählen könnte, würde ich zuerst eine Ausbildung machen und dann studieren.
      options:
        - { id: h2a, text: "Nếu được chọn lại, tôi sẽ học nghề trước rồi mới học đại học.", lang: vi }
        - { id: h5b, text: "Nếu được chọn lại, tôi sẽ học đại học trước rồi mới học nghề.", lang: vi }
        - { id: h8c, text: "Tôi đã học nghề trước rồi mới học đại học.", lang: vi }
        - { id: h3d, text: "Nếu được chọn lại, tôi sẽ chỉ học nghề, không học đại học.", lang: vi }
    answer:
      correct_option_id: h2a
    explanation:
      vi: "könnte … würde: câu giả định (thực tế người nói không thể chọn lại). zuerst … und dann = trước … rồi sau đó: học nghề trước (eine Ausbildung machen), học đại học sau (studieren)."
    display_answer: Nếu được chọn lại, tôi sẽ học nghề trước rồi mới học đại học.

  - key: de:exercise:b1u04l5-listen-eltern
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u04-schulsystem
    prompt:
      audio_asset_id: null
      fallback_text: In Vietnam wünschen sich viele Eltern, dass ihre Kinder an die Universität gehen. Eine Ausbildung finden sie weniger wichtig.
      options:
        - { id: e1a, text: "Ở Việt Nam, nhiều cha mẹ mong con vào đại học. Họ thấy học nghề ít quan trọng hơn.", lang: vi }
        - { id: e4b, text: "Ở Việt Nam, nhiều cha mẹ mong con đi học nghề. Họ thấy đại học ít quan trọng hơn.", lang: vi }
        - { id: e7c, text: "Ở Việt Nam, ít cha mẹ mong con vào đại học. Họ thấy học nghề quan trọng hơn.", lang: vi }
        - { id: e9d, text: "Ở Việt Nam, nhiều cha mẹ mong con vào đại học. Họ thấy học nghề cũng quan trọng như vậy.", lang: vi }
    answer:
      correct_option_id: e1a
    explanation:
      vi: "sich wünschen, dass … = mong rằng; an die Universität gehen = vào đại học. weniger wichtig = ít quan trọng hơn."
    display_answer: Ở Việt Nam, nhiều cha mẹ mong con vào đại học. Họ thấy học nghề ít quan trọng hơn.

  # ---------------- recall ----------------
  - key: de:exercise:b1u04l5-fill-waere-wuerde
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-konjunktiv-ii-formen
    prompt:
      template: "Wenn ich noch einmal achtzehn {{b1}} (sein), {{b2}} (werden) ich zuerst eine Ausbildung machen."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [wäre]
        b2: [würde]
    known_wrong:
      - answer: war
        feedback_vi: war là Präteritum. Giả định cần Konjunktiv II – wäre.
        error_tag: konjunktiv_form
      - answer: bin
        feedback_vi: Đây là điều không có thật (bạn không còn mười tám tuổi) nên cần wäre.
        error_tag: konjunktiv_form
      - answer: wurde
        feedback_vi: wurde là Präteritum. Konjunktiv II có umlaut – würde.
        error_tag: konjunktiv_form
      - answer: werde
        feedback_vi: Vế chính của câu điều kiện không thật cũng cần Konjunktiv II – würde.
        error_tag: konjunktiv_form
    explanation:
      vi: "Điều kiện không thật: sein → wäre (cuối vế wenn), werden → würde (đầu vế chính, ngay sau dấu phẩy), nguyên thể machen ở cuối câu."
    display_answer: "Wenn ich noch einmal achtzehn wäre, würde ich zuerst eine Ausbildung machen."

  - key: de:exercise:b1u04l5-fill-zum-schluss
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-relativ-wo-was
    prompt:
      template: "Zum {{b1}} möchte ich sagen: Das ist alles, {{b2}} ich über das Thema weiß. Vielen Dank fürs Zuhören!"
      blanks:
        - { id: b1, width_hint: 9 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [Schluss, Abschluss]
        b2: [was]
    known_wrong:
      - answer: das
        feedback_vi: Sau alles dùng was, không dùng das.
        error_tag: relative_pronoun
      - answer: Ende
        feedback_vi: Cụm cố định để kết bài là Zum Schluss (hoặc Zum Abschluss).
        error_tag: phrase
    explanation:
      vi: "Zum Schluss = cuối cùng, cụm mở đầu phần kết luận. Sau alles, đại từ quan hệ là was."
    display_answer: "Zum Schluss möchte ich sagen: Das ist alles, was ich über das Thema weiß. Vielen Dank fürs Zuhören!"

  - key: de:exercise:b1u04l5-tr-mehr-zeit-lernen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-irrealer-wunsch
    prompt:
      source_text: "Ước gì tôi có nhiều thời gian hơn để học. (dùng Ich wünschte, …)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich wünschte, ich hätte mehr Zeit zum Lernen.
        - Ich wünschte, ich hätte mehr Zeit, um zu lernen.
        - Ich wünschte, ich hätte mehr Zeit für das Lernen.
        - Ich wünschte, ich hätte mehr Zeit fürs Lernen.
        - Ich wünschte, ich hätte mehr Zeit zu lernen.
    known_wrong:
      - answer: Ich wünschte, ich hatte mehr Zeit zum Lernen.
        feedback_vi: hatte là Präteritum. Sau Ich wünschte, cần Konjunktiv II – hätte.
        error_tag: konjunktiv_form
      - answer: Ich wünschte, ich mehr Zeit zum Lernen hätte.
        feedback_vi: Sau Ich wünschte, là câu chính – hätte đứng ở vị trí 2, ngay sau ich.
        error_tag: verb_position
      - answer: Ich wünsche, ich hätte mehr Zeit zum Lernen.
        feedback_vi: Đề yêu cầu Ich wünschte (Konjunktiv II của wünschen) – Ich wünschte, ich hätte … (cũng gặp Ich wünsche mir, ich hätte …, nhưng cần có mir).
        error_tag: konjunktiv_form
    explanation:
      vi: "Ich wünschte, + câu chính có Konjunktiv II ở vị trí 2: ich hätte mehr Zeit. \"để học\" = zum Lernen (hoặc um zu lernen)."
