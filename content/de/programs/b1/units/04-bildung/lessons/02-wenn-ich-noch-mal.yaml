title:
  vi: Nếu tôi được học lại – câu điều kiện không thật (Wenn ich noch einmal studieren könnte, …)
objectives:
  - vi: Phân biệt điều kiện thật (Wenn ich Zeit habe, …) và điều kiện không thật (Wenn ich Zeit hätte, würde ich …).
  - vi: Dùng Konjunktiv II của động từ khiếm khuyết – könnte, müsste, dürfte, sollte – để giả định và hỏi lịch sự.
  - vi: Bàn về lựa chọn học đại học và nói điều mình sẽ làm nếu hoàn cảnh khác đi.
