  - key: de:exercise:b1u04l2-mcq-duerfte
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-hausarbeit
    prompt:
      stem: "Bạn muốn hỏi giáo sư thật lịch sự xem bạn có được nộp bài tiểu luận muộn một tuần không. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: d2k, text: "Dürfte ich die Hausarbeit eine Woche später abgeben?", lang: de }
        - { id: d5m, text: "Darfst du die Hausarbeit eine Woche später abgeben?", lang: de }
        - { id: d8p, text: "Ich gebe die Hausarbeit eine Woche später ab.", lang: de }
        - { id: d1r, text: "Musste ich die Hausarbeit eine Woche später abgeben?", lang: de }
    answer:
      correct_option_id: d2k
    explanation:
      vi: "Dürfte ich …? (Konjunktiv II của dürfen) là cách xin phép rất lịch sự. Darfst du …? hỏi người khác bằng du; câu thứ ba là thông báo chứ không phải xin phép; Musste là Präteritum của müssen (đã phải)."
    display_answer: Dürfte ich die Hausarbeit eine Woche später abgeben?

