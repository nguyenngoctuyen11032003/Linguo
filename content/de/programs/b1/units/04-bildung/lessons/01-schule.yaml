      vi: "anfangen đã đứng sẵn ở cuối, nên ô trống là würde (Konjunktiv II của werden) – sau wenn, würde đứng sau cùng. Ô thứ hai: sein ở Konjunktiv II, chủ ngữ số nhiều die Klassenarbeiten → wären."
    display_answer: "Wenn der Unterricht doch später anfangen würde! Ich wünschte, die Klassenarbeiten wären nicht so schwer."

