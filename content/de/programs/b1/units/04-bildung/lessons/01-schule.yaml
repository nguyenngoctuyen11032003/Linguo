title:
  vi: Ước gì… – Konjunktiv II hiện tại (Wenn ich doch mehr Zeit hätte!)
objectives:
  - vi: Nhận ra và dùng các dạng Konjunktiv II quan trọng nhất – wäre, hätte, würde + nguyên thể – và nhận biết käme, ginge, wüsste, gäbe, bräuchte.
  - vi: Nói điều ước không có thật bằng Wenn ich doch/nur …! và Ich wünschte, …
  - vi: Nói và đọc về hệ thống trường học, môn học, điểm số và học bạ.
