    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-konjunktiv-ii-formen
    prompt:
      stem: "Chọn dạng đúng để nói điều ước: Ich wünschte, ich ___ schon mit der Schule fertig."
      stem_lang: vi
      options:
        - { id: w7a, text: "wäre", lang: de }
        - { id: w2b, text: "war", lang: de }
        - { id: w5c, text: "bin", lang: de }
        - { id: w9d, text: "würde", lang: de }
    answer:
      correct_option_id: w7a
    explanation:
      vi: "Sau Ich wünschte, cần Konjunktiv II vì đó là điều chưa có thật: sein → ich wäre. war là Präteritum (quá khứ), bin là hiện tại; würde một mình không đủ vì thiếu nguyên thể ở cuối câu."
    display_answer: wäre

  - key: de:exercise:b1u04l1-mcq-wunsch-satz
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-irrealer-wunsch
    prompt:
      stem: "Câu nào là lời ước \"giá mà\" ở hiện tại?"
      stem_lang: vi
      options:
        - { id: s3k, text: "Wenn ich doch mehr Zeit hätte!", lang: de }
        - { id: s8m, text: "Wenn ich mehr Zeit hatte, las ich viel.", lang: de }
        - { id: s1p, text: "Wenn ich mehr Zeit habe, lese ich viel.", lang: de }
        - { id: s6r, text: "Ich hatte damals mehr Zeit.", lang: de }
    answer:
      correct_option_id: s3k
    explanation:
      vi: "Lời ước dùng wenn + doch và Konjunktiv II (hätte) ở cuối câu. Wenn ich mehr Zeit hatte, … kể thói quen trong quá khứ; Wenn ich mehr Zeit habe, … là điều kiện thật; câu cuối chỉ kể chuyện đã qua."
    display_answer: Wenn ich doch mehr Zeit hätte!

  - key: de:exercise:b1u04l1-mcq-wuesste
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-konjunktiv-ii-formen
    prompt:
      stem: "Chọn dạng Konjunktiv II của wissen để hỏi lịch sự: Ich ___ gern, wann das zweite Halbjahr beginnt."
      stem_lang: vi
      options:
        - { id: u4a, text: "wüsste", lang: de }
        - { id: u8b, text: "wusste", lang: de }
        - { id: u1c, text: "weiß", lang: de }
        - { id: u6d, text: "würde", lang: de }
    answer:
      correct_option_id: u4a
    explanation:
      vi: "wissen có dạng Konjunktiv II riêng: wusste (Präteritum) + umlaut → wüsste. Ich wüsste gern … là cách nói lịch sự \"tôi muốn biết …\". wusste là quá khứ, weiß gern không phải cách nói của tiếng Đức, còn würde thiếu nguyên thể."
    display_answer: wüsste

  - key: de:exercise:b1u04l1-mcq-lesen-mathe
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-note
    prompt:
      stem: "Lena ist 15 und geht auf eine Realschule. Ihr Lieblingsfach ist Biologie, aber in Mathe hat sie im Zeugnis eine Fünf. Sie sagt: Wenn ich doch nur ein bisschen besser in Mathe wäre! Jetzt bekommt sie zweimal pro Woche Nachhilfe. Außerdem sagt sie: Ich wünschte, der Unterricht würde nicht schon um halb acht anfangen. — Richtig oder falsch? Lena ist gut in Mathe."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Ở Đức, điểm 5 (eine Fünf) là điểm kém. Câu Wenn ich doch nur besser in Mathe wäre! là lời ước, nghĩa là thực tế Lena học toán không giỏi. Vì vậy câu này sai."
    display_answer: Falsch

  # ---------------- recall ----------------
  - key: de:exercise:b1u04l1-fill-haette-waere
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-irrealer-wunsch
    prompt:
      template: "Wenn ich doch mehr Zeit {{b1}} (haben)! Ich wünschte, ich {{b2}} (sein) nicht immer so müde."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 5 }
    answer:
      blanks:
        b1: [hätte]
        b2: [wäre]
    known_wrong:
      - answer: hatte
        feedback_vi: hatte là Präteritum (quá khứ). Lời ước ở hiện tại cần Konjunktiv II có umlaut – hätte.
        error_tag: konjunktiv_form
      - answer: habe
        feedback_vi: Đây là lời ước không có thật nên cần Konjunktiv II – hätte.
        error_tag: konjunktiv_form
      - answer: war
        feedback_vi: war là Präteritum. Sau Ich wünschte, dùng Konjunktiv II – ich wäre.
        error_tag: konjunktiv_form
      - answer: bin
        feedback_vi: Sau Ich wünschte, dùng Konjunktiv II vì điều đó chưa có thật – ich wäre.
        error_tag: konjunktiv_form
    explanation:
      vi: "Cả hai câu đều là lời ước trái với thực tế nên dùng Konjunktiv II: haben → hätte, sein → wäre. Câu đầu có wenn nên hätte đứng cuối; sau Ich wünschte, là câu chính nên wäre ở vị trí 2."
    display_answer: "Wenn ich doch mehr Zeit hätte! Ich wünschte, ich wäre nicht immer so müde."

  - key: de:exercise:b1u04l1-fill-wuerde-waeren
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-konjunktiv-ii-formen
    prompt:
      template: "Wenn der Unterricht doch später anfangen {{b1}} (werden)! Ich wünschte, die Klassenarbeiten {{b2}} (sein) nicht so schwer."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [würde]
        b2: [wären]
    known_wrong:
      - answer: wird
        feedback_vi: wird là hiện tại. Lời ước cần Konjunktiv II của werden – würde.
        error_tag: konjunktiv_form
      - answer: wurde
        feedback_vi: wurde là Präteritum. Konjunktiv II có umlaut – würde.
        error_tag: konjunktiv_form
      - answer: waren
        feedback_vi: waren là Präteritum. Điều ước cần Konjunktiv II – wären.
        error_tag: konjunktiv_form
      - answer: wäre
        feedback_vi: Chủ ngữ die Klassenarbeiten là số nhiều nên cần đuôi -n – wären.
        error_tag: verb_form
