body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được về trường học và ước những điều không có thật, ví dụ: \"Wenn ich doch bessere Noten hätte! Ich wünschte, der Unterricht würde später anfangen.\""
  - type: explain
    text:
      vi: "Konjunktiv II là dạng động từ dùng cho điều không có thật, điều ước và lời nói lịch sự. Ba dạng quan trọng nhất là wäre (từ sein), hätte (từ haben) và würde (từ werden): ich wäre, du wärst, wir wären; ich hätte, du hättest, wir hätten; ich würde, du würdest, wir würden. Tiếng Việt chỉ thêm \"giá mà\", \"ước gì\", còn tiếng Đức phải đổi dạng động từ."
  - type: explain
    text:
      vi: "Với phần lớn động từ khác, bạn dùng würde (chia theo ngôi) ở vị trí 2 và nguyên thể ở cuối câu, giống khung câu của Perfekt: Ich würde gern Medizin studieren. Bạn đã gặp mẫu này ở A2: An deiner Stelle würde ich …, Würden Sie bitte …?"
  - type: explain
    text:
      vi: "Một số động từ mạnh có dạng Konjunktiv II riêng, đi từ dạng Präteritum, thêm umlaut nếu được và thêm -e: kam → käme, ging → ginge, gab → gäbe, wusste → wüsste; brauchen → bräuchte. Ở bài này bạn chỉ cần nhận ra chúng khi đọc; khi nói, würde kommen, würde gehen là đủ. Riêng es gäbe và ich wüsste rất hay gặp cả khi nói."
  - type: explain
    text:
      vi: "Để ước điều trái với thực tế, bạn nói Wenn ich doch … hätte! hoặc Wenn ich nur … wäre!: wenn đẩy động từ xuống cuối câu, doch/nur biến câu thành lời ước. Cách thứ hai là Ich wünschte, + câu chính có Konjunktiv II ở vị trí 2: Ich wünschte, ich hätte mehr Zeit. Cả hai cách đều ngầm nói thực tế ngược lại: tôi không có thời gian."
  - type: explain
    text:
      vi: "Đừng dùng Präteritum để ước: Wenn ich Zeit hatte nghĩa là \"(những) khi tôi có thời gian\" trong quá khứ. Dấu umlaut tạo ra khác biệt: hatte – hätte, war – wäre, wusste – wüsste."
  - type: deep_explain
    text:
      vi: "Hệ thống trường học Đức: trẻ học tiểu học (Grundschule) thường 4 năm (ở Berlin và Brandenburg là 6 năm), rồi học tiếp Gymnasium, Realschule, Hauptschule hoặc Gesamtschule; tên và hình thức các loại trường khác nhau theo bang. Thang điểm phổ thông ở Đức từ 1 (sehr gut) đến 6 (ungenügend); Áo dùng 1–5, còn Thụy Sĩ ngược lại, 6 là điểm tốt nhất – rất dễ nhầm khi đọc học bạ. Học sinh có điểm kém ở nhiều môn có thể bị sitzenbleiben (lưu ban). Về ngữ pháp, câu ước còn có dạng bỏ wenn, đưa động từ lên đầu: Hätte ich doch mehr Zeit! Wäre ich doch schon fertig! – nghĩa giống Wenn ich doch … hätte!. Chia đủ các ngôi: du wärst, ihr wärt; du hättest, ihr hättet; du würdest, ihr würdet. Các dạng riêng như käme, ginge nghe khá trang trọng; trong văn nói người ta thường dùng würde + nguyên thể, trừ với sein, haben và động từ khiếm khuyết."
  - type: example
    target: Wenn ich doch nur bessere Noten hätte!
    target_lang: de
    translation:
      vi: Giá mà tôi được điểm tốt hơn!
    note:
      vi: "wenn + doch nur: lời ước. hätte (Konjunktiv II của haben) đứng cuối câu; thực tế là điểm của tôi không tốt."
  - type: example
    target: Ich wünschte, der Unterricht würde später anfangen.
    target_lang: de
    translation:
      vi: Ước gì giờ học bắt đầu muộn hơn.
    note:
      vi: "Sau Ich wünschte, là một câu chính: würde ở vị trí 2, nguyên thể anfangen ở cuối."
  - type: example
    target: Wenn es doch keine Klassenarbeiten gäbe!
    target_lang: de
    translation:
      vi: Giá mà không có bài kiểm tra nào!
    note:
      vi: "gäbe là Konjunktiv II của es gibt (Präteritum: es gab). Dạng này rất hay gặp."
  - type: example
    target: Wie war dein Zeugnis? – Nicht so gut. Ich wünschte, ich wäre besser in Mathe.
    target_lang: de
    translation:
      vi: Học bạ của cậu thế nào? – Không tốt lắm. Ước gì mình học toán giỏi hơn.
    note:
      vi: "Hai bạn học nói chuyện nên dùng du. war là Präteritum (học bạ đã nhận rồi), wäre là Konjunktiv II (điều ước)."
  - type: example
    target: Ich wüsste gern, wie das Schulsystem in Österreich funktioniert.
    target_lang: de
    translation:
      vi: Tôi rất muốn biết hệ thống trường học ở Áo vận hành thế nào.
    note:
      vi: "Ich wüsste gern … là cách nói lịch sự \"tôi muốn biết\"; wüsste là Konjunktiv II của wissen."
  - type: common_mistake
    wrong: Wenn ich würde mehr Zeit haben!
    right: Wenn ich doch mehr Zeit hätte!
    target_lang: de
    note:
      vi: "Sau wenn, động từ chia phải đứng cuối câu; với haben, dùng luôn hätte thay vì würde … haben."
  - type: common_mistake
    wrong: Wenn ich doch mehr Zeit hatte!
    right: Wenn ich doch mehr Zeit hätte!
    target_lang: de
    note:
      vi: "hatte là Präteritum (quá khứ). Lời ước ở hiện tại cần Konjunktiv II có umlaut: hätte."
  - type: common_mistake
    wrong: Ich wünschte, ich bin schon mit der Schule fertig.
    right: Ich wünschte, ich wäre schon mit der Schule fertig.
    target_lang: de
    note:
      vi: "Sau Ich wünschte, động từ cũng phải ở Konjunktiv II (wäre), vì đó là điều chưa có thật."
  - type: common_mistake
    wrong: Ich würde gern studieren Medizin.
    right: Ich würde gern Medizin studieren.
    target_lang: de
    note:
      vi: "würde tạo khung câu như modal: würde ở vị trí 2, nguyên thể studieren đứng cuối câu."
  - type: summary
    points:
      - vi: "sein → wäre, haben → hätte, werden → würde (ich wäre, du wärst; ich hätte, du hättest; ich würde, du würdest)."
      - vi: "Động từ khác: würde (vị trí 2) + nguyên thể (cuối câu): Ich würde gern lernen."
      - vi: "Nhận biết: käme, ginge, gäbe, wüsste, bräuchte (es gäbe, ich wüsste gern …)."
      - vi: "Lời ước: Wenn ich doch/nur … hätte/wäre! (động từ cuối) – Ich wünschte, ich hätte/wäre …"
      - vi: "Präteritum hatte/war/wusste ≠ Konjunktiv II hätte/wäre/wüsste (có umlaut)."
      - vi: "Từ vựng: das Schulsystem, das Fach, die Note, das Zeugnis, die Klasse, der Unterricht, sitzenbleiben, die Schulpflicht, die Realschule."
