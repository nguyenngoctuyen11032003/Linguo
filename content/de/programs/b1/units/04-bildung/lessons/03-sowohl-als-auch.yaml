body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được về cách mình học ngoại ngữ và nối ý mạch lạc, ví dụ: \"Ich lerne sowohl mit Karteikarten als auch mit einer App. Je mehr ich übe, desto besser spreche ich.\""
  - type: explain
    text:
      vi: "sowohl A als auch B = cả A lẫn B; nicht nur A, sondern auch B = không chỉ A mà còn B (nhấn mạnh B hơn). Bạn đã gặp sondern ở A2 (nicht …, sondern …); ở đây sondern đi cùng auch. Đừng dùng aber thay cho sondern sau nicht nur."
  - type: explain
    text:
      vi: "weder A noch B = không A cũng không B: Ich spreche weder Französisch noch Spanisch. weder … noch đã mang nghĩa phủ định, nên không thêm nicht hay kein. Tiếng Việt có thể nói \"không … cũng không …\", nhưng tiếng Đức chỉ có một lần phủ định."
  - type: explain
    text:
      vi: "entweder A oder B = hoặc A hoặc B (chỉ chọn một). zwar … aber = tuy … nhưng: Die Methode ist zwar langsam, aber sie funktioniert. Trong vế đầu, zwar thường đứng sau động từ; aber và oder thường đứng đầu vế sau mà không làm đổi trật tự từ (aber cũng có thể đứng sau động từ: …, funktioniert aber)."
  - type: explain
    text:
      vi: "je … desto (hoặc umso) = càng … càng. Vế je là câu phụ: je + so sánh hơn, động từ ở cuối. Vế sau: desto + so sánh hơn, rồi động từ, rồi chủ ngữ – Je mehr ich lese, desto größer wird mein Wortschatz."
  - type: explain
    text:
      vi: "Nhớ lại dạng so sánh hơn (A1): thêm -er (schnell → schneller), nhiều tính từ ngắn có umlaut (groß → größer, oft → öfter), và vài dạng bất quy tắc: viel → mehr, gut → besser, gern → lieber."
  - type: deep_explain
    text:
      vi: "Khi sowohl … als auch nối hai chủ ngữ, động từ thường chia số nhiều: Sowohl mein Bruder als auch meine Schwester lernen Deutsch. Với weder … noch, nếu cả hai chủ ngữ đều số ít, động từ thường chia số ít (Weder Anna noch Paul kommt heute), dù số nhiều cũng gặp. entweder có thể đứng ở vị trí 0 (Entweder ich lerne jetzt, oder …) hoặc vị trí 1 (Entweder lerne ich jetzt, oder …); cả hai đều đúng. zwar cũng có thể đứng đầu câu: Zwar ist die Methode langsam, aber sie funktioniert. Về cách học: lặp lại theo khoảng cách tăng dần (hôm nay, ngày mai, tuần sau) giúp Gedächtnis giữ từ lâu hơn học dồn một lần; học từ trong câu cũng dễ nhớ hơn học từ đơn lẻ auswendig."
  - type: example
    target: Ich lerne sowohl mit Karteikarten als auch mit einer App.
    target_lang: de
    translation:
      vi: Tôi học cả bằng thẻ lẫn bằng ứng dụng.
    note:
      vi: "sowohl … als auch nối hai cụm cùng loại (mit Karteikarten / mit einer App); câu không đổi trật tự."
  - type: example
    target: Ich habe weder Zeit noch Lust, heute Vokabeln zu lernen.
    target_lang: de
    translation:
      vi: Hôm nay tôi không có thời gian mà cũng chẳng có hứng học từ vựng.
    note:
      vi: "weder … noch đã là phủ định: không cần thêm keine trước Zeit."
  - type: example
    target: Entweder lernst du jeden Tag ein bisschen, oder du vergisst alles wieder.
    target_lang: de
    translation:
      vi: Hoặc là bạn học mỗi ngày một chút, hoặc là bạn sẽ quên hết.
    note:
      vi: "entweder đứng ở vị trí 1 nên động từ lernst theo ngay sau; oder đứng ở vị trí 0, vế sau giữ trật tự bình thường (du vergisst)."
  - type: example
    target: Beim Lernen ist nicht nur die Grammatik wichtig, sondern auch der Wortschatz.
    target_lang: de
    translation:
      vi: Khi học, không chỉ ngữ pháp quan trọng mà từ vựng cũng vậy.
    note:
      vi: "nicht nur …, sondern auch …: không dùng aber ở đây. Có dấu phẩy trước sondern."
  - type: example
    target: Je öfter du mit Muttersprachlern sprichst, desto besser wird dein Deutsch.
    target_lang: de
    translation:
      vi: Bạn càng nói chuyện với người bản ngữ thường xuyên thì tiếng Đức của bạn càng tốt.
    note:
      vi: "Vế je: động từ sprichst ở cuối. Vế desto: desto besser + động từ wird + chủ ngữ dein Deutsch. oft → öfter, gut → besser."
  - type: common_mistake
    wrong: Ich habe weder Zeit noch kein Geld.
    right: Ich habe weder Zeit noch Geld.
    target_lang: de
    note:
      vi: "weder … noch đã là phủ định; thêm kein hay nicht thành phủ định kép, sai trong tiếng Đức."
  - type: common_mistake
    wrong: Je mehr ich übe, desto ich spreche besser.
    right: Je mehr ich übe, desto besser spreche ich.
    target_lang: de
    note:
      vi: "So sánh hơn phải đứng ngay sau desto, rồi đến động từ, rồi chủ ngữ."
  - type: common_mistake
    wrong: Je ich mehr übe, desto besser spreche ich.
    right: Je mehr ich übe, desto besser spreche ich.
    target_lang: de
    note:
      vi: "je và so sánh hơn đi liền nhau (je mehr), chủ ngữ đứng sau; động từ của vế je ở cuối."
  - type: common_mistake
    wrong: Er lernt nicht nur Vokabeln, aber auch Grammatik.
    right: Er lernt nicht nur Vokabeln, sondern auch Grammatik.
    target_lang: de
    note:
      vi: "Cặp cố định là nicht nur … sondern auch; aber không đi với nicht nur."
  - type: summary
    points:
      - vi: "sowohl … als auch = cả … lẫn; nicht nur … sondern auch = không chỉ … mà còn."
      - vi: "weder … noch = không … cũng không (không thêm nicht/kein)."
      - vi: "entweder … oder = hoặc … hoặc; zwar … aber = tuy … nhưng."
      - vi: "je + so sánh hơn … (động từ cuối), desto/umso + so sánh hơn + động từ + chủ ngữ."
      - vi: "So sánh hơn: mehr, besser, lieber, öfter, größer, schneller."
      - vi: "Từ vựng: die Methode, die Motivation, sich konzentrieren, das Gedächtnis, auswendig, der Fortschritt, die Grammatik, der Wortschatz, die Fremdsprache."
