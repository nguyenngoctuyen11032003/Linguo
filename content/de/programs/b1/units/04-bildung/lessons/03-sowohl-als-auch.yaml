title:
  vi: Vừa… vừa…, càng… càng… (Sowohl … als auch; je … desto)
objectives:
  - vi: Nối hai ý bằng liên từ hai vế – sowohl … als auch, weder … noch, nicht nur … sondern auch, entweder … oder, zwar … aber.
  - vi: "Nói \"càng … càng …\" bằng je … desto/umso với đúng trật tự từ ở cả hai vế."
  - vi: Nói về cách học ngoại ngữ, so sánh các phương pháp và liên kết ý rõ ràng.
