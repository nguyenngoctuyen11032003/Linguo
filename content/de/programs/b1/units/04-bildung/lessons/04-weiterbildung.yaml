body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nghe hiểu được buổi tư vấn chọn khoá học và hỏi được điều kiện tham gia, ví dụ: \"Was brauche ich für die Teilnahme? – Sie brauchen nur das Formular auszufüllen. Das ist alles, was Sie brauchen.\""
  - type: explain
    text:
      vi: "Sau alles, nichts, etwas, vieles và sau so sánh nhất dùng như danh từ (das Beste, das Einzige), đại từ quan hệ là was chứ không phải das: Das ist alles, was ich weiß. Tiếng Việt nói \"tất cả những gì\", tiếng Đức nói alles, was. Động từ trong mệnh đề quan hệ vẫn đứng cuối."
  - type: explain
    text:
      vi: "Sau tên địa danh hoặc danh từ chỉ nơi chốn, bạn có thể dùng wo thay cho giới từ + đại từ quan hệ: die Stadt, wo ich studiere = die Stadt, in der ich studiere. Cách này giống \"nơi mà\" trong tiếng Việt."
  - type: explain
    text:
      vi: "nicht brauchen + zu + nguyên thể = không cần làm gì, nghĩa giống nicht müssen (bạn đã học ở A2): Sie brauchen nicht zu kommen = Sie müssen nicht kommen. Cũng dùng với kein, nichts: Sie brauchen keine Vorkenntnisse zu haben."
  - type: explain
    text:
      vi: "nur brauchen + zu + nguyên thể = chỉ cần làm gì: Sie brauchen nur anzurufen. zu đứng ngay trước nguyên thể ở cuối câu; với động từ tách, zu chen vào giữa: anzurufen, mitzubringen, auszufüllen."
  - type: explain
    text:
      vi: "Không nhầm với nicht dürfen (không được phép): Sie brauchen nicht zu kommen (không cần đến) khác hẳn Sie dürfen nicht kommen (không được đến). Khi muốn nói \"phải\", dùng müssen; brauchen … zu chỉ đi với nicht, kein, nichts, nur."
  - type: deep_explain
    text:
      vi: "was còn dùng để chỉ cả một câu đứng trước: Ich habe die Prüfung bestanden, was mich sehr freut (điều đó làm tôi rất vui). Sau etwas, cả was lẫn das đều gặp (etwas, was/das mir gefällt); sau alles và nichts, chỉ dùng was. wo sau danh từ chỉ thời gian (in der Zeit, wo …) hay gặp trong văn nói, nhưng khi viết nên dùng in der hoặc als. Khi nói nhanh, người Đức thường bỏ zu sau brauchen (Du brauchst nicht kommen) – bạn nên hiểu được, nhưng khi viết, nhất là trong kỳ thi, hãy giữ zu. Về học tiếp ở Đức: Volkshochschule (VHS) có ở hầu hết các thành phố, mở khoá ngoại ngữ, tin học, nấu ăn… với giá phải chăng; nhiều khoá Weiterbildung được tổ chức berufsbegleitend (buổi tối, cuối tuần). Ở nhiều bang, người lao động có quyền nghỉ vài ngày mỗi năm để học (Bildungsurlaub); quy định khác nhau theo bang và có thể thay đổi."
  - type: example
    target: Das ist alles, was Sie für die Anmeldung brauchen.
    target_lang: de
    translation:
      vi: Đó là tất cả những gì ông/bà cần để đăng ký.
    note:
      vi: "Nhân viên nói với khách nên dùng Sie. Sau alles dùng was; động từ brauchen đứng cuối mệnh đề quan hệ."
  - type: example
    target: Gibt es noch etwas, was Sie wissen möchten?
    target_lang: de
    translation:
      vi: Ông/bà còn muốn biết điều gì nữa không?
    note:
      vi: "Sau etwas dùng was (cũng gặp das). möchten là động từ chia, đứng cuối mệnh đề."
  - type: example
    target: In Leipzig, wo ich wohne, gibt es viele Abendkurse.
    target_lang: de
    translation:
      vi: Ở Leipzig, nơi tôi sống, có nhiều lớp học buổi tối.
    note:
      vi: "wo thay cho in dem sau tên thành phố. Mệnh đề quan hệ có dấu phẩy ở hai đầu, động từ wohne ở cuối."
  - type: example
    target: Der Lehrgang, den ich besuche, ist teuer, aber die Firma, bei der ich arbeite, bezahlt ihn.
    target_lang: de
    translation:
      vi: Khoá đào tạo tôi đang học thì đắt, nhưng công ty nơi tôi làm việc trả tiền cho nó.
    note:
      vi: "Ôn B1U02: sau danh từ thông thường vẫn dùng der/die/das – den (Akkusativ, der Lehrgang), bei der (giới từ + Dativ, die Firma). was chỉ dùng sau alles, nichts, etwas …"
  - type: example
    target: Teilnehmer, denen die Zeit fehlt, können den Kurs auch online machen.
    target_lang: de
    translation:
      vi: Học viên nào không có đủ thời gian có thể học khoá này trực tuyến.
    note:
      vi: "denen là đại từ quan hệ Dativ số nhiều (fehlen + Dativ: die Zeit fehlt den Teilnehmern)."
  - type: example
    target: Muss ich vorher einen Test machen? – Nein, Sie brauchen keinen Test zu machen.
    target_lang: de
    translation:
      vi: Tôi có phải làm bài kiểm tra trước không? – Không, ông/bà không cần làm bài kiểm tra.
    note:
      vi: "Câu hỏi với müssen, câu trả lời phủ định với brauchen … zu: keinen Test zu machen = nicht … müssen."
  - type: example
    target: Sie brauchen nur das Formular auszufüllen und die Gebühr zu bezahlen.
    target_lang: de
    translation:
      vi: Ông/bà chỉ cần điền mẫu đơn và trả lệ phí.
    note:
      vi: "nur brauchen … zu = chỉ cần. ausfüllen là động từ tách nên zu chen vào giữa: auszufüllen."
  - type: common_mistake
    wrong: Das ist alles, das ich weiß.
    right: Das ist alles, was ich weiß.
    target_lang: de
    note:
      vi: "Sau alles (và nichts, das Beste) đại từ quan hệ là was."
  - type: common_mistake
    wrong: Du brauchst nicht kommen.
    right: Du brauchst nicht zu kommen.
    target_lang: de
    note:
      vi: "Văn nói hay bỏ zu và vẫn hiểu được, nhưng dạng chuẩn (nhất là khi viết) có zu."
  - type: common_mistake
    wrong: Sie brauchen nur zu anrufen.
    right: Sie brauchen nur anzurufen.
    target_lang: de
    note:
      vi: "anrufen là động từ tách: zu chen vào giữa tiền tố và gốc – anzurufen."
  - type: common_mistake
    wrong: Du brauchst morgen zu kommen.
    right: Du musst morgen kommen.
    target_lang: de
    note:
      vi: "brauchen … zu chỉ dùng với nicht, kein, nichts, nur. Để nói \"phải\", dùng müssen."
  - type: summary
    points:
      - vi: "alles / nichts / etwas / das Beste, was …: Das ist alles, was ich weiß."
      - vi: "Nơi chốn: die Stadt, wo … (= in der …)."
      - vi: "nicht brauchen + zu + nguyên thể = không cần (= nicht müssen)."
      - vi: "nur brauchen + zu = chỉ cần; động từ tách: anzurufen, auszufüllen, mitzubringen."
      - vi: "nicht brauchen zu (không cần) ≠ nicht dürfen (không được phép)."
      - vi: "Từ vựng: die Weiterbildung, die Volkshochschule, teilnehmen an, die Teilnahme, das Zertifikat, berufsbegleitend, der Lehrgang."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:b1u04l4-listen-anmeldung
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u04-g-relativ-wo-was
    prompt:
      audio_asset_id: null
      fallback_text: Das ist alles, was Sie für die Anmeldung brauchen. Bringen Sie bitte Ihren Ausweis und ein Foto mit.
      options:
        - { id: a3k, text: "Đó là tất cả những gì ông/bà cần để đăng ký. Xin mang theo giấy tờ tùy thân và một tấm ảnh.", lang: vi }
        - { id: a6m, text: "Ông/bà không cần gì để đăng ký. Không cần mang giấy tờ tùy thân hay ảnh.", lang: vi }
        - { id: a1p, text: "Đó là tất cả những gì ông/bà cần để đăng ký. Xin mang theo giấy tờ tùy thân và hai tấm ảnh.", lang: vi }
        - { id: a8r, text: "Đó chưa phải là tất cả. Ông/bà còn cần một chứng chỉ và một tấm ảnh.", lang: vi }
    answer:
      correct_option_id: a3k
    explanation:
      vi: "alles, was Sie … brauchen = tất cả những gì ông/bà cần. Bringen Sie … mit = hãy mang theo; ein Foto = một tấm ảnh, der Ausweis = giấy tờ tùy thân."
    display_answer: Đó là tất cả những gì ông/bà cần để đăng ký. Xin mang theo giấy tờ tùy thân và một tấm ảnh.

  - key: de:exercise:b1u04l4-listen-vorkenntnisse
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u04-g-brauchen-zu
    prompt:
      audio_asset_id: null
      fallback_text: Sie brauchen keine Vorkenntnisse zu haben. Der Kurs ist für Anfänger.
      options:
        - { id: v2a, text: "Ông/bà không cần biết gì trước. Khoá học dành cho người mới bắt đầu.", lang: vi }
        - { id: v5b, text: "Ông/bà không được có kiến thức trước. Khoá học dành cho người mới bắt đầu.", lang: vi }
        - { id: v8c, text: "Ông/bà cần có kiến thức trước. Khoá học dành cho người đã biết.", lang: vi }
        - { id: v4d, text: "Ông/bà chỉ cần biết một chút. Khoá học dành cho người mới bắt đầu.", lang: vi }
    answer:
      correct_option_id: v2a
    explanation:
      vi: "keine … zu haben brauchen = không cần có (nghĩa như nicht müssen), không phải \"không được phép\" (nicht dürfen). für Anfänger = cho người mới bắt đầu."
    display_answer: Ông/bà không cần biết gì trước. Khoá học dành cho người mới bắt đầu.

  - key: de:exercise:b1u04l4-listen-lehrgang
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u04-berufsbegleitend
    prompt:
      audio_asset_id: null
      fallback_text: Der Lehrgang ist berufsbegleitend. Er findet dienstags und donnerstags am Abend statt und dauert ein Jahr.
      options:
        - { id: g3a, text: "Khoá đào tạo dành cho người đi làm, học tối thứ Ba và thứ Năm, kéo dài một năm.", lang: vi }
        - { id: g6b, text: "Khoá đào tạo học toàn thời gian, từ thứ Ba đến thứ Năm, kéo dài một năm.", lang: vi }
        - { id: g9c, text: "Khoá đào tạo dành cho người đi làm, học tối thứ Hai và thứ Tư, kéo dài một năm.", lang: vi }
        - { id: g1d, text: "Khoá đào tạo dành cho người đi làm, học tối thứ Ba và thứ Năm, kéo dài nửa năm.", lang: vi }
    answer:
