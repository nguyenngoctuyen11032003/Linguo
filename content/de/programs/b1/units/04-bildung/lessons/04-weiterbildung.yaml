    explanation:
      vi: "berufsbegleitend = song song với công việc. dienstags und donnerstags am Abend = các tối thứ Ba và thứ Năm; dauert ein Jahr = kéo dài một năm."
    display_answer: Khoá đào tạo dành cho người đi làm, học tối thứ Ba và thứ Năm, kéo dài một năm.

  - key: de:exercise:b1u04l4-mcq-alles-was
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u04-g-relativ-wo-was
    prompt:
      stem: "Chọn từ đúng: Das ist alles, ___ ich über den Kurs weiß."
      stem_lang: vi
      options:
        - { id: x4a, text: "was", lang: de }
        - { id: x7b, text: "das", lang: de }
        - { id: x2c, text: "wo", lang: de }
        - { id: x9d, text: "den", lang: de }
    answer:
      correct_option_id: x4a
    explanation:
      vi: "Sau alles, đại từ quan hệ là was (tất cả những gì). das dùng sau danh từ giống trung cụ thể (das Buch, das …); wo chỉ nơi chốn; den là giống đực."
    display_answer: was

  # ---------------- recall ----------------
  - key: de:exercise:b1u04l4-fill-was-wo
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-relativ-wo-was
    prompt:
      template: "Es gibt nichts, {{b1}} mich mehr interessiert als Sprachen. Heidelberg ist die Stadt, {{b2}} ich meinen ersten Deutschkurs gemacht habe."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [was]
        b2: [wo, in der]
    known_wrong:
      - answer: das
        feedback_vi: Sau nichts (cũng như alles) dùng was, không dùng das.
        error_tag: relative_pronoun
      - answer: die
        feedback_vi: "Ở đây cần nghĩa \"nơi mà\" – wo (hoặc in der), vì ich habe … in der Stadt gemacht."
        error_tag: relative_pronoun
      - answer: wohin
        feedback_vi: Trong mệnh đề không có chuyển động đến đâu, chỉ là nơi chốn – wo.
        error_tag: relative_pronoun
    explanation:
      vi: "Sau nichts, đại từ quan hệ là was. Sau danh từ chỉ nơi chốn (die Stadt), dùng wo hoặc giới từ + đại từ quan hệ: in der."
    display_answer: "Es gibt nichts, was mich mehr interessiert als Sprachen. Heidelberg ist die Stadt, wo ich meinen ersten Deutschkurs gemacht habe."

  - key: de:exercise:b1u04l4-fill-zu-anzumelden
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-brauchen-zu
    prompt:
      template: "Sie brauchen keine Vorkenntnisse {{b1}} haben. Sie brauchen sich nur online {{b2}} (anmelden)."
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 11 }
    answer:
      blanks:
        b1: [zu]
        b2: [anzumelden]
    known_wrong:
      - answer: zu anmelden
        feedback_vi: anmelden là động từ tách nên zu chen vào giữa – anzumelden.
        error_tag: zu_infinitive
      - answer: anmelden
        feedback_vi: Sau nur brauchen, nguyên thể cần có zu; với động từ tách viết liền – anzumelden.
        error_tag: zu_infinitive
      - answer: anmeldet
        feedback_vi: Sau brauchen … zu cần nguyên thể có zu – anzumelden.
        error_tag: zu_infinitive
    explanation:
      vi: "nicht/kein … brauchen + zu + nguyên thể = không cần; nur brauchen + zu = chỉ cần. Với động từ tách anmelden, zu đứng giữa tiền tố và gốc: anzumelden."
    display_answer: "Sie brauchen keine Vorkenntnisse zu haben. Sie brauchen sich nur online anzumelden."

  - key: de:exercise:b1u04l4-tr-nichts-mitbringen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-brauchen-zu
    prompt:
      source_text: "Bạn không cần mang theo gì cả. (nói với bạn bè; dùng brauchen)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Du brauchst nichts mitzubringen.
        - Du brauchst gar nichts mitzubringen.
        - Du brauchst nichts mitzunehmen.
        - Du brauchst gar nichts mitzunehmen.
    known_wrong:
      - answer: Du brauchst nichts mitbringen.
        feedback_vi: Khi viết, giữ zu sau brauchen; với động từ tách, zu chen vào giữa – mitzubringen.
        error_tag: zu_infinitive
      - answer: Du brauchst nichts zu mitbringen.
        feedback_vi: "mitbringen là động từ tách: zu đứng giữa – mitzubringen."
        error_tag: zu_infinitive
      - answer: Sie brauchen nichts mitzubringen.
        feedback_vi: Đề bài là nói với bạn bè nên dùng du – Du brauchst …
        error_tag: register_du_sie
    explanation:
      vi: "nichts brauchen + zu = không cần gì. mitbringen (mang theo) là động từ tách, nên dạng có zu là mitzubringen, đứng cuối câu."
    display_answer: Du brauchst nichts mitzubringen.

  # ---------------- application ----------------
  - key: de:exercise:b1u04l4-wb-formular
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-brauchen-zu
    prompt:
      instruction: "Sắp xếp thành câu: \"Ông/bà chỉ cần điền mẫu đơn.\""
      tokens:
        - { id: f-formular, text: Formular }
        - { id: f-nur, text: nur }
        - { id: f-sie, text: Sie }
        - { id: f-aus, text: auszufüllen }
        - { id: f-brauchen, text: brauchen }
        - { id: f-das, text: das }
    answer:
      orders:
        - [f-sie, f-brauchen, f-nur, f-das, f-formular, f-aus]
        - [f-das, f-formular, f-brauchen, f-sie, f-nur, f-aus]
    explanation:
      vi: "brauchen ở vị trí 2, nur trước tân ngữ das Formular, nguyên thể có zu (auszufüllen – zu chen giữa động từ tách) đứng cuối câu. Cũng có thể đưa das Formular lên đầu câu để nhấn mạnh: Das Formular brauchen Sie nur auszufüllen."
    display_answer: Sie brauchen nur das Formular auszufüllen.

  - key: de:exercise:b1u04l4-tr-alles-was
    type: translate
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u04-g-relativ-wo-was
    prompt:
      source_text: "Đó là tất cả những gì tôi biết về khoá học này."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
