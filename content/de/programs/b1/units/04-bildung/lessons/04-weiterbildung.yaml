title:
  vi: Học tiếp – quan hệ với wo/was, brauchen … zu (Alles, was ich brauche)
objectives:
  - vi: Nghe hiểu lời tư vấn về khoá học – thời gian, điều kiện, chi phí, chứng chỉ.
  - vi: Hỏi về điều kiện tham gia và hiểu câu trả lời với nicht/nur brauchen … zu.
  - vi: Dùng mệnh đề quan hệ với was (alles, was …; nichts, was …) và wo (die Stadt, wo …).
estimated_minutes: 20
skills: [listening, speaking, grammar]
prerequisites: [de:lesson:b1u04-sowohl-als-auch]
