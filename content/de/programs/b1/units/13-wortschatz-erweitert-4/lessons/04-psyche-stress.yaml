body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về trạng thái tinh thần của mình, cách giải tỏa căng thẳng và biết tìm sự giúp đỡ khi cần.
  - type: explain
    text:
      vi: "Từ về tâm lý: die Sorge (nỗi lo), die Depression, der Burnout, die Erschöpfung, die Überforderung (tình trạng quá tải), die Schlaflosigkeit, das Selbstvertrauen, das Wohlbefinden. Phần lớn là danh từ không đếm được nên dùng số ít. Từ Sorge dùng cả số nhiều: Ich mache mir Sorgen."
  - type: explain
    text:
      vi: "Cách đối phó: abschalten (thư giãn, thôi nghĩ về công việc), durchatmen (hít thở sâu), bewältigen (vượt qua, xử lý), verdrängen (đè nén, gạt đi), aufmuntern (làm vui lên), sich fürchten (sợ: vor + Dativ). Đừng nhầm überfordern (đòi hỏi quá sức) với verlangen."
  - type: explain
    text:
      vi: "Mô tả trạng thái: gestresst (bị căng thẳng), überfordert (bị quá tải), ausgeglichen (cân bằng, điềm tĩnh). Tìm trợ giúp: die Therapie, der Psychologe / die Psychologin, die Beratungsstelle, die Meditation. Ausgleich là sự bù đắp, thăng bằng: Sport ist ein guter Ausgleich zur Arbeit."
  - type: deep_explain
    text:
      vi: Burnout là từ mượn tiếng Anh, được đọc gần giống tiếng Anh, và là danh từ giống đực (der Burnout, ít khi dùng số nhiều). Selbstvertrauen là niềm tin vào bản thân; Selbstbewusstsein cũng gần nghĩa nhưng nhấn mạnh ý thức về giá trị bản thân. Ở Đức, bạn có thể tìm Beratungsstellen miễn phí hoặc giá thấp khi gặp vấn đề tâm lý hoặc gia đình.
  - type: example
    target: Der Psychologe hört seinen Patienten genau zu.
    target_lang: de
    translation:
      vi: Nhà tâm lý học lắng nghe bệnh nhân kỹ lưỡng.
    note:
      vi: der Psychologe = nhà tâm lý học.
  - type: example
    target: Ich mache mir Sorgen um meine Mutter.
    target_lang: de
    translation:
      vi: Tôi lo lắng cho mẹ tôi.
    note:
      vi: die Sorge = nỗi lo.
  - type: example
    target: Eine Depression ist eine ernste Krankheit.
    target_lang: de
    translation:
      vi: Trầm cảm là một căn bệnh nghiêm trọng.
    note:
      vi: die Depression = chứng trầm cảm.
  - type: example
    target: Zu viel Arbeit kann zu einem Burnout führen.
    target_lang: de
    translation:
      vi: Làm việc quá nhiều có thể dẫn đến kiệt sức.
    note:
      vi: der Burnout = hội chứng kiệt sức.
  - type: common_mistake
    wrong: Ich fürchte mich für Spinnen.
    right: Ich fürchte mich vor Spinnen.
    target_lang: de
    note:
      vi: Sich fürchten đi với vor + Dativ.
  - type: common_mistake
    wrong: Der Chef überfordert uns mit zu viel Aufgaben.
    right: Der Chef überfordert uns mit zu vielen Aufgaben.
    target_lang: de
    note:
      vi: "Mit + Dativ số nhiều: zu vielen Aufgaben."
  - type: summary
    points:
      - vi: "die Sorge, die Depression, der Burnout, die Erschöpfung, die Überforderung, die Schlaflosigkeit, das Selbstvertrauen, das Wohlbefinden."
      - vi: "die Therapie, die Beratungsstelle, der Psychologe, die Meditation, die Gelassenheit, der Ausgleich."
      - vi: "abschalten, durchatmen, bewältigen, verdrängen, aufmuntern, überfordern, sich fürchten (vor + Dativ); gestresst, überfordert, ausgeglichen."
exercises:
  - key: de:exercise:b1w4l4-listen-ueberfordern
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-ueberfordern
    prompt:
      audio_asset_id: null
      fallback_text: Die neue Aufgabe überfordert mich.
      options:
        - { id: bvx, text: Ở trung tâm tư vấn người ta được giúp đỡ miễn phí., lang: vi }
        - { id: klb, text: Các bậc cha mẹ thường cảm thấy quá tải., lang: vi }
        - { id: nrv, text: Nhiệm vụ mới làm tôi quá sức., lang: vi }
        - { id: i9e, text: Việc trị liệu kéo dài vài tháng., lang: vi }
    answer:
      correct_option_id: nrv
    explanation:
      vi: Câu bạn nghe có nghĩa "Nhiệm vụ mới làm tôi quá sức.". Từ khoá là überfordern (đòi hỏi quá sức); các câu còn lại nói về những từ khác trong bài.
    display_answer: Nhiệm vụ mới làm tôi quá sức.
  - key: de:exercise:b1w4l4-mcq-vi-de-verdraengen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b1w4-verdraengen
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "đè nén, gạt đi"?
      stem_lang: vi
      options:
        - { id: eq1, text: durchatmen, lang: de }
        - { id: a20, text: verdrängen, lang: de }
        - { id: yz1, text: sich fürchten, lang: de }
        - { id: p2f, text: abschalten, lang: de }
    answer:
      correct_option_id: a20
    explanation:
      vi: "verdrängen nghĩa là \"đè nén, gạt đi\". Ví dụ: Er hat den Streit lange verdrängt. (Anh ấy đã đè nén cuộc cãi vã lâu nay.)"
    display_answer: verdrängen
  - key: de:exercise:b1w4l4-mcq-de-vi-beratungsstelle
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-beratungsstelle
    prompt:
      stem: "\"die Beratungsstelle\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: w03, text: bị quá tải, lang: vi }
        - { id: e8d, text: trung tâm tư vấn, lang: vi }
        - { id: z0q, text: sợ (vor + Dativ), lang: vi }
        - { id: s48, text: "làm vui lên, động viên", lang: vi }
    answer:
      correct_option_id: e8d
    explanation:
      vi: "die Beratungsstelle nghĩa là \"trung tâm tư vấn\". Ví dụ: In der Beratungsstelle bekommt man kostenlose Hilfe. (Ở trung tâm tư vấn người ta được giúp đỡ miễn phí.)"
    display_answer: trung tâm tư vấn
  - key: de:exercise:b1w4l4-mcq-artikel-wohlbefinden
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-wohlbefinden
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Wohlbefinden\" (cảm giác khỏe khoắn, dễ chịu): ___ Wohlbefinden"
      stem_lang: vi
      options:
        - { id: ic6, text: der, lang: de }
        - { id: s49, text: das, lang: de }
        - { id: ot4, text: die, lang: de }
        - { id: u26, text: ein, lang: de }
