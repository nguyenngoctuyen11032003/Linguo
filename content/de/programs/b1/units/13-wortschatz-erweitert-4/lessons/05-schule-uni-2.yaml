      vi: "\"bỏ dở, dừng giữa chừng\" trong tiếng Đức là abbrechen. Ví dụ: Er hat sein Studium nach zwei Semestern abgebrochen."
    display_answer: abbrechen
  - key: de:exercise:b1w4l5-fill-plural-lernplattform
