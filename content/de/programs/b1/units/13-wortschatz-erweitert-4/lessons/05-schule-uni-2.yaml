      vi: "Gợi ý đáp án: Ich schreibe gerade meine Abschlussarbeit, und mein Betreuer hat mir gesagt, dass ich bald ein Referat halten muss. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Ich schreibe gerade meine Abschlussarbeit, und mein Betreuer hat mir gesagt, dass ich bald ein Referat halten muss.
    item: de:item:b1w4-referat
  - key: de:exercise:b1w4l5-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Weil sie sehr begabt ist, hat sie ihr Studium früher als geplant beendet und will jetzt promovieren.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Vì rất có năng khiếu, cô ấy kết thúc việc học sớm hơn dự định và giờ muốn làm tiến sĩ.
        - Do có năng khiếu, cô ấy đã học xong sớm hơn kế hoạch và bây giờ muốn lấy bằng tiến sĩ.
        - Vì cô ấy rất giỏi, cô đã hoàn thành chương trình sớm hơn dự kiến và bây giờ muốn bảo vệ luận án tiến sĩ.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Weil sie sehr begabt ist, hat sie ihr Studium früher als geplant beendet und will jetzt promovieren.\" nghĩa là: Vì rất có năng khiếu, cô ấy kết thúc việc học sớm hơn dự định và giờ muốn làm tiến sĩ. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Vì rất có năng khiếu, cô ấy kết thúc việc học sớm hơn dự định và giờ muốn làm tiến sĩ.
    item: de:item:b1w4-promovieren
