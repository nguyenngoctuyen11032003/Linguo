      vi: Câu bạn nghe có nghĩa "Anh ấy học thạc sĩ ngành tin học.". Từ khoá là der Master (bằng thạc sĩ; thạc sĩ); các câu còn lại nói về những từ khác trong bài.
    display_answer: Anh ấy học thạc sĩ ngành tin học.
  - key: de:exercise:b1w4l5-mcq-vi-de-doktorarbeit
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b1w4-doktorarbeit
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "luận án tiến sĩ"?
      stem_lang: vi
      options:
        - { id: xjg, text: die Doktorarbeit, lang: de }
        - { id: bna, text: der Betreuer, lang: de }
        - { id: lxi, text: die Lernplattform, lang: de }
        - { id: waa, text: das Unterrichtsfach, lang: de }
    answer:
      correct_option_id: xjg
    explanation:
      vi: "die Doktorarbeit nghĩa là \"luận án tiến sĩ\". Ví dụ: Für die Doktorarbeit braucht man oft mehrere Jahre. (Luận án tiến sĩ thường cần nhiều năm.)"
    display_answer: die Doktorarbeit
  - key: de:exercise:b1w4l5-mcq-de-vi-studienfach
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-studienfach
    prompt:
      stem: "\"das Studienfach\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: bmd, text: "người hướng dẫn, người phụ trách", lang: vi }
        - { id: es5, text: số buổi vắng mặt, lang: vi }
        - { id: vuw, text: "bằng miệng, vấn đáp", lang: vi }
        - { id: a33, text: ngành học, lang: vi }
    answer:
      correct_option_id: a33
    explanation:
      vi: "das Studienfach nghĩa là \"ngành học\". Ví dụ: Welches Studienfach hast du gewählt? (Bạn đã chọn ngành học nào?)"
    display_answer: ngành học
  - key: de:exercise:b1w4l5-mcq-artikel-fehlzeit
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-fehlzeit
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Fehlzeit\" (số buổi vắng mặt): ___ Fehlzeit"
      stem_lang: vi
      options:
        - { id: yum, text: die, lang: de }
        - { id: emo, text: ein, lang: de }
        - { id: c68, text: das, lang: de }
        - { id: vuy, text: der, lang: de }
    answer:
      correct_option_id: yum
    explanation:
      vi: "Fehlzeit là danh từ giống cái (die): die Fehlzeit; số nhiều: die Fehlzeiten. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: die
  - key: de:exercise:b1w4l5-tr-word-referat
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-referat
    prompt:
      source_text: bài thuyết trình, báo cáo (danh từ, viết cả mạo từ)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - das Referat
    known_wrong:
      - answer: der Referat
        feedback_vi: Referat là giống trung, nên là das Referat.
        error_tag: article
      - answer: die Referat
        feedback_vi: Referat là giống trung, nên là das Referat.
        error_tag: article
    explanation:
      vi: "\"bài thuyết trình, báo cáo\" trong tiếng Đức là das Referat (số nhiều: die Referate). Ví dụ: Ich muss nächste Woche ein Referat halten."
    display_answer: das Referat
  - key: de:exercise:b1w4l5-tr-word-abbrechen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-abbrechen
    prompt:
      source_text: bỏ dở, dừng giữa chừng (động từ, dạng nguyên thể)
