    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-master
    prompt:
      audio_asset_id: null
      fallback_text: Er hat seinen Master in Informatik gemacht.
      options:
        - { id: cw6, text: Trong khóa học này việc có mặt là bắt buộc., lang: vi }
        - { id: pd6, text: Anh ấy học thạc sĩ ngành tin học., lang: vi }
        - { id: h47, text: Sau cử nhân tôi muốn học tiếp thạc sĩ., lang: vi }
        - { id: i0e, text: Anh ấy đã bỏ dở việc học sau hai học kỳ., lang: vi }
    answer:
