    answer:
      accepted:
        - Ich schreibe gerade meine Abschlussarbeit, und mein Betreuer hat mir gesagt, dass ich bald ein Referat halten muss.
        - Gerade schreibe ich meine Abschlussarbeit, und mein Betreuer hat gesagt, dass ich bald ein Referat halten muss.
