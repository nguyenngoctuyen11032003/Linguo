      vi: "Số nhiều của die Lernplattform là die Lernplattformen (ký hiệu trong từ điển: -en). Mạo từ số nhiều luôn là die."
    display_answer: "Singular: die Lernplattform · Plural: die Lernplattformen"
  - key: de:exercise:b1w4l5-mcq-luecke-abschlusszeugnis
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-abschlusszeugnis
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Hồ sơ xin việc cần có bằng tốt nghiệp.\": Zur Bewerbung gehört das ___."
      stem_lang: vi
      options:
        - { id: z2g, text: Abschlusszeugnis, lang: de }
        - { id: g4y, text: Ausbildungsplatz, lang: de }
        - { id: lvs, text: Berufswahl, lang: de }
        - { id: hob, text: Studienfach, lang: de }
    answer:
      correct_option_id: z2g
    explanation:
      vi: "Câu có nghĩa \"Hồ sơ xin việc cần có bằng tốt nghiệp.\" nên cần Abschlusszeugnis (das Abschlusszeugnis: bằng, học bạ tốt nghiệp). Studienfach = ngành học; Berufswahl = việc chọn nghề; Ausbildungsplatz = chỗ học nghề không đúng nghĩa của câu."
    display_answer: Abschlusszeugnis
  - key: de:exercise:b1w4l5-tr-satz-vi-de-1
