body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về chương trình học, luận văn, bằng cấp và kế hoạch nghề nghiệp, và hiểu các thông báo thường gặp ở trường và đại học.
  - type: explain
    text:
      vi: "Bằng cấp và luận văn: das Abschlusszeugnis (bằng tốt nghiệp), der Bachelor, der Master, die Abschlussarbeit, die Doktorarbeit. Học thuật: das Referat (bài thuyết trình nghiên cứu), die Gruppenarbeit, der Betreuer (người hướng dẫn), die Lernplattform (nền tảng học trực tuyến). Số nhiều của Master là die Master (không đổi), của Bachelor là die Bachelor hoặc die Bachelors."
  - type: explain
    text:
      vi: "Về môn học và kế hoạch: das Studienfach, das Unterrichtsfach, der Lehrplan (chương trình giảng dạy), die Berufswahl (việc chọn nghề), der Ausbildungsplatz (chỗ học nghề). Về đi học: die Anwesenheit (sự có mặt), die Fehlzeit (số buổi vắng). Prüfungsangst (nỗi sợ thi cử) chỉ có số ít."
  - type: explain
    text:
      vi: "Động từ học tập: mitschreiben (ghi chép khi nghe giảng: schreibt mit, schrieb mit, hat mitgeschrieben), nachschlagen (tra cứu: schlägt nach, schlug nach, hat nachgeschlagen), vortragen (trình bày), abbrechen (bỏ dở: bricht ab, brach ab, hat abgebrochen), promovieren (làm tiến sĩ). Tính từ: begabt, mündlich, schriftlich."
  - type: deep_explain
    text:
      vi: "Mündlich và schriftlich là cặp thường gặp trong kỳ thi: die mündliche Prüfung (thi vấn đáp), die schriftliche Prüfung (thi viết). Begabt nghĩa là có năng khiếu; ein begabter Schüler. Das Referat thường dài khoảng 15 đến 20 phút trong hội thảo (Seminar), và die Abschlussarbeit được hướng dẫn bởi der Betreuer hoặc die Betreuerin."
  - type: example
    target: Zur Bewerbung gehört das Abschlusszeugnis.
    target_lang: de
    translation:
      vi: Hồ sơ xin việc cần có bằng tốt nghiệp.
    note:
      vi: das Abschlusszeugnis = bằng, học bạ tốt nghiệp.
  - type: example
    target: Gegen Prüfungsangst hilft gute Vorbereitung.
    target_lang: de
    translation:
      vi: Chuẩn bị tốt giúp chống lại nỗi sợ thi.
    note:
      vi: die Prüfungsangst = nỗi sợ thi cử.
  - type: example
    target: Der Lehrplan sieht zwei Stunden Sport pro Woche vor.
    target_lang: de
    translation:
      vi: Chương trình giảng dạy quy định hai giờ thể dục mỗi tuần.
    note:
      vi: der Lehrplan = chương trình giảng dạy.
  - type: example
    target: Mathematik ist ein Unterrichtsfach für alle Schüler.
    target_lang: de
    translation:
      vi: Toán là môn học dành cho mọi học sinh.
    note:
      vi: das Unterrichtsfach = môn học trong trường.
  - type: common_mistake
    wrong: Er hat sein Studium abgebrechen.
    right: Er hat sein Studium abgebrochen.
    target_lang: de
    note:
      vi: Partizip II của abbrechen là abgebrochen (động từ tách, bất quy tắc).
  - type: common_mistake
    wrong: Ich habe die Wörter im Wörterbuch nachgeschlagt.
    right: Ich habe die Wörter im Wörterbuch nachgeschlagen.
    target_lang: de
    note:
      vi: "Nachschlagen là động từ bất quy tắc: schlug nach, hat nachgeschlagen."
  - type: summary
    points:
      - vi: abbrechen, mitschreiben, nachschlagen, vortragen, promovieren; begabt, mündlich, schriftlich.
exercises:
