    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-lernplattform
    prompt:
      template: "Singular: die Lernplattform · Plural: die {{b1}}"
      blanks:
        - { id: b1, width_hint: 17 }
    answer:
      blanks:
        b1:
          - Lernplattformen
    known_wrong:
      - answer: Lernplattform
        feedback_vi: Lernplattform là dạng số ít; số nhiều là Lernplattformen.
        error_tag: plural_form
