    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-zunge
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Zunge\" (cái lưỡi): ___ Zunge"
      stem_lang: vi
      options:
        - { id: hao, text: das, lang: de }
        - { id: neg, text: der, lang: de }
        - { id: hp4, text: die, lang: de }
        - { id: efb, text: ein, lang: de }
    answer:
      correct_option_id: hp4
    explanation:
      vi: "Zunge là danh từ giống cái (die): die Zunge; số nhiều: die Zungen. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: die
