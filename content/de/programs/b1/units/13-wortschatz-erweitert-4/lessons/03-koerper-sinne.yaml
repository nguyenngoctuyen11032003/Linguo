body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi tên được nhiều bộ phận cơ thể chính xác hơn và mô tả cảm giác khi nói chuyện với bác sĩ hay người thân.
  - type: explain
    text:
      vi: "Thêm các bộ phận cơ thể: die Schulter, der Ellbogen, das Handgelenk, das Knie, der Knöchel, die Zehe, der Daumen, der Nacken, die Hüfte, die Brust, die Stirn, die Wange, das Kinn, die Zunge, die Lippe, das Gehirn. Nhiều từ chỉ cơ thể có số nhiều bất quy tắc: die Brust → die Brüste, das Gehirn → die Gehirne."
  - type: explain
    text:
      vi: "Giác quan: der Geruch (khứu giác, mùi), der Geschmack (vị giác, vị), das Gehör (thính giác, số ít), das Sehvermögen. Động từ spüren (cảm thấy) và riechen, schmecken đã học. Ví dụ: Ich spüre meine Füße nicht mehr. Nach der Erkältung habe ich keinen Geschmack."
  - type: explain
    text:
      vi: "Với bộ phận cơ thể, tiếng Đức thường dùng mạo từ xác định và chủ ngữ ở Dativ thay vì từ sở hữu: Ich habe mir das Knie verletzt. Mir tut die Schulter weh. Er hat sich den Daumen gebrochen. Mẫu này rất quan trọng khi nói chuyện với bác sĩ."
  - type: deep_explain
    text:
      vi: "Das Zahnfleisch (lợi) chỉ có số ít. Der Atem (hơi thở) cũng thường dùng số ít: Er hält den Atem an. Atmen và schlucken có chia đều. Nhớ rằng Gehör (thính giác) khác Gehöhr; chỉ có một h trong chính tả này và không có số nhiều. Der Knöchel nghĩa là mắt cá chân hoặc khớp ngón tay; ngữ cảnh cho biết nghĩa."
  - type: example
    target: Mir tut die Schulter weh.
    target_lang: de
    translation:
      vi: Vai tôi đau.
    note:
      vi: die Schulter = vai.
  - type: example
    target: Er hat sich den Ellbogen gestoßen.
    target_lang: de
    translation:
      vi: Anh ấy bị va khuỷu tay.
    note:
      vi: der Ellbogen = khuỷu tay.
  - type: example
    target: Das Handgelenk ist geschwollen.
    target_lang: de
    translation:
      vi: Cổ tay bị sưng.
    note:
      vi: das Handgelenk = cổ tay.
  - type: example
    target: Beim Treppensteigen tun mir die Knie weh.
    target_lang: de
    translation:
      vi: Khi leo cầu thang đầu gối tôi đau.
    note:
      vi: das Knie = đầu gối.
  - type: common_mistake
    wrong: Mein Knie tut weh mir.
    right: Mir tut das Knie weh.
    target_lang: de
    note:
      vi: "Mir đứng đầu hoặc sau động từ: Das Knie tut mir weh. Không đặt mir sau weh."
  - type: common_mistake
    wrong: Ich habe meine Daumen verletzt.
    right: Ich habe mir den Daumen verletzt.
    target_lang: de
    note:
      vi: "Với bộ phận cơ thể của mình dùng mir (Dativ) và mạo từ xác định: mir den Daumen."
  - type: summary
    points:
      - vi: "Ich habe mir das Knie verletzt / Mir tut die Schulter weh: Dativ mir + mạo từ xác định thay cho từ sở hữu."
