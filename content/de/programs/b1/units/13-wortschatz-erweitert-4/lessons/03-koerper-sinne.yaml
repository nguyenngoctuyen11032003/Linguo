title:
  vi: Cơ thể và các giác quan (Körper und Sinne)
objectives:
  - vi: Gọi tên thêm các bộ phận cơ thể và giác quan.
  - vi: Nhớ giống và số nhiều của các danh từ chỉ bộ phận cơ thể.
  - vi: Dùng các động từ atmen, schlucken, spüren khi mô tả cảm giác.
