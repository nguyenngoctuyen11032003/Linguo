    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-satzbau
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Về cấu trúc câu tôi vẫn mắc nhiều lỗi.\": Im ___ mache ich noch viele Fehler."
