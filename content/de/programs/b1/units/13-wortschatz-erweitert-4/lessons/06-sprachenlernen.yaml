      correct_option_id: oy0
    explanation:
      vi: Câu bạn nghe có nghĩa "Việc chuẩn bị cho kỳ thi bắt đầu từ bốn tuần trước.". Từ khoá là die Prüfungsvorbereitung (việc chuẩn bị cho kỳ thi); các câu còn lại nói về những từ khác trong bài.
    display_answer: Việc chuẩn bị cho kỳ thi bắt đầu từ bốn tuần trước.
  - key: de:exercise:b1w4l6-mcq-vi-de-rechtschreibung
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b1w4-rechtschreibung
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "chính tả"?
      stem_lang: vi
      options:
        - { id: z25, text: die Rechtschreibung, lang: de }
        - { id: vx7, text: der Satzbau, lang: de }
        - { id: maq, text: das Hörverstehen, lang: de }
        - { id: rnh, text: die Aussprache, lang: de }
    answer:
      correct_option_id: z25
    explanation:
      vi: "die Rechtschreibung nghĩa là \"chính tả\". Ví dụ: Die deutsche Rechtschreibung ist nicht immer einfach. (Chính tả tiếng Đức không phải lúc nào cũng dễ.)"
    display_answer: die Rechtschreibung
  - key: de:exercise:b1w4l6-mcq-de-vi-lernziel
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-lernziel
    prompt:
      stem: "\"das Lernziel\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: xgr, text: kỹ năng đọc hiểu, lang: vi }
        - { id: kv1, text: gạch chân; nhấn mạnh, lang: vi }
        - { id: pv8, text: mục tiêu học tập, lang: vi }
        - { id: rx7, text: không có lỗi, lang: vi }
    answer:
      correct_option_id: pv8
    explanation:
      vi: "das Lernziel nghĩa là \"mục tiêu học tập\". Ví dụ: Wir besprechen am Anfang das Lernziel des Kurses. (Lúc đầu chúng ta bàn về mục tiêu của khóa học.)"
    display_answer: mục tiêu học tập
  - key: de:exercise:b1w4l6-mcq-artikel-zeitform
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w4-zeitform
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Zeitform\" (thì (ngữ pháp)): ___ Zeitform"
      stem_lang: vi
      options:
        - { id: cj4, text: der, lang: de }
        - { id: pcy, text: ein, lang: de }
        - { id: pfn, text: die, lang: de }
        - { id: ewc, text: das, lang: de }
    answer:
      correct_option_id: pfn
    explanation:
      vi: "Zeitform là danh từ giống cái (die): die Zeitform; số nhiều: die Zeitformen. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: die
  - key: de:exercise:b1w4l6-tr-word-aussprache
