title:
  vi: Học ngôn ngữ và cách học (Sprachenlernen)
objectives:
  - vi: Nói về cách học ngôn ngữ, các kỹ năng và những khó khăn thường gặp.
  - vi: Dùng các động từ korrigieren, aussprechen, sich ausdrücken, verwechseln, markieren, unterstreichen.
  - vi: "Mô tả kết quả học: verständlich, fehlerfrei, korrekt."
estimated_minutes: 15
skills:
