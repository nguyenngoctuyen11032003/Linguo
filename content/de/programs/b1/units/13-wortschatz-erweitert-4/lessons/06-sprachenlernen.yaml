body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả được cách mình học tiếng Đức, những khó khăn và mục tiêu học tập, và hiểu các từ thường dùng trong sách giáo khoa và lớp học.
  - type: explain
    text:
      vi: "Kỹ năng và nội dung: die Aussprache, die Rechtschreibung (chính tả), der Satzbau (cấu trúc câu, chỉ số ít), die Zeitform (thì), die Übersetzung, das Hörverstehen, das Leseverstehen, der Lückentext (bài điền chỗ trống). Các từ ghép với -verstehen luôn là giống trung và không có số nhiều."
  - type: explain
    text:
      vi: "Động từ trong lớp học: korrigieren (sửa), aussprechen (phát âm: spricht aus, sprach aus, hat ausgesprochen), verwechseln (nhầm lẫn), markieren (đánh dấu), unterstreichen (gạch chân: unterstreicht, unterstrich, hat unterstrichen), sich ausdrücken (diễn đạt), sich verständigen (hiểu nhau, giao tiếp được). Ví dụ: Ich kann mich auf Deutsch schon gut ausdrücken."
  - type: explain
    text:
      vi: "Mục tiêu và tiến bộ: das Lernziel, der Lernfortschritt, die Lernmethode, die Prüfungsvorbereitung, der Sprachkurs. Tính từ: verständlich (dễ hiểu), fehlerfrei (không lỗi), korrekt (đúng). Ví dụ: Deine Aussprache ist verständlich, aber der Satzbau ist noch nicht ganz korrekt."
  - type: deep_explain
    text:
      vi: "Verwechseln thường đi với mit: Ich verwechsle oft „der\" mit „das\". Sich verständigen cũng có nghĩa là thống nhất: Wir haben uns auf einen Termin verständigt. Der Ausdruck (cách diễn đạt, số nhiều die Ausdrücke) khác die Aussprache (phát âm). Hãy ghi các Ausdrücke mới vào sổ từ vựng cùng ví dụ."
  - type: example
    target: Deine Aussprache ist schon sehr gut.
    target_lang: de
    translation:
      vi: Cách phát âm của bạn đã rất tốt.
    note:
      vi: die Aussprache = cách phát âm.
  - type: example
    target: Die deutsche Rechtschreibung ist nicht immer einfach.
    target_lang: de
    translation:
      vi: Chính tả tiếng Đức không phải lúc nào cũng dễ.
    note:
      vi: die Rechtschreibung = chính tả.
  - type: example
    target: Im Satzbau mache ich noch viele Fehler.
    target_lang: de
    translation:
      vi: Về cấu trúc câu tôi vẫn mắc nhiều lỗi.
    note:
      vi: der Satzbau = cấu trúc câu.
  - type: example
    target: Das Perfekt ist eine Zeitform der Vergangenheit.
    target_lang: de
    translation:
      vi: Perfekt là một thì của quá khứ.
    note:
      vi: die Zeitform = thì (ngữ pháp).
  - type: common_mistake
    wrong: Ich habe die Wörter falsch ausgesprechen.
    right: Ich habe die Wörter falsch ausgesprochen.
    target_lang: de
    note:
      vi: "Aussprechen là động từ bất quy tắc tách: spricht aus, sprach aus, hat ausgesprochen."
  - type: common_mistake
    wrong: Ich verwechsle „der" und „die".
    right: Ich verwechsle „der" mit „die".
    target_lang: de
    note:
      vi: Verwechseln dùng với mit + Dativ.
  - type: summary
    points:
      - vi: korrigieren, aussprechen, sich ausdrücken, sich verständigen, verwechseln, markieren, unterstreichen; verständlich, fehlerfrei, korrekt.
exercises:
