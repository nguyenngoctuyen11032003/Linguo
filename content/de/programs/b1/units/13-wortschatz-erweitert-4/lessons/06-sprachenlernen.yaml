    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w4-pruefungsvorbereitung
    prompt:
      audio_asset_id: null
      fallback_text: Die Prüfungsvorbereitung beginnt vier Wochen vorher.
      options:
        - { id: oy0, text: Việc chuẩn bị cho kỳ thi bắt đầu từ bốn tuần trước., lang: vi }
        - { id: i1w, text: Chúng tôi đã giao tiếp được bằng tiếng Anh., lang: vi }
        - { id: e3u, text: Phương pháp học nào hiệu quả nhất với bạn?, lang: vi }
        - { id: h0q, text: Chính tả tiếng Đức không phải lúc nào cũng dễ., lang: vi }
