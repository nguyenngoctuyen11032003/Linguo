  - key: de:exercise:b1w4l2-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: "Bố tôi hôm qua được chỉ định nhập viện và ngày mai sẽ được mổ."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Mein Vater wurde gestern ins Krankenhaus eingewiesen und wird morgen operiert.
        - Mein Vater ist gestern ins Krankenhaus eingewiesen worden und wird morgen operiert.
        - Gestern wurde mein Vater ins Krankenhaus eingewiesen, und morgen wird er operiert.
    explanation:
      vi: "Gợi ý đáp án: Mein Vater wurde gestern ins Krankenhaus eingewiesen und wird morgen operiert. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Mein Vater wurde gestern ins Krankenhaus eingewiesen und wird morgen operiert.
    item: de:item:b1w4-operieren
  - key: de:exercise:b1w4l2-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Nach der ambulanten Operation durfte sie noch am selben Tag nach Hause, aber sie muss einen Verband tragen.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Sau ca mổ ngoại trú, cô ấy được về nhà ngay trong ngày, nhưng phải mang băng.
        - Sau ca phẫu thuật không phải nằm viện, cô ấy được về nhà cùng ngày nhưng phải đeo băng.
        - Sau cuộc mổ ngoại trú cô ấy được phép về nhà trong ngày, nhưng cô phải băng vết thương.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Nach der ambulanten Operation durfte sie noch am selben Tag nach Hause, aber sie muss einen Verband tragen.\" nghĩa là: Sau ca mổ ngoại trú, cô ấy được về nhà ngay trong ngày, nhưng phải mang băng. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Sau ca mổ ngoại trú, cô ấy được về nhà ngay trong ngày, nhưng phải mang băng.
    item: de:item:b1w4-verband
