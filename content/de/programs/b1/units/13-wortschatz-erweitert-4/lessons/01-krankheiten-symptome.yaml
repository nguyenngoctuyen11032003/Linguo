title:
  vi: Bệnh tật và triệu chứng (Krankheiten und Symptome)
objectives:
  - vi: Gọi tên các bệnh thường gặp, triệu chứng và chấn thương.
  - vi: "Mô tả cảm giác khó chịu: Übelkeit, Schwindel, Atemnot, Durchfall."
  - vi: "Nói về tiêm chủng và lây nhiễm: impfen, sich anstecken, ansteckend."
