body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả được triệu chứng bệnh với bác sĩ bằng từ chính xác hơn và hiểu thông tin cơ bản về bệnh lây và tiêm chủng.
  - type: explain
    text:
      vi: "Từ chỉ bệnh và triệu chứng: die Grippe, das Asthma, der Diabetes (cũng nói die Zuckerkrankheit), die Infektion (nhiễm trùng), die Übelkeit (buồn nôn), der Schwindel (chóng mặt), die Atemnot (khó thở), der Durchfall (tiêu chảy). Nhiều từ chỉ có số ít vì là tên bệnh hoặc cảm giác: Ich habe Atemnot."
  - type: explain
    text:
      vi: "Chấn thương: die Verstauchung (bong gân), der Bruch (gãy xương, thường nói Knochenbruch), die Wunde (vết thương), die Blutung (chảy máu). Cơ quan: der Magen, das Herz, die Lunge, der Knochen, das Gelenk. Số nhiều đặc biệt: das Herz → die Herzen, der Magen → die Mägen, der Knochen → die Knochen."
  - type: explain
    text:
      vi: "Tiêm chủng: die Impfung, der Impfstoff, impfen (Ich lasse mich impfen). Lây nhiễm: die Ansteckung, sich anstecken (Ich habe mich bei meinem Kollegen angesteckt), ansteckend (lây): Die Grippe ist ansteckend. Hỏi bác sĩ: Ist das ansteckend? Wie lange?"
  - type: deep_explain
    text:
      vi: Đừng nhầm Schwindel (chóng mặt) với Schwindel (trò lừa đảo); ngữ cảnh cho biết nghĩa. Mir ist schwindelig và Mir ist übel là hai cách thường dùng để nói chóng mặt và buồn nôn. Niesen (hắt hơi) có Perfekt hat geniest. Sich anstecken thường đi với bei + Dativ để nói lây từ ai.
  - type: example
    target: Im Winter haben viele Menschen die Grippe.
    target_lang: de
    translation:
      vi: Vào mùa đông nhiều người bị cúm.
    note:
      vi: die Grippe = bệnh cúm.
  - type: example
    target: Mein Sohn hat Asthma und braucht ein Spray.
    target_lang: de
    translation:
      vi: Con trai tôi bị hen và cần bình xịt.
    note:
      vi: das Asthma = bệnh hen.
  - type: example
    target: Mein Großvater hat Diabetes.
    target_lang: de
    translation:
      vi: Ông tôi bị tiểu đường.
    note:
      vi: der Diabetes = bệnh tiểu đường.
  - type: example
    target: Die Infektion wird mit Antibiotika behandelt.
    target_lang: de
    translation:
      vi: Nhiễm trùng được điều trị bằng kháng sinh.
    note:
      vi: die Infektion = sự nhiễm trùng.
  - type: common_mistake
    wrong: Ich habe mich von der Grippe angesteckt.
    right: Ich habe mich bei meinem Kollegen mit der Grippe angesteckt.
    target_lang: de
    note:
      vi: Lây từ ai thì dùng bei + Dativ, lây bệnh gì thì dùng mit + Dativ.
  - type: common_mistake
    wrong: Die Grippe ist ansteckt.
    right: Die Grippe ist ansteckend.
    target_lang: de
    note:
      vi: Tính từ là ansteckend (Partizip I), không phải Partizip II.
  - type: summary
    points:
      - vi: die Impfung, der Impfstoff, die Ansteckung; impfen, sich anstecken, niesen; ansteckend.
