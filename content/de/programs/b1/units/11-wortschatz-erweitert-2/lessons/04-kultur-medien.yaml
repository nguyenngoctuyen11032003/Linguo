title:
  vi: Phim, nhạc, sách và giải trí (Kultur und Medien)
objectives:
  - vi: Nói về phim, buổi hòa nhạc, sách và các dịch vụ giải trí.
  - vi: "Dùng danh từ ghép về phim ảnh và âm nhạc: Kinokarte, Filmmusik, Eintrittskarte."
  - vi: Nêu ý kiến về một bộ phim hoặc quyển sách bằng các tính từ spannend, gruselig, rührend, fesselnd.
