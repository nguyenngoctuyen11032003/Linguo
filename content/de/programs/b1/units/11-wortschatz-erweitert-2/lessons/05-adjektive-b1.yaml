body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả được sự việc, tình huống và đồ vật chính xác hơn bằng nhiều tính từ quan trọng ở B1, đặt chúng đúng chỗ trong câu.
  - type: explain
    text:
      vi: "Một số đuôi tính từ giúp đoán nghĩa: -lich (heimlich, empfindlich, selbstverständlich, unglaublich), -ig (endgültig, sorgfältig, lästig), -bar (kostbar), -los (hilflos), -sam (mühsam, sparsam). Dù vậy, hãy học từng từ cùng ví dụ."
  - type: explain
    text:
      vi: "Sau sein tính từ không đổi đuôi: Das ist dringend. Trước danh từ, tính từ có đuôi theo giống, cách và mạo từ: eine dringende Angelegenheit, ein kostbarer Ring. Bạn đã học quy tắc này ở A2 và B1; hãy luyện thêm với các từ mới."
  - type: explain
    text:
      vi: "Một số cặp cần phân biệt: bekannt (được nhiều người biết) và berühmt (nổi tiếng) khá gần nhau, nhưng bekannt trung tính hơn; nötig (cần thiết) và übrig (còn dư): Ich habe noch zehn Euro übrig. Offensichtlich nghĩa là rõ ràng, hiển nhiên, còn tatsächlich là thật sự, thực tế."
  - type: deep_explain
    text:
      vi: "Tính từ endgültig (cuối cùng, không thay đổi nữa) thường đi với danh từ quyết định: eine endgültige Entscheidung. Heimlich nghĩa là bí mật, lén lút: Er hat sie heimlich fotografiert. Selbstverständlich cũng được dùng như một trạng từ: Selbstverständlich helfe ich dir. Nó có nghĩa là tất nhiên rồi."
  - type: example
    target: Wir haben ausreichend Zeit für die Vorbereitung.
    target_lang: de
    translation:
      vi: Chúng ta có đủ thời gian để chuẩn bị.
    note:
      vi: ausreichend = đủ, đầy đủ.
  - type: example
    target: Das Restaurant ist in der ganzen Stadt bekannt.
    target_lang: de
    translation:
      vi: Nhà hàng này nổi tiếng khắp thành phố.
    note:
      vi: bekannt = được nhiều người biết; quen thuộc.
  - type: example
    target: Dieser Park ist bei Familien sehr beliebt.
    target_lang: de
    translation:
      vi: Công viên này rất được các gia đình ưa chuộng.
    note:
      vi: beliebt = được ưa chuộng.
  - type: example
    target: Bist du bereit für den Test?
    target_lang: de
    translation:
      vi: Bạn đã sẵn sàng cho bài kiểm tra chưa?
    note:
      vi: bereit = sẵn sàng.
  - type: common_mistake
    wrong: Das Ergebnis ist unglaubliches.
    right: Das Ergebnis ist unglaublich.
    target_lang: de
    note:
      vi: Sau sein, tính từ không đổi đuôi.
  - type: common_mistake
    wrong: Es ist tatsächlich offensichtlich, dass er kommt nicht.
    right: Es ist offensichtlich, dass er nicht kommt.
    target_lang: de
    note:
      vi: "Trong câu phụ với dass, động từ chia đứng cuối: dass er nicht kommt."
  - type: summary
    points:
      - vi: "ausreichend, bekannt, beliebt, bereit, dringend, eigenartig, empfindlich, endgültig, entfernt, ernsthaft."
      - vi: "heimlich, hilflos, kostbar, künstlich, lästig, mühsam, nötig, offensichtlich, selbstverständlich, sorgfältig, sparsam, tatsächlich, übrig, unglaublich."
      - vi: "Sau sein, tính từ không đổi đuôi; trước danh từ có đuôi theo giống, cách và mạo từ."
