title:
  vi: Tính từ thông dụng ở trình độ B1 (Wichtige Adjektive)
objectives:
  - vi: Dùng thêm hơn hai mươi tính từ B1 để mô tả sự việc, tình huống và đồ vật.
  - vi: "Phân biệt các cặp gần nghĩa: wichtig – dringend, übrig – nötig, bekannt – berühmt."
  - vi: Nhận biết đuôi -lich, -ig, -sam, -bar, -los của tính từ.
