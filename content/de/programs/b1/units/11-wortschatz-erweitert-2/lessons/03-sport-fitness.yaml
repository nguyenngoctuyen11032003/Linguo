title:
  vi: Thể thao, thể lực và chấn thương (Sport und Fitness)
objectives:
  - vi: Mô tả buổi tập, thể lực và các chấn thương thể thao thường gặp.
  - vi: "Nói về giải đấu và thành tích: Marathon, Medaille, Rekord, Meisterschaft."
  - vi: Dùng các động từ sich dehnen, aufwärmen, durchhalten, anfeuern, siegen, besiegen.
