    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b1w2-selbstbewusstsein
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "sự tự tin"?
      stem_lang: vi
      options:
        - { id: lo7, text: das Benehmen, lang: de }
        - { id: qhx, text: die Freundlichkeit, lang: de }
        - { id: ky1, text: die Geduld, lang: de }
        - { id: ugy, text: das Selbstbewusstsein, lang: de }
