      vi: "nachdenklich nghĩa là \"trầm ngâm, hay suy nghĩ\". Ví dụ: Nach dem Gespräch war sie ganz nachdenklich. (Sau cuộc trò chuyện cô ấy hoàn toàn trầm ngâm.)"
    display_answer: trầm ngâm, hay suy nghĩ
  - key: de:exercise:b1w2l2-mcq-artikel-puenktlichkeit
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w2-puenktlichkeit
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Pünktlichkeit\" (sự đúng giờ): ___ Pünktlichkeit"
      stem_lang: vi
      options:
        - { id: fwl, text: der, lang: de }
        - { id: m2l, text: das, lang: de }
        - { id: iil, text: die, lang: de }
        - { id: fcy, text: ein, lang: de }
    answer:
      correct_option_id: iil
    explanation:
      vi: "Pünktlichkeit là danh từ giống cái (die): die Pünktlichkeit (không dùng ở số nhiều). \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: die
