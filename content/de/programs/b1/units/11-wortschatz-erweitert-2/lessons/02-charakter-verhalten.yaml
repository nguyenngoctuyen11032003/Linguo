body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả được tính cách của mình và người khác khá chi tiết và nêu ví dụ về cách cư xử trong công việc và đời sống.
  - type: explain
    text:
      vi: "Tiền tố un- đảo nghĩa tính từ: geduldig – ungeduldig, zuverlässig – unzuverlässig, pünktlich – unpünktlich, sicher – unsicher. Đây là cách mở rộng vốn từ nhanh nhất; nhưng không phải tính từ nào cũng có: trái nghĩa của faul là fleißig, của bescheiden là arrogant hoặc eingebildet."
  - type: explain
    text:
      vi: "Từ tính từ sang danh từ: bằng đuôi -keit hoặc -heit, danh từ luôn là giống cái: pünktlich → die Pünktlichkeit, freundlich → die Freundlichkeit, ehrlich → die Ehrlichkeit. Từ geduldig có danh từ die Geduld (không có -keit). Das Selbstbewusstsein là sự tự tin (danh từ trung, không có số nhiều)."
  - type: explain
    text:
      vi: "Một số cách nói tự nhiên: Er ist ein ruhiger Mensch und bleibt auch unter Druck gelassen. Sie wirkt unsicher, ist aber in Wirklichkeit sehr kompetent. Dùng wirken (tạo cảm giác) để mô tả ấn tượng bên ngoài. Der Charakterzug là nét tính cách đặc trưng: Geduld ist ihr wichtigster Charakterzug."
  - type: deep_explain
    text:
      vi: "Cẩn thận với từ giống tiếng Việt: eingebildet nghĩa là tự cao, tự phụ, không phải \"tưởng tượng\". Nachdenklich là hay suy tư, trầm ngâm. Launisch chỉ người dễ đổi tâm trạng, thường mang nghĩa tiêu cực. Gesprächig là hay nói, thích trò chuyện, thường mang nghĩa trung tính hoặc tích cực."
  - type: example
    target: Meine Tante ist sehr temperamentvoll.
    target_lang: de
    translation:
      vi: Dì tôi rất sôi nổi.
    note:
      vi: temperamentvoll = sôi nổi, nóng nảy.
  - type: example
    target: Wenn er warten muss, wird er schnell ungeduldig.
    target_lang: de
    translation:
      vi: Khi phải đợi, anh ấy nhanh chóng mất kiên nhẫn.
    note:
      vi: ungeduldig = thiếu kiên nhẫn.
  - type: example
    target: Der Handwerker ist leider unzuverlässig.
    target_lang: de
    translation:
      vi: Người thợ tiếc là không đáng tin.
    note:
      vi: unzuverlässig = không đáng tin cậy.
  - type: example
    target: Trotz seines Erfolgs ist er bescheiden geblieben.
    target_lang: de
    translation:
      vi: Dù thành công, anh ấy vẫn khiêm tốn.
    note:
      vi: bescheiden = khiêm tốn.
  - type: common_mistake
    wrong: Der Pünktlichkeit ist wichtig.
    right: Die Pünktlichkeit ist wichtig.
    target_lang: de
    note:
      vi: Danh từ có đuôi -keit luôn là giống cái nên dùng mạo từ die.
  - type: common_mistake
    wrong: Die Geduld ist ein wichtiger Charakterzug von sie.
    right: Geduld ist ein wichtiger Charakterzug von ihr.
    target_lang: de
    note:
      vi: "Sau giới từ von dùng Dativ: ihr, không phải sie."
  - type: summary
    points:
      - vi: der Charakterzug, das Selbstbewusstsein, die Geduld, die Pünktlichkeit, die Freundlichkeit, das Benehmen.
