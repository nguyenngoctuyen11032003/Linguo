title:
  vi: Tính cách và cách cư xử (Charakter und Verhalten)
objectives:
  - vi: Mô tả tính cách người khác bằng nhiều tính từ chính xác.
  - vi: "Nhận biết các cặp từ trái nghĩa với tiền tố un-: geduldig – ungeduldig, zuverlässig – unzuverlässig."
  - vi: "Dùng các danh từ chỉ phẩm chất tương ứng: die Geduld, die Pünktlichkeit, die Freundlichkeit."
estimated_minutes: 15
