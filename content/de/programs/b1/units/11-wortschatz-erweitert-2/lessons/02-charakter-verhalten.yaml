      stem_lang: vi
      options:
        - { id: vt5, text: sự đúng giờ, lang: vi }
        - { id: zk7, text: "lộn xộn, hỗn loạn", lang: vi }
        - { id: raj, text: "không chắc chắn, thiếu tự tin", lang: vi }
