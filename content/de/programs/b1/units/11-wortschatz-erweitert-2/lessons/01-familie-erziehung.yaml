    explanation:
      vi: "\"nuôi lớn (con cái, con vật)\" trong tiếng Đức là aufziehen. Ví dụ: Sie hat drei Kinder allein aufgezogen."
    display_answer: aufziehen
  - key: de:exercise:b1w2l1-fill-plural-kindergartenplatz
