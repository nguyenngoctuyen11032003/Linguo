title:
  vi: Gia đình và nuôi dạy con (Familie und Erziehung)
objectives:
  - vi: Nói về cách nuôi dạy con, chăm sóc trẻ và các khoản hỗ trợ cho gia đình ở Đức.
  - vi: Dùng các động từ erziehen, bestrafen, belohnen, verwöhnen đúng cấu trúc.
  - vi: Miêu tả một đứa trẻ hoặc một người cha mẹ bằng các tính từ gehorsam, brav, verwöhnt.
estimated_minutes: 15
