      diacritics: lenient
    explanation:
      vi: "Câu \"Eltern sollten ihre Kinder loben, wenn sie etwas gut gemacht haben, statt sie nur zu bestrafen.\" nghĩa là: Cha mẹ nên khen con khi chúng làm tốt điều gì, thay vì chỉ phạt. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Cha mẹ nên khen con khi chúng làm tốt điều gì, thay vì chỉ phạt.
