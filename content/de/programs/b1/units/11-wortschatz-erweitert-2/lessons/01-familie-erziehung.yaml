        - Cha mẹ nên khen con khi chúng làm tốt điều gì, thay vì chỉ phạt.
        - Bố mẹ nên khen con khi con làm được việc gì tốt, thay vì chỉ trừng phạt.
        - Cha mẹ nên khen ngợi con cái khi chúng làm tốt, chứ không chỉ phạt chúng.
