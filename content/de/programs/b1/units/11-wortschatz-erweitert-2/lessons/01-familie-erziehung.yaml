    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: "Chị gái tôi nuôi con một mình, và con trai chị ấy được nhận một chỗ ở trường mẫu giáo."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Meine Schwester ist alleinerziehend, und ihr Sohn bekommt einen Kindergartenplatz.
        - Meine Schwester erzieht ihr Kind allein, und ihr Sohn bekommt einen Kindergartenplatz.
        - Meine Schwester ist alleinerziehende Mutter, und ihr Sohn bekommt einen Kindergartenplatz.
    explanation:
      vi: "Gợi ý đáp án: Meine Schwester ist alleinerziehend, und ihr Sohn bekommt einen Kindergartenplatz. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Meine Schwester ist alleinerziehend, und ihr Sohn bekommt einen Kindergartenplatz.
    item: de:item:b1w2-kindergartenplatz
  - key: de:exercise:b1w2l1-tr-satz-de-vi-1
