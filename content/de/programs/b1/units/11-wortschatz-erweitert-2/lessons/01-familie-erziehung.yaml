    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w2-gehorsam
    prompt:
      audio_asset_id: null
      fallback_text: Der Hund ist sehr gehorsam.
      options:
        - { id: wu0, text: Ông bà thích nuông chiều các cháu., lang: vi }
        - { id: rnt, text: Con chó rất vâng lời., lang: vi }
        - { id: wyd, text: Tôi còn phải thay tã cho em bé., lang: vi }
        - { id: d5f, text: Con trai chúng tôi đi nhà trẻ từ tháng Năm., lang: vi }
    answer:
      correct_option_id: rnt
    explanation:
      vi: Câu bạn nghe có nghĩa "Con chó rất vâng lời.". Từ khoá là gehorsam (vâng lời); các câu còn lại nói về những từ khác trong bài.
    display_answer: Con chó rất vâng lời.
  - key: de:exercise:b1w2l1-mcq-vi-de-brav
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b1w2-brav
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "ngoan, ngoan ngoãn"?
      stem_lang: vi
      options:
        - { id: dxh, text: kinderlieb, lang: de }
        - { id: v32, text: brav, lang: de }
        - { id: t1m, text: gehorsam, lang: de }
        - { id: dyk, text: verwöhnt, lang: de }
    answer:
      correct_option_id: v32
    explanation:
      vi: "brav nghĩa là \"ngoan, ngoan ngoãn\". Ví dụ: Seid ihr heute brav gewesen? (Hôm nay các con có ngoan không?)"
    display_answer: brav
  - key: de:exercise:b1w2l1-mcq-de-vi-kinderlieb
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w2-kinderlieb
    prompt:
      stem: "\"kinderlieb\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: s5b, text: "tấm gương, hình mẫu", lang: vi }
        - { id: q8f, text: yêu trẻ, lang: vi }
        - { id: gp5, text: thời gian nghỉ để chăm con, lang: vi }
        - { id: f4f, text: vâng lời, lang: vi }
    answer:
      correct_option_id: q8f
    explanation:
      vi: "kinderlieb nghĩa là \"yêu trẻ\". Ví dụ: Mein Onkel ist sehr kinderlieb. (Chú tôi rất yêu trẻ con.)"
    display_answer: yêu trẻ
  - key: de:exercise:b1w2l1-mcq-artikel-vorbild
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w2-vorbild
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Vorbild\" (tấm gương, hình mẫu): ___ Vorbild"
      stem_lang: vi
      options:
        - { id: sok, text: ein, lang: de }
        - { id: s1o, text: der, lang: de }
        - { id: kqs, text: das, lang: de }
        - { id: l79, text: die, lang: de }
    answer:
      correct_option_id: kqs
    explanation:
      vi: "Vorbild là danh từ giống trung (das): das Vorbild; số nhiều: die Vorbilder. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
  - key: de:exercise:b1w2l1-tr-word-windel
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1w2-windel
    prompt:
      source_text: tã lót (danh từ, viết cả mạo từ)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - die Windel
    known_wrong:
      - answer: der Windel
        feedback_vi: Windel là giống cái, nên là die Windel.
        error_tag: article
      - answer: das Windel
        feedback_vi: Windel là giống cái, nên là die Windel.
        error_tag: article
    explanation:
      vi: "\"tã lót\" trong tiếng Đức là die Windel (số nhiều: die Windeln). Ví dụ: Die Windel muss gewechselt werden."
    display_answer: die Windel
  - key: de:exercise:b1w2l1-tr-word-aufziehen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1w2-aufziehen
    prompt:
      source_text: nuôi lớn (con cái, con vật) (động từ, dạng nguyên thể)
