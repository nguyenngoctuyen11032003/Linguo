body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về việc nuôi dạy con, các dịch vụ chăm sóc trẻ và cách cư xử của trẻ em trong gia đình.
  - type: explain
    text:
      vi: "Từ chỉ chăm sóc trẻ: die Kinderbetreuung, die Krippe (nhà trẻ cho trẻ dưới ba tuổi), der Kindergartenplatz, der Babysitter. Chính sách hỗ trợ ở Đức có die Elternzeit (nghỉ để chăm con) và das Elterngeld (tiền hỗ trợ cha mẹ). Hai từ này thường xuất hiện trong thông báo của công ty và cơ quan."
  - type: explain
    text:
      vi: "Về cách nuôi dạy: die Erziehung (không có số nhiều), ein Vorbild sein (là tấm gương), loben ↔ bestrafen, belohnen, verwöhnen (nuông chiều). Cấu trúc cố định: jemanden für etwas belohnen / bestrafen. Verwöhnen đôi khi mang sắc thái tiêu cực: ein verwöhntes Kind là đứa trẻ được chiều quá mức."
  - type: explain
    text:
      vi: "Về trẻ sơ sinh: der Säugling (nhũ nhi), die Windel, wickeln (thay tã), aufziehen (nuôi lớn: zieht auf, zog auf, hat aufgezogen). Mô tả con trẻ: gehorsam (ngoan, vâng lời), brav (ngoan ngoãn), kinderlieb (yêu trẻ), alleinerziehend (nuôi con một mình): eine alleinerziehende Mutter."
  - type: deep_explain
    text:
      vi: "Das Taschengeld (tiền tiêu vặt) ở Đức thường được trẻ nhận đều đặn từ khoảng 6 tuổi; cha mẹ thường hỏi nhau về mức hợp lý. Die Großfamilie chỉ gia đình nhiều thế hệ hoặc đông con, còn die Kleinfamilie chỉ cha mẹ và con cái. Der Umgang (cách đối xử, quan hệ giao tiếp) thường đi với mit + Dativ: der Umgang mit Kindern."
  - type: example
    target: Die Erziehung der Kinder ist eine große Verantwortung.
    target_lang: de
    translation:
      vi: Việc nuôi dạy con cái là một trách nhiệm lớn.
    note:
      vi: die Erziehung = việc nuôi dạy, giáo dục trong gia đình.
  - type: example
    target: Eltern sind für ihre Kinder ein wichtiges Vorbild.
    target_lang: de
    translation:
      vi: Cha mẹ là tấm gương quan trọng cho con cái.
    note:
      vi: das Vorbild = tấm gương, hình mẫu.
  - type: example
    target: Für die gute Note gab es eine Belohnung.
    target_lang: de
    translation:
      vi: Vì điểm tốt, cậu bé nhận được phần thưởng.
    note:
      vi: die Belohnung = phần thưởng.
  - type: example
    target: Die Kinderbetreuung ist in unserer Stadt gut organisiert.
    target_lang: de
    translation:
      vi: Việc chăm sóc trẻ ở thành phố chúng tôi được tổ chức tốt.
    note:
      vi: die Kinderbetreuung = việc chăm sóc trẻ.
  - type: common_mistake
    wrong: Er hat sein Kind für das Lügen bestraft, weil es hat gelogen.
    right: Er hat sein Kind bestraft, weil es gelogen hat.
    target_lang: de
    note:
      vi: "Trong câu phụ với weil, động từ chia đứng cuối: weil es gelogen hat."
  - type: common_mistake
    wrong: Meine Tochter ist sehr verwöhnen.
    right: Meine Tochter ist sehr verwöhnt.
    target_lang: de
    note:
      vi: "Sau sein, tính từ là Partizip II: verwöhnt, không phải nguyên thể."
  - type: summary
    points:
      - vi: "die Erziehung, das Vorbild, die Belohnung, der Umgang, das Taschengeld; erziehen, aufziehen, bestrafen, belohnen, verwöhnen."
      - vi: "die Kinderbetreuung, die Krippe, der Kindergartenplatz, die Elternzeit, das Elterngeld, die Großfamilie, der Babysitter."
      - vi: "der Säugling, die Windel, wickeln; gehorsam, brav, verwöhnt, alleinerziehend, kinderlieb."
exercises:
