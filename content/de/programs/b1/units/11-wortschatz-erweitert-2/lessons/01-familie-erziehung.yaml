      vi: "Số nhiều của der Kindergartenplatz là die Kindergartenplätze (ký hiệu trong từ điển: ¨-e, nguyên âm đổi thành ä/ö/ü/äu). Mạo từ số nhiều luôn là die."
    display_answer: "Singular: der Kindergartenplatz · Plural: die Kindergartenplätze"
  - key: de:exercise:b1w2l1-mcq-luecke-erziehung
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1w2-erziehung
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Việc nuôi dạy con cái là một trách nhiệm lớn.\": Die ___ der Kinder ist eine große Verantwortung."
      stem_lang: vi
      options:
        - { id: lae, text: Belohnung, lang: de }
        - { id: cqp, text: Elternzeit, lang: de }
        - { id: gmy, text: Erziehung, lang: de }
        - { id: xb0, text: Kindergartenplatz, lang: de }
    answer:
      correct_option_id: gmy
    explanation:
      vi: "Câu có nghĩa \"Việc nuôi dạy con cái là một trách nhiệm lớn.\" nên cần Erziehung (die Erziehung: việc nuôi dạy, giáo dục trong gia đình). Elternzeit = thời gian nghỉ để chăm con; Kindergartenplatz = chỗ học ở trường mẫu giáo; Belohnung = phần thưởng không đúng nghĩa của câu."
    display_answer: Erziehung
