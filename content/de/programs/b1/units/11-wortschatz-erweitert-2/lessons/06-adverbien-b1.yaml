body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói và viết mạch lạc, tự nhiên hơn nhờ khoảng hai mươi trạng từ thường dùng để nối ý, bày tỏ thái độ và nói về thời gian.
  - type: explain
    text:
      vi: "Trạng từ nối ý: allerdings (tuy nhiên), jedenfalls (dù sao thì), übrigens (nhân tiện), schließlich (rốt cuộc, suy cho cùng), sowieso (dù sao cũng), ohnehin (vốn dĩ). Chúng thường đứng ở vị trí thứ nhất hoặc giữa câu. Khi đứng đầu câu, động từ chia vẫn ở vị trí thứ hai: Allerdings kann ich nicht kommen."
  - type: explain
    text:
      vi: "Trạng từ chỉ thời gian: vorhin (lúc nãy), zuletzt (lần cuối), zunächst (trước hết), zurzeit (hiện nay), weiterhin (vẫn tiếp tục), bereits (đã). Trạng từ thái độ: hoffentlich (hy vọng là), offenbar, anscheinend (có vẻ như), eigentlich (thật ra), sogar (thậm chí), ebenfalls (cũng vậy)."
  - type: explain
    text:
      vi: "Trạng từ không đổi đuôi và có vị trí linh hoạt. Hai vị trí thường dùng: đầu câu để nhấn mạnh (Zurzeit arbeite ich in Köln) hoặc ngay sau động từ chia (Ich arbeite zurzeit in Köln). Trạng từ chỉ nơi không xác định: irgendwo (ở đâu đó), nirgends (không nơi nào), irgendwie (bằng cách nào đó)."
  - type: deep_explain
    text:
      vi: "Eigentlich hay gặp ở câu hỏi lịch sự hoặc để làm dịu: Was machst du eigentlich beruflich? Ebenfalls dùng khi đáp lời chúc: Danke, ebenfalls! (Cảm ơn, bạn cũng vậy!). Sowieso và ohnehin gần nghĩa nhau; sowieso thân mật hơn: Ich gehe sowieso einkaufen, soll ich dir etwas mitbringen? Teilweise nghĩa là một phần, một số."
  - type: example
    target: Die Wohnung ist schön, allerdings ist die Miete hoch.
    target_lang: de
    translation:
      vi: Căn hộ đẹp, tuy nhiên tiền thuê cao.
    note:
      vi: allerdings = tuy nhiên; tất nhiên (khẳng định mạnh).
  - type: example
    target: Ich wünsche Ihnen ein schönes Wochenende. – Danke, ebenfalls!
    target_lang: de
    translation:
      vi: Chúc ông/bà cuối tuần vui vẻ. – Cảm ơn, ông/bà cũng vậy!
    note:
      vi: ebenfalls = cũng vậy, tương tự.
  - type: example
    target: Ich komme jedenfalls pünktlich, egal was passiert.
    target_lang: de
    translation:
      vi: Dù sao tôi cũng sẽ đến đúng giờ, dù có chuyện gì xảy ra.
    note:
      vi: jedenfalls = dù sao thì, ít nhất là.
  - type: example
    target: Insgesamt waren dreißig Gäste da.
    target_lang: de
    translation:
      vi: Tổng cộng có ba mươi khách.
    note:
      vi: insgesamt = tổng cộng, nhìn chung.
  - type: common_mistake
    wrong: Allerdings ich kann nicht kommen.
    right: Allerdings kann ich nicht kommen.
    target_lang: de
    note:
      vi: Khi allerdings đứng đầu câu, động từ chia phải đứng ngay sau ở vị trí thứ hai.
  - type: common_mistake
    wrong: Ich habe ihm zuletzt gesehen.
    right: Ich habe ihn zuletzt gesehen.
    target_lang: de
    note:
      vi: "Sehen đòi hỏi tân ngữ Akkusativ: ihn, không phải ihm."
  - type: summary
    points:
      - vi: "allerdings, jedenfalls, übrigens, schließlich, sowieso, ohnehin, insgesamt, zumindest, teilweise, ebenfalls."
      - vi: "vorhin, zuletzt, zunächst, zurzeit, weiterhin, bereits; hoffentlich, offenbar, anscheinend, eigentlich, sogar."
      - vi: "irgendwo, irgendwie, nirgends; trạng từ đứng đầu câu thì động từ chia ở vị trí thứ hai."
