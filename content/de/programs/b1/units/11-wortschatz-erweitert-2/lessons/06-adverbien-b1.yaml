title:
  vi: Trạng từ và từ nối thông dụng ở B1 (Wichtige Adverbien)
objectives:
  - vi: "Dùng các trạng từ nối ý và bày tỏ thái độ: allerdings, übrigens, schließlich, anscheinend."
  - vi: Nói về thời gian bằng vorhin, zuletzt, zunächst, zurzeit, weiterhin.
  - vi: "Vị trí các trạng từ trong câu: đầu câu, giữa câu và sau động từ."
