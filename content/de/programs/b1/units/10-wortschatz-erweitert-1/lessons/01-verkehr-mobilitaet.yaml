title:
  vi: Giao thông và di chuyển hằng ngày (Verkehr und Mobilität)
objectives:
  - vi: Nói về việc đi làm hằng ngày, giao thông công cộng và các phương tiện mới.
  - vi: "Hiểu biển báo và quy tắc đường phố: Einbahnstraße, Sackgasse, Zebrastreifen."
  - vi: Dùng động từ pendeln, ausweichen, umleiten và các danh từ ghép về giao thông.
estimated_minutes: 15
skills:
  - vocabulary
  - reading
