title:
  vi: Mua sắm, thanh toán và quyền người tiêu dùng (Einkaufen und Bezahlen)
objectives:
  - vi: Hiểu và dùng từ về giá cả, chất lượng và cách thanh toán.
  - vi: So sánh sản phẩm và giải thích lý do chọn mua.
  - vi: Hiểu các từ trên hợp đồng mua bán và chuyển khoản ngân hàng cơ bản.
