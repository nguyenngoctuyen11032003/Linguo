  - vi: Gọi tên dụng cụ, vật liệu và các hỏng hóc thường gặp trong nhà.
  - vi: Mô tả việc sửa chữa đơn giản bằng động từ montieren, befestigen, abdichten.
  - vi: Báo hỏng hóc cho chủ nhà hoặc thợ sửa chữa một cách rõ ràng.
