body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng hơn hai mươi động từ thông dụng B1, kể cả dạng bất quy tắc, trong câu chính, câu phụ và Perfekt.
  - type: explain
    text:
      vi: "Nhớ cả ba dạng chính khi học động từ bất quy tắc: bieten – bot – hat geboten, aufgeben – gab auf – hat aufgegeben, verbieten – verbot – hat verboten. Với động từ có tiền tố không tách như be-, ent-, er-, ver-, Partizip II không có ge-: betragen → betragen, enttäuschen → enttäuscht."
  - type: explain
    text:
      vi: "Động từ tách: annehmen, ansehen, aufgeben, ausgehen, eintragen, fortsetzen, stattfinden, anbieten, übernehmen (không tách). Ở câu chính, phần tách đứng cuối câu: Das Konzert findet am Samstag statt. Ở câu phụ, viết liền: …, weil das Konzert am Samstag stattfindet."
  - type: explain
    text:
      vi: "Một số động từ đi với giới từ hoặc cách đặc biệt: achten auf + Akkusativ (chú ý đến), überlegen (suy nghĩ, cân nhắc), sich ansehen (xem, nhìn kỹ) và nhớ gelingen dùng với Dativ: Der Plan ist mir gelungen. Chủ ngữ của gelingen thường là sự việc (der Plan), không phải người."
  - type: deep_explain
    text:
      vi: "Annehmen có hai nghĩa: nhận (ein Geschenk annehmen) và giả sử (Ich nehme an, dass er kommt). Betragen chỉ dùng cho số tiền hoặc thời lượng: Die Kosten betragen 50 Euro. Ausgehen là đi chơi buổi tối (Wir gehen heute Abend aus), hay hết, cạn (Das Benzin geht aus), cẩn thận ngữ cảnh."
  - type: example
    target: Bitte achten Sie auf die Stufe!
    target_lang: de
    translation:
      vi: Xin hãy chú ý bậc thang!
    note:
      vi: achten = chú ý, để ý (auf + Akk).
  - type: example
    target: Ich nehme an, dass der Zug pünktlich ist.
    target_lang: de
    translation:
      vi: Tôi cho rằng tàu đến đúng giờ.
    note:
      vi: annehmen = nhận, chấp nhận; giả sử.
  - type: example
    target: Wir sehen uns morgen die Wohnung an.
    target_lang: de
    translation:
      vi: Ngày mai chúng tôi đi xem căn hộ.
    note:
      vi: ansehen = nhìn kỹ, xem.
  - type: example
    target: Du darfst jetzt nicht aufgeben!
    target_lang: de
    translation:
      vi: Bây giờ bạn không được bỏ cuộc!
    note:
      vi: aufgeben = từ bỏ; gửi (thư, hành lý).
  - type: common_mistake
    wrong: Das Konzert stattfindet am Samstag.
    right: Das Konzert findet am Samstag statt.
    target_lang: de
    note:
      vi: "Stattfinden là động từ tách: findet ở vị trí thứ hai, statt đứng cuối câu."
  - type: common_mistake
    wrong: Der Plan hat mir gelungen.
    right: Der Plan ist mir gelungen.
    target_lang: de
    note:
      vi: "Gelingen dùng sein ở Perfekt: ist gelungen, và người đứng ở Dativ (mir)."
  - type: summary
    points:
      - vi: "bieten, anbieten, aufgeben, annehmen, behalten, betragen, eintragen, verbieten, übernehmen, unternehmen."
      - vi: "achten (auf), überlegen, erlauben, enttäuschen, überraschen, scheitern (ist gescheitert), gelingen (ist gelungen)."
      - vi: "stattfinden, fortsetzen, ansehen, ausgehen, eintragen: động từ tách nên phần tách đứng cuối câu chính."
