  - vi: Dùng chính xác hơn hai mươi động từ B1 với đầy đủ dạng chính.
  - vi: Phân biệt động từ có tiền tố tách và không tách.
  - vi: Dùng các động từ trong câu chính và câu phụ, ở hiện tại và Perfekt.
