body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được chi tiết về sở thích của mình và hỏi người khác về hoạt động giải trí, cùng cảm xúc đi kèm.
  - type: explain
    text:
      vi: "Từ chỉ sở thích: die Leidenschaft (niềm đam mê), der Zeitvertreib (thú tiêu khiển), das Hobby. Hoạt động thủ công: stricken (đan len), nähen (may), basteln (làm đồ thủ công), zeichnen (vẽ). Danh từ tương ứng: die Handarbeit, die Zeichnung. Sau động từ bạn thường thêm gern hoặc in meiner Freizeit."
  - type: explain
    text:
      vi: "Âm nhạc và trò chơi: das Instrument, der Chor, das Orchester, musizieren (chơi nhạc), das Brettspiel, das Kartenspiel, das Gesellschaftsspiel, der Spielabend. Ngoài trời: zelten, der Schlafsack, die Angel, der Campingplatz. Phần lớn là động từ có chia đều."
  - type: explain
    text:
      vi: "Để nói về cảm xúc, dùng begeistert von + Dativ: Ich bin begeistert vom neuen Brettspiel. Muốn nói chán, dùng sich langweilen: Ich langweile mich nie, wenn ich stricke. Chú ý sich langweilen là động từ phản thân, nghĩa là tự thấy buồn chán."
  - type: deep_explain
    text:
      vi: "Ở Đức có rất nhiều der Verein (câu lạc bộ) cho hầu như mọi sở thích: Schachverein, Chor, Wanderverein. Gia nhập Verein thường phải đóng phí hằng năm (der Mitgliedsbeitrag). Hobby như Stricken đang trở lại phổ biến với người trẻ; những buổi Spielabend với Gesellschaftsspiele cũng là dịp gặp gỡ rất thường thấy."
  - type: example
    target: Das Kochen ist seine große Leidenschaft.
    target_lang: de
    translation:
      vi: Nấu ăn là niềm đam mê lớn của anh ấy.
    note:
      vi: die Leidenschaft = niềm đam mê.
  - type: example
    target: Lesen ist mein liebster Zeitvertreib.
    target_lang: de
    translation:
      vi: Đọc sách là thú tiêu khiển yêu thích nhất của tôi.
    note:
      vi: der Zeitvertreib = thú tiêu khiển.
  - type: example
    target: Mein Opa ist ein leidenschaftlicher Sammler von Briefmarken.
    target_lang: de
    translation:
      vi: Ông tôi là người sưu tầm tem đầy đam mê.
    note:
      vi: der Sammler = người sưu tầm.
  - type: example
    target: Wir spielen am Abend ein Brettspiel.
    target_lang: de
    translation:
      vi: Buổi tối chúng tôi chơi một trò chơi trên bàn cờ.
    note:
      vi: das Brettspiel = trò chơi trên bàn cờ.
  - type: common_mistake
    wrong: Ich bin begeistert über das Konzert.
    right: Ich bin begeistert von dem Konzert.
    target_lang: de
    note:
      vi: Tính từ begeistert đi với von + Dativ, không dùng über.
  - type: common_mistake
    wrong: Ich langweile.
    right: Ich langweile mich.
    target_lang: de
    note:
      vi: Sich langweilen là động từ phản thân, cần đại từ mich/dich/sich.
  - type: summary
    points:
      - vi: "die Leidenschaft, der Zeitvertreib, der Sammler, die Handarbeit, das Rätsel, das Brettspiel, das Kartenspiel, das Gesellschaftsspiel, der Spielabend."
      - vi: "das Instrument, der Chor, das Orchester; musizieren; der Schlafsack, die Angel; zelten."
      - vi: "stricken, nähen, basteln, zeichnen; sich langweilen; begeistert von + Dativ, sportlich, musikalisch."
