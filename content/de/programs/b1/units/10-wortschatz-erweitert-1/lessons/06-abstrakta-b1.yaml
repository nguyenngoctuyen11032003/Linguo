title:
  vi: Danh từ trừu tượng thường gặp ở B1 (Abstrakte Nomen)
objectives:
  - vi: Nhớ mạo từ và số nhiều của các danh từ trừu tượng thường dùng.
  - vi: Nhận biết giống của danh từ qua các đuôi -ung, -heit, -keit.
  - vi: "Dùng chúng trong các cụm: eine Möglichkeit haben, einen Eindruck machen, ein Grund für."
estimated_minutes: 15
