body:
  - type: objective
    text:
      vi: Sau bài này, bạn chuẩn bị được một bài trình bày ngắn về tình nguyện hoặc hàng xóm, đọc hiểu thông báo trong toà nhà và viết được tin nhắn trang trọng khoảng 40 từ cho ban quản lý toà nhà.
  - type: explain
    text:
      vi: "Chuẩn bị bài trình bày: ghi Stichpunkte cho năm phần – chủ đề và dàn ý, kinh nghiệm bản thân, tình hình ở Việt Nam, ưu nhược điểm và ý kiến, kết luận. Mỗi phần bắt đầu bằng một câu chuyển ý đã học (Ich komme jetzt zu …), và nên có ít nhất một câu so sánh (besser, als ich dachte) và một câu dass hoặc cụm zu."
  - type: explain
    text:
      vi: "Khi đọc thông báo (Aushang) trong toà nhà, hãy tìm: ai viết, việc gì, hạn chót, điều gì bắt buộc và điều gì tự nguyện. Chú ý các từ khoá: freiwillig (tự nguyện), darf nicht (không được), muss nicht (không cần), bis zum … (đến hạn …)."
  - type: explain
    text:
      vi: "Theo cấu trúc tại thời điểm soạn bài, Goethe B1 Schreiben Teil 3 là tin nhắn trang trọng khoảng 40 từ, ví dụ xin lỗi vì không đến được hoặc hỏi thông tin; định dạng có thể thay đổi. Khung: Sehr geehrte Damen und Herren, / Sehr geehrte Frau …, – lý do viết – xin lỗi hoặc đề nghị – Mit freundlichen Grüßen + tên."
  - type: explain
    text:
      vi: "Ôn ngữ pháp của unit: cụm zu khi cùng chủ ngữ, dass khi khác chủ ngữ; tính từ phái sinh (-bar, -los, -voll, -lich, un-); câu so sánh als/wie với động từ đứng cuối; Redemittel thuyết trình."
  - type: deep_explain
    text:
      vi: "Trong thư trang trọng, Sie, Ihnen, Ihr luôn viết hoa; sau lời chào có dấu phẩy, nên dòng tiếp theo bắt đầu bằng chữ thường (Sehr geehrte Damen und Herren, leider …). Sau Mit freundlichen Grüßen không có dấu phẩy, tên viết ở dòng dưới. Với 40 từ, đừng mở đầu quá dài: một câu lý do, một câu xin lỗi hoặc đề nghị, một câu đề xuất giải pháp là đủ. Khi luyện nói, hãy bấm giờ: khoảng 3–4 phút cho phần trình bày, rồi luyện trả lời một hai câu hỏi của bạn học."
  - type: example
    target: "Sehr geehrte Damen und Herren, vielen Dank für die Information über den neuen Garten. Ich finde die Idee sehr gut und helfe gern mit. Leider kann ich am ersten Termin nicht kommen, weil ich arbeiten muss. Ab Juni habe ich samstags Zeit. Mit freundlichen Grüßen Minh Nguyen"
    target_lang: de
    translation:
      vi: "Kính gửi quý ông bà, cảm ơn quý vị về thông tin khu vườn mới. Tôi thấy ý tưởng này rất hay và sẵn lòng phụ giúp. Tiếc là tôi không thể đến buổi đầu tiên vì phải đi làm. Từ tháng Sáu tôi rảnh vào các ngày thứ Bảy. Trân trọng, Minh Nguyen"
    note:
      vi: "Tin nhắn mẫu khoảng 45 từ: chào trang trọng – cảm ơn – ý kiến – xin lỗi và lý do (weil, động từ cuối) – đề xuất – chào cuối."
  - type: example
    target: "Ich spreche heute über das Thema Nachbarschaft. Ich habe selbst erlebt, dass gute Nachbarn sehr wichtig sind. In meinem Viertel in Hanoi ist das etwas anders als hier: Dort kennt jeder jeden. Zum Schluss möchte ich kurz zusammenfassen: Mit Rücksicht und Kompromissen klappt das Zusammenleben besser, als man denkt."
    target_lang: de
    translation:
      vi: "Hôm nay tôi nói về chủ đề hàng xóm láng giềng. Chính tôi đã trải nghiệm rằng hàng xóm tốt rất quan trọng. Ở khu phố của tôi tại Hà Nội thì hơi khác ở đây: ở đó ai cũng biết mặt nhau. Cuối cùng tôi xin tóm tắt ngắn gọn: biết nghĩ cho nhau và biết nhường nhịn thì sống chung dễ hơn người ta tưởng."
    note:
      vi: "Bài trình bày rút gọn với đủ Redemittel: mở đầu, kinh nghiệm (dass), so sánh với Việt Nam, kết luận có câu so sánh als."
  - type: example
    target: Bitte denken Sie daran, dass die Ruhezeiten auch im Hof gelten.
    target_lang: de
    translation:
      vi: Xin quý vị lưu ý rằng giờ yên tĩnh cũng áp dụng ở sân.
    note:
      vi: "Câu hay gặp trong thông báo: denken an + Akkusativ → daran, dass … (động từ gelten ở cuối)."
  - type: common_mistake
    wrong: Mit freundlichen Grüße
    right: Mit freundlichen Grüßen
    target_lang: de
    note:
      vi: "mit + Dativ số nhiều: thêm -n – Grüßen."
  - type: common_mistake
    wrong: Sehr geehrte Damen und Herren, Leider kann ich nicht kommen.
    right: Sehr geehrte Damen und Herren, leider kann ich nicht kommen.
    target_lang: de
    note:
      vi: "Sau dấu phẩy của lời chào, câu tiếp theo bắt đầu bằng chữ thường (trừ danh từ và Sie)."
  - type: common_mistake
    wrong: Es ist wichtig, dass alle zu helfen.
    right: Es ist wichtig, dass alle helfen.
    target_lang: de
    note:
      vi: "Câu dass có chủ ngữ riêng (alle) và động từ chia ở cuối, không có zu."
  - type: summary
    points:
      - vi: "Trình bày: 5 phần, Stichpunkte, câu chuyển ý, ít nhất một câu so sánh và một câu dass/zu."
      - vi: "Đọc thông báo: ai – việc gì – hạn chót – bắt buộc hay tự nguyện (freiwillig, darf nicht, muss nicht)."
      - vi: "Tin nhắn trang trọng ~40 từ: Sehr geehrte … – lý do – xin lỗi/đề nghị – Mit freundlichen Grüßen."
      - vi: "Sau lời chào: chữ thường; Sie/Ihnen/Ihr viết hoa; mit freundlichen Grüßen (Dativ số nhiều)."
      - vi: "Ngữ pháp: zu khi cùng chủ ngữ, dass khi khác chủ ngữ; -bar/-los/-voll/un-; als/wie + câu phụ."
exercises:
  # ---------------- recognition: đọc (kiểu Lesen) ----------------
  - key: de:exercise:b1u09l5-mcq-aushang-freiwillig
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-freiwillig
    prompt:
      stem: "Liebe Mieterinnen und Mieter, ab Juni gibt es im Hof einen gemeinsamen Garten. Die Arbeit im Garten ist freiwillig. Wer mithelfen möchte, kann sich bis zum 15. Mai bei uns melden. Bitte denken Sie daran, dass die Ruhezeiten auch im Hof gelten: Nach 22 Uhr darf man dort nicht mehr laut feiern. Wir hoffen, dass der Garten die Nachbarschaft stärkt. Ihre Hausverwaltung — Richtig oder falsch? Alle Mieter müssen im Garten mitarbeiten."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Thông báo viết: Die Arbeit im Garten ist freiwillig – việc làm vườn là tự nguyện, ai muốn mới đăng ký (Wer mithelfen möchte …). Câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u09l5-mcq-aushang-melden
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-sich-engagieren
    prompt:
      stem: "Liebe Mieterinnen und Mieter, ab Juni gibt es im Hof einen gemeinsamen Garten. Die Arbeit im Garten ist freiwillig. Wer mithelfen möchte, kann sich bis zum 15. Mai bei uns melden. Bitte denken Sie daran, dass die Ruhezeiten auch im Hof gelten: Nach 22 Uhr darf man dort nicht mehr laut feiern. Wir hoffen, dass der Garten die Nachbarschaft stärkt. Ihre Hausverwaltung — Richtig oder falsch? Wer mitmachen möchte, soll sich bis Mitte Mai melden."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
