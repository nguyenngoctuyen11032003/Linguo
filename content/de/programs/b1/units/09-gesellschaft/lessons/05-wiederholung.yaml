    explanation:
      vi: "kann sich bis zum 15. Mai bei uns melden = đăng ký đến ngày 15 tháng Năm, tức là giữa tháng Năm (Mitte Mai). mitmachen và mithelfen cùng ý tham gia, nên câu này đúng."
    display_answer: Richtig

  - key: de:exercise:b1u09l5-mcq-aushang-ruhezeit
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-ruhezeit
    prompt:
      stem: "Liebe Mieterinnen und Mieter, ab Juni gibt es im Hof einen gemeinsamen Garten. Die Arbeit im Garten ist freiwillig. Wer mithelfen möchte, kann sich bis zum 15. Mai bei uns melden. Bitte denken Sie daran, dass die Ruhezeiten auch im Hof gelten: Nach 22 Uhr darf man dort nicht mehr laut feiern. Wir hoffen, dass der Garten die Nachbarschaft stärkt. Ihre Hausverwaltung — Richtig oder falsch? Im Garten darf man auch nach 22 Uhr laut feiern."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "die Ruhezeiten gelten auch im Hof: Nach 22 Uhr darf man dort nicht mehr laut feiern – sau 22 giờ không được tiệc tùng ồn ào ở sân (nơi có khu vườn). Câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u09l5-mcq-aushang-nachbarschaft
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-nachbarschaft
    prompt:
      stem: "Liebe Mieterinnen und Mieter, ab Juni gibt es im Hof einen gemeinsamen Garten. Die Arbeit im Garten ist freiwillig. Wer mithelfen möchte, kann sich bis zum 15. Mai bei uns melden. Bitte denken Sie daran, dass die Ruhezeiten auch im Hof gelten: Nach 22 Uhr darf man dort nicht mehr laut feiern. Wir hoffen, dass der Garten die Nachbarschaft stärkt. Ihre Hausverwaltung — Richtig oder falsch? Die Hausverwaltung glaubt, dass der Garten gut für die Nachbarschaft ist."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "Wir hoffen, dass der Garten die Nachbarschaft stärkt – ban quản lý hy vọng khu vườn làm tình hàng xóm gắn bó hơn, tức là tốt cho khu nhà. Câu này đúng."
    display_answer: Richtig

  # ---------------- recognition: nghe ----------------
  - key: de:exercise:b1u09l5-listen-verein
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u09-g-praesentation-redemittel
    prompt:
      audio_asset_id: null
      fallback_text: Ich habe selbst erlebt, wie schön es ist, in einem Verein mitzumachen. Seitdem engagiere ich mich jeden Samstag ehrenamtlich.
      options:
        - { id: v2a, text: "Người nói đã tự trải nghiệm niềm vui khi tham gia một hội, và từ đó thứ Bảy nào cũng làm tình nguyện.", lang: vi }
        - { id: v6b, text: "Người nói muốn tham gia một hội nhưng chưa có thời gian.", lang: vi }
        - { id: v9c, text: "Người nói làm việc có lương ở một hội vào mỗi thứ Bảy.", lang: vi }
        - { id: v4d, text: "Người nói đã từng tham gia một hội nhưng bây giờ thì không nữa.", lang: vi }
    answer:
      correct_option_id: v2a
    explanation:
      vi: "Ich habe selbst erlebt, wie schön es ist, … mitzumachen = chính tôi đã thấy tham gia vui thế nào. Seitdem engagiere ich mich … ehrenamtlich = từ đó tôi làm tình nguyện (không lương), và vẫn đang làm (Präsens)."
    display_answer: Người nói đã tự trải nghiệm niềm vui khi tham gia một hội, và từ đó thứ Bảy nào cũng làm tình nguyện.

  - key: de:exercise:b1u09l5-listen-streit
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u09-sich-einigen
    prompt:
      audio_asset_id: null
      fallback_text: Danke für Ihre Frage. Der Streit mit den Nachbarn war schwieriger, als ich gedacht hatte. Aber am Ende haben wir uns geeinigt.
      options:
        - { id: t3a, text: "Mâu thuẫn với hàng xóm khó hơn người nói nghĩ, nhưng cuối cùng họ đã thống nhất được.", lang: vi }
        - { id: t7b, text: "Mâu thuẫn với hàng xóm dễ hơn người nói nghĩ, và họ thống nhất ngay.", lang: vi }
        - { id: t1c, text: "Mâu thuẫn với hàng xóm khó hơn người nói nghĩ, và đến giờ vẫn chưa giải quyết được.", lang: vi }
        - { id: t5d, text: "Người nói không muốn trả lời câu hỏi về hàng xóm.", lang: vi }
    answer:
      correct_option_id: t3a
    explanation:
      vi: "schwieriger, als ich gedacht hatte = khó hơn tôi đã nghĩ; am Ende haben wir uns geeinigt = cuối cùng chúng tôi đã thống nhất được (sich einigen)."
    display_answer: Mâu thuẫn với hàng xóm khó hơn người nói nghĩ, nhưng cuối cùng họ đã thống nhất được.

  # ---------------- recall ----------------
  - key: de:exercise:b1u09l5-fill-formell
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-hausordnung
    prompt:
      template: "Sehr geehrte Damen und {{b1}}, ich habe eine Frage zur Hausordnung: Darf man im Hof grillen? Ich freue mich auf Ihre {{b2}}. Mit freundlichen {{b3}} Minh Nguyen"
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 8 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [Herren]
        b2: [Antwort]
        b3: [Grüßen]
    known_wrong:
      - answer: Herr
        feedback_vi: Lời chào chung dùng số nhiều – Damen und Herren.
        error_tag: plural_form
      - answer: Grüße
        feedback_vi: mit + Dativ số nhiều cần thêm -n – Mit freundlichen Grüßen.
        error_tag: case_dat_akk
    explanation:
      vi: "Khung tin nhắn trang trọng: Sehr geehrte Damen und Herren (số nhiều), câu hỏi ngắn, Ich freue mich auf Ihre Antwort (sich freuen auf + Akkusativ; Ihre viết hoa), Mit freundlichen Grüßen (mit + Dativ số nhiều, đuôi -en)."
    display_answer: "Sehr geehrte Damen und Herren, ich habe eine Frage zur Hausordnung: Darf man im Hof grillen? Ich freue mich auf Ihre Antwort. Mit freundlichen Grüßen Minh Nguyen"

  - key: de:exercise:b1u09l5-fill-sinnvoll-anlegen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-wortbildung-adjektiv
    prompt:
      template: "Ich finde es {{b1}} (Sinn + voll), im Hof einen gemeinsamen Garten {{b2}} (anlegen)."
      blanks:
        - { id: b1, width_hint: 9 }
        - { id: b2, width_hint: 10 }
    answer:
      blanks:
        b1: [sinnvoll]
        b2: [anzulegen]
    known_wrong:
      - answer: zu anlegen
        feedback_vi: anlegen là động từ tách, zu chen vào giữa – anzulegen.
        error_tag: zu_infinitive
      - answer: anlegen
        feedback_vi: Sau Ich finde es + tính từ cần cụm zu – anzulegen.
        error_tag: zu_infinitive
    explanation:
      vi: "der Sinn + -voll = sinnvoll (hợp lý, có ý nghĩa). Ich finde es sinnvoll, … zu + nguyên thể: anlegen (tạo, làm vườn) là động từ tách nên thành anzulegen."
    display_answer: Ich finde es sinnvoll, im Hof einen gemeinsamen Garten anzulegen.

  # ---------------- application ----------------
  - key: de:exercise:b1u09l5-wb-ruecksicht-nehmen
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-ruecksicht
    prompt:
      instruction: "Sắp xếp thành câu: \"Chúng tôi hy vọng tất cả hàng xóm đều biết nghĩ cho người khác.\""
      tokens:
        - { id: w-nehmen, text: nehmen }
        - { id: w-dass, text: dass }
        - { id: w-wir, text: Wir }
        - { id: w-ruecksicht, text: Rücksicht }
        - { id: w-komma, text: "," }
        - { id: w-alle, text: alle }
        - { id: w-hoffen, text: hoffen }
        - { id: w-nachbarn, text: Nachbarn }
    answer:
      orders:
        - [w-wir, w-hoffen, w-komma, w-dass, w-alle, w-nachbarn, w-ruecksicht, w-nehmen]
    explanation:
      vi: "Người hy vọng (wir) khác người làm (alle Nachbarn) → dass. Trong câu dass, động từ chia nehmen đứng cuối, sau Rücksicht (Rücksicht nehmen = biết nghĩ cho người khác)."
    display_answer: Wir hoffen, dass alle Nachbarn Rücksicht nehmen.

  - key: de:exercise:b1u09l5-wb-wichtig-zu-sein
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-zu-infinitiv-dass
    prompt:
      instruction: "Sắp xếp thành câu: \"Biết nghĩ cho người khác là điều quan trọng.\""
      tokens:
        - { id: z-sein, text: sein }
        - { id: z-wichtig, text: wichtig }
        - { id: z-es, text: Es }
        - { id: z-zu, text: zu }
        - { id: z-rv, text: rücksichtsvoll }
        - { id: z-komma, text: "," }
        - { id: z-ist, text: ist }
    answer:
      orders:
        - [z-es, z-ist, z-wichtig, z-komma, z-rv, z-zu, z-sein]
    explanation:
      vi: "Es ist wichtig + cụm zu (người làm là \"người ta\" nói chung). Trong cụm zu, tính từ rücksichtsvoll đứng trước, zu sein ở cuối."
    display_answer: Es ist wichtig, rücksichtsvoll zu sein.

  - key: de:exercise:b1u09l5-tr-treffen-absagen
    type: translate
    stage: application
    answer_lang: de
