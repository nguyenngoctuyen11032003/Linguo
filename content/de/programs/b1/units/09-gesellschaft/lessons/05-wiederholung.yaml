    item: de:item:b1u09-g-zu-infinitiv-dass
    prompt:
      source_text: "Rất tiếc tôi không thể đến buổi họp. (thư trang trọng; buổi họp = das Treffen)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Leider kann ich nicht zum Treffen kommen.
        - Ich kann leider nicht zum Treffen kommen.
        - Leider kann ich zum Treffen nicht kommen.
        - Es tut mir leid, dass ich nicht zum Treffen kommen kann.
        - Es tut mir leid, nicht zum Treffen kommen zu können.
        - Leider kann ich nicht an dem Treffen teilnehmen.
        - Ich kann leider nicht an dem Treffen teilnehmen.
        - Leider kann ich am Treffen nicht teilnehmen.
        - Ich kann leider am Treffen nicht teilnehmen.
        - Es tut mir leid, dass ich nicht an dem Treffen teilnehmen kann.
        - Es tut mir leid, dass ich am Treffen nicht teilnehmen kann.
    known_wrong:
      - answer: Es tut mir leid, dass ich kann nicht zum Treffen kommen.
        feedback_vi: Trong câu dass, động từ chia kann đứng cuối – dass ich nicht zum Treffen kommen kann.
        error_tag: verb_position
      - answer: Es tut mir leid, nicht zum Treffen zu kommen können.
        feedback_vi: Trong cụm zu có modal, zu đứng trước modal ở cuối – kommen zu können.
        error_tag: zu_infinitive
      - answer: Leider ich kann nicht zum Treffen kommen.
        feedback_vi: Leider đứng ở vị trí 1 thì động từ kann ở vị trí 2 – Leider kann ich …
        error_tag: verb_position
    explanation:
      vi: "Cách gọn nhất: Leider kann ich nicht zum Treffen kommen (kann vị trí 2, kommen cuối câu). Cũng có thể dùng Es tut mir leid, dass … (động từ kann ở cuối) hoặc cụm zu cùng chủ ngữ: …, nicht zum Treffen kommen zu können."
    display_answer: Leider kann ich nicht zum Treffen kommen.

