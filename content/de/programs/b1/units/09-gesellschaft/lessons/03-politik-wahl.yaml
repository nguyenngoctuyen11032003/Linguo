  - key: de:exercise:b1u09l3-mcq-als-wie
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-g-vergleichssatz
    prompt:
      stem: "Chọn từ đúng: Die Wahl war knapper, ___ viele gedacht hatten."
      stem_lang: vi
      options:
        - { id: a2a, text: "als", lang: de }
        - { id: a6b, text: "wie", lang: de }
        - { id: a9c, text: "dass", lang: de }
        - { id: a4d, text: "wenn", lang: de }
    answer:
      correct_option_id: a2a
    explanation:
      vi: "Trước ô trống là so sánh hơn knapper, nên dùng als. wie dùng sau so + tính từ nguyên dạng (so knapp, wie …); besser wie chỉ là khẩu ngữ vùng miền. dass và wenn không dùng để so sánh."
    display_answer: als

  - key: de:exercise:b1u09l3-listen-erwartet
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u09-erwarten
    prompt:
      audio_asset_id: null
      fallback_text: Wie erwartet hat die Kandidatin gewonnen. Aber das Ergebnis war viel knapper, als man dachte.
      options:
        - { id: e1a, text: "Đúng như dự đoán, nữ ứng cử viên đã thắng, nhưng kết quả sát nút hơn nhiều so với người ta nghĩ.", lang: vi }
        - { id: e5b, text: "Trái với dự đoán, nữ ứng cử viên đã thắng với cách biệt lớn.", lang: vi }
        - { id: e8c, text: "Đúng như dự đoán, nữ ứng cử viên đã thua sát nút.", lang: vi }
        - { id: e3d, text: "Nữ ứng cử viên đã thắng, và kết quả đúng như người ta nghĩ.", lang: vi }
    answer:
      correct_option_id: e1a
    explanation:
      vi: "Wie erwartet = đúng như dự đoán; hat … gewonnen = đã thắng. viel knapper, als man dachte = sát nút hơn nhiều so với người ta nghĩ (không phải đúng như người ta nghĩ)."
    display_answer: Đúng như dự đoán, nữ ứng cử viên đã thắng, nhưng kết quả sát nút hơn nhiều so với người ta nghĩ.

  # ---------------- recall ----------------
  - key: de:exercise:b1u09l3-fill-knapper-als-so
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-vergleichssatz
    prompt:
      template: "Die Wahl war {{b1}} (knapp), {{b2}} viele gedacht haben. Und der Wahlabend war nicht {{b3}} langweilig, wie ich befürchtet hatte."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 3 }
    answer:
      blanks:
        b1: [knapper]
        b2: [als]
        b3: [so]
    known_wrong:
      - answer: knapp
        feedback_vi: Có so sánh (… als …) nên cần so sánh hơn – knapper.
        error_tag: comparative_form
      - answer: wie
        feedback_vi: Sau so sánh hơn (knapper), tiếng Đức chuẩn dùng als.
        error_tag: comparative_form
      - answer: sehr
        feedback_vi: Cặp so sánh bằng là so … wie – nicht so langweilig, wie …
        error_tag: comparative_form
    explanation:
      vi: "knapp → knapper; sau so sánh hơn là als + câu phụ (động từ haben ở cuối). So sánh bằng/phủ định: nicht so + tính từ + wie + câu phụ."
    display_answer: "Die Wahl war knapper, als viele gedacht haben. Und der Wahlabend war nicht so langweilig, wie ich befürchtet hatte."

  - key: de:exercise:b1u09l3-tr-besser-als
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-vergleichssatz
    prompt:
      source_text: "Kết quả tốt hơn tôi nghĩ. (das Ergebnis; dùng câu phụ als … dachte)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Das Ergebnis war besser, als ich dachte.
        - Das Ergebnis ist besser, als ich dachte.
        - Das Ergebnis war besser, als ich gedacht habe.
        - Das Ergebnis war besser, als ich gedacht hatte.
        - Das Ergebnis ist besser, als ich gedacht habe.
        - Das Ergebnis ist besser, als ich gedacht hatte.
    known_wrong:
      - answer: Das Ergebnis war besser, wie ich dachte.
        feedback_vi: Sau so sánh hơn (besser) dùng als, không dùng wie.
        error_tag: comparative_form
      - answer: Das Ergebnis war besser, als ich habe gedacht.
        feedback_vi: "Câu phụ als: động từ chia đứng cuối – als ich gedacht habe."
        error_tag: verb_position
      - answer: Das Ergebnis war mehr gut, als ich dachte.
        feedback_vi: So sánh hơn của gut là besser (bất quy tắc), không dùng mehr gut.
        error_tag: comparative_form
    explanation:
      vi: "gut → besser (bất quy tắc). Sau so sánh hơn: dấu phẩy + als + câu phụ, động từ chia (dachte) đứng cuối."
    display_answer: Das Ergebnis war besser, als ich dachte.

  - key: de:exercise:b1u09l3-tr-jede-stimme
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-stimme
    prompt:
      source_text: "Mỗi lá phiếu đều có giá trị!"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Jede Stimme zählt!
        - Jede Stimme zählt.
        - Jede Stimme ist wichtig!
        - Jede Stimme ist wichtig.
    known_wrong:
      - answer: Jeder Stimme zählt!
        feedback_vi: die Stimme là giống cái – jede Stimme.
        error_tag: gender
      - answer: Jede Stimme zählen!
        feedback_vi: Chủ ngữ jede Stimme là số ít – zählt.
        error_tag: verb_form
    explanation:
      vi: "die Stimme (lá phiếu) giống cái → jede Stimme. zählen ở đây nghĩa là \"có giá trị, được tính\": Jede Stimme zählt."
    display_answer: Jede Stimme zählt!

