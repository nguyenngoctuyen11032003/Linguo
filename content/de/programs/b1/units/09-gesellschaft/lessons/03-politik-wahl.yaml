body:
  - type: objective
    text:
      vi: "Sau bài này, bạn đọc được một bản tin bầu cử ngắn và so sánh kỳ vọng với kết quả, ví dụ: \"Die Wahl war knapper, als viele gedacht hatten. Wie erwartet hat die Kandidatin gewonnen.\""
  - type: explain
    text:
      vi: "Ở A1 bạn đã so sánh với một danh từ: größer als Berlin. Khi phần sau là cả một câu, als mở đầu câu phụ: động từ chia đứng cuối và trước als có dấu phẩy – Die Wahl war knapper, als viele gedacht hatten."
  - type: explain
    text:
      vi: "Để nói \"(không) … bằng\" với một câu, dùng so + tính từ + wie + câu phụ: Es war nicht so schwer, wie ich dachte. Cách nói cố định: so schnell, wie es geht = nhanh nhất có thể (cũng nói so schnell wie möglich)."
  - type: explain
    text:
      vi: "Không có động từ thì không cần dấu phẩy: besser als erwartet, wie erwartet, anders als gedacht. Trong văn nói một số vùng có \"besser wie\", nhưng tiếng Đức chuẩn sau so sánh hơn dùng als."
  - type: explain
    text:
      vi: "Đức là nhà nước liên bang gồm 16 bang (Bundesländer), quốc hội liên bang là der Bundestag; Áo có 9 bang; Thụy Sĩ có 26 bang (Kantone), và người dân Thụy Sĩ thường bỏ phiếu trực tiếp về nhiều vấn đề. Các quy định cụ thể về bầu cử (tuổi được bầu, cách bỏ phiếu) có thể thay đổi, nên khi cần hãy xem thông tin chính thức."
  - type: deep_explain
    text:
      vi: "Thì trong câu als/wie đi theo thời điểm của kỳ vọng: als ich dachte (Präteritum), als ich gedacht habe (Perfekt, văn nói) hoặc als ich gedacht hatte (Plusquamperfekt – kỳ vọng có trước kết quả). Các cách so sánh hay gặp trong tin tức: mehr Menschen, als man erwartet hatte; weniger, als viele befürchtet hatten; genauso knapp wie beim letzten Mal; anders, als die Umfragen gezeigt hatten. Đừng nhầm als so sánh với als thời gian (Als ich ein Kind war …) – hãy nhìn xem trước nó có so sánh hơn hay không. Khi đọc tin bầu cử, chú ý từ chỉ mức độ: knapp (sát nút), deutlich (rõ rệt), die Mehrheit (đa số). Ở Đức, đi bầu là quyền chứ không phải nghĩa vụ, và lá phiếu là bí mật – hỏi người khác đã bầu cho ai thường bị coi là tế nhị."
  - type: example
    target: Die Wahl war knapper, als viele gedacht hatten.
    target_lang: de
    translation:
      vi: Cuộc bầu cử sát nút hơn nhiều người đã nghĩ.
    note:
      vi: "knapp → knapper (so sánh hơn) + als + câu phụ; động từ hatten đứng cuối."
  - type: example
    target: Das Ergebnis war nicht so schlecht, wie die Zeitungen geschrieben hatten.
    target_lang: de
    translation:
      vi: Kết quả không tệ như báo chí đã viết.
    note:
      vi: "nicht so + tính từ nguyên dạng + wie + câu phụ; trước wie có dấu phẩy vì sau đó là cả một câu."
  - type: example
    target: Wie erwartet hat die Mehrheit für das neue Schwimmbad gestimmt.
    target_lang: de
    translation:
      vi: Đúng như dự đoán, đa số đã bỏ phiếu ủng hộ bể bơi mới.
    note:
      vi: "wie erwartet không có động từ chia nên không cần dấu phẩy; cả cụm đứng đầu câu nên hat ở vị trí 2."
  - type: example
    target: In Deutschland ist Wählen ein Recht, aber keine Pflicht.
    target_lang: de
    translation:
      vi: Ở Đức, đi bầu là quyền chứ không phải nghĩa vụ.
    note:
      vi: "das Wählen (danh từ hoá từ wählen) viết hoa. Recht và Pflicht là hai từ hay đi cặp: Rechte und Pflichten."
  - type: example
    target: Jeder Mensch hat das Recht, seine Meinung frei zu sagen.
    target_lang: de
    translation:
      vi: Mỗi người đều có quyền tự do nói lên ý kiến của mình.
    note:
      vi: "das Recht, … zu + nguyên thể (ôn bài 1): người nói ý kiến chính là chủ ngữ jeder Mensch."
  - type: example
    target: Die nächste Wahl wird wahrscheinlich knapper werden, als viele denken.
    target_lang: de
    translation:
      vi: Cuộc bầu cử tới có lẽ sẽ sát nút hơn nhiều người nghĩ.
    note:
      vi: "Futur I (werden + nguyên thể, ôn B1U06) kết hợp với câu so sánh: knapper werden, als …"
  - type: common_mistake
    wrong: Das Ergebnis war besser wie ich dachte.
    right: Das Ergebnis war besser, als ich dachte.
    target_lang: de
    note:
      vi: "Sau so sánh hơn, tiếng Đức chuẩn dùng als (besser wie chỉ là khẩu ngữ vùng miền); trước câu phụ cần dấu phẩy."
  - type: common_mistake
    wrong: Die Wahl war knapper, als ich habe gedacht.
    right: Die Wahl war knapper, als ich gedacht habe.
    target_lang: de
    note:
      vi: "als mở đầu câu phụ nên động từ chia (habe) đứng cuối, sau Partizip gedacht."
  - type: common_mistake
    wrong: Die Wahl war mehr knapp, als man dachte.
    right: Die Wahl war knapper, als man dachte.
    target_lang: de
    note:
      vi: "Tiếng Đức tạo so sánh hơn bằng đuôi -er (knapper), không dùng mehr như \"hơn\" trong tiếng Việt."
  - type: summary
    points:
      - vi: "So sánh hơn + als + câu phụ (động từ cuối): knapper, als viele gedacht hatten."
      - vi: "(nicht) so + tính từ + wie + câu phụ: nicht so schwer, wie ich dachte."
      - vi: "Không có động từ → không dấu phẩy: besser als erwartet, wie erwartet."
      - vi: "Chuẩn: besser als (không phải besser wie)."
      - vi: "Từ vựng: die Politik, die Wahl, wählen, die Partei, die Regierung, der Bürger, die Demokratie, das Recht, die Pflicht."
      - vi: "Đức 16 bang (Bundestag), Áo 9 bang, Thụy Sĩ 26 Kantone và dân chủ trực tiếp."
