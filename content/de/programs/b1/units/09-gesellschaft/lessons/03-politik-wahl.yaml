  # ---------------- recognition ----------------
  - key: de:exercise:b1u09l3-mcq-lesen-knapp
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-knapp
    prompt:
      stem: "Bürgermeisterwahl: Das Ergebnis war knapper, als viele erwartet hatten. Die Kandidatin Anna Keller bekam 50,8 Prozent der Stimmen, ihr Gegenkandidat Peter Brandt 49,2 Prozent. Es sind mehr Bürgerinnen und Bürger wählen gegangen als bei der letzten Wahl. Am Abend sagte Frau Keller: Ich freue mich sehr, aber es war nicht so leicht, wie manche gedacht haben. — Richtig oder falsch? Anna Keller hat mit großem Abstand gewonnen."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Das Ergebnis war knapper, als viele erwartet hatten – kết quả sát nút hơn dự đoán: 50,8 so với 49,2 phần trăm. mit großem Abstand = cách biệt lớn, nên câu này sai."
    display_answer: Falsch

