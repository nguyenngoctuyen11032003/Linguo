body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được về nội quy toà nhà và nhắc hàng xóm lịch sự, ví dụ: \"Entschuldigung, die Musik ist sehr laut. Könnten Sie sie bitte etwas leiser machen? Laut Hausordnung ist ab 22 Uhr Ruhezeit.\""
  - type: explain
    text:
      vi: "-bar gắn vào gốc động từ và thường mang nghĩa \"có thể được …\": machen → machbar (làm được), essen → essbar (ăn được), erreichen → erreichbar (đến được, liên lạc được). Gần giống tiếng Việt thêm \"được\" sau động từ. Ngoại lệ: khi -bar gắn vào danh từ, nghĩa khác hẳn: dankbar (biết ơn, từ der Dank), fruchtbar (màu mỡ)."
  - type: explain
    text:
      vi: "-los nghĩa là \"không có\", -voll nghĩa là \"đầy, có nhiều\": arbeitslos (không có việc), rücksichtslos (không biết nghĩ cho người khác) ↔ rücksichtsvoll (biết nghĩ cho người khác). Một số từ có âm nối -s- ở giữa: Rücksicht + s + voll."
  - type: explain
    text:
      vi: "-lich, -ig, -isch thường biến danh từ (đôi khi động từ) thành tính từ: der Freund → freundlich, der Friede(n) → friedlich, die Ruhe → ruhig, die Praxis → praktisch. Nghĩa không phải lúc nào cũng đoán thẳng được: freundlich là \"thân thiện\", không phải \"thuộc về bạn bè\". un- đứng đầu để phủ định – giống \"không, bất\" trong tiếng Việt: unmöglich (không thể), unfreundlich (không thân thiện)."
  - type: explain
    text:
      vi: "Khi có chuyện với hàng xóm, người Đức thường nói trực tiếp nhưng lịch sự, dùng Konjunktiv II: Könnten Sie bitte …? Würden Sie bitte …? Giờ yên tĩnh (Ruhezeit) thường là ban đêm, khoảng 22 đến 6 giờ, và ở nhiều nơi cả Chủ nhật, ngày lễ; giờ cụ thể tuỳ nội quy nhà và quy định địa phương."
  - type: deep_explain
    text:
      vi: "Cấu tạo từ giúp bạn đoán nghĩa khi đọc: unbezahlbar = không trả nổi (un- + bezahlen + -bar), hilflos = bất lực, không tự xoay xở được (không có sự giúp đỡ), verständlich = hiểu được, dễ hiểu. Tuy vậy, đừng tự tạo từ mới chỉ theo quy tắc: không phải gốc nào cũng ghép được với mọi hậu tố, và với tính từ đã có từ trái nghĩa riêng (teuer – billig, laut – leise), người Đức dùng từ đó thay vì thêm un-; khi không chắc, dùng nicht: Das ist nicht machbar. Đuôi -ig theo chuẩn phát âm đọc giống -ich (ruhig), ở miền Nam nước Đức, Áo và Thụy Sĩ hay đọc là -ik. Chữ laut còn là giới từ \"theo\" trong văn bản: laut Hausordnung = theo nội quy. Nếu nói chuyện trực tiếp không giải quyết được, người thuê nhà thường báo cho chủ nhà hoặc ban quản lý toà nhà (die Hausverwaltung); cách xử lý cụ thể có thể khác nhau."
  - type: example
    target: Laut Hausordnung ist von 22 bis 6 Uhr Ruhezeit.
    target_lang: de
    translation:
      vi: Theo nội quy toà nhà, từ 22 giờ đến 6 giờ là giờ yên tĩnh.
    note:
      vi: "laut ở đây là giới từ \"theo\", không phải tính từ \"ồn\". Ruhezeit đứng không mạo từ sau ist, giống Feierabend."
  - type: example
    target: Entschuldigung, die Musik ist sehr laut. Könnten Sie sie bitte etwas leiser machen?
    target_lang: de
    translation:
      vi: Xin lỗi, nhạc to quá. Anh/chị có thể vặn nhỏ một chút được không?
    note:
      vi: "Nói với hàng xóm không thân: dùng Sie. Könnten Sie bitte …? lịch sự hơn nhiều so với câu mệnh lệnh."
  - type: example
    target: Unsere neue Nachbarin ist sehr rücksichtsvoll. Sie lässt nach 22 Uhr nie die Waschmaschine laufen.
    target_lang: de
    translation:
      vi: Cô hàng xóm mới của chúng tôi rất ý tứ. Cô ấy không bao giờ cho máy giặt chạy sau 22 giờ.
    note:
      vi: "rücksichtsvoll = Rücksicht + s + voll: đầy sự ý tứ."
  - type: example
    target: In der Ruhezeit darf man nicht bohren, aber man muss natürlich nicht flüstern.
    target_lang: de
    translation:
      vi: Trong giờ yên tĩnh không được khoan tường, nhưng tất nhiên không cần phải nói thì thầm.
    note:
      vi: "nicht dürfen = không được phép; nicht müssen = không cần (ôn A2)."
  - type: example
    target: Wir haben lange diskutiert und uns schließlich auf einen Kompromiss geeinigt.
    target_lang: de
    translation:
      vi: Chúng tôi đã bàn bạc lâu và cuối cùng thống nhất được một giải pháp dung hoà.
    note:
      vi: "sich einigen auf + Akkusativ; Perfekt: haben … geeinigt, đại từ uns đứng ngay sau haben và chủ ngữ."
  - type: example
    target: Wir brauchen nicht gleich die Hausverwaltung anzurufen. Reden wir zuerst mit dem Nachbarn!
    target_lang: de
    translation:
      vi: Chúng ta không cần gọi ngay cho ban quản lý toà nhà. Trước hết hãy nói chuyện với hàng xóm đã!
    note:
      vi: "nicht brauchen + zu = không cần (ôn B1U04); anrufen tách → anzurufen. dem Nachbarn: der Nachbar biến cách yếu."
  - type: example
    target: Ab 22 Uhr ist die Haustür abgeschlossen.
    target_lang: de
    translation:
      vi: Từ 22 giờ cửa ra vào toà nhà được khoá.
    note:
      vi: "sein + Partizip II = bị động trạng thái (ôn B1U07): cửa đang ở trạng thái đã khoá. Đây là ví dụ, giờ khoá cửa tuỳ từng toà nhà."
  - type: example
    target: Seit unserem Gespräch hört er nachts keine laute Musik mehr.
    target_lang: de
    translation:
      vi: Từ sau cuộc nói chuyện của chúng tôi, anh ấy không còn nghe nhạc to vào ban đêm nữa.
    note:
      vi: "kein … mehr = không còn … nữa (ôn B1U05); seit + Dativ: seit unserem Gespräch."
  - type: common_mistake
    wrong: Die Nachbarn sind heute unlaut.
    right: Die Nachbarn sind heute leise.
    target_lang: de
    note:
      vi: "laut đã có từ trái nghĩa riêng (leise), nên không ghép un-. Đừng tự tạo từ un- mới; khi không chắc, dùng nicht: nicht laut."
  - type: common_mistake
    wrong: Sie sind rücksichtslos! Machen Sie sofort die Musik leiser!
    right: Entschuldigung, könnten Sie die Musik bitte etwas leiser machen?
    target_lang: de
    note:
      vi: "Câu đầu đúng ngữ pháp nhưng quá nặng và ra lệnh; với hàng xóm, hãy mở đầu bằng Entschuldigung và hỏi bằng Könnten Sie bitte …?"
  - type: common_mistake
    wrong: Die Musik stört mir.
    right: Die Musik stört mich.
    target_lang: de
    note:
      vi: "stören đi với Akkusativ: mich, dich, uns."
  - type: common_mistake
    wrong: Unsere Nachbarn sind sehr rücksichtvoll.
    right: Unsere Nachbarn sind sehr rücksichtsvoll.
    target_lang: de
    note:
      vi: "Có âm nối -s-: Rücksicht + s + voll, cũng như rücksichtslos."
  - type: summary
    points:
      - vi: "-bar = có thể được (machbar); -los = không có (rücksichtslos); -voll = đầy (rücksichtsvoll)."
      - vi: "-lich, -ig, -isch tạo tính từ: freundlich, friedlich, ruhig, praktisch; un- = phủ định: unmöglich."
      - vi: "Đoán nghĩa từ mới bằng cấu tạo, nhưng đừng tự ghép un- với mọi tính từ."
      - vi: "Nhắc lịch sự: Entschuldigung, könnten Sie bitte …? – Das stört mich (Akk)."
      - vi: "Ruhezeit: thường ban đêm và Chủ nhật, tuỳ nội quy; In der Ruhezeit darf man nicht bohren."
      - vi: "Giải quyết mâu thuẫn: einen Konflikt lösen, sich auf einen Kompromiss einigen."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:b1u09l2-mcq-machbar
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u09-machbar
    prompt:
      stem: "Der Plan ist teuer, aber machbar. – machbar nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: m3a, text: "có thể thực hiện được", lang: vi }
        - { id: m7b, text: "đã được thực hiện xong", lang: vi }
        - { id: m1c, text: "không thể thực hiện được", lang: vi }
        - { id: m9d, text: "bắt buộc phải thực hiện", lang: vi }
    answer:
      correct_option_id: m3a
    explanation:
      vi: "machen + -bar: hậu tố -bar sau gốc động từ mang nghĩa \"có thể được …\", nên machbar = có thể làm được, khả thi. Chữ aber (nhưng) cũng cho thấy ý tích cực trái với teuer (đắt)."
    display_answer: có thể thực hiện được

  - key: de:exercise:b1u09l2-mcq-ruecksichtslos
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u09-ruecksichtslos
    prompt:
      stem: "Herr Braun hört nachts sehr laut Musik und denkt nie an die anderen Mieter. Er ist …"
      stem_lang: de
      options:
        - { id: r2a, text: "rücksichtslos", lang: de }
        - { id: r6b, text: "rücksichtsvoll", lang: de }
        - { id: r4c, text: "friedlich", lang: de }
        - { id: r8d, text: "machbar", lang: de }
    answer:
      correct_option_id: r2a
    explanation:
      vi: "Không nghĩ đến người khác = không có Rücksicht → Rücksicht + s + los = rücksichtslos. rücksichtsvoll là nghĩa ngược lại; friedlich = hoà thuận; machbar chỉ dùng cho việc, không dùng cho người."
    display_answer: rücksichtslos

  - key: de:exercise:b1u09l2-listen-musik-leiser
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u09-laerm
    prompt:
      audio_asset_id: null
      fallback_text: Entschuldigung, ich wohne unter Ihnen. Ihre Musik ist abends oft sehr laut. Könnten Sie sie nach zehn Uhr bitte etwas leiser machen?
      options:
        - { id: l1a, text: "Người nói sống ở tầng dưới và lịch sự nhờ hàng xóm vặn nhỏ nhạc sau mười giờ tối.", lang: vi }
        - { id: l5b, text: "Người nói sống ở tầng trên và yêu cầu hàng xóm tắt nhạc ngay lập tức.", lang: vi }
        - { id: l8c, text: "Người nói phàn nàn về tiếng khoan tường vào buổi sáng.", lang: vi }
        - { id: l3d, text: "Người nói mời hàng xóm đến nghe nhạc lúc mười giờ.", lang: vi }
    answer:
      correct_option_id: l1a
    explanation:
      vi: "ich wohne unter Ihnen = tôi sống ở tầng dưới anh/chị. Könnten Sie … bitte etwas leiser machen? = anh/chị có thể vặn nhỏ một chút không – lời nhờ lịch sự, không phải tắt hẳn. nach zehn Uhr = sau mười giờ."
    display_answer: Người nói sống ở tầng dưới và lịch sự nhờ hàng xóm vặn nhỏ nhạc sau mười giờ tối.

  # ---------------- recall ----------------
  - key: de:exercise:b1u09l2-fill-voll-los-lich
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-wortbildung-adjektiv
    prompt:
      template: "Unsere Nachbarn sind meistens sehr {{b1}} (Rücksicht + voll). Nur der Mann im dritten Stock ist leider {{b2}} (Rücksicht + los). Das ist wirklich {{b3}} (der Ärger)."
      blanks:
        - { id: b1, width_hint: 14 }
        - { id: b2, width_hint: 14 }
        - { id: b3, width_hint: 10 }
    answer:
      blanks:
        b1: [rücksichtsvoll]
        b2: [rücksichtslos]
        b3: [ärgerlich]
    known_wrong:
      - answer: rücksichtvoll
        feedback_vi: Giữa Rücksicht và voll có âm nối -s- – rücksichtsvoll.
        error_tag: word_formation
      - answer: rücksichtlos
        feedback_vi: Giữa Rücksicht và los có âm nối -s- – rücksichtslos.
        error_tag: word_formation
      - answer: Ärger
        feedback_vi: Sau ist wirklich cần tính từ – der Ärger + -lich = ärgerlich.
        error_tag: word_formation
    explanation:
      vi: "-voll = đầy, -los = không có, cả hai đều cần âm nối -s- sau Rücksicht. Từ danh từ der Ärger thêm -lich thành tính từ ärgerlich (đáng bực mình); tính từ sau sein không có đuôi."
    display_answer: "Unsere Nachbarn sind meistens sehr rücksichtsvoll. Nur der Mann im dritten Stock ist leider rücksichtslos. Das ist wirklich ärgerlich."

  - key: de:exercise:b1u09l2-fill-hausordnung
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-hausordnung
    prompt:
      template: "Im Treppenhaus hängt die {{b1}}. Dort steht: Von 22 bis 6 Uhr ist {{b2}}. In dieser Zeit darf man keinen {{b3}} machen, aber man muss natürlich nicht flüstern."
      blanks:
        - { id: b1, width_hint: 12 }
        - { id: b2, width_hint: 9 }
        - { id: b3, width_hint: 5 }
    answer:
      blanks:
        b1: [Hausordnung]
        b2: [Ruhezeit, Nachtruhe]
        b3: [Lärm, Krach]
    known_wrong:
      - answer: laut
        feedback_vi: Sau keinen cần danh từ – keinen Lärm machen (gây ồn).
        error_tag: word_choice
    explanation:
      vi: "Nội quy treo ở cầu thang chung là die Hausordnung. Từ 22 đến 6 giờ là Ruhezeit (hoặc Nachtruhe). Lärm machen = gây ồn, Lärm là giống đực nên keinen Lärm. darf nicht = không được phép, muss nicht = không cần."
    display_answer: "Im Treppenhaus hängt die Hausordnung. Dort steht: Von 22 bis 6 Uhr ist Ruhezeit. In dieser Zeit darf man keinen Lärm machen, aber man muss natürlich nicht flüstern."

  - key: de:exercise:b1u09l2-tr-stoert-mich
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-stoeren
    prompt:
      source_text: "Tiếng nhạc làm phiền tôi."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Die Musik stört mich.
        - Mich stört die Musik.
        - Die Musik stört mich sehr.
    known_wrong:
      - answer: Die Musik stört mir.
        feedback_vi: stören đi với Akkusativ – mich (không phải mir).
        error_tag: case_dat_akk
      - answer: Die Musik störe mich.
        feedback_vi: Chủ ngữ là die Musik (ngôi thứ ba) – stört.
        error_tag: verb_form
    explanation:
      vi: "Chủ ngữ là die Musik, động từ stören chia ngôi er/sie/es: stört. Người bị làm phiền ở Akkusativ: mich."
    display_answer: Die Musik stört mich.

  # ---------------- application ----------------
  - key: de:exercise:b1u09l2-wb-kompromiss
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-sich-einigen
    prompt:
      instruction: "Sắp xếp thành câu: \"Chúng tôi đã thống nhất được một giải pháp dung hoà.\""
      tokens:
        - { id: k-geeinigt, text: geeinigt }
        - { id: k-einen, text: einen }
        - { id: k-wir, text: Wir }
        - { id: k-auf, text: auf }
        - { id: k-uns, text: uns }
        - { id: k-kompromiss, text: Kompromiss }
        - { id: k-haben, text: haben }
    answer:
      orders:
        - [k-wir, k-haben, k-uns, k-auf, k-einen, k-kompromiss, k-geeinigt]
    explanation:
      vi: "Perfekt: haben ở vị trí 2, Partizip geeinigt ở cuối. Đại từ phản thân uns đứng ngay sau haben, rồi đến cụm auf einen Kompromiss (auf + Akkusativ)."
    display_answer: Wir haben uns auf einen Kompromiss geeinigt.

  - key: de:exercise:b1u09l2-wb-nachts-musik
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-ruecksichtslos
    prompt:
      instruction: "Sắp xếp thành câu: \"Nghe nhạc to vào ban đêm là thiếu ý tứ.\""
      tokens:
        - { id: n-hoeren, text: hören }
        - { id: n-ist, text: ist }
        - { id: n-musik, text: Musik }
        - { id: n-es, text: Es }
        - { id: n-zu, text: zu }
        - { id: n-nachts, text: nachts }
        - { id: n-komma, text: "," }
        - { id: n-laut, text: laut }
        - { id: n-rs, text: rücksichtslos }
    answer:
      orders:
        - [n-es, n-ist, n-rs, n-komma, n-nachts, n-laut, n-musik, n-zu, n-hoeren]
        - [n-es, n-ist, n-rs, n-komma, n-nachts, n-musik, n-laut, n-zu, n-hoeren]
    explanation:
      vi: "Es ist + tính từ, rồi cụm zu sau dấu phẩy (ôn bài 1). Trong cụm zu, thời gian (nachts) đứng trước, zu hören ở cuối; laut Musik và Musik laut đều được."
    display_answer: Es ist rücksichtslos, nachts laut Musik zu hören.

  - key: de:exercise:b1u09l2-mcq-sonntag-bohren
    type: mcq
    stage: application
