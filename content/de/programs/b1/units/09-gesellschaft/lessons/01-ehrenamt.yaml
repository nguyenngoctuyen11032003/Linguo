title:
  vi: Làm tình nguyện – zu-Infinitiv hay dass? (Es ist schön, anderen zu helfen.)
objectives:
  - vi: Kể về hoạt động tình nguyện, hội nhóm mà bạn hoặc người khác tham gia.
  - vi: Chọn đúng cấu trúc – cụm zu + nguyên thể khi cùng chủ ngữ, dass khi khác chủ ngữ.
  - vi: Đọc hiểu một đoạn giới thiệu ngắn về một người làm tình nguyện.
estimated_minutes: 19
skills: [grammar, vocabulary, reading]
