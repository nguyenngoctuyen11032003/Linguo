title:
  vi: Trình bày một chủ đề (Ich möchte euch heute … vorstellen.)
objectives:
  - vi: Trình bày một chủ đề trong 3–4 phút theo cấu trúc 5 phần, dùng đúng câu mở đầu, chuyển ý và kết luận (kiểu Goethe B1 Sprechen Teil 2).
  - vi: Nghe nhận ra người nói đang ở phần nào của bài trình bày.
  - vi: Trả lời câu hỏi của người nghe và hỏi lại lịch sự khi chưa hiểu câu hỏi (kiểu Sprechen Teil 3).
