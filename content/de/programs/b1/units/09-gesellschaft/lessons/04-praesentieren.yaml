body:
  - type: objective
    text:
      vi: "Sau bài này, bạn trình bày được một chủ đề có mở đầu, chuyển ý và kết luận rõ ràng, ví dụ: \"Ich spreche heute über das Thema Ehrenamt. … Damit komme ich zum nächsten Punkt. … Zum Schluss möchte ich kurz zusammenfassen. Vielen Dank für Ihre Aufmerksamkeit!\""
  - type: explain
    text:
      vi: "Theo cấu trúc tại thời điểm soạn bài, ở Goethe-Zertifikat B1 phần Sprechen Teil 2 bạn trình bày một chủ đề khoảng 3–4 phút theo năm trang chiếu (Folien), rồi trả lời câu hỏi của người nghe; định dạng có thể thay đổi, hãy xem tài liệu mẫu chính thức. Năm phần thường là: giới thiệu chủ đề và dàn ý – kinh nghiệm bản thân – tình hình ở Việt Nam – ưu, nhược điểm và ý kiến – kết luận, cảm ơn."
  - type: explain
    text:
      vi: "Mở đầu: Ich spreche heute über das Thema … / Ich möchte euch (Ihnen) heute … vorstellen. Giới thiệu dàn ý: Mein Vortrag hat drei Teile. Zuerst …, dann …, zum Schluss … – giống \"đầu tiên, sau đó, cuối cùng\" trong tiếng Việt."
  - type: explain
    text:
      vi: "Chuyển ý: Ich komme jetzt zu … / Damit komme ich zum nächsten Punkt. Kinh nghiệm: Ich habe selbst erlebt, dass … So sánh với Việt Nam: In Vietnam ist das anders: … / Bei uns in Vietnam …"
  - type: explain
    text:
      vi: "Kết luận: Zum Schluss möchte ich kurz zusammenfassen: … Rồi cảm ơn và mời hỏi: Vielen Dank für eure (Ihre) Aufmerksamkeit! Habt ihr (Haben Sie) Fragen? Khi chưa hiểu câu hỏi, đừng đoán – hãy hỏi lại: Könnten Sie die Frage bitte wiederholen?"
  - type: deep_explain
    text:
      vi: "Người nghe Đức đánh giá cao bài nói có cấu trúc rõ và nhìn vào người nghe hơn là đọc thật trôi chảy từ giấy. Vì vậy, chỉ ghi Stichpunkte (ý chính), không viết cả câu, và luyện nói tự do vài lần trước gương hoặc với bạn. Trong lớp thường dùng ihr/euch với các bạn học; trước người nghe không quen hoặc giám khảo, dùng Sie/Ihnen. Khi trả lời câu hỏi, bạn có thể mở đầu bằng Danke für die Frage. hoặc Das ist eine gute Frage., kiểm tra lại mình hiểu đúng chưa (Sie möchten wissen, ob …?) và nói thật khi không chắc (Da bin ich nicht ganz sicher, aber ich glaube, dass …). Lampenfieber là chuyện bình thường; một câu mở đầu đã thuộc kỹ giúp bạn bắt đầu tự tin hơn."
  - type: example
    target: Ich spreche heute über das Thema Ehrenamt. Zuerst erzähle ich von meinen Erfahrungen, dann spreche ich über die Situation in Vietnam, und zum Schluss sage ich meine Meinung.
    target_lang: de
    translation:
      vi: Hôm nay tôi nói về chủ đề công việc tình nguyện. Đầu tiên tôi kể về kinh nghiệm của mình, sau đó nói về tình hình ở Việt Nam, và cuối cùng tôi nêu ý kiến của mình.
    note:
      vi: "Mở đầu + dàn ý. Zuerst, dann, zum Schluss đứng đầu vế nên động từ đứng ngay sau (V2)."
  - type: example
    target: Ich habe selbst erlebt, dass ehrenamtliche Arbeit viel Freude macht.
    target_lang: de
    translation:
      vi: Chính tôi đã trải nghiệm rằng làm tình nguyện mang lại nhiều niềm vui.
    note:
      vi: "Kinh nghiệm bản thân: Ich habe selbst erlebt, dass … – câu dass, động từ macht ở cuối."
  - type: example
    target: In Vietnam ist das etwas anders. Viele helfen eher in der Familie und in der Nachbarschaft als in einem Verein.
    target_lang: de
    translation:
      vi: Ở Việt Nam thì hơi khác. Nhiều người thường giúp đỡ trong gia đình và hàng xóm hơn là trong một hội.
    note:
      vi: "So sánh với Việt Nam: In Vietnam ist das anders. eher … als … = thường … hơn là …"
  - type: example
    target: Ein Nachteil ist, dass man wenig Freizeit hat. Meiner Meinung nach ist ein Ehrenamt aber eine gute Chance, Deutsch zu sprechen.
    target_lang: de
    translation:
      vi: Một nhược điểm là mình có ít thời gian rảnh. Nhưng theo tôi, làm tình nguyện là một cơ hội tốt để nói tiếng Đức.
    note:
      vi: "Phần ưu, nhược điểm và ý kiến: Ein Nachteil ist, dass …; Meiner Meinung nach + động từ ở vị trí 2 (ôn B1U06)."
  - type: example
    target: Zum Schluss möchte ich kurz zusammenfassen. Vielen Dank für eure Aufmerksamkeit! Habt ihr Fragen?
    target_lang: de
    translation:
      vi: Cuối cùng mình xin tóm tắt ngắn gọn. Cảm ơn các bạn đã chú ý lắng nghe! Các bạn có câu hỏi nào không?
    note:
      vi: "Nói với lớp học (ihr): eure, habt ihr. Với người nghe không quen: Ihre, haben Sie."
  - type: example
    target: Danke für die Frage. Sie möchten wissen, ob man für ein Ehrenamt Geld bekommt? Nein, normalerweise nicht.
    target_lang: de
    translation:
      vi: Cảm ơn câu hỏi. Anh/chị muốn biết làm tình nguyện có được trả tiền không ạ? Không, thường thì không.
    note:
      vi: "Nhắc lại câu hỏi bằng câu hỏi gián tiếp ob … để chắc mình hiểu đúng, rồi mới trả lời."
  - type: common_mistake
    wrong: Ehrenamt ist gut. In Vietnam gibt es das auch. Ende.
    right: Ich komme jetzt zu meinem zweiten Punkt. … Zum Schluss möchte ich kurz zusammenfassen.
    target_lang: de
    note:
      vi: "Thiếu câu chuyển ý thì người nghe không biết bạn đang ở phần nào; dùng Ich komme jetzt zu … và Zum Schluss …"
  - type: common_mistake
    wrong: Ich spreche heute von das Thema Nachbarschaft.
    right: Ich spreche heute über das Thema Nachbarschaft.
    target_lang: de
    note:
      vi: "Nói về một chủ đề: sprechen über + Akkusativ (über das Thema)."
  - type: common_mistake
    wrong: Was? Ich verstehe nicht.
    right: Entschuldigung, könnten Sie die Frage bitte wiederholen?
    target_lang: de
    note:
      vi: "Câu đầu cộc lốc. Khi chưa hiểu, hãy hỏi lại lịch sự thay vì đoán hoặc im lặng."
  - type: common_mistake
    wrong: Zum Schluss möchte ich kurz zusammenzufassen.
    right: Zum Schluss möchte ich kurz zusammenfassen.
    target_lang: de
    note:
      vi: "Sau động từ khuyết thiếu (möchte) dùng nguyên thể không có zu."
  - type: summary
    points:
      - vi: "Năm phần: chủ đề + dàn ý – kinh nghiệm – Việt Nam – ưu, nhược điểm và ý kiến – kết luận."
      - vi: "Mở đầu: Ich spreche heute über … / Ich möchte euch heute … vorstellen."
      - vi: "Chuyển ý: Ich komme jetzt zu … / Damit komme ich zum nächsten Punkt."
      - vi: "Kinh nghiệm: Ich habe selbst erlebt, dass …; so sánh: In Vietnam ist das anders: …"
      - vi: "Kết: Zum Schluss möchte ich kurz zusammenfassen. Vielen Dank für Ihre Aufmerksamkeit!"
      - vi: "Chưa hiểu câu hỏi: Könnten Sie die Frage bitte wiederholen?"
      - vi: "Từ vựng: die Präsentation, der Vortrag, die Folie, die Gliederung, das Thema (Themen), zusammenfassen, das Publikum."
