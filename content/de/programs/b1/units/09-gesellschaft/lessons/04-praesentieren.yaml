    display_answer: Ich habe selbst erlebt, dass Nachbarn sich gegenseitig helfen.

  # ---------------- recall ----------------
  - key: de:exercise:b1u09l4-fill-ueberblick
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-ueberblick
    prompt:
      template: "Ich {{b1}} heute über das Thema Nachbarschaft. Zuerst gebe ich Ihnen einen kurzen {{b2}}. Dann {{b3}} ich zu meinen eigenen Erfahrungen."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 10 }
        - { id: b3, width_hint: 6 }
    answer:
      blanks:
        b1: [spreche, rede]
        b2: [Überblick]
        b3: [komme]
    known_wrong:
      - answer: spricht
        feedback_vi: Chủ ngữ là ich – ich spreche.
        error_tag: verb_form
      - answer: Gliederung
        feedback_vi: die Gliederung là giống cái nên không đi với einen kurzen; ở đây cần der Überblick (tổng quan).
        error_tag: gender
      - answer: kommt
        feedback_vi: Chủ ngữ là ich – Dann komme ich zu …
        error_tag: verb_form
    explanation:
      vi: "sprechen über + Akkusativ: Ich spreche über das Thema …; einen Überblick geben = trình bày tổng quan (der Überblick → einen kurzen Überblick). Câu chuyển ý: Dann komme ich zu … – Dann đứng đầu nên komme ở vị trí 2."
    display_answer: "Ich spreche heute über das Thema Nachbarschaft. Zuerst gebe ich Ihnen einen kurzen Überblick. Dann komme ich zu meinen eigenen Erfahrungen."

  - key: de:exercise:b1u09l4-fill-zum-schluss
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-zusammenfassen
    prompt:
      template: "Zum {{b1}} möchte ich das Wichtigste kurz {{b2}} (zusammenfassen). Vielen Dank für Ihre {{b3}}!"
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 14 }
        - { id: b3, width_hint: 14 }
    answer:
      blanks:
        b1: [Schluss, Abschluss]
        b2: [zusammenfassen]
        b3: [Aufmerksamkeit]
    known_wrong:
      - answer: zusammenzufassen
        feedback_vi: Sau möchte (động từ khuyết thiếu) dùng nguyên thể không có zu – zusammenfassen.
        error_tag: zu_infinitive
      - answer: zusammengefasst
        feedback_vi: Sau möchte cần nguyên thể – zusammenfassen.
        error_tag: verb_form
    explanation:
      vi: "Zum Schluss = cuối cùng (câu kết quen thuộc). möchte + nguyên thể ở cuối câu: zusammenfassen. Câu cảm ơn cố định: Vielen Dank für Ihre Aufmerksamkeit!"
    display_answer: "Zum Schluss möchte ich das Wichtigste kurz zusammenfassen. Vielen Dank für Ihre Aufmerksamkeit!"

  - key: de:exercise:b1u09l4-tr-thema-vorstellen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-thema
    prompt:
      source_text: "Hôm nay mình muốn giới thiệu với các bạn chủ đề hàng xóm. (nói với cả lớp, dùng ihr; chủ đề = das Thema Nachbarschaft)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich möchte euch heute das Thema Nachbarschaft vorstellen.
        - Heute möchte ich euch das Thema Nachbarschaft vorstellen.
        - Ich möchte euch heute das Thema Nachbarschaft präsentieren.
        - Heute möchte ich euch das Thema Nachbarschaft präsentieren.
    known_wrong:
      - answer: Ich möchte euch heute das Thema Nachbarschaft zu vorstellen.
        feedback_vi: Sau möchte không dùng zu – … vorstellen.
        error_tag: zu_infinitive
      - answer: Ich möchte heute euch vorstellen das Thema Nachbarschaft.
        feedback_vi: Nguyên thể vorstellen đứng cuối câu; đại từ euch thường đứng ngay sau ich.
        error_tag: word_order
      - answer: Ich möchte Ihnen heute das Thema Nachbarschaft vorstellen.
        feedback_vi: Đề yêu cầu nói với cả lớp bằng ihr – dùng euch (Ihnen là dạng lịch sự Sie).
        error_tag: register_du_sie
    explanation:
      vi: "jemandem etwas vorstellen: người nghe ở Dativ (euch), chủ đề ở Akkusativ (das Thema Nachbarschaft). möchte ở vị trí 2, vorstellen ở cuối câu."
    display_answer: Ich möchte euch heute das Thema Nachbarschaft vorstellen.

  # ---------------- application ----------------
  - key: de:exercise:b1u09l4-wb-naechster-punkt
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u09-g-praesentation-redemittel
    prompt:
      instruction: "Sắp xếp thành câu: \"Đến đây tôi chuyển sang ý tiếp theo.\""
      tokens:
        - { id: p-punkt, text: Punkt }
        - { id: p-ich, text: ich }
        - { id: p-damit, text: Damit }
        - { id: p-naechsten, text: nächsten }
        - { id: p-komme, text: komme }
        - { id: p-zum, text: zum }
    answer:
      orders:
        - [p-damit, p-komme, p-ich, p-zum, p-naechsten, p-punkt]
    explanation:
      vi: "Damit đứng ở vị trí 1 nên động từ komme ở vị trí 2, sau đó là chủ ngữ ich. zum = zu dem (der Punkt, Dativ): zum nächsten Punkt."
    display_answer: Damit komme ich zum nächsten Punkt.

  - key: de:exercise:b1u09l4-mcq-nachfragen
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
