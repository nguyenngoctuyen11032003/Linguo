title:
  vi: Ở văn phòng – đại từ bất định (Hat jemand den Drucker repariert?)
objectives:
  - vi: Dùng đại từ bất định jemand, niemand, etwas, nichts, alle, einige, manche, mehrere, beide đúng nghĩa và đúng dạng động từ.
  - vi: Trao đổi công việc hằng ngày ở văn phòng, xin nghỉ phép và báo ốm.
  - vi: Nghe hiểu cuộc gọi báo ốm và đoạn trao đổi ngắn trong cuộc họp.
