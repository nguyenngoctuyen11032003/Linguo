title:
  vi: Tin tuyển dụng – bị động hiện tại, Genitiv (Gesucht wird …)
objectives:
  - vi: Dùng câu bị động hiện tại (werden + Partizip II) để nói một việc "được làm" mà không cần nói ai làm.
  - vi: Dùng Genitiv (des/der, danh từ thêm -s/-es) để nói "của" trong văn viết, và hỏi bằng wessen.
  - vi: Đọc tin tuyển dụng, hiểu yêu cầu (Voraussetzungen) và quyền lợi (Bezahlung, Vertrag).
estimated_minutes: 20
