title:
  vi: Lịch sử công ty – bị động quá khứ (Die Firma wurde 1950 gegründet.)
objectives:
  - vi: Dùng bị động Präteritum (wurde/wurden + Partizip II) để kể lịch sử một doanh nghiệp.
  - vi: Dùng bị động Perfekt (ist/sind + Partizip II + worden) khi nói, và phân biệt worden với geworden.
  - vi: Đọc và viết đoạn giới thiệu ngắn về lịch sử công ty và quy trình sản xuất.
