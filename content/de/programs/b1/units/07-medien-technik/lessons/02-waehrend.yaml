title:
  vi: Trong khi, ngay khi, chừng nào (Während, sobald, solange)
objectives:
  - vi: Nói về thói quen dùng điện thoại và mạng xã hội của mình.
  - vi: Dùng während + câu phụ để nói hai việc diễn ra cùng lúc hoặc để so sánh tương phản.
  - vi: Dùng sobald (ngay khi) và solange (chừng nào còn) với động từ đứng cuối câu phụ.
