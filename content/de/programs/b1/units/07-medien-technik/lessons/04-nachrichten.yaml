title:
  vi: Nghe tin tức – mốc thời gian chính xác (Gegen acht Uhr, Mitte Mai)
objectives:
  - vi: Hiểu tin vắn trên radio hoặc TV và ghi lại ai – cái gì – khi nào – ở đâu.
  - vi: Dùng mốc thời gian chính xác và gần đúng – gegen acht Uhr, um acht Uhr herum, Anfang/Mitte/Ende Mai, ab sofort, innerhalb von zwei Stunden.
  - vi: Kể lại ngắn gọn một tin vừa nghe.
