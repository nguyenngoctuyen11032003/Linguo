title:
  vi: Hướng dẫn sử dụng – bị động trạng thái, nguyên thể danh từ hoá (Das Gerät ist eingeschaltet. Beim Laden …)
objectives:
  - vi: Phân biệt bị động trạng thái (ist eingeschaltet) với bị động quá trình (wird eingeschaltet) và với Perfekt.
  - vi: Dùng nguyên thể danh từ hoá – das Laden, beim Laden, zum Laden – và viết hoa đúng.
  - vi: Đọc hiểu một hướng dẫn sử dụng ngắn và báo một hỏng hóc.
