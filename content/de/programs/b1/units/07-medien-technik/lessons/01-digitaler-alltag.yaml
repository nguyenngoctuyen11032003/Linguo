title:
  vi: Đời sống số – phân từ làm tính từ (Das klingelnde Handy, die gespeicherten Daten)
objectives:
  - vi: Tạo và dùng Partizip I làm tính từ (das klingelnde Handy) cho hành động chủ động, đang diễn ra.
  - vi: Dùng Partizip II làm tính từ (die gespeicherten Daten) cho việc đã xong, thường mang nghĩa bị động.
  - vi: Đọc một đoạn văn ngắn về thiết bị số và mô tả thiết bị gọn bằng cụm phân từ.
