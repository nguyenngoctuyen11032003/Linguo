  - key: de:exercise:b1u07l1-mcq-was-fuer-ein
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u07-g-was-fuer-ein
    prompt:
      stem: "Ở cửa hàng điện máy, nhân viên muốn hỏi khách đang tìm loại thiết bị nào. Câu nào đúng?"
      stem_lang: vi
