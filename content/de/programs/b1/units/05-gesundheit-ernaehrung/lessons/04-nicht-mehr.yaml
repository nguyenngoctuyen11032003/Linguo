  - key: de:exercise:b1u05l4-tr-meditieren
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:b1u05-meditieren
    prompt:
      source_text: Seitdem ich jeden Abend meditiere, habe ich gar keine Schlafstörungen mehr.
      source_lang: de
      direction: target_to_vi
