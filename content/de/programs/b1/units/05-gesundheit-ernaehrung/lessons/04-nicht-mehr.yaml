        - Seit Januar rauche ich keine Zigaretten mehr.
        - Ich rauche seit Januar keine Zigaretten mehr.
        - Seit Januar bin ich Nichtraucher.
        - Ich bin seit Januar Nichtraucher.
        - Seit Januar bin ich Nichtraucherin.
        - Ich bin seit Januar Nichtraucherin.
    known_wrong:
      - answer: Seit Januar rauche ich nicht noch.
        feedback_vi: "\"không … nữa\" = nicht mehr."
        error_tag: meaning
      - answer: Seit Januar ich rauche nicht mehr.
        feedback_vi: Seit Januar ở vị trí 1 thì động từ rauche đứng ở vị trí 2 – Seit Januar rauche ich …
        error_tag: verb_position
      - answer: Seit Januar rauche ich nicht mehr Zigaretten.
        feedback_vi: Danh từ không mạo từ phủ định bằng kein, mehr đứng sau – keine Zigaretten mehr.
        error_tag: word_order
    explanation:
      vi: "\"không … nữa\" = nicht mehr (hoặc keine Zigaretten mehr). seit + mốc thời gian, động từ ở hiện tại vì đến giờ vẫn không hút."
    display_answer: Seit Januar rauche ich nicht mehr.

