body:
  - type: objective
    text:
      vi: "Sau bài này, bạn kể được thói quen đã thay đổi, ví dụ: \"Seit einem Jahr rauche ich nicht mehr, und ich trinke auch keinen Alkohol mehr. Einen Rückfall hatte ich noch nicht.\""
  - type: explain
    text:
      vi: "Tiếng Việt nói \"không … nữa\", tiếng Đức nói nicht mehr: Ich rauche nicht mehr. Với danh từ không có mạo từ hoặc đi với ein, dùng kein … mehr, mehr đứng sau danh từ: Ich trinke keinen Alkohol mehr, Ich habe keine Zigaretten mehr. Không nói nicht mehr Zigaretten – cụm này nghĩa là \"không nhiều thuốc hơn\"."
  - type: explain
    text:
      vi: "\"Chưa\" là noch nicht, với danh từ là noch kein: Ich habe noch nicht gefrühstückt, Ich habe noch keinen Termin. Người Việt hay dịch \"không … nữa\" thành nicht noch – dạng này sai, còn noch nicht lại có nghĩa ngược hẳn (\"chưa\")."
  - type: explain
    text:
      vi: "Muốn nhấn mạnh \"hoàn toàn không\", bạn thêm gar hoặc überhaupt: Ich schlafe gar nicht gut, Das schmeckt mir überhaupt nicht. nie wieder = không bao giờ … nữa (Nie wieder Zigaretten!), còn nur noch = chỉ còn (Ich trinke nur noch eine Tasse Kaffee am Tag)."
  - type: explain
    text:
      vi: "Khi phủ định cả câu, nicht thường đứng gần cuối: sau tân ngữ và trạng từ thời gian, nhưng trước phần cuối khung câu, trước cụm chỉ hướng và trước tính từ sau sein (Ich gehe heute nicht ins Fitnessstudio. Ich kann nicht einschlafen.). Khi chỉ phủ định một thành phần, nicht đứng ngay trước thành phần đó và thường có sondern theo sau: Ich gehe nicht heute, sondern morgen."
  - type: deep_explain
    text:
      vi: "Với danh từ có mạo từ xác định hoặc đại từ sở hữu thì dùng nicht, không dùng kein: Ich rauche diese Zigaretten nicht mehr. Muốn nói \"ít hơn\" chứ không phải \"không … nữa\", hãy dùng nicht mehr so viel: Ich trinke nicht mehr so viel Kaffee. Trả lời câu hỏi phủ định một cách khẳng định thì dùng doch: Rauchst du nicht mehr? – Doch, leider. Câu \"Ich habe noch nie meditiert\" (tôi chưa bao giờ thiền) dùng noch nie. Nếu bạn muốn bỏ thuốc, bác sĩ gia đình hoặc quỹ bảo hiểm y tế có thể giới thiệu chương trình hỗ trợ; nội dung trong bài chỉ là ví dụ ngôn ngữ."
  - type: example
    target: Seit einem Jahr rauche ich nicht mehr. Ich habe auch keine Zigaretten mehr zu Hause.
    target_lang: de
    translation:
      vi: Đã một năm nay tôi không hút thuốc nữa. Ở nhà tôi cũng không còn điếu thuốc nào.
    note:
      vi: "rauchen (động từ) → nicht mehr; Zigaretten (danh từ không mạo từ) → keine … mehr."
  - type: example
    target: Hast du schon einmal meditiert? – Nein, noch nie. Aber ich möchte es gern ausprobieren.
    target_lang: de
    translation:
      vi: Bạn đã bao giờ thiền chưa? – Chưa, chưa bao giờ. Nhưng mình muốn thử.
    note:
      vi: "Nói với bạn bè (du). noch nie = chưa bao giờ; noch nicht = chưa (lần này)."
  - type: example
    target: Obwohl ich sehr müde bin, kann ich nicht einschlafen.
    target_lang: de
    translation:
      vi: Dù rất mệt nhưng tôi không ngủ được.
    note:
      vi: "Ôn obwohl: động từ cuối câu phụ. nicht đứng trước einschlafen ở cuối khung câu."
  - type: example
    target: Je weniger Kaffee ich trinke, desto besser schlafe ich.
    target_lang: de
    translation:
      vi: Tôi càng uống ít cà phê thì càng ngủ ngon.
    note:
      vi: "Ôn je … desto: vế je có động từ cuối, vế desto có động từ đứng ngay sau so sánh hơn."
  - type: example
    target: "Mein Vorsatz war: nie wieder Zigaretten! Nach einem Rückfall im Februar habe ich es noch einmal versucht."
    target_lang: de
    translation:
      vi: "Quyết tâm của tôi là: không bao giờ hút thuốc nữa! Sau một lần tái nghiện hồi tháng Hai, tôi đã thử lại lần nữa."
    note:
      vi: "nie wieder = không bao giờ … nữa. noch einmal = thêm một lần nữa (khẳng định, không phải phủ định)."
  - type: common_mistake
    wrong: Ich rauche nicht noch.
    right: Ich rauche nicht mehr.
    target_lang: de
    note:
      vi: "\"không … nữa\" = nicht mehr. noch không mang nghĩa \"nữa\" trong câu phủ định."
  - type: common_mistake
    wrong: Ich rauche nicht mehr Zigaretten.
    right: Ich rauche keine Zigaretten mehr.
    target_lang: de
    note:
      vi: "Danh từ không mạo từ phủ định bằng kein, và mehr đứng sau danh từ."
  - type: common_mistake
    wrong: Ich habe keinen Termin noch.
    right: Ich habe noch keinen Termin.
    target_lang: de
    note:
      vi: "\"chưa có\" + danh từ = noch kein…; noch đứng trước kein."
  - type: summary
    points:
      - vi: "nicht mehr / kein … mehr = không … nữa (Ich rauche nicht mehr. Ich trinke keinen Alkohol mehr.)."
      - vi: "noch nicht / noch kein = chưa; noch nie = chưa bao giờ."
      - vi: "gar nicht, überhaupt nicht = hoàn toàn không; nie wieder = không bao giờ nữa; nur noch = chỉ còn."
      - vi: "Phủ định cả câu: nicht gần cuối, trước phần cuối khung câu, cụm chỉ hướng, tính từ sau sein."
      - vi: "Phủ định một thành phần: nicht ngay trước nó, thường kèm sondern."
      - vi: "Từ vựng: die Sucht, süchtig nach, der Schlaf, die Entspannung, meditieren, unter Druck stehen."
