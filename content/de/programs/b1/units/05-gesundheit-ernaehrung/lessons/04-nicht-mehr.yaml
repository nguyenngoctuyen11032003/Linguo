  - vi: Nói về việc thay đổi thói quen bằng nicht mehr, kein … mehr, noch nicht, noch kein, gar nicht, nie wieder.
  - vi: Đặt nicht đúng chỗ khi phủ định cả câu hoặc chỉ một thành phần.
