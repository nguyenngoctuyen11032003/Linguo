  # ---------------- recall ----------------
  - key: de:exercise:b1u05l4-fill-keinen-mehr
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-g-negation-erweitert
    prompt:
      template: "Früher habe ich jeden Tag vier Tassen Kaffee getrunken, aber heute trinke ich {{b1}} Kaffee {{b2}}."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 5 }
    answer:
      blanks:
        b1: [keinen]
        b2: [mehr]
    known_wrong:
      - answer: nicht
        feedback_vi: Kaffee là danh từ không có mạo từ, nên phủ định bằng kein – keinen Kaffee mehr.
        error_tag: article
      - answer: kein
        feedback_vi: der Kaffee là giống đực, Akkusativ – keinen.
        error_tag: case_dat_akk
      - answer: noch
        feedback_vi: "\"không … nữa\" là kein … mehr, không dùng noch."
        error_tag: meaning
    explanation:
      vi: "Danh từ không mạo từ (Kaffee) → kein; der Kaffee là tân ngữ Akkusativ giống đực → keinen. mehr đứng sau danh từ: keinen Kaffee mehr = không uống cà phê nữa."
    display_answer: "Früher habe ich jeden Tag vier Tassen Kaffee getrunken, aber heute trinke ich keinen Kaffee mehr."

  - key: de:exercise:b1u05l4-fill-noch-keinen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-g-negation-erweitert
    prompt:
      template: "Hast du schon einen Termin bei der Hautärztin? – Nein, ich habe {{b1}} keinen. Ich rufe morgen in der Praxis an."
      blanks:
        - { id: b1, width_hint: 5 }
    answer:
      blanks:
        b1: [noch]
    known_wrong:
      - answer: schon
        feedback_vi: "\"chưa có\" là noch kein – noch keinen."
        error_tag: meaning
      - answer: mehr
        feedback_vi: Người nói chưa từng có lịch hẹn, nên là noch keinen (chưa), không phải keinen mehr (không còn).
        error_tag: meaning
    explanation:
      vi: "Người nói chưa có lịch nhưng sẽ gọi điện đặt: noch kein(en) = chưa có. keinen thay cho keinen Termin."
    display_answer: "Hast du schon einen Termin bei der Hautärztin? – Nein, ich habe noch keinen. Ich rufe morgen in der Praxis an."

  - key: de:exercise:b1u05l4-tr-seit-januar
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-g-negation-erweitert
    prompt:
      source_text: Từ tháng Một tôi không hút thuốc nữa.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Seit Januar rauche ich nicht mehr.
