  - vi: Nói điều cần làm, nên làm hoặc không được làm theo kiểu khách quan bằng bị động với động từ khiếm khuyết (Das Obst muss gewaschen werden).
  - vi: Nêu điều kiện có thể xảy ra bằng falls.
