    prompt:
      instruction: "Sắp xếp thành câu, bắt đầu bằng Falls: \"Nếu bạn muốn giảm cân, bạn nên vận động nhiều hơn.\""
      tokens:
        - { id: a-solltest, text: solltest }
        - { id: a-falls, text: Falls }
        - { id: a-dich, text: dich }
        - { id: a-du1, text: du }
        - { id: a-abnehmen, text: abnehmen }
        - { id: a-mehr, text: mehr }
        - { id: a-komma, text: "," }
        - { id: a-moechtest, text: möchtest }
        - { id: a-du2, text: du }
        - { id: a-bewegen, text: bewegen }
    answer:
      orders:
        - [a-falls, a-du1, a-abnehmen, a-moechtest, a-komma, a-solltest, a-du2, a-dich, a-mehr, a-bewegen]
        - [a-falls, a-du2, a-abnehmen, a-moechtest, a-komma, a-solltest, a-du1, a-dich, a-mehr, a-bewegen]
