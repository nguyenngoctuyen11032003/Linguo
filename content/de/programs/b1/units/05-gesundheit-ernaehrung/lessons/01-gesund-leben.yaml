    display_answer: Falls du abnehmen möchtest, solltest du dich mehr bewegen.

  - key: de:exercise:b1u05l1-wb-dass-zucker
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-g-passiv-modal
    prompt:
      instruction: "Sắp xếp thành câu: \"Bác sĩ cho rằng nên ăn ít đường hơn.\" (dùng bị động trong câu dass)"
