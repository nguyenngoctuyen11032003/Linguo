        - { id: z-meint, text: meint }
        - { id: z-gegessen, text: gegessen }
        - { id: z-die, text: Die }
        - { id: z-zucker, text: Zucker }
        - { id: z-komma, text: "," }
        - { id: z-werden, text: werden }
