    answer:
      accepted:
        - Tôi thích nhất là mua thực phẩm tươi của địa phương, không có nhiều bao bì.
        - Tôi thích nhất là mua thực phẩm tươi của địa phương mà không có nhiều bao bì.
        - Tôi thích nhất là mua thực phẩm tươi, của địa phương, không nhiều bao bì.
        - Tôi thích nhất là mua thực phẩm tươi trong vùng, không có nhiều bao bì.
        - Tôi thích mua nhất là thực phẩm tươi của địa phương, không có nhiều bao bì.
        - Tôi thích nhất là mua đồ ăn tươi của địa phương, không có nhiều bao bì.
        - Tôi thích nhất là mua thực phẩm tươi sống của địa phương, không có nhiều bao bì.
        - Tôi thích nhất là mua thực phẩm tươi của địa phương, ít bao bì.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi thích nhất là mua thực phẩm tươi nhập khẩu, không có nhiều bao bì.
        feedback_vi: "regional là của địa phương, trong vùng – ngược với nhập khẩu."
        error_tag: meaning
    explanation:
      vi: "am liebsten = thích nhất (so sánh nhất của gern); frische, regionale Lebensmittel: số nhiều không mạo từ, Akkusativ → -e; ohne viel Verpackung = không có nhiều bao bì."
    display_answer: Tôi thích nhất là mua thực phẩm tươi của địa phương, không có nhiều bao bì.
