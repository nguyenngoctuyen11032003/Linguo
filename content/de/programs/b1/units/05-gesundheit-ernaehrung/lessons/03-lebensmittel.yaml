      vi: "Trên nhãn ghi Ohne Zusatzstoffe – không có chất phụ gia. Vì vậy câu này sai."
    display_answer: Falsch

  - key: de:exercise:b1u05l3-mcq-etikett-salz
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u05-zutat
    prompt:
      stem: "Vollkornbrot aus regionaler Landwirtschaft. Zutaten: Vollkornmehl, Wasser, Sonnenblumenkerne, Salz, Hefe. Ohne Zusatzstoffe. Kann Spuren von Nüssen enthalten. Mindestens haltbar bis: siehe Verpackung. — Richtig oder falsch? Salz ist eine Zutat des Brotes."
      stem_lang: de
