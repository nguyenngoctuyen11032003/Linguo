body:
  - type: objective
    text:
      vi: "Sau bài này, bạn đọc được nhãn thực phẩm như \"Zutaten: Vollkornmehl, Wasser, Salz. Ohne Zusatzstoffe.\" và đoán đúng giống của nhiều danh từ mới chỉ nhờ phần đuôi: die Verpackung, das Würstchen, der Lehrling."
  - type: explain
    text:
      vi: "Giống của danh từ tiếng Đức phần lớn phải học thuộc, nhưng một số hậu tố cho biết giống khá chắc chắn. Danh từ tận cùng bằng -ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ik hầu như là giống cái và có số nhiều -en: die Verpackung – die Verpackungen, die Flüssigkeit, die Portion, die Metzgerei. Đây là nhóm lớn nhất, nên gặp các đuôi này bạn cứ đoán die."
  - type: explain
    text:
      vi: "Hậu tố -chen và -lein (làm nhỏ đi, thường kèm biến âm) cho giống trung và không đổi ở số nhiều: die Wurst → das Würstchen, die Würstchen. Đuôi -ment, -um và động từ nguyên thể dùng làm danh từ cũng thường là giống trung: das Medikament, das Datum, das Kochen."
  - type: explain
    text:
      vi: "Giống đực thường gặp ở -ling, -ismus, -or và ở -er khi chỉ người hay vật làm một việc gì: der Lehrling, der Vegetarismus, der Motor, der Bäcker, der Computer. Nhưng không phải từ nào tận cùng bằng -er cũng là giống đực: die Butter, das Fenster, die Mutter."
  - type: explain
    text:
      vi: "Đừng đoán giống theo nghĩa như khi dịch từ tiếng Việt: \"sức khoẻ\" không có giống, nhưng đuôi -heit cho biết die Gesundheit. Với từ ghép, chỉ cần nhìn từ cuối: das Leben + das Mittel → das Lebensmittel, der Inhalt + der Stoff → der Inhaltsstoff."
  - type: deep_explain
    text:
      vi: "Quy tắc hậu tố chỉ áp dụng khi đó thật sự là hậu tố: der Kuchen không có hậu tố -chen, das Ei không có hậu tố -ei, das Labor là ngoại lệ của -or, der Moment và der Irrtum là ngoại lệ của -ment, -um. Trên bao bì thực phẩm ở Đức thường có: Zutaten (thành phần), Nährwerte (giá trị dinh dưỡng), mindestens haltbar bis (hạn sử dụng tốt nhất trước ngày), Kann Spuren von Nüssen enthalten (có thể chứa vết các loại hạt) và nhãn Bio cho sản phẩm hữu cơ. Công thức nấu ăn (das Rezept – cùng từ với \"đơn thuốc\") thường viết động từ nguyên thể ở cuối thay cho câu mệnh lệnh: Die Kartoffeln schälen und in Stücke schneiden. Danh từ nguyên thể thì luôn viết hoa và là giống trung: das Essen, das Rauchen."
  - type: example
    target: Auf der Verpackung stehen alle Zutaten und Nährwerte.
    target_lang: de
    translation:
      vi: Trên bao bì có ghi tất cả thành phần và giá trị dinh dưỡng.
    note:
      vi: "die Verpackung (-ung → giống cái); die Zutat, der Nährwert phải học thuộc giống, số nhiều Zutaten, Nährwerte."
  - type: example
    target: Die Qualität der Lebensmittel ist hier sehr gut, weil fast alles aus der regionalen Landwirtschaft kommt.
    target_lang: de
    translation:
      vi: Chất lượng thực phẩm ở đây rất tốt, vì hầu hết đều đến từ nông nghiệp địa phương.
    note:
      vi: "die Qualität (-tät), die Landwirtschaft (-schaft): giống cái. der Lebensmittel: Genitiv số nhiều."
  - type: example
    target: "Zubereitung: Die Nüsse klein schneiden und mit dem Joghurt mischen."
    target_lang: de
    translation:
      vi: "Cách làm: thái nhỏ hạt rồi trộn với sữa chua."
    note:
      vi: "Ngôn ngữ công thức: động từ nguyên thể ở cuối. die Zubereitung: -ung → giống cái."
  - type: example
    target: Das Würstchen enthält leider viel Salz und einige Zusatzstoffe.
    target_lang: de
    translation:
      vi: Tiếc là xúc xích này chứa nhiều muối và một số chất phụ gia.
    note:
      vi: "das Würstchen: -chen → giống trung. enthalten (chứa): er/sie/es enthält."
  - type: common_mistake
    wrong: Das Gesundheit ist am wichtigsten.
    right: Die Gesundheit ist am wichtigsten.
    target_lang: de
    note:
      vi: "Đuôi -heit → giống cái: die Gesundheit, dù tiếng Việt không có giống để gợi ý."
  - type: common_mistake
    wrong: Ich lese die Zutaten auf dem Verpackung.
    right: Ich lese die Zutaten auf der Verpackung.
    target_lang: de
    note:
      vi: "Verpackung có đuôi -ung nên là giống cái; Dativ giống cái là der."
  - type: common_mistake
    wrong: Der Würstchen ist kalt.
    right: Das Würstchen ist kalt.
    target_lang: de
    note:
      vi: "Đừng đoán theo die Wurst: danh từ có hậu tố -chen là giống trung."
  - type: summary
    points:
      - vi: "die: -ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ik (số nhiều -en)."
      - vi: "das: -chen, -lein (số nhiều không đổi), -ment, -um, nguyên thể làm danh từ (das Kochen)."
      - vi: "der: -ling, -ismus, -or, -er chỉ người làm (der Bäcker) – nhưng die Butter, das Fenster."
      - vi: "Từ ghép: giống của từ cuối (das Lebensmittel, der Inhaltsstoff)."
      - vi: "Nhãn: Zutaten, Nährwerte, mindestens haltbar bis, ohne Zusatzstoffe, Bio."
      - vi: "Từ vựng: die Mahlzeit, die Gesundheit, frisch, haltbar, regional, enthalten."
