  - key: de:exercise:b1u05l3-mcq-rezept-kochen
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:a1u08-rezept
    prompt:
      stem: "Lan nhắn cho bạn: \"Kannst du mir das Rezept für deinen Nusskuchen schicken? Die Zubereitung sah so einfach aus!\" — Rezept ở đây nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: r3c, text: "công thức nấu ăn", lang: vi }
        - { id: r7d, text: "đơn thuốc", lang: vi }
        - { id: r1h, text: "hoá đơn", lang: vi }
        - { id: r5b, text: "bao bì", lang: vi }
    answer:
      correct_option_id: r3c
    explanation:
      vi: "das Rezept có hai nghĩa: đơn thuốc (ở phòng khám) và công thức nấu ăn. Ở đây nói về bánh (Nusskuchen) và cách làm (Zubereitung), nên là công thức nấu ăn. Hoá đơn là die Rechnung, bao bì là die Verpackung."
    display_answer: công thức nấu ăn

