  # ---------------- recall ----------------
  - key: de:exercise:b1u05l3-fill-artikel-suffix
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-g-wortbildung-nomen
    prompt:
      template: "{{b1}} Zubereitung ist ganz einfach. {{b2}} Medikament hilft gut gegen Kopfschmerzen. {{b3}} Vegetarismus wird immer beliebter."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 4 }
    answer:
      blanks:
        b1: [die]
        b2: [das]
        b3: [der]
    explanation:
      vi: "Zubereitung: -ung → die. Medikament: -ment → das. Vegetarismus: -ismus → der. Cả ba từ đều đoán được giống nhờ hậu tố."
    display_answer: "Die Zubereitung ist ganz einfach. Das Medikament hilft gut gegen Kopfschmerzen. Der Vegetarismus wird immer beliebter."

  - key: de:exercise:b1u05l3-fill-plural
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-inhaltsstoff
    prompt:
      template: "Auf der Packung stehen alle {{b1}} (die Zutat) und alle {{b2}} (der Inhaltsstoff). Viele {{b3}} (die Verpackung) sind leider aus Plastik."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 12 }
        - { id: b3, width_hint: 12 }
    answer:
      blanks:
        b1: [Zutaten]
        b2: [Inhaltsstoffe]
        b3: [Verpackungen]
    known_wrong:
      - answer: Zutats
        feedback_vi: die Zutat có số nhiều -en – die Zutaten.
        error_tag: plural_form
      - answer: Inhaltsstoffen
        feedback_vi: Sau alle ở Nominativ, số nhiều là die Inhaltsstoffe (đuôi -n chỉ thêm ở Dativ).
        error_tag: plural_form
      - answer: Verpackunge
        feedback_vi: Danh từ đuôi -ung có số nhiều -en – die Verpackungen.
        error_tag: plural_form
    explanation:
      vi: "die Zutat → die Zutaten; der Inhaltsstoff → die Inhaltsstoffe (giống der Stoff – die Stoffe); die Verpackung → die Verpackungen (danh từ -ung có số nhiều -en)."
    display_answer: "Auf der Packung stehen alle Zutaten und alle Inhaltsstoffe. Viele Verpackungen sind leider aus Plastik."

  - key: de:exercise:b1u05l3-tr-gesundheit
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-gesundheit
    prompt:
      source_text: Sức khoẻ là quan trọng nhất.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Die Gesundheit ist am wichtigsten.
        - Gesundheit ist am wichtigsten.
        - Am wichtigsten ist die Gesundheit.
        - Am wichtigsten ist Gesundheit.
        - Die Gesundheit ist das Wichtigste.
        - Gesundheit ist das Wichtigste.
        - Das Wichtigste ist die Gesundheit.
        - Das Wichtigste ist Gesundheit.
    known_wrong:
      - answer: Das Gesundheit ist am wichtigsten.
        feedback_vi: Đuôi -heit → giống cái – die Gesundheit.
        error_tag: article
      - answer: Der Gesundheit ist am wichtigsten.
        feedback_vi: Đuôi -heit → giống cái – die Gesundheit.
        error_tag: article
      - answer: Die Gesundheit ist am wichtigste.
        feedback_vi: Sau động từ, so sánh nhất là am + -sten – am wichtigsten.
        error_tag: adj_ending
    explanation:
      vi: "die Gesundheit (-heit → giống cái). \"quan trọng nhất\" sau động từ sein: am wichtigsten; hoặc dùng tính từ danh từ hoá: das Wichtigste (điều quan trọng nhất)."
    display_answer: Die Gesundheit ist am wichtigsten.

  # ---------------- application ----------------
  - key: de:exercise:b1u05l3-wb-verpackung-zutaten
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u05-verpackung
    prompt:
      instruction: "Sắp xếp thành câu, bắt đầu bằng Auf: \"Trên bao bì có ghi tất cả thành phần và giá trị dinh dưỡng.\""
      tokens:
        - { id: v-zutaten, text: Zutaten }
        - { id: v-stehen, text: stehen }
        - { id: v-der, text: der }
        - { id: v-naehrwerte, text: Nährwerte }
        - { id: v-auf, text: Auf }
        - { id: v-und, text: und }
        - { id: v-alle, text: alle }
        - { id: v-verpackung, text: Verpackung }
    answer:
      orders:
        - [v-auf, v-der, v-verpackung, v-stehen, v-alle, v-zutaten, v-und, v-naehrwerte]
        - [v-auf, v-der, v-verpackung, v-stehen, v-alle, v-naehrwerte, v-und, v-zutaten]
