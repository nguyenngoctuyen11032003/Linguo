      vi: "vorläufig nghĩa là \"tạm thời\". Ví dụ: Das ist nur eine vorläufige Lösung. (Đó chỉ là giải pháp tạm thời.)"
    display_answer: tạm thời
  - key: de:exercise:b1w3l2-mcq-artikel-terminkalender
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b1w3-terminkalender
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Terminkalender\" (sổ lịch hẹn): ___ Terminkalender"
      stem_lang: vi
      options:
        - { id: wpk, text: die, lang: de }
        - { id: g6t, text: das, lang: de }
        - { id: krq, text: ein, lang: de }
        - { id: vde, text: der, lang: de }
    answer:
      correct_option_id: vde
    explanation:
      vi: "Terminkalender là danh từ giống đực (der): der Terminkalender; số nhiều: die Terminkalender. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: der
