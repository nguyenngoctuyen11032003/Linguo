body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói và viết được các tình huống thường gặp ở văn phòng: lên lịch họp, thông báo, giao việc và thống nhất với đồng nghiệp."
  - type: explain
    text:
      vi: "Từ về họp hành: der Terminkalender (lịch hẹn), die Sitzung, die Konferenz, die Videokonferenz, der Besprechungsraum, die Tagesordnung (chương trình nghị sự). Muốn nói họp diễn ra khi nào và ở đâu, dùng stattfinden: Die Sitzung findet im Besprechungsraum statt."
  - type: explain
    text:
      vi: "Thư từ nội bộ: die Mitteilung, die Rundmail (thư gửi cả nhóm), das Postfach (hộp thư), die Vorlage (bản mẫu hoặc đề xuất trình lên), der Entwurf (bản nháp). Người liên hệ chính là der Ansprechpartner; phạm vi trách nhiệm là die Zuständigkeit."
  - type: explain
    text:
      vi: "Động từ giao tiếp: absprechen (thống nhất: spricht ab, sprach ab, hat abgesprochen), weitergeben (chuyển tiếp thông tin: gibt weiter, gab weiter, hat weitergegeben), informieren (+ Akk, über + Akk), ankündigen (báo trước), einplanen (đưa vào kế hoạch), koordinieren, vertagen (hoãn sang lần sau)."
  - type: deep_explain
    text:
      vi: "Eilig khác dringend một chút: eilig nhấn mạnh phải làm nhanh (Es ist eilig!), còn dringend nhấn mạnh tính cấp bách của nội dung. Vertraulich nghĩa là mật, không được tiết lộ: Bitte behandeln Sie die Informationen vertraulich. Vorläufig là tạm thời: eine vorläufige Lösung. Rechtzeitig nghĩa là kịp thời, trước hạn."
  - type: example
    target: Ich trage den Termin in meinen Terminkalender ein.
    target_lang: de
    translation:
      vi: Tôi ghi cuộc hẹn vào sổ lịch hẹn của mình.
    note:
      vi: der Terminkalender = sổ lịch hẹn.
  - type: example
    target: Der Besprechungsraum ist bis 16 Uhr belegt.
    target_lang: de
    translation:
      vi: Phòng họp đã có người sử dụng đến 16 giờ.
    note:
      vi: der Besprechungsraum = phòng họp.
  - type: example
    target: Auf der Tagesordnung stehen drei Punkte.
    target_lang: de
    translation:
      vi: Trong chương trình nghị sự có ba điểm.
    note:
      vi: die Tagesordnung = chương trình nghị sự.
  - type: example
    target: Die Mitteilung wurde an alle Abteilungen geschickt.
    target_lang: de
    translation:
      vi: Thông báo đã được gửi đến tất cả các phòng ban.
    note:
      vi: die Mitteilung = thông báo, tin nhắn.
  - type: common_mistake
    wrong: Wir müssen den Termin mit dem Kunden absprechen haben.
    right: Wir müssen den Termin mit dem Kunden absprechen.
    target_lang: de
    note:
      vi: Sau động từ khiếm khuyết, động từ chính ở nguyên thể; không thêm haben.
  - type: common_mistake
    wrong: Ich habe die Information an mein Kollege weitergegeben.
    right: Ich habe die Information an meinen Kollegen weitergegeben.
    target_lang: de
    note:
      vi: Sau an + Akkusativ, danh từ giống đực là den/meinen Kollegen (n-Deklination).
  - type: summary
    points:
      - vi: absprechen, weitergeben, informieren, ankündigen, einplanen, koordinieren, vertagen; eilig, vertraulich, vorläufig, rechtzeitig.
exercises:
