  - key: de:exercise:b1w3l2-mcq-de-vi-vorlaeufig
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w3-vorlaeufig
    prompt:
      stem: "\"vorläufig\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: jmx, text: "thông báo, cho biết", lang: vi }
        - { id: vo3, text: "kịp thời, đúng lúc", lang: vi }
