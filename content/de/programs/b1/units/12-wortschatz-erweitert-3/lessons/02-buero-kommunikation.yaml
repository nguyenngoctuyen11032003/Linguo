      vi: Câu bạn nghe có nghĩa "Vì chuyến đi, cuộc họp diễn ra dưới dạng trực tuyến.". Từ khoá là die Videokonferenz (cuộc họp trực tuyến); các câu còn lại nói về những từ khác trong bài.
    display_answer: Vì chuyến đi, cuộc họp diễn ra dưới dạng trực tuyến.
  - key: de:exercise:b1w3l2-mcq-vi-de-rundmail
