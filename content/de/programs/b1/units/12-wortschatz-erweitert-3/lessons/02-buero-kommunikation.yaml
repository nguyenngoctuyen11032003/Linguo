title:
  vi: Giao tiếp và tổ chức công việc văn phòng (Büro und Kommunikation)
objectives:
  - vi: Hiểu và dùng từ về lịch làm việc, họp hành và thư từ nội bộ.
  - vi: "Nói về việc phối hợp: absprechen, weitergeben, einplanen, koordinieren."
  - vi: "Mô tả mức độ khẩn cấp và tính bảo mật: eilig, vertraulich, vorläufig."
