    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b1w3-videokonferenz
    prompt:
      audio_asset_id: null
      fallback_text: Wegen der Reise findet die Besprechung als Videokonferenz statt.
      options:
        - { id: tyv, text: Phiên họp chắc chắn kéo dài hai tiếng., lang: vi }
        - { id: ghy, text: Ban giám đốc đã gửi một thư cho toàn thể., lang: vi }
        - { id: n9l, text: "Vì chuyến đi, cuộc họp diễn ra dưới dạng trực tuyến.", lang: vi }
        - { id: mcu, text: Ai là người liên hệ của tôi ở phòng nhân sự?, lang: vi }
    answer:
      correct_option_id: n9l
