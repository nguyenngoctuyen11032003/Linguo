    answer_lang: de
    difficulty: 1
    item: de:item:b1w3-rundmail
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "thư gửi cho cả nhóm"?
      stem_lang: vi
      options:
        - { id: d0v, text: der Besprechungsraum, lang: de }
        - { id: dnl, text: das Postfach, lang: de }
