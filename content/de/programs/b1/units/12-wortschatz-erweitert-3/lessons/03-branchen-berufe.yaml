        - Anh ấy đã hoàn thành chương trình đào tạo kinh doanh và bây giờ làm kế toán trong công nghiệp.
        - Anh ấy đã học một khóa nghề về kinh doanh và hiện làm kế toán trong lĩnh vực công nghiệp.
