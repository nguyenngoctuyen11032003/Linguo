title:
  vi: Ngành nghề và lĩnh vực kinh tế (Branchen und Berufe)
objectives:
  - vi: Gọi tên các ngành, lĩnh vực kinh tế và nhiều nghề nghiệp thường gặp.
  - vi: "Nhận biết giống và dạng nữ của tên nghề: der Informatiker – die Informatikerin."
  - vi: "Dùng các tính từ chỉ lĩnh vực: handwerklich, kaufmännisch, technisch, medizinisch."
