body:
  - type: objective
    text:
      vi: Sau bài này, bạn hiểu các thuật ngữ cơ bản về ngân hàng, vay, thuế và bảo hiểm ở Đức và nói được về chuyện tiền bạc cá nhân.
  - type: explain
    text:
      vi: "Ngân hàng: das Girokonto (tài khoản thanh toán), das Sparkonto (tài khoản tiết kiệm; số nhiều Sparkonten), der Kontostand (số dư), der Kontoauszug (sao kê). Vay mượn: der Kredit, das Darlehen, die Rate (kỳ trả góp), der Zinssatz. Người vay là der Schuldner; ai nợ tiền thì là verschuldet."
  - type: explain
    text:
      vi: "Bảo hiểm bắt buộc ở Đức gồm die Krankenversicherung, die Sozialversicherung; còn die Haftpflichtversicherung (bảo hiểm trách nhiệm) rất phổ biến dù không bắt buộc. Người đóng phí hằng tháng trả der Beitrag. Ai có bảo hiểm thì versichert: Ich bin gegen Schäden versichert."
  - type: explain
    text:
      vi: "Thuế: die Steuererklärung (tờ khai thuế), die Lohnsteuer (thuế thu nhập từ tiền lương). Động từ: absetzen (khấu trừ thuế: setzt ab, setzte ab, hat abgesetzt), abbuchen (trừ tiền từ tài khoản), zurückzahlen (trả lại), sich verschulden (mắc nợ), versichern (bảo hiểm, ví dụ: ein Auto versichern). Steuerpflichtig là người phải đóng thuế."
  - type: deep_explain
    text:
      vi: Das Darlehen có số nhiều Darlehen (không đổi), còn Kredit số nhiều Kredite; hai từ này gần như đồng nghĩa nhưng Darlehen thường dùng trong hợp đồng, Kredit trong lời nói hằng ngày. Die Geldanlage là hình thức đầu tư tiền; bạn nên tìm hiểu kỹ trước khi quyết định. Der Beitrag còn có nghĩa là bài viết, đóng góp, tùy ngữ cảnh.
  - type: example
    target: Für das Haus haben wir einen Kredit aufgenommen.
    target_lang: de
    translation:
      vi: Chúng tôi đã vay một khoản để mua nhà.
    note:
      vi: der Kredit = khoản vay, tín dụng.
  - type: example
    target: Die Bank hat uns ein Darlehen gegeben.
    target_lang: de
    translation:
      vi: Ngân hàng đã cho chúng tôi một khoản vay.
    note:
      vi: das Darlehen = khoản cho vay, khoản vay.
  - type: example
    target: Auf meinem Sparkonto sind fünftausend Euro.
    target_lang: de
    translation:
      vi: Trong tài khoản tiết kiệm của tôi có năm nghìn euro.
    note:
      vi: das Sparkonto = tài khoản tiết kiệm.
  - type: example
    target: Meine Miete wird von meinem Girokonto abgebucht.
    target_lang: de
    translation:
      vi: Tiền thuê nhà của tôi được trừ từ tài khoản thanh toán.
    note:
      vi: das Girokonto = tài khoản thanh toán.
  - type: common_mistake
    wrong: Ich habe ein Kredit bei der Bank aufgenommen.
    right: Ich habe einen Kredit bei der Bank aufgenommen.
    target_lang: de
    note:
      vi: Kredit là giống đực, tân ngữ Akkusativ nên dùng einen.
  - type: common_mistake
    wrong: Die Miete wird von meinem Konto abbuchen.
    right: Die Miete wird von meinem Konto abgebucht.
    target_lang: de
    note:
      vi: "Bị động cần Partizip II: wird abgebucht (abbuchen là động từ tách)."
  - type: summary
    points:
      - vi: "das Girokonto, das Sparkonto (Sparkonten), der Kontostand, der Kontoauszug, der Kredit, das Darlehen, die Rate, der Zinssatz."
      - vi: "die Krankenversicherung, die Sozialversicherung, die Haftpflichtversicherung, die Steuererklärung, die Lohnsteuer, die Geldanlage."
      - vi: "abbuchen, zurückzahlen, versichern, absetzen, sich verschulden; verschuldet, versichert, steuerpflichtig."
