title:
  vi: Danh từ thông dụng ở trình độ B1 (2) (Wichtige Nomen 2)
objectives:
  - vi: Học thêm các danh từ chung thường dùng trong đời sống và bài viết.
  - vi: Nhớ giống và số nhiều của các danh từ này.
  - vi: "Dùng các danh từ trong cụm từ thường gặp: in der Mitte, auf diese Weise, in Gefahr."
estimated_minutes: 15
