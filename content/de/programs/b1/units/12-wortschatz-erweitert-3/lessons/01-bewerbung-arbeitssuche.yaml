    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: Ich möchte mich bei Ihrer Firma bewerben, deshalb schicke ich Ihnen meine Bewerbungsunterlagen.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich möchte mich bei Ihrer Firma bewerben, deshalb schicke ich Ihnen meine Bewerbungsunterlagen.
        - Ich möchte mich bei Ihrer Firma bewerben und schicke Ihnen deshalb meine Bewerbungsunterlagen.
        - Deshalb schicke ich Ihnen meine Bewerbungsunterlagen, denn ich möchte mich bei Ihrer Firma bewerben.
    explanation:
      vi: "Gợi ý đáp án: Ich möchte mich bei Ihrer Firma bewerben, deshalb schicke ich Ihnen meine Bewerbungsunterlagen. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Ich möchte mich bei Ihrer Firma bewerben, deshalb schicke ich Ihnen meine Bewerbungsunterlagen.
    item: de:item:b1w3-bewerbungsunterlagen
  - key: de:exercise:b1w3l1-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Als Quereinsteigerin wurde sie drei Wochen lang sorgfältig eingearbeitet.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Là người chuyển ngành, cô ấy đã được hướng dẫn làm quen với công việc kỹ lưỡng trong ba tuần.
        - Vì chuyển sang nghề mới, cô ấy được đào tạo làm quen công việc cẩn thận suốt ba tuần.
        - Với tư cách là người chuyển nghề, cô ấy đã được hướng dẫn kỹ lưỡng trong ba tuần đầu.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Als Quereinsteigerin wurde sie drei Wochen lang sorgfältig eingearbeitet.\" nghĩa là: Là người chuyển ngành, cô ấy đã được hướng dẫn làm quen với công việc kỹ lưỡng trong ba tuần. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Là người chuyển ngành, cô ấy đã được hướng dẫn làm quen với công việc kỹ lưỡng trong ba tuần.
    item: de:item:b1w3-quereinsteiger
