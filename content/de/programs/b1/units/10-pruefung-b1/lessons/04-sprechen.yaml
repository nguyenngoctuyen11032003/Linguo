body:
  - type: objective
    text:
      vi: "Sau bài này, khi chưa hiểu hoặc cần thời gian, bạn không im lặng mà nói được: \"Habe ich Sie richtig verstanden, dass …?\" hoặc \"Moment, lass mich kurz überlegen.\""
  - type: explain
    text:
      vi: "Khi chưa hiểu, đừng im lặng: hỏi lại là việc bình thường và được mong đợi trong một cuộc trò chuyện tiếng Đức. Mẫu hay dùng: Habe ich Sie richtig verstanden, dass …? (động từ cuối câu dass), Wie meinen Sie das? Bạn cũng có thể dùng câu hỏi gián tiếp đã học ở A2: Können Sie mir sagen, was das Wort bedeutet?"
  - type: explain
    text:
      vi: "Cần thời gian suy nghĩ, bạn nói: Moment, lass mich kurz überlegen. (với Sie: Moment, lassen Sie mich kurz überlegen.) hoặc Das ist eine gute Frage. Người Việt hay im lặng hoặc kéo dài \"ờ…\"; trong tiếng Đức, một câu câu giờ ngắn nghe tự nhiên hơn nhiều."
  - type: explain
    text:
      vi: "Bổ sung ý: Darf ich kurz etwas ergänzen? / Ich möchte noch etwas ergänzen: … Ngắt lời lịch sự: Entschuldigung, wenn ich Sie unterbreche, aber … / Darf ich Sie kurz unterbrechen? Ngắt lời mà không có câu xin lỗi nghe khá thô, nhất là với người bạn gọi là Sie."
  - type: explain
    text:
      vi: "Theo mô tả tại thời điểm soạn (cần đối chiếu quy định hiện hành), phần nói B1 thi theo cặp: cùng nhau lên kế hoạch một việc, mỗi người trình bày một chủ đề, rồi phản hồi và trả lời câu hỏi về phần trình bày. Ở phần lên kế hoạch, hãy đề nghị, hỏi ý kiến bạn thi và thay phiên nhau nói (sich abwechseln) – đừng độc thoại."
  - type: deep_explain
    text:
      vi: "Một chuỗi giữ hội thoại khi lên kế hoạch: đề nghị (Wollen wir …? / Wir könnten …), hỏi ý kiến (Was meinst du? / Was hältst du davon?), đồng ý hoặc phản đối có lý do, hỏi lại khi chưa rõ, rồi tóm tắt kết quả (Also, wir machen …). Khi bạn thi nói quá lâu, bạn có thể xen vào nhẹ nhàng: Darf ich kurz etwas sagen? Khi muốn nói nốt ý mình: Darf ich den Gedanken noch kurz zu Ende führen? Bị hỏi điều bạn chưa nghĩ tới thì thành thật: Darüber habe ich noch nicht nachgedacht, aber ich glaube … Với bạn thi, hãy chọn du hoặc Sie và giữ nhất quán; với giám khảo thường dùng Sie. Nhớ: lass mich (du) – lasst mich (ihr) – lassen Sie mich (Sie)."
  - type: example
    target: Habe ich Sie richtig verstanden, dass der Kurs nur am Wochenende stattfindet?
    target_lang: de
    translation:
      vi: Có phải ý anh/chị là khóa học chỉ diễn ra vào cuối tuần không?
    note:
      vi: "Hỏi lại người lạ (Sie). Câu phụ dass: động từ tách stattfinden viết liền ở cuối."
  - type: example
    target: Moment, lass mich kurz überlegen. Ich glaube, Samstag passt mir besser.
    target_lang: de
    translation:
      vi: Khoan, để mình nghĩ một chút. Mình nghĩ thứ Bảy hợp với mình hơn.
    note:
      vi: "Nói với bạn thi (du): lass mich. Với Sie: lassen Sie mich kurz überlegen."
  - type: example
    target: Darf ich kurz etwas ergänzen? Man muss die Tickets vorher online kaufen.
    target_lang: de
    translation:
      vi: Mình bổ sung một chút được không? Phải mua vé trước trên mạng.
    note:
      vi: "Bổ sung một thông tin cho kế hoạch chung. ergänzen không tách."
  - type: example
    target: Entschuldigung, wenn ich Sie unterbreche, aber wir haben nur noch fünf Minuten.
    target_lang: de
    translation:
      vi: Xin lỗi vì tôi ngắt lời anh/chị, nhưng chúng ta chỉ còn năm phút.
    note:
      vi: "Ngắt lời lịch sự (Sie): câu xin lỗi + aber + lý do. unterbrechen không tách: ich unterbreche."
  - type: example
    target: Wie bitte? Können Sie mir sagen, was das Wort Ehrenamt genau bedeutet?
    target_lang: de
    translation:
      vi: Xin lỗi, anh/chị nói gì ạ? Anh/chị có thể cho tôi biết từ Ehrenamt chính xác nghĩa là gì không?
    note:
      vi: "Hỏi nghĩa một từ bằng câu hỏi gián tiếp (A2U06): was … bedeutet, động từ ở cuối."
  - type: example
    target: Da stimme ich dir zu. Darf ich kurz etwas ergänzen? Am Wochenende sind die Museen oft sehr voll.
    target_lang: de
    translation:
      vi: Mình đồng ý với bạn. Mình bổ sung một chút được không? Cuối tuần các bảo tàng thường rất đông.
    note:
      vi: "Kiểu Sprechen Teil 1: đồng ý (Da stimme ich dir zu – đã học ở B1U06) rồi bổ sung một thông tin quan trọng cho kế hoạch."
  - type: example
    target: Ich komme jetzt zu meinem zweiten Punkt. – Entschuldigung, darf ich kurz eine Rückfrage stellen?
    target_lang: de
    translation:
      vi: Bây giờ tôi chuyển sang ý thứ hai. – Xin lỗi, tôi hỏi lại một chút được không?
    note:
      vi: "Ich komme jetzt zu … là câu chuyển ý khi thuyết trình (B1U09). Người nghe xen vào lịch sự để hỏi lại: eine Rückfrage stellen."
  - type: common_mistake
    wrong: Habe ich Sie richtig verstanden, dass der Kurs findet am Samstag statt?
    right: Habe ich Sie richtig verstanden, dass der Kurs am Samstag stattfindet?
    target_lang: de
    note:
      vi: "Sau dass, động từ chia đứng cuối và động từ tách viết liền: stattfindet."
  - type: common_mistake
    wrong: Moment, Herr Weber, lass mich kurz überlegen.
    right: Moment, Herr Weber, lassen Sie mich kurz überlegen.
    target_lang: de
    note:
      vi: "Với người bạn gọi là Herr/Frau + họ (Sie), dùng lassen Sie mich; lass mich chỉ dùng với du."
  - type: common_mistake
    wrong: Was?
    right: Wie bitte? Können Sie das noch einmal sagen?
    target_lang: de
    note:
      vi: "Im lặng khi không hiểu là lỗi hay gặp; còn Was? nghe cộc lốc. Hãy hỏi lại lịch sự."
  - type: common_mistake
    wrong: Am Samstag gehen wir ins Museum, dann essen wir im Restaurant, und am Abend gehen wir ins Kino.
    right: Wir könnten am Samstag ins Museum gehen. Was meinst du?
    target_lang: de
    note:
      vi: "Ở phần cùng lên kế hoạch, một người tự quyết hết là độc thoại. Hãy đề nghị một ý rồi hỏi ý kiến bạn thi."
  - type: summary
    points:
      - vi: "Hỏi lại: Habe ich Sie richtig verstanden, dass …? / Wie meinen Sie das? / Wie bitte?"
      - vi: "Câu giờ: Moment, lass mich (lassen Sie mich) kurz überlegen. / Das ist eine gute Frage."
      - vi: "Bổ sung: Darf ich kurz etwas ergänzen?"
      - vi: "Ngắt lời: Entschuldigung, wenn ich Sie unterbreche, aber … / Darf ich Sie kurz unterbrechen?"
      - vi: "Lên kế hoạch: đề nghị → hỏi ý kiến → thay phiên nhau → thống nhất."
      - vi: "Từ: nachfragen, ergänzen, unterbrechen (không tách), die Rückfrage, das Gespräch, der Gesprächspartner."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:b1u10l4-listen-nachfragen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u10-g-gespraechsstrategien
    prompt:
      audio_asset_id: null
      fallback_text: Habe ich Sie richtig verstanden, dass wir das Formular online ausfüllen müssen?
      options:
        - { id: n1a, text: "Người nói hỏi lại để chắc mình hiểu đúng: phải điền mẫu đơn trên mạng.", lang: vi }
        - { id: n2b, text: "Người nói ngắt lời để nói rằng mẫu đơn đã được điền.", lang: vi }
        - { id: n3c, text: "Người nói xin thời gian để suy nghĩ về mẫu đơn.", lang: vi }
        - { id: n4d, text: "Người nói bổ sung rằng không được điền mẫu đơn trên mạng.", lang: vi }
    answer:
      correct_option_id: n1a
    explanation:
      vi: "Habe ich Sie richtig verstanden, dass …? là câu hỏi lại để kiểm tra mình hiểu đúng chưa. Nội dung trong câu dass: wir … das Formular online ausfüllen müssen – phải điền mẫu đơn trên mạng."
    display_answer: "Người nói hỏi lại để chắc mình hiểu đúng: phải điền mẫu đơn trên mạng."

  - key: de:exercise:b1u10l4-listen-ueberlegen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u10-g-gespraechsstrategien
    prompt:
      audio_asset_id: null
      fallback_text: Hm, das ist eine gute Frage. Moment, lass mich kurz überlegen.
      options:
        - { id: u1a, text: "Người nói xin một chút thời gian để suy nghĩ.", lang: vi }
        - { id: u2b, text: "Người nói không hiểu câu hỏi và nhờ hỏi lại.", lang: vi }
        - { id: u3c, text: "Người nói từ chối trả lời câu hỏi.", lang: vi }
        - { id: u4d, text: "Người nói xin lỗi vì đã ngắt lời.", lang: vi }
    answer:
      correct_option_id: u1a
    explanation:
      vi: "Das ist eine gute Frage và Moment, lass mich kurz überlegen là hai cách câu giờ: người nói hiểu câu hỏi, chỉ cần vài giây để nghĩ. überlegen = suy nghĩ, cân nhắc."
    display_answer: "Người nói xin một chút thời gian để suy nghĩ."

  - key: de:exercise:b1u10l4-listen-unterbrechen
