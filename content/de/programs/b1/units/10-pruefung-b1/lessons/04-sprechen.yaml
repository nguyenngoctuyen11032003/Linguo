    difficulty: 2
    item: de:item:b1u10-unterbrechen
    prompt:
      audio_asset_id: null
      fallback_text: Entschuldigung, wenn ich Sie unterbreche, aber der Zug fährt schon um acht und nicht um neun.
      options:
        - { id: z1a, text: "Người nói ngắt lời lịch sự để sửa thông tin: tàu chạy lúc tám giờ, không phải chín giờ.", lang: vi }
