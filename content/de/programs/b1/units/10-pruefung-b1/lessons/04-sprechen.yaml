  - key: de:exercise:b1u10l4-mcq-lassen-sie-mich
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:b1u10-g-gespraechsstrategien
    prompt:
      stem: "Giám khảo hỏi bạn một câu khó. Bạn nói với giám khảo (Sie). Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: l1a, text: "Moment, lassen Sie mich kurz überlegen.", lang: de }
        - { id: l2b, text: "Moment, lass Sie mich kurz überlegen.", lang: de }
        - { id: l3c, text: "Moment, lassen mich kurz überlegen.", lang: de }
        - { id: l4d, text: "Moment, lasst mich kurz überlegen.", lang: de }
    answer:
      correct_option_id: l1a
    explanation:
      vi: "Mệnh lệnh với Sie: lassen Sie + mich. lass dùng với du, lasst với ihr; lassen mich thiếu Sie. Chỉ có lassen Sie mich là đúng khi nói với giám khảo."
    display_answer: "Moment, lassen Sie mich kurz überlegen."

  # ---------------- recall ----------------
  - key: de:exercise:b1u10l4-fill-verstanden-ergaenzen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u10-ergaenzen
    prompt:
      template: "Habe ich Sie richtig {{b1}} (verstehen), dass wir uns am Montag {{b2}} (treffen)? Darf ich noch kurz etwas {{b3}} (ergänzen)?"
      blanks:
        - { id: b1, width_hint: 10 }
        - { id: b2, width_hint: 7 }
        - { id: b3, width_hint: 8 }
    answer:
      blanks:
        b1: [verstanden]
        b2: [treffen]
        b3: [ergänzen]
    known_wrong:
      - answer: verstehen
        feedback_vi: "Habe … + Partizip II (Perfekt): verstanden."
        error_tag: participle_form
      - answer: geverstanden
        feedback_vi: "verstehen có tiền tố ver- không tách, nên Partizip II không có ge-: verstanden."
        error_tag: participle_form
      - answer: ergänzt
        feedback_vi: "Sau darf, động từ chính ở nguyên thể cuối câu: ergänzen."
        error_tag: verb_form
      - answer: treffen uns
        feedback_vi: "Đại từ uns đã có trong câu; trong câu phụ dass, chỉ động từ treffen đứng cuối."
        error_tag: word_order
    explanation:
      vi: "Habe ich … verstanden: Perfekt, Partizip II của verstehen là verstanden (không có ge-). Câu phụ dass: động từ treffen đứng cuối. Sau động từ khiếm khuyết darf: nguyên thể ergänzen ở cuối."
    display_answer: "Habe ich Sie richtig verstanden, dass wir uns am Montag treffen? Darf ich noch kurz etwas ergänzen?"

  - key: de:exercise:b1u10l4-tr-unterbrechen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u10-unterbrechen
    prompt:
      source_text: "Xin lỗi vì tôi ngắt lời anh/chị, nhưng tôi có một câu hỏi. (nói với Sie)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Entschuldigung, wenn ich Sie unterbreche, aber ich habe eine Frage.
        - Entschuldigung, dass ich Sie unterbreche, aber ich habe eine Frage.
        - Entschuldigen Sie, wenn ich Sie unterbreche, aber ich habe eine Frage.
        - Entschuldigen Sie, dass ich Sie unterbreche, aber ich habe eine Frage.
        - Entschuldigung, wenn ich unterbreche, aber ich habe eine Frage.
        - Entschuldigung, dass ich unterbreche, aber ich habe eine Frage.
        - Entschuldigung, wenn ich Sie unterbreche, aber ich hätte eine Frage.
        - Entschuldigung, dass ich Sie unterbreche, aber ich hätte eine Frage.
        - Entschuldigen Sie, wenn ich Sie unterbreche, aber ich hätte eine Frage.
        - Entschuldigen Sie bitte, wenn ich Sie unterbreche, aber ich habe eine Frage.
        - Entschuldigen Sie bitte, dass ich Sie unterbreche, aber ich habe eine Frage.
    known_wrong:
      - answer: Entschuldigung, wenn ich Sie breche unter, aber ich habe eine Frage.
        feedback_vi: "unterbrechen không tách: ich unterbreche, và trong câu phụ nó đứng cuối."
        error_tag: separable_prefix
      - answer: Entschuldigung, wenn ich unterbreche Sie, aber ich habe eine Frage.
        feedback_vi: "Trong câu phụ wenn/dass, động từ đứng cuối: wenn ich Sie unterbreche."
        error_tag: verb_position
      - answer: Entschuldigung, wenn ich dich unterbreche, aber ich habe eine Frage.
        feedback_vi: "Đề yêu cầu nói với Sie: wenn ich Sie unterbreche."
        error_tag: register_du_sie
    explanation:
      vi: "Cụm ngắt lời lịch sự: Entschuldigung, wenn/dass ich Sie unterbreche, aber … unterbrechen là động từ không tách, đứng cuối câu phụ; Sie là tân ngữ Akkusativ."
    display_answer: Entschuldigung, wenn ich Sie unterbreche, aber ich habe eine Frage.

  - key: de:exercise:b1u10l4-tr-deutlicher
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u10-deutlich
    prompt:
      source_text: "Anh/chị có thể nói rõ hơn một chút được không? (phát âm rõ hơn; nói với người lạ, dùng Sie và Konjunktiv II)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Könnten Sie bitte etwas deutlicher sprechen?
        - Könnten Sie etwas deutlicher sprechen?
        - Könnten Sie bitte ein bisschen deutlicher sprechen?
        - Könnten Sie ein bisschen deutlicher sprechen?
        - Könnten Sie bitte ein wenig deutlicher sprechen?
        - Könnten Sie ein wenig deutlicher sprechen?
    known_wrong:
      - answer: Könnten Sie bitte sprechen etwas deutlicher?
        feedback_vi: "Nguyên thể sprechen đứng cuối câu: Könnten Sie bitte etwas deutlicher sprechen?"
        error_tag: verb_position
      - answer: Könntest du bitte etwas deutlicher sprechen?
        feedback_vi: "Đề yêu cầu nói với người lạ (Sie): Könnten Sie …?"
        error_tag: register_du_sie
    explanation:
      vi: "Könnten Sie …? (Konjunktiv II) là lời nhờ lịch sự; deutlicher là so sánh hơn của deutlich (rõ hơn); nguyên thể sprechen đứng cuối câu."
    display_answer: Könnten Sie bitte etwas deutlicher sprechen?

  # ---------------- application ----------------
  - key: de:exercise:b1u10l4-listen-abschiedsfest
    type: listen
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:a2u08-g-vorschlag-wir
    prompt:
      audio_asset_id: null
      fallback_text: Wollen wir für unsere Lehrerin ein kleines Abschiedsfest organisieren? – Gute Idee! Wir könnten am Freitag im Kursraum feiern. – Habe ich dich richtig verstanden, dass wir dort auch kochen sollen? – Nein, nein, jeder bringt etwas mit. – Ach so! Dann bringe ich einen Kuchen mit.
      options:
        - { id: k1a, text: "Họ tổ chức tiệc chia tay cô giáo vào thứ Sáu ở phòng học, mỗi người mang một món.", lang: vi }
        - { id: k2b, text: "Họ tổ chức tiệc chia tay vào thứ Sáu và cùng nấu ăn ở phòng học.", lang: vi }
        - { id: k3c, text: "Họ tổ chức tiệc chia tay vào thứ Sáu ở nhà hàng.", lang: vi }
        - { id: k4d, text: "Chỉ một người mang bánh, những người khác không phải mang gì.", lang: vi }
    answer:
      correct_option_id: k1a
    explanation:
      vi: "Kiểu Sprechen Teil 1 (cùng lên kế hoạch). Wollen wir … organisieren? là lời đề nghị; Habe ich dich richtig verstanden, dass … là hỏi lại (du); câu trả lời: jeder bringt etwas mit – mỗi người mang một món, không nấu ở đó."
    display_answer: "Họ tổ chức tiệc chia tay cô giáo vào thứ Sáu ở phòng học, mỗi người mang một món."

