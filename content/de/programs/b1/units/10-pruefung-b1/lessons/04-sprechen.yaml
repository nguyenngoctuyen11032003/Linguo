  - vi: Làm quen ba phần thi nói B1 (cùng lên kế hoạch; trình bày một chủ đề; phản hồi và trả lời câu hỏi) mà không im lặng hay nói độc thoại.
  - vi: Dùng đúng du/Sie trong các cụm giữ hội thoại (lass mich – lassen Sie mich).
