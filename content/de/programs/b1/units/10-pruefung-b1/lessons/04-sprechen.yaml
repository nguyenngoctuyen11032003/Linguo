        - { id: z4d, text: "Người nói xin lỗi vì đến muộn chuyến tàu tám giờ.", lang: vi }
    answer:
      correct_option_id: z1a
    explanation:
      vi: "Entschuldigung, wenn ich Sie unterbreche, aber … là cách ngắt lời lịch sự. Thông tin được sửa: schon um acht und nicht um neun – đã chạy lúc tám giờ, không phải chín giờ."
