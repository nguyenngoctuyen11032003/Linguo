title:
  vi: Đọc hiểu – từ quy chiếu trong văn bản (Textverweise – dies, dabei, deshalb)
objectives:
  - vi: Nhận ra các từ quy chiếu dies/das, dieser, solche, dabei, dafür, dadurch, deshalb và tìm đúng câu hay ý mà chúng trỏ về.
  - vi: Làm quen năm dạng bài đọc B1 (blog đúng/sai, bài báo chọn ý, ghép quảng cáo, ý kiến ủng hộ/phản đối, quy định – hướng dẫn) với chiến lược tìm từ khóa.
  - vi: Chọn đáp án vì trùng nghĩa chứ không vì trùng chữ.
