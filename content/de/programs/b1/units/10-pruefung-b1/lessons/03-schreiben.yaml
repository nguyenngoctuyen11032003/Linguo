  - key: de:exercise:b1u10l3-mcq-forum-anfang
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u10-g-formeller-brief
    prompt:
      stem: "Kiểu Schreiben Teil 2: bạn viết bài trên diễn đàn trả lời câu hỏi \"Ab wann sollten Kinder ein eigenes Handy haben?\". Câu mở đầu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: o1a, text: "Ich finde, dass Kinder nicht zu früh ein eigenes Handy bekommen sollten.", lang: de }
        - { id: o2b, text: "Sehr geehrte Damen und Herren, ich schreibe Ihnen wegen meiner Rechnung.", lang: de }
        - { id: o3c, text: "Für Rückfragen stehe ich gern zur Verfügung.", lang: de }
        - { id: o4d, text: "Liebe Grüße und bis bald!", lang: de }
    answer:
      correct_option_id: o1a
    explanation:
      vi: "Bài diễn đàn mở bằng ý kiến của mình về đúng chủ đề (Ich finde, dass …). Lời chào kiểu thư trang trọng, câu kết của thư và lời chào cuối thân mật đều không hợp với phần mở đầu của bài diễn đàn."
    display_answer: "Ich finde, dass Kinder nicht zu früh ein eigenes Handy bekommen sollten."
