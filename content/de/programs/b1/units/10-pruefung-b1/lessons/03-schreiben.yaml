title:
  vi: Viết – thư trang trọng chuẩn (Der formelle Brief)
objectives:
  - vi: Viết tin nhắn hoặc e-mail trang trọng ngắn (khoảng 40 từ) có tiêu đề, lời chào, lý do, yêu cầu lịch sự và lời kết đúng.
  - vi: Viết e-mail thân mật (khoảng 80 từ) và bài trên diễn đàn (khoảng 80 từ) trả lời đủ các ý đề yêu cầu, có từ nối.
  - vi: Phân biệt thân mật – trang trọng và viết hoa đúng Sie, Ihnen, Ihr.
