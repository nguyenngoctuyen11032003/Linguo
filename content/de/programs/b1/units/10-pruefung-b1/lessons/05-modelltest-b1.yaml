      direction: target_to_vi
    answer:
      accepted:
        - Mình hiểu đúng không, là cuối tuần bạn không rảnh?
        - Mình hiểu có đúng không, là cuối tuần bạn không rảnh?
        - Mình hiểu có đúng không, là cuối tuần bạn không có thời gian?
        - Có phải ý bạn là cuối tuần bạn không rảnh không?
        - Có phải ý bạn là cuối tuần bạn không có thời gian không?
        - Có phải bạn nói là cuối tuần bạn không rảnh không?
        - Ý bạn là cuối tuần bạn không rảnh à?
        - Ý bạn là cuối tuần bạn không có thời gian à?
        - Tôi hiểu đúng không, là cuối tuần bạn không rảnh?
