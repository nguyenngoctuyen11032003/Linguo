      - answer: zu
        feedback_vi: "der Kurs cần mạo từ: zu + dem = zum Kurs."
        error_tag: article
      - answer: würde
        feedback_vi: "Cụm cố định là Ich wäre Ihnen dankbar (Konjunktiv II của sein)."
        error_tag: konjunktiv_form
      - answer: bin
        feedback_vi: "Đề yêu cầu Konjunktiv II của sein: Ich wäre Ihnen dankbar, wenn … – cách nhờ lịch sự cố định của thư trang trọng."
        error_tag: konjunktiv_form
    explanation:
      vi: "Kiểu Schreiben Teil 3 (tin nhắn trang trọng). zum Kurs kommen = đến lớp (cũng nói in den Kurs kommen). Ich wäre Ihnen dankbar, wenn Sie … schicken könnten (hoặc würden): Konjunktiv II, động từ chia đứng cuối câu wenn."
    display_answer: "Sehr geehrte Frau Weber, leider kann ich am Montag nicht zum Kurs kommen. Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen per E-Mail schicken könnten. Mit freundlichen Grüßen Minh Tran"

