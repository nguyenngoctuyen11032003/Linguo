    prompt:
      template: "Sehr geehrte Frau Weber, leider kann ich am Montag nicht {{b1}} Kurs kommen. Ich {{b2}} (sein, Konjunktiv II) Ihnen dankbar, wenn Sie mir die Unterlagen per E-Mail schicken {{b3}}. Mit freundlichen Grüßen Minh Tran"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 5 }
        - { id: b3, width_hint: 8 }
    answer:
      blanks:
        b1: [zum, in den]
        b2: [wäre]
        b3: [könnten, würden]
    known_wrong:
      - answer: im
