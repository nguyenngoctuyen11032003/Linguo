title:
  vi: Nghe hiểu – tiếng Đức nói thực tế (Gesprochene Sprache)
objectives:
  - vi: Nghe hiểu các dạng rút gọn khi nói (hab, gibt's, 'n, nee/nö, ne?, gell?, weil + V2, ach so, na ja) và biết dạng viết chuẩn tương ứng.
  - vi: Làm quen bốn dạng bài nghe B1 – tin ngắn (bản tin thời tiết, tin nhắn thoại), hướng dẫn tham quan, cuộc trò chuyện, thảo luận trên radio (ai nói gì).
  - vi: Ghi từ khóa ngay lần nghe đầu thay vì cố nghe từng từ.
