    item: de:item:a2u03-g-weil
    prompt:
      stem: "Bạn nghe một người bạn nói: \"Ich komm nicht, weil – ich hab keine Zeit.\" Bạn muốn viết ý này trong e-mail gửi giáo viên (Sie). Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: c1a, text: "Leider kann ich nicht kommen, weil ich keine Zeit habe.", lang: de }
        - { id: c2b, text: "Leider kann ich nicht kommen, weil ich habe keine Zeit.", lang: de }
        - { id: c3c, text: "Leider kann ich nicht kommen, weil ich keine Zeit hab.", lang: de }
        - { id: c4d, text: "Ich komm leider nicht, weil ich keine Zeit habe.", lang: de }
    answer:
      correct_option_id: c1a
    explanation:
