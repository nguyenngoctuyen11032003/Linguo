    display_answer: Lena và Paul hay cãi nhau, nhưng họ rất hạnh phúc bên nhau.

  - key: de:exercise:b1u02l4-listen-geburtstag
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u02-enttaeuscht
    prompt:
      audio_asset_id: null
      fallback_text: Ich bin ein bisschen enttäuscht von meinem Bruder, weil er meinen Geburtstag vergessen hat. Trotzdem bin ich nicht wütend auf ihn.
      options:
        - { id: g3a, text: "Người nói hơi thất vọng về anh trai vì anh ấy quên sinh nhật mình, nhưng không giận anh ấy.", lang: vi }
        - { id: g7b, text: "Người nói hơi thất vọng về anh trai vì anh ấy quên sinh nhật mình, và rất giận anh ấy.", lang: vi }
        - { id: g1c, text: "Người nói hơi thất vọng về anh trai vì anh ấy không đến dự sinh nhật, nhưng không giận anh ấy.", lang: vi }
        - { id: g5d, text: "Anh trai thất vọng về người nói vì người nói quên sinh nhật anh ấy.", lang: vi }
    answer:
