  # ---------------- recall ----------------
  - key: de:exercise:b1u02l4-fill-obwohl-trotzdem
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u02-g-obwohl-trotzdem
    prompt:
      template: "{{b1}} (obwohl/trotzdem) Lan und ich uns manchmal streiten, sind wir beste Freundinnen. Letzte Woche habe ich meine Prüfung nicht bestanden. {{b2}} (obwohl/trotzdem) hat Lan gesagt, dass sie stolz {{b3}} mich ist."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 9 }
        - { id: b3, width_hint: 4 }
    answer:
      blanks:
        b1: [Obwohl]
        b2: [Trotzdem]
        b3: [auf]
    known_wrong:
      - answer: für
        feedback_vi: Tự hào về ai là stolz auf + Akkusativ.
        error_tag: preposition
      - answer: von
        feedback_vi: Không dịch theo tiếng Anh (proud of) – stolz auf + Akkusativ.
        error_tag: preposition
    explanation:
      vi: "Ô 1: động từ streiten đứng cuối → câu phụ với obwohl. Ô 2: động từ hat đứng ngay sau → trạng từ trotzdem ở vị trí 1. Ô 3: stolz auf + Akkusativ (mich)."
    display_answer: "Obwohl Lan und ich uns manchmal streiten, sind wir beste Freundinnen. Letzte Woche habe ich meine Prüfung nicht bestanden. Trotzdem hat Lan gesagt, dass sie stolz auf mich ist."

  - key: de:exercise:b1u02l4-tr-obwohl-muede
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u02-g-obwohl-trotzdem
    prompt:
      source_text: "Mặc dù tôi mệt, tôi vẫn đi làm. (bắt đầu bằng Obwohl)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Obwohl ich müde bin, gehe ich zur Arbeit.
        - Obwohl ich müde bin, gehe ich arbeiten.
        - Obwohl ich müde bin, gehe ich trotzdem zur Arbeit.
        - Obwohl ich müde bin, gehe ich trotzdem arbeiten.
        - Obwohl ich müde bin, arbeite ich.
        - Obwohl ich müde bin, arbeite ich trotzdem.
    known_wrong:
      - answer: Obwohl ich müde bin, aber ich gehe zur Arbeit.
        feedback_vi: Sau câu obwohl không thêm aber; câu chính bắt đầu ngay bằng động từ – gehe ich …
        error_tag: conjunction
      - answer: Obwohl ich bin müde, gehe ich zur Arbeit.
        feedback_vi: Trong câu obwohl, động từ bin đứng cuối – Obwohl ich müde bin, …
        error_tag: verb_position
      - answer: Obwohl ich müde bin, ich gehe zur Arbeit.
        feedback_vi: Câu obwohl là vị trí 1, nên động từ gehe đứng ngay sau dấu phẩy – …, gehe ich zur Arbeit.
        error_tag: verb_position
    explanation:
      vi: "obwohl + câu phụ: bin ở cuối. Cả câu phụ là vị trí 1, nên câu chính bắt đầu bằng động từ gehe, rồi đến ich. Có thể thêm trotzdem (vẫn) trong câu chính để nhấn mạnh."
    display_answer: Obwohl ich müde bin, gehe ich zur Arbeit.

  - key: de:exercise:b1u02l4-tr-trotzdem-regen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b1u02-g-obwohl-trotzdem
    prompt:
      source_text: "Trời mưa. Dù vậy, chúng tôi vẫn đi dạo. (dùng trotzdem)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Es regnet. Trotzdem gehen wir spazieren.
        - Es regnet. Wir gehen trotzdem spazieren.
        - Es regnet, trotzdem gehen wir spazieren.
        - Es regnet, aber wir gehen trotzdem spazieren.
        - Es regnet, aber trotzdem gehen wir spazieren.
        - Es regnet, und trotzdem gehen wir spazieren.
    known_wrong:
      - answer: Es regnet. Trotzdem wir gehen spazieren.
        feedback_vi: Trotzdem ở vị trí 1 thì động từ gehen đứng ngay sau – Trotzdem gehen wir …
        error_tag: verb_position
      - answer: Es regnet. Obwohl gehen wir spazieren.
        feedback_vi: obwohl là liên từ mở đầu câu phụ, không đứng một mình như trạng từ; ở đây dùng trotzdem.
        error_tag: conjunction
    explanation:
      vi: "trotzdem là trạng từ: ở vị trí 1 thì động từ theo ngay sau (Trotzdem gehen wir), hoặc đứng sau động từ (Wir gehen trotzdem spazieren). spazieren gehen = đi dạo."
    display_answer: Es regnet. Trotzdem gehen wir spazieren.

