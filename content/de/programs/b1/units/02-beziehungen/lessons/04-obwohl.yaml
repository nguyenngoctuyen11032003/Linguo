    explanation:
      vi: "enttäuscht von meinem Bruder = thất vọng về anh (em) trai; weil er meinen Geburtstag vergessen hat = vì anh ấy quên sinh nhật mình. Trotzdem bin ich nicht wütend auf ihn = dù vậy tôi không giận anh ấy."
    display_answer: Người nói hơi thất vọng về anh trai vì anh ấy quên sinh nhật mình, nhưng không giận anh ấy.

  - key: de:exercise:b1u02l4-listen-kanada
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b1u02-einsam
    prompt:
      audio_asset_id: null
      fallback_text: Seitdem meine Freundin in Kanada wohnt, fühle ich mich oft einsam. Aber ich bin stolz auf sie.
      options:
        - { id: k4a, text: "Từ khi bạn gái sống ở Canada, tôi thường thấy cô đơn. Nhưng tôi tự hào về cô ấy.", lang: vi }
        - { id: k8b, text: "Từ khi bạn gái sống ở Canada, tôi thường thấy cô đơn và giận cô ấy.", lang: vi }
        - { id: k2c, text: "Bạn gái tôi thấy cô đơn ở Canada, nhưng tôi tự hào về cô ấy.", lang: vi }
        - { id: k6d, text: "Trước khi bạn gái sang Canada, tôi thường thấy cô đơn.", lang: vi }
    answer:
      correct_option_id: k4a
    explanation:
      vi: "Seitdem … wohnt = từ khi (bây giờ vẫn) sống ở đó; fühle ich mich oft einsam = tôi (người nói) thường thấy cô đơn; stolz auf sie = tự hào về cô ấy."
    display_answer: Từ khi bạn gái sống ở Canada, tôi thường thấy cô đơn. Nhưng tôi tự hào về cô ấy.

