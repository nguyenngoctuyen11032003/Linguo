body:
  - type: objective
    text:
      vi: "Sau bài này, bạn diễn tả được cảm xúc mâu thuẫn, ví dụ: \"Obwohl ich mich über meinen Freund geärgert habe, bin ich nicht mehr wütend auf ihn. Trotzdem bin ich ein bisschen enttäuscht.\""
  - type: explain
    text:
      vi: "obwohl (mặc dù) mở đầu một câu phụ, nên động từ chia đứng cuối như với weil: Ich gehe zur Arbeit, obwohl ich krank bin. Khi câu obwohl đứng đầu, cả câu phụ chiếm vị trí 1, nên câu chính bắt đầu ngay bằng động từ: Obwohl ich krank bin, gehe ich zur Arbeit."
  - type: explain
    text:
      vi: "Tiếng Việt nói \"mặc dù … nhưng …\", còn tiếng Đức chỉ cần obwohl: sau câu obwohl không thêm aber. Sai: Obwohl ich müde bin, aber ich arbeite. Đúng: Obwohl ich müde bin, arbeite ich."
  - type: explain
    text:
      vi: "trotzdem (dù vậy, tuy thế) là trạng từ trong câu chính, cho biết kết quả ngược với điều vừa nói. Nó đứng ở vị trí 1 – khi đó động từ theo ngay sau (Trotzdem arbeite ich) – hoặc đứng sau động từ (Ich arbeite trotzdem). Sau dấu phẩy, trotzdem ở đầu vế câu vẫn kéo động từ lên trước chủ ngữ: Ich bin müde, trotzdem arbeite ich."
  - type: explain
    text:
      vi: "Nhiều tính từ cảm xúc đi với giới từ cố định: stolz auf, eifersüchtig auf, wütend auf, traurig über, verliebt in (+ Akkusativ); zufrieden mit, enttäuscht von (+ Dativ). Với vật và sự việc, hỏi và trả lời bằng wo(r)-/da(r)- như ở bài trước: Worauf bist du stolz? – Darauf bin ich stolz."
  - type: deep_explain
    text:
      vi: "obwohl và trotzdem diễn đạt cùng một ý theo hai cách: Obwohl es regnet, gehen wir spazieren = Es regnet. Trotzdem gehen wir spazieren. Trong khẩu ngữ, đôi khi nghe trotzdem dùng như liên từ với động từ cuối (trotzdem es regnet), nhưng chuẩn viết là obwohl. Một số tính từ đổi giới từ theo đối tượng: wütend auf + người nhưng wütend über + việc; enttäuscht von + người, enttäuscht über + việc. einsam (cô đơn) khác allein (một mình): Ich wohne allein, aber ich bin nicht einsam. neidisch là ghen tị với cái người khác có, còn eifersüchtig là ghen vì sợ mất người mình yêu. Câu seitdem (B1U01) cũng hay dùng để nói cảm xúc: Seitdem sie weg ist, fühle ich mich einsam."
  - type: example
    target: Obwohl ich müde bin, gehe ich heute Abend mit dir ins Kino.
    target_lang: de
    translation:
      vi: Mặc dù mệt, tối nay mình vẫn đi xem phim với bạn.
    note:
      vi: "Nói với bạn (du). bin đứng cuối câu obwohl; câu chính bắt đầu bằng gehe."
  - type: example
    target: Ich habe wenig Zeit. Trotzdem helfe ich dir beim Umzug.
    target_lang: de
    translation:
      vi: Mình có ít thời gian. Dù vậy, mình vẫn giúp bạn chuyển nhà.
    note:
      vi: "Trotzdem ở vị trí 1 → động từ helfe ngay sau, rồi mới đến chủ ngữ ich."
  - type: example
    target: Meine Eltern sind sehr stolz auf mich, obwohl ich nicht die beste Note bekommen habe.
    target_lang: de
    translation:
      vi: Bố mẹ tôi rất tự hào về tôi, mặc dù tôi không được điểm cao nhất.
    note:
      vi: "stolz auf + Akkusativ (mich). Câu obwohl đứng sau: Perfekt bekommen habe ở cuối."
  - type: example
    target: Er ist eifersüchtig auf ihren besten Freund.
    target_lang: de
    translation:
      vi: Anh ấy ghen với người bạn thân nhất của cô ấy.
    note:
      vi: "eifersüchtig auf + Akkusativ: ihren besten Freund (giống đực, Akkusativ)."
  - type: example
    target: Seitdem mein bester Freund weggezogen ist, fühle ich mich manchmal einsam.
    target_lang: de
    translation:
      vi: Từ khi người bạn thân nhất chuyển đi, đôi khi tôi thấy cô đơn.
    note:
      vi: "Câu seitdem đứng đầu (B1U01) → fühle ở vị trí 2. sich einsam fühlen = cảm thấy cô đơn."
  - type: example
    target: Bist du zufrieden mit deinem neuen Job? – Ja, eigentlich schon. Trotzdem bin ich ein bisschen enttäuscht vom Gehalt.
    target_lang: de
    translation:
      vi: Bạn có hài lòng với công việc mới không? – Ừ, nói chung là có. Dù vậy mình hơi thất vọng về mức lương.
    note:
      vi: "Hội thoại giữa bạn bè (du). zufrieden mit + Dativ, enttäuscht von + Dativ (vom = von dem)."
  - type: common_mistake
    wrong: Obwohl ich müde bin, aber ich arbeite weiter.
    right: Obwohl ich müde bin, arbeite ich weiter.
    target_lang: de
    note:
      vi: "Không dịch \"mặc dù … nhưng\" từng chữ: sau câu obwohl không có aber, câu chính bắt đầu bằng động từ."
  - type: common_mistake
    wrong: Ich bin müde, trotzdem ich arbeite weiter.
    right: Ich bin müde, trotzdem arbeite ich weiter.
    target_lang: de
    note:
      vi: "trotzdem chiếm vị trí 1 của vế câu, nên động từ arbeite đứng ngay sau nó."
  - type: common_mistake
    wrong: Obwohl ich habe wenig Geld, bin ich glücklich.
    right: Obwohl ich wenig Geld habe, bin ich glücklich.
    target_lang: de
    note:
      vi: "Trong câu obwohl, động từ chia đứng cuối."
  - type: common_mistake
    wrong: Wir sind stolz für unsere Tochter.
    right: Wir sind stolz auf unsere Tochter.
    target_lang: de
    note:
      vi: "\"Tự hào về\" trong tiếng Đức là stolz auf + Akkusativ."
  - type: summary
    points:
      - vi: "obwohl + câu phụ, động từ cuối; câu obwohl đứng đầu → câu chính bắt đầu bằng động từ."
      - vi: "Không có aber sau câu obwohl."
      - vi: "trotzdem: vị trí 1 (Trotzdem arbeite ich) hoặc sau động từ (Ich arbeite trotzdem)."
      - vi: "+ Akk: stolz auf, eifersüchtig auf, wütend auf, traurig über, verliebt in."
      - vi: "+ Dat: zufrieden mit, enttäuscht von."
      - vi: "Từ vựng: das Gefühl, glücklich, traurig, einsam, wütend, enttäuscht, erleichtert, nervös, gute/schlechte Laune."
