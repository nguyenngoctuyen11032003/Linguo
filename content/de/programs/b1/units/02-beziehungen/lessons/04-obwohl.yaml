title:
  vi: Mặc dù… – obwohl, trotzdem, tính từ với giới từ (Obwohl ich müde bin, …)
objectives:
  - vi: Nối hai ý trái ngược bằng obwohl (câu phụ, động từ cuối) và trotzdem (câu chính, động từ vị trí 2).
  - vi: Dùng tính từ cảm xúc với giới từ cố định – stolz auf, zufrieden mit, enttäuscht von, eifersüchtig auf …
  - vi: Nghe một cuộc trò chuyện về xung đột, cảm xúc và nói cảm nhận của mình.
