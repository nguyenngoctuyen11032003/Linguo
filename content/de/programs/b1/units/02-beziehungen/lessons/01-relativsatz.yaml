title:
  vi: Người bạn mà tôi… – mệnh đề quan hệ Nom/Akk (Ein Freund, der immer hilft)
objectives:
  - vi: Tả người và vật bằng mệnh đề quan hệ ở Nominativ và Akkusativ (der Freund, der … / den …).
  - vi: Chọn đúng đại từ quan hệ – giống và số theo danh từ, cách theo vai trò trong mệnh đề.
  - vi: Nói và viết về tình bạn và tính cách của một người.
