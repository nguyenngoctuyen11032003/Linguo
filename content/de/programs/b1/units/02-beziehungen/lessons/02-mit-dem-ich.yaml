title:
  vi: Người mà tôi tin tưởng – quan hệ Dativ và có giới từ (Die Frau, mit der ich …)
objectives:
  - vi: Dùng mệnh đề quan hệ ở Dativ (dem, der, dem, denen).
  - vi: Dùng mệnh đề quan hệ có giới từ đứng đầu (die Frau, mit der ich …; der Film, über den wir …).
  - vi: Kể về tình yêu, hôn nhân và chia tay bằng câu phức; đọc hiểu một đoạn kể ngắn.
estimated_minutes: 19
