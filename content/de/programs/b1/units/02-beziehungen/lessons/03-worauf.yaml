title:
  vi: Bạn mong điều gì? – darauf/worauf (Worauf freust du dich?)
objectives:
  - vi: Dùng da(r)- + giới từ (darauf, damit, darüber) để nói về vật, sự việc đã nhắc tới, và wo(r)- + giới từ để hỏi.
  - vi: Phân biệt với người – giới từ + đại từ (auf ihn, mit ihr, auf wen, mit wem).
  - vi: Nói mình quan tâm, bực mình, quen với, lo cho điều gì hay ai bằng các động từ + giới từ ở B1.
