title:
  vi: Trước khi, kể từ khi, cho đến khi (Bevor, seitdem, bis)
objectives:
  - vi: Nối hai sự việc bằng bevor (trước khi), seit/seitdem (từ khi) và bis (cho đến khi) với động từ ở cuối câu phụ.
  - vi: Chọn đúng thì sau seitdem – Präsens cho việc vẫn còn tiếp diễn.
  - vi: Kể các mốc quan trọng của đời người (đi học, tốt nghiệp, sự nghiệp, nghỉ hưu).
