  - key: de:exercise:b1u01l3-wb-tochter
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b1u01-g-seitdem
    prompt:
      instruction: "Sắp xếp thành câu: \"Từ khi con gái tôi ra đời, tôi ngủ ít.\""
      tokens:
