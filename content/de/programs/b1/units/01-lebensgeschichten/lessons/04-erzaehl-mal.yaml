        - { id: u-letzten, text: letzten }
        - { id: u-nicht, text: nicht }
        - { id: u-den, text: den }
    answer:
      orders:
        - [u-wir, u-haben, u-den, u-letzten, u-bus, u-nicht, u-mehr, u-erreichen, u-koennen]
