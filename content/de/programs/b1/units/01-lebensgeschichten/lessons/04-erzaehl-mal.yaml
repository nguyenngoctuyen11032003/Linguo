title:
  vi: Kể đi! – Perfekt của động từ khiếm khuyết (Ich habe arbeiten müssen.)
objectives:
  - vi: Dùng Perfekt của động từ khiếm khuyết – haben + nguyên thể + modal nguyên thể (Ich habe arbeiten müssen).
  - vi: Nghe một đoạn phỏng vấn/podcast ngắn kể chuyện và kể lại ý chính.
  - vi: Kể một sự việc bất ngờ hoặc ngượng ngùng và nói cảm xúc của mình.
