title:
  vi: Hồi nhỏ – Präteritum đầy đủ (Als Kind wohnte ich auf dem Land.)
objectives:
  - vi: Chia Präteritum của mọi nhóm động từ – yếu (wohnte), mạnh (fuhr, schrieb, fand) và hỗn hợp (brachte, dachte, wusste).
  - vi: Biết khi nào người Đức viết bằng Präteritum và khi nào nói bằng Perfekt.
  - vi: Đọc và viết đoạn hồi ký ngắn về tuổi thơ ở Präteritum.
