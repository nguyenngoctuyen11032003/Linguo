    known_wrong:
      - answer: Vorher ich hatte nie im Ausland gelebt.
        feedback_vi: Vorher ở vị trí 1 thì hatte phải ở vị trí 2 – Vorher hatte ich …
        error_tag: verb_position
      - answer: Vorher war ich nie im Ausland gelebt.
        feedback_vi: leben không chỉ di chuyển nên dùng haben – ich hatte … gelebt.
        error_tag: aux_verb
      - answer: Vorher hatte ich nie in Ausland gelebt.
