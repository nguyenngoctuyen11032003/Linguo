    display_answer: Vorher hatte ich nie im Ausland gelebt.

  - key: de:exercise:b1u01l2-tr-schwester
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:b1u01-g-plusquamperfekt
    prompt:
      source_text: Als ich nach Deutschland kam, hatte meine Schwester schon zwei Jahre dort gelebt.
      source_lang: de
      direction: target_to_vi
