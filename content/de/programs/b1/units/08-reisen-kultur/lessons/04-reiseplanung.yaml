level: b1
title:
  vi: Lên kế hoạch chuyến đi – đề nghị lịch sự (Wir könnten doch …)
objectives:
  - vi: "Đưa ra đề nghị lịch sự bằng Konjunktiv II: Wir könnten …, Wie wäre es, wenn …?, Hättest du Lust, … zu …?"
  - vi: Đáp lại đề nghị của người khác – đồng ý, từ chối nhẹ nhàng, đưa phương án khác và đi đến thoả thuận (kiểu Goethe B1 Sprechen, phần cùng lên kế hoạch).
  - vi: Nghe và nói về chỗ ở, tuyến đường, giảm giá và huỷ đặt chỗ khi lên kế hoạch chuyến đi.
estimated_minutes: 20
