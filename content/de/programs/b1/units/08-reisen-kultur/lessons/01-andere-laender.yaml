title:
  vi: Nước khác, phong tục khác – thay vì, mà không (Statt zu …, ohne zu …)
objectives:
  - vi: So sánh phong tục ở Việt Nam và ở Đức một cách tôn trọng, không khái quát hoá.
  - vi: Nói việc làm thay thế bằng (an)statt … zu và việc làm mà không kèm việc khác bằng ohne … zu.
  - vi: Phân biệt hin (ra xa người nói) và her (về phía người nói) – Komm her!, Herein!, Geh hinaus!
