  - vi: Viết e-mail khiếu nại hoặc hỏi thông tin trang trọng khoảng 80–100 từ – nêu vấn đề cụ thể, yêu cầu lịch sự, chào kết đúng chuẩn.
  - vi: Đọc tờ thông tin, nội quy du lịch và tìm đúng chi tiết (kiểu Goethe B1 Lesen, phần đọc quy định – hướng dẫn).
  - vi: Ôn statt/ohne … zu, hin/her, tiểu từ tình thái, tiền tố tách/không tách, trật tự giữa câu và đề nghị bằng Konjunktiv II.
