  - key: de:exercise:b1u08l5-tr-ferienwohnung
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:b1u08-g-vorschlag-konjunktiv
    prompt:
      source_text: Wie wäre es, wenn wir statt eines Hotels eine Ferienwohnung nehmen?
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Hay là chúng ta thuê căn hộ nghỉ dưỡng thay vì khách sạn?
        - Hay là mình thuê căn hộ nghỉ dưỡng thay vì khách sạn?
        - Hay là chúng ta lấy căn hộ nghỉ dưỡng thay vì khách sạn?
        - Hay là chúng ta thuê một căn hộ nghỉ dưỡng thay vì ở khách sạn?
        - Hay là mình thuê một căn hộ nghỉ dưỡng thay vì ở khách sạn?
        - Thay vì khách sạn, hay là chúng ta thuê căn hộ nghỉ dưỡng?
        - Thay vì ở khách sạn, hay là mình thuê một căn hộ nghỉ dưỡng?
        - Sẽ thế nào nếu chúng ta thuê căn hộ nghỉ dưỡng thay vì khách sạn?
        - Hay là chúng ta thuê căn hộ du lịch thay vì khách sạn?
        - Hay là mình thuê căn hộ du lịch thay vì ở khách sạn?
        - Hay là chúng ta thuê nhà nghỉ dưỡng thay vì khách sạn?
        - Thay vì khách sạn, chúng ta thuê căn hộ nghỉ dưỡng thì sao?
        - Chúng ta thuê căn hộ nghỉ dưỡng thay vì khách sạn thì sao?
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Hay là chúng ta ở khách sạn thay vì căn hộ nghỉ dưỡng?
        feedback_vi: "statt eines Hotels = thay vì khách sạn; phương án được đề nghị là die Ferienwohnung."
        error_tag: meaning
    explanation:
      vi: "Wie wäre es, wenn …? = hay là …? / … thì sao? statt eines Hotels = thay vì (một) khách sạn (statt + Genitiv). die Ferienwohnung = căn hộ cho thuê để nghỉ dưỡng."
    display_answer: Hay là chúng ta thuê căn hộ nghỉ dưỡng thay vì khách sạn?

