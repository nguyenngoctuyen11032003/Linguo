  vi: Lễ hội và truyền thống – tiền tố hai kiểu, trật tự giữa câu (Wir übersetzen den Text / Wir setzen über)
objectives:
  - vi: Tả một lễ hội ở Đức hoặc ở Việt Nam – khi nào, vì sao, người ta làm gì, ở đâu.
  - vi: Phân biệt động từ có tiền tố tách và không tách (setzt über – übersetzt, holt wieder – wiederholt).
  - vi: Sắp xếp thời gian – lý do – cách thức – nơi chốn và Dativ – Akkusativ theo trật tự trung tính trong câu dài.
