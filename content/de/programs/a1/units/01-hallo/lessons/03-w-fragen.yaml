key: de:lesson:a1u01-w-fragen
order_index: 3
level: a1
title:
  vi: Câu hỏi W- và câu hỏi có/không (W-Fragen)
objectives:
  - vi: Đặt câu hỏi W- (Wer? Wie? Wo? Woher? Was?) với động từ ở vị trí 2.
  - vi: Đặt câu hỏi có/không với động từ đứng đầu (Sprichst du Deutsch?) và trả lời Ja/Nein.
  - vi: Giữ động từ ở vị trí 2 trong câu kể, kể cả khi heute/jetzt đứng đầu câu.
  - vi: Nói mình biết những ngôn ngữ nào (Ich spreche Vietnamesisch und ein bisschen Deutsch).
estimated_minutes: 15
skills: [grammar, vocabulary, speaking, listening]
prerequisites: [de:lesson:a1u01-woher-kommst-du]
