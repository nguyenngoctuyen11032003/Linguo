  # ---------------- recall ----------------
  - key: de:exercise:a1u01l4-fill-wie-alt
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u01-g-alter
    prompt:
      template: "Wie {{b1}} bist du? – Ich bin {{b2}} Jahre alt. (30)"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 9 }
    answer:
      blanks:
        b1: [alt]
        b2: [dreißig, "30"]
    known_wrong:
      - answer: dreizig
        feedback_vi: Ba mươi viết với ß – dreißig, không phải dreizig.
        error_tag: number_spelling
      - answer: dreizehn
        feedback_vi: dreizehn là 13. Ba mươi là dreißig.
        error_tag: number_confusion
      - answer: viel
        feedback_vi: Hỏi tuổi luôn là Wie alt …? (bao nhiêu tuổi = “già thế nào”).
        error_tag: question_word
    explanation:
      vi: "Hỏi tuổi: Wie alt bist du?. Trả lời: Ich bin dreißig Jahre alt – dreißig viết với ß."
    display_answer: "Wie alt bist du? – Ich bin dreißig Jahre alt."

  - key: de:exercise:a1u01l4-fill-zahlen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u01-g-zahlen-bis-100
    prompt:
      template: "67 = {{b1}} · 76 = {{b2}} · 90 = {{b3}}"
      blanks:
        - { id: b1, width_hint: 16 }
        - { id: b2, width_hint: 16 }
        - { id: b3, width_hint: 8 }
    answer:
      blanks:
        b1: [siebenundsechzig]
        b2: [sechsundsiebzig]
        b3: [neunzig]
    known_wrong:
      - answer: sechzigundsieben
        feedback_vi: Tiếng Đức đọc đơn vị trước – 67 là siebenundsechzig.
        error_tag: number_order
      - answer: siebzigundsechs
        feedback_vi: Tiếng Đức đọc đơn vị trước – 76 là sechsundsiebzig.
        error_tag: number_order
      - answer: siebenundsechszig
        feedback_vi: Sáu mươi là sechzig – bỏ s của sechs.
        error_tag: number_spelling
      - answer: sechsundsiebenzig
        feedback_vi: Bảy mươi là siebzig – bỏ en của sieben.
        error_tag: number_spelling
      - answer: neunzehn
        feedback_vi: neunzehn là 19. Chín mươi là neunzig.
        error_tag: number_confusion
    explanation:
      vi: "67 = sieben + und + sechzig; 76 = sechs + und + siebzig; 90 = neunzig. Nhớ sechzig và siebzig là dạng rút gọn."
    display_answer: "67 = siebenundsechzig · 76 = sechsundsiebzig · 90 = neunzig"

  - key: de:exercise:a1u01l4-tr-25-jahre
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u01-g-alter
    prompt:
      source_text: Tôi 25 tuổi.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich bin 25 Jahre alt.
        - Ich bin fünfundzwanzig Jahre alt.
        - Ich bin 25.
        - Ich bin fünfundzwanzig.
    known_wrong:
      - answer: Ich habe 25 Jahre.
        feedback_vi: Tuổi nói bằng sein – Ich bin 25 Jahre alt, không dùng haben.
        error_tag: haben_alter
      - answer: Ich habe fünfundzwanzig Jahre.
        feedback_vi: Tuổi nói bằng sein – Ich bin fünfundzwanzig Jahre alt, không dùng haben.
        error_tag: haben_alter
      - answer: Ich bin zweiundfünfzig Jahre alt.
        feedback_vi: zweiundfünfzig là 52. 25 là fünfundzwanzig – đơn vị trước, chục sau.
        error_tag: number_order
      - answer: Ich bin zwanzigfünf Jahre alt.
        feedback_vi: 25 đọc đơn vị trước và có und – fünfundzwanzig.
        error_tag: number_order
    explanation:
      vi: "Nói tuổi: Ich bin + số + Jahre alt (hoặc chỉ Ich bin 25). 25 = fünf + und + zwanzig."
    display_answer: Ich bin 25 Jahre alt.

