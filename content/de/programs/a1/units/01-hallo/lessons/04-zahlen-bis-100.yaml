  - key: de:exercise:a1u01l4-tr-tom-54
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u01-zehnerzahlen
    prompt:
      source_text: Tom ist vierundfünfzig Jahre alt und wohnt in Köln.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Tom 54 tuổi và sống ở Köln.
        - Tom năm mươi tư tuổi và sống ở Köln.
        - Tom năm mươi bốn tuổi và sống ở Köln.
        - Tom 54 tuổi và đang sống ở Köln.
        - Tom 54 tuổi, sống ở Köln.
        - Tom 54 tuổi và sống ở Cologne.
        - Tom 54 tuổi và ở Köln.
        - Tom năm mươi tư tuổi, sống ở Köln.
        - Tom năm nay 54 tuổi và sống ở Köln.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tom 45 tuổi và sống ở Köln.
        feedback_vi: vierundfünfzig = 4 + 50 = 54. Tiếng Đức đọc đơn vị trước.
        error_tag: number_order
      - answer: Tom 44 tuổi và sống ở Köln.
        feedback_vi: fünfzig là 50, nên vierundfünfzig là 54.
        error_tag: number_confusion
    explanation:
      vi: "vierundfünfzig: vier (4) đọc trước, fünfzig (50) đọc sau → 54. ist … Jahre alt = … tuổi; wohnt in Köln = sống ở Köln."
    display_answer: Tom 54 tuổi và sống ở Köln.
