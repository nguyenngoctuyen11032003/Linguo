body:
  - type: objective
    text:
      vi: Sau bài này, bạn nghe đúng số nhà, tuổi, mã bưu chính, nói được “Tôi 25 tuổi” và điền được các ô cơ bản của một mẫu đơn tiếng Đức.
  - type: explain
    text:
      vi: "Từ 21 đến 99, tiếng Đức đọc hàng đơn vị trước, rồi und, rồi hàng chục: 47 = sieben-und-vierzig (“bảy và bốn mươi”). Tiếng Việt đọc ngược lại (bốn mươi bảy), nên khi nghe hãy chờ hàng chục ở cuối rồi mới viết số."
  - type: explain
    text:
      vi: "Hàng chục: zwanzig, dreißig, vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig, hundert. Nhớ ba chỗ lạ: dreißig viết với ß; sechzig bỏ s của sechs; siebzig bỏ en của sieben. Số viết liền thành một từ, và 21 là einundzwanzig (eins mất s)."
  - type: explain
    text:
      vi: "Nói tuổi dùng sein, không dùng haben: Ich bin 25 Jahre alt (hoặc ngắn: Ich bin 25). Hỏi: Wie alt bist du? (thân mật) / Wie alt sind Sie? (lịch sự)."
  - type: explain
    text:
      vi: "Địa chỉ ở Đức: tên đường trước, số nhà sau (Gartenstraße 12); dòng dưới là mã bưu chính 5 số rồi tên thành phố (04109 Leipzig). Trên mẫu đơn (das Formular) hay gặp: Vorname, Familienname/Nachname, Alter, Adresse, Wohnort, Geburtsort, Telefonnummer, E-Mail."
  - type: deep_explain
    text:
      vi: "Số điện thoại thường đọc từng chữ số (null, drei, vier, eins …) hoặc từng cặp (vierunddreißig); qua điện thoại người ta hay nói zwo thay zwei cho khỏi lẫn với drei. Mã bưu chính ở Áo và Thụy Sĩ chỉ có 4 số. Hỏi tuổi người mới quen ngoài đời có thể bị coi là tò mò, nhưng trong lớp học và trên mẫu đơn thì bình thường. alt dùng cho người (già) và vật (cũ); trái nghĩa cho người là jung, cho vật là neu."
  - type: example
    target: "Wie alt bist du? – Ich bin zweiundzwanzig. Und du? – Ich bin achtundzwanzig Jahre alt."
    target_lang: de
    translation:
      vi: Bạn bao nhiêu tuổi? – Mình 22. Còn bạn? – Mình 28 tuổi.
    note:
      vi: Hai bạn trẻ xưng du. zweiundzwanzig = 2 + 20; có thể bỏ Jahre alt khi nói ngắn.
  - type: example
    target: "Wie alt sind Sie, Herr Wolf? – Ich bin siebenundsechzig Jahre alt."
    target_lang: de
    translation:
      vi: Ông Wolf, ông bao nhiêu tuổi? – Tôi 67 tuổi.
    note:
      vi: Xưng Sie với người lớn tuổi. siebenundsechzig = 7 + 60 – nghe “sieben” trước nhưng viết số 6 trước.
  - type: example
    target: "Die Adresse ist Gartenstraße 12, 04109 Leipzig."
    target_lang: de
    translation:
      vi: Địa chỉ là số 12 phố Gartenstraße, 04109 Leipzig.
    note:
      vi: Số nhà (die Hausnummer) đứng sau tên đường; mã bưu chính (die Postleitzahl) đứng trước tên thành phố.
  - type: example
    target: "Wohnort: Leipzig. Geburtsort: Hue. Nationalität: vietnamesisch."
    target_lang: de
    translation:
      vi: "Nơi ở: Leipzig. Nơi sinh: Huế. Quốc tịch: Việt Nam."
    note:
      vi: Ba ô hay gặp trên mẫu đơn. Quốc tịch thường ghi bằng tính từ viết thường (vietnamesisch).
  - type: example
    target: "Wo wohnen Sie? – In Leipzig. – Wie schreibt man das? – L-E-I-P-Z-I-G."
    target_lang: de
    translation:
      vi: Anh/chị sống ở đâu? – Ở Leipzig. – Viết thế nào ạ? – L-E-I-P-Z-I-G.
    note:
      vi: "Nhân viên ở quầy xưng Sie. Khi điền form, người ta hay hỏi Wie schreibt man das? và bạn đánh vần bằng tên chữ cái. Đuôi -ig trong Leipzig (cũng như zwanzig, dreißig) đọc như “ich”."
  - type: common_mistake
    wrong: Ich habe 25 Jahre.
    right: Ich bin 25 Jahre alt.
    target_lang: de
    note:
      vi: Không dịch “có 25 tuổi” bằng haben (như tiếng Pháp hay tiếng Tây Ban Nha). Tiếng Đức nói tuổi bằng sein + Jahre alt.
  - type: common_mistake
    wrong: vierzigsieben
    right: siebenundvierzig
    target_lang: de
    note:
      vi: Số 47 đọc hàng đơn vị trước – sieben und vierzig – và viết liền. Nghe siebenundvierzig mà ghi 74 là lỗi rất hay gặp.
  - type: common_mistake
    wrong: dreizig
    right: dreißig
    target_lang: de
    note:
      vi: Ba mươi viết với ß – dreißig – khác với mọi số chục khác (zwanzig, vierzig …).
  - type: summary
    points:
      - vi: "21–99: đơn vị + und + chục, viết liền – 47 = siebenundvierzig."
      - vi: "Chục: zwanzig, dreißig (ß), vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig, hundert."
      - vi: "Tuổi: Ich bin … Jahre alt. Hỏi: Wie alt bist du? / Wie alt sind Sie?"
      - vi: "Địa chỉ Đức: Tên đường + số nhà, mã bưu chính (5 số) + thành phố."
      - vi: "Mẫu đơn: Vorname, Nachname, Alter, Adresse, Wohnort, Geburtsort, Nationalität, Telefonnummer, E-Mail."
