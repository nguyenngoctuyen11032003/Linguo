key: de:lesson:a1u01-ich-du-sie
order_index: 1
level: a1
title:
  vi: Tôi, bạn, ngài – động từ sein (Ich bin, du bist, Sie sind)
objectives:
  - vi: Giới thiệu mình và người khác bằng động từ sein (ich bin, du bist, er ist …).
  - vi: Dùng đúng đại từ nhân xưng ich, du, er, sie, es, wir, ihr, sie/Sie.
  - vi: Chọn du hay Sie cho phù hợp với người đối diện và hỏi thăm sức khỏe lịch sự.
estimated_minutes: 14
skills: [grammar, vocabulary, speaking]
