title:
  vi: Bạn đến từ đâu? – chia động từ (Woher kommst du?)
objectives:
  - vi: Nói mình đến từ đâu và đang sống ở đâu (Ich komme aus …, Ich wohne in …).
  - vi: Hỏi quê quán và nơi ở của người khác, cả với du lẫn Sie.
  - vi: Chia động từ có quy tắc ở thì hiện tại (đuôi -e, -st, -t, -en, -t, -en), kể cả du arbeitest và du heißt.
  - vi: Dùng đúng tên nước có mạo từ (aus der Schweiz, in der Türkei, aus den USA).
estimated_minutes: 14
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u01-ich-du-sie]
