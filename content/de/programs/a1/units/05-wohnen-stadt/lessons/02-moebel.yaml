title:
  vi: Đồ đạc – đại từ Akkusativ (Ich finde ihn schön.)
objectives:
  - vi: Hỏi và nêu nhận xét về đồ đạc với Wie findest du …? / Wie finden Sie …? và Ich finde … .
  - vi: Thay danh từ chỉ đồ vật bằng đại từ đúng giống - er/ihn, sie, es, số nhiều sie.
  - vi: Dùng đại từ Akkusativ mich, dich, ihn, sie, es, uns, euch, sie/Sie.
estimated_minutes: 14
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u05-meine-wohnung]
