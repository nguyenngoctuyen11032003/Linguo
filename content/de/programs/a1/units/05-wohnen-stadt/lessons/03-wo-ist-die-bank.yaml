    explanation:
      vi: Hỏi Wo? nên neben + Dativ; die Post giống cái → der Post. neben die Post là Akkusativ, dem chỉ dùng cho der/das, còn thiếu mạo từ là sai.
    display_answer: Die Bank ist neben der Post.

  - key: de:exercise:a1u05l3-tr-apotheke-zentrum
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u05-zentrum
    prompt:
      source_text: Gibt es hier eine Apotheke? – Ja, im Zentrum, hinter der Kirche.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Ở đây có hiệu thuốc không? – Có, ở trung tâm, phía sau nhà thờ.
        - Ở đây có hiệu thuốc không? – Có, ở trung tâm, sau nhà thờ.
        - Ở đây có hiệu thuốc nào không? – Có, ở trung tâm, phía sau nhà thờ.
        - Ở đây có nhà thuốc không? – Có, ở trung tâm, phía sau nhà thờ.
        - Ở đây có hiệu thuốc không? – Có, ở trung tâm thành phố, phía sau nhà thờ.
        - Quanh đây có hiệu thuốc không? – Có, ở trung tâm, phía sau nhà thờ.
        - Ở đây có hiệu thuốc không? – Có, trong trung tâm, đằng sau nhà thờ.
        - Ở đây có hiệu thuốc không? – Có, ở trung tâm, đằng sau nhà thờ.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ở đây có hiệu thuốc không? – Có, ở trung tâm, phía trước nhà thờ.
        feedback_vi: hinter là "phía sau"; "phía trước" là vor.
        error_tag: preposition
      - answer: Ở đây có hiệu thuốc không? – Có, ở trung tâm, cạnh nhà thờ.
        feedback_vi: hinter là "phía sau"; "cạnh" là neben.
        error_tag: preposition
    explanation:
      vi: Gibt es hier…? là "Ở đây có… không?"; im Zentrum là "ở trung tâm"; hinter der Kirche là "phía sau nhà thờ".
    display_answer: Ở đây có hiệu thuốc không? – Có, ở trung tâm, phía sau nhà thờ.
