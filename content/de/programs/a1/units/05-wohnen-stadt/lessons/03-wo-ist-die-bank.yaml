key: de:lesson:a1u05-wo-ist-die-bank
order_index: 3
level: a1
title:
  vi: Ngân hàng ở đâu? – Dativ chỉ nơi chốn (Wo ist die Bank?)
objectives:
  - vi: Hỏi Wo ist …? và nói vị trí của các địa điểm trong thành phố, đồ vật trong phòng.
  - vi: Dùng in, an, auf, neben, hinter, vor, über, unter, zwischen + Dativ cho vị trí đứng yên.
  - vi: Đổi mạo từ sang Dativ - dem, der, dem, den …-n; einem, einer; rút gọn im, am.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u05-moebel]
