  - key: de:exercise:a1u05l3-mcq-bank-neben-post
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u05-bank
    prompt:
      stem: "Một người lạ hỏi bạn: \"Entschuldigung, wo ist hier eine Bank?\" Ngân hàng ở ngay cạnh bưu điện. Bạn trả lời thế nào?"
      stem_lang: vi
      options:
        - { id: c8n, text: Die Bank ist neben der Post., lang: de }
        - { id: t3f, text: Die Bank ist neben die Post., lang: de }
        - { id: k5y, text: Die Bank ist neben dem Post., lang: de }
        - { id: o7r, text: Die Bank ist neben Post., lang: de }
    answer:
