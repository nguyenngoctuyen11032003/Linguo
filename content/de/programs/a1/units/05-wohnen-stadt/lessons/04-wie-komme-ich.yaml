title:
  vi: Hỏi đường – câu mệnh lệnh (Wie komme ich zum …? Gehen Sie geradeaus!)
objectives:
  - vi: Hỏi đường lịch sự - Entschuldigung, wie komme ich zum Bahnhof? Können Sie mir helfen?
  - vi: Hiểu và chỉ đường đơn giản - geradeaus, links, rechts, an der Ampel, an der Kreuzung, an der Ecke.
  - vi: Dùng câu mệnh lệnh với Sie, du, ihr (Gehen Sie! Geh! Geht!) và thêm bitte cho lịch sự.
estimated_minutes: 15
skills: [listening, speaking, grammar]
prerequisites: [de:lesson:a1u05-wo-ist-die-bank]
