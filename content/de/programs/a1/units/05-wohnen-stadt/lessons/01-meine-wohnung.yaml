        - [t-es, t-gibt, t-zwei, t-sm, t-und, t-eine, t-baeck, t-hier]
        - [t-es, t-gibt, t-eine, t-baeck, t-und, t-zwei, t-sm, t-hier]
    explanation:
      vi: Ở một nơi có gì → es gibt; gibt luôn ở vị trí 2 và không đổi dù có hai siêu thị. Hier đứng đầu thì es đứng sau gibt; hat và geben là bẫy.
    display_answer: Hier gibt es zwei Supermärkte und eine Bäckerei.

  - key: de:exercise:a1u05l1-tr-drei-zimmer
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u05-zimmer
    prompt:
      source_text: Unsere Wohnung hat drei Zimmer, aber es gibt keinen Balkon.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Căn hộ của chúng tôi có ba phòng, nhưng không có ban công.
        - Căn hộ của bọn mình có ba phòng, nhưng không có ban công.
        - Căn hộ của chúng mình có ba phòng, nhưng không có ban công.
        - Căn hộ chúng tôi có ba phòng, nhưng không có ban công.
        - Căn hộ của chúng tôi có 3 phòng, nhưng không có ban công.
        - Căn hộ của chúng tôi có ba phòng, nhưng lại không có ban công.
        - Nhà chúng tôi có ba phòng, nhưng không có ban công.
        - Căn hộ của chúng tôi có ba phòng nhưng không có ban công nào.
