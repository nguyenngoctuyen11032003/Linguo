        - { id: t-hier, text: Hier }
        - { id: t-baeck, text: Bäckerei }
        - { id: t-es, text: es }
        - { id: t-zwei, text: zwei }
        - { id: t-und, text: und }
        - { id: t-geben, text: geben }
    answer:
      orders:
        - [t-hier, t-gibt, t-es, t-zwei, t-sm, t-und, t-eine, t-baeck]
        - [t-es, t-gibt, t-hier, t-zwei, t-sm, t-und, t-eine, t-baeck]
        - [t-hier, t-gibt, t-es, t-eine, t-baeck, t-und, t-zwei, t-sm]
        - [t-es, t-gibt, t-hier, t-eine, t-baeck, t-und, t-zwei, t-sm]
