key: de:lesson:a1u05-meine-wohnung
order_index: 1
level: a1
title:
  vi: Căn hộ của tôi – es gibt (Meine Wohnung)
objectives:
  - vi: Tả căn hộ của mình - có mấy phòng, có những phòng nào, phòng như thế nào.
  - vi: Dùng es gibt + Akkusativ để nói ở một nơi có (hoặc không có) cái gì.
  - vi: Phân biệt "có" sở hữu (haben) với "có" tồn tại (es gibt).
  - vi: Dùng unser/unsere, euer/eure để nói về nhà của chúng tôi, của các bạn.
estimated_minutes: 14
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u04-wiederholung]
