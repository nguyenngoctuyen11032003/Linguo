body:
  - type: objective
    text:
      vi: Sau bài này, bạn viết được một tấm thiệp chúc mừng, một e-mail cảm ơn bạn bè và một e-mail ngắn gửi cơ quan với lời chào đầu và cuối thư đúng kiểu.
  - type: explain
    text:
      vi: "Thư thân mật (bạn bè, gia đình) mở đầu bằng Liebe + tên nữ, Lieber + tên nam, hoặc Hallo + tên; kết bằng Viele Grüße hoặc Liebe Grüße rồi tên bạn. Trong thư thân mật dùng du."
  - type: explain
    text:
      vi: "Thư trang trọng (cơ quan, phòng khám, công ty) mở đầu bằng Sehr geehrte Frau + họ, Sehr geehrter Herr + họ; chưa biết tên người nhận thì Sehr geehrte Damen und Herren. Kết thư: Mit freundlichen Grüßen; trong thư dùng Sie, Ihnen, Ihr (viết hoa)."
  - type: explain
    text:
      vi: "Đuôi -e / -er trong Liebe / Lieber, Sehr geehrte / geehrter đổi theo giới tính người nhận; bây giờ bạn chỉ cần học như cụm cố định. Không dùng Hallo trong thư gửi cơ quan."
  - type: explain
    text:
      vi: "Sau lời chào có dấu phẩy, và câu đầu tiên của thư viết thường: Liebe Anna, vielen Dank für … (danh từ và Sie vẫn viết hoa). Tiếng Việt hay viết \"Chào Anna,\" rồi viết hoa câu sau, nên người Việt dễ sai chỗ này."
  - type: explain
    text:
      vi: "Một thư ngắn kiểu thi Start Deutsch 1 (khoảng 30 từ) gồm: lời chào, ba ý nội dung (ví dụ cảm ơn, trả lời, hỏi), lời chào cuối và tên. Các động từ hay dùng: schreiben (viết), schicken (gửi), antworten (trả lời)."
  - type: deep_explain
    text:
      vi: "Vì sao Liebe Anna nhưng Lieber Tom? lieb là tính từ, và tính từ đứng trước danh từ đổi đuôi – quy tắc đầy đủ bạn học ở A2. Thư gửi hai người: Liebe Anna, lieber Tom, (từ thứ hai viết thường). Trên phong bì người ta ghi \"Herrn Klein\" (thêm -n), nhưng lời chào vẫn là Sehr geehrter Herr Klein. Trong thư thật, tên người viết nằm ở dòng riêng, không có dấu phẩy sau Viele Grüße; trong bài này, khi viết trên một dòng, dấu phẩy chỉ thay cho chỗ xuống dòng. E-mail công việc thân thiện cũng hay dùng Viele Grüße hoặc Beste Grüße, nhưng Mit freundlichen Grüßen an toàn nhất khi viết cho cơ quan."
  - type: example
    target: "Liebe Anna, vielen Dank für die Einladung! Ich komme gern am Samstag. Soll ich einen Kuchen mitbringen? Viele Grüße, Lan"
    target_lang: de
    translation:
      vi: "Anna thân mến, cảm ơn bạn nhiều vì lời mời! Thứ Bảy mình rất vui được đến. Mình có cần mang bánh theo không? Thân, Lan"
    note:
      vi: "Thư thân mật cho bạn nữ: Liebe Anna; sau dấu phẩy viết thường vielen. Ba ý: cảm ơn – nhận lời – câu hỏi."
  - type: example
    target: "Sehr geehrte Frau Weber, leider kann ich am Montag nicht zum Termin kommen. Haben Sie am Mittwoch Zeit? Mit freundlichen Grüßen, Minh Tran"
    target_lang: de
    translation:
      vi: "Kính gửi bà Weber, tiếc là thứ Hai tôi không thể đến buổi hẹn. Thứ Tư bà có thời gian không ạ? Trân trọng, Minh Tran"
    note:
      vi: "Thư trang trọng: Sehr geehrte Frau + họ; dùng Sie; kết bằng Mit freundlichen Grüßen."
  - type: example
    target: "Lieber Tom, herzlichen Glückwunsch zum Geburtstag! Alles Gute! Liebe Grüße, Mai"
    target_lang: de
    translation:
      vi: "Tom thân mến, chúc mừng sinh nhật bạn! Chúc bạn mọi điều tốt đẹp! Thân, Mai"
    note:
      vi: "Tom là nam nên Lieber. Sau dấu phẩy, herzlichen viết thường vì là câu tiếp theo."
  - type: example
    target: "Sehr geehrte Damen und Herren, ich möchte meinen Sohn für den Deutschkurs anmelden. Bitte schicken Sie mir das Formular. Mit freundlichen Grüßen, Linh Pham"
    target_lang: de
    translation:
      vi: "Kính gửi quý ông bà, tôi muốn đăng ký khoá tiếng Đức cho con trai tôi. Xin vui lòng gửi cho tôi tờ khai. Trân trọng, Linh Pham"
    note:
      vi: "Chưa biết tên người nhận: Sehr geehrte Damen und Herren. schicken + Dativ (mir) + Akkusativ (das Formular)."
  - type: common_mistake
    wrong: Liebe Anna, Vielen Dank für die Karte!
    right: Liebe Anna, vielen Dank für die Karte!
    target_lang: de
    note:
      vi: "Sau dấu phẩy của lời chào, câu đầu viết thường (trừ danh từ và Sie)."
  - type: common_mistake
    wrong: Liebe Tom,
    right: Lieber Tom,
    target_lang: de
    note:
      vi: "Tom là nam: Lieber. Liebe dùng cho nữ (Liebe Anna)."
  - type: common_mistake
    wrong: Hallo Herr Klein, ich brauche einen Termin.
    right: Sehr geehrter Herr Klein, ich brauche einen Termin.
    target_lang: de
    note:
      vi: "Thư gửi cơ quan, người không quen: dùng Sehr geehrter Herr …, không dùng Hallo."
  - type: common_mistake
    wrong: Mit freundliche Grüße
    right: Mit freundlichen Grüßen
    target_lang: de
    note:
      vi: "Cụm cố định: Mit freundlichen Grüßen (có -n ở cả hai từ)."
  - type: summary
    points:
      - vi: "Thân mật: Liebe Anna, / Lieber Tom, / Hallo Lisa, … Viele Grüße / Liebe Grüße + tên (du)."
      - vi: "Trang trọng: Sehr geehrte Frau …, / Sehr geehrter Herr …, / Sehr geehrte Damen und Herren, … Mit freundlichen Grüßen (Sie)."
      - vi: "Sau dấu phẩy của lời chào, câu đầu viết thường."
      - vi: "Vielen Dank für …! Herzlichen Glückwunsch zum Geburtstag! Alles Gute!"
      - vi: "schreiben, schicken (+ Dativ + Akkusativ), antworten; die Karte, der Brief, die Nachricht, die Einladung."
