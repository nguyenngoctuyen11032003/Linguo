        b1: [Lieber, Hallo]
        b2: [Grüße]
    known_wrong:
      - answer: Liebe
        feedback_vi: "Tom là nam nên Lieber Tom (Liebe dùng cho nữ)."
        error_tag: adj_ending
      - answer: Gruß
        feedback_vi: "Cuối thư dùng số nhiều: Viele Grüße."
        error_tag: plural_form
      - answer: Grüßen
        feedback_vi: "Không có mit nên không thêm -n: Viele Grüße."
        error_tag: plural_form
    explanation:
      vi: "Thư thân mật gửi bạn nam: Lieber Tom (hoặc Hallo Tom). Lời chào cuối thân mật: Viele Grüße – Grüße là số nhiều của der Gruß."
    display_answer: Lieber Tom, vielen Dank für die Einladung! Ich komme gern. Viele Grüße, Lan

