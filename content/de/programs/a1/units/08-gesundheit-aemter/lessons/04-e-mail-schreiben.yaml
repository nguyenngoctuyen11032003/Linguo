    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-gruss
    prompt:
      template: "{{b1}} Tom, vielen Dank für die Einladung! Ich komme gern. Viele {{b2}}, Lan"
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 6 }
    answer:
