      vi: "Ich habe Fieber und Husten = tôi bị sốt và ho; Ich hätte gern einen Termin = tôi muốn đặt lịch; heute um elf Uhr = hôm nay lúc 11 giờ (elf = 11)."
    display_answer: "Minh bị sốt và ho; phòng khám hẹn Minh đến lúc 11 giờ hôm nay."

  # ---------------- recall ----------------
  - key: de:exercise:a1u08l2-fill-habe-dreimal
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-g-wie-oft-mal
    prompt:
      template: "Was fehlt Ihnen? – Ich {{b1}} Fieber und Husten. – Nehmen Sie die Tabletten {{b2}} (3-mal) am Tag."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 8 }
    answer:
      blanks:
        b1: [habe]
        b2: [dreimal, drei Mal, 3-mal]
    known_wrong:
      - answer: bin
        feedback_vi: "Triệu chứng đi với haben: Ich habe Fieber. (sein chỉ dùng với krank, gesund…)"
        error_tag: verb_choice
      - answer: drei
        feedback_vi: "\"Ba lần\" là dreimal (số + mal)."
        error_tag: word_form
    explanation:
      vi: "Fieber, Husten là triệu chứng nên dùng haben: ich habe. Ba lần = dreimal (thường viết liền; drei Mal cũng đúng)."
    display_answer: "Was fehlt Ihnen? – Ich habe Fieber und Husten. – Nehmen Sie die Tabletten dreimal am Tag."

  - key: de:exercise:a1u08l2-fill-wie-oft-am
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-g-wie-oft-mal
    prompt:
      template: "Wie {{b1}} soll ich die Tabletten nehmen? – Zweimal {{b2}} Tag."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 3 }
    answer:
      blanks:
        b1: [oft]
        b2: [am, pro]
    known_wrong:
      - answer: viel
        feedback_vi: "Hỏi số lần là Wie oft …? (Wie viel hỏi số lượng.)"
        error_tag: question_word
      - answer: im
        feedback_vi: "Với Tag dùng am: zweimal am Tag."
        error_tag: preposition
      - answer: in
        feedback_vi: "Với Tag dùng am: zweimal am Tag (in der Woche mới dùng in)."
        error_tag: preposition
    explanation:
      vi: "Hỏi bao nhiêu lần: Wie oft …? Trả lời: zweimal am Tag (pro Tag cũng đúng)."
    display_answer: Wie oft soll ich die Tabletten nehmen? – Zweimal am Tag.

  - key: de:exercise:a1u08l2-tr-tabletten-zweimal
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-tablette
    prompt:
      source_text: Tôi uống những viên thuốc này hai lần mỗi ngày.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich nehme die Tabletten zweimal am Tag.
        - Ich nehme diese Tabletten zweimal am Tag.
        - Ich nehme die Tabletten zweimal täglich.
        - Ich nehme diese Tabletten zweimal täglich.
        - Zweimal am Tag nehme ich die Tabletten.
        - Zweimal am Tag nehme ich diese Tabletten.
        - Die Tabletten nehme ich zweimal am Tag.
        - Diese Tabletten nehme ich zweimal am Tag.
        - Ich nehme die Tabletten jeden Tag zweimal.
        - Ich nehme die Tabletten zwei Mal am Tag.
        - Ich nehme die Tabletten zweimal pro Tag.
        - Ich nehme diese Tabletten zweimal pro Tag.
        - Ich nehme diese Tabletten jeden Tag zweimal.
        - Ich nehme diese Tabletten zwei Mal am Tag.
    known_wrong:
      - answer: Ich trinke die Tabletten zweimal am Tag.
        feedback_vi: "Viên thuốc thì dùng nehmen, không dùng trinken."
        error_tag: verb_choice
      - answer: Ich nehme die Tabletten zweimal im Tag.
        feedback_vi: "Với Tag dùng am: zweimal am Tag."
        error_tag: preposition
      - answer: Ich nehme die Tabletten zwei am Tag.
        feedback_vi: "\"Hai lần\" là zweimal."
        error_tag: word_form
    explanation:
      vi: "Thuốc viên dùng nehmen (ich nehme); hai lần mỗi ngày = zweimal am Tag hoặc zweimal täglich. nehme ở vị trí 2."
    display_answer: Ich nehme die Tabletten zweimal am Tag.

  # ---------------- application ----------------
  - key: de:exercise:a1u08l2-wb-nehmen-sie
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-tablette
    prompt:
      instruction: "Bác sĩ dặn bệnh nhân (Sie): \"Ông/bà uống thuốc ba lần mỗi ngày.\" Sắp xếp thành câu mệnh lệnh."
      tokens:
        - { id: t-tag, text: Tag }
        - { id: t-dreimal, text: dreimal }
        - { id: t-sie, text: Sie }
        - { id: t-am, text: am }
        - { id: t-tabletten, text: Tabletten }
        - { id: t-nehmen, text: nehmen }
        - { id: t-die, text: die }
        - { id: t-im, text: im }
    answer:
      orders:
        - [t-nehmen, t-sie, t-die, t-tabletten, t-dreimal, t-am, t-tag]
    explanation:
      vi: "Câu mệnh lệnh với Sie: động từ đứng đầu, ngay sau là Sie (Nehmen Sie …). Tân ngữ die Tabletten rồi đến số lần: dreimal am Tag (không dùng im)."
    display_answer: Nehmen Sie die Tabletten dreimal am Tag.

  - key: de:exercise:a1u08l2-mcq-termin-telefon
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-termin
    prompt:
      stem: "Bạn gọi điện đến phòng khám để xin một lịch khám. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: f6a, text: "Guten Tag, ich hätte gern einen Termin.", lang: de }
        - { id: w3e, text: "Hallo, gib mir einen Termin!", lang: de }
        - { id: i8m, text: "Guten Tag, ich bin einen Termin.", lang: de }
        - { id: c5y, text: "Guten Tag, ich habe ein Rezept.", lang: de }
    answer:
      correct_option_id: f6a
    explanation:
      vi: "Ich hätte gern … là cụm cố định để xin một cách lịch sự. \"Gib mir …!\" là mệnh lệnh với du – không lịch sự với phòng khám; \"ich bin einen Termin\" sai động từ; Rezept là đơn thuốc, không phải lịch hẹn."
    display_answer: "Guten Tag, ich hätte gern einen Termin."

  - key: de:exercise:a1u08l2-tr-gestern-fieber-vi
