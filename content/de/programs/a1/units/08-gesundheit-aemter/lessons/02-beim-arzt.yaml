    display_answer: Hôm qua tôi bị sốt, nhưng hôm nay tôi khỏe lại rồi.

  - key: de:exercise:a1u08l2-mcq-rezept-apotheke
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u08-rezept
    prompt:
      stem: "Bác sĩ nói: \"Hier ist Ihr Rezept.\" Bạn mang tờ giấy này đi đâu?"
      stem_lang: vi
      options:
        - { id: n2d, text: "Đến hiệu thuốc (die Apotheke) để lấy thuốc.", lang: vi }
        - { id: h9g, text: "Về nhà để nấu ăn theo công thức.", lang: vi }
        - { id: t4b, text: "Đến ngân hàng để thanh toán hoá đơn.", lang: vi }
        - { id: s7x, text: "Đến bưu điện để gửi thư.", lang: vi }
    answer:
      correct_option_id: n2d
    explanation:
      vi: "Ở phòng khám, das Rezept là đơn thuốc – mang ra Apotheke để lấy thuốc. Rezept cũng có nghĩa công thức nấu ăn, nhưng không phải khi bác sĩ đưa cho bạn; hoá đơn là die Rechnung."
    display_answer: "Đến hiệu thuốc (die Apotheke) để lấy thuốc."
