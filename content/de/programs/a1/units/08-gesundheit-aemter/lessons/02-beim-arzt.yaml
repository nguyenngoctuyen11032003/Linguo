        - Hôm qua tôi bị sốt, nhưng hôm nay tôi khỏe lại rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi lại khỏe rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi đã khỏe lại.
        - Hôm qua tôi bị sốt nhưng hôm nay tôi khỏe lại rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi khỏe rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi khỏe lại.
        - Hôm qua mình bị sốt, nhưng hôm nay mình khỏe lại rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi lại khỏe mạnh.
        - Hôm qua tôi sốt, nhưng hôm nay tôi khỏe lại rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi khoẻ lại rồi.
        - Hôm qua tôi bị sốt, nhưng hôm nay tôi khoẻ rồi.
