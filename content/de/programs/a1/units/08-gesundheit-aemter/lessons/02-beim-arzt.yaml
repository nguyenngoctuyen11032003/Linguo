body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi điện đặt lịch khám, nói với bác sĩ mình bị sốt, ho, cảm, và hiểu lời dặn "uống thuốc ba lần mỗi ngày".
  - type: explain
    text:
      vi: "Tiếng Việt nói \"tôi bị ốm\", \"tôi bị sốt\" với cùng chữ \"bị\". Tiếng Đức tách hai cách: Ich bin krank (sein + tính từ), nhưng triệu chứng đi với haben: Ich habe Fieber, Husten, Schnupfen, eine Erkältung."
  - type: explain
    text:
      vi: "Fieber, Husten, Schnupfen thường dùng không có mạo từ: Ich habe Fieber (không nói ein Fieber). Riêng die Erkältung đếm được, nên nói Ich habe eine Erkältung."
  - type: explain
    text:
      vi: "Đặt lịch qua điện thoại: Ich hätte gern einen Termin. Ngày giờ hẹn dùng am + thứ/ngày và um + giờ: am Montag um zehn Uhr, am dritten Mai."
  - type: explain
    text:
      vi: "Bác sĩ dặn uống thuốc mấy lần: einmal, zweimal, dreimal am Tag (số + mal, thường viết liền). täglich và jeden Tag đều là \"mỗi ngày\"; hỏi lại: Wie oft soll ich die Tabletten nehmen?"
  - type: explain
    text:
      vi: "Ở phòng khám, bác sĩ và nhân viên nói Sie với bệnh nhân người lớn: Was fehlt Ihnen? (Ông/bà bị làm sao?). Lúc chia tay, người ta chúc: Gute Besserung!"
  - type: deep_explain
    text:
      vi: "Ở Đức, khi ốm thông thường người ta hay đến bác sĩ gia đình (der Hausarzt, die Hausärztin) trước và gọi điện hẹn lịch; thường cần mang thẻ bảo hiểm y tế (thủ tục có thể thay đổi, hãy hỏi phòng khám của bạn). das Rezept là đơn thuốc – bạn mang đơn ra hiệu thuốc (die Apotheke); còn hoá đơn, biên lai là die Rechnung hoặc die Quittung. Kể chuyện hôm qua dùng war/hatte: Gestern hatte ich Fieber, heute bin ich wieder gesund. Viên thuốc thì nehmen, không trinken, dù tiếng Việt nói \"uống thuốc\"."
  - type: example
    target: "Guten Tag, ich hätte gern einen Termin. – Geht es am Dienstag um neun Uhr?"
    target_lang: de
    translation:
      vi: "Chào chị, tôi muốn đặt một lịch khám. – Thứ Ba lúc chín giờ có được không ạ?"
    note:
      vi: "Gọi điện cho phòng khám: dùng cách nói lịch sự Ich hätte gern …; Geht es …? = có được không."
  - type: example
    target: "Was fehlt Ihnen? – Ich habe Fieber und Husten, und mir tut der Hals weh."
    target_lang: de
    translation:
      vi: "Ông bị làm sao? – Tôi bị sốt và ho, và tôi đau họng."
    note:
      vi: "Bác sĩ nói Sie → Ihnen. Triệu chứng đi với haben, không có mạo từ; chỗ đau dùng khuôn mir tut … weh."
  - type: example
    target: Nehmen Sie die Tabletten dreimal am Tag nach dem Essen.
    target_lang: de
    translation:
      vi: Ông/bà uống thuốc ba lần mỗi ngày, sau khi ăn.
    note:
      vi: "Câu mệnh lệnh với Sie; dreimal am Tag = ba lần mỗi ngày; nach dem Essen = sau bữa ăn (nach + Dativ)."
  - type: example
    target: Gestern hatte ich Fieber. Heute bin ich wieder gesund.
    target_lang: de
    translation:
      vi: Hôm qua tôi bị sốt. Hôm nay tôi khoẻ lại rồi.
    note:
      vi: "hatte là quá khứ của haben, dùng nhiều trong văn nói thay cho Perfekt."
  - type: example
    target: "Hier ist Ihr Rezept. Gute Besserung! – Vielen Dank, auf Wiedersehen!"
    target_lang: de
    translation:
      vi: "Đây là đơn thuốc của ông. Chúc ông mau khỏi! – Cảm ơn bác sĩ nhiều, chào bác sĩ!"
    note:
      vi: "Rezept = đơn thuốc (mang ra Apotheke)."
  - type: common_mistake
    wrong: Ich bin Fieber.
    right: Ich habe Fieber.
    target_lang: de
    note:
      vi: Đừng dịch chữ "bị". Triệu chứng đi với haben; chỉ krank, gesund, müde mới đi với sein.
  - type: common_mistake
    wrong: Ich habe ein Fieber.
    right: Ich habe Fieber.
    target_lang: de
    note:
      vi: "Fieber, Husten, Schnupfen thường dùng không có mạo từ. Chỉ nói eine Erkältung."
  - type: common_mistake
    wrong: Ich trinke die Tabletten dreimal am Tag.
    right: Ich nehme die Tabletten dreimal am Tag.
    target_lang: de
    note:
      vi: "Thuốc viên thì dùng nehmen, dù tiếng Việt nói \"uống thuốc\"."
  - type: summary
    points:
      - vi: "Ich bin krank / gesund. – Ich habe Fieber, Husten, Schnupfen, eine Erkältung."
      - vi: "Ich hätte gern einen Termin. – am Dienstag um neun Uhr."
      - vi: "Was fehlt Ihnen? – Gute Besserung!"
      - vi: "einmal, zweimal, dreimal am Tag; täglich = jeden Tag; Wie oft …?"
      - vi: "Tabletten nehmen (không trinken); das Rezept = đơn thuốc → Apotheke."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a1u08l2-mcq-habe-fieber
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u08-fieber
    prompt:
      stem: "Bạn bị sốt. Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: d3k, text: Ich habe Fieber., lang: de }
        - { id: m7q, text: Ich bin Fieber., lang: de }
        - { id: x2r, text: Ich habe ein Fieber., lang: de }
        - { id: b9t, text: Ich bin krank Fieber., lang: de }
    answer:
      correct_option_id: d3k
    explanation:
      vi: "Triệu chứng đi với haben, và Fieber thường không có mạo từ: Ich habe Fieber. \"Ich bin Fieber\" là dịch từng chữ \"tôi bị sốt\"."
    display_answer: Ich habe Fieber.

  - key: de:exercise:a1u08l2-listen-zweimal
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u08-g-wie-oft-mal
    prompt:
      audio_asset_id: null
      fallback_text: Nehmen Sie die Tabletten zweimal am Tag, am Morgen und am Abend.
      options:
        - { id: p4h, text: "Uống thuốc hai lần mỗi ngày, buổi sáng và buổi tối.", lang: vi }
        - { id: z8c, text: "Uống thuốc ba lần mỗi ngày, sau bữa ăn.", lang: vi }
        - { id: l1n, text: "Uống hai viên vào buổi sáng.", lang: vi }
        - { id: u6w, text: "Uống thuốc mỗi ngày một lần, vào buổi tối.", lang: vi }
    answer:
      correct_option_id: p4h
    explanation:
      vi: "zweimal am Tag = hai lần mỗi ngày; am Morgen und am Abend = buổi sáng và buổi tối. dreimal mới là ba lần, einmal là một lần."
    display_answer: "Uống thuốc hai lần mỗi ngày, buổi sáng và buổi tối."

  - key: de:exercise:a1u08l2-listen-termin
    type: listen
