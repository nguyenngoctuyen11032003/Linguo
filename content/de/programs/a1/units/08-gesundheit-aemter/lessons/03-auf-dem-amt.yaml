title:
  vi: Ở cơ quan hành chính – für, ohne (Auf dem Amt)
objectives:
  - vi: Đọc giờ mở cửa và biển báo ở cơ quan (Öffnungszeiten, geöffnet, geschlossen).
  - vi: Hỏi cần mang giấy tờ gì (Was brauche ich für die Anmeldung?).
  - vi: Dùng für, ohne, durch, gegen, um + Akkusativ (für mich, ohne Termin, gegen Fieber).
  - vi: Hiểu các bước cơ bản khi đăng ký cư trú (Anmeldung).
