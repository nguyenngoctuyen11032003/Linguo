body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi tên được đồ dùng trong bếp và trong nhà, hỏi đồ vật ở đâu và nói nó dùng để làm gì.
  - type: explain
    text:
      vi: "Nhiều đồ gia dụng có đuôi -er, -e hoặc -ine cho biết giống: đuôi -er thường là giống đực (der Staubsauger, der Wecker, der Eimer), đuôi -e và -ine thường là giống cái (die Gabel, die Pfanne, die Waschmaschine). Đây chỉ là xu hướng, vẫn có ngoại lệ, nên học cả mạo từ."
  - type: explain
    text:
      vi: "Muốn hỏi đồ vật ở đâu, bạn dùng Wo ist …? với mạo từ xác định: Wo ist der Wecker? Câu trả lời dùng in/auf/neben + Dativ như đã học: Der Wecker ist neben dem Bett. Khi nói tôi cần, dùng Akkusativ: Ich brauche einen Eimer."
  - type: explain
    text:
      vi: "Một số từ có nhiều nghĩa: die Decke là cái chăn nhưng cũng là trần nhà; der Becher là cái cốc (không có quai) còn die Tasse là cái tách. Học từ trong câu để nhớ nghĩa đúng."
  - type: deep_explain
    text:
      vi: "Das Besteck chỉ có số ít (Sg.) và chỉ chung dao, dĩa, thìa: Ich brauche Besteck. Khi đếm từng món, bạn nói ein Messer, zwei Gabeln, drei Löffel. Der Herd là bếp nấu, còn der Ofen là lò nướng; ở Đức nhiều bếp có cả hai trong cùng một thiết bị."
  - type: example
    target: Ich schneide das Brot mit dem Messer.
    target_lang: de
    translation:
      vi: Tôi cắt bánh mì bằng dao.
    note:
      vi: das Messer = con dao.
  - type: example
    target: Zum Salat brauche ich eine Gabel.
    target_lang: de
    translation:
      vi: Với món salad tôi cần một cái nĩa.
    note:
      vi: die Gabel = cái nĩa, cái dĩa.
  - type: example
    target: Das Besteck liegt in der Schublade.
    target_lang: de
    translation:
      vi: Bộ dao dĩa nằm trong ngăn kéo.
    note:
      vi: das Besteck = bộ dao dĩa.
  - type: example
    target: Die Suppe ist im Topf.
    target_lang: de
    translation:
      vi: Món súp ở trong nồi.
    note:
      vi: der Topf = cái nồi.
  - type: common_mistake
    wrong: Wo ist die Besen?
    right: Wo ist der Besen?
    target_lang: de
    note:
      vi: Besen là giống đực nên dùng der.
  - type: common_mistake
    wrong: Ich brauche ein Gabel.
    right: Ich brauche eine Gabel.
    target_lang: de
    note:
      vi: Gabel là giống cái; dùng eine, không dùng ein.
  - type: summary
    points:
      - vi: "Đuôi -er thường là giống đực (der Eimer, der Wecker, der Staubsauger); đuôi -e thường là giống cái (die Gabel, die Pfanne, die Decke). Vẫn nên học cả mạo từ."
      - vi: "das Besteck (Sg.) là bộ dao dĩa nói chung; das Messer, die Gabel, der Löffel là từng món."
      - vi: "Wo ist …? hỏi đồ vật ở đâu; Ich brauche + Akkusativ nói bạn cần gì."
