title:
  vi: Đồ dùng trong nhà và nhà bếp (Haushalt und Küche)
objectives:
  - vi: Gọi tên dụng cụ ăn uống, đồ nhà bếp và đồ gia dụng thường gặp.
  - vi: Hỏi và nói đồ vật ở đâu bằng mạo từ đúng giống.
  - vi: Nói số nhiều của các danh từ chỉ đồ vật trong nhà.
