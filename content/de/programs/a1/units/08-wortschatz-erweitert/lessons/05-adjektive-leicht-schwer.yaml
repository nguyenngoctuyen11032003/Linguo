body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả người, vật và cảm giác bằng nhiều tính từ hơn, kể cả các cặp trái nghĩa.
  - type: explain
    text:
      vi: "Sau sein, tính từ đứng một mình và không đổi đuôi: Der Koffer ist schwer. Die Suppe ist heiß. Die Kinder sind hungrig. Đây là cách dùng đơn giản nhất và cũng là cách dùng chính ở A1."
  - type: explain
    text:
      vi: "Nhớ tính từ theo cặp trái nghĩa sẽ nhanh hơn: leicht – schwer, schnell – langsam, offen – geschlossen, voll – leer, reich – arm, nass – trocken, dick – dünn, gleich – anders. Cặp đã học ở các bài trước vẫn có thể ôn lại cùng cặp mới."
  - type: explain
    text:
      vi: "Bạn có thể tăng hoặc giảm mức độ bằng sehr, ziemlich hoặc zu: Das Auto ist sehr schnell. Der Tee ist ziemlich heiß. Der Koffer ist zu schwer. Zu có nghĩa là \"quá\", mang ý chê."
  - type: deep_explain
    text:
      vi: "Leicht có hai nghĩa: nhẹ (Der Koffer ist leicht) và dễ (Die Aufgabe ist leicht). Schwer cũng vậy: nặng và khó. Ngữ cảnh cho bạn biết nghĩa nào. Gleich vừa là tính từ (Die Taschen sind gleich) vừa là trạng từ (\"ngay\") trong Ich komme gleich; bạn gặp hai cách dùng này suốt trong tiếng Đức hằng ngày."
  - type: example
    target: Deine Schwester ist sehr hübsch.
    target_lang: de
    translation:
      vi: Chị gái bạn rất xinh.
    note:
      vi: hübsch = xinh, đẹp (người, vật nhỏ).
  - type: example
    target: Der Hund ist ziemlich dick.
    target_lang: de
    translation:
      vi: Con chó khá béo.
    note:
      vi: dick = béo; dày.
  - type: example
    target: Das Buch ist sehr dünn.
    target_lang: de
    translation:
      vi: Quyển sách rất mỏng.
    note:
      vi: dünn = gầy; mỏng.
  - type: example
    target: Mein Vater ist sehr stark.
    target_lang: de
    translation:
      vi: Bố tôi rất khỏe.
    note:
      vi: stark = khỏe; mạnh.
  - type: common_mistake
    wrong: Der Koffer ist sehr schwere.
    right: Der Koffer ist sehr schwer.
    target_lang: de
    note:
      vi: Sau sein, tính từ không thêm đuôi.
  - type: common_mistake
    wrong: Ich bin hungrig sehr.
    right: Ich bin sehr hungrig.
    target_lang: de
    note:
      vi: Sehr đứng trước tính từ mà nó bổ nghĩa, không đứng sau.
  - type: summary
    points:
      - vi: "sehr, ziemlich, zu: rất, khá, quá. Leicht và schwer có hai nghĩa: nhẹ/dễ, nặng/khó."
