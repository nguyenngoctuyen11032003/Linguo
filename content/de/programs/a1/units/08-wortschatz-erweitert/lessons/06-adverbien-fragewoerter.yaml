body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói vị trí và mức độ chính xác hơn và đặt được thêm câu hỏi với wann, warum, wohin.
  - type: explain
    text:
      vi: "Trạng từ nơi chốn trả lời câu hỏi Wo?: dort (ở đó), oben (ở trên), unten (ở dưới), drinnen (bên trong), draußen (bên ngoài), überall (khắp nơi). Chúng thường đứng ngay sau động từ: Die Kinder spielen draußen. Dort ist der Bahnhof."
  - type: explain
    text:
      vi: "Wohin? hỏi hướng đi, còn Wo? hỏi vị trí: Wo bist du? – Ich bin zu Hause. Wohin gehst du? – Ich gehe nach Hause. Hãy chú ý hai câu hỏi khác nhau, vì tiếng Việt chỉ dùng \"đâu\" cho cả hai."
  - type: explain
    text:
      vi: "Wann? hỏi thời điểm, Warum? hỏi lý do: Wann kommt der Bus? – Um acht Uhr. Warum bist du müde? – Ich habe schlecht geschlafen. Trong câu hỏi W-, động từ vẫn ở vị trí thứ hai."
  - type: deep_explain
    text:
      vi: "Fast (gần như), nur (chỉ), ziemlich (khá), wirklich (thật sự), genug (đủ) là những từ nhỏ nhưng rất hay gặp. Genug đứng sau tính từ (Das ist gut genug) hoặc trước danh từ không đếm được (Ich habe genug Zeit). Nur có thể đứng trước từ nó bổ nghĩa: Ich habe nur eine Schwester."
  - type: example
    target: Dort ist der Bahnhof.
    target_lang: de
    translation:
      vi: Ở đó là nhà ga.
    note:
      vi: dort = ở đó.
  - type: example
    target: Meine Wohnung ist oben.
    target_lang: de
    translation:
      vi: Căn hộ của tôi ở trên.
    note:
      vi: oben = ở trên.
  - type: example
    target: Der Hund wartet unten.
    target_lang: de
    translation:
      vi: Con chó đợi ở dưới.
    note:
      vi: unten = ở dưới.
  - type: example
    target: Bei Regen spielen wir drinnen.
    target_lang: de
    translation:
      vi: Khi trời mưa chúng tôi chơi trong nhà.
    note:
      vi: drinnen = bên trong, trong nhà.
  - type: common_mistake
    wrong: Wo gehst du?
    right: Wohin gehst du?
    target_lang: de
    note:
      vi: Với động từ chỉ chuyển động như gehen, dùng wohin để hỏi hướng đi.
  - type: common_mistake
    wrong: Warum du bist müde?
    right: Warum bist du müde?
    target_lang: de
    note:
      vi: Trong câu hỏi W-, động từ chia đứng ngay sau từ để hỏi (vị trí thứ hai), trước chủ ngữ.
  - type: summary
    points:
      - vi: Wann? hỏi thời điểm; Warum? hỏi lý do; động từ ở vị trí thứ hai.
