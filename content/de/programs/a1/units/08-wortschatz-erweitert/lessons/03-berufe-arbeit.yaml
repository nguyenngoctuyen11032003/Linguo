body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được thêm nhiều nghề nghiệp bằng tiếng Đức, kể cả dạng nam và nữ, và nói về công việc hằng ngày.
  - type: explain
    text:
      vi: "Nghề nghiệp có dạng nam và nữ. Dạng nữ thường thêm đuôi -in: der Bäcker → die Bäckerin, der Zahnarzt → die Zahnärztin (Zahnarzt đổi thành Zahnärztin), der Fotograf → die Fotografin. Số nhiều dạng nữ là -nen: die Bäckerinnen."
  - type: explain
    text:
      vi: "Khi nói nghề của mình, bạn không dùng mạo từ như đã học: Ich bin Bäcker. Sie ist Zahnärztin. Chỉ khi có tính từ hoặc thêm thông tin thì mới dùng ein/eine: Er ist ein guter Fotograf."
  - type: explain
    text:
      vi: Nhiều nghề giống đực có đuôi -er (der Bäcker, der Arbeiter, der Musiker, der Sänger), -ist (der Polizist) hoặc -ekt (der Architekt). Đây là mẹo nhớ, không phải quy tắc tuyệt đối; hãy học cả mạo từ.
  - type: deep_explain
    text:
      vi: "Nhiều nghề trong tiếng Đức có dạng nam làm tên chung. Trong văn bản, ngày nay thường viết cả hai giống (die Polizistinnen und Polizisten) hoặc dùng cách viết gộp như Polizist:innen; bạn sẽ học thêm ở các cấp cao hơn. Die Arbeit chỉ có số ít và dùng cho công việc nói chung: Ich habe viel Arbeit."
  - type: example
    target: Der Bäcker arbeitet schon um vier Uhr.
    target_lang: de
    translation:
      vi: Người thợ làm bánh mì đã làm việc từ bốn giờ.
    note:
      vi: der Bäcker = thợ làm bánh mì.
  - type: example
    target: Der Polizist hilft dem Kind.
    target_lang: de
    translation:
      vi: Anh cảnh sát giúp đứa bé.
    note:
      vi: der Polizist = cảnh sát.
  - type: example
    target: Der Taxifahrer kennt die Stadt gut.
    target_lang: de
    translation:
      vi: Tài xế taxi biết rõ thành phố.
    note:
      vi: der Taxifahrer = tài xế taxi.
  - type: example
    target: Der Busfahrer ruft die Haltestelle aus.
    target_lang: de
    translation:
      vi: Tài xế xe buýt xướng tên trạm dừng.
    note:
      vi: der Busfahrer = tài xế xe buýt.
  - type: common_mistake
    wrong: Ich bin ein Bäcker.
    right: Ich bin Bäcker.
    target_lang: de
    note:
      vi: Khi nói nghề của mình và không có thêm tính từ, tiếng Đức bỏ ein/eine.
  - type: common_mistake
    wrong: Sie ist Zahnarzt.
    right: Sie ist Zahnärztin.
    target_lang: de
    note:
      vi: Nghề của phụ nữ dùng dạng nữ (-in); nhớ đổi a thành ä trong Zahnärztin.
  - type: summary
    points:
      - vi: "Dạng nữ thường thêm -in (Bäckerin, Fotografin); Zahnarzt → Zahnärztin; số nhiều dạng nữ là -nen."
      - vi: "Nói nghề của mình thì bỏ ein/eine: Ich bin Programmierer. Có tính từ thì dùng: Er ist ein guter Fotograf."
      - vi: "die Arbeit chỉ có số ít; ich habe viel Arbeit; ich bin bei der Arbeit."
