title:
  vi: Nghề nghiệp và nơi làm việc (Berufe und Arbeit)
objectives:
  - vi: Gọi tên thêm nhiều nghề nghiệp, gồm dạng nam và nữ.
  - vi: "Nói về công việc hằng ngày: làm nghề gì, làm ở đâu, giờ nghỉ trưa."
  - vi: Nhận biết các đuôi -er, -ist, -ekt của danh từ chỉ nghề.
