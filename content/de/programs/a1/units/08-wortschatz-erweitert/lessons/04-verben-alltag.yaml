title:
  vi: Động từ thông dụng hằng ngày (Verben im Alltag)
objectives:
  - vi: Dùng thêm các động từ thông dụng như sagen, fragen, öffnen, laufen, kennen.
  - vi: Chia động từ đổi nguyên âm và động từ tách mới ở thì hiện tại.
  - vi: Phân biệt kennen và wissen ở mức cơ bản.
