body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng được thêm hơn hai mươi động từ thông dụng, kể cả động từ đổi nguyên âm và động từ tách.
  - type: explain
    text:
      vi: "Động từ có -t sau gốc ở ngôi er/sie/es và -st ở ngôi du: ich sage, du sagst, er sagt. Một số động từ đổi nguyên âm ở du và er/sie/es: laufen → du läufst, er läuft; waschen → du wäschst, er wäscht; rufen không đổi: du rufst. Hãy học cả dạng đổi kèm theo động từ."
  - type: explain
    text:
      vi: "Động từ tách có phần đầu đứng ở cuối câu: Kommst du heute Abend mit? Ich nehme einen Regenschirm mit. Mach bitte die Tür zu! Mach das Licht aus! Phần mit/zu/aus/auf đứng sau cùng, còn động từ đã chia vẫn ở vị trí thứ hai."
  - type: explain
    text:
      vi: "Tiếng Việt chỉ có \"biết\", còn tiếng Đức có hai động từ. Kennen dùng với người hoặc nơi chốn quen thuộc: Ich kenne Anna. Wissen dùng với thông tin: Ich weiß, wo Anna wohnt. Bạn sẽ học thêm cách dùng wissen với mệnh đề ở A2."
  - type: deep_explain
    text:
      vi: Beginnen và anfangen gần như đồng nghĩa; anfangen là động từ tách (Ich fange an), beginnen thì không (Ich beginne). Hai động từ này có thể thay nhau trong hầu hết trường hợp hằng ngày, nhưng anfangen nghe tự nhiên hơn trong văn nói. Aufmachen và öffnen cùng nghĩa là mở; aufmachen thân mật hơn, öffnen trang trọng hơn.
  - type: example
    target: Was sagst du?
    target_lang: de
    translation:
      vi: Bạn nói gì?
    note:
      vi: sagen = nói.
  - type: example
    target: Ich frage den Lehrer.
    target_lang: de
    translation:
      vi: Tôi hỏi thầy giáo.
    note:
      vi: fragen = hỏi.
  - type: example
    target: Er ruft seinen Bruder.
    target_lang: de
    translation:
      vi: Anh ấy gọi anh trai mình.
    note:
      vi: rufen = gọi (lớn tiếng); gọi điện/gọi ai đến.
  - type: example
    target: Ich ändere meinen Termin.
    target_lang: de
    translation:
      vi: Tôi đổi lịch hẹn của mình.
    note:
      vi: ändern = thay đổi.
  - type: common_mistake
    wrong: Ich mache die Tür auf nicht.
    right: Ich mache die Tür nicht auf.
    target_lang: de
    note:
      vi: Phần tách auf đứng cuối câu; nicht đứng trước nó.
  - type: common_mistake
    wrong: Ich weiß diese Frau nicht.
    right: Ich kenne diese Frau nicht.
    target_lang: de
    note:
      vi: Với người, dùng kennen; wissen dùng với thông tin hoặc câu phụ.
  - type: summary
    points:
      - vi: "laufen → du läufst, er läuft; waschen → du wäschst, er wäscht; backen → er backt."
      - vi: "Động từ tách: aufmachen, zumachen, ausmachen, mitkommen, mitnehmen; phần tách đứng cuối câu chính."
      - vi: "kennen cho người và nơi chốn; wissen cho thông tin."
