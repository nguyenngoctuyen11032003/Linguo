title:
  vi: Động vật và thiên nhiên (Tiere und Natur)
objectives:
  - vi: Gọi tên các con vật quen thuộc và nói số nhiều của chúng.
  - vi: Nhớ mạo từ der/die/das cùng với từng danh từ về thiên nhiên.
  - vi: Nói có con vật hoặc vật gì ở đâu bằng các câu đơn giản.
