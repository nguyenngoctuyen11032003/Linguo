body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi được tên những con vật quen thuộc, nói về cảnh thiên nhiên đơn giản và biết số nhiều của từng danh từ.
  - type: explain
    text:
      vi: "Mỗi danh từ tiếng Đức có một giống riêng, và tên con vật cũng vậy: der Hase, der Bär, der Löwe nhưng die Kuh, die Ente, die Maus và das Pferd, das Schwein, das Schaf, das Huhn. Bạn không đoán được giống từ nghĩa nên hãy học mỗi từ cùng mạo từ của nó."
  - type: explain
    text:
      vi: "Số nhiều không theo một quy tắc cố định. Hãy nhìn ký hiệu sau dấu phẩy trong học liệu: das Pferd → die Pferde, die Kuh → die Kühe, das Huhn → die Hühner, die Maus → die Mäuse (nguyên âm đổi thành ä, ü, äu), die Ente → die Enten."
  - type: explain
    text:
      vi: "Để nói trong một nơi có con vật nào, bạn dùng es gibt như đã học: Im Zoo gibt es viele Tiere. Muốn nói về con vật của mình, dùng ich habe + con vật: Ich habe ein Pferd. Chủ ngữ số ít hay số nhiều quyết định động từ: Das Pferd läuft. Die Pferde laufen."
  - type: deep_explain
    text:
      vi: "Tên con vật thường xuất hiện trong thành ngữ: ein Elefant im Porzellanladen (người vụng về), ein Bär von einem Mann (người to khỏe). Bạn chưa cần dùng chúng bây giờ, nhưng khi nghe thì đã biết hình ảnh. Với danh từ như der Hase, der Bär, der Löwe, der Elefant, số nhiều thêm -n hoặc -en; bạn sẽ gặp thêm đuôi này ở các cách sau."
  - type: example
    target: Im Zoo gibt es viele Tiere.
    target_lang: de
    translation:
      vi: Trong sở thú có nhiều con vật.
    note:
      vi: Dạng số nhiều Tiere đứng sau es gibt viele.
  - type: example
    target: Das Pferd läuft schnell über das Feld.
    target_lang: de
    translation:
      vi: Con ngựa chạy nhanh qua cánh đồng.
    note:
      vi: das Pferd = con ngựa.
  - type: example
    target: Die Kuh steht auf dem Feld.
    target_lang: de
    translation:
      vi: Con bò đứng trên cánh đồng.
    note:
      vi: die Kuh = con bò cái.
  - type: example
    target: Auf dem Bauernhof gibt es ein Schwein.
    target_lang: de
    translation:
      vi: Ở nông trại có một con lợn.
    note:
      vi: das Schwein = con lợn.
  - type: common_mistake
    wrong: Die Pferd ist groß.
    right: Das Pferd ist groß.
    target_lang: de
    note:
      vi: Pferd là giống trung nên dùng das. Học từ cùng mạo từ để không phải đoán.
  - type: common_mistake
    wrong: Ich sehe zwei Maus.
    right: Ich sehe zwei Mäuse.
    target_lang: de
    note:
      vi: "Sau số từ lớn hơn một, danh từ phải ở số nhiều: die Maus → die Mäuse (có thêm dấu ¨ trên nguyên âm)."
  - type: summary
    points:
      - vi: "der Hase, der Bär, der Löwe, der Affe, der Elefant (giống đực) · die Kuh, die Ente, die Maus, die Spinne (giống cái) · das Pferd, das Schwein, das Schaf, das Huhn, das Tier (giống trung)."
      - vi: "Số nhiều không đoán được: die Pferde, die Kühe, die Hühner, die Mäuse, die Enten. Đọc ký hiệu sau dấu phẩy và học thuộc."
      - vi: "Es gibt + Akkusativ để nói có gì ở đâu: Im Zoo gibt es viele Tiere."
