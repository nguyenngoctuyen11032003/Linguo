  - key: de:exercise:a1w1l1-mcq-artikel-stern
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a1w1-stern
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Stern\" (ngôi sao): ___ Stern"
      stem_lang: vi
      options:
        - { id: r32, text: die, lang: de }
        - { id: eaf, text: das, lang: de }
        - { id: eta, text: der, lang: de }
        - { id: ljq, text: ein, lang: de }
    answer:
      correct_option_id: eta
    explanation:
      vi: "Stern là danh từ giống đực (der): der Stern; số nhiều: die Sterne. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: der
