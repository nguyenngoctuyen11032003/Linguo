    explanation:
      vi: "Khuôn câu: Mir tut + chỗ đau (Nominativ) + weh. der Rücken là giống đực, số ít nên tut; mir là Dativ của ich. Ich habe Rückenschmerzen cũng đúng."
    display_answer: Mir tut der Rücken weh.

