body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "Tôi đau đầu", "Hai bàn chân tôi đau", hỏi "Bạn đau ở đâu?" và kể lại "Bác sĩ bảo tôi phải nằm nghỉ".
  - type: explain
    text:
      vi: "Bộ phận cơ thể là danh từ nên luôn học kèm mạo từ: der Kopf, der Bauch, der Rücken, die Hand, das Bein, das Auge. Nhiều bộ phận đi thành đôi, nên bạn hay dùng số nhiều: die Augen, die Ohren, die Hände, die Füße."
  - type: explain
    text:
      vi: "Tiếng Việt nói \"Tôi đau đầu\", \"tôi\" là chủ ngữ. Tiếng Đức nói như \"cái đầu làm tôi đau\": Mir tut der Kopf weh – der Kopf là chủ ngữ, người đau ở Dativ (mir), còn weh tách ra đứng cuối câu."
  - type: explain
    text:
      vi: "Động từ chia theo chỗ đau, không theo người: một bộ phận → tut (Mir tut der Bauch weh), số nhiều → tun (Mir tun die Füße weh). Hỏi bạn bè: Was tut dir weh? Hỏi người lạ: Was tut Ihnen weh?"
  - type: explain
    text:
      vi: "sollen dùng khi bạn nhắc lại điều người khác dặn, yêu cầu: Der Arzt sagt, ich soll im Bett bleiben. Chia như các modal đã học: ich soll, du sollst, er soll (ngôi ich và er không có đuôi), động từ chính ở nguyên thể cuối câu."
  - type: explain
    text:
      vi: "Khi kể lại lời dặn, đừng dịch soll là \"nên\": soll gần với \"được bảo, được dặn là phải\" (Bác sĩ bảo tôi phải nằm nghỉ). Lời khuyên \"nên\" là sollte, bạn học ở A2. müssen cũng là \"phải\", nhưng nói về sự bắt buộc nói chung, không nhấn mạnh ai yêu cầu."
  - type: deep_explain
    text:
      vi: "Trong câu Der Arzt sagt, ich soll …, phần sau dấu phẩy là một câu chính bình thường (soll ở vị trí 2), không cần dass. Câu hỏi Soll ich …? dùng khi bạn hỏi người khác muốn mình làm gì: Soll ich morgen wiederkommen? = Tôi có cần mai quay lại không? (ở câu hỏi này, tiếng Việt cũng có thể nói \"có nên\"). Ngoài Mir tut der Kopf weh, người Đức cũng rất hay nói Ich habe Kopfschmerzen (đau đầu), Bauchschmerzen, Rückenschmerzen – từ ghép với Schmerzen (cơn đau); Mein Kopf tut weh cũng đúng. Chú ý tiếng Việt gọi chung là \"chân\", \"tay\", còn tiếng Đức tách ra: das Bein (cả chân) – der Fuß (bàn chân), der Arm (cánh tay) – die Hand (bàn tay)."
  - type: example
    target: Mir tut der Kopf weh.
    target_lang: de
    translation:
      vi: Tôi đau đầu.
    note:
      vi: "der Kopf là chủ ngữ nên tut (ngôi 3 số ít); người đau ở Dativ: mir. weh đứng cuối câu."
  - type: example
    target: "Was tut dir weh? – Mir tun die Füße weh."
    target_lang: de
    translation:
      vi: "Bạn đau ở đâu? – Mình bị đau chân."
    note:
      vi: "Hai người bạn nói du → dir. die Füße là số nhiều nên tun."
  - type: example
    target: Der Arzt sagt, ich soll drei Tage im Bett bleiben.
    target_lang: de
    translation:
      vi: Bác sĩ bảo tôi phải nằm nghỉ trên giường ba ngày.
    note:
      vi: "ich soll (không có đuôi); bleiben ở nguyên thể cuối câu. Sau dấu phẩy là câu chính, soll ở vị trí 2."
  - type: example
    target: "Frau Nguyen, Sie sollen bitte morgen um neun Uhr kommen."
    target_lang: de
    translation:
      vi: "Chị Nguyễn, (người ta dặn) chị đến lúc chín giờ sáng mai nhé."
    note:
      vi: "Nhân viên nhắn lại lời của bác sĩ cho bệnh nhân, nên dùng Sie (lịch sự): Sie sollen."
  - type: example
    target: Meinem Sohn tut das Ohr weh.
    target_lang: de
    translation:
      vi: Con trai tôi bị đau tai.
    note:
      vi: "Người đau là danh từ thì cũng ở Dativ: der Sohn → meinem Sohn."
  - type: example
    target: "Soll ich viel Wasser trinken? – Ja, Sie sollen viel trinken."
    target_lang: de
    translation:
      vi: "Tôi có phải uống nhiều nước không? – Có, ông/bà phải uống nhiều nước."
    note:
      vi: "Bệnh nhân hỏi bác sĩ muốn mình làm gì: Soll ich …? Bác sĩ trả lời với Sie: Sie sollen …"
  - type: example
    target: "Bleiben Sie zwei Tage zu Hause und trinken Sie viel Wasser! – Der Arzt sagt, ich soll zwei Tage zu Hause bleiben."
    target_lang: de
    translation:
      vi: "Ông/bà ở nhà hai ngày và uống nhiều nước nhé! – Bác sĩ bảo tôi phải ở nhà hai ngày."
    note:
      vi: "Bác sĩ nói trực tiếp bằng câu mệnh lệnh với Sie (Bleiben Sie …!). Khi kể lại cho người khác, bạn đổi sang sollen: ich soll … bleiben."
  - type: common_mistake
    wrong: Ich tue Kopf weh.
    right: Mir tut der Kopf weh.
    target_lang: de
    note:
      vi: Đừng dịch từng chữ "tôi đau đầu". Chỗ đau là chủ ngữ, người đau ở Dativ (mir), và Kopf cần mạo từ der.
  - type: common_mistake
    wrong: Mir tut die Füße weh.
    right: Mir tun die Füße weh.
    target_lang: de
    note:
      vi: "die Füße là số nhiều nên động từ cũng số nhiều: tun."
  - type: common_mistake
    wrong: Der Arzt sagt, ich sollen im Bett bleiben.
    right: Der Arzt sagt, ich soll im Bett bleiben.
    target_lang: de
    note:
      vi: "Modal ở ngôi ich không có đuôi: ich soll (như ich kann, ich muss)."
  - type: summary
    points:
      - vi: "Bộ phận cơ thể: der Kopf, der Bauch, der Rücken, der Arm, das Bein, der Fuß, die Hand, das Auge, der Hals, das Ohr, die Nase, der Mund."
      - vi: "Mir tut der Kopf weh. – Mir tun die Füße weh. (chỗ đau là chủ ngữ, người ở Dativ)"
      - vi: "Was tut dir weh? (bạn bè) – Was tut Ihnen weh? (lịch sự)"
      - vi: "sollen: ich soll, du sollst, er soll, wir sollen, ihr sollt, sie/Sie sollen + nguyên thể cuối câu."
      - vi: "sollen = được dặn, được yêu cầu (Der Arzt sagt, ich soll …); lời khuyên \"nên\" là sollte (A2)."
