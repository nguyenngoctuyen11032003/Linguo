  # ---------------- recall ----------------
  - key: de:exercise:a1u08l1-fill-tut-tun
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-g-wehtun
    prompt:
      template: "Mir {{b1}} der Bauch weh, und meinem Sohn {{b2}} die Ohren weh."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [tut]
        b2: [tun]
    known_wrong:
      - answer: tue
        feedback_vi: "Động từ chia theo chỗ đau, không theo người: der Bauch → tut, die Ohren → tun."
        error_tag: verb_form
      - answer: tust
        feedback_vi: "Chủ ngữ là chỗ đau (der Bauch, die Ohren), không phải du: tut / tun."
        error_tag: verb_form
    explanation:
      vi: "der Bauch là một bộ phận (ngôi 3 số ít) nên tut; die Ohren là số nhiều nên tun. Người đau đứng ở Dativ: mir, meinem Sohn."
    display_answer: Mir tut der Bauch weh, und meinem Sohn tun die Ohren weh.

  - key: de:exercise:a1u08l1-fill-soll-sollen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-g-sollen
    prompt:
      template: "Der Arzt sagt, ich {{b1}} (sollen) im Bett bleiben, und die Kinder {{b2}} (sollen) auch zu Hause bleiben."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [soll]
        b2: [sollen]
    known_wrong:
      - answer: solle
        feedback_vi: "Modal ở ngôi ich không có đuôi: ich soll."
        error_tag: verb_form
      - answer: sollst
        feedback_vi: "sollst chỉ dùng với du. ich → soll, die Kinder (sie, số nhiều) → sollen."
        error_tag: verb_form
      - answer: sollt
        feedback_vi: "sollt chỉ dùng với ihr. ich → soll, die Kinder → sollen."
        error_tag: verb_form
    explanation:
      vi: "ich soll (ngôi ich không có đuôi, giống ich kann, ich muss); die Kinder là số nhiều, tương đương sie, nên sollen. Động từ chính bleiben ở nguyên thể cuối mỗi vế."
    display_answer: Der Arzt sagt, ich soll im Bett bleiben, und die Kinder sollen auch zu Hause bleiben.

  - key: de:exercise:a1u08l1-tr-ruecken
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-ruecken
    prompt:
      source_text: Tôi đau lưng.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Mir tut der Rücken weh.
        - Der Rücken tut mir weh.
        - Mein Rücken tut weh.
        - Mein Rücken tut mir weh.
        - Ich habe Rückenschmerzen.
    known_wrong:
      - answer: Ich tue Rücken weh.
        feedback_vi: "Chỗ đau là chủ ngữ, người đau ở Dativ: Mir tut der Rücken weh."
        error_tag: case_dat_akk
      - answer: Mich tut der Rücken weh.
        feedback_vi: "wehtun cần Dativ: mir, không phải mich."
        error_tag: case_dat_akk
      - answer: Mir tut die Rücken weh.
        feedback_vi: "Rücken là giống đực: der Rücken."
        error_tag: article
      - answer: Mir tut Rücken weh.
        feedback_vi: "Thiếu mạo từ: der Rücken."
