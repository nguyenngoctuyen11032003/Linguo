title:
  vi: Cơ thể – sollen, đau ở đâu (Mir tut der Kopf weh.)
objectives:
  - vi: Gọi tên các bộ phận cơ thể kèm mạo từ và số nhiều (der Kopf, die Hand, die Füße…).
  - vi: Nói mình đau ở đâu và hỏi người khác (Mir tut der Kopf weh. Was tut dir weh?).
  - vi: Thuật lại lời bác sĩ hay người khác dặn bằng sollen (Der Arzt sagt, ich soll im Bett bleiben.).
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
