      vi: "Với người lạ, lớn tuổi dùng Sie; trong khuôn wehtun người đau ở Dativ, nên Sie → Ihnen. dir là cách nói với bạn bè; Sie (Nominativ/Akkusativ) sai cách; \"Was tun Sie weh?\" lại biến ông ấy thành người gây đau."
    display_answer: Was tut Ihnen weh?

