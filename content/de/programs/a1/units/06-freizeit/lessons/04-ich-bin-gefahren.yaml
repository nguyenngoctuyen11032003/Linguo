        - { id: y-in, text: in }
        - { id: y-sommer, text: Sommer }
        - { id: y-zwei, text: zwei }
    answer:
      orders:
        - [y-im, y-sommer, y-sind, y-wir, y-zwei, y-wochen, y-in, y-hamburg, y-geblieben]
        - [y-im, y-sommer, y-sind, y-wir, y-in, y-hamburg, y-zwei, y-wochen, y-geblieben]
