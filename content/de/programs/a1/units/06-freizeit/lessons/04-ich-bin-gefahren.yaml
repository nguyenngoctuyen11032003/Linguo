body:
  - type: objective
    text:
      vi: "Sau bài này, bạn kể được một chuyến đi ngắn và thời tiết hôm đó, ví dụ: \"Am Wochenende war ich in Hamburg. Wir sind drei Tage geblieben. Leider hat es viel geregnet.\""
  - type: explain
    text:
      vi: "Một nhóm động từ dùng sein thay cho haben ở Perfekt: động từ chỉ di chuyển từ chỗ này sang chỗ khác (fahren, fliegen, gehen, kommen) và động từ chỉ đổi trạng thái (aufstehen). Ngoài ra bleiben (ở lại) và chính sein cũng dùng sein: ich bin geblieben, ich bin gewesen."
  - type: explain
    text:
      vi: "Cấu trúc vẫn là khung câu: sein chia ở vị trí 2, Partizip ở cuối câu – Wir sind gestern Fahrrad gefahren. Các Partizip cần nhớ: fahren → gefahren, fliegen → geflogen, gehen → gegangen, kommen → gekommen, bleiben → geblieben, aufstehen → aufgestanden."
  - type: explain
    text:
      vi: "Với sein và haben, người Đức thường dùng dạng ngắn war và hatte thay cho Perfekt, cả khi nói: Ich war in Berlin, Ich hatte keine Zeit. war: ich war, du warst, er war, wir waren, ihr wart, sie waren; hatte: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten."
  - type: explain
    text:
      vi: "Nói thời tiết, tiếng Đức luôn cần chủ ngữ es (tiếng Việt chỉ nói \"trời mưa\"): Es regnet. Es ist kalt. Kể hôm qua: Es war kalt. Es hat geregnet – regnen không chỉ di chuyển nên dùng haben."
  - type: deep_explain
    text:
      vi: "Ở miền Nam nước Đức, Áo và Thụy Sĩ, người ta nói ich bin gesessen/gestanden/gelegen; tiếng Đức chuẩn (miền Bắc) và đề thi dùng ich habe gesessen. Nhiệt độ ở Đức tính bằng độ C: Es sind 20 Grad. Khi kể chuyến đi, nơi đến thường đi với nach (nach Berlin) – giới từ này bạn học ở unit sau; trong bài này bạn kể bằng in + nơi chốn: Ich war in Berlin. Wir sind drei Tage in Berlin geblieben."
  - type: example
    target: Am Wochenende bin ich Fahrrad gefahren. Das Wetter war sehr schön.
    target_lang: de
    translation:
      vi: Cuối tuần tôi đạp xe. Thời tiết rất đẹp.
    note:
      vi: fahren chỉ di chuyển → bin … gefahren. war là dạng quá khứ của ist.
  - type: example
    target: Wir waren drei Tage in Hamburg. Leider hat es viel geregnet.
    target_lang: de
    translation:
      vi: Chúng tôi ở Hamburg ba ngày. Tiếc là trời mưa nhiều.
    note:
      vi: wir waren = wir + sein ở quá khứ. regnen dùng haben – es hat geregnet.
  - type: example
    target: Wo warst du gestern? – Ich hatte keine Lust und bin im Bett geblieben.
    target_lang: de
    translation:
      vi: Hôm qua bạn ở đâu? – Mình chẳng có hứng nên nằm lì trên giường.
    note:
      vi: Hỏi bạn bè (du → du warst). hatte = quá khứ của haben; bleiben dùng sein – bin … geblieben.
  - type: example
    target: Wie lange sind Sie geflogen? – Zwölf Stunden.
    target_lang: de
    translation:
      vi: Anh/chị đã bay bao lâu? – Mười hai tiếng.
    note:
      vi: Hỏi lịch sự (Sie). fliegen chỉ di chuyển → sind … geflogen.
  - type: example
    target: Im Winter hatten wir viel Schnee, und es war sehr kalt.
    target_lang: de
    translation:
      vi: Mùa đông năm ấy chỗ chúng tôi có nhiều tuyết, và trời rất lạnh.
    note:
      vi: wir hatten = quá khứ của wir haben; es war = quá khứ của es ist.
  - type: common_mistake
    wrong: Wir haben Fahrrad gefahren.
    right: Wir sind Fahrrad gefahren.
    target_lang: de
    note:
      vi: fahren chỉ di chuyển nên Perfekt dùng sein – wir sind … gefahren.
  - type: common_mistake
    wrong: Ich habe in Hamburg gewesen.
    right: Ich war in Hamburg.
    target_lang: de
    note:
      vi: Perfekt của sein dùng sein (Ich bin in Hamburg gewesen), nhưng tự nhiên nhất là dùng war – Ich war in Hamburg.
  - type: common_mistake
    wrong: Gestern es ist kalt.
    right: Gestern war es kalt.
    target_lang: de
    note:
      vi: Hôm qua là quá khứ nên dùng war; gestern đứng đầu thì động từ ở vị trí 2, es đứng sau.
  - type: summary
    points:
      - vi: "Perfekt với sein: động từ di chuyển/đổi trạng thái (fahren, fliegen, gehen, kommen, aufstehen) + bleiben, sein."
      - vi: "sein (vị trí 2) + Partizip (cuối câu): Wir sind Fahrrad gefahren."
      - vi: "war: ich war, du warst, er war, wir waren, ihr wart, sie waren."
      - vi: "hatte: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten."
      - vi: "Thời tiết luôn có es: Es regnet. Es war kalt. Es hat geregnet (haben)."
      - vi: "fahren đổi a → ä: du fährst, er fährt."
