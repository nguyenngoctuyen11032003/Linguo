  - key: de:exercise:a1u06l4-tr-fahrrad
    type: translate
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a1u06-fahren
    prompt:
      source_text: Hôm qua chúng tôi (đã) đạp xe.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Gestern sind wir Fahrrad gefahren.
        - Wir sind gestern Fahrrad gefahren.
        - Gestern sind wir Rad gefahren.
        - Wir sind gestern Rad gefahren.
    known_wrong:
      - answer: Gestern haben wir Fahrrad gefahren.
        feedback_vi: fahren chỉ di chuyển → Perfekt với sein – wir sind … gefahren.
        error_tag: aux_verb
      - answer: Gestern wir sind Fahrrad gefahren.
        feedback_vi: Gestern ở vị trí 1 → sind phải ở vị trí 2 – Gestern sind wir …
        error_tag: verb_position
      - answer: Gestern sind wir gefahren Fahrrad.
        feedback_vi: Partizip gefahren đứng cuối câu – … Fahrrad gefahren.
        error_tag: word_order
      - answer: Gestern fahren wir Fahrrad.
        feedback_vi: Việc đã xảy ra hôm qua → Perfekt – sind … gefahren.
        error_tag: tense_present
    explanation:
      vi: "\"Đạp xe\" là Fahrrad fahren (hoặc Rad fahren), không có mạo từ. fahren là di chuyển nên Perfekt dùng sein: wir sind … gefahren; Partizip ở cuối câu."
    display_answer: Gestern sind wir Fahrrad gefahren.

  - key: de:exercise:a1u06l4-tr-schnee
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u06-schnee
    prompt:
      source_text: Im Januar hatten wir viel Schnee, aber es war nicht sehr kalt.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Tháng Một chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Một có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Giêng chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Một chỗ chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Một chúng tôi có nhiều tuyết, nhưng trời không quá lạnh.
        - Tháng Một có nhiều tuyết nhưng không lạnh lắm.
        - Tháng 1 chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng 1 có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Một tuyết rơi nhiều, nhưng trời không lạnh lắm.
        - Tháng Một chúng tôi đã có nhiều tuyết, nhưng trời không lạnh lắm.
        - Tháng Một ở chỗ chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tháng Một chúng tôi có nhiều tuyết, và trời rất lạnh.
        feedback_vi: aber … nicht sehr kalt là "nhưng không lạnh lắm".
        error_tag: negation_missed
    explanation:
      vi: "hatten = quá khứ của haben (có); viel Schnee = nhiều tuyết; es war nicht sehr kalt = trời không lạnh lắm. Im Januar = vào tháng Một."
    display_answer: Tháng Một chúng tôi có nhiều tuyết, nhưng trời không lạnh lắm.
