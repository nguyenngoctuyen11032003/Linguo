    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u06-regnen
    prompt:
      audio_asset_id: null
      fallback_text: Gestern war es kalt, und es hat viel geregnet.
      options:
        - { id: a8m, text: Hôm qua trời lạnh và mưa nhiều., lang: vi }
        - { id: f3q, text: Hôm nay trời lạnh và mưa nhiều., lang: vi }
        - { id: j6z, text: Hôm qua trời nóng và mưa nhiều., lang: vi }
        - { id: p1c, text: Hôm qua trời lạnh và có nhiều tuyết., lang: vi }
    answer:
      correct_option_id: a8m
    explanation:
      vi: "Gestern = hôm qua; war es kalt = trời (đã) lạnh; es hat viel geregnet = trời mưa nhiều. heiß mới là nóng, Schnee là tuyết."
    display_answer: Hôm qua trời lạnh và mưa nhiều.

  - key: de:exercise:a1u06l4-listen-geflogen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u06-fliegen
    prompt:
      audio_asset_id: null
      fallback_text: Im August sind wir nach Vietnam geflogen.
      options:
        - { id: r4e, text: Tháng Tám chúng tôi đã bay sang Việt Nam., lang: vi }
        - { id: t9k, text: Tháng Tám chúng tôi sẽ bay sang Việt Nam., lang: vi }
        - { id: y2s, text: Tháng Tám chúng tôi đã đi tàu sang Việt Nam., lang: vi }
        - { id: b5w, text: Tháng Tư chúng tôi đã bay sang Việt Nam., lang: vi }
    answer:
      correct_option_id: r4e
    explanation:
      vi: "sind … geflogen là Perfekt của fliegen (bay) – việc đã xảy ra. Im August = tháng Tám (tháng Tư là April). nach Vietnam = sang Việt Nam."
    display_answer: Tháng Tám chúng tôi đã bay sang Việt Nam.

  - key: de:exercise:a1u06l4-mcq-sind
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u06-g-perfekt-sein
    prompt:
      stem: "Chọn trợ động từ đúng: Wir ___ drei Tage in Hamburg geblieben."
      stem_lang: vi
      options:
        - { id: s3n, text: sind, lang: de }
        - { id: h8g, text: haben, lang: de }
        - { id: w2v, text: seid, lang: de }
        - { id: c7l, text: hat, lang: de }
    answer:
      correct_option_id: s3n
    explanation:
      vi: "bleiben dùng sein ở Perfekt, chia theo wir: wir sind … geblieben. haben và hat sai trợ động từ (hat còn sai ngôi); seid là sein ở ngôi ihr."
    display_answer: sind

  - key: de:exercise:a1u06l4-listen-wochenende
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u06-g-praeteritum-sein-haben
    prompt:
      audio_asset_id: null
      fallback_text: Wo warst du am Wochenende? – Ich war in Köln. Das Wetter war super.
      options:
        - { id: o6h, text: Cuối tuần bạn ở đâu? – Mình ở Köln. Thời tiết tuyệt lắm., lang: vi }
        - { id: e1y, text: Cuối tuần bạn sẽ đi đâu? – Mình sẽ đi Köln. Thời tiết sẽ đẹp., lang: vi }
        - { id: m7p, text: Cuối tuần bạn ở đâu? – Mình ở Köln. Thời tiết tệ lắm., lang: vi }
        - { id: u4r, text: Hôm qua bạn ở đâu? – Mình ở Köln. Thời tiết tuyệt lắm., lang: vi }
    answer:
      correct_option_id: o6h
    explanation:
      vi: "warst/war là quá khứ của sein – đã ở đâu, không phải \"sẽ\". am Wochenende = cuối tuần (hôm qua là gestern); super = tuyệt."
    display_answer: Cuối tuần bạn ở đâu? – Mình ở Köln. Thời tiết tuyệt lắm.

  # ---------------- recall ----------------
  - key: de:exercise:a1u06l4-fill-bin-haben
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-g-perfekt-sein
    prompt:
      template: "Am Samstag {{b1}} ich früh aufgestanden. Dann {{b2}} wir Fahrrad gefahren und {{b3}} im Park Kaffee getrunken."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 5 }
        - { id: b3, width_hint: 6 }
    answer:
      blanks:
        b1: [bin]
        b2: [sind]
        b3: [haben]
    known_wrong:
      - answer: habe
        feedback_vi: aufstehen là đổi trạng thái (từ nằm sang đứng dậy) nên dùng sein – ich bin aufgestanden.
        error_tag: aux_verb
      - answer: hat
        feedback_vi: Chọn trợ động từ theo động từ chính và chia theo chủ ngữ – ich bin, wir sind, wir haben.
        error_tag: aux_verb
      - answer: seid
        feedback_vi: seid là ngôi ihr. Chủ ngữ wir → wir sind.
        error_tag: verb_form
    explanation:
      vi: "aufstehen (đổi trạng thái) và fahren (di chuyển) dùng sein: ich bin, wir sind. trinken không chỉ di chuyển nên dùng haben: wir haben … getrunken."
    display_answer: "Am Samstag bin ich früh aufgestanden. Dann sind wir Fahrrad gefahren und haben im Park Kaffee getrunken."

  - key: de:exercise:a1u06l4-fill-war-hatte
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-g-praeteritum-sein-haben
    prompt:
      template: "Wie {{b1}} dein Wochenende? – Super! Das Wetter {{b2}} warm und sonnig, und wir {{b3}} viel Spaß."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [war]
        b2: [war]
        b3: [hatten]
    known_wrong:
      - answer: ist
        feedback_vi: Hỏi về cuối tuần đã qua nên dùng quá khứ của sein – war.
        error_tag: tense_present
      - answer: haben
        feedback_vi: Cuối tuần đã qua – dùng quá khứ của haben – wir hatten.
        error_tag: tense_present
      - answer: hattet
        feedback_vi: hattet là ngôi ihr. Chủ ngữ wir → wir hatten.
        error_tag: verb_form
      - answer: waren
        feedback_vi: dein Wochenende, das Wetter là số ít → war (waren dùng cho wir/sie).
        error_tag: verb_form
    explanation:
      vi: "Kể chuyện đã qua với sein và haben, người Đức dùng war/hatte. dein Wochenende và das Wetter là ngôi 3 số ít → war; wir → hatten."
    display_answer: "Wie war dein Wochenende? – Super! Das Wetter war warm und sonnig, und wir hatten viel Spaß."

  - key: de:exercise:a1u06l4-tr-war-kalt
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-kalt
    prompt:
      source_text: Hôm qua trời rất lạnh.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Gestern war es sehr kalt.
        - Es war gestern sehr kalt.
        - Gestern ist es sehr kalt gewesen.
        - Es ist gestern sehr kalt gewesen.
    known_wrong:
      - answer: Gestern es war sehr kalt.
        feedback_vi: Gestern ở vị trí 1 thì động từ war phải ở vị trí 2 – Gestern war es …
        error_tag: verb_position
      - answer: Gestern ist es sehr kalt.
        feedback_vi: Hôm qua là quá khứ → war (ist là hiện tại).
        error_tag: tense_present
      - answer: Gestern war sehr kalt.
        feedback_vi: Thời tiết luôn cần chủ ngữ es – Gestern war es sehr kalt.
        error_tag: missing_es
      - answer: Gestern hat es sehr kalt gewesen.
        feedback_vi: sein dùng sein ở Perfekt – es ist … gewesen (hoặc ngắn gọn – es war).
        error_tag: aux_verb
    explanation:
      vi: "Tả thời tiết cần chủ ngữ es; hôm qua là quá khứ nên dùng war (tự nhiên nhất) hoặc ist … gewesen. Gestern đầu câu → war ở vị trí 2."
    display_answer: Gestern war es sehr kalt.

