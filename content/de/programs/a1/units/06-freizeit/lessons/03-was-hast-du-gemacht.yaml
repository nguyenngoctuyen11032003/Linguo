  - key: de:exercise:a1u06l3-tr-getroffen
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u06-g-partizip-ii
    prompt:
      source_text: Am Samstag habe ich eingekauft, und am Abend habe ich Freunde getroffen.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Thứ Bảy tôi đi mua sắm, và buổi tối tôi gặp bạn bè.
        - Thứ Bảy tôi đã đi mua sắm, và buổi tối tôi đã gặp bạn bè.
        - Thứ Bảy tôi đi mua sắm, buổi tối tôi gặp bạn bè.
        - Thứ Bảy tôi đi mua đồ, và buổi tối tôi gặp bạn bè.
        - Thứ Bảy tôi đi chợ, và buổi tối tôi gặp bạn bè.
        - Hôm thứ Bảy tôi đi mua sắm, và buổi tối tôi gặp bạn bè.
        - Thứ Bảy tôi đi mua sắm, còn buổi tối tôi gặp bạn bè.
        - Thứ Bảy tôi đi mua sắm và tối thì gặp bạn bè.
        - Thứ Bảy mình đi mua sắm, và buổi tối mình gặp bạn bè.
        - Thứ Bảy tôi đi mua sắm, và buổi tối tôi gặp mấy người bạn.
        - Thứ Bảy tôi đi mua sắm, và buổi tối tôi gặp các bạn.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Thứ Bảy tôi sẽ đi mua sắm, và buổi tối tôi sẽ gặp bạn bè.
        feedback_vi: habe … eingekauft, habe … getroffen là Perfekt – việc đã xảy ra, không phải "sẽ".
        error_tag: tense_meaning
    explanation:
      vi: "eingekauft là Partizip của einkaufen (mua sắm), getroffen là của treffen (gặp) – động từ mạnh, đổi e → o. Tiếng Việt không bắt buộc thêm \"đã\" khi đã có mốc thời gian."
    display_answer: Thứ Bảy tôi đi mua sắm, và buổi tối tôi gặp bạn bè.

  - key: de:exercise:a1u06l3-mcq-spass
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a1u06-spass-machen
    prompt:
      stem: "Bạn muốn kể: \"Chuyến đi chơi hôm qua rất vui.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: w5f, text: Der Ausflug hat gestern viel Spaß gemacht., lang: de }
        - { id: k1j, text: Ich habe gestern viel Spaß gemacht., lang: de }
        - { id: b8o, text: Der Ausflug ist gestern viel Spaß gemacht., lang: de }
        - { id: d4a, text: Der Ausflug hat gestern viel Spaß machen., lang: de }
    answer:
      correct_option_id: w5f
    explanation:
      vi: "Chủ ngữ của Spaß machen là hoạt động (der Ausflug), trợ động từ là haben và Partizip gemacht ở cuối. \"Ich habe Spaß gemacht\" lại có nghĩa \"tôi đã nói đùa\"; ist … gemacht sai trợ động từ; machen là nguyên thể, không phải Partizip."
    display_answer: Der Ausflug hat gestern viel Spaß gemacht.
