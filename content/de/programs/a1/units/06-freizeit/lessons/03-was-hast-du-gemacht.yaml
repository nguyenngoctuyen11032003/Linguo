level: a1
title:
  vi: Bạn đã làm gì? – Perfekt với haben (Was hast du gemacht?)
objectives:
  - vi: Kể ngắn về hôm qua và cuối tuần trước bằng Perfekt với haben.
  - vi: Tạo Partizip II của động từ thường (gemacht), động từ mạnh (gesehen) và động từ tách (eingekauft).
  - vi: Hỏi bạn bè đã làm gì và nói hoạt động đó vui hay chán.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u06-hast-du-zeit]
