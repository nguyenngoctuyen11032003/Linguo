    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-schwimmen
    prompt:
      source_text: Tôi thích đọc sách, nhưng tôi thích bơi hơn.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich lese gern, aber ich schwimme lieber.
        - Ich lese gerne, aber ich schwimme lieber.
        - Ich lese gern Bücher, aber ich schwimme lieber.
        - Ich lese gerne Bücher, aber ich schwimme lieber.
        - Ich lese gern, aber lieber schwimme ich.
