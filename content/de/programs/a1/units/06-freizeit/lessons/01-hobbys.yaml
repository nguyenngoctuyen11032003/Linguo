body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được lúc rảnh mình thích làm gì, thích gì hơn, thích gì nhất và có hay làm không – ví dụ \"Ich lese gern, aber am liebsten tanze ich.\""
  - type: explain
    text:
      vi: "Bạn đã biết gern: đặt sau động từ chia để nói \"thích làm\" – Ich schwimme gern. Muốn nói \"thích hơn\", tiếng Đức không ghép mehr + gern như tiếng Việt \"thích hơn\", mà đổi gern thành lieber. \"Thích nhất\" là am liebsten."
  - type: explain
    text:
      vi: "lieber và am liebsten đứng ở chỗ của gern, thường ngay sau động từ chia: Ich lese lieber. am liebsten hay được đưa lên đầu câu để nhấn mạnh; khi đó động từ vẫn đứng thứ hai và chủ ngữ đứng sau: Am liebsten tanze ich."
  - type: explain
    text:
      vi: "Với hành động, bạn dùng động từ + gern: Ich schwimme gern. Với danh từ, bạn dùng mögen: Ich mag Musik. Câu \"Ich mag schwimmen\" nghe không tự nhiên, người Đức nói Ich schwimme gern."
  - type: explain
    text:
      vi: "oft (thường) và manchmal (thỉnh thoảng) cho biết bạn làm việc đó có hay không. oft thường đứng sau động từ (Ich spiele oft Fußball); manchmal hay đứng đầu câu – nhớ để động từ ở vị trí 2: Manchmal singe ich."
  - type: deep_explain
    text:
      vi: "Ở Đức rất nhiều người chơi thể thao, hát hợp xướng hay chơi nhạc trong câu lạc bộ (der Verein), từ bóng đá đến bơi lội. Muốn hỏi sở thích, bạn nói Was machst du gern in der Freizeit? hoặc Was ist dein Hobby? (với người lạ: Was machen Sie gern?). Chơi thể thao và nhạc cụ không có mạo từ: Ich spiele Fußball, ich spiele Gitarre – khác tiếng Anh \"play the guitar\". Bạn viết gern hay gerne đều đúng; gerne thường gặp hơn khi nói."
  - type: example
    target: Ich lese gern, aber ich tanze lieber.
    target_lang: de
    translation:
      vi: Tôi thích đọc sách, nhưng tôi thích nhảy hơn.
    note:
      vi: lieber thay cho "gern hơn" và đứng đúng chỗ của gern, ngay sau động từ tanze.
  - type: example
    target: Was machst du am liebsten in der Freizeit? – Am liebsten spiele ich Fußball.
    target_lang: de
    translation:
      vi: Lúc rảnh bạn thích làm gì nhất? – Mình thích đá bóng nhất.
    note:
      vi: Dùng du khi hỏi bạn bè. Trong câu trả lời, am liebsten đứng đầu nên động từ spiele ở vị trí 2, chủ ngữ ich đứng sau.
  - type: example
    target: Spielen Sie gern Gitarre? – Ja, aber ich singe lieber.
    target_lang: de
    translation:
      vi: Anh/chị có thích chơi ghi-ta không? – Có, nhưng tôi thích hát hơn.
    note:
      vi: Sie – hỏi lịch sự người lớn tuổi hoặc người mới quen. Gitarre spielen không có mạo từ.
  - type: example
    target: Im Sommer schwimme ich oft. Manchmal jogge ich auch im Park.
    target_lang: de
    translation:
      vi: Mùa hè tôi hay đi bơi. Thỉnh thoảng tôi cũng chạy bộ trong công viên.
    note:
      vi: Im Sommer và Manchmal đứng đầu câu nên động từ (schwimme, jogge) vẫn ở vị trí 2.
  - type: common_mistake
    wrong: Ich lese mehr gern.
    right: Ich lese lieber.
    target_lang: de
    note:
      vi: Dạng so sánh của gern là lieber – không ghép mehr với gern như "thích hơn" trong tiếng Việt.
  - type: common_mistake
    wrong: Am liebste schwimme ich.
    right: Am liebsten schwimme ich.
    target_lang: de
    note:
      vi: am liebsten luôn có -n ở cuối.
  - type: common_mistake
    wrong: Am liebsten ich schwimme.
    right: Am liebsten schwimme ich.
    target_lang: de
    note:
      vi: Khi am liebsten đứng đầu câu, động từ vẫn phải ở vị trí 2, chủ ngữ đứng sau động từ.
  - type: summary
    points:
      - vi: "gern (thích) → lieber (thích hơn) → am liebsten (thích nhất); không nói mehr gern."
      - vi: lieber / am liebsten đứng ở chỗ của gern, thường ngay sau động từ chia.
      - vi: "am liebsten đứng đầu câu → động từ ở vị trí 2: Am liebsten tanze ich."
      - vi: "Hành động: động từ + gern (Ich schwimme gern); danh từ: mögen (Ich mag Musik)."
      - vi: "oft = thường, manchmal = thỉnh thoảng; lesen đổi nguyên âm: du liest, er liest."
      - vi: "Thể thao, nhạc cụ không có mạo từ: Fußball spielen, Gitarre spielen."
exercises:
