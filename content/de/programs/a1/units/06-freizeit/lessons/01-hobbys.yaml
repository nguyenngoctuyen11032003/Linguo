    display_answer: Am liebsten singe ich.

  # ---------------- recall ----------------
  - key: de:exercise:a1u06l1-fill-lieber-liebsten
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-g-gern-lieber-am-liebsten
    prompt:
      template: "Spielst du gern Tennis? – Ja, aber ich spiele {{b1}} Fußball. Und am {{b2}} schwimme ich."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 9 }
    answer:
      blanks:
        b1: [lieber]
        b2: [liebsten]
    known_wrong:
      - answer: mehr
        feedback_vi: Không dùng mehr với gern – "thích hơn" là lieber.
        error_tag: comparison_form
      - answer: liebste
        feedback_vi: Thiếu -n – luôn nói am liebsten.
        error_tag: comparison_form
      - answer: gern
        feedback_vi: "\"Ja, aber …\" cho thấy bạn thích môn khác hơn, nên cần lieber; sau am phải là liebsten."
        error_tag: comparison_form
    explanation:
      vi: "\"Ja, aber …\" nghĩa là có thích, nhưng thích đá bóng hơn → lieber. Sau am là dạng \"nhất\" → am liebsten; liebsten đứng đầu câu nên động từ schwimme ở vị trí 2."
    display_answer: "Spielst du gern Tennis? – Ja, aber ich spiele lieber Fußball. Und am liebsten schwimme ich."

  - key: de:exercise:a1u06l1-fill-liest-spielt
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-lesen
    prompt:
      template: "Meine Schwester {{b1}} oft Bücher (lesen), und mein Bruder {{b2}} gern Gitarre (spielen)."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 7 }
    answer:
      blanks:
        b1: [liest]
        b2: [spielt]
    known_wrong:
      - answer: lest
        feedback_vi: lesen đổi e → ie ở ngôi er/sie – meine Schwester liest.
        error_tag: verb_form
      - answer: lesst
        feedback_vi: lesen đổi e → ie ở ngôi er/sie, và gốc tận cùng -s chỉ thêm -t – sie liest.
        error_tag: verb_form
      - answer: spielst
        feedback_vi: mein Bruder là ngôi er, đuôi -t – er spielt (-st là của du).
        error_tag: verb_form
    explanation:
      vi: "Chủ ngữ là ngôi 3 số ít (sie, er) nên đuôi -t. lesen đổi nguyên âm e → ie và gốc đã tận cùng -s, nên chỉ thêm -t: liest; spielen chia đều: spielt."
    display_answer: "Meine Schwester liest oft Bücher, und mein Bruder spielt gern Gitarre."

  - key: de:exercise:a1u06l1-tr-schwimme-lieber
    type: translate
