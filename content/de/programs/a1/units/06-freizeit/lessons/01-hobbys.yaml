title:
  vi: Sở thích – gern, lieber, am liebsten (Hobbys)
objectives:
  - vi: Nói mình thích làm gì lúc rảnh và hỏi người khác bằng gern.
  - vi: So sánh điều mình thích hơn (lieber) và thích nhất (am liebsten).
  - vi: Nói mình có hay làm việc đó không bằng oft và manchmal.
estimated_minutes: 14
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u05-wiederholung]
