  - key: de:exercise:a1u06l1-mcq-lieber
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u06-g-gern-lieber-am-liebsten
    prompt:
      stem: "Chọn từ đúng (nghĩa: thích hơn): Ich trinke gern Tee, aber ich trinke ___ Kaffee."
      stem_lang: vi
      options:
        - { id: k4p, text: lieber, lang: de }
        - { id: w8t, text: mehr gern, lang: de }
        - { id: r2m, text: am liebsten, lang: de }
        - { id: h6z, text: gern, lang: de }
    answer:
