        - { id: n3c, text: Cuối tuần tôi hay đi bộ đường dài., lang: vi }
        - { id: d7v, text: Cuối tuần tôi thỉnh thoảng đi bộ đường dài., lang: vi }
        - { id: q5j, text: Cuối tuần tôi hay đi bơi., lang: vi }
