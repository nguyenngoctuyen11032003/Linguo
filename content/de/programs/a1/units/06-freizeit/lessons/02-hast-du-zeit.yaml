    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u06-g-man
    prompt:
      stem: "Biển ở công viên ghi: \"Hier darf man nicht Fußball spielen.\" Nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: x7a, text: Ở đây không được chơi bóng đá., lang: vi }
        - { id: c2h, text: Ở đây không cần chơi bóng đá., lang: vi }
        - { id: t9d, text: Ở đây người ta hay chơi bóng đá., lang: vi }
        - { id: k5y, text: Ở đây được phép chơi bóng đá., lang: vi }
    answer:
      correct_option_id: x7a
    explanation:
      vi: "man = người ta (ai cũng vậy); darf … nicht = không được, cấm. \"Không cần\" là nicht müssen; câu có nicht nên không phải \"được phép\"."
    display_answer: Ở đây không được chơi bóng đá.

  # ---------------- recall ----------------
  - key: de:exercise:a1u06l2-fill-darf
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-g-duerfen
    prompt:
      template: "{{b1}} ich hier parken? – Nein, hier {{b2}} man nicht parken. Aber da {{b3}} Sie parken."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 5 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [Darf]
        b2: [darf]
        b3: [dürfen]
    known_wrong:
      - answer: darft
        feedback_vi: Ngôi ich và er/man của dürfen không có đuôi – ich darf, man darf.
        error_tag: verb_form
      - answer: dürft
        feedback_vi: dürft là ngôi ihr. Với ich và man là darf, với Sie là dürfen.
        error_tag: verb_form
      - answer: kann
        feedback_vi: Hỏi xin phép và nói điều bị cấm trên biển báo dùng dürfen (darf).
        error_tag: modal_choice
    explanation:
      vi: "ich và man đi với dạng không đuôi darf; Sie (lịch sự) chia như số nhiều: Sie dürfen. Động từ chính parken ở cuối câu."
    display_answer: "Darf ich hier parken? – Nein, hier darf man nicht parken. Aber da dürfen Sie parken."

  - key: de:exercise:a1u06l2-fill-einladen-treffen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-einladen
    prompt:
      template: "Am Samstag mache ich eine Party. Ich {{b1}} dich {{b2}}! – Danke! Am Nachmittag {{b3}} ich Anna, aber am Abend habe ich Zeit."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [lade]
        b2: [ein]
        b3: [treffe]
    known_wrong:
      - answer: einlade
        feedback_vi: einladen là động từ tách – ich lade … ein (ein đứng cuối câu).
        error_tag: separable_prefix
      - answer: lädt
        feedback_vi: Chủ ngữ là ich nên không đổi a → ä – ich lade (du lädst, er lädt).
        error_tag: verb_form
      - answer: triffe
        feedback_vi: treffen chỉ đổi e → i ở du và er – ich treffe.
        error_tag: verb_form
    explanation:
      vi: "einladen tách thành lade (vị trí 2) … ein (cuối câu). Với ich không đổi nguyên âm: ich lade, ich treffe (chỉ du lädst, er trifft mới đổi)."
    display_answer: "Am Samstag mache ich eine Party. Ich lade dich ein! – Danke! Am Nachmittag treffe ich Anna, aber am Abend habe ich Zeit."

  - key: de:exercise:a1u06l2-tr-zusammen-kino
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-ins-kino-gehen
    prompt:
      source_text: Mình cùng đi xem phim nhé? (rủ bạn thân)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Wollen wir zusammen ins Kino gehen?
        - Gehen wir zusammen ins Kino?
        - Wollen wir zusammen ins Kino?
        - Wollen wir ins Kino gehen?
        - Gehen wir ins Kino?
        - Sollen wir zusammen ins Kino gehen?
        - Wollen wir gemeinsam ins Kino gehen?
        - Gehen wir gemeinsam ins Kino?
    known_wrong:
      - answer: Wollen wir zusammen gehen ins Kino?
        feedback_vi: Với wollen, động từ nguyên thể gehen đứng cuối câu – Wollen wir zusammen ins Kino gehen?
        error_tag: verb_position
      - answer: Wollen wir zusammen in Kino gehen?
        feedback_vi: Cụm cố định là ins Kino gehen (ins = in das).
        error_tag: preposition
      - answer: Wollen wir zusammen ins Kino gehe?
        feedback_vi: Sau wollen, động từ chính ở dạng nguyên thể – gehen.
        error_tag: verb_form
    explanation:
      vi: "Rủ rê dùng câu hỏi bắt đầu bằng động từ: Wollen wir … gehen? (nguyên thể cuối câu) hoặc Gehen wir …? \"Cùng nhau\" là zusammen; \"đi xem phim\" là cụm ins Kino gehen."
    display_answer: Wollen wir zusammen ins Kino gehen?

