body:
  - type: objective
    text:
      vi: "Sau bài này, bạn rủ được bạn bè đi xem phim, nhận lời hoặc từ chối khéo rồi hẹn lúc khác, và hiểu những câu như \"Hier darf man nicht parken.\""
  - type: explain
    text:
      vi: "dürfen nghĩa là \"được phép\". Giống können và müssen, ngôi ich và er/sie/es không có đuôi, số ít đổi ü → a: ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie/Sie dürfen. Động từ chính ở dạng nguyên thể và đứng cuối câu: Darf ich hier parken?"
  - type: explain
    text:
      vi: "nicht dürfen là \"không được, cấm\": Hier darf man nicht schwimmen. Đừng nhầm với nicht müssen, chỉ là \"không cần\": Du musst nicht kommen = bạn không cần đến."
  - type: explain
    text:
      vi: "man nghĩa là \"người ta\", \"ai cũng\" – giống câu tiếng Việt không có chủ ngữ rõ (\"Ở đây không được đỗ xe\"). Tiếng Đức vẫn cần chủ ngữ man, và động từ chia như với er/sie/es: man darf, man spielt, man muss. man viết thường, khác der Mann (người đàn ông)."
  - type: explain
    text:
      vi: "Để rủ bạn, bạn có thể nói: Hast du Lust? – Wollen wir zusammen ins Kino gehen? – Gehen wir zusammen ins Kino? Nhận lời bằng Ja, gern! hoặc Gute Idee!"
  - type: explain
    text:
      vi: "Khi từ chối, chỉ nói \"Nein.\" nghe rất cộc. Hãy nói tiếc, nêu lý do rồi đề xuất lúc khác: Schade, ich kann leider nicht. Ich muss arbeiten. Vielleicht am Sonntag?"
  - type: deep_explain
    text:
      vi: "Ở Đức, bạn bè thường hẹn trước vài ngày và đến đúng giờ; trễ hơn 5–10 phút thì nên nhắn tin báo. Lust haben thân mật hơn möchten, hợp với bạn bè. ins Kino gehen học như cụm cố định (ins = in das); quy tắc này bạn học ở A2. Thang tần suất: immer (luôn luôn) – oft – manchmal – nie (không bao giờ). Nếu ai hỏi phủ định \"Hast du keine Lust?\" mà bạn muốn đi, hãy trả lời Doch!, không phải Ja."
  - type: example
    target: Hast du am Samstag Zeit? Wollen wir zusammen ins Kino gehen?
    target_lang: de
    translation:
      vi: Thứ Bảy bạn rảnh không? Mình cùng đi xem phim nhé?
    note:
      vi: Dùng du khi rủ bạn bè. wollen ở vị trí 2, gehen ở cuối câu (khung câu với động từ khiếm khuyết).
  - type: example
    target: Schade, ich kann leider nicht. Ich muss arbeiten. Vielleicht am Sonntag?
    target_lang: de
    translation:
      vi: Tiếc quá, mình không đi được. Mình phải làm việc. Hay là Chủ nhật nhé?
    note:
      vi: Từ chối lịch sự = tiếc (schade, leider) + lý do + đề xuất lúc khác (vielleicht …?).
  - type: example
    target: Entschuldigung, darf man hier parken? – Nein, hier darf man nicht parken.
    target_lang: de
    translation:
      vi: Xin lỗi, ở đây có được đỗ xe không? – Không, ở đây không được đỗ xe.
    note:
      vi: Hỏi người lạ; dùng man nên không cần chọn du hay Sie. man + darf (ngôi 3 số ít); nicht dürfen = cấm.
  - type: example
    target: Ich mache am Freitag eine Party. Ich lade dich ein! – Gute Idee! Ich komme gern.
    target_lang: de
    translation:
      vi: Thứ Sáu mình tổ chức tiệc. Mình mời bạn nhé! – Ý hay đấy! Mình sẽ đến.
    note:
      vi: Nói với bạn bè (du → dich). einladen là động từ tách – ich lade dich ein; tiền tố ein đứng cuối câu.
  - type: example
    target: Hast du keine Lust? – Doch! Ich gehe immer gern ins Kino.
    target_lang: de
    translation:
      vi: Bạn không thích à? – Có chứ! Mình lúc nào cũng thích đi xem phim.
    note:
      vi: Câu hỏi phủ định mà muốn trả lời "có" thì dùng Doch. immer đứng sau động từ gehe, như oft.
  - type: common_mistake
    wrong: Hier dürfen man nicht parken.
    right: Hier darf man nicht parken.
    target_lang: de
    note:
      vi: man đi với động từ ngôi 3 số ít – man darf, man muss (không nói man dürfen, man müssen).
  - type: common_mistake
    wrong: Hast du am Samstag Lust? – Nein.
    right: Hast du am Samstag Lust? – Schade, ich habe leider keine Zeit. Vielleicht am Sonntag?
    target_lang: de
    note:
      vi: Chỉ trả lời "Nein." nghe rất cộc. Hãy nói tiếc, nêu lý do và đề xuất lúc khác.
  - type: common_mistake
    wrong: Ich einlade dich.
    right: Ich lade dich ein.
    target_lang: de
    note:
      vi: einladen là động từ tách – phần ein đứng cuối câu.
  - type: summary
    points:
      - vi: "dürfen: ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie/Sie dürfen; nguyên thể cuối câu."
      - vi: nicht dürfen = cấm; nicht müssen = không cần.
      - vi: "man (người ta) + động từ ngôi 3 số ít: man darf, man spielt."
      - vi: "Rủ: Hast du Lust? / Wollen wir zusammen ins Kino gehen? Nhận lời: Ja, gern! / Gute Idee!"
      - vi: "Từ chối: Schade, ich kann leider nicht. + lý do + Vielleicht am Sonntag?"
      - vi: "einladen (du lädst ein), treffen (du triffst); immer – oft – manchmal – nie."
