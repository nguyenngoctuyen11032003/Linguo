  # ---------------- recognition ----------------
  - key: de:exercise:a1u06l2-mcq-darf
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u06-g-duerfen
    prompt:
      stem: "Chọn dạng đúng: ___ ich hier parken?"
      stem_lang: vi
      options:
        - { id: p2v, text: Darf, lang: de }
        - { id: f8n, text: Darfst, lang: de }
        - { id: j4k, text: Dürfen, lang: de }
        - { id: z6q, text: Dürft, lang: de }
    answer:
      correct_option_id: p2v
    explanation:
      vi: "Chủ ngữ là ich, và dürfen ở ngôi ich không có đuôi, đổi ü → a: ich darf. darfst dùng cho du, dürfen cho wir/sie/Sie, dürft cho ihr."
    display_answer: Darf

  - key: de:exercise:a1u06l2-listen-keine-zeit
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u06-schade
    prompt:
      audio_asset_id: null
      fallback_text: Schade, am Samstag habe ich keine Zeit. Ich muss arbeiten.
      options:
        - { id: v5r, text: "Tiếc quá, thứ Bảy mình không rảnh. Mình phải làm việc.", lang: vi }
        - { id: g1e, text: "Tiếc quá, Chủ nhật mình không rảnh. Mình phải làm việc.", lang: vi }
        - { id: b6s, text: Thứ Bảy mình rảnh. Mình không phải làm việc., lang: vi }
        - { id: l3w, text: "Tiếc quá, thứ Bảy mình không rảnh. Mình muốn làm việc.", lang: vi }
    answer:
      correct_option_id: v5r
    explanation:
      vi: "Schade = tiếc quá; am Samstag = thứ Bảy; keine Zeit = không có thời gian, không rảnh; ich muss arbeiten = phải làm việc (müssen), không phải \"muốn\" (wollen)."
    display_answer: Tiếc quá, thứ Bảy mình không rảnh. Mình phải làm việc.

  - key: de:exercise:a1u06l2-mcq-schild
