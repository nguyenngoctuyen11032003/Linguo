  - key: de:exercise:a1u06l2-mcq-absage
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u06-vielleicht
    prompt:
      stem: "Bạn của bạn rủ: \"Hast du am Freitag Lust? Wir gehen ins Kino.\" Bạn bận và muốn từ chối lịch sự. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: r8b, text: "Schade, am Freitag kann ich leider nicht. Ich muss arbeiten. Vielleicht am Samstag?", lang: de }
        - { id: m3s, text: Nein., lang: de }
        - { id: f6u, text: "Nein, ich habe keine Lust. Tschüss!", lang: de }
        - { id: y1i, text: "Schade, am Freitag ich kann leider nicht. Ich muss arbeiten.", lang: de }
        - { id: h4c, text: "Gute Idee! Ich komme gern.", lang: de }
    answer:
      correct_option_id: r8b
    explanation:
      vi: "Câu đúng có đủ ba phần: tiếc (Schade, leider), lý do (Ich muss arbeiten) và đề xuất (Vielleicht am Samstag?), lại đúng V2: am Freitag kann ich. \"Nein.\" và \"keine Lust. Tschüss!\" quá cộc; câu có \"am Freitag ich kann\" sai vị trí động từ; Gute Idee! là nhận lời."
    display_answer: "Schade, am Freitag kann ich leider nicht. Ich muss arbeiten. Vielleicht am Samstag?"

  - key: de:exercise:a1u06l2-tr-nie-immer
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u06-nie
    prompt:
      source_text: Mein Bruder tanzt nie, aber er singt immer gern.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Anh trai tôi không bao giờ nhảy, nhưng anh ấy lúc nào cũng thích hát.
        - Anh trai tôi không bao giờ nhảy, nhưng anh ấy luôn thích hát.
        - Anh trai tôi không bao giờ nhảy, nhưng lúc nào cũng thích hát.
        - Anh trai tôi không bao giờ nhảy nhưng luôn thích hát.
        - Em trai tôi không bao giờ nhảy, nhưng nó lúc nào cũng thích hát.
        - Em trai tôi không bao giờ nhảy, nhưng em ấy luôn thích hát.
        - Em trai tôi không bao giờ nhảy, nhưng lúc nào cũng thích hát.
        - Anh tôi không bao giờ nhảy, nhưng anh ấy lúc nào cũng thích hát.
        - Anh trai tôi chẳng bao giờ nhảy, nhưng anh ấy lúc nào cũng thích hát.
        - Anh trai tôi không bao giờ khiêu vũ, nhưng anh ấy luôn thích hát.
        - Anh trai mình không bao giờ nhảy, nhưng anh ấy lúc nào cũng thích hát.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Anh trai tôi thỉnh thoảng nhảy, nhưng anh ấy lúc nào cũng thích hát.
        feedback_vi: nie là "không bao giờ", không phải "thỉnh thoảng" (manchmal).
        error_tag: frequency_meaning
      - answer: Anh trai tôi không bao giờ nhảy, nhưng anh ấy thỉnh thoảng thích hát.
        feedback_vi: immer là "luôn luôn, lúc nào cũng".
        error_tag: frequency_meaning
    explanation:
      vi: "nie = không bao giờ, immer = luôn luôn; gern = thích. der Bruder có thể là anh trai hoặc em trai."
    display_answer: Anh trai tôi không bao giờ nhảy, nhưng anh ấy lúc nào cũng thích hát.
