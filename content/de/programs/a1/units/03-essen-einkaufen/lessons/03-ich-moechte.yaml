title:
  vi: Tôi muốn… – möchten, mögen (Ich möchte ein Stück Kuchen.)
objectives:
  - vi: Đặt mua lịch sự ở tiệm bánh, quán cà phê bằng möchte và Ich hätte gern …
  - vi: Phân biệt möchte (muốn ngay bây giờ) và mag (thích nói chung), chia đúng cả hai.
  - vi: Nối hai ý bằng und, aber, oder mà không đổi trật tự từ.
estimated_minutes: 14
