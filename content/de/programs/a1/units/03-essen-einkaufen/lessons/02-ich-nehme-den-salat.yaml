title:
  vi: Gọi món – Akkusativ (Ich nehme den Salat.)
objectives:
  - vi: Gọi món, hỏi thực đơn và xin thanh toán ở nhà hàng.
  - vi: Dùng đúng Akkusativ cho tân ngữ trực tiếp - den, einen, keinen, meinen với danh từ giống đực.
  - vi: Hỏi tân ngữ bằng Wen? / Was? và trả lời câu "Zusammen oder getrennt?".
estimated_minutes: 14
