title:
  vi: Ở chợ, ở siêu thị – giá và số lượng (Auf dem Markt)
objectives:
  - vi: Hỏi giá và hiểu câu trả lời - Was kostet …? / Wie viel kostet …?
  - vi: Đọc, nghe và nói số lớn (hundert, tausend) và giá tiền như 2,50 €.
  - vi: Nói số lượng khi mua - ein Kilo Tomaten, 200 Gramm Käse; phân biệt Wie viel? và Wie viele?
estimated_minutes: 14
skills: [listening, speaking, vocabulary]
prerequisites: [de:lesson:a1u03-ich-moechte]
