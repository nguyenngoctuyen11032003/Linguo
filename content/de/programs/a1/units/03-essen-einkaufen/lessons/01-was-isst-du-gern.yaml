level: a1
title:
  vi: Bạn thích ăn gì? (Was isst du gern?)
objectives:
  - vi: Nói món mình thích và không thích ăn uống bằng gern / nicht gern.
  - vi: Chia đúng các động từ đổi nguyên âm ở ngôi du và er/sie/es (essen – isst, fahren – fährt, lesen – liest).
  - vi: Gọi tên các thực phẩm và đồ uống cơ bản kèm mạo từ.
