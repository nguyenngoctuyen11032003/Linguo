    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u03-kaufen
    prompt:
      instruction: "Sắp xếp thành câu hỏi tiếng Đức (nhắn cho bạn cùng nhà): \"Cậu mua sữa và bánh mì nhé?\""
      tokens:
        - { id: k1, text: Brot }
        - { id: k2, text: und }
        - { id: k3, text: Milch }
        - { id: k4, text: du }
        - { id: k5, text: Kaufst }
        - { id: k6, text: kaufen }
    answer:
      orders:
        - [k5, k4, k3, k2, k1]
        - [k5, k4, k1, k2, k3]
    explanation:
      vi: Câu hỏi có/không - động từ chia (Kaufst, ngôi du) đứng đầu, rồi chủ ngữ du và hai món hàng nối bằng und. Kaufen là nguyên thể, không đi với du.
    display_answer: Kaufst du Milch und Brot?

  - key: de:exercise:a1u03l5-wb-lisa-kuchen
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a1u03-g-moechten
    prompt:
      instruction: "Sắp xếp thành câu tiếng Đức: \"Lisa muốn mua hai miếng bánh ngọt.\""
      tokens:
        - { id: l1, text: kaufen }
        - { id: l2, text: Stück }
        - { id: l3, text: Lisa }
        - { id: l4, text: zwei }
        - { id: l5, text: möchte }
        - { id: l6, text: Kuchen }
        - { id: l7, text: von }
    answer:
      orders:
        - [l3, l5, l4, l2, l6, l1]
        - [l4, l2, l6, l5, l3, l1]
    explanation:
      vi: Möchte ở vị trí 2, động từ nguyên thể kaufen ở cuối câu. Zwei Stück Kuchen đi liền nhau, không có von; Stück giữ nguyên sau số.
    display_answer: Lisa möchte zwei Stück Kuchen kaufen.

  - key: de:exercise:a1u03l5-tr-fisch-fleisch-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u03-g-moegen
    prompt:
      source_text: Ich esse gern Fisch, aber ich mag kein Fleisch.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Tôi thích ăn cá, nhưng tôi không thích thịt.
        - Tôi thích ăn cá nhưng tôi không thích thịt.
        - Tôi thích ăn cá, nhưng không thích thịt.
        - Tôi thích ăn cá nhưng không thích thịt.
        - Tôi thích ăn cá, nhưng tôi không thích ăn thịt.
        - Tôi thích ăn cá nhưng không thích ăn thịt.
        - Mình thích ăn cá, nhưng mình không thích thịt.
        - Mình thích ăn cá, nhưng không thích ăn thịt.
        - Tôi thích ăn cá, còn thịt thì tôi không thích.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi thích ăn thịt, nhưng tôi không thích cá.
        feedback_vi: Ngược nghĩa - gern đi với Fisch (cá), kein … mögen đi với Fleisch (thịt).
        error_tag: meaning
    explanation:
      vi: Esse gern Fisch = thích ăn cá; mag kein Fleisch = không thích thịt (kein phủ định danh từ không có mạo từ). Aber = nhưng.
    display_answer: Tôi thích ăn cá, nhưng tôi không thích thịt.
