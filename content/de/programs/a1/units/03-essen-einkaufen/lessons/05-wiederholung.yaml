    explanation:
      vi: Die Suppe = súp, ein Glas Wasser = một cốc nước, als Nachtisch ein Stück Kuchen = tráng miệng một miếng bánh ngọt.
    display_answer: "Khách gọi súp, một cốc nước và một miếng bánh ngọt tráng miệng."

  # ---------------- recall: Schreiben ----------------
  - key: de:exercise:a1u03l5-fill-sms-salat-wein
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u03-g-akkusativ
    prompt:
      template: "Hallo Tom, ich koche heute Abend. Kaufst du bitte {{b1}} Salat und {{b2}} Flasche Wein? Danke! Lisa"
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [einen]
        b2: [eine]
    known_wrong:
      - answer: ein
        feedback_vi: Salat là giống đực và là tân ngữ của kaufen nên ein → einen; Flasche là giống cái nên dùng eine.
        error_tag: case_dat_akk
    explanation:
      vi: Salat và Flasche đều là thứ được mua (Akkusativ). Der Salat (giống đực) → einen Salat; die Flasche (giống cái) giữ nguyên → eine Flasche.
    display_answer: "Hallo Tom, ich koche heute Abend. Kaufst du bitte einen Salat und eine Flasche Wein? Danke! Lisa"

  - key: de:exercise:a1u03l5-tr-tomaten-wasser
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u03-g-mengen
    prompt:
      source_text: Tôi muốn mua một cân cà chua và hai chai nước.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich möchte ein Kilo Tomaten und zwei Flaschen Wasser kaufen.
        - Ich möchte gern ein Kilo Tomaten und zwei Flaschen Wasser kaufen.
        - Ich möchte ein Kilo Tomaten und zwei Flaschen Wasser.
        - Ich hätte gern ein Kilo Tomaten und zwei Flaschen Wasser.
        - Ich möchte zwei Flaschen Wasser und ein Kilo Tomaten kaufen.
        - Ich möchte gerne ein Kilo Tomaten und zwei Flaschen Wasser kaufen.
        - Ich hätte gerne ein Kilo Tomaten und zwei Flaschen Wasser.
    known_wrong:
      - answer: Ich möchte kaufen ein Kilo Tomaten und zwei Flaschen Wasser.
        feedback_vi: Động từ nguyên thể kaufen phải đứng cuối câu.
        error_tag: verb_position
      - answer: Ich möchte ein Kilo Tomaten und zwei Flasche Wasser kaufen.
        feedback_vi: Flasche là giống cái nên sau số dùng số nhiều - zwei Flaschen.
        error_tag: plural_form
      - answer: Ich möchte ein Kilo von Tomaten und zwei Flaschen Wasser kaufen.
        feedback_vi: Không dùng von - ein Kilo Tomaten.
        error_tag: preposition
    explanation:
      vi: Möchte ở vị trí 2, kaufen ở cuối câu. Ein Kilo Tomaten (Kilo không đổi), zwei Flaschen Wasser (Flasche giống cái nên có số nhiều), không có von.
    display_answer: Ich möchte ein Kilo Tomaten und zwei Flaschen Wasser kaufen.

  # ---------------- application ----------------
