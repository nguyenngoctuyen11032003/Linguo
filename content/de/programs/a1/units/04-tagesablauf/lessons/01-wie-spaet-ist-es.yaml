        feedback_vi: halb sieben là 6:30. 7:30 là nửa đường tới 8 giờ - halb acht.
        error_tag: halb_hour
      - answer: Ist halb acht.
        feedback_vi: Thiếu chủ ngữ es - Es ist halb acht.
        error_tag: missing_subject
