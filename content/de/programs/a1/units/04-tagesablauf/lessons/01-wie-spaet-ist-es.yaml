body:
  - type: objective
    text:
      vi: "Sau bài này, bạn hỏi được \"Mấy giờ rồi?\", trả lời được \"Hai giờ rưỡi\", \"Tám giờ kém mười lăm\" và nói được lịch trong ngày như \"Tôi làm việc từ 9 giờ đến 17 giờ\" bằng tiếng Đức."
  - type: explain
    text:
      vi: "Hỏi giờ có hai cách ngang nhau: Wie spät ist es? và Wie viel Uhr ist es? Trả lời luôn bắt đầu bằng Es ist …: Es ist drei Uhr. Tiếng Việt nói \"Ba giờ rồi\" không cần chủ ngữ, nhưng câu Đức bắt buộc có es."
  - type: explain
    text:
      vi: "Cách chính thức (nhà ga, đài, giờ làm việc) dùng 24 giờ: số giờ + Uhr + số phút. 7:05 = sieben Uhr fünf, 18:45 = achtzehn Uhr fünfundvierzig. Chữ Uhr đứng giữa giờ và phút, giống \"giờ\" trong \"7 giờ 5\"."
  - type: explain
    text:
      vi: "Cách thân mật (nói chuyện hằng ngày) dùng 12 giờ và không có chữ Uhr: phút + nach (quá) / vor (kém) + giờ. 3:10 = zehn nach drei, 8:40 = zwanzig vor neun; 15 phút là Viertel: Viertel nach zwei (2:15), Viertel vor drei (2:45)."
  - type: explain
    text:
      vi: "halb + giờ SAU = giờ trước rưỡi: halb drei = 2:30, halb acht = 7:30. Người Đức nghĩ \"đã đi được nửa đường tới 3 giờ\". Đây là chỗ người Việt nhầm nhiều nhất, vì tiếng Việt nói \"hai rưỡi\" theo giờ trước."
  - type: explain
    text:
      vi: "Nói việc xảy ra lúc mấy giờ: um + giờ (Der Kurs beginnt um acht Uhr); khoảng thời gian: von … bis … (von neun bis siebzehn Uhr). Câu hỏi là Wann …? (Khi nào?). Các buổi: am Morgen, am Vormittag, am Mittag, am Nachmittag, am Abend, nhưng in der Nacht; bạn học cứ dùng như cụm cố định, bài 4 sẽ giải thích am."
  - type: explain
    text:
      vi: "Uhr là thời điểm trên đồng hồ (um zwei Uhr = lúc 2 giờ); Stunde là độ dài một tiếng (zwei Stunden = hai tiếng). Tiếng Việt dùng chung chữ \"giờ\" cho cả hai nên dễ lẫn: \"học hai giờ\" là zwei Stunden, không phải zwei Uhr."
  - type: deep_explain
    text:
      vi: "Cách thân mật còn có fünf vor halb drei (2:25) và fünf nach halb drei (2:35): lấy mốc halb rồi cộng trừ 5 phút. Một giờ đúng nói Es ist ein Uhr hoặc Es ist eins (không nói \"eins Uhr\"). Ở Đông và Nam nước Đức, Áo, bạn có thể nghe viertel drei (= 2:15) và dreiviertel drei (= 2:45); chỉ cần nhận ra, khi nói hãy dùng Viertel nach/vor. Người Đức coi trọng đúng giờ: hẹn um acht Uhr nghĩa là có mặt lúc 8 giờ, đến muộn vài phút nên nhắn trước."
  - type: example
    target: "Wie spät ist es? – Es ist halb neun."
    target_lang: de
    translation:
      vi: Mấy giờ rồi? – Tám giờ rưỡi.
    note:
      vi: "halb neun = 8:30 (nửa đường tới 9 giờ). sp trong spät đọc là \"shp\" như st trong Stunde. Câu hỏi không có du/Sie nên dùng được với mọi người."
  - type: example
    target: "Der Zug fährt um vierzehn Uhr dreißig."
    target_lang: de
    translation:
      vi: Tàu chạy lúc 14 giờ 30.
    note:
      vi: Ở nhà ga dùng giờ chính thức (24 giờ). Cùng giờ ấy, khi nói chuyện thân mật là halb drei.
  - type: example
    target: "Ich arbeite von neun bis siebzehn Uhr."
    target_lang: de
    translation:
      vi: Tôi làm việc từ 9 giờ đến 17 giờ.
    note:
      vi: "von … bis … nói khoảng thời gian; chỉ cần một chữ Uhr ở cuối."
  - type: example
    target: "Entschuldigung, wie viel Uhr ist es? – Es ist Viertel nach zwei."
    target_lang: de
    translation:
      vi: Xin lỗi, bây giờ là mấy giờ ạ? – Hai giờ mười lăm.
    note:
      vi: "Hỏi người lạ trên đường: mở đầu bằng Entschuldigung cho lịch sự. Viertel nach zwei = 2:15."
  - type: example
    target: "Der Film dauert zwei Stunden. Er beginnt um acht Uhr."
    target_lang: de
    translation:
      vi: Bộ phim dài hai tiếng. Phim bắt đầu lúc tám giờ.
    note:
      vi: "Độ dài dùng Stunden, thời điểm dùng Uhr. Er thay cho der Film (giống đực)."
  - type: common_mistake
    wrong: "Es ist halb zwei."
    right: "Es ist halb drei."
    target_lang: de
    note:
      vi: "Muốn nói \"hai giờ rưỡi\" (2:30) thì halb đi với giờ SAU: halb drei. halb zwei là 1:30."
  - type: common_mistake
    wrong: "Der Kurs dauert zwei Uhr."
    right: "Der Kurs dauert zwei Stunden."
    target_lang: de
    note:
      vi: "Nói độ dài (kéo dài bao lâu) dùng Stunde/Stunden; Uhr chỉ dùng cho thời điểm trên đồng hồ."
  - type: common_mistake
    wrong: "Ist drei Uhr."
    right: "Es ist drei Uhr."
    target_lang: de
    note:
      vi: Câu tiếng Đức cần chủ ngữ; khi nói giờ, chủ ngữ là es.
  - type: common_mistake
    wrong: "Ich komme in acht Uhr."
    right: "Ich komme um acht Uhr."
    target_lang: de
    note:
      vi: "\"Lúc\" + giờ luôn là um, không dùng in hay am."
  - type: summary
    points:
      - vi: "Hỏi giờ: Wie spät ist es? / Wie viel Uhr ist es? – Es ist …"
      - vi: "Chính thức: giờ + Uhr + phút (14:30 = vierzehn Uhr dreißig)."
      - vi: "Thân mật: zehn nach drei, zwanzig vor neun, Viertel nach/vor, không có Uhr."
      - vi: "halb + giờ sau: halb drei = 2:30."
      - vi: "um acht Uhr (lúc), von neun bis siebzehn Uhr (từ … đến), Wann …? (khi nào)."
      - vi: "Uhr = thời điểm; Stunde = một tiếng; dauern = kéo dài."
      - vi: "am Morgen, am Vormittag, am Mittag, am Nachmittag, am Abend, in der Nacht."
