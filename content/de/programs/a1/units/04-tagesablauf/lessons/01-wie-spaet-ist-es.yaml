  - key: de:exercise:a1u04l1-wb-unterricht-halb
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u04-g-uhrzeit
    prompt:
      instruction: "Sắp xếp thành câu tiếng Đức: \"Buổi học bắt đầu lúc tám giờ rưỡi.\""
      tokens:
        - { id: t-halb, text: halb }
        - { id: t-beginnt, text: beginnt }
        - { id: t-acht, text: acht }
        - { id: t-unterricht, text: Unterricht }
        - { id: t-um, text: um }
        - { id: t-der, text: der }
        - { id: t-neun, text: neun }
        - { id: t-am, text: am }
    answer:
      orders:
        - [t-der, t-unterricht, t-beginnt, t-um, t-halb, t-neun]
        - [t-um, t-halb, t-neun, t-beginnt, t-der, t-unterricht]
