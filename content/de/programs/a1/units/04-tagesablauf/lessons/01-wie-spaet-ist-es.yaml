    display_answer: "7 giờ 45"

  - key: de:exercise:a1u04l1-fill-um-stunden
    type: fill_blank
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u04-g-um-von-bis
    prompt:
      template: "Der Kurs beginnt {{b1}} neun Uhr und dauert zwei {{b2}}."
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 8 }
      hint_levels:
        - "Nghĩa: Khoá học bắt đầu lúc chín giờ và kéo dài hai tiếng."
        - "Gợi ý: \"lúc\" + giờ là một giới từ ngắn; \"hai tiếng\" là độ dài, số nhiều."
    answer:
      blanks:
        b1: [um]
        b2: [Stunden]
    known_wrong:
      - answer: in
        feedback_vi: "\"Lúc\" + giờ dùng um, không dùng in."
        error_tag: preposition
      - answer: am
        feedback_vi: "am dùng cho buổi, thứ; với giờ đồng hồ dùng um."
        error_tag: preposition
      - answer: Uhr
        feedback_vi: Kéo dài hai tiếng là độ dài, nên dùng Stunden; Uhr chỉ thời điểm.
        error_tag: uhr_stunde
      - answer: Stunde
        feedback_vi: Sau zwei cần số nhiều - zwei Stunden.
        error_tag: plural_form
    explanation:
      vi: "Thời điểm bắt đầu dùng um + giờ (um neun Uhr). Kéo dài bao lâu dùng Stunde; hai tiếng là số nhiều nên zwei Stunden."
    display_answer: "Der Kurs beginnt um neun Uhr und dauert zwei Stunden."

  # ---------------- recall ----------------
  - key: de:exercise:a1u04l1-fill-von-bis
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u04-g-um-von-bis
    prompt:
      template: "Lan arbeitet {{b1}} acht {{b2}} sechzehn Uhr."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [von]
        b2: [bis]
    known_wrong:
      - answer: um
        feedback_vi: "um chỉ một thời điểm; khoảng thời gian \"từ … đến …\" là von … bis …."
        error_tag: preposition
      - answer: nach
        feedback_vi: "\"Đến\" (giờ) trong khoảng thời gian là bis, không phải nach."
        error_tag: preposition
      - answer: zu
        feedback_vi: "\"Đến\" (giờ) trong khoảng thời gian là bis, không phải zu."
        error_tag: preposition
    explanation:
      vi: "Nói khoảng thời gian làm việc: von (từ) + giờ bắt đầu, bis (đến) + giờ kết thúc. Lan làm từ 8 giờ đến 16 giờ."
    display_answer: "Lan arbeitet von acht bis sechzehn Uhr."

  - key: de:exercise:a1u04l1-tr-halb-acht
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u04-g-uhrzeit
    prompt:
      source_text: Bây giờ là bảy giờ rưỡi.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Es ist halb acht.
        - Es ist jetzt halb acht.
        - Jetzt ist es halb acht.
        - Es ist sieben Uhr dreißig.
        - Es ist jetzt sieben Uhr dreißig.
        - Jetzt ist es sieben Uhr dreißig.
        - Es ist neunzehn Uhr dreißig.
        - Es ist 7 Uhr 30.
        - Es ist 7:30 Uhr.
        - Es ist 19 Uhr 30.
        - Es ist 19:30 Uhr.
    known_wrong:
