level: a1
title:
  vi: Mấy giờ rồi? (Wie spät ist es?)
objectives:
  - vi: Hỏi giờ và nói giờ theo cách chính thức (vierzehn Uhr dreißig) lẫn thân mật (Viertel nach, Viertel vor, halb).
  - vi: Hiểu đúng halb drei là 2 giờ 30, không phải 3 giờ 30.
  - vi: Nói việc xảy ra lúc mấy giờ (um) và từ mấy giờ đến mấy giờ (von … bis).
  - vi: Gọi tên các buổi trong ngày và phân biệt Uhr (giờ trên đồng hồ) với Stunde (một tiếng).
estimated_minutes: 15
skills: [grammar, vocabulary, listening]
prerequisites: [de:lesson:a1u03-wiederholung]
