  - key: de:exercise:a1u04l1-tr-arbeite-von-bis
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u04-g-um-von-bis
    prompt:
      source_text: Tôi làm việc từ 9 giờ đến 17 giờ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich arbeite von neun bis siebzehn Uhr.
        - Ich arbeite von neun Uhr bis siebzehn Uhr.
        - Ich arbeite von 9 bis 17 Uhr.
        - Ich arbeite von 9 Uhr bis 17 Uhr.
        - Von neun bis siebzehn Uhr arbeite ich.
        - Von neun Uhr bis siebzehn Uhr arbeite ich.
        - Von 9 bis 17 Uhr arbeite ich.
        - Von 9 Uhr bis 17 Uhr arbeite ich.
    known_wrong:
      - answer: Ich arbeite von neun zu siebzehn Uhr.
        feedback_vi: "\"Đến\" trong khoảng thời gian là bis - von neun bis siebzehn Uhr."
        error_tag: preposition
      - answer: Ich arbeite um neun bis siebzehn Uhr.
        feedback_vi: um chỉ một thời điểm; khoảng thời gian dùng von … bis ….
        error_tag: preposition
      - answer: Von neun bis siebzehn Uhr ich arbeite.
        feedback_vi: Khi đặt von … bis … lên đầu, động từ vẫn ở vị trí 2 - Von neun bis siebzehn Uhr arbeite ich.
        error_tag: verb_position
      - answer: Ich arbeiten von neun bis siebzehn Uhr.
        feedback_vi: Với ich, động từ có đuôi -e - ich arbeite.
        error_tag: verb_form
    explanation:
      vi: "Từ … đến … là von … bis …; chữ Uhr chỉ cần một lần ở cuối. Nếu đưa von … bis … lên đầu câu, động từ arbeite vẫn đứng thứ hai, chủ ngữ ich ra sau."
    display_answer: Ich arbeite von neun bis siebzehn Uhr.

