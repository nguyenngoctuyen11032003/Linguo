title:
  vi: Tôi phải, tôi có thể – động từ khiếm khuyết (Ich kann heute nicht.)
objectives:
  - vi: Chia đúng können, müssen, wollen ở mọi ngôi (ich kann, er muss, du willst …).
  - vi: Đặt động từ khiếm khuyết ở vị trí 2 và động từ chính nguyên thể ở cuối câu.
  - vi: Nói mình có thể, phải, muốn làm việc nhà, việc học gì.
  - vi: Từ chối một lời rủ một cách lịch sự và nêu lý do (Leider kann ich heute nicht. Ich muss …).
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
