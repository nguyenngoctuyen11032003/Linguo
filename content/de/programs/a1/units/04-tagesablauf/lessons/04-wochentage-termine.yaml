title:
  vi: Thứ, ngày, tháng (Wochentage und Termine)
objectives:
  - vi: Gọi tên các thứ, tháng, mùa và dùng đúng am (thứ, ngày, buổi), im (tháng, mùa), um (giờ).
  - vi: Đọc và nói ngày tháng bằng số thứ tự (der erste Mai, am ersten Mai, viết 1. Mai).
  - vi: Nói ngày sinh của mình và hỏi ngày sinh của người khác.
  - vi: Hiểu thông báo ngắn về ngày giờ (lịch học, lịch hẹn).
