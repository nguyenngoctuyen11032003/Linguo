title:
  vi: Tôi dậy lúc bảy giờ – động từ tách (Ich stehe um sieben Uhr auf.)
objectives:
  - vi: Kể thói quen hằng ngày theo trình tự (aufstehen, duschen, frühstücken, einkaufen, fernsehen, einschlafen …).
  - vi: Đặt đúng động từ tách trong câu - phần chia ở vị trí 2, tiền tố ở cuối câu (khung câu).
  - vi: Hỏi bạn bè về thói quen với Wann …? và câu hỏi có/không.
  - vi: Nhận ra động từ không tách như frühstücken, beginnen, duschen.
