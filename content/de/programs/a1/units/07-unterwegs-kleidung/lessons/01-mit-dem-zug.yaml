title:
  vi: Đi bằng tàu – giới từ đi với Dativ (Mit dem Zug nach Berlin)
objectives:
  - vi: Nói mình đi đâu và đi bằng phương tiện gì (mit dem Zug, mit der U-Bahn, mit dem Flugzeug).
  - vi: Dùng aus, bei, mit, nach, von, zu luôn kèm Dativ, kể cả với mạo từ sở hữu (mit meiner Mutter) và dạng rút gọn zum, zur, beim, vom.
  - vi: Phân biệt nach Berlin với zu meiner Oma, nach Hause (về nhà) với zu Hause (ở nhà).
  - vi: Nói mình đi cùng ai và từ đâu về (Ich komme vom Flughafen zurück).
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u06-wiederholung]
