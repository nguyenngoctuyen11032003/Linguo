body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "Cái áo khoác rẻ hơn cái áo măng tô", "Đôi giày này êm bằng đôi ở nhà", "Có cỡ lớn hơn không ạ?" và nghe hiểu người bán hàng nói về giá, cỡ, khuyến mãi.
  - type: explain
    text:
      vi: "So sánh hơn: thêm -er vào tính từ rồi dùng als: billig → billiger als, schön → schöner als. Tiếng Việt thêm chữ \"hơn\", tiếng Đức đổi chính tính từ – đừng nói \"mehr billig\" như tiếng Anh \"more\"."
  - type: explain
    text:
      vi: "Nhiều tính từ một âm tiết có a, o, u thì thêm umlaut: groß → größer, alt → älter, kurz → kürzer, lang → länger, warm → wärmer. Ba dạng bất quy tắc cần thuộc: gut → besser, viel → mehr, gern → lieber (bạn đã gặp ở bài sở thích)."
  - type: explain
    text:
      vi: "So sánh bằng: so + tính từ nguyên dạng + wie: Die Hose ist so teuer wie die Jacke. Phủ định nicht so … wie = không … bằng: Der Rock ist nicht so schick wie das Kleid."
  - type: explain
    text:
      vi: "Nhớ cặp: khác nhau → -er + als; giống nhau → so … wie. Trong văn nói đôi khi nghe \"größer wie\", nhưng văn viết và bài thi luôn dùng als."
  - type: explain
    text:
      vi: "Trong cửa hàng: die Größe (cỡ), der Preis (giá), im Angebot (đang khuyến mãi), die Umkleidekabine (phòng thử đồ), die Kasse (quầy thu ngân). Xin cỡ khác: Haben Sie die Hose auch eine Nummer größer?"
  - type: deep_explain
    text:
      vi: "teuer bỏ chữ e khi so sánh: teuer → teurer (không viết teuerer). Trong bài này tính từ so sánh chỉ đứng sau sein hoặc làm trạng từ (eine Nummer größer); khi đứng trước danh từ nó còn thêm đuôi (ein billigeres Hemd) – bạn sẽ học ở A2 cùng đuôi tính từ. viel + Komparativ nghĩa là \"hơn nhiều\": viel billiger = rẻ hơn nhiều. Ở Đức, phần lớn cửa hàng và Kaufhaus đóng cửa vào Chủ nhật và ngày lễ (Ladenschluss), thường chỉ cửa hàng ở nhà ga, sân bay hay trạm xăng mở; quy định khác nhau theo bang và có thể thay đổi, nên hãy kiểm tra giờ mở cửa thực tế. Biển giờ mở cửa rất hay gặp trong bài đọc trình độ A1."
  - type: example
    target: Die Jacke ist billiger als der Mantel.
    target_lang: de
    translation:
      vi: Cái áo khoác rẻ hơn cái áo măng tô.
    note:
      vi: "billig + -er = billiger, rồi als + vật được so sánh (vẫn ở Nominativ: der Mantel)."
  - type: example
    target: "Der Mantel ist teurer, aber er ist auch wärmer."
    target_lang: de
    translation:
      vi: Áo măng tô đắt hơn, nhưng cũng ấm hơn.
    note:
      vi: "teuer → teurer (bỏ e); warm → wärmer (thêm umlaut)."
  - type: example
    target: Die Schuhe hier sind so bequem wie meine Schuhe zu Hause.
    target_lang: de
    translation:
      vi: Đôi giày ở đây êm chân bằng đôi giày ở nhà của tôi.
    note:
      vi: "So sánh bằng: so + bequem (không thêm -er) + wie."
  - type: example
    target: "Die Hose ist zu kurz. Haben Sie sie auch eine Nummer größer?"
    target_lang: de
    translation:
      vi: Cái quần ngắn quá. Chị có cái này cỡ lớn hơn một số không?
    note:
      vi: "Khách nói với người bán nên dùng Sie (viết hoa); sie (viết thường) thay cho die Hose. zu kurz = ngắn quá."
  - type: example
    target: "Welche Jacke gefällt dir besser, die hier oder die dort? – Die hier. Sie ist schicker."
    target_lang: de
    translation:
      vi: "Bạn thích cái áo khoác nào hơn, cái này hay cái kia? – Cái này. Nó sành điệu hơn."
    note:
      vi: "Hai người bạn dùng du → dir. gut → besser: gefällt mir besser = mình thích hơn."
  - type: example
    target: "Im Kaufhaus sind die Schuhe heute im Angebot. Sie sind viel günstiger!"
    target_lang: de
    translation:
      vi: Hôm nay ở cửa hàng bách hóa giày đang khuyến mãi. Rẻ hơn nhiều!
    note:
      vi: "im Angebot = đang giảm giá; viel günstiger = rẻ hơn nhiều."
  - type: common_mistake
    wrong: Die Jacke ist mehr billig als der Mantel.
    right: Die Jacke ist billiger als der Mantel.
    target_lang: de
    note:
      vi: Tiếng Đức không dùng mehr để so sánh tính từ như tiếng Anh "more"; chỉ cần thêm -er.
  - type: common_mistake
    wrong: Mein Bruder ist größer wie ich.
    right: Mein Bruder ist größer als ich.
    target_lang: de
    note:
      vi: "So sánh hơn dùng als; wie chỉ dùng trong so … wie (bằng nhau)."
  - type: common_mistake
    wrong: Der Rock ist kurzer als das Kleid.
    right: Der Rock ist kürzer als das Kleid.
    target_lang: de
    note:
      vi: "kurz là tính từ một âm tiết có u nên thêm umlaut: kürzer."
  - type: summary
    points:
      - vi: "So sánh hơn: tính từ + -er + als (billiger als)."
      - vi: "Umlaut: größer, älter, kürzer, länger, wärmer."
      - vi: "Bất quy tắc: gut → besser, viel → mehr, gern → lieber; teuer → teurer."
      - vi: "Bằng nhau: so … wie; không bằng: nicht so … wie."
      - vi: "Không nói mehr billig, không nói größer wie."
      - vi: "Cửa hàng: die Größe, der Preis, im Angebot, die Umkleidekabine, die Kasse."
