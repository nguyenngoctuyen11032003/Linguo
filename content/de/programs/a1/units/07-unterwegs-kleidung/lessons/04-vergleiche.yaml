    display_answer: Die Hose ist zu eng. Haben Sie sie eine Nummer größer?

  - key: de:exercise:a1u07l4-tr-kaufhaus-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u07-kaufhaus
    prompt:
      source_text: Das Kaufhaus ist größer als der Supermarkt.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Cửa hàng bách hóa lớn hơn siêu thị.
        - Cửa hàng bách hóa to hơn siêu thị.
        - Cửa hàng bách hóa rộng hơn siêu thị.
        - Bách hóa lớn hơn siêu thị.
        - Trung tâm thương mại lớn hơn siêu thị.
        - Trung tâm thương mại to hơn siêu thị.
        - Cửa hàng bách hóa thì lớn hơn siêu thị.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Cửa hàng bách hóa nhỏ hơn siêu thị.
        feedback_vi: "größer là \"lớn hơn\" (so sánh của groß), không phải \"nhỏ hơn\" (kleiner)."
        error_tag: meaning
      - answer: Cửa hàng bách hóa lớn bằng siêu thị.
        feedback_vi: "größer als = lớn hơn; \"lớn bằng\" là so groß wie."
        error_tag: komparativ_als
    explanation:
      vi: "größer als = lớn hơn (groß → größer). das Kaufhaus là cửa hàng bách hóa, der Supermarkt là siêu thị."
    display_answer: Cửa hàng bách hóa lớn hơn siêu thị.
