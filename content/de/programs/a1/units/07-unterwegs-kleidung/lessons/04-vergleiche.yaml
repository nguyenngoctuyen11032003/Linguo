        feedback_vi: "alt có một âm tiết với a nên so sánh hơn thêm umlaut: älter."
        error_tag: umlaut_missing
      - answer: großer
        feedback_vi: "groß có một âm tiết với o nên so sánh hơn thêm umlaut: größer."
        error_tag: umlaut_missing
      - answer: mehr alt
        feedback_vi: "Không dùng mehr: alt → älter."
        error_tag: komparativ_form
    explanation:
      vi: "alt và groß là tính từ một âm tiết có a, o, nên so sánh hơn thêm cả umlaut lẫn -er: älter, größer."
    display_answer: Mein Bruder ist älter als ich, aber ich bin größer als er.

  - key: de:exercise:a1u07l4-tr-hose-billiger
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u07-g-komparativ
    prompt:
      source_text: Cái quần rẻ hơn cái áo khoác.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Die Hose ist billiger als die Jacke.
        - Die Hose ist günstiger als die Jacke.
        - Diese Hose ist billiger als die Jacke.
        - Diese Hose ist günstiger als die Jacke.
        - Die Hose kostet weniger als die Jacke.
    known_wrong:
