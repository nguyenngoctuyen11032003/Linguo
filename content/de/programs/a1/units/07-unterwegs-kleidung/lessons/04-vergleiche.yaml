    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u07-g-komparativ
    prompt:
      template: "Mein Bruder ist {{b1}} (alt) als ich, aber ich bin {{b2}} (groß) als er."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 7 }
    answer:
      blanks:
        b1: [älter]
        b2: [größer]
    known_wrong:
