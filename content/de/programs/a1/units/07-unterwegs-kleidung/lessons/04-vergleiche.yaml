title:
  vi: Rẻ hơn, đẹp hơn – so sánh (Größer und billiger)
objectives:
  - vi: So sánh giá, cỡ, kiểu dáng bằng tính từ + -er + als (billiger als, größer als).
  - vi: Nói hai thứ bằng nhau hoặc không bằng nhau với so … wie, nicht so … wie.
  - vi: Dùng đúng các dạng có umlaut và bất quy tắc (größer, älter, kürzer, besser, mehr).
  - vi: Nghe hiểu hội thoại ngắn trong cửa hàng quần áo (cỡ, giá, khuyến mãi, phòng thử đồ, quầy thu ngân).
