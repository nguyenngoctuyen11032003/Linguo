  # ---------------- recall ----------------
  - key: de:exercise:a1u07l4-fill-billiger-so-wie
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u07-g-komparativ
    prompt:
      template: "Das Hemd ist {{b1}} (billig) {{b2}} das T-Shirt, aber es ist nicht so {{b3}} (bequem) {{b4}} das T-Shirt."
      blanks:
        - { id: b1, width_hint: 9 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 7 }
        - { id: b4, width_hint: 4 }
    answer:
      blanks:
        b1: [billiger]
        b2: [als]
        b3: [bequem]
        b4: [wie]
    known_wrong:
      - answer: mehr billig
        feedback_vi: "Không dùng mehr: billig → billiger."
        error_tag: komparativ_form
      - answer: billig
        feedback_vi: "Có als phía sau nên cần dạng so sánh hơn: billiger."
        error_tag: komparativ_form
      - answer: bequemer
        feedback_vi: "Sau so … wie, tính từ giữ nguyên dạng: so bequem wie."
        error_tag: komparativ_form
    explanation:
      vi: "Khác nhau (rẻ hơn): billiger als. Không bằng: nicht so + tính từ nguyên dạng + wie, nên bequem không thêm -er."
    display_answer: "Das Hemd ist billiger als das T-Shirt, aber es ist nicht so bequem wie das T-Shirt."

