      options:
        - { id: v2c, text: "Áo khoác rẻ hơn áo măng tô, nhưng áo măng tô ấm hơn.", lang: vi }
        - { id: b7x, text: "Áo khoác đắt hơn áo măng tô, nhưng áo măng tô ấm hơn.", lang: vi }
        - { id: n4k, text: "Áo khoác rẻ hơn áo măng tô, và cũng ấm hơn.", lang: vi }
