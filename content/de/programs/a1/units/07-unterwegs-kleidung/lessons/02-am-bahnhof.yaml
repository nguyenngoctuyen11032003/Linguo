  - key: de:exercise:a1u07l2-fill-kommt-an
    type: fill_blank
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u07-ankommen
    prompt:
      template: "Der Zug {{b1}} um 9.15 Uhr in Berlin {{b2}}."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 3 }
      hint_levels:
        - "Nghĩa của câu: Tàu đến Berlin lúc 9 giờ 15."
        - "Gợi ý: ankommen là động từ tách – kommen ở vị trí 2, an ở cuối câu."
    answer:
      blanks:
        b1: [kommt]
        b2: [an]
    known_wrong:
      - answer: ankommt
        feedback_vi: "ankommen là động từ tách: kommt ở vị trí 2, an về cuối câu."
        error_tag: separable_prefix
      - answer: ab
        feedback_vi: "Câu nói tàu đến nơi nên dùng ankommen (… kommt … an); ab thuộc abfahren (khởi hành)."
        error_tag: separable_prefix
      - answer: kommen
        feedback_vi: "Chủ ngữ der Zug là ngôi thứ ba số ít: er kommt."
        error_tag: verb_form
    explanation:
      vi: "ankommen (đến nơi) là động từ tách: kommt chia theo der Zug ở vị trí 2, tiền tố an đứng cuối câu."
    display_answer: Der Zug kommt um 9.15 Uhr in Berlin an.

