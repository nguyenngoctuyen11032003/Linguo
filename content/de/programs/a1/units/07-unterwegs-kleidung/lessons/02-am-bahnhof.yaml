body:
  - type: objective
    text:
      vi: Sau bài này, bạn tự mua được vé tàu, hỏi được "Tàu nào đi München? Chạy từ đường ray nào?" và nghe hiểu thông báo kiểu "Tàu trễ mười phút".
  - type: explain
    text:
      vi: "welch- nghĩa là \"nào\" và có đuôi giống hệt mạo từ xác định: der Zug → welcher Zug, die Fahrkarte → welche Fahrkarte, das Gleis → welches Gleis, die Züge → welche Züge. Tiếng Việt \"nào\" đứng sau danh từ (tàu nào), còn tiếng Đức welch- đứng trước danh từ, ở đầu câu hỏi."
  - type: explain
    text:
      vi: "Khi danh từ là tân ngữ (Akkusativ), chỉ giống đực đổi, giống như der → den: Welchen Zug nimmst du? Giống cái, giống trung và số nhiều giữ nguyên: Welche Fahrkarte möchten Sie?"
  - type: explain
    text:
      vi: "abfahren (khởi hành), ankommen (đến nơi), umsteigen (đổi tàu) là động từ tách: phần chính ở vị trí 2, tiền tố về cuối câu – Der Zug fährt um 9.15 Uhr ab. Danh từ đi kèm thì không tách: die Abfahrt, die Ankunft."
  - type: explain
    text:
      vi: "Ở ga, giờ luôn đọc theo kiểu chính thức 24 giờ: 14.35 Uhr = vierzehn Uhr fünfunddreißig. Hãy nghe số giờ trước, rồi số phút sau chữ Uhr, và chú ý -zehn (15) khác -zig (50)."
  - type: explain
    text:
      vi: "Mua vé: Einmal nach Köln, bitte. – Einfach oder hin und zurück? einfach là vé một chiều, hin und zurück là vé khứ hồi; Einmal ở đây là \"một vé\"."
  - type: deep_explain
    text:
      vi: "Tàu trễ nói bằng haben: Der Zug hat zehn Minuten Verspätung – tàu \"có\" mười phút trễ, không dùng sein. Tàu ở Đức khá hay trễ nên bạn sẽ nghe câu này rất nhiều; tàu đúng giờ là pünktlich. Ở Đức có vé tháng toàn quốc cho tàu địa phương và giao thông công cộng (Deutschlandticket), nhưng giá và điều kiện có thể thay đổi – hãy kiểm tra thông tin mới nhất trước khi mua. Vé đặt chỗ ghi toa và ghế, ví dụ Wagen 9, Platz 45. Cách nói welch- ở Dativ (von welchem Gleis?) bạn sẽ học sau; trong bài này chỉ cần Nominativ và Akkusativ."
  - type: example
    target: "Welcher Zug fährt nach München? – Der Zug um 10.28 Uhr. Er fährt von Gleis 12 ab."
    target_lang: de
    translation:
      vi: "Tàu nào đi München? – Chuyến 10 giờ 28. Tàu chạy từ đường ray số 12."
    note:
      vi: "der Zug → welcher Zug. Er thay cho der Zug (giống đực). Trước số đường ray không có mạo từ."
  - type: example
    target: "Guten Tag! Einmal nach Köln, bitte. – Einfach oder hin und zurück? – Hin und zurück, bitte. – Das kostet 89,90 Euro."
    target_lang: de
    translation:
      vi: "Chào anh! Cho tôi một vé đi Köln. – Một chiều hay khứ hồi ạ? – Khứ hồi. – Giá 89 euro 90."
    note:
      vi: "Ở quầy vé, khách và nhân viên nói với nhau bằng Sie. 89,90 Euro đọc là neunundachtzig Euro neunzig."
  - type: example
    target: "Welchen Zug nimmst du? – Den Zug um acht. Ich muss in Frankfurt umsteigen."
    target_lang: de
    translation:
      vi: "Bạn đi chuyến nào? – Chuyến tám giờ. Mình phải đổi tàu ở Frankfurt."
    note:
      vi: "Hai người bạn dùng du. Zug là tân ngữ của nimmst nên welchen, den. Với müssen, umsteigen ở cuối câu và không tách."
  - type: example
    target: "Der Zug aus Berlin hat zwanzig Minuten Verspätung. Die Ankunft ist jetzt um 16.50 Uhr."
    target_lang: de
    translation:
      vi: "Tàu từ Berlin trễ hai mươi phút. Giờ đến bây giờ là 16 giờ 50."
    note:
      vi: "16.50 Uhr đọc là sechzehn Uhr fünfzig."
  - type: example
    target: "Entschuldigung, ist der Platz hier frei? – Nein, leider nicht. Das ist mein Platz: Wagen 9, Platz 45."
    target_lang: de
    translation:
      vi: "Xin lỗi, chỗ này còn trống không? – Tiếc là không. Đây là chỗ của tôi: toa 9, ghế 45."
    note:
      vi: "Người lạ trên tàu: câu hỏi lịch sự không cần du hay Sie. Wagen = toa tàu."
  - type: example
    target: Die U-Bahn in Richtung Zentrum fährt von Gleis 2 ab.
    target_lang: de
    translation:
      vi: Tàu điện ngầm hướng đi trung tâm chạy từ đường ray số 2.
    note:
      vi: "in Richtung … = theo hướng …; trên biển báo thường chỉ ghi Richtung Zentrum."
  - type: common_mistake
    wrong: Welche Zug fährt nach Hamburg?
    right: Welcher Zug fährt nach Hamburg?
    target_lang: de
    note:
      vi: "der Zug là giống đực nên welcher (đuôi -er như der)."
  - type: common_mistake
    wrong: Welcher Zug nimmst du?
    right: Welchen Zug nimmst du?
    target_lang: de
    note:
      vi: "Zug là tân ngữ của nimmst (Akkusativ): der → den, welcher → welchen."
  - type: common_mistake
    wrong: Der Zug abfährt um neun Uhr.
    right: Der Zug fährt um neun Uhr ab.
    target_lang: de
    note:
      vi: Động từ tách – fährt ở vị trí 2, ab về cuối câu.
  - type: common_mistake
    wrong: Der Zug ist zehn Minuten Verspätung.
    right: Der Zug hat zehn Minuten Verspätung.
    target_lang: de
    note:
      vi: "Verspätung là danh từ, đi với haben: Der Zug hat … Verspätung."
  - type: summary
    points:
      - vi: "welcher / welche / welches = nào; đuôi như der / die / das."
      - vi: "Akkusativ chỉ giống đực đổi: welchen Zug."
      - vi: "abfahren, ankommen, umsteigen: tiền tố về cuối câu (Der Zug kommt um 9 Uhr an)."
      - vi: "Giờ tàu: 14.35 Uhr = vierzehn Uhr fünfunddreißig."
      - vi: "Vé: einfach = một chiều; hin und zurück = khứ hồi."
      - vi: "Tàu trễ: Der Zug hat zehn Minuten Verspätung; đúng giờ: pünktlich."
