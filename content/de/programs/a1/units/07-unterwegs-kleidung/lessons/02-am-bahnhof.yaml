title:
  vi: Ở nhà ga – welcher (Welcher Zug fährt nach München?)
objectives:
  - vi: Mua vé tàu một chiều hoặc khứ hồi ở quầy vé (Einmal nach Köln, bitte. – Einfach oder hin und zurück?).
  - vi: Hỏi tàu nào, đường ray nào, mấy giờ với welcher / welche / welches.
  - vi: Nghe giờ tàu chính thức (14.35 Uhr) và hiểu thông báo tàu trễ, đổi tàu.
  - vi: Dùng các động từ tách abfahren, ankommen, umsteigen đúng vị trí.
estimated_minutes: 15
