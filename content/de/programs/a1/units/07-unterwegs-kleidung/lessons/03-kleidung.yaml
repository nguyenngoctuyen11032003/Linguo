key: de:lesson:a1u07-kleidung
order_index: 3
level: a1
title:
  vi: Quần áo – đại từ Dativ (Die Jacke gefällt mir.)
objectives:
  - vi: Nói mình và người khác đang mặc gì (Ich trage einen Pullover. Der Pullover ist blau.).
  - vi: Khen hoặc chê quần áo bằng gefallen (Die Jacke gefällt mir. Die Schuhe gefallen mir nicht.).
  - vi: Nói quần áo vừa hay không vừa, hợp hay không hợp với ai (passen, stehen).
  - vi: Dùng đại từ Dativ mir, dir, ihm, ihr, uns, euch, ihnen / Ihnen.
estimated_minutes: 15
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a1u07-am-bahnhof]
