key: de:lesson:a1u02-meine-familie
order_index: 1
level: a1
title:
  vi: Gia đình tôi – mein, dein (Meine Familie)
objectives:
  - vi: Giới thiệu các thành viên gia đình bằng mein/meine, dein/deine, sein/seine, ihr/ihre và Ihr/Ihre.
  - vi: Tả người trong gia đình bằng tính từ đơn giản sau sein (groß, klein, nett, lustig).
  - vi: Chọn đúng sein hay ihr theo người sở hữu và thêm -e cho danh từ giống cái, số nhiều.
