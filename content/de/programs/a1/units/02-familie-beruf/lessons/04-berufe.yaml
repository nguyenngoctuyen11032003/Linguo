body:
  - type: objective
    text:
      vi: "Sau bài này, bạn hỏi được \"Anh/chị làm nghề gì?\", trả lời \"Tôi là kỹ sư\", \"Mẹ tôi là bác sĩ, làm ở bệnh viện\" và nghe hiểu một người giới thiệu nghề của mình."
  - type: explain
    text:
      vi: "Khi chỉ nói nghề với sein, tiếng Đức thường KHÔNG dùng mạo từ: Ich bin Lehrerin. Er ist Arzt. Tiếng Anh nói \"I am a teacher\", còn tiếng Đức giống tiếng Việt hơn: \"Tôi là giáo viên\"."
  - type: explain
    text:
      vi: "Nghề của người nữ thường thêm -in và luôn là giống cái: der Verkäufer → die Verkäuferin, der Ingenieur → die Ingenieurin. Một số từ còn thêm biến âm: der Arzt → die Ärztin, der Koch → die Köchin. Số nhiều của -in là -innen: die Ärztinnen."
  - type: explain
    text:
      vi: "Hỏi nghề: Was sind Sie von Beruf? hoặc tự nhiên, lịch sự hơn: Was machen Sie beruflich? Với bạn bè: Was bist du von Beruf? / Was machst du beruflich? Cụm \"von Beruf\" học thuộc như một khối."
  - type: explain
    text:
      vi: "arbeiten có gốc tận cùng -t nên thêm -e- trước đuôi: du arbeitest, er arbeitet. arbeiten als + nghề, cũng không có mạo từ: Ich arbeite als Koch. Nơi làm việc \"ở bệnh viện\" là im Krankenhaus – học như một cụm, cách dùng in + Dativ sẽ học ở Unit 5."
  - type: explain
    text:
      vi: "Ngành điều dưỡng (die Pflege) ở Đức tuyển nhiều người Việt. Tên nghề chính thức hiện nay là Pflegefachfrau/Pflegefachmann; trong giao tiếp hằng ngày người ta vẫn nói Pfleger/Pflegerin; Krankenschwester là tên gọi cũ nhưng vẫn hay nghe."
  - type: deep_explain
    text:
      vi: "Phủ định nghề dùng kein: Ich bin kein Arzt (tôi không phải bác sĩ). Khi có tính từ đứng trước nghề thì lại cần mạo từ (Er ist ein guter Koch – \"anh ấy là một đầu bếp giỏi\"); dạng này bạn sẽ học ở A2. Câu Er ist ein Koch cũng đúng ngữ pháp, nhưng mang ý xếp loại hay nhấn mạnh; khi chỉ giới thiệu nghề, hãy nói Er ist Koch. Không phải nghề nào cũng thêm -in: der Hausmann → die Hausfrau đổi cả phần cuối. Trên báo và thông báo tuyển dụng bạn sẽ gặp cách viết cả hai giới như Ärztinnen und Ärzte hoặc Mitarbeiter (m/w/d)."
  - type: example
    target: "Was sind Sie von Beruf? – Ich bin Ingenieur. Meine Firma ist in Hamburg."
    target_lang: de
    translation:
      vi: "Anh làm nghề gì? – Tôi là kỹ sư. Công ty của tôi ở Hamburg."
    note:
      vi: "Hỏi lịch sự với Sie. Ich bin Ingenieur – không có mạo từ trước nghề. die Firma giống cái → meine Firma."
  - type: example
    target: Meine Mutter ist Ärztin und mein Vater ist Hausmann.
    target_lang: de
    translation:
      vi: Mẹ tôi là bác sĩ, còn bố tôi ở nhà làm nội trợ.
    note:
      vi: "Ärztin: dạng nữ của Arzt, thêm -in và biến âm. Hausmann là nam nội trợ (nữ: Hausfrau)."
  - type: example
    target: "Was machst du beruflich, Lan? – Ich bin Pflegerin. Ich arbeite im Krankenhaus."
    target_lang: de
    translation:
      vi: "Lan làm nghề gì thế? – Mình là điều dưỡng. Mình làm ở bệnh viện."
    note:
      vi: "Nói với bạn (du) nên dùng machst. im Krankenhaus là cụm cố định \"ở bệnh viện\"."
  - type: example
    target: Meine Schwester ist Erzieherin und mein Bruder ist auch Erzieher.
    target_lang: de
    translation:
      vi: Chị tôi là giáo viên mầm non, và anh tôi cũng là giáo viên mầm non.
    note:
      vi: "Cùng một nghề: nữ là Erzieherin, nam là Erzieher."
  - type: example
    target: Mein Opa ist Rentner. Mein Onkel ist arbeitslos.
    target_lang: de
    translation:
      vi: Ông tôi đã nghỉ hưu. Chú tôi đang thất nghiệp.
    note:
      vi: "Rentner, arbeitslos cũng dùng với sein và không có mạo từ."
  - type: example
    target: Ich bin kein Arzt. Ich bin Pfleger.
    target_lang: de
    translation:
      vi: Tôi không phải bác sĩ. Tôi là điều dưỡng.
    note:
      vi: "Phủ định nghề dùng kein (kein Arzt), không dùng nicht ein."
  - type: common_mistake
    wrong: Ich bin ein Lehrer.
    right: Ich bin Lehrer.
    target_lang: de
    note:
      vi: "Do ảnh hưởng tiếng Anh (a teacher). Câu có ein không sai ngữ pháp nhưng nghe như nhấn mạnh; khi chỉ giới thiệu nghề, người Đức bỏ mạo từ."
  - type: common_mistake
    wrong: Lan ist Arzt.
    right: Lan ist Ärztin.
    target_lang: de
    note:
      vi: "Lan là nữ nên dùng dạng -in: Ärztin (có biến âm)."
  - type: common_mistake
    wrong: Er arbeitet als ein Koch.
    right: Er arbeitet als Koch.
    target_lang: de
    note:
      vi: "Sau als + nghề cũng không có mạo từ."
  - type: common_mistake
    wrong: Du arbeitst als Verkäufer.
    right: Du arbeitest als Verkäufer.
    target_lang: de
    note:
      vi: "Gốc arbeit- tận cùng -t nên thêm -e- trước đuôi -st: du arbeitest."
  - type: summary
    points:
      - vi: "Nghề với sein hoặc arbeiten als: không mạo từ – Ich bin Ingenieur. Ich arbeite als Koch."
      - vi: "Người nữ: thêm -in (Verkäuferin), có khi thêm biến âm (Ärztin, Köchin); số nhiều -innen."
      - vi: "Hỏi nghề: Was sind Sie von Beruf? / Was machen Sie beruflich? (du: Was bist du von Beruf?)"
      - vi: "arbeiten: du arbeitest, er arbeitet (thêm -e-)."
      - vi: "im Krankenhaus = ở bệnh viện (cụm cố định)."
      - vi: "Phủ định nghề: Ich bin kein Arzt."
