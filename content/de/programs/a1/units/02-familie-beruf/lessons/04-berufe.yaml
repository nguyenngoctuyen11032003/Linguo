  - key: de:exercise:a1u02l4-mcq-aerztin
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u02-g-feminin-in
    prompt:
      stem: "Mẹ của Minh là bác sĩ. Chọn từ đúng: \"Seine Mutter ist ___.\""
      stem_lang: vi
      options:
        - { id: z1a, text: Ärztin, lang: de }
        - { id: z2a, text: Ärztinnen, lang: de }
        - { id: z3a, text: Ärzte, lang: de }
        - { id: z4a, text: Arzt, lang: de }
    answer:
      correct_option_id: z1a
    explanation:
      vi: "Một người nữ → dạng -in số ít: Ärztin (Arzt thêm -in và biến âm). Ärztinnen, Ärzte là số nhiều; Arzt là dạng cho người nam."
    display_answer: Ärztin

  - key: de:exercise:a1u02l4-mcq-lehrerin
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u02-g-beruf-ohne-artikel
    prompt:
      stem: Lan là giáo viên. Câu nào đúng?
      stem_lang: vi
      options:
        - { id: b1l, text: Lan ist Lehrerin., lang: de }
        - { id: b2l, text: Lan ist ein Lehrer., lang: de }
        - { id: b3l, text: Lan ist eine Lehrer., lang: de }
        - { id: b4l, text: Lan ist Lehrerinnen., lang: de }
    answer:
      correct_option_id: b1l
    explanation:
      vi: "Giới thiệu nghề với sein thường không dùng mạo từ, và Lan là nữ nên dùng Lehrerin (số ít). Ein Lehrer là dạng nam, Lehrerinnen là số nhiều, eine Lehrer sai giống. (Có tính từ hoặc khi nhấn mạnh thì có thể dùng mạo từ: Lan ist eine gute Lehrerin.)"
    display_answer: Lan ist Lehrerin.

