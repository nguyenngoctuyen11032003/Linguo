        - { id: w2g, text: "Bà Wagner là điều dưỡng ở bệnh viện, chồng bà đã nghỉ hưu.", lang: vi }
        - { id: w3g, text: "Bà Wagner là bác sĩ ở bệnh viện, chồng bà là đầu bếp.", lang: vi }
        - { id: w4g, text: "Bà Wagner đã nghỉ hưu, chồng bà là bác sĩ.", lang: vi }
    answer:
