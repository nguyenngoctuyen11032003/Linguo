      blanks:
        - { id: b1, width_hint: 8 }
    answer:
      blanks:
        b1: [Köchin, eine Köchin]
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Koch
        feedback_vi: Chị/em gái là nữ nên dùng dạng -in - Köchin (có biến âm ö).
        error_tag: feminine_form
    explanation:
      vi: "meine Schwester là nữ nên nghề phải ở dạng nữ: Koch → Köchin (thêm -in và biến âm o → ö). Giống vế đầu (ist Koch), cách nói thông thường không có mạo từ: ist auch Köchin; eine Köchin cũng đúng ngữ pháp nhưng ít dùng khi chỉ nói nghề."
    display_answer: Mein Bruder ist Koch und meine Schwester ist auch Köchin.

  - key: de:exercise:a1u02l4-fill-bist-arbeite
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-arbeiten
    prompt:
      template: "A: Was {{b1}} du von Beruf? B: Ich {{b2}} als Verkäufer."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 8 }
    answer:
      blanks:
        b1: [bist]
        b2: [arbeite]
    known_wrong:
      - answer: arbeitest
        feedback_vi: "Chú ý ngôi: du → bist; ich → arbeite (arbeitest là của du)."
        error_tag: verb_form
      - answer: arbeitet
        feedback_vi: "Chú ý ngôi: ich → arbeite (arbeitet là của er/sie/es, ihr)."
        error_tag: verb_form
      - answer: bin
        feedback_vi: "Chú ý ngôi: du → bist; với als + nghề dùng động từ arbeiten (ich arbeite)."
        error_tag: verb_form
    explanation:
      vi: "Câu hỏi nghề cố định: Was bist du von Beruf? (du → bist). Câu trả lời: ich arbeite als + nghề, không mạo từ."
    display_answer: "A: Was bist du von Beruf? B: Ich arbeite als Verkäufer."

  - key: de:exercise:a1u02l4-tr-mutter-aerztin
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-arzt
    prompt:
      source_text: Mẹ tôi là bác sĩ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Meine Mutter ist Ärztin.
        - Meine Mutter ist Ärztin von Beruf.
        - Meine Mutter ist von Beruf Ärztin.
        - Meine Mutter arbeitet als Ärztin.
        - Meine Mama ist Ärztin.
        - Meine Mutter ist eine Ärztin.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Meine Mutter ist Arzt.
        feedback_vi: Mẹ là nữ nên dùng dạng nữ - Ärztin.
        error_tag: feminine_form
      - answer: Meine Mutter ist ein Arzt.
        feedback_vi: Mẹ là nữ nên dùng dạng nữ - Ärztin; khi chỉ nói nghề thường bỏ mạo từ - Meine Mutter ist Ärztin.
        error_tag: feminine_form
      - answer: Mein Mutter ist Ärztin.
        feedback_vi: die Mutter giống cái nên cần -e - meine Mutter.
        error_tag: possessive_ending
    explanation:
      vi: "die Mutter → meine Mutter. Nghề của người nữ dùng dạng -in: Ärztin. Cách nói nghề thông thường không có mạo từ (Meine Mutter ist Ärztin); eine Ärztin cũng đúng ngữ pháp nhưng mang ý nhấn mạnh."
    display_answer: Meine Mutter ist Ärztin.

  # ---------------- application ----------------
  - key: de:exercise:a1u02l4-wb-koch-hamburg
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a1u02-als
    prompt:
      instruction: "Sắp xếp thành câu: \"Anh ấy làm đầu bếp ở Hamburg.\""
      tokens:
        - { id: k-koch, text: Koch }
        - { id: k-in, text: in }
        - { id: k-er, text: er }
        - { id: k-ein, text: ein }
        - { id: k-hamburg, text: Hamburg }
        - { id: k-arbeitet, text: arbeitet }
        - { id: k-als, text: als }
        - { id: k-arbeitest, text: arbeitest }
    answer:
      orders:
        - [k-er, k-arbeitet, k-als, k-koch, k-in, k-hamburg]
        - [k-er, k-arbeitet, k-in, k-hamburg, k-als, k-koch]
        - [k-in, k-hamburg, k-arbeitet, k-er, k-als, k-koch]
        - [k-als, k-koch, k-arbeitet, k-er, k-in, k-hamburg]
    explanation:
      vi: "er → arbeitet (thêm -e-), động từ luôn ở vị trí 2. als + nghề không có mạo từ (không dùng ein). Phần đứng đầu có thể là er, in Hamburg hoặc als Koch – chỉ cần arbeitet ở vị trí 2."
    display_answer: Er arbeitet als Koch in Hamburg.

