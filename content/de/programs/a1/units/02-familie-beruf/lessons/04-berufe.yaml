  - key: de:exercise:a1u02l4-mcq-sie-beruflich
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-machen
    prompt:
      stem: Ở lớp tiếng Đức, bạn muốn hỏi nghề của một người đàn ông lớn tuổi mới quen. Câu nào phù hợp nhất?
      stem_lang: vi
      options:
        - { id: y1s, text: Was machen Sie beruflich?, lang: de }
        - { id: y2s, text: Was machst du beruflich?, lang: de }
        - { id: y3s, text: Was sind Sie Beruf?, lang: de }
        - { id: y4s, text: Was ist Ihr von Beruf?, lang: de }
    answer:
      correct_option_id: y1s
    explanation:
      vi: "Người lớn tuổi mới quen → xưng Sie: Was machen Sie beruflich? Câu với du không lịch sự; \"Was sind Sie Beruf?\" thiếu von; \"Was ist Ihr von Beruf?\" sai cấu trúc."
    display_answer: Was machen Sie beruflich?
