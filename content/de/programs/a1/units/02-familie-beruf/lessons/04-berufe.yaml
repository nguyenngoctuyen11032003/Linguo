title:
  vi: Nghề nghiệp (Was sind Sie von Beruf?)
objectives:
  - vi: Hỏi và nói nghề nghiệp, nơi làm việc của mình và người khác.
  - vi: Nói nghề không dùng mạo từ (Ich bin Ingenieur) và dùng dạng -in cho người nữ (Ärztin, Köchin).
  - vi: Nghe hiểu một đoạn giới thiệu nghề ngắn.
