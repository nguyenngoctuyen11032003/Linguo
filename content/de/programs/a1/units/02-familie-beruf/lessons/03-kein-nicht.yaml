title:
  vi: ein, kein, nicht, doch (Das ist kein Hund!)
objectives:
  - vi: Gọi tên vật nuôi và đồ vật cá nhân với ein/eine.
  - vi: Phủ định danh từ bằng kein/keine và phủ định động từ, tính từ, danh từ có mạo từ xác định bằng nicht.
  - vi: Trả lời "có" cho câu hỏi phủ định bằng doch.
