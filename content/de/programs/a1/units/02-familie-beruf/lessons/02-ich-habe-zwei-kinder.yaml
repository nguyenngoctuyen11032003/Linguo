title:
  vi: Tôi có hai con – haben và số nhiều (Ich habe zwei Kinder)
objectives:
  - vi: Nói mình có ai trong gia đình bằng haben (ich habe, du hast, er hat…).
  - vi: Nói và hỏi tình trạng hôn nhân - verheiratet, ledig, geschieden.
  - vi: Nhận biết 5 kiểu số nhiều và dùng số nhiều sau số đếm (zwei Kinder, drei Söhne).
