    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-g-haben
    prompt:
      template: "A: {{b1}} ihr Kinder? B: Ja, wir {{b2}} eine Tochter."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 5 }
    answer:
