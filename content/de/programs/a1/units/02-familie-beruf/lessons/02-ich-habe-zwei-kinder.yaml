body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được \"Tôi đã kết hôn và có hai con\", \"Bà tôi có sáu đứa cháu\" và hỏi người khác có anh chị em hay con cái không."
  - type: explain
    text:
      vi: "Haben nghĩa là \"có\": ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben. Ở du và er/sie/es chữ b biến mất (hast, hat) – hãy học thuộc như một khối."
  - type: explain
    text:
      vi: "Tiếng Việt chỉ thêm \"hai\", \"những\" còn danh từ giữ nguyên; tiếng Đức đổi chính danh từ: ein Kind → zwei Kinder. Mạo từ số nhiều luôn là die, dù số ít là der, die hay das."
  - type: explain
    text:
      vi: "Có 5 kiểu số nhiều: -e (der Sohn → die Söhne), -(e)n (die Tante → die Tanten), -er (das Kind → die Kinder), -s (die Oma → die Omas), không thêm đuôi (der Onkel → die Onkel). Nhiều từ còn thêm biến âm: der Bruder → die Brüder, die Tochter → die Töchter."
  - type: explain
    text:
      vi: "Mẹo đoán: danh từ giống cái tận cùng -e thêm -n (Tante → Tanten); -in thêm -nen (Freundin → Freundinnen); giống đực, giống trung tận cùng -er, -el, -chen giữ nguyên (Onkel → Onkel); từ mượn tận cùng -o, -a, -y thêm -s (Opa → Opas). Mẹo có ngoại lệ, nên luôn học danh từ kèm số nhiều như trên thẻ từ: der Sohn, ¨-e."
  - type: explain
    text:
      vi: "Hỏi tình trạng hôn nhân: Sind Sie verheiratet? – Ja, ich bin verheiratet. / Nein, ich bin ledig. / Ich bin geschieden. Ba từ này đi với sein, không đi với haben; ở Đức người ta ít hỏi chuyện này với người mới quen."
  - type: explain
    text:
      vi: "Sau haben, danh từ giống cái, giống trung và số nhiều giữ nguyên dạng: Ich habe eine Schwester, ein Kind, zwei Brüder. Với danh từ giống đực, mạo từ sau haben đổi dạng – bạn sẽ học ở Unit 3, nên bài này chưa dùng."
  - type: deep_explain
    text:
      vi: "Biến âm ở số nhiều làm đổi cả âm đọc: Sohn /zoːn/ → Söhne /ˈzøːnə/, Bruder → Brüder, Mutter → Mütter. Khi máy không có phím ä/ö/ü, bạn gõ ae/oe/ue (Soehne) – máy chấm vẫn tính đúng. Sau số đếm từ 2 trở lên luôn dùng số nhiều (zwei Kinder, drei Töchter), còn ein/eine đi với số ít (eine Tochter). Oma, Opa là cách gọi thân mật; trên giấy tờ người ta viết die Großmutter, der Großvater. Tiếng Việt có chú, bác, cậu, dượng, cô, dì, thím, mợ; tiếng Đức chỉ có der Onkel và die Tante."
  - type: example
    target: "Ich habe drei Kinder: eine Tochter und zwei Söhne."
    target_lang: de
    translation:
      vi: "Tôi có ba con: một con gái và hai con trai."
    note:
      vi: "Kinder, Söhne là số nhiều (sau số đếm). eine Tochter đứng sau haben vẫn giữ nguyên dạng vì Tochter là giống cái."
  - type: example
    target: "Hast du Geschwister? – Ja, ich habe zwei Brüder und eine Schwester."
    target_lang: de
    translation:
      vi: "Bạn có anh chị em không? – Có, mình có hai anh em trai và một chị gái."
    note:
      vi: "Nói với bạn (du) nên dùng hast. Bruder → Brüder: số nhiều thêm biến âm, không thêm đuôi."
  - type: example
    target: "Sind Sie verheiratet, Frau Schmidt? – Nein, ich bin geschieden."
    target_lang: de
    translation:
      vi: "Chị Schmidt đã kết hôn chưa? – Chưa, tôi đã ly hôn."
    note:
      vi: "Hỏi lịch sự với Sie. verheiratet, geschieden đi với sein (bin), không đi với haben."
  - type: example
    target: Meine Großeltern haben sechs Enkel. Ich habe drei Cousins und zwei Cousinen.
    target_lang: de
    translation:
      vi: Ông bà tôi có sáu đứa cháu. Tôi có ba anh em họ và hai chị em họ.
    note:
      vi: "Großeltern là số nhiều nên dùng haben. Enkel số nhiều giữ nguyên (tận cùng -el); Cousin thêm -s, Cousine thêm -n."
  - type: common_mistake
    wrong: Ich habe zwei Kind.
    right: Ich habe zwei Kinder.
    target_lang: de
    note:
      vi: "Tiếng Việt nói \"hai con\" mà từ \"con\" không đổi; tiếng Đức sau số đếm từ 2 phải dùng số nhiều: Kinder."
  - type: common_mistake
    wrong: Ich habe zwei Sohns.
    right: Ich habe zwei Söhne.
    target_lang: de
    note:
      vi: "Đừng thêm -s kiểu tiếng Anh. Sohn có số nhiều -e và biến âm: Söhne."
  - type: common_mistake
    wrong: Du habst eine Schwester.
    right: Du hast eine Schwester.
    target_lang: de
    note:
      vi: "haben bất quy tắc: du hast, er hat (mất chữ b)."
  - type: common_mistake
    wrong: Ich habe verheiratet.
    right: Ich bin verheiratet.
    target_lang: de
    note:
      vi: "Tình trạng hôn nhân dùng sein: ich bin verheiratet / ledig / geschieden."
  - type: summary
    points:
      - vi: "haben: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben."
      - vi: "Số nhiều: -e (Söhne), -(e)n (Tanten), -er (Kinder), -s (Omas), không đuôi (Onkel); nhiều từ thêm biến âm (Brüder, Töchter)."
      - vi: "Mạo từ số nhiều luôn là die. Học danh từ luôn kèm số nhiều."
      - vi: "Sau số đếm từ 2 trở lên: số nhiều (zwei Kinder)."
      - vi: "verheiratet, ledig, geschieden đi với sein: Ich bin ledig."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a1u02l2-mcq-du-hast
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u02-g-haben
    prompt:
      stem: "Chọn dạng đúng cho chỗ trống: \"Du ___ zwei Brüder.\""
      stem_lang: vi
      options:
        - { id: h1s, text: hast, lang: de }
        - { id: h2b, text: habt, lang: de }
        - { id: h3t, text: hat, lang: de }
        - { id: h4e, text: habe, lang: de }
    answer:
      correct_option_id: h1s
    explanation:
      vi: "Với du, haben chia là hast (chữ b biến mất, không có dạng \"habst\"). hat dùng cho er/sie/es, habe cho ich, habt cho ihr."
    display_answer: hast

  - key: de:exercise:a1u02l2-mcq-toechter
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u02-tochter
    prompt:
      stem: "Chọn từ đúng cho chỗ trống: \"Meine Tante hat drei ___.\" (Cô tôi có ba con gái.)"
      stem_lang: vi
      options:
        - { id: k8a, text: Töchter, lang: de }
        - { id: k5n, text: Töchtern, lang: de }
        - { id: k7o, text: Tochter, lang: de }
    answer:
      correct_option_id: k8a
    explanation:
      vi: "Sau drei phải dùng số nhiều. die Tochter (¨-) chỉ thêm biến âm, không thêm đuôi: Töchter, giống die Mutter → die Mütter. Tochter là số ít; Töchtern là dạng của một cách khác (Dativ), không dùng ở đây."
    display_answer: Töchter

  - key: de:exercise:a1u02l2-listen-oma-enkel
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a1u02-enkel
    prompt:
      audio_asset_id: null
      fallback_text: Meine Oma hat sechs Enkel.
      options:
        - { id: e1k, text: Bà tôi có sáu đứa cháu., lang: vi }
        - { id: e2k, text: Bà tôi có bảy đứa cháu., lang: vi }
        - { id: e3k, text: Ông tôi có sáu đứa cháu., lang: vi }
        - { id: e4k, text: Bà tôi có sáu người con., lang: vi }
    answer:
      correct_option_id: e1k
    explanation:
      vi: "Oma là bà (ông là Opa), sechs là 6 (7 là sieben), Enkel là cháu (con là Kinder). Enkel số nhiều giữ nguyên vì tận cùng -el."
    display_answer: Bà tôi có sáu đứa cháu.

  - key: de:exercise:a1u02l2-fill-hat-haben
    type: fill_blank
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a1u02-g-haben
    prompt:
      template: "Mein Onkel {{b1}} drei Kinder und wir {{b2}} zwei Kinder."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 5 }
      hint_levels:
        - "Nghĩa của câu: Chú tôi có ba con, còn chúng tôi có hai con."
        - "Gợi ý: mein Onkel = er; wir là ngôi thứ nhất số nhiều."
    answer:
      blanks:
        b1: [hat]
        b2: [haben]
    known_wrong:
      - answer: habt
        feedback_vi: habt chỉ dùng với ihr; mein Onkel (= er) → hat, wir → haben.
        error_tag: verb_form
      - answer: hast
        feedback_vi: hast chỉ dùng với du; mein Onkel (= er) → hat, wir → haben.
        error_tag: verb_form
    explanation:
      vi: "Mein Onkel là ngôi thứ ba số ít (er) nên dùng hat; wir dùng haben."
    display_answer: Mein Onkel hat drei Kinder und wir haben zwei Kinder.

  # ---------------- recall ----------------
  - key: de:exercise:a1u02l2-fill-soehne-toechter
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-g-plural
    prompt:
      template: "Meine Tante hat zwei {{b1}} (der Sohn) und drei {{b2}} (die Tochter)."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 8 }
    answer:
      blanks:
        b1: [Söhne]
        b2: [Töchter]
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Sohns
        feedback_vi: "Không thêm -s kiểu tiếng Anh: der Sohn → die Söhne."
        error_tag: plural_form
      - answer: Sohn
        feedback_vi: Sau số đếm từ 2 phải dùng số nhiều - Söhne.
        error_tag: plural_form
      - answer: Tochters
        feedback_vi: "Không thêm -s: die Tochter → die Töchter (chỉ thêm biến âm)."
        error_tag: plural_form
      - answer: Tochtern
        feedback_vi: "die Tochter không thêm -n: số nhiều là Töchter (chỉ thêm biến âm)."
        error_tag: plural_form
      - answer: Tochter
        feedback_vi: Sau số đếm từ 2 phải dùng số nhiều - Töchter.
        error_tag: plural_form
    explanation:
      vi: "Sohn (¨-e) → Söhne: thêm -e và biến âm. Tochter (¨-) → Töchter: chỉ thêm biến âm. Sau zwei, drei luôn dùng số nhiều."
    display_answer: Meine Tante hat zwei Söhne und drei Töchter.

