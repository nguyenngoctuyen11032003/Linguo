        error_tag: verb_form
    explanation:
      vi: "Câu hỏi có/không: động từ đứng đầu. ihr (các bạn) → habt; wir → haben. eine Tochter là giống cái nên sau haben giữ nguyên."
    display_answer: "A: Habt ihr Kinder? B: Ja, wir haben eine Tochter."

  - key: de:exercise:a1u02l2-tr-verheiratet-kinder
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u02-verheiratet
    prompt:
      source_text: Tôi đã kết hôn và có hai con.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich bin verheiratet und habe zwei Kinder.
        - Ich bin verheiratet und ich habe zwei Kinder.
        - Ich bin verheiratet und habe 2 Kinder.
        - Ich bin verheiratet und ich habe 2 Kinder.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ich habe verheiratet und habe zwei Kinder.
        feedback_vi: "\"Đã kết hôn\" dùng sein: Ich bin verheiratet."
        error_tag: aux_verb
      - answer: Ich bin verheiratet und habe zwei Kind.
        feedback_vi: Sau zwei phải dùng số nhiều - Kinder.
        error_tag: plural_form
      - answer: Ich bin verheiratet und habe zwei Kinds.
        feedback_vi: "Số nhiều của das Kind là Kinder, không thêm -s."
        error_tag: plural_form
      - answer: Ich bin verheiratet und hat zwei Kinder.
        feedback_vi: Chủ ngữ là ich nên dùng habe.
        error_tag: verb_form
    explanation:
      vi: "\"Đã kết hôn\" là trạng thái hiện tại nên dùng Ich bin verheiratet (không cần thì quá khứ). \"Có hai con\" là habe zwei Kinder – Kind có số nhiều -er."
    display_answer: Ich bin verheiratet und habe zwei Kinder.

