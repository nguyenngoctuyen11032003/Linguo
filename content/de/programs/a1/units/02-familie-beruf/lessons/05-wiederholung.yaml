objectives:
  - vi: Đọc hiểu một đoạn văn ngắn giới thiệu một người và gia đình họ.
  - vi: Viết 4–5 câu (khoảng 30 từ) về gia đình và nghề của mình.
  - vi: Hỏi – đáp theo thẻ chủ đề Familie/Beruf (kiểu Sprechen Teil 2 của Start Deutsch 1).
  - vi: Dùng lại mein/meine, haben, số nhiều, kein/nicht, doch, nghề không mạo từ và dạng -in.
