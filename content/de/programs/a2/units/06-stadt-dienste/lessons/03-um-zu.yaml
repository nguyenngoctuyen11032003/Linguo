      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Trên gói hàng không ghi người gửi, vì vậy tôi gọi điện cho bưu điện.
        - Trên gói hàng không có tên người gửi, vì vậy tôi gọi điện cho bưu điện.
        - Trên gói hàng nhỏ không ghi người gửi nên tôi gọi điện cho bưu điện.
        - Trên gói hàng không ghi người gửi nên tôi gọi điện cho bưu điện.
        - Gói hàng không ghi người gửi, vì vậy tôi gọi điện cho bưu điện.
        - Trên gói hàng không ghi người gửi, cho nên tôi gọi điện đến bưu điện.
        - Trên gói bưu phẩm không ghi người gửi, vì thế tôi gọi cho bưu điện.
    rubric:
