  - key: de:exercise:a2u06l3-fill-deshalb-bringe
    type: fill_blank
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u06-g-deshalb
    prompt:
      template: "Der Brief ist sehr wichtig. {{b1}} {{b2}} (bringen) ich ihn direkt zur Post."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 7 }
      hint_levels:
        - "Nghĩa: Lá thư rất quan trọng. Vì vậy tôi mang nó thẳng ra bưu điện."
        - "Gợi ý: ô 1 là từ \"vì vậy\" (de…/des…/dar…); ô 2 là bringen chia theo ich."
    answer:
      blanks:
        b1: [Deshalb, Deswegen, Darum]
        b2: [bringe]
    known_wrong:
      - answer: Weil
        feedback_vi: "weil (vì) nêu nguyên nhân và đẩy động từ xuống cuối. Ở đây câu nêu kết quả và động từ đứng ngay sau, nên dùng Deshalb/Deswegen/Darum."
        error_tag: verb_position
    explanation:
      vi: "\"Vì vậy\" là deshalb (hoặc deswegen, darum). Từ này đứng ở vị trí 1, nên động từ bringe đứng ngay sau rồi mới đến ich."
    display_answer: "Der Brief ist sehr wichtig. Deshalb bringe ich ihn direkt zur Post."

