        feedback_vi: "ver- không tách được, nên zu đứng riêng phía trước: zu verschicken."
        error_tag: separable_prefix
    explanation:
      vi: "Cả hai cụm đều là um … zu (mục đích). einwerfen có tiền tố tách ein- → einzuwerfen; verschicken có tiền tố không tách ver- → zu verschicken."
    display_answer: "Ich gehe zum Briefkasten, um den Brief einzuwerfen. Dann gehe ich zur Post, um das Paket zu verschicken."

  - key: de:exercise:a2u06l3-tr-briefmarken-kaufen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u06-g-um-zu
    prompt:
      source_text: Tôi ra bưu điện để mua tem.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich gehe zur Post, um Briefmarken zu kaufen.
        - Ich gehe zur Post, um eine Briefmarke zu kaufen.
        - Um Briefmarken zu kaufen, gehe ich zur Post.
        - Um eine Briefmarke zu kaufen, gehe ich zur Post.
        - Ich gehe auf die Post, um Briefmarken zu kaufen.
    known_wrong:
      - answer: Ich gehe zur Post, um kaufen Briefmarken.
        feedback_vi: "Sau um, tân ngữ đứng trước và zu + nguyên thể đứng cuối: um Briefmarken zu kaufen."
        error_tag: word_order
      - answer: Ich gehe zur Post, um Briefmarken kaufen.
        feedback_vi: "um … zu cần zu trước nguyên thể ở cuối: um Briefmarken zu kaufen."
        error_tag: zu_infinitive
      - answer: Um Briefmarken zu kaufen, ich gehe zur Post.
        feedback_vi: "Cụm um … zu đứng đầu chiếm vị trí 1, nên động từ gehe đứng ngay sau dấu phẩy: …, gehe ich zur Post."
        error_tag: verb_position
    explanation:
      vi: "Mục đích, cùng một người làm → um … zu: um Briefmarken zu kaufen. \"Ra bưu điện\" là zur Post gehen (zu der Post)."
    display_answer: Ich gehe zur Post, um Briefmarken zu kaufen.

