  - key: de:exercise:a2u06l3-fill-einzuwerfen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u06-einwerfen
    prompt:
      template: "Ich gehe zum Briefkasten, um den Brief {{b1}} (einwerfen). Dann gehe ich zur Post, um das Paket {{b2}} (verschicken)."
      blanks:
        - { id: b1, width_hint: 11 }
        - { id: b2, width_hint: 14 }
    answer:
