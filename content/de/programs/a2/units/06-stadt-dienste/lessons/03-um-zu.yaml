title:
  vi: Để … – um … zu, deshalb (Ich gehe zur Post, um ein Paket abzuholen.)
objectives:
  - vi: Nói mục đích bằng um … zu khi gửi, nhận thư và bưu phẩm.
  - vi: Nói hệ quả bằng deshalb/deswegen/darum và đảo động từ lên ngay sau chúng.
  - vi: Phân biệt deshalb (vì vậy – động từ vị trí 2) với weil (vì – động từ cuối).
  - vi: Dùng từ vựng ở bưu điện – das Paket, die Briefmarke, der Absender, der Empfänger, der Briefkasten, ausfüllen, abholen.
