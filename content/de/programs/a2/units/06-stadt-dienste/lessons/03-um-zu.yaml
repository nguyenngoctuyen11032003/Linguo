body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "Tôi ra bưu điện để lấy gói hàng", "Gói hàng nặng quá, vì vậy tôi đi taxi" và xử lý được các việc thường gặp ở bưu điện.
  - type: explain
    text:
      vi: "um … zu nói mục đích (để …): um đứng đầu cụm, zu + nguyên thể đứng cuối cụm, trước cụm luôn có dấu phẩy. Ich gehe zur Post, um Briefmarken zu kaufen. Động từ tách vẫn chèn zu vào giữa: um ein Paket abzuholen."
  - type: explain
    text:
      vi: "Tiếng Việt \"để mua tem\" đặt động từ ngay sau \"để\"; tiếng Đức đẩy động từ về cuối: um Briefmarken zu kaufen. Thường thì người làm hai việc là một (tôi đi – tôi mua). Cụm um … zu cũng có thể đứng đầu câu: Um Briefmarken zu kaufen, gehe ich zur Post – động từ chính đứng ngay sau dấu phẩy."
  - type: explain
    text:
      vi: "deshalb, deswegen, darum đều nghĩa là \"vì vậy, cho nên\" và nêu kết quả. Khi đứng đầu câu, chúng chiếm vị trí 1 nên động từ đứng ngay sau, rồi mới đến chủ ngữ: Deshalb gehe ich zur Post. Tiếng Việt nói \"Vì vậy tôi đi\" nên người Việt hay viết sai thành Deshalb ich gehe."
  - type: explain
    text:
      vi: "So sánh với weil: weil nêu nguyên nhân và đẩy động từ xuống cuối (…, weil das Paket schwer ist); deshalb nêu kết quả và đi với động từ ở vị trí 2 (Das Paket ist schwer, deshalb nehme ich ein Taxi)."
  - type: deep_explain
    text:
      vi: "deshalb không bắt buộc đứng đầu: Ich nehme deshalb ein Taxi cũng đúng (đứng sau động từ). deswegen và deshalb dùng như nhau; darum hơi khẩu ngữ hơn một chút. Khi mục đích là của người khác (tôi gửi gói hàng để mẹ tôi có quà), tiếng Đức không dùng um … zu mà dùng damit – bạn sẽ học ở B1. Ở bưu điện: das Päckchen là gói nhỏ, thường rẻ hơn das Paket; kích thước, cân nặng tối đa và giá tùy hãng và có thể thay đổi, nên nhân viên sẽ cân (wiegen) gói hàng của bạn. Nếu người đưa thư (der Postbote) không gặp bạn, bạn có thể nhận một tờ giấy báo (der Zettel) ghi nơi đến lấy hàng (abholen) – mang theo giấy tờ tùy thân."
  - type: example
    target: Ich gehe zur Post, um ein Paket abzuholen.
    target_lang: de
    translation:
      vi: Tôi ra bưu điện để lấy một gói hàng.
    note:
      vi: "abholen là động từ tách → abzuholen; zur Post = zu der Post."
  - type: example
    target: Um Briefmarken zu kaufen, gehe ich zur Post.
    target_lang: de
    translation:
      vi: Để mua tem, tôi ra bưu điện.
    note:
      vi: "Cụm um … zu đứng đầu chiếm vị trí 1, nên động từ gehe đứng ngay sau dấu phẩy."
  - type: example
    target: Das Paket ist sehr schwer. Deshalb nehme ich ein Taxi.
    target_lang: de
    translation:
      vi: Gói hàng rất nặng. Vì vậy tôi đi taxi.
    note:
      vi: "Deshalb ở vị trí 1 → động từ nehme rồi mới đến ich."
  - type: example
    target: "Kannst du den Brief einwerfen? Der Briefkasten ist gleich an der Ecke."
    target_lang: de
    translation:
      vi: "Bạn bỏ lá thư vào thùng thư giúp mình nhé? Thùng thư ở ngay góc phố."
    note:
      vi: "Nhờ bạn bè nên dùng du. einwerfen là động từ tách: Kannst du … einwerfen?"
  - type: example
    target: "Füllen Sie bitte das Formular aus und schreiben Sie den Absender auf das Paket."
    target_lang: de
    translation:
      vi: "Xin anh/chị điền vào mẫu đơn và ghi người gửi lên gói hàng."
    note:
      vi: "Nhân viên bưu điện nói với khách nên dùng Sie và câu mệnh lệnh lịch sự."
  - type: common_mistake
    wrong: Ich gehe zur Post, um abholen ein Paket.
    right: Ich gehe zur Post, um ein Paket abzuholen.
    target_lang: de
    note:
      vi: "Sau um, tân ngữ đứng trước; zu + nguyên thể (abzuholen) đứng cuối cụm."
  - type: common_mistake
    wrong: Das Paket ist schwer. Deshalb ich nehme ein Taxi.
    right: Das Paket ist schwer. Deshalb nehme ich ein Taxi.
    target_lang: de
    note:
      vi: "deshalb chiếm vị trí 1 nên động từ phải đứng ngay sau nó, trước chủ ngữ."
  - type: common_mistake
    wrong: Ich gehe zur Post, um ein Paket zu abholen.
    right: Ich gehe zur Post, um ein Paket abzuholen.
    target_lang: de
    note:
      vi: "Động từ tách: zu chen vào giữa ab- và holen, viết liền."
  - type: summary
    points:
      - vi: "um + … + zu + nguyên thể = để … (cùng một người làm)."
      - vi: "Luôn có dấu phẩy trước um; động từ tách: abzuholen, einzuwerfen."
      - vi: "Um … zu …, + động từ + chủ ngữ … khi cụm um … zu đứng đầu."
      - vi: "deshalb/deswegen/darum ở vị trí 1 → động từ ngay sau: Deshalb nehme ich …"
      - vi: "weil → động từ cuối (nguyên nhân); deshalb → động từ vị trí 2 (kết quả)."
      - vi: "Bưu điện: das Paket, das Päckchen, die Briefmarke, der Briefkasten, der Absender, der Empfänger."
