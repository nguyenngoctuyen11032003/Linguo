    display_answer: "Lässt du dein Auto in der Werkstatt reparieren? – Nein, mein Bruder repariert es. Aber meine Schwester lässt ihr Auto immer reparieren."

  - key: de:exercise:a2u06l4-fill-darf-muss
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u06-g-muss-nicht-darf-nicht
    prompt:
      template: "Rauchen ist hier verboten: Sie {{b1}} (müssen/dürfen) hier nicht rauchen. Das Formular brauchen wir nicht: Sie {{b2}} (müssen/dürfen) es nicht ausfüllen."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 7 }
    answer:
      blanks:
        b1: [dürfen]
        b2: [müssen]
    explanation:
      vi: "verboten = bị cấm → nicht dürfen (không được phép). Không cần mẫu đơn → nicht müssen (không bắt buộc). Với Sie, động từ khuyết thiếu chia như nguyên thể: Sie dürfen, Sie müssen."
    display_answer: "Rauchen ist hier verboten: Sie dürfen hier nicht rauchen. Das Formular brauchen wir nicht: Sie müssen es nicht ausfüllen."

  - key: de:exercise:a2u06l4-tr-haare-schneiden
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u06-schneiden
    prompt:
      source_text: Ngày mai tôi đi cắt tóc ở tiệm.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Morgen lasse ich mir die Haare schneiden.
        - Ich lasse mir morgen die Haare schneiden.
        - Morgen lasse ich mir beim Friseur die Haare schneiden.
        - Ich lasse mir morgen beim Friseur die Haare schneiden.
        - Morgen lasse ich meine Haare schneiden.
        - Ich lasse morgen meine Haare schneiden.
        - Morgen gehe ich zum Friseur.
        - Ich gehe morgen zum Friseur.
    known_wrong:
      - answer: Morgen lasse ich mir schneiden die Haare.
        feedback_vi: "Nguyên thể schneiden đứng cuối câu: … die Haare schneiden."
        error_tag: verb_position
      - answer: Morgen ich lasse mir die Haare schneiden.
        feedback_vi: "Câu bắt đầu bằng Morgen thì động từ lasse đứng thứ hai: Morgen lasse ich …"
        error_tag: verb_position
    explanation:
      vi: "Người khác cắt cho mình → lassen + schneiden ở cuối: Ich lasse mir die Haare schneiden (mir chỉ tóc của mình). Cũng có thể nói đơn giản: Ich gehe morgen zum Friseur."
    display_answer: Morgen lasse ich mir die Haare schneiden.

