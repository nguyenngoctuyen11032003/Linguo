title:
  vi: Nhờ sửa – lassen; không cần ≠ không được (Ich lasse mein Fahrrad reparieren.)
objectives:
  - vi: Thuê dịch vụ – sửa xe, cắt tóc, giặt khô – bằng lassen + nguyên thể.
  - vi: Hỏi khi nào xong và chi phí bao nhiêu (Wann ist … fertig? Was kostet …?).
  - vi: Hiểu điều bị cấm và điều không bắt buộc – nicht dürfen ≠ nicht müssen, verboten, erlaubt.
  - vi: Nghe hiểu hội thoại ngắn ở xưởng sửa xe, tiệm giặt và lời nhắc trên biển báo.
