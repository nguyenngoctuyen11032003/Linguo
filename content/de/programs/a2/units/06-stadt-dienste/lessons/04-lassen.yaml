body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được "Tôi mang xe đạp đi sửa", "Tôi đi cắt tóc", hỏi được khi nào xong, và không còn nhầm "không cần" với "không được phép".
  - type: explain
    text:
      vi: "Tiếng Việt nói \"tôi đi sửa xe\", \"tôi đi cắt tóc\" dù người khác làm. Tiếng Đức phân biệt rõ: Ich repariere mein Fahrrad = tôi tự sửa; Ich lasse mein Fahrrad reparieren = tôi nhờ/thuê người sửa."
  - type: explain
    text:
      vi: "lassen chia ở vị trí 2, việc được làm (nguyên thể) đứng cuối câu – giống như với động từ khuyết thiếu và không có zu: Ich lasse meinen Anzug reinigen. lassen đổi nguyên âm ở du và er: du lässt, er/sie lässt."
  - type: explain
    text:
      vi: "nicht müssen = không cần (không bắt buộc): Sie müssen nicht warten. nicht dürfen = không được phép (bị cấm): Hier dürfen Sie nicht parken. Tiếng Việt \"không phải\" gần với nicht müssen, còn \"không được\" là nicht dürfen."
  - type: explain
    text:
      vi: "Nếu bạn biết tiếng Anh, cẩn thận: must not (cấm) tương ứng nicht dürfen, không phải nicht müssen. Trên biển báo thường chỉ có danh từ + verboten (Rauchen verboten) hoặc erlaubt."
  - type: deep_explain
    text:
      vi: "Cắt tóc của chính mình ở tiệm: Ich lasse mir die Haare schneiden – mir ở Dativ cho biết tóc là của mình (giống Ich wasche mir die Hände). Với động từ khuyết thiếu, lassen đứng cuối: Ich muss mein Fahrrad reparieren lassen. Ở Perfekt, lassen đi với nguyên thể thì dùng dạng lassen chứ không dùng gelassen: Ich habe mein Fahrrad reparieren lassen – bạn chỉ cần nhận ra dạng này. Với danh từ, \"không cần\" thường nói bằng kein: Sie müssen kein Formular ausfüllen. Ở tiệm dịch vụ, hai câu hỏi hữu ích: Wann ist es fertig? (khi nào xong) và Was kostet das? / Wie hoch sind die Kosten? (giá bao nhiêu). Ở nhiều tiệm cắt tóc và xưởng sửa xe tại Đức, nên đặt lịch hẹn trước; cách làm và giá mỗi nơi một khác."
  - type: example
    target: Ich lasse mein Fahrrad in der Werkstatt reparieren.
    target_lang: de
    translation:
      vi: Tôi mang xe đạp đến xưởng sửa.
    note:
      vi: "lasse ở vị trí 2, reparieren ở cuối câu. Người sửa là thợ ở xưởng, không phải tôi."
  - type: example
    target: "Lässt du dir die Haare beim Friseur schneiden? – Nein, meine Schwester schneidet sie mir."
    target_lang: de
    translation:
      vi: "Bạn cắt tóc ở tiệm à? – Không, chị gái mình cắt cho mình."
    note:
      vi: "Bạn bè nói với nhau nên dùng du. du lässt (a → ä); mir/dir ở Dativ chỉ tóc của chính mình."
  - type: example
    target: "Ich möchte meinen Anzug reinigen lassen. Wann ist er fertig? – Am Donnerstag."
    target_lang: de
    translation:
      vi: "Tôi muốn giặt khô bộ com-lê. Khi nào xong ạ? – Thứ Năm."
    note:
      vi: "Khách nói với nhân viên tiệm giặt. Có möchten nên lassen đứng cuối: reinigen lassen."
  - type: example
    target: Sie müssen nicht warten. Sie können das Fahrrad morgen abholen.
    target_lang: de
    translation:
      vi: Anh/chị không cần chờ. Mai anh/chị có thể đến lấy xe đạp.
    note:
      vi: "Thợ nói với khách nên dùng Sie. müssen nicht = không cần."
  - type: example
    target: Hier dürfen Sie nicht rauchen. Rauchen ist im ganzen Gebäude verboten.
    target_lang: de
    translation:
      vi: Ở đây anh/chị không được hút thuốc. Trong cả tòa nhà đều cấm hút thuốc.
    note:
      vi: "Nhân viên nói với khách nên dùng Sie. dürfen nicht = bị cấm; das Gebäude = tòa nhà."
  - type: common_mistake
    wrong: Du musst hier nicht rauchen.
    right: Du darfst hier nicht rauchen.
    target_lang: de
    note:
      vi: "Muốn nói \"cấm\" thì dùng nicht dürfen. Du musst hier nicht rauchen nghĩa là \"bạn không cần hút thuốc ở đây\"."
  - type: common_mistake
    wrong: Ich lasse reparieren mein Fahrrad.
    right: Ich lasse mein Fahrrad reparieren.
    target_lang: de
    note:
      vi: "Nguyên thể đi với lassen đứng cuối câu, tân ngữ đứng giữa."
  - type: common_mistake
    wrong: Ich lasse mein Fahrrad zu reparieren.
    right: Ich lasse mein Fahrrad reparieren.
    target_lang: de
    note:
      vi: "Sau lassen không có zu – giống như sau động từ khuyết thiếu."
  - type: summary
    points:
      - vi: "lassen + … + nguyên thể (cuối câu) = nhờ/thuê người khác làm."
      - vi: "ich lasse, du lässt, er/sie lässt; không có zu."
      - vi: "Ich repariere … = tự làm; Ich lasse … reparieren = người khác làm."
      - vi: "nicht müssen = không cần; nicht dürfen = không được phép."
      - vi: "verboten = bị cấm; erlaubt = được phép."
      - vi: "Ở tiệm: Wann ist … fertig? Was kostet das?"
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a2u06l4-listen-werkstatt
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u06-g-lassen
    prompt:
      audio_asset_id: null
      fallback_text: "Mein Fahrrad ist kaputt. Ich lasse es in der Werkstatt reparieren. Morgen ist es fertig."
      options:
        - { id: k2d, text: "Xe đạp của người nói bị hỏng; thợ ở xưởng sửa và mai là xong.", lang: vi }
        - { id: v6h, text: "Xe đạp của người nói bị hỏng; người nói tự sửa và mai là xong.", lang: vi }
        - { id: a1p, text: "Người nói mua một chiếc xe đạp mới ở xưởng.", lang: vi }
        - { id: y8e, text: "Xe đạp đã sửa xong hôm nay.", lang: vi }
    answer:
      correct_option_id: k2d
    explanation:
      vi: "Ich lasse es … reparieren = tôi để/nhờ (thợ) sửa, không phải tự sửa. Morgen ist es fertig = mai là xong."
    display_answer: "Xe đạp của người nói bị hỏng; thợ ở xưởng sửa và mai là xong."

  - key: de:exercise:a2u06l4-listen-parken
