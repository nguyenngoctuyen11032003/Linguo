    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u06-g-muss-nicht-darf-nicht
    prompt:
      audio_asset_id: null
      fallback_text: "Hier dürfen Sie leider nicht parken. Aber Sie müssen nicht weit gehen, der Parkplatz ist gleich um die Ecke."
      options:
        - { id: q4t, text: "Không được đỗ xe ở đây, nhưng bãi đỗ xe ở ngay góc phố nên không phải đi xa.", lang: vi }
        - { id: j9m, text: "Có thể đỗ xe ở đây, nhưng phải đi bộ xa.", lang: vi }
        - { id: o3c, text: "Không cần đỗ xe ở đây vì bãi đỗ xe ở xa.", lang: vi }
        - { id: d7s, text: "Không được đỗ xe ở đây và cũng không được đi bộ qua góc phố.", lang: vi }
    answer:
      correct_option_id: q4t
    explanation:
      vi: "dürfen nicht parken = không được phép đỗ xe; müssen nicht weit gehen = không cần đi xa; gleich um die Ecke = ngay góc phố."
    display_answer: "Không được đỗ xe ở đây, nhưng bãi đỗ xe ở ngay góc phố nên không phải đi xa."

  - key: de:exercise:a2u06l4-listen-reinigung
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u06-reinigung
    prompt:
      audio_asset_id: null
      fallback_text: "Guten Tag, ich möchte diesen Anzug reinigen lassen. Wann ist er fertig? – Am Donnerstag ab zehn Uhr. Das kostet zwölf Euro."
      options:
        - { id: x5b, text: "Bộ com-lê sẽ xong vào thứ Năm từ 10 giờ, giá 12 euro.", lang: vi }
        - { id: g8w, text: "Bộ com-lê sẽ xong vào thứ Ba lúc 10 giờ, giá 12 euro.", lang: vi }
        - { id: l2n, text: "Bộ com-lê sẽ xong vào thứ Năm lúc 12 giờ, giá 10 euro.", lang: vi }
        - { id: c6r, text: "Khách muốn mua một bộ com-lê giá 12 euro.", lang: vi }
    answer:
      correct_option_id: x5b
    explanation:
      vi: "reinigen lassen = mang đi giặt khô (người khác làm); am Donnerstag ab zehn Uhr = thứ Năm từ 10 giờ; zwölf Euro = 12 euro (Dienstag mới là thứ Ba)."
    display_answer: "Bộ com-lê sẽ xong vào thứ Năm từ 10 giờ, giá 12 euro."

  - key: de:exercise:a2u06l4-mcq-nicht-vorher-anrufen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u06-g-muss-nicht-darf-nicht
    prompt:
      stem: "Nhân viên tiệm muốn nói với khách: \"Anh/chị không cần gọi điện trước.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: f3k, text: "Sie müssen nicht vorher anrufen.", lang: de }
        - { id: t7a, text: "Sie dürfen nicht vorher anrufen.", lang: de }
        - { id: m1v, text: "Sie müssen nicht vorher anzurufen.", lang: de }
        - { id: b5y, text: "Sie lassen nicht vorher anrufen.", lang: de }
    answer:
      correct_option_id: f3k
    explanation:
      vi: "\"Không cần\" là nicht müssen. Sie dürfen nicht vorher anrufen nghĩa là \"không được phép gọi trước\" – sai ý. Sau müssen không có zu; lassen ở đây không có nghĩa."
    display_answer: "Sie müssen nicht vorher anrufen."

