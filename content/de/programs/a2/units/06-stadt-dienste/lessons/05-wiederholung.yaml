title:
  vi: Ôn tập – thông báo của cơ quan, e-mail hỏi thông tin (Wiederholung)
objectives:
  - vi: Đọc hiểu thông báo ngắn của cơ quan, ngân hàng, bưu điện (giờ mở cửa, giấy tờ cần mang, việc cần làm).
  - vi: Nghe hiểu lời gọi số ở cơ quan và tin nhắn thoại của tiệm dịch vụ.
  - vi: Viết e-mail trang trọng khoảng 50 từ hỏi giờ mở cửa và giấy tờ cần mang (gần với dạng viết e-mail trong đề Goethe A2).
  - vi: Ôn câu hỏi gián tiếp, ob, zu + nguyên thể, um … zu, deshalb, lassen và nicht müssen/nicht dürfen.
