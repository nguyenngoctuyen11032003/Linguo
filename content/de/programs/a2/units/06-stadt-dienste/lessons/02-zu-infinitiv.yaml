title:
  vi: Cần phải … – zu + nguyên thể (Es ist wichtig, ein Konto zu eröffnen.)
objectives:
  - vi: Làm các việc cơ bản ở ngân hàng – mở tài khoản, rút tiền, nộp tiền, chuyển khoản – và hỏi về phí.
  - vi: Nói điều quan trọng, khó hay dễ bằng Es ist wichtig/schwer/einfach, … zu …
  - vi: Nói điều mình quên, cố gắng hoặc không có thời gian/hứng làm (vergessen, versuchen, keine Zeit/Lust … zu …).
  - vi: Đặt zu đúng chỗ với động từ tách (abzuheben) và bỏ zu sau động từ khuyết thiếu.
estimated_minutes: 17
