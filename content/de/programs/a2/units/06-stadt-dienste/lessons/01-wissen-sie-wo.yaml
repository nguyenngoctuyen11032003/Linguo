body:
  - type: objective
    text:
      vi: Sau bài này, bạn hỏi được ở quầy thông tin hay ở tòa thị chính một cách lịch sự, ví dụ "Anh/chị có thể cho tôi biết phòng đồ thất lạc ở đâu không?" hay "Tôi không biết hôm nay thư viện có mở cửa không."
  - type: explain
    text:
      vi: "Câu hỏi trực tiếp \"Wo ist die Bibliothek?\" hơi cụt khi hỏi người lạ. Người Đức thường đặt nó sau một câu dẫn như Können Sie mir sagen, …? hoặc Wissen Sie, …? – lúc đó câu hỏi trở thành câu phụ và động từ ist chạy xuống cuối: …, wo die Bibliothek ist?"
  - type: explain
    text:
      vi: "Tiếng Việt chỉ thêm \"có biết … không\" mà không đổi trật tự (\"Anh có biết thư viện ở đâu không?\"). Tiếng Đức thì đổi: sau dấu phẩy là từ để hỏi, rồi chủ ngữ, các thành phần khác, cuối cùng là động từ chia – giống câu phụ với weil, dass mà bạn đã học."
  - type: explain
    text:
      vi: "Câu hỏi có/không (Ist das Fundbüro geöffnet?) không có từ để hỏi, nên khi thành câu gián tiếp bạn phải thêm ob (= liệu … có … không): Ich weiß nicht, ob das Fundbüro geöffnet ist. Đừng dùng wenn ở đây – wenn là \"nếu\" hoặc \"khi\"."
  - type: explain
    text:
      vi: "Dấu câu cuối câu do câu dẫn quyết định: Können Sie mir sagen, …? là câu hỏi nên có dấu hỏi; Ich weiß nicht, … . là câu kể nên có dấu chấm. Trả lời ngắn khi không biết: Das weiß ich leider nicht. / Ich weiß es nicht."
  - type: deep_explain
    text:
      vi: "Động từ tách viết liền lại ở cuối câu phụ: Wann fährt der Bus ab? → Wissen Sie, wann der Bus abfährt? Có động từ khuyết thiếu thì động từ khuyết thiếu đứng cuối cùng: Wo kann ich parken? → Können Sie mir sagen, wo ich parken kann? Các câu dẫn hay dùng: Können/Könnten Sie mir sagen, …?, Wissen Sie, …?, Ich möchte wissen, …, Ich weiß nicht, … . wissen chia bất quy tắc ở số ít: ich weiß, du weißt, er/sie weiß (không có -t ở ngôi 1 và 3). Ở cơ quan Đức bạn sẽ hay nghe zuständig (phụ trách): \"Dafür sind wir nicht zuständig\" nghĩa là bạn cần hỏi bộ phận khác. Ở nhiều cơ quan, bạn rút số thứ tự (eine Wartenummer ziehen) rồi chờ màn hình gọi số và quầy (Schalter); cách làm cụ thể mỗi nơi một khác."
  - type: example
    target: Entschuldigung, können Sie mir sagen, wo das Fundbüro ist?
    target_lang: de
    translation:
      vi: Xin lỗi, anh/chị có thể cho tôi biết phòng đồ thất lạc ở đâu không?
    note:
      vi: "Hỏi người lạ nên dùng Sie. Câu trực tiếp là Wo ist das Fundbüro? – trong câu gián tiếp, ist chạy xuống cuối."
  - type: example
    target: Wissen Sie, wann die Bibliothek heute öffnet?
    target_lang: de
    translation:
      vi: Anh/chị có biết hôm nay thư viện mấy giờ mở cửa không?
    note:
      vi: "Nói với nhân viên nên dùng Sie. Câu trực tiếp: Wann öffnet die Bibliothek heute?"
  - type: example
    target: Ich weiß nicht, ob die Polizei schon da ist.
    target_lang: de
    translation:
      vi: Tôi không biết cảnh sát đã đến chưa.
    note:
      vi: "Câu hỏi có/không Ist die Polizei schon da? → ob die Polizei schon da ist. Câu dẫn là câu kể nên kết thúc bằng dấu chấm."
  - type: example
    target: "Weißt du, welcher Schalter für Pässe zuständig ist? – Nein, frag doch an der Auskunft."
    target_lang: de
    translation:
      vi: "Bạn có biết quầy nào phụ trách hộ chiếu không? – Không, bạn hỏi ở quầy thông tin đi."
    note:
      vi: "Hai người bạn đi cùng nhau nên dùng du (weißt du, frag). welcher Schalter là chủ ngữ của câu phụ, zuständig ist đứng cuối."
  - type: example
    target: Können Sie mir sagen, ob ich hier eine Wartenummer brauche?
    target_lang: de
    translation:
      vi: Anh/chị có thể cho tôi biết ở đây tôi có cần lấy số thứ tự không?
    note:
      vi: "Hỏi nhân viên nên dùng Sie. Câu gốc: Brauche ich hier eine Wartenummer? (câu hỏi có/không → ob)."
  - type: common_mistake
    wrong: Können Sie mir sagen, wo ist die Bibliothek?
    right: Können Sie mir sagen, wo die Bibliothek ist?
    target_lang: de
    note:
      vi: "Sau câu dẫn, câu hỏi thành câu phụ: động từ ist phải xuống cuối."
  - type: common_mistake
    wrong: Ich weiß nicht, wenn das Rathaus heute geöffnet ist.
    right: Ich weiß nicht, ob das Rathaus heute geöffnet ist.
    target_lang: de
    note:
      vi: "\"Liệu … có … không\" là ob; wenn nghĩa là \"nếu\" hoặc \"khi\"."
  - type: common_mistake
    wrong: Wissen Sie, wann fährt der Bus ab?
    right: Wissen Sie, wann der Bus abfährt?
    target_lang: de
    note:
      vi: "Trong câu phụ, động từ tách viết liền và đứng cuối: abfährt."
  - type: summary
    points:
      - vi: "Câu dẫn + từ để hỏi + … + động từ cuối: Können Sie mir sagen, wo die Post ist?"
      - vi: "Câu hỏi có/không gián tiếp: ob + … + động từ cuối."
      - vi: "ob = liệu … có … không; wenn = nếu / khi."
      - vi: "Động từ tách viết liền ở cuối (abfährt); động từ khuyết thiếu đứng cuối cùng (parken kann)."
      - vi: "wissen: ich weiß, du weißt, er weiß, wir wissen."
      - vi: "Nơi dịch vụ công: das Rathaus, die Bibliothek, das Fundbüro, die Polizei, die Auskunft, der Schalter."
