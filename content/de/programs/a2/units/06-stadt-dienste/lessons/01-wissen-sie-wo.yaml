title:
  vi: Bạn có biết … không? – câu hỏi gián tiếp (Wissen Sie, wo …?)
objectives:
  - vi: Hỏi thông tin lịch sự ở quầy, ở cơ quan bằng câu hỏi gián tiếp (Können Sie mir sagen, wo …?).
  - vi: Đặt động từ ở cuối câu hỏi gián tiếp, kể cả động từ tách và động từ khuyết thiếu.
  - vi: Dùng ob cho câu hỏi có/không gián tiếp và phân biệt ob với wenn.
  - vi: Gọi tên các nơi dịch vụ công (das Rathaus, die Bibliothek, das Fundbüro, die Polizei) và chia đúng wissen.
