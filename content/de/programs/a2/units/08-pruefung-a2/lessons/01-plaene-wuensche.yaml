  - vi: Nói điều mình mong chờ, quan tâm, lo sợ, mơ ước bằng động từ đi với giới từ (sich freuen auf, sich interessieren für, Angst haben vor, träumen von).
  - vi: Trả lời câu hỏi về cuộc sống của mình theo kiểu Goethe-Zertifikat A2, phần thi nói Teil 2.
