title:
  vi: Cùng lên kế hoạch – đề nghị (Wollen wir …? Lass uns …!)
objectives:
  - vi: Đưa ra đề nghị bằng Gehen wir …!, Lass uns …!, Wollen wir …? và Wie wäre es mit …?
  - vi: Đồng ý, từ chối có lý do và đề nghị thời gian khác (kiểu Goethe-Zertifikat A2, phần thi nói Teil 3).
  - vi: Viết tin nhắn, e-mail ngắn để hẹn, hủy hoặc dời hẹn.
