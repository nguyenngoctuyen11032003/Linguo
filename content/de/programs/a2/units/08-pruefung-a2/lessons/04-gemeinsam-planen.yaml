    explanation:
      vi: "Wollen wir … grillen? là lời rủ (… nhé?), không phải câu hỏi \"có phải … không\" (müssen) hay chuyện đã qua. am Samstag = thứ Bảy (Chủ nhật là Sonntag)."
    display_answer: Thứ Bảy mình cùng nướng thịt nhé?

  - key: de:exercise:a2u08l4-listen-lieber-sonntag
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u08-g-vorschlag-wir
    prompt:
      audio_asset_id: null
      fallback_text: Am Samstag muss ich arbeiten. Lass uns lieber am Sonntag gehen.
      options:
        - { id: f9w, text: Thứ Bảy mình phải làm việc. Mình đi vào Chủ nhật thì hơn., lang: vi }
        - { id: c1q, text: Thứ Bảy mình phải làm việc nên mình không đi nữa., lang: vi }
        - { id: i6t, text: Chủ nhật mình phải làm việc. Mình đi vào thứ Bảy thì hơn., lang: vi }
        - { id: z4h, text: Thứ Bảy mình được nghỉ. Mình đi vào thứ Bảy nhé., lang: vi }
    answer:
      correct_option_id: f9w
    explanation:
      vi: "Am Samstag muss ich arbeiten = thứ Bảy mình phải làm việc; Lass uns lieber am Sonntag gehen = mình đi vào Chủ nhật thì hơn (lieber = thích hơn, tốt hơn). Người nói từ chối thứ Bảy nhưng đề nghị ngày khác."
    display_answer: Thứ Bảy mình phải làm việc. Mình đi vào Chủ nhật thì hơn.

  - key: de:exercise:a2u08l4-listen-einverstanden
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u08-einverstanden
    prompt:
      audio_asset_id: null
      fallback_text: Wie wäre es mit Freitagabend? – Da kann ich leider nicht. Geht es am Samstag? – Ja, Samstag passt mir gut. Einverstanden!
      options:
        - { id: d7m, text: Hai người hẹn vào thứ Bảy., lang: vi }
        - { id: w2n, text: Hai người hẹn vào tối thứ Sáu., lang: vi }
        - { id: g8b, text: Hai người không hẹn được ngày nào., lang: vi }
        - { id: k5y, text: Người thứ nhất không rảnh vào thứ Bảy., lang: vi }
    answer:
      correct_option_id: d7m
    explanation:
      vi: "Tối thứ Sáu người thứ hai không được (Da kann ich leider nicht), nên đề nghị thứ Bảy (Geht es am Samstag?). Người thứ nhất trả lời Samstag passt mir gut – Einverstanden! = thứ Bảy tiện, đồng ý."
    display_answer: Hai người hẹn vào thứ Bảy.

  # ---------------- recall ----------------
  - key: de:exercise:a2u08l4-fill-wollen-lass
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u08-g-vorschlag-wir
    prompt:
      template: "Mai: {{b1}} (wollen) wir am Samstag ins Schwimmbad gehen? – Tom: Gute Idee! Und danach {{b2}} (lassen) uns zusammen Pizza essen!"
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [Wollen]
        b2: [lass]
    known_wrong:
      - answer: lassen
        feedback_vi: "Tom nói với một người bạn (du) nên dùng lass uns. Lassen chỉ dùng trong Lassen Sie uns … (trang trọng)."
        error_tag: register_du_sie
      - answer: lasst
        feedback_vi: "lasst uns dùng khi nói với nhiều người (ihr). Tom chỉ nói với Mai → lass uns."
        error_tag: register_du_sie
    explanation:
      vi: "Wollen wir …? = mình … nhé? (wollen chia theo wir, nguyên thể gehen ở cuối). Với một người bạn: lass uns + nguyên thể cuối câu (essen)."
    display_answer: "Mai: Wollen (wollen) wir am Samstag ins Schwimmbad gehen? – Tom: Gute Idee! Und danach lass (lassen) uns zusammen Pizza essen!"

  - key: de:exercise:a2u08l4-fill-zusagen-absagen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u08-verschieben
    prompt:
      template: "Wählen Sie: verschieben – zugesagt – abgesagt. Ich kann am Freitag nicht. Können wir das Treffen auf Samstag {{b1}}? – Tom kommt gern, er hat schon {{b2}}. – Lena ist krank, sie hat leider {{b3}}."
      blanks:
        - { id: b1, width_hint: 11 }
        - { id: b2, width_hint: 9 }
        - { id: b3, width_hint: 9 }
    answer:
      blanks:
        b1: [verschieben]
        b2: [zugesagt]
        b3: [abgesagt]
    known_wrong:
      - answer: gezusagt
        feedback_vi: "zusagen là động từ tách: ge nằm sau tiền tố – zugesagt."
        error_tag: separable_prefix
      - answer: geabsagt
        feedback_vi: "absagen là động từ tách: ge nằm sau tiền tố – abgesagt."
        error_tag: separable_prefix
    explanation:
      vi: "Können wir … verschieben? – sau können là nguyên thể (dời hẹn). Tom kommt gern → er hat zugesagt (nhận lời). Lena ist krank → sie hat abgesagt (hủy). Hai Partizip đều có ge nằm sau tiền tố tách."
    display_answer: "Wählen Sie: verschieben – zugesagt – abgesagt. Ich kann am Freitag nicht. Können wir das Treffen auf Samstag verschieben? – Tom kommt gern, er hat schon zugesagt. – Lena ist krank, sie hat leider abgesagt."

  - key: de:exercise:a2u08l4-tr-lass-uns-kino
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u08-g-vorschlag-wir
    prompt:
      source_text: Mình đi xem phim ở rạp đi! (nói với một người bạn, dùng Lass uns …)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Lass uns ins Kino gehen!
        - Lass uns doch ins Kino gehen!
        - Lass uns zusammen ins Kino gehen!
        - Komm, lass uns ins Kino gehen!
    known_wrong:
      - answer: Lass uns gehen ins Kino!
        feedback_vi: "Sau Lass uns, nguyên thể gehen đứng cuối câu: Lass uns ins Kino gehen!"
        error_tag: word_order
      - answer: Lass wir ins Kino gehen!
        feedback_vi: "Sau lassen là đại từ Akkusativ: uns, không phải wir."
        error_tag: pronoun_case
      - answer: Lassen uns ins Kino gehen!
        feedback_vi: "Nói với một người bạn (du) thì dùng Lass uns …; Lassen chỉ đi với Sie."
        error_tag: register_du_sie
    explanation:
      vi: "\"Đi xem phim ở rạp\" là ins Kino gehen. Lời rủ với một người bạn: Lass uns + … + nguyên thể cuối câu."
    display_answer: Lass uns ins Kino gehen!

  - key: de:exercise:a2u08l4-tr-bescheid
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u08-bescheid-sagen
    prompt:
      source_text: Chậm nhất thứ Sáu báo mình biết nhé! (viết cho một người bạn)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Sag mir bitte bis Freitag Bescheid!
        - Sag mir bis Freitag Bescheid!
        - Bitte sag mir bis Freitag Bescheid!
        - Sag mir bitte bis spätestens Freitag Bescheid!
        - Sag mir bis spätestens Freitag Bescheid!
        - Gib mir bitte bis Freitag Bescheid!
        - Gib mir bis Freitag Bescheid!
        - Bitte gib mir bis Freitag Bescheid!
        - Sag mir bitte spätestens bis Freitag Bescheid!
        - Sag mir spätestens bis Freitag Bescheid!
    known_wrong:
      - answer: Sag mich bitte bis Freitag Bescheid!
        feedback_vi: "Người được báo ở Dativ: mir (không phải mich)."
        error_tag: case_dat_akk
    explanation:
      vi: "Bescheid sagen + Dativ = báo cho ai biết; với bạn bè dùng mệnh lệnh du: Sag mir … Bescheid. \"Chậm nhất thứ Sáu\" = bis Freitag (hoặc bis spätestens Freitag)."
    display_answer: Sag mir bitte bis Freitag Bescheid!

  # ---------------- application ----------------
  - key: de:exercise:a2u08l4-wb-wollen-wir-grillen
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u08-grillen
    prompt:
      instruction: "Sắp xếp thành lời rủ dạng câu hỏi với wollen: \"Chủ nhật mình cùng nướng thịt nhé?\""
      tokens:
        - { id: g-grillen, text: grillen }
        - { id: g-sonntag, text: Sonntag }
        - { id: g-uns, text: uns }
        - { id: g-wir, text: wir }
        - { id: g-zusammen, text: zusammen }
        - { id: g-wollen, text: wollen }
        - { id: g-am, text: am }
        - { id: g-lass, text: lass }
    answer:
      orders:
        - [g-wollen, g-wir, g-am, g-sonntag, g-zusammen, g-grillen]
    explanation:
      vi: "Lời rủ dạng câu hỏi: Wollen wir … ? – wollen đứng đầu, wir ngay sau, thời gian (am Sonntag) trước zusammen, nguyên thể grillen ở cuối. lass và uns là phương án nhiễu: Lass uns … là lời rủ dạng mệnh lệnh, không phải câu hỏi với wollen."
    display_answer: Wollen wir am Sonntag zusammen grillen?

  - key: de:exercise:a2u08l4-mcq-sprechen-teil3
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u08-wie-waere-es-mit
    prompt:
      stem: "Luyện kiểu thi nói Teil 3 (cùng lên kế hoạch). Bạn thi nói: \"Am Freitag kann ich leider nicht, da habe ich einen Arzttermin.\" Câu đáp nào phù hợp và đúng nhất?"
      stem_lang: vi
      options:
        - { id: s2v, text: Schade. Wie wäre es dann mit Samstag?, lang: de }
        - { id: e6p, text: Wie wäre es mit Samstag gehen?, lang: de }
        - { id: t9j, text: "Gut, dann gehen wir am Freitag.", lang: de }
        - { id: a4c, text: "Einverstanden, du hast am Freitag Zeit.", lang: de }
    answer:
      correct_option_id: s2v
    explanation:
      vi: "Bạn thi bận thứ Sáu, nên bạn tỏ ra tiếc (Schade) và đề nghị ngày khác: Wie wäre es dann mit Samstag? Sau mit chỉ có danh từ, nên \"mit Samstag gehen\" sai; hai câu còn lại bỏ qua việc bạn thi không rảnh thứ Sáu."
    display_answer: Schade. Wie wäre es dann mit Samstag?

  - key: de:exercise:a2u08l4-wb-weisst-du-wann
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u08-planen
    prompt:
      instruction: "Bạn viết e-mail hẹn đi xem phim. Sắp xếp thành câu: \"Bạn có biết mấy giờ phim bắt đầu không?\""
      tokens:
        - { id: w-beginnt, text: beginnt }
        - { id: w-film, text: Film }
        - { id: w-wann, text: wann }
        - { id: w-du, text: du }
        - { id: w-der, text: der }
        - { id: w-ob, text: ob }
        - { id: w-weisst, text: weißt }
