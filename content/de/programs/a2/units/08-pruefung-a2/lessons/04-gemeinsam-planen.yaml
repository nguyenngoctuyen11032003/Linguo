  # ---------------- recognition ----------------
  - key: de:exercise:a2u08l4-listen-grillen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2u08-g-vorschlag-wir
    prompt:
      audio_asset_id: null
      fallback_text: Wollen wir am Samstag zusammen grillen?
      options:
        - { id: x5d, text: Thứ Bảy mình cùng nướng thịt nhé?, lang: vi }
        - { id: n2k, text: Thứ Bảy vừa rồi bọn mình đã cùng nướng thịt., lang: vi }
        - { id: u8f, text: Thứ Bảy bọn mình có phải nướng thịt không?, lang: vi }
        - { id: b3s, text: Chủ nhật mình cùng nướng thịt nhé?, lang: vi }
    answer:
