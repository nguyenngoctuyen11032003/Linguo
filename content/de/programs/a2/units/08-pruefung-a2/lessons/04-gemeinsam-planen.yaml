body:
  - type: objective
    text:
      vi: "Sau bài này, bạn cùng một người bạn lên kế hoạch được: đề nghị, đồng ý hoặc từ chối có lý do và đề nghị thời gian khác, ví dụ: \"Wollen wir am Samstag grillen? – Am Samstag kann ich leider nicht. Wie wäre es mit Sonntag? – Einverstanden!\""
  - type: explain
    text:
      vi: "Bài này học bốn mẫu để rủ nhau cùng làm gì: Gehen wir ins Kino! (động từ đứng đầu + wir), Lass uns ins Kino gehen! (nguyên thể cuối câu), Wollen wir ins Kino gehen? (câu hỏi, nguyên thể cuối câu) và Wie wäre es mit + Dativ? Tiếng Việt chỉ thêm \"nhé\", \"đi\" vào cuối câu, còn tiếng Đức đổi vị trí động từ."
  - type: explain
    text:
      vi: "Theo chuẩn, Lass uns dùng khi nói với một người bạn (du), Lasst uns với nhiều người (ihr), Lassen Sie uns khi trang trọng; trong khẩu ngữ Lass uns cũng hay được dùng với cả nhóm. Sau Lass uns, động từ chính ở nguyên thể và đứng cuối câu: Lass uns am Samstag zusammen kochen."
  - type: explain
    text:
      vi: "Trả lời đề nghị: đồng ý – Gute Idee! / Einverstanden! / Gern!; từ chối lịch sự – Da kann ich leider nicht, kèm lý do (weil …, denn …) và một đề nghị khác (Wie wäre es mit …? Geht es am …?). Từ chối mà không đề nghị gì khác nghe khá cụt."
  - type: explain
    text:
      vi: "Phần thi nói Teil 3 của Goethe-Zertifikat A2 là cùng bạn thi lên kế hoạch một việc, mỗi người có lịch riêng (theo mô tả tại thời điểm soạn, cần đối chiếu quy định hiện hành). Phần thi viết có tin nhắn hoặc e-mail ngắn, thường phải trả lời đủ các ý đề bài nêu, ví dụ hẹn, hủy hoặc dời hẹn."
  - type: deep_explain
    text:
      vi: "Muốn nhẹ nhàng hơn, bạn có thể dùng könnten: Wir könnten am Samstag grillen. Hỏi đối phương có tiện không: Hast du am Samstag Zeit? Passt dir Samstag? (passen + Dativ ở đây nghĩa là \"tiện, hợp\"). Trong e-mail hẹn, nhớ xin trả lời: Sag mir bitte Bescheid, ob du kommst – câu phụ với ob (động từ cuối) bạn đã học ở A2U06."
  - type: example
    target: Wollen wir am Samstag grillen? – Gute Idee! Ich bringe einen Salat mit.
    target_lang: de
    translation:
      vi: Thứ Bảy mình nướng thịt nhé? – Ý hay đấy! Mình sẽ mang một món salad.
    note:
      vi: Bạn bè nói với nhau (du). Wollen wir … grillen – nguyên thể cuối câu; mitbringen tách – bringe … mit.
  - type: example
    target: Lass uns ins Kino gehen! – Heute kann ich leider nicht. Wie wäre es mit Freitag?
    target_lang: de
    translation:
      vi: Mình đi xem phim đi! – Hôm nay tiếc là mình không đi được. Thứ Sáu thì sao?
    note:
      vi: Lass uns + … + nguyên thể cuối câu. Từ chối kèm đề nghị khác bằng Wie wäre es mit …?
  - type: example
    target: Gehen wir doch ins Schwimmbad! Das Wetter ist so schön.
    target_lang: de
    translation:
      vi: Mình đi bơi đi! Trời đẹp thế này cơ mà.
    note:
      vi: Động từ đứng đầu + wir = lời rủ. doch làm lời đề nghị tự nhiên, mềm hơn.
  - type: example
    target: Leider muss ich für Samstag absagen. Können wir das Treffen auf nächste Woche verschieben?
    target_lang: de
    translation:
      vi: Tiếc là mình phải hủy hẹn thứ Bảy. Mình dời buổi gặp sang tuần sau được không?
    note:
      vi: absagen = hủy (hẹn); verschieben auf + Akkusativ = dời sang. Câu hỏi với können lịch sự hơn.
  - type: example
    target: "Liebe Anna, wir planen am Sonntag ein Picknick im Park. Wir treffen uns um zwölf Uhr am Eingang. Hast du Lust? Sag mir bitte bis Freitag Bescheid. Viele Grüße, Minh"
    target_lang: de
    translation:
      vi: "Anna thân mến, Chủ nhật bọn mình định đi picnic ở công viên. Bọn mình gặp nhau lúc mười hai giờ ở cổng vào. Bạn có muốn đi không? Chậm nhất thứ Sáu báo mình biết nhé. Thân chào, Minh"
    note:
      vi: "E-mail thân mật (du) đủ các ý: làm gì, khi nào, ở đâu, hỏi ý kiến và xin trả lời. der Eingang = cổng vào."
  - type: common_mistake
    wrong: Lass uns gehen ins Kino!
    right: Lass uns ins Kino gehen!
    target_lang: de
    note:
      vi: Sau Lass uns, động từ chính ở nguyên thể và đứng cuối câu.
  - type: common_mistake
    wrong: Lassen uns am Samstag grillen!
    right: Lass uns am Samstag grillen!
    target_lang: de
    note:
      vi: Với một người bạn dùng Lass uns. Lassen ở đầu câu chỉ dùng trong Lassen Sie uns … (trang trọng).
  - type: common_mistake
    wrong: Wie wäre es mit Samstag grillen?
    right: Wollen wir am Samstag grillen?
    target_lang: de
    note:
      vi: Sau Wie wäre es mit là danh từ hoặc cụm danh từ ở Dativ (Wie wäre es mit Samstag?), không phải động từ nguyên thể. Muốn nói cả hoạt động thì dùng Wollen wir … grillen?
  - type: summary
    points:
      - vi: "Rủ nhau: Gehen wir …! · Lass uns … + nguyên thể! · Wollen wir … + nguyên thể? · Wie wäre es mit + Dativ?"
      - vi: "Lass uns (với du) – Lasst uns (với ihr) – Lassen Sie uns (với Sie)."
      - vi: "Đồng ý: Gute Idee! Einverstanden! Gern!"
      - vi: "Từ chối: Da kann ich leider nicht + lý do + đề nghị khác."
      - vi: "zusagen (nhận lời) – absagen (hủy) – verschieben auf + Akkusativ (dời sang)."
      - vi: "E-mail hẹn: làm gì – khi nào – ở đâu – Sag mir bitte Bescheid."
