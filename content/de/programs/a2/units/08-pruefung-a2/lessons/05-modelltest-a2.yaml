title:
  vi: Đề mô phỏng Goethe-Zertifikat A2 (Modelltest A2)
objectives:
  - vi: Làm quen với các dạng bài của bốn phần Lesen, Hören, Schreiben, Sprechen trong Goethe-Zertifikat A2.
  - vi: Đọc tin ngắn, e-mail, quảng cáo và nghe thông báo, hội thoại để tìm thông tin chính.
  - vi: Viết tin nhắn ngắn (SMS) và e-mail thân mật hoặc trang trọng ngắn.
  - vi: Đặt câu hỏi theo thẻ từ khóa và cùng bạn thi lên kế hoạch.
