  - key: de:exercise:a2u08l3-listen-supermarkt
    type: listen
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:a2u08-durchsage
    prompt:
      audio_asset_id: null
      fallback_text: Liebe Kundinnen und Kunden, ab heute ist unser Markt bis zweiundzwanzig Uhr geöffnet. Übers Wochenende sind alle Getränke zehn Prozent billiger.
      options:
        - { id: m4c, text: Từ hôm nay siêu thị mở cửa đến 22 giờ; suốt cuối tuần mọi đồ uống rẻ hơn 10%., lang: vi }
