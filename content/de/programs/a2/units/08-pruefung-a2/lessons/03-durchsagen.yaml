title:
  vi: Thông báo ở nhà ga – giới từ thời gian (Ab Montag, in zwei Wochen)
objectives:
  - vi: Nghe hiểu thông báo ở nhà ga, siêu thị, trên radio và tin nhắn thoại.
  - vi: Dùng đúng giới từ thời gian ab, bis, in, für, über, zwischen và phân biệt với seit, vor.
  - vi: Luyện kỹ năng nghe theo kiểu Goethe-Zertifikat A2, phần thi Hören.
