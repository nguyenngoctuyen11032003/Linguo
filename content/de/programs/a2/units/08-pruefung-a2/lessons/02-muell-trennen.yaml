title:
  vi: Phân loại rác – biển báo nguyên thể (Müll trennen)
objectives:
  - vi: Đọc hiểu biển báo, nội quy nhà và hướng dẫn phân loại rác.
  - vi: Hiểu và viết câu yêu cầu dạng nguyên thể (Bitte nicht rauchen! Flaschen hier einwerfen.).
  - vi: Tìm thông tin cụ thể trong văn bản ngắn theo kiểu Goethe-Zertifikat A2, phần thi Lesen.
