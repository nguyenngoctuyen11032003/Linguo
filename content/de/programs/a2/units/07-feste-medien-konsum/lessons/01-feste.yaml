title:
  vi: Bạn thích lễ nào? – dieser, jeder, sondern (Welches Fest feiert ihr?)
objectives:
  - vi: Kể về Tết và các lễ của Đức (Weihnachten, Ostern, Silvester), nói mình ăn mừng ở đâu, với ai.
