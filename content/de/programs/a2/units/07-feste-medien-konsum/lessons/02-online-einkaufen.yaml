  - vi: Hỏi đổi hoặc trả hàng bằng câu lịch sự (Kann ich … umtauschen?).
  - vi: Dùng đúng đuôi tính từ khi không có mạo từ (frischer Kaffee, gute Qualität, Mit freundlichen Grüßen).
