    display_answer: "Bài báo nói về điện thoại di động trong trường học."

  - key: de:exercise:a2u07l3-mcq-geht-es-um
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u07-g-es-geht-um
    prompt:
      stem: "Chọn từ đúng: In der Sendung geht es ___ das Internet."
      stem_lang: vi
      options:
        - { id: u4a, text: um, lang: de }
        - { id: u7b, text: über, lang: de }
        - { id: u2c, text: von, lang: de }
        - { id: u9d, text: für, lang: de }
    answer:
      correct_option_id: u4a
    explanation:
      vi: "Cấu trúc cố định là es geht um + Akkusativ (das Internet). über chỉ dùng sau danh từ (eine Sendung über das Internet), không dùng sau geht es; von và für không đi với cấu trúc này."
    display_answer: um

