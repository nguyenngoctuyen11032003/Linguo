    display_answer: "Đó là một chương trình trò chuyện, phát lúc 10 giờ tối thứ Năm hằng tuần."

  # ---------------- recall ----------------
  - key: de:exercise:a2u07l3-fill-einen-eine
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u07-g-was-fuer-ein
    prompt:
      template: "Was für {{b1}} Film möchtest du sehen? – {{b2}} Komödie."
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 5 }
    answer:
      blanks:
        b1: [einen]
        b2: [Eine]
    known_wrong:
      - answer: ein
        feedback_vi: "Film là tân ngữ của sehen (Akkusativ), giống đực → einen; die Komödie → eine."
        error_tag: case_dat_akk
      - answer: einem
        feedback_vi: "für ở đây không quyết định cách; Film là tân ngữ → Akkusativ einen."
        error_tag: case_dat_akk
      - answer: einer
        feedback_vi: "die Komödie trả lời cho câu hỏi Akkusativ: eine Komödie."
        error_tag: case_dat_akk
    explanation:
      vi: "Trong was für ein, ein biến cách theo vai trò của danh từ: Film là tân ngữ của sehen → einen Film. Câu trả lời giữ cùng vai trò: die Komödie ở Akkusativ → eine Komödie."
    display_answer: "Was für einen Film möchtest du sehen? – Eine Komödie."

  - key: de:exercise:a2u07l3-fill-geht-um
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u07-g-es-geht-um
    prompt:
      template: "In dem Artikel {{b1}} es {{b2}} einen neuen Online-Shop."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [geht]
        b2: [um]
    known_wrong:
      - answer: über
        feedback_vi: "Sau geht es chỉ dùng um: es geht um einen neuen Online-Shop."
        error_tag: preposition
      - answer: von
        feedback_vi: "Cấu trúc cố định là es geht um + Akkusativ, không dùng von."
        error_tag: preposition
    explanation:
      vi: "Tóm nội dung bằng es geht um + Akkusativ. In dem Artikel đứng ở vị trí 1 nên động từ geht ở vị trí 2, es đứng ngay sau; einen neuen Online-Shop là Akkusativ sau um."
    display_answer: In dem Artikel geht es um einen neuen Online-Shop.

  - key: de:exercise:a2u07l3-tr-familie-berlin
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u07-g-es-geht-um
    prompt:
      source_text: Bộ phim nói về một gia đình ở Berlin.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - In dem Film geht es um eine Familie in Berlin.
        - Im Film geht es um eine Familie in Berlin.
        - Es geht in dem Film um eine Familie in Berlin.
        - Es geht im Film um eine Familie in Berlin.
        - Der Film handelt von einer Familie in Berlin.
    known_wrong:
      - answer: In dem Film geht es über eine Familie in Berlin.
        feedback_vi: "Sau geht es chỉ dùng um."
        error_tag: preposition
      - answer: In dem Film es geht um eine Familie in Berlin.
        feedback_vi: "In dem Film ở vị trí 1, nên động từ geht phải đứng ngay sau: In dem Film geht es …"
        error_tag: verb_position
      - answer: In dem Film geht es um einer Familie in Berlin.
        feedback_vi: "um đi với Akkusativ: eine Familie."
        error_tag: case_dat_akk
    explanation:
      vi: "\"Nói về\" khi tóm nội dung = es geht um + Akkusativ: In dem Film (Im Film) geht es um eine Familie. Động từ geht ở vị trí 2, nên nếu In dem Film đứng đầu thì es đứng sau geht."
    display_answer: In dem Film geht es um eine Familie in Berlin.

