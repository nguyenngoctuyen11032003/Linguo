body:
  - type: objective
    text:
      vi: 'Sau bài này, bạn hỏi được "Was für einen Film siehst du gern?" (bạn thích xem loại phim gì?) và kể ngắn gọn nội dung, ví dụ "In dem Film geht es um eine Familie in Berlin."'
  - type: explain
    text:
      vi: "Was für ein …? hỏi về loại, kiểu: Was für ein Film ist das? – Ein Krimi. welcher hỏi chọn cái nào trong mấy cái đã biết: Welcher Film läuft heute? – Der Krimi um acht. Tiếng Việt nói \"phim gì, loại phim nào\" cho cả hai, nên bạn hãy tự hỏi: mình muốn biết loại hay muốn chọn một cái cụ thể?"
  - type: explain
    text:
      vi: "Trong was für ein, chữ für không quyết định cách. ein biến cách theo vai trò của danh từ trong câu: Was für ein Film ist das? (Film là chủ ngữ – Nominativ), Was für einen Film siehst du? (Film là tân ngữ – Akkusativ). Câu trả lời dùng cùng dạng: – Einen Krimi."
  - type: explain
    text:
      vi: "Danh từ số nhiều và danh từ không đếm được thì bỏ ein: Was für Filme siehst du gern? Was für Musik hörst du? Đừng bỏ ein ở danh từ số ít đếm được: Was für ein Film?, không nói Was für Film?"
  - type: explain
    text:
      vi: "Tóm nội dung: (In dem Artikel / In der Serie / Im Film) geht es um + Akkusativ = (bài báo, phim) nói về …. Chủ ngữ luôn là es nên ở thì hiện tại động từ luôn là geht (kể cả khi chủ đề ở số nhiều), và trong cấu trúc này chỉ dùng um, không dùng über."
  - type: deep_explain
    text:
      vi: "Câu hỏi \"Worum geht es?\" (Nói về cái gì vậy?) rất hay gặp; worum = wo + um, bạn tạm học như một cụm cố định, quy tắc wo- + giới từ sẽ học ở B1. Sau danh từ thì dùng über bình thường: ein Artikel über das Internet, ein Film über Vietnam; động từ berichten cũng đi với über: Die Zeitung berichtet über das Fest. Trong văn nói, người Đức đôi khi tách was … für: Was siehst du gern für Filme? – nghĩa không đổi. Trên tivi Đức có nhiều kênh công cộng và tư nhân; kênh nào, giờ nào phát gì thì có thể thay đổi, hãy xem lịch phát sóng (das Programm)."
  - type: example
    target: "Was für eine Sendung ist das? – Eine Talkshow. Heute sprechen vier Gäste über das Internet."
    target_lang: de
    translation:
      vi: "Đây là chương trình gì vậy? – Một chương trình trò chuyện. Hôm nay bốn khách mời nói về Internet."
    note:
      vi: "die Sendung là chủ ngữ của ist → Nominativ: was für eine Sendung."
  - type: example
    target: "Was für einen Film möchtest du heute Abend sehen? – Einen Krimi oder eine Komödie."
    target_lang: de
    translation:
      vi: "Tối nay bạn muốn xem phim loại gì? – Phim trinh thám hoặc phim hài."
    note:
      vi: "Film là tân ngữ của sehen → Akkusativ: einen Film, einen Krimi, eine Komödie. Hai người bạn dùng du."
  - type: example
    target: "Welche Zeitung liest du? – Ich lese keine Zeitung. Es ist einfacher, die Nachrichten in einer App zu lesen."
    target_lang: de
    translation:
      vi: "Bạn đọc báo nào? – Mình không đọc báo. Đọc tin tức trên ứng dụng thì tiện hơn."
    note:
      vi: "welche Zeitung: hỏi tờ báo cụ thể nào (không phải loại báo). Es ist einfacher, … zu lesen: zu + nguyên thể ở cuối câu (đã học ở A2U06)."
  - type: example
    target: "In dem Artikel geht es um Werbung für Kinder."
    target_lang: de
    translation:
      vi: "Bài báo nói về quảng cáo dành cho trẻ em."
    note:
      vi: "geht es um + Akkusativ; Werbung không đếm được nên không có mạo từ."
  - type: example
    target: "Worum geht es in der Serie? – Es geht um eine Familie in Berlin und ihre Probleme."
    target_lang: de
    translation:
      vi: "Phim bộ đó nói về gì vậy? – Nó kể về một gia đình ở Berlin và những rắc rối của họ."
    note:
      vi: "Worum geht es? là câu hỏi cố định. eine Familie ở Akkusativ (giống cái không đổi)."
  - type: common_mistake
    wrong: Was für Film siehst du gern?
    right: Was für einen Film siehst du gern?
    target_lang: de
    note:
      vi: "Danh từ số ít đếm được cần ein; Film là tân ngữ nên einen. Hoặc dùng số nhiều: Was für Filme siehst du gern?"
  - type: common_mistake
    wrong: In dem Film geht es über einen Koch.
    right: In dem Film geht es um einen Koch.
    target_lang: de
    note:
      vi: "Khi nói nội dung (\"nói về\"), es geht luôn đi với um + Akkusativ."
  - type: common_mistake
    wrong: Was für ein Film möchtest du sehen?
    right: Was für einen Film möchtest du sehen?
    target_lang: de
    note:
      vi: "Film là tân ngữ của sehen (Akkusativ) nên einen; für không quyết định cách ở đây."
  - type: summary
    points:
      - vi: "Was für ein …? = loại gì; welcher …? = cái nào (trong nhóm đã biết)."
      - vi: "ein theo vai trò trong câu: Was für ein Film ist das? / Was für einen Film siehst du?"
      - vi: "Số nhiều, không đếm được: Was für Filme? Was für Musik?"
      - vi: "In dem Artikel geht es um + Akkusativ; không dùng über sau geht es."
      - vi: "die Zeitung, die Zeitschrift, das Fernsehen, die Sendung, die Serie, die Werbung, im Internet, die App."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a2u07l3-mcq-was-fuer-ein
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2u07-g-was-fuer-ein
    prompt:
      stem: "Chọn dạng đúng: ___ Film ist das? – Ein Krimi. (der Film)"
      stem_lang: vi
      options:
        - { id: w1a, text: Was für ein, lang: de }
        - { id: w6b, text: Was für einen, lang: de }
        - { id: w3c, text: Was für eine, lang: de }
        - { id: w8d, text: Was für, lang: de }
    answer:
      correct_option_id: w1a
    explanation:
      vi: "Câu trả lời là một loại phim nên hỏi bằng was für ein. Film là chủ ngữ của ist (Nominativ), giống đực → ein (für không làm đổi cách). Was für không có ein chỉ dùng với số nhiều hoặc danh từ không đếm được."
    display_answer: Was für ein

