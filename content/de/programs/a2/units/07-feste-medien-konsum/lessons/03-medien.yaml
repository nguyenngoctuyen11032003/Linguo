    item: de:item:a2u07-talkshow
    prompt:
      audio_asset_id: null
      fallback_text: Was für eine Sendung ist das? – Eine Talkshow. Sie läuft jeden Donnerstag um zehn Uhr abends.
      options:
        - { id: t3e, text: "Đó là một chương trình trò chuyện, phát lúc 10 giờ tối thứ Năm hằng tuần.", lang: vi }
        - { id: t6f, text: "Đó là một phim bộ, phát lúc 10 giờ tối thứ Năm hằng tuần.", lang: vi }
