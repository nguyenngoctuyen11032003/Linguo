title:
  vi: Blog của Anna – sở hữu cách tên riêng, đại từ bất định (Annas Blog – Hast du einen?)
objectives:
  - vi: Nói đồ vật của ai bằng tên riêng + -s (Annas Blog) hoặc von + Dativ (der Blog von Anna).
  - vi: Trả lời ngắn mà không lặp lại danh từ (Ja, ich habe einen. – Nein, ich habe keins.).
  - vi: Nghe hiểu một đoạn podcast, video ngắn về mạng xã hội.
  - vi: Nói về việc đăng, chia sẻ, tải lên, tải xuống trên mạng.
