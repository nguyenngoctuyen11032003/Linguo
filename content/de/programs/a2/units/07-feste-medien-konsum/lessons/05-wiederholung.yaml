      options:
        - { id: r4a, text: "Chỉ tuần này: tivi giảm 20 phần trăm và miễn phí vận chuyển.", lang: vi }
        - { id: r8b, text: "Chỉ tuần này: tivi giảm 12 phần trăm và miễn phí vận chuyển.", lang: vi }
        - { id: r2c, text: "Cả tháng này: mọi sản phẩm giảm 20 phần trăm.", lang: vi }
        - { id: r6d, text: "Chỉ tuần này: miễn phí vận chuyển, nhưng tivi không giảm giá.", lang: vi }
    answer:
