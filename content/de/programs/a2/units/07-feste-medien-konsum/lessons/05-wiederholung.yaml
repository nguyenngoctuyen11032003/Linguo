        - [t-was, t-soll, t-ich, t-fuer, t-einen, t-kuchen, t-mitbringen]
    explanation:
      vi: "Hỏi loại bánh → was für ein; Kuchen là tân ngữ của mitbringen nên einen (Akkusativ giống đực). soll ở vị trí 2, mitbringen (không tách sau động từ khiếm khuyết) ở cuối câu. Văn nói cũng hay tách: Was soll ich für einen Kuchen mitbringen?"
    display_answer: Was für einen Kuchen soll ich mitbringen?

