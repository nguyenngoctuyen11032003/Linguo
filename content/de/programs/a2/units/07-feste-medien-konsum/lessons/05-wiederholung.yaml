      vi: "nur diese Woche = chỉ tuần này; zwanzig Prozent Rabatt auf alle Fernseher = giảm 20 % cho mọi tivi (zwanzig = 20, zwölf = 12); kostenloser Versand = miễn phí vận chuyển."
    display_answer: "Chỉ tuần này: tivi giảm 20 phần trăm và miễn phí vận chuyển."

  - key: de:exercise:a2u07l5-listen-silvester
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u07-silvester
    prompt:
      audio_asset_id: null
      fallback_text: Hallo Jonas, hier ist Lena. Wir feiern Silvester nicht bei Tom, sondern bei mir. Kannst du ein paar Kerzen mitbringen? Bis dann!
      options:
        - { id: s1a, text: "Lena nhắn Jonas: giao thừa tổ chức ở nhà Lena, nhờ Jonas mang mấy cây nến.", lang: vi }
        - { id: s5b, text: "Lena nhắn Jonas: giao thừa tổ chức ở nhà Tom, nhờ Jonas mang mấy cây nến.", lang: vi }
        - { id: s9c, text: "Lena nhắn Jonas: giao thừa tổ chức ở nhà Lena, nhờ Jonas mang quà.", lang: vi }
        - { id: s3d, text: "Lena không đón giao thừa năm nay.", lang: vi }
    answer:
      correct_option_id: s1a
    explanation:
      vi: "nicht bei Tom, sondern bei mir = không ở nhà Tom mà ở nhà mình (Lena). ein paar Kerzen = vài cây nến; mitbringen = mang theo."
    display_answer: "Lena nhắn Jonas: giao thừa tổ chức ở nhà Lena, nhờ Jonas mang mấy cây nến."

  # ---------------- recall ----------------
  - key: de:exercise:a2u07l5-fill-liebe-viele
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u08-g-anrede-gruss
    prompt:
      template: "{{b1}} Anna, am Freitag feiere ich meinen Geburtstag. Kommst du? {{b2}} Grüße, Minh"
      blanks:
        - { id: b1, width_hint: 6 }
        - { id: b2, width_hint: 9 }
    answer:
      blanks:
        b1: [Liebe]
        b2: [Viele, Liebe, Herzliche]
    known_wrong:
      - answer: Lieber
        feedback_vi: "Anna là nữ nên Liebe Anna; Lieber chỉ dùng cho nam (Lieber Tom)."
        error_tag: gender
      - answer: Viel
        feedback_vi: "Grüße là số nhiều, không mạo từ: viele Grüße (đuôi -e)."
        error_tag: adj_ending
      - answer: Vielen
        feedback_vi: "Lời chào cuối thư ở đây là Akkusativ số nhiều: Viele Grüße (Vielen Dank là cụm khác)."
        error_tag: adj_ending
    explanation:
      vi: "Thư thân mật cho một bạn nữ mở đầu bằng Liebe Anna. Cuối thư: Viele Grüße, Liebe Grüße hoặc Herzliche Grüße – Grüße là số nhiều không mạo từ nên tính từ có đuôi -e."
    display_answer: "Liebe Anna, am Freitag feiere ich meinen Geburtstag. Kommst du? Viele Grüße, Minh"

  - key: de:exercise:a2u07l5-fill-geehrte-freundlichen
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u07-g-adj-nullartikel
    prompt:
      template: "Sehr {{b1}} Damen und Herren, die Jacke ist leider zu klein. Ich schicke sie zurück. Mit {{b2}} Grüßen, Lan"
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 12 }
    answer:
      blanks:
        b1: [geehrte]
        b2: [freundlichen]
    known_wrong:
      - answer: geehrten
        feedback_vi: "Lời xưng hô không mạo từ, số nhiều ở Nominativ: Sehr geehrte Damen und Herren (đuôi -e)."
        error_tag: adj_ending
      - answer: freundliche
        feedback_vi: "mit + Dativ số nhiều không mạo từ: freundlichen Grüßen (đuôi -en)."
        error_tag: adj_ending
    explanation:
      vi: "Thư gửi cửa hàng là thư trang trọng. Sehr geehrte Damen und Herren: số nhiều không mạo từ → -e. Mit freundlichen Grüßen: mit + Dativ số nhiều → -en."
    display_answer: "Sehr geehrte Damen und Herren, die Jacke ist leider zu klein. Ich schicke sie zurück. Mit freundlichen Grüßen, Lan"

