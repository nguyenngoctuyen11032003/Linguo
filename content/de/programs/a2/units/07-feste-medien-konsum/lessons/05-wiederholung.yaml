body:
  - type: objective
    text:
      vi: Bài này ôn cả unit qua những văn bản rất hay gặp trong đời sống và trong đề Goethe A2 – thư mời dự tiệc, lời đánh giá sản phẩm, bài đăng diễn đàn, quảng cáo trên radio – và bạn tự viết một thư mời ngắn.
  - type: explain
    text:
      vi: "Thư mời thân mật (khoảng 50 từ) cần đủ bốn ý: dịp gì (Ich feiere meinen Geburtstag), khi nào (am Samstag um 19 Uhr), ở đâu (bei mir zu Hause), mang gì hoặc trả lời trước khi nào (Bringt bitte … mit. Sagt bitte bis Donnerstag Bescheid.). Mở đầu Liebe … / Lieber …, kết thúc Viele Grüße hoặc Liebe Grüße."
  - type: explain
    text:
      vi: "Đọc lời đánh giá: tìm tính từ (gute Qualität, schlechter Service) và từ nối aber, sondern – thông tin quan trọng thường nằm sau chúng. Đọc bài diễn đàn: tìm câu có es geht um để biết chủ đề."
  - type: explain
    text:
      vi: "Nghe quảng cáo radio: bắt ba thông tin – bán gì, giảm bao nhiêu (… Prozent Rabatt), đến khi nào (nur diese Woche, bis Samstag). Câu quảng cáo hay bỏ mạo từ nên tính từ mang đuôi đầy đủ: kostenloser Versand, frisches Obst."
  - type: deep_explain
    text:
      vi: "Trong lời đánh giá và bài diễn đàn bạn sẽ gặp Präteritum của động từ mạnh: kam (kommen), gab (geben), fand (finden), ging (gehen) – chỉ cần nhận ra nghĩa, khi nói vẫn có thể dùng Perfekt. Trong thư mời gửi nhiều bạn cùng lúc, dùng ihr: Kommt ihr? Bringt bitte … mit! Thư gửi cửa hàng hay cơ quan thì trang trọng: Sehr geehrte Damen und Herren … Mit freundlichen Grüßen. Thông tin trong các văn bản luyện tập ở bài này là tự soạn."
  - type: example
    target: "Liebe Freunde, am Samstag feiere ich meinen Geburtstag und ich lade euch herzlich ein! Die Party beginnt um 19 Uhr bei mir zu Hause. Bringt bitte keine Geschenke mit, sondern einen Salat oder einen Kuchen. Sagt mir bitte bis Donnerstag Bescheid, ob ihr kommt. Viele Grüße, Mai"
    target_lang: de
    translation:
      vi: "Các bạn thân mến, thứ Bảy này mình tổ chức sinh nhật và trân trọng mời các bạn! Tiệc bắt đầu lúc 19 giờ ở nhà mình. Đừng mang quà nhé, mà mang một món salad hoặc một cái bánh. Trước thứ Năm báo mình biết các bạn có đến không nhé. Thân, Mai"
    note:
      vi: "Thư mẫu khoảng 50 từ, đủ bốn ý: dịp, giờ, nơi, mang gì + hạn trả lời. Viết cho nhiều bạn nên dùng ihr/euch."
  - type: example
    target: "Schöne Farbe, aber schlechte Qualität. Die Jacke kam erst nach zehn Tagen und nach einer Woche war sie kaputt. Ich habe sie zurückgeschickt."
    target_lang: de
    translation:
      vi: "Màu đẹp nhưng chất lượng kém. Áo khoác mãi mười ngày sau mới đến, và một tuần sau thì đã hỏng. Tôi đã gửi trả lại."
    note:
      vi: "Đánh giá ngắn bỏ mạo từ: schöne Farbe, schlechte Qualität. kam là Präteritum của kommen."
  - type: example
    target: "Nur diese Woche: zwanzig Prozent Rabatt auf alle Fernseher und kostenloser Versand!"
    target_lang: de
    translation:
      vi: "Chỉ trong tuần này: giảm hai mươi phần trăm cho mọi tivi và miễn phí vận chuyển!"
    note:
      vi: "Câu quảng cáo radio: nur diese Woche = chỉ tuần này; der Fernseher = cái tivi."
  - type: common_mistake
    wrong: Bringt bitte keine Geschenke mit, aber einen Salat.
    right: Bringt bitte keine Geschenke mit, sondern einen Salat.
    target_lang: de
    note:
      vi: "Vế sau thay thế vế trước (không phải quà mà là salad) nên dùng sondern."
  - type: common_mistake
    wrong: Viel Grüße
    right: Viele Grüße
    target_lang: de
    note:
      vi: "Grüße là số nhiều, không mạo từ: viele Grüße (đuôi -e)."
  - type: common_mistake
    wrong: Lieber Anna,
    right: Liebe Anna,
    target_lang: de
    note:
      vi: "Viết cho nữ: Liebe …; viết cho nam: Lieber … (Lieber Tom)."
  - type: summary
    points:
      - vi: "Thư mời: dịp – thời gian – địa điểm – mang gì/hạn trả lời; Liebe/Lieber …, Viele Grüße."
      - vi: "Thư trang trọng: Sehr geehrte Damen und Herren … Mit freundlichen Grüßen."
      - vi: "Đánh giá, quảng cáo: tính từ không mạo từ (gute Qualität, kostenloser Versand)."
      - vi: "Thông tin đúng nằm sau sondern; chủ đề nằm sau es geht um."
      - vi: "Annas Blog; Ja, ich habe einen. – Nein, ich habe keins."
exercises:
  # ---------------- recognition: đọc ----------------
  - key: de:exercise:a2u07l5-mcq-lesen-einladung
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u08-einladung
    prompt:
      stem: "Đọc thư mời: \"Liebe Freunde, am Samstag feiere ich meinen Geburtstag. Die Party beginnt um 19 Uhr bei mir zu Hause. Bringt bitte keine Geschenke mit, sondern einen Salat oder einen Kuchen. Viele Grüße, Mai\" Mai muốn khách mang gì?"
      stem_lang: vi
      options:
        - { id: e1a, text: "Một món salad hoặc một cái bánh, không mang quà.", lang: vi }
        - { id: e4b, text: "Một món quà nhỏ và một cái bánh.", lang: vi }
        - { id: e7c, text: "Chỉ mang quà, không mang đồ ăn.", lang: vi }
        - { id: e9d, text: "Không cần mang gì.", lang: vi }
    answer:
      correct_option_id: e1a
    explanation:
      vi: "keine Geschenke …, sondern einen Salat oder einen Kuchen = không mang quà mà mang salad hoặc bánh. Thông tin đúng nằm sau sondern."
    display_answer: "Một món salad hoặc một cái bánh, không mang quà."

  - key: de:exercise:a2u07l5-mcq-lesen-bewertung
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u07-qualitaet
    prompt:
      stem: "Đọc lời đánh giá: \"Schöne Farbe, aber schlechte Qualität. Die Jacke kam erst nach zehn Tagen und nach einer Woche war sie kaputt. Ich habe sie zurückgeschickt.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: b2a, text: "Người viết đã gửi trả áo khoác vì chất lượng kém.", lang: vi }
        - { id: b5b, text: "Người viết hài lòng với chất lượng áo khoác.", lang: vi }
        - { id: b8c, text: "Áo khoác được giao sau một tuần.", lang: vi }
        - { id: b3d, text: "Người viết đã đổi áo lấy màu khác.", lang: vi }
    answer:
      correct_option_id: b2a
    explanation:
      vi: "schlechte Qualität = chất lượng kém; war sie kaputt = áo đã hỏng; Ich habe sie zurückgeschickt = tôi đã gửi trả. Áo đến sau mười ngày (kam erst nach zehn Tagen), hỏng sau một tuần; người viết trả hàng chứ không đổi (umtauschen)."
    display_answer: "Người viết đã gửi trả áo khoác vì chất lượng kém."

  - key: de:exercise:a2u07l5-mcq-lesen-forum
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u07-serie
    prompt:
      stem: "Đọc bài đăng trên diễn đàn: \"Was für Sendungen seht ihr gern? Fernsehen finde ich langweilig. Die Nachrichten lese ich lieber in einer App. Aber am Wochenende sehe ich mit meiner Schwester Serien im Internet, am liebsten Krimis. Tuan\" Câu nào đúng về Tuấn?"
      stem_lang: vi
      options:
        - { id: f2a, text: "Tuấn đọc tin tức trên một ứng dụng và cuối tuần xem phim bộ, thích nhất phim trinh thám.", lang: vi }
        - { id: f6b, text: "Tuấn xem tivi mỗi ngày, thích nhất phim hài.", lang: vi }
        - { id: f9c, text: "Tuấn không bao giờ xem phim bộ.", lang: vi }
        - { id: f4d, text: "Tuấn đọc báo giấy cùng chị gái.", lang: vi }
    answer:
      correct_option_id: f2a
    explanation:
      vi: "Fernsehen finde ich langweilig = mình thấy truyền hình chán; Die Nachrichten lese ich lieber in einer App = tin tức mình thích đọc trên ứng dụng hơn; am Wochenende … Serien im Internet, am liebsten Krimis = cuối tuần xem phim bộ trên mạng, thích nhất phim trinh thám. Tuấn không nói gì về báo giấy."
    display_answer: "Tuấn đọc tin tức trên một ứng dụng và cuối tuần xem phim bộ, thích nhất phim trinh thám."

  - key: de:exercise:a2u07l5-mcq-lesen-kommentar
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u07-g-es-geht-um
    prompt:
      stem: "Đọc bình luận dưới một bài blog: \"Toller Artikel! In Annas Text geht es um Weihnachten in Deutschland. Bei uns in Vietnam ist Tết wichtiger. Jeder Gast bringt ein kleines Geschenk mit und wir essen zusammen. Linh\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: c3a, text: "Bài của Anna nói về Giáng sinh ở Đức; với Linh, Tết quan trọng hơn.", lang: vi }
        - { id: c7b, text: "Bài của Linh nói về Tết ở Việt Nam.", lang: vi }
        - { id: c1c, text: "Ở Việt Nam, khách không mang quà khi đến chơi Tết.", lang: vi }
        - { id: c5d, text: "Anna đón Giáng sinh ở Việt Nam.", lang: vi }
    answer:
      correct_option_id: c3a
    explanation:
      vi: "In Annas Text geht es um Weihnachten in Deutschland = bài của Anna nói về Giáng sinh ở Đức. Linh viết bình luận: Tết wichtiger = Tết quan trọng hơn; jeder Gast bringt ein kleines Geschenk mit = mỗi vị khách mang một món quà nhỏ."
    display_answer: "Bài của Anna nói về Giáng sinh ở Đức; với Linh, Tết quan trọng hơn."

