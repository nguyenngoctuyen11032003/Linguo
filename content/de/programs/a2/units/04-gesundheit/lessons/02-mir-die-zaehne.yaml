title:
  vi: Tôi đánh răng – phản thân Dativ (Ich putze mir die Zähne.)
objectives:
  - vi: Kể việc vệ sinh cá nhân và mặc quần áo buổi sáng (Ich wasche mich, ich putze mir die Zähne, ich ziehe mich an).
  - vi: Chọn đúng đại từ phản thân Akkusativ (mich, dich) hay Dativ (mir, dir) khi câu đã có tân ngữ.
  - vi: Nói bộ phận cơ thể với mạo từ xác định (mir die Hände, dir die Haare).
estimated_minutes: 16
skills: [grammar, vocabulary, speaking]
