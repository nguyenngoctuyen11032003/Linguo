  - key: de:exercise:a2u04l4-tr-fieber-zu-hause
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u04-g-wenn-konditional
    prompt:
      source_text: "Nếu bạn bị sốt thì ở nhà đi. (nói với bạn thân)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Wenn du Fieber hast, bleib zu Hause.
        - Wenn du Fieber hast, bleibe zu Hause.
        - Wenn du Fieber hast, dann bleib zu Hause.
        - Wenn du Fieber hast, dann bleibe zu Hause.
        - Bleib zu Hause, wenn du Fieber hast.
        - Bleibe zu Hause, wenn du Fieber hast.
        - Wenn du Fieber hast, bleib zuhause.
        - Bleib zuhause, wenn du Fieber hast.
        - Wenn du Fieber hast, bleib daheim.
    known_wrong:
      - answer: Wenn du hast Fieber, bleib zu Hause.
        feedback_vi: "Trong câu wenn, động từ hast đứng cuối: wenn du Fieber hast."
        error_tag: verb_position
      - answer: Wenn du Fieber hast, du bleibst zu Hause.
        feedback_vi: "Sau câu wenn, động từ câu chính đứng ngay sau dấu phẩy; ở đây là lời khuyên nên dùng mệnh lệnh: bleib zu Hause."
        error_tag: verb_position
      - answer: Wann du Fieber hast, bleib zu Hause.
        feedback_vi: "wann là \"khi nào?\" để hỏi; \"nếu\" là wenn."
        error_tag: conjunction
      - answer: Wenn du Fieber hast, bleib nach Hause.
        feedback_vi: "Ở nhà (Wo?) là zu Hause; nach Hause là về nhà."
        error_tag: preposition
    explanation:
      vi: "wenn + câu phụ, động từ hast ở cuối. Câu chính là mệnh lệnh với du: bleib (hoặc bleibe) zu Hause. Câu wenn có thể đứng trước hoặc sau."
    display_answer: Wenn du Fieber hast, bleib zu Hause.

