  # ---------------- recall ----------------
  - key: de:exercise:a2u04l4-fill-hast-musst
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u04-g-wenn-konditional
    prompt:
      template: "Wenn du Fieber {{b1}} (haben), {{b2}} (müssen) du im Bett bleiben."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 6 }
    answer:
      blanks:
        b1: [hast]
        b2: [musst]
    known_wrong:
      - answer: hat
        feedback_vi: "Chủ ngữ là du: du hast."
        error_tag: verb_form
      - answer: muss
        feedback_vi: "Chủ ngữ là du: du musst."
        error_tag: verb_form
      - answer: müsst
        feedback_vi: "müsst là dạng của ihr; với du là musst (không có ü)."
        error_tag: verb_form
    explanation:
      vi: "Trong câu wenn, hast đứng cuối. Câu chính bắt đầu ngay bằng động từ musst (vì câu wenn đã chiếm vị trí 1), nguyên thể bleiben ở cuối."
    display_answer: Wenn du Fieber hast, musst du im Bett bleiben.

