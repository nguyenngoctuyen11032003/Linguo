  - vi: Hiểu lời dặn của dược sĩ và khi nào nên đi bác sĩ.
  - vi: Nói điều kiện với wenn, động từ đứng cuối câu phụ (Wenn du Fieber hast, geh zum Arzt).
  - vi: Gọi xe cứu thương trong trường hợp khẩn cấp.
