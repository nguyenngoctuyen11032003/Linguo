body:
  - type: objective
    text:
      vi: "Sau bài này, bạn mua được thuốc ở hiệu thuốc, hiểu dược sĩ dặn uống thế nào, nói được \"nếu … thì …\" bằng wenn và biết gọi xe cứu thương khi khẩn cấp."
  - type: explain
    text:
      vi: "wenn mở đầu câu phụ nêu một điều kiện có thể xảy ra, giống \"nếu\" trong tiếng Việt. Như weil và dass, động từ chia của câu wenn đứng cuối: wenn du Fieber hast (không phải wenn du hast Fieber). Hai câu luôn ngăn nhau bằng dấu phẩy."
  - type: explain
    text:
      vi: "Câu wenn đứng đầu chiếm vị trí 1, nên câu chính bắt đầu ngay bằng động từ: Wenn es nicht besser wird, gehe ich zum Arzt. Tiếng Việt có chữ \"thì\", tiếng Đức không cần (có thể thêm dann: …, dann gehe ich zum Arzt). Câu chính là mệnh lệnh thì động từ vốn đã đứng đầu: Wenn du Fieber hast, geh zum Arzt."
  - type: explain
    text:
      vi: "Câu wenn cũng có thể đứng sau, khi đó câu chính giữ trật tự bình thường: Ich gehe zum Arzt, wenn es nicht besser wird. Đừng nhầm wenn (nếu) với wann (khi nào? – từ để hỏi)."
  - type: explain
    text:
      vi: "Ở hiệu thuốc: Ich brauche etwas gegen Kopfschmerzen. · Haben Sie eine Salbe gegen …? · Wie oft muss ich das einnehmen? Dược sĩ hay hỏi: Haben Sie Allergien? Nehmen Sie andere Medikamente? Viên thuốc thì einnehmen hoặc nehmen, không dùng trinken."
  - type: deep_explain
    text:
      vi: "Ở Đức, thuốc kê đơn chỉ bán ở hiệu thuốc (Apotheke) và cần đơn bác sĩ (Rezept); nhiều thuốc không cần đơn cũng chỉ có ở Apotheke chứ không có ở siêu thị. Khi đi khám, bạn mang thẻ bảo hiểm (Versichertenkarte) của Krankenkasse. Số khẩn cấp ở Đức: 112 (cấp cứu, cứu hoả), 110 (cảnh sát); ở Áo và Thụy Sĩ xe cứu thương là 144, số 112 cũng gọi được – các thông tin này có thể thay đổi, hãy kiểm tra lại khi bạn sang. Bài học chỉ dạy ngôn ngữ, không thay lời khuyên của bác sĩ hay dược sĩ."
  - type: example
    target: Wenn du Fieber hast, geh zum Arzt.
    target_lang: de
    translation:
      vi: Nếu bạn bị sốt thì đi khám bác sĩ đi.
    note:
      vi: "Nói với bạn (du). hast đứng cuối câu wenn; câu chính là mệnh lệnh: geh."
  - type: example
    target: Wenn die Schmerzen nicht besser werden, gehe ich morgen zum Arzt.
    target_lang: de
    translation:
      vi: Nếu không đỡ đau thì mai tôi sẽ đi khám bác sĩ.
    note:
      vi: "werden ở cuối câu wenn; câu chính bắt đầu ngay bằng gehe (động từ ở vị trí 2 của cả câu)."
  - type: example
    target: Ich lege mich hin, wenn ich Kopfschmerzen habe.
    target_lang: de
    translation:
      vi: Tôi nằm nghỉ khi bị đau đầu.
    note:
      vi: "Câu wenn đứng sau: câu chính giữ trật tự bình thường, habe ở cuối câu phụ."
  - type: example
    target: "Haben Sie etwas gegen Husten? – Ja, die Tabletten hier sind rezeptfrei."
    target_lang: de
    translation:
      vi: "Chị có thuốc gì trị ho không? – Có, thuốc viên này không cần đơn."
    note:
      vi: "Khách và dược sĩ nói Sie. gegen + Akkusativ: etwas gegen Husten."
  - type: example
    target: Wenn ich ein Rezept habe, gehe ich in die Apotheke.
    target_lang: de
    translation:
      vi: Khi có đơn thuốc, tôi đi đến hiệu thuốc.
    note:
      vi: "habe ở cuối câu wenn; gehe đứng ngay sau dấu phẩy. in die Apotheke: đi tới (Wohin?) nên dùng Akkusativ."
  - type: example
    target: Nehmen Sie die Tabletten dreimal am Tag nach dem Essen ein.
    target_lang: de
    translation:
      vi: Anh/chị uống thuốc ba lần một ngày, sau khi ăn.
    note:
      vi: "Mệnh lệnh với Sie; einnehmen là động từ tách nên ein ra cuối câu."
  - type: example
    target: Hilfe! Das ist ein Notfall. Rufen Sie bitte einen Krankenwagen!
    target_lang: de
    translation:
      vi: Cứu với! Đây là trường hợp khẩn cấp. Làm ơn gọi xe cứu thương!
    note:
      vi: "Nhờ người lạ (Sie). einen Krankenwagen là Akkusativ giống đực."
  - type: common_mistake
    wrong: Wenn du hast Fieber, bleib zu Hause.
    right: Wenn du Fieber hast, bleib zu Hause.
    target_lang: de
    note:
      vi: "Trong câu wenn, động từ chia đứng cuối."
  - type: common_mistake
    wrong: Wenn es nicht besser wird, ich gehe zum Arzt.
    right: Wenn es nicht besser wird, gehe ich zum Arzt.
    target_lang: de
    note:
      vi: "Câu wenn đứng đầu chiếm vị trí 1, nên động từ câu chính đứng ngay sau dấu phẩy, chủ ngữ theo sau."
  - type: common_mistake
    wrong: Wann du Fieber hast, geh zum Arzt.
    right: Wenn du Fieber hast, geh zum Arzt.
    target_lang: de
    note:
      vi: "wann là \"khi nào?\" để hỏi; \"nếu\" là wenn."
  - type: summary
    points:
      - vi: "wenn = nếu (điều kiện có thể xảy ra); động từ chia ở cuối câu wenn."
      - vi: "Câu wenn đứng đầu → câu chính bắt đầu bằng động từ: Wenn …, gehe ich …"
      - vi: "Câu wenn đứng sau → câu chính bình thường: Ich gehe …, wenn …"
      - vi: "wenn (nếu) ≠ wann (khi nào?)."
      - vi: "Hiệu thuốc: etwas gegen Kopfschmerzen, rezeptfrei, einnehmen, Nebenwirkungen."
      - vi: "Khẩn cấp ở Đức: 112 (cấp cứu, cứu hoả), 110 (cảnh sát) – kiểm tra lại khi sang."
