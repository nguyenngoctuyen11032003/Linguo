body:
  - type: objective
    text:
      vi: "Sau bài này, bạn khuyên được người khác một cách nhẹ nhàng (Du solltest mehr schlafen), gợi ý một cách làm (Du könntest die Treppe nehmen) và nhờ người lạ thật lịch sự (Könnten Sie mir bitte helfen?)."
  - type: explain
    text:
      vi: "Muốn khuyên \"bạn nên …\", dùng sollte + động từ nguyên thể ở cuối câu: Du solltest weniger arbeiten. Chia: ich sollte, du solltest, er/sie sollte, wir sollten, ihr solltet, sie/Sie sollten – ngôi ich và er không có đuôi, như các modal khác."
  - type: explain
    text:
      vi: "sollte trông giống hệt Präteritum của sollen bạn đã học (Ich sollte gestern arbeiten = hôm qua tôi đã phải làm); ngữ cảnh cho bạn biết nghĩa. Muốn gợi ý một khả năng, dùng könnte (có ö): Du könntest am Abend joggen. Đừng nhầm với konnte (không có umlaut) = đã có thể."
  - type: explain
    text:
      vi: "Du sollst … (sollen ở hiện tại) là lời dặn, lời yêu cầu của người khác, nghe nặng hơn: Der Arzt sagt, du sollst nicht rauchen. Khi chính bạn khuyên bạn bè, dùng du solltest."
  - type: explain
    text:
      vi: "Nhờ lịch sự hơn Können Sie …?: Könnten Sie …? hoặc Würden Sie … + nguyên thể ở cuối: Würden Sie bitte langsamer sprechen? Khuyên kiểu \"nếu tôi là bạn\": An deiner Stelle würde ich … (với người lạ: An Ihrer Stelle …)."
  - type: deep_explain
    text:
      vi: "sollte, könnte, würde đều thuộc Konjunktiv II – dạng giả định giúp câu mềm hơn, giống tiếng Việt thêm \"nên\", \"có lẽ\", \"phiền … được không\". Ở A2 bạn chỉ cần học chúng như mẫu câu; hệ thống đầy đủ (wäre, hätte, điều kiện không có thật) học ở B1. Ich hätte gern … bạn học ở A1 cũng là Konjunktiv II. Chỉ cần một dạng lịch sự: Könnten Sie mir helfen? hoặc Würden Sie mir helfen? – gộp cả hai thành Würden Sie mir helfen können? nghe rườm rà. Với người chưa thân, nhất là về cân nặng hay ăn uống, nhiều người Đức chỉ khuyên khi được hỏi."
  - type: example
    target: Du arbeitest zu viel. Du solltest mehr schlafen.
    target_lang: de
    translation:
      vi: Bạn làm việc nhiều quá. Bạn nên ngủ nhiều hơn.
    note:
      vi: "Khuyên bạn bè (du): solltest, nguyên thể schlafen ở cuối câu."
  - type: example
    target: Herr Becker, Sie sollten sich mehr bewegen.
    target_lang: de
    translation:
      vi: Ông Becker, ông nên vận động nhiều hơn.
    note:
      vi: "Nói với người lạ, người lớn tuổi (Sie): Sie sollten. sich bewegen là động từ phản thân của bài 1."
  - type: example
    target: Du könntest die Treppe nehmen und nicht den Aufzug.
    target_lang: de
    translation:
      vi: Bạn có thể đi cầu thang bộ thay vì đi thang máy.
    note:
      vi: "könntest = gợi ý một cách làm, nhẹ hơn solltest."
  - type: example
    target: Entschuldigung, könnten Sie mir bitte helfen?
    target_lang: de
    translation:
      vi: Xin lỗi, anh/chị có thể giúp tôi được không ạ?
    note:
      vi: "Hỏi người lạ (Sie). helfen đi với Dativ: mir."
  - type: example
    target: Würden Sie bitte das Fenster aufmachen?
    target_lang: de
    translation:
      vi: Phiền anh/chị mở giúp cửa sổ được không ạ?
    note:
      vi: "Würden Sie + nguyên thể ở cuối câu = lời nhờ rất lịch sự."
  - type: example
    target: An deiner Stelle würde ich mit dem Rauchen aufhören.
    target_lang: de
    translation:
      vi: Nếu mình là bạn, mình sẽ bỏ thuốc lá.
    note:
      vi: "Nói với bạn (du): deiner. An deiner Stelle ở vị trí 1, würde ở vị trí 2; aufhören là động từ tách nhưng đứng nguyên ở cuối vì là nguyên thể."
  - type: example
    target: "Der Arzt sagt, ich soll nicht mehr rauchen. – Dann solltest du wirklich aufhören."
    target_lang: de
    translation:
      vi: "Bác sĩ bảo tớ không được hút thuốc nữa. – Thế thì cậu thật sự nên bỏ đi."
    note:
      vi: "soll = lời dặn của bác sĩ (sollen ở hiện tại); solltest = lời khuyên của người bạn (Konjunktiv II)."
  - type: example
    target: "Ich konnte gestern nicht schlafen. – Du solltest am Abend keinen Kaffee trinken."
    target_lang: de
    translation:
      vi: "Hôm qua mình không ngủ được. – Buổi tối bạn không nên uống cà phê."
    note:
      vi: "konnte (không có ö) là quá khứ \"đã có thể\"; solltest ở đây là lời khuyên cho hiện tại."
  - type: common_mistake
    wrong: Du solltest mehr schläfst.
    right: Du solltest mehr schlafen.
    target_lang: de
    note:
      vi: "Sau sollte, động từ chính ở nguyên thể và đứng cuối câu."
  - type: common_mistake
    wrong: Könntest Sie mir helfen?
    right: Könnten Sie mir helfen?
    target_lang: de
    note:
      vi: "Với Sie, động từ chia như số nhiều: könnten (có -n)."
  - type: common_mistake
    wrong: An deiner Stelle ich würde zum Arzt gehen.
    right: An deiner Stelle würde ich zum Arzt gehen.
    target_lang: de
    note:
      vi: "An deiner Stelle đã chiếm vị trí 1, nên würde phải đứng ngay sau."
  - type: common_mistake
    wrong: Du sollst weniger arbeiten.
    right: Du solltest weniger arbeiten.
    target_lang: de
    note:
      vi: "Câu bên trái đúng ngữ pháp, nhưng là lời dặn, yêu cầu (như bác sĩ dặn: bạn phải làm ít đi), nghe nặng. Khi chính bạn khuyên bạn bè, tự nhiên hơn là du solltest."
  - type: summary
    points:
      - vi: "Khuyên: du solltest / Sie sollten + nguyên thể cuối câu."
      - vi: "Gợi ý: du könntest / Sie könnten (có ö, khác konnte)."
      - vi: "du sollst = lời dặn của người khác; du solltest = lời khuyên."
      - vi: "Nhờ lịch sự: Könnten Sie …? · Würden Sie …?"
      - vi: "An deiner Stelle / An Ihrer Stelle würde ich … (V2: würde đứng thứ hai)."
      - vi: "Từ vựng lối sống: rauchen, mit dem Rauchen aufhören, abnehmen, zunehmen, regelmäßig, ungesund."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a2u04l3-mcq-solltest-schlafen
