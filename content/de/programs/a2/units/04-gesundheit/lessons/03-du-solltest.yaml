      stem_lang: vi
      options:
        - { id: m2w, text: Du solltest mehr schlafen., lang: de }
        - { id: t8r, text: Du solltest mehr schläfst., lang: de }
        - { id: h5c, text: Du solltet mehr schlafen., lang: de }
        - { id: z1q, text: Du solltest schlafen mehr., lang: de }
    answer:
      correct_option_id: m2w
    explanation:
      vi: "du → solltest; động từ chính schlafen ở nguyên thể và đứng cuối câu. solltet là dạng của ihr."
    display_answer: Du solltest mehr schlafen.

  - key: de:exercise:a2u04l3-mcq-koenntest
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u04-g-sollte-koennte
    prompt:
      stem: "Chọn từ đúng để gợi ý cho bạn: \"Du ___ am Abend joggen.\" (Bạn có thể thử chạy bộ buổi tối.)"
      stem_lang: vi
      options:
        - { id: c4n, text: könntest, lang: de }
        - { id: v7e, text: konntest, lang: de }
        - { id: k2s, text: könntet, lang: de }
        - { id: w6b, text: könnte, lang: de }
    answer:
      correct_option_id: c4n
    explanation:
      vi: "Gợi ý dùng könnte (có ö); với du thêm -st: könntest. konntest (không có ö) là quá khứ \"đã có thể\"; könntet là dạng của ihr; könnte là dạng của ich/er."
    display_answer: könntest

  - key: de:exercise:a2u04l3-listen-an-deiner-stelle
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-g-wuerde-hoeflich
    prompt:
      audio_asset_id: null
      fallback_text: "An deiner Stelle würde ich weniger Kaffee trinken und mehr Wasser."
      options:
        - { id: f8j, text: "Người nói khuyên uống ít cà phê hơn và uống nhiều nước hơn.", lang: vi }
        - { id: q3y, text: "Người nói khuyên uống nhiều cà phê hơn và ít nước hơn.", lang: vi }
        - { id: e7u, text: "Người nói kể rằng mình đã bỏ cà phê.", lang: vi }
        - { id: r1d, text: "Người nói mời bạn đi uống cà phê.", lang: vi }
    answer:
      correct_option_id: f8j
    explanation:
      vi: "An deiner Stelle würde ich … = nếu mình là bạn, mình sẽ … (một lời khuyên). weniger Kaffee = ít cà phê hơn, mehr Wasser = nhiều nước hơn."
    display_answer: "Người nói khuyên uống ít cà phê hơn và uống nhiều nước hơn."

  # ---------------- recall ----------------
  - key: de:exercise:a2u04l3-fill-solltest-solltet
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u04-g-sollte-koennte
    prompt:
      template: "Du {{b1}} (sollen, Konjunktiv II) weniger Süßigkeiten essen, und ihr {{b2}} (sollen, Konjunktiv II) mehr Sport machen."
      blanks:
        - { id: b1, width_hint: 9 }
        - { id: b2, width_hint: 8 }
    answer:
      blanks:
        b1: [solltest]
        b2: [solltet]
    known_wrong:
      - answer: sollst
        feedback_vi: "sollst là lời dặn ở hiện tại. Lời khuyên dùng Konjunktiv II: du solltest."
        error_tag: konjunktiv_form
      - answer: sollt
        feedback_vi: "sollt là lời dặn ở hiện tại. Lời khuyên với ihr: solltet."
        error_tag: konjunktiv_form
      - answer: sollten
        feedback_vi: "sollten là dạng của wir, sie, Sie. du → solltest, ihr → solltet."
        error_tag: verb_form
    explanation:
      vi: "Lời khuyên dùng sollte + đuôi theo ngôi: du solltest, ihr solltet. Động từ chính (essen, machen) ở nguyên thể cuối câu."
    display_answer: Du solltest weniger Süßigkeiten essen, und ihr solltet mehr Sport machen.

  - key: de:exercise:a2u04l3-fill-koennten-wuerden
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u04-g-wuerde-hoeflich
    prompt:
      template: "{{b1}} (können, Konjunktiv II) Sie mir bitte helfen? – Gern. Und {{b2}} (werden, Konjunktiv II) Sie bitte hier unterschreiben?"
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 7 }
    answer:
      blanks:
        b1: [Könnten]
        b2: [würden]
    known_wrong:
      - answer: Können
        feedback_vi: "Können Sie …? đúng nhưng chưa phải dạng lịch sự hơn mà đề yêu cầu: Könnten Sie …?"
        error_tag: konjunktiv_form
      - answer: Konnten
        feedback_vi: "Konnten (không có ö) là quá khứ. Nhờ lịch sự: Könnten."
        error_tag: konjunktiv_form
      - answer: werden
        feedback_vi: "werden Sie …? không phải lời nhờ. Nhờ lịch sự: würden Sie …?"
        error_tag: konjunktiv_form
      - answer: wurden
        feedback_vi: "wurden (không có ü) là quá khứ của werden. Nhờ lịch sự: würden."
        error_tag: konjunktiv_form
    explanation:
      vi: "Dạng lịch sự (Konjunktiv II) có umlaut: können → Könnten Sie …?, werden → Würden Sie …? Nguyên thể (helfen, unterschreiben) ở cuối câu."
    display_answer: "Könnten Sie mir bitte helfen? – Gern. Und würden Sie bitte hier unterschreiben?"

  - key: de:exercise:a2u04l3-tr-rauchen-aufhoeren
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u04-aufhoeren
    prompt:
      source_text: "Bạn nên bỏ thuốc lá. (nói với bạn thân)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Du solltest mit dem Rauchen aufhören.
        - Du solltest aufhören zu rauchen.
        - Du solltest nicht mehr rauchen.
        - Du solltest das Rauchen aufgeben.
    known_wrong:
      - answer: Du solltest mit dem Rauchen aufhörst.
        feedback_vi: "Sau solltest, động từ chính ở nguyên thể: aufhören."
        error_tag: verb_form
      - answer: Du solltest mit das Rauchen aufhören.
        feedback_vi: "mit đi với Dativ: mit dem Rauchen."
        error_tag: case_dat_akk
      - answer: Du solltet mit dem Rauchen aufhören.
        feedback_vi: "solltet là dạng của ihr; với du là solltest."
        error_tag: verb_form
    explanation:
      vi: "Lời khuyên với du: Du solltest … + nguyên thể cuối câu. \"Bỏ thuốc lá\" = mit dem Rauchen aufhören (mit + Dativ, das Rauchen viết hoa vì là danh từ). Du solltest aufhören zu rauchen cũng đúng; cấu trúc zu + nguyên thể bạn sẽ học ở A2U06."
    display_answer: Du solltest mit dem Rauchen aufhören.

  # ---------------- application ----------------
  - key: de:exercise:a2u04l3-wb-an-deiner-stelle
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u04-g-wuerde-hoeflich
    prompt:
      instruction: "Sắp xếp thành câu: \"Nếu mình là bạn, mình sẽ đi khám bác sĩ.\""
      tokens:
        - { id: t-arzt, text: Arzt }
        - { id: t-wuerde, text: würde }
        - { id: t-stelle, text: Stelle }
        - { id: t-gehen, text: gehen }
        - { id: t-an, text: an }
        - { id: t-werde, text: werde }
        - { id: t-ich, text: ich }
        - { id: t-zum, text: zum }
        - { id: t-deiner, text: deiner }
    answer:
      orders:
        - [t-an, t-deiner, t-stelle, t-wuerde, t-ich, t-zum, t-arzt, t-gehen]
        - [t-ich, t-wuerde, t-an, t-deiner, t-stelle, t-zum, t-arzt, t-gehen]
    explanation:
      vi: "Mẫu khuyên: An deiner Stelle würde ich … + nguyên thể cuối câu. Khi An deiner Stelle ở vị trí 1 thì würde đứng thứ hai, rồi đến ich. werde là thì tương lai, không phải dạng giả định."
    display_answer: An deiner Stelle würde ich zum Arzt gehen.

  - key: de:exercise:a2u04l3-wb-sie-sollten
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u04-regelmaessig
    prompt:
      instruction: "Bác sĩ nói với bệnh nhân (Sie). Sắp xếp thành câu: \"Ông nên tập thể thao đều đặn.\""
      tokens:
        - { id: t-machen, text: machen }
        - { id: t-sport, text: Sport }
        - { id: t-solltest, text: solltest }
        - { id: t-sie, text: Sie }
        - { id: t-regelmaessig, text: regelmäßig }
        - { id: t-sollten, text: sollten }
    answer:
      orders:
        - [t-sie, t-sollten, t-regelmaessig, t-sport, t-machen]
    explanation:
      vi: "Với Sie: sollten. Trạng từ regelmäßig đứng trước tân ngữ Sport, nguyên thể machen ở cuối câu. solltest là dạng của du."
    display_answer: Sie sollten regelmäßig Sport machen.

  - key: de:exercise:a2u04l3-tr-langsamer-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-g-wuerde-hoeflich
    prompt:
      source_text: Könnten Sie bitte langsamer sprechen?
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Anh có thể nói chậm hơn được không?
        - Chị có thể nói chậm hơn được không?
        - Ông có thể nói chậm hơn được không?
        - Bà có thể nói chậm hơn được không?
        - Anh có thể nói chậm hơn được không ạ?
        - Chị có thể nói chậm hơn được không ạ?
        - Ông có thể nói chậm hơn được không ạ?
        - Bà có thể nói chậm hơn được không ạ?
        - Anh làm ơn nói chậm hơn được không?
        - Chị làm ơn nói chậm hơn được không?
        - Làm ơn nói chậm hơn được không?
        - Xin vui lòng nói chậm hơn.
        - Bạn có thể nói chậm hơn được không?
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Anh có thể nói nhanh hơn được không?
        feedback_vi: "langsamer = chậm hơn (so sánh hơn của langsam), không phải nhanh hơn."
