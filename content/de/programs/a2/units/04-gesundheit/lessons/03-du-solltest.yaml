title:
  vi: Bạn nên… – lời khuyên với Konjunktiv II (Du solltest weniger arbeiten.)
objectives:
  - vi: Khuyên bạn bè và người lạ về lối sống lành mạnh (Du solltest …, Sie sollten …, Du könntest …).
  - vi: Khuyên theo kiểu "nếu tôi là bạn" (An deiner Stelle würde ich …).
  - vi: Nhờ lịch sự hơn bằng Könnten Sie …? và Würden Sie …?
  - vi: Phân biệt lời khuyên du solltest với lời dặn du sollst.
