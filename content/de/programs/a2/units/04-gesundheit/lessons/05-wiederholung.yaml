body:
  - type: objective
    text:
      vi: "Bài ôn tập: bạn đọc hướng dẫn dùng thuốc và tin nhắn, nghe lời nhắn của phòng khám, rồi tự viết tin nhắn xin nghỉ ốm ngắn, đúng ngữ vực."
  - type: explain
    text:
      vi: "Tin nhắn xin nghỉ ốm gồm ba ý: mình không đến được (leider kann ich heute nicht kommen), lý do (weil ich krank bin / denn ich habe Fieber), và hẹn tiếp (Ich melde mich morgen. / Wenn es mir besser geht, komme ich wieder.)."
  - type: explain
    text:
      vi: "Nhớ trật tự: sau weil và wenn động từ đứng cuối (weil ich mich erkältet habe); sau denn giữ trật tự câu chính (denn ich habe Fieber). Trong văn viết, đừng dùng weil với động từ ở vị trí 2."
  - type: explain
    text:
      vi: "Ngữ vực: gửi sếp xưng Sie thì mở đầu Sehr geehrte Frau … / Sehr geehrter Herr … và kết thúc Mit freundlichen Grüßen; với giáo viên quen (vẫn xưng Sie) có thể viết Lieber Herr … / Liebe Frau … và Viele Grüße. Gửi bạn bè (du): Liebe … / Lieber … hoặc Hallo …, kết thúc Viele Grüße. Bạn bè đáp lại thường chúc Gute Besserung!"
  - type: deep_explain
    text:
      vi: "Ở Đức, người đi làm bị ốm thường phải báo cho chỗ làm ngay ngày đầu và từ một số ngày nhất định thì cần giấy chứng nhận của bác sĩ (Krankschreibung); quy định cụ thể tuỳ hợp đồng và có thể thay đổi, nên hỏi chỗ làm của bạn. Trong bài thi Goethe A2 phần Schreiben, bạn thường phải viết tin nhắn hoặc e-mail ngắn theo ba ý cho trước (định dạng đề có thể thay đổi, hãy xem đề mẫu mới nhất) – hãy viết đủ cả ba ý, mỗi ý một hai câu."
  - type: example
    target: "Sehr geehrte Frau Schulz, leider kann ich heute nicht zur Arbeit kommen, denn ich bin krank. Mit freundlichen Grüßen, Linh Tran"
    target_lang: de
    translation:
      vi: "Kính gửi bà Schulz, rất tiếc hôm nay tôi không thể đi làm được vì tôi bị ốm. Trân trọng, Linh Tran"
    note:
      vi: "Thư trang trọng gửi sếp (Sie). Sau denn giữ trật tự câu chính: ich bin krank."
  - type: example
    target: "Lieber Herr Wagner, ich kann heute nicht zum Kurs kommen, weil ich mich erkältet habe."
    target_lang: de
    translation:
      vi: "Thầy Wagner thân mến, hôm nay em không đến lớp được vì em bị cảm."
    note:
      vi: "Sau weil, động từ chia habe đứng cuối; mich là đại từ phản thân Akkusativ."
  - type: example
    target: "Du hast dich erkältet? Dann ruh dich aus. Wenn du morgen noch Fieber hast, solltest du zum Arzt gehen."
    target_lang: de
    translation:
      vi: "Bạn bị cảm à? Vậy thì nghỉ ngơi đi. Nếu mai vẫn còn sốt thì bạn nên đi khám bác sĩ."
    note:
      vi: "Bạn bè (du): ruh dich aus (mệnh lệnh), wenn + động từ cuối, solltest đứng ngay sau dấu phẩy."
  - type: example
    target: "Hallo Tom, ich habe mir beim Sport den Fuß verletzt. Kannst du mir die Hausaufgaben schicken? Viele Grüße, Mai"
    target_lang: de
    translation:
      vi: "Chào Tom, mình bị thương ở chân khi tập thể thao. Bạn gửi bài tập về nhà cho mình được không? Thân, Mai"
    note:
      vi: "Tin nhắn thân mật (du). Có tân ngữ den Fuß nên đại từ phản thân ở Dativ: mir."
  - type: common_mistake
    wrong: Ich kann nicht kommen, weil ich bin krank.
    right: Ich kann nicht kommen, weil ich krank bin.
    target_lang: de
    note:
      vi: "Trong văn viết, sau weil động từ chia đứng cuối. Muốn giữ trật tự câu chính, dùng denn: …, denn ich bin krank."
  - type: common_mistake
    wrong: Sehr geehrte Frau Schulz, … Viele Grüße
    right: Sehr geehrte Frau Schulz, … Mit freundlichen Grüßen
    target_lang: de
    note:
      vi: "Mở đầu trang trọng thì kết thúc cũng trang trọng: Mit freundlichen Grüßen."
  - type: summary
    points:
      - vi: "Ba ý của tin nhắn xin nghỉ: không đến được – lý do – hẹn tiếp."
      - vi: "weil / wenn + động từ cuối; denn + trật tự câu chính."
      - vi: "Phản thân: Ich fühle mich nicht gut. Ich habe mich erkältet. Ich putze mir die Zähne."
      - vi: "Khuyên: Du solltest … · Du könntest … · An deiner Stelle würde ich …"
      - vi: "Thư trang trọng: Sehr geehrte/r … – Mit freundlichen Grüßen; thân mật: Liebe/r … – Viele Grüße."
exercises:
  # ---------------- recognition: đọc ----------------
  - key: de:exercise:a2u04l5-mcq-lesen-beipackzettel
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-einnehmen
    prompt:
      stem: "Đọc hướng dẫn (mô phỏng, không phải thuốc thật): \"Tabletten gegen Kopfschmerzen. Erwachsene: 1 Tablette, nicht mehr als 3 Tabletten am Tag. Nehmen Sie die Tabletten mit Wasser ein. Nicht für Kinder unter 12 Jahren.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: c3w, text: "Người lớn uống mỗi lần 1 viên, không quá 3 viên một ngày.", lang: vi }
        - { id: k8e, text: "Trẻ em 10 tuổi cũng dùng được thuốc này.", lang: vi }
        - { id: t5y, text: "Người lớn uống 3 viên mỗi lần.", lang: vi }
        - { id: h1u, text: "Nên uống thuốc với sữa.", lang: vi }
    answer:
      correct_option_id: c3w
    explanation:
      vi: "Erwachsene: 1 Tablette = người lớn mỗi lần 1 viên; nicht mehr als 3 Tabletten am Tag = không quá 3 viên một ngày. Nicht für Kinder unter 12 Jahren = không dùng cho trẻ dưới 12 tuổi; mit Wasser = với nước."
    display_answer: "Người lớn uống mỗi lần 1 viên, không quá 3 viên một ngày."

  - key: de:exercise:a2u04l5-mcq-lesen-krankmeldung
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u03-g-denn
    prompt:
      stem: "Đọc e-mail: \"Sehr geehrte Frau Schulz, leider kann ich heute nicht zur Arbeit kommen, denn ich bin krank. Ich habe Fieber und mir tut der Hals weh. Heute Vormittag gehe ich zum Arzt. Ich melde mich morgen wieder. Mit freundlichen Grüßen, Linh Tran\". Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: m6a, text: "Linh bị sốt, đau họng và sáng nay sẽ đi khám bác sĩ.", lang: vi }
        - { id: s2q, text: "Linh xin nghỉ vì phải đưa con đi khám bác sĩ.", lang: vi }
        - { id: f9g, text: "Linh đã khỏi ốm và mai sẽ đi làm lại.", lang: vi }
        - { id: p4x, text: "Bà Schulz bị ốm nên Linh phải làm thay.", lang: vi }
    answer:
      correct_option_id: m6a
    explanation:
      vi: "denn ich bin krank = vì tôi bị ốm; Fieber = sốt, mir tut der Hals weh = tôi đau họng; Heute Vormittag gehe ich zum Arzt = sáng nay tôi đi bác sĩ. Ich melde mich morgen wieder chỉ là \"mai tôi sẽ báo lại\", không nói đã khỏi."
    display_answer: "Linh bị sốt, đau họng và sáng nay sẽ đi khám bác sĩ."

  - key: de:exercise:a2u04l5-mcq-lesen-ratschlag
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-g-wuerde-hoeflich
    prompt:
      stem: "Đọc tin nhắn: \"Hallo Minh, du hast geschrieben, dass du immer müde bist. An deiner Stelle würde ich früher ins Bett gehen und abends nicht so lange am Handy sein. Du könntest auch am Wochenende joggen. Wenn du willst, laufen wir zusammen! Liebe Grüße, Jana\". Jana khuyên Minh điều gì?"
      stem_lang: vi
      options:
        - { id: r7c, text: "Đi ngủ sớm hơn và buổi tối bớt dùng điện thoại.", lang: vi }
        - { id: j3m, text: "Uống nhiều cà phê hơn để bớt mệt.", lang: vi }
        - { id: z8k, text: "Đi khám bác sĩ ngay cuối tuần này.", lang: vi }
        - { id: b2h, text: "Ngủ trưa và không tập thể thao.", lang: vi }
    answer:
      correct_option_id: r7c
    explanation:
      vi: "An deiner Stelle würde ich früher ins Bett gehen = nếu là bạn, mình sẽ đi ngủ sớm hơn; nicht so lange am Handy sein = đừng dùng điện thoại lâu như thế. Jana còn gợi ý chạy bộ cuối tuần (Du könntest … joggen)."
    display_answer: "Đi ngủ sớm hơn và buổi tối bớt dùng điện thoại."

  - key: de:exercise:a2u04l5-mcq-lesen-praxis
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-versichertenkarte
    prompt:
      stem: "Đọc biển ở phòng khám: \"Praxis Dr. Berger – Sprechstunde: Montag bis Freitag 8 bis 12 Uhr, Dienstag und Donnerstag auch 15 bis 18 Uhr. Bitte bringen Sie Ihre Versichertenkarte mit.\" Thứ Tư lúc 16 giờ bạn có đến khám được không?"
      stem_lang: vi
      options:
        - { id: u4t, text: "Không, buổi chiều chỉ mở vào thứ Ba và thứ Năm.", lang: vi }
        - { id: e1p, text: "Có, chiều nào cũng mở từ 15 đến 18 giờ.", lang: vi }
        - { id: o7d, text: "Có, nhưng phải mang theo đơn thuốc.", lang: vi }
        - { id: y5r, text: "Không, thứ Tư phòng khám đóng cửa cả ngày.", lang: vi }
    answer:
      correct_option_id: u4t
    explanation:
      vi: "Montag bis Freitag 8 bis 12 Uhr = buổi sáng các ngày trong tuần, kể cả thứ Tư; Dienstag und Donnerstag auch 15 bis 18 Uhr = chỉ thứ Ba và thứ Năm mở thêm buổi chiều. Cần mang Versichertenkarte (thẻ bảo hiểm), không phải đơn thuốc."
    display_answer: "Không, buổi chiều chỉ mở vào thứ Ba và thứ Năm."

  # ---------------- recognition: nghe ----------------
  - key: de:exercise:a2u04l5-listen-praxis-termin
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a1u08-termin
    prompt:
      audio_asset_id: null
      fallback_text: "Guten Tag, hier ist die Praxis Doktor Berger. Leider ist Ihr Termin am Mittwoch um neun Uhr nicht möglich. Wir haben am Donnerstag um zehn Uhr noch einen Termin frei. Könnten Sie uns bitte zurückrufen?"
      options:
        - { id: d6n, text: "Lịch hẹn thứ Tư lúc 9 giờ không được; phòng khám còn chỗ thứ Năm lúc 10 giờ và nhờ bạn gọi lại.", lang: vi }
        - { id: w2s, text: "Lịch hẹn chuyển từ thứ Năm sang thứ Tư lúc 9 giờ.", lang: vi }
        - { id: i8f, text: "Phòng khám nhắc bạn đến đúng 10 giờ thứ Tư.", lang: vi }
        - { id: g4l, text: "Bác sĩ Berger sẽ gọi lại cho bạn vào thứ Năm.", lang: vi }
    answer:
      correct_option_id: d6n
    explanation:
      vi: "Ihr Termin am Mittwoch um neun Uhr ist nicht möglich = lịch hẹn thứ Tư 9 giờ không được; am Donnerstag um zehn Uhr noch einen Termin frei = thứ Năm 10 giờ còn trống; Könnten Sie uns zurückrufen? = bạn gọi lại cho phòng khám được không."
    display_answer: "Lịch hẹn thứ Tư lúc 9 giờ không được; phòng khám còn chỗ thứ Năm lúc 10 giờ và nhờ bạn gọi lại."

  - key: de:exercise:a2u04l5-listen-freundin-rat
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u04-g-sollte-koennte
    prompt:
      audio_asset_id: null
      fallback_text: "Du hast dich erkältet? Dann trink viel Tee und ruh dich aus. Wenn du morgen noch Fieber hast, solltest du zum Arzt gehen."
      options:
        - { id: v3x, text: "Uống nhiều trà, nghỉ ngơi; nếu mai còn sốt thì nên đi bác sĩ.", lang: vi }
        - { id: q7b, text: "Đi bác sĩ ngay hôm nay rồi mai nghỉ ngơi.", lang: vi }
        - { id: n1k, text: "Uống nhiều trà và mai đi làm bình thường.", lang: vi }
        - { id: a9w, text: "Nếu mai hết sốt thì nên đi bác sĩ kiểm tra.", lang: vi }
    answer:
      correct_option_id: v3x
    explanation:
      vi: "trink viel Tee und ruh dich aus = uống nhiều trà và nghỉ ngơi; Wenn du morgen noch Fieber hast = nếu mai vẫn còn sốt; solltest du zum Arzt gehen = bạn nên đi bác sĩ."
    display_answer: "Uống nhiều trà, nghỉ ngơi; nếu mai còn sốt thì nên đi bác sĩ."

  # ---------------- recall: viết ----------------
  - key: de:exercise:a2u04l5-fill-email-chefin
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a1u08-g-anrede-gruss
    prompt:
      template: "Sehr geehrte Frau Schulz, leider kann ich heute nicht zur Arbeit kommen, {{b1}} ich bin krank. Ich fühle {{b2}} nicht gut und habe Fieber. Mit freundlichen {{b3}} Linh Tran"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [denn]
        b2: [mich]
        b3: [Grüßen]
    known_wrong:
      - answer: weil
        feedback_vi: "Sau chỗ trống là ich bin krank (động từ ở vị trí 2), nên phải dùng denn. Nếu dùng weil, động từ phải ra cuối: weil ich krank bin."
        error_tag: conjunction
      - answer: mir
        feedback_vi: "sich fühlen không có tân ngữ khác nên dùng Akkusativ: mich."
        error_tag: case_dat_akk
      - answer: Grüße
        feedback_vi: "Sau mit (Dativ) và ở số nhiều cần đuôi -n: Mit freundlichen Grüßen."
        error_tag: case_dat_akk
    explanation:
      vi: "denn giữ trật tự câu chính (denn ich bin krank). sich fühlen → ich fühle mich. Lời chào cuối thư trang trọng cố định: Mit freundlichen Grüßen."
    display_answer: Sehr geehrte Frau Schulz, leider kann ich heute nicht zur Arbeit kommen, denn ich bin krank. Ich fühle mich nicht gut und habe Fieber. Mit freundlichen Grüßen Linh Tran

  - key: de:exercise:a2u04l5-fill-kurs-lehrer
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-g-weil
    prompt:
      template: "Lieber Herr Wagner, ich kann heute leider nicht zum Kurs kommen, weil ich mich erkältet {{b1}}. Wenn es mir besser {{b2}}, komme ich am Freitag wieder. Viele Grüße, Mai"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
    answer:
      blanks:
        b1: [habe]
        b2: [geht]
    known_wrong:
      - answer: bin
        feedback_vi: "Động từ phản thân ở Perfekt đi với haben: ich habe mich erkältet."
        error_tag: aux_verb
      - answer: hat
        feedback_vi: "Chủ ngữ là ich: ich habe."
        error_tag: verb_form
      - answer: gehe
        feedback_vi: "Chủ ngữ là es (Es geht mir besser): es geht."
        error_tag: verb_form
    explanation:
      vi: "Sau weil, trợ động từ habe đứng cuối (sich erkälten đi với haben). Es geht mir besser → trong câu wenn: wenn es mir besser geht."
    display_answer: Lieber Herr Wagner, ich kann heute leider nicht zum Kurs kommen, weil ich mich erkältet habe. Wenn es mir besser geht, komme ich am Freitag wieder. Viele Grüße, Mai

