title:
  vi: Bạn thấy trong người thế nào? – động từ phản thân (Wie fühlst du dich?)
objectives:
  - vi: Nói mình cảm thấy thế nào trong người (Ich fühle mich müde / schwach / fit).
  - vi: Chia động từ phản thân với mich, dich, sich, uns, euch, sich, kể cả khi đảo chủ ngữ và ở Perfekt.
  - vi: Nói về nghỉ ngơi và vận động (sich ausruhen, sich erholen, sich bewegen).
  - vi: Kể mình bị cảm, bị thương (Ich habe mich erkältet / verletzt).
estimated_minutes: 16
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a2u03-wiederholung]
