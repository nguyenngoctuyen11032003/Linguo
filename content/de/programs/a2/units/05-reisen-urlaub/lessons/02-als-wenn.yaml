body:
  - type: objective
    text:
      vi: "Sau bài này, bạn kể được \"Als ich in Wien war, habe ich das Schloss besucht\" (một lần trong quá khứ) và \"Wenn ich in Wien bin, gehe ich immer in die Altstadt\" (mỗi khi), đồng thời nói về các điểm tham quan."
  - type: explain
    text:
      vi: "als và wenn đều dịch là \"khi\", nhưng tiếng Đức phân biệt theo thời gian và số lần. als: một sự việc hoặc một giai đoạn chỉ có một lần trong quá khứ (Als ich in Wien war … ; Als ich ein Kind war …). wenn: mỗi khi (lặp lại, ở quá khứ hay hiện tại) hoặc khi (một lần ở hiện tại, tương lai)."
  - type: explain
    text:
      vi: "Mẹo nhớ: quá khứ + một lần = als; các trường hợp khác = wenn. Muốn nhấn mạnh sự lặp lại, dùng immer wenn hoặc jedes Mal wenn (mỗi lần): Jedes Mal wenn wir in Wien waren, besuchten wir die Altstadt."
  - type: explain
    text:
      vi: "als và wenn mở đầu câu phụ nên động từ chia đứng cuối: Als ich in Wien war. Câu phụ đứng đầu thì câu chính bắt đầu bằng động từ ngay sau dấu phẩy: Als ich in Wien war, habe ich viel gesehen. Tiếng Việt nói \"khi ở Viên, tôi đã…\", còn tiếng Đức đặt động từ trước chủ ngữ: …, habe ich …"
  - type: explain
    text:
      vi: "Bạn đã gặp wenn với nghĩa \"nếu\" (Wenn du Zeit hast, …). Ở hiện tại và tương lai, wenn có thể là \"khi\" hoặc \"nếu\", ngữ cảnh cho biết nghĩa nào. Với một sự việc chỉ xảy ra một lần trong quá khứ, tiếng Đức chuẩn dùng als, không dùng wenn."
  - type: explain
    text:
      vi: "Từ mới về tham quan: die Sehenswürdigkeit, die Altstadt, das Schloss, die Brücke, der Turm, die Führung, der Tourist, das Souvenir, berühmt. der Tourist thêm -en ở mọi cách trừ Nominativ số ít: Ich zeige dem Touristen den Weg."
  - type: deep_explain
    text:
      vi: "Trong câu với als, động từ thường ở Präteritum (war, hatte, machte) hoặc Perfekt; câu chính khi nói thường dùng Perfekt, khi viết dùng Präteritum. Đừng nhầm với wann (khi nào), từ dùng để hỏi: Wann warst du in Wien? – Als ich 20 war. Câu phụ cũng có thể đứng sau câu chính, không cần đảo: Ich habe viele Fotos gemacht, als ich in Wien war. Wien là thủ đô nước Áo, tiếng Việt thường gọi là Viên; cung điện Schönbrunn và nhà thờ Stephansdom là hai điểm tham quan rất nổi tiếng ở đó."
  - type: example
    target: Als ich in Wien war, habe ich Schloss Schönbrunn besucht.
    target_lang: de
    translation:
      vi: Khi ở Viên, tôi đã đến thăm cung điện Schönbrunn.
    note:
      vi: "Một chuyến đi trong quá khứ → als; war đứng cuối câu phụ, câu chính bắt đầu bằng habe."
  - type: example
    target: Als wir Kinder waren, machten wir jeden Sommer Urlaub an der Ostsee.
    target_lang: de
    translation:
      vi: Hồi chúng tôi còn nhỏ, mùa hè nào cũng đi nghỉ ở biển Baltic.
    note:
      vi: "Thời thơ ấu là một giai đoạn trong quá khứ → als (dù việc đi nghỉ lặp lại mỗi hè)."
  - type: example
    target: Jedes Mal wenn wir in Wien waren, besuchten wir die Altstadt.
    target_lang: de
    translation:
      vi: Mỗi lần ở Viên, chúng tôi đều đi dạo khu phố cổ.
    note:
      vi: "Lặp lại nhiều lần trong quá khứ → (jedes Mal) wenn."
  - type: example
    target: Wenn du nach Köln fährst, musst du unbedingt den Dom sehen.
    target_lang: de
    translation:
      vi: Khi nào bạn đi Köln thì nhất định phải xem nhà thờ lớn.
    note:
      vi: "Tương lai → wenn. Nói với bạn bè nên dùng du."
  - type: example
    target: Wenn ich in einer neuen Stadt bin, mache ich immer zuerst eine Führung.
    target_lang: de
    translation:
      vi: Mỗi khi ở một thành phố mới, tôi luôn đi một tour có hướng dẫn trước tiên.
    note:
      vi: "Thói quen ở hiện tại → wenn. eine Führung machen = đi tour có hướng dẫn."
  - type: example
    target: Wenn das Wetter morgen schlecht ist, besichtigen wir das Schloss.
    target_lang: de
    translation:
      vi: Nếu mai trời xấu, chúng ta sẽ đi tham quan lâu đài.
    note:
      vi: "Ở đây wenn = nếu (điều kiện), như bạn đã học. Câu phụ đứng đầu nên besichtigen đứng ngay sau dấu phẩy."
  - type: common_mistake
    wrong: Wenn ich ein Kind war, wohnte ich in Hue.
    right: Als ich ein Kind war, wohnte ich in Hue.
    target_lang: de
    note:
      vi: "Thời thơ ấu là một giai đoạn trong quá khứ → als."
  - type: common_mistake
    wrong: Als ich in Wien bin, besuche ich das Schloss.
    right: Wenn ich in Wien bin, besuche ich das Schloss.
    target_lang: de
    note:
      vi: "Hiện tại, tương lai → wenn; als chỉ dùng cho quá khứ."
  - type: common_mistake
    wrong: Als ich in Wien war, ich habe viele Fotos gemacht.
    right: Als ich in Wien war, habe ich viele Fotos gemacht.
    target_lang: de
    note:
      vi: "Câu phụ đứng đầu chiếm vị trí 1, nên động từ câu chính đứng ngay sau dấu phẩy."
  - type: summary
    points:
      - vi: "als = khi (một lần hoặc một giai đoạn trong quá khứ)."
      - vi: "wenn = mỗi khi (lặp lại) hoặc khi (hiện tại, tương lai)."
      - vi: "immer wenn, jedes Mal wenn = mỗi lần."
      - vi: "Câu phụ: động từ cuối; câu phụ đứng đầu → động từ câu chính ngay sau dấu phẩy."
      - vi: "wann chỉ dùng để hỏi."
      - vi: "Tham quan: die Sehenswürdigkeit, die Altstadt, das Schloss, die Brücke, der Turm, die Führung, das Souvenir."
