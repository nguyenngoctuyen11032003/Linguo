        - Als ich ein Kind war, habe ich in Da Lat gewohnt.
        - Als ich ein Kind war, lebte ich in Da Lat.
        - Als ich ein Kind war, habe ich in Da Lat gelebt.
        - Als ich klein war, wohnte ich in Da Lat.
        - Als ich klein war, habe ich in Da Lat gewohnt.
        - Als ich klein war, lebte ich in Da Lat.
        - Als ich klein war, habe ich in Da Lat gelebt.
        - Ich wohnte in Da Lat, als ich ein Kind war.
        - Ich habe in Da Lat gewohnt, als ich ein Kind war.
        - Ich lebte in Da Lat, als ich ein Kind war.
        - Ich habe in Da Lat gelebt, als ich ein Kind war.
        - Ich wohnte in Da Lat, als ich klein war.
        - Ich habe in Da Lat gewohnt, als ich klein war.
        - Ich lebte in Da Lat, als ich klein war.
        - Ich habe in Da Lat gelebt, als ich klein war.
