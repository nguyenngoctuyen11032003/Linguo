title:
  vi: Khi tôi ở Viên – als, wenn (Als ich in Wien war, …)
objectives:
  - vi: Kể kỷ niệm một lần trong quá khứ với als (Als ich in Wien war, …).
  - vi: Nói thói quen lặp lại với wenn, immer wenn, jedes Mal wenn.
  - vi: Chọn đúng als hay wenn và đặt động từ đúng chỗ trong câu phụ và câu chính.
  - vi: Nói về điểm tham quan – khu phố cổ, lâu đài, cầu, tháp, tour có hướng dẫn, quà lưu niệm.
