      vi: "\"Khi còn nhỏ\" là một giai đoạn trong quá khứ → Als ich ein Kind war (hoặc Als ich klein war). Động từ war ở cuối câu phụ; câu chính bắt đầu bằng động từ: wohnte ich …"
    display_answer: Als ich ein Kind war, wohnte ich in Da Lat.

