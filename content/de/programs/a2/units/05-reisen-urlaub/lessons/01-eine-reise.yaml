    display_answer: fahren

  - key: de:exercise:a2u05l1-mcq-buchten
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2u05-g-praeteritum-regelmaessig
    prompt:
      stem: "Chọn dạng đúng: Letztes Jahr ___ wir eine Reise nach Spanien. (buchen)"
      stem_lang: vi
      options:
        - { id: b1a, text: buchten, lang: de }
        - { id: b2b, text: buchte, lang: de }
        - { id: b3c, text: buchtet, lang: de }
        - { id: b4d, text: gebucht, lang: de }
    answer:
      correct_option_id: b1a
    explanation:
      vi: "Letztes Jahr chỉ quá khứ, chỗ trống chỉ có một từ nên cần Präteritum. Ngôi wir: gốc buch + -te + -n = buchten. buchte là ngôi ich/er, buchtet là ngôi ihr; gebucht cần đi với haben."
    display_answer: buchten

  - key: de:exercise:a2u05l1-listen-insel
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u05-insel
    prompt:
      audio_asset_id: null
      fallback_text: Im Urlaub fuhren wir ans Meer. Wir blieben eine Woche auf einer Insel und gingen jeden Tag an den Strand.
      options:
        - { id: l1a, text: "Kỳ nghỉ, họ đi biển, ở một tuần trên một hòn đảo và ngày nào cũng ra bãi biển.", lang: vi }
        - { id: l2b, text: "Kỳ nghỉ, họ đi biển, ở hai tuần trên một hòn đảo và ngày nào cũng ra bãi biển.", lang: vi }
        - { id: l3c, text: "Kỳ nghỉ, họ lên núi, ở một tuần trong khách sạn và ngày nào cũng đi bộ đường dài.", lang: vi }
        - { id: l4d, text: "Kỳ nghỉ, họ đi biển, ở một tuần trên một hòn đảo nhưng không ra bãi biển lần nào.", lang: vi }
    answer:
      correct_option_id: l1a
    explanation:
      vi: "fuhren ans Meer = đi biển; blieben eine Woche auf einer Insel = ở lại một tuần trên đảo; gingen jeden Tag an den Strand = ngày nào cũng ra bãi biển."
    display_answer: "Kỳ nghỉ, họ đi biển, ở một tuần trên một hòn đảo và ngày nào cũng ra bãi biển."

