    answer_lang: de
    difficulty: 2
    item: de:item:a2u05-packen
    prompt:
      template: "Vor einem Monat {{b1}} (buchen) ich eine Reise nach Italien. Am Abend vor der Reise {{b2}} (packen) ich meinen Koffer."
      blanks:
        - { id: b1, width_hint: 7 }
        - { id: b2, width_hint: 7 }
    answer:
      blanks:
        b1: [buchte]
        b2: [packte]
    known_wrong:
      - answer: buche
        feedback_vi: "Vor einem Monat là quá khứ: Präteritum buchte."
        error_tag: tense
      - answer: buchten
        feedback_vi: "Chủ ngữ là ich: không có đuôi sau -te: buchte."
        error_tag: verb_form
      - answer: packe
        feedback_vi: "Quá khứ: packte."
        error_tag: tense
      - answer: packten
