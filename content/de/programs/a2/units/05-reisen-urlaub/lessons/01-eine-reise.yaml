title:
  vi: Một chuyến đi – Präteritum (Wir fuhren ans Meer.)
objectives:
  - vi: Hiểu đoạn kể chuyện viết ở Präteritum (blog du lịch, truyện ngắn).
  - vi: Chia động từ có quy tắc ở Präteritum – gốc + -te (machte, wohnte, arbeitete).
  - vi: Nhận ra 15 dạng Präteritum bất quy tắc hay gặp (ging, kam, fuhr, sah …) và tìm lại nguyên thể.
  - vi: Kể chuyến đi bằng câu đơn giản – đặt chuyến, xếp va li, ra biển, lên núi, ra đảo.
