body:
  - type: objective
    text:
      vi: "Sau bài này, bạn đọc hiểu được một đoạn blog kể chuyến đi viết ở Präteritum và tự viết được câu như: Letzten Sommer machten wir Urlaub an der Küste. Ich buchte eine Ferienwohnung und packte meinen Koffer."
  - type: explain
    text:
      vi: "Präteritum là thì quá khứ của văn viết kể chuyện: truyện, báo, blog. Khi nói, người Đức thường dùng Perfekt (Wir sind ans Meer gefahren), nhưng với sein, haben và động từ khiếm khuyết thì Präteritum (war, hatte, wollte) phổ biến cả khi nói. Tiếng Việt chỉ thêm \"đã\" hay \"hồi đó\", còn tiếng Đức đổi chính động từ."
  - type: explain
    text:
      vi: "Động từ có quy tắc: gốc + -te + đuôi: ich machte, du machtest, er/sie/es machte, wir machten, ihr machtet, sie/Sie machten. Ngôi ich và er/sie/es giống nhau, không có -t như ở hiện tại. Gốc tận cùng bằng -t hoặc -d thêm -ete cho dễ đọc: arbeiten → arbeitete, warten → wartete, übernachten → übernachtete."
  - type: explain
    text:
      vi: "Động từ bất quy tắc (động từ mạnh) đổi nguyên âm và không có -te: fahren → fuhr, gehen → ging, kommen → kam, sehen → sah. Ở bài này bạn chỉ cần nhận ra 15 dạng hay gặp khi đọc rồi tìm nguyên thể: ging, kam, fuhr, sah, gab, nahm, fand, blieb, schrieb, las, aß, trank, rief, lief, flog. Ngôi ich và er/sie/es không có đuôi (er fuhr), wir và sie/Sie thêm -en (wir fuhren)."
  - type: explain
    text:
      vi: "Động từ tách vẫn tách ở Präteritum, tiền tố đứng cuối câu: aufräumen → Wir räumten die Wohnung auf; ankommen → Wir kamen spät an. Từ mới của bài: der Urlaub, die Reise, der Koffer, packen, buchen, das Reisebüro, der Strand, das Meer, die Insel, der Berg."
  - type: deep_explain
    text:
      vi: "Đuôi ngôi của Präteritum giống đuôi của động từ khiếm khuyết bạn đã học (ich wollte, du wolltest, wir wollten). Ngoài -t/-d, một số gốc tận cùng bằng phụ âm + n hoặc m cũng thêm -ete: regnen → es regnete, öffnen → öffnete. Trong một đoạn văn viết, hãy giữ một thì: kể bằng Präteritum thì tiếp tục Präteritum; còn khi nói, dùng war/hatte cùng Perfekt (Ich war in Rom und habe viel gesehen) là hoàn toàn bình thường. Phân biệt: der Urlaub là kỳ nghỉ của người đi làm, die Ferien là kỳ nghỉ của trường học; das Meer là biển, der See là hồ."
  - type: example
    target: Letzten Sommer machten wir Urlaub an der Küste.
    target_lang: de
    translation:
      vi: Mùa hè năm ngoái chúng tôi đi nghỉ ở vùng biển.
    note:
      vi: "machen → mach + te + n (ngôi wir) = machten. Urlaub machen = đi nghỉ."
  - type: example
    target: Ich buchte die Reise im Reisebüro und packte am Abend meinen Koffer.
    target_lang: de
    translation:
      vi: Tôi đặt chuyến đi ở văn phòng du lịch và buổi tối xếp va li.
    note:
      vi: "buchen → buchte, packen → packte; ngôi ich không có đuôi sau -te."
  - type: example
    target: Mein Bruder arbeitete damals in einem Hotel am Strand.
    target_lang: de
    translation:
      vi: Hồi đó anh trai tôi làm việc ở một khách sạn cạnh bãi biển.
    note:
      vi: "arbeiten có gốc tận cùng bằng -t nên thêm -ete: arbeitete."
  - type: example
    target: Wir fuhren mit dem Zug ans Meer und blieben zwei Wochen auf einer Insel.
    target_lang: de
    translation:
      vi: Chúng tôi đi tàu ra biển và ở lại hai tuần trên một hòn đảo.
    note:
      vi: "fuhren = fahren, blieben = bleiben: động từ mạnh, chỉ cần nhận ra khi đọc."
  - type: example
    target: Am Abend gingen wir an den Strand und aßen Fisch.
    target_lang: de
    translation:
      vi: Buổi tối chúng tôi ra bãi biển và ăn cá.
    note:
      vi: "gingen = gehen, aßen = essen."
  - type: example
    target: "Und was hast du im Urlaub gemacht? – Wir haben die Altstadt besichtigt und ein Museum besucht."
    target_lang: de
    translation:
      vi: "Thế kỳ nghỉ bạn đã làm gì? – Bọn mình đã tham quan khu phố cổ và đi thăm một bảo tàng."
    note:
      vi: "Hai người bạn nói chuyện (du) nên dùng Perfekt; besichtigen, besuchen có tiền tố không tách be- nên Partizip II không có ge-: besichtigt, besucht."
  - type: common_mistake
    wrong: Er fahrte mit dem Zug nach Hamburg.
    right: Er fuhr mit dem Zug nach Hamburg.
    target_lang: de
    note:
      vi: "fahren là động từ mạnh: Präteritum là fuhr, không thêm -te."
  - type: common_mistake
    wrong: Gestern habe ich die Reise buchte.
    right: Gestern habe ich die Reise gebucht.
    target_lang: de
    note:
      vi: "Đã dùng habe (Perfekt) thì cuối câu phải là Partizip II (gebucht); hoặc chỉ dùng Präteritum: Gestern buchte ich die Reise."
  - type: common_mistake
    wrong: Sie arbeitte in einem Reisebüro.
    right: Sie arbeitete in einem Reisebüro.
    target_lang: de
    note:
      vi: "Gốc arbeit- tận cùng bằng -t nên cần thêm -e- trước -te: arbeitete."
  - type: summary
    points:
      - vi: "Präteritum: thì kể chuyện của văn viết; khi nói thường dùng Perfekt (trừ war, hatte, modal)."
      - vi: "Có quy tắc: gốc + -te + đuôi: machte, machtest, machten, machtet."
      - vi: "Gốc -t/-d: -ete (arbeitete, übernachtete)."
      - vi: "Bất quy tắc: đổi nguyên âm, không -te: ging, kam, fuhr, sah, blieb, flog …"
      - vi: "ich = er/sie/es ở Präteritum (ich fuhr, er fuhr)."
      - vi: "Từ mới: der Urlaub, die Reise, der Koffer, packen, buchen, der Strand, das Meer, die Insel, der Berg."
