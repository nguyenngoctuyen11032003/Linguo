  - key: de:exercise:a2u05l1-fill-wohnten-arbeitete
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u05-g-praeteritum-regelmaessig
    prompt:
      template: "Letzten Sommer {{b1}} (wohnen) wir in einer Ferienwohnung an der Küste. Mein Vater {{b2}} (arbeiten) dort jeden Morgen am Laptop."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 10 }
    answer:
      blanks:
        b1: [wohnten]
        b2: [arbeitete]
    known_wrong:
      - answer: wohnte
        feedback_vi: "Chủ ngữ là wir nên cần thêm -n: wohnten."
        error_tag: verb_form
      - answer: wohnen
        feedback_vi: "Letzten Sommer là quá khứ: dùng Präteritum wohnten."
        error_tag: tense
      - answer: arbeitte
        feedback_vi: "Gốc arbeit- tận cùng bằng -t nên thêm -ete: arbeitete."
        error_tag: verb_form
      - answer: arbeitet
        feedback_vi: "Đây là dạng hiện tại; quá khứ là arbeitete."
        error_tag: tense
    explanation:
      vi: "Letzten Sommer chỉ quá khứ, mỗi chỗ trống một từ nên dùng Präteritum. wohnen → wohn + te + n (wir) = wohnten; arbeiten có gốc tận cùng -t nên thêm -ete: arbeitete (ngôi er không có đuôi)."
    display_answer: "Letzten Sommer wohnten wir in einer Ferienwohnung an der Küste. Mein Vater arbeitete dort jeden Morgen am Laptop."

