    display_answer: "Vor einem Monat buchte ich eine Reise nach Italien. Am Abend vor der Reise packte ich meinen Koffer."

  - key: de:exercise:a2u05l1-tr-damals-hamburg
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u05-g-praeteritum-regelmaessig
    prompt:
      source_text: "Hồi đó chúng tôi sống ở Hamburg. (dùng Präteritum)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Damals wohnten wir in Hamburg.
        - Wir wohnten damals in Hamburg.
        - Damals lebten wir in Hamburg.
        - Wir lebten damals in Hamburg.
        - In Hamburg wohnten wir damals.
        - In Hamburg lebten wir damals.
    known_wrong:
      - answer: Damals wir wohnten in Hamburg.
        feedback_vi: "Trạng từ damals đứng đầu thì động từ đứng ngay sau: Damals wohnten wir …"
        error_tag: verb_position
      - answer: Damals wohnte wir in Hamburg.
        feedback_vi: "Chủ ngữ wir cần đuôi -n: wohnten."
        error_tag: verb_form
      - answer: Damals wohnen wir in Hamburg.
        feedback_vi: "Đây là hiện tại; đề yêu cầu Präteritum: wohnten."
        error_tag: tense
    explanation:
      vi: "damals = hồi đó; sống ở = wohnen (hoặc leben) in. Präteritum ngôi wir: wohnten/lebten. Động từ luôn ở vị trí 2: Damals wohnten wir … hoặc Wir wohnten damals …"
    display_answer: Damals wohnten wir in Hamburg.

  # ---------------- application ----------------
  - key: de:exercise:a2u05l1-mcq-lesen-blog
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:a2u05-g-praeteritum-haeufig
    prompt:
      stem: "Đọc đoạn blog: \"Im Mai flogen wir nach Mallorca. Das Hotel fanden wir im Internet. Am ersten Tag regnete es. Wir blieben im Hotel und lasen Bücher.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: m1a, text: "Họ bay đến Mallorca vào tháng Năm; ngày đầu trời mưa nên họ ở lại khách sạn đọc sách.", lang: vi }
        - { id: m2b, text: "Họ đi tàu đến Mallorca vào tháng Năm; ngày đầu trời mưa nên họ ở lại khách sạn đọc sách.", lang: vi }
        - { id: m3c, text: "Họ tìm khách sạn ở văn phòng du lịch.", lang: vi }
        - { id: m4d, text: "Ngày đầu trời nắng nên họ ra bãi biển đọc sách.", lang: vi }
    answer:
      correct_option_id: m1a
    explanation:
      vi: "flogen = fliegen (bay); fanden … im Internet = tìm trên mạng; regnete = trời mưa; blieben = ở lại; lasen = lesen (đọc)."
    display_answer: "Họ bay đến Mallorca vào tháng Năm; ngày đầu trời mưa nên họ ở lại khách sạn đọc sách."

