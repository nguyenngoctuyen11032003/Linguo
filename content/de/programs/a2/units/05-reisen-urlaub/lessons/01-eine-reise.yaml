      tokens:
        - { id: w-wir, text: wir }
        - { id: w-auf, text: auf }
        - { id: w-abend, text: Abend }
        - { id: w-raeumte, text: räumte }
        - { id: w-die, text: die }
        - { id: w-am, text: am }
        - { id: w-raeumten, text: räumten }
        - { id: w-fewo, text: Ferienwohnung }
    answer:
      orders:
        - [w-am, w-abend, w-raeumten, w-wir, w-die, w-fewo, w-auf]
        - [w-wir, w-raeumten, w-am, w-abend, w-die, w-fewo, w-auf]
        - [w-wir, w-raeumten, w-die, w-fewo, w-am, w-abend, w-auf]
        - [w-die, w-fewo, w-raeumten, w-wir, w-am, w-abend, w-auf]
    explanation:
      vi: "aufräumen là động từ tách: räumten ở vị trí 2, auf ở cuối câu. Chủ ngữ wir nên dùng räumten (räumte là ngôi ich/er)."
    display_answer: Am Abend räumten wir die Ferienwohnung auf.

  - key: de:exercise:a2u05l1-tr-insel-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    item: de:item:a2u05-meer
    prompt:
      source_text: Wir fuhren ans Meer und blieben eine Woche auf der Insel.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Chúng tôi đi biển và ở lại trên đảo một tuần.
        - Chúng tôi đã đi biển và ở lại trên đảo một tuần.
        - Chúng tôi ra biển và ở lại trên đảo một tuần.
        - Chúng tôi đi ra biển và ở trên đảo một tuần.
        - Chúng tôi đi biển và ở trên đảo một tuần.
        - Chúng tôi ra biển và ở lại đảo một tuần.
        - Chúng tôi đã ra biển và ở lại trên đảo một tuần.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Chúng tôi đi biển và ở lại trên đảo hai tuần.
        feedback_vi: "eine Woche = một tuần."
        error_tag: meaning
      - answer: Chúng tôi lên núi và ở lại trên đảo một tuần.
        feedback_vi: "ans Meer = ra biển, không phải lên núi (in die Berge)."
        error_tag: meaning
