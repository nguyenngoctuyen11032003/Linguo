  - key: de:exercise:a2u05l4-tr-dusche-kaputt
    type: translate
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a2u05-kaputt
    prompt:
      source_text: Tiếc là vòi sen bị hỏng.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Leider ist die Dusche kaputt.
        - Die Dusche ist leider kaputt.
        - Leider funktioniert die Dusche nicht.
        - Die Dusche funktioniert leider nicht.
    known_wrong:
      - answer: Leider die Dusche ist kaputt.
        feedback_vi: "leider đứng đầu thì động từ đứng ngay sau: Leider ist die Dusche kaputt."
        error_tag: verb_position
