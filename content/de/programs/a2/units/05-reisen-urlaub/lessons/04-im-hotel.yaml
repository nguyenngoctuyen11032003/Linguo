body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được \"Im Sommer fahren wir ans Meer\", \"Wir waren bei Freunden in der Schweiz\", đặt được phòng ở khách sạn và phàn nàn lịch sự: \"Leider funktioniert die Klimaanlage nicht. Könnten Sie bitte jemanden schicken?\""
  - type: explain
    text:
      vi: "Như giới từ hai cách bạn đã học: đi đâu (Wohin?) → Akkusativ, ở đâu (Wo?) → Dativ. Ra biển, hồ, bãi biển dùng an: Wir fahren ans Meer / an den See – Wir sind am Meer / am See. Lên vùng núi dùng in + số nhiều: in die Berge – in den Bergen."
  - type: explain
    text:
      vi: "Ra đảo dùng auf: auf eine Insel – auf einer Insel; đảo có tên riêng thường dùng nach: nach Mallorca, nach Rügen (ở đó: auf Mallorca). Thành phố, nước không mạo từ: nach Spanien, nach Wien – ở đó: in Spanien, in Wien. Nước có mạo từ dùng in: in die Schweiz, in die Türkei – in der Schweiz, in der Türkei."
  - type: explain
    text:
      vi: "Đến nhà ai: zu + Dativ (zu Freunden, zu meiner Tante); ở nhà ai: bei + Dativ (bei Freunden, bei meiner Tante). Nhớ cặp quen thuộc: nach Hause (về nhà) – zu Hause (ở nhà)."
  - type: explain
    text:
      vi: "Ở khách sạn: Ich möchte ein Doppelzimmer für drei Nächte reservieren. / Ich habe eine Reservierung auf den Namen … Halbpension = bữa sáng và bữa tối, Vollpension = ba bữa. anreisen = đến (ngày nhận phòng), abreisen = rời đi (ngày trả phòng)."
  - type: explain
    text:
      vi: "Phàn nàn lịch sự: nêu vấn đề bằng Leider … (Leider funktioniert das Licht im Bad nicht. Die Dusche ist kaputt.), rồi đề nghị bằng Könnten Sie …? hoặc Würden Sie …? Câu quá thẳng như \"Das ist schlecht!\" nghe thô lỗ. Muốn khiếu nại chính thức: Ich möchte mich beschweren (sich beschweren über + Akk / bei + Dativ)."
  - type: deep_explain
    text:
      vi: "Vì sao an với biển? an là \"sát cạnh\": am Meer = ở bên biển, im Meer = ở dưới nước biển (đang bơi); am See – im See cũng vậy. auf dem Land = ở nông thôn, aufs Land = về quê. Một số vùng núi có tên riêng số ít, dùng in như danh từ thường: in den Harz – im Harz (der Harz), in den Schwarzwald – im Schwarzwald. Ở châu Âu, giá phòng có thể đã gồm bữa sáng hoặc chưa, giờ nhận và trả phòng cũng khác nhau tùy khách sạn – hãy hỏi lại khi đặt phòng. Khi phàn nàn với nhân viên khách sạn, bạn thường dùng Sie."
  - type: example
    target: Im Sommer fahren wir ans Meer, im Winter in die Berge.
    target_lang: de
    translation:
      vi: Mùa hè chúng tôi đi biển, mùa đông lên núi.
    note:
      vi: "Wohin? → ans (= an das) Meer, in die Berge (Akkusativ số nhiều)."
  - type: example
    target: Letztes Jahr waren wir zwei Wochen auf einer kleinen Insel in Griechenland.
    target_lang: de
    translation:
      vi: Năm ngoái chúng tôi đã ở hai tuần trên một hòn đảo nhỏ ở Hy Lạp.
    note:
      vi: "Wo? → auf einer kleinen Insel (Dativ; sau einer tính từ có đuôi -en như bạn đã học); in Griechenland (nước không mạo từ)."
  - type: example
    target: In den Ferien sind wir bei Freunden in der Schweiz.
    target_lang: de
    translation:
      vi: Vào kỳ nghỉ, chúng tôi ở nhà bạn bè ở Thụy Sĩ.
    note:
      vi: "bei + Dativ = ở nhà ai; in der Schweiz: nước có mạo từ, Wo? → Dativ."
  - type: example
    target: "Guten Tag, ich möchte ein Doppelzimmer mit Halbpension für drei Nächte reservieren."
    target_lang: de
    translation:
      vi: Chào anh/chị, tôi muốn đặt một phòng đôi kèm bữa sáng và bữa tối cho ba đêm.
    note:
      vi: "Khách nói với lễ tân, dùng giọng lịch sự (möchte)."
  - type: example
    target: "Entschuldigung, leider funktioniert die Klimaanlage in Zimmer 214 nicht. Könnten Sie bitte jemanden schicken?"
    target_lang: de
    translation:
      vi: Xin lỗi, tiếc là máy lạnh phòng 214 không chạy. Anh/chị có thể cử ai đến được không?
    note:
      vi: "Phàn nàn lịch sự: Leider + vấn đề + Könnten Sie …? Với nhân viên khách sạn dùng Sie."
  - type: example
    target: "Ich möchte mich über das Zimmer beschweren. Die Dusche ist kaputt, und es ist sehr laut."
    target_lang: de
    translation:
      vi: Tôi muốn khiếu nại về căn phòng. Vòi sen bị hỏng, và rất ồn.
    note:
      vi: "sich beschweren über + Akkusativ: über das Zimmer."
  - type: common_mistake
    wrong: Wir fahren nach den Bergen.
    right: Wir fahren in die Berge.
    target_lang: de
    note:
      vi: "nach chỉ dùng cho thành phố, nước không mạo từ; vùng núi: in die Berge."
  - type: common_mistake
    wrong: Ich fahre zu Meer.
    right: Ich fahre ans Meer.
    target_lang: de
    note:
      vi: "Ra biển: an + Akkusativ: ans Meer."
  - type: common_mistake
    wrong: Wir fahren nach die Schweiz.
    right: Wir fahren in die Schweiz.
    target_lang: de
    note:
      vi: "Nước có mạo từ (die Schweiz, die Türkei) dùng in + Akkusativ."
  - type: common_mistake
    wrong: Das Zimmer ist schlecht! Die Dusche geht nicht!
    right: Entschuldigung, leider funktioniert die Dusche nicht. Könnten Sie bitte jemanden schicken?
    target_lang: de
    note:
      vi: "Câu bên trái đúng ngữ pháp nhưng nghe thô; phàn nàn lịch sự với leider và Könnten Sie …?"
  - type: summary
    points:
      - vi: "Wohin? ans Meer, in die Berge, auf eine Insel, nach Spanien, in die Schweiz, zu Freunden."
      - vi: "Wo? am Meer, in den Bergen, auf einer Insel, in Spanien, in der Schweiz, bei Freunden."
      - vi: "Đảo có tên: nach Mallorca – auf Mallorca."
      - vi: "Khách sạn: das Einzelzimmer, das Doppelzimmer, die Rezeption, die Halbpension, reservieren."
      - vi: "Phàn nàn: Leider funktioniert … nicht. / … ist kaputt. Könnten Sie …?"
      - vi: "sich beschweren über + Akk / bei + Dativ."
exercises:
  # ---------------- recognition ----------------
  - key: de:exercise:a2u05l4-listen-einzelzimmer
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2u05-einzelzimmer
    prompt:
      audio_asset_id: null
      fallback_text: Guten Abend. Ich habe ein Einzelzimmer für zwei Nächte reserviert. Mein Name ist Tran.
      options:
        - { id: e1a, text: "Khách đã đặt một phòng đơn cho hai đêm.", lang: vi }
        - { id: e2b, text: "Khách đã đặt một phòng đôi cho hai đêm.", lang: vi }
        - { id: e3c, text: "Khách muốn đặt một phòng đơn cho ba đêm.", lang: vi }
        - { id: e4d, text: "Khách hỏi khách sạn còn phòng đơn không.", lang: vi }
    answer:
      correct_option_id: e1a
    explanation:
      vi: "Ich habe … reserviert = tôi đã đặt (Perfekt); ein Einzelzimmer = phòng đơn (Doppelzimmer là phòng đôi); für zwei Nächte = cho hai đêm."
    display_answer: "Khách đã đặt một phòng đơn cho hai đêm."

  - key: de:exercise:a2u05l4-listen-klimaanlage
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u05-klimaanlage
    prompt:
      audio_asset_id: null
      fallback_text: Entschuldigung, in meinem Zimmer funktioniert die Klimaanlage nicht, und das Fenster geht nicht auf.
      options:
        - { id: k1a, text: "Máy lạnh không chạy và cửa sổ không mở được.", lang: vi }
        - { id: k2b, text: "Máy lạnh không chạy và vòi sen bị hỏng.", lang: vi }
        - { id: k3c, text: "Đèn không sáng và cửa sổ không đóng được.", lang: vi }
        - { id: k4d, text: "Máy lạnh chạy quá lạnh và cửa sổ không mở được.", lang: vi }
