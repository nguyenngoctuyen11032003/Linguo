    display_answer: "Máy lạnh không chạy và cửa sổ không mở được."

  - key: de:exercise:a2u05l4-mcq-ans-meer
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2u05-g-reise-praepositionen
    prompt:
      stem: "Chọn giới từ đúng: Im Sommer fahren wir ___ Meer."
      stem_lang: vi
      options:
        - { id: p1a, text: ans, lang: de }
        - { id: p2b, text: am, lang: de }
        - { id: p3c, text: nach, lang: de }
        - { id: p4d, text: in, lang: de }
    answer:
      correct_option_id: p1a
    explanation:
      vi: "fahren hỏi Wohin? → an + Akkusativ: an das Meer = ans Meer. am Meer trả lời Wo?; nach chỉ dùng cho thành phố, nước không mạo từ."
    display_answer: ans

  # ---------------- recall ----------------
  - key: de:exercise:a2u05l4-fill-nach-auf-am
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2u05-g-reise-praepositionen
    prompt:
      template: "Letzten Sommer sind wir {{b1}} Spanien geflogen. Wir waren zwei Wochen {{b2}} einer Insel und jeden Tag {{b3}} Strand."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 3 }
    answer:
      blanks:
        b1: [nach]
        b2: [auf]
        b3: [am]
    known_wrong:
      - answer: zu
        feedback_vi: "Nước không mạo từ (Spanien) dùng nach."
        error_tag: preposition
      - answer: ans
        feedback_vi: "waren hỏi Wo? → Dativ: am Strand (an dem)."
        error_tag: case_dat_akk
      - answer: an den
        feedback_vi: "waren hỏi Wo? → Dativ: am Strand."
        error_tag: case_dat_akk
    explanation:
      vi: "nach Spanien (nước không mạo từ, Wohin?); auf einer Insel (đảo, Wo? → Dativ); am Strand (an dem, Wo? → Dativ)."
    display_answer: Letzten Sommer sind wir nach Spanien geflogen. Wir waren zwei Wochen auf einer Insel und jeden Tag am Strand.

  - key: de:exercise:a2u05l4-fill-berge-bei-schweiz
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u05-g-reise-praepositionen
    prompt:
      template: "Im Winter fahren wir {{b1}} die Berge. Dort wohnen wir nicht im Hotel, wir übernachten {{b2}} Freunden zu Hause. Im Frühling fahren wir {{b3}} die Schweiz."
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 3 }
    answer:
      blanks:
        b1: [in]
        b2: [bei]
        b3: [in]
    known_wrong:
      - answer: nach
        feedback_vi: "Vùng núi và nước có mạo từ (die Schweiz) dùng in, không dùng nach."
        error_tag: preposition
      - answer: zu
        feedback_vi: "zu = đến nhà ai (đi đâu); ở nhà ai (Wo?) dùng bei."
        error_tag: preposition
    explanation:
      vi: "in die Berge (vùng núi, Wohin?); bei Freunden zu Hause (ở nhà bạn bè, Wo? → bei + Dativ); in die Schweiz (nước có mạo từ, Wohin?)."
    display_answer: Im Winter fahren wir in die Berge. Dort wohnen wir nicht im Hotel, wir übernachten bei Freunden zu Hause. Im Frühling fahren wir in die Schweiz.

  - key: de:exercise:a2u05l4-tr-insel-ruegen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u05-g-reise-praepositionen
    prompt:
      source_text: Mùa hè chúng tôi đi ra đảo Rügen.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Im Sommer fahren wir auf die Insel Rügen.
        - Wir fahren im Sommer auf die Insel Rügen.
        - Im Sommer fahren wir nach Rügen.
        - Wir fahren im Sommer nach Rügen.
        - Im Sommer reisen wir nach Rügen.
        - Wir reisen im Sommer nach Rügen.
    known_wrong:
      - answer: Im Sommer fahren wir zu die Insel Rügen.
        feedback_vi: "Ra đảo dùng auf + Akkusativ: auf die Insel Rügen (hoặc nach Rügen)."
        error_tag: preposition
      - answer: Im Sommer fahren wir auf der Insel Rügen.
        feedback_vi: "fahren hỏi Wohin? → Akkusativ: auf die Insel."
        error_tag: case_dat_akk
      - answer: Im Sommer wir fahren nach Rügen.
        feedback_vi: "Im Sommer đứng đầu thì động từ đứng ngay sau: Im Sommer fahren wir …"
        error_tag: verb_position
    explanation:
      vi: "Ra đảo: auf die Insel (Akkusativ, Wohin?) hoặc với tên riêng: nach Rügen. Động từ fahren ở vị trí 2."
    display_answer: Im Sommer fahren wir auf die Insel Rügen.

