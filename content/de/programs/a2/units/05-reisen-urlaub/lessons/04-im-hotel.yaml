title:
  vi: Ở khách sạn – giới từ du lịch, phàn nàn (Im Hotel)
objectives:
  - vi: Nói đi đâu và ở đâu khi du lịch – ans Meer/am Meer, in die Berge/in den Bergen, auf eine Insel/auf einer Insel, nach Spanien, in die Schweiz, zu Freunden/bei Freunden.
  - vi: Đặt phòng và nhận phòng ở quầy lễ tân (Einzelzimmer, Doppelzimmer, Halbpension).
  - vi: Phàn nàn lịch sự về sự cố trong phòng (Leider funktioniert … nicht. Könnten Sie …?).
  - vi: Nghe hiểu hội thoại ngắn ở khách sạn.
