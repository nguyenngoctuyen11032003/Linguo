title:
  vi: Ôn tập – bưu thiếp, blog kỳ nghỉ (Wiederholung)
objectives:
  - vi: Đọc blog du lịch viết ở Präteritum và tìm thông tin chính.
  - vi: Viết tin nhắn ngắn khoảng 20–30 từ cho bạn từ nơi nghỉ (dạng giống Goethe A2 Schreiben Teil 1).
  - vi: Kể về "chuyến đi đẹp nhất" với als, so sánh nhất và Perfekt.
  - vi: Ôn Präteritum, als/wenn, đuôi tính từ sau der/die/das, so sánh nhất và giới từ du lịch.
