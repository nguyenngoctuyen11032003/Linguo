title:
  vi: Ôn tập – e-mail kể cuối tuần (Wiederholung)
objectives:
  - vi: Đọc hiểu một bài blog du lịch ngắn kể theo trình tự (Perfekt, war/hatte, musste/konnte).
  - vi: Viết e-mail thân mật ngắn (độ dài luyện tập khoảng 40–50 từ) kể về cuối tuần theo 3 ý cho trước – dạng bài gần giống phần Viết của Goethe A2 (yêu cầu chính thức xem tài liệu của Goethe-Institut).
  - vi: Nghe hiểu tin nhắn thoại và lời giới thiệu ngắn có mốc thời gian, năm và seit.
