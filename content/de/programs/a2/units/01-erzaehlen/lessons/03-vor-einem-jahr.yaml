title:
  vi: Cách đây một năm – mốc thời gian (Vor einem Jahr)
objectives:
  - vi: Đặt sự việc đúng mốc thời gian quá khứ và tương lai với vor/nach + Dativ (vor zwei Jahren, nach der Arbeit).
  - vi: Dùng mốc thời gian không giới từ ở Akkusativ (letzte Woche, nächsten Monat, jeden Tag, dieses Jahr).
  - vi: Đọc hiểu tin nhắn ngắn có nhiều mốc thời gian (vorgestern, früher, damals, zum ersten Mal).
