  - key: de:exercise:a2u01l3-fill-letztes
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u01-g-zeitangaben-akk
    prompt:
      template: "(letzt-) {{b1}} Jahr war ich in Wien. (nächst-) {{b2}} Monat fahre ich nach Rom. Ich lerne (jed-) {{b3}} Tag Deutsch."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 9 }
        - { id: b3, width_hint: 6 }
    answer:
      blanks:
        b1: [Letztes]
        b2: [Nächsten]
        b3: [jeden]
    known_wrong:
      - answer: Letzte
        feedback_vi: das Jahr là giống trung → letztes Jahr.
        error_tag: adj_ending
      - answer: Letzten
        feedback_vi: das Jahr là giống trung → letztes Jahr (-en dành cho der Monat).
        error_tag: adj_ending
      - answer: Nächster
        feedback_vi: Mốc thời gian ở Akkusativ; der Monat → nächsten Monat.
        error_tag: case_dat_akk
      - answer: Nächste
        feedback_vi: der Monat là giống đực → nächsten Monat (Akkusativ).
        error_tag: adj_ending
      - answer: jeder
        feedback_vi: Mốc thời gian ở Akkusativ; der Tag → jeden Tag.
        error_tag: case_dat_akk
    explanation:
      vi: "Mốc thời gian không giới từ ở Akkusativ. das Jahr → letztes Jahr; der Monat → nächsten Monat; der Tag → jeden Tag."
    display_answer: "Letztes Jahr war ich in Wien. Nächsten Monat fahre ich nach Rom. Ich lerne jeden Tag Deutsch."

  - key: de:exercise:a2u01l3-fill-nach-der-arbeit
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a1u07-g-dativ-praepositionen
    prompt:
      template: "Nach {{b1}} Arbeit gehe ich oft joggen. Vor {{b2}} Essen trinke ich keinen Kaffee. Ich war vor zwei {{b3}} (das Jahr) in Deutschland."
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 7 }
    answer:
      blanks:
        b1: [der]
        b2: [dem]
        b3: [Jahren]
    known_wrong:
      - answer: die
        feedback_vi: nach đi với Dativ; die Arbeit → nach der Arbeit.
        error_tag: case_dat_akk
      - answer: das
        feedback_vi: vor (thời gian) đi với Dativ; das Essen → vor dem Essen.
        error_tag: case_dat_akk
      - answer: den
        feedback_vi: Dativ của die Arbeit là der, của das Essen là dem.
        error_tag: case_dat_akk
      - answer: Jahre
        feedback_vi: Dativ số nhiều thêm -n – vor zwei Jahren.
        error_tag: plural_form
    explanation:
      vi: "vor và nach chỉ thời gian đi với Dativ: die Arbeit → der Arbeit, das Essen → dem Essen. Dativ số nhiều: die Jahre → den Jahren, nên vor zwei Jahren."
    display_answer: "Nach der Arbeit gehe ich oft joggen. Vor dem Essen trinke ich keinen Kaffee. Ich war vor zwei Jahren in Deutschland."

  - key: de:exercise:a2u01l3-tr-vor-einem-jahr
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u01-g-vor-nach-dativ
    prompt:
      source_text: Cách đây một năm tôi đã ở Đức.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Vor einem Jahr war ich in Deutschland.
        - Ich war vor einem Jahr in Deutschland.
        - Vor einem Jahr bin ich in Deutschland gewesen.
        - Ich bin vor einem Jahr in Deutschland gewesen.
    known_wrong:
      - answer: Vor ein Jahr war ich in Deutschland.
        feedback_vi: vor + Dativ; das Jahr → vor einem Jahr.
        error_tag: case_dat_akk
      - answer: Vor einem Jahr ich war in Deutschland.
        feedback_vi: Vor einem Jahr ở vị trí 1 thì war phải ở vị trí 2 – Vor einem Jahr war ich …
        error_tag: verb_position
      - answer: Nach einem Jahr war ich in Deutschland.
        feedback_vi: "\"Cách đây\" là vor; nach einem Jahr nghĩa là \"sau một năm\"."
        error_tag: preposition
      - answer: In einem Jahr war ich in Deutschland.
        feedback_vi: "in einem Jahr là \"một năm nữa\" (tương lai); \"cách đây\" là vor."
        error_tag: preposition
    explanation:
      vi: "\"Cách đây một năm\" = vor einem Jahr (vor + Dativ). sein ở quá khứ thường dùng war; Perfekt bin … gewesen cũng đúng. Cụm thời gian ở vị trí 1 thì động từ đứng ngay sau."
    display_answer: Vor einem Jahr war ich in Deutschland.

