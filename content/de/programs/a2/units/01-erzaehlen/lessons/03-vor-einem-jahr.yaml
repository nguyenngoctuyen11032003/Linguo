  - key: de:exercise:a2u01l3-mcq-dresden-oft
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u01-mal
    prompt:
      stem: "Hallo Tim, vorgestern war ich zum ersten Mal in Dresden. Früher habe ich in Leipzig gewohnt, aber damals hatte ich nie Zeit für Ausflüge. Nach dem Frühstück haben wir die Stadt besichtigt, und am Abend waren wir in einem Konzert. Nächsten Monat fahre ich wieder hin. Kommst du mit? Liebe Grüße, Lisa — Richtig oder falsch? Lisa war schon oft in Dresden."
      stem_lang: de
      options:
        - { id: rf1, text: Richtig, lang: de }
        - { id: rf2, text: Falsch, lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Lisa viết: vorgestern war ich zum ersten Mal in Dresden – hôm kia là lần đầu tiên cô ấy đến Dresden. Vì vậy câu \"đã đến nhiều lần\" là sai."
    display_answer: Falsch

  - key: de:exercise:a2u01l3-mcq-dresden-wann
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2u01-g-zeitangaben-akk
    prompt:
      stem: "Hallo Tim, vorgestern war ich zum ersten Mal in Dresden. Früher habe ich in Leipzig gewohnt, aber damals hatte ich nie Zeit für Ausflüge. Nach dem Frühstück haben wir die Stadt besichtigt, und am Abend waren wir in einem Konzert. Nächsten Monat fahre ich wieder hin. Kommst du mit? Liebe Grüße, Lisa — Wann fährt Lisa wieder nach Dresden?"
      stem_lang: de
      options:
        - { id: q1a, text: Nächsten Monat., lang: de }
        - { id: q2b, text: Letzten Monat., lang: de }
        - { id: q3c, text: Übermorgen., lang: de }
        - { id: q4d, text: Nach dem Frühstück., lang: de }
    answer:
      correct_option_id: q1a
    explanation:
