body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được chuyện gì xảy ra khi nào, ví dụ: \"Vor einem Jahr war ich zum ersten Mal in Deutschland. Nächsten Monat fahre ich wieder hin.\""
  - type: explain
    text:
      vi: "vor (trước) và nach (sau) chỉ thời gian đi với Dativ: vor dem Essen, nach der Arbeit, nach dem Kurs. Bạn đã biết nach + Dativ khi chỉ hướng (nach Berlin); ở đây là nghĩa thời gian."
  - type: explain
    text:
      vi: "vor + một khoảng thời gian nghĩa là \"cách đây\": vor einem Jahr, vor zwei Jahren – Dativ số nhiều thêm -n vào danh từ. \"… nữa\" trong tương lai thì dùng in: in zwei Jahren (hai năm nữa). nach zwei Jahren là \"sau hai năm\", tính từ một mốc trong câu chuyện."
  - type: explain
    text:
      vi: "Với letzt- (trước), nächst- (tới), jed- (mỗi), dies- (này), bạn KHÔNG dùng giới từ, và cụm từ ở Akkusativ: letzte Woche, nächsten Monat, jeden Tag, dieses Jahr. Đuôi theo giống: der Monat → -en, die Woche → -e, das Jahr → -es. Tiếng Việt nói \"vào tuần trước\", nhưng tiếng Đức không có \"in\"."
  - type: explain
    text:
      vi: "So sánh với am/im/um đã học: am Montag, im Mai, um acht Uhr có giới từ; letzten Montag, nächsten Mai, jeden Morgen thì không. Mốc thời gian đứng đầu câu vẫn chiếm vị trí 1, động từ đứng ngay sau."
  - type: explain
    text:
      vi: "Trạng từ thời gian: vorgestern (hôm kia), übermorgen (ngày kia), neulich (hôm nọ), gerade (vừa mới / đang), bald (sắp), vorher (trước đó), nachher (lát nữa). früher là \"trước đây\" nói chung, damals là \"hồi đó\" – một thời điểm đã nhắc tới."
  - type: deep_explain
    text:
      vi: "Vì sao letzte Woche ở Akkusativ? Tiếng Đức dùng Akkusativ không giới từ để chỉ thời điểm hoặc khoảng thời gian: Ich war eine Woche in Wien (một tuần), Ich gehe jeden Tag joggen (mỗi ngày). Đuôi của letzt-/nächst- giống đuôi của der/die/das ở Akkusativ: den Monat → letzten Monat, die Woche → letzte Woche, das Jahr → letztes Jahr. Bạn có thể gặp dạng dài có giới từ (in der letzten Woche), nhưng dạng ngắn là cách nói thông dụng nhất. das Mal (lần) cũng dùng như vậy: das nächste Mal, jedes Mal, còn zum ersten Mal có zum (= zu dem) nên đuôi là -en."
  - type: example
    target: Vor einem Jahr war ich zum ersten Mal in Deutschland.
    target_lang: de
    translation:
      vi: Cách đây một năm tôi đến Đức lần đầu tiên.
    note:
      vi: vor einem Jahr = cách đây một năm (vor + Dativ, das Jahr → einem Jahr). zum ersten Mal = lần đầu tiên.
  - type: example
    target: Nach der Arbeit bin ich sofort nach Hause gefahren.
    target_lang: de
    translation:
      vi: Sau giờ làm tôi về nhà ngay.
    note:
      vi: nach der Arbeit = sau giờ làm (die Arbeit → der Arbeit, Dativ). Cả cụm ở vị trí 1, nên bin đứng ngay sau.
  - type: example
    target: Letzten Montag war ich krank, aber nächste Woche habe ich frei.
    target_lang: de
    translation:
      vi: Thứ Hai tuần trước tôi bị ốm, nhưng tuần tới tôi được nghỉ.
    note:
      vi: "Không có giới từ: der Montag → letzten Montag, die Woche → nächste Woche. So sánh: am Montag (có am)."
  - type: example
    target: Früher habe ich in Hanoi gewohnt. Damals konnte ich noch kein Deutsch.
    target_lang: de
    translation:
      vi: Trước đây tôi sống ở Hà Nội. Hồi đó tôi chưa biết tiếng Đức.
    note:
      vi: früher = trước đây (so với bây giờ); damals = hồi đó, chỉ đúng thời gian vừa nhắc.
  - type: example
    target: Ich bin gerade nach Hause gekommen. Ich rufe dich nachher an, okay?
    target_lang: de
    translation:
      vi: Mình vừa mới về đến nhà. Lát nữa mình gọi cho bạn nhé?
    note:
      vi: Nói với bạn bè (du). gerade + Perfekt = vừa mới; nachher = lát nữa.
  - type: common_mistake
    wrong: Ich war vor zwei Jahre in Berlin.
    right: Ich war vor zwei Jahren in Berlin.
    target_lang: de
    note:
      vi: vor + Dativ; Dativ số nhiều thêm -n vào danh từ – vor zwei Jahren.
  - type: common_mistake
    wrong: In letzte Woche war ich krank.
    right: Letzte Woche war ich krank.
    target_lang: de
    note:
      vi: Mốc thời gian với letzt- không cần giới từ (Akkusativ) – Letzte Woche …
  - type: common_mistake
    wrong: Nach zwei Wochen fahre ich nach Hause.
    right: In zwei Wochen fahre ich nach Hause.
    target_lang: de
    note:
      vi: "Muốn nói \"hai tuần nữa\" (tính từ bây giờ) thì dùng in + Dativ; nach zwei Wochen là \"sau hai tuần\" tính từ một mốc khác trong câu chuyện."
  - type: common_mistake
    wrong: Ich war zum erste Mal in Wien.
    right: Ich war zum ersten Mal in Wien.
    target_lang: de
    note:
      vi: zum = zu dem (Dativ), nên số thứ tự có đuôi -en – zum ersten Mal.
  - type: summary
    points:
      - vi: "vor/nach + Dativ: vor dem Essen, nach der Arbeit."
      - vi: "vor zwei Jahren = cách đây hai năm; in zwei Jahren = hai năm nữa; nach zwei Jahren = sau hai năm."
      - vi: "Không giới từ, Akkusativ: letzten Monat, letzte Woche, letztes Jahr; nächst-, jed-, dies- cũng vậy."
      - vi: "am/im/um có giới từ; letzt-/nächst-/jed-/dies- thì không."
      - vi: "vorgestern – gestern – heute – morgen – übermorgen."
      - vi: "früher (trước đây) / damals (hồi đó) / neulich (hôm nọ) / gerade (vừa mới, đang) / bald (sắp)."
      - vi: "zum ersten Mal = lần đầu tiên."
