title:
  vi: Lý lịch của tôi – seit, năm (Mein Lebenslauf)
objectives:
  - vi: Kể các mốc đời mình (sinh, đi học, học nghề hoặc đại học, kết hôn) với năm đọc đúng.
  - vi: Nói việc bắt đầu trong quá khứ và còn kéo dài đến nay bằng seit + thì hiện tại.
  - vi: Nghe hiểu một đoạn phỏng vấn ngắn về tiểu sử.
