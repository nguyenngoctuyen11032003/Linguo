    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u01-besichtigen
    prompt:
      instruction: "Sắp xếp thành câu: \"Thứ Bảy chúng tôi đã tham quan một bảo tàng.\""
      tokens:
        - { id: x-museum, text: Museum }
        - { id: x-haben, text: haben }
        - { id: x-sind, text: sind }
        - { id: x-samstag, text: Samstag }
        - { id: x-ein, text: ein }
        - { id: x-besichtigt, text: besichtigt }
        - { id: x-wir, text: wir }
        - { id: x-am, text: Am }
    answer:
      orders:
        - [x-am, x-samstag, x-haben, x-wir, x-ein, x-museum, x-besichtigt]
    explanation:
      vi: "Am Samstag ở vị trí 1, nên haben ở vị trí 2 và chủ ngữ wir đứng sau. Partizip besichtigt (không có ge- vì be- không nhấn) đứng cuối câu. besichtigen đi với haben, nên token sind là thừa."
    display_answer: Am Samstag haben wir ein Museum besichtigt.

