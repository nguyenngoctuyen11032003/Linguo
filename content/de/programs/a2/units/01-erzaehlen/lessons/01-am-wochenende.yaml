title:
  vi: Cuối tuần của bạn thế nào? – Perfekt mở rộng (Was hast du erlebt?)
objectives:
  - vi: Kể chi tiết một trải nghiệm bằng Perfekt, kể cả với động từ có tiền tố không tách (besucht, vergessen) và động từ -ieren (telefoniert).
  - vi: Nhận ra khi nào Partizip II không có ge- nhờ trọng âm của từ.
  - vi: Chọn đúng haben hoặc sein, đặc biệt với passieren (ist passiert).
estimated_minutes: 17
skills: [grammar, vocabulary, speaking]
