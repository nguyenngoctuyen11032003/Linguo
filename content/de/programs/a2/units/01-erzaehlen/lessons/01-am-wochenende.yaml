        - Thứ Bảy chúng mình đã tham quan thành phố và chụp rất nhiều ảnh.
        - Thứ Bảy chúng tôi đã thăm thành phố và chụp rất nhiều ảnh.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Thứ Bảy chúng tôi sẽ tham quan thành phố và chụp rất nhiều ảnh.
        feedback_vi: haben … besichtigt, fotografiert là Perfekt – việc đã xảy ra, không phải "sẽ".
        error_tag: tense_meaning
    explanation:
      vi: "besichtigt là Partizip của besichtigen (tham quan), fotografiert là của fotografieren (chụp ảnh); cả hai dùng chung haben. Tiếng Việt không bắt buộc thêm \"đã\" khi đã có mốc thời gian."
    display_answer: Thứ Bảy chúng tôi đã tham quan thành phố và chụp rất nhiều ảnh.

