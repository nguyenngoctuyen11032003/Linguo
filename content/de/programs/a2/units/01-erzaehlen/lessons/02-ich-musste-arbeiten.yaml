title:
  vi: Tôi đã phải làm việc – Präteritum của động từ khiếm khuyết (Ich musste arbeiten.)
objectives:
  - vi: Kể việc mình đã phải, đã muốn, đã không thể làm bằng musste, wollte, konnte, durfte, sollte, mochte.
  - vi: Sắp xếp câu chuyện theo trình tự với zuerst, dann, danach, später, zum Schluss và giữ động từ ở vị trí 2.
  - vi: Kể một sự cố trên đường (Panne, Stau, Unfall).
