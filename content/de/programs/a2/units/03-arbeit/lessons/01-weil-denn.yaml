    explanation:
      vi: "Trả lời Warum? bằng một câu phụ với weil là tự nhiên. Trong câu phụ: chủ ngữ ich ngay sau weil, nguyên thể verdienen rồi đến modal möchte ở cuối."
    display_answer: Weil ich mehr Geld verdienen möchte.
