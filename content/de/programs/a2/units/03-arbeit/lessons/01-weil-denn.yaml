        - Hôm nay tôi rất mệt vì tôi làm thêm giờ.
        - Hôm nay tôi rất mệt bởi vì tôi đã làm thêm giờ.
        - Hôm nay tôi rất mệt vì tôi đã làm ngoài giờ.
