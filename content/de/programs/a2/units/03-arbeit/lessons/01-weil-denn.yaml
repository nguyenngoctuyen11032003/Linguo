  - key: de:exercise:a2u03l1-wb-denn-auto
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-g-denn
    prompt:
      instruction: "Sắp xếp thành câu (dùng denn): \"Hôm nay tôi đi xe buýt vì ô tô của tôi bị hỏng.\""
      tokens:
        - { id: t-kaputt, text: kaputt }
        - { id: t-bus, text: Bus }
        - { id: t-denn, text: denn }
        - { id: t-ist, text: ist }
        - { id: t-ich, text: Ich }
        - { id: t-mein, text: mein }
        - { id: t-den, text: den }
        - { id: t-komma, text: "," }
        - { id: t-heute, text: heute }
