title:
  vi: Vì tôi… – câu phụ với weil, denn (Weil ich früh anfangen muss)
objectives:
  - vi: Giải thích lý do bằng weil (thích hay không thích công việc, đến muộn, làm bán thời gian…).
  - vi: Đặt động từ chia ở cuối câu phụ, kể cả với động từ tách, modal và Perfekt.
  - vi: Dùng denn ở vị trí 0 và phân biệt denn với weil.
  - vi: Nói về điều kiện làm việc (giờ làm, lương, toàn thời gian/bán thời gian, tan làm).
estimated_minutes: 16
