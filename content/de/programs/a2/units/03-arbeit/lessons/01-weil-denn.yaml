  - key: de:exercise:a2u03l1-mcq-warum-stelle
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-g-weil
    prompt:
      stem: "Đồng nghiệp hỏi bạn: \"Warum suchst du eine neue Stelle?\" Câu trả lời nào đúng?"
      stem_lang: vi
      options:
        - { id: f6s, text: Weil ich mehr Geld verdienen möchte., lang: de }
        - { id: g1v, text: Weil ich möchte mehr Geld verdienen., lang: de }
        - { id: h3j, text: Weil ich mehr Geld möchte verdienen., lang: de }
        - { id: j8e, text: Weil mehr Geld ich verdienen möchte., lang: de }
    answer:
