    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-g-weil
    prompt:
      instruction: "Sắp xếp thành câu: \"Tôi học tiếng Đức vì tôi muốn trở thành điều dưỡng ở Đức.\""
      tokens:
