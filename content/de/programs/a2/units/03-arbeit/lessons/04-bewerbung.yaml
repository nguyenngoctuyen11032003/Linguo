        - { id: t-deutsch, text: Deutsch }
        - { id: t-weil, text: weil }
        - { id: t-ich-gross, text: Ich }
        - { id: t-in, text: in }
        - { id: t-moechte, text: möchte }
        - { id: t-komma, text: "," }
        - { id: t-pflege, text: Pflegefachfrau }
        - { id: t-lerne, text: lerne }
        - { id: t-deutschland, text: Deutschland }
        - { id: t-ich-klein, text: ich }
    answer:
      orders:
        - [t-ich-gross, t-lerne, t-deutsch, t-komma, t-weil, t-ich-klein, t-in, t-deutschland, t-pflege, t-werden, t-moechte]
    explanation:
      vi: "Trong câu phụ với weil: nguyên thể werden rồi modal möchte ở cuối cùng; nghề Pflegefachfrau đứng ngay trước werden, không có mạo từ."
    display_answer: Ich lerne Deutsch, weil ich in Deutschland Pflegefachfrau werden möchte.

  - key: de:exercise:a2u03l4-mcq-meine-schwaeche
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-schwaeche
    prompt:
      stem: "Người phỏng vấn hỏi: \"Was sind Ihre Schwächen?\" Câu trả lời nào đúng ngữ pháp?"
      stem_lang: vi
      options:
        - { id: u1s, text: "Meine Schwäche ist, dass ich manchmal zu schnell arbeite.", lang: de }
        - { id: u2s, text: "Meine Schwäche ist, dass ich arbeite manchmal zu schnell.", lang: de }
        - { id: u3s, text: "Mein Schwäche ist, dass ich manchmal zu schnell arbeite.", lang: de }
        - { id: u4s, text: "Meine Schwäche ist, das ich manchmal zu schnell arbeite.", lang: de }
    answer:
      correct_option_id: u1s
    explanation:
      vi: "die Schwäche là giống cái nên meine; sau dass động từ arbeite đứng cuối; liên từ viết dass (hai chữ s)."
    display_answer: "Meine Schwäche ist, dass ich manchmal zu schnell arbeite."

  - key: de:exercise:a2u03l4-tr-koch-geworden-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u03-praktikum
    prompt:
      source_text: Nach dem Praktikum ist er Koch geworden.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Sau kỳ thực tập, anh ấy đã trở thành đầu bếp.
        - Sau kỳ thực tập anh ấy đã trở thành đầu bếp.
        - Sau kỳ thực tập, anh ấy trở thành đầu bếp.
        - Sau khi thực tập, anh ấy đã trở thành đầu bếp.
        - Sau khi thực tập, anh ấy trở thành đầu bếp.
        - Sau đợt thực tập, anh ấy đã trở thành đầu bếp.
        - Sau kỳ thực tập, anh ấy đã thành đầu bếp.
        - Sau kỳ thực tập, ông ấy đã trở thành đầu bếp.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Sau kỳ thực tập, anh ấy muốn trở thành đầu bếp.
        feedback_vi: "geworden là Perfekt của werden: đã trở thành, không phải \"muốn\"."
        error_tag: werden_wollen
    explanation:
      vi: "ist … geworden = đã trở thành (Perfekt của werden với sein); nach dem Praktikum = sau kỳ thực tập; Koch = đầu bếp."
    display_answer: Sau kỳ thực tập, anh ấy đã trở thành đầu bếp.
