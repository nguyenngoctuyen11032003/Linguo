objectives:
  - vi: Nói mục tiêu nghề nghiệp bằng werden (Ich möchte Ingenieurin werden. Mein Bruder wird Koch.).
  - vi: Chia werden ở hiện tại (ich werde, du wirst, er wird …) và dùng Perfekt ist geworden.
  - vi: Nói điểm mạnh, điểm yếu của mình trong một buổi phỏng vấn ngắn.
  - vi: Nghe một đoạn phỏng vấn xin việc ngắn và bắt thông tin chính.
