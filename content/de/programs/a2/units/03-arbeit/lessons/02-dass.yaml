  - key: de:exercise:a2u03l2-wb-glaube-klein
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-glauben
    prompt:
      instruction: "Sắp xếp thành câu: \"Tôi nghĩ là hôm nay bà Klein không đến.\""
      tokens:
        - { id: t-kommt, text: kommt }
        - { id: t-dass, text: dass }
        - { id: t-ich, text: Ich }
        - { id: t-nicht, text: nicht }
        - { id: t-frau, text: Frau }
        - { id: t-komma, text: "," }
        - { id: t-heute, text: heute }
        - { id: t-glaube, text: glaube }
        - { id: t-klein, text: Klein }
    answer:
      orders:
        - [t-ich, t-glaube, t-komma, t-dass, t-frau, t-klein, t-heute, t-nicht, t-kommt]
    explanation:
      vi: "Ich glaube, dấu phẩy, dass + câu phụ: chủ ngữ Frau Klein, rồi heute nicht, động từ kommt ở cuối."
    display_answer: Ich glaube, dass Frau Klein heute nicht kommt.

  - key: de:exercise:a2u03l2-mcq-arbeitszeiten-sind
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:a2u03-meinen
    prompt:
      stem: "Đồng nghiệp hỏi: \"Wie findest du die Arbeitszeiten?\" Bạn muốn nói: \"Mình thấy là chúng hơi dài quá.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: z1k, text: "Ich finde, dass sie ein bisschen zu lang sind.", lang: de }
        - { id: z2l, text: "Ich finde, dass sie ein bisschen zu lang ist.", lang: de }
        - { id: z3m, text: "Ich finde, dass sind sie ein bisschen zu lang.", lang: de }
        - { id: z4n, text: "Ich finde, das sie ein bisschen zu lang sind.", lang: de }
    answer:
      correct_option_id: z1k
    explanation:
      vi: "die Arbeitszeiten là số nhiều nên sie … sind; sau dass động từ đứng cuối; liên từ viết dass (hai chữ s)."
    display_answer: "Ich finde, dass sie ein bisschen zu lang sind."

  - key: de:exercise:a2u03l2-tr-projekt-wichtig-vi
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    item: de:item:a2u03-projekt
    prompt:
      source_text: Ich glaube, dass das Projekt sehr wichtig ist.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Tôi nghĩ là dự án rất quan trọng.
        - Tôi nghĩ rằng dự án rất quan trọng.
        - Tôi nghĩ dự án rất quan trọng.
        - Tôi tin là dự án rất quan trọng.
        - Tôi tin rằng dự án rất quan trọng.
        - Tôi cho rằng dự án rất quan trọng.
        - Tôi nghĩ là dự án này rất quan trọng.
        - Tôi nghĩ rằng dự án này rất quan trọng.
        - Mình nghĩ là dự án rất quan trọng.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Tôi nghĩ là dự án không quan trọng.
        feedback_vi: "Câu không có nicht: dự án rất quan trọng (sehr wichtig)."
        error_tag: negation_added
    explanation:
      vi: "glauben, dass … = nghĩ là, tin rằng; das Projekt = dự án; wichtig = quan trọng. Ở đây das là mạo từ, dass là liên từ."
    display_answer: Tôi nghĩ là dự án rất quan trọng.
