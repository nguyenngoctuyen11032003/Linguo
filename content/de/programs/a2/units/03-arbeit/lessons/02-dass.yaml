title:
  vi: Tôi thấy rằng… – dass (Ich finde, dass …)
objectives:
  - vi: Nêu ý kiến đơn giản về công việc và đồng nghiệp bằng Ich finde / glaube / denke / meine, dass …
  - vi: Viết đúng dass (liên từ) và phân biệt với das.
  - vi: Đặt câu phụ ở đầu câu và để động từ câu chính ngay sau dấu phẩy (Weil ich krank bin, bleibe ich zu Hause.).
  - vi: Đánh giá công việc bằng tính từ (interessant, anstrengend, stressig, wichtig, selbstständig…).
