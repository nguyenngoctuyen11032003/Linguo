title:
  vi: Gọi điện ở công ty – động từ đi với Dativ (Kann ich Ihnen helfen?)
objectives:
  - vi: Nhận cuộc gọi ở công ty, nối máy, nhận lời nhắn và hẹn gọi lại.
  - vi: Dùng các động từ đi với Dativ (helfen, danken, gehören, gratulieren, zuhören, fehlen, schmecken, antworten).
  - vi: Phân biệt động từ + Dativ (Ich helfe dir) với động từ + Akkusativ (Ich rufe dich an).
