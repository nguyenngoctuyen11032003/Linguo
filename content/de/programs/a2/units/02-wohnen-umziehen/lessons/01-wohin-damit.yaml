title:
  vi: Để cái này ở đâu? – giới từ hai cách (Wohin stellen wir das Sofa?)
objectives:
  - vi: Sắp xếp đồ khi chuyển nhà – nói đặt cái gì vào đâu với Wohin? + Akkusativ (Ich stelle das Sofa ans Fenster).
  - vi: Nói đồ vật đang ở đâu với Wo? + Dativ (Das Sofa steht am Fenster).
  - vi: Phân biệt cặp động từ stellen/stehen, legen/liegen, setzen/sitzen và hai nghĩa của hängen.
  - vi: Nhờ người cùng chuyển nhà đặt đồ bằng câu mệnh lệnh (Stell den Karton bitte in den Keller!).
estimated_minutes: 18
skills: [grammar, vocabulary, speaking]
prerequisites: [de:lesson:a2u01-wiederholung]
