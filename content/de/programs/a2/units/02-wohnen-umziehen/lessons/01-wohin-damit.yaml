    item: de:item:a1u05-g-possessiv-plural
    prompt:
      source_text: Chúng tôi kê cái bàn vào bếp của chúng tôi.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Wir stellen den Tisch in unsere Küche.
        - Den Tisch stellen wir in unsere Küche.
        - In unsere Küche stellen wir den Tisch.
        - Wir stellen den Tisch in die Küche.
        - Den Tisch stellen wir in die Küche.
    known_wrong:
      - answer: Wir stellen den Tisch in unserer Küche.
        feedback_vi: "Kê vào bếp là Wohin? → Akkusativ: in unsere Küche. in unserer Küche (Dativ) là vị trí: Der Tisch steht in unserer Küche."
        error_tag: case_dat_akk
      - answer: Wir legen den Tisch in unsere Küche.
        feedback_vi: "Cái bàn đứng trên bốn chân nên dùng stellen; legen là đặt nằm."
        error_tag: verb_choice
      - answer: Wir stellen der Tisch in unsere Küche.
        feedback_vi: "der Tisch là tân ngữ của stellen nên ở Akkusativ: den Tisch."
        error_tag: case_dat_akk
    explanation:
      vi: "Cái bàn được đặt đứng → stellen; đặt tới bếp (Wohin?) → in + Akkusativ: die Küche → in unsere Küche (unser + -e cho giống cái). Tân ngữ der Tisch → den Tisch."
    display_answer: Wir stellen den Tisch in unsere Küche.
