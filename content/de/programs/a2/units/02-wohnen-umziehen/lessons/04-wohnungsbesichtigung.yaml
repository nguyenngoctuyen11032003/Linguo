title:
  vi: Xem nhà – Dativ sau ein (Die Wohnungsbesichtigung)
objectives:
  - vi: Gọi điện hỏi về căn hộ trong tin rao và hẹn đi xem nhà.
  - vi: Hỏi và hiểu các khoản chi phí – Kaltmiete, Nebenkosten, Warmmiete, Kaution.
  - vi: Nghe cuộc xem nhà và ghi lại thông tin chính (diện tích, tầng, giá, ngày dọn vào).
  - vi: Dùng tính từ sau einem/einer/meinen ở Dativ với đuôi -en (in einer kleinen Wohnung).
