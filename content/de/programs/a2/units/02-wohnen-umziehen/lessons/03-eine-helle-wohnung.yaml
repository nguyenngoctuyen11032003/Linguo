level: a2
title:
  vi: Một căn hộ sáng sủa – đuôi tính từ sau ein (Eine helle Wohnung)
objectives:
  - vi: Tả căn hộ, căn phòng chi tiết bằng tính từ đứng trước danh từ (eine helle Küche, ein ruhiges Zimmer).
  - vi: Chọn đúng đuôi tính từ sau ein/kein/mein ở Nominativ và Akkusativ (Wir haben einen großen Balkon).
  - vi: Phân biệt tính từ đứng sau sein (không đuôi) với tính từ đứng trước danh từ (có đuôi).
  - vi: Đọc hiểu đoạn mô tả căn hộ ngắn.
