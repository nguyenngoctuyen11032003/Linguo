        - Xin lỗi, tôi đến muộn vì xe buýt không tới.
        - Xin lỗi, tôi bị muộn vì xe buýt không đến.
        - Xin lỗi, tôi đã đến trễ vì xe buýt không đến.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Entschuldigung, ich habe mich verspätet, weil der Bus nicht gekommen ist.\" nghĩa là: Xin lỗi, tôi đến muộn vì xe buýt không tới. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Xin lỗi, tôi đến muộn vì xe buýt không tới.
