      stem_lang: vi
      options:
        - { id: tog, text: sich verspäten, lang: de }
        - { id: tfa, text: verkaufen, lang: de }
        - { id: ozu, text: prüfen, lang: de }
        - { id: dso, text: berühren, lang: de }
