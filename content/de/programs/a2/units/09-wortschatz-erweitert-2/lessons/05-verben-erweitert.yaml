body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng hơn hai mươi động từ thông dụng, kể cả bất quy tắc, tách và có sich, ở thì hiện tại và Perfekt.
  - type: explain
    text:
      vi: "Động từ có tiền tố be-, ent-, er-, ver-, zer- là động từ không tách, và Partizip II không thêm ge-: benutzen → hat benutzt, beschreiben → hat beschrieben, erkennen → hat erkannt, entscheiden → hat entschieden, verkaufen → hat verkauft, zerbrechen → ist zerbrochen."
  - type: explain
    text:
      vi: "Động từ tách có phần đầu tách ra ở câu chính: Komm doch morgen vorbei! Er gibt zu viel Geld aus. Du musst gut aufpassen. Ở Perfekt, ge- nằm giữa: vorbeigekommen, ausgegeben, aufgepasst. Ở nguyên thể và sau muss, vẫn viết liền: Du musst gut aufpassen."
  - type: explain
    text:
      vi: "Một số cặp dễ nhầm: leihen (cho mượn, đã học) và ausleihen (mượn ở thư viện), versprechen (hứa) và sprechen (nói), ziehen (kéo) và umziehen (chuyển nhà). Với sich verspäten, hãy chia sich theo chủ ngữ: ich verspäte mich, du verspätest dich, er verspätet sich."
  - type: deep_explain
    text:
      vi: "Zerbrechen có hai cách dùng: không có tân ngữ nghĩa là vỡ ra (Das Glas ist zerbrochen) và dùng sein ở Perfekt; có tân ngữ nghĩa là làm vỡ (Ich habe das Glas zerbrochen) và dùng haben. Ziehen ở nghĩa kéo thường dùng với Tür: Bitte ziehen (biển trên cửa), ngược lại là drücken (đẩy)."
  - type: example
    target: Darf ich dein Handy benutzen?
    target_lang: de
    translation:
      vi: Tôi có thể dùng điện thoại của bạn không?
    note:
      vi: benutzen = dùng, sử dụng.
  - type: example
    target: Der Chef entscheidet heute.
    target_lang: de
    translation:
      vi: Hôm nay sếp quyết định.
    note:
      vi: entscheiden = quyết định.
  - type: example
    target: Der Lehrer prüft die Hausaufgaben.
    target_lang: de
    translation:
      vi: Thầy giáo kiểm tra bài tập về nhà.
    note:
      vi: prüfen = kiểm tra.
  - type: example
    target: Er verkauft sein altes Auto.
    target_lang: de
    translation:
      vi: Anh ấy bán chiếc xe cũ của mình.
    note:
      vi: verkaufen = bán.
  - type: common_mistake
    wrong: Ich habe mich verspäte.
    right: Ich habe mich verspätet.
    target_lang: de
    note:
      vi: "Partizip II của động từ có -et- ở thân thêm -et: verspätet."
  - type: common_mistake
    wrong: Er hat das Auto gebenutzt.
    right: Er hat das Auto benutzt.
    target_lang: de
    note:
      vi: Động từ có tiền tố be- không thêm ge- ở Partizip II.
  - type: summary
    points:
      - vi: "be-, ent-, er-, ver-, zer- là tiền tố không tách: Partizip II không có ge- (benutzt, beschrieben, erkannt, entschieden, verkauft)."
      - vi: "Động từ tách: vorbeikommen, ausgeben, aufpassen, ausleihen; Perfekt: vorbeigekommen, ausgegeben, aufgepasst, ausgeliehen."
      - vi: "sich verspäten: ich verspäte mich; Perfekt Ich habe mich verspätet."
exercises:
