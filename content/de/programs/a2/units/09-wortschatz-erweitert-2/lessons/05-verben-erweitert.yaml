order_index: 5
level: a2
title:
  vi: Thêm động từ thông dụng (Verben erweitern)
objectives:
  - vi: Dùng thêm hơn hai mươi động từ thông dụng ở cấp A2 với đầy đủ ba dạng chính.
  - vi: Phân biệt động từ tách (vorbeikommen, ausgeben, aufpassen) và không tách (benutzen, beschreiben, erkennen).
  - vi: Dùng sich verspäten và các động từ có sich.
estimated_minutes: 15
