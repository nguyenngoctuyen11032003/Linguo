        - Kannst du mir ein Buch in der Bibliothek ausleihen?
    explanation:
      vi: "Gợi ý đáp án: Kannst du mir in der Bibliothek ein Buch ausleihen? Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Kannst du mir in der Bibliothek ein Buch ausleihen?
    item: de:item:a2w2-ausleihen
  - key: de:exercise:a2w2l5-tr-satz-de-vi-1
    type: translate
