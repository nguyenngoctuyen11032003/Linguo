    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w2-ziehen
    prompt:
      audio_asset_id: null
      fallback_text: Bitte ziehen Sie die Tür, nicht drücken.
      options:
        - { id: qdo, text: "Xin hãy kéo cửa, đừng đẩy.", lang: vi }
        - { id: uzj, text: Chúng ta đổi chỗ nhé?, lang: vi }
        - { id: xi2, text: Thầy giáo kiểm tra bài tập về nhà., lang: vi }
        - { id: jz9, text: Tôi nhận ra anh ấy ngay lập tức., lang: vi }
    answer:
      correct_option_id: qdo
    explanation:
      vi: Câu bạn nghe có nghĩa "Xin hãy kéo cửa, đừng đẩy.". Từ khoá là ziehen (kéo); các câu còn lại nói về những từ khác trong bài.
    display_answer: Xin hãy kéo cửa, đừng đẩy.
