  - key: de:exercise:a2w2l5-mcq-luecke-benutzen
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-benutzen
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Tôi có thể dùng điện thoại của bạn không?\": Darf ich dein Handy ___?"
      stem_lang: vi
      options:
        - { id: i5f, text: benutzen, lang: de }
        - { id: q2z, text: versteckt, lang: de }
        - { id: kt6, text: berühren, lang: de }
        - { id: dfa, text: aus, lang: de }
