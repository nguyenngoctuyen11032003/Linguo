  - key: de:exercise:a2w2l3-mcq-artikel-kassenbon
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-kassenbon
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Kassenbon\" (hóa đơn (ở quầy)): ___ Kassenbon"
      stem_lang: vi
      options:
        - { id: jb7, text: das, lang: de }
        - { id: va5, text: der, lang: de }
        - { id: pab, text: ein, lang: de }
        - { id: iym, text: die, lang: de }
    answer:
      correct_option_id: va5
    explanation:
      vi: "Kassenbon là danh từ giống đực (der): der Kassenbon; số nhiều: die Kassenbons. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: der
