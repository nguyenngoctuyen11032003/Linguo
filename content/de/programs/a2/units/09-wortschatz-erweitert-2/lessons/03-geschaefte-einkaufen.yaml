body:
  - type: objective
    text:
      vi: Sau bài này, bạn biết mua gì ở đâu, hiểu các từ về giá và thanh toán, và hỏi được về việc đổi hàng.
  - type: explain
    text:
      vi: "Tên cửa hàng thường là danh từ ghép với -laden, -geschäft, -handlung hoặc -rie: der Blumenladen, das Lebensmittelgeschäft, die Buchhandlung, die Drogerie. Hỏi ở đâu bán gì bạn dùng Wo bekomme ich …? hoặc Wo kann ich … kaufen?; trả lời dùng in + Dativ: in der Drogerie."
  - type: explain
    text:
      vi: "Khi trả tiền, bạn thấy der Kassenbon (hóa đơn tại quầy), die Quittung (biên lai), das Wechselgeld (tiền thừa) và das Kleingeld (tiền lẻ). Hỏi cách thanh toán: Zahlen Sie bar oder mit Karte? Bar là tiền mặt, mit Karte là bằng thẻ."
  - type: explain
    text:
      vi: "Biển giảm giá thường thấy: das Sonderangebot (hàng giá đặc biệt), der Schlussverkauf (đợt bán hết hàng cuối mùa), reduziert (đã giảm giá). Muốn đổi hàng bạn nói Ich möchte das umtauschen; danh từ là der Umtausch, thường cần Kassenbon."
  - type: deep_explain
    text:
      vi: Ở Đức, bạn thường phải mang túi riêng hoặc trả tiền túi (die Tüte kostet extra). Ở siêu thị nhỏ, đôi khi bạn phải bỏ một đồng xu vào der Einkaufswagen để mở khóa, và lấy lại khi trả xe. Chính sách đổi trả của mỗi cửa hàng khác nhau, nên hãy hỏi trước khi mua.
  - type: example
    target: Ich kaufe das Buch in der Buchhandlung.
    target_lang: de
    translation:
      vi: Tôi mua quyển sách ở hiệu sách.
    note:
      vi: die Buchhandlung = hiệu sách.
  - type: example
    target: Zahnpasta gibt es in der Drogerie.
    target_lang: de
    translation:
      vi: Kem đánh răng có ở cửa hàng đồ vệ sinh.
    note:
      vi: die Drogerie = cửa hàng mỹ phẩm, đồ vệ sinh.
  - type: example
    target: Am Kiosk kaufe ich eine Zeitung.
    target_lang: de
    translation:
      vi: Tôi mua tờ báo ở quầy báo.
    note:
      vi: der Kiosk = quầy bán báo, đồ ăn vặt.
  - type: example
    target: Wir kaufen Rosen im Blumenladen.
    target_lang: de
    translation:
      vi: Chúng tôi mua hoa hồng ở cửa hàng hoa.
    note:
      vi: der Blumenladen = cửa hàng hoa.
  - type: common_mistake
    wrong: Ich kaufe das Buch bei der Buchhandlung.
    right: Ich kaufe das Buch in der Buchhandlung.
    target_lang: de
    note:
      vi: Nói mua ở cửa hàng thì dùng in + Dativ. Bei dùng cho người (beim Bäcker) hoặc nơi làm việc.
  - type: common_mistake
    wrong: Ich zahle mit bar.
    right: Ich zahle bar.
    target_lang: de
    note:
      vi: Bar là trạng từ, không cần mit; mit Karte là bằng thẻ.
  - type: summary
    points:
      - vi: "der Blumenladen, die Buchhandlung, die Drogerie, der Kiosk, das Lebensmittelgeschäft, das Warenhaus, das Einkaufszentrum, die Fußgängerzone."
      - vi: "der Kassenbon, die Quittung, das Wechselgeld, das Kleingeld; bar zahlen / mit Karte zahlen."
      - vi: "das Sonderangebot, der Schlussverkauf, reduziert, der Umtausch."
