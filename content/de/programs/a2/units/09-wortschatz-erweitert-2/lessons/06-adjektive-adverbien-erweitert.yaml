    explanation:
      vi: "Gợi ý đáp án: Meistens esse ich zu Hause, aber manchmal gehe ich essen. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Meistens esse ich zu Hause, aber manchmal gehe ich essen.
