level: a2
title:
  vi: Thêm tính từ và trạng từ hay dùng (Adjektive und Adverbien erweitern)
objectives:
  - vi: Dùng các tính từ và trạng từ chỉ mức độ, tần suất và đánh giá thường gặp ở A2.
  - vi: Phân biệt tính từ (đứng sau sein) và trạng từ (bổ nghĩa động từ).
  - vi: Dùng etwa, mindestens, höchstens để nói số lượng ước chừng.
estimated_minutes: 14
