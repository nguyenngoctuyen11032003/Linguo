body:
  - type: objective
    text:
      vi: Sau bài này, bạn diễn đạt mức độ, tần suất và số lượng ước chừng chính xác hơn bằng nhiều tính từ và trạng từ hơn.
  - type: explain
    text:
      vi: "Nhiều từ trong bài vừa là tính từ vừa là trạng từ mà không đổi dạng: Er fährt vorsichtig (trạng từ). Die Straße ist gefährlich (tính từ). Chỉ khi tính từ đứng trước danh từ bạn mới thêm đuôi: ein gefährlicher Weg."
  - type: explain
    text:
      vi: "Etwa, mindestens, höchstens dùng trước con số: Das kostet etwa zehn Euro. Du brauchst mindestens eine Stunde. Das dauert höchstens zehn Minuten. Đây là cách nói số lượng ước chừng; etwa gần với ungefähr đã học ở A1."
  - type: explain
    text:
      vi: "Gewöhnlich, meistens, selten, lange nói về tần suất hoặc thời gian: Meistens esse ich zu Hause. Ich sehe ihn nur selten. Ich habe lange gewartet. Trạng từ tần suất đứng ở vị trí sau động từ chia hoặc ở đầu câu (kéo theo đảo ngữ): Meistens esse ich zu Hause."
  - type: deep_explain
    text:
      vi: "Eigen và einzig thường được dùng trước danh từ nên bạn gặp chúng có đuôi: ein eigenes Zimmer, der einzige Freund. Sicher có hai nghĩa: an toàn (Der Weg ist sicher) và chắc chắn (Ich bin sicher, dass er kommt). Weiter dùng trong Wie geht es weiter? (tiếp theo thế nào?) và Mach weiter! (cứ tiếp tục đi!)."
  - type: example
    target: Jedes Kind hat ein eigenes Zimmer.
    target_lang: de
    translation:
      vi: Mỗi đứa trẻ có một phòng riêng.
    note:
      vi: eigen = riêng, của chính mình.
  - type: example
    target: Er ist mein einziger Freund hier.
    target_lang: de
    translation:
      vi: Anh ấy là người bạn duy nhất của tôi ở đây.
    note:
      vi: einzig = duy nhất.
  - type: example
    target: Wie viel Uhr ist es genau?
    target_lang: de
    translation:
      vi: Chính xác bây giờ là mấy giờ?
    note:
      vi: genau = chính xác, đúng.
  - type: example
    target: Gewöhnlich stehe ich um sechs Uhr auf.
    target_lang: de
    translation:
      vi: Thường thì tôi dậy lúc sáu giờ.
    note:
      vi: gewöhnlich = thường thường.
  - type: common_mistake
    wrong: Ich sehe selten ihn.
    right: Ich sehe ihn selten.
    target_lang: de
    note:
      vi: Đại từ nhân xưng (ihn) đứng trước trạng từ selten.
  - type: common_mistake
    wrong: Die Straße ist gefährliche.
    right: Die Straße ist gefährlich.
    target_lang: de
    note:
      vi: Sau sein, tính từ không thêm đuôi; chỉ thêm đuôi khi đứng trước danh từ (eine gefährliche Straße).
  - type: summary
    points:
      - vi: "Cùng dạng cho tính từ và trạng từ: Er fährt vorsichtig; Die Straße ist gefährlich."
      - vi: "etwa, mindestens, höchstens + số; ungefähr đã học."
      - vi: "gewöhnlich, meistens, selten (tần suất); lange (thời gian), weiter (tiếp tục), außerdem (ngoài ra)."
