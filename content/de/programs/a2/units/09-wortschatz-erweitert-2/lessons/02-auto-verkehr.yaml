title:
  vi: Ô tô và giao thông (Auto und Verkehr)
objectives:
  - vi: Gọi tên các bộ phận chính của xe và các điểm trên đường.
  - vi: Hiểu biển báo đơn giản và các câu thường gặp ở trạm xăng.
  - vi: Dùng động từ tanken, bremsen, überholen, einparken.
