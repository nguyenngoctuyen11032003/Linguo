body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu các từ về xe cộ và giao thông, nói chuyện ở trạm xăng và kể chuyện lái xe đơn giản.
  - type: explain
    text:
      vi: "Bộ phận xe thường gặp: der Motor, die Bremse, das Lenkrad, der Kofferraum, der Sicherheitsgurt. Từ ghép nhiều âm tiết nhưng giống luôn theo từ cuối: das Lenkrad (das Rad), der Sicherheitsgurt (der Gurt), der Kofferraum (der Raum)."
  - type: explain
    text:
      vi: "Từ về luật giao thông: der Führerschein (bằng lái), die Fahrschule, das Verkehrsschild (biển báo), die Geschwindigkeit, die Vorfahrt. Muốn hỏi ai được đi trước, bạn nói Wer hat Vorfahrt? Đối với người đi bộ dùng der Fußgänger; đường dành cho xe đạp là der Radweg."
  - type: explain
    text:
      vi: "Động từ: tanken (đổ xăng), bremsen (phanh), überholen (vượt xe), einparken (đỗ xe vào chỗ). Überholen là động từ không tách (Perfekt: hat überholt), còn einparken là động từ tách (ich parke ein, hat eingeparkt)."
  - type: deep_explain
    text:
      vi: Ở Đức, trên Autobahn nhiều đoạn không giới hạn tốc độ nhưng có Richtgeschwindigkeit (tốc độ khuyến nghị) 130 km/h; trong thành phố giới hạn thường là 50 km/h. Quy định thay đổi theo từng thời điểm nên bạn luôn đọc biển báo tại chỗ. Der Lkw là xe tải (viết tắt của Lastkraftwagen), số nhiều die Lkw hoặc die Lkws.
  - type: example
    target: Ich mache nächstes Jahr meinen Führerschein.
    target_lang: de
    translation:
      vi: Năm sau tôi thi bằng lái xe.
    note:
      vi: der Führerschein = bằng lái xe.
  - type: example
    target: In der Fahrschule lernt man die Verkehrsregeln.
    target_lang: de
    translation:
      vi: Ở trường dạy lái xe người ta học luật giao thông.
    note:
      vi: die Fahrschule = trường dạy lái xe.
  - type: example
    target: Die nächste Tankstelle ist drei Kilometer entfernt.
    target_lang: de
    translation:
      vi: Trạm xăng gần nhất cách ba kilômét.
    note:
      vi: die Tankstelle = trạm xăng.
  - type: example
    target: Ich muss noch tanken.
    target_lang: de
    translation:
      vi: Tôi còn phải đổ xăng.
    note:
      vi: tanken = đổ xăng, đổ nhiên liệu.
  - type: common_mistake
    wrong: Ich muss tanke.
    right: Ich muss tanken.
    target_lang: de
    note:
      vi: Sau động từ khiếm khuyết (muss), động từ chính ở nguyên thể -en.
  - type: common_mistake
    wrong: Ich habe das Auto einparkt.
    right: Ich habe das Auto eingeparkt.
    target_lang: de
    note:
      vi: "Động từ tách ở Perfekt: phần ein đứng trước ge: eingeparkt (không phải einparkt)."
  - type: summary
    points:
      - vi: tanken, bremsen, überholen (hat überholt), einparken (parkt ein, hat eingeparkt).
exercises:
  - key: de:exercise:a2w2l2-listen-vorfahrt
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w2-vorfahrt
    prompt:
      audio_asset_id: null
      fallback_text: Wer hat hier Vorfahrt?
      options:
        - { id: ird, text: Đường xe đạp chạy dọc theo con sông., lang: vi }
        - { id: u9j, text: Phanh không hoạt động tốt., lang: vi }
        - { id: eqc, text: Tôi còn phải đổ xăng., lang: vi }
        - { id: svc, text: Ở đây ai được đi trước?, lang: vi }
    answer:
      correct_option_id: svc
    explanation:
      vi: Câu bạn nghe có nghĩa "Ở đây ai được đi trước?". Từ khoá là die Vorfahrt (quyền đi trước); các câu còn lại nói về những từ khác trong bài.
    display_answer: Ở đây ai được đi trước?
  - key: de:exercise:a2w2l2-mcq-vi-de-fussgaenger
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2w2-fussgaenger
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "người đi bộ"?
      stem_lang: vi
      options:
        - { id: cgf, text: der Radweg, lang: de }
        - { id: vd3, text: der Fußgänger, lang: de }
        - { id: idw, text: der Motor, lang: de }
        - { id: ucc, text: das Lenkrad, lang: de }
    answer:
      correct_option_id: vd3
    explanation:
      vi: "der Fußgänger nghĩa là \"người đi bộ\". Ví dụ: Die Fußgänger warten an der Ampel. (Những người đi bộ đợi ở đèn giao thông.)"
    display_answer: der Fußgänger
  - key: de:exercise:a2w2l2-mcq-de-vi-fahrbahn
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w2-fahrbahn
    prompt:
      stem: "\"die Fahrbahn\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: bsz, text: lòng đường, lang: vi }
        - { id: gms, text: tốc độ, lang: vi }
        - { id: jt4, text: trường dạy lái xe, lang: vi }
        - { id: dy0, text: vượt (xe), lang: vi }
    answer:
      correct_option_id: bsz
    explanation:
      vi: "die Fahrbahn nghĩa là \"lòng đường\". Ví dụ: Ein Kind läuft plötzlich auf die Fahrbahn. (Một đứa bé bất ngờ chạy ra lòng đường.)"
    display_answer: lòng đường
  - key: de:exercise:a2w2l2-mcq-artikel-parkplatz
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-parkplatz
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Parkplatz\" (chỗ đỗ xe; bãi đỗ xe): ___ Parkplatz"
      stem_lang: vi
      options:
        - { id: gab, text: die, lang: de }
        - { id: i7h, text: der, lang: de }
        - { id: hvz, text: das, lang: de }
        - { id: fex, text: ein, lang: de }
    answer:
      correct_option_id: i7h
    explanation:
      vi: "Parkplatz là danh từ giống đực (der): der Parkplatz; số nhiều: die Parkplätze. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: der
