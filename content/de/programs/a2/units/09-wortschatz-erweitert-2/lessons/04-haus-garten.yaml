body:
  - type: objective
    text:
      vi: Sau bài này, bạn gọi tên được dụng cụ thông dụng và các bộ phận nhà, và nói được công việc cần làm ở nhà và ngoài vườn.
  - type: explain
    text:
      vi: "Các bộ phận ngôi nhà: das Dach, die Mauer, der Schornstein, die Haustür, der Dachboden, die Garage, der Hof. Ngoài vườn có der Rasen, der Zaun, die Hecke. Nhiều từ có số nhiều biến âm: das Dach → die Dächer, der Hof → die Höfe, der Zaun → die Zäune."
  - type: explain
    text:
      vi: "Dụng cụ cầm tay: der Hammer, der Nagel, die Schraube, der Schraubenzieher, der Pinsel, die Farbe. Động từ đi kèm: einen Nagel einschlagen, eine Schraube eindrehen, die Wand streichen, ein Loch bohren. Từ chung cho dụng cụ là das Werkzeug."
  - type: explain
    text:
      vi: "Một số động từ bất quy tắc: streichen (strich, hat gestrichen), graben (gräbt, grub, hat gegraben); số còn lại có chia đều: bohren, sägen, mähen, pflanzen, ernten. Mệnh lệnh: Mäh den Rasen! Streich die Wand!"
  - type: deep_explain
    text:
      vi: "Người Đức rất thích tự sửa nhà (heimwerken) và làm vườn (gärtnern); các cửa hàng như der Baumarkt bán đủ dụng cụ và vật liệu. Der Hof có hai nghĩa: sân trong nhà và nông trại (der Bauernhof). Das Dach nhà thường có Dachboden làm kho; ở Đức người ta hay để đồ cũ trên đó."
  - type: example
    target: Der Rasen ist frisch gemäht.
    target_lang: de
    translation:
      vi: Bãi cỏ vừa được cắt.
    note:
      vi: der Rasen = bãi cỏ.
  - type: example
    target: Um den Garten steht ein hoher Zaun.
    target_lang: de
    translation:
      vi: Quanh vườn có một hàng rào cao.
    note:
      vi: der Zaun = hàng rào.
  - type: example
    target: Die Hecke ist drei Meter lang.
    target_lang: de
    translation:
      vi: Hàng rào cây dài ba mét.
    note:
      vi: die Hecke = hàng rào cây.
  - type: example
    target: Ich brauche einen Hammer und Nägel.
    target_lang: de
    translation:
      vi: Tôi cần một cái búa và đinh.
    note:
      vi: der Hammer = cái búa.
  - type: common_mistake
    wrong: Ich streiche die Wand mit der Hammer.
    right: Ich streiche die Wand mit dem Pinsel.
    target_lang: de
    note:
      vi: "Wand được sơn bằng Pinsel; Hammer dùng để đóng đinh. Mit + Dativ: dem Pinsel."
  - type: common_mistake
    wrong: Er hat den Rasen mähen.
    right: Er hat den Rasen gemäht.
    target_lang: de
    note:
      vi: Perfekt dùng haben + Partizip II (gemäht), không dùng nguyên thể.
  - type: summary
    points:
      - vi: streichen (strich, hat gestrichen), bohren, sägen, mähen, graben (gräbt, grub, hat gegraben), pflanzen, ernten.
