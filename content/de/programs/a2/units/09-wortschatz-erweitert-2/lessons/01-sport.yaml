body:
  - type: objective
    text:
      vi: Sau bài này, bạn kể được về môn thể thao mình thích, hiểu một bản tin thể thao đơn giản và dùng đúng động từ đi với từng môn.
  - type: explain
    text:
      vi: "Tiếng Đức chọn động từ theo loại môn: bóng thì dùng spielen (Fußball spielen, Tennis spielen), các môn đi đến một nơi thì dùng gehen (schwimmen gehen, wandern gehen), còn nhiều môn khác dùng machen (Sport machen, Yoga machen). Một số môn có động từ riêng: reiten, angeln, segeln, turnen."
  - type: explain
    text:
      vi: Một đội bóng gồm die Mannschaft (đội), der Trainer (huấn luyện viên) và die Sportler (vận động viên). Trọng tài là der Schiedsrichter, người hâm mộ là der Fan. Der Sieger thắng, còn bên thua chịu die Niederlage; kết quả ghi bằng ein Sieg hoặc eine Niederlage.
  - type: explain
    text:
      vi: "Động từ bất quy tắc: schießen (er schießt, schoss, hat geschossen), werfen (er wirft, warf, hat geworfen), fangen (er fängt, fing, hat gefangen), reiten (er reitet, ritt, ist geritten). Mệnh lệnh du của werfen là Wirf den Ball! (đổi nguyên âm e → i, không có -e cuối)."
  - type: deep_explain
    text:
      vi: "Das Stadion có số nhiều Stadien (đuôi -ien), không phải Stadions. Das Training thường dùng ở số ít: Das Training beginnt um 18 Uhr. Ở Đức, nhiều người tập thể thao trong der Verein (câu lạc bộ), nơi đóng phí hằng tháng và có huấn luyện viên; bạn sẽ gặp từ này nhiều khi nói về hoạt động cuối tuần."
  - type: example
    target: Welche Sportart machst du am liebsten?
    target_lang: de
    translation:
      vi: Bạn thích môn thể thao nào nhất?
    note:
      vi: die Sportart = môn thể thao.
  - type: example
    target: Unser Training beginnt um 18 Uhr.
    target_lang: de
    translation:
      vi: Buổi tập của chúng tôi bắt đầu lúc 18 giờ.
    note:
      vi: das Training = buổi tập luyện.
  - type: example
    target: Der Trainer erklärt die Übung.
    target_lang: de
    translation:
      vi: Huấn luyện viên giải thích bài tập.
    note:
      vi: der Trainer = huấn luyện viên.
  - type: example
    target: Unsere Mannschaft hat gestern gewonnen.
    target_lang: de
    translation:
      vi: Đội của chúng tôi hôm qua đã thắng.
    note:
      vi: die Mannschaft = đội (thể thao).
  - type: common_mistake
    wrong: Ich mache Fußball.
    right: Ich spiele Fußball.
    target_lang: de
    note:
      vi: Với môn bóng và trò chơi dùng spielen, không dùng machen.
  - type: common_mistake
    wrong: Er hat den Ball gefangt.
    right: Er hat den Ball gefangen.
    target_lang: de
    note:
      vi: "Fangen là động từ bất quy tắc: fängt, fing, hat gefangen."
  - type: summary
    points:
      - vi: schießen – schoss – hat geschossen; werfen – warf – hat geworfen; fangen – fing – hat gefangen; Stadion → Stadien.
exercises:
  - key: de:exercise:a2w2l1-listen-segeln
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w2-segeln
    prompt:
      audio_asset_id: null
      fallback_text: Im Urlaub segeln wir auf dem See.
      options:
        - { id: ldu, text: Trong kỳ nghỉ chúng tôi đi thuyền buồm trên hồ., lang: vi }
        - { id: t5w, text: Buổi tập của chúng tôi bắt đầu lúc 18 giờ., lang: vi }
        - { id: rci, text: Các vận động viên tập luyện mỗi ngày., lang: vi }
        - { id: q6n, text: Con gái tôi thích cưỡi ngựa., lang: vi }
    answer:
      correct_option_id: ldu
    explanation:
      vi: Câu bạn nghe có nghĩa "Trong kỳ nghỉ chúng tôi đi thuyền buồm trên hồ.". Từ khoá là segeln (đi thuyền buồm); các câu còn lại nói về những từ khác trong bài.
    display_answer: Trong kỳ nghỉ chúng tôi đi thuyền buồm trên hồ.
  - key: de:exercise:a2w2l1-mcq-vi-de-turnen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2w2-turnen
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "tập thể dục dụng cụ; tập thể dục"?
      stem_lang: vi
      options:
        - { id: d1r, text: werfen, lang: de }
        - { id: q74, text: schießen, lang: de }
        - { id: orr, text: segeln, lang: de }
        - { id: idj, text: turnen, lang: de }
    answer:
      correct_option_id: idj
    explanation:
      vi: "turnen nghĩa là \"tập thể dục dụng cụ; tập thể dục\". Ví dụ: Die Kinder turnen in der Turnhalle. (Bọn trẻ tập thể dục trong phòng tập.)"
    display_answer: turnen
  - key: de:exercise:a2w2l1-mcq-de-vi-stadion
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w2-stadion
    prompt:
      stem: "\"das Stadion\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: yrt, text: sân vận động, lang: vi }
        - { id: efe, text: ném, lang: vi }
        - { id: ftr, text: "sút, bắn", lang: vi }
        - { id: og5, text: người hâm mộ, lang: vi }
    answer:
      correct_option_id: yrt
    explanation:
      vi: "das Stadion nghĩa là \"sân vận động\". Ví dụ: Das Stadion ist ausverkauft. (Sân vận động đã hết vé.)"
    display_answer: sân vận động
  - key: de:exercise:a2w2l1-mcq-artikel-fan
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-fan
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Fan\" (người hâm mộ): ___ Fan"
      stem_lang: vi
      options:
        - { id: vgw, text: das, lang: de }
        - { id: m9v, text: der, lang: de }
        - { id: vu6, text: ein, lang: de }
        - { id: ne8, text: die, lang: de }
    answer:
      correct_option_id: m9v
    explanation:
      vi: "Fan là danh từ giống đực (der): der Fan; số nhiều: die Fans. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: der
  - key: de:exercise:a2w2l1-tr-word-schiedsrichter
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-schiedsrichter
