title:
  vi: Thể thao và hoạt động thể chất (Sport)
objectives:
  - vi: Gọi tên các môn thể thao và những người, đồ vật liên quan trong một trận đấu.
  - vi: "Chọn đúng động từ đi với từng môn: spielen, gehen, machen."
  - vi: Dùng các động từ thể thao bất quy tắc ở thì hiện tại và Perfekt.
