        - die Schiedsrichterin
    explanation:
      vi: "\"trọng tài\" trong tiếng Đức là der Schiedsrichter (số nhiều: die Schiedsrichter). Ví dụ: Der Schiedsrichter zeigt eine gelbe Karte."
    display_answer: der Schiedsrichter
