      vi: "Câu có nghĩa \"Bạn thích môn thể thao nào nhất?\" nên cần Sportart (die Sportart: môn thể thao). Turnier = giải đấu; Wettkampf = cuộc thi đấu; Sieg = chiến thắng không đúng nghĩa của câu."
