    answer_lang: de
    difficulty: 2
    item: de:item:a2w2-sportart
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Bạn thích môn thể thao nào nhất?\": Welche ___ machst du am liebsten?"
