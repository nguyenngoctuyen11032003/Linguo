title:
  vi: Trái cây, rau củ và gia vị (Obst, Gemüse und Gewürze)
objectives:
  - vi: Gọi tên các loại trái cây, rau củ và gia vị thường gặp ở chợ và siêu thị.
  - vi: Nhớ mạo từ và số nhiều của từng danh từ; phân biệt danh từ đếm được và không đếm được.
  - vi: "Nói số lượng khi mua: ein Kilo Erdbeeren, 500 Gramm Pilze, zwei Zitronen."
estimated_minutes: 14
