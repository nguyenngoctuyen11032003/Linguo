  - key: de:exercise:a2w1l1-fill-plural-erdbeere
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:a2w1-erdbeere
    prompt:
      template: "Singular: die Erdbeere · Plural: die {{b1}}"
      blanks:
        - { id: b1, width_hint: 11 }
    answer:
      blanks:
        b1:
          - Erdbeeren
    known_wrong:
      - answer: Erdbeere
        feedback_vi: Erdbeere là dạng số ít; số nhiều là Erdbeeren.
        error_tag: plural_form
    explanation:
      vi: "Số nhiều của die Erdbeere là die Erdbeeren (ký hiệu trong từ điển: -n). Mạo từ số nhiều luôn là die."
    display_answer: "Singular: die Erdbeere · Plural: die Erdbeeren"
  - key: de:exercise:a2w1l1-mcq-luecke-mehl
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a2w1-mehl
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Để làm bánh chúng ta cần 300 gam bột mì.\": Für den Kuchen brauchen wir 300 Gramm ___."
      stem_lang: vi
      options:
        - { id: ufm, text: Pilze, lang: de }
        - { id: h3o, text: Orange, lang: de }
        - { id: qei, text: Kohl, lang: de }
        - { id: qzs, text: Mehl, lang: de }
    answer:
      correct_option_id: qzs
    explanation:
      vi: "Câu có nghĩa \"Để làm bánh chúng ta cần 300 gam bột mì.\" nên cần Mehl (das Mehl: bột mì). Orange = quả cam; Kohl = bắp cải, cải (các loại); Pilze = nấm không đúng nghĩa của câu."
