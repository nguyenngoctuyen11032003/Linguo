  - key: de:exercise:a2w1l1-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 3
    prompt:
      source_text: Tôi cần một cân dâu tây và hai quả chanh.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich brauche ein Kilo Erdbeeren und zwei Zitronen.
        - Ich brauche zwei Zitronen und ein Kilo Erdbeeren.
        - Ich benötige ein Kilo Erdbeeren und zwei Zitronen.
    explanation:
      vi: "Gợi ý đáp án: Ich brauche ein Kilo Erdbeeren und zwei Zitronen. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Ich brauche ein Kilo Erdbeeren und zwei Zitronen.
    item: de:item:a2w1-erdbeere
