title:
  vi: Nấu ăn và đi nhà hàng (Kochen und Restaurant)
objectives:
  - vi: "Dùng các động từ nấu ăn: schälen, braten, rühren, würzen, abwaschen."
  - vi: "Gọi tên các phần của bữa ăn trong nhà hàng: Vorspeise, Hauptgericht, Beilage, Soße."
  - vi: "Mô tả vị của món ăn: salzig, scharf, sauer, bitter."
estimated_minutes: 15
