  - key: de:exercise:a2w1l3-mcq-artikel-aussehen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2w1-aussehen
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Aussehen\" (vẻ ngoài): ___ Aussehen"
      stem_lang: vi
      options:
        - { id: w28, text: ein, lang: de }
        - { id: cfz, text: die, lang: de }
        - { id: s5u, text: der, lang: de }
        - { id: ejb, text: das, lang: de }
