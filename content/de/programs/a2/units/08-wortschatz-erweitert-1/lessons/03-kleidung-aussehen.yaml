title:
  vi: Quần áo, phụ kiện và ngoại hình (Kleidung und Aussehen)
objectives:
  - vi: Gọi tên thêm quần áo và phụ kiện, kể cả đồ mùa đông và mùa hè.
  - vi: Mô tả ngoại hình bằng aussehen và các tính từ blond, lockig, schlank.
  - vi: Dùng tragen và anhaben để nói mình đang mặc gì.
