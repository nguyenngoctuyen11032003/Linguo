body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được thêm nhiều món đồ mặc và phụ kiện, và mô tả ngoại hình của một người một cách đơn giản.
  - type: explain
    text:
      vi: "Khi mô tả ai đó, bạn dùng sein + tính từ (Sie ist schlank) hoặc aussehen + tính từ (Er sieht müde aus). Aussehen là động từ tách: ich sehe aus, du siehst aus; tính từ đứng sau động từ không đổi đuôi."
  - type: explain
    text:
      vi: "Muốn nói bạn đang mặc gì, dùng tragen hoặc anhaben: Er trägt eine Krawatte. Sie hat einen roten Schal an. Anhaben là động từ tách, phần an đứng cuối câu. Ở thì Perfekt nói đã mặc: Er hat eine Mütze getragen."
  - type: explain
    text:
      vi: "Một số món đồ thường dùng theo đôi nên hay gặp ở số nhiều: die Handschuhe (găng tay), die Stiefel (ủng), die Sandalen (dép xăng đan). Hãy học cả dạng số nhiều để chia động từ đúng: Die Stiefel sind neu."
  - type: deep_explain
    text:
      vi: Der Schmuck chỉ có số ít và chỉ trang sức nói chung; từng món là der Ring, der Ohrring, die Kette (đã học). Der Reißverschluss là khóa kéo, der Knopf là cúc áo; hai từ này hay gặp khi sửa quần áo hoặc khi trả lại hàng.
  - type: example
    target: Zum Anzug trägt er eine Krawatte.
    target_lang: de
    translation:
      vi: Anh ấy đeo cà vạt khi mặc com-lê.
    note:
      vi: die Krawatte = cà vạt.
  - type: example
    target: Die Hose ist zu weit, ich brauche einen Gürtel.
    target_lang: de
    translation:
      vi: Quần rộng quá, tôi cần một cái thắt lưng.
    note:
      vi: der Gürtel = thắt lưng.
  - type: example
    target: Im Winter trage ich Handschuhe.
    target_lang: de
    translation:
      vi: Mùa đông tôi đeo găng tay.
    note:
      vi: der Handschuh = găng tay.
  - type: example
    target: Es ist kalt, nimm einen Schal mit.
    target_lang: de
    translation:
      vi: Trời lạnh, hãy mang theo khăn quàng.
    note:
      vi: der Schal = khăn quàng cổ.
  - type: common_mistake
    wrong: Sie hat blond Haare.
    right: Sie hat blonde Haare.
    target_lang: de
    note:
      vi: "Tính từ đứng trước danh từ cần có đuôi: blonde Haare (số nhiều, không mạo từ). Sau sein thì không đổi: Sie ist blond."
  - type: common_mistake
    wrong: Er sieht müde.
    right: Er sieht müde aus.
    target_lang: de
    note:
      vi: Aussehen là động từ tách; phần aus đứng cuối câu.
  - type: summary
    points:
      - vi: "aussehen (sieht aus): Er sieht müde aus. tragen/anhaben: Er trägt eine Krawatte; Sie hat einen Schal an."
      - vi: "die Handschuhe, die Stiefel, die Sandalen luôn học ở số nhiều; der Schmuck chỉ có số ít."
      - vi: "Ngoại hình: blond, lockig, schlank; der Bart, das Aussehen."
