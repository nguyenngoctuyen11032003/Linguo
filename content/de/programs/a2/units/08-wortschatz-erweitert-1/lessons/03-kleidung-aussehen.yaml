      correct_option_id: ejb
    explanation:
      vi: "Aussehen là danh từ giống trung (das): das Aussehen (không dùng ở số nhiều). \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
