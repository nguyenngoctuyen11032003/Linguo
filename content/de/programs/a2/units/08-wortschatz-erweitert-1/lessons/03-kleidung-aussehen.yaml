        - { id: xk5, text: Đứa bé đội một chiếc mũ đỏ., lang: vi }
        - { id: q3v, text: Mùa hè tôi thích đi dép xăng đan., lang: vi }
        - { id: b1o, text: Khóa kéo ở áo khoác bị hỏng., lang: vi }
