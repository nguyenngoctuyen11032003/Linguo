body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về trường học, các môn học và đồ dùng học tập, và kể được một ngày ở trường bằng câu đơn giản.
  - type: explain
    text:
      vi: "Tên các môn học thường có đuôi -ie hoặc -ik, là giống cái và không có số nhiều: die Biologie, die Chemie, die Physik, die Mathematik. Khi nói về môn học bạn thường bỏ mạo từ: Wir haben heute Chemie. Trong văn nói, Mathematik hay được rút gọn thành Mathe."
  - type: explain
    text:
      vi: "Nhiều danh từ ghép chỉ trường học có từ cuối cho biết giống: das Klassenzimmer (das Zimmer), der Schulhof (der Hof), die Schultasche (die Tasche), das Schulfach (das Fach). Ví dụ der Schulbus có số nhiều die Schulbusse. Giống của từ ghép luôn theo từ cuối."
  - type: explain
    text:
      vi: "Động từ học tập có nghĩa khác nhau: rechnen là tính toán, buchstabieren là đánh vần từng chữ cái, abschreiben là chép lại (hoặc chép bài người khác), vorlesen là đọc to cho người khác nghe. Ở thì Perfekt: Ich habe die Aufgabe abgeschrieben. Der Lehrer hat eine Geschichte vorgelesen."
  - type: deep_explain
    text:
      vi: Ở Đức, học sinh có thể vào der Kindergarten rồi die Grundschule (lớp 1 đến 4), sau đó chọn Gymnasium, Realschule hoặc Gesamtschule. Der Schulhof là sân trường, nơi học sinh nghỉ giải lao (die Pause) và ăn das Pausenbrot, bữa nhẹ mang theo từ nhà. Cách gọi trường và hệ thống trường khác nhau giữa 16 bang.
  - type: example
    target: Das Klassenzimmer ist hell und groß.
    target_lang: de
    translation:
      vi: Phòng học sáng và rộng.
    note:
      vi: das Klassenzimmer = phòng học.
  - type: example
    target: Die Lehrer sitzen im Lehrerzimmer.
    target_lang: de
    translation:
      vi: Các thầy cô ngồi trong phòng giáo viên.
    note:
      vi: das Lehrerzimmer = phòng giáo viên.
  - type: example
    target: In der Pause spielen wir auf dem Schulhof.
    target_lang: de
    translation:
      vi: Giờ ra chơi chúng tôi chơi ở sân trường.
    note:
      vi: der Schulhof = sân trường.
  - type: example
    target: Der Schulbus kommt um sieben Uhr.
    target_lang: de
    translation:
      vi: Xe buýt trường đến lúc bảy giờ.
    note:
      vi: der Schulbus = xe buýt đưa đón học sinh.
  - type: common_mistake
    wrong: Wir haben heute Chemie in die Schule.
    right: Wir haben heute Chemie in der Schule.
    target_lang: de
    note:
      vi: "Wo? (ở đâu) đi với in + Dativ: in der Schule."
  - type: common_mistake
    wrong: Das Diktat ist schwer, ich habe es abgeschreibt.
    right: Das Diktat ist schwer, ich habe es abgeschrieben.
    target_lang: de
    note:
      vi: "Abschreiben là động từ bất quy tắc: schreibt ab, schrieb ab, hat abgeschrieben."
  - type: summary
    points:
      - vi: rechnen, buchstabieren, abschreiben (hat abgeschrieben), vorlesen (hat vorgelesen).
exercises:
  - key: de:exercise:a2w1l5-listen-abschreiben
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w1-abschreiben
    prompt:
      audio_asset_id: null
      fallback_text: Bitte schreibt den Text ab.
      options:
        - { id: e9l, text: Thầy hiệu trưởng nói chuyện với phụ huynh., lang: vi }
        - { id: shw, text: Tôi cần một cái thước cho bản vẽ., lang: vi }
        - { id: drj, text: Hãy chép lại đoạn văn này., lang: vi }
        - { id: lu2, text: Môn học ưa thích nhất của tôi là sinh học., lang: vi }
    answer:
