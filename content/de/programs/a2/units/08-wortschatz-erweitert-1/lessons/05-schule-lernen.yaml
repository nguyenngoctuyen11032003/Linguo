    answer:
      correct_option_id: b2v
    explanation:
      vi: "die Chemie nghĩa là \"môn hóa học\". Ví dụ: Chemie ist ein schwieriges Fach. (Hóa học là một môn khó.)"
    display_answer: môn hóa học
  - key: de:exercise:a2w1l5-mcq-artikel-schere
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 2
    item: de:item:a2w1-schere
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Schere\" (cái kéo): ___ Schere"
      stem_lang: vi
      options:
        - { id: nde, text: ein, lang: de }
        - { id: hvx, text: das, lang: de }
        - { id: vpt, text: die, lang: de }
        - { id: zvm, text: der, lang: de }
    answer:
      correct_option_id: vpt
    explanation:
      vi: "Schere là danh từ giống cái (die): die Schere; số nhiều: die Scheren. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: die
