    explanation:
      vi: Câu bạn nghe có nghĩa "Hãy chép lại đoạn văn này.". Từ khoá là abschreiben (chép lại); các câu còn lại nói về những từ khác trong bài.
    display_answer: Hãy chép lại đoạn văn này.
  - key: de:exercise:a2w1l5-mcq-vi-de-schultasche
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:a2w1-schultasche
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "cặp sách"?
      stem_lang: vi
      options:
        - { id: dm4, text: der Schulhof, lang: de }
        - { id: tp9, text: die Biologie, lang: de }
        - { id: v2r, text: das Pausenbrot, lang: de }
        - { id: zst, text: die Schultasche, lang: de }
    answer:
      correct_option_id: zst
    explanation:
      vi: "die Schultasche nghĩa là \"cặp sách\". Ví dụ: Die Schultasche ist sehr schwer. (Cái cặp rất nặng.)"
    display_answer: die Schultasche
  - key: de:exercise:a2w1l5-mcq-de-vi-chemie
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:a2w1-chemie
    prompt:
      stem: "\"die Chemie\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: kcd, text: sân trường, lang: vi }
        - { id: b2v, text: môn hóa học, lang: vi }
        - { id: d5k, text: bánh mì mang theo ăn giờ ra chơi, lang: vi }
