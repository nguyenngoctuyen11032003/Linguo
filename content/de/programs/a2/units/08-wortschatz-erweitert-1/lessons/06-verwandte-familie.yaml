body:
  - type: objective
    text:
      vi: Sau bài này, bạn nói được về họ hàng và các quan hệ trong gia đình mở rộng, kể cả bên nhà chồng, nhà vợ.
  - type: explain
    text:
      vi: "Họ hàng bên chồng hoặc vợ thường dùng tiền tố Schwieger-: die Schwiegermutter, der Schwiegervater, der Schwiegersohn, die Schwiegertochter. Anh, chị, em của vợ hoặc chồng, và chồng của chị em là der Schwager (nam) và die Schwägerin (nữ)."
  - type: explain
    text:
      vi: "Con của anh chị em là der Neffe (con trai) và die Nichte (con gái). Der Neffe có đuôi -n ở mọi cách trừ Nominativ: Ich sehe meinen Neffen. Die Urgroßmutter là bà cố, tức mẹ của ông hoặc bà. Das Patenkind là con đỡ đầu."
  - type: explain
    text:
      vi: "Động từ về gia đình: erziehen (nuôi dạy), pflegen (chăm sóc), begleiten (đi cùng, tháp tùng), sich verstehen mit (hòa thuận với). Ví dụ: Ich verstehe mich gut mit meiner Schwiegermutter. Câu này dùng sich + mit + Dativ."
  - type: deep_explain
    text:
      vi: "Das Ehepaar nghĩa là cặp vợ chồng; die Eltern là bố mẹ; die Familie là cả gia đình. Der Teenager là thiếu niên (13 đến 19 tuổi). Verwandt dùng với mit + Dativ: Ich bin mit ihr verwandt. Nói họ hàng nói chung là die Verwandtschaft; Verwandte nghĩa là một người họ hàng, dạng viết như tính từ nên bạn sẽ học ở các cấp sau."
  - type: example
    target: Mein Schwager wohnt in Hamburg.
    target_lang: de
    translation:
      vi: Anh rể của tôi sống ở Hamburg.
    note:
      vi: der Schwager = anh/em rể, anh/em vợ, anh/em chồng.
  - type: example
    target: Meine Schwiegermutter kocht sehr gut.
    target_lang: de
    translation:
      vi: Mẹ chồng tôi nấu ăn rất giỏi.
    note:
      vi: die Schwiegermutter = mẹ chồng, mẹ vợ.
  - type: example
    target: Mein Schwiegervater ist schon Rentner.
    target_lang: de
    translation:
      vi: Bố vợ tôi đã nghỉ hưu.
    note:
      vi: der Schwiegervater = bố chồng, bố vợ.
  - type: example
    target: Der Schwiegersohn hilft im Haus.
    target_lang: de
    translation:
      vi: Con rể giúp việc trong nhà.
    note:
      vi: der Schwiegersohn = con rể.
  - type: common_mistake
    wrong: Ich verstehe mit meiner Schwiegermutter gut.
    right: Ich verstehe mich gut mit meiner Schwiegermutter.
    target_lang: de
    note:
      vi: Với nghĩa hòa thuận bạn cần sich verstehen mit + Dativ, không phải verstehen mit.
  - type: common_mistake
    wrong: Der Sohn meiner Schwester ist meine Neffe.
    right: Der Sohn meiner Schwester ist mein Neffe.
    target_lang: de
    note:
      vi: Neffe là giống đực nên dùng mein; con gái của chị em là meine Nichte.
  - type: summary
    points:
      - vi: "Schwieger- + Mutter/Vater/Sohn/Tochter; der Schwager, die Schwägerin; der Neffe, die Nichte; die Urgroßmutter."
      - vi: "erziehen, pflegen, begleiten; sich verstehen mit + Dativ: Ich verstehe mich gut mit meinem Schwager."
      - vi: "verwandt (mit + Dativ), verlobt, erwachsen, verwitwet."
