    display_answer: "Singular: die Welle · Plural: die Wellen"
  - key: de:exercise:a2w1l4-mcq-luecke-blitz
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 2
    item: de:item:a2w1-blitz
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Tia chớp đánh vào cái cây.\": Der ___ schlägt in den Baum ein."
      stem_lang: vi
      options:
        - { id: sgk, text: Schatten, lang: de }
        - { id: awa, text: Blitz, lang: de }
        - { id: yl4, text: Glatteis, lang: de }
        - { id: mla, text: Wellen, lang: de }
    answer:
      correct_option_id: awa
    explanation:
      vi: "Câu có nghĩa \"Tia chớp đánh vào cái cây.\" nên cần Blitz (der Blitz: tia chớp). Schatten = bóng râm, cái bóng; Glatteis = băng trơn; Wellen = con sóng không đúng nghĩa của câu."
    display_answer: Blitz
  - key: de:exercise:a2w1l4-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 3
    prompt:
      source_text: Hôm nay trời nhiều sương mù và có năm độ.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Heute ist es neblig und es hat fünf Grad.
        - Heute ist es neblig, und es hat fünf Grad.
        - Heute ist es neblig und es sind fünf Grad.
    explanation:
      vi: "Gợi ý đáp án: Heute ist es neblig und es hat fünf Grad. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Heute ist es neblig und es hat fünf Grad.
    item: de:item:a2w1-grad
  - key: de:exercise:a2w1l4-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 2
    prompt:
      source_text: Nachts gibt es Frost, und auf den Straßen kann es Glatteis geben.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Ban đêm có sương giá và trên đường có thể có băng trơn.
        - Ban đêm có băng giá, và trên đường có thể có băng.
        - Ban đêm trời có sương giá và đường có thể bị đóng băng trơn.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Nachts gibt es Frost, und auf den Straßen kann es Glatteis geben.\" nghĩa là: Ban đêm có sương giá và trên đường có thể có băng trơn. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Ban đêm có sương giá và trên đường có thể có băng trơn.
    item: de:item:a2w1-frost
