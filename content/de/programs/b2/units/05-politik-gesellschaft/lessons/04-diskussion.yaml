body:
  - type: objective
    text:
      vi: "Sau bài này, bạn thảo luận được về một câu hỏi gây tranh cãi của thành phố (hư cấu: \"Có nên xây khu nhà ở trên một phần công viên thành phố Musterstadt?\"), phản bác lịch sự và cùng tìm thoả hiệp: \"Das mag sein, aber wäre es nicht sinnvoller, nur einen Teil zu bebauen?\""
  - type: explain
    text:
      vi: "Theo cấu trúc đề tại thời điểm soạn bài, Goethe B2 Sprechen Teil 2 là phần hai thí sinh thảo luận khoảng 5 phút về một câu hỏi gây tranh cãi: nêu ý kiến, đưa lý do, phản hồi ý của bạn thi và cố tìm điểm chung. Hãy xem tài liệu mẫu chính thức của Goethe-Institut trước khi thi, vì thời lượng và cách chấm có thể thay đổi."
  - type: explain
    text:
      vi: "Phản bác lịch sự: Da muss ich Ihnen widersprechen, denn … (widersprechen + Dativ) hoặc Das mag sein, aber … (thừa nhận một phần rồi phản bác; mögen ở đây là \"có thể\"). Nêu lo ngại nhẹ nhàng: Ich gebe zu bedenken, dass … (động từ cuối câu dass)."
  - type: explain
    text:
      vi: "Đề xuất và tìm điểm chung: Wäre es nicht sinnvoller, … zu + Infinitiv? (Konjunktiv II làm câu mềm hơn, như Wir könnten doch … ở B1) và Lassen Sie uns einen Kompromiss finden. Thừa nhận ý hay của đối phương làm bạn nghe công bằng: Ich kann Ihre Position nachvollziehen, aber …."
  - type: explain
    text:
      vi: "Người Việt hay đồng ý cho xong để tránh va chạm (Ja, Sie haben recht.), nhưng trong phần thi này bạn được chấm về khả năng tương tác và lập luận. Phản biện có lý do là bình thường và lịch sự trong văn hoá tranh luận ở Đức; điều cần tránh là nói chung chung (pauschal) hoặc thô lỗ."
  - type: deep_explain
    text:
      vi: "Trong phòng thi, hai thí sinh có thể xưng du hoặc Sie; hãy thống nhất từ đầu và giữ nguyên. Bài này dùng Sie như trong một cuộc họp công dân. Đồng ý cũng cần lý do: Da bin ich ganz Ihrer Meinung, denn …; phản bác nhẹ hơn: Das sehe ich (etwas) anders. Các chiến lược từ B1U10 vẫn rất hữu ích: Darf ich kurz etwas ergänzen? (xin bổ sung), Habe ich Sie richtig verstanden, dass …? (hỏi lại). Khác với thuyết trình ở Teil 1 (Zunächst … Abschließend …), ở Teil 2 bạn phải phản hồi trực tiếp điều người kia vừa nói, nên hãy nhắc lại ý họ bằng lời gián tiếp: Sie sagen, die Stadt brauche mehr Wohnungen. Chủ đề trong bài là hư cấu; trong bài thi, giám khảo chấm cách lập luận và ngôn ngữ, không chấm bạn đứng về phía nào."
  - type: example
    target: Da muss ich Ihnen widersprechen. Der Park ist für viele Familien der einzige grüne Ort im Viertel.
    target_lang: de
    translation:
      vi: Về điểm này tôi phải phản đối anh/chị. Công viên là chỗ xanh duy nhất trong khu phố đối với nhiều gia đình.
    note:
      vi: "widersprechen + Dativ: Ihnen. Luôn kèm lý do ngay sau lời phản đối."
  - type: example
    target: Das mag sein, aber ohne neue Wohnungen werden die Mieten weiter steigen.
    target_lang: de
    translation:
      vi: Có thể là vậy, nhưng nếu không có nhà ở mới thì tiền thuê nhà sẽ tiếp tục tăng.
    note:
      vi: "Das mag sein = có thể là vậy (thừa nhận một phần), rồi phản bác bằng aber."
  - type: example
    target: Ich gebe zu bedenken, dass der Bau mehrere Jahre dauern würde.
    target_lang: de
    translation:
      vi: Tôi xin lưu ý rằng việc xây dựng sẽ kéo dài nhiều năm.
    note:
      vi: "zu bedenken geben = lưu ý, nêu lo ngại một cách lịch sự; động từ würde ở cuối câu dass."
  - type: example
    target: Wäre es nicht sinnvoller, nur einen kleinen Teil des Parks zu bebauen?
    target_lang: de
    translation:
      vi: Chẳng phải sẽ hợp lý hơn nếu chỉ xây trên một phần nhỏ của công viên sao?
    note:
      vi: "Konjunktiv II wäre + zu-Infinitiv ở cuối: zu bebauen."
  - type: example
    target: Lassen Sie uns einen Kompromiss finden, mit dem beide Seiten leben können.
    target_lang: de
    translation:
      vi: Chúng ta hãy tìm một thoả hiệp mà cả hai bên đều chấp nhận được.
    note:
      vi: "Lassen Sie uns … = Chúng ta hãy …; mit etwas leben können = chấp nhận được điều gì."
  - type: example
    target: Meiner Meinung nach sollten wir beide Ziele abwägen. Wir könnten doch zuerst die Bürger befragen.
    target_lang: de
    translation:
      vi: Theo tôi, chúng ta nên cân nhắc cả hai mục tiêu. Hay là trước hết chúng ta hỏi ý kiến người dân.
    note:
      vi: "Meiner Meinung nach (B1U06) đứng ở vị trí 1, động từ sollten ngay sau; Wir könnten doch … là cách đề nghị bằng Konjunktiv II (B1U08)."
  - type: common_mistake
    wrong: "Ja, Sie haben recht. (rồi im lặng)"
    right: Das mag sein, aber ich sehe das etwas anders, denn …
    target_lang: de
    note:
      vi: "Đồng ý cho xong làm cuộc thảo luận dừng lại; trong bài thi hãy thừa nhận một phần rồi đưa lập luận của mình."
  - type: common_mistake
    wrong: Da muss ich Sie widersprechen.
    right: Da muss ich Ihnen widersprechen.
    target_lang: de
    note:
      vi: "widersprechen đi với Dativ: jemandem widersprechen → Ihnen."
  - type: common_mistake
    wrong: Ich gebe zu bedenken, dass der Bau dauert sehr lange.
    right: Ich gebe zu bedenken, dass der Bau sehr lange dauert.
    target_lang: de
    note:
      vi: "Sau dass, động từ chia đứng cuối câu."
  - type: common_mistake
    wrong: Wäre es nicht sinnvoller, nur einen Teil bebauen?
    right: Wäre es nicht sinnvoller, nur einen Teil zu bebauen?
    target_lang: de
    note:
      vi: "Sau Wäre es nicht sinnvoller cần zu + Infinitiv."
  - type: summary
    points:
      - vi: "Phản bác: Da muss ich Ihnen widersprechen, denn … · Das mag sein, aber …"
      - vi: "Nêu lo ngại: Ich gebe zu bedenken, dass … (động từ cuối)."
      - vi: "Đề xuất: Wäre es nicht sinnvoller, … zu + Infinitiv?"
      - vi: "Thoả hiệp: Lassen Sie uns einen Kompromiss finden."
      - vi: "Công nhận ý đối phương: Ich kann Ihre Position nachvollziehen, aber …"
      - vi: "Từ vựng: der Einwand, einwenden, die Debatte, debattieren, abwägen, der Konsens, kontrovers, die Position."
