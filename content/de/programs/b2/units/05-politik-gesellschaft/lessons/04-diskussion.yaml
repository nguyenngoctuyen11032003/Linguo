    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u05-einwand
    prompt:
      audio_asset_id: null
      fallback_text: Das mag sein, aber wir brauchen dringend mehr bezahlbare Wohnungen. Das ist mein wichtigster Einwand.
      options:
        - { id: m3a, text: "Người nói thừa nhận ý kia có thể đúng, nhưng phản bác rằng rất cần thêm nhà ở giá vừa phải.", lang: vi }
        - { id: m7b, text: "Người nói hoàn toàn đồng ý và không có ý kiến phản đối nào.", lang: vi }
        - { id: m1c, text: "Người nói cho rằng thành phố không cần thêm nhà ở.", lang: vi }
        - { id: m5d, text: "Người nói muốn xây thêm nhà ở đắt tiền.", lang: vi }
    answer:
      correct_option_id: m3a
    explanation:
      vi: "Das mag sein, aber … = có thể là vậy, nhưng …: thừa nhận một phần rồi phản bác. bezahlbare Wohnungen = nhà ở giá vừa phải; der Einwand = ý kiến phản đối."
    display_answer: Người nói thừa nhận ý kia có thể đúng, nhưng phản bác rằng rất cần thêm nhà ở giá vừa phải.

  - key: de:exercise:b2u05l4-listen-kompromiss
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b1u09-kompromiss
    prompt:
      audio_asset_id: null
      fallback_text: Wäre es nicht sinnvoller, nur einen kleinen Teil des Parks zu bebauen? Lassen Sie uns einen Kompromiss finden.
      options:
        - { id: k2a, text: "Người nói đề xuất chỉ xây trên một phần nhỏ của công viên và muốn tìm thoả hiệp.", lang: vi }
        - { id: k6b, text: "Người nói đề xuất xây trên toàn bộ công viên.", lang: vi }
        - { id: k9c, text: "Người nói từ chối mọi việc xây dựng và không muốn thoả hiệp.", lang: vi }
        - { id: k4d, text: "Người nói đề xuất hoãn quyết định thêm vài năm.", lang: vi }
    answer:
      correct_option_id: k2a
    explanation:
      vi: "Wäre es nicht sinnvoller, nur einen kleinen Teil … zu bebauen? = chẳng phải hợp lý hơn nếu chỉ xây một phần nhỏ? Lassen Sie uns einen Kompromiss finden = hãy cùng tìm thoả hiệp."
    display_answer: Người nói đề xuất chỉ xây trên một phần nhỏ của công viên và muốn tìm thoả hiệp.

  - key: de:exercise:b2u05l4-listen-radio
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u04-g-indirekte-frage-aufforderung
    prompt:
      audio_asset_id: null
      fallback_text: "Die Moderatorin fragt Frau Klein, ob sie gegen das Projekt sei. Frau Klein sagt: Ich gebe zu bedenken, dass im Park viele seltene Vögel leben. Herr Braun hingegen meint, die Stadt brauche dringend neue Wohnungen."
      options:
        - { id: q3a, text: "Bà Klein lo ngại cho các loài chim hiếm trong công viên; ông Braun thì cho rằng thành phố rất cần nhà ở mới.", lang: vi }
        - { id: q7b, text: "Bà Klein và ông Braun đều ủng hộ dự án xây nhà ở.", lang: vi }
        - { id: q1c, text: "Bà Klein cho rằng thành phố rất cần nhà ở mới; ông Braun lo ngại cho các loài chim.", lang: vi }
        - { id: q5d, text: "Người dẫn chương trình phản đối dự án vì các loài chim hiếm.", lang: vi }
    answer:
      correct_option_id: q3a
    explanation:
      vi: "Ich gebe zu bedenken, dass … seltene Vögel leben = bà Klein nêu lo ngại về chim hiếm. Herr Braun hingegen meint, die Stadt brauche … = ngược lại ông Braun cho rằng thành phố cần nhà ở (lời gián tiếp, B2U04). Người dẫn chương trình chỉ hỏi (fragt, ob …), không nêu ý kiến."
    display_answer: Bà Klein lo ngại cho các loài chim hiếm trong công viên; ông Braun thì cho rằng thành phố rất cần nhà ở mới.

  # ---------------- recall ----------------
  - key: de:exercise:b2u05l4-fill-redemittel
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2u05-g-diskussion-redemittel
    prompt:
      template: "Da muss ich Ihnen {{b1}} (widersprechen). Das {{b2}} (mögen) sein, aber die Kosten sind zu hoch. Ich gebe zu {{b3}}, dass der Bau lange dauert."
      blanks:
        - { id: b1, width_hint: 12 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 9 }
    answer:
      blanks:
        b1: [widersprechen]
        b2: [mag]
        b3: [bedenken]
    known_wrong:
      - answer: widerspreche
        feedback_vi: Sau động từ khiếm khuyết muss, động từ chính ở nguyên thể – widersprechen.
        error_tag: verb_form
      - answer: möchte
        feedback_vi: "Ở đây mögen nghĩa là \"có thể\" và chia ở Präsens – Das mag sein."
        error_tag: verb_form
      - answer: denken
        feedback_vi: Cụm cố định là zu bedenken geben – Ich gebe zu bedenken, dass …
        error_tag: word_choice
    explanation:
      vi: "Da muss ich Ihnen widersprechen (muss + nguyên thể). Das mag sein = có thể là vậy (mögen, ngôi es → mag). Ich gebe zu bedenken, dass … = tôi xin lưu ý rằng …"
    display_answer: "Da muss ich Ihnen widersprechen. Das mag sein, aber die Kosten sind zu hoch. Ich gebe zu bedenken, dass der Bau lange dauert."

  - key: de:exercise:b2u05l4-tr-sinnvoller
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u05-g-diskussion-redemittel
    prompt:
      source_text: "Chẳng phải sẽ hợp lý hơn nếu chỉ xây trên một phần nhỏ của công viên sao? (dùng Wäre es nicht sinnvoller …, bebauen)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Wäre es nicht sinnvoller, nur einen kleinen Teil des Parks zu bebauen?
        - Wäre es nicht sinnvoller, nur ein kleines Stück des Parks zu bebauen?
        - Wäre es nicht sinnvoller, lediglich einen kleinen Teil des Parks zu bebauen?
        - Wäre es nicht sinnvoller, nur einen kleinen Teil des Stadtparks zu bebauen?
        - Wäre es nicht sinnvoller, nur einen kleinen Teil vom Park zu bebauen?
    known_wrong:
      - answer: Wäre es nicht sinnvoller, nur einen kleinen Teil des Parks bebauen?
        feedback_vi: Sau Wäre es nicht sinnvoller cần zu + Infinitiv – zu bebauen.
        error_tag: zu_infinitive
      - answer: Wäre es nicht sinnvoller, zu bebauen nur einen kleinen Teil des Parks?
        feedback_vi: zu + Infinitiv đứng cuối cụm – … einen kleinen Teil des Parks zu bebauen.
        error_tag: word_order
    explanation:
      vi: "Wäre es nicht sinnvoller, … zu + Infinitiv? là đề xuất lịch sự bằng Konjunktiv II. bebauen (xây trên khu đất) đi thẳng với Akkusativ: einen kleinen Teil des Parks."
    display_answer: Wäre es nicht sinnvoller, nur einen kleinen Teil des Parks zu bebauen?

  - key: de:exercise:b2u05l4-tr-zu-bedenken
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u05-bedenken
    prompt:
      source_text: "Tôi xin lưu ý rằng việc xây dựng sẽ kéo dài nhiều năm. (dùng Ich gebe zu bedenken …, der Bau)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich gebe zu bedenken, dass der Bau mehrere Jahre dauern würde.
        - Ich gebe zu bedenken, dass der Bau mehrere Jahre dauern wird.
        - Ich gebe zu bedenken, dass der Bau mehrere Jahre dauert.
        - Ich gebe zu bedenken, dass der Bau viele Jahre dauern würde.
        - Ich gebe zu bedenken, dass der Bau viele Jahre dauern wird.
        - Ich gebe zu bedenken, dass der Bau viele Jahre dauert.
        - Ich möchte zu bedenken geben, dass der Bau mehrere Jahre dauern würde.
        - Ich möchte zu bedenken geben, dass der Bau mehrere Jahre dauern wird.
        - Ich möchte zu bedenken geben, dass der Bau mehrere Jahre dauert.
        - Ich möchte zu bedenken geben, dass der Bau viele Jahre dauern würde.
    known_wrong:
      - answer: Ich gebe zu bedenken, dass der Bau dauert mehrere Jahre.
        feedback_vi: Trong câu dass, động từ chia đứng cuối – … mehrere Jahre dauert.
        error_tag: verb_position
      - answer: Ich gebe zu bedenken, dass der Bau mehrere Jahre dauern werden würde.
        feedback_vi: Dùng một trợ động từ thôi – dauern würde hoặc dauern wird.
        error_tag: verb_form
    explanation:
      vi: "zu bedenken geben = lưu ý một cách lịch sự. Câu dass có động từ cuối: dauern würde/wird hoặc dauert. mehrere/viele Jahre = nhiều năm."
    display_answer: Ich gebe zu bedenken, dass der Bau mehrere Jahre dauern würde.

  # ---------------- application ----------------
  - key: de:exercise:b2u05l4-mcq-reaktion
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u05-g-diskussion-redemittel
    prompt:
      stem: "Bạn thi nói: \"Wir brauchen dringend Wohnungen, deshalb sollte der ganze Park bebaut werden.\" Bạn thấy lý do nhà ở có lý nhưng không muốn xây hết công viên. Câu trả lời nào phù hợp nhất (lịch sự, có lập luận và đề xuất)?"
      stem_lang: vi
      options:
        - { id: a2a, text: "Das mag sein, aber muss es wirklich der ganze Park sein? Wäre es nicht sinnvoller, nur einen Teil zu bebauen?", lang: de }
        - { id: a6b, text: "Ja, Sie haben völlig recht.", lang: de }
        - { id: a9c, text: "Das ist doch Unsinn.", lang: de }
        - { id: a4d, text: "Da muss ich Ihnen widersprechen. Wohnungen sind unwichtig.", lang: de }
    answer:
      correct_option_id: a2a
    explanation:
      vi: "Phương án đầu thừa nhận một phần (Das mag sein), phản bác bằng câu hỏi và đưa đề xuất (Wäre es nicht sinnvoller …). Đồng ý cho xong không có tương tác; Das ist doch Unsinn thô lỗ; câu cuối mâu thuẫn với việc bạn thấy lý do nhà ở có lý và nói vơ đũa cả nắm."
    display_answer: "Das mag sein, aber muss es wirklich der ganze Park sein? Wäre es nicht sinnvoller, nur einen Teil zu bebauen?"

