  - key: de:exercise:b2u01l1-mcq-annas-abschluss
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u01-g-genitivattribut
    prompt:
      stem: "Câu nào đúng? (Việc công nhận bằng của Anna mất ba tháng.)"
      stem_lang: vi
      options:
        - { id: g3a, text: "Die Anerkennung von Annas Abschluss dauerte drei Monate.", lang: de }
        - { id: g7b, text: "Die Anerkennung Annas Abschluss dauerte drei Monate.", lang: de }
        - { id: g1c, text: "Die Anerkennung der Abschluss von Anna dauerte drei Monate.", lang: de }
        - { id: g5d, text: "Die Anerkennung des Abschluss von Anna dauerte drei Monate.", lang: de }
    answer:
      correct_option_id: g3a
    explanation:
      vi: "Annas Abschluss (tên riêng + s đứng trước) là cách nói \"bằng của Anna\"; sau Anerkennung, cụm này được nối bằng von + Dativ. Câu thứ hai thiếu von mà Abschluss lại không ở Genitiv nên sai; một cách tự nhiên khác là die Anerkennung des Abschlusses von Anna. der Abschluss là Nominativ, còn des Abschluss thiếu đuôi -es."
    display_answer: Die Anerkennung von Annas Abschluss dauerte drei Monate.
