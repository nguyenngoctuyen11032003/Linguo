title:
  vi: Cơ hội học vấn – danh từ hoá (Nach Abschluss des Studiums …)
objectives:
  - vi: Chuyển câu phụ (weil, obwohl, nachdem, bevor, während, wenn, um … zu) thành cụm giới từ + danh từ (Nominalstil) và ngược lại.
  - vi: Đọc và viết cụm danh từ có Genitiv bổ nghĩa (die Anerkennung ausländischer Abschlüsse).
  - vi: Đọc hiểu câu văn trang trọng về học vấn, cơ hội và công nhận bằng cấp.
