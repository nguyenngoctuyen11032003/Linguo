title:
  vi: Bằng cách… – indem, dadurch dass; folglich (Indem man lernt, …)
objectives:
  - vi: Nói về cách thức, phương tiện bằng indem, dadurch, dass … và durch + Akkusativ.
  - vi: Nối hệ quả, kết luận trang trọng bằng folglich, infolgedessen, somit, demnach và phân biệt với sodass.
  - vi: Đọc và nói về cách phát triển năng lực, học tập suốt đời.
