title:
  vi: Một mặt… mặt khác – nối ý đối lập, nhượng bộ (Einerseits …, andererseits …)
objectives:
  - vi: Nối hai ý đối lập bằng einerseits … andererseits, dennoch, allerdings, jedoch, hingegen/dagegen và đặt động từ đúng chỗ.
  - vi: Dùng wohingegen (câu phụ đối lập) và auch wenn / selbst wenn (dù cho, kể cả khi).
  - vi: Cân nhắc ưu nhược của việc thăng tiến và viết một đoạn lập luận hai chiều.
