    prompt:
      stem: "Bạn viết một đoạn lập luận hai chiều cho diễn đàn. Câu nào đúng ngữ pháp và dấu câu?"
      stem_lang: vi
      options:
        - { id: f3a, text: "Einerseits ist ein Aufstieg attraktiv, andererseits bedeutet er mehr Leistungsdruck.", lang: de }
        - { id: f7b, text: "Einerseits ein Aufstieg ist attraktiv, andererseits er bedeutet mehr Leistungsdruck.", lang: de }
        - { id: f1c, text: "Einerseits ist ein Aufstieg attraktiv, andererseits er bedeutet mehr Leistungsdruck.", lang: de }
        - { id: f5d, text: "Jedoch, ein Aufstieg ist attraktiv, er bedeutet mehr Leistungsdruck.", lang: de }
