    item: de:item:b2u01-g-es-korrelat
    prompt:
      audio_asset_id: null
      fallback_text: Es freut mich sehr, dass Sie mich zum Gespräch eingeladen haben. Ich habe Ihre Stellenanzeige mit großem Interesse gelesen.
      options:
        - { id: e2a, text: "Người nói rất vui vì được mời phỏng vấn và đã đọc tin tuyển dụng với nhiều hứng thú.", lang: vi }
        - { id: e6b, text: "Người nói rất vui vì đã mời ứng viên đến phỏng vấn.", lang: vi }
        - { id: e9c, text: "Người nói tiếc vì không được mời phỏng vấn.", lang: vi }
        - { id: e4d, text: "Người nói chưa đọc tin tuyển dụng nhưng muốn được phỏng vấn.", lang: vi }
    answer:
      correct_option_id: e2a
    explanation:
      vi: "Es freut mich, dass Sie mich … eingeladen haben = tôi vui vì anh/chị đã mời tôi (Sie mời, mich được mời). mit großem Interesse gelesen = đã đọc với nhiều hứng thú."
    display_answer: Người nói rất vui vì được mời phỏng vấn và đã đọc tin tuyển dụng với nhiều hứng thú.

  - key: de:exercise:b2u01l4-listen-probezeit
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u01-probezeit
    prompt:
      audio_asset_id: null
      fallback_text: Die Probezeit beträgt sechs Monate. Danach ist der Vertrag unbefristet. Ihr Urlaubsanspruch liegt bei dreißig Tagen im Jahr.
      options:
        - { id: p3a, text: "Thử việc sáu tháng, sau đó hợp đồng không thời hạn; được nghỉ phép 30 ngày mỗi năm.", lang: vi }
        - { id: p7b, text: "Thử việc sáu tháng, sau đó hợp đồng có thời hạn; được nghỉ phép 30 ngày mỗi năm.", lang: vi }
        - { id: p1c, text: "Thử việc ba tháng, sau đó hợp đồng không thời hạn; được nghỉ phép 30 ngày mỗi năm.", lang: vi }
        - { id: p5d, text: "Thử việc sáu tháng, sau đó hợp đồng không thời hạn; được nghỉ phép 13 ngày mỗi năm.", lang: vi }
    answer:
      correct_option_id: p3a
    explanation:
      vi: "sechs Monate = sáu tháng; unbefristet = không thời hạn (befristet mới là có thời hạn). dreißig (30) khác dreizehn (13): hãy nghe đuôi -ßig và -zehn."
    display_answer: Thử việc sáu tháng, sau đó hợp đồng không thời hạn; được nghỉ phép 30 ngày mỗi năm.

  - key: de:exercise:b2u01l4-listen-gehalt
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u01-gehaltsvorstellung
    prompt:
      audio_asset_id: null
      fallback_text: Meine Gehaltsvorstellung liegt bei fünfzigtausend Euro brutto im Jahr. Darüber können wir aber gern verhandeln.
      options:
        - { id: g4a, text: "Mức lương mong muốn là 50.000 euro trước thuế mỗi năm, có thể thương lượng.", lang: vi }
        - { id: g8b, text: "Mức lương mong muốn là 50.000 euro sau thuế mỗi năm, không thương lượng.", lang: vi }
        - { id: g2c, text: "Mức lương mong muốn là 15.000 euro trước thuế mỗi năm, có thể thương lượng.", lang: vi }
        - { id: g6d, text: "Mức lương mong muốn là 50.000 euro trước thuế mỗi tháng, có thể thương lượng.", lang: vi }
    answer:
      correct_option_id: g4a
    explanation:
      vi: "fünfzigtausend = 50.000 (fünfzehntausend mới là 15.000); brutto = trước thuế; im Jahr = mỗi năm. Darüber können wir gern verhandeln = về khoản này ta có thể thương lượng."
    display_answer: Mức lương mong muốn là 50.000 euro trước thuế mỗi năm, có thể thương lượng.

  - key: de:exercise:b2u01l4-mcq-dass-vorne
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u01-g-es-korrelat
    prompt:
      stem: "Câu nào đúng? (Tôi rất vui vì anh/chị đã mời tôi.)"
      stem_lang: vi
      options:
        - { id: v2a, text: "Dass Sie mich eingeladen haben, freut mich sehr.", lang: de }
        - { id: v6b, text: "Dass Sie mich eingeladen haben, freut es mich sehr.", lang: de }
        - { id: v9c, text: "Dass Sie mich eingeladen haben, es freut mich sehr.", lang: de }
        - { id: v4d, text: "Dass Sie haben mich eingeladen, freut mich sehr.", lang: de }
    answer:
      correct_option_id: v2a
    explanation:
      vi: "Câu dass đứng đầu chiếm vị trí 1, nên es biến mất và động từ freut đứng ngay sau dấu phẩy. Trong câu dass, trợ động từ haben đứng cuối."
    display_answer: Dass Sie mich eingeladen haben, freut mich sehr.

  # ---------------- recall ----------------
  - key: de:exercise:b2u01l4-fill-es-haben
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2u01-g-es-korrelat
    prompt:
      template: "Ich finde {{b1}} wichtig, im Team zu arbeiten. Es {{b2}} (haben) sich über hundert Personen beworben. Dass Sie Zeit haben, {{b3}} (freuen) mich sehr."
      blanks:
        - { id: b1, width_hint: 3 }
        - { id: b2, width_hint: 6 }
        - { id: b3, width_hint: 6 }
    answer:
      blanks:
        b1: [es]
        b2: [haben]
        b3: [freut]
    known_wrong:
      - answer: hat
        feedback_vi: es chỉ giữ chỗ; chủ ngữ thật là hundert Personen (số nhiều) – Es haben sich …
        error_tag: verb_form
      - answer: freuen
        feedback_vi: Chủ ngữ là cả câu dass (ngôi thứ ba số ít) – freut.
        error_tag: verb_form
    explanation:
      vi: "finden + tính từ + zu-Infinitiv: văn viết cần es (Ich finde es wichtig, …). Ở câu es giữ chỗ, động từ chia theo chủ ngữ thật số nhiều: haben. Câu dass đứng đầu là chủ ngữ ngôi thứ ba số ít nên dùng freut, và không có es."
    display_answer: "Ich finde es wichtig, im Team zu arbeiten. Es haben sich über hundert Personen beworben. Dass Sie Zeit haben, freut mich sehr."

  - key: de:exercise:b2u01l4-fill-vertrag
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2u01-kuendigungsfrist
    prompt:
      template: "Die {{b1}} (die Zeit am Anfang, in der man getestet wird) dauert sechs Monate. In dieser Zeit gilt meist eine kürzere {{b2}} (Frist für die Kündigung). Über das Gehalt kann man oft {{b3}} (Verb mit v-: diskutieren, um sich zu einigen)."
      blanks:
        - { id: b1, width_hint: 10 }
        - { id: b2, width_hint: 15 }
        - { id: b3, width_hint: 10 }
    answer:
      blanks:
        b1: [Probezeit]
        b2: [Kündigungsfrist]
        b3: [verhandeln]
    known_wrong:
      - answer: Kündigung
        feedback_vi: die Kündigung là việc chấm dứt hợp đồng; thời hạn báo trước là die Kündigungsfrist (có chữ s nối).
        error_tag: meaning
      - answer: Kündigungfrist
        feedback_vi: Từ ghép này có chữ s nối – Kündigungsfrist.
        error_tag: spelling
    explanation:
      vi: "die Probezeit = thời gian thử việc; die Kündigungsfrist = thời hạn báo trước khi nghỉ việc (Kündigung + s + Frist); über etwas verhandeln = thương lượng về điều gì."
    display_answer: "Die Probezeit dauert sechs Monate. In dieser Zeit gilt meist eine kürzere Kündigungsfrist. Über das Gehalt kann man oft verhandeln."

  - key: de:exercise:b2u01l4-tr-team
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:a2u06-g-zu-infinitiv
    prompt:
      source_text: "Tôi thấy làm việc nhóm là quan trọng. (dùng es + zu-Infinitiv)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich finde es wichtig, im Team zu arbeiten.
        - Ich finde es wichtig, in einem Team zu arbeiten.
        - Ich halte es für wichtig, im Team zu arbeiten.
        - Ich halte es für wichtig, in einem Team zu arbeiten.
        - Ich finde es wichtig, im Team zusammenzuarbeiten.
        - Ich halte es für wichtig, im Team zusammenzuarbeiten.
    known_wrong:
      - answer: Ich finde es wichtig, im Team arbeiten.
        feedback_vi: Sau es wichtig cần zu trước nguyên thể – im Team zu arbeiten.
        error_tag: zu_infinitive
      - answer: Ich finde es wichtig, zu im Team arbeiten.
        feedback_vi: zu đứng ngay trước nguyên thể ở cuối – im Team zu arbeiten.
        error_tag: zu_infinitive
      - answer: Ich finde es wichtig, im Team zu arbeitet.
        feedback_vi: Sau zu là động từ nguyên thể – zu arbeiten.
        error_tag: zu_infinitive
    explanation:
      vi: "es báo trước cụm zu-Infinitiv đứng sau: Ich finde es wichtig, im Team zu arbeiten. zu đứng ngay trước nguyên thể ở cuối cụm; halten für + tính từ cũng dùng được: Ich halte es für wichtig, …"
    display_answer: Ich finde es wichtig, im Team zu arbeiten.

