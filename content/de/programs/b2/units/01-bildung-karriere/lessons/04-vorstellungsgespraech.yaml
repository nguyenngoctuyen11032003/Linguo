body:
  - type: objective
    text:
      vi: "Sau bài này, bạn trả lời được các câu hỏi phỏng vấn một cách lịch sự, ví dụ: \"Es freut mich, dass Sie mich eingeladen haben. Ich halte es für eine meiner Stärken, auch unter Zeitdruck ruhig zu bleiben.\""
  - type: explain
    text:
      vi: "Khi một câu dass hoặc cụm zu-Infinitiv làm chủ ngữ hay tân ngữ, câu chính thường có es đứng trước để \"giữ chỗ\" cho nó: Es freut mich, dass Sie Zeit haben. (= Dass Sie Zeit haben, freut mich.) es ở đây không mang nghĩa \"nó\"; tiếng Việt không có từ tương ứng, giống như ta nói \"Tôi rất vui vì …\"."
  - type: explain
    text:
      vi: "Với finden/halten + tính từ, văn viết nên có es: Ich finde es wichtig, dass … · Ich halte es für sinnvoll, im Team zu arbeiten. Trong văn nói, đôi khi bạn nghe Ich finde wichtig, dass …, nhưng trong thư và bài thi hãy viết có es."
  - type: explain
    text:
      vi: "Khi câu dass đứng đầu, nó đã chiếm vị trí 1 nên es biến mất: Dass Sie mich eingeladen haben, freut mich sehr. Không nói Dass …, freut es mich."
  - type: explain
    text:
      vi: "Ở vị trí 1, es còn có thể chỉ là từ giữ chỗ để chủ ngữ thật đứng sau, hay gặp khi báo tin: Es haben sich über hundert Personen beworben. Động từ chia theo chủ ngữ thật (haben – hundert Personen), và es biến mất khi một từ khác đứng đầu: Auf die Stelle haben sich über hundert Personen beworben."
  - type: explain
    text:
      vi: "Trong phỏng vấn, dùng Sie và câu lịch sự: Meine Stärken sind … · Meine Gehaltsvorstellung liegt bei … Euro brutto im Jahr. · Ich würde gern wissen, wie lang die Probezeit ist. Hỏi về hợp đồng là bình thường ở Đức; bạn nên hỏi rõ thử việc, nghỉ phép, Homeoffice và thời hạn báo trước."
  - type: deep_explain
    text:
      vi: "Các cụm hay đi với es + dass/zu: es freut mich, es tut mir leid, es fällt mir schwer, es ist wichtig/möglich/nötig, es gelingt mir, ich finde es gut, ich halte es für richtig. Với một số động từ, es là tuỳ chọn (Ich bedauere [es], dass …), còn với finden/halten + tính từ thì có es là chuẩn. es giữ chỗ ở vị trí 1 khác với es là chủ ngữ thật (Es regnet. Es gibt viele Bewerber.): es thật không biến mất khi đảo (Heute regnet es. Heute gibt es viele Bewerber.). Theo cách hiểu thông dụng, mức lương trong phỏng vấn ở Đức thường được nói theo năm và trước thuế; con số cụ thể tuỳ ngành và vùng, nên hãy tìm hiểu trước."
  - type: example
    target: Es freut mich, dass Sie mich zum Vorstellungsgespräch eingeladen haben.
    target_lang: de
    translation:
      vi: Tôi rất vui vì anh/chị đã mời tôi đến phỏng vấn.
    note:
      vi: "es báo trước câu dass; Sie viết hoa vì là cách xưng hô lịch sự."
  - type: example
    target: Ich finde es wichtig, dass die Einarbeitung gut organisiert ist.
    target_lang: de
    translation:
      vi: Tôi cho rằng điều quan trọng là giai đoạn hướng dẫn công việc được tổ chức tốt.
    note:
      vi: "finden + tính từ + es + câu dass; trong câu dass, động từ ist đứng cuối."
  - type: example
    target: Dass die Probezeit sechs Monate dauert, ist für mich kein Problem.
    target_lang: de
    translation:
      vi: Việc thử việc kéo dài sáu tháng không phải là vấn đề với tôi.
    note:
      vi: "Câu dass đứng đầu nên không có es; động từ ist đứng ngay sau dấu phẩy."
  - type: example
    target: Es haben sich über hundert Personen auf die Stelle beworben.
    target_lang: de
    translation:
      vi: Đã có hơn một trăm người nộp đơn vào vị trí này.
    note:
      vi: "es chỉ giữ vị trí 1; động từ haben chia theo chủ ngữ thật hundert Personen (số nhiều)."
  - type: example
    target: Ich halte es für eine meiner Stärken, auch unter Zeitdruck ruhig zu bleiben.
    target_lang: de
    translation:
      vi: Tôi cho rằng một trong những điểm mạnh của mình là vẫn bình tĩnh khi gấp rút về thời gian.
    note:
      vi: "halten für + Akkusativ + es + zu-Infinitiv. eine meiner Stärken = một trong những điểm mạnh của tôi (Genitiv số nhiều)."
  - type: example
    target: Meine Gehaltsvorstellung liegt bei 48.000 Euro brutto im Jahr. Ich würde gern wissen, ob Homeoffice möglich ist.
    target_lang: de
    translation:
      vi: Mức lương mong muốn của tôi là 48.000 euro trước thuế mỗi năm. Tôi muốn biết liệu có được làm việc tại nhà không.
    note:
      vi: "liegen bei = ở mức. Ich würde gern wissen, ob … là cách hỏi lịch sự (câu hỏi gián tiếp, động từ cuối)."
  - type: common_mistake
    wrong: Dass Sie mich eingeladen haben, freut es mich sehr.
    right: Dass Sie mich eingeladen haben, freut mich sehr.
    target_lang: de
    note:
      vi: "Câu dass đã đứng ở vị trí 1, nên không thêm es nữa."
  - type: common_mistake
    wrong: Ich finde wichtig, dass das Team gut zusammenarbeitet.
    right: Ich finde es wichtig, dass das Team gut zusammenarbeitet.
    target_lang: de
    note:
      vi: "Trong văn nói, dạng không có es đôi khi được chấp nhận, nhưng trong văn viết và bài thi nên có es."
  - type: common_mistake
    wrong: Es hat sich viele Bewerber gemeldet.
    right: Es haben sich viele Bewerber gemeldet.
    target_lang: de
    note:
      vi: "es giữ chỗ không quyết định động từ: chủ ngữ thật là viele Bewerber (số nhiều), nên dùng haben."
  - type: common_mistake
    wrong: Heute es haben sich viele Bewerber gemeldet.
    right: Heute haben sich viele Bewerber gemeldet.
    target_lang: de
    note:
      vi: "Khi Heute đã đứng ở vị trí 1, es giữ chỗ biến mất."
  - type: summary
    points:
      - vi: "es + câu dass / zu-Infinitiv: Es freut mich, dass … · Ich finde es wichtig, … zu …"
      - vi: "finden/halten + tính từ: văn viết nên có es."
      - vi: "Câu dass đứng đầu → không có es (Dass …, freut mich.)."
      - vi: "es giữ chỗ ở vị trí 1: động từ chia theo chủ ngữ thật; es biến mất khi từ khác đứng đầu."
      - vi: "Phỏng vấn: Meine Stärken sind …, Meine Gehaltsvorstellung liegt bei …, Ich würde gern wissen, ob/wie …"
      - vi: "Từ vựng: die Gehaltsvorstellung, die Probezeit, die Kündigung, kündigen, der Arbeitsvertrag, die Belastbarkeit, die Teamfähigkeit, verhandeln."
