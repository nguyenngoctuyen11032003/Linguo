  - key: de:exercise:b2u07l1-mcq-lesen-baeckerei
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u07-g-infinitiv-perfekt
    prompt:
      stem: "Die Bäckerei Sonnenkorn (erfundenes Beispiel) hat ihren ersten Nachhaltigkeitsbericht veröffentlicht. Laut dem Bericht ist ihr Stromverbrauch innerhalb eines Jahres um ein Viertel gesunken. Die Chefin ist stolz, alle alten Öfen ersetzt zu haben. Einige Nachbarn kritisieren jedoch, nicht nach ihrer Meinung gefragt worden zu sein. Bis zum nächsten Sommer wird die Bäckerei auch ihre Lieferwagen ausgetauscht haben. — Was steht im Text?"
      stem_lang: de
      options:
        - { id: l2a, text: "Die alten Öfen sind schon ersetzt worden.", lang: de }
        - { id: l6b, text: "Die Bäckerei will die alten Öfen im nächsten Sommer ersetzen.", lang: de }
        - { id: l9c, text: "Die Nachbarn wurden vor dem Bericht nach ihrer Meinung gefragt.", lang: de }
        - { id: l4d, text: "Die Lieferwagen sind bereits ausgetauscht worden.", lang: de }
    answer:
      correct_option_id: l2a
    explanation:
      vi: "ersetzt zu haben = đã thay xong (nguyên thể quá khứ). Hàng xóm phê bình vì KHÔNG được hỏi ý kiến (nicht … gefragt worden zu sein). wird … ausgetauscht haben là Futur II: đến hè tới mới xong, nên xe giao hàng chưa được thay."
    display_answer: Die alten Öfen sind schon ersetzt worden.
