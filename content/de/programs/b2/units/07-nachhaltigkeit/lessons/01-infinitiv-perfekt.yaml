title:
  vi: Đã giảm được… – nguyên thể quá khứ và bị động (Er behauptet, die Emissionen reduziert zu haben.)
objectives:
  - vi: Đọc báo cáo môi trường và thuật lại cam kết, kết quả của doanh nghiệp, thành phố.
  - vi: Dùng nguyên thể quá khứ (reduziert zu haben, angekommen zu sein) khi việc đã xảy ra trước.
  - vi: Dùng nguyên thể bị động (informiert zu werden, gewarnt worden zu sein) sau hoffen, erwarten, bestreiten …
