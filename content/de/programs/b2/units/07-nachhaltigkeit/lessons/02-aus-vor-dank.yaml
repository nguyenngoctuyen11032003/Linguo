  - vi: Phân biệt aus (động cơ có ý thức), vor (phản ứng không chủ ý) và dank (nguyên nhân tích cực).
  - vi: Dùng aufgrund, infolge, wegen + Genitiv trong văn viết về thiên nhiên.
