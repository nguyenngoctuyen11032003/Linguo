    prompt:
      template: "Die Stadt behauptet, die Luft schon deutlich verbessert zu {{b1}}. Die Händler hoffen, bei der Planung {{b2}} zu werden. (beteiligen) {{b3}} Angst vor weniger Kunden protestieren einige Geschäfte. (aus · vor)"
      blanks:
