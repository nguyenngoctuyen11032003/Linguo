    display_answer: "Người nói nêu hai lý lẽ ủng hộ: tốt cho môi trường và học sinh được biết món ăn mới."

  - key: de:exercise:b2u07l4-listen-contra
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u07-gegenargument
    prompt:
      audio_asset_id: null
      fallback_text: Dagegen lässt sich einwenden, dass manche Schüler an diesem Tag gar nichts essen. Dieses Gegenargument halte ich für durchaus berechtigt.
      options:
        - { id: c2a, text: "Có thể phản bác rằng vào ngày đó một số học sinh sẽ không ăn gì; người nói thấy lý lẽ này hoàn toàn có cơ sở.", lang: vi }
        - { id: c6b, text: "Có thể phản bác rằng vào ngày đó một số học sinh sẽ không ăn gì; người nói thấy lý lẽ này vô lý.", lang: vi }
        - { id: c9c, text: "Người nói ủng hộ vì học sinh sẽ ăn nhiều hơn vào ngày đó.", lang: vi }
        - { id: c4d, text: "Người nói kể rằng hôm qua nhiều học sinh không ăn gì ở căng-tin.", lang: vi }
    answer:
      correct_option_id: c2a
    explanation:
      vi: "Dagegen lässt sich einwenden, dass … = có thể phản bác rằng … (mở phản đề). gar nichts essen = không ăn gì cả. halte … für durchaus berechtigt = cho là hoàn toàn có cơ sở."
    display_answer: Có thể phản bác rằng vào ngày đó một số học sinh sẽ không ăn gì; người nói thấy lý lẽ này hoàn toàn có cơ sở.

