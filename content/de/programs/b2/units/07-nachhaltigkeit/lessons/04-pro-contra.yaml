  # ---------------- recall ----------------
  - key: de:exercise:b2u07l4-fill-redemittel
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2u07-g-argumentation-redemittel
    prompt:
      template: "Für einen fleischfreien Tag {{b1}} (sprechen), dass er die Umwelt entlastet. Dagegen lässt sich {{b2}} (einwenden), dass manche Schüler dann weniger essen. Ein {{b3}} (weiter) Argument ist der Preis."
      blanks:
        - { id: b1, width_hint: 8 }
        - { id: b2, width_hint: 10 }
        - { id: b3, width_hint: 9 }
    answer:
      blanks:
        b1: [spricht]
        b2: [einwenden]
        b3: [weiteres]
    known_wrong:
      - answer: sprechen
        feedback_vi: Chủ ngữ là cả câu dass (số ít), nên động từ chia ngôi 3 số ít – spricht.
        error_tag: verb_form
      - answer: weiteren
        feedback_vi: Sau ein với danh từ giống trung (das Argument) ở Nominativ, tính từ có đuôi -es – ein weiteres Argument.
        error_tag: adj_ending
      - answer: eingewendet
        feedback_vi: Sau lässt sich cần nguyên thể – einwenden.
        error_tag: verb_form
    explanation:
      vi: "Für … spricht, dass …: câu dass là chủ ngữ nên spricht (ngôi 3 số ít). lässt sich + nguyên thể ở cuối: einwenden. das Argument giống trung, sau ein ở Nominativ: weiteres."
    display_answer: "Für einen fleischfreien Tag spricht, dass er die Umwelt entlastet. Dagegen lässt sich einwenden, dass manche Schüler dann weniger essen. Ein weiteres Argument ist der Preis."

  - key: de:exercise:b2u07l4-fill-begruenden
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u07-begruendung
    prompt:
      template: "Bitte {{b1}} Sie Ihre Meinung. (Begründung, Verb) Eine Meinung ohne {{b2}} überzeugt niemanden. (begründen, Nomen) {{b3}} möchte ich sagen, dass beide Seiten gute Argumente haben. (abschließen, Adverb)"
      blanks:
        - { id: b1, width_hint: 10 }
        - { id: b2, width_hint: 11 }
        - { id: b3, width_hint: 13 }
    answer:
      blanks:
        b1: [begründen]
        b2: [Begründung]
        b3: [Abschließend]
    known_wrong:
      - answer: begründet
        feedback_vi: Câu mệnh lệnh với Sie dùng dạng nguyên thể – Bitte begründen Sie …
        error_tag: verb_form
      - answer: Grund
        feedback_vi: Cần danh từ tạo từ begründen (lý do được nêu ra) – die Begründung.
        error_tag: word_choice
      - answer: Abschließen
        feedback_vi: Mở phần kết cần trạng từ (dạng Partizip I) – Abschließend.
        error_tag: word_choice
    explanation:
      vi: "Mệnh lệnh lịch sự: Bitte begründen Sie … (động từ nguyên thể + Sie). begründen → die Begründung (đuôi -ung). abschließen → abschließend (Partizip I làm trạng từ), đứng ở vị trí 1 nên möchte ngay sau."
    display_answer: "Bitte begründen Sie Ihre Meinung. Eine Meinung ohne Begründung überzeugt niemanden. Abschließend möchte ich sagen, dass beide Seiten gute Argumente haben."

  - key: de:exercise:b2u07l4-tr-pfand
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u07-g-argumentation-redemittel
    prompt:
      source_text: "Lý lẽ ủng hộ việc đặt tiền cọc cho cốc cà phê là sẽ có ít rác hơn. (dùng Für … spricht, dass …)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Für ein Pfand auf Kaffeebecher spricht, dass weniger Müll entsteht.
        - Für ein Pfand auf Kaffeebecher spricht, dass es weniger Müll gibt.
        - Für ein Pfand auf Kaffeebecher spricht, dass dann weniger Müll entsteht.
        - Für ein Pfand auf Kaffeebecher spricht, dass es dann weniger Müll gibt.
        - Für ein Pfand auf Kaffeebecher spricht, dass weniger Abfall entsteht.
        - Für ein Pfand auf Kaffeebecher spricht, dass es weniger Abfall gibt.
        - Für ein Pfand für Kaffeebecher spricht, dass weniger Müll entsteht.
        - Für ein Pfand für Kaffeebecher spricht, dass es weniger Müll gibt.
        - Für ein Pfand auf Kaffeebecher spricht, dass weniger Müll entstehen wird.
        - Für ein Pfand auf Kaffeebecher spricht, dass es weniger Müll geben wird.
    known_wrong:
      - answer: Für ein Pfand auf Kaffeebecher spricht, dass weniger Müll entsteht wird.
        feedback_vi: Futur trong câu phụ là nguyên thể + werden ở cuối – entstehen wird (hoặc dùng Präsens entsteht).
        error_tag: verb_form
      - answer: Für ein Pfand auf Kaffeebecher spricht, dass entsteht weniger Müll.
        feedback_vi: Câu dass là câu phụ, động từ đứng cuối – dass weniger Müll entsteht.
        error_tag: verb_position
      - answer: Für ein Pfand auf Kaffeebecher sprechen, dass weniger Müll entsteht.
