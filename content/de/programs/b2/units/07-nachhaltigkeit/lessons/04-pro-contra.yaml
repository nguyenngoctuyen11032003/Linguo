body:
  - type: objective
    text:
      vi: "Sau bài này, bạn trình bày được lý lẽ ủng hộ và phản đối rồi đưa ra kết luận có cân nhắc, ví dụ: \"Für einen fleischfreien Tag spricht, dass … Dagegen lässt sich einwenden, dass … Wägt man die Argumente ab, überwiegen meiner Meinung nach die Vorteile.\""
  - type: explain
    text:
      vi: "Bài lập luận (Erörterung) giống bài nghị luận ở trường Việt Nam: mở bài – thân bài – kết bài. Mở bài nêu vấn đề và vì sao nó quan trọng; thân bài gồm lý lẽ ủng hộ (Pro) và phản đối (Contra); kết bài cân nhắc hai bên và nêu ý kiến riêng. Mỗi lý lẽ nên có ba phần: luận điểm, lý do (weil …, denn …), ví dụ (So …, Zum Beispiel …)."
  - type: explain
    text:
      vi: "Nêu lý lẽ ủng hộ: Für … spricht, dass … (Für einen fleischfreien Tag spricht, dass …) hoặc Ein wichtiges Argument dafür ist, dass … Nêu phản đề: Dagegen spricht, dass … / Dagegen lässt sich einwenden, dass … / Gegner argumentieren, dass … Thêm ý: Ein weiteres Argument ist … Sau tất cả các cụm này là câu dass, động từ đứng cuối."
  - type: explain
    text:
      vi: "Kết luận: Wägt man die Argumente ab, … (= Wenn man die Argumente abwägt, …), Alles in allem …, Abschließend möchte ich sagen, dass …, Ich komme zu dem Schluss, dass … Các cụm Alles in allem, Abschließend, Zusammenfassend đứng ở vị trí 1 nên động từ chia đứng ngay sau. Kết luận phải khớp với phần thân: nếu bạn nêu nhiều ưu điểm thì đừng bất ngờ kết luận ngược lại."
  - type: deep_explain
    text:
      vi: "Wägt man die Argumente ab, … là câu điều kiện không có wenn: động từ wägt đứng đầu, ab ở cuối vế; vế sau bắt đầu bằng động từ (überwiegen) hoặc so + động từ. Để bài liền mạch, hãy dùng từ nối đã học: einerseits … andererseits, allerdings, jedoch (đối lập); auch wenn (nhượng bộ); folglich, somit (kết luận); je … desto (so sánh tăng tiến). Khi cân nhắc, nói rõ bạn coi trọng điều gì hơn: Ich gewichte den Umweltschutz höher als die Kosten. Theo cấu trúc tại thời điểm soạn bài, phần nói của Goethe-Zertifikat B2 có thảo luận cặp, cần đưa lý lẽ, phản biện và cùng đi đến kết luận; định dạng có thể thay đổi, hãy xem tài liệu mẫu chính thức."
  - type: example
    target: Für einen fleischfreien Tag in der Kantine spricht, dass er die Umwelt entlastet.
    target_lang: de
    translation:
      vi: Lý lẽ ủng hộ một ngày không thịt ở căng-tin là nó giảm gánh nặng cho môi trường.
    note:
      vi: "Für … ở vị trí 1, động từ spricht ở vị trí 2, chủ ngữ thật là câu dass."
  - type: example
    target: Dagegen lässt sich einwenden, dass manche Schüler dann weniger essen.
    target_lang: de
    translation:
      vi: Có thể phản bác rằng khi đó một số học sinh sẽ ăn ít hơn.
    note:
      vi: "sich einwenden lassen = có thể phản bác (cấu trúc sich lassen); dass + động từ cuối."
  - type: example
    target: Einerseits ist ein Pfand auf Kaffeebecher sinnvoll, andererseits bedeutet es mehr Arbeit für die Cafés.
    target_lang: de
    translation:
      vi: Một mặt, tiền cọc cho cốc cà phê là hợp lý, mặt khác nó có nghĩa là nhiều việc hơn cho các quán.
    note:
      vi: "einerseits … andererseits: hai mặt của vấn đề; cả hai đứng ở vị trí 1, động từ ngay sau."
  - type: example
    target: Je mehr Menschen Mehrwegbecher benutzen, desto weniger Müll entsteht.
    target_lang: de
    translation:
      vi: Càng nhiều người dùng cốc dùng nhiều lần thì càng ít rác.
    note:
      vi: "je + so sánh hơn (động từ cuối), desto + so sánh hơn (động từ ngay sau): một lý lẽ có ví dụ rõ ràng."
  - type: example
    target: Auch wenn das Gegenargument berechtigt ist, überzeugt es mich nicht ganz.
    target_lang: de
    translation:
      vi: Dù lý lẽ phản bác có cơ sở, nó vẫn chưa hoàn toàn thuyết phục tôi.
    note:
      vi: "auch wenn + câu phụ đứng đầu, động từ chính überzeugt ngay sau dấu phẩy."
  - type: example
    target: Ich vertrete den Standpunkt, dass jeder seinen eigenen Becher mitbringen sollte.
    target_lang: de
    translation:
      vi: Tôi giữ quan điểm rằng mỗi người nên mang cốc riêng.
    note:
      vi: "den Standpunkt vertreten, dass … = giữ quan điểm rằng …; trang trọng hơn Ich finde, dass …"
  - type: example
    target: Mehrwegbecher sparen Müll. Darüber hinaus sind sie auf Dauer billiger, zumal manche Cafés dafür einen Rabatt geben.
    target_lang: de
    translation:
      vi: Cốc dùng nhiều lần giúp bớt rác. Hơn nữa, về lâu dài chúng rẻ hơn, nhất là khi một số quán còn giảm giá cho khách mang cốc.
    note:
      vi: "Darüber hinaus ở vị trí 1 thêm một lý lẽ cùng phía (động từ sind ngay sau); zumal + câu phụ thêm lý do làm ý trước càng thuyết phục."
  - type: example
    target: Das mag sein, aber man hätte die Schüler vorher fragen sollen.
    target_lang: de
    translation:
      vi: Có thể là vậy, nhưng lẽ ra người ta nên hỏi ý kiến học sinh trước.
    note:
      vi: "Das mag sein, aber … = thừa nhận một phần rồi phản bác khi thảo luận; hätte … fragen sollen = lẽ ra nên (phê bình việc đã qua)."
  - type: example
    target: Wägt man die Argumente ab, überwiegen meiner Meinung nach die Vorteile. Folglich befürworte ich den Vorschlag.
    target_lang: de
    translation:
      vi: Cân nhắc các lý lẽ thì theo tôi ưu điểm nhiều hơn. Vì vậy tôi tán thành đề xuất này.
    note:
      vi: "Vế sau câu Wägt man … ab bắt đầu bằng động từ überwiegen; folglich ở vị trí 1 nên befürworte đứng ngay sau."
  - type: common_mistake
    wrong: "Ich finde einen fleischfreien Tag gut. Alles in allem bin ich dafür."
    right: "Ich finde einen fleischfreien Tag gut, weil er die Umwelt entlastet. So essen die Schüler zum Beispiel mehr Gemüse. Alles in allem bin ich dafür."
    target_lang: de
    note:
      vi: "Ý kiến không có lý do và ví dụ thì không thuyết phục; mỗi luận điểm cần weil … và zum Beispiel …"
  - type: common_mistake
    wrong: "Mehrwegbecher sparen Müll, Ressourcen und Geld. Alles in allem überwiegen die Nachteile."
    right: "Mehrwegbecher sparen Müll, Ressourcen und Geld. Alles in allem überwiegen die Vorteile."
    target_lang: de
    note:
      vi: "Kết luận phải khớp với phần thân bài; muốn kết luận khác thì phải trình bày các nhược điểm trước."
  - type: common_mistake
    wrong: Wägt man die Argumente ab, die Vorteile überwiegen.
    right: Wägt man die Argumente ab, überwiegen die Vorteile.
    target_lang: de
    note:
      vi: "Vế Wägt man … ab là vị trí 1 của cả câu, nên động từ überwiegen đứng ngay sau dấu phẩy."
  - type: summary
    points:
      - vi: "Cấu trúc: mở bài – lý lẽ ủng hộ – lý lẽ phản đối – cân nhắc và kết luận."
      - vi: "Mỗi luận điểm: ý chính + lý do (weil/denn) + ví dụ (zum Beispiel)."
      - vi: "Pro: Für … spricht, dass … · Ein weiteres Argument ist …"
      - vi: "Contra: Dagegen spricht, dass … · Dagegen lässt sich einwenden, dass …"
      - vi: "Kết luận: Wägt man die Argumente ab, + động từ … · Alles in allem / Abschließend + động từ …"
      - vi: "Kết luận phải khớp với thân bài; nói rõ bạn coi trọng lý lẽ nào hơn (gewichten)."
