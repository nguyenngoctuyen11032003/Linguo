body:
  - type: objective
    text:
      vi: "Sau bài này, bạn dùng đúng nhiều động từ trong văn viết học thuật và báo cáo: nêu ví dụ, kết luận, thực hiện, làm rõ và giới thiệu thông tin."
  - type: explain
    text:
      vi: "Động từ trình bày: anführen (nêu ra, viện dẫn), ansprechen (đề cập), aufzeigen (chỉ ra), verdeutlichen (làm rõ), hinzufügen (thêm vào), verweisen auf + Akk (chỉ dẫn đến), folgern aus + Dativ (suy ra từ), vorlegen (trình bày, đệ trình). Ví dụ: Der Redner führte mehrere Beispiele an. Der Bericht verweist auf die Quellen."
  - type: explain
    text:
      vi: "Động từ thực hiện: durchführen (tiến hành), durchsetzen (làm cho được thực thi), umsetzen (thực hiện, chuyển thành hành động), veranstalten (tổ chức), ausüben (thực hiện, hành nghề), verschärfen (làm nghiêm ngặt hơn), entgegenwirken (chống lại, đi ngược lại: + Dativ), umfassen (bao gồm). Ví dụ: Die Regierung will die Gesetze verschärfen."
  - type: explain
    text:
      vi: "Các dạng bất quy tắc: hinterlassen (hinterlässt, hinterließ, hat hinterlassen), entwerfen (entwirft, entwarf, hat entworfen), anzweifeln và bekräftigen (đều có chia đều). Zusammenhängen (hängt zusammen, hing zusammen, hat zusammengehangen) đi với mit + Dativ: Das hängt mit dem Klima zusammen."
  - type: deep_explain
    text:
      vi: "Durchführen và umsetzen thường đi cùng nhau trong văn bản dự án: Das Projekt wurde durchgeführt, die Ergebnisse werden umgesetzt. Aufzeigen và verdeutlichen đều là làm rõ, nhưng aufzeigen nhấn mạnh việc chỉ ra điều chưa thấy; verdeutlichen nhấn mạnh việc làm cho dễ hiểu. Vermuten (đoán, cho rằng) nhẹ hơn behaupten (khẳng định)."
  - type: example
    target: Er führt drei Gründe für seine Entscheidung an.
    target_lang: de
    translation:
      vi: Anh ấy nêu ba lý do cho quyết định của mình.
    note:
      vi: anführen = nêu ra, viện dẫn.
  - type: example
    target: Sie hat das Problem im Gespräch angesprochen.
    target_lang: de
    translation:
      vi: Cô ấy đã đề cập vấn đề trong cuộc trò chuyện.
    note:
      vi: ansprechen = đề cập; gây ấn tượng.
  - type: example
    target: Niemand zweifelt seine Ehrlichkeit an.
    target_lang: de
    translation:
      vi: Không ai nghi ngờ sự trung thực của anh ấy.
    note:
      vi: anzweifeln = nghi ngờ.
  - type: example
    target: Die Studie zeigt neue Wege auf.
    target_lang: de
    translation:
      vi: Nghiên cứu chỉ ra những hướng đi mới.
    note:
      vi: aufzeigen = chỉ ra, vạch rõ.
  - type: common_mistake
    wrong: Das hängt von dem Klima zusammen.
    right: Das hängt mit dem Klima zusammen.
    target_lang: de
    note:
      vi: Zusammenhängen đi với mit + Dativ.
  - type: common_mistake
    wrong: Der Autor verweist zu den Quellen.
    right: Der Autor verweist auf die Quellen.
    target_lang: de
    note:
      vi: Verweisen đi với auf + Akkusativ.
  - type: summary
    points:
      - vi: anführen, ansprechen, aufzeigen, verdeutlichen, hinzufügen, verweisen (auf + Akk), folgern (aus + Dativ), vorlegen, zusammenhängen (mit + Dativ).
      - vi: durchführen, durchsetzen, umsetzen, veranstalten, ausüben, verschärfen, entgegenwirken (+ Dativ), umfassen, hinterlassen, entwerfen.
      - vi: "anzweifeln, bekräftigen, beurteilen, entgegnen, vermuten: động từ có chia đều; chú ý động từ tách và Partizip II."
