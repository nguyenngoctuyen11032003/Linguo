body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về các nguồn năng lượng, ưu nhược điểm và chính sách năng lượng, và hiểu các bài báo kỹ thuật cơ bản về điện và môi trường.
  - type: explain
    text:
      vi: "Nguồn năng lượng: die Windkraftanlage, die Photovoltaikanlage, die Wasserkraft, die Kernenergie, das Atomkraftwerk, das Kohlekraftwerk, die Braunkohle, das Erdgas, der Wasserstoff. Đặc điểm: regenerativ (tái tạo), atomar (hạt nhân), energieintensiv (tiêu tốn nhiều năng lượng)."
  - type: explain
    text:
      vi: "Hạ tầng điện: das Stromnetz, der Netzbetreiber, die Einspeisung (việc đưa điện vào lưới), der Speicher (thiết bị lưu trữ), die Energieeffizienz, die Dämmung (cách nhiệt), der Atommüll, das Endlager (nơi chôn lấp lâu dài chất thải phóng xạ). Từ chính sách: die Energiewende (chuyển đổi năng lượng)."
  - type: explain
    text:
      vi: "Động từ: einspeisen (đưa vào lưới điện: speist ein), ausstoßen (thải ra: stößt aus, stieß aus, hat ausgestoßen), umrüsten (nâng cấp, chuyển đổi thiết bị), dämmen (cách nhiệt). Ví dụ: Die Solaranlage speist Strom ins Netz ein. Ältere Heizungen werden auf Wärmepumpen umgerüstet."
  - type: deep_explain
    text:
      vi: Die Energiewende là chính sách của Đức nhằm chuyển từ năng lượng hóa thạch và hạt nhân sang năng lượng tái tạo. Der Wasserstoff được xem là nhiên liệu của tương lai, nhưng chỉ sạch nếu được tạo ra bằng điện tái tạo. Kernenergie và Atomenergie đồng nghĩa; ở Đức việc đóng cửa các nhà máy điện hạt nhân đã được quyết định, nên Atomausstieg là từ thường gặp trên báo.
  - type: example
    target: Die Energiewende verändert die Stromversorgung.
    target_lang: de
    translation:
      vi: Quá trình chuyển đổi năng lượng làm thay đổi việc cung cấp điện.
    note:
      vi: die Energiewende = chuyển đổi năng lượng.
  - type: example
    target: Die neue Windkraftanlage liefert Strom für 5000 Haushalte.
    target_lang: de
    translation:
      vi: Nhà máy điện gió mới cung cấp điện cho 5000 hộ.
    note:
      vi: die Windkraftanlage = tua-bin gió, nhà máy điện gió.
  - type: example
    target: Auf dem Dach ist eine Photovoltaikanlage installiert.
    target_lang: de
    translation:
      vi: Trên mái nhà đã lắp một hệ thống điện mặt trời.
    note:
      vi: die Photovoltaikanlage = hệ thống điện mặt trời.
  - type: example
    target: Ein Speicher gleicht Schwankungen im Netz aus.
    target_lang: de
    translation:
      vi: Thiết bị lưu trữ cân bằng sự dao động trong lưới điện.
    note:
      vi: der Speicher = thiết bị lưu trữ, kho chứa.
  - type: common_mistake
    wrong: Die Anlage speist der Strom ins Netz ein.
    right: Die Anlage speist den Strom ins Netz ein.
    target_lang: de
    note:
      vi: "Strom là giống đực, Akkusativ: den Strom."
  - type: common_mistake
    wrong: Das Auto stoßt viel Kohlendioxid aus.
    right: Das Auto stößt viel Kohlendioxid aus.
    target_lang: de
    note:
      vi: "Ausstoßen đổi nguyên âm ở ngôi er/sie/es: stößt aus."
  - type: summary
    points:
      - vi: die Energiewende, die Windkraftanlage, die Photovoltaikanlage, die Wasserkraft, die Kernenergie, das Atomkraftwerk, das Kohlekraftwerk, die Braunkohle, das Erdgas, der Wasserstoff.
      - vi: das Stromnetz, der Netzbetreiber, die Einspeisung, der Speicher, die Energieeffizienz, die Dämmung, der Atommüll, das Endlager.
      - vi: einspeisen, ausstoßen (stößt aus), umrüsten, dämmen; regenerativ, atomar, energieintensiv.
