        feedback_vi: Verhaltensweise là dạng số ít; số nhiều là Verhaltensweisen.
        error_tag: plural_form
    explanation:
      vi: "Số nhiều của die Verhaltensweise là die Verhaltensweisen (ký hiệu trong từ điển: -n). Mạo từ số nhiều luôn là die."
    display_answer: "Singular: die Verhaltensweise · Plural: die Verhaltensweisen"
  - key: de:exercise:b2w3l1-mcq-luecke-gruppenzwang
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-gruppenzwang
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Nhiều thiếu niên hút thuốc vì áp lực từ nhóm.\": Viele Jugendliche rauchen aus ___."
      stem_lang: vi
      options:
        - { id: qxx, text: Rollenverteilung, lang: de }
        - { id: un1, text: Verhaltensweise, lang: de }
        - { id: lhf, text: Gruppenzwang, lang: de }
        - { id: mh7, text: Außenseiter, lang: de }
    answer:
      correct_option_id: lhf
    explanation:
      vi: "Câu có nghĩa \"Nhiều thiếu niên hút thuốc vì áp lực từ nhóm.\" nên cần Gruppenzwang (der Gruppenzwang: áp lực từ nhóm). Rollenverteilung = sự phân vai; Verhaltensweise = cách ứng xử; Außenseiter = người bị tách khỏi nhóm không đúng nghĩa của câu."
    display_answer: Gruppenzwang
  - key: de:exercise:b2w3l1-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: "Ai chịu áp lực từ nhóm thường hòa theo, dù thật ra họ có ý kiến khác."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Wer unter Gruppenzwang steht, fügt sich oft ein, obwohl er eigentlich anderer Meinung ist.
        - Wer unter Gruppenzwang steht, passt sich oft an, obwohl er eigentlich anderer Meinung ist.
        - Wer unter dem Gruppenzwang steht, fügt sich oft ein, obwohl er eigentlich anderer Meinung ist.
    explanation:
      vi: "Gợi ý đáp án: Wer unter Gruppenzwang steht, fügt sich oft ein, obwohl er eigentlich anderer Meinung ist. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Wer unter Gruppenzwang steht, fügt sich oft ein, obwohl er eigentlich anderer Meinung ist.
    item: de:item:b2w3-gruppenzwang
  - key: de:exercise:b2w3l1-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Als der Streit eskalierte, hat die Lehrerin geschlichtet und gezeigt, dass Zivilcourage wichtig ist.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Khi cuộc cãi vã leo thang, cô giáo đã hòa giải và cho thấy lòng can đảm công dân là quan trọng.
        - Lúc cuộc tranh cãi leo thang, cô giáo đã hòa giải và chứng tỏ rằng can đảm công dân rất quan trọng.
        - Khi mâu thuẫn trở nên căng thẳng, cô giáo đã đứng ra hòa giải và cho thấy lòng dũng cảm công dân quan trọng thế nào.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Als der Streit eskalierte, hat die Lehrerin geschlichtet und gezeigt, dass Zivilcourage wichtig ist.\" nghĩa là: Khi cuộc cãi vã leo thang, cô giáo đã hòa giải và cho thấy lòng can đảm công dân là quan trọng. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Khi cuộc cãi vã leo thang, cô giáo đã hòa giải và cho thấy lòng can đảm công dân là quan trọng.
    item: de:item:b2w3-zivilcourage
