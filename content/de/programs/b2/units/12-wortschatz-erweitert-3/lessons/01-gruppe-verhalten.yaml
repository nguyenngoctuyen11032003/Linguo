body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả được hành vi của con người trong nhóm, nguyên nhân và cách giải quyết xung đột, và nêu quan điểm về áp lực xã hội, bắt nạt và sự đoàn kết.
  - type: explain
    text:
      vi: "Danh từ về nhóm: der Gruppenzwang (áp lực của nhóm), die Rollenverteilung, die Erwartungshaltung, das Konkurrenzdenken, die Zusammengehörigkeit (tinh thần đoàn kết, số ít), der Außenseiter, der Anpassungsdruck. Hiện tượng tiêu cực: das Mobbing (bắt nạt, số ít). Ví dụ: Er leidet unter Mobbing in der Schule."
  - type: explain
    text:
      vi: "Xung đột và giải quyết: die Konfliktlösung, der Vermittler, schlichten (hòa giải), sich einmischen (xen vào), nachgeben (nhượng bộ: gibt nach, gab nach, hat nachgegeben), sich durchsetzen (áp đặt được ý mình, thành công), sich einfügen (hòa nhập), sich abgrenzen (phân biệt, giữ khoảng cách), ausgrenzen (loại trừ)."
  - type: explain
    text:
      vi: "Phẩm chất xã hội: das Einfühlungsvermögen (khả năng thấu cảm), das Durchsetzungsvermögen (khả năng thuyết phục, kiên quyết), die Zivilcourage (can đảm công dân), solidarisch (đoàn kết), introvertiert (hướng nội), extrovertiert (hướng ngoại). Ví dụ: Zivilcourage zeigt, wer bei Mobbing nicht wegsieht."
  - type: deep_explain
    text:
      vi: "Sich durchsetzen (setzt sich durch, setzte sich durch, hat sich durchgesetzt) có tân ngữ giới từ gegen: Sie hat sich gegen alle Widerstände durchgesetzt. Sich einmischen đi với in + Akk: Er mischt sich in fremde Angelegenheiten ein. Ausgrenzen thường được dùng ở bị động: Er wurde von der Gruppe ausgegrenzt. Die Verhaltensweise là cách ứng xử cụ thể, thường dùng số nhiều."
  - type: example
    target: Viele Jugendliche rauchen aus Gruppenzwang.
    target_lang: de
    translation:
      vi: Nhiều thiếu niên hút thuốc vì áp lực từ nhóm.
    note:
      vi: der Gruppenzwang = áp lực từ nhóm.
  - type: example
    target: Die Rollenverteilung im Team war von Anfang an klar.
    target_lang: de
    translation:
      vi: Việc phân vai trong nhóm rõ ràng ngay từ đầu.
    note:
      vi: die Rollenverteilung = sự phân vai.
  - type: example
    target: Die hohe Erwartungshaltung der Eltern setzt ihn unter Druck.
    target_lang: de
    translation:
      vi: Kỳ vọng cao của cha mẹ khiến cậu ấy chịu áp lực.
    note:
      vi: die Erwartungshaltung = tâm thế kỳ vọng.
  - type: example
    target: In dieser Abteilung herrscht ein starkes Konkurrenzdenken.
    target_lang: de
    translation:
      vi: Trong phòng ban này có tư duy cạnh tranh rất mạnh.
    note:
      vi: das Konkurrenzdenken = tư duy cạnh tranh.
  - type: common_mistake
    wrong: Sie hat sich gegen alle durchgesetzt worden.
    right: Sie hat sich gegen alle durchgesetzt.
    target_lang: de
    note:
      vi: Chủ động phản thân dùng haben + Partizip II; không thêm worden.
  - type: common_mistake
    wrong: Er mischt sich an meine Angelegenheiten ein.
    right: Er mischt sich in meine Angelegenheiten ein.
    target_lang: de
    note:
      vi: Sich einmischen đi với in + Akkusativ.
  - type: summary
    points:
      - vi: der Gruppenzwang, die Rollenverteilung, die Erwartungshaltung, das Konkurrenzdenken, die Zusammengehörigkeit, der Außenseiter, der Anpassungsdruck, das Mobbing.
      - vi: die Konfliktlösung, der Vermittler, schlichten, sich einmischen (in + Akk), nachgeben, sich durchsetzen (gegen), sich einfügen, sich abgrenzen, ausgrenzen.
      - vi: das Einfühlungsvermögen, das Durchsetzungsvermögen, die Zivilcourage; solidarisch, introvertiert, extrovertiert.
exercises:
  - key: de:exercise:b2w3l1-listen-mobbing
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w3-mobbing
    prompt:
      audio_asset_id: null
      fallback_text: Die Schule bietet Hilfe bei Mobbing an.
      options:
        - { id: me3, text: "Bằng lòng can đảm công dân, cô ấy đã giúp nạn nhân.", lang: vi }
        - { id: aj1, text: Anh trai tôi khá hướng nội., lang: vi }
        - { id: ovi, text: Nhà trường hỗ trợ khi có bắt nạt., lang: vi }
        - { id: zxd, text: Học sinh mới đã nhanh chóng hòa nhập với lớp., lang: vi }
    answer:
      correct_option_id: ovi
    explanation:
      vi: Câu bạn nghe có nghĩa "Nhà trường hỗ trợ khi có bắt nạt.". Từ khoá là das Mobbing (việc bắt nạt); các câu còn lại nói về những từ khác trong bài.
    display_answer: Nhà trường hỗ trợ khi có bắt nạt.
  - key: de:exercise:b2w3l1-mcq-vi-de-introvertiert
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w3-introvertiert
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "hướng nội"?
      stem_lang: vi
      options:
        - { id: fbu, text: das Einfühlungsvermögen, lang: de }
        - { id: pfe, text: introvertiert, lang: de }
        - { id: s4w, text: das Konkurrenzdenken, lang: de }
        - { id: fyn, text: das Mobbing, lang: de }
    answer:
      correct_option_id: pfe
    explanation:
      vi: "introvertiert nghĩa là \"hướng nội\". Ví dụ: Mein Bruder ist eher introvertiert. (Anh trai tôi khá hướng nội.)"
    display_answer: introvertiert
  - key: de:exercise:b2w3l1-mcq-de-vi-sich-einmischen
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w3-sich-einmischen
    prompt:
      stem: "\"sich einmischen\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: wy9, text: xen vào (in + Akk), lang: vi }
        - { id: itw, text: tâm thế kỳ vọng, lang: vi }
        - { id: vm8, text: áp lực từ nhóm, lang: vi }
        - { id: qae, text: tư duy cạnh tranh, lang: vi }
    answer:
      correct_option_id: wy9
    explanation:
      vi: "sich einmischen nghĩa là \"xen vào (in + Akk)\". Ví dụ: Bitte misch dich nicht in meine Angelegenheiten ein. (Xin đừng xen vào chuyện của tôi.)"
    display_answer: xen vào (in + Akk)
  - key: de:exercise:b2w3l1-mcq-artikel-durchsetzungsvermoegen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-durchsetzungsvermoegen
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Durchsetzungsvermögen\" (khả năng kiên quyết thực hiện ý mình): ___ Durchsetzungsvermögen"
      stem_lang: vi
      options:
        - { id: mv3, text: die, lang: de }
        - { id: k32, text: der, lang: de }
        - { id: f5j, text: ein, lang: de }
        - { id: dxi, text: das, lang: de }
    answer:
      correct_option_id: dxi
    explanation:
      vi: "Durchsetzungsvermögen là danh từ giống trung (das): das Durchsetzungsvermögen (không dùng ở số nhiều). \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
  - key: de:exercise:b2w3l1-tr-word-zivilcourage
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-zivilcourage
    prompt:
      source_text: lòng can đảm công dân (danh từ, viết cả mạo từ)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - die Zivilcourage
    known_wrong:
      - answer: der Zivilcourage
        feedback_vi: Zivilcourage là giống cái, nên là die Zivilcourage.
        error_tag: article
      - answer: das Zivilcourage
        feedback_vi: Zivilcourage là giống cái, nên là die Zivilcourage.
        error_tag: article
    explanation:
      vi: "\"lòng can đảm công dân\" trong tiếng Đức là die Zivilcourage (số nhiều: không dùng). Ví dụ: Mit Zivilcourage hat sie dem Opfer geholfen."
    display_answer: die Zivilcourage
  - key: de:exercise:b2w3l1-tr-word-solidarisch
