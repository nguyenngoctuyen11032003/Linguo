  - key: de:exercise:b2w3l2-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Ein kooperativer Führungsstil motiviert die Mitarbeiter mehr als ein autoritärer, weil sie Verantwortung übernehmen dürfen.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Phong cách lãnh đạo hợp tác thúc đẩy nhân viên hơn phong cách độc đoán, vì họ được nhận trách nhiệm.
        - Cách lãnh đạo mang tính hợp tác tạo động lực cho nhân viên hơn cách độc đoán vì họ được phép nhận trách nhiệm.
        - Một phong cách lãnh đạo hợp tác thúc đẩy nhân viên hơn kiểu độc đoán, vì họ được gánh trách nhiệm.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Ein kooperativer Führungsstil motiviert die Mitarbeiter mehr als ein autoritärer, weil sie Verantwortung übernehmen dürfen.\" nghĩa là: Phong cách lãnh đạo hợp tác thúc đẩy nhân viên hơn phong cách độc đoán, vì họ được nhận trách nhiệm. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Phong cách lãnh đạo hợp tác thúc đẩy nhân viên hơn phong cách độc đoán, vì họ được nhận trách nhiệm.
    item: de:item:b2w3-fuehrungsstil
