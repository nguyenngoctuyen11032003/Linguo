      correct_option_id: y9r
    explanation:
      vi: "der Teamleiter nghĩa là \"trưởng nhóm\". Ví dụ: Der Teamleiter verteilt die Aufgaben. (Trưởng nhóm phân chia nhiệm vụ.)"
    display_answer: trưởng nhóm
  - key: de:exercise:b2w3l2-mcq-artikel-mitarbeitergespraech
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-mitarbeitergespraech
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Mitarbeitergespräch\" (buổi trao đổi, đánh giá với nhân viên): ___ Mitarbeitergespräch"
      stem_lang: vi
      options:
        - { id: rly, text: die, lang: de }
        - { id: eqd, text: das, lang: de }
        - { id: wv8, text: der, lang: de }
        - { id: x0u, text: ein, lang: de }
    answer:
      correct_option_id: eqd
    explanation:
      vi: "Mitarbeitergespräch là danh từ giống trung (das): das Mitarbeitergespräch; số nhiều: die Mitarbeitergespräche. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
  - key: de:exercise:b2w3l2-tr-word-tarifvertrag
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-tarifvertrag
    prompt:
      source_text: thỏa ước lao động tập thể (danh từ, viết cả mạo từ)
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - der Tarifvertrag
    known_wrong:
      - answer: die Tarifvertrag
        feedback_vi: Tarifvertrag là giống đực, nên là der Tarifvertrag.
        error_tag: article
      - answer: das Tarifvertrag
        feedback_vi: Tarifvertrag là giống đực, nên là der Tarifvertrag.
        error_tag: article
    explanation:
      vi: "\"thỏa ước lao động tập thể\" trong tiếng Đức là der Tarifvertrag (số nhiều: die Tarifverträge). Ví dụ: Der Tarifvertrag gilt für alle Beschäftigten der Branche."
    display_answer: der Tarifvertrag
  - key: de:exercise:b2w3l2-tr-word-kooperativ
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2w3-kooperativ
