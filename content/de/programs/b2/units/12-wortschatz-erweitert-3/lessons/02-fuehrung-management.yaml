    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w3-teamleiter
    prompt:
      stem: "\"der Teamleiter\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: eos, text: trưởng phòng, lang: vi }
        - { id: o46, text: "buổi trao đổi, đánh giá với nhân viên", lang: vi }
        - { id: s05, text: "việc mua lại, tiếp quản", lang: vi }
        - { id: y9r, text: trưởng nhóm, lang: vi }
