  - key: de:exercise:b2w3l2-mcq-vi-de-unternehmenskultur
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w3-unternehmenskultur
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "văn hóa doanh nghiệp"?
      stem_lang: vi
      options:
        - { id: wqm, text: der Abteilungsleiter, lang: de }
        - { id: rr9, text: die Gewerkschaft, lang: de }
        - { id: xjn, text: die Unternehmenskultur, lang: de }
        - { id: k8q, text: der Stellenabbau, lang: de }
