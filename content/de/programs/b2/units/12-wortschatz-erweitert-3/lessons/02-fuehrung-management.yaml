        feedback_vi: Geschäftsleitung là dạng số ít; số nhiều là Geschäftsleitungen.
        error_tag: plural_form
    explanation:
      vi: "Số nhiều của die Geschäftsleitung là die Geschäftsleitungen (ký hiệu trong từ điển: -en). Mạo từ số nhiều luôn là die."
    display_answer: "Singular: die Geschäftsleitung · Plural: die Geschäftsleitungen"
  - key: de:exercise:b2w3l2-mcq-luecke-fuehrungsstil
