body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về cách lãnh đạo, cơ cấu tổ chức và những thay đổi trong doanh nghiệp, hiểu các thông báo về sáp nhập, tái cơ cấu và đàm phán lương.
  - type: explain
    text:
      vi: "Lãnh đạo và nhân sự: der Führungsstil (phong cách lãnh đạo), der Teamleiter, der Abteilungsleiter, die Geschäftsleitung, der Entscheidungsträger (người có quyền quyết định), das Mitarbeitergespräch, die Zielvereinbarung (thỏa thuận mục tiêu), die Leistungsbeurteilung (đánh giá hiệu quả). Mô tả phong cách: kooperativ (hợp tác), autoritär (độc đoán), hierarchisch (có thứ bậc)."
  - type: explain
    text:
      vi: "Đại diện người lao động: der Betriebsrat (hội đồng người lao động trong doanh nghiệp), die Gewerkschaft (công đoàn), der Tarifvertrag (thỏa ước lao động tập thể). Cụm từ: Der Betriebsrat vertritt die Interessen der Beschäftigten. Die Gewerkschaft verhandelt über den Tarifvertrag. Tính từ betrieblich nghĩa là thuộc doanh nghiệp: betriebliche Altersvorsorge."
  - type: explain
    text:
      vi: "Thay đổi tổ chức: die Restrukturierung (tái cơ cấu), der Stellenabbau (cắt giảm việc làm), die Fusion (sáp nhập), die Übernahme (mua lại), der Wettbewerbsvorteil, umstrukturieren, fusionieren, übertragen (giao: überträgt, übertrug, hat übertragen), leiten, delegieren (ủy quyền), motivieren. Ví dụ: Die Firma wird umstrukturiert und 200 Stellen werden abgebaut."
  - type: deep_explain
    text:
      vi: Der Betriebsrat được bầu trong doanh nghiệp đủ lớn và có quyền tham gia quyết định về một số vấn đề như giờ làm, sa thải. Die Gewerkschaft (ví dụ ver.di, IG Metall) là tổ chức bên ngoài doanh nghiệp. Tarifvertrag là thỏa thuận giữa công đoàn và hiệp hội chủ lao động, không phải hợp đồng cá nhân. Aufgaben übertragen nghĩa là giao nhiệm vụ cho ai.
  - type: example
    target: Sein Führungsstil ist offen und fair.
    target_lang: de
    translation:
      vi: Phong cách lãnh đạo của ông ấy cởi mở và công bằng.
    note:
      vi: der Führungsstil = phong cách lãnh đạo.
  - type: example
    target: Einmal im Jahr findet ein Mitarbeitergespräch statt.
    target_lang: de
    translation:
      vi: Mỗi năm có một buổi trao đổi với nhân viên.
    note:
      vi: das Mitarbeitergespräch = buổi trao đổi, đánh giá với nhân viên.
  - type: example
    target: In der Zielvereinbarung stehen die Aufgaben für das nächste Jahr.
    target_lang: de
    translation:
      vi: Trong thỏa thuận mục tiêu ghi các nhiệm vụ của năm sau.
    note:
      vi: die Zielvereinbarung = thỏa thuận mục tiêu.
  - type: example
    target: Die Leistungsbeurteilung beeinflusst die Gehaltserhöhung.
    target_lang: de
    translation:
      vi: Việc đánh giá hiệu quả ảnh hưởng đến tăng lương.
    note:
      vi: die Leistungsbeurteilung = đánh giá hiệu quả công việc.
  - type: common_mistake
    wrong: Der Chef hat die Aufgabe an mir übertragen.
    right: Der Chef hat mir die Aufgabe übertragen.
    target_lang: de
    note:
      vi: Übertragen đi với Dativ người (mir) và tân ngữ Akkusativ; không dùng an + Dativ.
  - type: common_mistake
    wrong: Die zwei Firmen sind fusioniert worden.
    right: Die zwei Firmen sind fusioniert.
    target_lang: de
    note:
      vi: "Fusionieren dùng sein ở Perfekt và không dùng bị động: ist fusioniert."
  - type: summary
    points:
      - vi: der Führungsstil, der Teamleiter, der Abteilungsleiter, die Geschäftsleitung, der Entscheidungsträger, das Mitarbeitergespräch, die Zielvereinbarung, die Leistungsbeurteilung.
      - vi: der Betriebsrat, die Gewerkschaft, der Tarifvertrag, die Unternehmenskultur; kooperativ, autoritär, hierarchisch, betrieblich.
      - vi: die Restrukturierung, der Stellenabbau, die Fusion, die Übernahme, der Wettbewerbsvorteil; leiten, delegieren, motivieren, umstrukturieren, fusionieren, übertragen.
