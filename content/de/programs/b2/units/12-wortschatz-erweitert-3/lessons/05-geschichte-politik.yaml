body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu được một bài báo hoặc đoạn văn về lịch sử và chính trị Đức hiện đại và nêu ý kiến bằng các từ chuyên ngành cơ bản.
  - type: explain
    text:
      vi: "Lịch sử: der Weltkrieg (Zweiter Weltkrieg), die Nachkriegszeit, die Besatzung (sự chiếm đóng), die Diktatur, die Verfolgung, die Gedenkstätte (nơi tưởng niệm), der Zeitzeuge (nhân chứng lịch sử), die Revolution, der Mauerfall, die Wiedervereinigung. Ví dụ: Die Wiedervereinigung fand 1990 statt."
  - type: explain
    text:
      vi: "Hệ thống chính trị: die Republik, die Monarchie, der Föderalismus, der Bundesrat (đại diện các bang), der Kanzler, die Amtszeit, die Koalition (liên minh cầm quyền), die Opposition, der Wahlkampf, die Reform. Ví dụ: Die Koalition besteht aus drei Parteien. Die Opposition kritisiert die Reform."
  - type: explain
    text:
      vi: "Động từ: regieren (cầm quyền), ablösen (thay thế), kapitulieren (đầu hàng), và tính từ demokratisch, konservativ, liberal. Ví dụ: Die Partei regiert seit zwei Jahren. Er wurde von seinem Nachfolger abgelöst. Cẩn thận: konservativ trong chính trị nghĩa là bảo thủ theo truyền thống, liberal là tự do."
  - type: deep_explain
    text:
      vi: "Föderalismus nghĩa là nhà nước liên bang, quyền lực chia giữa liên bang (Bund) và các bang (Länder). Der Bundesrat không giống Bundestag: Bundestag là quốc hội do dân bầu, Bundesrat đại diện chính quyền các bang. Der Kanzler (đầy đủ Bundeskanzler) là người đứng đầu chính phủ. Gedenkstätte và Mahnmal đều dùng để tưởng niệm; ở Đức người ta rất coi trọng việc nhớ lại quá khứ."
  - type: example
    target: Der Zweite Weltkrieg endete 1945.
    target_lang: de
    translation:
      vi: Thế chiến thứ hai kết thúc năm 1945.
    note:
      vi: der Weltkrieg = thế chiến.
  - type: example
    target: In der Nachkriegszeit fehlte es an Wohnungen.
    target_lang: de
    translation:
      vi: Thời hậu chiến thiếu nhà ở.
    note:
      vi: die Nachkriegszeit = thời kỳ hậu chiến.
  - type: example
    target: Die Wiedervereinigung Deutschlands fand 1990 statt.
    target_lang: de
    translation:
      vi: Việc tái thống nhất nước Đức diễn ra năm 1990.
    note:
      vi: die Wiedervereinigung = sự tái thống nhất.
  - type: example
    target: Der Mauerfall im November 1989 veränderte Europa.
    target_lang: de
    translation:
      vi: Sự sụp đổ Bức tường Berlin tháng 11 năm 1989 làm thay đổi châu Âu.
    note:
      vi: der Mauerfall = sự sụp đổ của Bức tường Berlin.
  - type: common_mistake
    wrong: Die Opposition hat die Reform kritisieren.
    right: Die Opposition hat die Reform kritisiert.
    target_lang: de
    note:
      vi: "Perfekt: hat kritisiert; động từ có đuôi -ieren không thêm ge-."
  - type: common_mistake
    wrong: Das Land wurde von eine Diktatur regiert.
    right: Das Land wurde von einer Diktatur regiert.
    target_lang: de
    note:
      vi: "Von + Dativ: einer Diktatur."
  - type: summary
    points:
      - vi: der Weltkrieg, die Nachkriegszeit, die Wiedervereinigung, der Mauerfall, die Besatzung, die Diktatur, die Verfolgung, die Gedenkstätte, der Zeitzeuge.
      - vi: die Republik, die Monarchie, die Revolution, die Reform, der Föderalismus, der Wahlkampf, die Koalition, die Opposition, der Kanzler, der Bundesrat, die Amtszeit.
      - vi: regieren, ablösen, kapitulieren; demokratisch, konservativ, liberal.
