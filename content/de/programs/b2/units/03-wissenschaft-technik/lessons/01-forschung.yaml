title:
  vi: Nghiên cứu – bị động không chủ ngữ, bị động có modal ở quá khứ (Es wird geforscht. Das musste getestet werden.)
objectives:
  - vi: Đọc hiểu bài báo khoa học phổ thông ngắn về một nghiên cứu.
  - vi: Dùng bị động không chủ ngữ (Es wird viel geforscht. Hier wird nicht geraucht.) để mô tả hoạt động mà không nêu người làm.
  - vi: Mô tả quy trình nghiên cứu đã qua bằng bị động có modal (musste getestet werden, hat getestet werden müssen).
