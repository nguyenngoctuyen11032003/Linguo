    display_answer: An unserer Schule wird seit Jahren über KI diskutiert.

  - key: de:exercise:b2u03l5-wb-programm-dessen
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u03-g-relativ-genitiv
    prompt:
      instruction: "Sắp xếp thành câu: \"Một chương trình mà bài tập của nó tự điều chỉnh có thể hỗ trợ học sinh yếu hơn.\""
      tokens:
        - { id: p-anpassen, text: anpassen }
        - { id: p-programm, text: Ein Programm }
        - { id: p-komma1, text: "," }
        - { id: p-kann, text: kann }
        - { id: p-dessen, text: dessen }
        - { id: p-sich, text: sich }
        - { id: p-aufgaben, text: Aufgaben }
        - { id: p-komma2, text: "," }
        - { id: p-schueler, text: schwächere Schüler }
        - { id: p-foerdern, text: fördern }
    answer:
      orders:
        - [p-programm, p-komma1, p-dessen, p-aufgaben, p-sich, p-anpassen, p-komma2, p-kann, p-schueler, p-foerdern]
