body:
  - type: objective
    text:
      vi: "Sau bài này, bạn nói được về công nghệ tương lai và phỏng đoán có chừng mực, ví dụ: \"Bis 2040 wird man vielleicht viele einfache Arbeiten automatisiert haben. Das dürfte aber nicht alle Berufe betreffen.\""
  - type: explain
    text:
      vi: "Futur I (B1U06) nói việc sẽ xảy ra: Man wird neue Roboter entwickeln. Futur II nói việc sẽ đã xong trước một mốc tương lai: Bis 2040 wird man neue Roboter entwickelt haben. Cấu tạo: werden ở vị trí 2, cuối câu là Partizip II + haben/sein – chọn haben hay sein như ở Perfekt."
  - type: explain
    text:
      vi: "Khi nói hằng ngày, Futur II thường dùng để đoán về việc đã xảy ra, hay kèm wohl: Paul ist nicht da. Er wird wohl den Bus verpasst haben (chắc cậu ấy lỡ xe buýt rồi). Bạn đã gặp cách đoán về hiện tại: Er wird wohl krank sein (B1U06); Futur II là phiên bản quá khứ của nó."
  - type: explain
    text:
      vi: "Modal cũng dùng để phỏng đoán, theo thang chắc chắn giảm dần: muss (gần như chắc, có căn cứ rõ) > dürfte (khá chắc, \"chắc là\") > kann/könnte (có thể). kann nicht nghĩa là \"không thể nào\": Das kann nicht stimmen. Tiếng Việt dùng \"chắc chắn là / chắc là / có thể\", tiếng Đức dùng chính các modal này."
  - type: explain
    text:
      vi: "Đoán về quá khứ: modal + Partizip II + haben/sein ở cuối câu: Er muss den Termin vergessen haben. Die Prüfung muss schwer gewesen sein. Đừng hiểu muss ở đây là \"bắt buộc\", hay dürfte là \"được phép\": ngữ cảnh phỏng đoán (có bằng chứng, có dấu hiệu) cho bạn biết nghĩa."
  - type: deep_explain
    text:
      vi: "dürfte là Konjunktiv II của dürfen (B1U04) nhưng trong phỏng đoán nó không còn nghĩa \"được phép\": Das dürfte stimmen = chắc là đúng. Phủ định của muss (phỏng đoán) là kann nicht (Er kann nicht zu Hause sein), vì muss nicht nghĩa là \"không cần/không nhất thiết\". Khi dự báo tương lai, người viết cẩn thận thường làm mềm câu bằng vielleicht, wahrscheinlich, dürfte: Bis 2050 dürfte sich vieles verändert haben. Trong câu phụ, werden của Futur II đứng cuối cùng: …, dass man bis dahin vieles automatisiert haben wird."
  - type: example
    target: Bis Ende des Jahres werden die Forscher die Studie abgeschlossen haben.
    target_lang: de
    translation:
      vi: Đến cuối năm các nhà nghiên cứu sẽ hoàn thành xong nghiên cứu.
    note:
      vi: "Futur II: werden + abgeschlossen + haben – việc xong trước mốc bis Ende des Jahres."
  - type: example
    target: Bis wir ankommen, wird der Vortrag schon angefangen haben.
    target_lang: de
    translation:
      vi: Đến lúc chúng ta tới thì bài thuyết trình chắc đã bắt đầu rồi.
    note:
      vi: "anfangen có Perfekt với haben (hat angefangen) nên Futur II: wird … angefangen haben."
  - type: example
    target: Im Labor brennt noch Licht. Frau Berg muss noch da sein.
    target_lang: de
    translation:
      vi: Phòng thí nghiệm vẫn còn sáng đèn. Chắc chắn bà Berg vẫn còn ở đó.
    note:
      vi: "muss = gần như chắc chắn, dựa trên bằng chứng (đèn còn sáng). Không có nghĩa bà ấy bắt buộc phải ở lại."
  - type: example
    target: Selbstfahrende Autos dürften in Zukunft häufiger werden, aber das kann noch dauern.
    target_lang: de
    translation:
      vi: Ô tô tự lái chắc là sẽ phổ biến hơn trong tương lai, nhưng điều đó có thể còn lâu.
    note:
      vi: "dürften = khá chắc, dự báo thận trọng; kann noch dauern = có thể còn lâu."
  - type: example
    target: Das kann nicht sein. Die Maschine muss falsch programmiert worden sein.
    target_lang: de
    translation:
      vi: Không thể nào. Chắc chắn máy đã bị lập trình sai.
    note:
      vi: "kann nicht = không thể nào. muss … worden sein là phỏng đoán quá khứ ở bị động – bạn chỉ cần hiểu dạng này."
  - type: example
    target: Alle Prognosen sind unsicher, aber der technische Fortschritt wird wohl weitergehen.
    target_lang: de
    translation:
      vi: Mọi dự báo đều không chắc chắn, nhưng tiến bộ kỹ thuật chắc là sẽ còn tiếp tục.
    note:
      vi: "werden + wohl + nguyên thể (B1U06): phỏng đoán; so sánh với Futur II + wohl khi đoán việc đã xảy ra."
  - type: common_mistake
    wrong: Bis Freitag werden wir die Daten ausgewertet sein.
    right: Bis Freitag werden wir die Daten ausgewertet haben.
    target_lang: de
    note:
      vi: "auswerten có Perfekt với haben (hat ausgewertet), nên Futur II cũng dùng haben."
  - type: common_mistake
    wrong: Er muss krank gewesen haben.
    right: Er muss krank gewesen sein.
    target_lang: de
    note:
      vi: "sein có Perfekt với sein (ist gewesen), nên phỏng đoán quá khứ là muss … gewesen sein."
  - type: common_mistake
    wrong: Er muss nicht im Büro sein, er ist doch im Urlaub.
    right: Er kann nicht im Büro sein, er ist doch im Urlaub.
    target_lang: de
    note:
      vi: "\"Không thể nào\" là kann nicht; muss nicht nghĩa là \"không cần, không nhất thiết\"."
  - type: summary
    points:
      - vi: "Futur II: werden + Partizip II + haben/sein – việc sẽ xong trước một mốc (bis …)."
      - vi: "Futur II + wohl: đoán việc đã xảy ra (Er wird den Bus verpasst haben)."
      - vi: "Thang phỏng đoán: muss > dürfte > kann/könnte; kann nicht = không thể nào."
      - vi: "Đoán quá khứ: muss/dürfte/könnte + Partizip II + haben/sein."
      - vi: "muss phỏng đoán ≠ bắt buộc; dürfte phỏng đoán ≠ được phép."
      - vi: "Từ vựng: die künstliche Intelligenz (KI), die Technologie, der Roboter, automatisieren, die Digitalisierung, die Innovation, ersetzen, das Risiko, die Erfindung, erfinden."
