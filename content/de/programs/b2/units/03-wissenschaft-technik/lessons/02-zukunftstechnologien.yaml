    explanation:
      vi: "Futur II để đoán về quá khứ: werden (vị trí 2) + wohl + tân ngữ + Partizip II + haben ở cuối câu. wohl thường đứng trước tân ngữ không xác định (einen Fehler)."
    display_answer: Die Forscher werden wohl einen Fehler gemacht haben.

