  - key: de:exercise:b2u03l2-mcq-muss-licht
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b2u03-g-modalverben-subjektiv
    prompt:
      stem: "Im Labor brennt noch Licht. Dr. Weber muss noch da sein. — Was bedeutet der zweite Satz?"
      stem_lang: de
      options:
        - { id: l1, text: "Chắc chắn là TS Weber vẫn còn ở đó.", lang: vi }
        - { id: l2, text: "TS Weber bắt buộc phải ở lại đó.", lang: vi }
        - { id: l3, text: "TS Weber được phép ở lại đó.", lang: vi }
        - { id: l4, text: "Có lẽ TS Weber đã về rồi.", lang: vi }
    answer:
      correct_option_id: l1
    explanation:
      vi: "Câu đầu là bằng chứng (đèn còn sáng), câu sau là kết luận: muss ở đây là phỏng đoán gần như chắc chắn, không phải nghĩa bắt buộc."
    display_answer: Chắc chắn là TS Weber vẫn còn ở đó.

  - key: de:exercise:b2u03l2-mcq-duerfte
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 2
    item: de:item:b2u03-g-modalverben-subjektiv
    prompt:
      stem: "Die Reparatur der Maschine dürfte etwa zwei Stunden dauern. — Was bedeutet dieser Satz?"
      stem_lang: de
      options:
        - { id: d1, text: "Việc sửa máy chắc là mất khoảng hai tiếng.", lang: vi }
        - { id: d2, text: "Việc sửa máy được phép kéo dài khoảng hai tiếng.", lang: vi }
        - { id: d3, text: "Việc sửa máy bắt buộc phải kéo dài hai tiếng.", lang: vi }
        - { id: d4, text: "Việc sửa máy đã kéo dài khoảng hai tiếng.", lang: vi }
    answer:
      correct_option_id: d1
    explanation:
      vi: "dürfte ở đây là phỏng đoán khá chắc (\"chắc là\"), không phải \"được phép\". Câu nói về tương lai gần, không phải việc đã xong."
    display_answer: Việc sửa máy chắc là mất khoảng hai tiếng.

  - key: de:exercise:b2u03l2-listen-roboter-2040
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u03-roboter
    prompt:
      audio_asset_id: null
      fallback_text: Manche Fachleute glauben, dass Roboter bis zum Jahr 2040 viele einfache Arbeiten übernommen haben werden.
      options:
        - { id: r1, text: "Một số chuyên gia tin rằng đến năm 2040 rô-bốt sẽ đã đảm nhận nhiều công việc đơn giản.", lang: vi }
        - { id: r2, text: "Một số chuyên gia tin rằng từ năm 2040 rô-bốt mới bắt đầu làm những công việc đơn giản.", lang: vi }
        - { id: r3, text: "Một số chuyên gia tin rằng đến năm 2040 rô-bốt vẫn chưa thể làm những công việc đơn giản.", lang: vi }
        - { id: r4, text: "Một số chuyên gia tin rằng đến năm 2040 rô-bốt sẽ đảm nhận nhiều công việc phức tạp.", lang: vi }
    answer:
      correct_option_id: r1
    explanation:
      vi: "übernommen haben werden (Futur II trong câu phụ) = sẽ đã đảm nhận xong trước mốc bis zum Jahr 2040. einfache Arbeiten = công việc đơn giản, không phải phức tạp."
    display_answer: Một số chuyên gia tin rằng đến năm 2040 rô-bốt sẽ đã đảm nhận nhiều công việc đơn giản.

  - key: de:exercise:b2u03l2-mcq-futur2-form
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u03-g-futur-ii
    prompt:
      stem: "Câu nào đúng? (Đến thứ Sáu chúng tôi sẽ phân tích xong dữ liệu. – Futur II)"
      stem_lang: vi
      options:
        - { id: f1, text: "Bis Freitag werden wir die Daten ausgewertet haben.", lang: de }
        - { id: f2, text: "Bis Freitag werden wir die Daten ausgewertet sein.", lang: de }
        - { id: f3, text: "Bis Freitag werden wir die Daten auswerten haben.", lang: de }
        - { id: f4, text: "Bis Freitag haben wir die Daten ausgewertet werden.", lang: de }
    answer:
      correct_option_id: f1
    explanation:
      vi: "Futur II: werden (vị trí 2) + Partizip II (ausgewertet) + haben, vì auswerten có Perfekt với haben. Không dùng nguyên thể auswerten, và haben … werden là trật tự sai."
    display_answer: Bis Freitag werden wir die Daten ausgewertet haben.

  # ---------------- recall ----------------
  - key: de:exercise:b2u03l2-fill-futur2
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u03-g-futur-ii
    prompt:
      template: "Bis Ende des Jahres {{b1}} (werden) das Team die Studie {{b2}} (abschließen) {{b3}}. Bis dahin {{b4}} (werden) auch das neue Messgerät angekommen {{b5}}."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 13 }
        - { id: b3, width_hint: 5 }
        - { id: b4, width_hint: 5 }
        - { id: b5, width_hint: 4 }
    answer:
      blanks:
        b1: [wird]
        b2: [abgeschlossen]
        b3: [haben]
        b4: [wird]
        b5: [sein]
    known_wrong:
      - answer: werden
        feedback_vi: Chủ ngữ das Team và das Messgerät là số ít – wird.
        error_tag: verb_form
      - answer: geabschlossen
        feedback_vi: abschließen là động từ tách, ge- đứng giữa – abgeschlossen.
        error_tag: participle_form
      - answer: abschließen
        feedback_vi: Futur II cần Partizip II – abgeschlossen.
        error_tag: participle_form
    explanation:
      vi: "Futur II: wird + Partizip II + haben/sein. abschließen → hat abgeschlossen → abgeschlossen haben; ankommen → ist angekommen → angekommen sein."
    display_answer: "Bis Ende des Jahres wird das Team die Studie abgeschlossen haben. Bis dahin wird auch das neue Messgerät angekommen sein."

  - key: de:exercise:b2u03l2-fill-muss-duerfte-kann
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 3
    item: de:item:b2u03-g-modalverben-subjektiv
    prompt:
      template: "Im Labor brennt noch Licht. Frau Berg {{b1}} (müssen) noch da sein. Sie {{b2}} (dürfen, Vermutung) gerade an ihrem Bericht arbeiten. Aber Herr Krause {{b3}} (können) nicht im Labor sein, er ist doch im Urlaub."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 7 }
        - { id: b3, width_hint: 5 }
    answer:
      blanks:
        b1: [muss]
        b2: [dürfte]
        b3: [kann]
    known_wrong:
      - answer: darf
        feedback_vi: "Phỏng đoán dùng dạng Konjunktiv II dürfte (chắc là); darf là \"được phép\"."
        error_tag: konjunktiv_form
      - answer: musst
        feedback_vi: Chủ ngữ Frau Berg là ngôi thứ ba số ít – muss (không có đuôi).
        error_tag: verb_form
      - answer: könnt
        feedback_vi: Chủ ngữ Herr Krause là ngôi thứ ba số ít – kann.
        error_tag: verb_form
    explanation:
      vi: "muss = gần như chắc (đèn còn sáng); dürfte = khá chắc, là Konjunktiv II của dürfen; kann nicht = không thể nào (anh ấy đang nghỉ phép). Modal ngôi thứ ba số ít không có đuôi."
    display_answer: "Im Labor brennt noch Licht. Frau Berg muss noch da sein. Sie dürfte gerade an ihrem Bericht arbeiten. Aber Herr Krause kann nicht im Labor sein, er ist doch im Urlaub."

  - key: de:exercise:b2u03l2-tr-termin-vergessen
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u03-g-modalverben-subjektiv
    prompt:
      source_text: "Chắc chắn anh ấy đã quên cuộc hẹn. (dùng müssen)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Er muss den Termin vergessen haben.
        - Er muss die Verabredung vergessen haben.
        - Er muss das Treffen vergessen haben.
        - Den Termin muss er vergessen haben.
    known_wrong:
      - answer: Er muss den Termin vergessen.
        feedback_vi: "Câu này nghĩa là \"anh ấy phải quên cuộc hẹn\". Đoán về quá khứ cần Partizip II + haben: vergessen haben."
        error_tag: meaning
      - answer: Er muss den Termin vergessen sein.
        feedback_vi: vergessen có Perfekt với haben (hat vergessen) – vergessen haben.
        error_tag: aux_verb
      - answer: Er muss den Termin vergessen hat.
        feedback_vi: Sau modal, động từ ở cuối câu là nguyên thể – vergessen haben.
        error_tag: verb_form
    explanation:
      vi: "Phỏng đoán về quá khứ: muss + Partizip II + haben ở cuối câu. vergessen có Perfekt với haben nên là vergessen haben."
    display_answer: Er muss den Termin vergessen haben.

