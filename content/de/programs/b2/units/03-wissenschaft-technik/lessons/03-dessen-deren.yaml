    display_answer: Ich kenne eine Physikerin, deren Theorie später bestätigt wurde.

  - key: de:exercise:b2u03l3-tr-erfindung-bekannt
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u03-g-relativ-genitiv
    prompt:
      source_text: "Tôi biết một nhà khoa học nữ mà phát minh của bà ấy rất nổi tiếng."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Ich kenne eine Wissenschaftlerin, deren Erfindung sehr bekannt ist.
        - Ich kenne eine Wissenschaftlerin, deren Erfindung sehr berühmt ist.
        - Ich kenne eine Forscherin, deren Erfindung sehr bekannt ist.
        - Ich kenne eine Forscherin, deren Erfindung sehr berühmt ist.
    known_wrong:
      - answer: Ich kenne eine Wissenschaftlerin, dessen Erfindung sehr bekannt ist.
        feedback_vi: eine Wissenschaftlerin là giống cái → deren.
        error_tag: gender
      - answer: Ich kenne eine Wissenschaftlerin, deren die Erfindung sehr bekannt ist.
        feedback_vi: Sau deren không có mạo từ – deren Erfindung.
        error_tag: article
      - answer: Ich kenne eine Wissenschaftlerin, deren Erfindung ist sehr bekannt.
        feedback_vi: Trong mệnh đề quan hệ, động từ chia đứng cuối – … sehr bekannt ist.
        error_tag: verb_position
