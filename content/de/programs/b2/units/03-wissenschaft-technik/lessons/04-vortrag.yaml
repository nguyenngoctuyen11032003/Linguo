title:
  vi: Thuyết trình khoa học (Ein Kurzvortrag)
objectives:
  - vi: Thuyết trình khoảng 4 phút có cấu trúc rõ ràng – giới thiệu chủ đề, nêu các phương án, ví dụ ở Việt Nam, ưu nhược điểm, ý kiến riêng, kết luận (kiểu Goethe B2 Sprechen Teil 1).
  - vi: Dùng đúng các mẫu câu dẫn dắt (In meinem Vortrag geht es um …, Zunächst …, Im Anschluss daran …, Abschließend lässt sich sagen, …).
  - vi: Nghe một bài giảng ngắn và ghi lại ý chính.
