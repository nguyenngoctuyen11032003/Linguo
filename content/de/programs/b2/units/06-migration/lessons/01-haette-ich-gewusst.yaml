  - key: de:exercise:b2u06l1-mcq-selbst-wenn
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u01-g-auch-wenn
    prompt:
      stem: "Bạn muốn nói: \"Kể cả nếu hồi đó tôi biết trước mọi khó khăn thì tôi vẫn sẽ di cư.\" Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: s1a, text: "Selbst wenn ich alle Probleme vorher gekannt hätte, wäre ich trotzdem ausgewandert.", lang: de }
        - { id: s2b, text: "Selbst wenn ich alle Probleme vorher gekannt hätte, hätte ich trotzdem ausgewandert.", lang: de }
        - { id: s3c, text: "Selbst wenn ich alle Probleme vorher kannte, wäre ich trotzdem ausgewandert.", lang: de }
        - { id: s4d, text: "Selbst wenn ich alle Probleme vorher gekannt hätte, würde ich trotzdem ausgewandert.", lang: de }
    answer:
      correct_option_id: s1a
    explanation:
      vi: "selbst wenn (B2U01) + Konjunktiv II quá khứ: kết quả vẫn không đổi (trotzdem = vẫn). kennen → ich habe gekannt → gekannt hätte; auswandern → ich bin ausgewandert → wäre ausgewandert. Phương án 2 sai trợ động từ, phương án 3 dùng Präteritum kannte (không phải giả định), phương án 4 ghép würde với Partizip II – không có dạng này."
    display_answer: Selbst wenn ich alle Probleme vorher gekannt hätte, wäre ich trotzdem ausgewandert.
