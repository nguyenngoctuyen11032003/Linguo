  - key: de:exercise:b2u06l2-mcq-hoeflich-kritik
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u06-sachbearbeiter
    prompt:
      stem: "Bạn muốn nói lịch sự với cán bộ phụ trách rằng lẽ ra họ đã có thể báo sớm hơn cho bạn biết hồ sơ còn thiếu giấy tờ. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: k1a, text: "Sie hätten mich vielleicht früher informieren können.", lang: de }
        - { id: k2b, text: "Du hättest mich früher informieren können.", lang: de }
        - { id: k3c, text: "Sie haben mich nicht informiert, das ist eine Katastrophe!", lang: de }
        - { id: k4d, text: "Sie konnten mich früher informieren.", lang: de }
    answer:
      correct_option_id: k1a
    explanation:
      vi: "Sie hätten … informieren können là lời phê bình nhẹ nhàng; vielleicht làm câu mềm hơn. du không hợp với cán bộ; câu thứ ba quá gay gắt; Sie konnten là Präteritum (đã có thể – thông tin có thật), không phải lời trách."
    display_answer: Sie hätten mich vielleicht früher informieren können.
