title:
  vi: Như thể – Konjunktiv II của động từ khiếm khuyết ở quá khứ, als ob (Ich hätte mich früher anmelden sollen. Als ob …)
objectives:
  - vi: Phê bình hoặc nuối tiếc một cách lịch sự về thủ tục giấy tờ (Sie hätten mir das früher sagen können).
  - vi: Dùng hätte + nguyên thể + sollen/können/müssen để nói điều lẽ ra nên, có thể hoặc phải làm.
  - vi: So sánh không thật với als ob / als wenn / als + Konjunktiv II.
estimated_minutes: 22
skills: [grammar, vocabulary, speaking]
