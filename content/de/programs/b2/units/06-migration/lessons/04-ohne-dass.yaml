  - key: de:exercise:b2u06l4-mcq-ohne-zu
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b1u08-g-statt-ohne-zu
    prompt:
      stem: "Bạn muốn nói: \"Tôi đã thích nghi mà không từ bỏ bản sắc của mình.\" (cùng một chủ ngữ) Câu nào đúng?"
      stem_lang: vi
      options:
        - { id: z1a, text: "Ich habe mich angepasst, ohne meine Identität aufzugeben.", lang: de }
        - { id: z2b, text: "Ich habe mich angepasst, ohne dass meine Identität aufzugeben.", lang: de }
        - { id: z3c, text: "Ich habe mich angepasst, ohne dass ich aufgebe meine Identität.", lang: de }
        - { id: z4d, text: "Ich habe mich angepasst, ohne zu meine Identität aufgeben.", lang: de }
    answer:
      correct_option_id: z1a
