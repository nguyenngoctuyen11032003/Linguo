title:
  vi: Mà không… – ohne dass, anstatt dass (Ohne dass jemand geholfen hat)
objectives:
  - vi: Nghe hiểu lời kể, phỏng vấn ngắn của người di cư về ngôn ngữ, nỗi nhớ nhà và bản sắc.
  - vi: Kể trải nghiệm hội nhập của mình với ohne dass / (an)statt dass khi hai vế có chủ ngữ khác nhau.
  - vi: Phân biệt ohne dass với ohne … zu, anstatt dass với anstatt … zu.
