  - vi: Chia đúng đuôi của phân từ danh từ hoá sau der/die, ein/eine và khi không có mạo từ.
  - vi: Nhận biết các cách nói trung lập về giới (Bürgerinnen und Bürger, Studierende, Lehrer*innen) và sắc thái của từ ngữ về nguồn gốc.
