    item: de:item:b2u08-vorhersehbar
    prompt:
      stem: "Bạn viết review cho tạp chí sinh viên và muốn chê bộ phim một cách có lý lẽ. Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: r6a, text: "Leider ist die Handlung sehr vorhersehbar, sodass kaum Spannung entsteht.", lang: de }
        - { id: r2b, text: "Der Film ist echt Mist, ich hab mich total gelangweilt.", lang: de }
        - { id: r9c, text: "Der Film ist nicht so gut.", lang: de }
        - { id: r4d, text: "Der Film hat mir nicht gefallen, weil er mir nicht gefallen hat.", lang: de }
    answer:
      correct_option_id: r6a
    explanation:
      vi: "Câu đúng nêu cụ thể điểm yếu (Handlung vorhersehbar) và hậu quả (sodass kaum Spannung entsteht), ngữ vực trung tính. echt Mist, hab là khẩu ngữ; nicht so gut quá chung chung; câu cuối lặp lại, không có lý do."
    display_answer: Leider ist die Handlung sehr vorhersehbar, sodass kaum Spannung entsteht.
