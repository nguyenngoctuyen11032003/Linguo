  - vi: Dùng mệnh đề wer/was không có danh từ đứng trước, chọn đúng đại từ chỉ định der/den/dem, das/dem ở câu chính.
  - vi: Nói về sách và văn học với từ vựng cơ bản (der Roman, die Handlung, die Figur, der Erzähler …).
