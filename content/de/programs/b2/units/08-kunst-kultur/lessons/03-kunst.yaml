title:
  vi: Bảo tàng – tính từ đi với một cách (Dem Original ähnlich, sich der Sache bewusst)
objectives:
  - vi: Tả và bình về một tác phẩm nghệ thuật, một cuộc triển lãm.
  - vi: Dùng tính từ đi với Dativ (ähnlich, bekannt, dankbar …), với Genitiv (bewusst, sicher, würdig) và Akkusativ chỉ số đo (einen Meter hoch).
  - vi: Đọc hiểu một đoạn giới thiệu triển lãm.
