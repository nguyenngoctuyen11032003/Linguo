body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu tin về thiên tai hay tai nạn lớn, kể lại diễn biến, và hiểu cách cảnh báo, sơ tán và cứu hộ hoạt động.
  - type: explain
    text:
      vi: "Thiên tai: die Naturkatastrophe, das Erdbeben, das Hochwasser, der Waldbrand, die Lawine, der Vulkanausbruch, der Orkan, der Tsunami. Hậu quả: die Trümmer (luôn số nhiều), das Opfer, der Wiederaufbau (số ít). Ví dụ: Nach dem Erdbeben liegt die Stadt in Trümmern."
  - type: explain
    text:
      vi: "Cứu hộ: die Rettungskräfte (luôn số nhiều), die Hilfsorganisation, die Evakuierung, die Notunterkunft, der Katastrophenschutz, das Warnsystem, die Sirene. Ví dụ: Die Rettungskräfte haben die Menschen aus den Trümmern geborgen. Die Bevölkerung wurde per Sirene gewarnt."
  - type: explain
    text:
      vi: "Động từ: evakuieren, retten (cứu), bergen (birgt, barg, hat geborgen: cứu ra, thu hồi), einstürzen (ist eingestürzt), überleben, wüten (hoành hành), verschütten, abbrennen (ist abgebrannt). Tính từ: verheerend (tàn phá), glimpflich (nhẹ nhàng, không quá tệ), vermisst (mất tích). Ví dụ: Der Unfall ist glimpflich ausgegangen."
  - type: deep_explain
    text:
      vi: "Glimpflich thường đi với ausgehen hoặc davonkommen: Wir sind glimpflich davongekommen (chúng tôi may mắn thoát nạn nhẹ). Das Opfer dùng cho cả nạn nhân tử vong và người bị thương. Der Katastrophenschutz là hệ thống phòng chống thảm họa của nhà nước. Verschütten nghĩa là chôn vùi (bởi đất đá) hoặc làm đổ (nước): Er hat Wasser verschüttet."
  - type: example
    target: Die Naturkatastrophe hat Tausende obdachlos gemacht.
    target_lang: de
    translation:
      vi: Thảm họa thiên nhiên đã khiến hàng nghìn người mất nhà cửa.
    note:
      vi: die Naturkatastrophe = thảm họa thiên nhiên.
  - type: example
    target: Das Erdbeben erreichte die Stärke sieben.
    target_lang: de
    translation:
      vi: Trận động đất đạt cường độ bảy.
    note:
      vi: das Erdbeben = trận động đất.
  - type: example
    target: Nach dem Hochwasser begann der Wiederaufbau.
    target_lang: de
    translation:
      vi: Sau trận lũ, việc xây dựng lại bắt đầu.
    note:
      vi: das Hochwasser = lũ lụt, nước dâng cao.
  - type: example
    target: Im Sommer drohen Waldbrände.
    target_lang: de
    translation:
      vi: Mùa hè có nguy cơ cháy rừng.
    note:
      vi: der Waldbrand = cháy rừng.
  - type: common_mistake
    wrong: Das Haus hat eingestürzt.
    right: Das Haus ist eingestürzt.
    target_lang: de
    note:
      vi: Einstürzen dùng sein ở Perfekt.
  - type: common_mistake
    wrong: Die Rettungskraft hat viele Menschen gerettet.
    right: Die Rettungskräfte haben viele Menschen gerettet.
    target_lang: de
    note:
      vi: Rettungskräfte là số nhiều (một nhóm), chia động từ số nhiều.
  - type: summary
    points:
      - vi: die Naturkatastrophe, das Erdbeben, das Hochwasser, der Waldbrand, die Lawine, der Vulkanausbruch, der Orkan, der Tsunami, die Trümmer (Pl.).
      - vi: die Rettungskräfte (Pl.), die Hilfsorganisation, die Evakuierung, die Notunterkunft, der Katastrophenschutz, das Warnsystem, die Sirene, der Wiederaufbau.
      - vi: evakuieren, retten, bergen (barg), einstürzen (ist), überleben, wüten, verschütten, abbrennen; verheerend, glimpflich, vermisst.
