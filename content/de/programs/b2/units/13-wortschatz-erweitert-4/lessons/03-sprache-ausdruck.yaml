    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Viele Anglizismen sind inzwischen geläufig, obwohl sie ursprünglich Fremdwörter waren, und der Sprachwandel geht weiter.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Nhiều từ mượn tiếng Anh nay đã quen thuộc, dù ban đầu là từ ngoại lai, và sự thay đổi ngôn ngữ vẫn tiếp tục.
        - Nhiều từ gốc Anh giờ đã quen thuộc, mặc dù lúc đầu là từ nước ngoài, và sự biến đổi của ngôn ngữ vẫn tiếp diễn.
        - Hiện nay nhiều từ Anh hóa đã quen dùng, dù lúc đầu chúng là từ ngoại lai, và ngôn ngữ vẫn tiếp tục thay đổi.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Viele Anglizismen sind inzwischen geläufig, obwohl sie ursprünglich Fremdwörter waren, und der Sprachwandel geht weiter.\" nghĩa là: Nhiều từ mượn tiếng Anh nay đã quen thuộc, dù ban đầu là từ ngoại lai, và sự thay đổi ngôn ngữ vẫn tiếp tục. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Nhiều từ mượn tiếng Anh nay đã quen thuộc, dù ban đầu là từ ngoại lai, và sự thay đổi ngôn ngữ vẫn tiếp tục.
    item: de:item:b2w4-sprachwandel
