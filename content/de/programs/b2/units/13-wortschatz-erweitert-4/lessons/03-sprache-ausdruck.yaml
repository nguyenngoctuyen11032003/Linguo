  - vi: "Nói về ngôn ngữ như một chủ đề: cách diễn đạt, từ mượn, ngôn ngữ chuyên ngành."
  - vi: "Dùng các từ để đánh giá một cách diễn đạt: geläufig, veraltet, mehrdeutig, bildhaft."
  - vi: Dùng động từ umschreiben, formulieren để nói về cách viết và diễn đạt lại.
