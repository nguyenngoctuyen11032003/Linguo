body:
  - type: objective
    text:
      vi: Sau bài này, bạn bàn luận được về ngôn ngữ, từ vay mượn và cách diễn đạt, và đánh giá được tính tự nhiên và chính xác của một cách nói hoặc một văn bản.
  - type: explain
    text:
      vi: "Các loại ngôn ngữ: die Fachsprache (ngôn ngữ chuyên ngành), die Umgangssprache (ngôn ngữ đời thường, số ít), die Schriftsprache, der Sprachgebrauch (cách dùng ngôn ngữ, số ít), die Ausdrucksweise. Hiện tượng: der Sprachwandel, der Bedeutungswandel, die Wortschöpfung, das Fremdwort, der Anglizismus (số nhiều die Anglizismen)."
  - type: explain
    text:
      vi: "Từ để đánh giá cách diễn đạt: geläufig (quen thuộc), gebräuchlich (thông dụng), veraltet (lỗi thời), bildhaft (có hình ảnh), mehrdeutig và missverständlich (dễ hiểu nhầm). Danh từ: die Mehrdeutigkeit, die Zweideutigkeit, die Metapher (phép ẩn dụ), die Betonung, das Satzzeichen, der Zungenbrecher, die Eselsbrücke (mẹo ghi nhớ)."
  - type: explain
    text:
      vi: "Động từ: umschreiben (diễn đạt vòng, nói gián tiếp: umschreibt, umschrieb, hat umschrieben; không tách) và formulieren (diễn đạt thành lời). Ví dụ: Man kann das Wort umschreiben, wenn man es vergessen hat. Bitte formulieren Sie Ihre Frage klarer. Umschreiben tách có nghĩa viết lại: Ich schreibe den Text um."
  - type: deep_explain
    text:
      vi: "Umschreiben có hai nghĩa tùy tách hay không: umschreiben (không tách, trọng âm ở âm 2) là nói vòng, định nghĩa gián tiếp; umschreiben (tách, trọng âm ở um) là viết lại. Anglizismen (từ mượn tiếng Anh như Meeting, Update) rất phổ biến trong tiếng Đức; một số người thích dùng từ thuần Đức, ví dụ Besprechung thay cho Meeting. Die Eselsbrücke là mẹo nhớ giúp ghi nhớ một quy tắc."
  - type: example
    target: In der Fachsprache der Medizin gibt es viele lateinische Wörter.
    target_lang: de
    translation:
      vi: Trong ngôn ngữ chuyên ngành y học có nhiều từ Latinh.
    note:
      vi: die Fachsprache = ngôn ngữ chuyên ngành.
  - type: example
    target: In der Umgangssprache sagt man „kriegen“ statt „bekommen“.
    target_lang: de
    translation:
      vi: Trong ngôn ngữ đời thường người ta nói “kriegen” thay cho “bekommen”.
    note:
      vi: die Umgangssprache = ngôn ngữ đời thường.
  - type: example
    target: In der Schriftsprache gelten strengere Regeln.
    target_lang: de
    translation:
      vi: Ngôn ngữ viết có những quy tắc nghiêm hơn.
    note:
      vi: die Schriftsprache = ngôn ngữ viết.
  - type: example
    target: Im allgemeinen Sprachgebrauch ist das Wort selten.
    target_lang: de
    translation:
      vi: Trong cách dùng ngôn ngữ chung, từ này hiếm gặp.
    note:
      vi: der Sprachgebrauch = cách dùng ngôn ngữ.
  - type: common_mistake
    wrong: Das Wort ist veralten.
    right: Das Wort ist veraltet.
    target_lang: de
    note:
      vi: "Sau sein, tính từ là Partizip II: veraltet."
  - type: common_mistake
    wrong: Ich habe den Text umgeschrieben und die Idee umschreiben.
    right: Ich habe den Text umgeschrieben und die Idee umschrieben.
    target_lang: de
    note:
      vi: "Hai động từ khác nhau: umschreiben (tách, viết lại) → umgeschrieben; umschreiben (không tách, nói vòng) → umschrieben."
  - type: summary
    points:
      - vi: die Fachsprache, die Umgangssprache, die Schriftsprache, der Sprachgebrauch, die Ausdrucksweise, der Sprachwandel, der Bedeutungswandel, das Fremdwort, der Anglizismus.
      - vi: geläufig, gebräuchlich, veraltet, bildhaft, mehrdeutig, missverständlich; die Mehrdeutigkeit, die Zweideutigkeit, die Metapher.
      - vi: umschreiben (không tách) và umschreiben (tách), formulieren; die Betonung, das Satzzeichen, der Zungenbrecher, die Eselsbrücke, die Wortschöpfung.
