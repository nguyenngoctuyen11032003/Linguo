body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng thêm nhiều động từ trang trọng trong văn bản học thuật và báo chí, nhớ giới từ và cách đi kèm quan trọng.
  - type: explain
    text:
      vi: "Động từ nhận thức và đánh giá: schätzen (ước tính; quý trọng), absehen (dự đoán; von + Dativ: bỏ ý định), aufweisen (có, cho thấy), erweisen (sich als + Nom.: tỏ ra là), verfehlen (không đạt, trượt), bezwecken (nhằm mục đích), anrechnen (tính vào). Ví dụ: Die Maßnahme erweist sich als wirksam. Er hat sein Ziel verfehlt."
  - type: explain
    text:
      vi: "Động từ thay đổi và quan hệ: anhalten (kéo dài: hält an, hielt an, hat angehalten), nachlassen (giảm, yếu đi: lässt nach, ließ nach, hat nachgelassen), schwinden (giảm dần: schwindet, schwand, ist geschwunden), zunehmen, entziehen (rút khỏi: entzieht, entzog, hat entzogen), unterliegen (thua, chịu sự chi phối: + Dativ), zulassen (cho phép), erfolgen (diễn ra; ist erfolgt)."
  - type: explain
    text:
      vi: "Giới từ và cách: sich richten nach + Dativ (dựa theo), anvertrauen + Dativ + Akk (giao phó), hindern an + Dativ (ngăn cản việc gì), bewahren vor + Dativ (giữ khỏi). Ví dụ: Ich richte mich nach den Vorgaben. Er hat ihr das Geheimnis anvertraut. Nichts hat sie daran gehindert."
  - type: deep_explain
    text:
      vi: "Erfolgen thường dùng trong văn bản hành chính: Die Zahlung erfolgt per Überweisung. Ansetzen có nhiều nghĩa: bắt đầu (zum Sprung ansetzen), định (einen Termin ansetzen). Aufbauen nghĩa là xây dựng: ein Unternehmen aufbauen; sich auf etwas aufbauen là dựa trên. Handhaben là xử lý, dùng (Wie handhabt man das Gerät?)."
  - type: example
    target: Von einer Klage wurde abgesehen.
    target_lang: de
    translation:
      vi: Người ta đã bỏ ý định kiện.
    note:
      vi: absehen = dự đoán; bỏ qua (von + Dativ).
  - type: example
    target: Die Trockenheit hält schon Wochen an.
    target_lang: de
    translation:
      vi: Tình trạng khô hạn kéo dài đã nhiều tuần.
    note:
      vi: anhalten = dừng lại; kéo dài.
  - type: example
    target: Die Studienzeit wird angerechnet.
    target_lang: de
    translation:
      vi: Thời gian học được tính vào.
    note:
      vi: anrechnen = tính vào, ghi nhận.
  - type: example
    target: Die Sitzung wurde für Montag angesetzt.
    target_lang: de
    translation:
      vi: Phiên họp được ấn định vào thứ Hai.
    note:
      vi: ansetzen = bắt đầu; ấn định.
  - type: common_mistake
    wrong: Die Zahlung ist per Überweisung erfolgen.
    right: Die Zahlung erfolgt per Überweisung.
    target_lang: de
    note:
      vi: "Dùng động từ chia: erfolgt (không cần sein + Partizip trong câu chính hiện tại)."
  - type: common_mistake
    wrong: Die Maßnahme erweist sich wirksam.
    right: Die Maßnahme erweist sich als wirksam.
    target_lang: de
    note:
      vi: Sich erweisen đi với als + tính từ/danh từ.
  - type: summary
    points:
      - vi: schätzen, absehen (von + Dativ), aufweisen, erweisen (sich als), verfehlen, bezwecken, anrechnen, bewahren, handhaben.
      - vi: "anhalten, nachlassen, schwinden, entziehen, unterliegen (+ Dativ), zulassen, erfolgen, ansetzen, aufbauen: học cả ba dạng."
      - vi: sich richten nach + Dativ, anvertrauen + Dativ + Akk, hindern an + Dativ, bewahren vor + Dativ.
