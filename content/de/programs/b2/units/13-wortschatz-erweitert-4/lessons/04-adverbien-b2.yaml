    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w4-zugleich
    prompt:
      audio_asset_id: null
      fallback_text: Sie ist Ärztin und zugleich Autorin.
      options:
        - { id: pmp, text: Có thể chọn gọi súp hoặc salad., lang: vi }
        - { id: xee, text: Cô ấy luôn thân thiện., lang: vi }
        - { id: wbz, text: Cái này cùng lắm chỉ tốn mười euro., lang: vi }
        - { id: c4i, text: Bà là bác sĩ và đồng thời là tác giả., lang: vi }
    answer:
