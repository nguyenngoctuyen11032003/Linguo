body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng nhiều trạng từ trang trọng để diễn tả mức độ, giới hạn và quan hệ giữa các ý, giúp bài viết và bài nói tự nhiên và chính xác hơn.
  - type: explain
    text:
      vi: "Trạng từ chỉ mức độ: nahezu (gần như), annähernd (xấp xỉ), geradezu (thật sự là, gần như là), überwiegend (chủ yếu), ausschließlich (hoàn toàn chỉ), vornehmlich (chủ yếu), gewissermaßen (có thể nói là), sozusagen (có thể nói thế). Ví dụ: Nahezu alle Teilnehmer waren zufrieden. Das ist geradezu unmöglich."
  - type: explain
    text:
      vi: "Trạng từ giới hạn và phủ định: keineswegs (hoàn toàn không), allenfalls (cùng lắm), mitunter (đôi khi), zusehends (ngày càng rõ rệt). Ví dụ: Das ist keineswegs sicher. Es kommen allenfalls zehn Gäste. Mitunter ist das Wetter im April sehr launisch."
  - type: explain
    text:
      vi: "Trạng từ liên kết: hingegen (ngược lại), mithin (do đó, vì vậy), zugleich (đồng thời), insbesondere (đặc biệt là), ebenso (cũng như vậy), beispielsweise, wahlweise (tùy chọn), nachträglich (sau đó, bổ sung), flächendeckend (phủ rộng), unmittelbar (trực tiếp, ngay lập tức), stets (luôn luôn). Chúng thường đứng ở vị trí đầu hoặc giữa câu."
  - type: deep_explain
    text:
      vi: "Mithin thuộc văn phong rất trang trọng: Er ist mithin nicht zuständig. Hingegen đối lập hai phần: Die einen sparen, die anderen hingegen geben viel aus. Ausschließlich nhấn mạnh sự độc nhất: Das Angebot gilt ausschließlich für Neukunden. Stets khá trang trọng và văn viết; trong nói chuyện người ta hay dùng immer."
  - type: example
    target: Das kostet allenfalls zehn Euro.
    target_lang: de
    translation:
      vi: Cái này cùng lắm chỉ tốn mười euro.
    note:
      vi: allenfalls = cùng lắm, nhiều nhất là.
  - type: example
    target: Es kamen annähernd hundert Gäste.
    target_lang: de
    translation:
      vi: Gần một trăm khách đã đến.
    note:
      vi: annähernd = xấp xỉ, gần như.
  - type: example
    target: Das Angebot gilt ausschließlich für Studenten.
    target_lang: de
    translation:
      vi: Ưu đãi chỉ áp dụng riêng cho sinh viên.
    note:
      vi: ausschließlich = chỉ riêng, hoàn toàn chỉ.
  - type: example
    target: Man kann beispielsweise mit dem Rad fahren.
    target_lang: de
    translation:
      vi: Chẳng hạn người ta có thể đi xe đạp.
    note:
      vi: beispielsweise = chẳng hạn.
  - type: common_mistake
    wrong: Es kommen allenfalls zehn Gäste nicht.
    right: Es kommen allenfalls zehn Gäste.
    target_lang: de
    note:
      vi: Allenfalls đã mang nghĩa giới hạn (cùng lắm); không cần thêm nicht.
  - type: common_mistake
    wrong: Das ist keineswegs nicht sicher.
    right: Das ist keineswegs sicher.
    target_lang: de
    note:
      vi: Keineswegs đã là phủ định hoàn toàn; không thêm nicht.
  - type: summary
    points:
      - vi: nahezu, annähernd, geradezu, überwiegend, ausschließlich, vornehmlich, gewissermaßen, sozusagen, insbesondere.
      - vi: keineswegs, allenfalls, mitunter, zusehends, stets, unmittelbar, nachträglich, flächendeckend.
      - vi: "hingegen, mithin, zugleich, ebenso, beispielsweise, wahlweise: nối ý; vị trí đầu hoặc giữa câu, động từ chia ở vị trí thứ hai."
exercises:
