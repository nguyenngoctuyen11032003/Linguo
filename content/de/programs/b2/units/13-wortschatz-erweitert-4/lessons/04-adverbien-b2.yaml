      vi: "Câu có nghĩa \"Cái này cùng lắm chỉ tốn mười euro.\" nên cần allenfalls (allenfalls: cùng lắm, nhiều nhất là). ebenso = cũng như vậy; flächendeckend = phủ rộng khắp; ausschließlich = chỉ riêng, hoàn toàn chỉ không đúng nghĩa của câu."
    display_answer: allenfalls
  - key: de:exercise:b2w4l4-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: Nahezu alle Teilnehmer waren zufrieden, einige hingegen kritisierten, dass die Organisation mitunter chaotisch war.
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Nahezu alle Teilnehmer waren zufrieden, einige hingegen kritisierten, dass die Organisation mitunter chaotisch war.
        - Nahezu alle Teilnehmer waren zufrieden, einige dagegen kritisierten, dass die Organisation mitunter chaotisch war.
        - Fast alle Teilnehmer waren zufrieden, einige hingegen kritisierten, dass die Organisation mitunter chaotisch war.
    explanation:
      vi: "Gợi ý đáp án: Nahezu alle Teilnehmer waren zufrieden, einige hingegen kritisierten, dass die Organisation mitunter chaotisch war. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Nahezu alle Teilnehmer waren zufrieden, einige hingegen kritisierten, dass die Organisation mitunter chaotisch war.
    item: de:item:b2w4-hingegen
  - key: de:exercise:b2w4l4-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Das Internet ist zusehends unverzichtbar geworden, und der Ausbau soll flächendeckend, aber ausschließlich mit öffentlichen Mitteln erfolgen.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Internet ngày càng trở nên không thể thiếu và việc mở rộng cần phủ khắp, nhưng chỉ dùng nguồn công.
        - Internet ngày càng thiết yếu, và việc phát triển hạ tầng được dự kiến phủ rộng, nhưng chỉ bằng ngân sách công.
        - Mạng Internet dần trở nên không thể thiếu, và việc mở rộng phải phủ sóng rộng khắp, nhưng chỉ bằng nguồn lực nhà nước.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Das Internet ist zusehends unverzichtbar geworden, und der Ausbau soll flächendeckend, aber ausschließlich mit öffentlichen Mitteln erfolgen.\" nghĩa là: Internet ngày càng trở nên không thể thiếu và việc mở rộng cần phủ khắp, nhưng chỉ dùng nguồn công. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Internet ngày càng trở nên không thể thiếu và việc mở rộng cần phủ khắp, nhưng chỉ dùng nguồn công.
    item: de:item:b2w4-ausschliesslich
