title:
  vi: Trạng từ và từ biểu thị mức độ ở trình độ B2 (Adverbien und Gradpartikeln)
objectives:
  - vi: "Dùng các trạng từ biểu thị mức độ, thái độ và sự giới hạn: nahezu, geradezu, keineswegs, allenfalls."
  - vi: "Dùng trạng từ liên kết ý: hingegen, zudem, mithin, zugleich, insbesondere."
  - vi: Đặt trạng từ đúng vị trí trong câu và nhận biết sắc thái trang trọng.
