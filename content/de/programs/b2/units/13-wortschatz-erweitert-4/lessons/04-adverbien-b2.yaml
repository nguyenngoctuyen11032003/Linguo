    display_answer: Bà là bác sĩ và đồng thời là tác giả.
  - key: de:exercise:b2w4l4-mcq-vi-de-vornehmlich
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w4-vornehmlich
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "chủ yếu là"?
      stem_lang: vi
      options:
        - { id: e4h, text: unmittelbar, lang: de }
        - { id: mrm, text: nachträglich, lang: de }
        - { id: ltb, text: mithin, lang: de }
        - { id: xzc, text: vornehmlich, lang: de }
    answer:
      correct_option_id: xzc
