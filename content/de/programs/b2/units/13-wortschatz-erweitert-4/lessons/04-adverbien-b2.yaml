      stem_lang: vi
      options:
        - { id: jro, text: allenfalls, lang: de }
        - { id: p1e, text: flächendeckend, lang: de }
        - { id: byh, text: ebenso, lang: de }
        - { id: xyi, text: ausschließlich, lang: de }
    answer:
