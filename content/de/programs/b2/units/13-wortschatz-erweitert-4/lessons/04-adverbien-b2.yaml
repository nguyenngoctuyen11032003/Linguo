      vi: "vornehmlich nghĩa là \"chủ yếu là\". Ví dụ: Das Angebot richtet sich vornehmlich an Familien. (Ưu đãi chủ yếu dành cho các gia đình.)"
    display_answer: vornehmlich
  - key: de:exercise:b2w4l4-mcq-de-vi-mithin
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w4-mithin
    prompt:
      stem: "\"mithin\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: bo6, text: gần như, lang: vi }
        - { id: hem, text: "chủ yếu, phần lớn", lang: vi }
        - { id: pok, text: "chỉ riêng, hoàn toàn chỉ", lang: vi }
        - { id: o4e, text: "do đó, vì vậy (trang trọng)", lang: vi }
    answer:
      correct_option_id: o4e
    explanation:
      vi: "mithin nghĩa là \"do đó, vì vậy (trang trọng)\". Ví dụ: Er ist nicht zuständig, mithin kann er nicht entscheiden. (Ông ấy không có thẩm quyền, do đó không thể quyết định.)"
    display_answer: do đó, vì vậy (trang trọng)
