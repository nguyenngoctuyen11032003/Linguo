body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu được một bản tin về vụ án hay tội phạm, kể lại một sự việc đã xảy ra, và nêu ý kiến về phòng ngừa và hình phạt.
  - type: explain
    text:
      vi: "Các loại tội: der Einbruch (đột nhập), der Diebstahl (trộm cắp), der Betrug (lừa đảo, số ít), der Raub, der Überfall, die Körperverletzung, die Sachbeschädigung (phá hoại tài sản), die Straftat, die Kriminalität. Người liên quan: der Ermittler, der Täter, das Opfer. Cụm: eine Straftat begehen (phạm tội)."
  - type: explain
    text:
      vi: "Quy trình: die Fahndung (truy nã, truy tìm), die Festnahme, die Zeugenaussage, das Geständnis (lời thú tội), das Alibi, die Haftstrafe (án tù), die Bewährung (án treo), das Gefängnis. Phòng ngừa: die Prävention (số ít), die Videoüberwachung (số ít), der Notruf. Ví dụ: Er wurde zu zwei Jahren Haft auf Bewährung verurteilt."
  - type: explain
    text:
      vi: "Động từ bất quy tắc cần học: einbrechen (bricht ein, brach ein, ist eingebrochen), stehlen (stiehlt, stahl, hat gestohlen), betrügen (betrog, hat betrogen), überfallen (überfällt, überfiel, hat überfallen), gestehen (gestand, hat gestanden). Còn erpressen, anzeigen, fahnden (nach + Dativ), verhaften có chia đều. Tính từ: kriminell, vorbestraft."
  - type: deep_explain
    text:
      vi: "Einbrechen dùng sein ở Perfekt (ist eingebrochen), nhưng stehlen dùng haben (hat gestohlen). Betrug và Betrüger đều có nguồn từ betrügen. Die Bewährung nghĩa là án treo: Die Strafe wird zur Bewährung ausgesetzt. Das Alibi không phải là bằng chứng buộc tội mà là chứng cứ ngoại phạm. Cẩn thận phân biệt Diebstahl (lấy trộm không đối đầu) và Raub (dùng vũ lực)."
  - type: example
    target: In der Nachbarschaft gab es einen Einbruch.
    target_lang: de
    translation:
      vi: Trong khu phố có một vụ đột nhập.
    note:
      vi: der Einbruch = vụ đột nhập.
  - type: example
    target: Der Diebstahl wurde der Polizei gemeldet.
    target_lang: de
    translation:
      vi: Vụ trộm đã được báo cho cảnh sát.
    note:
      vi: der Diebstahl = vụ trộm cắp.
  - type: example
    target: Er wurde wegen Betrug angezeigt.
    target_lang: de
    translation:
      vi: Anh ta bị tố cáo vì lừa đảo.
    note:
      vi: der Betrug = sự lừa đảo.
  - type: example
    target: Der Raub geschah am helllichten Tag.
    target_lang: de
    translation:
      vi: Vụ cướp xảy ra giữa ban ngày.
    note:
      vi: der Raub = vụ cướp.
  - type: common_mistake
    wrong: Der Täter hat in das Haus eingebrochen.
    right: Der Täter ist in das Haus eingebrochen.
    target_lang: de
    note:
      vi: Einbrechen dùng sein ở Perfekt.
  - type: common_mistake
    wrong: Der Dieb hat die Uhr gestohlt.
    right: Der Dieb hat die Uhr gestohlen.
    target_lang: de
    note:
      vi: "Stehlen là động từ bất quy tắc: stiehlt, stahl, hat gestohlen."
  - type: summary
    points:
      - vi: der Einbruch, der Diebstahl, der Betrug, der Raub, der Überfall, die Körperverletzung, die Sachbeschädigung, die Straftat, die Kriminalität.
      - vi: die Fahndung, die Festnahme, der Ermittler, die Zeugenaussage, das Geständnis, das Alibi, die Haftstrafe, die Bewährung, das Gefängnis.
      - vi: einbrechen (ist), stehlen, betrügen, überfallen, gestehen, erpressen, anzeigen, fahnden, verhaften; kriminell, vorbestraft; die Prävention, die Videoüberwachung.
