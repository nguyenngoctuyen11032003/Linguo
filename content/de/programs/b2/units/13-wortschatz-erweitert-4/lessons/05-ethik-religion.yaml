        - Phẩm giá con người không thể bị xâm phạm, không được biện hộ cho bạo lực mà phải tố cáo những điều bất công.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Die Menschenwürde ist unantastbar, und man darf Gewalt nicht rechtfertigen, sondern muss Unrecht anprangern.\" nghĩa là: Phẩm giá con người là bất khả xâm phạm, và người ta không được biện minh cho bạo lực mà phải tố cáo bất công. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Phẩm giá con người là bất khả xâm phạm, và người ta không được biện minh cho bạo lực mà phải tố cáo bất công.
