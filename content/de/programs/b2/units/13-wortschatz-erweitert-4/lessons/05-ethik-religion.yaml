body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về giá trị đạo đức, quyền con người và tôn giáo một cách tôn trọng, nêu quan điểm và lập luận về các vấn đề đạo đức.
  - type: explain
    text:
      vi: "Danh từ chính: die Ethik, die Moral (đều số ít), die Wertvorstellung, die Weltanschauung (thế giới quan), die Religion, die Glaubensgemeinschaft (cộng đồng tín ngưỡng), das Dilemma (số nhiều Dilemmas hoặc Dilemmata), die Menschenwürde, die Menschenrechte (số nhiều), das Pflichtbewusstsein, die Gleichgültigkeit. Ví dụ: Die Menschenwürde ist unantastbar."
  - type: explain
    text:
      vi: "Động từ: zweifeln (nghi ngờ; an + Dativ), achten (tôn trọng; achten auf = chú ý đến), rechtfertigen (biện minh), anprangern (tố cáo công khai). Tính từ: moralisch, ethisch, religiös, gläubig, gleichgültig (thờ ơ), verwerflich (đáng lên án), unantastbar (bất khả xâm phạm). Ví dụ: Viele zweifeln an der Wirksamkeit."
  - type: explain
    text:
      vi: "Chú ý cách dùng: Ethik là ngành nghiên cứu về hành vi đúng, Moral là các chuẩn mực thực tế của một xã hội; Glaube(n) là niềm tin tôn giáo hoặc niềm tin nói chung. Cặp từ: Glaube ↔ Zweifel, Moral ↔ Unmoral. Dilemma dùng khi phải chọn giữa hai điều đều không tốt: Das ist ein moralisches Dilemma."
  - type: deep_explain
    text:
      vi: "Artikel 1 của Grundgesetz Đức mở đầu bằng câu Die Würde des Menschen ist unantastbar, và đây là một cách diễn đạt thường dùng trong bài luận về quyền con người. Weltanschauung là thế giới quan, không nhất thiết về tôn giáo (ví dụ chủ nghĩa nhân văn). Khi nói về tôn giáo, hãy dùng ngôn ngữ trung lập: Er ist gläubig và geht regelmäßig in die Kirche."
  - type: example
    target: Die Ethik der Medizin beschäftigt sich mit Leben und Tod.
    target_lang: de
    translation:
      vi: Đạo đức y học bàn về sự sống và cái chết.
    note:
      vi: die Ethik = đạo đức học, đạo đức.
  - type: example
    target: Er hat eine hohe Moral.
    target_lang: de
    translation:
      vi: Anh ấy có đạo đức cao.
    note:
      vi: die Moral = đạo đức, chuẩn mực đạo đức.
  - type: example
    target: Die Wertvorstellungen der Generationen unterscheiden sich.
    target_lang: de
    translation:
      vi: Quan niệm giá trị giữa các thế hệ khác nhau.
    note:
      vi: die Wertvorstellung = quan niệm giá trị.
  - type: example
    target: Seine Weltanschauung ist stark von der Philosophie geprägt.
    target_lang: de
    translation:
      vi: Thế giới quan của ông bị ảnh hưởng mạnh bởi triết học.
    note:
      vi: die Weltanschauung = thế giới quan.
  - type: common_mistake
    wrong: Ich zweifle auf seiner Ehrlichkeit.
    right: Ich zweifle an seiner Ehrlichkeit.
    target_lang: de
    note:
      vi: Zweifeln đi với an + Dativ.
  - type: common_mistake
    wrong: Man muss die Würde jedes Menschen achten auf.
    right: Man muss die Würde jedes Menschen achten.
    target_lang: de
    note:
      vi: Achten (tôn trọng) có tân ngữ Akkusativ, không có auf; achten auf là chú ý đến.
  - type: summary
    points:
      - vi: die Ethik, die Moral, die Wertvorstellung, die Weltanschauung, die Religion, die Glaubensgemeinschaft, das Dilemma.
      - vi: die Menschenwürde, die Menschenrechte (Pl.), das Pflichtbewusstsein, die Gleichgültigkeit; moralisch, ethisch, religiös, gläubig, gleichgültig, verwerflich, unantastbar.
      - vi: zweifeln (an + Dativ), achten, rechtfertigen, anprangern; Glaube ↔ Zweifel.
