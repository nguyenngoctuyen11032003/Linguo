        - Việc tăng thuế bị nhiều người tiêu dùng chỉ trích đã bị hoãn lại.
        - Việc tăng thuế mà nhiều người tiêu dùng phê phán đã bị hoãn lại.
        - Việc tăng thuế mà nhiều người tiêu dùng chỉ trích đã bị hoãn lại.
        - Việc tăng thuế bị nhiều người tiêu dùng chỉ trích đã được hoãn lại.
        - Đợt tăng thuế bị nhiều người tiêu dùng chỉ trích đã bị hoãn lại.
        - Đợt tăng thuế bị nhiều người tiêu dùng phê phán đã bị hoãn.
