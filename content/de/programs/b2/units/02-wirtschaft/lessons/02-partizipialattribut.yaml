      vi: "Đọc die … Steuererhöhung trước (việc tăng thuế), rồi phần giữa: von vielen Verbrauchern kritisiert = bị nhiều người tiêu dùng chỉ trích. wurde verschoben = đã bị hoãn lại (bị động Präteritum)."
    display_answer: Việc tăng thuế bị nhiều người tiêu dùng phê phán đã bị hoãn lại.
