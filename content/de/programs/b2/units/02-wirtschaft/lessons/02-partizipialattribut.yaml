  - key: de:exercise:b2u02l2-wb-relativsatz
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u02-g-relativsatz-partizip-umformung
    prompt:
      instruction: "Viết lại bằng mệnh đề quan hệ: \"Der stark gestiegene Umsatz überrascht alle.\" (Doanh thu đã tăng mạnh làm mọi người bất ngờ.)"
      tokens:
        - { id: r-ist, text: ist }
        - { id: r-alle, text: alle }
        - { id: r-komma1, text: "," }
        - { id: r-umsatz, text: Umsatz }
        - { id: r-gestiegen, text: gestiegen }
        - { id: r-der-klein, text: der }
        - { id: r-ueberrascht, text: überrascht }
        - { id: r-stark, text: stark }
        - { id: r-der-gross, text: Der }
        - { id: r-komma2, text: "," }
    answer:
      orders:
        - [r-der-gross, r-umsatz, r-komma1, r-der-klein, r-stark, r-gestiegen, r-ist, r-komma2, r-ueberrascht, r-alle]
        - [r-der-gross, r-umsatz, r-komma2, r-der-klein, r-stark, r-gestiegen, r-ist, r-komma1, r-ueberrascht, r-alle]
    explanation:
      vi: "Làm ngược 4 bước: danh từ der Umsatz đứng trước, thêm đại từ quan hệ der (chủ ngữ, giống đực); gestiegen (Partizip II của động từ đi với sein) → ist gestiegen, động từ chia ist đứng cuối mệnh đề. Mệnh đề chen giữa câu nên có dấu phẩy hai đầu."
    display_answer: Der Umsatz, der stark gestiegen ist, überrascht alle.

