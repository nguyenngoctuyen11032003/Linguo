title:
  vi: Mô tả biểu đồ – số liệu (Der Anteil ist um 5 % gestiegen.)
objectives:
  - vi: Mô tả và bình luận biểu đồ, bảng số liệu trong bài nói (Die Grafik zeigt …, Im Vergleich zu …, Auffällig ist, dass …).
  - vi: Dùng đúng um (mức thay đổi) và auf (giá trị mới), von … auf …, Prozent và Prozentpunkt.
  - vi: Nghe hiểu bản tin kinh tế ngắn có số liệu.
