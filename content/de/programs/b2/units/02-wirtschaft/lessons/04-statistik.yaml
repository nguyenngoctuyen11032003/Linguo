    display_answer: Im Vergleich zum Vorjahr ist der Anteil um drei Prozentpunkte gesunken.

  - key: de:exercise:b2u02l4-mcq-verdoppelt
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u02-sich-verdoppeln
    prompt:
      stem: "Bảng số liệu (giả định): số khách hàng năm 2020 là 4000, năm 2025 là 8000. Bạn trình bày bằng lời. Câu nào đúng cả nội dung lẫn ngữ pháp?"
      stem_lang: vi
      options:
        - { id: d3a, text: "Die Zahl der Kunden hat sich von 2020 bis 2025 verdoppelt.", lang: de }
        - { id: d7b, text: "Die Zahl der Kunden ist von 2020 bis 2025 um 8000 gestiegen.", lang: de }
        - { id: d1c, text: "Die Zahl der Kunden hat sich von 2020 bis 2025 halbiert.", lang: de }
        - { id: d5d, text: "Die Zahl der Kunden hat von 2020 bis 2025 um 4000 gestiegen.", lang: de }
    answer:
      correct_option_id: d3a
    explanation:
