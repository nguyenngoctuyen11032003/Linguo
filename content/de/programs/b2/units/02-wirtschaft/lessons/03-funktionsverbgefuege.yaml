title:
  vi: Ra quyết định – cụm động từ chức năng, giới từ Genitiv trang trọng (Eine Entscheidung treffen, aufgrund …)
objectives:
  - vi: Viết câu văn phong công sở – kinh tế với cụm danh từ – động từ cố định (Funktionsverbgefüge).
  - vi: Dùng đúng giới từ Genitiv trang trọng (aufgrund, angesichts, infolge, bezüglich …) với đuôi Genitiv.
  - vi: Nói về chiến lược doanh nghiệp, đầu tư, địa điểm, thương mại và chuỗi cung ứng.
