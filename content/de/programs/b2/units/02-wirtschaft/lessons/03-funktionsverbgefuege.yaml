  - key: de:exercise:b2u02l3-tr-kritik-ueben
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 4
    item: de:item:b2u02-massnahme
    prompt:
      source_text: Die Gewerkschaft übt scharfe Kritik an den Maßnahmen, die der Vorstand beschlossen hat.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Công đoàn chỉ trích gay gắt các biện pháp mà ban điều hành đã thông qua.
        - Công đoàn chỉ trích gay gắt những biện pháp mà ban điều hành đã thông qua.
        - Công đoàn phê phán gay gắt các biện pháp mà ban điều hành đã thông qua.
        - Công đoàn chỉ trích gay gắt các biện pháp do ban điều hành thông qua.
        - Công đoàn phê phán gay gắt các biện pháp do ban điều hành thông qua.
        - Công đoàn chỉ trích gay gắt các biện pháp mà ban giám đốc đã quyết định.
        - Công đoàn chỉ trích gay gắt các biện pháp mà ban lãnh đạo đã thông qua.
        - Công đoàn chỉ trích mạnh mẽ các biện pháp mà ban điều hành đã thông qua.
        - Công đoàn kịch liệt phê phán các biện pháp mà ban điều hành đã thông qua.
    rubric:
      diacritics: lenient
    known_wrong:
      - answer: Ban điều hành chỉ trích gay gắt các biện pháp của công đoàn.
        feedback_vi: "Chủ ngữ là die Gewerkschaft (công đoàn); der Vorstand là người đã thông qua các biện pháp."
        error_tag: meaning
    explanation:
      vi: "Kritik üben an + Dativ = chỉ trích, phê phán; scharf = gay gắt. Mệnh đề quan hệ die der Vorstand beschlossen hat: die là tân ngữ (các biện pháp), der Vorstand là chủ ngữ (ban điều hành đã thông qua)."
    display_answer: Công đoàn chỉ trích gay gắt các biện pháp mà ban điều hành đã thông qua.
