        - { id: u8b, text: "Urlaubsanträge haben bis zum 30. November einzureichen.", lang: de }
        - { id: u2c, text: "Urlaubsanträge lassen sich bis zum 30. November einreichen.", lang: de }
        - { id: u6d, text: "Urlaubsanträge sind bis zum 30. November zu einreichen.", lang: de }
