title:
  vi: Việc này giải quyết được – thay thế bị động (Das lässt sich lösen. Das ist zu klären.)
objectives:
  - vi: Diễn đạt khả năng và nghĩa vụ khách quan bằng các cấu trúc thay bị động trong văn bản kinh tế.
  - vi: Dùng sich lassen + nguyên thể (= có thể được), sein + zu (= phải / có thể được) và haben + zu (= phải).
  - vi: Đọc và nói về thị trường, cạnh tranh, doanh thu, lợi nhuận và thua lỗ.
