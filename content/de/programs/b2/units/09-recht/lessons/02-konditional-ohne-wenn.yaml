title:
  vi: Nếu quý vị có câu hỏi – điều kiện không có wenn (Sollten Sie Fragen haben, …)
objectives:
  - vi: Hiểu điều khoản trong hợp đồng và điều kiện bảo hiểm, nhận ra câu điều kiện không có wenn.
  - vi: Viết câu điều kiện trang trọng với động từ đứng đầu (Sollten Sie …, Liegt … vor, …) và câu chính bắt đầu bằng động từ hoặc so/dann.
  - vi: Dùng từ vựng về hợp đồng và bảo hiểm (der Vertrag, der Widerruf, die Haftung, die Versicherung, der Schaden).
