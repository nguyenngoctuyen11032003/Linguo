  - key: de:exercise:b2u09l4-mcq-aufbau
    type: mcq
    stage: application
    answer_lang: vi
    difficulty: 4
    item: de:item:b1u10-g-formeller-brief
    prompt:
      stem: "Thứ tự nào hợp lý nhất cho phần thân một thư khiếu nại trang trọng (sau dòng Betreff và lời chào)?"
      stem_lang: vi
      options:
        - { id: s2a, text: "Sự việc (đã mua gì, khi nào) → vấn đề → yêu cầu cụ thể + thời hạn → bước tiếp theo nếu không được giải quyết → lời chào cuối thư", lang: vi }
        - { id: s6b, text: "Đe doạ đưa ra toà → mô tả vấn đề → lời chào cuối thư", lang: vi }
        - { id: s4c, text: "Vấn đề → lời chào cuối thư → sự việc → yêu cầu (không cần thời hạn)", lang: vi }
        - { id: s8d, text: "Lời xin lỗi vì làm phiền → vấn đề → hỏi xem công ty có thể làm gì không", lang: vi }
    answer:
      correct_option_id: s2a
    explanation:
      vi: "Người nhận cần biết chuyện gì đã xảy ra, vấn đề là gì, bạn muốn gì và đến khi nào, rồi mới đến hậu quả nếu không giải quyết. Mở đầu bằng đe doạ thì quá gay gắt; thư không có yêu cầu và thời hạn thì quá rụt rè."
    display_answer: "Sự việc (đã mua gì, khi nào) → vấn đề → yêu cầu cụ thể + thời hạn → bước tiếp theo nếu không được giải quyết → lời chào cuối thư"
