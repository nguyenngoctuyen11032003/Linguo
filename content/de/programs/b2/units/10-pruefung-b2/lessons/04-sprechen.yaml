title:
  vi: Nói – thuyết trình và thảo luận B2 (Gespräche lenken)
objectives:
  - vi: Trình bày một chủ đề theo khung mở đầu – nội dung chính – kết luận với Redemittel thuyết trình, rồi đưa nhận xét và câu hỏi cho phần trình bày của bạn thi.
  - vi: Trong thảo luận, đồng ý, phản bác, câu giờ và ngắt lời một cách lịch sự.
  - vi: Điều phối lượt lời – nối tiếp ý, mời người khác nói, quay lại một điểm, tóm tắt – và giữ thời gian, không lạc đề.
