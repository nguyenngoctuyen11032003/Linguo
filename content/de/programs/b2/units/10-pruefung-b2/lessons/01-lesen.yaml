  - key: de:exercise:b2u10l1-mcq-meinungen-tempo30
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u07-befuerworten
    prompt:
      stem: "Kiểu bài ghép ý kiến. Chủ đề: Tempo 30 in der ganzen Stadt. Jonas: \"Endlich! Weniger Lärm, weniger Unfälle – ich verstehe nicht, warum man so lange gewartet hat.\" Petra: \"Schön und gut, aber wer täglich mit dem Auto zur Arbeit pendelt, verliert so jeden Tag eine Viertelstunde. Das kann doch niemand ernsthaft wollen.\" Aylin: \"Ich fahre ohnehin Rad. Wie schnell die Autos fahren, ist mir eigentlich egal, solange es sichere Radwege gibt.\" Wer befürwortet Tempo 30 ohne Einschränkung?"
      stem_lang: vi
      options:
        - { id: m1j, text: "Jonas", lang: de }
        - { id: m2p, text: "Petra", lang: de }
        - { id: m3a, text: "Aylin", lang: de }
        - { id: m4n, text: "niemand", lang: de }
    answer:
      correct_option_id: m1j
    explanation:
      vi: "Jonas mở đầu bằng Endlich! (cuối cùng cũng có) và chỉ nêu ưu điểm – ủng hộ hoàn toàn. Petra mở đầu bằng nhượng bộ Schön und gut, aber … rồi phản đối. Aylin không quan tâm đến tốc độ ô tô, chỉ đòi đường xe đạp an toàn."
    display_answer: Jonas

  - key: de:exercise:b2u10l1-mcq-satz-einfuegen
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b1u10-g-textverweise
    prompt:
      stem: "Kiểu bài điền câu vào văn bản. \"Immer mehr Städte richten Bibliotheken für Werkzeug ein. ___ Dadurch muss nicht jeder Haushalt eine eigene Bohrmaschine kaufen, die er vielleicht zweimal im Jahr benutzt.\" Welcher Satz passt in die Lücke?"
      stem_lang: vi
      options:
        - { id: e1d, text: "Dort kann man zum Beispiel eine Bohrmaschine für ein paar Tage ausleihen.", lang: de }
        - { id: e2t, text: "Werkzeug ist in den letzten Jahren deutlich teurer geworden.", lang: de }
        - { id: e3k, text: "Viele Menschen kaufen deshalb immer mehr Werkzeug.", lang: de }
        - { id: e4w, text: "Die erste Bibliothek dieser Art hatte nur wenige Besucher.", lang: de }
    answer:
      correct_option_id: e1d
    explanation:
      vi: "Dadurch (nhờ đó) phải trỏ về một việc giúp người ta khỏi phải mua máy khoan – đó là việc mượn máy khoan vài ngày. Giá đắt hơn hay số khách ít không dẫn tới kết quả \"không phải mua\"; câu \"mua ngày càng nhiều\" mâu thuẫn với câu sau."
    display_answer: "Dort kann man zum Beispiel eine Bohrmaschine für ein paar Tage ausleihen."
