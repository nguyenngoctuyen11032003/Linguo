level: b2
title:
  vi: Đọc hiểu – loại văn bản và ý định tác giả (Textsorten und Absichten)
objectives:
  - vi: Nhận diện bản tin (Bericht), bài bình luận (Kommentar) và phóng sự (Reportage) qua dấu hiệu ngôn ngữ như Präteritum, Konjunktiv I, từ đánh giá và thì hiện tại miêu tả.
  - vi: Nhận ra ý định của tác giả (phê phán, ủng hộ, mỉa mai), kể cả khi nó chỉ được nói ngầm.
  - vi: Làm quen năm dạng bài đọc B2 (ý kiến nhiều người, bài báo chọn đáp án, điền câu vào văn bản, ghép ý kiến, quy chế – hướng dẫn) với chiến lược tìm dấu hiệu.
estimated_minutes: 22
skills: [reading, vocabulary]
prerequisites: [de:lesson:b2u09-wiederholung]
