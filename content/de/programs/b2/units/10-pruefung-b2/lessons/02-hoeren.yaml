title:
  vi: Nghe hiểu – bài nói dài và thảo luận (Signalwörter beim Hören)
objectives:
  - vi: Nhận ra các câu tín hiệu cấu trúc bài nói (Ich möchte vorausschicken …, Entscheidend ist …, Was ich damit sagen will …, Im Gegensatz dazu …, Zusammenfassend …) và nghe kỹ ý đứng ngay sau chúng.
  - vi: Làm quen bốn dạng bài nghe B2 (đoạn ngắn nhiều chủ đề, phỏng vấn, thảo luận nhiều người – ai nói gì, bài giảng hoặc thuyết trình).
  - vi: Phân biệt người nói ủng hộ, phản đối hay hoài nghi trong một buổi tọa đàm và thuật lại ý kiến bằng lời gián tiếp.
