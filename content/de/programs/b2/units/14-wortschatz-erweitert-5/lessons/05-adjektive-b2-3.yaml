body:
  - type: objective
    text:
      vi: Sau bài này, bạn đánh giá được một lập luận, một kế hoạch hay một kết quả bằng nhiều tính từ chính xác hơn và hiểu sự khác nhau giữa các tính từ gần nghĩa.
  - type: explain
    text:
      vi: "Tính từ về mức độ tác động: einschneidend (sâu sắc), tiefgreifend (sâu rộng), drastisch (quyết liệt), folgenschwer (nghiêm trọng về hậu quả), spürbar (cảm nhận rõ), ausgeprägt (rõ rệt), ausschlaggebend (mang tính quyết định). Ví dụ: Die Reform hatte tiefgreifende Folgen. Die Preise sind spürbar gestiegen."
  - type: explain
    text:
      vi: "Tính từ về lập luận và độ tin cậy: plausibel (hợp lý), schlüssig (chặt chẽ), fundiert (có cơ sở), eindeutig (rõ ràng, không thể nhầm), zweifelhaft (đáng nghi), oberflächlich (hời hợt), lückenhaft (có chỗ thiếu), willkürlich (tùy tiện). Ví dụ: Seine Argumentation ist schlüssig. Die Quelle ist zweifelhaft."
  - type: explain
    text:
      vi: "Tính từ khác: rechtmäßig (hợp pháp), unentgeltlich (miễn phí), unverzichtbar, überschaubar (dễ quan sát, trong tầm kiểm soát), beständig (ổn định, bền), dauerhaft, gängig (thông dụng), geschickt, gewissenhaft, hilfreich, bemerkenswert, nachteilig. Ví dụ: Die Lage ist überschaubar. Das Angebot ist unentgeltlich."
  - type: deep_explain
    text:
      vi: "Eindeutig nhấn mạnh sự không mơ hồ: ein eindeutiges Ergebnis. Plausibel là nghe có lý; schlüssig còn mạnh hơn, nghĩa là lập luận chặt chẽ, không mâu thuẫn. Notgedrungen nghĩa là bị bắt buộc, chẳng đặng đừng: Er musste notgedrungen zustimmen. Oberflächlich đối lập với gründlich. Willkürlich nhấn mạnh sự không có căn cứ."
  - type: example
    target: Es gibt eine auffällige Übereinstimmung.
    target_lang: de
    translation:
      vi: Có một sự trùng hợp đáng chú ý.
    note:
      vi: auffällig = dễ thấy, đáng chú ý.
  - type: example
    target: Sie hat einen ausgeprägten Sinn für Humor.
    target_lang: de
    translation:
      vi: Cô ấy có khiếu hài hước rất rõ nét.
    note:
      vi: ausgeprägt = rõ rệt, phát triển mạnh.
  - type: example
    target: Das war der ausschlaggebende Grund.
    target_lang: de
    translation:
      vi: Đó là lý do mang tính quyết định.
    note:
      vi: ausschlaggebend = mang tính quyết định.
  - type: example
    target: Das Wetter ist nicht beständig.
    target_lang: de
    translation:
      vi: Thời tiết không ổn định.
    note:
      vi: beständig = ổn định, bền vững.
  - type: common_mistake
    wrong: Die Entscheidung war ausschlaggebende für den Erfolg.
    right: Die Entscheidung war ausschlaggebend für den Erfolg.
    target_lang: de
    note:
      vi: Sau sein, tính từ không đổi đuôi.
  - type: common_mistake
    wrong: Die Quelle ist zweifelhaft, ob sie stimmt.
    right: Es ist zweifelhaft, ob die Quelle stimmt.
    target_lang: de
    note:
      vi: Zweifelhaft đi với es ist … ob; hoặc nói Die Quelle ist zweifelhaft.
  - type: summary
    points:
      - vi: einschneidend, tiefgreifend, drastisch, folgenschwer, spürbar, ausgeprägt, ausschlaggebend, entscheidend, auffällig.
      - vi: plausibel, schlüssig, fundiert, eindeutig, zweifelhaft, oberflächlich, lückenhaft, willkürlich.
      - vi: rechtmäßig, unentgeltlich, unverzichtbar, überschaubar, beständig, dauerhaft, gängig, geschickt, gewissenhaft, hilfreich, bemerkenswert, nachteilig, notgedrungen.
