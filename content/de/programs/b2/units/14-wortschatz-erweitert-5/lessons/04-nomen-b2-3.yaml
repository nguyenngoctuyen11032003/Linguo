body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng thêm nhiều danh từ trừu tượng về thái độ, quan hệ và khả năng, kể cả các giới từ và cụm cố định thường gặp trong bài viết.
  - type: explain
    text:
      vi: "Quan hệ và thái độ: die Abhängigkeit (sự phụ thuộc; von + Dativ), die Auseinandersetzung (sự tranh luận, xung đột; mit + Dativ), die Bindung, die Initiative, die Mitverantwortung, das Vertrauen (số ít; in/auf + Akk), das Verständnis (số ít; für + Akk), die Fürsorge, die Selbstständigkeit, die Unabhängigkeit. Ví dụ: Sie hat die Initiative ergriffen."
  - type: explain
    text:
      vi: "Khả năng và điều kiện: die Eignung (sự phù hợp), die Dringlichkeit (tính cấp bách), die Einigung (sự thống nhất), die Erwartung, die Bevorzugung, die Entfaltung, die Aufmerksamkeit, die Sorgfalt, die Unterstützung, die Bemerkung, die Gewohnheit, der Nachfolger. Cụm: zu einer Einigung kommen, die Aufmerksamkeit auf etwas lenken."
  - type: explain
    text:
      vi: "Giống và số nhiều: hầu hết đuôi -ung, -heit, -keit là giống cái; Vertrauen và Verständnis là giống trung, chỉ số ít; der Nachfolger giống đực (fem. die Nachfolgerin). Số nhiều: die Auseinandersetzungen, die Bindungen, die Erwartungen, die Gewohnheiten; Sorgfalt, Fürsorge, Aufmerksamkeit chỉ số ít."
  - type: deep_explain
    text:
      vi: "Die Auseinandersetzung có hai nghĩa: sự tranh luận hay xung đột (eine politische Auseinandersetzung), và sự xem xét kỹ (die Auseinandersetzung mit einem Thema). Abhängigkeit thường đi với von: die Abhängigkeit von Energie. Das Verständnis còn nghĩa là sự thông cảm: Ich habe Verständnis für deine Situation. Cẩn thận với Eignung (sự phù hợp): Die Eignung für den Beruf wird geprüft."
  - type: example
    target: Die Abhängigkeit von Öl ist groß.
    target_lang: de
    translation:
      vi: Sự phụ thuộc vào dầu mỏ rất lớn.
    note:
      vi: die Abhängigkeit = sự phụ thuộc.
  - type: example
    target: Der Vorfall hat viel Aufmerksamkeit erregt.
    target_lang: de
    translation:
      vi: Vụ việc đã thu hút nhiều sự chú ý.
    note:
      vi: die Aufmerksamkeit = sự chú ý.
  - type: example
    target: Es kam zu einer heftigen Auseinandersetzung.
    target_lang: de
    translation:
      vi: Đã xảy ra một cuộc tranh cãi gay gắt.
    note:
      vi: die Auseinandersetzung = cuộc tranh luận; sự xem xét kỹ.
  - type: example
    target: Seine Bemerkung war nicht böse gemeint.
    target_lang: de
    translation:
      vi: Lời nhận xét của anh ấy không có ý xấu.
    note:
      vi: die Bemerkung = lời nhận xét.
  - type: common_mistake
    wrong: Das Vertrauen zu meine Kollegen ist groß.
    right: Das Vertrauen zu meinen Kollegen ist groß.
    target_lang: de
    note:
      vi: "Zu + Dativ số nhiều: meinen Kollegen."
  - type: common_mistake
    wrong: Ich habe Verständnis von deiner Situation.
    right: Ich habe Verständnis für deine Situation.
    target_lang: de
    note:
      vi: Verständnis đi với für + Akkusativ.
  - type: summary
    points:
      - vi: die Abhängigkeit (von), die Auseinandersetzung (mit), die Bindung, die Initiative, die Mitverantwortung, das Vertrauen, das Verständnis (für), die Fürsorge.
      - vi: die Eignung, die Dringlichkeit, die Einigung, die Erwartung, die Bevorzugung, die Entfaltung, die Aufmerksamkeit, die Sorgfalt, die Unterstützung.
      - vi: "die Bemerkung, die Gewohnheit, die Selbstständigkeit, die Unabhängigkeit, der Nachfolger; cụm: zu einer Einigung kommen, Initiative ergreifen."
