body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu bài báo về nghiên cứu y học và dịch bệnh, nêu ý kiến về thử nghiệm thuốc, hiến tạng và các vấn đề đạo đức y tế.
  - type: explain
    text:
      vi: "Nghiên cứu: die Gentechnik, die Stammzelle, das Placebo, die Wirksamkeit, die Zulassung (việc cấp phép lưu hành thuốc), die Studie. Bệnh: der Krebs (số ít), der Tumor, die Resistenz (sự kháng thuốc), das Antibiotikum (số nhiều Antibiotika), die Pandemie, die Epidemie, das Immunsystem, die Abwehrkräfte (số nhiều)."
  - type: explain
    text:
      vi: "Điều trị và đạo đức: die Organspende, die Transplantation, die Patientenverfügung (di chúc điều trị), die Sterbehilfe, die Vorsorge, die Lebensqualität. Động từ: erkranken (an + Dativ; ist erkrankt), sich infizieren (mit + Dativ), eindämmen (kiềm chế), transplantieren. Tính từ: tödlich, erblich, unheilbar, bösartig."
  - type: explain
    text:
      vi: "Cấu trúc điển hình: Er ist an Krebs erkrankt. Sie hat sich mit dem Virus infiziert. Die Pandemie konnte eingedämmt werden. Der Tumor ist bösartig. Ở Đức, vấn đề Organspende và Sterbehilfe là chủ đề đạo đức thường được tranh luận, và người dân có thể ghi Patientenverfügung."
  - type: deep_explain
    text:
      vi: Erkranken dùng sein ở Perfekt và đi với an + Dativ; còn krank werden gần nghĩa. Das Antibiotikum có số nhiều Antibiotika. Resistenz (die Resistenz gegen Antibiotika) là sự kháng thuốc, vấn đề lớn của y học hiện đại. Placebo là thuốc giả không có hoạt chất, dùng để so sánh trong thử nghiệm lâm sàng.
  - type: example
    target: Die Gentechnik bietet Chancen und Risiken.
    target_lang: de
    translation:
      vi: Công nghệ gen mang lại cơ hội và rủi ro.
    note:
      vi: die Gentechnik = công nghệ gen.
  - type: example
    target: Mit Stammzellen erforscht man neue Therapien.
    target_lang: de
    translation:
      vi: Người ta nghiên cứu liệu pháp mới bằng tế bào gốc.
    note:
      vi: die Stammzelle = tế bào gốc.
  - type: example
    target: Eine Gruppe bekam ein Placebo.
    target_lang: de
    translation:
      vi: Một nhóm nhận giả dược.
    note:
      vi: das Placebo = giả dược.
  - type: example
    target: Die Wirksamkeit des Medikaments wurde getestet.
    target_lang: de
    translation:
      vi: Hiệu quả của loại thuốc đã được thử nghiệm.
    note:
      vi: die Wirksamkeit = hiệu quả.
  - type: common_mistake
    wrong: Er hat an Krebs erkrankt.
    right: Er ist an Krebs erkrankt.
    target_lang: de
    note:
      vi: Erkranken dùng sein ở Perfekt.
  - type: common_mistake
    wrong: Die Bakterien sind resistent von Antibiotika.
    right: Die Bakterien sind resistent gegen Antibiotika.
    target_lang: de
    note:
      vi: Resistent đi với gegen + Akkusativ.
  - type: summary
    points:
      - vi: die Gentechnik, die Stammzelle, das Placebo, die Wirksamkeit, die Zulassung, der Krebs, der Tumor, die Resistenz, das Antibiotikum (Antibiotika).
      - vi: die Pandemie, die Epidemie, das Immunsystem, die Abwehrkräfte (Pl.), die Organspende, die Transplantation, die Patientenverfügung, die Sterbehilfe, die Vorsorge, die Lebensqualität.
      - vi: erkranken (ist erkrankt, an + Dativ), sich infizieren, eindämmen, transplantieren; tödlich, erblich, unheilbar, bösartig.
