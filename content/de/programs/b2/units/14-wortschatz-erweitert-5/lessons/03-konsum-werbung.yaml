body:
  - type: objective
    text:
      vi: Sau bài này, bạn phân tích và phê bình được một quảng cáo, nói về xu hướng tiêu dùng và mẹo của nhà bán hàng và biết cách bảo vệ mình khi mua sắm.
  - type: explain
    text:
      vi: "Quảng cáo: der Werbespot, die Werbebotschaft, der Werbeslogan, die Zielgruppe, die Marktforschung, die Schleichwerbung (quảng cáo trá hình), die Produktplatzierung, der Influencer. Động từ: werben (für + Akk: wirbt, warb, hat geworben), anlocken, verführen. Ví dụ: Die Firma wirbt mit einem bekannten Gesicht für ihr Produkt."
  - type: explain
    text:
      vi: "Hành vi tiêu dùng: der Kaufanreiz, die Verlockung, der Impulskauf, das Statussymbol, das Markenbewusstsein, der Trend, die Kundenbindung. Bẫy và tiết kiệm: die Mogelpackung (bao bì đánh lừa), die Abofalle (bẫy đăng ký thuê bao), der Preisnachlass, der Verbraucherschutz. Động từ: sich leisten (đủ khả năng mua), anhäufen (tích trữ)."
  - type: explain
    text:
      vi: "Tính từ: überteuert (quá đắt), kostspielig (tốn kém), verlockend (hấp dẫn), werbewirksam (hiệu quả quảng cáo). Ví dụ: Das Angebot klingt verlockend, ist aber überteuert. Muốn phê bình: Die Werbung wirkt manipulativ. Ich kann mir das nicht leisten."
  - type: deep_explain
    text:
      vi: "Schleichwerbung bị cấm trên truyền hình và truyền thông ở Đức; quảng cáo phải được đánh dấu rõ (Werbung). Sich leisten dùng với Dativ phản thân: Ich leiste mir ein neues Fahrrad. Eine Mogelpackung là bao bì lớn nhưng chứa ít hàng. Der Impulskauf là việc mua ngay lập tức không có kế hoạch, thường do die Verlockung."
  - type: example
    target: Der Werbespot läuft im Fernsehen.
    target_lang: de
    translation:
      vi: Đoạn quảng cáo chiếu trên tivi.
    note:
      vi: der Werbespot = đoạn quảng cáo (phim ngắn).
  - type: example
    target: Die Werbebotschaft ist klar und einfach.
    target_lang: de
    translation:
      vi: Thông điệp quảng cáo rõ ràng và đơn giản.
    note:
      vi: die Werbebotschaft = thông điệp quảng cáo.
  - type: example
    target: Der Werbeslogan bleibt im Gedächtnis.
    target_lang: de
    translation:
      vi: Khẩu hiệu quảng cáo in đậm trong trí nhớ.
    note:
      vi: der Werbeslogan = khẩu hiệu quảng cáo.
  - type: example
    target: Die Marktforschung zeigt, was Kunden wollen.
    target_lang: de
    translation:
      vi: Nghiên cứu thị trường cho thấy khách hàng muốn gì.
    note:
      vi: die Marktforschung = nghiên cứu thị trường.
  - type: common_mistake
    wrong: Die Firma wirbt für sein Produkt mit.
    right: Die Firma wirbt für ihr Produkt.
    target_lang: de
    note:
      vi: Werben cần giới từ für + Akk; không dùng mit ở đây, và dùng ihr (die Firma là giống cái).
  - type: common_mistake
    wrong: Ich leiste mich ein neues Auto.
    right: Ich leiste mir ein neues Auto.
    target_lang: de
    note:
      vi: "Sich leisten dùng đại từ phản thân ở Dativ: mir."
  - type: summary
    points:
      - vi: der Werbespot, die Werbebotschaft, der Werbeslogan, die Zielgruppe, die Marktforschung, die Schleichwerbung, die Produktplatzierung, der Influencer.
      - vi: der Kaufanreiz, die Verlockung, der Impulskauf, das Statussymbol, das Markenbewusstsein, der Trend, die Kundenbindung, die Mogelpackung, die Abofalle, der Verbraucherschutz.
      - vi: werben (für + Akk), anlocken, verführen, sich leisten (mir), anhäufen; überteuert, kostspielig, verlockend, werbewirksam.
