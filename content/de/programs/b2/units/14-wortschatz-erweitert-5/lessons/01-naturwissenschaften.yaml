        feedback_vi: Lichtgeschwindigkeit là giống cái, nên là die Lichtgeschwindigkeit.
        error_tag: article
      - answer: das Lichtgeschwindigkeit
        feedback_vi: Lichtgeschwindigkeit là giống cái, nên là die Lichtgeschwindigkeit.
        error_tag: article
    explanation:
      vi: "\"vận tốc ánh sáng\" trong tiếng Đức là die Lichtgeschwindigkeit (số nhiều: không dùng). Ví dụ: Nichts ist schneller als die Lichtgeschwindigkeit."
    display_answer: die Lichtgeschwindigkeit
  - key: de:exercise:b2w5l1-tr-word-analysieren
