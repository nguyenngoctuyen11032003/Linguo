        - Die Forscher haben die Zellen unter dem Mikroskop beobachtet und festgestellt, dass sie sich rasch vermehren.
        - Unter dem Mikroskop haben die Forscher die Zellen beobachtet und festgestellt, dass sie sich schnell vermehren.
