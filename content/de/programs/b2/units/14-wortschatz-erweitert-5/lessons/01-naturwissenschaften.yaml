    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w5-gefrieren
    prompt:
      audio_asset_id: null
      fallback_text: Wasser gefriert bei null Grad.
      options:
        - { id: d61, text: Vi khuẩn sinh sôi nhanh khi trời ấm., lang: vi }
        - { id: rwf, text: Một nguyên tử cực kỳ nhỏ., lang: vi }
        - { id: n0p, text: Đó là một định luật vật lý., lang: vi }
        - { id: ayd, text: Nước đóng băng ở không độ., lang: vi }
    answer:
      correct_option_id: ayd
    explanation:
      vi: Câu bạn nghe có nghĩa "Nước đóng băng ở không độ.". Từ khoá là gefrieren (đóng băng); các câu còn lại nói về những từ khác trong bài.
    display_answer: Nước đóng băng ở không độ.
  - key: de:exercise:b2w5l1-mcq-vi-de-mikroskopisch
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w5-mikroskopisch
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "rất nhỏ, thuộc kính hiển vi"?
      stem_lang: vi
      options:
        - { id: nux, text: mikroskopisch, lang: de }
        - { id: hnc, text: chemisch, lang: de }
        - { id: bd9, text: physikalisch, lang: de }
        - { id: y13, text: genetisch, lang: de }
    answer:
      correct_option_id: nux
    explanation:
      vi: "mikroskopisch nghĩa là \"rất nhỏ, thuộc kính hiển vi\". Ví dụ: Die Kristalle sind mikroskopisch klein. (Các tinh thể nhỏ đến mức chỉ thấy bằng kính hiển vi.)"
    display_answer: mikroskopisch
  - key: de:exercise:b2w5l1-mcq-de-vi-element
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w5-element
    prompt:
      stem: "\"das Element\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: tg0, text: hóa chất, lang: vi }
        - { id: may, text: "bộ gen, vật chất di truyền", lang: vi }
        - { id: unp, text: nguyên tố; yếu tố, lang: vi }
        - { id: biq, text: công thức, lang: vi }
    answer:
      correct_option_id: unp
    explanation:
      vi: "das Element nghĩa là \"nguyên tố; yếu tố\". Ví dụ: Sauerstoff ist ein chemisches Element. (Ôxy là một nguyên tố hóa học.)"
    display_answer: nguyên tố; yếu tố
  - key: de:exercise:b2w5l1-mcq-artikel-molekuel
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2w5-molekuel
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Molekül\" (phân tử): ___ Molekül"
      stem_lang: vi
      options:
        - { id: vuf, text: der, lang: de }
        - { id: d1e, text: ein, lang: de }
        - { id: est, text: das, lang: de }
        - { id: dn3, text: die, lang: de }
    answer:
      correct_option_id: est
    explanation:
      vi: "Molekül là danh từ giống trung (das): das Molekül; số nhiều: die Moleküle. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
  - key: de:exercise:b2w5l1-tr-word-lichtgeschwindigkeit
