      vi: "Câu có nghĩa \"Một nguyên tử cực kỳ nhỏ.\" nên cần Atom (das Atom: nguyên tử). Molekülen = phân tử; Messwerte = giá trị đo; Organismus = cơ thể sống, sinh vật không đúng nghĩa của câu."
