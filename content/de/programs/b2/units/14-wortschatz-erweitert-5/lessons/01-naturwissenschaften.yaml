title:
  vi: "Khoa học tự nhiên: hóa, lý, sinh (Naturwissenschaften)"
objectives:
  - vi: Gọi tên các khái niệm cơ bản trong hóa học, vật lý và sinh học.
  - vi: "Đọc hiểu một đoạn văn khoa học phổ thông: Zelle, Gen, Strahlung, Reaktion."
  - vi: Dùng các động từ analysieren, sich vermehren, gefrieren, verbrennen và các tính từ chemisch, physikalisch, biologisch.
