body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu một bài báo khoa học phổ thông, nêu được kết quả thí nghiệm đơn giản và dùng đúng các thuật ngữ cơ bản của khoa học tự nhiên.
  - type: explain
    text:
      vi: "Hóa học và vật lý: das Atom, das Molekül, das Element, die Chemikalie, die Reaktion, die Formel, der Sauerstoff, der Kohlenstoff, die Strahlung, die Schwerkraft, die Lichtgeschwindigkeit. Phần lớn là danh từ giống đực/cái/trung theo từng từ; hãy học cả mạo từ: das Atom (Atome), das Molekül (Moleküle)."
  - type: explain
    text:
      vi: "Sinh học: die Zelle, das Gen, das Erbgut (bộ gen, số ít), die Evolution, der Organismus (số nhiều Organismen), das Virus (số nhiều Viren; cũng nói der Virus). Quan sát và đo lường: die Beobachtung, der Messwert, die Genauigkeit (số ít). Ví dụ: Die Messwerte stimmen mit der Theorie überein."
  - type: explain
    text:
      vi: "Động từ: analysieren, sich vermehren (sinh sôi), gefrieren (gefriert, gefror, ist gefroren), verbrennen (verbrennt, verbrannte, ist/hat verbrannt: cháy/đốt), auflösen. Tính từ: chemisch, physikalisch, biologisch, mikroskopisch, genetisch. Ví dụ: Wasser gefriert bei null Grad. Die Bakterien vermehren sich schnell."
  - type: deep_explain
    text:
      vi: "Verbrennen không tách và có hai cách dùng: không có tân ngữ nghĩa là cháy (ist verbrannt), có tân ngữ nghĩa là đốt (hat verbrannt). Das Virus (nhưng trong tiếng nói người ta hay nói der Virus) có số nhiều die Viren. Das Atom và das Molekül là giống trung. Genauigkeit và Messwert thường xuất hiện cùng nhau trong báo cáo thí nghiệm."
  - type: example
    target: Ein Atom ist extrem klein.
    target_lang: de
    translation:
      vi: Một nguyên tử cực kỳ nhỏ.
    note:
      vi: das Atom = nguyên tử.
  - type: example
    target: Wasser besteht aus Molekülen.
    target_lang: de
    translation:
      vi: Nước gồm các phân tử.
    note:
      vi: das Molekül = phân tử.
  - type: example
    target: Sauerstoff ist ein chemisches Element.
    target_lang: de
    translation:
      vi: Ôxy là một nguyên tố hóa học.
    note:
      vi: das Element = nguyên tố; yếu tố.
  - type: example
    target: Diese Chemikalien sind giftig.
    target_lang: de
    translation:
      vi: Những hóa chất này độc hại.
    note:
      vi: die Chemikalie = hóa chất.
  - type: common_mistake
    wrong: Wasser ist bei null Grad gefrieren.
    right: Wasser gefriert bei null Grad.
    target_lang: de
    note:
      vi: "Dùng động từ chia: gefriert; không dùng sein + nguyên thể."
  - type: common_mistake
    wrong: Die Viruse vermehren sich schnell.
    right: Die Viren vermehren sich schnell.
    target_lang: de
    note:
      vi: Số nhiều của das Virus là die Viren.
  - type: summary
    points:
      - vi: das Atom, das Molekül, das Element, die Chemikalie, die Reaktion, die Formel, der Sauerstoff, der Kohlenstoff, die Strahlung, die Schwerkraft.
      - vi: die Zelle, das Gen, das Erbgut, die Evolution, der Organismus (Organismen), das Virus (Viren), die Beobachtung, der Messwert, die Genauigkeit.
      - vi: analysieren, sich vermehren, gefrieren (ist gefroren), verbrennen, auflösen; chemisch, physikalisch, biologisch, mikroskopisch, genetisch.
exercises:
