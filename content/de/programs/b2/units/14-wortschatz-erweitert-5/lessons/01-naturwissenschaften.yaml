      vi: "Gợi ý đáp án: Die Forscher haben die Zellen unter dem Mikroskop beobachtet und festgestellt, dass sie sich schnell vermehren. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Die Forscher haben die Zellen unter dem Mikroskop beobachtet und festgestellt, dass sie sich schnell vermehren.
