    item: de:item:b2w5-atom
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Một nguyên tử cực kỳ nhỏ.\": Ein ___ ist extrem klein."
      stem_lang: vi
      options:
