title:
  vi: Bà ấy nói đã… – lời gián tiếp quá khứ, câu hỏi, yêu cầu (Sie habe nichts gewusst.)
objectives:
  - vi: Thuật lại phát ngôn về quá khứ bằng habe/sei + Partizip II (er habe gesagt, sie sei gekommen).
  - vi: Thuật lại câu hỏi (ob, W-Wort) và câu yêu cầu (solle, möge) ở văn viết.
  - vi: Nhận diện tin đồn và tin giả, phân biệt lời gốc với lời được thuật lại.
