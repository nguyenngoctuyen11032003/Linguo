    display_answer: Der Minister erklärte, er habe von dem Gerücht nichts gewusst.

  - key: de:exercise:b2u04l2-tr-ob-glaubwuerdig
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-glaubwuerdig
    prompt:
      source_text: "Cô ấy hỏi liệu bản tin đó có đáng tin không. (văn viết, dùng Konjunktiv I; bản tin: die Meldung)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Sie fragte, ob die Meldung glaubwürdig sei.
        - Sie fragte, ob diese Meldung glaubwürdig sei.
        - Sie hat gefragt, ob die Meldung glaubwürdig sei.
        - Sie hat gefragt, ob diese Meldung glaubwürdig sei.
        - Sie fragt, ob die Meldung glaubwürdig sei.
        - Sie fragt, ob diese Meldung glaubwürdig sei.
    known_wrong:
      - answer: Sie fragte, ob die Meldung sei glaubwürdig.
        feedback_vi: Câu ob là câu phụ, động từ đứng cuối – ob die Meldung glaubwürdig sei.
        error_tag: verb_position
      - answer: Sie fragte, wenn die Meldung glaubwürdig sei.
        feedback_vi: "\"liệu … có … không\" là ob, không phải wenn."
        error_tag: conjunction
      - answer: Sie fragte, ob die Meldung glaubwürdig ist.
        feedback_vi: Câu này dùng được khi nói chuyện, nhưng đề yêu cầu Konjunktiv I – sei.
        error_tag: konjunktiv_form
    explanation:
      vi: "Câu hỏi có/không → ob; động từ sein ở Konjunktiv I (ngôi die Meldung) là sei, đứng cuối câu phụ."
    display_answer: Sie fragte, ob die Meldung glaubwürdig sei.

  - key: de:exercise:b2u04l2-mcq-faktencheck-lesen
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-faktencheck
    prompt:
