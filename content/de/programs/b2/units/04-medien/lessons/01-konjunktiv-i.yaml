title:
  vi: Ông ấy nói rằng… – Konjunktiv I (Der Minister sagte, er sei zufrieden.)
objectives:
  - vi: Nhận ra và tạo dạng Konjunktiv I, nhất là ngôi thứ ba số ít (er sei, habe, werde, könne, müsse, gehe, komme).
  - vi: Thuật lại lời người khác theo cách báo chí (gián tiếp, giữ khoảng cách), đổi đại từ cho đúng người thuật.
  - vi: Biết khi nào phải thay Konjunktiv I bằng Konjunktiv II (sie hätten, sie kämen).
  - vi: Đọc hiểu câu tường thuật trong tin tức và họp báo.
