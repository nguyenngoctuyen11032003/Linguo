body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu một bản tin ngắn, nghe hiểu một đoạn phỏng vấn radio về tin giả, và viết được bản tóm tắt trung tính khoảng 120 từ có dùng lời gián tiếp. Bản tin và cuộc phỏng vấn trong bài đều là hư cấu.
  - type: explain
    text:
      vi: "Khi đọc tin tức, hãy đánh dấu ba loại câu: sự thật người viết khẳng định (Indikativ không nêu nguồn), lời của một nguồn (laut, zufolge, nach Angaben, Konjunktiv I) và tin chưa xác minh (soll, angeblich, unbestätigt). Câu hỏi richtig/falsch thường thử đúng sự khác biệt này."
  - type: explain
    text:
      vi: "Bản tóm tắt trung tính có ba phần: câu mở đầu nêu nguồn và chủ đề (In dem Artikel … geht es um …), phần chính thuật lại các ý quan trọng bằng lời gián tiếp (Die Stadt erklärt, das Wasser sei sauber), và câu kết nêu điều còn chưa rõ. Không thêm ý kiến riêng, không chép nguyên câu dài, và không dùng tiểu từ tình thái."
  - type: explain
    text:
      vi: "Thay vì lặp lại sagen, hãy đổi động từ dẫn: erklären, betonen, mitteilen, berichten, behaupten (khi nghi ngờ), bestreiten (khi phủ nhận). Mỗi động từ mang sắc thái riêng, nên chọn đúng thái độ của người nói gốc."
  - type: deep_explain
    text:
      vi: "Theo cấu trúc tại thời điểm soạn bài, phần Hören của Goethe-Zertifikat B2 có một phần nghe phỏng vấn radio dài và trả lời câu hỏi chọn đáp án; phần Schreiben gồm một bài ý kiến và một thư trang trọng. Định dạng, số câu và thời gian có thể thay đổi, nên hãy xem tài liệu mẫu chính thức của Goethe-Institut trước khi thi. Bản tóm tắt không phải một phần riêng của đề, nhưng là kỹ năng nền cho cả Lesen lẫn Schreiben: nó buộc bạn tách ý chính khỏi chi tiết và diễn đạt lại bằng lời của mình. Mẹo khi nghe phỏng vấn: câu hỏi thường dùng từ khác với lời người nói (Quelle ↔ woher die Information kommt), nên hãy nghe ý, đừng chỉ chờ một từ giống hệt."
  - type: example
    target: "In dem Artikel aus der Musterstädter Zeitung geht es um eine Falschmeldung über das städtische Schwimmbad. Im Internet wurde behauptet, das Bad werde wegen giftiger Stoffe im Wasser geschlossen. Die Stadtverwaltung erklärt jedoch, diese Behauptung sei falsch. Das Wasser sei regelmäßig überprüft worden und völlig sauber."
    target_lang: de
    translation:
      vi: "Bài báo của tờ báo Musterstadt viết về một tin giả liên quan đến bể bơi thành phố. Trên mạng có người khẳng định rằng bể bơi sẽ bị đóng cửa vì trong nước có chất độc. Tuy nhiên chính quyền thành phố tuyên bố rằng lời khẳng định này sai. Nước đã được kiểm tra thường xuyên và hoàn toàn sạch."
    note:
      vi: "Phần 1 của bản tóm tắt mẫu: câu mở đầu (geht es um), lời gián tiếp hiện tại (werde, sei) và quá khứ bị động (sei … überprüft worden)."
  - type: example
    target: "Nach Angaben der Stadt gab es in den letzten Tagen viele besorgte Anrufe. Eine Sprecherin betonte, man solle nur Informationen aus seriösen Quellen teilen. Wer die Meldung zuerst verbreitet hat, ist bisher unklar. Die Polizei ermittelt."
    target_lang: de
    translation:
      vi: "Theo thông tin của thành phố, mấy ngày qua có nhiều cuộc gọi lo lắng. Một nữ phát ngôn viên nhấn mạnh rằng chỉ nên chia sẻ thông tin từ các nguồn đáng tin. Đến nay vẫn chưa rõ ai là người đầu tiên phát tán tin này. Cảnh sát đang điều tra."
    note:
      vi: "Phần 2: nêu nguồn (nach Angaben + Genitiv), thuật lời khuyên bằng solle, kết bằng điều chưa rõ. Hai phần cộng lại khoảng 80 từ; bạn có thể thêm một hai câu để đạt 120 từ."
  - type: example
    target: Eine Leserin wollte wissen, ob das Schwimmbad am Wochenende geöffnet sei.
    target_lang: de
    translation:
      vi: Một nữ độc giả muốn biết liệu bể bơi có mở cửa vào cuối tuần không.
    note:
      vi: "Câu hỏi gián tiếp: ob + Konjunktiv I ở cuối câu."
  - type: common_mistake
    wrong: Die Stadt erklärt, das Wasser ist ja eigentlich sauber.
    right: Die Stadt erklärt, das Wasser sei sauber.
    target_lang: de
    note:
      vi: "Bản tóm tắt là văn viết trung tính: dùng Konjunktiv I và bỏ tiểu từ tình thái (ja, eigentlich)."
  - type: common_mistake
    wrong: Die Stadt sagte, das Wasser würde letzte Woche überprüft.
    right: Die Stadt sagte, das Wasser sei letzte Woche überprüft worden.
    target_lang: de
    note:
      vi: "Việc đã qua không dùng würde; dùng sei/habe + Partizip II (bị động: sei … überprüft worden)."
  - type: summary
    points:
      - vi: "Đọc tin: sự thật (Indikativ) – lời nguồn (laut, zufolge, Konjunktiv I) – tin chưa xác minh (soll, angeblich)."
      - vi: "Tóm tắt: In dem Artikel geht es um … → lời gián tiếp → điều còn chưa rõ."
      - vi: "Đổi động từ dẫn: erklären, betonen, mitteilen, behaupten, bestreiten."
      - vi: "Quá khứ trong lời thuật: habe/sei + Partizip II; yêu cầu: solle."
      - vi: "Không ý kiến riêng, không tiểu từ tình thái trong văn viết."
exercises:
  # ---------------- recognition: đọc ----------------
  - key: de:exercise:b2u04l5-mcq-bad-geschlossen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u04-falschmeldung
    prompt:
      stem: "Musterstadt. Eine Falschmeldung über das städtische Schwimmbad sorgte am Wochenende für Aufregung. Im Netz hieß es, das Bad werde wegen giftiger Stoffe im Wasser geschlossen. Laut Stadtverwaltung ist das falsch: Das Wasser werde regelmäßig überprüft und sei völlig sauber. Wer die Meldung zuerst verbreitet hat, ist unklar. Die Polizei ermittelt. — Richtig oder falsch? Das Schwimmbad wird geschlossen."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "\"das Bad werde … geschlossen\" chỉ là tin lan trên mạng (Konjunktiv I sau Im Netz hieß es). Thành phố nói điều đó sai (Laut Stadtverwaltung ist das falsch). Câu này sai."
    display_answer: Falsch

  - key: de:exercise:b2u04l5-mcq-wasser-sauber
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u04-g-quellenangabe
    prompt:
      stem: "Musterstadt. Eine Falschmeldung über das städtische Schwimmbad sorgte am Wochenende für Aufregung. Im Netz hieß es, das Bad werde wegen giftiger Stoffe im Wasser geschlossen. Laut Stadtverwaltung ist das falsch: Das Wasser werde regelmäßig überprüft und sei völlig sauber. Wer die Meldung zuerst verbreitet hat, ist unklar. Die Polizei ermittelt. — Richtig oder falsch? Nach Angaben der Stadt ist das Wasser sauber."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "Laut Stadtverwaltung … Das Wasser … sei völlig sauber = theo chính quyền thành phố, nước hoàn toàn sạch. nach Angaben der Stadt diễn đạt cùng nguồn tin. Câu này đúng."
    display_answer: Richtig

  - key: de:exercise:b2u04l5-mcq-wer-verbreitet
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u04-verbreiten
    prompt:
      stem: "Musterstadt. Eine Falschmeldung über das städtische Schwimmbad sorgte am Wochenende für Aufregung. Im Netz hieß es, das Bad werde wegen giftiger Stoffe im Wasser geschlossen. Laut Stadtverwaltung ist das falsch: Das Wasser werde regelmäßig überprüft und sei völlig sauber. Wer die Meldung zuerst verbreitet hat, ist unklar. Die Polizei ermittelt. — Richtig oder falsch? Man weiß, wer die Falschmeldung verbreitet hat."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf2
    explanation:
      vi: "Wer die Meldung zuerst verbreitet hat, ist unklar = chưa rõ ai phát tán tin đầu tiên. Câu này sai."
    display_answer: Falsch

  - key: de:exercise:b2u04l5-mcq-polizei
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2u04-ermitteln
    prompt:
      stem: "Musterstadt. Eine Falschmeldung über das städtische Schwimmbad sorgte am Wochenende für Aufregung. Im Netz hieß es, das Bad werde wegen giftiger Stoffe im Wasser geschlossen. Laut Stadtverwaltung ist das falsch: Das Wasser werde regelmäßig überprüft und sei völlig sauber. Wer die Meldung zuerst verbreitet hat, ist unklar. Die Polizei ermittelt. — Richtig oder falsch? Die Polizei untersucht den Fall."
      stem_lang: de
      options:
        - { id: rf1, text: "Richtig", lang: de }
        - { id: rf2, text: "Falsch", lang: de }
    answer:
      correct_option_id: rf1
    explanation:
      vi: "Die Polizei ermittelt = cảnh sát đang điều tra; untersuchen (xem xét, điều tra) cùng nghĩa ở đây. Câu này đúng."
    display_answer: Richtig

  # ---------------- recognition: nghe ----------------
  - key: de:exercise:b2u04l5-listen-quelle
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b1u07-quelle
    prompt:
      audio_asset_id: null
      fallback_text: Frau Berger, Sie leiten ein Faktencheck-Team. Wie erkennt man eine Falschmeldung? – Zuerst sollte man immer fragen, woher die Information kommt. Seriöse Medien nennen ihre Quellen.
      options:
        - { id: q2a, text: "Theo bà Berger, trước tiên nên hỏi thông tin đến từ đâu, vì báo chí nghiêm túc nêu nguồn của mình.", lang: vi }
        - { id: q6b, text: "Theo bà Berger, trước tiên nên hỏi tin đó đã được chia sẻ bao nhiêu lần.", lang: vi }
        - { id: q9c, text: "Theo bà Berger, báo chí nghiêm túc không bao giờ nêu nguồn.", lang: vi }
        - { id: q4d, text: "Bà Berger nói rằng không thể nhận ra tin giả.", lang: vi }
    answer:
      correct_option_id: q2a
    explanation:
      vi: "woher die Information kommt = thông tin đến từ đâu (tức là nguồn); Seriöse Medien nennen ihre Quellen = báo chí nghiêm túc nêu nguồn của mình."
    display_answer: Theo bà Berger, trước tiên nên hỏi thông tin đến từ đâu, vì báo chí nghiêm túc nêu nguồn của mình.

  - key: de:exercise:b2u04l5-listen-teilen
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 3
    item: de:item:b2u04-g-modalpartikeln-2
    prompt:
      audio_asset_id: null
      fallback_text: Viele Menschen teilen eine Meldung, ohne sie überhaupt gelesen zu haben. Das ist eigentlich das größte Problem. Man sollte sich ruhig ein paar Minuten Zeit nehmen.
      options:
        - { id: t3a, text: "Vấn đề lớn nhất là nhiều người chia sẻ tin mà không đọc; nên dành vài phút để đọc.", lang: vi }
        - { id: t7b, text: "Vấn đề lớn nhất là nhiều người đọc tin quá lâu.", lang: vi }
        - { id: t1c, text: "Mọi người nên chia sẻ tin thật nhanh, không cần đọc.", lang: vi }
        - { id: t5d, text: "Thật ra việc chia sẻ tin mà không đọc không phải là vấn đề.", lang: vi }
    answer:
      correct_option_id: t3a
    explanation:
      vi: "ohne sie gelesen zu haben = mà không đọc; eigentlich ở đây = thật ra, nhấn mạnh đó là vấn đề lớn nhất; ruhig = cứ (dành vài phút), lời khuyên thân thiện."
    display_answer: Vấn đề lớn nhất là nhiều người chia sẻ tin mà không đọc; nên dành vài phút để đọc.

  # ---------------- recall ----------------
  - key: de:exercise:b2u04l5-fill-zusammenfassung
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:a2u07-g-es-geht-um
    prompt:
      template: "In dem Artikel {{b1}} es um eine Falschmeldung. Die Stadt erklärt, das Wasser {{b2}} (sein, Konjunktiv I) sauber. Den Angaben der Polizei {{b3}} (z…) wird noch ermittelt."
      blanks:
        - { id: b1, width_hint: 5 }
        - { id: b2, width_hint: 4 }
        - { id: b3, width_hint: 8 }
    answer:
      blanks:
        b1: [geht]
        b2: [sei]
        b3: [zufolge]
    known_wrong:
      - answer: ist
        feedback_vi: ist (Indikativ) không sai ngữ pháp, nhưng bản tóm tắt thuật lời thành phố và đề yêu cầu Konjunktiv I – das Wasser sei sauber.
        error_tag: konjunktiv_form
      - answer: laut
        feedback_vi: laut đứng trước danh từ; danh từ đứng trước chỗ trống thì phải là zufolge.
        error_tag: word_order
      - answer: handelt
        feedback_vi: handeln đi với von (Der Artikel handelt von …); với um thì dùng es geht um.
        error_tag: preposition
    explanation:
      vi: "Cụm mở đầu tóm tắt: In dem Artikel geht es um + Akkusativ. Lời thuật của thành phố ở Konjunktiv I: sei. Den Angaben der Polizei (Dativ) đứng trước nên dùng zufolge."
    display_answer: "In dem Artikel geht es um eine Falschmeldung. Die Stadt erklärt, das Wasser sei sauber. Den Angaben der Polizei zufolge wird noch ermittelt."

  - key: de:exercise:b2u04l5-tr-laut-polizei
    type: translate
    stage: recall
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-g-quellenangabe
    prompt:
      source_text: "Theo cảnh sát, không ai bị thương. (dùng thì Präteritum bị động)"
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Laut Polizei wurde niemand verletzt.
        - Laut der Polizei wurde niemand verletzt.
        - Nach Angaben der Polizei wurde niemand verletzt.
        - Der Polizei zufolge wurde niemand verletzt.
        - Laut Polizei wurde keiner verletzt.
        - Niemand wurde laut Polizei verletzt.
        - Laut der Polizei wurde keiner verletzt.
        - Nach Angaben der Polizei wurde keiner verletzt.
        - Der Polizei zufolge wurde keiner verletzt.
    known_wrong:
      - answer: Zufolge der Polizei wurde niemand verletzt.
        feedback_vi: zufolge đứng trước danh từ (+ Genitiv) rất hiếm và nghe cứng; cách tự nhiên là đặt sau – der Polizei zufolge.
        error_tag: word_order
      - answer: Laut Polizei niemand wurde verletzt.
        feedback_vi: laut Polizei chiếm vị trí 1, động từ wurde phải ở vị trí 2 – Laut Polizei wurde niemand verletzt.
        error_tag: verb_position
    explanation:
      vi: "theo cảnh sát = laut (der) Polizei, nach Angaben der Polizei hoặc der Polizei zufolge. Bị động Präteritum: wurde … verletzt; cụm nêu nguồn ở vị trí 1 thì wurde đứng thứ 2."
    display_answer: Laut Polizei wurde niemand verletzt.

  # ---------------- application ----------------
  - key: de:exercise:b2u04l5-wb-stadt-erklaerte
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-g-indirekte-rede-vergangenheit
    prompt:
      instruction: "Sắp xếp thành câu: \"Thành phố tuyên bố rằng nước đã được kiểm tra.\""
      tokens:
        - { id: k-worden, text: worden }
        - { id: k-stadt, text: Stadt }
        - { id: k-das, text: das }
        - { id: k-sei, text: sei }
        - { id: k-die, text: Die }
        - { id: k-ueberprueft, text: überprüft }
        - { id: k-komma, text: "," }
        - { id: k-erklaerte, text: erklärte }
        - { id: k-wasser, text: Wasser }
    answer:
      orders:
        - [k-die, k-stadt, k-erklaerte, k-komma, k-das, k-wasser, k-sei, k-ueberprueft, k-worden]
    explanation:
      vi: "Không có dass: sei ở vị trí 2 của lời thuật. Bị động quá khứ ở Konjunktiv I: sei + Partizip II (überprüft) + worden ở cuối câu."
    display_answer: Die Stadt erklärte, das Wasser sei überprüft worden.

  - key: de:exercise:b2u04l5-wb-wer-verbreitet
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-verbreiten
    prompt:
      instruction: "Sắp xếp thành câu: \"Ai đã phát tán bản tin thì vẫn chưa rõ.\""
      tokens:
        - { id: v-ist, text: ist }
        - { id: v-meldung, text: Meldung }
        - { id: v-unklar, text: unklar }
        - { id: v-wer, text: Wer }
        - { id: v-hat, text: hat }
        - { id: v-komma, text: "," }
        - { id: v-die, text: die }
        - { id: v-verbreitet, text: verbreitet }
        - { id: v-noch, text: noch }
    answer:
      orders:
