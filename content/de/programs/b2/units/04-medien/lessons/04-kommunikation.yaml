title:
  vi: Giao tiếp hằng ngày – tiểu từ tình thái 2 (Das ist eigentlich ganz einfach.)
objectives:
  - vi: Nghe và hiểu sắc thái (mỉa mai, nhượng bộ, trấn an, nghi ngờ) trong hội thoại thật.
  - vi: Dùng tự nhiên các tiểu từ eigentlich, wohl, schon, ruhig, bloß/nur, etwa khi nói.
  - vi: Biết giữ tiểu từ cho văn nói, không đưa vào văn viết trang trọng.
  - vi: Nói về ngôn ngữ cơ thể, nét mặt và giọng điệu.
