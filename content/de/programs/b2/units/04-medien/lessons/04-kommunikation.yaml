      stem_lang: vi
      options:
        - { id: m3a, text: "Keine Sorge, das schaffst du schon!", lang: de }
        - { id: m8b, text: "Schaffst du das etwa nicht?", lang: de }
        - { id: m1c, text: "Schaffst du das eigentlich?", lang: de }
        - { id: m6d, text: "Mach das bloß nicht!", lang: de }
    answer:
      correct_option_id: m3a
    explanation:
      vi: "schon trấn an: rồi bạn sẽ làm được thôi. etwa (chẳng lẽ …?) nghe nghi ngờ; eigentlich trong câu hỏi nghe như hỏi tình cờ; bloß trong mệnh lệnh là lời cảnh báo (đừng có mà làm)."
    display_answer: Keine Sorge, das schaffst du schon!

  - key: de:exercise:b2u04l4-mcq-bewerbung
    type: mcq
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-g-modalpartikeln-2
    prompt:
      stem: "Bạn viết thư xin việc (văn viết trang trọng). Câu nào phù hợp nhất?"
      stem_lang: vi
      options:
        - { id: v5a, text: "Ich verfüge über mehrjährige Erfahrung im Verkauf.", lang: de }
        - { id: v2b, text: "Ich habe eigentlich schon viel Erfahrung im Verkauf.", lang: de }
        - { id: v9c, text: "Erfahrung im Verkauf habe ich ja halt schon.", lang: de }
        - { id: v4d, text: "Im Verkauf habe ich doch wohl genug Erfahrung.", lang: de }
    answer:
      correct_option_id: v5a
    explanation:
      vi: "Thư trang trọng không dùng tiểu từ tình thái. eigentlich, ja, halt, doch, wohl khiến câu nghe như nói chuyện, thiếu chắc chắn hoặc thậm chí hơi khó chịu (doch wohl)."
    display_answer: Ich verfüge über mehrjährige Erfahrung im Verkauf.

  - key: de:exercise:b2u04l4-wb-bloss-nicht
    type: word_bank
    stage: application
    answer_lang: de
    difficulty: 4
    item: de:item:b2u04-g-modalpartikeln-2
    prompt:
      instruction: "Sắp xếp thành câu cảnh báo (nói với bạn): \"Đừng có mà làm thế lần nữa đấy!\""
      tokens:
        - { id: b-nicht, text: nicht }
        - { id: b-einmal, text: einmal }
        - { id: b-mach, text: Mach }
