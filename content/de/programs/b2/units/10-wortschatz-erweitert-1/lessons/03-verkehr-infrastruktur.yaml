body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu và thảo luận về các chính sách giao thông và hạ tầng, nêu ưu nhược điểm của các phương án khác nhau.
  - type: explain
    text:
      vi: "Hạ tầng: die Infrastruktur, das Straßennetz, das Schienennetz, der Ausbau (việc mở rộng), die Sperrung (việc phong tỏa), der Engpass (điểm nghẽn). Phân loại: der Nahverkehr (giao thông gần), der Fernverkehr (đường dài), der Güterverkehr (vận tải hàng), das Verkehrsaufkommen (lưu lượng giao thông)."
  - type: explain
    text:
      vi: "Chính sách: die Verkehrswende (chuyển đổi giao thông sang bền vững), das Tempolimit (giới hạn tốc độ), die Maut (phí đường), die Parkgebühr, die Pendlerpauschale (khoản khấu trừ thuế cho người đi làm xa). Phương tiện mới: das Elektroauto, das Hybridfahrzeug, die Ladesäule (trạm sạc), der Radschnellweg (đường xe đạp nhanh)."
  - type: explain
    text:
      vi: "Động từ: ausbauen (mở rộng), sperren (phong tỏa, cấm), subventionieren (trợ cấp). Tính từ: überlastet (quá tải), klimafreundlich. Cấu trúc điển hình trong thảo luận: Die Verkehrswende lässt sich nur umsetzen, wenn der Nahverkehr ausgebaut wird."
  - type: deep_explain
    text:
      vi: "Maut ở Đức hiện chủ yếu áp dụng cho xe tải trên Autobahn; đây là chủ đề tranh luận chính trị. Das Tempolimit trên Autobahn cũng là chủ đề thường được bàn: Befürworter nennen weniger Unfälle und geringeren Verbrauch, Gegner verweisen auf individuelle Freiheit. Khi viết bài luận, hãy dùng cặp từ dafür / dagegen."
  - type: example
    target: Die Infrastruktur in ländlichen Gebieten muss verbessert werden.
    target_lang: de
    translation:
      vi: Hạ tầng ở các vùng nông thôn cần được cải thiện.
    note:
      vi: die Infrastruktur = hạ tầng.
  - type: example
    target: Das Straßennetz ist in einem schlechten Zustand.
    target_lang: de
    translation:
      vi: Mạng lưới đường bộ trong tình trạng xấu.
    note:
      vi: das Straßennetz = mạng lưới đường bộ.
  - type: example
    target: Das Schienennetz wird seit Jahren modernisiert.
    target_lang: de
    translation:
      vi: Mạng lưới đường sắt được hiện đại hóa nhiều năm nay.
    note:
      vi: das Schienennetz = mạng lưới đường sắt.
  - type: example
    target: Der Nahverkehr in der Region ist gut ausgebaut.
    target_lang: de
    translation:
      vi: Giao thông công cộng trong vùng được phát triển tốt.
    note:
      vi: der Nahverkehr = giao thông công cộng cự ly gần.
  - type: common_mistake
    wrong: Die Straße wird für zwei Wochen sperren.
    right: Die Straße wird für zwei Wochen gesperrt.
    target_lang: de
    note:
      vi: "Bị động hiện tại: wird + Partizip II (gesperrt), không dùng nguyên thể."
  - type: common_mistake
    wrong: Der Ausbau von das Schienennetz kostet viel Geld.
    right: Der Ausbau des Schienennetzes kostet viel Geld.
    target_lang: de
    note:
      vi: Genitiv của das Schienennetz là des Schienennetzes.
  - type: summary
    points:
      - vi: die Infrastruktur, das Straßennetz, das Schienennetz, der Ausbau, die Sperrung, der Engpass, der Nahverkehr, der Fernverkehr, der Güterverkehr.
      - vi: die Verkehrswende, das Tempolimit, die Maut, die Parkgebühr, die Pendlerpauschale, das Verkehrsaufkommen.
      - vi: das Elektroauto, das Hybridfahrzeug, die Ladesäule, der Radschnellweg; ausbauen, sperren, subventionieren; überlastet, klimafreundlich.
