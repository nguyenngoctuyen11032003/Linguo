        - { id: q8x, text: die, lang: de }
        - { id: did, text: das, lang: de }
        - { id: e5y, text: ein, lang: de }
    answer:
      correct_option_id: did
    explanation:
      vi: "Ferienhaus là danh từ giống trung (das): das Ferienhaus; số nhiều: die Ferienhäuser. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
    display_answer: das
