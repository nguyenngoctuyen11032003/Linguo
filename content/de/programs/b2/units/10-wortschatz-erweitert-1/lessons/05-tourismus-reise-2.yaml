body:
  - type: objective
    text:
      vi: Sau bài này, bạn lập kế hoạch và bàn luận về một chuyến đi, xử lý các thủ tục đặt chỗ, đổi vé, hải quan và hiểu các cảnh báo du lịch.
  - type: explain
    text:
      vi: "Chuyến đi trọn gói: die Pauschalreise, der Reiseveranstalter, die Kreuzfahrt, das Ferienhaus, der Reiseleiter, das Fremdenverkehrsamt (văn phòng du lịch), das Flugticket. Mùa: die Hauptsaison, die Nebensaison. Chúng đều giống cái, trừ der Reiseleiter; mùa du lịch dùng in der Hauptsaison."
  - type: explain
    text:
      vi: "Thủ tục: der Reisepass (số nhiều die Reisepässe), der Zoll (hải quan, số ít), die Zollkontrolle, das Handgepäck, das Übergepäck, die Umbuchung, die Reiserücktrittsversicherung, die Reisewarnung (cảnh báo du lịch của chính phủ). Đọc kỹ điều khoản trước khi mua bảo hiểm du lịch."
  - type: explain
    text:
      vi: "Động từ: einchecken (làm thủ tục lên máy bay hoặc nhận phòng: checkt ein), umbuchen, verreisen (đi xa, đi du lịch: ist verreist). Tính từ: ausgebucht (kín chỗ), touristisch. Ví dụ: Das Hotel ist im Sommer ausgebucht. Wir sind für zwei Wochen verreist. Massentourismus (du lịch đại trà) là chủ đề tranh luận về môi trường."
  - type: deep_explain
    text:
      vi: "Verreisen không có tân ngữ và không cần giới từ: Wir verreisen im August. Muốn nói đi đâu thì dùng reisen nach: Wir reisen nach Italien. Der Reisebericht là bài tường thuật chuyến đi. Cẩn thận khi hỏi die Umbuchung: nhiều hãng thu phí đổi vé; hãy hỏi về Umbuchungsgebühr trước."
  - type: example
    target: Eine Pauschalreise ist oft günstiger als eine Einzelbuchung.
    target_lang: de
    translation:
      vi: Chuyến du lịch trọn gói thường rẻ hơn đặt riêng lẻ.
    note:
      vi: die Pauschalreise = chuyến du lịch trọn gói.
  - type: example
    target: Der Reiseveranstalter haftet für Mängel an der Unterkunft.
    target_lang: de
    translation:
      vi: Công ty tổ chức tour chịu trách nhiệm về lỗi của chỗ ở.
    note:
      vi: der Reiseveranstalter = công ty tổ chức tour.
  - type: example
    target: Ihr Reisepass muss noch sechs Monate gültig sein.
    target_lang: de
    translation:
      vi: Hộ chiếu của ông/bà phải còn hiệu lực thêm sáu tháng.
    note:
      vi: der Reisepass = hộ chiếu.
  - type: example
    target: Am Zoll muss man bestimmte Waren anmelden.
    target_lang: de
    translation:
      vi: Tại hải quan phải khai báo một số hàng hóa nhất định.
    note:
      vi: der Zoll = hải quan; thuế quan.
  - type: common_mistake
    wrong: Wir sind nach Spanien verreist.
    right: Wir sind nach Spanien gereist.
    target_lang: de
    note:
      vi: Verreisen không đi với đích đến; có đích đến thì dùng reisen nach.
  - type: common_mistake
    wrong: Ich habe meinen Flug umgebucht worden.
    right: Mein Flug ist umgebucht worden.
    target_lang: de
    note:
      vi: "Bị động Perfekt: ist umgebucht worden; chủ ngữ là Flug."
  - type: summary
    points:
      - vi: die Pauschalreise, der Reiseveranstalter, die Kreuzfahrt, das Ferienhaus, der Reiseleiter, das Fremdenverkehrsamt, das Flugticket.
      - vi: der Reisepass, der Zoll, die Zollkontrolle, das Handgepäck, das Übergepäck, die Umbuchung, die Reiserücktrittsversicherung, die Reisewarnung.
      - vi: die Hauptsaison, die Nebensaison, der Massentourismus; einchecken, umbuchen, verreisen; ausgebucht, touristisch.
