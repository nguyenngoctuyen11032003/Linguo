      options:
        - { id: oxd, text: Cô ấy đã viết một bài tường thuật chuyến đi cho tờ báo., lang: vi }
        - { id: bie, text: Bố mẹ tôi đi du ngoạn tàu biển ở Địa Trung Hải., lang: vi }
        - { id: roa, text: Tôi đã mua vé máy bay trên mạng., lang: vi }
