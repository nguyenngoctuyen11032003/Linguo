      vi: Câu bạn nghe có nghĩa "Cô ấy đã viết một bài tường thuật chuyến đi cho tờ báo.". Từ khoá là der Reisebericht (bài tường thuật chuyến đi); các câu còn lại nói về những từ khác trong bài.
    display_answer: Cô ấy đã viết một bài tường thuật chuyến đi cho tờ báo.
  - key: de:exercise:b2w1l5-mcq-vi-de-umbuchen
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w1-umbuchen
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "đổi đặt chỗ, đổi chuyến"?
      stem_lang: vi
      options:
        - { id: ss0, text: die Nebensaison, lang: de }
        - { id: x8x, text: umbuchen, lang: de }
        - { id: q0t, text: die Umbuchung, lang: de }
        - { id: izy, text: die Pauschalreise, lang: de }
    answer:
      correct_option_id: x8x
    explanation:
      vi: "umbuchen nghĩa là \"đổi đặt chỗ, đổi chuyến\". Ví dụ: Kann ich meinen Flug auf morgen umbuchen? (Tôi có thể đổi chuyến bay sang ngày mai không?)"
    display_answer: umbuchen
  - key: de:exercise:b2w1l5-mcq-de-vi-reiseleiter
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w1-reiseleiter
    prompt:
      stem: "\"der Reiseleiter\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: igw, text: hướng dẫn viên du lịch, lang: vi }
        - { id: gcc, text: du lịch đại trà, lang: vi }
        - { id: led, text: việc kiểm tra hải quan, lang: vi }
        - { id: jdp, text: thuộc du lịch, lang: vi }
    answer:
      correct_option_id: igw
    explanation:
      vi: "der Reiseleiter nghĩa là \"hướng dẫn viên du lịch\". Ví dụ: Der Reiseleiter erklärte uns die Geschichte der Stadt. (Hướng dẫn viên giải thích cho chúng tôi lịch sử thành phố.)"
    display_answer: hướng dẫn viên du lịch
  - key: de:exercise:b2w1l5-mcq-artikel-ferienhaus
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2w1-ferienhaus
