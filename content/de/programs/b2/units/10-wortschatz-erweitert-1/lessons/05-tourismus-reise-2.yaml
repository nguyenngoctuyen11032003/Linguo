title:
  vi: Du lịch, chuyến đi và thủ tục (Tourismus und Reisen)
objectives:
  - vi: Hiểu và dùng từ về tour trọn gói, thủ tục sân bay, hải quan và bảo hiểm du lịch.
  - vi: Nói về mùa du lịch và những vấn đề du lịch đại trà.
  - vi: Dùng các động từ einchecken, umbuchen, verreisen và các tính từ ausgebucht, touristisch.
