body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu bài báo và biểu đồ về nhân khẩu học và hệ thống lương hưu, và nêu được ý kiến về các giải pháp cho xã hội già hóa.
  - type: explain
    text:
      vi: "Nhân khẩu học: die Bevölkerung, der Bevölkerungsrückgang, die Geburtenrate, die Lebenserwartung, die Altersstruktur, die Überalterung, die Landflucht. Tính từ: demografisch (der demografische Wandel = sự thay đổi nhân khẩu), überaltert. Cụm: die Gesellschaft altert, die Bevölkerung schrumpft."
  - type: explain
    text:
      vi: "An sinh: das Rentensystem, der Generationenvertrag (hợp đồng thế hệ: thế hệ đang làm việc đóng góp cho lương hưu của thế hệ trước), die Altersvorsorge, die Pflegeversicherung, die Sozialhilfe, die Grundsicherung, der Mindestlohn (số nhiều die Mindestlöhne), die Sozialleistung, die Armutsgefährdung, die Erwerbstätigkeit."
  - type: explain
    text:
      vi: "Động từ: altern (già đi: altert, ist gealtert), schrumpfen (thu hẹp: ist geschrumpft), abwandern (di cư đi nơi khác: ist abgewandert), versorgen (chu cấp, chăm sóc), absichern (bảo đảm, đảm bảo an toàn tài chính). Ví dụ: Die Region schrumpft, weil junge Menschen abwandern. Die Rente soll die Älteren absichern."
  - type: deep_explain
    text:
      vi: "Der Generationenvertrag là nguyên tắc của lương hưu theo phương thức phân bổ (Umlageverfahren) ở Đức; khi dân số già đi, ít người đóng góp hơn cho nhiều người hưởng, nên vấn đề này được bàn nhiều. Altersvorsorge gồm ba trụ cột: lương hưu nhà nước, hưu trí của doanh nghiệp và tiết kiệm cá nhân. Armutsgefährdung (nguy cơ nghèo) được tính theo thu nhập so với mức trung vị."
  - type: example
    target: Die Bevölkerung Deutschlands wächst nur noch durch Zuwanderung.
    target_lang: de
    translation:
      vi: Dân số nước Đức chỉ còn tăng nhờ nhập cư.
    note:
      vi: die Bevölkerung = dân số, dân cư.
  - type: example
    target: Der Bevölkerungsrückgang betrifft vor allem den Osten.
    target_lang: de
    translation:
      vi: Việc giảm dân số chủ yếu ảnh hưởng đến miền Đông.
    note:
      vi: der Bevölkerungsrückgang = sự giảm dân số.
  - type: example
    target: Die Geburtenrate liegt unter dem europäischen Durchschnitt.
    target_lang: de
    translation:
      vi: Tỷ lệ sinh thấp hơn mức trung bình châu Âu.
    note:
      vi: die Geburtenrate = tỷ lệ sinh.
  - type: example
    target: Die Lebenserwartung ist in den letzten Jahrzehnten gestiegen.
    target_lang: de
    translation:
      vi: Tuổi thọ trung bình đã tăng trong những thập kỷ gần đây.
    note:
      vi: die Lebenserwartung = tuổi thọ trung bình.
  - type: common_mistake
    wrong: Die Bevölkerung ist geschrumpfen.
    right: Die Bevölkerung ist geschrumpft.
    target_lang: de
    note:
      vi: "Schrumpfen là động từ dùng sein ở Perfekt: ist geschrumpft."
  - type: common_mistake
    wrong: Die Gesellschaft hat gealtert.
    right: Die Gesellschaft ist gealtert.
    target_lang: de
    note:
      vi: "Altern (già đi) dùng sein ở Perfekt: ist gealtert."
  - type: summary
    points:
      - vi: die Bevölkerung, der Bevölkerungsrückgang, die Geburtenrate, die Lebenserwartung, die Altersstruktur, die Überalterung, die Landflucht.
      - vi: das Rentensystem, der Generationenvertrag, die Altersvorsorge, die Pflegeversicherung, die Sozialhilfe, die Grundsicherung, der Mindestlohn, die Sozialleistung.
      - vi: altern, schrumpfen, abwandern (đều dùng sein), versorgen, absichern; demografisch, überaltert; die Armutsgefährdung, die Erwerbstätigkeit.
exercises:
  - key: de:exercise:b2w1l6-listen-sozialleistung
    type: listen
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w1-sozialleistung
    prompt:
      audio_asset_id: null
      fallback_text: Zu den Sozialleistungen gehören Kindergeld und Wohngeld.
      options:
        - { id: z8z, text: Khoản bảo đảm thu nhập cơ bản đảm bảo mức sống tối thiểu., lang: vi }
        - { id: img, text: Các khoản phúc lợi xã hội gồm trợ cấp trẻ em và trợ cấp nhà ở., lang: vi }
        - { id: g6n, text: Mức lương tối thiểu được điều chỉnh định kỳ., lang: vi }
        - { id: jh0, text: Bảo hiểm chăm sóc dài hạn trả một phần chi phí chăm sóc., lang: vi }
    answer:
      correct_option_id: img
    explanation:
      vi: Câu bạn nghe có nghĩa "Các khoản phúc lợi xã hội gồm trợ cấp trẻ em và trợ cấp nhà ở.". Từ khoá là die Sozialleistung (khoản phúc lợi xã hội); các câu còn lại nói về những từ khác trong bài.
    display_answer: Các khoản phúc lợi xã hội gồm trợ cấp trẻ em và trợ cấp nhà ở.
  - key: de:exercise:b2w1l6-mcq-vi-de-abwandern
    type: mcq
    stage: recognition
    answer_lang: de
    difficulty: 1
    item: de:item:b2w1-abwandern
    prompt:
      stem: Từ nào trong tiếng Đức có nghĩa là "di cư đi nơi khác"?
      stem_lang: vi
      options:
        - { id: o5z, text: schrumpfen, lang: de }
        - { id: ags, text: versorgen, lang: de }
        - { id: f2h, text: absichern, lang: de }
        - { id: tsb, text: abwandern, lang: de }
    answer:
      correct_option_id: tsb
    explanation:
      vi: "abwandern nghĩa là \"di cư đi nơi khác\". Ví dụ: Viele Fachkräfte wandern ins Ausland ab. (Nhiều lao động lành nghề di cư ra nước ngoài.)"
    display_answer: abwandern
  - key: de:exercise:b2w1l6-mcq-de-vi-altersvorsorge
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:b2w1-altersvorsorge
    prompt:
      stem: "\"die Altersvorsorge\" có nghĩa là gì?"
      stem_lang: vi
      options:
        - { id: vwc, text: bảo hiểm chăm sóc dài hạn, lang: vi }
        - { id: e65, text: tình trạng bỏ nông thôn lên thành phố, lang: vi }
        - { id: d5x, text: "việc có việc làm, hoạt động lao động", lang: vi }
        - { id: g1f, text: việc chuẩn bị cho tuổi già, lang: vi }
    answer:
      correct_option_id: g1f
    explanation:
      vi: "die Altersvorsorge nghĩa là \"việc chuẩn bị cho tuổi già\". Ví dụ: Für die Altersvorsorge sollte man früh sparen. (Để chuẩn bị cho tuổi già nên tiết kiệm sớm.)"
    display_answer: việc chuẩn bị cho tuổi già
  - key: de:exercise:b2w1l6-mcq-artikel-landflucht
