  - key: de:exercise:b2w1l6-tr-satz-vi-de-1
    type: translate
    stage: application
    answer_lang: de
    difficulty: 4
    prompt:
      source_text: "Vì tỷ lệ sinh giảm và tuổi thọ tăng, dân số già đi và hợp đồng thế hệ chịu áp lực."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - Weil die Geburtenrate sinkt und die Lebenserwartung steigt, altert die Bevölkerung, und der Generationenvertrag gerät unter Druck.
        - Die Bevölkerung altert, weil die Geburtenrate sinkt und die Lebenserwartung steigt, und der Generationenvertrag gerät unter Druck.
        - Da die Geburtenrate sinkt und die Lebenserwartung steigt, altert die Bevölkerung, und der Generationenvertrag gerät unter Druck.
    explanation:
      vi: "Gợi ý đáp án: Weil die Geburtenrate sinkt und die Lebenserwartung steigt, altert die Bevölkerung, und der Generationenvertrag gerät unter Druck. Chú ý vị trí động từ (thứ hai trong câu kể), mạo từ đúng giống và viết hoa danh từ."
    display_answer: Weil die Geburtenrate sinkt und die Lebenserwartung steigt, altert die Bevölkerung, und der Generationenvertrag gerät unter Druck.
