    stage: recognition
    answer_lang: de
    difficulty: 3
    item: de:item:b2w1-landflucht
    prompt:
      stem: "Chọn mạo từ xác định đúng của danh từ số ít \"Landflucht\" (tình trạng bỏ nông thôn lên thành phố): ___ Landflucht"
      stem_lang: vi
      options:
        - { id: jdj, text: ein, lang: de }
        - { id: b9j, text: der, lang: de }
        - { id: ae5, text: die, lang: de }
        - { id: utm, text: das, lang: de }
    answer:
      correct_option_id: ae5
    explanation:
      vi: "Landflucht là danh từ giống cái (die): die Landflucht (không dùng ở số nhiều). \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
