    item: de:item:b2w1-bevoelkerung
    prompt:
      stem: "Chọn từ điền vào chỗ trống để câu có nghĩa \"Dân số nước Đức chỉ còn tăng nhờ nhập cư.\": Die ___ Deutschlands wächst nur noch durch Zuwanderung."
      stem_lang: vi
