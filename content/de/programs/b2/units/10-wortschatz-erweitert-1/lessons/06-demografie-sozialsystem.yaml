  - key: de:exercise:b2w1l6-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: In ländlichen Regionen schrumpft die Bevölkerung, weil viele junge Menschen in die Städte abgewandert sind.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Ở các vùng nông thôn dân số giảm vì nhiều người trẻ đã chuyển lên thành phố.
        - Dân số ở các vùng nông thôn đang thu hẹp do nhiều người trẻ đã di cư lên các thành phố.
        - Vùng nông thôn mất dân vì nhiều người trẻ đã bỏ đi đến thành phố.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"In ländlichen Regionen schrumpft die Bevölkerung, weil viele junge Menschen in die Städte abgewandert sind.\" nghĩa là: Ở các vùng nông thôn dân số giảm vì nhiều người trẻ đã chuyển lên thành phố. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Ở các vùng nông thôn dân số giảm vì nhiều người trẻ đã chuyển lên thành phố.
