  - key: de:exercise:b2w1l4-tr-satz-de-vi-1
    type: translate
    stage: application
    answer_lang: vi
    difficulty: 3
    prompt:
      source_text: Um die Lebensmittelverschwendung zu verringern, sollte man Reste verarbeiten und Vorräte richtig konservieren.
      source_lang: de
      direction: target_to_vi
    answer:
      accepted:
        - Để giảm lãng phí thực phẩm, nên chế biến đồ thừa và bảo quản dự trữ đúng cách.
        - Muốn giảm việc lãng phí thức ăn thì nên tận dụng đồ thừa và bảo quản thực phẩm dự trữ cho đúng.
        - Để làm giảm lãng phí thực phẩm, người ta nên chế biến các phần ăn thừa và bảo quản đúng cách các thực phẩm tích trữ.
    rubric:
      diacritics: lenient
    explanation:
      vi: "Câu \"Um die Lebensmittelverschwendung zu verringern, sollte man Reste verarbeiten und Vorräte richtig konservieren.\" nghĩa là: Để giảm lãng phí thực phẩm, nên chế biến đồ thừa và bảo quản dự trữ đúng cách. Hãy dịch theo ý, không dịch từng chữ."
    display_answer: Để giảm lãng phí thực phẩm, nên chế biến đồ thừa và bảo quản dự trữ đúng cách.
    item: de:item:b2w1-lebensmittelverschwendung
