        - { id: gw1, text: das, lang: de }
        - { id: giy, text: der, lang: de }
        - { id: r7z, text: die, lang: de }
    answer:
      correct_option_id: gw1
    explanation:
      vi: "Tierwohl là danh từ giống trung (das): das Tierwohl (không dùng ở số nhiều). \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
