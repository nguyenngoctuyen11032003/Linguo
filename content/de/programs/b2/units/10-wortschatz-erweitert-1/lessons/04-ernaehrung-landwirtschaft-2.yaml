body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về nông nghiệp, chất lượng và nguồn gốc thực phẩm, nêu quan điểm về chăn nuôi và tiêu dùng có trách nhiệm.
  - type: explain
    text:
      vi: "Nông nghiệp: der Anbau (trồng trọt), die Ernte, das Saatgut, der Dünger, das Pflanzenschutzmittel, der Ökolandbau (canh tác hữu cơ), die Viehzucht (chăn nuôi), die Massentierhaltung (chăn nuôi công nghiệp). Tính từ: konventionell (truyền thống, không hữu cơ) và ökologisch (hữu cơ, sinh thái)."
  - type: explain
    text:
      vi: "Thực phẩm và nhãn: die Lebensmittelindustrie, das Gütesiegel (nhãn chất lượng), die Herkunftsangabe (nhãn nguồn gốc), das Mindesthaltbarkeitsdatum (hạn dùng tốt nhất trước ngày), die Lebensmittelverschwendung (lãng phí thực phẩm), das Tierwohl (phúc lợi động vật), der Fleischkonsum, die Ernährungsweise, das Nahrungsergänzungsmittel."
  - type: explain
    text:
      vi: "Động từ: anbauen (trồng trọt: baut an), düngen (bón phân), züchten (nuôi, lai tạo), verarbeiten (chế biến), konservieren (bảo quản). Ví dụ: Die Landwirte bauen vor allem Getreide an. Das Obst wird zu Marmelade verarbeitet. Das Gemüse wird durch Einfrieren konserviert."
  - type: deep_explain
    text:
      vi: "Mindesthaltbarkeitsdatum không phải ngày hết hạn: nhiều thực phẩm vẫn ăn được sau ngày này nếu được bảo quản tốt, khác với Verbrauchsdatum (hạn sử dụng, ví dụ với thịt sống). Tierwohl là chủ đề tranh luận lớn ở Đức: nhiều siêu thị có nhãn về điều kiện nuôi. Nahrungsergänzungsmittel thường dùng số nhiều: die Nahrungsergänzungsmittel."
  - type: example
    target: In der Lebensmittelindustrie arbeiten viele Menschen.
    target_lang: de
    translation:
      vi: Nhiều người làm việc trong ngành công nghiệp thực phẩm.
    note:
      vi: die Lebensmittelindustrie = ngành công nghiệp thực phẩm.
  - type: example
    target: Viele Menschen kritisieren die Massentierhaltung.
    target_lang: de
    translation:
      vi: Nhiều người chỉ trích việc chăn nuôi công nghiệp.
    note:
      vi: die Massentierhaltung = chăn nuôi quy mô công nghiệp.
  - type: example
    target: Der Ökolandbau verzichtet auf chemische Pflanzenschutzmittel.
    target_lang: de
    translation:
      vi: Canh tác hữu cơ không dùng thuốc bảo vệ thực vật hóa học.
    note:
      vi: der Ökolandbau = canh tác hữu cơ.
  - type: example
    target: Der Einsatz von Pflanzenschutzmitteln ist umstritten.
    target_lang: de
    translation:
      vi: Việc sử dụng thuốc bảo vệ thực vật gây tranh cãi.
    note:
      vi: das Pflanzenschutzmittel = thuốc bảo vệ thực vật.
  - type: common_mistake
    wrong: Das Mindesthaltbarkeitsdatum ist abgelaufen, also muss ich den Joghurt sofort wegwerfen.
    right: Das Mindesthaltbarkeitsdatum ist abgelaufen, aber der Joghurt ist oft noch gut.
    target_lang: de
    note:
      vi: Mindesthaltbarkeitsdatum chỉ là hạn tốt nhất, không có nghĩa thực phẩm lập tức nguy hiểm.
  - type: common_mistake
    wrong: Die Bauern züchten Weizen.
    right: Die Bauern bauen Weizen an.
    target_lang: de
    note:
      vi: Züchten dùng cho động vật hoặc giống cây; trồng lúa mì là anbauen.
  - type: summary
    points:
      - vi: der Anbau, die Ernte, das Saatgut, der Dünger, das Pflanzenschutzmittel, der Ökolandbau, die Viehzucht, die Massentierhaltung.
      - vi: die Lebensmittelindustrie, das Gütesiegel, die Herkunftsangabe, das Mindesthaltbarkeitsdatum, die Lebensmittelverschwendung, das Tierwohl.
      - vi: anbauen, düngen, züchten, verarbeiten, konservieren; konventionell, ökologisch; der Fleischkonsum, die Ernährungsweise.
