body:
  - type: objective
    text:
      vi: Sau bài này, bạn thảo luận được về những vấn đề của hệ thống y tế và hiểu thông tin cơ bản trên đơn thuốc và tờ hướng dẫn sử dụng thuốc.
  - type: explain
    text:
      vi: "Ở Đức có hai nhóm người bệnh: der Kassenpatient (bệnh nhân bảo hiểm công) và der Privatpatient (bảo hiểm tư). Các khoản người bệnh trả thêm gọi là die Zuzahlung. Từ bao quát là das Gesundheitswesen; tranh luận thời sự xoay quanh der Ärztemangel (thiếu bác sĩ) và der Pflegenotstand (khủng hoảng thiếu nhân viên điều dưỡng)."
  - type: explain
    text:
      vi: "Về thuốc: das Arzneimittel (dược phẩm), der Wirkstoff (hoạt chất), der Beipackzettel (tờ hướng dẫn), die Dosis (số nhiều Dosen), die Überdosis. Thuốc theo toa là rezeptpflichtig. Phòng bệnh gồm die Vorsorgeuntersuchung (khám định kỳ) và die Früherkennung (phát hiện sớm)."
  - type: explain
    text:
      vi: "Động từ: diagnostizieren (chẩn đoán), therapieren, verabreichen (cho dùng thuốc, tiêm), vorbeugen + Dativ (phòng ngừa: Man kann Krankheiten vorbeugen), heilen (chữa khỏi), lindern (làm dịu). Tính từ: akut (cấp tính, ngược với chronisch), ärztlich (thuộc bác sĩ), gesetzlich (theo luật định; gesetzlich versichert là có bảo hiểm công)."
  - type: deep_explain
    text:
      vi: "Verabreichen thuộc văn phong chuyên môn; trong lời nói thường dùng geben. Vorbeugen đi với Dativ chứ không phải Akkusativ: Impfungen beugen schweren Verläufen vor. Hãy so sánh heilen (chữa khỏi hẳn) với lindern (chỉ làm giảm): Das Medikament heilt die Krankheit nicht, es lindert nur die Schmerzen. Die Gesundheitsreform là cuộc cải cách chính sách y tế, hay xuất hiện trên báo."
  - type: example
    target: Das deutsche Gesundheitswesen steht vor großen Herausforderungen.
    target_lang: de
    translation:
      vi: Hệ thống y tế Đức đứng trước những thách thức lớn.
    note:
      vi: das Gesundheitswesen = hệ thống y tế.
  - type: example
    target: Die Gesundheitsreform soll die Kosten senken.
    target_lang: de
    translation:
      vi: Cuộc cải cách y tế nhằm giảm chi phí.
    note:
      vi: die Gesundheitsreform = cải cách y tế.
  - type: example
    target: Als Kassenpatient muss man oft länger auf einen Termin warten.
    target_lang: de
    translation:
      vi: Là bệnh nhân bảo hiểm công, người ta thường phải chờ lịch hẹn lâu hơn.
    note:
      vi: der Kassenpatient = bệnh nhân bảo hiểm công.
  - type: example
    target: Der Privatpatient bekommt die Rechnung direkt nach Hause.
    target_lang: de
    translation:
      vi: Bệnh nhân bảo hiểm tư nhận hóa đơn trực tiếp tại nhà.
    note:
      vi: der Privatpatient = bệnh nhân bảo hiểm tư.
  - type: common_mistake
    wrong: Das Medikament ist rezeptpflichtig, man darf es ohne Rezept kaufen.
    right: Das Medikament ist rezeptpflichtig, man darf es nicht ohne Rezept kaufen.
    target_lang: de
    note:
      vi: Rezeptpflichtig nghĩa là phải có đơn thuốc mới được mua.
  - type: common_mistake
    wrong: Impfungen beugen die Krankheit vor.
    right: Impfungen beugen der Krankheit vor.
    target_lang: de
    note:
      vi: "Vorbeugen đi với Dativ: der Krankheit vorbeugen."
  - type: summary
    points:
      - vi: das Gesundheitswesen, die Gesundheitsreform, der Kassenpatient, der Privatpatient, die Zuzahlung, der Ärztemangel, der Pflegenotstand.
      - vi: das Arzneimittel, der Wirkstoff, der Beipackzettel, die Dosis, die Überdosis, die Vorsorgeuntersuchung, die Früherkennung.
      - vi: diagnostizieren, therapieren, verabreichen, vorbeugen (+ Dativ), heilen, lindern; akut, ärztlich, rezeptpflichtig, gesetzlich.
