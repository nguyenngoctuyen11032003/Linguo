body:
  - type: objective
    text:
      vi: Sau bài này, bạn đọc hiểu một bài báo về thị trường nhà ở hoặc quy hoạch đô thị và nêu được lập luận về giá thuê, mua nhà và cải tạo khu phố.
  - type: explain
    text:
      vi: "Về nhà ở: die Wohnungsnot (thiếu nhà), die Mietpreisbremse (quy định hạn chế tăng giá thuê), die Sozialwohnung (nhà ở xã hội), die Eigentumswohnung (căn hộ sở hữu), das Eigenheim, die Immobilie (bất động sản), der Makler (môi giới). Cụm hay gặp: eine Wohnung kaufen / mieten / vermieten."
  - type: explain
    text:
      vi: "Về quy hoạch: die Stadtplanung, der Bebauungsplan (quy hoạch xây dựng), die Baugenehmigung (giấy phép xây dựng), die Sanierung (cải tạo), der Denkmalschutz (bảo tồn di tích), der Grundriss (mặt bằng căn hộ), die Fassade. Khu vực: das Stadtviertel, der Vorort, der Ballungsraum (vùng đô thị đông dân)."
  - type: explain
    text:
      vi: "Động từ: sanieren (cải tạo), bebauen (xây dựng trên một khu đất), abreißen (phá dỡ: reißt ab, riss ab, hat abgerissen). Tính từ: städtisch ↔ ländlich, barrierefrei (không có rào cản, phù hợp người khuyết tật). Gentrifizierung mô tả quá trình khu phố bình dân trở nên đắt đỏ và cư dân cũ bị đẩy ra ngoài."
  - type: deep_explain
    text:
      vi: Der Makler thường thu die Provision (hoa hồng); quy định về việc ai trả hoa hồng có thể thay đổi, nên hãy kiểm tra trước khi ký. Đừng nhầm Eigenheim (nhà riêng, thường là nhà đất) với Eigentumswohnung (căn hộ thuộc sở hữu cá nhân). Denkmalgeschützte Gebäude không được thay đổi tùy ý, ví dụ Fassade phải giữ nguyên hình dạng.
  - type: example
    target: Die Stadtplanung muss die Interessen vieler Gruppen berücksichtigen.
    target_lang: de
    translation:
      vi: Quy hoạch đô thị phải cân nhắc lợi ích của nhiều nhóm.
    note:
      vi: die Stadtplanung = quy hoạch đô thị.
  - type: example
    target: Im Bebauungsplan steht, wie hoch gebaut werden darf.
    target_lang: de
    translation:
      vi: Trong quy hoạch xây dựng ghi rõ được xây cao bao nhiêu.
    note:
      vi: der Bebauungsplan = quy hoạch xây dựng chi tiết.
  - type: example
    target: In Großstädten herrscht Wohnungsnot.
    target_lang: de
    translation:
      vi: Ở các thành phố lớn đang thiếu nhà ở.
    note:
      vi: die Wohnungsnot = tình trạng thiếu nhà.
  - type: example
    target: Die Mietpreisbremse soll Mieter vor hohen Preisen schützen.
    target_lang: de
    translation:
      vi: Quy định hạn chế tăng giá thuê nhằm bảo vệ người thuê khỏi giá cao.
    note:
      vi: die Mietpreisbremse = quy định hạn chế tăng giá thuê.
  - type: common_mistake
    wrong: Das alte Gebäude muss werden abgerissen.
    right: Das alte Gebäude muss abgerissen werden.
    target_lang: de
    note:
      vi: "Trong câu chính với động từ khiếm khuyết, Partizip II và werden đứng cuối: muss abgerissen werden."
  - type: common_mistake
    wrong: Die Stadt plant, mehr Wohnungen zu bebauen.
    right: Die Stadt plant, mehr Wohnungen zu bauen.
    target_lang: de
    note:
      vi: Bebauen dùng với khu đất (ein Grundstück bebauen); xây căn hộ thì dùng bauen.
  - type: summary
    points:
      - vi: die Wohnungsnot, die Mietpreisbremse, die Sozialwohnung, die Eigentumswohnung, das Eigenheim, die Immobilie, der Makler.
      - vi: die Stadtplanung, der Bebauungsplan, die Baugenehmigung, die Sanierung, der Denkmalschutz, der Grundriss, die Fassade.
      - vi: sanieren, bebauen, abreißen; städtisch, ländlich, barrierefrei; das Stadtviertel, der Vorort, der Ballungsraum.
