        - Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen zuschicken könnten.
        - Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen senden könnten.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen schicken könnten.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen zusenden könnten.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen zuschicken könnten.
        - Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen schicken würden.
        - Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen zusenden würden.
        - Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen zuschicken würden.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen senden könnten.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen schicken würden.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen zusenden würden.
        - Ich wäre Ihnen dankbar, wenn Sie mir die Unterlagen zuschicken würden.
    known_wrong:
      - answer: Ich wäre Ihnen sehr dankbar, wenn Sie könnten mir die Unterlagen schicken.
        feedback_vi: "Trong câu phụ wenn, động từ chia könnten đứng cuối: wenn Sie mir die Unterlagen schicken könnten."
        error_tag: verb_position
      - answer: Ich wäre Sie sehr dankbar, wenn Sie mir die Unterlagen schicken könnten.
        feedback_vi: "dankbar sein + Dativ: Ich wäre Ihnen dankbar."
        error_tag: case_dat_akk
      - answer: Ich wäre dir sehr dankbar, wenn du mir die Unterlagen schicken könntest.
        feedback_vi: "Thư trang trọng dùng Sie: Ihnen, Sie."
        error_tag: register_du_sie
    explanation:
      vi: "jemandem dankbar sein (Dativ: Ihnen). Câu wenn: động từ chia könnten/würden ở cuối, sau nguyên thể. die Unterlagen = hồ sơ, giấy tờ (luôn số nhiều)."
    display_answer: Ich wäre Ihnen sehr dankbar, wenn Sie mir die Unterlagen zusenden könnten.

