body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng nhiều động từ trừu tượng trong bài viết và thảo luận ở trình độ B2, kể cả giới từ, cách đi kèm và dạng Partizip II.
  - type: explain
    text:
      vi: "Nhóm động từ về thay đổi và ảnh hưởng: abschaffen (bãi bỏ), abschwächen (làm giảm nhẹ), beschleunigen (làm nhanh hơn), beschränken (hạn chế), beseitigen (loại bỏ), auslösen (gây ra, kích hoạt), aufdecken (phát hiện, vạch trần), aufklären (làm sáng tỏ; thông tin cho ai). Hầu hết có tân ngữ Akkusativ: Die Regierung hat die Steuer abgeschafft."
  - type: explain
    text:
      vi: "Động từ có giới từ hoặc Dativ cố định: beharren auf + Dativ (khăng khăng giữ), beruhen auf + Dativ (dựa trên), beitreten + Dativ (gia nhập: tritt bei, trat bei, ist beigetreten). Ví dụ: Das Urteil beruht auf neuen Beweisen. Er beharrt auf seiner Meinung. Das Land ist der Union beigetreten."
  - type: explain
    text:
      vi: "Dạng bất quy tắc cần học: ausschließen (schloss aus, hat ausgeschlossen), besitzen (besaß, hat besessen), betreffen (betraf, hat betroffen), ausgleichen (glich aus, hat ausgeglichen), anwenden (wandte an / wendete an, hat angewandt / angewendet). Động từ không tách (be-, ent-, ver-) không thêm ge- ở Partizip II: bewertet, bemängelt, beeindruckt."
  - type: deep_explain
    text:
      vi: "Betreffen vừa có nghĩa \"liên quan đến, ảnh hưởng tới\" (Die Regelung betrifft alle Mieter) vừa trong cụm Was mich betrifft (còn tôi thì). Ausnutzen mang sắc thái tiêu cực khi nói về người (jemanden ausnutzen = lợi dụng ai), còn với cơ hội thì trung tính. Bezeichnen thường đi với als: Er bezeichnet sie als Expertin."
  - type: example
    target: Die Stadt will die Parkgebühren abschaffen.
    target_lang: de
    translation:
      vi: Thành phố muốn bãi bỏ phí đỗ xe.
    note:
      vi: abschaffen = bãi bỏ.
  - type: example
    target: Die Regierung schwächt ihre Aussage ab.
    target_lang: de
    translation:
      vi: Chính phủ làm dịu lời tuyên bố của mình.
    note:
      vi: abschwächen = làm giảm nhẹ, làm yếu đi.
  - type: example
    target: Das Unternehmen strebt ein Wachstum von fünf Prozent an.
    target_lang: de
    translation:
      vi: Công ty nhắm tới mức tăng trưởng năm phần trăm.
    note:
      vi: anstreben = hướng tới, nhắm tới.
  - type: example
    target: Dieses Verfahren lässt sich in vielen Bereichen anwenden.
    target_lang: de
    translation:
      vi: Quy trình này có thể áp dụng trong nhiều lĩnh vực.
    note:
      vi: anwenden = áp dụng, sử dụng.
  - type: common_mistake
    wrong: Das Urteil beruht an neuen Beweisen.
    right: Das Urteil beruht auf neuen Beweisen.
    target_lang: de
    note:
      vi: Beruhen đi với auf + Dativ.
  - type: common_mistake
    wrong: Die Firma ist dem Verband beigetritt.
    right: Die Firma ist dem Verband beigetreten.
    target_lang: de
    note:
      vi: "Beitreten là động từ bất quy tắc tách dùng sein: ist beigetreten."
  - type: summary
    points:
      - vi: abschaffen, abschwächen, beschleunigen, beschränken, beseitigen, auslösen, aufdecken, aufklären, ausgleichen, ausnutzen.
      - vi: beharren auf + Dativ, beruhen auf + Dativ, beitreten + Dativ (ist beigetreten), bedrohen, beeindrucken, bemängeln, bewerten, bezeichnen als.
      - vi: "ausschließen, besitzen, betreffen, anwenden: học cả ba dạng; anstreben, bestimmen."
