body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng thêm khoảng hai mươi danh từ trừu tượng, biết giới từ đi kèm và nêu quan điểm về các vấn đề xã hội một cách chính xác hơn.
  - type: explain
    text:
      vi: "Giới từ cố định cần học cùng danh từ: das Bewusstsein für + Akk (ý thức về), die Verpflichtung zu + Dativ (nghĩa vụ đối với), der Widerstand gegen + Akk (sự kháng cự), der Vorwurf gegen + Akk (lời buộc tội), die Verzögerung bei + Dativ (sự trì hoãn trong), der Wandel in + Dativ. Ví dụ: Es gibt Widerstand gegen den Plan."
  - type: explain
    text:
      vi: "Danh từ chỉ khó khăn và vấn đề: das Defizit, die Lücke, der Missstand (tình trạng tồi tệ), die Notlage, die Knappheit (sự khan hiếm), die Spannung, die Beeinträchtigung (sự ảnh hưởng xấu), die Verzögerung, die Abweichung. Danh từ chỉ cơ hội và quan hệ: die Chance, das Bündnis, die Einrichtung, die Kontrolle, die Wirklichkeit."
  - type: explain
    text:
      vi: "Giống và số nhiều: đuôi -ung, -heit, -keit, -schaft, -tät, -ik thường giống cái (die Verzögerung, die Knappheit); từ đuôi -nis là giống trung (das Bündnis, Bündnisse) hoặc giống cái (die Kenntnis). Vài từ đặc biệt: der Wandel (Sg.), das Gewissen (Sg.), das Gleichgewicht (Sg.), der Missstand (Missstände)."
  - type: deep_explain
    text:
      vi: "Das Defizit có số nhiều die Defizite và thường xuất hiện trong ngữ cảnh kinh tế (ein Defizit im Haushalt). Der Vorwurf chỉ lời buộc tội hoặc trách móc: Er erhebt Vorwürfe gegen den Chef. Die Reichweite là tầm với hoặc phạm vi tác động. Das Gleichgewicht chỉ có số ít: das ökologische Gleichgewicht. Das Gewissen cũng chỉ số ít: ein schlechtes Gewissen haben."
  - type: example
    target: Die Abweichung vom Plan ist gering.
    target_lang: de
    translation:
      vi: Độ sai lệch so với kế hoạch rất nhỏ.
    note:
      vi: die Abweichung = sự sai lệch.
  - type: example
    target: Es gab keine Beeinträchtigung des Verkehrs.
    target_lang: de
    translation:
      vi: Không có ảnh hưởng xấu nào đến giao thông.
    note:
      vi: die Beeinträchtigung = sự ảnh hưởng xấu.
  - type: example
    target: Das Bewusstsein für Umweltschutz ist gewachsen.
    target_lang: de
    translation:
      vi: Ý thức bảo vệ môi trường đã tăng lên.
    note:
      vi: das Bewusstsein = ý thức, sự nhận thức.
  - type: example
    target: Die Parteien haben ein Bündnis geschlossen.
    target_lang: de
    translation:
      vi: Các đảng đã lập một liên minh.
    note:
      vi: das Bündnis = liên minh.
  - type: common_mistake
    wrong: Es gibt viel Widerstand für den Plan.
    right: Es gibt viel Widerstand gegen den Plan.
    target_lang: de
    note:
      vi: Widerstand đi với gegen + Akkusativ.
  - type: common_mistake
    wrong: Die Zeitung erhebt Vorwürfe auf die Regierung.
    right: Die Zeitung erhebt Vorwürfe gegen die Regierung.
    target_lang: de
    note:
      vi: Vorwurf đi với gegen + Akkusativ.
  - type: summary
    points:
      - vi: das Bewusstsein, die Verpflichtung, der Widerstand, der Vorwurf, die Verzögerung, der Wandel, das Gewissen, das Gleichgewicht.
      - vi: das Defizit, die Lücke, der Missstand, die Notlage, die Knappheit, die Spannung, die Beeinträchtigung, die Abweichung.
      - vi: die Chance, das Bündnis, die Einrichtung, die Kontrolle, die Wirklichkeit, die Reichweite, die Verbreitung, die Mitwirkung.
