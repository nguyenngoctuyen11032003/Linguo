        - Grundsätzlich ist das Verfahren einheitlich geregelt, aber die Umsetzung ist aufwendig und ihr Ergebnis oft fraglich.
        - Das Verfahren ist grundsätzlich einheitlich geregelt, aber die Umsetzung ist aufwendig, und das Ergebnis ist oft fraglich.
        - Grundsätzlich ist das Verfahren einheitlich geregelt, doch die Umsetzung ist aufwendig, und ihr Ergebnis ist oft fraglich.
