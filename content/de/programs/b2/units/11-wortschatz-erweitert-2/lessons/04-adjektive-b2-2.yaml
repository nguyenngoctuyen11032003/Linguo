    answer:
      accepted:
        - Dù đã được cảnh báo rõ ràng, anh ta vẫn hành động cẩu thả và mọi nỗ lực cuối cùng đều vô ích.
        - Mặc dù được cảnh báo dứt khoát, anh ta vẫn hành xử bất cẩn, và cuối cùng mọi cố gắng đều vô ích.
