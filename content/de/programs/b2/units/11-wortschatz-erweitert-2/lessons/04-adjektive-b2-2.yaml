title:
  vi: "Tính từ B2 (2): tính chất, thái độ, khả năng (Adjektive 2)"
objectives:
  - vi: Dùng thêm nhiều tính từ trừu tượng để mô tả người, kế hoạch và tình huống.
  - vi: "Phân biệt các cặp: konsequent – hartnäckig, verbindlich – verantwortungsvoll, mühelos – vergeblich."
  - vi: Nhận biết đuôi -los, -sam, -bar, -haft, -lich giúp đoán nghĩa tính từ mới.
