body:
  - type: objective
    text:
      vi: Sau bài này, bạn mô tả thái độ, nỗ lực và khả năng bằng nhiều tính từ phong phú hơn và dùng được chúng trong văn viết trang trọng.
  - type: explain
    text:
      vi: "Tính từ về thái độ và nỗ lực: konsequent (nhất quán, kiên quyết), verantwortungsvoll, sensibel (nhạy cảm), flexibel, selbstständig, vielseitig (đa năng), fahrlässig (cẩu thả, bất cẩn), harmlos. Ví dụ: Er handelt konsequent. Sie ist eine vielseitige Künstlerin."
  - type: explain
    text:
      vi: "Tính từ về kết quả: vergeblich (vô ích), mühelos (không tốn sức), hinreichend (đủ), ersichtlich (rõ ràng), ausdrücklich (một cách rõ ràng, dứt khoát), unwiderruflich (không thể thay đổi), vollkommen (hoàn toàn). Trong văn bản chính thức hay gặp: Die Frist ist unwiderruflich. Er hat ausdrücklich darauf hingewiesen."
  - type: explain
    text:
      vi: "Các tính từ liên quan đến thời gian và thái độ chung: gegenwärtig (hiện tại), zeitgemäß (phù hợp thời đại), fortschrittlich, aufwendig (tốn kém công sức), einheitlich (thống nhất), grundsätzlich (về nguyên tắc), relativ, kompliziert. Ví dụ: Das Verfahren ist sehr aufwendig. Grundsätzlich ist das erlaubt."
  - type: deep_explain
    text:
      vi: "Đuôi -los chỉ sự thiếu: harmlos (vô hại), endlos (vô tận), mühelos. Đuôi -haft hay -lich cho tính từ chung. Grundsätzlich vừa là tính từ (eine grundsätzliche Frage) vừa là trạng từ (Das ist grundsätzlich richtig). Fahrlässig là thuật ngữ pháp lý: fahrlässige Körperverletzung (làm bị thương do bất cẩn)."
  - type: example
    target: Die Reparatur war sehr aufwendig.
    target_lang: de
    translation:
      vi: Việc sửa chữa rất tốn công sức.
    note:
      vi: aufwendig = tốn công sức, tốn kém.
  - type: example
    target: Das Gesetz verbietet dies ausdrücklich.
    target_lang: de
    translation:
      vi: Luật cấm điều này một cách rõ ràng.
    note:
      vi: ausdrücklich = một cách rõ ràng, dứt khoát.
  - type: example
    target: Es gibt keine einheitliche Regelung.
    target_lang: de
    translation:
      vi: Không có quy định thống nhất.
    note:
      vi: einheitlich = thống nhất.
  - type: example
    target: Die Diskussion schien endlos.
    target_lang: de
    translation:
      vi: Cuộc thảo luận như kéo dài bất tận.
    note:
      vi: endlos = vô tận, bất tận.
  - type: common_mistake
    wrong: Er hat vergeblich Mühe gegeben.
    right: Er hat sich vergeblich bemüht.
    target_lang: de
    note:
      vi: Vergeblich là tính từ/trạng từ nghĩa là vô ích; nói gắng sức thì dùng sich bemühen.
  - type: common_mistake
    wrong: Das Verfahren ist aufwendige.
    right: Das Verfahren ist aufwendig.
    target_lang: de
    note:
      vi: Sau sein, tính từ không đổi đuôi.
  - type: summary
    points:
      - vi: konsequent, sensibel, vielseitig, fahrlässig, harmlos, verantwortungsvoll, selbstständig.
      - vi: vergeblich, mühelos, hinreichend, ersichtlich, ausdrücklich, unwiderruflich, vollkommen, einheitlich.
      - vi: gegenwärtig, zeitgemäß, fortschrittlich, aufwendig, grundsätzlich, relativ, kompliziert, mehrheitlich, endlos.
