body:
  - type: objective
    text:
      vi: Sau bài này, bạn đánh giá và so sánh sự việc bằng nhiều tính từ chính xác hơn và nhận biết các sắc thái khác nhau giữa các tính từ gần nghĩa.
  - type: explain
    text:
      vi: "Nhóm mức độ và tầm quan trọng: wesentlich (cốt yếu), bedeutend (quan trọng), erheblich và beträchtlich (đáng kể), gewaltig (to lớn), geringfügig (nhỏ, không đáng kể), maßgeblich (có tính quyết định), vorrangig (ưu tiên). Ví dụ: Der Preis ist erheblich gestiegen. Das ist ein wesentlicher Unterschied."
  - type: explain
    text:
      vi: "Nhóm đánh giá: angemessen (thích hợp, vừa phải), geeignet (phù hợp), ungeeignet, notwendig, unentbehrlich (không thể thiếu), vorbildlich (mẫu mực), kritisch, umstritten, fraglich (đáng nghi vấn). Ví dụ: Die Bezahlung ist angemessen. Das Werkzeug ist für diese Arbeit ungeeignet."
  - type: explain
    text:
      vi: "Nhớ vị trí: sau sein tính từ không đổi (Der Plan ist riskant), trước danh từ có đuôi (ein riskanter Plan), và nhiều tính từ dùng được như trạng từ mà không đổi: Die Kosten sind erheblich gestiegen. Nhưng một số tính từ như bedeutend, wesentlich thường dùng làm trạng từ trước một tính từ so sánh: wesentlich größer (lớn hơn nhiều)."
  - type: deep_explain
    text:
      vi: "Erheblich và beträchtlich gần nghĩa nhau, nhưng erheblich thường xuất hiện trong ngữ cảnh pháp lý và kinh tế (erhebliche Mängel). Vorbildlich nghĩa là gương mẫu, không phải lý tưởng; ideal thì hoàn hảo. Fraglich nghĩa là còn đáng ngờ: Es ist fraglich, ob das Projekt gelingt. Umstritten là gây tranh cãi, nhiều người không đồng ý."
  - type: example
    target: Der Preis ist für die Leistung angemessen.
    target_lang: de
    translation:
      vi: Giá cả phù hợp với chất lượng.
    note:
      vi: angemessen = thích hợp, vừa phải.
  - type: example
    target: Das Unternehmen hat beträchtliche Verluste gemacht.
    target_lang: de
    translation:
      vi: Doanh nghiệp đã chịu những khoản lỗ đáng kể.
    note:
      vi: beträchtlich = đáng kể.
  - type: example
    target: Er gilt als ein bedeutender Forscher.
    target_lang: de
    translation:
      vi: Ông được xem là một nhà nghiên cứu lớn.
    note:
      vi: bedeutend = quan trọng, lớn lao.
  - type: example
    target: Die Preise sind erheblich gestiegen.
    target_lang: de
    translation:
      vi: Giá cả đã tăng đáng kể.
    note:
      vi: erheblich = đáng kể, nghiêm trọng.
  - type: common_mistake
    wrong: Der Unterschied ist wesentlich als vorher.
    right: Der Unterschied ist wesentlich größer als vorher.
    target_lang: de
    note:
      vi: Wesentlich làm trạng từ nhấn mạnh phải đứng trước tính từ so sánh (größer).
  - type: common_mistake
    wrong: Der Unterschied ist erheblich als vorher.
    right: Der Unterschied ist erheblich größer als vorher.
    target_lang: de
    note:
      vi: Erheblich làm trạng từ nhấn mạnh phải đứng trước tính từ so sánh (größer).
  - type: summary
    points:
      - vi: wesentlich, bedeutend, erheblich, beträchtlich, gewaltig, geringfügig, maßgeblich, vorrangig, zahlreich, zusätzlich.
      - vi: angemessen, geeignet, ungeeignet, notwendig, unentbehrlich, vorbildlich, kritisch, umstritten, fraglich, riskant, objektiv.
      - vi: "Sau sein không đổi đuôi; trước danh từ có đuôi; dùng như trạng từ: erheblich gestiegen, wesentlich größer."
