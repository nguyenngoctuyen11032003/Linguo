      fallback_text: Die Regierung will die Rechte nicht weiter einschränken.
      options:
        - { id: lhy, text: Chúng tôi lập một bản báo cáo trước thứ Hai., lang: vi }
        - { id: k2z, text: Chính phủ không muốn hạn chế thêm các quyền., lang: vi }
        - { id: d1o, text: Hợp đồng được gia hạn thêm hai năm., lang: vi }
