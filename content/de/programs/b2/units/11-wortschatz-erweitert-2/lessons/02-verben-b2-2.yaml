        - Die Behörde hat festgestellt, dass das Unternehmen die Vorschriften nicht eingehalten hat, und hat Maßnahmen ergriffen.
        - Die Behörde stellte fest, dass das Unternehmen die Vorschriften nicht eingehalten hatte, und ergriff Maßnahmen.
