body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng thêm nhiều động từ trang trọng khi viết báo cáo, thư hành chính và khi phân tích một bài báo.
  - type: explain
    text:
      vi: "Động từ hành chính: festlegen (ấn định), feststellen (xác định, nhận thấy), erstellen (lập, soạn), erfassen (ghi nhận, thống kê), gewährleisten (đảm bảo), kennzeichnen (đánh dấu, ghi nhãn), erzeugen (tạo ra), erneuern (làm mới). Phần lớn có tân ngữ Akkusativ: Das Gesetz legt die Frist fest. Die Behörde hat den Schaden festgestellt."
  - type: explain
    text:
      vi: "Nhóm bất quy tắc: entnehmen (entnimmt, entnahm, hat entnommen: lấy ra, rút ra), ergreifen (ergriff, hat ergriffen: nắm lấy, áp dụng biện pháp), erheben (erhob, hat erhoben: thu, nêu lên), beziehen (bezog, hat bezogen: nhận, nhận được), hinnehmen (nahm hin, hat hingenommen: chấp nhận), hervorrufen (rief hervor, hat hervorgerufen: gây ra), herausfinden (fand heraus, hat herausgefunden: tìm ra)."
  - type: explain
    text:
      vi: "Cách dùng cố định: Maßnahmen ergreifen (áp dụng biện pháp), Kritik erheben (nêu lên sự chỉ trích), Gebühren erheben (thu phí), ein Gehalt beziehen (nhận lương), etwas einer Quelle entnehmen (lấy từ nguồn nào), einer Anforderung entsprechen + Dativ (đáp ứng yêu cầu). Ví dụ: Das Produkt entspricht den Anforderungen."
  - type: deep_explain
    text:
      vi: "Cẩn thận phân biệt: einsetzen là đặt vào, sử dụng (Er setzt neue Mitarbeiter ein) và sich einsetzen für (đấu tranh vì). Erlangen có nghĩa đạt được, thường dùng với cái trừu tượng: Selbstständigkeit erlangen. Billigen thường mang tính chính thức: Der Stadtrat billigte den Plan. Entfalten nghĩa là mở ra, phát triển: Sie kann ihre Fähigkeiten entfalten."
  - type: example
    target: Sie bezieht ein monatliches Gehalt von 3000 Euro.
    target_lang: de
    translation:
      vi: Cô ấy nhận lương hằng tháng ba nghìn euro.
    note:
      vi: beziehen = nhận (lương, hàng); căng (giường); liên hệ.
  - type: example
    target: Der Stadtrat hat den Plan gebilligt.
    target_lang: de
    translation:
      vi: Hội đồng thành phố đã chấp thuận kế hoạch.
    note:
      vi: billigen = chấp thuận.
  - type: example
    target: Die Regierung will die Rechte nicht weiter einschränken.
    target_lang: de
    translation:
      vi: Chính phủ không muốn hạn chế thêm các quyền.
    note:
      vi: einschränken = hạn chế, thu hẹp.
  - type: example
    target: Das Unternehmen setzt mehr Roboter ein.
    target_lang: de
    translation:
      vi: Doanh nghiệp sử dụng nhiều robot hơn.
    note:
      vi: einsetzen = sử dụng, bố trí; đặt vào.
  - type: common_mistake
    wrong: Das Produkt entspricht die Anforderungen nicht.
    right: Das Produkt entspricht den Anforderungen nicht.
    target_lang: de
    note:
      vi: "Entsprechen đi với Dativ: den Anforderungen."
  - type: common_mistake
    wrong: Die Firma hat neue Maßnahmen ergriffen worden.
    right: Die Firma hat neue Maßnahmen ergriffen.
    target_lang: de
    note:
      vi: Chủ động dùng haben + Partizip II; worden chỉ dùng ở bị động.
  - type: summary
    points:
      - vi: festlegen, feststellen, erstellen, erfassen, gewährleisten, kennzeichnen, erzeugen, erneuern, erschweren, einschränken.
      - vi: "entnehmen, ergreifen, erheben, beziehen, hinnehmen, hervorrufen, herausfinden: học cả ba dạng."
      - vi: entsprechen + Dativ, billigen, ernennen, erlangen, entfalten, entfernen, einsetzen; Maßnahmen ergreifen, Kritik erheben.
