body:
  - type: objective
    text:
      vi: Sau bài này, bạn dùng đúng khoảng hai mươi danh từ trừu tượng quan trọng cùng các cụm cố định thường dùng trong bài viết, thuyết trình và thảo luận ở trình độ B2.
  - type: explain
    text:
      vi: "Từ chỉ cơ sở và nguyên tắc: die Grundlage (nền tảng), der Grundsatz (nguyên tắc), das Prinzip, der Maßstab (thước đo, tiêu chuẩn), das Merkmal (đặc điểm), der Hintergrund (bối cảnh), der Ansatz (cách tiếp cận), der Sachverhalt (tình tiết, vấn đề). Cụm: auf der Grundlage von, nach dem Prinzip, im Hintergrund."
  - type: explain
    text:
      vi: "Từ chỉ cách thức và phạm vi: der Rahmen (khuôn khổ), der Spielraum (không gian linh hoạt), die Hinsicht (phương diện), der Umstand (hoàn cảnh), der Vorgang (diễn biến, quá trình), die Tendenz, die Konsequenz, das Hindernis. Cụm cố định: im Rahmen von, in dieser Hinsicht, unter diesen Umständen, Konsequenzen ziehen."
  - type: explain
    text:
      vi: "Từ chỉ nhu cầu và sự đánh giá: der Bedarf (nhu cầu, số ít), der Aufwand (công sức, chi phí; số ít), das Erfordernis, die Notwendigkeit, die Beurteilung, die Einstellung (thái độ; cũng nghĩa tuyển dụng), die Angelegenheit (vấn đề, việc). Ví dụ: Der Bedarf an Fachkräften ist groß."
  - type: deep_explain
    text:
      vi: "Đuôi -grund, -satz, -stand, -punkt tạo nhiều từ ghép: der Hintergrund, der Grundsatz, der Umstand, der Standpunkt. Cẩn thận Aufwand và Bedarf chỉ dùng số ít; Umstände (số nhiều) dùng nhiều hơn số ít: unter den gegebenen Umständen. Der Spielraum nghĩa đen là không gian chơi, nghĩa bóng là biên độ linh hoạt: Wir haben wenig Spielraum."
  - type: example
    target: Die Studie bildet die Grundlage für das neue Gesetz.
    target_lang: de
    translation:
      vi: Nghiên cứu này là nền tảng cho đạo luật mới.
    note:
      vi: die Grundlage = nền tảng, cơ sở.
  - type: example
    target: Gleichbehandlung ist ein wichtiger Grundsatz.
    target_lang: de
    translation:
      vi: Đối xử bình đẳng là một nguyên tắc quan trọng.
    note:
      vi: der Grundsatz = nguyên tắc cơ bản.
  - type: example
    target: Ich arbeite nach dem Prinzip der Fairness.
    target_lang: de
    translation:
      vi: Tôi làm việc theo nguyên tắc công bằng.
    note:
      vi: das Prinzip = nguyên tắc.
  - type: example
    target: Für die Bewertung gibt es klare Maßstäbe.
    target_lang: de
    translation:
      vi: Có những tiêu chuẩn rõ ràng cho việc đánh giá.
    note:
      vi: der Maßstab = thước đo, tiêu chuẩn; tỷ lệ.
  - type: common_mistake
    wrong: Der Bedarf an Pflegekräften ist wachsen.
    right: Der Bedarf an Pflegekräften wächst.
    target_lang: de
    note:
      vi: "Dùng động từ chia: wächst; không dùng nguyên thể sau sein."
  - type: common_mistake
    wrong: Im Rahmen des Projekt wurde ein Bericht erstellt.
    right: Im Rahmen des Projekts wurde ein Bericht erstellt.
    target_lang: de
    note:
      vi: "Sau im Rahmen có Genitiv: des Projekts (danh từ giống trung thêm -s)."
  - type: summary
    points:
      - vi: die Grundlage, der Grundsatz, das Prinzip, der Maßstab, das Merkmal, der Hintergrund, der Ansatz, der Sachverhalt.
      - vi: der Rahmen, der Spielraum, die Hinsicht, der Umstand, der Vorgang, die Tendenz, die Konsequenz, das Hindernis.
      - vi: der Bedarf (Sg.), der Aufwand (Sg.), das Erfordernis, die Notwendigkeit, die Beurteilung, die Einstellung, die Angelegenheit.
