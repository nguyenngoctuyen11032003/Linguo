      vi: "Notwendigkeit là danh từ giống cái (die): die Notwendigkeit; số nhiều: die Notwendigkeiten. \"ein\" là mạo từ không xác định nên không hợp với yêu cầu. Luôn học danh từ cùng mạo từ."
