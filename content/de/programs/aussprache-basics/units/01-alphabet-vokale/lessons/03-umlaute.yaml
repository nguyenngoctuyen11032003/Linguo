title:
  vi: Ä, Ö, Ü (Die Umlaute)
objectives:
  - vi: Phát âm đúng ü, ö, ä trong các từ thông dụng.
  - vi: Nghe phân biệt u – ü, o – ö, a – ä (die Tour – die Tür, schon – schön).
  - vi: Gõ được ä, ö, ü, hoặc ae, oe, ue khi bàn phím không có chữ đó.
estimated_minutes: 12
skills: [pronunciation, listening, speaking]
