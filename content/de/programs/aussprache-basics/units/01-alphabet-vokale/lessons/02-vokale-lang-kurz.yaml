title:
  vi: Nguyên âm dài và ngắn (Lange und kurze Vokale)
objectives:
  - vi: Nghe và đọc đúng nguyên âm dài, ngắn trong các từ quen thuộc.
  - vi: Đoán nguyên âm dài hay ngắn nhờ chữ viết (ee, oo, h, ie, phụ âm đôi).
  - vi: Phân biệt những cặp từ chỉ khác nhau ở độ dài như das Bett – das Beet.
estimated_minutes: 12
skills: [pronunciation, listening, reading]
prerequisites: [de:lesson:p0u1-alphabet]
