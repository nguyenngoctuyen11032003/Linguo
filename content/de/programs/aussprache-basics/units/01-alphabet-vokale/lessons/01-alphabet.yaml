title:
  vi: Bảng chữ cái và đánh vần (Das Alphabet)
objectives:
  - vi: Đọc tên 26 chữ cái cùng ä, ö, ü và ß theo cách đọc của người Đức.
  - vi: Đánh vần tên của mình bằng tiếng Đức (großes …, Doppel-…).
  - vi: Nghe một từ hoặc một tên được đánh vần và viết lại đúng.
estimated_minutes: 12
skills: [pronunciation, listening, speaking]
