title:
  vi: Nguyên âm đôi và âm cuối -e, -er (Diphthonge, -e und -er)
objectives:
  - vi: Đọc đúng ei/ai, eu/äu, au và phân biệt ei với ie.
  - vi: Đọc nhẹ âm -e cuối từ (như "ơ") và đuôi -er (như "a" nhẹ).
  - vi: Nghe nhận ra các từ như heute, die Zeit, das Haus, der Lehrer.
estimated_minutes: 12
skills: [pronunciation, listening, reading]
prerequisites: [de:lesson:p0u1-umlaute]
