title:
  vi: der, die, das – đồ vật trong lớp (Der Tisch, die Tafel, das Buch)
objectives:
  - vi: Gọi tên đồ vật trong lớp học luôn kèm mạo từ der, die hoặc das.
  - vi: Đọc hiểu ký hiệu số nhiều trên thẻ từ và trong từ điển (-e, ¨-er, -, -s, -n).
  - vi: Viết hoa mọi danh từ khi viết tiếng Đức.
estimated_minutes: 12
skills: [grammar, vocabulary, reading]
prerequisites: [de:lesson:p0u2-wiederholung]
