title:
  vi: Đây là… – đọc đoạn ngắn (Das ist Frau Wagner.)
objectives:
  - vi: Giới thiệu người khác bằng “Das ist …” và hỏi “Wer ist das?”, “Ist das …?” – trả lời Ja./Nein.
  - vi: Gọi người khác lịch sự bằng Herr/Frau + họ, kể cả với tên người Việt.
  - vi: Nghe và đọc hiểu một đoạn ngắn 3–4 câu về người trong lớp học.
