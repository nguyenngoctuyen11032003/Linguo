title:
  vi: Trọng âm và từ ghép (Wortakzent und Komposita)
objectives:
  - vi: Nhấn đúng âm tiết trong từ gốc Đức (âm đầu của gốc từ, không nhấn ver-, be-, ge-…).
  - vi: Nhấn đúng âm tiết cuối ở từ quốc tế như Restaurant, Café, Universität, Information.
  - vi: Nhấn phần đầu của từ ghép và đoán đúng giống của từ ghép theo phần cuối.
