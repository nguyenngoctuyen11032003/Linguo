title:
  vi: Câu dùng trong lớp (Wie bitte? Noch einmal, bitte.)
objectives:
  - vi: Lịch sự xin nhắc lại, xin nói chậm khi chưa nghe kịp.
  - vi: Hỏi nghĩa một từ (Was heißt … auf Deutsch?) và hỏi cách viết (Wie schreibt man das?).
  - vi: Nói “tôi không hiểu” và “tôi không biết” đúng tình huống.
  - vi: Hạ giọng ở câu kể và câu hỏi có từ để hỏi, lên giọng ở câu hỏi có/không.
