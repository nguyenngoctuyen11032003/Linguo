title:
  vi: Tôi là… – âm r, phụ âm cuối (Ich heiße …)
objectives:
  - vi: Nói tên và nơi mình đến bằng câu mẫu – Ich heiße …, Ich bin …, Ich komme aus Vietnam.
  - vi: Hỏi tên người khác đúng mức thân mật hay lịch sự – Wie heißt du? / Wie heißen Sie? – và hỏi lại Und du? / Und Sie?
  - vi: Phát âm r lưỡi gà (richtig, drei) và r biến thành “a” nhẹ (Uhr, vier).
  - vi: Đọc b, d, g cuối từ thành p, t, k và không nuốt phụ âm cuối (Tag, und).
estimated_minutes: 12
skills: [pronunciation, speaking, listening]
