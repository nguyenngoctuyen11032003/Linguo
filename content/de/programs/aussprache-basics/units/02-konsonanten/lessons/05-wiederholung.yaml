body:
  - type: objective
    text:
      vi: Sau bài ôn này, bạn tự tin chào hỏi, giới thiệu tên và quê, hỏi lại người kia và trao đổi số điện thoại trong một đoạn hội thoại ngắn bằng tiếng Đức.
  - type: explain
    text:
      vi: Trước khi mở lời, hãy chọn mức trang trọng – với bạn bè, người trẻ dùng Hallo, Wie heißt du?, Und du?, Tschüss; với người lạ, người lớn tuổi dùng Guten Tag, Wie heißen Sie?, Und Sie?, Auf Wiedersehen. Giữ nguyên một mức trong cả đoạn hội thoại.
  - type: explain
    text:
      vi: Một đoạn làm quen thường có bốn bước – chào, nói tên (Ich heiße …/Ich bin …), nói quê (Ich komme aus …), hỏi lại (Und du?/Und Sie?) rồi nói Freut mich!. Khi chia tay, thêm Bis bald! nếu thân mật.
  - type: explain
    text:
      vi: Số điện thoại được đọc từng chữ số hoặc theo cặp – null eins sieben null, vier vier acht, zwölf sechzehn. Khi nghe, hãy viết ngay từng nhóm, chú ý các cặp dễ nhầm zwei/drei, zwölf/zwanzig, sechzehn/sechzig.
  - type: explain
    text:
      vi: Ôn nhanh cách đọc – w = “v”, v = “ph”, z = “ts”; ch sau a/o/u = “kh”, sau i/e = ch nhẹ, đuôi -ig = “ich”; s + nguyên âm = “d” giọng Bắc, sp/st đầu từ = “schp/scht”; r lưỡi gà hoặc “a” nhẹ ở cuối âm tiết; b/d/g cuối từ = p/t/k.
  - type: deep_explain
    text:
      vi: Nếu không gõ được ä, ö, ü, ß, bạn gõ ae, oe, ue, ss như đã học ở P0U1 – Tschuess, fuenf, zwoelf, heisse đều được máy chấm tính đúng. Khi đọc số dài, người Đức hay đọc nhóm cuối theo cặp (zwölf sechzehn = 12 và 16); bạn chỉ cần ghi lần lượt các chữ số – 1216. Trong đời sống, nhiều người Đức nói Tschüss cả với người quen dùng Sie, nhưng khi chưa chắc, Auf Wiedersehen luôn an toàn.
  - type: example
    target: "Hallo! Ich heiße Mai. Wie heißt du? – Ich bin Felix. Freut mich! – Ich komme aus Vietnam. Und du? – Ich komme aus Berlin."
    target_lang: de
    translation:
      vi: "Chào bạn! Mình tên là Mai. Bạn tên gì? – Mình là Felix. Rất vui được gặp bạn! – Mình đến từ Việt Nam. Còn bạn? – Mình đến từ Berlin."
    note:
      vi: Hai bạn trẻ làm quen, dùng du từ đầu đến cuối.
  - type: example
    target: "Guten Abend! Wie heißen Sie? – Ich heiße Thomas Weber. Und Sie? – Ich heiße Linh. Freut mich!"
    target_lang: de
    translation:
      vi: "Chào buổi tối! Anh tên là gì ạ? – Tôi tên là Thomas Weber. Còn chị? – Tôi tên là Linh. Rất vui được gặp anh!"
    note:
      vi: Hai người lớn mới gặp, dùng Sie (lịch sự) cho cả đoạn.
  - type: example
    target: "Meine Handynummer ist null eins sieben null, vier vier acht, zwölf sechzehn."
    target_lang: de
    translation:
      vi: "Số di động của tôi là 0170 448 1216."
    note:
      vi: Nhóm cuối đọc theo cặp – zwölf (12), sechzehn (16).
  - type: common_mistake
    wrong: "Guten Tag! Wie heißen Sie? … Tschüss, Felix!"
    right: "Guten Tag! Wie heißen Sie? … Auf Wiedersehen, Herr Weber!"
    target_lang: de
    note:
      vi: Đã mở đầu lịch sự bằng Sie thì nên giữ mức lịch sự khi chia tay – Auf Wiedersehen và Herr/Frau + họ. Gọi tên riêng kèm Tschüss là tự chuyển sang thân mật khi người kia chưa mời.
  - type: common_mistake
    wrong: "Ich bin heiße Mai. Ich komme von Vietnam."
    right: "Ich heiße Mai. Ich komme aus Vietnam."
    target_lang: de
    note:
      vi: Chọn Ich heiße hoặc Ich bin, không dùng cả hai; nơi xuất thân dùng aus, không dùng von.
  - type: common_mistake
    wrong: "sechszehn"
    right: "sechzehn"
    target_lang: de
    note:
      vi: Mười sáu bỏ s của sechs. Đây là lỗi chính tả hay gặp khi ghi số điện thoại bằng chữ.
  - type: summary
    points:
      - vi: Thân mật – Hallo, Wie heißt du?, Und du?, Tschüss, bis bald!; lịch sự – Guten Tag, Wie heißen Sie?, Und Sie?, Auf Wiedersehen.
      - vi: Làm quen – chào → Ich heiße …/Ich bin … → Ich komme aus … → Und du?/Und Sie? → Freut mich!
      - vi: Số điện thoại đọc từng chữ số hoặc theo cặp; cẩn thận zwei/drei, zwölf/zwanzig, sechzehn/sechzig.
      - vi: w = “v”, v = “ph”, z = “ts”, ch = “kh” hoặc ch nhẹ, -ig = “ich”, sp/st = “schp/scht”, b/d/g cuối = p/t/k.
      - vi: Không gõ được ä, ö, ü, ß thì gõ ae, oe, ue, ss.
