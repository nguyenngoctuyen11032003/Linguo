      vi: “Xin chào” là Hallo (hoặc Guten Tag), “tôi tên là” là ich heiße (hoặc ich bin), “tôi đến từ Việt Nam” là Ich komme aus Vietnam.
    display_answer: "Hallo, ich heiße Hoa. Ich komme aus Vietnam."

