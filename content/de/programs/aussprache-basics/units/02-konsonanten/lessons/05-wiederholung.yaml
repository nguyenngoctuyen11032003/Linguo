    item: de:item:p0u2-ich-komme-aus-vietnam
    prompt:
      source_text: "Xin chào, tôi tên là Hoa. Tôi đến từ Việt Nam."
      source_lang: vi
      direction: vi_to_target
    answer:
      accepted:
        - "Hallo, ich heiße Hoa. Ich komme aus Vietnam."
        - "Hallo, ich bin Hoa. Ich komme aus Vietnam."
        - "Hallo, ich heiße Hoa. Ich bin aus Vietnam."
        - "Hallo, ich bin Hoa. Ich bin aus Vietnam."
        - "Guten Tag, ich heiße Hoa. Ich komme aus Vietnam."
        - "Guten Tag, ich bin Hoa. Ich komme aus Vietnam."
        - "Guten Tag, ich heiße Hoa. Ich bin aus Vietnam."
        - "Guten Tag, ich bin Hoa. Ich bin aus Vietnam."
