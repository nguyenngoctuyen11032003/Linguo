        - { id: g-tschuess, text: "Tschüss, bis bald!" }
        - { id: g-sie, text: "Wie heißen Sie?" }
        - { id: g-mai, text: "Hallo! Ich heiße Mai. Wie heißt du?" }
        - { id: g-vietnam, text: "Ich komme aus Vietnam. Und du?" }
        - { id: g-felix, text: "Ich bin Felix. Freut mich!" }
    answer:
      orders:
        - [g-mai, g-felix, g-vietnam, g-berlin, g-tschuess]
    explanation:
      vi: Mai chào, nói tên và hỏi Wie heißt du?; Felix trả lời và nói Freut mich!; Mai nói quê rồi hỏi lại Und du?; Felix nói mình đến từ Berlin; cuối cùng chia tay thân mật Tschüss, bis bald!. Hai bạn dùng du nên không có Wie heißen Sie?
    display_answer: "Hallo! Ich heiße Mai. Wie heißt du? Ich bin Felix. Freut mich! Ich komme aus Vietnam. Und du? Ich komme aus Berlin. Tschüss, bis bald!"

