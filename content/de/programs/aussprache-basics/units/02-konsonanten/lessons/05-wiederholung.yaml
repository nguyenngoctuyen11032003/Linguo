title:
  vi: Ôn tập – chào hỏi và số (Wiederholung)
objectives:
  - vi: Hiểu và tham gia một đoạn chào hỏi – giới thiệu – trao số điện thoại dài 4–6 lượt lời.
  - vi: Nghe và viết lại số điện thoại đọc từng chữ số hoặc theo cặp.
  - vi: Chọn đúng du hay Sie, Hallo hay Guten Tag, Tschüss hay Auf Wiedersehen theo tình huống.
  - vi: Ôn cách đọc w, v, z, ch, -ig, s, sch, sp, st, r và phụ âm cuối.
