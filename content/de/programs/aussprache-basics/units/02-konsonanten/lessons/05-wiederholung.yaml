  - key: de:exercise:p0u2l5-mcq-lesen-sie
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:p0u2-wie-heissen-sie
    prompt:
      stem: "Đọc đoạn hội thoại. A: Guten Abend! Ich heiße Thomas Weber. Wie heißen Sie? – B: Guten Abend! Ich heiße Linh. Ich komme aus Vietnam. – A: Freut mich! Hai người nói chuyện thân mật hay lịch sự?"
      stem_lang: vi
      options:
        - { id: o1l, text: "Lịch sự – họ dùng Guten Abend và Sie.", lang: vi }
        - { id: o2t, text: "Thân mật – họ dùng du.", lang: vi }
        - { id: o3h, text: "Thân mật – họ chào nhau bằng Hallo.", lang: vi }
        - { id: o4s, text: "Lịch sự – họ chào tạm biệt bằng Auf Wiedersehen.", lang: vi }
    answer:
      correct_option_id: o1l
    explanation:
      vi: A hỏi Wie heißen Sie? và hai người chào Guten Abend, nên đây là cách nói lịch sự. Trong đoạn không có du, Hallo hay lời tạm biệt nào.
    display_answer: "Lịch sự – họ dùng Guten Abend và Sie."

  - key: de:exercise:p0u2l5-mcq-umlaut-tippen
    type: mcq
    stage: recognition
    answer_lang: vi
    difficulty: 1
    item: de:item:p0u1-g-umlaute
    prompt:
      stem: "Bàn phím của bạn không có ü, ö, ß. Bạn gõ Tschüss, fünf, zwölf, heiße thế nào để vẫn đúng?"
      stem_lang: vi
      options:
        - { id: y1u, text: "Tschuess, fuenf, zwoelf, heisse", lang: vi }
        - { id: y2u, text: "Tschuss, funf, zwolf, heise", lang: vi }
        - { id: y3u, text: "Tschuyss, fuynf, zwôlf, heibe", lang: vi }
    answer:
      correct_option_id: y1u
    explanation:
      vi: Theo quy ước của tiếng Đức, ü → ue, ö → oe, ß → ss. Bỏ dấu hai chấm (u, o) là sai chính tả, còn uy, ô là chữ tiếng Việt, không phải tiếng Đức.
    display_answer: "Tschuess, fuenf, zwoelf, heisse"

  # ---------------- recall ----------------
  - key: de:exercise:p0u2l5-fill-ziffern
    type: fill_blank
    stage: recall
    answer_lang: de
    difficulty: 2
    item: de:item:p0u2-handynummer
    prompt:
      template: "Handynummer: null eins fünf zwei = {{b1}} · sieben drei neun = {{b2}} · achtzehn = {{b3}}"
      blanks:
        - { id: b1, width_hint: 4 }
        - { id: b2, width_hint: 3 }
        - { id: b3, width_hint: 2 }
    answer:
      blanks:
        b1: ["0152"]
        b2: ["739"]
        b3: ["18"]
    known_wrong:
      - answer: "0125"
        feedback_vi: Thứ tự là null (0), eins (1), fünf (5), zwei (2) – 0152.
        error_tag: number_order
      - answer: "80"
        feedback_vi: achtzehn là 18 (acht + zehn); 80 là achtzig.
        error_tag: number_confusion
    explanation:
      vi: Ghi từng chữ số theo đúng thứ tự nghe – 0152 và 739. achtzehn = acht (8) + zehn (10) = 18.
    display_answer: "Handynummer: null eins fünf zwei = 0152 · sieben drei neun = 739 · achtzehn = 18"

