        - "Hallo, ich heiße Hoa und komme aus Vietnam."
        - "Hallo, ich bin Hoa und ich komme aus Vietnam."
        - "Hallo, ich bin Hoa und komme aus Vietnam."
        - "Guten Tag, ich heiße Hoa und ich komme aus Vietnam."
