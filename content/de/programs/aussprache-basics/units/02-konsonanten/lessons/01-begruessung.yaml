key: de:lesson:p0u2-begruessung
order_index: 1
level: pre_a1
title:
  vi: Chào hỏi – w, v, f, z (Begrüßung)
objectives:
  - vi: Chào và tạm biệt đúng thời điểm trong ngày – Guten Morgen, Guten Tag, Guten Abend, Gute Nacht.
  - vi: Chọn đúng mức thân mật hay lịch sự – Hallo/Tschüss với bạn bè, Guten Tag/Auf Wiedersehen với người lạ.
  - vi: Hỏi thăm và trả lời ngắn – Wie geht's? – Danke, gut.
  - vi: Đọc đúng chữ w (= “v”), v (thường = “ph”), f/ph (= “ph”) và z/tz (= “ts”).
estimated_minutes: 12
skills: [pronunciation, speaking, listening]
