key: de:lesson:p0u2-zahlen-bis-20
order_index: 2
level: pre_a1
title:
  vi: Số 0–20 – âm ch và -ig (Zahlen bis 20)
objectives:
  - vi: Đếm và nghe hiểu các số từ 0 đến 20.
  - vi: Đọc một số điện thoại theo từng chữ số.
  - vi: Phân biệt ch như “kh” (acht) và ch nhẹ giữa lưỡi (ich); đọc chs là “ks” (sechs).
  - vi: Đọc đuôi -ig như “ich” (zwanzig, richtig).
estimated_minutes: 12
skills: [pronunciation, listening, speaking]
prerequisites: [de:lesson:p0u2-begruessung]
