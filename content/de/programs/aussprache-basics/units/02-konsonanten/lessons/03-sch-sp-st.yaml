title:
  vi: s, sch, sp, st, ß (Schule, Sport, Straße)
objectives:
  - vi: Đọc s trước nguyên âm như “d” giọng Bắc (sehr, Sonne, Musik) và s cuối từ như “x” (Bus, eins).
  - vi: Đọc đúng sch, và sp/st ở đầu từ là “schp/scht” (Sport, Student, Straße).
  - vi: Biết khi nào viết ss (sau nguyên âm ngắn) và khi nào viết ß (sau nguyên âm dài hoặc nguyên âm đôi).
  - vi: Dùng Entschuldigung! để xin lỗi hoặc gọi người lạ.
