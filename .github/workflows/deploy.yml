# push main → CI → (Supabase migrations if changed, needs approval) → (Edge Functions if changed) → build → GitHub Pages.
#
# DATABASE SAFETY: only `supabase db push` (applies new migrations). Never reset / config push / seed hosted DB.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Run the Supabase migration step even without new migration files
        type: boolean
        default: false
      functions:
        description: Deploy all Edge Functions even if supabase/functions did not change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect migration / function changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
      functions: ${{ steps.diff.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.migrate }}
          FORCE_FUNCTIONS: ${{ inputs.functions }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Diff against the head SHA of the last SUCCESSFUL Deploy run on main (not
          # github.event.before), so a migration from a failed or superseded push is not skipped.
          BEFORE=$(gh run list --workflow deploy.yml --branch main --event push --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          changed() {
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo true
            elif git diff --quiet "$BEFORE" "$AFTER" -- "$1"; then
              echo false
            else
              echo true
            fi
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            migrations="$FORCE"; functions="$FORCE_FUNCTIONS"
          else
            migrations=$(changed supabase/migrations); functions=$(changed supabase/functions)
          fi
          # No Edge Functions in the repo yet (no supabase/functions/*/index.ts): never request the
          # second "production" approval for a job that would deploy nothing. This also overrides a
          # forced workflow_dispatch "functions = true" (there is nothing to deploy anyway).
          ls supabase/functions/*/index.ts >/dev/null 2>&1 || functions=false
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

  migrate:
    name: Supabase db push
    needs: [verify, changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production # enable "Required reviewers" so every DB change needs approval
    # Shared with content-publish.yml: never migrate while content is being imported.
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu $v (xem docs/DEPLOY.md)"; missing=1; fi
          done
          exit $missing
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview migrations to apply
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push --yes

  functions:
    name: Supabase functions deploy
    needs: [verify, changes, migrate]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.functions == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # Spec 5: push the Gemini secrets to the project from environment `production` secrets.
      # Only non-empty values are set (an unset GitHub secret never wipes the Supabase one), values
      # go through a 0600 env file (never argv / echo), and the file is removed right after.
      - name: Set Edge Function secrets (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_DAILY_USER_LIMIT: ${{ secrets.GEMINI_DAILY_USER_LIMIT }}
          GEMINI_MAX_OUTPUT_TOKENS: ${{ secrets.GEMINI_MAX_OUTPUT_TOKENS }}
          GEMINI_TIMEOUT_MS: ${{ secrets.GEMINI_TIMEOUT_MS }}
        run: |
          set +x
          if ! ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            echo "No Edge Functions yet."; exit 0
          fi
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          names=()
          for v in GEMINI_API_KEY GEMINI_MODEL GEMINI_DAILY_USER_LIMIT GEMINI_MAX_OUTPUT_TOKENS GEMINI_TIMEOUT_MS; do
            if [ -n "${!v}" ]; then
              printf '%s=%s\n' "$v" "${!v}" >> "$secrets_file"
              names+=("$v")
            fi
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "::warning::No GEMINI_* secrets in environment production; the AI tutor answers 503 until they are set (docs/DEPLOY.md)."
            exit 0
          fi
          supabase secrets set --env-file "$secrets_file" --project-ref "$SUPABASE_PROJECT_ID" >/dev/null
          echo "Updated Edge Function secrets: ${names[*]}"
      # Spec 10 §3: notify-dispatch secrets, same rules as above. VAPID_PUBLIC_KEY comes from the public
      # variable VITE_VAPID_PUBLIC_KEY so the browser and the server always use the same key pair.
      - name: Set Edge Function secrets (reminders)
        env:
          NOTIFY_CRON_SECRET: ${{ secrets.NOTIFY_CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set +x
          if [ ! -f supabase/functions/notify-dispatch/index.ts ]; then
            echo "No notify-dispatch function."; exit 0
          fi
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          names=()
          for v in NOTIFY_CRON_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -n "${!v}" ]; then
              printf '%s=%s\n' "$v" "${!v}" >> "$secrets_file"
              names+=("$v")
            fi
          done
          if [ -z "$NOTIFY_CRON_SECRET" ]; then
            echo "::warning::No NOTIFY_CRON_SECRET in environment production; notify-dispatch refuses every call until it is set (docs/DEPLOY.md)."
          fi
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "::warning::VAPID not fully configured; reminders stay in the in-app inbox without Web Push (docs/DEPLOY.md)."
          fi
          if [ ${#names[@]} -eq 0 ]; then exit 0; fi
          supabase secrets set --env-file "$secrets_file" --project-ref "$SUPABASE_PROJECT_ID" >/dev/null
          echo "Updated Edge Function secrets: ${names[*]}"
      - name: Deploy all Edge Functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "No Edge Functions yet."
          fi

  build:
    name: Build site
    needs: [verify, changes, migrate]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
      VITE_HERO_VIDEO_URL: ${{ vars.VITE_HERO_VIDEO_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chặn secret lọt vào biến VITE_*
        run: node scripts/check-public-env.mjs --strict
      - run: pnpm build
      # Google/Supabase secret keys, service_role JWTs and source maps (scripts/check-bundle-secrets.mjs).
      - name: Bundle must not contain secret keys or source maps
        run: pnpm check:bundle
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  pages:
    name: Deploy to GitHub Pages
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
