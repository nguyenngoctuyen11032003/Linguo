# Manually publishes content/ into the hosted Supabase project (spec 2 §4.4).
# Runs `pnpm content:check` then `pnpm content:push`, which posts the same bundle as supabase/seed.sql
# to the service_role-only RPC public.import_content_bundle (a wrapper around
# content_private.import_bundle) with the project-scoped service_role key. The `production`
# environment requires a reviewer's approval before the job starts. Full CI (ci.yml) must pass
# first, and the import shares the `supabase-production` concurrency group with deploy.yml's
# migration job so content never imports while migrations are being applied (or vice versa).
name: Publish content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Validate and import content
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra nội dung
        run: pnpm content:check
      - name: Nhập nội dung vào Supabase
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm content:push
