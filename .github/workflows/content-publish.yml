# Manually publishes content/ into the hosted Supabase project (spec 2 §4.4).
# Runs `pnpm content:check`, then `content-import.mjs --emit-apply-sql` writes the same statements as
# supabase/seed.sql (lessons, diagnostic bank, exam forms; git_sha = this commit) and psql runs them in ONE
# transaction over a direct database connection (supabase link → pooler URL, SUPABASE_DB_PASSWORD).
# Why not `pnpm content:push` (HTTP, service_role RPC): the gateway in front of PostgREST cuts a request at about
# 120 s, and the full bundle (4 languages, 650+ lessons) no longer imports that fast (HTTP 520, 2026-10-19).
# The import archives every row absent from the bundle, so it must stay one bundle, never chunked. The `production`
# environment requires a reviewer's approval before the job starts. Full CI (ci.yml) must pass
# first, and the import shares the `supabase-production` concurrency group with deploy.yml's
# migration job so content never imports while migrations are being applied (or vice versa).
name: Publish content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Validate and import content
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra nội dung
        run: pnpm content:check
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu $v (xem docs/DEPLOY.md)"; missing=1; fi
          done
          exit $missing
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Sinh SQL import
        run: node --import tsx scripts/content-import.mjs --emit-apply-sql "$RUNNER_TEMP/content-import.sql"
      - name: Nhập nội dung vào Supabase (psql, một transaction)
        env:
          PGSSLMODE: require
        run: |
          if [ ! -s supabase/.temp/pooler-url ]; then echo "::error::supabase link không tạo supabase/.temp/pooler-url"; exit 1; fi
          # Session mode (5432): the import is one long transaction; the file sets statement_timeout = 0 inside it.
          url="$(sed 's#:6543/#:5432/#' supabase/.temp/pooler-url)"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          psql --version
          psql "$url" -X -v ON_ERROR_STOP=1 --single-transaction -f "$RUNNER_TEMP/content-import.sql"
