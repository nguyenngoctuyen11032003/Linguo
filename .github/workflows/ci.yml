# Runs on every Pull Request and is called by deploy.yml before any deploy.
# No secrets needed: web uses public vars, e2e mocks Supabase, database runs Supabase locally in Docker.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chặn secret lọt vào biến VITE_*
        run: node scripts/check-public-env.mjs
      - name: Migration đã deploy không bị sửa
        run: node scripts/check-migrations-immutable.mjs
      - run: pnpm lint
      - name: Kiểm tra nội dung (content/)
        run: pnpm content:check
      - name: supabase/seed.sql khớp với content/
        run: pnpm content:build --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle không chứa secret hay source map
        run: pnpm check:bundle
      - name: Ngân sách kích thước bundle
        run: pnpm check:bundle-size

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's gitleaks_8.30.1_checksums.txt).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version + checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # .gitleaks.toml: default rules, only .env templates allowlisted. .gitleaksignore: reviewed fake fixtures.
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact --no-banner --exit-code 1 .

  functions:
    name: Edge Functions (Deno check, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Needs no node_modules: compares the copy with packages/shared/src/ai/contract.ts.
      - name: AI contract copy in sync (shared ↔ functions)
        working-directory: .
        run: node scripts/sync-ai-contract.mjs --check
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno check .
      - run: deno lint
      - name: deno test
        # `deno test` fails with "No test modules found" while only _shared/ exists.
        run: |
          shopt -s globstar nullglob
          tests=(**/*_test.ts **/*.test.ts)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No Deno tests yet."
            exit 0
          fi
          deno test --allow-env

  e2e:
    name: Playwright (iPhone / Android) ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Six device projects on one runner took ~30 min and the runner started getting shut down mid-run,
    # so the suite is split across three runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @linguo/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @linguo/web build:e2e
      - run: pnpm --filter @linguo/web exec playwright test --shard=${{ matrix.shard }}/3
      - name: Upload Playwright report (screenshots for review)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 14

  database:
    name: Database migrations + RLS tests (local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # Needs no database, so it fails fast before the stack starts.
      - name: Estimate fixtures in sync (SQL ↔ TS)
        run: node scripts/sync-estimate-fixtures.mjs --check
      - name: Grading fixtures in sync (SQL ↔ TS)
        run: node scripts/sync-grading-fixtures.mjs --check
      # fsrs.fixtures.json ↔ ts-fsrs is checked by `pnpm test` in the web job (needs node_modules).
      - name: FSRS fixtures in sync (SQL ↔ ts-fsrs)
        run: node scripts/sync-fsrs-fixtures.mjs --check
      - name: Diagnostic engine fixtures in sync (SQL ↔ TS)
        run: node scripts/sync-diagnostic-fixtures.mjs --check
      - name: Exam grading fixtures in sync (SQL ↔ TS)
        run: node scripts/sync-exam-grading-fixtures.mjs --check
      # Must be `supabase start` (not `db start`) so Auth/REST come up too.
      - name: Apply all migrations on a fresh local stack
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,mailpit,supavisor
      - name: Lint database schema
        run: supabase db lint --fail-on error
      - name: RLS + trigger tests (pgTAP)
        run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > packages/shared/src/database.types.ts
          # --porcelain also reports the file when it is untracked (never committed).
          if [ -n "$(git status --porcelain -- packages/shared/src/database.types.ts)" ]; then
            git --no-pager diff -- packages/shared/src/database.types.ts || true
            echo "::error::packages/shared/src/database.types.ts is stale or untracked. Run 'pnpm db:types' and commit."
            exit 1
          fi
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
