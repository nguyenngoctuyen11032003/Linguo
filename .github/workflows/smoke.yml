# Post-deploy smoke check (docs/RUNBOOK.md → "Kiểm tra sau deploy (smoke)"): after Deploy succeeds on main, and once a
# day, request the LIVE site and Supabase project and fail when something is broken even though Deploy was green
# (wrong base path, missing build-time env, service worker or manifest problems, Edge Function not deployed, RLS/RPC
# exposure). Read-only: nothing here spends AI quota, sends a notification or reads user data.
#
# No `environment:`: environment `production` has required reviewers, which would block the unattended run. Every
# value the check needs is PUBLIC (it already ships inside the web bundle), so it is read from REPOSITORY variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   required (same names as in environment production)
#   VITE_SITE_URL                                      optional (default https://<owner>.github.io/<repo>)
# A missing required variable → the run warns and exits 0 (like notify.yml). No secrets are used.
# To stop the daily run: Actions → Smoke → "…" → Disable workflow (this also stops the post-deploy run).
name: Smoke

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke check production
    # workflow_run fires for every Deploy outcome: only a successful run on main is checked.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Thiếu repository variable VITE_SUPABASE_URL hoặc VITE_SUPABASE_PUBLISHABLE_KEY — bỏ qua smoke check (xem docs/RUNBOOK.md → Kiểm tra sau deploy)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          site="${VITE_SITE_URL%/}"
          if [ -z "$site" ]; then
            # GitHub Pages project site; the host is lower-case, the repository path keeps its case.
            site="https://$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]').github.io/$REPO_NAME"
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.run == 'true'
        with:
          node-version: 22
      - name: Smoke check
        if: steps.config.outputs.run == 'true'
        env:
          SITE_URL: ${{ steps.config.outputs.site }}
        run: node scripts/smoke.mjs
