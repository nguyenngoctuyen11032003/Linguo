version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Supabase CLI version is pinned in package.json AND in every workflow
      # (supabase/setup-cli `version:`) so local, CI and deploy use the same binary.
      # Bump all of them together by hand; a lone npm bump would desync them.
      - dependency-name: supabase
  # Workflow actions are pinned to full commit SHAs (version in a trailing comment);
  # Dependabot bumps both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
